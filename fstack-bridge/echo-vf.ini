[dpdk]
lcore_mask=f
thread_mode=0
primary_slim=1
graceful_reload=1
primary_slim_idle_sleep=1000
drain_ring_size=2048
reload_heartbeat_timeout_ms=1000
reload_udp_idle_ms=10000
channel=1
allow=5cd1:00:02.0
port_list=0
numa_on=0
promiscuous=1
log_level=8
pkt_tx_delay=0
idle_loop_interval=0
mbuf_low_watermark=1024
tso=1
lro=1
tx_csum_offoad_skip=0
tx_csum_ip_skip=0
tx_csum_l4_skip=0

[port0]
lcore_list=1-3
addr=10.0.2.4
netmask=255.255.255.0
broadcast=10.0.2.255
gateway=10.0.2.1

[freebsd.boot]
hz=100
fd_reserve=1024
kern.ipc.maxsockets=262144
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100
net.inet.tcp.tcbhashsize=65536
kern.ncallout=262144

[freebsd.sysctl]
kern.ipc.somaxconn=32768
kern.ipc.maxsockbuf=2097152
net.inet.tcp.functions_default=freebsd
net.inet.tcp.cc.algorithm=cubic
net.inet.tcp.sendbuf_auto=0
net.inet.tcp.recvbuf_auto=0
net.inet.tcp.sendspace=65536
net.inet.tcp.recvspace=65536
net.inet.tcp.sendbuf_max=65536
net.inet.tcp.recvbuf_max=65536
net.inet.tcp.mssdflt=1360
net.inet.tcp.minmss=536
net.inet.tcp.sack.enable=1
net.inet.tcp.delayed_ack=0
net.inet.tcp.rfc1323=1
