<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SOW_SITE_LOCALE -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1015" />
    <title data-i18n="site.leaders">Leaders</title>
    <meta name="description" content="" data-i18n="site.leaders_summary" data-i18n-attr="content" />
    <link rel="canonical" href="https://shadowsofwar.io/leaders/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="" />
    <link rel="icon" type="image/svg+xml" href="/sow.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/sow-controls.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="guide-page leaders-directory">
    <!-- SOW_SITE_HEADER -->
    <main class="guide-main">
      <div class="container">
        <nav class="guide-breadcrumbs"><a href="/" data-i18n="site.nav_home">Home</a></nav>
        <header class="leaders-directory-heading">
          <h1 data-i18n="site.leaders">Leaders</h1>
          <p data-i18n="site.leaders_summary">
            Choose a leader that matches how you play: economy, expansion, defense, production, or border
            pressure.
          </p>
        </header>
      </div>
      <section class="leaders-directory-explorer">
        <div class="container">
          <div class="leader-directory-toolbar">
            <label class="leader-directory-search">
              <span data-i18n="heroes.search_leaders">Search leaders</span>
              <input
                type="search"
                data-leader-directory-search
                data-i18n="heroes.search_leader_civilization"
                data-i18n-attr="placeholder"
                placeholder="Search leader or civilization"
                autocomplete="off"
                aria-controls="leader-directory-grid"
              />
            </label>
            <span data-leader-directory-count aria-live="polite" aria-atomic="true"
              ><!-- LEADER_DIRECTORY_COUNT --></span
            >
          </div>
          <div class="leader-directory-grid" id="leader-directory-grid">
            <!-- LEADER_DIRECTORY_CARDS -->
          </div>
          <div class="leader-directory-empty" data-leader-directory-empty hidden>
            <p data-i18n="heroes.no_leaders">No leaders found.</p>
            <button class="hero-link" type="button" data-leader-directory-clear data-i18n="site.clear_search">
              Clear search
            </button>
          </div>
        </div>
      </section>
    </main>
    <!-- LEADER_FOOTER -->
    <script data-cfasync="false" src="/site-chrome.js"></script>
    <script src="/analytics.js"></script>
    <!-- SOW_SPRITE_ATLAS -->
    <script src="/app.js"></script>
  </body>
</html>
