  <body class="guide-page">
    <!-- SOW_SITE_HEADER -->
    <main class="guide-main">
      <div class="container">
        <nav class="guide-breadcrumbs"><a href="/" data-i18n="site.nav_home">Home</a></nav>
        <section class="guide-hero section-rule">
          <h1 data-i18n="site.leaders">Leaders</h1>
          <p class="hero-lede" data-i18n="site.leaders_summary"></p>
        </section>
        <form class="compendium-search" role="search">
          <label for="compendium-search" data-i18n="heroes.search_leaders">Search leaders</label

            aria-live="polite"
          ></output>
        </form>
        <div class="compendium-grid"><!-- LEADER_CONTENT --></div>
        <p data-compendium-empty hidden>
          <span data-i18n="heroes.no_leaders">No leaders found.</span>
          <button type="button" data-compendium-reset data-i18n="site.clear_search">Reset search</button>
        </p>
      </div>
    </main>
    <!-- LEADER_FOOTER -->
    <script data-cfasync="false" src="/site-chrome.js"></script>
    <script src="/analytics.js"></script>
