<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Signing in… | Shadows of War</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0a0e; color: #e4e4e7; padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      max-width: 26rem; width: 100%; padding: 2rem; border-radius: 1.25rem;
      background: rgba(9, 9, 11, .92); border: 1px solid rgba(255, 255, 255, .12);
      text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .8);
    }
    .spin {
      width: 2.5rem; height: 2.5rem; margin: 0 auto 1rem;
      border: 4px solid rgba(255, 255, 255, .15); border-top-color: #22d3ee;
      border-radius: 50%; animation: sp 0.8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    h1 { font-size: 1.2rem; letter-spacing: -0.01em; margin-bottom: .5rem; }
    p { font-size: .8rem; color: #a1a1aa; font-family: ui-monospace, monospace; }
    .hidden { display: none !important; }
    .err-icon {
      width: 3rem; height: 3rem; margin: 0 auto 1rem; border-radius: 50%;
      background: rgba(239, 68, 68, .15); color: #f87171;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: bold;
    }
    #cb-error-msg { color: #f87171; margin-bottom: 1rem; word-break: break-word; }
    a.btn, button.btn, button.btn-secondary {
      display: inline-block; padding: .8rem 1.6rem; border-radius: .8rem;
      font: inherit; font-weight: bold; font-size: .8rem; text-decoration: none; cursor: pointer;
    }
    a.btn, button.btn { background: #f4b21b; border: 1px solid #f4b21b; color: #09090b; }
    button.btn-secondary { background: transparent; border: 1px solid rgba(255, 255, 255, .2); color: #e4e4e7; }
    .switch-actions { display: grid; gap: .6rem; margin-top: 1rem; }
    .switch-copy { margin: .8rem 0; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="card">
    <div id="cb-loading">
      <div class="spin"></div>
      <h1>Signing you in…</h1>
      <p>Finishing secure sign-in with Shadows of War</p>
    </div>
    <div id="cb-error" class="hidden">
      <div class="err-icon">✕</div>
      <h1>Sign-in failed</h1>
      <p id="cb-error-msg"></p>
      <a class="btn" href="/">Back to Shadows of War</a>
    </div>
    <div id="cb-account-switch" class="hidden">
      <h1>Different account</h1>
      <p id="cb-account-switch-message" class="switch-copy"></p>
      <div class="switch-actions">
        <button id="cb-account-switch-confirm" class="btn" type="button">CONTINUE WITH THIS ACCOUNT</button>
        <button id="cb-account-switch-cancel" class="btn-secondary" type="button">KEEP GUEST ACCOUNT</button>
      </div>
    </div>
  </div>

  <script type="module">
    const loadingEl = document.getElementById('cb-loading');
    const errorEl = document.getElementById('cb-error');
    const errorMsgEl = document.getElementById('cb-error-msg');
    const accountSwitchEl = document.getElementById('cb-account-switch');
    const accountSwitchMessageEl = document.getElementById('cb-account-switch-message');
    let pendingAccountSwitch = null;

    function fail(msg) {
      loadingEl?.classList.add('hidden');
      accountSwitchEl?.classList.add('hidden');
      errorEl?.classList.remove('hidden');
      if (errorMsgEl) errorMsgEl.textContent = msg;
    }

    // State was written by loginWithOAuth: { returnTo, accountId, provider }.
    function decodeState(raw) {
      if (!raw) return {};
      try {
        let b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) b64 += '=';
        const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
        if (obj && typeof obj === 'object') return obj;
      } catch {}
      try {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      } catch {}
      return {};
    }

    // Open-redirect guard: same-origin paths only, never absolute URLs.
    function safeReturnTo(raw) {
      try {
        const target = new URL(raw || '/', window.location.origin);
        if (target.origin !== window.location.origin) return '/';
        return `${target.pathname}${target.search}${target.hash}` || '/';
      } catch {
        return '/';
      }
    }

    function clearOAuthTransaction() {
      try {
        sessionStorage.removeItem('wou_oauth_transaction');
        sessionStorage.removeItem('wou_oauth_provider');
      } catch (err) {}
    }

    function finishSignIn(data, returnTo) {
      const oldToken = localStorage.getItem('wou_session_token');
      const oldUser = localStorage.getItem('wou_user_data');
      try {
        localStorage.setItem('wou_session_token', data.session_token);
        localStorage.setItem('wou_user_data', JSON.stringify(data.account));
      } catch (err) {
        try {
          if (oldToken === null) localStorage.removeItem('wou_session_token');
          else localStorage.setItem('wou_session_token', oldToken);
          if (oldUser === null) localStorage.removeItem('wou_user_data');
          else localStorage.setItem('wou_user_data', oldUser);
        } catch (restoreError) {}
        throw err;
      }
      clearOAuthTransaction();
      window.dispatchEvent(new CustomEvent('wou:auth-state-change', {
        detail: { authenticated: true, isAuthenticated: true, user: data.account, token: data.session_token },
      }));
      window.location.replace(safeReturnTo(returnTo));
    }

    document.getElementById('cb-account-switch-confirm').addEventListener('click', () => {
      if (!pendingAccountSwitch) return;
      const pending = pendingAccountSwitch;
      pendingAccountSwitch = null;
      try {
        finishSignIn(pending.data, pending.returnTo);
      } catch (err) {
        pendingAccountSwitch = pending;
        fail((err && err.message) || 'Could not save the selected account.');
      }
    });

    document.getElementById('cb-account-switch-cancel').addEventListener('click', () => {
      if (!pendingAccountSwitch) return;
      const pending = pendingAccountSwitch;
      pendingAccountSwitch = null;
      clearOAuthTransaction();
      window.location.replace(safeReturnTo(pending.returnTo));
    });

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code') || '';
      const stateParam = params.get('state') || '';
      const stateObj = decodeState(stateParam);

      let provider = stateObj.provider || '';
      if (!provider) {
        try { provider = sessionStorage.getItem('wou_oauth_provider') || ''; } catch {}
      }
      if (!provider) provider = params.get('provider') || '';

      if (!code) return fail('No authorization code received from provider.');
      if (!provider) return fail('Could not determine provider. Please sign in again.');

      let transaction = null;
      try {
        transaction = JSON.parse(sessionStorage.getItem('wou_oauth_transaction') || 'null');
      } catch (_) {}
      if (!stateParam || !transaction || transaction.provider !== provider) {
        return fail('This sign-in attempt expired. Please start again.');
      }
      if (!stateObj.nonce || stateObj.nonce !== transaction.nonce) {
        return fail('This sign-in attempt could not be verified. Please start again.');
      }
      const callbackUri = `${window.location.origin}/auth/callback`;
      if (transaction.redirectUri !== callbackUri) {
        return fail('The sign-in callback does not match this game.');
      }

      try {
        const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
        const sessionToken = localStorage.getItem('wou_session_token');
        if (sessionToken) headers.Authorization = `Bearer ${sessionToken}`;
        const response = await fetch(
          `https://id.worldofunreal.com/api/v1/auth/oauth/callback/${encodeURIComponent(provider)}`,
          {
            method: 'POST',
            headers,
            body: JSON.stringify({
              code,
              redirect_uri: callbackUri,
              account_id: stateObj.accountId || null,
              state: stateParam,
              code_verifier: transaction.codeVerifier || null,
              context: 'shadows_of_war',
            }),
          }
        );
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'OAuth authentication exchange failed.');
        if (!data.session_token || !data.account) throw new Error('Identity service returned an incomplete session.');
        const signedInAccountId = String(data.account.account_id || data.account.id || '');
        if (!signedInAccountId) throw new Error('Identity service returned an account without an ID.');
        let currentAccountId = String(stateObj.accountId || '');
        if (!currentAccountId) {
          try {
            const currentUser = JSON.parse(localStorage.getItem('wou_user_data') || 'null');
            currentAccountId = String(currentUser && (currentUser.account_id || currentUser.id) || '');
          } catch {}
        }
        if (currentAccountId && signedInAccountId && currentAccountId !== signedInAccountId) {
          let currentName = 'your guest account';
          try {
            const currentUser = JSON.parse(localStorage.getItem('wou_user_data') || 'null');
            currentName = currentUser && (currentUser.display_name || currentUser.username) || currentName;
          } catch {}
          const targetName = data.account.display_name || data.account.username || 'this account';
          accountSwitchMessageEl.textContent =
            `${targetName} is a different account. Switching will not merge ${currentName}'s progress. Continue?`;
          pendingAccountSwitch = { data, returnTo: stateObj.returnTo };
          loadingEl.classList.add('hidden');
          accountSwitchEl.classList.remove('hidden');
          return;
        }
        finishSignIn(data, stateObj.returnTo);
      } catch (err) {
        fail((err && err.message) || 'Failed to exchange authorization code.');
      }
    })();
  </script>
</body>
</html>
