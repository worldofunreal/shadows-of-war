<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Signing in… | Shadows of War</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0e;
        color: #e4e4e7;
        padding: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        padding: 2rem;
        border-radius: 1.25rem;
        background: rgba(9, 9, 11, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      }
      .spin {
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto 1rem;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: sp 0.8s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.2rem;
        letter-spacing: -0.01em;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.8rem;
        color: #a1a1aa;
        font-family: ui-monospace, monospace;
      }
      .hidden {
        display: none !important;
      }
      .err-icon {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        font-weight: bold;
      }
      #cb-error-msg {
        color: #f87171;
        margin-bottom: 1rem;
        word-break: break-word;
      }
      a.btn,
      button.btn,
      button.btn-secondary {
        display: inline-block;
        padding: 0.8rem 1.6rem;
        border-radius: 0.8rem;
        font: inherit;
        font-weight: bold;
        font-size: 0.8rem;
        text-decoration: none;
        cursor: pointer;
      }
      a.btn,
      button.btn {
        background: #f4b21b;
        border: 1px solid #f4b21b;
        color: #09090b;
      }
      button.btn-secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #e4e4e7;
      }
      .switch-actions {
        display: grid;
        gap: 0.6rem;
        margin-top: 1rem;
      }
      .switch-copy {
        margin: 0.8rem 0;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="cb-loading">
        <div class="spin"></div>
        <h1>Signing you in…</h1>
        <p>Finishing secure sign-in with Shadows of War</p>
      </div>
      <div id="cb-error" class="hidden">
        <div class="err-icon">✕</div>
        <h1>Sign-in failed</h1>
        <p id="cb-error-msg"></p>
        <a class="btn" href="/">Back to Shadows of War</a>
      </div>
      <div id="cb-account-switch" class="hidden">
        <h1>Different account</h1>
        <p id="cb-account-switch-message" class="switch-copy"></p>
        <div class="switch-actions">
          <button id="cb-account-switch-confirm" class="btn" type="button">CONTINUE WITH THIS ACCOUNT</button>
          <button id="cb-account-switch-cancel" class="btn-secondary" type="button">
            KEEP GUEST ACCOUNT
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/auth-callback.js"></script>
  </body>
</html>
