[articles.en]
text = "Amina was a Hausa historical figure in the city-state of Zazzau, in what is now the north-west region of Nigeria. Official/palace tradition has her having reigned as queen (sarauniya), however other traditions say she was a princess (gimbiya)."
title = "Amina of Zazzau"
lang = "en"
url = "https://en.wikipedia.org/wiki/Amina_of_Zazzau"
intro = [
  "Amina (also Aminatu, born c. 1533; died 1610; ) was a Hausa historical figure in the city-state of Zazzau (now Zaria in Kaduna State), in what is now the north-west region of Nigeria. Official/palace tradition has her having reigned as queen (sarauniya), however other traditions say she was a princess (gimbiya). While her name isn't present on regnal lists found in the Chronicle of Abuja and two published by E. J. Arnett, local traditions say she ruled the territory she conquered. According to some sources, she reigned from 1576–1610.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Amina was born in the middle of the sixteenth century CE to King Nikatau, the 22nd ruler of Zazzau, and Queen Bakwa Turunku (r. 1536–c. 1566). (Kaduna State). According to oral legends collected by anthropologist David E. Jones, Amina was brought up in her grandfather's court and was favored by him. He carried her around court and instructed her carefully in political and military matters.",
      "At age 16, Amina was named Magajiya (heir apparent), and was given forty female slaves (kuyanga). From an early age, Amina had a number of suitors attempt to marry her. Attempts to gain her hand included \"a daily offer of ten slaves\" from Makama and \"fifty male slaves and fifty female slaves as well as fifty bags of white and blue cloth\" from the Sarkin Kano.",
      "After the death of her parents in or around 1566, Amina's brother became king of Zazzau. At this point, Amina had distinguished herself as a \"leading warrior in her brother's cavalry\" and gained notoriety for her military skills. She is still celebrated today in traditional Hausa praise songs as \"Amina daughter of Nikatau, a woman as capable as a man that was able to lead men to war.\"",
    ] },
  { "title" = "Expansion and dominance", "paragraphs" = [
      "After the death of her brother Karama in 1576, some traditions hold Amina ascended to the position of queen. Zazzau was one of the original seven Hausa States (Hausa Bakwai), the others being Daura, Kano, Gobir, Katsina, Rano, and Garun Gabas. Before Amina assumed the throne, Zazzau was one of the largest of these states. It was also the primary source of slaves that would be sold at the slave markets of Kano and Katsina by Arab merchants.",
      "Only three months after being crowned queen, Amina waged a 34-year campaign against her neighbors, to expand Zazzau territory. Expansion north was blocked by Kano and Katsina, and east by the Jos Plateau; therefore she campaigned to the southeast and southwest. Her army, consisting of 20,000 foot soldiers and 1,000 cavalry troops, was well trained and fearsome. In fact, one of her first announcements to her people was a call for them to \"resharpen their weapons.\" She conquered large tracts of land as far as Kwararafa and Nupe, including Bauchi and Yauri. Sokoto caliph Muhammad Bello claimed she reached what presumably was the confluence of the Niger and Benue rivers, and extracted tribute from Katsina and Kano, however contemporary historians dispute the latter claim. The Chronicle of Abuja says she received 40 eunuchs and 10,000 kola nuts from Nupe's ruler, introducing these to Hausaland.",
      "Legends cited by Sidney John Hogben say that she took a new lover in every town she went through, each of whom was said to meet the same unfortunate fate in the morning: \"her brief bridegroom was beheaded so that none should live to tell the tale.\" Under Amina, Zazzau controlled more territory than ever before. To mark and protect her new lands, Amina had her cities surrounded by earthen walls. These walls became commonplace across the nation until the British conquest of Zazzau in 1904, and many of them survive today, known as ganuwar Amina (Amina's walls).",
    ] },
  { "title" = "Death", "paragraphs" = [
      "The exact circumstances of Amina's death are not known. The nineteenth-century Muslim scholar Dan Tafa says that \"She died in a place called Attaagar. It was for this reason that the kingdom of Zazzau was the most extensive among the kingdoms of Hausa, since Bauchi included many regions.\" Drawing on Tafa's account, Sidney John Hogben reports that \"Amina died in Atagara, near present day Idah, for at that time Amina had pushed the frontiers of Zazzau south of the Niger-Benue confluence. But there are many contradictions surrounding her death; many authors in their books cited that she died in Vom Jos while other historians said she died in Atagara, the present day Idah.\" The Oxford Dictionary of African Biography says that according to tradition she dominated Hausaland for 34 years and died at Attaagar (likely Idah) in battle, with her body not being recovered.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "As the British historian Michael Crowder has noted, after Amina's death...ruling class Hausa women experienced a steady diminution in their influence and were systematically deprived of their authority and autonomy. The traditional titles and offices relating to authority over women and redress of their grievances have now become nominal or may have been discarded all together.Although Amina's success as a ruler did not have a trickle down effect on her female successors, Amina enjoyed a lasting reputation, bordering on legend, as a woman warrior. In his 1812 work Infaq al-Maysur, Sultan Bello of Sokoto wrote:Strange things have happened in the history of the seven Hausa States, and most strange of these is the extent of the possessions which God gave to Aminatu, daughter of the ruler of Zazzau. She waged war in the Hausa lands and took them all so that the men of Katsina and the men of Kano brought her tribute. She made war in Bauchi and against the other towns of the south and of the west, so that her possession stretched down to the shores of the sea [i.e. the Niger].Beyond her expansion of Zazzau territory, she created trade routes throughout Northern Africa. Additionally, Amina has been credited with ordering the construction of a distinctive series of ancient Hausa fortifications, known as 'Amina's walls', and with introducing kola nut cultivation in the area.",
    ] },
]

[articles.es]
text = "Amina de Zaria o Aminatu (1533-1610) conocida como la reina guerrera, o la Reina Haussa,​ fue una reina hausa del estado musulmán de Zazzau (actual Zaria), en el actual noroeste de Nigeria.​ Fue la primera mujer en convertirse en Sarauniya (reina) en una sociedad dominada por hombres. Amplió el territorio del pueblo hausa del norte de África a las fronteras más grandes de su historia."
title = "Amina de Zaria"
lang = "es"
url = "https://es.wikipedia.org/wiki/Amina_de_Zaria"
intro = [
  "Amina de Zaria o Aminatu (1533-1610) conocida como la reina guerrera, o la Reina Haussa,​ fue una reina hausa del estado musulmán de Zazzau (actual Zaria), en el actual noroeste de Nigeria.​ Fue la primera mujer en convertirse en Sarauniya (reina) en una sociedad dominada por hombres. Amplió el territorio del pueblo hausa del norte de África a las fronteras más grandes de su historia. Gran parte de lo que se sabe de la Reina Amina se basa en la información relacionada en las Crónicas de Kano. Otros detalles se extraen de las tradiciones orales de Nigeria. Como resultado, el recuerdo de la Reina Amina ha asumido proporciones legendarias en su Hausaland natal y más allá. El estado moderno de Nigeria ha inmortalizado a la reina Amina con una estatua ecuestre, lanza en mano, frente al teatro nacional en el centro de Lagos.​ Hay controversia entre los académicos sobre la fecha de su reinado, proponiéndose fechas desde mediados del siglo XV a finales del XVI.",
]
sections = [
  { "title" = "Fuentes históricas", "paragraphs" = [
      "La fuente más antigua que menciona a Amina es la obra de Muhammad Bello Ifaq al-Maysur, que data de 1836. Afirma que fue \"la primera en establecer gobierno entre ellos\", y forzó a Katsina, Kano y otras regiones a pagarle tributo.​ Bello desafortunadamente no proporcionó detalles cronológicos.",
      "Es también mencionada en la Crónica de Kano, un historia detallada de la ciudad de Kano compuesta a finales el siglo XIX a partir de material más antiguo. Según esta crónica, fue contemporánea de Muhammad Dauda, quién gobernó en 1421–38 y fue la conquistadora de Nupe y Kwarafa, recabando tributos a lo largo y ancho de Nigeria y gobernando 34 años.​ Un buen número de estudiosos acepta esta versión y data su reinado en la primera mitad del siglo XV.​​",
      "Hay también una crónica local de Zaria escrita en el siglo XIX (incluye hasta 1902) y publicada en 1910 que da una lista de los gobernantes y la duración de sus reinados.​ Amina no es mencionada en esta crónica pero la tradición oral de comienzos del siglo XX le nombraba como hija de Bakwa Turunku, cuyo reinado está fechado por la crónica en 1492–1522. Según esta base algunos historiadores datan su reinado a comienzos del siglo XVI.​",
    ] },
  { "title" = "Proezas legendarias", "paragraphs" = [
      "La tradición oral tiene una serie de historias sobre la reina. Estas la describen como una persona guerrera y amante de la lucha. De niña, su abuela Marka, mujer favorita de su abuelo Sarkin Nohir, la cogió blandiendo una daga. Marka se vio sorprendida por el hecho de que la pequeña la esgrimía como un guerrero.",
      "Siendo ya adulta, rechazó casarse por miedo a perder su autoridad. Su madre, Bakwa, muerta cuándo Amina tenía 36 años le dejó el gobierno de Zaria. Se le atribuye tomar un amante entre los subyugados después de cada batalla y hacerlos asesinar o castrar a la mañana siguiente.​",
      "Contribuyó a que Zazzau (Zaria) se convirtiera en un importante centro de comercio y ampliara sus dominios; introdujo la nuez de kola en la zona. Se le atribuye también construir los muros de tierra que protegen las ciudades hausa.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "La Estatua de la Reina Aminaa en el Teatro de Artes Nacional de Lagos honores está dedicada a ella, así como numerosas instituciones educativas.​",
      "La princesa guerrera Amina Zarinde que aparece en \"Elf Saga: Doomsday\" (2014) de Joseph Robert Lewis está en parte inspirada en la reina Amina.",
    ] },
]

[articles.fr]
text = "Amina (ou Aminatu) de Zaria (1533 - environ 1610), appelée aussi « la reine guerrière », est la fille de la reine Bakwa Turunku de la cité-état haoussa de Zazzau au XVIe siècle (aujourd'hui Zaria, une des principales villes de l'État de Kaduna au nord du Nigeria). Elle développe un talent certain pour les arts militaires et devient renommée pour sa bravoure et ses exploits."
title = "Amina de Zaria"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Amina_de_Zaria"
intro = [
  "Amina (ou Aminatu) de Zaria (1533 - environ 1610), appelée aussi « la reine guerrière », est la fille de la reine Bakwa Turunku de la cité-état haoussa de Zazzau au XVIe siècle (aujourd'hui Zaria, une des principales villes de l'État de Kaduna au nord du Nigeria). Elle développe un talent certain pour les arts militaires et devient renommée pour sa bravoure et ses exploits. Elle est célébrée dans une chanson en tant que « fille de Nikatau, une femme aussi capable qu'un homme ».",
  "L'objectif de ses conquêtes est double : étendre le territoire de Zazzau au-delà de ses frontières de l'époque et asservir les villes conquises. Le sultan Mohammed Bello de Sokoto disait : « Elle fit la guerre et soumit toutes ces régions afin que les populations de Katsina paient un impôt et rendent hommage à Amina et les hommes de Kano. Sa guerre se poursuivit jusqu'à ce que son royaume s'étende vers la mer à l'ouest et au sud. »",
  "Il existe des controverses quant à son statut véritable. Elle était une princesse (gimbiya), mais rien ne démontre qu'elle fut reine. Une théorie lui accorde un règne entre 1536 et 1573 alors qu'une autre dit qu'elle ne devint reine qu'à la mort de son frère Karama, en 1576. Enfin, certains affirment qu'elle ne fut jamais reine. Cependant, il reste que, pendant 34 ans, ses conquêtes firent de ce royaume le centre du commerce transsaharien.",
  "On attribue à Amina de Zaria l'architecture des murs de terre autour de la ville, prototype des fortifications utilisées dans tous les états de l'Hausa. Les murs prirent d'ailleurs le nom de Ganuwar Amina ou murs d'Amina.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "La naissance d'Amina remonterait aux années 1530, dans la famille royale de Zazzau (Zaria). Zazzau fait partie des premiers royaumes haoussa. Les sources orales parlent peu de la vie d'Amina avant qu'elle ne devienne reine.",
      "Le pouvoir royal au sein de Zazzau arrive par héritage à Amina (les communautés haoussa auraient eu des femmes à leur tête à maintes reprises).",
      "Elle réalise différentes conquêtes, qui se seraient notamment déroulées dans des régions du nord de l'actuel Nigéria, avec une armée qui aurait compté jusque 20 000 soldats, ce qui aurait conduit le royaume de Zazzau à être l'un des plus importants en Afrique de l'Ouest durant cette période. Ces conquêtes auraient été facilitées par une crise dans l'empire du Songhay à cette époque. Sous le règne d'Amina, le royaume de Zazzau devient riche, bénéficiant du butin des conquêtes et de l'esclavage transsaharien, et il rivalise en puissance avec des royaumes proches.",
    ] },
  { "title" = "Historique des chroniques relatant son règne", "paragraphs" = [
      "L'une des premières cartes à mentionner Amina est une carte appelée le planisphère de Domingos Teixeira, qui a été réalisée en 1573 et nomme un lieu en Afrique « Castelo Damina », le château d'Amina. L'une des premières sources textuelles à mentionner Amina est l'histoire de Muhammed Bello, Ifaq al-Maysur, composée vers 1836. Il prétend qu'elle est « la première à établir le gouvernement parmi [les Haoussa] », et qu'elle a forcé Katsina, Kano et d'autres régions à lui rendre hommage. Bello n'a fourni aucun détail chronologique à son sujet. Elle est également mentionnée dans la Chronique de Kano, une compilation écrite d'histoires orales, bien considérée et détaillée, de la ville de Kano, composée à la fin du XIXe siècle. Selon cette chronique, Amina est une contemporaine de Muhammad Dauda, qui a régné de 1421 à 1438, elle a conquis jusqu'à Nupe et Kwarafa, et a régné pendant 34 ans. Un certain nombre d'érudits acceptent cette information et datent son règne au milieu du XVe siècle.",
      "Il existe également une chronique locale de la ville de Zaria, écrite en grande partie au XIXe siècle, mais s'étendant jusqu'en 1902. Elle a été publiée en 1910 et donne une liste des dirigeants et la durée de leurs règnes. Amina n'est pas mentionnée dans cette chronique, mais la tradition orale du début du vingtième siècle prétend qu'elle est la fille de Bakwa Turunku, dont le règne est daté par la chronique de 1492 à 1522. C'est aussi l'hypothèse reprise par Léonora Miano, ou par Pamela D. Toler (en). Sur cette base, certains savants datent son règne au début du XVIe siècle. L'historien Abdullahi Smith, cependant, place son règne après 1576.",
    ] },
  { "title" = "Postérité et hommages", "paragraphs" = [
      "La reine Amina est de nos jours une figure importante de l'histoire du Nigeria et du continent africain ; elle est aussi connue dans de nombreux autres pays. Le fait que cette figure ait été gardée en mémoire et que son aura ait grandi au fil des siècles a été notamment favorisé par la réappropriation de ses réussites par des dirigeants ayant besoin de conforter leur légitimité en se déclarant héritiers de ce qu'elle avait mis en place. Cela a été le cas du sultan Bello de Sokoto, mais aussi, plus tard, de l'administrateur colonial britannique Herbert R. Palmer. Bien que toute l'histoire d'Amina ne soit pas complètement connue, elle a atteint des dimensions héroïques et presque mythiques. Les hauts faits de cette reine sont enseignés dans les écoles du Nigeria. Dans la culture populaire, certains de ses faits sont repris dans des dictons et une chanson la cite comme « fille de Nikatau, une femme aussi capable qu'un homme ». Sa figure peut être comparée à celles de Njinga pour l'Angola ou Jeanne d'Arc pour la France : elle a une dimension de puissance tutélaire pour le pays.",
      "L'histoire de la reine Amina n'étant pas complètement connue, différentes questions peuvent se poser sur des points plus précis de sa vie ou par rapport à certaines représentations artistiques ou historiques faites par la suite ; de même, cette figure importante de l'histoire est reprise par différents groupes, qui lui confèrent certaines caractéristiques dont on ne sait pas si elles ont été réelles ou imaginées.",
      "En 2018, la BBC l'inclut dans sa série African Women who Changed the World. Léonora Miano la cite également dans son ouvrage de 2021, L'autre langue des femmes.",
    ] },
  { "title" = "Annexes", "paragraphs" = [
      "(en) Unesco, General History of Africa, vol. IV : Africa from the Twelfth to Sixteenth Century, University of California Press, 1986.",
      "(en) T.A. Osae, S.N. Nwabara et A.T.O. Odunsi, A Short History of West Africa : A.D. 1000 to the Present, Hill and Wang, 1973.",
      "(en) Michael Crowder, The Story of Nigeria, London, Faber and Faber, 1962, 307 p. (BNF 32971870).",
    ] },
]

[articles.it]
text = "Amina di Zaria, chiamata anche la \"regina guerriera\" (1533 – Altagara, 1610), è stata una sovrana nigeriana, la figlia della regina Bakwa Turunku della città-stato Hausa della Zazzau del XVI secolo (oggi Zaria, una delle principali città dello stato di Kaduna nel nord della Nigeria). Ha sviluppato un vero talento per le arti militari ed è diventata nota per il suo coraggio e le sue imprese."
title = "Amina di Zaria"
lang = "it"
url = "https://it.wikipedia.org/wiki/Amina_di_Zaria"
intro = [
  "Amina di Zaria, chiamata anche la \"regina guerriera\" (1533 – Altagara, 1610), è stata una sovrana nigeriana, la figlia della regina Bakwa Turunku della città-stato Hausa della Zazzau del XVI secolo (oggi Zaria, una delle principali città dello stato di Kaduna nel nord della Nigeria). Ha sviluppato un vero talento per le arti militari ed è diventata nota per il suo coraggio e le sue imprese.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Amina nacque a metà del XVI secolo da re Nikatau - il 22º sovrano di Zazzau - e dalla regina Bakwa Turunku (1536-1550 circa). Ebbe una sorella minore di nome Zaria, motivo per il quale la moderna città di Zaria (stato di Kaduna) fu ribattezzata dagli inglesi con il suo nome, all'inizio del XX secolo. Secondo le leggende orali raccolte dall'antropologo David E. Jones, Amina fu cresciuta alla corte di suo nonno, di cui fu la favorita e dal quale ricevette istruzione nelle questioni politiche e militari.",
      "All'età di sedici anni, Amina fu chiamata Magajiya (successore) e ricevette quaranta ancelle (kuyanga). Fin da piccola, Amina ebbe molti pretendenti. Tra i tentativi di ottenere la sua mano ci fu \"un'offerta giornaliera di dieci schiavi\" da parte di Makama e \"cinquanta schiavi maschi e cinquanta schiave femmine, nonché cinquanta sacchi di stoffa bianca e blu\" dall'emiro di Kano.",
      "Dopo la morte dei suoi genitori intorno al 1566, il fratello di Amina, Karama, divenne re di Zazzau. A quel punto, Amina si era distinta già come \"principale guerriera nella cavalleria di suo fratello\" e aveva acquisito notorietà per le sue capacità militari. Ancora oggi viene celebrata nelle tradizionali canzoni elogiative di Hausa come \"Amina figlia di Nikatau, una donna capace come un uomo\".",
    ] },
  { "title" = "Regina guerriera", "paragraphs" = [
      "L'obiettivo delle sue conquiste era duplice: estendere il territorio di Zazzau oltre i suoi confini (arrivò a controllare gran parte della regione conosciuta come Hausaland e l'area chiamata Kasashen Bauchi, prima della metà del 1600) e asservire le città conquistate. Il sultano Muhammed Bello di Sokoto diceva di lei: \"Ha fatto la guerra e ha sottomesso tutte queste regioni in modo che il popolo di Katsina pagasse una tassa e rendesse omaggio ad Amina e agli uomini di Kano. La sua guerra continuò fino a quando il suo regno si estese al mare a ovest e sud\".",
      "Ci sono controversie sul suo vero status che affermano che una principessa (gimbiya), ma non una regina. Una delle teorie sostiene ci fu il suo regno tra il 1536 e il 1573, mentre un'altra afferma che non divenne regina fino alla morte di suo fratello Karama dopo 10 anni di regno, nel 1576, motivo per il quale, alcuni sostengono che non sia mai stata regina. Tuttavia, resta il fatto che per 34 anni, le sue conquiste hanno reso questo regno il centro del commercio trans-sahariano.",
      "Amina fornì il suo esercito di armature di metallo, le cotte di maglia e elmi di ferro. Ad Amina di Zaria è inoltre attribuita l'architettura delle mura di terra intorno alla città, un prototipo delle fortificazioni utilizzate in tutti gli stati di Hausa. Le mura presero anche il nome di Ganuwar Amina o mura di Amina, ed hanno una lunghezza di circa 15 chilometri attorno alla città di Zaria.",
    ] },
  { "title" = "Cultura di massa", "paragraphs" = [
      "Venne impersonata nella serie televisiva Xena. Nel 1975, in occasione della Giornata internazionale della donna, la Nigeria le ha dedicato una serie di francobolli commemorativi in diverse colorazioni del valore di 5, 18 e 30 kobo che la ritrae su un cavallo bianco. Esiste inoltre una sua statua situata davanti al teatro nazionale della Nigeria, a Lagos.",
      "Nella serie Civilization, Amina appare a partire dal sesto episodio come Grande Generale, e poi nel settimo come leader giocabile.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(EN) UNESCO, General History of Africa, Vol. IV: Africa from the Twelfth to Sixteenth Century, University of California Press, 1986.",
      "(EN) T.A. Osae, S.N. Nwabara e A.T.O. Odunsi, A Short History of West Africa: A.D. 1000 to the Present, Hill and Wang, 1973.",
      "(EN) Basil Davidson, West Africa Before the Colonial Era: A History to 1850, Addison-Wesley, 1998.",
    ] },
]

[articles.ar]
text = "الملكة امينة حفيدة الملك زازو نوهير محاربة من قبائل هوسا في بلاد «زازو»، أو زاريا. عاشت مئتي عام قبل تأسيس اتحاد المقاطعات الذي حكمته نيجيريا في خلال الانتداب البريطاني."
title = "الملكة أمينة"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A7%D9%84%D9%85%D9%84%D9%83%D8%A9_%D8%A3%D9%85%D9%8A%D9%86%D8%A9"
intro = [
  "الملكة امينة حفيدة الملك زازو نوهير محاربة من قبائل هوسا في بلاد «زازو»، أو زاريا. عاشت مئتي عام قبل تأسيس اتحاد المقاطعات الذي حكمته نيجيريا في خلال الانتداب البريطاني.",
  "وحكمت امينة بلادها طوال اربع وثلاثين سنة في الحقبة الحيوية التي شهدت الانتقال بين القرنين السادس عشر والسابع عشر، متحولة الملكة الرابعة والعشرين في سلالتها الملكية. وهي حفيدة الملك زازو نوهير. وكانت الشقيقة الكبرى بين ثلاثة اولاد. ورث والدها العرش عندما كانت في السادسة عشرة من عمرها، فانصرفت إلى تعلم الشؤون القتالية فأبدعت ونافست الرجال مهارة في امتطاء حصانها والمحاربة بالسيف.",
]
sections = [
  { "title" = "حياتها", "paragraphs" = [
      "ولدت عام 1533، وكانت الشقيقة الكبرى بين ثلاثة اولاد. ورث والدها العرش عندما كانت في السادسة عشرة من عمرها، فانصرفت إلى تعلم الشؤون القتالية فأبدعت ونافست الرجال مهارة في امتطاء حصانها والمحاربة بالسيف.",
      "وعندما توفي والدها، ورث شقيقها الأصغر الذكر العرش، كما درجت العادة. ولم يكد يحكم عشرة اعوام حتى توفي وورثته امينة مباشرة. فلم تنتظر أكثر من ثلاثة أشهر على تتويجها ملكة حتى بدأت سلسلة من العمليات العسكرية التوسعية التي تواصلت ثلاثين عاماً، وهي فترة حكمها، خصوصاً ان صعودها إلى العرش تزامن مع تمحور اقتصاد بلادها حول طرق ثلاثة حيوية في شمال افريقيا، تربط بين مناطق الصحراء واسواق الغابات الجنوبية وغرب السودان.",
    ] },
  { "title" = "حياتها الحربية", "paragraphs" = [
      "استغلت الملكة امينة بدء الضعف الذي عانى منه شعب «سونغاي» الذي يحكم الأراضي المجاورة لبلدها لتتجرأ وتهجم على المناطق القريبة التي كان سيطر عليها في القرنين الخامس عشر والسادس عشر، وذلك بهدف توسيع اراضيها وبالتالي انفتاح اسواقها التجارية.",
      "وغزت امينة كل المدن الممتدة من الشمال إلى الجنوب، محكمة سيطرتها على الطرق التي تربط غرب السودان بمصر في الشرق ومالي في الشمال. فكانت تغني بلادها بالعبيد والسبايا التي تغنمها من حملاتها الناجحة. وتميزت تلك الحقبة ايضاً بإدخال امينة مفهوم الدروع المعدنية على اسلحة جنودها، خصوصاً ان شعبها كان معروفاً بمهارته في صقل المعادن، على عكس الشعوب المحيطة التي كان يستند اقتصادها إلى الزراعة. كما اتبعت تكتيكاً فريداً واستراتيجية حربية خاصة بها قضت ببناء الأسوار العالية حول المخيمات العسكرية كي تحميها من أي هجوم مفاجئ.",
      "وبقي البعض من هذه الأسوار صامداً حتى اليوم، على رغم مرور مئات الأعوام عليه، وابرزها سور طوله 15 كيلومتراً، لا يزال موجوداً حول مدينة زاريا، وهو يعرف باسم «سور امينة»، على غرار كل الأسوار المشابهة التي تحمل اسمها. واستمرت امينة تقوم بالغزو تلو الآخر، منفذة التقليد الشعبي الذي كان يقضي ان تتزوج ليلة واحدة رجلاً من اقوى الرجال الذين تسبيهم في خلال غزواتها، على ان تخصيه في صباح اليوم التالي. فجعلت الازدهار يعم بلادها من أقصى الجنوب إلى الشمال. ولم يردعها عمرها عن الاستمرار في حملاتها العسكرية، لا بل ماتت امينة على صهوة جوادها في خلال حملة عسكرية في اطراف نيجيريا.",
    ] },
]

