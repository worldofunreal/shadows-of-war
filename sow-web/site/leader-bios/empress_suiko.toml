[articles.tr]
text = "Suiko 592 ile 628 yılları arasında Yamato sarayını yönetti. Önceki hükümdarın öldürülmesinden sonra, güçlü saray ailelerinin nüfuz için rekabet ettiği bir dönemde tahta çıktı. Sonradan kaleme alınan kronikler birçok kararı yeğeni Prens Shōtoku ile dayısı Soga no Umako’ya bağladı. Yakın tarihli çalışmalar bu yorumu sorguluyor ve Budizme verdiği desteği ve diplomasiyi Suiko’nun kendi yetkisini kullandığı alanlar olarak inceliyor. 607’de Ono no Imoko, Suiko adına gönderilen bir mektubu İmparator Yang’a götürdü. Çin kaydına geçen hitapta güneşin doğduğu ve battığı ülkelerin hükümdarları eşit düzeyde anılıyordu. Bu ifade Sui sarayını rahatsız edebilirdi ama Yamato’nun bağımsız konumunu ortaya koyuyordu. Suiko’nun hükümdarlığından sonra derlenen Nihon Shoki farklı bir anlatı sunar ve Shōtoku’nun naipliği tartışmalıdır. Asuka Alışverişi, saraylar arasında bilgi ve kurumların aktarılmasını oyuna uyarlar. Bir müttefik yeni bir şehri tamamladığında hem Suiko hem de şehri kuran müttefik 50 altın alır."
title = "İmparatoriçe Suiko"
lang = "tr"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
