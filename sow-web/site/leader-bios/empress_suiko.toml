[articles.ja]
text = "推古天皇は592年から628年までヤマト王権を治めた。先代の天皇が殺害され、有力な氏族が朝廷で影響力を争う状況のなかで即位した。後世の記録では、この時代の重要な政策が甥の聖徳太子や母方のおじの蘇我馬子に帰されることが多い。ところが、そうした記録がまとめられたのは推古の死後であり、編者の時代の政治観や宗教観が叙述に入り込んでいる。近年の研究は、仏教の保護や対外関係に目を向け、推古自身が君主として果たした役割を検討している。仏教に関わる寺院や像、経典などへの支援は、朝廷のなかで権威を形づくるとともに、ヤマトが東アジアの他の政権と関係を結ぶ手段にもなった。個々の政策に誰がどこまで関与したかには不明な点が残る。 推古の治世には、ヤマトから隋に使節が派遣された。607年、小野妹子は推古の名で出された書状を隋の煬帝のもとへ運んだ。中国側の記録には、日の出る国の君主から日の沈む国の君主への書状として、両者を同じ立場に置く表現が残っている。これは隋の朝廷を刺激しうる書き方であると同時に、ヤマトが自らの名で外交を行う意思を示すものだった。推古の没後に編纂された『日本書紀』は別の視点からこの時期を描いている。聖徳太子が摂政だったという後世の説明についても議論がある。太子の伝記が記す女性統治観にも注意が必要だと研究者は指摘する。使節の往来は書状の受け渡しだけで終わらず、異なる地域の知識や制度に接する機会を朝廷にもたらした。ゲームの「飛鳥の交流」は、このような往来が双方にもたらす利益に着想を得ている。同盟者が新しい都市を完成させると、推古と建設した同盟者はそれぞれ50ゴールドを得る。都市の完成を条件にすることで、交流をマップ上の建設と結び付けている。"
title = "推古天皇"
lang = "ja"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
shortArticle = true
intro = ["推古天皇は592年から628年までヤマト王権を治めた。先代の天皇が殺害され、有力な氏族が朝廷で影響力を争う状況のなかで即位した。後世の記録では、この時代の重要な政策が甥の聖徳太子や母方のおじの蘇我馬子に帰されることが多い。ところが、そうした記録がまとめられたのは推古の死後であり、編者の時代の政治観や宗教観が叙述に入り込んでいる。近年の研究は、仏教の保護や対外関係に目を向け、推古自身が君主として果たした役割を検討している。仏教に関わる寺院や像、経典などへの支援は、朝廷のなかで権威を形づくるとともに、ヤマトが東アジアの他の政権と関係を結ぶ手段にもなった。個々の政策に誰がどこまで関与したかには不明な点が残る。"]
