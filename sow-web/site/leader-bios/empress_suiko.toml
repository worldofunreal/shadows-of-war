[articles.ru]
text = "Суйко правила двором Ямато с 592 по 628 год. Она взошла на престол после убийства своего предшественника, когда влиятельные роды соперничали при дворе. Позднейшие хроники приписывали многие решения её племяннику, принцу Сётоку, и дяде по матери, Сога-но Умако. Современные исследования пересматривают эту картину и рассматривают дипломатию и покровительство буддизму как области, где Суйко осуществляла собственную власть. В 607 году Оно-но Имоко доставил императору Ян-ди письмо от имени Суйко. В китайской записи сохранилось обращение, ставившее на один уровень правителей страны восходящего и страны заходящего солнца. Такая формула могла вызвать недовольство двора Суй, но выражала самостоятельность Ямато. «Нихон сёки», составленная после царствования Суйко, излагает события иначе, и вопрос о регентстве Сётоку остаётся спорным. «Обмен Асуки» обращается к истории передачи знаний и институтов между дворами. Когда союзник завершает строительство нового города, Суйко и строитель получают по 50 золота."
title = "Императрица Суйко"
lang = "ru"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
