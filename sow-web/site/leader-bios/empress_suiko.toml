[articles.fil]
text = "Pinamunuan ni Suiko ang korte ng Yamato mula 592 hanggang 628. Umakyat siya sa trono matapos paslangin ang naunang pinuno, sa panahong nag-aagawan ng impluwensiya ang malalakas na angkan sa korte. Maraming pasiya ang iniugnay ng mga sumunod na salaysay sa pamangkin niyang si Prinsipe Shōtoku at sa tiyuhin niyang si Soga no Umako. Sinusuri ng mga bagong pag-aaral ang sariling kapangyarihan ni Suiko sa diplomasya at sa pagtangkilik sa Budismo. Noong 607, dinala ni Ono no Imoko kay Emperador Yang ang liham na ipinadala sa pangalan ni Suiko. Naitala sa salaysay ng Tsina ang pagbating naglagay sa magkapantay na katayuan sa pinuno ng lupain ng pagsikat ng araw at sa pinuno ng lupain ng paglubog nito. Maaaring ikayamot iyon ng korte ng Sui, ngunit ipinahayag nito ang kasarinlan ng Yamato. Nagbibigay ng ibang pananaw ang Nihon Shoki na tinipon matapos ang pamumuno ni Suiko, at pinagtatalunan pa ang pagiging rehente ni Shōtoku. Hango ang Palitan ng Asuka sa pagdaloy ng kaalaman at mga institusyon sa pagitan ng mga korte. Kapag natapos ng isang kaalyado ang bagong lungsod, tumatanggap ng tig-50 ginto si Suiko at ang kaalyadong nagtayo nito."
title = "Emperatris Suiko"
lang = "fil"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
