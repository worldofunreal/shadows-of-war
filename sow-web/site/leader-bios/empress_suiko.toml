[articles.de]
text = "Suiko regierte den Yamato-Hof von 592 bis 628. Sie kam nach der Ermordung ihres Vorgängers in einer Zeit auf den Thron, in der einflussreiche Hofclans um Macht rangen. Spätere Chroniken schrieben viele Entscheidungen ihrem Neffen, Prinz Shōtoku, und ihrem Onkel mütterlicherseits, Soga no Umako, zu. Neuere Forschung prüft diese Darstellung kritisch und untersucht Suikos eigene Rolle in der Diplomatie und bei der Förderung des Buddhismus. 607 überbrachte Ono no Imoko Kaiser Yang einen in Suikos Namen verfassten Brief. Die chinesische Überlieferung enthält eine Anrede, in der sich die Herrschenden des Landes der aufgehenden und des Landes der untergehenden Sonne auf gleicher Ebene begegneten. Das konnte am Sui-Hof Anstoß erregen, machte aber Yamatos Anspruch auf Eigenständigkeit deutlich. Das später zusammengestellte Nihon Shoki bietet eine andere Sicht, und die Rolle Shōtokus als Regent ist umstritten. Austausch von Asuka greift den Transfer von Wissen und Institutionen zwischen Höfen auf. Stellt ein Verbündeter eine neue Stadt fertig, erhalten Suiko und der Verbündete je 50 Gold."
title = "Kaiserin Suiko"
lang = "de"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
shortArticle = true
intro = ["Suiko regierte den Yamato-Hof von 592 bis 628. Sie kam nach der Ermordung ihres Vorgängers in einer Zeit auf den Thron, in der einflussreiche Hofclans um Macht rangen. Spätere Chroniken schrieben viele Entscheidungen ihrem Neffen, Prinz Shōtoku, und ihrem Onkel mütterlicherseits, Soga no Umako, zu. Neuere Forschung prüft diese Darstellung kritisch und untersucht Suikos eigene Rolle in der Diplomatie und bei der Förderung des Buddhismus."]
