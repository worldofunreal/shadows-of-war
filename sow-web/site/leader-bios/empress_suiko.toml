[articles.zh-CN]
text = "推古天皇从592年至628年统治大和朝廷。她在前任遇刺之后即位，当时朝廷中的重要氏族正在争夺政治影响力。后世叙事常把这一时期的政治举措归功于她的侄子圣德太子和舅父苏我马子。这样的叙事多写成于她去世以后，史家需要把编纂者所处时代的立场和推古在位时发生的事情区别开来。近年的研究把目光重新投向推古自身，尤其关注她在佛教赞助和外交方面的权力。佛教传入列岛以后，朝廷对寺院、造像和经典的支持也牵涉朝廷内部如何安排权力，以及大和怎样理解自己在东亚的地位。研究者把这些举措放回推古执政的背景，重新审视她在飞鸟时代政治中的作用。史料无法确定每项政策由谁最先提出，而她作为君主参与塑造朝廷的做法可以从多个方面考察。 在推古统治时期，大和朝廷派遣使节前往隋朝。607年，小野妹子出使，携带以推古名义送交隋炀帝的国书。中国史书记下了书信的称谓，把日出处与日没处的君主并列。这种表述可能冒犯隋廷，同时显示大和希望以自己的名义与另一朝廷交涉。编成于推古去世之后的《日本书纪》提供了不同角度的记述。推古、圣德太子和苏我马子的具体分工，特别是后世所称圣德太子摄政的性质，仍有讨论的空间。一些晚出的太子传记把推古描述为把政务交给太子的人，研究者指出，这种说法也反映了中世编者对女性执政的看法。将使节、国书和佛教赞助放在一起，可以看出往来所携带的内容涉及朝廷如何组织礼仪、如何接纳外来的知识，以及如何以自己的名义表达政治立场。游戏以「飞鸟交流」概括这段跨地域的知识和制度往来，并将这种交流转化为同盟双方可以看到的建设收益。盟友完成一座新城时，推古和这座城市的建造者各得到50金币。收益与盟友的新城竣工相连，这项规则来自对交流主题的演绎。"
title = "推古天皇"
lang = "zh-CN"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
