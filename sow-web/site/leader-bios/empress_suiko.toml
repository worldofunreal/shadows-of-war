[articles.pt-BR]
text = "Suiko governou a corte de Yamato de 592 a 628. Assumiu o trono após o assassinato de seu antecessor, em uma época de disputas entre os clãs da corte. Crônicas posteriores atribuíram muitas decisões a seu sobrinho, o príncipe Shōtoku, e a seu tio materno, Soga no Umako. Estudos recentes reavaliam essa leitura e tratam a diplomacia e o patrocínio do budismo como áreas em que Suiko exerceu sua própria autoridade. Em 607, Ono no Imoko levou ao imperador Yang uma carta enviada em nome de Suiko. O relato chinês registra uma fórmula que colocava em pé de igualdade o soberano da terra onde o sol nasce e o da terra onde ele se põe. A expressão podia incomodar a corte Sui, mas afirmava a autonomia de Yamato. O Nihon Shoki, compilado depois do reinado de Suiko, oferece outra perspectiva, e a regência de Shōtoku permanece em debate. Intercâmbio de Asuka se inspira na circulação de conhecimentos e instituições entre cortes. Quando um aliado termina uma nova cidade, Suiko e o construtor recebem 50 de ouro cada."
title = "Imperatriz Suiko"
lang = "pt-BR"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
