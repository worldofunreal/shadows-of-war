[articles.fr]
text = "Suiko régna sur la cour du Yamato de 592 à 628. Elle accéda au trône après l’assassinat de son prédécesseur, à une époque de rivalités entre clans de la cour. Les chroniques ultérieures attribuèrent de nombreuses décisions au prince Shōtoku, son neveu, et à Soga no Umako, son oncle maternel. Des travaux récents nuancent cette lecture et étudient le patronage du bouddhisme et la diplomatie comme des domaines où Suiko exerça sa propre autorité. En 607, Ono no Imoko remit à l’empereur Yang une lettre envoyée au nom de Suiko. Le récit chinois conserve une formule qui plaçait les deux souverains sur un pied d’égalité, celui du pays où le soleil se lève et celui du pays où il se couche. Cette formule pouvait irriter la cour des Sui, mais elle affirmait l’autonomie du Yamato. Le Nihon Shoki, compilé après le règne de Suiko, présente une autre version et la régence de Shōtoku reste débattue. La capacité Échanges d’Asuka évoque la circulation des savoirs et des institutions entre les cours. L’achèvement d’une nouvelle ville alliée rapporte 50 pièces d’or à Suiko et 50 à la personne qui l’a construite."
title = "Impératrice Suiko"
lang = "fr"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
