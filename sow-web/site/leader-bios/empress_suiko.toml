[articles.vi]
text = "Suiko trị vì triều đình Yamato từ năm 592 đến năm 628. Bà lên ngôi sau khi người tiền nhiệm bị sát hại, trong thời kỳ các dòng họ lớn cạnh tranh quyền lực tại triều đình. Sử liệu đời sau thường quy nhiều quyết định cho cháu bà là Thái tử Shōtoku và cậu bà là Soga no Umako. Các nghiên cứu gần đây xem xét lại cách kể ấy, chú ý đến vai trò trực tiếp của Suiko trong ngoại giao và việc bảo trợ Phật giáo. Năm 607, Ono no Imoko mang thư nhân danh Suiko đến Tùy Dạng Đế. Sử liệu Trung Quốc ghi lại cách xưng hô đặt người cai trị xứ mặt trời mọc ngang hàng với người cai trị xứ mặt trời lặn. Cách viết có thể khiến triều Tùy phật ý nhưng thể hiện lập trường độc lập của Yamato. Nhật Bản thư kỷ được biên soạn sau thời Suiko và kể lại sự việc từ góc nhìn khác. Vai trò nhiếp chính của Shōtoku vẫn còn được tranh luận. Giao lưu Asuka lấy cảm hứng từ sự trao đổi tri thức và thể chế giữa các triều đình. Khi đồng minh xây xong một thành phố mới, Suiko và người xây mỗi bên nhận 50 vàng."
title = "Nữ Thiên hoàng Suiko"
lang = "vi"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
shortArticle = true
intro = ["Suiko trị vì triều đình Yamato từ năm 592 đến năm 628. Bà lên ngôi sau khi người tiền nhiệm bị sát hại, trong thời kỳ các dòng họ lớn cạnh tranh quyền lực tại triều đình. Sử liệu đời sau thường quy nhiều quyết định cho cháu bà là Thái tử Shōtoku và cậu bà là Soga no Umako. Các nghiên cứu gần đây xem xét lại cách kể ấy, chú ý đến vai trò trực tiếp của Suiko trong ngoại giao và việc bảo trợ Phật giáo."]
sections = [{ title = "Sứ đoàn đến triều Tùy", paragraphs = ["Năm 607, Ono no Imoko mang thư nhân danh Suiko đến Tùy Dạng Đế. Sử liệu Trung Quốc ghi lại cách xưng hô đặt người cai trị xứ mặt trời mọc ngang hàng với người cai trị xứ mặt trời lặn. Cách viết có thể khiến triều Tùy phật ý nhưng thể hiện lập trường độc lập của Yamato. Nhật Bản thư kỷ được biên soạn sau thời Suiko và kể lại sự việc từ góc nhìn khác. Vai trò nhiếp chính của Shōtoku vẫn còn được tranh luận. Giao lưu Asuka lấy cảm hứng từ sự trao đổi tri thức và thể chế giữa các triều đình. Khi đồng minh xây xong một thành phố mới, Suiko và người xây mỗi bên nhận 50 vàng."] }]
sources = [{ title = "Asuka and Nara Periods, Metropolitan Museum of Art", url = "https://www.metmuseum.org/essays/asuka-and-nara-periods-538-794" }]

[articles.id]
text = "Suiko memerintah istana Yamato dari 592 hingga 628. Ia naik takhta setelah pendahulunya terbunuh, pada masa keluarga-keluarga berpengaruh bersaing di istana. Catatan dari masa kemudian mengaitkan banyak keputusan dengan keponakannya, Pangeran Shōtoku, dan pamannya dari pihak ibu, Soga no Umako. Kajian mutakhir meninjau kembali gambaran itu dengan mengamati wewenang yang dijalankan Suiko melalui diplomasi dan dukungan terhadap agama Buddha. Pada 607, Ono no Imoko membawa surat atas nama Suiko kepada Kaisar Yang. Catatan Tiongkok menyimpan ungkapan yang menempatkan penguasa negeri matahari terbit sejajar dengan penguasa negeri matahari terbenam. Ungkapan itu bisa membuat istana Sui tersinggung, tetapi menyatakan kemandirian Yamato. Nihon Shoki, yang disusun setelah masa pemerintahan Suiko, menyajikan sudut pandang berbeda dan perwalian Shōtoku masih diperdebatkan. Pertukaran Asuka terinspirasi oleh perpindahan pengetahuan dan lembaga antarkerajaan. Saat sekutu menyelesaikan kota baru, Suiko dan sekutu pembangunnya masing-masing menerima 50 emas."
title = "Permaisuri Suiko"
lang = "id"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
