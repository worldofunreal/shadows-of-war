[articles.en]
text = "Empress Suiko ruled the Yamato court from 592 to 628. Her accession followed the murder of her predecessor, and it placed a woman on the throne during a period of powerful court factions. Later accounts often assign the major political work to her nephew Prince Shōtoku and her maternal uncle Soga no Umako. Recent scholarship cautions that those accounts were compiled after her lifetime and argues that Suiko was an active sovereign whose role was later overshadowed by the Shōtoku tradition. The court sent missions to Sui China during Suiko’s reign. In 607, envoy Ono no Imoko carried a letter issued in Suiko’s name to Emperor Yang. The surviving Chinese account records a deliberately equal form of address: the sovereign of the land where the sun rises wrote to the sovereign of the land where it sets. This diplomatic posture could provoke the Sui court, but it presented Yamato as an independent power. Scholarship also notes that the later Nihon Shoki reshaped the story of the reign and that claims about Shōtoku’s regency remain contested. Asuka Exchange represents the movement of institutions and expertise between allied courts. Completing a new allied city grants 50 gold to Suiko and its builder. This cooperative construction reward is an interpretation of cultural and diplomatic exchange during her reign, not a documented payment policy."
title = "Empress Suiko"
lang = "en"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
shortArticle = true
intro = ["Empress Suiko ruled the Yamato court from 592 to 628. Her accession followed the murder of her predecessor, and it placed a woman on the throne during a period of powerful court factions. Later accounts often assign the major political work to her nephew Prince Shōtoku and her maternal uncle Soga no Umako. Recent scholarship cautions that those accounts were compiled after her lifetime and argues that Suiko was an active sovereign whose role was later overshadowed by the Shōtoku tradition."]
sections = [{ title = "The Sui embassy", paragraphs = ["The court sent missions to Sui China during Suiko’s reign. In 607, envoy Ono no Imoko carried a letter issued in Suiko’s name to Emperor Yang. The surviving Chinese account records a deliberately equal form of address: the sovereign of the land where the sun rises wrote to the sovereign of the land where it sets. This diplomatic posture could provoke the Sui court, but it presented Yamato as an independent power. Scholarship also notes that the later Nihon Shoki reshaped the story of the reign and that claims about Shōtoku’s regency remain contested. Asuka Exchange represents the movement of institutions and expertise between allied courts. Completing a new allied city grants 50 gold to Suiko and its builder. This cooperative construction reward is an interpretation of cultural and diplomatic exchange during her reign, not a documented payment policy."] }]
sources = [{ title = "Asuka and Nara Periods, Metropolitan Museum of Art", url = "https://www.metmuseum.org/essays/asuka-and-nara-periods-538-794" }]

[articles.es]
text = "Suiko gobernó la corte de Yamato de 592 a 628. Llegó al trono tras el asesinato de su predecesor, en una época en que los clanes de la corte disputaban el poder. Las crónicas posteriores atribuyeron gran parte de las decisiones al príncipe Shōtoku, su sobrino, y a Soga no Umako, su tío materno. Estudios recientes cuestionan esa lectura y examinan el patrocinio budista y la diplomacia como ámbitos en los que Suiko ejerció su propia autoridad. En 607, Ono no Imoko llevó al emperador Yang una carta enviada en nombre de Suiko. La crónica china conserva una fórmula que situaba a ambos soberanos en pie de igualdad, uno en la tierra donde sale el sol y otro en la tierra donde se pone. La fórmula podía irritar a la corte Sui, pero daba voz propia a Yamato. El Nihon Shoki, compilado después de su reinado, ofrece otra perspectiva y la regencia de Shōtoku sigue en discusión. Intercambio de Asuka toma como inspiración la circulación de conocimientos e instituciones entre cortes. Cuando un aliado termina una ciudad nueva, el constructor y Suiko reciben 50 de oro cada uno."
title = "Emperatriz Suiko"
lang = "es"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
shortArticle = true
