[articles.ar]
text = "حكمت سويكو بلاط ياماتو من عام 592 إلى عام 628. اعتلت العرش بعد مقتل سلفها في زمن تنافست فيه العشائر القوية على النفوذ في البلاط. وتنسب روايات متأخرة كثيراً من القرارات إلى الأمير شوتوكو، ابن أخيها، وإلى خالها سوغا نو أوماكو. وتعيد دراسات حديثة النظر في هذه القراءة، إذ تتناول رعايتها للبوذية وعلاقاتها الدبلوماسية بوصفها مجالين مارست فيهما سلطتها بصفتها حاكمة. في عام 607 حمل أونو نو إيموكو إلى الإمبراطور يانغ رسالة صادرة باسم سويكو. وحفظت الرواية الصينية صيغة تضع حاكم بلاد شروق الشمس وحاكم بلاد غروبها على قدم المساواة. وكان من شأنها إثارة امتعاض بلاط سوي، لكنها عبرت عن استقلال ياماتو في مخاطبته. وتقدم سجلات نيهون شوكي، التي جُمعت بعد حكم سويكو، رواية أخرى، ولا يزال مدى وصاية شوتوكو موضع نقاش. وتستلهم قدرة «تبادل أسوكا» انتقال المعارف والمؤسسات بين البلاطات. وعندما يكمل حليف بناء مدينة جديدة، يحصل كل من سويكو والحليف الذي بناها على 50 قطعة ذهبية."
title = "الإمبراطورة سويكو"
lang = "ar"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
