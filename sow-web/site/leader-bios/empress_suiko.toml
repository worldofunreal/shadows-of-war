[articles.ko]
text = "스이코 천황은 592년부터 628년까지 야마토 조정을 다스렸다. 전임 군주가 살해된 뒤, 유력 씨족들이 조정의 주도권을 놓고 경쟁하던 시기에 즉위했다. 후대 기록은 이 시기의 여러 결정을 조카인 쇼토쿠 태자와 외삼촌 소가노 우마코의 업적으로 돌렸다. 이 기록들은 스이코가 세상을 떠난 뒤에 편찬되었으므로, 편찬 당시의 정치적 관점과 스이코 시대에 실제로 일어난 일을 구분해 읽어야 한다. 최근 연구에서는 불교 후원과 외교를 중심으로 스이코 자신이 군주로서 어떤 권한을 행사했는지 다시 살펴본다. 불교 사원과 경전, 불상을 후원하는 일은 조정 안에서 권위를 형성하는 데 관여했고, 다른 지역과의 관계 속에서 야마토의 위상을 정하는 일과도 연결됐다. 스이코가 재위하던 때 야마토 조정은 수나라에 사절을 보냈다. 607년 오노노 이모코는 스이코의 이름으로 보낸 국서를 수 양제에게 전했다. 중국 측 기록에는 해가 뜨는 나라의 군주와 해가 지는 나라의 군주를 나란히 놓는 표현이 전한다. 수나라 조정이 불쾌하게 받아들일 수 있는 표현이었지만, 야마토가 독자적인 주체로서 외교에 나선다는 태도를 드러냈다. 스이코의 사후에 편찬된 『일본서기』는 같은 시기를 다른 관점에서 묘사한다. 쇼토쿠 태자가 어떤 권한을 가진 섭정이었는지에 대해서도 논의가 이어진다. 사절의 왕래는 조정이 다른 지역의 관습과 지식, 제도를 접하는 통로였다. 게임의 ‘아스카의 교류’는 이러한 왕래에서 착안해 동맹의 건설에 보상을 연결한다. 동맹이 새 도시를 완공하면 스이코와 도시를 세운 동맹이 각각 50골드를 받는다. 도시의 완공이 발동 조건이므로, 플레이 중에 두 사람이 혜택을 받는 시점을 확인할 수 있다."
title = "스이코 천황"
lang = "ko"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
shortArticle = true
