[articles.it]
text = "Suiko governò la corte di Yamato dal 592 al 628. Salì al trono dopo l’assassinio del suo predecessore, in un periodo di rivalità fra i clan di corte. Le cronache successive attribuirono molte decisioni a suo nipote, il principe Shōtoku, e a suo zio materno, Soga no Umako. Studi recenti rivedono questa lettura e considerano il patrocinio del buddhismo e la diplomazia come ambiti in cui Suiko esercitò la propria autorità. Nel 607 Ono no Imoko portò all’imperatore Yang una lettera inviata a nome di Suiko. Il racconto cinese conserva una formula che poneva sullo stesso piano il sovrano del paese dove sorge il sole e quello del paese dove tramonta. La formula poteva irritare la corte Sui, ma affermava l’autonomia di Yamato. Il Nihon Shoki, compilato dopo il suo regno, offre un’altra prospettiva e la reggenza di Shōtoku resta discussa. Scambi di Asuka riprende la circolazione di conoscenze e istituzioni fra le corti. Quando un alleato completa una nuova città, Suiko e chi l’ha costruita ricevono 50 oro ciascuno."
title = "Imperatrice Suiko"
lang = "it"
url = "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/146084/gchanart_1.pdf?sequence=1"
