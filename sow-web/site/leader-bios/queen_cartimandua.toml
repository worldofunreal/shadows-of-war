[articles.en]
text = "Cartimandua ruled the Brigantes in what is now northern England during the first century CE. The Roman historian Tacitus is the chief surviving narrative source for her reign. In 51 CE Caratacus, a leader of resistance to Rome, sought refuge with her after a defeat. Cartimandua had him taken prisoner and handed him over to the Romans. Tacitus also describes her struggle with Venutius and the Roman troops that helped rescue her in 69 CE, after which Venutius held the throne. Her decisions included both delivering a prisoner and calling for military support."
title = "Cartimandua"
lang = "en"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua ruled the Brigantes in what is now northern England during the first century CE. The Roman historian Tacitus is the chief surviving narrative source for her reign. In 51 CE Caratacus, a leader of resistance to Rome, sought refuge with her after a defeat. Cartimandua had him taken prisoner and handed him over to the Romans. Tacitus also describes her struggle with Venutius and the Roman troops that helped rescue her in 69 CE, after which Venutius held the throne. Her decisions included both delivering a prisoner and calling for military support."]
sections = [{ title = "Refuge, captivity and Roman support", paragraphs = ["Roman accounts present these events from Rome's perspective. The intervention and handover point to a working relationship, while the existence and terms of a formal treaty are uncertain. Handover of Caratacus adapts the passage of a fugitive into an ally's custody. When an enemy land army retreats from Cartimandua's territory, up to 25% of the soldiers remaining after ordinary retreat losses go to the ally with the largest active land army against that enemy and room in reserve. The transfer respects the recipient's troop cap. Survivors who cannot be transferred return with the retreating army."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.es]
text = "Cartimandua gobernó a los brigantes en lo que hoy es el norte de Inglaterra durante el siglo I d. C. El historiador romano Tácito es la principal fuente narrativa conservada sobre su reinado. En el año 51, Carataco, un jefe de la resistencia a Roma, buscó refugio con ella tras una derrota. Cartimandua lo hizo prisionero y lo entregó a los romanos. Tácito también relata su conflicto con Venucio y cómo tropas romanas ayudaron a rescatarla en el año 69, cuando Venucio se quedó con el trono."
title = "Cartimandua"
lang = "es"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua gobernó a los brigantes en lo que hoy es el norte de Inglaterra durante el siglo I d. C. El historiador romano Tácito es la principal fuente narrativa conservada sobre su reinado. En el año 51, Carataco, un jefe de la resistencia a Roma, buscó refugio con ella tras una derrota. Cartimandua lo hizo prisionero y lo entregó a los romanos. Tácito también relata su conflicto con Venucio y cómo tropas romanas ayudaron a rescatarla en el año 69, cuando Venucio se quedó con el trono."]
sections = [{ title = "Refugio, captura y apoyo romano", paragraphs = ["Los relatos presentan los hechos desde Roma. La entrega y el auxilio indican que existía una relación política, aunque se desconocen los términos de un posible tratado. Entrega de Carataco adapta el traslado de un fugitivo a manos de un aliado. Si un ejército terrestre enemigo se retira de las tierras de Cartimandua, hasta el 25% de quienes sobrevivan a las bajas normales de retirada pasa al aliado con el mayor ejército terrestre activo contra ese enemigo y espacio en su reserva. El límite de tropas del aliado determina cuántas recibe. Los supervivientes que no puedan transferirse vuelven con el ejército que se retira."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.fr]
text = "Cartimandua gouverna les Brigantes dans le nord de l’actuelle Angleterre au Ier siècle apr. J.-C. L’historien romain Tacite est la principale source narrative conservée sur son règne. En 51, Caratacos, un chef de la résistance à Rome, chercha refuge auprès d’elle après une défaite. Elle le fit prisonnier et le livra aux Romains. Tacite relate aussi son conflit avec Venutios et l’intervention de troupes romaines qui la secoururent en 69, après quoi Venutios conserva le trône."
title = "Cartimandua"
lang = "fr"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua gouverna les Brigantes dans le nord de l’actuelle Angleterre au Ier siècle apr. J.-C. L’historien romain Tacite est la principale source narrative conservée sur son règne. En 51, Caratacos, un chef de la résistance à Rome, chercha refuge auprès d’elle après une défaite. Elle le fit prisonnier et le livra aux Romains. Tacite relate aussi son conflit avec Venutios et l’intervention de troupes romaines qui la secoururent en 69, après quoi Venutios conserva le trône."]
sections = [{ title = "Asile, captivité et soutien romain", paragraphs = ["Les récits éclairent les événements du point de vue romain. La remise du captif et le secours indiquent une relation politique, dont les éventuels termes formels restent incertains. Livraison de Caratacos adapte le passage d’un fugitif sous la garde d’un allié. Lorsqu’une armée terrestre ennemie se replie de ses terres, Cartimandua transfère jusqu’à 25% des survivants après les pertes ordinaires à l’allié qui a la plus grande armée terrestre active contre cet ennemi et de la place en réserve. Les survivants excédentaires rejoignent l’armée en retraite."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.de]
text = "Cartimandua regierte im ersten Jahrhundert n. Chr. die Briganten im heutigen Nordengland. Der römische Historiker Tacitus ist die wichtigste erhaltene erzählende Quelle zu ihrer Herrschaft. Im Jahr 51 suchte Caratacus, ein Anführer des Widerstands gegen Rom, nach einer Niederlage Zuflucht bei ihr. Cartimandua nahm ihn gefangen und lieferte ihn an die Römer aus. Tacitus beschreibt auch ihren Konflikt mit Venutius und die Hilfe römischer Truppen, die sie 69 retteten. Danach behielt Venutius den Thron."
title = "Cartimandua"
lang = "de"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua regierte im ersten Jahrhundert n. Chr. die Briganten im heutigen Nordengland. Der römische Historiker Tacitus ist die wichtigste erhaltene erzählende Quelle zu ihrer Herrschaft. Im Jahr 51 suchte Caratacus, ein Anführer des Widerstands gegen Rom, nach einer Niederlage Zuflucht bei ihr. Cartimandua nahm ihn gefangen und lieferte ihn an die Römer aus. Tacitus beschreibt auch ihren Konflikt mit Venutius und die Hilfe römischer Truppen, die sie 69 retteten. Danach behielt Venutius den Thron."]
sections = [{ title = "Zuflucht, Gefangenschaft und römische Hilfe", paragraphs = ["Die Berichte zeigen die Ereignisse aus römischer Sicht. Auslieferung und Hilfe deuten auf eine politische Beziehung hin, deren mögliche formale Bedingungen unbekannt sind. Auslieferung des Caratacus überträgt die Übergabe eines Flüchtigen an einen Verbündeten ins Spiel. Zieht sich ein feindliches Landheer aus Cartimanduas Gebiet zurück, erhält der Verbündete mit dem größten aktiven Landheer gegen diesen Feind und Platz in der Reserve bis zu 25 Prozent der nach den üblichen Rückzugsverlusten Überlebenden. Der Überschuss kehrt zum abziehenden Heer zurück."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.it]
text = "Cartimandua governò i Briganti nell’attuale Inghilterra settentrionale nel I secolo d.C. Lo storico romano Tacito è la principale fonte narrativa conservata sul suo regno. Nel 51, Carataco, un capo della resistenza a Roma, cercò rifugio presso di lei dopo una sconfitta. Cartimandua lo fece prigioniero e lo consegnò ai Romani. Tacito descrive anche il suo conflitto con Venuzio e l’intervento delle truppe romane che la salvarono nel 69, dopo il quale Venuzio tenne il trono."
title = "Cartimandua"
lang = "it"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua governò i Briganti nell’attuale Inghilterra settentrionale nel I secolo d.C. Lo storico romano Tacito è la principale fonte narrativa conservata sul suo regno. Nel 51, Carataco, un capo della resistenza a Roma, cercò rifugio presso di lei dopo una sconfitta. Cartimandua lo fece prigioniero e lo consegnò ai Romani. Tacito descrive anche il suo conflitto con Venuzio e l’intervento delle truppe romane che la salvarono nel 69, dopo il quale Venuzio tenne il trono."]
sections = [{ title = "Rifugio, cattura e sostegno romano", paragraphs = ["I racconti mostrano gli eventi dalla prospettiva romana. La consegna e il soccorso indicano un rapporto politico, mentre restano incerti i termini di un eventuale trattato. Consegna di Carataco adatta il passaggio di un fuggitivo a un alleato. Quando un esercito terrestre nemico si ritira dalle terre di Cartimandua, fino al 25% dei superstiti dopo le perdite ordinarie va all’alleato con il più grande esercito terrestre attivo contro quel nemico e spazio in riserva. L’eccedenza torna all’esercito in ritirata."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.tr]
text = "Cartimandua, MS birinci yüzyılda bugünkü kuzey İngiltere’de Brigantları yönetti. Roma tarihçisi Tacitus, hükümdarlığına ilişkin başlıca anlatı kaynağıdır. Roma’ya karşı direnişin önderlerinden Caratacus, MS 51’de yenilgiye uğradıktan sonra Cartimandua’ya sığındı. Cartimandua onu tutuklatıp Romalılara teslim etti. Tacitus, Venutius’la çatışmasını ve 69’da onu kurtaran Roma birliklerini de anlatır. Bundan sonra taht Venutius’ta kaldı."
title = "Cartimandua"
lang = "tr"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua, MS birinci yüzyılda bugünkü kuzey İngiltere’de Brigantları yönetti. Roma tarihçisi Tacitus, hükümdarlığına ilişkin başlıca anlatı kaynağıdır. Roma’ya karşı direnişin önderlerinden Caratacus, MS 51’de yenilgiye uğradıktan sonra Cartimandua’ya sığındı. Cartimandua onu tutuklatıp Romalılara teslim etti. Tacitus, Venutius’la çatışmasını ve 69’da onu kurtaran Roma birliklerini de anlatır. Bundan sonra taht Venutius’ta kaldı."]
sections = [{ title = "Sığınma, esaret ve Roma desteği", paragraphs = ["Kaynaklar olayları Roma’nın bakış açısından anlatır. Teslim ve askerî yardım, siyasi bir ilişkiye işaret eder ama olası bir antlaşmanın koşulları belirsizdir. Caratacus’un Teslimi, bir kaçağın bir müttefike teslim edilmesini oyuna taşır. Düşman kara ordusu Cartimandua’nın toprağından çekildiğinde, olağan kayıplardan sonra kalanların yüzde 25’ine kadarı, o düşmana karşı en büyük etkin kara ordusuna ve yedekte boş yere sahip müttefike katılır. Sığmayan askerler çekilen orduya döner."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.zh-CN]
text = "卡尔蒂曼杜娅在公元一世纪统治布里甘特人，他们的领地位于今天的英格兰北部。罗马史家塔西佗留下了关于她统治的主要叙事。公元51年，抵抗罗马的领袖卡拉塔库斯战败后到她那里寻求庇护。卡尔蒂曼杜娅将他扣押，随后交给罗马人。塔西佗在《编年史》中记载了卡拉塔库斯被带到罗马的经过。他与家属被公开示众，随后得到皇帝赦免。塔西佗以此描写皇帝如何把敌方首领的落败转化为展示宽赦的机会。这使原本发生在不列颠的争斗进入罗马皇帝克劳狄的政治叙事，也让罗马作者特别重视这次交人。史料还记载卡尔蒂曼杜娅与韦努提乌斯发生争斗。公元69年，韦努提乌斯借罗马国内动荡发动进攻。卡尔蒂曼杜娅请求罗马提供保护，罗马步兵和骑兵救出了她，韦努提乌斯则取得王位。这些事件显示她在如何处理敌手和寻求外援方面作过决定。"
title = "卡尔蒂曼杜娅"
lang = "zh-CN"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["卡尔蒂曼杜娅在公元一世纪统治布里甘特人，他们的领地位于今天的英格兰北部。罗马史家塔西佗留下了关于她统治的主要叙事。公元51年，抵抗罗马的领袖卡拉塔库斯战败后到她那里寻求庇护。卡尔蒂曼杜娅将他扣押，随后交给罗马人。塔西佗在《编年史》中记载了卡拉塔库斯被带到罗马的经过。他与家属被公开示众，随后得到皇帝赦免。塔西佗以此描写皇帝如何把敌方首领的落败转化为展示宽赦的机会。这使原本发生在不列颠的争斗进入罗马皇帝克劳狄的政治叙事，也让罗马作者特别重视这次交人。史料还记载卡尔蒂曼杜娅与韦努提乌斯发生争斗。公元69年，韦努提乌斯借罗马国内动荡发动进攻。卡尔蒂曼杜娅请求罗马提供保护，罗马步兵和骑兵救出了她，韦努提乌斯则取得王位。这些事件显示她在如何处理敌手和寻求外援方面作过决定。"]
sections = [{ title = "寻求庇护、被俘与罗马支援", paragraphs = ["关于她的叙述主要来自罗马人，因此不同势力当时如何理解合作，并没有同样丰富的材料。交出卡拉塔库斯以及后来得到罗马的武力援助，为双方存在合作关系提供了依据。现存资料并未明确写下正式条约的内容，历史研究因而会区分实际发生的合作与可以确定的法律安排。游戏中的「交出卡拉塔库斯」取材于把一名逃亡者交给合作方的故事。敌方陆军从卡尔蒂曼杜娅的领土撤退时，系统先计算通常的撤退损失，再从幸存者中划出最多四分之一。只有盟友正在陆上进攻同一个敌人，并且预备兵还有空位，才可能接收这些部队。如果有多名符合条件的盟友，出兵最多的一方接收。分到的兵力计入盟友的预备兵，实际转移人数受盟友的兵力上限约束。无法转移的幸存者仍随原军返回。发生交接时，退兵所在的前线会在地图上闪光，交接双方也会收到提示。游戏把交出一名俘虏演绎成军队之间的兵力转移，比例和触发条件由游戏规则决定。"] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.ja]
text = "カルティマンドゥアは紀元一世紀、現在のイングランド北部でブリガンテス族を治めた。統治について現存する主な叙述は、ローマの歴史家タキトゥスが残したものである。51年、ローマに抵抗した指導者カラタクスは敗北後、彼女に保護を求めた。カルティマンドゥアは彼を拘束し、ローマ側へ引き渡した。タキトゥスは、捕虜がローマへ連れて行かれ、皇帝クラウディウスの前に出されたことも記している。タキトゥスによれば、皇帝はカラタクスとその家族を赦免した。この出来事はブリタンニアの戦いとローマの宮廷を結び付けた。一方、カルティマンドゥア自身はウェヌティウスと争った。69年、ローマ国内が動揺するなかでウェヌティウスが攻め、カルティマンドゥアはローマに助けを求めた。ローマ軍は彼女を救出したが、王位はウェヌティウスの手に渡った。"
title = "カルティマンドゥア"
lang = "ja"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["カルティマンドゥアは紀元一世紀、現在のイングランド北部でブリガンテス族を治めた。統治について現存する主な叙述は、ローマの歴史家タキトゥスが残したものである。51年、ローマに抵抗した指導者カラタクスは敗北後、彼女に保護を求めた。カルティマンドゥアは彼を拘束し、ローマ側へ引き渡した。タキトゥスは、捕虜がローマへ連れて行かれ、皇帝クラウディウスの前に出されたことも記している。タキトゥスによれば、皇帝はカラタクスとその家族を赦免した。この出来事はブリタンニアの戦いとローマの宮廷を結び付けた。一方、カルティマンドゥア自身はウェヌティウスと争った。69年、ローマ国内が動揺するなかでウェヌティウスが攻め、カルティマンドゥアはローマに助けを求めた。ローマ軍は彼女を救出したが、王位はウェヌティウスの手に渡った。"]
sections = [{ title = "逃亡者の拘束とローマの援助", paragraphs = ["記録にはローマ側の視点が反映されている。カラタクスの引き渡しやローマ軍の援助は、両者が協力したことを示す。正式な条約があったか、その条件が何だったかは確定していない。ゲームの「カラタクスの引き渡し」は、逃亡者を協力相手に渡したという出来事に着想を得ている。敵の陸軍がカルティマンドゥアの領土から撤退したとき、まず通常の撤退損失が計算される。その後の生存兵の最大四分の一を、同じ敵に対して最も大きな陸軍を送り出し、予備兵に空きがある同盟者へ渡す。複数の同盟者がいても、受け取るのは条件を満たす一人である。兵数上限のため受け取れない分は撤退する敵に戻る。引き渡しが起きると前線に表示が出て、関係するプレイヤーにも通知が届く。史料が伝える一人の捕虜の引き渡しを、ゲームでは部隊の一部が移る形に置き換えている。"] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.ko]
text = "카르티만두아는 기원후 1세기에 오늘날 잉글랜드 북부에 살던 브리간테스족을 다스렸다. 그녀의 통치를 다룬 주요 기록은 로마 역사학자 타키투스가 남겼다. 51년 로마에 저항하던 지도자 카라타쿠스는 패전 뒤 카르티만두아에게 피신했다. 카르티만두아는 그를 붙잡아 로마 측에 넘겼다. 타키투스는 포로가 로마로 끌려가 클라우디우스 황제 앞에 선 일도 기록했다. 그는 카르티만두아와 베누티우스의 갈등도 전한다. 69년 로마가 내부 혼란을 겪는 동안 베누티우스가 공격했고, 카르티만두아는 로마의 지원을 요청했다. 로마군은 그녀를 구했지만 왕위는 베누티우스에게 돌아갔다."
title = "카르티만두아"
lang = "ko"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["카르티만두아는 기원후 1세기에 오늘날 잉글랜드 북부에 살던 브리간테스족을 다스렸다. 그녀의 통치를 다룬 주요 기록은 로마 역사학자 타키투스가 남겼다. 51년 로마에 저항하던 지도자 카라타쿠스는 패전 뒤 카르티만두아에게 피신했다. 카르티만두아는 그를 붙잡아 로마 측에 넘겼다. 타키투스는 포로가 로마로 끌려가 클라우디우스 황제 앞에 선 일도 기록했다. 그는 카르티만두아와 베누티우스의 갈등도 전한다. 69년 로마가 내부 혼란을 겪는 동안 베누티우스가 공격했고, 카르티만두아는 로마의 지원을 요청했다. 로마군은 그녀를 구했지만 왕위는 베누티우스에게 돌아갔다."]
sections = [{ title = "피신, 포로, 로마의 지원", paragraphs = ["이 기록은 로마의 관점에서 사건을 다룬다. 포로를 넘긴 일과 로마가 군사를 보낸 일은 두 세력 사이에 협력이 있었음을 보여 준다. 정식 조약의 존재나 조건은 남은 기록만으로 확정하기 어렵다. 게임의 ‘카라타쿠스 인도’는 피신한 사람을 협력 세력에 넘긴 일에서 착안했다. 적 육군이 카르티만두아의 영토에서 철수하면 먼저 일반 철수 손실을 계산한다. 그런 다음 살아남은 병력 중 최대 4분의 1을 같은 적을 향해 가장 큰 육군을 보냈으며 예비 병력에 여유가 있는 동맹에게 넘긴다. 동맹의 병력 상한을 넘는 병력은 원래 철수하던 적에게 돌아간다. 인도가 일어나면 지도에 전선이 표시되고 관계된 플레이어에게 알림이 나타난다. 포로 한 사람에 관한 역사 기록을 게임에서는 군대 일부가 이동하는 규칙으로 표현했다."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.ar]
text = "حكمت كارتيماندوا البريغانت في شمال إنجلترا الحالية في القرن الأول الميلادي. والمؤرخ الروماني تاسيتوس هو أهم مصدر سردي باقٍ عن حكمها. في عام 51 لجأ إليها كاراتاكوس، أحد قادة المقاومة لروما، بعد هزيمته. فأسرته وسلمته للرومان. ويروي تاسيتوس كذلك صراعها مع فينوتيوس وكيف ساعدت القوات الرومانية في إنقاذها عام 69، حين آل العرش إلى فينوتيوس."
title = "كارتيماندوا"
lang = "ar"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["حكمت كارتيماندوا البريغانت في شمال إنجلترا الحالية في القرن الأول الميلادي. والمؤرخ الروماني تاسيتوس هو أهم مصدر سردي باقٍ عن حكمها. في عام 51 لجأ إليها كاراتاكوس، أحد قادة المقاومة لروما، بعد هزيمته. فأسرته وسلمته للرومان. ويروي تاسيتوس كذلك صراعها مع فينوتيوس وكيف ساعدت القوات الرومانية في إنقاذها عام 69، حين آل العرش إلى فينوتيوس."]
sections = [{ title = "اللجوء والأسر والدعم الروماني", paragraphs = ["تعرض الروايات الأحداث من منظور روماني. ويشير تسليم الأسير والتدخل العسكري إلى علاقة سياسية، فيما تظل شروط أي معاهدة رسمية محتملة غير مؤكدة. وتستلهم قدرة «تسليم كاراتاكوس» نقل فار إلى عهدة حليف. عند انسحاب جيش بري معادٍ من أرض كارتيماندوا، ينتقل ما يصل إلى 25% من الناجين بعد الخسائر المعتادة إلى الحليف صاحب أكبر جيش بري نشط ضد العدو نفسه والذي لديه سعة في الاحتياط. ويعود الناجون الزائدون إلى الجيش المنسحب."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.ru]
text = "Картимандуя правила бригантами на севере современной Англии в I веке н. э. Главный сохранившийся рассказ о её правлении принадлежит римскому историку Тациту. В 51 году Каратак, один из вождей сопротивления Риму, после поражения искал у неё убежища. Картимандуя взяла его в плен и выдала римлянам. Тацит описывает также её борьбу с Венуцием и помощь римских войск, которые спасли её в 69 году, когда престол остался за Венуцием."
title = "Картимандуя"
lang = "ru"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Картимандуя правила бригантами на севере современной Англии в I веке н. э. Главный сохранившийся рассказ о её правлении принадлежит римскому историку Тациту. В 51 году Каратак, один из вождей сопротивления Риму, после поражения искал у неё убежища. Картимандуя взяла его в плен и выдала римлянам. Тацит описывает также её борьбу с Венуцием и помощь римских войск, которые спасли её в 69 году, когда престол остался за Венуцием."]
sections = [{ title = "Убежище, плен и помощь Рима", paragraphs = ["Повествования отражают римскую точку зрения. Выдача пленника и военная помощь свидетельствуют о политической связи, но условия возможного официального договора неизвестны. «Выдача Каратака» переносит в игру передачу беглеца союзнику. Когда вражеская сухопутная армия отступает с земель Картимандуи, до 25% переживших обычные потери солдат получает союзник с крупнейшей активной сухопутной армией против этого врага и местом в резерве. Излишек возвращается отступающей армии."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.vi]
text = "Cartimandua cai trị người Brigantes ở miền bắc nước Anh ngày nay vào thế kỷ I CN. Sử gia La Mã Tacitus để lại nguồn kể chính còn tồn tại về thời bà cầm quyền. Năm 51, Caratacus, một thủ lĩnh chống La Mã, tìm đến bà xin nương náu sau khi thất trận. Cartimandua bắt ông và giao cho người La Mã. Tacitus cũng kể về xung đột giữa bà và Venutius, cùng việc quân La Mã cứu bà năm 69, sau đó Venutius giữ ngôi."
title = "Cartimandua"
lang = "vi"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua cai trị người Brigantes ở miền bắc nước Anh ngày nay vào thế kỷ I CN. Sử gia La Mã Tacitus để lại nguồn kể chính còn tồn tại về thời bà cầm quyền. Năm 51, Caratacus, một thủ lĩnh chống La Mã, tìm đến bà xin nương náu sau khi thất trận. Cartimandua bắt ông và giao cho người La Mã. Tacitus cũng kể về xung đột giữa bà và Venutius, cùng việc quân La Mã cứu bà năm 69, sau đó Venutius giữ ngôi."]
sections = [{ title = "Nương náu, bị bắt và viện trợ La Mã", paragraphs = ["Các ghi chép kể sự kiện từ góc nhìn La Mã. Việc giao tù binh và cứu viện cho thấy quan hệ chính trị, còn điều khoản của một hiệp ước chính thức nếu có thì chưa rõ. Giao nộp Caratacus lấy ý tưởng từ việc giao một người chạy trốn cho đồng minh. Khi bộ binh địch rút khỏi đất của Cartimandua, tối đa 25% quân sống sót sau tổn thất thông thường được chuyển cho đồng minh có đạo quân trên bộ lớn nhất đang đánh kẻ địch đó và còn chỗ trong quân dự bị. Phần vượt giới hạn trở về quân địch đang rút."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.id]
text = "Cartimandua memerintah bangsa Brigantes di wilayah Inggris utara sekarang pada abad pertama Masehi. Tacitus, sejarawan Romawi, adalah sumber naratif utama yang masih ada mengenai pemerintahannya. Pada 51 M, Caratacus, seorang pemimpin perlawanan terhadap Roma, meminta perlindungannya setelah kalah. Cartimandua menawannya dan menyerahkannya kepada orang Romawi. Tacitus juga mengisahkan perseteruannya dengan Venutius dan bantuan tentara Roma yang menyelamatkannya pada 69 M, ketika Venutius mengambil takhta."
title = "Cartimandua"
lang = "id"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Cartimandua memerintah bangsa Brigantes di wilayah Inggris utara sekarang pada abad pertama Masehi. Tacitus, sejarawan Romawi, adalah sumber naratif utama yang masih ada mengenai pemerintahannya. Pada 51 M, Caratacus, seorang pemimpin perlawanan terhadap Roma, meminta perlindungannya setelah kalah. Cartimandua menawannya dan menyerahkannya kepada orang Romawi. Tacitus juga mengisahkan perseteruannya dengan Venutius dan bantuan tentara Roma yang menyelamatkannya pada 69 M, ketika Venutius mengambil takhta."]
sections = [{ title = "Perlindungan, penangkapan, dan bantuan Roma", paragraphs = ["Kisah itu menggambarkan peristiwa dari sudut pandang Romawi. Penyerahan tawanan dan bantuan menunjukkan hubungan politik, sementara isi perjanjian resmi jika memang ada belum pasti. Penyerahan Caratacus mengadaptasi penyerahan buronan kepada sekutu. Saat pasukan darat musuh mundur dari wilayah Cartimandua, hingga 25% pasukan yang selamat setelah kerugian biasa dikirim kepada sekutu dengan pasukan darat aktif terbesar melawan musuh itu dan ruang cadangan. Pasukan yang melebihi batas kembali ke pihak yang mundur."] }]
sources = [{ title = "Tacitus, Annals 12.36–40 and Histories 3.45, Warwick Classics Network", url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/" }, { title = "The Brigantes: From Clientage to Conquest, Britannia", url = "https://www.cambridge.org/core/journals/britannia/article/abs/brigantes-from-clientage-to-conquest/71046A7B56D5E9F373B3A0A8C63CDF36" }, { title = "English Heritage, Cartimandua, Queen of the Brigantes", url = "https://www.english-heritage.org.uk/learn/histories/women-in-history/cartimandua/" }]

[articles.fil]
text = "Pinamunuan ni Cartimandua ang mga Brigantes sa hilagang England ngayon noong unang siglo CE. Ang historyador na Romanong si Tacitus ang pangunahing natitirang sanggunian tungkol sa kaniyang pamumuno. Noong 51 CE, humingi ng kanlungan sa kaniya si Caratacus, pinuno ng paglaban sa Roma, matapos matalo. Binihag siya ni Cartimandua at ibinigay sa mga Romano. Isinalaysay din ni Tacitus ang tunggalian niya kay Venutius at ang tulong ng hukbong Romano na nagligtas sa kaniya noong 69, nang mapunta kay Venutius ang trono."
title = "Cartimandua"
lang = "fil"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
shortArticle = true
intro = ["Pinamunuan ni Cartimandua ang mga Brigantes sa hilagang England ngayon noong unang siglo CE. Ang historyador na Romanong si Tacitus ang pangunahing natitirang sanggunian tungkol sa kaniyang pamumuno. Noong 51 CE, humingi ng kanlungan sa kaniya si Caratacus, pinuno ng paglaban sa Roma, matapos matalo. Binihag siya ni Cartimandua at ibinigay sa mga Romano. Isinalaysay din ni Tacitus ang tunggalian niya kay Venutius at ang tulong ng hukbong Romano na nagligtas sa kaniya noong 69, nang mapunta kay Venutius ang trono."]
sections = [{ title = "Kanlungan, pagkabihag at tulong ng Roma", paragraphs = ["Mula sa pananaw ng Roma ang mga salaysay. Nagpapakita ng ugnayang pampolitika ang pagbibigay sa bihag at ang pagsaklolo, bagaman hindi tiyak ang mga kondisyon ng posibleng kasunduan. Hango ang Pagsuko kay Caratacus sa pagbibigay ng isang tumatakas sa isang kakampi. Kapag umatras ang hukbong panlupa ng kaaway mula sa lupain ni Cartimandua, hanggang 25% ng mga nakaligtas sa karaniwang pagkalugi ang mapupunta sa kakamping may pinakamalaking aktibong hukbong panlupa laban sa kaaway na iyon at may puwang sa reserba. Babalik sa kaaway ang sobra."] }]
