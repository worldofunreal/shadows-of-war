intro = ["Cartimandua governou os brigantes no norte da atual Inglaterra durante o século I d.C. O historiador romano Tácito é a principal fonte narrativa preservada sobre seu governo. Em 51, Carataco, um líder da resistência a Roma, buscou refúgio junto dela após uma derrota. Cartimandua mandou prendê-lo e o entregou aos romanos. Tácito também descreve seu conflito com Venúcio e a intervenção das tropas romanas que a resgataram em 69, quando Venúcio ficou com o trono."]
sections = [{ title = "Refúgio, captura e apoio romano", paragraphs = ["Os relatos apresentam os fatos da perspectiva romana. A entrega do prisioneiro e o socorro militar indicam uma relação política, mas os termos de um possível tratado são incertos. Entrega de Carataco adapta a passagem de um fugitivo à custódia de um aliado. Quando um exército terrestre inimigo recua das terras de Cartimandua, até 25% dos sobreviventes após as perdas normais passam ao aliado com o maior exército terrestre ativo contra esse inimigo e espaço na reserva. O excedente volta ao exército em retirada."] }]
