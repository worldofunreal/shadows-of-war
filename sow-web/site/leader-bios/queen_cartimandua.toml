[articles.pt-BR]
text = "Cartimandua governou os brigantes no norte da atual Inglaterra durante o século I d.C. O historiador romano Tácito é a principal fonte narrativa preservada sobre seu governo. Em 51, Carataco, um líder da resistência a Roma, buscou refúgio junto dela após uma derrota. Cartimandua mandou prendê-lo e o entregou aos romanos. Tácito também descreve seu conflito com Venúcio e a intervenção das tropas romanas que a resgataram em 69, quando Venúcio ficou com o trono."
title = "Cartimandua"
lang = "pt-BR"
url = "https://warwick.ac.uk/fac/arts/classics/warwickclassicsnetwork/romancoventry/resources/interactions/civitates/cartimandua/tacitus/"
