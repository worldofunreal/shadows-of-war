[articles.en]
text = "Lothair I was a 9th-century Emperor of the Carolingian Empire and King of Italy (818–855) and Middle Francia (843–855)."
title = "Lothair I"
lang = "en"
url = "https://en.wikipedia.org/wiki/Lothair_I"
intro = [
  "Lothair I (Frankish: Ludher and Medieval Latin: Lodharius; Dutch and Medieval Latin: Lotharius; German: Lothar; French: Lothaire; Italian: Lotario; 795 – 29 September 855) was a 9th-century Emperor of the Carolingian Empire (817–855, with his father until 840) and King of Italy (818–855) and Middle Francia (843–855).",
  "Lothair I was the eldest son of the Carolingian emperor Louis I and his wife Ermengarde of Hesbaye, daughter of Ingerman the duke of Hesbaye. On several occasions, Lothair led his full-brothers Pepin I of Aquitaine and Louis the German in revolt against their father to protest against attempts to make their half-brother Charles the Bald a co-heir to the Frankish domains. Upon the father's death, Charles and Louis joined forces against Lothair in a three-year dynastic war (840–843). The struggles between the brothers led directly to the breakup of the Frankish Empire assembled by their grandfather Charlemagne, and laid the foundation for the development of modern France and Germany.",
]
sections = [
  { "title" = "Early life and reign", "paragraphs" = [
      "Lothair was born in 795, to Louis the Pious and Ermengarde of Hesbaye. His father was the son of the reigning Emperor, Charlemagne. At the time of Lothair's birth, his father Louis was already the King of Aquitaine. Little is known of Lothair's early life, which was probably passed at the courts of his father and grandfather. In 814, the elderly emperor died, and left his sole surviving legitimate son Louis the Pious as successor to his vast empire. Being already of age, Lothair was sent to govern Bavaria for his father, the new emperor.",
      "In 817, Louis the Pious drew up his Ordinatio Imperii. By that act, Louis designated Lothair as his principal heir and ordered that Lothair would be the overlord of Louis' younger sons Pippin of Aquitaine (who was 20) and Louis the German (who was 13), and also the presumptive overlord of the Kingdom of Italy, that was ruled at this time by their cousin, king Bernard of Italy. Lothair would also inherit their lands if they were to die childless. Lothair was then crowned joint emperor by his father at Aachen. At the same time, Aquitaine and Bavaria were granted to his brothers Pippin and Louis, respectively, as subsidiary kingdoms.",
      "Following the death of Bernard (818), brought on by his plotting against and blinding by Louis the Pious, Italy was awarded to Lothair. In 821, Lothair married Ermengarde (d. 851), daughter of Hugh the Count of Tours. In 822, he assumed the government of Italy, and at Easter, 5 April 823, he received the royal crown of Italy, and was again crowned as emperor by Pope Paschal I, this time at Rome. In November 824, Lothair promulgated a statute, the Constitutio Romana, concerning the relations of pope and emperor, which reserved the supreme power to the secular potentate, and he afterwards issued various ordinances for the good government of Italy.",
    ] },
  { "title" = "Division of the kingdom", "paragraphs" = [
      "The first rebellion began in 830. All three brothers fought their father, whom they deposed. In 831, their father was reinstated and he deprived Lothair of his imperial title and gave Italy to Charles. The second rebellion was instigated by Angilbert II, Archbishop of Milan in 833, and again Louis was deposed in 834. Lothair, through the loyalty of the Lombards and later reconciliations, retained Italy and the imperial position through all remaining divisions of the Empire by his father.",
      "When Louis the Pious was dying in 840, he sent the imperial insignia to Lothair, who, disregarding the various partitions, claimed the whole of the Empire. He was 45 years old when his father died. Negotiations with his brother Louis the German and his half-brother Charles, both of whom resisted this claim, were followed by an alliance of the younger brothers against Lothair. A decisive battle was fought at Fontenay-en-Puisaye on 25 June 841, when, in spite of his and his allied nephew Pepin II of Aquitaine's personal gallantry, Lothair was defeated and fled to Aachen. With fresh troops he began a war of plunder, but the forces of his brothers were too strong, and taking with him such treasure as he could collect, he abandoned his capital to them. He met with the leaders of the Stellinga in Speyer and promised them his support in return for theirs, but Louis and then the native Saxon nobility put down the Stellinga in the next years.",
      "Peace negotiations began, and in June 842 the brothers met on an island in the Saône. They agreed to an arrangement which developed, after much difficulty and delay, into the Treaty of Verdun, signed in August 843. By this, Lothair received the imperial title as well as northern Italy and a long stretch of territory from the North Sea to the Mediterranean, essentially along the valleys of the Rhine and the Rhône; this territory includes the regions Lorraine, Alsace, Burgundy, and Provence. He soon ceded Italy to his eldest son, Louis, and remained in his new kingdom, engaging in alternate quarrels and reconciliations with his brothers and in futile efforts to defend his lands from the attacks of the Northmen (as Vikings were known in Frankish writings) and the Saracens (as those loyal to the various Fatimids, Umayyads and Abbasides are known in Frankish writings).",
    ] },
  { "title" = "Death and aftermath", "paragraphs" = [
      "In 855 he became seriously ill, and despairing of recovery renounced the throne, divided his lands among his three sons, and on 23 September entered the monastery of Prüm, where he died six days later. He was buried at Prüm, where his remains were found in 1860. It was at Prüm that Lothair was most commemorated.",
      "The same year, Lothair's kingdom was divided between his three sons in a deal called the Treaty of Prüm: the eldest, Louis II, received Italy and the title of emperor; the second, Lothair II, received Lotharingia; the youngest, Charles, received Provence.",
    ] },
  { "title" = "Family", "paragraphs" = [
      "Louis II (825–875) Crowned as King of Italy in 844 by Pope Sergius II. Crowned Emperor in 850. Married Engelberga",
      "Lothair II (835–869) Succeeded his father. Married Teutberga, daughter of Boso the Elder, Count of Arles.",
    ] },
]

[articles.es]
text = "Lotario I (en neerlandés y latín medieval: Lotharius, alemán: Lothar, francés: Lothaire, italiano: Lotario) (795-29 de septiembre del 855) fue el emperador de Occidente (817-855, cogobernante con su padre hasta 840), y gobernador de Baviera (815-817), rey de Italia (818-855) y la Francia Media (840-855). Lotario fue el hijo mayor del emperador Ludovico Pío, también conocido en español como «Luis el Piadoso» y su esposa Ermengarda de Hesbaye,​ hija de Ingerman de Hesbaye, el duque de Hesbaye."
title = "Lotario I"
lang = "es"
url = "https://es.wikipedia.org/wiki/Lotario_I"
intro = [
  "Lotario I (en neerlandés y latín medieval: Lotharius, alemán: Lothar, francés: Lothaire, italiano: Lotario) (795-29 de septiembre del 855) fue el emperador de Occidente (817-855, cogobernante con su padre hasta 840), y gobernador de Baviera (815-817), rey de Italia (818-855) y la Francia Media (840-855).",
  "Lotario fue el hijo mayor del emperador Ludovico Pío, también conocido en español como «Luis el Piadoso» y su esposa Ermengarda de Hesbaye,​ hija de Ingerman de Hesbaye, el duque de Hesbaye. En varias ocasiones, Lotario lideró a sus hermanos Pipino I de Aquitania y Luis el Germánico en rebeldía contra su padre para protestar contra los intentos de hacer a su medio hermano Carlos el Calvo coheredero de los dominios francos. A la muerte de su padre, Carlos y Luis unieron fuerzas contra Lotario en una guerra civil que duró tres años (840-843). Las luchas entre los hermanos llevaron directamente a la ruptura del Imperio romano occidental reunido por su abuelo Carlomagno y establecieron el fundamento del desarrollo de lo que son las modernas Francia y Alemania.",
]
sections = [
  { "title" = "Primeros años", "paragraphs" = [
      "Lotario nació en 795, hijo de Ludovico Pío y Ermengarda de Hesbaye. Su padre era el hijo del emperador reinante, Carlomagno. Se sabe poco de los primeros años de Lotario, que pasó probablemente en la corte de su abuelo Carlomagno. En 814, murió el anciano Carlomagno, y dejó a su hijo Ludovico Pío su vasto imperio. Al año siguiente, Lotario, ahora un adulto, fue enviado a gobernar Baviera en 815 por su padre y ahora nuevo emperador, Ludovico Pío.​ En 817, Ludovico Pío​ redactó su Ordinatio Imperii.​ En ella, Ludovico designó a Lotario como su heredero principal y ordenó que Lotario fuese el señor de los hijos menores de Ludovico, Pipino de Aquitania (que tenía 20 años) y Luis el Germánico (que tenía 13), así como su sobrino (primo de Lotario) Bernardo de Italia. Lotario también heredaría sus tierras si murieran sin hijos. Lotario, de 22 años de edad, fue entonces coronado emperador conjunto por su padre en Aquisgrán.​ Al mismo tiempo, Aquitania y Baviera fueron entregadas a sus hermanos Pipino y Luis, respectivamente, como reinos subsidiarios.​ Después de la muerte de Bernardo por Ludovico Pío, Lotario recibió también el Reino de Italia.[cita requerida] En 821, Lotario se casó con Ermengarda (m. 851), hija de Hugo el conde de Tours.​",
    ] },
  { "title" = "Coemperador", "paragraphs" = [
      "En el 822, asumió el gobierno de Italia, y durante la Pascua, el 5 de abril del 823, fue coronado emperador de nuevo por el papa Pascual I, esta vez en Roma.",
      "En el 823, su hermanastro Carlo, hijo de Luis el Piadoso y de su segunda esposa (casada en 819, tras cerca de un año de viudez), Judith de los Welf (Güelfos),​ creando considerables problemas en la sucesión a Luis tal y como había sido planeada en la Ordinatio Imperii de 817. El emperador intentó asignar también territorios a su hijo recién nacido, pero como la ordinatio no preveía tal caso, se encontró con la considerable resistencia de sus hijos Lotario (emperador y rey de Italia), Pipino (rey de Aquitania) y Ludovico (rey de Baviera), por lo que parecía que las decisiones de 817 seguían su curso.",
      "En el 824, tras la muerte del papa Pascual, Lotario regresó a Roma para reunirse con el nuevo papa, Eugenio II,​ y en noviembre de ese mismo año promulgó un estatuto sobre las relaciones entre el papa y el emperador, conocido como la Constitutio romana, que reservaba el poder supremo al poder secular, y posteriormente promulgó varias ordenanzas para fomentar el gobierno eficiente de Italia.​",
    ] },
  { "title" = "Rompiendo el reino", "paragraphs" = [
      "La primera rebelión empezó en 830. Los tres hermanos combatieron contra su padre, a quien depusieron. En 831, su padre fue reinstalado y privó a Lotario de su título imperial y entregó Italia a Carlos. La segunda rebelión fue instigada por Angilberto II, arzobispo de Milán, en 833, y de nuevo Ludovico Pío fue depuesto en 834. Lotario, gracias a la lealtad de los lombardos y posteriores reconciliaciones, conservó Italia y la posición imperial durante las demás las divisiones del Imperio por su padre.[cita requerida]",
      "Cuando Luis el Piadoso estaba muriendo en 840, envió las insignias imperiales a Lotario; le fue concedida la autoridad imperial por derecho de primogenitura, pero siguiendo la tradición franca, su padre vio necesario dotar de una parte del reino a cada uno de sus hijos. Lotario, desdeñando las diversas particiones, reclamó la totalidad del imperio. Tenía 45 años cuando su padre murió. Las negociaciones con su hermano Luis el Germánico y su medio hermano Carlos, ambos negándose a aceptar la pretensión de Lotario, fueron seguidas por una alianza de los hermanos menores contra Lotario. Una batalla decisiva tuvo lugar en Fontenay-en-Puisaye el 25 de junio del 841, cuando, a pesar de su valentía personal​ y la de su sobrino, aliado suyo, Pipino II de Aquitania[cita requerida], Lotario fue derrotado y huyó a Aquisgrán. Con tropas frescas empezó una guerra de saqueo, pero las fuerzas de sus hermanos eran demasiado fuertes, y llevando con él un tesoro tan grande como podía, abandonó su capital a ellos.​ Se encontró con los líderes de la Stellinga en Espira y les prometió su apoyo a cambio del suyo, pero Luis y luego la nobleza sajona nativa aplastó a los Stellinga en los años siguientes.[cita requerida]",
      "Las negociaciones de paz empezaron, y en junio de 842 los hermanos se encontraron en una isla en el Saona. Llegaron a un acuerdo que desarrolló, después de mucha dificultad y retrasos, hasta convertirse en el tratado de Verdún, firmado en agosto de 843. Por él, Lotario recibió el título imperial así como Italia septentrional y una larga franja de territorio desde el mar del Norte hasta el Mediterráneo, esencialmente a lo largo de los valles del Rin y el Ródano; este territorio incluye las regiones de Lorena, Alsacia, Borgoña, y Provenza. Pronto cedió Italia a su hijo mayor, Luis, y se quedó en su nuevo reino, implicándose en luchas y reconciliaciones con sus hermanos y en esfuerzos fútiles por defender sus tierras de los ataques de los \"hombres del norte\" (llamados vikingos en los escritos francos) y los sarracenos (como se conocía en los escritos francos a los leales a diversos fatimíes, omeyas y abasíes).​",
    ] },
  { "title" = "Muerte y legado", "paragraphs" = [
      "En 855 enfermó gravemente, y sin esperanzas de recuperación, renunció al trono, dividiendo sus tierras entre sus tres hijos, y el 23 de septiembre entró en el monasterio de Prüm, donde murió seis días después. Fue enterrado en Prüm, donde se encontraron sus restos en 1860.​ Fue en Prüm donde Lotario fue más celebrado.",
      "El mismo año, el reino de Lotario fue dividido entre sus tres hijos​ en un trato llamado el tratado de Prum: el mayor, Luis II, recibió Italia y el título de emperador; el segundo, Lotario II, recibió Lotaringia; el más joven, Carlos, recibió Provenza.[cita requerida]",
    ] },
]

[articles.fr]
text = "Lothaire Ier, né en 795 et mort le 29 septembre 855 à Prüm, est le fils de Louis Ier dit le Pieux et d'Ermengarde de Hesbaye. Il est co-empereur d'Occident de juillet 817 à novembre 833, seul empereur jusqu'en février 835 puis de nouveau co-empereur jusqu'en 840 et finalement seul empereur de 840 à 855."
title = "Lothaire Ier"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Lothaire_Ier"
intro = [
  "Lothaire Ier, né en 795 et mort le 29 septembre 855 à Prüm, est le fils de Louis Ier dit le Pieux et d'Ermengarde de Hesbaye. Il est co-empereur d'Occident de juillet 817 à novembre 833, seul empereur jusqu'en février 835 puis de nouveau co-empereur jusqu'en 840 et finalement seul empereur de 840 à 855.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "En 814, son père lui confie d'abord le gouvernement de la Bavière, puis en juillet 817, promulgue l’Ordinatio Imperii qui l'associe à l’Empire, et le déclare seul héritier. Il assigne cependant à ses fils puînés, Pépin et Louis, une part du territoire avec un rôle subordonné. Également reconnu comme roi des Francs, Lothaire Ier est envoyé en Italie, où il prend en 820 ou 822 le titre de roi des Lombards, et s’installe à Pavie. Le 5 avril 823 à Rome, il est couronné coempereur par le pape Pascal Ier, celui-ci se soumettant à son autorité.",
      "En 829, Louis le Pieux jette les bases d'un partage nouveau, favorable à son plus jeune fils Charles, né en 823 de sa seconde épouse Judith de Bavière. Lothaire Ier se révolte alors contre son père Louis le Pieux. Lothaire entraîne ses deux frères Louis le Germanique et Pépin Ier d'Aquitaine contre leur père, et le détrône une première fois en 830. Mais le fils rebelle est battu et ne conserve que l'Italie. Le Royaume franc proprement dit est attribué à ses trois frères. Toutefois, la rivalité qui ne cesse d'exister entre Judith et ses beaux-enfants amène la crise de 833 qui voit la déposition de Louis le Pieux par ses fils. Lothaire s'empare du pouvoir souverain ; une nouvelle répartition du territoire écarte les prétentions de Charles. Au cours de l'année suivante la situation se modifie profondément : Louis et Pépin se rapprochent de leur père ; Lothaire est contraint de prendre la fuite ; le vieil empereur est restauré le 1er mars 834. En 838, réconcilié avec Lothaire, Louis le Pieux opère un nouveau partage à Worms, 3 mai 839. Lothaire reçoit, outre l'Italie, la portion orientale du Royaume franc. Quelques mois plus tard, il conclut un traité avec le doge vénitien Pietro Tradonico appelé Pactum Lotharii.",
      "Après la mort de son père en 840, ses deux frères, Louis le Germanique et Charles, refusent de le reconnaître comme suzerain. Lothaire Ier tente alors d'envahir leurs États, mais ceux-ci se liguent contre lui et, en juin 841, obtiennent la victoire à la bataille de Fontenoy-en-Puisaye dans l’Auxerrois. Le 14 février 842, les deux vainqueurs renforcent même leur alliance par les serments de Strasbourg. L'année suivante, ils lui imposent le traité de Verdun qui lui permet de conserver le titre impérial, et lui octroie la Francie médiane, un domaine long et étroit allant de la mer du Nord jusqu'au sud de Rome et incluant la capitale de l'Empire carolingien, Aix-la-Chapelle.",
    ] },
  { "title" = "Mariage et descendance", "paragraphs" = [
      "En octobre 821 à Thionville, Lothaire épouse Ermengarde, fille du comte de Tours, Hugues d'Alsace, qui lui donne huit enfants :",
      "Louis II le Jeune (° v. 825 - † 875), empereur d'Occident (855-875), épouse Engelberge ;",
      "Ermengarde (° v. 825/830 - † apr. 865/866), épouse Gislebert de Maasgau (820-875) (cf. famille des Régniers) ;",
    ] },
  { "title" = "Dans la fiction", "paragraphs" = [
      "L'auteur dramatique et librettiste Hippolyte Bis commença sa carrière littéraire en écrivant, en collaboration avec François Hay, une tragédie en trois actes et en vers, Lothaire, qui met en scène la tentative de prise de pouvoir de Lothaire au détriment de son père Louis le Pieux. La tragédie fut publiée en 1817 mais ne fut jamais jouée.",
    ] },
]

[articles.it]
text = "Lotario I (795 – Prüm, 29 settembre 855) è stato un re franco, d'Italia dall'822 all'850, poi di Lotaringia e imperatore carolingio dall'840 alla sua morte. Riconosciuto venerabile per la sua condotta a favore della Chiesa, gli fu iniziato un processo di beatificazione che non fu portato a termine."
title = "Lotario I"
lang = "it"
url = "https://it.wikipedia.org/wiki/Lotario_I"
intro = [
  "Lotario I (795 – Prüm, 29 settembre 855) è stato un re franco, d'Italia dall'822 all'850, poi di Lotaringia e imperatore carolingio dall'840 alla sua morte.",
  "Riconosciuto venerabile per la sua condotta a favore della Chiesa, gli fu iniziato un processo di beatificazione che non fu portato a termine.",
]
sections = [
  { "title" = "Origine", "paragraphs" = [
      "Secondo la Vita Hludowici Imperatoris, era il figlio primogenito del re di Aquitania e futuro imperatore Ludovico il Pio e di Ermengarda (780-818), figlia del conte di Hesbaye Ingramm (o Ingerman o Enguerrand, nipote di Rotrude, moglie di Carlo Martello) e di Edvige di Baviera.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Si sa poco dei primi anni della sua vita, che trascorse probabilmente alla corte di suo nonno Carlo Magno. Dopo la morte del nonno (814), nell'815 il padre Ludovico lo inviò a governare la Baviera, affiancato da alcuni funzionari franchi.",
      "Nell'817, alla dieta di Aquisgrana, l'imperatore Ludovico il Pio, con la Divisio Imperii, concesse al suo primogenito Lotario il titolo imperiale, e con l'incoronazione a imperatore aggiunto fu sancita la sua superiorità sui fratelli, mentre al secondogenito, Pipino, concesse la sovranità, con il titolo di re, sull'Aquitania, il tolosano e la Settimania, che già governava, e al terzogenito, Ludovico, che sarà detto il Germanico, concesse la sovranità, con il titolo di re, sulla Baviera, la Carinzia e la Boemia. Questa suddivisione, conosciuta anche come Ordinatio Imperi, fu ratificata dall'imperatore a Nimega, nell'819.",
      "Nell'821, secondo gli Annales Xantenses, Lotario sposò Ermengarda († 20 marzo 851), figlia di Ugo, conte di Tours, che secondo il cronista Thegano era discendente dalla famiglia degli Eticonidi e di Ava o Bava.",
    ] },
  { "title" = "Matrimonio e discendenza", "paragraphs" = [
      "Ludovico II (circa 825 – 12 agosto 875), re d'Italia e co-imperatore, poi imperatore;",
      "Elletrud (Hiltrud) (circa 826 – dopo l'867), sposò il conte Berengario di Spoleto († 867/866), come si può leggere in una lettera, dell'867, di papa Nicola I indirizzata a Carlo il Calvo;",
      "Ermengarda (Irmgard) (826/30-dopo l'847), andata sposa, dopo essere stata rapita da Giselberto (circa 825 - dopo l'877), conte di Maasgau, nella bassa Mosa. Fu la madre di Reginare;",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(LA) Monumenta Germaniae Historica, Poetarum Latinorum Medii Aevi, Poetae Latini Aevi Carolini, tomus III.",
      "(LA) Monumenta Germaniae Historica, Diplomata Karolinorum, tomus IV, Ludovici II Diplomata.",
      "René Poupardin, Ludovico il Pio, cap. XVIII, vol. II (L'espansione islamica e la nascita dell'Europa feudale) della Storia del Mondo Medievale, pp. 558–582",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Augusto Lizier, LOTARIO I re d'Italia e imperatore, in Enciclopedia Italiana, Istituto dell'Enciclopedia Italiana, 1934.",
      "Lotario I Re d’Italia e imperatore del Sacro romano impero, in Dizionario di storia, Istituto dell'Enciclopedia Italiana, 2010.",
      "Mario Marrocchi, LOTARIO I, imperatore, re d'Italia, in Dizionario biografico degli italiani, vol. 66, Istituto dell'Enciclopedia Italiana, 2006.",
    ] },
]

[articles.tr]
text = "I. Lothar, (Almanca: Lothar, Fransızca: Lothaire, İtalyanca: Lotario, İngilizce: Lothair) (d."
title = "I. Lothar"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._Lothar"
intro = [
  "I. Lothar, (Almanca: Lothar, Fransızca: Lothaire, İtalyanca: Lotario, İngilizce: Lothair) (d. 795 – ö. 29 Eylül 855), 9. yüzyılda hüküm sürmüş bir Karolenj hükümdarıdır. 817–855 yılları arasında imparator (840 yılına kadar babasıyla birlikte), 818–855 arasında İtalya kralı ve 843–855 yılları arasında Orta Frank Krallığı'nın hükümdarı olarak hüküm sürmüştür.",
  "Lothar, Karolenj imparatoru I. Ludwig ile eşi Hesbayeli Ermengarde oğluydu. Annesi, Hesbaye dükü Ingerman'ın kızıydı. Lothar, çeşitli dönemlerde kardeşleri I. Pepin ve II. Louis ile birlikte, babalarının üvey kardeşleri II. Charles'ı Frank topraklarında ortak varis ilan etme girişimlerine karşı isyan etti. Babasının ölümünün ardından Charles ve Louis, Lothar'a karşı birleşerek 840–843 yılları arasında süren bir hanedan savaşına girişti. Kardeşler arasındaki bu mücadele, büyükbabaları Şarlman tarafından kurulan Karolenj İmparatorluğu'nun parçalanmasına yol açmış ve modern Fransa ile Almanya'nın oluşum sürecinin temelini atmıştır.",
  "Kendine babasının mirası olarak verilen Orta Francia bölgesine Lotharingia adı verilmesi Lothar ismine atıfladır.",
]
sections = [
  { "title" = "Hayatı", "paragraphs" = [
      "Lothar, Karolenj İmparatoru I. Ludwig'in en büyük oğlu olup, annesi ise Hesbaye Dükü Ingerman'ın kızı Ermengarde Hesbayeli idi.",
      "Babalarına karşı pek çok fırsatta isyan ettiklerinde, kardeşleri Akitanya Kralı I. Pepin ve Alman Ludwig'i yönlendirdi. Babalarının, yarı kardeşleri olan Dazlak Karl'ı, Frank ülkesine ortak Kral yapma denemesinde isyan ettiler. Babalarının ölümü üzerine Karl ve Ludwig, kuvvetlerini Lothar'a karşı üç yıl suren bir iç savaşta (840-843) birleştirdiler. Kardeşler arasında süren bu mücadele, dedeleri Şarlman tarafından kurulmuş olan Karolenj Franklar İmparatorluğunu modern Fransa ve Almanya'nın gelişme kuruluşuna yönlendiriyordu.",
      "İlk yılları hakkında az bilgi vardır, muhtemelen ilk yıllarını dedesi Şarlman'ın sarayında geçirdi. Babasının iktidara geçmesinden kısa bir süre sonra Bavyera'yı yönetmeye gönderildi. Tarih sahnesine ilk çıkışı 817 yılında babası I. Ludwig'in onu Ordinatio Imperii olarak tasarlamasıyla başladı. Bu şekilde Ludwig, Lothar'ı birinci vâris olarak belirtiyordu. Lothar, daha sonra babası ile birlikte Aachen Şapeli'nde taç giydi. Ayni zamanda Akitanya ve Baveya sırasıyla kardeşleri Pippin ve Ludwig'e bağlı Krallıklar olarak verildi. İtalya Kralı Bernard'ın öldürülmesini takiben, Ludwig ve Lothar ayrıca İtalya Krallığı'nı aldılar. Lothar, 821 yılında Tours Kontu Hugh'un kızı Ermengarde (Tours) (ö. 851) ile evlendi. 822 yılında İtalya Hükûmeti görevini üstlendi ve 5 Nisan 823 tarihinde Paskalya'da bu defa Roma'da Papa I. Paschalis tarafından kendisine taç giydirildi.",
    ] },
  { "title" = "Aile", "paragraphs" = [
      "Ermengarde Tourslu (ö. 851) ile evlendi. Ondan olan dokuz çocuğundan başka evlilikdışı bir çocuğu da vardı.",
    ] },
  { "title" = "Dış bağlantılar", "paragraphs" = [
      "Nithard, Historiarum Libri adli iki kronik tarih icin kaynak Monumenta Germaniae Historica Scriptores, Bände i. and ii. (Hannover ve Berlin, 1826 fol.)",
      "B. Simson, Jahrbücher des deutschen Reiches unter Ludwig dem Frommen (Leipzig, 1874-1876)",
    ] },
]

[articles.zh]
text = "洛泰尔一世 （德語：Lothar，法語：Lothaire，義大利語：Lotario，795年—855年9月29日）是巴伐利亚总督（815年–817年），倫巴第國王(818年–855年)，中法兰克国王（840年–855年）和神圣罗马皇帝（840年–855年）。 洛泰尔一世是皇帝虔诚者路易和埃斯拜的埃芒加德（埃斯拜公爵英格曼的女儿）的长子。他领导了他的同母兄弟丕平一世和日耳曼人路易反对他们的父亲的叛乱，以抗议他试图让他们的异母兄弟秃头查理也继承法兰克王国的一部分。在虔诚者路易死后，日耳曼人路易与秃头查理打起了长达3年的内战（840年-843年）来反抗洛泰尔一世。这场兄弟们之间的斗争导致了整个帝国的分裂，并奠定了今天的法国和德国的基础。 洛泰尔一世去世后，他的中法兰克王国被分给了三个儿子路易二世、洛泰尔二世和普罗旺斯的查理。"
title = "洛泰尔一世 (中法兰克)"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E6%B4%9B%E6%B3%B0%E5%B0%94%E4%B8%80%E4%B8%96_%28%E4%B8%AD%E6%B3%95%E5%85%B0%E5%85%8B%29"
intro = [
  "洛泰尔一世 （德語：Lothar，法語：Lothaire，義大利語：Lotario，795年—855年9月29日）是巴伐利亚总督（815年–817年），倫巴第國王(818年–855年)，中法兰克国王（840年–855年）和神圣罗马皇帝（840年–855年）。",
  "洛泰尔一世是皇帝虔诚者路易和埃斯拜的埃芒加德（埃斯拜公爵英格曼的女儿）的长子。他领导了他的同母兄弟丕平一世和日耳曼人路易反对他们的父亲的叛乱，以抗议他试图让他们的异母兄弟秃头查理也继承法兰克王国的一部分。在虔诚者路易死后，日耳曼人路易与秃头查理打起了长达3年的内战（840年-843年）来反抗洛泰尔一世。这场兄弟们之间的斗争导致了整个帝国的分裂，并奠定了今天的法国和德国的基础。",
]
sections = [
  { "title" = "早年生活", "paragraphs" = [
      "洛泰尔于795年出生，是虔诚者路易和埃斯拜的埃芒加德的儿子。对洛泰尔的早年生活知之甚少，他很可能是在他的祖父查理曼的宫廷中度过的。814年，查理曼去世，留下他唯一的儿子作为他偌大王国的合法继承人。次年，洛泰尔被父亲派去掌管巴伐利亚。817年，虔诚者路易起草了他的帝国诏令（Ordinatio Imperii），在诏令中，虔诚者路易指定洛泰尔为其首要继承人，并统领他的兄弟丕平一世、日耳曼人路易以及他的侄子（洛泰尔的堂弟）意大利的伯纳德（Bernard of Italy），如果他们去世时无子嗣，洛泰尔也将继承他们的领地。时年22岁的洛泰尔在亚琛被其父亲加冕为共治皇帝。与此同时，阿基坦与巴伐利亚作为附庸国分别被授予他的兄弟丕平一世和日耳曼人路易。在意大利的伯纳德发起对虔诚者路易的反抗被后者杀害后，洛泰尔一世继承了他的意大利王国。洛泰尔一世于821年迎娶了图尔伯爵休的女儿图尔的埃芒加德。",
      "在823年4月5日复活节，洛泰尔一世于罗马被教宗巴斯加一世再次加冕。824年1月，洛泰尔颁布了《罗马宪法》，在关于教皇与国王的关系方面让世俗君主保留了最高权力，其后洛泰尔一世为管理意大利而颁布了一系列法令。",
      "当洛泰尔一世回到他父亲的宫廷时，她的继母巴伐利亚的朱迪丝（Judith）获得了他的准许，为她的儿子秃头查理分得一块王国，即829年被授予他的阿勒曼尼亚。然而洛泰尔一世很快转变了他的态度，并在随后的10年间持续为了帝国的分裂问题与他的父亲发生冲突。他被流放并被限制在意大利地区，在一段时间中与他的兄弟们联合，又在另外的日子中与他们反目作战，使得他治下的王国边境处在不断地变化中。",
    ] },
  { "title" = "分裂王国", "paragraphs" = [
      "第一次叛乱开始于830年，三位兄弟一起反抗他们的父亲虔诚者路易，并将其罢免。831年，虔诚者路易复位，他剥夺了洛泰尔一世的皇室头衔，并将意大利交给了秃头查理。第二次叛乱由米兰主教安吉尔伯特二世于833年煽动，使得虔诚者路易于834年再次被废黜，洛泰尔一世通过父亲遗留下来的王国分封方案使自己保住了意大利王国及自己的皇室头衔。",
      "当虔诚者路易于840年去世时，他将皇家徽章授予时年45岁的洛泰尔一世，后者随即声称拥有整个加洛林帝国，不管任何分区。由于他的兄弟日耳曼人路易和秃头查理都拒绝承认这一主张，洛泰尔一世与他们进行了谈判，但两兄弟随后联合起来反抗。在841年6月25日决定性的丰特努瓦战役 (841年)中，即便有他的侄子，阿基坦国王丕平二世的支持，洛泰尔一世依旧被击败并逃往亚琛。在集结了一支新的军队后洛泰尔一世重新发起了一场掠夺战争，但由于他兄弟的军队太过强大，洛泰尔一世抛弃首都亚琛，并带着他所能收集的一切财物来到施派尔与萨克森人团体斯特林加的首领会面以获取他们的支持，但日耳曼人路易和当地的萨克森贵族在接下来的几年里镇压了斯特林加运动。",
      "和平会谈继续展开，842年6月，三位兄弟在索恩河的一座小岛上会面。在经过不少困难和拖延后，他们达成了一项合约，并演化为843年8月正式签署的的《凡尔登条约》。洛泰尔一世保有国王头衔并分得意大利王国以及莱茵河和罗讷河河谷之间，从北海到地中海的一段狭长领土，这片领土包括洛林、阿尔萨斯、勃艮第和普罗旺斯，被称为中法兰克王国。他很快将意大利交给了自己的长子路易二世，并留在了他的新王国，与他两个兄弟的争执与和解依旧在继续着，同时保卫自己的领土免受诺斯人（法兰克人的记载中更多称其为维京人）和萨拉森人（法兰克人的记载中忠于法蒂玛王朝、倭马亚王朝、阿拔斯王朝的各种群体）的侵害。",
    ] },
  { "title" = "去世及余波", "paragraphs" = [
      "855年，洛泰尔一世患上重病，自觉恢复无望的他放弃了王位，决定将领土分给三个儿子，于9月23日进入普吕姆修道院，6天后在此去世。他被埋葬在普吕姆，最终他的遗体于1860年被发现。洛泰尔一世在普吕姆受到的纪念最为隆重。",
      "同一年，洛泰尔一世的中法兰克王国按《普吕姆条约》分给三个儿子：长子路易二世接受了意大利和皇帝称号，次子洛泰尔二世接受了洛泰尔王国（Lotharingia）；小儿子普罗旺斯的查理接受了下勃艮第。",
    ] },
]

[articles.ko]
text = "로타리우스 1세(독일어: Lothar, 프랑스어: Lothaire, 이탈리아어: Lotario, 795년 ~ 855년 9월 22일/9월 29일)는 중프랑크 왕 (재위: 818년~855년)이자 신성 로마 제국 황제 (재위: 840년~855년), 프랑크 왕국의 국왕(재위: 840년~843년)였다. 로테르 1세, 로타리오 1세 혹은 흘로타르(Hlothar) 등으로도 부른다."
title = "로타리우스 1세"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EB%A1%9C%ED%83%80%EB%A6%AC%EC%9A%B0%EC%8A%A4_1%EC%84%B8"
intro = [
  "로타리우스 1세(독일어: Lothar, 프랑스어: Lothaire, 이탈리아어: Lotario, 795년 ~ 855년 9월 22일/9월 29일)는 중프랑크 왕 (재위: 818년~855년)이자 신성 로마 제국 황제 (재위: 840년~855년), 프랑크 왕국의 국왕(재위: 840년~843년)였다. 로테르 1세, 로타리오 1세 혹은 흘로타르(Hlothar) 등으로도 부른다. 아버지인 황제 경건왕 루트비히의 상속령, 제국 칙령에 반발하여 830년부터 아버지 경건왕 루트비히에 대한 반란을 일으켰다. 840년 프랑크 왕국의 단독 통치자가 되려고 했으나 형제들의 저지를 받았다.",
  "그는 황제 경건왕 루트비히와 에르망가르트의 맏아들로 814년부터 817년에는 바이에른의 왕에 봉해졌고, 817년 8월에는 아버지 경건왕 루트비히의 제국 칙령에 의해 공동 황제로 임명되었다. 818년 이탈리아 총독, 822년 이탈리아의 왕에 봉해졌다. 818년 경건왕 루트비히에 의해 공동 국왕에 임명되고, 공동 황제로 선포되었다. 그러나 823년 대머리 카를의 출생 이후 상속령 개정에 반발하여 여러 차례에 걸쳐 동생 아키텐의 아키텐인 피핀 1세와 독일인 루트비히와 함께 여러번 반란을 일으켰다.",
  "840년 황제 경건왕 루트비히가 사망하자 전체 카롤링거 왕국의 상속자였으나 프랑크족의 전통에 따라 영토를 다른 형제들과 나누어야만 했고, 로타르는 단독으로 왕권을 행사하려 했다. 즉위 직후 그는 영토 분할안을 무효로 선언하고 단독통치를 선언했다. 이로 인해 대머리 카를이 반발하면서, 그와 형제들 사이에 전쟁이 일어났다. 이 분쟁은 로타르가 패하면서 843년 8월 베르됭 조약에 의해 끝이 났고 영토는 세부분으로 분할 되었다. 베르됭 조약에 의해 제국이 삼분되자 로타르는 이탈리아의 왕과 황제의 직위는 계속 가졌고 조약에 따라 이탈리아와 로트링겐, 부르군트, 프로방스, 라인 마스 등을 제국의 중부인 중 프랑크 왕국을 차지했다. 855년 아들들에게 자신의 지위를 넘기고 프륌 수도원으로 은퇴했다. 일설에는 그가 885년 무렵까지도 살아있었다는 설도 있다. 그는 한때 천주교회의 가경자에 추대되었으나 시복되지 못했다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "로타르 1세는 795년 혹은 794년에 당시 아키텐의 왕이었던 경건왕 루트비히와 그의 첫 번째 왕비로 히스베니아의 공작 잉게르만(Ingerman)과 바이에른의 헤드비가의 딸인 히스파니아의 이르멘가르트의 장자로 바이에른의 아르토르프에서 태어났다. 그가 생존할 당시의 이름은 흘로타리우스, 흘로타르였는데, 프랑크족의 이름인 클로타리우스, 클로타르의 변형된 형태였다. 후일 발음이 변형되면서 로타르, 로타리우스로 변형되었다.",
      "외할아버지 잉게르만은 카를 마르텔의 부인 로트루드(Rotrude)의 조카였다. 배다른 형 상스 백작 아르눌프와 배다른 누나 알파이스가 있었지만, 그들을 낳은 상스의 테오델린트는 794년, 루트비히가 황제위에 오르기 전에 사망하여 적자로 인정받지도 못했다. 친동생으로 피핀 1세 아키텐인과 독일인 루트비히가 태어났고, 그 뒤로 이복 형제인 대머리 카를가 태어났다.",
      "로타르의 젊은 시절의 행적에 대한 것은 알려진 것이 거의 없다. 어린 시절 그는 할아버지 샤를마뉴 대제의 아헨 궁정에서 성장하였다. 경건왕 루트비히 1세의 아들이자 샤를마뉴의 손자였던 그는 805년 투르의 백작에 임명되었다. 814년 루트비히 1세가 샤를마뉴의 뒤를 이어 프랑크 왕국의 국왕이자 신성 로마 제국 황제가 되자 814년 8월 바이에른 왕에 임명되었다. 일설에는 당시 바이에른의 왕이 아닌 바이에른 총독으로 파견되었다는 설도 있다. 815년 바이에른으로 파견되었다. 817년 메인의 백작에 임명되었다.",
    ] },
  { "title" = "가계", "paragraphs" = [
      "이복여동생 : 기젤라 : 프리울리의 에베르하르트 1세와 결혼, 이탈리아 왕 베렝가리오 1세, 이탈리아의 기젤라(하인리히 1세의 조모, 작센 공작 리우돌프의 아내)의 생모",
    ] },
  { "title" = "기타", "paragraphs" = [
      "보통의 작품에서 로타르 1세는 야심이 없는 인물, 부정적인 인물로 묘사된다. 이런 평판은 로타르의 형제들인 루트비히 독일인 측이나 대머리 카를 2세 측에서 나왔다는 견해가 있다.",
      "1817년 7월 프랑스의 극작가이자 오페라 작사가 히풀리테 비스(Hippolyte Bis), 프랑수아 헤이 등이 공동으로 작성한 한 작품의 3막의 및 구절에 비극적인 일이며, 색마인 로타르가 자신의 그의 아버지 경건왕 루트비히의 돈으로 권력을 잡은 것처럼 묘사되었다.",
    ] },
]

[articles.vi]
text = "Lotharius I (tiếng Pháp: Lothaire Ier, tiếng Đức: Lothar I., tiếng Ý: Lotario I; 795 - 29 tháng 9 năm 855) là một Hoàng đế La Mã Thần thánh (817–855), Lãnh chúa Bavaria (815–817), vua Ý (818–855) và Trung Francia (840–855). Lotharius là trưởng nam của Hoàng đế Ludovicus Pius nhà Carolus và chính thất Ermengarde xứ Hesbaye, con gái của công tước Ingerman xứ Hesbaye."
title = "Lothaire I"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Lothaire_I"
intro = [
  "Lotharius I (tiếng Pháp: Lothaire Ier, tiếng Đức: Lothar I., tiếng Ý: Lotario I; 795 - 29 tháng 9 năm 855) là một Hoàng đế La Mã Thần thánh (817–855), Lãnh chúa Bavaria (815–817), vua Ý (818–855) và Trung Francia (840–855). Lotharius là trưởng nam của Hoàng đế Ludovicus Pius nhà Carolus và chính thất Ermengarde xứ Hesbaye, con gái của công tước Ingerman xứ Hesbaye. Có đôi lần cùng các anh em ruột là Pippinus xứ Aquitania và Ludovicus xứ Germania đã nổi dậy phản đối quyết định của phụ hoàng Ludovicus Pius ban cho người em cùng cha khác mẹ là Carolus xứ Alemannia quyền đồng thừa kế các lãnh thổ người Frank. Sau khi vua cha băng hà, Carolus và Ludovicus lại cùng nhau hợp lực chống lại Lotharius trong một cuộc nội chiến kéo dài ba năm (840–843). Cuộc chiến huynh đệ tương tàn đã trực tiếp dẫn đến sự sụp đổ của Đế chế Francia do ông nội Carolus Magnus gây dựng, đặt nền móng cho sự hình thành của các nước Pháp và Đức hiện đại.",
]
sections = [
  { "title" = "Những năm đầu đời và trị vì", "paragraphs" = [
      "Lotharius sinh năm 795, là con trai của Ludovicus Pius và Ermengarde xứ Hesbaye. Cha ông là con trai của Hoàng đế đang trị vị thời đó, Carolus Magnus. Người ta biết rất ít về cuộc sống ban đầu của Lotharius, có lẽ ông đã trưởng thành từ triều đình của ông nội Carolus Magnus. Năm 814, Carolus Magnus qua đời và để lại đứa con trai hợp pháp duy nhất còn sống sót Ludovicus Pius làm người kế vị đế chế rộng lớn của mình. Năm sau, Lotharius sẽ được phái đến cai quản Bavaria thay mặt cho cha mình, tân hoàng đế. Năm 817, Ludovicus Pius đã ra sắc chỉ Ordinatio Imperii. Cũng trong thời gian đó, Ludovicus đã chỉ định Lotharius là người thừa kế chính của mình và ra lệnh rằng Lotharius sẽ là người thừa kế của hai người con trai nhỏ của ông là Pippinus (20 tuổi) và Ludovicus (13 tuổi), cũng như cháu trai (anh em họ của Lotharius) là Bernardus, trong trường hợp những người này qua đời mà không có con. Lotharius, 22 tuổi, sau đó được trao vương miện chung bởi cha mình tại Aachen. Đồng thời, các xứ Aquitania và Bavaria được trao tương ứng cho anh em Pippinus và Ludovicus, như là những vương quốc vệ tinh. Sau khi ý định ly khai bị bại lộ, Bernardus đã bị Ludovicus diệt trừ. Xứ Italia được nhập vào lãnh thổ của Lotharius.Năm 821, Lotharius kết hôn với Ermengarde (mất 851), con gái của Hugh, Công tước xứ Tours.",
      "Năm 822, ông đến tiếp nhận ngai vị của xứ Italia vào lễ Phục sinh. Ngày 5 tháng 4 năm 823, ông lại lên ngôi hoàng đế bởi Giáo hoàng Pascalê I, lần này tại Roma. Vào tháng 11 năm 824, Lotharius ban hành một đạo luật, Constitutio Romana, liên quan đến mối quan hệ của giáo hoàng và hoàng đế dành quyền lực tối cao cho thế lực thế tục, và sau đó ông đã ban hành nhiều sắc lệnh khác nhau cho chính phủ tốt của Italia.",
      "Khi Lotharius quay lại triều đình của cha mình, mẹ kế Judith đã giành được sự đồng ý của ông đối với kế hoạch bảo vệ vương quốc cho con trai Carolus, một kế hoạch được thực hiện vào năm 829, khi hoàng tử trẻ được trao xứ Alemannia để cai trị. Lotharius, tuy nhiên, đã sớm thay đổi thái độ và trải qua thập kỷ tiếp theo trong cuộc xung đột liên tục về việc chia rẽ Đế chế với cha mình. Ông là chủ nhân của Đế quốc, và bị trục xuất và giam cầm tại Ý, trong một lần cầm vũ khí liên minh với anh em của ông và tại một cuộc chiến khác chống lại họ, trong khi giới hạn của vương quốc được chỉ định của ông lần lượt được mở rộng và giảm bớt.",
    ] },
  { "title" = "Gia đình", "paragraphs" = [
      "Louis II (825–875) Lên ngôi vua Ý năm 844 bỏi Giáo hoàng Sergius II. Trở thành hoàng đế năm 850. Cưới Engelberga.",
      "Bertha (c. 830–852)Kết hôn với một người đàn ông lạ mặt, nhưng sau đó là Nữ tu viện trưởng xứ Avenay.",
      "Lothair II (835–869) Kế vị cha mình. Cưới Teutberga, con gái của Boso the Elder, con gái của Bá tước xứ Arles.",
    ] },
  { "title" = "Cái chết và hậu quả", "paragraphs" = [
      "Năm 855, ông bị bệnh nặng và tuyệt vọng phục hồi đã từ bỏ ngai vàng, chia đất đai giữa ba người con trai vào ngày 23 tháng 9, vào tu viện Prüm, nơi ông qua đời sáu ngày sau đó. Ông được chôn cất tại Prüm, nơi tìm thấy hài cốt của ông vào năm 1860. Chính tại Prüm, Lotharius được tưởng niệm nhiều nhất.",
      "Cùng năm đó, vương quốc của Lotharius bị chia rẽ giữa ba người con trai của ông trong một thỏa thuận được gọi là Hiệp ước Prüm: người lớn nhất, Ludovicus II, nhận được xứ Italia và danh hiệu hoàng đế; người thứ hai, Lotharius II, nhận được xứ Lotharingia; người trẻ nhất, Carolus II, nhận được xứ Provincia.",
    ] },
]

[articles.id]
text = "Lothaire I atau Lothar I (Jerman: Lothar, Prancis: Lothaire, Italia: Lotario) (795 – 29 September 855) merupakan Kaisar Romawi (817–55), rekan-pemimpin dengan ayahandanya sampai tahun 840, dan Raja Bayern (815–17), Italia (818–55) dan Francia Tengah (840–55). Wilayah tersebut yang disebut Lotharingia (Lorraine di dalam bahasa Prancis dan Inggris) dinamakan sepertinya."
title = "Lothair I"
lang = "id"
url = "https://id.wikipedia.org/wiki/Lothair_I"
intro = [
  "Lothaire I atau Lothar I (Jerman: Lothar, Prancis: Lothaire, Italia: Lotario) (795 – 29 September 855) merupakan Kaisar Romawi (817–55), rekan-pemimpin dengan ayahandanya sampai tahun 840, dan Raja Bayern (815–17), Italia (818–55) dan Francia Tengah (840–55). Wilayah tersebut yang disebut Lotharingia (Lorraine di dalam bahasa Prancis dan Inggris) dinamakan sepertinya.",
]
sections = [
  { "title" = "Kehidupan", "paragraphs" = [
      "Lothaire merupakan putra sulung Kaisar Karoling, Ludwig yang Saleh dan istrinya Ermengarde dari Hesbaye, putri Ingram, adipati Hesbaye. Ia memimpin saudara-saudaranya Pippin I dari Aquitaine dan Ludwig si Jerman memberontak melawan ayahanda mereka di beberapa peristiwa, untuk menentang upaya-upayanya menjadikan saudara tiri mereka Karl yang Botak sebagai calon ahli waris wilayah Franka. Setelah kematian ayahanda mereka, Karl dan Ludwig menggabungkan pasukan mereka melawan Lothaire di dalam perang saudara selama 3 tahun (840-843), pertikaian di antara bersaudara tersebut menghancurkan Kerajaan Franka yang hebat yang dibangun oleh kakek mereka Charlemagne, dan meletakkan dasar untuk perkembangan negara Prancis dan Jerman modern.",
      "Tidak banyak yang diketahui tentang kehidupan awal Lothair, ia diduga dibesarkan di istana kakeknya Charlemagne. Tak lama setelah ayahandanya naik takhta, ia dikirim untuk memerintah Bayern. Lothair awalnya muncul di dalam sejarah pada tahun 817, ketika Ludwig yang Saleh membuat Ordinatio Imperii. Di dalamnya, Ludwig menunjuk Lothair sebagai ahli waris utamanya, kepada siapa adik-adiknya Pippin I dari Aquitaine dan Ludwig si Jerman, juga keponakannya Bernhard dari Italia, akan diberlakukan setelah kematian ayahanda mereka; ia juga akan mewariskan wilayah-wilayah mereka yang meninggal tanpa keturunan. Lothaire kemudian dimahkotai sebagai rekan-kaisar oleh ayahandanya di Aix-la-Chapelle. Pada waktu yang sama, Aquitaine dan Bayern diberikan kepada saudara-saudaranya Pippin dan Ludwig masing-masing sebagai anak kerajaan. Setelah pembunuhan Bernhard, Raja Italia, oleh Ludwig yang Saleh, Lothaire juga menerima Kerajaan Italia. Pada tahun 821, ia menikahi Irmingard (meninggal 851), putri Hugues III, Comte Tours. Pada tahun 822, ia menjamankan pemerintahan Italia, dan pada Hari Paskah, tanggal 5 April 823, ia dimahkotai sebagai kaisar sekali lagi oleh Paus Paskalis I, kali ini di Roma.",
      "Pada bulan November 824, ia mengumumkan secara resmi undang-undang, Constitutio Romana, mengenai hubungan paus dan kaisar yang melindungi kekuasaan tertinggi untuk penguasa sekuler, dan ia kemudian mengeluarkan berbagai peraturan untuk pemerintah yang baik di Italia.",
    ] },
  { "title" = "Keluarga", "paragraphs" = [
      "Ludwig II (825-875) Dimahkotai sebagai Raja Italia pada tahun 844 oleh Paus Sergius II. Dimahkotai sebagai Kaisar pada tahun 850. Menikahi Engelberga.",
      "Ermengarde (sekitar 825-849) Nama yang diberikan kepada putri tak bernama yang diculik dan dinikahi oleh Giselbert dari Maasgau",
      "Berthe (sekitar 830-852) menikah dengan seorang pria yang tidak diketahui, namun kemudian menjadi Kepala Biarawati Avenay.",
    ] },
  { "title" = "Referensi", "paragraphs" = [
      "Nithard, Historiarum Libri, both in the Monumenta Germaniae Historica Scriptores, Bände i. and ii. (Hanover and Berlin, 1826 fol.)",
      "B. Simson, Jahrbücher des deutschen Reiches unter Ludwig dem Frommen (Leipzig, 1874–1876)",
    ] },
]

[articles.pt]
text = "Lotário I (em latim: Lotharius; 795 – Prüm, 29 de setembro de 855) foi o terceiro Imperador dos Romanos, além de Rei da Itália e Rei da Média Frância. Era o filho mais velho de Luís I, o Piedoso e de Ermengarda de Hesbaye, filha de Ingermano de Hesbaye e de Edviges da Baviera da Casa de Etichonen, duque de Hesbaye."
title = "Lotário I"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Lot%C3%A1rio_I"
intro = [
  "Lotário I (em latim: Lotharius; 795 – Prüm, 29 de setembro de 855) foi o terceiro Imperador dos Romanos, além de Rei da Itália e Rei da Média Frância. Era o filho mais velho de Luís I, o Piedoso e de Ermengarda de Hesbaye, filha de Ingermano de Hesbaye e de Edviges da Baviera da Casa de Etichonen, duque de Hesbaye. Casou com Ermengarda de Tours, filha de Hugo III de Tours.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Pouco se sabe dos seus primeiros anos, provavelmente passados na corte do seu avô Carlos Magno, até 815, quando se tornou rei da Baviera. Quando, em 817, o seu pai dividiu o império entre os seus filhos, Lotário foi coroado co-imperador em Aquisgrano. Igualmente reconhecido como rei dos Francos, Lotário I é enviado em Itália, onde ele assume em 820 ou 822 o título de rei dos Lombardos, e instala-se em Pavia. Em 821, casou-se com Ermengarda (falecida em 851), filha de Hugo, conde de Tours; em 822 ele assumiu o título de Rei de Itália e, a 5 de abril de 823, foi coroado Imperador Romano-Germânico pelo papa Pascoal I em Roma.",
      "Em novembro de 824, ele promulgou uma lei regulando as relações entre papa e imperador, que reservavam para este o supremo poder secular e, a seguir, emitiu várias ordens para o bom governo da Itália.",
      "Quando Luís I estava no leito de morte, em 840, enviou as insígnias imperiais para Lotário que, ignorando os desejos de seu pai, se proclamou chefe de todo o império. Falhadas as negociações com os seus irmãos Luís o Germânico e Carlos o Calvo, estes pegaram em armas em conjunto. A batalha decisiva teve lugar em Fontenoy, a 25 de junho de 841 e Lotário teve que fugir para Aix. Finalmente, levando consigo todos os bens que conseguiu, Lotário abandonou a sua capital.",
    ] },
  { "title" = "Relações familiares", "paragraphs" = [
      "Foi filho de Luís I, o Piedoso e de Ermengarda de Hesbaye (780–Angers, 3 de outubro de 818), filha de Ingermano de Hesbaye e de Edviges da Baviera. Casou em 821 com Ermengarda de Tours, filha de Hugo III de Tours (765–20 de outubro de 837 e de Eva de Auxerre, de quem teve:",
      "Luís II da Germânia o Jovem (825–875), Imperador Romano-Germânico (governante sozinho em 855 – 875), primogênito do imperador Lotário I, tornou-se Rei da Itália em 839, e passou a residir ali, sendo coroado rei em Roma pelo papa Sérgio II em 15 de junho de 854. Casou-se com Engelberga de Espoleto;",
      "Ermengarda da Germânia (c. 825–849), casada com Giselberto de Maasgau e Darnau, Conde da Maasgau;",
    ] },
]

