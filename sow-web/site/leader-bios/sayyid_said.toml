[articles.en]
text = "Sayyid Said bin Sultan was Sultan of Muscat and Oman, the fifth ruler of the Al Bu Said dynasty from 1804 to 4 June 1856. His rule began after a period of conflict and internecine rivalry of succession that followed the death of his father, Sultan bin Ahmad, in November 1804."
title = "Said bin Sultan"
lang = "en"
url = "https://en.wikipedia.org/wiki/Said_bin_Sultan"
intro = [
  "Sayyid Said bin Sultan (Arabic: سعيد بن سلطان, Saʿīd bin Sulṭān, Swahili: Saïd bin Sultani) (5 June 1791 – 19 October 1856) was Sultan of Muscat and Oman, the fifth ruler of the Al Bu Said dynasty from 1804 to 4 June 1856. His rule began after a period of conflict and internecine rivalry of succession that followed the death of his father, Sultan bin Ahmad, in November 1804. He is regarded as one of the greatest Omani sultans.",
  "Said's uncle Qais bin Ahmad finally agreed to Said's primacy after Said had killed his cousin, Badr bin Saif, a pretender to the throne. Said is noted for moving his capital to Zanzibar, where it remained during the time when the Omani Empire reached the zenith of its power and wealth.",
]
sections = [
  { "title" = "Early years", "paragraphs" = [
      "Said bin Sultan was son of Sultan bin Ahmad, who ruled Oman from 1791 to 1804. Sultan bin Ahmad died in 1804 on an expedition to Basra. He appointed Mohammed bin Nasir bin Mohammed al-Jabry as the Regent and guardian of his two sons, Salim bin Sultan and Said bin Sultan. Sultan's brother Qais bin Ahmad, the ruler of Sohar, decided to attempt to seize power. Early in 1805 Qais and his brother Mohammed marched south along the coast to Muttrah, which he easily captured. Qais then started to besiege Muscat. Mohammed bin Nasir tried to bribe Qais to leave, but did not succeed.",
      "After a series of engagements, Qais was forced to retire to Sohar. Badr bin Saif became the effective ruler.",
      "To get his wards out of the way, Badr bin Saif made Salim bin Sultan governor of al Maṣna'ah on the Batinah coast and Said bin Sultan governor of Barka.",
    ] },
  { "title" = "Sultan", "paragraphs" = [
      "Said bin Sultan became the sole ruler of Oman, apparently with the consent of his brother. Their aunt, the daughter of the Sultan Sultan bin Ahmad, seems to have influenced this decision.",
      "In 1820, he launched a punitive expedition against the Bani Bu Ali with the assistance of the East India Company. It was defeated, but the following year a larger Company force returned and defeated the tribe.",
      "In 1835, he ratified a treaty with the United States on very favorable terms, that had been negotiated by Edmund Roberts at Muscat on 21 September 1833, and returned by USS Peacock.",
    ] },
  { "title" = "Children", "paragraphs" = [
      "Sultan bin Said Al Busaidi (c. 1815–1851): an alcoholic, according to Ruete (Ch. 15), he left three sons, Saud, Faisal, and Muhammed",
      "Thuwaini bin Said Al Busaidi (also called Tueni) (−1866): Sultan of Muscat and Oman, 1856–1866",
      "Mohammed bin Said Al Busaidi (1826–1863): he \"...was considered the most pious of our entire family.... cared little for the world and worldly goods.... possessed by... antipathy against Zanzibar\" (Ch. 14, Ruete); he lived most of his life in Oman; father of Hamoud bin Mohammed, Sultan of Zanzibar.",
    ] },
]

[articles.it]
text = "Saʿīd bin Sulṭān bin Sulṭān (in arabo سعيد بن سلطان‎?; Mascate, 1791 – Seychelles, 19 ottobre 1856) è stato sultano di Mascate e Oman dal 1804 al 1856."
title = "Sa'id bin Sultan"
lang = "it"
url = "https://it.wikipedia.org/wiki/Sa%27id_bin_Sultan"
intro = [
  "Saʿīd bin Sulṭān bin Sulṭān (in arabo سعيد بن سلطان‎?; Mascate, 1791 – Seychelles, 19 ottobre 1856) è stato sultano di Mascate e Oman dal 1804 al 1856.",
]
sections = [
  { "title" = "Primi anni", "paragraphs" = [
      "Sa'id bin Sultan nacque a Mascate nel 1791 ed era il figlio primogenito del sultano Sultan bin Ahmad e di Sayyida Ghanneyeh bint Sayf Al Al Bu Sa'idi.",
      "Il padre nel 1804 fu ucciso dai pirati mentre guidava una spedizione contro di essi a Bassora. In precedenza aveva nominato Mohammed bin Nasir bin Mohammed al-Jabry come reggente e custode dei suoi due figli, Salim e Sa'id. Il fratello di Sultan, Qais bin Ahmad, governatore di Sohar, decise di tentare di impadronirsi del potere. All'inizio del 1805 Qais e suo fratello Mohammed marciarono verso sud lungo la costa fino a Matrah, che catturò facilmente. Qais iniziò quindi ad assediare Mascate. Mohammed bin Nasir provò a corrompere Qais perché se ne andasse ma non ci riuscì.",
      "Mohammed bin Nasir chiese aiuto a Badr bin Sayf. Dopo una serie di scontri, Qais fu costretto a ritirarsi a Sohar. Badr bin Sayf divenne il sovrano effettivo. Alleato con i wahhabiti, Badr divenne sempre più impopolare. Per allontanare legittimi eredi, Badr nominò Salim governatore di Al Maşna'ah, sulla costa della Batina, e Sa'id governatore di Barka'.",
    ] },
  { "title" = "Regno", "paragraphs" = [
      "Sa'id bin Sultan divenne l'unico sovrano, apparentemente con il consenso di suo fratello. La loro zia, la figlia dell'imam Ahmed bin Sa'id, sembra che abbia influenzato questa decisione.",
      "Nel 1820, lanciò una spedizione punitiva contro la tribù Bani Bu Ali con l'assistenza della Compagnia britannica delle Indie orientali. Fu sconfitto, ma l'anno seguente tornò con una più grande forza della Compagnia e sconfisse la tribù.",
      "Il 22 settembre 1822 firmò con gli inglesi il trattato di Moresby. Esso rese illegale la vendita di schiavi alle potenze cristiane.",
    ] },
  { "title" = "Figli", "paragraphs" = [
      "Sayyid Hilāl bin Saʿīd Al Saʿīd (c.1815-1851) alcolista, secondo Ruete (Cap. 15). Lasciò tre figli: Suʿūd, Fayṣal e Muḥammad.",
      "Sayyid Thuwayni bin Saʿīd Āl Saʿīd (c. 1820/1-1866), sultano di Muscat e Oman, 1856-1866 (detto anche Tueni)",
      "Sayyida Khawla di Zanzibar e Oman (m. 1875), figlia di una donna mesopotamica (Ruete, cap. 15)",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "George Percy Badger, Reports from Committees, Great Britain. Parliament. House of Commons, 1871. URL consultato il 19 novembre 2013.",
      "Walter Barrett, Merchant Descriptions Chapter 10, in The Old Merchants of New York City, Brooklyn Genealogy Information Page, Second series, n. 1863, The Brooklyn Information Page, 9 maggio 2012, Schuyler Livingston. URL consultato l'8 maggio 2012 (archiviato dall'url originale il 4 giugno 2012).",
      "Christopher Buyers, Oman, in The Al-Busaid Dynasty > Genealogy, The Royal Ark, agosto 2001. URL consultato il 30 marzo 2012.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Seyyid Said ibn Sultan, in Dizionario di storia, Istituto dell'Enciclopedia Italiana, 2010.",
      "(EN) Greville Stewart Parker Freeman-Grenville, Saʿīd ibn Sulṭān, su Enciclopedia Britannica, Encyclopædia Britannica, Inc.",
    ] },
]

[articles.ar]
text = "سعيد بن سلطان بن أحمد بن سعيد البوسعيدي (1204 هـ - 1791 / 1273 هـ - 1856) كان سلطان سلطنة مسقط وعمان."
title = "سعيد بن سلطان البوسعيدي"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%B3%D8%B9%D9%8A%D8%AF_%D8%A8%D9%86_%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D8%A8%D9%88%D8%B3%D8%B9%D9%8A%D8%AF%D9%8A"
intro = [
  "سعيد بن سلطان بن أحمد بن سعيد البوسعيدي (1204 هـ - 1791 / 1273 هـ - 1856) كان سلطان سلطنة مسقط وعمان.",
]
sections = [
  { "title" = "ولادته", "paragraphs" = [
      "ولد في (ولاية سمائل)، وقيل في بلدة (الغبرة) في العاصمة مسقط سنة 1204 هـ - الموافق حوالي 1791. وقيل وفاته في عام 1856 م قام والده السيد سلطان بن أحمد بتعيين محمد بن ناصر الجابري وصيا على ابنيه، سالم بن سلطان وكان يبلغ من العمر (15) عاما، وسعيد كان له من العمر (13) عاما، وفي هذه الأثناء قام عمهما قيس بن أحمد حاكم صحار بمحاولة للاستيلاء على السلطة في عمان، فاجتمعت الأسرة البوسعيدية وشاركت في الاجتماع السيدة موزة بنت الإمام أحمد وأقر هذا الاجتماع طلب المساعدة من السيد بدر بن سيف بن الإمام أحمد والذي كان متواجدا في الدرعية «عاصمة الدولة السعودية الأولى» بعد هربه من عمان على اثر فشل الانقلاب الذي قام به ضد السيد سلطان بن أحمد عام 1803 م، وعندما وصلت الدعوة إلى بدر من الوصي محمد بن ناصر فأنه سرعان ما توجه إلى مسقط ليمسك بزمام الأمور هناك، وقد استمر بدر بن سيف الحاكم الفعلي لعمان لمدة عامين حتى انتهى عهده بعد سقوطه صريعا على يد السيد الشاب سعيد بن سلطان بعد مبارزة رسمية بالسيف جرت بينهما في ولاية بركاء.",
    ] },
  { "title" = "توليه للحكم", "paragraphs" = [
      "تولى السيد سعيد بن سلطان مقاليد الحكم عام 1806، وقد اتسع النفوذ العماني في عهده إلى أقصى مداه، حيث امتدت الإمبراطورية العمانية من بندر عباس على ضفاف الخليج العربي إلى ميناء زنجبار على الساحل الشرقي لإفريقيا، بالإضافة إلى بعض الجزر الواقعة في منطقة الخليج وبحر العرب والمحيط الهندي بما فيها أرخبيل جزر القمر.",
      "وفي عهده ازدهرت الحياة الاقتصادية، وتعايشت الأجناس من عرب وأفارقة وآسيويين وغيرهم تعايشا حسنا، وقد كان مفهوم الاقتصاد في عهد السيد سعيد بن سلطان يعتمد على تنمية حرية التجارة مع مختلف الشعوب دون تمييز، حيث بنى أسطولا تجاريا ضخما تسانده قوة بحرية فتية، توطيداً للعلاقات التجارية المتميزة مع كل من (الصين) و(شرق آسيا) و(الهند) و(سيلان) و(إيران) وغيرها من الدول.",
    ] },
  { "title" = "علاقاته الخارجية", "paragraphs" = [
      "تم إجراء اتفاقية مع الولايات المتحدة الأمريكية في عام 1833م، ثم أرسل السلطان سعيد بن سلطان سفينة عمانية (السلطانة) إلى الولايات المتحدة الأمريكية في عهد الرئيس أندرو جاكسون وكانت تنقل أول سفير عماني في تلك البلاد وهو أحمد بن النعمان الكعبي ويعتبر أول مبعوث عربي يصل إلى هناك.",
      "وقد أشاد معظم الباحثين بالسياسة الحكيمة والمتزنة التي انتهجها السلطان سعيد بن سلطان حيث عقد اتفاقيات مع 22 دولة وتبادل الرسائل مع 33 دولة، وكان يعامل الدول الأخرى بمبدأ المعاملة بالمثل، ونأى بنفسه عن التورط في المشاكل الدولية، ومن ذلك رفضه تلبية طلب خديوي مصر آنذاك لمشاركته في حروبه ضد الدول المجاورة.",
      "ظهرت مصلحة مشتركة بين بريطانيا متمثلة في شركة الهند الشرقية البريطانية وبين سلطان عمان السيد سعيد بن سلطان، فمن ناحية كان من مصلحة سعيد بن سلطان الاعتماد على الشركة في معاملاته معها درءاً للأخطار التي كانت تحدق به من جيرانه القواسم والدولة السعودية الأولى. وشب قتال بينه وبين بعـض عمال الإمام سعود بن عبد العزيز، فبايع للإمام سعود، وأصبحت مسقط وســـائر بـــلاد عمـــان تابعـــه للدولة السعودية الأولى سنة 1223هـ/1808م، ونقــض عهـــده ســـنة 1224 هـ /1809م، فاستنجد بالإنجليز، واستعان ببعض مراكبهم، وتجدد القتال بينـه وبـين مجاوريـه مـن عمـال الإمام سعود. ثم استعان بحكومة إيران سنة 1225هـ / 1810م، وقاتلهم وازم. وعـاد فأصـلح بعـض أمـره. وعقـد معاهـدة تجاريـة مـع بريطانيـا سـنة 1225هــ / 1810م، كمـا عقـد معاهـدتين مـع الفرنسـيين عـام 1225- 1226هــ / 1810-",
    ] },
  { "title" = "العصر الذهبي", "paragraphs" = [
      "يعتبر المؤرخون أنّ فترة السيد سعيد بن سلطان هي الفترة الذهبية في التاريخ العماني لاعتبارات مهمة منها:",
      "2- المركز المرموق الذي احتله السلطان سعيد في المجال الدولي، والاحترام الذي كان يتميز به بين حكام أوروبا وآسيا وأفريقيا والولايات المتحدة الأمريكية في ذلك العصر هذا بالإضافة إلى شعبيته الواسعة بين أفراد شعبه.",
      "3- استقرار الحكم العماني، رغم المطامع والمؤامرات الأجنبية، ففي الوقت الذي كانت الصراعات العربية- العربية مستمرة على سواحل الخليج العربي، وفي شبه الجزيرة العربية، فضلا عن التنافس الشديد بين المطامع البريطانية والفرنسية والفارسية استطاع السيد سعيد المحافظة على استقلال بلاده بتوازن دقيق مستخدما الدبلوماسية أكثر من القوة العسكرية من أجل الوصول إلى أهدافه.",
    ] },
]

[articles.ru]
text = "Саид ибн Султан, также известен как Сеид Саид (5 июня 1791, Сумайль, Оман — 19 октября 1856, около острова Маэ, Сейшельские острова) — с 1804 года до своей смерти сеид Маската, имам Маската и Омана, а также султан Маската, Омана и Занзибара. Перенёс свою столицу из Омана в Занзибар."
title = "Саид ибн Султан"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%A1%D0%B0%D0%B8%D0%B4_%D0%B8%D0%B1%D0%BD_%D0%A1%D1%83%D0%BB%D1%82%D0%B0%D0%BD"
intro = [
  "Саид ибн Султан, также известен как Сеид Саид (5 июня 1791, Сумайль, Оман — 19 октября 1856, около острова Маэ, Сейшельские острова) — с 1804 года до своей смерти сеид Маската, имам Маската и Омана, а также султан Маската, Омана и Занзибара. Перенёс свою столицу из Омана в Занзибар. После смерти Сеида Саида султанат распался на два независимых государства — Оман и Занзибар.",
]
sections = [
  { "title" = "Деятельность", "paragraphs" = [
      "После гибели своего отца, Султана ибн Ахмеда, 20 ноября 1804 года во время военной экспедиции против Пиратского Берега, Саид ибн Султан стал сеидом Маската. Первоначально он был формальным соправителем вместе со своим братом Селимом, но, так как Саиду было всего тринадцать лет, его дядя Бадр ибн Сайф стал регентом. После смерти Бадра ибн Саифа 31 июля 1806 года старшая сестра Саида, сеида Аиша ибн Султан, стала исполнять обязанности регента. 14 сентября 1806 года Саид ибн Султан был единолично назначен султаном Маската, Омана и Занзибара.",
      "При Саиде ибн Султане Оманский султанат достиг своего расцвета и включал, кроме собственно Омана и территорий на востоке Аравийского полуострова (современные Бахрейн, Катар и Объединённые Арабские Эмираты), полосу земли (Зандж) вдоль побережья Восточной Африки в современных Мозамбике, Танзании, Кении и Сомали, с городами Момбаса и Дар-эс-Салам, побережье Оманского залива с городом Ормуз, острова Индийского океана, включая Занзибар, а также северо-западное побережье Мадагаскара. Северный берег Оманского залива был включен в состав Омана в результате династических браков, устроенных Саидом. При помощи Великобритании Саиду ибн Султану также удалось существенно уменьшить размах пиратства в Персидском заливе. Платой за это, впрочем, стало существенное усиление роли Британии в делах Омана, что много позже привело в конечном счёте к вхождению Омана и Занзибара в Британскую империю. Саид вёл войны с ваххабитами за контроль востока Аравийского полуострова. В 1822 году он подписал с Великобританией договор Морсби, согласно которому была прекращена работорговля между Оманом и всеми европейскими государствами.",
      "После этого Саид сконцентрировался на увеличении влияния Омана в Восточной Африке. В 1829 году, завоевав Момбасу, он присоединил к Оману последнее независимое торговое государство в регионе. Предположительно, он предложил королю Мадагаскара Ранавалуне I в жёны свою дочь, с тем, чтобы впоследствии Мадагаскар перешёл в подчинение Оману (Раваналуна отказался от предложения). Планы по захвату Коморских островов также провалились, когда в 1842 году правительница Мохели приняла протекторат Франции.",
    ] },
  { "title" = "Семья", "paragraphs" = [
      "У Саида были три старших жены, причём со второй и третьей он развёлся по обвинению в неверности. В его гареме суммарно (в разное время) находились 75 жён. От всех них у него было 26 сыновей и 21 дочь, при этом 36 детей пережили его самого. После смерти Саида два его сына, Тувайни ибн Саид и Маджид ибн Саид, вступили в борьбу за трон, и в результате Оман был разделён: Тувайни стал султаном Омана, а Маджид — султаном Занзибара. Три других его сына также были султанами Занзибара: Маджиду последовательно наследовали Баргаш ибн Саид, Халифа ибн Саид и Али ибн Саид.",
      "Дочь Саида Сеида Сальме вышла замуж за немецкого купца, приняла протестантизм и под именем Эмили Рюте опубликовала свои воспоминания («Воспоминания арабской принцессы из Занзибара») — первую известную автобиографию арабской женщины.",
    ] },
]

[articles.id]
text = "Sayyid Saïd bin Sultan al-Busaidi (bahasa Arab: سعيد بن سلطان, Saʿīd bin Sulṭān, bahasa Swahili: Saïd bin Sultani) (5 Juni 1791 – 19 Oktober 1856) adalah Sultan Muskat dan Oman, penguasa kelima dari Dinasti Al Busaid dari tahun 1804 hingga 4 Juni 1856. Pemerintahannya dimulai setelah periode konflik dan persaingan suksesi internal setelah kematian ayahnya, Sultan bin Ahmad, pada bulan November 1804."
title = "Said bin Sultan, Sultan Muskat dan Oman"
lang = "id"
url = "https://id.wikipedia.org/wiki/Said_bin_Sultan%2C_Sultan_Muskat_dan_Oman"
intro = [
  "Sayyid Saïd bin Sultan al-Busaidi (bahasa Arab: سعيد بن سلطان, Saʿīd bin Sulṭān, bahasa Swahili: Saïd bin Sultani) (5 Juni 1791 – 19 Oktober 1856) adalah Sultan Muskat dan Oman, penguasa kelima dari Dinasti Al Busaid dari tahun 1804 hingga 4 Juni 1856. Pemerintahannya dimulai setelah periode konflik dan persaingan suksesi internal setelah kematian ayahnya, Sultan bin Ahmad, pada bulan November 1804. Ia sering disebut sebagai Singa Oman (أسد عمان), sebagai salah satu Sultan Oman.",
  "Paman Said Qais bin Ahmad akhirnya menyetujui suksesi Said setelah Said membunuh sepupunya, Badr bin Saif, yang berpura-pura naik takhta. Said terkenal karena memindahkan ibu kotanya ke Zanzibar, yang tetap menjadi ibu kotanya selama Kekaisaran Oman mencapai puncak kekuasaan dan kejayaannya.",
]
sections = [
  { "title" = "Masa muda", "paragraphs" = [
      "Said bin Sultan adalah putra Sultan bin Ahmad, yang memerintah Oman dari tahun 1792 hingga 1804. Sultan bin Ahmad meninggal pada tahun 1804 dalam ekspedisi ke Basrah. Dia menunjuk Muhammad bin Nasir bin Muhammad al-Jabri sebagai wali dari kedua putranya, Salim bin Sultan dan Said bin Sultan. Saudara laki-laki Sultan, Qais bin Ahmad, penguasa Sohar, memutuskan untuk mencoba merebut kekuasaan. Awal tahun 1805 Qais dan saudaranya Muhammad berbaris ke selatan sepanjang pantai menuju Muttrah, yang dengan mudah dia rebut. Qais kemudian mulai mengepung Muskat. Muhammad bin Nasir mencoba menyuap Qais agar pergi, tetapi tidak berhasil.",
