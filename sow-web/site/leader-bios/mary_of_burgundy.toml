[articles.en]
text = "Mary of Burgundy, nicknamed the Rich, was a member of the House of Valois-Burgundy, and ruler in her own right over much of the Valois-Burgundian lands, from 1477 to 1482. Her effective rule extended over major part of the Burgundian Netherlands, while she also claimed the rest of the Burgundian inheritance, including domains that were seized by her cousin, the French king Louis XI in 1477, such as the Duchy of Burgundy, the Free County of Burgundy and several other lands, both within the Kingdom of France and the Holy Roman Empire."
title = "Mary of Burgundy"
lang = "en"
url = "https://en.wikipedia.org/wiki/Mary_of_Burgundy"
intro = [
  "Mary of Burgundy (French: Marie de Bourgogne; Dutch: Maria van Bourgondië; 13 February 1457 – 27 March 1482), nicknamed the Rich, was a member of the House of Valois-Burgundy, and ruler in her own right (suo jure) over much of the Valois-Burgundian lands, from 1477 to 1482. Her effective rule extended over major part of the Burgundian Netherlands, while she also claimed the rest of the Burgundian inheritance, including domains that were seized by her cousin, the French king Louis XI in 1477, such as the Duchy of Burgundy, the Free County of Burgundy and several other lands, both within the Kingdom of France and the Holy Roman Empire.",
  "As the only child of Charles the Bold, ruler of the Valois-Burgundian State, and his wife Isabella of Bourbon, Mary became the heiress of Valois-Burgundian lands, and at the age of 19, upon the death of her father in the Battle of Nancy on 5 January 1477, she claimed the entire inheritance, being accepted as the new ruler in several domains. Her claims were not recognized by the French king Louis XI, who quickly seized various Valois-Burgundian domains, not only those that belonged to the French realm (such as the Duchy of Burgundy), but also some that belonged to the Holy Roman Empire (such as the Free County of Burgundy). Those disputes led to the War of the Burgundian Succession.",
  "In order to counter the appetites of the French king, she married Maximilian of Austria, son of the emperor Frederick III, thus securing the support of the Habsburgs in her struggle against the ambitions of Louis XI and his successors. This became a turning point in European politics, leading to a long French–Habsburg rivalry that would endure for centuries. Mary and Maximilian succeeded in securing much of the Burgundian Netherlands, but were not able to recapture domains already seized by the French king. After Mary's death in a riding accident in 1482, her domains, titles and claims were inherited by her young son Philip I the Handsome.",
]
sections = [
  { "title" = "Early years", "paragraphs" = [
      "Mary of Burgundy was born in Brussels at the ducal Palace of Coudenberg, to Charles the Bold, then known as the Count of Charolais, and his wife Isabella of Bourbon. Her birth, according to the court chronicler Georges Chastellain, was attended by a clap of thunder ringing from the otherwise clear twilight sky. Her godfather was Louis, Dauphin of France, in exile in Burgundy at that time; he named her for his mother Marie of Anjou. Reactions to the child's birth were mixed: the baby's grandfather, Duke Philip the Good, was unimpressed, and \"chose not to attend the [baptism] as it was only for a girl\", whereas her grandmother Isabella of Portugal was delighted at the birth of a granddaughter. Her illegitimate aunt Anne was assigned to be responsible for Mary's education and assigned Jeanne de Clito to be her governess. Jeanne remained a friend to Mary later in life and was one of her most constant companions.",
    ] },
  { "title" = "Heir presumptive", "paragraphs" = [
      "Philip the Good died in 1467 and Mary's father assumed control of the Burgundian State. Since her father had no living sons at the time of his accession, Mary became his heir presumptive. Her father controlled a vast and wealthy domain made up of the Duchy of Burgundy, the Free County of Burgundy, and the majority of the Low Countries. As a result, her hand in marriage was eagerly sought by a number of princes. The first proposal was received by her father when she was only five years old, in this case to marry the future King Ferdinand II of Aragon. Later she was approached by Charles, Duke of Berry; his older brother, King Louis XI of France, was intensely annoyed by Charles's move and attempted to prevent the necessary papal dispensation for consanguinity.",
      "As soon as Louis succeeded in producing a male heir who survived infancy, the future King Charles VIII of France, Louis wanted him to be the one to marry Mary, even though he was thirteen years younger than Mary. Nicholas I, Duke of Lorraine, was nine years older than Mary and controlled a duchy that lay alongside Burgundian territory, but his plan to combine his domain with hers was ended by his death in 1473 (he started having stomach pains three days before his death; poison was suspected). Another suitor was George Plantagenet, Duke of Clarence (supported by his sister Margaret of York, Mary's stepmother), but his brother Edward IV, King of England, prevented the match for both political and personal reasons (he initially wanted to support his brother-in-law Anthony Woodville). The king's move angered the duke, who seemed to lose control and restarted conflicts with his brother, which ultimately led to his death.",
    ] },
  { "title" = "Reign", "paragraphs" = [
      "Mary assumed the rule of her father's domains upon his defeat in battle and death on 5 January 1477. In addition to the Duchy and County of Burgundy, her territories included the duchies of Limburg, Brabant, Luxembourg, and the counties of Namur, Holland, Hainaut. King Louis XI of France seized the opportunity to attempt to take possession of the Duchy of Burgundy proper and also the regions of Franche-Comté, Picardy, and Artois.",
      "She called on her people to stay loyal to the house of Burgundy (there are still extant letters that Mary wrote to the Duchy of Burgundy and Arras asking for their support). Louis XI took over Arras, but the people refused to submit without her approval. Eighteen burgesses were decapitated by the king as they were discovered trying to go to see her. He ordered a mass expulsion and renamed the town Franchise.",
      "The king of France was anxious that Mary should marry his son Charles and thus secure the inheritance of the Low Countries for his heirs, by force of arms if necessary. By February 1477, neither her advisors nor the States General imagined that they could resist the French army. Chancellor Hugonet led a delegation to discuss the prospect of Mary's marriage to the six-year-old Dauphin (later King Charles VIII). The negotiation ended in failure as Louis XI demanded unacceptable terms, including the surrender of the Duchy of Burgundy and the French territories acquired by Philip the Good and Charles the Bold. The king then betrayed her secret letters to the burghers of Ghent, who then seized two men who were named in those letters – Hugonet and the Sire d'Humbercourt, two of her father's most influential councilors, and despite her pleadings, executed them on 3 April 1477. They then took away her other advisors too. Koenigsberger suspects that Louis XI might have forged the letters.",
    ] },
  { "title" = "Death and legacy", "paragraphs" = [
      "In 1482, a falcon hunt in the woods near Wijnendale Castle was organised by Adolph of Cleves, Lord of Ravenstein, who lived in the castle. Mary loved riding and was hunting with Maximilian and knights of the court when her horse tripped, threw her in a ditch, and then landed on top of her, breaking her back. She died several weeks later on 27 March from internal injuries, having made a detailed will. She was buried in the Church of Our Lady in Bruges on 3 April 1482. She was pregnant.",
      "Maximilian was devastated. She had initially hidden the extent of her injury to calm him down. When he continued to display uncontrollable grief, she had to force him out of her chamber so that she could discuss matters of the state with her nobles, concerning which she asked them to keep their loyalty oath to him and their children. Maximilian was not present when she said her last words.",
      "The bankrupted court honoured her with a glorious funeral, as Maximilian melted down the silverware for the occasion.",
    ] },
]

[articles.es]
text = "María de Borgoña (Bruselas, Flandes, 13 de febrero de 1457-Brujas, 27 de marzo de 1482), duquesa de Borgoña, fue la esposa de Maximiliano I, emperador del Sacro Imperio Romano, y madre de Felipe el Hermoso."
title = "María de Borgoña"
lang = "es"
url = "https://es.wikipedia.org/wiki/Mar%C3%ADa_de_Borgo%C3%B1a"
intro = [
  "María de Borgoña (Bruselas, Flandes, 13 de febrero de 1457-Brujas, 27 de marzo de 1482), duquesa de Borgoña, fue la esposa de Maximiliano I, emperador del Sacro Imperio Romano, y madre de Felipe el Hermoso.",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "Como hija única del último duque de Borgoña, Carlos el Temerario y de su segunda esposa Isabel de Borbón, heredó el ducado de su padre, a los veinte años, tras la muerte de este en la batalla de Nancy. La pretensión francesa por los territorios de los Países Bajos hizo que el rey Luis XI ocupara el condado de Borgoña o el propio ducado de Borgoña, lo que impidió a María ejercer su título en los que habían sido sus territorios.",
      "Con la finalidad de expulsar a los franceses, promulgó una carta que se conoce como el Gran Privilegio y por la que quedaba garantizado el gobierno propio de los Países Bajos.",
      "Se casó el 19 de agosto de 1477 con Maximiliano, archiduque de Austria, hijo del emperador Federico III y después emperador del Sacro Imperio Romano Germánico, con el que tendría por hijos a Margarita de Austria y a Felipe el Hermoso, que introduciría, por su matrimonio con Juana I de Castilla, la estirpe de los Austria en España.",
    ] },
  { "title" = "Bibliografía", "paragraphs" = [
      "Histoire des ducs de Bourgogne de la maison de Valois, 1364-1477, Marie de Bourgogne, volúmenes 11 y 12, París, 1826.",
    ] },
]

[articles.fr]
text = "Marie de Bourgogne, née à Bruxelles le 13 février 1457 et morte au Prinsenhof de Bruges le 27 mars 1482, est une princesse de la maison de Valois-Bourgogne, duchesse titulaire de Bourgogne de janvier 1477 à sa mort. Fille unique du duc Charles le Téméraire, tué lors de la bataille de Nancy du 5 janvier 1477, elle se retrouve, à 19 ans, à la tête d'un État bourguignon fragilisé."
title = "Marie de Bourgogne"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Marie_de_Bourgogne"
intro = [
  "Marie de Bourgogne, née à Bruxelles le 13 février 1457 et morte au Prinsenhof de Bruges le 27 mars 1482, est une princesse de la maison de Valois-Bourgogne, duchesse titulaire de Bourgogne de janvier 1477 à sa mort.",
  "Fille unique du duc Charles le Téméraire, tué lors de la bataille de Nancy du 5 janvier 1477, elle se retrouve, à 19 ans, à la tête d'un État bourguignon fragilisé. Elle passe l'essentiel de ses cinq années de règne à défendre ses droits à l'héritage de son père, disputé par le roi de France, aidée en cela par sa belle-mère Marguerite d'York. Son mariage en août 1477 avec Maximilien d'Autriche oriente pour près de deux siècles la géopolitique de l'Europe. Elle est la mère de Philippe le Beau, père de Charles Quint.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Marie est née le 13 février 1457 au palais du Coudenberg à Bruxelles, dans le duché de Brabant. Ses parents, Charles le Téméraire et Isabelle de Bourbon, sont cousins germains, tous deux de sang royal français (son père descend en ligne directe de Jean II le Bon et sa mère de Saint Louis par Robert de Clermont).",
      "Elle est baptisée (précisément Marie-Blanche) quatre jours plus tard à la chapelle du palais par l'archevêque de Cambrai, Jean VI de Bourgogne, bâtard de son arrière-grand-père Jean sans Peur. Sa marraine est sa grand-mère, la duchesse de Bourgogne Isabelle de Portugal et son parrain le dauphin Louis, alors en froid avec son père, le roi Charles VII, et réfugié à Genappe. Son grand-père, Philippe le Bon, n'assiste pas à la cérémonie.",
      "Marie passe ensuite quelques années au château du Quesnoy, ancienne résidence des comtes de Hainaut. Son éducation est confiée à sa tante Anne de Bourgogne, fille illégitime de Philippe le Bon.",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "Dans la série télévisée Marie de Bourgogne (2017), son rôle est interprété par Christa Theret.",
      "Elle apparaît également la même année dans la série The White Princess, qui prend des libertés avec l'histoire en la faisant mourir quelques instants après sa chute de cheval et où elle est interprétée par l'actrice française Emmanuelle Bouaziz.",
      "En 2021, un documentaire-fiction, intitulé Marie de Bourgogne : seule contre tous, lui est consacré dans le cadre de l'émission Secrets d'histoire, présentée par Stéphane Bern.",
    ] },
  { "title" = "Annexes", "paragraphs" = [
      "Philippe de Commynes, Mémoires, Paris, Imprimerie nationale, coll. « Acteurs de l'histoire », 1994, 490 p. (ISBN 978-2-11-081344-2 et 2-11-081344-X)",
      "Jean Molinet, Chroniques, Académie royale de Belgique, coll. « Collection des anciens auteurs belges »",
      "Yves Cazaux, Marie de Bourgogne, témoin d'une grande entreprise à l'origine des nationalités européennes, Paris, Albin Michel, 1987, 374 p., présentation en ligne, présentation en ligne.",
    ] },
]

[articles.de]
text = "Maria von Burgund (französisch Marie de Bourgogne; * 13. Februar 1457 in Brüssel; † 27."
title = "Maria von Burgund"
lang = "de"
url = "https://de.wikipedia.org/wiki/Maria_von_Burgund"
intro = [
  "Maria von Burgund (französisch Marie de Bourgogne; * 13. Februar 1457 in Brüssel; † 27. März 1482 in Brügge) war das einzige Kind und die Alleinerbin Herzog Karls des Kühnen. Nach dem Tod ihres Vaters im Januar 1477 wurde sie Herzogin von Burgund, die letzte aus dem Haus Valois.",
  "Das Erbe ihres Vaters, einen umfangreichen Länderkomplex beiderseits der Grenze zwischen Frankreich und dem Heiligen Römischen Reich, musste sie gegen die Ansprüche des französischen Königs Ludwig XI. verteidigen. Zur Stärkung ihrer Position heiratete sie am 19. August 1477 Maximilian I., den Erzherzog von Österreich, der damit iure uxoris Herzog von Burgund wurde. Diese dynastische Verbindung löste den Burgundischen Erbfolgekrieg aus und war eine Ursache für die jahrhundertelange Rivalität zwischen Frankreich und den Habsburgern. Maria starb im Alter von nur 25 Jahren an den Folgen eines Reitunfalls. Sie war die Großmutter der Kaiser Karl V. und Ferdinand I.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Maria von Burgund wurde am 13. Februar 1457 als Tochter Karls des Kühnen, des Grafen von Charolais und nachmaligen Herzogs von Burgund, und dessen zweiter Gattin Isabelle, einer Tochter des Herzogs Charles I. de Bourbon, im Palast von Coudenberg zu Brüssel geboren. Die erste Gattin Karls des Kühnen, Catherine de Valois, war 1446 im Alter von nur 18 Jahren kinderlos gestorben. Maria war bislang Karls einziges Kind und damit Alleinerbin seines ausgedehnten und reichen Herrschaftsbereichs, doch hoffte er, noch einen Stammhalter zu bekommen.",
      "Zum Zeitpunkt von Marias Geburt war ihr Vater auf einem Jagdausflug abwesend. Die vier Tage später durch den Fürstbischof von Cambrai, Johann VI. von Burgund, in der Kapelle des Palastes Coudenberg geleitete Taufe Marias wurde als äußerst prachtvolle Zeremonie gestaltet. Vertreter europäischer Höfe überbrachten dabei wertvolle Geschenke. Allerdings konnten weder Karl der Kühne noch dessen Vater, der Burgunderherzog Philipp der Gute, an der Taufe Marias und den damit einhergehenden Festlichkeiten teilnehmen. Marias Taufpaten waren ihre Großmutter väterlicherseits, Isabel de Portugal, sowie der Dauphin Ludwig (nachmals König Ludwig XI. von Frankreich), der damals wegen eines Konflikts mit seinem Vater Karl VII. in den Ländern Philipps des Guten Zuflucht gesucht hatte.",
      "Zunächst lebte Maria gemeinsam mit ihren Eltern relativ abgeschieden auf der Festung Quesnoy im südlichen Hennegau. Bereits im Alter von sechs Jahren wurde sie von ihren Eltern getrennt. Philipp der Gute, ihr Großvater, hatte seinen Sohn als Statthalter nach Holland beordert, wohin Karl denn auch mit seiner Gattin Isabelle aufbrach. Während Marias Eltern in Gorkum lebten, wurde das Kind zur weiteren Erziehung nach Gent, dem Sitz der Grafen von Flandern, gebracht. Diese Überstellung der kleinen Prinzessin nach Gent geschah auf die fordernden Bitten der dortigen Bürgerschaft, die wiederholt gegen die burgundische Herrschaft aufbegehrte. Maria verbrachte nun den Großteil ihrer weiteren Kindheit in Ten Walle, einem festungsartigen Schloss.",
    ] },
  { "title" = "Rezeption", "paragraphs" = [
      "Ein historisch bedeutender silberner Guldiner (Schauprägung), geprägt nach 1511 in der Münzstätte Hall in Tirol im Auftrag von Kaiser Maximilian I. zum Gedenken an seine Hochzeit mit Maria von Burgund im Jahr 1479. Das Stück wurde von dem Medailleur Ulrich Ursenthaler dem Älteren entworfen und befindet sich heute in den Staatlichen Museen zu Berlin. Es besitzt ein Gewicht von 28,57 g und einen Durchmesser von 44 mm.",
    ] },
  { "title" = "Nachkommen", "paragraphs" = [
      "Maria von Burgund heiratete am 19. August 1477 den späteren Kaiser Maximilian I. Aus der Ehe gingen drei Kinder hervor:",
      "Philipp I., der Schöne (* 22. Juli 1478; † 25. September 1506), König von Kastilien, ⚭ 1496 Johanna von Kastilien (1479–1555)",
      "Margarete von Österreich (* 10. Januar 1480; † 1. Dezember 1530), Statthalterin der habsburgischen Niederlande",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Thea Leitner: Habsburgs Goldene Bräute. Durch Mitgift zur Macht. Piper, München 2005, ISBN 3-492-23525-5.",
      "Ernst Münch: Maria von Burgund, nebst dem Leben ihrer Stiefmutter Margarethe von York. 2 Bde. Brockhaus, Leipzig 1832.",
      "Carl Vossen: Maria von Burgund. Des Hauses Habsburg Kronjuwel. Seewald Verlag, Stuttgart 1982, ISBN 3-512-00636-1.",
    ] },
]

[articles.it]
text = "Maria di Borgogna (Bruxelles, 13 febbraio 1457 – Bruges, 27 marzo 1482) governò i territori borgognoni dei Paesi Bassi e fu suo jure Duchessa di Borgogna dal 1477 fino alla sua morte. Come unica figlia di Carlo il Temerario, Duca di Borgogna, e di Isabella di Borbone, fu l'erede dei vasti, e notevolmente ricchi, domini borgognoni in Francia e nei Paesi Bassi in seguito alla morte del padre nella battaglia di Nancy il 5 gennaio 1477, ed è pertanto spesso definita come Maria la Ricca."
title = "Maria di Borgogna"
lang = "it"
url = "https://it.wikipedia.org/wiki/Maria_di_Borgogna"
intro = [
  "Maria di Borgogna (Bruxelles, 13 febbraio 1457 – Bruges, 27 marzo 1482) governò i territori borgognoni dei Paesi Bassi e fu suo jure Duchessa di Borgogna dal 1477 fino alla sua morte. Come unica figlia di Carlo il Temerario, Duca di Borgogna, e di Isabella di Borbone, fu l'erede dei vasti, e notevolmente ricchi, domini borgognoni in Francia e nei Paesi Bassi in seguito alla morte del padre nella battaglia di Nancy il 5 gennaio 1477, ed è pertanto spesso definita come Maria la Ricca.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Maria nacque nel Palazzo del Coudenberg, il palazzo dei duchi di Brabante. Era la figlia di Carlo il Temerario, allora noto come Conte di Charolais, e della sua seconda moglie, Isabella di Borbone. La sua nascita, secondo il cronista di corte Georges Chastellain, venne accompagnata da un rombo di tuono che risuonava dal cielo crepuscolare altrimenti limpido. Il suo padrino era Luigi, Delfino di Francia, a quel tempo in esilio in Borgogna, la chiamò in onore di sua madre Maria d'Angiò. Le reazioni alla sua nascita furono contrastanti: il nonno di Maria, il duca Filippo il Buono, non rimase impressionato e \"scelse di non partecipare al [battesimo] poiché era solo per una bambina\", mentre sua nonna Isabella del Portogallo è stata felicissima della nascita di una nipote. Sua zia illegittima Anna fu nominata come responsabile dell'educazione di Maria e assegnò a Jeanne de Clito come sua governante. Jeanne rimase un'amica di Maria per tutta la vita.",
      "Filippo il Buono morì nel 1467 e il padre di Maria assunse il controllo dello Stato borgognone. Poiché suo padre non aveva eredi maschi in vita al momento della sua ascesa, Maria divenne la sua presunta erede. Suo padre controllava un vasto e ricco dominio costituito dal Ducato di Borgogna. Di conseguenza, la sua mano in matrimonio fu ricercata con entusiasmo da un certo numero di principi. La prima proposta fu ricevuta dal padre quando lei aveva solo cinque anni, in questo caso quella di sposare il futuro re Ferdinando II d'Aragona. Successivamente fu avvicinata da Carlo, duca di Berry; suo fratello maggiore, il re Luigi XI di Francia, fu fortemente infastidito dalla mossa di Carlo e tentò di impedire la necessaria dispensa papale per consanguineità.",
      "Non appena Luigi riuscì ad avere un erede maschio sopravvissuto all'infanzia, il futuro re Carlo VIII di Francia, Luigi volle che fosse lui a sposare Maria. Nicola I, duca di Lorena, aveva qualche anno più di Maria e controllava un ducato che si estendeva lungo il territorio borgognone, ma il suo piano per unire il suo dominio con quello di lei fu interrotto dalla sua morte nel 1473. Un altro corteggiatore fu Giorgio Plantageneto, duca di Clarence (sostenuto dalla sorella Margherita di York), ma suo fratello Edoardo IV, impedì il fidanzamento sia per motivi politici che personali (inizialmente voleva sostenere suo cognato Anthony Woodville). La mossa del re fece arrabbiare il duca, che sembrò perdere il controllo e ricominciarono i conflitti con suo fratello, che alla fine lo portarono alla morte.",
    ] },
  { "title" = "Regno", "paragraphs" = [
      "Maria assunse il governo dei domini di suo padre dopo la sua sconfitta nella battaglia di Nancy e la sua morte il 5 gennaio 1477. Luigi XI colse l'occasione per tentare di impossessarsi del Ducato di Borgogna vero e proprio e anche delle regioni di Franca Contea, Piccardia e Artois.",
      "Il re era ansioso che Maria sposasse suo figlio Carlo e assicurasse così l'eredità dei Paesi Bassi per i suoi eredi, se necessario con la forza delle armi. La Borgogna, temendo il potere militare francese, inviò un'ambasciata in Francia per negoziare un matrimonio tra Maria e il delfino di sei anni (in seguito re Carlo VIII), ma tornò a casa senza fidanzamento; le richieste del re francese di cessione di territori alla corona francese furono ritenute inaccettabili.",
      "In quello stesso anno i cantoni confederati Svizzeri discutevano se occupare o meno la Franca Contea; al congresso di Zurigo, del 24 gennaio 1478, venne firmata la pace tra gli Svizzeri e la Borgogna: i confederati rinunciavano a qualsiasi diritto sulla Franca Contea, mentre Massimiliano si impegnava a pagare un'indennità di 150 000 fiorini agli altri contraenti: i confederati, l'Austria, la Bassa Lorena e la lega delle città renane. Le truppe imperiali allora scesero in campo accanto ai borgognoni, nella guerra contro il re di Francia. La vittoria degli austro-borgognoni sui francesi alla battaglia di Guinegatte, del 7 marzo 1479, anche se non fu schiacciante, fermò l'avanzata francese e salvò le Fiandre. La guerra riprese con particolare violenza e ferocia e l'occupazione dell'Artois fu spietata, la città di Dôle fu data alle fiamme, mentre ad Arras, gli abitanti vennero dispersi e sostituiti con altri provenienti dalla Francia.",
    ] },
  { "title" = "Matrimonio", "paragraphs" = [
      "Nell'autunno 1473 suo padre Carlo il Temerario cercò di ottenere, attraverso un incontro a Treviri con l'imperatore Federico III d'Asburgo, lo statuto di regno indipendente e anche il titolo di Re dei Romani, mentre a Federico III interessava di dare in sposa a suo figlio Massimiliano la figlia di Carlo. Dato che non fu raggiunto alcun accordo, il Temerario non acconsentì al fidanzamento dei due giovani. Subito dopo, Carlo combatté una guerra nel basso Reno a favore delle signorie di Colonia e per questo si attirò una temporanea ostilità da parte dell'imperatore. All'inizio della primavera del 1475 l'imperatore Federico III si rappacificò con Carlo e ripresero le trattative sul matrimonio tra i loro due primogeniti.",
      "Peraltro, la precoce morte del padre, Carlo il Temerario, fece precipitare gli eventi. Maria scelse, tra i tanti suoi pretendenti, di sposare Massimiliano. Il matrimonio ebbe luogo a Gand il 19 agosto 1477. Il matrimonio di Maria con la Casa d'Asburgo diede inizio a due secoli di contese tra la Francia e gli Asburgo, una lotta che culminò con la guerra di successione spagnola.",
      "Dal matrimonio con Massimiliano erano nati tre figli, due dei quali svolsero un ruolo chiave nella storia d'Europa sullo scorcio del XV secolo:",
    ] },
  { "title" = "Morte", "paragraphs" = [
      "Nel 1482, una caccia col falcone nei boschi vicino al castello di Wynendaele fu organizzata da Adolfo I di Kleve, signore di Ravenstein. Maria amava cavalcare e stava cacciando con Massimiliano e i cavalieri di corte quando il suo cavallo inciampò, la gettò in un fosso e poi le atterrò addosso, spezzandole la schiena. Morì diverse settimane dopo, il 27 marzo, per lesioni interne, dopo aver redatto un testamento dettagliato. Fu sepolta nella chiesa di Nostra Signora a Bruges il 3 aprile 1482. Al momento dell'incidente era incinta.",
      "Massimiliano era devastato. Inizialmente aveva nascosto l'entità della sua ferita per calmarlo. Quando continuò a mostrare un dolore incontrollabile, fu costringerlo a uscire dalla sua camera in modo da poter discutere questioni di stato con i suoi nobili, riguardo ai quali chiese a loro di mantenere il giuramento di fedeltà a lui e ai loro figli. Massimiliano non era presente quando ha pronunciato le sue ultime parole.",
      "Il tribunale in bancarotta l'ha onorata con un glorioso funerale, mentre Massimiliano ha fuso le stoviglie per l'occasione.",
    ] },
]

[articles.ar]
text = "ماري دوقة برغونية تعرف أيضاً باسم ماري الثرية (الفرنسية:Marie de Bourgogne؛ بروكسل، 13 فبراير 1457 - بروج، 27 مارس 1482) دوقة برغونية وأيضا كانت حاكمة للعديد من المناطق التي كانت في فرنسا والبلدان المنخفضة، وبالإضافة لكونها أرشيدوقة النمسا من خلال الزواج منذ 1477 حتى وفاتها. ماري هي الابنة الشرعية الوحيدة لوالديها شارل الأول الجرئ وزوجته الثانية إيزابيل البوربونية، ورثت ماري الدوقية بعد وفاة والدها خلال معركة نانسي في 5 يناير 1477، وبسبب الرخاء الكبير في العديد من المناطق التي ورثها، غالباً ما يشير إليها بـ ماريا الثرية."
title = "ماري دوقة بورغونيا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D9%85%D8%A7%D8%B1%D9%8A_%D8%AF%D9%88%D9%82%D8%A9_%D8%A8%D9%88%D8%B1%D8%BA%D9%88%D9%86%D9%8A%D8%A7"
intro = [
  "ماري دوقة برغونية تعرف أيضاً باسم ماري الثرية (الفرنسية:Marie de Bourgogne؛ بروكسل، 13 فبراير 1457 - بروج، 27 مارس 1482) دوقة برغونية وأيضا كانت حاكمة للعديد من المناطق التي كانت في فرنسا والبلدان المنخفضة، وبالإضافة لكونها أرشيدوقة النمسا من خلال الزواج منذ 1477 حتى وفاتها.",
  "ماري هي الابنة الشرعية الوحيدة لوالديها شارل الأول الجرئ وزوجته الثانية إيزابيل البوربونية، ورثت ماري الدوقية بعد وفاة والدها خلال معركة نانسي في 5 يناير 1477، وبسبب الرخاء الكبير في العديد من المناطق التي ورثها، غالباً ما يشير إليها بـ ماريا الثرية.",
]
sections = [
  { "title" = "السيرة الذاتية", "paragraphs" = [
      "ولدت ماري في بروكسل في 13 فبراير 1457 لوالدها شارل الجريء الذي كان آنذاك كونت شاروليه وزوجته الثانية إيزابيل البوربونية (1437-1465) ابنة شارل الأول دوق بوربون وأغنيس البرغونية عمة شارل الجريء، كان عرابها لويس دوفين فرنسا الثامن (في المستقبل ملك فرنسا) عندما كان يعتبر منفياً خلال ذاك الوقت؛ سمى لويس الطفلة تكريماً لوالدته ماري الأنجوية، كانت ردود حول الطفلة مختلطة: بحيث كان جدها الدوق فيليب الطيب غير متفائلاً واختر ألا يحضر التعميد، لا أن جدتها إيزابيلا البرتغالية كانت مسرورة بميلادها، حتى أنها عينت عمتها غير الشرعية آنا مربية لها.",
      "مع وفاة جدها فيليب الطيب في 1467 أصبح والدها أخيراً دوق برغونية؛ وبما أن والدها لم يكن لديه ابن ذكر خلال صعوده، تم اعتبارها كوريثة مفترضة، كان والدها يسيطر على مناطق الواسعة ومعظم هذه المناطق لا تعتبر ككتلة واحدة، والتي تكونت من دوقية برغونية وكونتية برغونية البلاطينية وأغلب المناطق في البلدان المنخفضة، نتيجة لذلك العديد من الأمراء بحثوا في طلب يدها لزواج، تلقى والدها الطلب الأول عندما كانت في الخامسة من العمر، من انفانتي فرناندو الأراغوني (في المستقبل ملك قشتالة وأراغون)، وفي وقت لاحق من شارل دوق بيري الشقيق الأصغر للملك لويس الحادي عشر من فرنسا الذي كان منزعجاً بشدة بحيث قام بمنع هذا الاقتراح بمساعدة قرار بابوي وذلك تعديه الدرجة المحرومة لزواج.",
      "حالما نجح لويس في انجاب الوريث في المستقبل شارل الثامن ملك فرنسا، أراد بسرعة أن يزوج شارل من ماري رغم أنه يصغرها بثلاثة عشر عاماً، وأيضا حاول نيكولا الأول الذي يكبرها بسنوات في طلب يدها، بحيث كان يحكم دوقية لورين المجاورة لدوقية برغونية والبلدان المنخفضة، إلا أن هذه الخطة انتهت بوفاته في 1473.ومع ذلك توالت العروض الزواج حتى وفاة والدها في 1477 رغم أنها ليس لديه وريث ذكر؛ بذلك استطعت ماريا أن تخلفه، اغتنم الملك لويس الحادي عشر الفرصة في محاولة للاستيلاء على أراضيها التي تقع في مملكة فرنسا من دوقية برغونية بنفسها وفرانش كونته (رغم أنها تقع ضمن أراضي الإمبراطورية في ذاك الوقت) وبيكاردي وأرتوا.",
    ] },
  { "title" = "الزواج والذرية", "paragraphs" = [
      "بعد سنين من عروض الزواج، وسياسات الملك لويس الحادي عشر؛ وقع اختيارها على الأرشيدوق ماكسيمليان النمساوي (في المستقبل الإمبراطور الروماني المقدس) كان يصغرها بسنتين على الرغم من أنهما أقارب من الدرجة الرابعة بحيث أن كليهما من أحفاد جواو الأول ملك البرتغال وفيليبا الإنجليزية، والذي أصبح حاكم مناصف معها، جرى الزواج في غنت مساء يوم 16 أغسطس 1477، أدى زواج ماري من سليل أسرة هابسبورغ إلى خلاف على مدى القرنين التاليين بين فرنسا وهابسبورغ (لاحقاً ملوك إسبانيا والأباطرة الرومان المقدسة)، وبلغ هذا الصراع ذروته مع حرب الخلافة الإسبانية (1700-1714).",
      "ولكن في هولندا أصبحت الأمور أكثر سلاسة؛ مع إبعاد العدوان الفرنسي مؤقتاً، وإستعادة السلام الداخلي إلى حد كبير.",
      "فيليب الوسيم (22 يوليو 1478 - 25 سبتمبر 1504)؛ خلف والدته تحت مُسمى فيليب الرابع؛ وأيضا أصبح من خلال زواجه من انفانتا خوانا ملك قشتالة وليون.",
    ] },
  { "title" = "الوفاة", "paragraphs" = [
      "في 1482 تم تنظيم رحلة صيد الطيور في الغابة بالقرب من قلعة فيخنيندال من قبل أدولف الكليفزي لورد رافنشتاين الذي كان يعيش في القلعة، على الرغم من أنها كانت تحب ركوب الخيل؛ كانت تصيد مع ماكسميليان وفرسان البلاط؛ مع ذلك تعثر حصانها وألقى بها في الحفرة ثم سقط فوقها مما أدى إلى كسر ظهرها، وتوفيت بعد عدة أسابيع من تلك الحادثة في 27 مارس، من إصابات داخلية ودفنت في 3 أبريل في كنيسة السيدة العذراء بـ بروج حسب وصيتها دفنت بجوار والدها وأجدادها من قبل، ابنتها الأرشيدوقة مارغريت التي تبلغ سنتين تم إرسالها عبثاً نحو فرنسا لتتزوج من الدوفين، في محاولة لإرضاء الملك لويس وإقناعه بعدم احتلال المناطق التي تملكها ماريا في فرنسا.",
      "ومع ذلك الملك لويس أجبر الأرشيدوق ماكسيمليان (الآن الوصي على ابنها فيليب الرابع البرغوني) على الموافقة على معاهدة أراس في أواخر 1482 والتي تم بموجبها تمرير فرانش كونته وأرتوا للحكم الفرنسي لفترة من الوقت، تم استرداد تلك المناطق في 1492 بموجب معاهدة سينلس التي وقعت الصلح بين فرنسا والبلدان المنخفضة، ومع ذلك ثبت زواج ماري من فرد من آل هابسبورغ بأنه كارثياً لفرنسا، لأن ميراث برغونية سوف يتشابك مع حقوق الخلافة في إسبانيا والإمبراطورية الرومانية المقدسة في وقت لاحق.",
    ] },
]

[articles.ru]
text = "Мари́я Бургу́ндская (фр. Marie de Bourgogne, 13 февраля 1457, Брюссель — 27 марта 1482, Брюгге) — с 1477 года герцогиня Бургундии, графиня Эно и маркграфиня Намюра, графиня Голландии, единственная дочь и наследница герцога Бургундии Карла Смелого."
title = "Мария Бургундская"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D1%80%D0%B8%D1%8F_%D0%91%D1%83%D1%80%D0%B3%D1%83%D0%BD%D0%B4%D1%81%D0%BA%D0%B0%D1%8F"
intro = [
  "Мари́я Бургу́ндская (фр. Marie de Bourgogne, 13 февраля 1457, Брюссель — 27 марта 1482, Брюгге) — с 1477 года герцогиня Бургундии, графиня Эно и маркграфиня Намюра, графиня Голландии, единственная дочь и наследница герцога Бургундии Карла Смелого. Имела прозвище Богатая.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "После гибели отца Карла Смелого в январе 1477 года Мария унаследовала престол герцогов Бургундских, что позволило ей стать одной из самых желанных невест Европы тех лет. Наследство Марии включало в себя районы нынешней северо-восточной Франции (Бургундию, значительную часть Лотарингии и Эльзаса), а также Франш-Конте, Фландрию, Эно и Брабант. Когда западной частью Бургундии в ходе начавшейся войны за Бургундское наследство силой завладел французский король Людовик XI, то для оправдания этого захвата он предложил двадцатилетней Марии стать супругой его семилетнего сына дофина Карла. Но значительная часть подданных герцогини была против французского господства. В это время нашёлся ещё один претендент на руку Марии — Максимилиан Габсбург, сын императора Фридриха III. 11 февраля даровала Бургундским Нидерландам Великую привилегию.",
      "В итоге у Марии Бургундской, которая вышла замуж 14 августа 1477 года в Генте за эрцгерцога Максимилиана Габсбурга (впоследствии император Священной Римской империи Максимилиан I), остались графство Бургундия (Франш-Конте) и Нидерланды. Таким образом, эти владения вошли в состав фамильных владений дома Габсбургов. Также к потомкам Марии перешёл и орден Золотого руна, основанный её дедом, бургундским герцогом Филиппом Добрым, в 1430 году.",
      "Мария умерла в 1482 году в возрасте всего 25 лет от гемопневмоторакса, ставшего следствием падения с лошади во время соколиной охоты. Филипп де Коммин в «Мемуарах» пишет:",
    ] },
  { "title" = "Семейные отношения", "paragraphs" = [
      "Сохранились письма Максимилиана к другу Зигмунду Прюшенку. В одном из них содержится описание внешности его будущей жены:",
      "Это дама красивая, благочестивая, добродетельная, которой я, благодарение Господу, превесьма доволен. Сложением хрупкая, с белоснежной кожей; волосы каштановые, маленький нос, небольшая головка, некрупные черты лица; глаза карие и серые одновременно, ясные и красивые. Нижние веки чуть припухшие, как будто она только что ото сна, но это едва заметно. Губы чуть полноваты, но свежи и алы. Это самая красивая женщина, какую я когда-либо видел.",
      "После бракосочетания Максимилиан с женой устроили «совместную спальню» — редкое явление в знатных семьях того времени, когда супруги обыкновенно в одной кровати не спали.",
    ] },
  { "title" = "Потомки", "paragraphs" = [
      "Её сын Филипп Австрийский, которому было в момент гибели матери четыре года, продолжил дом Габсбургов и стал родоначальником обеих его ветвей: он был отцом (от брака с кастильской принцессой Хуаной Безумной) императоров Карла V (предка испанских Габсбургов) и Фердинанда I (предка австрийских Габсбургов); обе ветви сохраняли фамильные притязания на Нидерланды и другие бургундские владения.",
    ] },
  { "title" = "Образ в культуре", "paragraphs" = [
      "Грёссинг З. Максимилиан I / Пер. с нем. Е. Б. Каргиной. — М.: АСТ, 2005. — 318 с. — (Историческая библиотека). — 5000 экз. — ISBN 5-17-027939-6.",
      "Филипп де Коммин. Мемуары / Пер., статья и прим. Ю. П. Малинина. — М.: Наука, 1986. — 496 с. — (Памятники исторической мысли). — 100 000 экз.",
    ] },
]

[articles.vi]
text = "Marie I xứ Bourgogne (tiếng Pháp: Marie de Bourgogne, tiếng Hà Lan: Maria van Bourgondië; tiếng Đức: Maria von Burgund; tiếng Tây Ban Nha: María de Borgoña; tiếng Anh: Mary of Burgundy; 13 tháng 1 năm 1457 - 27 tháng 3 năm 1482), còn có biệt danh là Marie Giàu có (Marie la Riche) là một nữ quân chủ của tập đoàn lãnh địa thuộc Bourgogne. Sau cái chết của cha là Charles Liều Lĩnh, bà kế thừa lãnh thổ rộng lớn của gia tộc Bourgogne, bao trùm khu vực rộng lớn ở phía đông nước Pháp ngày nay."
title = "Marie I xứ Bourgogne"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Marie_I_x%E1%BB%A9_Bourgogne"
intro = [
  "Marie I xứ Bourgogne (tiếng Pháp: Marie de Bourgogne, tiếng Hà Lan: Maria van Bourgondië; tiếng Đức: Maria von Burgund; tiếng Tây Ban Nha: María de Borgoña; tiếng Anh: Mary of Burgundy; 13 tháng 1 năm 1457 - 27 tháng 3 năm 1482), còn có biệt danh là Marie Giàu có (Marie la Riche) là một nữ quân chủ của tập đoàn lãnh địa thuộc Bourgogne. Sau cái chết của cha là Charles Liều Lĩnh, bà kế thừa lãnh thổ rộng lớn của gia tộc Bourgogne, bao trùm khu vực rộng lớn ở phía đông nước Pháp ngày nay.",
]
sections = [
  { "title" = "Tiểu sử", "paragraphs" = [
      "Marie sinh ra ở Bruxelles, trong một lâu đài thuộc lãnh địa Coudenberg. Cha bà, Charles, khi ấy vẫn là Công tước xứ Charolais, và mẹ bà là Isabelle xứ Bourbon, con gái của Charles I xứ Bourbon – một gia tộc có hậu duệ từ Louis IX của Pháp. Vào lúc bà sinh ra, theo ghi nhận của nhà sử học Georges Chastellain, đã đón nhận một tràn sấm vỡ òa của công chúng quý tộc Bourgogne. Cha đỡ đầu của bà là Louis, Dauphin của nước Pháp, người đang bị đày ải ở Bourgogne vào thời điểm ấy. Và chính Louis đã đặt tên cho bà, theo tên của mẹ ông là Marie xứ Anjou.",
      "Ngược lại, ông nội của Marie là Philippe Tốt Bụng, rất thất vọng khi biết Marie là một bé gái, và ông đã khước từ đến lễ rửa tội của cháu nội ông. Bà nội của Marie, Isabel của Bồ Đào Nha, rất vui khi biết tin cháu nội bà là một bé gái, và việc giáo dục của Marie được giao cho Anna xứ Bourgondië, một người con hoang bất hợp pháp của Philippe le Bon. Jeanne de Clito được bổ nhiệm làm nhũ mẫu. Jeanne về sau vẫn luôn là tri kỷ và là một trong những người cận kề với Marie nhất suốt cuộc đời bà.",
      "Năm 1467, Philippe Tốt bụng qua đời, cha của Marie là Charles trở thành Công tước mới của Bourgogne. Thời điểm ấy, Charles không có con trai, nên Marie trở thành Trữ quân của ông. Thời điểm ấy là thời điểm hưng thịnh của Bourgogne, không chỉ là Công quốc, mà còn cả các Hạt địa tự do của Bourgogne (nay là khu vực Franche-Comté) và đặc biệt nhất là các Vùng đất thấp (Low Countries). Vì lý do này, Marie trở thành đối tượng kết hôn của giới quý tộc Châu Âu khi ấy, vào lúc 5 tuổi, bà đã được dự sẽ kết hôn với Ferrando II của Aragón. Sau đó, đối tượng dành cho bà chuyển qua Charles của Pháp, Công tước xứ Berry, em trai của Vua Louis XI, tuy nhiên những dàn xếp này cuối cùng cũng không đi đến kết quả.",
    ] },
  { "title" = "Lên ngôi chúa của Bourgogne", "paragraphs" = [
      "Năm 1477, ngày 5 tháng 1, Marie tuyên bố trở thành chủ nhân mới của các lãnh địa Bourgogne sau cái chết của cha bà, Charles, trong Trận Nancy. Quốc vương Louis XI nhận thấy khả năng chiếm đoạt Franche-Comté, Picardy và Artois qua hôn nhân, nên thúc giục cuộc hôn nhân giữa Marie và con trai ông, vị Quốc vương Charles VIII của Pháp trong tương lai. Trước tình huống đó, sứ giả Bourgogne đến đàm phán ở Pháp, song ra về với kết quả bỏ ngỏ do Vua Louis yêu cầu việc san nhượng các lãnh địa của Bourgogne, một việc khó có thể chấp nhận vào thời điểm ấy.",
      "Ngày 10 tháng 2 cùng năm, Marie thực hiện chuyến vi hành đến Ghent và bị ép buộc ký kết văn kiện Đại đặc ân, xác nhận sự bán độc lập của các lãnh địa như Flanders, Brabant, Hainaut và Holland bằng cách bãi bỏ những sắc lệnh đầy chuyên chế mà các Công tước Bourgogne đã áp đặt trên các lãnh thổ này – một dạng mô hình quân chủ chuyên chế mà Bourgogne đã cố thực hiện trong các đời cha và ông nội của Marie, cùng nhiều sự xác nhận phức tạp khác. Đặc biệt, Marie phải chủ trương giữ hòa khí với Pháp, không tự tiện tuyên chiến hay tăng thuế nếu các Hội đồng không thông qua.",
      "Trước tình thế này, Marie phải chọn chồng cho mình, và thông qua các cố vấn đáng tin cậy, bà đã chọn Đại Vương công Maximilian của Áo, vị Hoàng đế tương lai của Thánh chế La Mã, và cũng là người đồng trị vì với Marie ở Bourgogne. Hôn lễ của hai người diễn ra ở Ghent, vào ngày 19 tháng 8 cùng năm. Việc Marie được cưới vào nhà Habusburg, đã chính thức khơi mào nên cuộc tranh chấp tới 2 thế kỉ giữa Pháp và Habsburg (Tây Ban Nha lẫn Thánh chế La Mã), dẫn đến Chiến tranh Kế vị Tây Ban Nha. Kết hôn hơn 5 năm, Marie qua đời trong một tai nạn khi đang cưỡi ngựa, bà gãy cột sống và qua đời ngay ngày hôm sau.",
    ] },
]

[articles.id]
text = "Marie (bahasa Prancis: Marie; bahasa Belanda: Maria; 13 Februari 1457 – 27 Maret 1482), merupakan seorang Adipati Bourgogne, yang memerintah di banyak wilayah Kadipaten Bourgogne, sekarang terutama di Prancis dan Negara-Negara Dataran Rendah, dari tahun 1477 sampai kematiannya. Sebagai anak tunggal Charles Martin, Adipati Bourgogne, dan istrinya Isabelle dari Bourbon, ia mewarisi kadipaten tersebut setelah kematian ayahandanya dalam Pertempuran Nancy pada tanggal 5 Januari 1477."
title = "Marie dari Bourgogne"
lang = "id"
url = "https://id.wikipedia.org/wiki/Marie_dari_Bourgogne"
intro = [
  "Marie (bahasa Prancis: Marie; bahasa Belanda: Maria; 13 Februari 1457 – 27 Maret 1482), merupakan seorang Adipati Bourgogne, yang memerintah di banyak wilayah Kadipaten Bourgogne, sekarang terutama di Prancis dan Negara-Negara Dataran Rendah, dari tahun 1477 sampai kematiannya. Sebagai anak tunggal Charles Martin, Adipati Bourgogne, dan istrinya Isabelle dari Bourbon, ia mewarisi kadipaten tersebut setelah kematian ayahandanya dalam Pertempuran Nancy pada tanggal 5 Januari 1477. Karena kemakmuran besar banyak wilayah yang terdiri dari kadipaten, Marie sering disebut sebagai Marie yang Kaya (meskipun ini tidak biasa dalam bahasa Inggris).",
]
sections = [
  { "title" = "Kehidupan awal", "paragraphs" = [
      "Marie lahir di Brussel di kastil kadipaten Koudenberg, putri Charles Martin, yang kemudian dikenal sebagai Comte Charolais, dan istrinya Isabelle dari Bourbon. Kelahirannya, menurut penulis kronik istana, Georges Chastelain, disambut oleh gemuruh guntur yang terdengar dari langit senja yang jelas. Ayah angkatnya adalah Louis, Dauphin Prancis, di pengasingan di Bourgogne pada waktu itu; Ia menamainya seperti ibundanya, Marie dari Anjou. Rekasi terhadap anak itu beragam: kakek sang bayi, Adipati Philippe yang Baik, tidak terkesan, dan \"memilih untuk tidak menghadiri [pembaptisan] karena hanya untuk seorang bayi perempuan\", sedangkan neneknya Isabel dari Portugal sangat gembira dengan kelahiran seorang cucu perempuan. Bibinya yang tidak sah, Anne ditugaskan sebagai walinya.",
    ] },
  { "title" = "Pewaris sementara", "paragraphs" = [
      "Philippe yang Baik meninggal pada tahun 1467 dan ayahanda Marie mengambil kendali kadipaten Bourgogne. Karena ayahandanya tidak memiliki keturunan laki-laki pada saat aksesinya, Marie menjadi pewaris sementaranya. Ayahandanya menguasai sebuah wilayah luas dan kaya yang terdiri dari Kadipaten Bourgogne, Kadipaten Bebas Bourgogne, dan sebagian besar Negara-Negara Dataran Rendah. Akibatnya, banyak pangeran yang ingin menjadi pendampingnya. Lamaran pertama diterima oleh ayahanadanya ketika ia baru berusia lima tahun, untuk menikah dengan calon Raja Ferrando II d'Aragón. Kemudian ia didekati oleh Charles, Adiapti Berry, adik Raja Louis XI dari Prancis, yang sangat kesal dan berusaha mencegah dispensasi kepausan yang diperlukan untuk consanguinitas.",
      "Begitu Louis berhasil menghasilkan pewaris laki-laki yang selamat dari masa kanak-kanak, calon Raja Charles VIII dari Prancis, Louis menginginkannya menikahi Marie, meskipun ia berusia tiga belas tahun lebih muda daripada Marie. Nicolas dari Lorraine, beberapa tahun lebih tua dari Marie dan mengendalikan sebuah kadipaten yang terbentang di sepanjang wilayah Bourgogne, tetapi rencananya untuk menggabungkan wilayahnya dengan miliknya berakhir dengan kematiannya dalam pertempuran pada tahun 1473.",
      "Marie mengambil alih pemerintahan wilayah ayahandanya selama kekalahannya dalam pertempuran dan kematian pada tanggal 5 Januari 1477. Raja Louis XI dari Prancis memanfaatkan kesempatan tersebut untuk mecoba memiliki Kadipaten Bourgogne dan juga wilayah-wilayah Franche-Comté, Picardie dan Artois.",
    ] },
  { "title" = "Hak istimewa yang luar biasa", "paragraphs" = [
      "Maria dipaksa untuk menandatangani sebuah piagam hak-hak yang dikenal sebagai hak istimewa luar biasa di Gent pada tanggal 10 Februari 1477 pada saat pengakuan resminya sebagai ahli waris ayahandanya (\"Blijde Intrede\"). Berdasarkan kesepakatan ini, provinsi dan kota di Flandria, Brabant, Hainaut, dan Holland memulihkan semua hak lokal dan komunal yang telah dihapuskan oleh keputusan para adipati Bourgogne dalam usaha mereka untuk menciptakan negara terpusat pada model Prancis dari kepemilikan mereka yang berbeda di Negara-Negara Dataran Rendah. Khususnya, Parlemen Mechelen (yang didirikan resmi oleh Charles Martin pada tahun 1470) dihapuskan dan diganti dengan otoritas Parlemen, yang sudah ada sebelumnya, yang dianggap sebagai penyeimbang yang dapat diterima dengan sentralisasi yang dilakukan baik oleh Charles Martin dan Philippe yang Baik. Sang adipati juga harus berusaha untuk tidak mengumumkan perang, berdamai, atau menaikkan pajak tanpa persetujuan dari provinsi dan kota ini dan hanya mempekerjakan penduduk pribumi di pos-pos resmi.",
      "Begitulah kebencian orang-orang terhadap rezim lama bahwa terlepas dari air mata dan permohonan sang adipati, dua dari anggota kanselir ayahandanya yang paling berpengaruh, Kanselir Hugonet dan Sire d'Humbercourt, dieksekusi di Gent setelah diketahui bahwa mereka berkorespondensi dengan raja Prancis.",
      "Marie segera menjatuhkan pilihannya di antara banyak pelamar dengan memilih Adipati Agung Maximilian dari Austria, calon Kaisar Romawi Suci Maximilian I, yang menjadi rekan-pemimpinnya. Pernikahan tersebut berlangsung di Gent pada malam hari tanggal 16 Agustus 1477. Pernikahan Marie ke dalam Wangsa Habsburg memulai perdebatan dua abad antara Prancis dan Habsburg (raja-raja Spanyol dan kaisar-kaisar Romawi Suci kemudian), sebuah perjuangan yang mencapai puncaknya dengan Perang Penerus Spanyol pada tahun 1701–1714.",
    ] },
  { "title" = "Keluarga", "paragraphs" = [
      "Philipp yang Tampan, 22 Juli 1478 – 25 September 1506 yang menggantikan ibundanya sebagai Philippe IV dari Bourgogne, dan menjadi Philipp I dari Kastilia oleh pernikahannya dengan Juana dari Kastila (dikenal sebagai \"Juana la Loca\")",
      "Margarete, 10 Januari 1480 – 1 Desember 1530, menikah pertama-tama dengan) Juan d'Aragón, putra dan ahli waris Raja Ferrando II d'Aragón dan Ratu Isabel dari Kastila dan kedua dengan) Filiberto II, Adipati Savoia",
    ] },
]

[articles.pt]
text = "Maria de Borgonha (em francês: Marie de Bourgogne; Bruxelas, 13 de fevereiro de 1457 — Bruges, 27 de março de 1482), cognominada a Rica, foi duquesa titular da Borgonha."
title = "Maria, Duquesa da Borgonha"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Maria%2C_Duquesa_da_Borgonha"
intro = [
  "Maria de Borgonha (em francês: Marie de Bourgogne; Bruxelas, 13 de fevereiro de 1457 — Bruges, 27 de março de 1482), cognominada a Rica, foi duquesa titular da Borgonha.",
]
sections = [
  { "title" = "Primeiros anos", "paragraphs" = [
      "Maria nasceu em 13 de fevereiro de 1457 em Bruxelas, no castelo ducal de Coudenberg. Seu pai Carlos era filho de Filipe, o Bom, Duque de Borgonha e Isabel de Portugal. Seu título na época era Conde de Charolês. Sua mãe era Isabel, filha do Duque de Bourbon. No dia em que Maria nasceu, seu pai saiu para caçar. O Delfim Luís da França (mais tarde rei Luís XI) era nesse momento um convidado do duque de Borgonha e estava presente do lado de fora da porta da câmara de nascimento. A criança recém-nascida foi carregada por sua avó, a Duquesa, para o Delfim que esperava. Ele pediu que o bebê fosse chamado de Maria, em homenagem à sua própria mãe.",
      "O batismo de Maria foi um acontecimento esplêndido, especialmente para uma menina. O Delfim Luís atuou como seu padrinho. Ela foi então levada de volta ao quarto de sua mãe e colocada na cama. Senhoras e senhores entraram na sala e foram servidos temperos cristalizados e hipocras. A maior parte de sua infância foi passada no castelo ducal de Ten Waele em Gante. Sua governanta era Jeanne de Clito, Lady Hallewijn, prima do cronista Philippe de Commines. Lady Hallewijn foi a companhia mais constante de Maria pelo resto de sua vida. Ana de Borgonha, mais tarde esposa do Lorde Ravenstein, foi responsável pela educação de Maria.",
      "Maria recebeu uma boa educação digna da herdeira mais cobiçada da Europa. Ela deveria ter todos os caprichos satisfeitos. Ela teve alguns companheiros quando era jovem, principalmente seus primos, os filhos de Lorde Ravenstein, Felipe de Cleves e João de Cleves. Ela cresceu com um interesse ardente por animais. Sua avó Isabel deu-lhe uma coleção de macacos e papagaios. Ela tinha animais de estimação, incluindo uma girafa e cães. Ela adorava música, xadrez e arte. Ela passou a amar o exercício físico, especialmente a caça, equitação e falcoaria. Ela patinava nos lagos congelados do Palácio Coudenberg e caçava por horas. Quando Maria ficou em Bruxelas, apreciou o grande parque de veados de Warende que rodeava o palácio ducal.",
    ] },
  { "title" = "Pretendentes", "paragraphs" = [
      "O pai de Maria estaria longe de sua família durante a maior parte de seu reinado, lutando em guerras e administrando seu reino. Carlos recebeu uma variedade estonteante de pretendentes pela mão de Maria. Alguns desses candidatos incluíam Fernando de Aragão (que acabou se casando com Isabel de Castela); Nicolau de Lorena; Jorge, Duque de Clarence (irmão de Margarida de Iorque); Duque Francisco II da Bretanha; o Delfim Carlos da França; Carlos, Duque de Berry (irmão do rei Luís XI); Felisberto de Saboia e Maximiliano, o arquiduque de Habsburgo. Maximiliano foi o candidato mais falado. As negociações começaram em 1463 e ocorreram novamente em 1467, 1469 e 1473. Depois que Carlos lutou na Batalha de Neto em 1476, as negociações tornaram-se sérias. Maria escreveu uma carta de noivado a Maximiliano e a enviou com um anel. O casamento estava marcado para acontecer em Colônia em 1477. Mas mesmo isso não foi garantiu o enlace.",
      "No inverno de 1477, Margarida e Maria começaram a receber relatos de que o duque Carlos havia morrido na Batalha de Nancy. As duas mulheres estavam em Gante e suas circunstâncias eram terríveis. Maria tinha vários conselheiros dando-lhe conselhos e notícias desastrosas estavam chegando rapidamente. Eventualmente, o corpo de seu pai foi encontrado. Maria não tinha dinheiro, tropas e poder. Ela era sem dúvida uma prisioneira dos cidadãos de Gante. Margarida e Maria convocaram uma reunião com os encarregados das propriedades e Maria fez um discurso em que renunciou a uma enorme taxa que havia sido dada a seu pai, aliviando-os da dívida. Havia uma carta redigida chamada “Grande Privilégio”. Ele foi projetado para restaurar os direitos locais. Maria foi forçada a prometer governar com o conselho do conselho em todos os assuntos, incluindo seu casamento, guerra e paz.",
      "Muitos nobres foram feitos prisioneiros e muitos abandonaram Maria e se aliaram ao rei Luís XI da França. Luís acabou anexando a Borgonha ao seu reino. Mesmo que Maria não governasse mais o ducado da Borgonha, ela manteve o título de duquesa. Margarida foi forçada a deixar Gante para sua própria segurança. Alguns dos conselheiros de Maria e os comerciantes ricos que apoiaram o governo repressivo de seu pai foram capturados e mortos por uma multidão enfurecida.",
    ] },
  { "title" = "Casamento", "paragraphs" = [
      "Os conselheiros de Maria estavam insistindo para que ela se casasse com vários candidatos, mas Maria tinha seu coração no arquiduque Maximiliano. Margarida rapidamente finalizou o tratado de casamento com Maximiliano. Maximiliano foi esculpido na sucessão do ducado. Tudo o que restava do reino de Carlos deveria ir para os filhos de Maria e Maximiliano. Em 19 de abril de 1477, enviados do arquiduque chegaram com uma carta e um anel. Maria aceitou imediatamente e um casamento por procuração ocorreu dois dias depois. Maximiliano deixou a Áustria em maio e levou dez semanas para fazer sua viagem à Borgonha, principalmente por falta de fundos. Ele tinha dezoito anos, dois anos mais novo que Maria, cabelos loiros, era elegante e bem educado e falava sete idiomas. Como Maria, ele gostava de caçar e cavalgar. Maximiliano chegou em 18 de agosto e eles se casaram no mesmo dia. Uma trégua foi negociada com o rei Luís XI, que durou um ano. No entanto, essa trégua não foi renovada.",
      "Poucas noites depois de seu casamento, Maria trouxe falcões com ela para o quarto. O casal se apaixonou, e o casamento parece ter sido bastante feliz. Maria ensinou francês a Maximiliano e ele lhe ensinou alemão. Eles leram romances juntos e foram caçar. Seu galgo dormia no mesmo quarto com eles. Eles teriam três filhos. Filipe, futuro rei de Castela, conhecido como o Belo, nasceu em julho de 1478. Margarida nasceu em 10 de janeiro de 1480. Em setembro de 1481, Maria teve um menino chamado Francisco, que morreu pouco depois de nascer. Maria caiu em depressão pós-parto. Entretanto, Maximiliano passava muito tempo longe, lutando contra o astuto rei Luís XI.",
      "Alguns historiadores dizem que ela teria vivido um caso de amor com o Conde de Brabante, com quem teria tido um filho bastardo, que permaneceu oculto e cujo paradeiro perdeu-se.",
    ] },
  { "title" = "Descendência", "paragraphs" = [
      "Casou-se com Maximiliano I de Habsburgo, filho do imperador Frederico III, em 18 de agosto de 1477, na cidade de Gante. Nasceram dois filhos, que se uniram em casamentos, na mesma ocasião, à Casa de Trastâmara, ou seja, a filhos dos reis católicos Fernando II de Aragão e Isabel I de Castela.",
      "Filipe I de Castela (22 de julho de 1478 - 25 de setembro de 1506), casado com Joana de Castela. Por esse casamento, Maria foi avó do imperador Carlos V.",
      "Margarida de Áustria, duquesa de Saboia (10 de janeiro de 1480 - 1 de dezembro de 1530), que casou com João, Príncipe das Astúrias, irmão de Joana de Castela. Em segunda núpcias se casou com o duque Felisberto II de Saboia.",
    ] },
]

