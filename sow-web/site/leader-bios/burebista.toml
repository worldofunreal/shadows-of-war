[articles.en]
text = "Burebista was the king of the Getae and Dacian tribes from 82/61 BC to 45/44 BC. He was the first king who successfully unified the tribes of the Dacian kingdom, which comprised the area located between the Danube, Tisza, and Dniester rivers, and modern day Romania and Moldova."
title = "Burebista"
lang = "en"
url = "https://en.wikipedia.org/wiki/Burebista"
intro = [
  "Burebista (Ancient Greek: Βυρεβίστας, Βοιρεβίστας) was the king of the Getae and Dacian tribes from 82/61 BC to 45/44 BC. He was the first king who successfully unified the tribes of the Dacian kingdom, which comprised the area located between the Danube, Tisza, and Dniester rivers, and modern day Romania and Moldova. In the 7th and 6th centuries BC it became home to the Thracian peoples, including the Getae and the Dacians. From the 4th century to the middle of the 2nd century BC the Dacian peoples were influenced by La Tène Celts who brought new technologies with them into Dacia. Sometime in the 2nd century BC, the Dacians expelled the Celts from their lands. Dacians often warred with neighbouring tribes, but the relative isolation of the Dacian peoples in the Carpathian Mountains allowed them to survive and even to thrive. By the 1st century BC the Dacians had become the dominant power.",
  "From 61 BC onwards Burebista pursued a series of conquests that expanded the Dacian kingdom. The tribes of the Boii and Taurisci were destroyed early in his campaigns, followed by the conquest of the Bastarnae and probably the Scordisci peoples. He led raids throughout Thrace, Macedonia, and Illyria. From 55 BC the Greek cities on the west coast of the Black Sea were conquered one after another. These campaigns inevitably culminated in conflict with Rome in 48 BC, at which point Burebista gave his support to Pompey. This in turn made him an enemy to Julius Caesar, who decided to start a campaign against Dacia. This plan fell through in 44 BC when Caesar was assassinated. Burebista himself was assassinated in a plot by the Dacian aristocracy at around the same time.",
  "After Burebista's death, the empire he had created broke up into smaller kingdoms. From the reign of Tiberius to Domitian, Dacian activity was reduced into a defensive state. The Romans abandoned plans of mounting an invasion against Dacia. In 86 AD the Dacian king, Decebalus, successfully re-united the Dacian kingdom under his control. Domitian attempted a hasty invasion against the Dacians that ended in disaster. A second invasion brought peace between Rome and Dacia for nearly a decade, until Trajan became emperor in 98 AD. Trajan also pursued two conquests of Dacia. The first, in 101–102 AD, concluded in a Roman victory. Decebalus was forced to agree to harsh terms of peace, but did not honour them, leading to a second invasion of Dacia in 106 AD that ended the independence of the Dacian kingdom.",
]
sections = [
  { "title" = "Dacian kingdom", "paragraphs" = [
      "The area roughly located between the Danube, Tisza and Dniester rivers – approximately coinciding with modern-day Romania – became home to a varied group of Thracian peoples, including the Getae and Dacians, sometime around the 7th to 6th centuries BC. The Getae and Dacians are related but distinct peoples that are sometimes treated as a single group under the name of Geto-Dacians. The Getae and the Dacians shared many cultural and linguistic similarities. Living in the lower Danube basin, the Getae were able to establish regular trade with the Greek cities along the coast of the Black Sea. The Dacians were located in the Carpatho-Danubian basin along the southern border of the Carpathian Mountains. This relative geographic isolation allowed the Dacians to survive catastrophic struggles – often with the Getae – and thrive to become the dominant tribe by the 1st century BC.",
      "Before Burebista's rule, the Dacians had experienced a succession of kings through the period 450 to 60 BC. The kings included Dromichaetes, Oroles, and Rubobostes in the 3rd and 2nd centuries BC. From the 4th century BC to the 2nd century BC the La Tène Celts of the Danube, Alpines, and Balkans influenced the Dacian culture. La Tène material culture was found in the central and north-west regions of Dacia. The development of a La Tène-based economy in the 3rd and 2nd centuries BC allowed the consolidation of political power through tribal unions. Such regional unions were found among both the Transylvanian Dacians under the rule of Rubobostes and the Moldavian and Muntenian Getae in Argedava.",
      "It is from the La Tène that the Dacians were introduced to the potter's wheel, superior metal-working techniques, and probably a tradition of minting coins. In homes were found a combination of Celtic and Dacian pottery, and certain Celtic-style graves contain Dacian style vessels. This suggests a sort of co-existence and fusion between the cultures. Sometime after around 150 BC, however, evidence of La Tène culture peters out, around the same time the Dacian culture began to mature, as evidenced by population and economic growth. Under Rubobstes the authority of the Dacians appears to have increased, thus ending the dominance of the Celtic culture, and leading to the Celts being expelled from the area or merging into the culture, or both. There is archaeological evidence to suggest that relations between Dacians and Celts living in the areas north and west of Dacia continued. Painted ceramics of late La Tène-style have been found in Dacian sites in west and central Dacia. Some of these ceramics were imported while others were made by Dacian potters imitating Celtic style. A stable monarchy, however, only developed when Burebista became king. Burebista's accession came with the expulsion of Celts around 60 BC when his forces moved through to the middle Danube region, and with the support of the religious establishment and leaders in Dacia which brought around a stricter moral code in the Dacian kingdom. Around this time the pottery of the Dacian style began appearing in Celtic settlements in Central Europe, including the area covered by the former Yugoslavia, especially in Gomolava, Yugoslavia, and Budapest, Hungary.",
    ] },
  { "title" = "Reign of Burebista", "paragraphs" = [
      "The exact date that Burebista came to reign over the Dacians is debated among scholars; University of Illinois professor Keith Hitchins gave a starting date for Burebista's reign of 82 BC, while historian Matthew Bunson, and authors John Middleton and Michael Schmitz suggest a starting date around 61–60 BC. The historian John Koch states that Burebista founded an empire sometime during the 1st century BC and that around 61 BC Burebista expelled the Celts and moved into the middle Danube.",
      "This alliance was probably a weakly centralized state, with a military organization similar to that of the Hellenistic kingdoms. The exact degree of centralization is a matter of debate, with archaeologists such as Kris Lockyear denying the existence of a state, saying the archaeological evidence shows regional diversity and only a few region-wide trends. Others, such as historian Alexandru Diaconescu, dispute this and conclude that there was a centralized political structure.",
      "In the Orăștie Mountains, Burebista built a system of stone fortifications on high ground; the most important of such hill forts are located today in the villages of Costești, Blidaru, Piatra Roșie, and Bănița. These citadels, which exhibited Greek military architecture, coupled with the presence of Burebista and his armed forces, served to secure the Dacian people internally.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "Burebista may have outlived Caesar for only a short time. In the same year Caesar was assassinated, Burebista was killed in a plot by the Dacian aristocracy, who saw a centralized state as leading to a reduction in their privileges. After his death, the Dacian kingdom dissolved, with the exception of the enclave around the Orăștie Mountains, while the rest became various smaller kingdoms. After Burebista's death, the kingdom was divided into four parts, to be ruled by the religious elite. By the time of Augustus Dacia had broken further into five parts.",
    ] },
  { "title" = "Dacia after Burebista", "paragraphs" = [
      "In the time following Burebista's death, and between the rule of Tiberius and the rule of Domitian, Dacian activity was minimal. The Dacians were forced into a defensive state where their main activity was keeping the Romans out of Dacian territories. The regional factions that remained posed no substantial threat to the Roman empire, and Roman sources stop mentioning plans for Roman invasions during this time. Dacian power resurged during the reigns of Duras – who reigned 68–87 AD and peaked during the reign of Decebalus – who reigned from 85/87-106 AD. By this time the Dacian tribes had united once more, under the rule of Decebalus, and again posed a threat to Rome.",
      "Decebalus' reign saw nearly constant warfare between the Dacians and Roman administrations south of the Danube. Around 85 AD raiding resumed in Moesia, Illyria, and Macedonia, culminating in the death of the Roman Governor of Moesia, Oppius Sabinius. In response, Domitian launched a campaign the same year under the command of the Praetorian Prefect Cornelius Fuscus. Domitian ignored Decebalus' offer of peace, an error which caused the Romans to suffer a disastrous defeat, losing not only Fuscus, but his forces and the Roman standards and war machines. A second expedition was launched in 88 AD, this time under the command of Tettius Julianus. This second campaign was somewhat victorious as both sides suffered massive casualties in battle. However, revolts and defections forced Domitian to negotiate a hasty peace treaty with Decebalus in 89 AD. This peace had benefits and costs to both sides: Rome had to pay financial tributes and provide technological assistance to Dacia; in exchange, Dacia effectively became a client kingdom of Rome, acting as a bulkhead for the empire, separating Rome from other warring tribes.",
      "This peace lasted for around a decade, until Trajan became emperor in 98 AD. Immediately upon becoming emperor, Trajan travelled to the frontier stretching from Pannonia to Moesia, where he worked to strengthen the fortifications. In 101–102 AD Trajan assembled an army of up to 150,000 men to send against Decebalus' 50,000. The army was split into two and entered into Dacian territory at two points along the frontier. The columns met at Tibiscum and marched together towards Sarmizegetusa. At Tapae they encountered and defeated the Dacian force. This in turn forced Decebalus to sue for peace. Trajan agreed but imposed harsh terms against the Dacians. Decebalus failed to meet the terms of the peace, and in 105 Trajan launched a second campaign against him. By 106 Trajan had completed the conquest of Dacia, ending its existence as an independent kingdom.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The image of fearless and noble Dacians as predecessors to modern Romanians was augmented and impressed by nationalist movements in the late 1920s and 1930s. On one hand, the Dacians were often used in discourses claiming an ethnically pure origin for the Romanian people. At the same time, however, the Romans were preferred instead when the objective was portraying Romania as a civilized and cosmopolitan nation.",
      "In the 1960s statues were erected for the two leaders of the Dacian kingdom, Burebista and Decebalus. These came as part of a gradual process of disassociating Socialist Romania from the Soviet Union. The statues depict the kings as freedom fighters, and nationwide celebrations were held for the anniversaries of ancient battles. Additionally, two government-funded film productions were created as part of this same process. Both films focus on the history of Dacia in the 1st and 2nd century AD and the exploits of Decebalus, while Burebista is almost ignored.",
      "Starting in the 1970s, the Nicolae Ceaușescu regime used nationalistic and questionable interpretations of ancient history (Protochronism) to legitimize its rule. In 1980 the Romanian government declared a celebration of the 2,050th anniversary of the founding of the \"unitary and centralized\" Dacian state of Burebista, drawing comparisons with Ceaușescu's Romania and claiming an uninterrupted existence of the state from Burebista to Ceaușescu. The epic movie Burebista (1980) based on the king's life was released the same year, and celebrated him as the Romanian pater patriae. This commemoration led the press to note \"similarities\" between Burebista and Ceaușescu, and even professional historians such as Ion Horațiu Crișan spoke about Burebista in ways similar to how party activists spoke about Ceaușescu.",
    ] },
]

[articles.es]
text = "Burebista (a veces escrito Birebistas o Berebistas, nombre en griego antiguo: Βυρεβίστας, Βοιρεβίστας) fue un rey de los getas y los dacios,​ que erigió un extenso aunque breve imperio en las tierras del Danubio entre los años 82 y 44 a. C., unificando estas tribus por primera vez.​ Dirigió saqueos y redadas de conquista a través de la zona central y el sudeste de Europa, subyugando a la mayoría de las tribus vecinas."
title = "Burebista"
lang = "es"
url = "https://es.wikipedia.org/wiki/Burebista"
intro = [
  "Burebista (a veces escrito Birebistas o Berebistas, nombre en griego antiguo: Βυρεβίστας, Βοιρεβίστας) fue un rey de los getas y los dacios,​ que erigió un extenso aunque breve imperio en las tierras del Danubio entre los años 82 y 44 a. C., unificando estas tribus por primera vez.​ Dirigió saqueos y redadas de conquista a través de la zona central y el sudeste de Europa, subyugando a la mayoría de las tribus vecinas. Después de su asesinato en un golpe de palacio, su imperio fue dividido en Estados más pequeños.",
]
sections = [
  { "title" = "Referencias iniciales", "paragraphs" = [
      "Solo sobreviven tres fuentes antiguas sobre Burebista: Estrabón: Geographica 7.3.5, 7.3.11 y 16.2.39 (quien lo nombra Byrebistas y Boirebistas); Jordanes: Getica 67 (escribe su nombre Buruista) y una inscripción en mármol encontrada en Balchik, Bulgaria, que actualmente se exhibe en el Museo Nacional en Sofía, la cual representa un decreto para los ciudadanos de Dionisopolis sobre Akornion.​",
    ] },
  { "title" = "Desarrollo de la política de Burebista", "paragraphs" = [
      "El desarrollo de una economía basada en la Cultura de La Tène en los siglos II y III a. C. dejó el poder político consolidado a través de uniones tribales. Tales uniones regionales se dieron entre los dacios de Transilvania (durante el reinado de Rubobostes) y los getas de Moldavia y de Valaquia (con un centro de poder en Argedava).",
      "Unificó a la población tracia desde el río Hercinica (el actual Morava) al oeste, hasta el Bug meridional en el este, y desde los Cárpatos septentrionales hasta Dionisópolis, eligiendo su capital (llamada Argedava o Sargedava) cerca de Costeşti, actualmente al suroeste de Rumania, en las colinas Orăştie, donde se erigieron las fortalezas dacias de las montañas Orastia.",
      "Esta alianza era probablemente un Estado débilmente centralizado, con una organización militar similar a la del período helenístico.​ El grado exacto de centralización es tema de discusión entre los arqueólogos. Algunos, como K. Lockyear, niegan la existencia de un Estado, porque la evidencia arqueológica muestra mucha diversidad regional, con solo unas pocas tendencias en toda la región. Otros, como A. Diaconescu, ponen esto en duda, concluyendo que había una estructura política centralizada.​",
    ] },
  { "title" = "Conquistas y política exterior", "paragraphs" = [
      "Burebista dirigió una política de conquista de territorios nuevos: en 60/59 a. C. por el oeste atacó y venció a las tribus celtas de boyos y tauriscos, que habitaban a orillas del Danubio y en lo que es ahora Eslovaquia. Después de 55 a. C. y probablemente antes de 48 a. C., Burebista conquistó la orilla del Mar Negro, apoderándose de las fortalezas griegas desde Olbia hasta Apolonia, así como toda la Llanura panónica de los Balcanes.​ Estrabón también menciona las expediciones contra un grupo de celtas que vivían entre los tracios y los ilirios (probablemente los escordiscos).​",
      "Por el este, con ayuda de los bastarnos como aliados, sometió e impuso un protectorado a las ciudades griegas del Ponto Euxino, desde Apolonia de Tracia (actual Sozopol) hasta Olbia, y extendió su poder hasta Tracia. De esta forma, logró expandir el reino hasta el Danubio y el Morava.",
      "La única polis griega con la que Burebista tuvo buenas relaciones fue Dionisópolis.​ Según un decreto encontrado en esta ciudad, Akornion, un ciudadano de Dionisópolis, fue un jefe de asesores (πρῶτοσφίλος, literalmente 'primer amigo') de Burebista.​",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "Burebista solo sobrevivió a César por un corto periodo. En el mismo año fue asesinado en un complot por la aristocracia tribal, que sentía que un Estado centralizado reduciría su poder. Después de su muerte, el imperio desapareció, con la excepción del núcleo alrededor de las montañas Orăştie,​ mientras que el resto del territorio se fragmentó en varios reinos.​ Cuando Augusto César envió un ejército contra los getas, el reino anterior de Burebista fue dividido en cuatro partes.​",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "En Rumanía, a principios de la década de 1970, el régimen de Nicolás Ceaucescu utilizó una interpretación nacionalista y cuestionable de la historia antigua como manera de legitimar su propio gobierno.​ Por ejemplo, Burebista, un gran conquistador, fue visto como un mero «unificador» de las tribus dacias.​",
      "Como parte de esta tendencia, en 1980 el gobierno rumano declaró la celebración del 2050.º aniversario de la fundación del «unificado y centralizado» Estado dacio de Burebista, haciendo comparaciones con la Rumanía de Ceauşescu y reclamando una ininterrumpida existencia del Estado desde Burebista hasta Ceauşescu.​ La película épica Burebista (1980) basada en la vida del rey, fue estrenada ese mismo año, celebrándole como el Padre de la Patria rumano.​",
      "Esta conmemoración dirigió a la prensa para notar las «semejanzas» entre Burebista y Ceauşescu, e incluso historiadores profesionales como Ion Horațiu Crișan hablaron sobre Burebista en maneras aproximadamente similares a como los activistas del partido hablaron de Ceauşescu.​",
    ] },
]

[articles.de]
text = "Burebista († frühestens 44 v. Chr.) war der erste König des vereinigten Reiches der Daker."
title = "Burebista"
lang = "de"
url = "https://de.wikipedia.org/wiki/Burebista"
intro = [
  "Burebista († frühestens 44 v. Chr.) war der erste König des vereinigten Reiches der Daker. Er vereinigte, teils mit Gewalt, die geto-dakischen Stämme und wurde ihr König. In seiner Regierungszeit trat das neu entstandene Dakerreich auch in politische Beziehungen zu den Römern ein, die beinahe zu einer größeren kriegerischen Auseinandersetzung geführt hätten. Bevor es dazu kam, wurden jedoch die beiden politischen Anführer umgebracht, Burebista einerseits und Iulius Caesar andererseits.",
]
sections = [
  { "title" = "Quellen", "paragraphs" = [
      "Burebista wird nur in wenigen antiken Quellen genannt. In Strabons Geographika, einem Werk des frühen 1. Jahrhunderts n. Chr., erscheint er an mehreren Stellen. In den späteren Handschriften, in denen Strabons Werk überliefert ist, wird sein Name Byrebistas, Byrebista, Byrabeistas oder Boirebista geschrieben. Deutlich später ist das Werk Getica des Schriftstellers Jordanes aus dem 6. Jahrhundert n. Chr., in dem von Buruista die Rede ist.",
      "Die einzige ausführlichere zeitgenössische Quelle ist eine Ehreninschrift, die die Bürger der griechischen Stadt (Polis) Dionysopolis (heute Baltschik in Bulgarien) für ihren Mitbürger Akornion aufstellten. Darin ist auch die Rede von diplomatischen Missionen, die Akornion für König Byrebistas ausführte und bei denen er auch politische Vorteile für seine Heimatstadt Dionysopolis erreichen konnte. Eine weitere Erwähnung findet Burebista in einer weiteren griechischen Inschrift, die in Nessebar gefunden wurde und in der von einem Krieg gegen den dakischen König die Rede ist, an dem die Stadt beteiligt war.",
      "Weitere griechischsprachige Inschriften dieser Zeit erwähnen kriegerische Auseinandersetzungen zwischen den griechischen Städten Thrakiens und einfallenden Völkerstämmen von nördlich der Donau, hinter denen sich die Daker unter Burebista verbergen könnten. Zu den ausführlicheren dieser Texte gehört die Ehreninschrift für Aristagoras aus Histria.",
    ] },
  { "title" = "Leben", "paragraphs" = [
      "Burebista fügte dem dakisch-getischen Kernland weitere Gebiete hinzu: Nach 55 v. Chr. und wahrscheinlich vor 48 v. Chr. eroberte Burebista das Ufer des Schwarzen Meeres und unterwarf die dortigen griechischen Städte von Olbia bis Apollonia. Die direkte Konfrontation mit Rom scheint er dagegen tendenziell eher vermieden zu haben. 50 v. Chr. versuchten die Daker Noricum zu erobern, wurden aber von den Norikern unter ihrem König Voccio geschlagen.",
      "Teilweise wird vermutet, dass zunächst ein Ort namens Argedava als dakische Hauptstadt gedient habe – dies beruht jedoch auf der unsicheren Interpretation einer unvollständig erhaltenen zeitgenössischen Inschrift. Später entwickelte sich unter Burebista die Festung Sarmizegetusa Regia zum Zentrum des Dakerreiches. Auf der Höhe seiner Macht erstreckte sich das Reich von Burebista über eine Fläche, die von der mittleren Donau bis zum Schwarzen Meer reichte.",
      "Zu einem unbekannten Zeitpunkt besiegte er die verbündeten keltischen Stämme der Boier und Taurisker unter Kritosiros, die zuvor an der mittleren Donau in der heutigen Slowakei gelebt hatten und nun nach Osten in dakische Interessenssphären expandierten. Traditionell wurde diese Auseinandersetzung in der Forschung häufig in den 60er oder 50er Jahren v. Chr. angesetzt, vielfach sogar konkret in die Jahre 60/59 v. Chr. Robert Göbl hat aber durch eine Analyse der Münzfunde wahrscheinlich gemacht, dass die Vernichtung der boischen Krieger um Kritasiros erst 41/40 v. Chr. stattfand, eine Neudatierung, die Gerhard Dobesch nach einer Analyse der geschichtlichen Zusammenhänge und verfügbaren Informationen als plausibel einstuft.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Karl Georg Brandis: Burebista. In: Paulys Realencyclopädie der classischen Altertumswissenschaft (RE). Supplementband I, Stuttgart 1903, Sp. 261–264.",
      "Kai Brodersen: Dacia Felix. Das antike Rumänien im Brennpunkt der Kulturen. wbg Philipp von Zabern, Darmstadt 2020, ISBN 978-3-8053-5059-4, besonders S. 70–82.",
      "Gerhard Dobesch: Die Boier und Burebista. In: Jaroslav Tejral, Karol Pieta, Ján Rajtár (Hrsg.): Kelten, Germanen, Römer im Mitteldonaugebiet vom Ausklang der Latène-Zivilisation bis zum 2. Jahrhundert (= Spisy Archeologického Ústavu AV ČR Brno. Band 3). Brno/Nitra 1995, ISBN 80-901679-5-0, S. 15–19.",
    ] },
]

[articles.it]
text = "Burebista (che gli autori greci hanno tramandato col nome di Byrebistas) (82 a.C. circa – 44 a.C.) fu il più grande sovrano della Dacia, sulla quale regnò dal 70 al 44 a.C.."
title = "Burebista"
lang = "it"
url = "https://it.wikipedia.org/wiki/Burebista"
intro = [
  "Burebista (che gli autori greci hanno tramandato col nome di Byrebistas) (82 a.C. circa – 44 a.C.) fu il più grande sovrano della Dacia, sulla quale regnò dal 70 al 44 a.C.. Nacque e morì in Dacia.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Burebista unificò i popoli della Dacia (dall'odierna Moravia al fiume Bug, dai Carpazi a Dionisopoli), scegliendo come sua capitale (chiamata Argedava o Sargedava) un qualche luogo nei pressi di Costești, nei monti Orăştie in Romania sud-occidentale.",
      "Riuscì infatti ad unificare le tribù daciche, dando vita ad un regno che occupava un territorio molto vasto. Questo regno che si andò a costituire rappresentò una minaccia per la Repubblica romana, che possedeva la Macedonia.",
      "Il centro spirituale e religioso del suo regno era Kogaion (o Kagaion, cioè la montagna sacra), secondo Strabone, che andrebbe localizzata nei monti Bucegi. Secondo i Getica di Giordane, il sacerdote più importante nonché consigliere del re, era Deceneo, che aveva \"quasi poteri regali\" e che insegnò ai Daci le leggi, l'etica e la scienza fisica e astronomica.",
    ] },
  { "title" = "Epigoni", "paragraphs" = [
      "Alla morte di Burebista si dissolse anche l'unità del suo regno, diviso fra quattro – o forse cinque – epigoni, la cui consistenza storica è poco più che una pallida «ombra»: Coson, Cotisone e Comosico si insediarono nella parte sud-occidentale del regno, mentre a Dicomes spettò la parte sud-orientale.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(GRC) Appiano di Alessandria, Historia Romana (Ῥωμαϊκά). (traduzione inglese Archiviato il 20 novembre 2015 in Internet Archive.).",
      "Lászlo Makkai and András Mócsy, editors, 2001. History of Transylvania, I: Transylvania in Prehistory and Antiquity\", 2. András Mócsy, \"The Dacian Kingdom\", su mek.oszk.hu.",
      "I.H. Crişan, Burebista and His Time, Editura Academiei Republicii Socialiste Romania, Bucureşti 1978",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Burebista, su geocities.com. URL consultato il 23 novembre 2006 (archiviato dall'url originale il 20 marzo 2008).",
    ] },
]

[articles.tr]
text = "Burebista (Eski Yunanca: Βυρεβίστας, Βοιρεβίστας) MÖ 82/61'den itibaren MÖ 45/44'e kadar Getae ve Daçya kabilelerinin kralıydı. Tuna, Tisa ve Dinyester nehirleri ile günümüz Romanya ve Moldova arasındaki bölgeyi kapsayan Daçya krallığının kabilelerini başarıyla birleştiren ilk kraldı."
title = "Burebista"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Burebista"
intro = [
  "Burebista (Eski Yunanca: Βυρεβίστας, Βοιρεβίστας) MÖ 82/61'den itibaren MÖ 45/44'e kadar Getae ve Daçya kabilelerinin kralıydı. Tuna, Tisa ve Dinyester nehirleri ile günümüz Romanya ve Moldova arasındaki bölgeyi kapsayan Daçya krallığının kabilelerini başarıyla birleştiren ilk kraldı. Milattan önce 7. ve 6. yüzyıllarda Getae ve Daçyalılar da dahil olmak üzere Trakya halklarını yönetii. MÖ. 4.'den itibaren 2. yüzyılın ortalarına kadar Daçya halkları, Dacia'ya yeni teknolojiler getiren La Tène Keltlerinden etkilendiler. 2. yüzyılda Daçyalılar Keltleri topraklarından kovdu. Daçyalılar genellikle komşu kabilelerle savaştı ancak Karpat Dağları'ndaki Daçya halklarının görece izolasyonu onların hayatta kalmasına ve gelişmesine izin verdi. MÖ. 1. yüzyılda Daçyalılar baskın güç haline geldi.",
]
sections = [
  { "title" = "Kaynakça", "paragraphs" = [
      "History and Myth in Romanian Consciousness. Central European University Press. 2001. ISBN 963-9116-97-1.",
