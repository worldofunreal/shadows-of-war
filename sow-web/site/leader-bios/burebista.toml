[articles.ar]
text = "بوريبيستا (بالإنجليزية: Burebista) ((الإغريقية: Βυρεβίστας, Βοιρεβίστας)) هو ملك الغيتيون والدايقون، الذي وحد بين هذه القبائل لأول مرة وحكمها من 82 ق.م إلى 44 ق.م. وقاد هجمات سلب واستيلاء على وسط وجنوب شرق أوروبا، حتى خضعت له أغلب القبائل المجاورة."
title = "بوريبيستا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A8%D9%88%D8%B1%D9%8A%D8%A8%D9%8A%D8%B3%D8%AA%D8%A7"
intro = [
  "بوريبيستا (بالإنجليزية: Burebista) ((الإغريقية: Βυρεβίστας, Βοιρεβίστας)) هو ملك الغيتيون والدايقون، الذي وحد بين هذه القبائل لأول مرة وحكمها من 82 ق.م إلى 44 ق.م. وقاد هجمات سلب واستيلاء على وسط وجنوب شرق أوروبا، حتى خضعت له أغلب القبائل المجاورة. وبعد اغتياله في مؤامرة داخلية، انقسمت الإمبراطورية إلى العديد من الدويلات.",
]
sections = [
  { "title" = "المراجع الأولى", "paragraphs" = [
      "هناك ثلاثة مصادر قديمة ورد فيها ذكر بوريبيستا وهي: سترابو: المنطقة الجغرافية 7.3.5 و 7.3.11 و 16.2.39 (الذي يتهجى اسمه بيريبيستاس وبويريبيستاس)، يوردانس: جتيكا 67 (يتهجى اسمه بورويستا)، وكتابة منقوشة رخامية اكتشفت في بالشيك (Balchik) في بلغاريا (محفوظة الآن في المتحف الوطني في صوفيا، وهي عبارة عن مرسوم ديونيسوبوليس لمواطني ديونيسوبوليس فيما يتعلق بـ أكورنيون.",
    ] },
  { "title" = "تطور نظام حكم بوريبيستا", "paragraphs" = [
      "ساعد تطور الاقتصاد القائم على اللاتين في القرنين الثاني والثالث قبل الميلاد في تعزيز القوة السياسية عن طريق الاتحاد بين القبائل. وكانت هذه الاتحادات الإقليمية قائمة بين الغيتون في ترانسيلفانيا (تحت حكم الملك روبوبوستيس) والغيتيون في مولدوفا وولاشيا (حيث كانت أرجيدافا هي مركز الحكم في البلاد). وكان بوريبيستا هو أول من أنشأ اتحادًا للقبائل يضم كلاً من الدايقون والغيتيون.",
      "وكان هذا التحالف القبلي دولة ضعيفة المركزية، ذات تنظيم عسكري يشبه تنظيم الممالك الهيلينية. ولا تزال درجة المركزية في هذه الدولة قيد البحث، في حين تجد بعض علماء الآثار - منهم لوكيير (Lockyear) - الذين ينكرون وجود دولة ذات توجهات قليلة على النطاق الإقليمي لأن البراهين الأثرية تظهر تنوعًا إقليميًا كبيرًا. ويرد عليهم علماء آثار آخرون - منهم دياكونسكو (A. Diaconescu) - يرون أنها كانت ذات هيكل سياسي مركزي. وعلى أية حال، لا يبدو أن هناك إجابة قاطعة لهذا التساؤل، بسبب العديد من العوامل الأثرية.",
      "وأثناء عهد بوريبيستا، ولردح من الزمن كان يُعتقد بأن المجتمع في هذه البلاد بدأ يظهر فيه نظام رق أشبه بالنظام المتّبع في روما واليونان القديمة، ولكن يُحتمل أن أغلب هذا كان على يد الأحرار.",
    ] },
  { "title" = "الغزوات والسياسة الخارجية", "paragraphs" = [
      "انتهج بوريبيستا سياسة غزو مناطق جديدة: ففي سنة 60/59 ق.م، هاجم القبائل الكلتية من البوئي (Boii) والتوريسي (Taurisci) التي سكنت في دانوب الوسطى (Middle Danube) وما يطلق عليه الآن سلوفاكيا (Slovakia). وبعد 55 ق.م ويحتمل قبل 48 ق.م، غزا بوريبيستا شاطئ البحر الأسود، فأخضع الحصون اليونانية من أولبيا إلى أبولونيا، فضلاً عن حصون السهل الدانوبي على الطريق إلى البلقان. وذكر ستاربو أيضًا السرايا التي بعثها ضد مجموعة من الكلت الذين عاشوا بين التراقيين والإليريانيين (يحتمل أن يكونوا هم سكورديسكي).",
      "والمدني الوحيد الذي كان يتمتع بعلاقات طيبة مع بوريبيستا هو ديونيسوبوليس. ووفقًا لنص كتابة منقوشة وُجدت في المدينة، كان أكورنيون - أحد مواطني المدينة - كبير مستشاري (πρῶτοσφίλος، حرفيًا «الصديق الأول») لبوريبيستا.",
      "وامتدت الإمبراطورية في أزهى عصورها من منطقة كارباثيان السلوفاكية الحديثة إلى البلقان، ومن دانوب الوسطى إلى البحر الأسود. وادعى سترابو أن الغيتيين كانوا يستطيعون استنفار 200000 جندي وقت الحرب، وهو رقم يصعب تصديقه نوعًا ما، ولكنه قد يمثل إجمالي عدد الذكور الأصحاء، وليس عدد الجيش. وكان بوريبيستا خصمًا عنيدًا للرومان، حيث استطاعت جنوده عبور نهر الدانوب وإخضاع البلدان بعمق يصل إلى ثريس، مقدونيا (Macedonia) وإليريا (Illyria).",
    ] },
  { "title" = "وفاته", "paragraphs" = [
      "تم اغتيال بوريبيستا في مؤامرة حقيرة قامت بها مجموعة من نبلاء القبائل الذين استشعروا أن العمل على تعزيز سير البلاد في اتجاه دولة مركزية سيقلص كثيرًا من صلاحياتهم. وبعد موته تفككت الإمبراطورية، باستثناء النواة المحيطة بجبال أوراشتيه، في حين جرى تقسيم باقي الإمبراطورية إلى ممالك متعددة. وعندما أرسل يوليوس قيصر جيشًا إلى الغيتيين، انقسمت دولتهم التي أسسها بوريبيستا إلى أربع دويلات.",
    ] },
  { "title" = "الإرث", "paragraphs" = [
      "في رومانيا وبدءًا من سبعينيات القرن العشرين، اتجه نظام نيكولاي تشاوتشيسكو إلى استخدام التاريخ القديم، وهو ما يُفسر على محمل قومي وجدلي (بروتوتكرونية) على أنه وسيلة لإضفاء الشرعية على حكم البلاد. فمثلاً، لم يكن يمثل بوريبيستا إلا الفاتح العظيم الذي وحد قبائل الدايقون.",
      "وظهر هذا الاتجاه سنة 1980، حين أعلنت الحكومة الرومانية الاحتفال بذكرى مرور 2050 عام على تأسيس دولة الدايقون «الموحدة والمركزية» على يد بوريبيستا، مقارنين بين دولة الدايقون ورومانيا في عهد تشاوتشيسكو ومدعين تواصل دولة برويبيسنا وتشاوشيسكو دون انقطاع.",
      "وكان إحياء هذه الذكرى مما دعا رجال الصحافة إلى تسجيل أوجه الشبه بين بوريبيستا وتشاوتشيسكو، وحتى كبار المؤرخين مثل أيون هوراتسيو كريشان كانوا يصفون تشاوتشيسكو بكلمات شبيهة بالكلمات التي كان يستخدمها نشطاء الأحزاب.",
    ] },
]

[articles.ru]
text = "Буреби́ста — царь Дакии, с 82 года по 44 год до нашей эры. Убит во время народного восстания (мятежа)."
title = "Буребиста"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%91%D1%83%D1%80%D0%B5%D0%B1%D0%B8%D1%81%D1%82%D0%B0"
intro = []
sections = [
  { "title" = "Объединение гето-дакских племен", "paragraphs" = [
      "В первой половине I века до н. э. гето-даки достигли высокого уровня развития. Состоялся переход к новому типу хозяйства, основанного на торговле. Крепкие связи с греческими этносами способствовали объединению племен. Другой основной причиной стала угроза завоевания. С запада и северо-запада усилились кельты. На востоке скифы, бастарны, сарматы оказывали давление на территории гетов. Но наибольшую угрозу для даков представляла экспансия римлян, которые после завоевания Греции и Македонии вплотную подошли к дако-гетским территориям. Все эти факторы, внутренние и внешние, способствовали объединению гето-дакских племен, под руководством Буребисты. Его правой рукой в управлении государством стал первосвященник Декеней.",
      "«Буребиста, гет, достиг верховной власти над своим племенем. Ему удалось возродить свой народ, изнуренный длительными войнами, и возвысить его путём физических упражнений, воздержания и повиновения его приказам настолько, что за несколько лет он основал великую державу и подчинил гетам большую часть соседних племен. Он стал внушать страх даже римлянам, так как безбоязненно переходил Истр, разоряя Фракию вплоть до Македонии и Иллирии; опустошил также страну кельтов, смешавшихся с фракийцами и иллирийцами, а бойев, бывших под властью Критасира, и таврисков совершенно уничтожил. Чтобы удержать племя в повиновении, он обратился за помощью к колдуну Декенею, который странствовал по Египту и научился узнавать некоторые предзнаменования, по которым объявлял волю богов. Вскоре его провозгласили богом, как я уже упомянул, говоря о Залмоксисе».",
    ] },
  { "title" = "Государство Буребисты", "paragraphs" = [
      "Основное ядро нового государства располагалось на юге нынешней Трансильвании в районе Орэштийских гор, хорошо защищённом естественными преградами. Здесь также находились значительные запасы минеральных ресурсов. Ядро государства было значительно укреплено.",
      "Начиная с Орэштийских гор, власть Буребисты распространилась на все земли, занятые гето-даками. На востоке территория распространялась до реки Буг. На юге Буребиста, согласно Страбону, устраивал набеги до самых границ римской провинции Македония, на северо-западе успешно воевал с кельтами и даже с племенем бойев, жившим на территории нынешней Чехии. Страбон же сообщает, что верховным жрецом, предсказателем и главным советником царя был некто Декеней, которого почитали, как бога; он заставил даков вырубить виноградные лозы и «жить без вина».",
    ] },
  { "title" = "Конец правления Буребисты", "paragraphs" = [
      "Согласно Страбону, Буребиста был убит во время мятежа. Его, скорее всего, организовали аристократы, недовольные проводимой Буребистой политикой укрепления централизованной власти. Но нельзя исключать и версию организации убийства Римом. После смерти Буребисты государство распалось на 4 части.",
      "Историческое значение периода правления Буребисты велико. Он сумел создать первое объединённое государство гето-даков, которое распространилось на всей территории обитания этих племен. Однако созданный им племенной союз оказался недолговечным и не перерос в полноценное и устойчивое государственное образование. Более века спустя после смерти Буребисты его дело объединения страны и создания дакского государства продолжил Децебал, однако конечным результатом его деятельности стало военное поражение и превращение Дакии в римскую провинцию Дакия.",
    ] },
  { "title" = "Наследие", "paragraphs" = [
      "Есть только три первоисточника, упоминающих Буребисту: Страбон, Иордан и мраморная доска с надписью, найденная в Балчике, Болгария (сейчас экспонируется в Национальном историческом музее в Софии), где упоминается Акорнион.",
      "В Румынии, начиная с 1970-х годов, коммунистический диктатор Николае Чаушеску использовал древнюю историю, рассматривая через фильтр националистической и довольно противоречивой интерпретации, известной как протохронизм, для оправдания своего правления. Например, Буребиста, который был великим завоевателем, считался просто объединителем дакийских племен.",
      "В рамках этой тенденции в 1980 году румынское правительство провозгласило 2050-летие появления «единого и централизованного» дакского государства в Буребисте, сравнив его с Румынией Чаушеску и заявив о продолжении существования страны от Буребисты до Чаушеску.",
    ] },
]

