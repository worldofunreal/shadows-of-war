[articles.en]
text = "Haudenosaunee oral tradition remembers Hiawatha, also called Aionwatha, for helping the Peacemaker bring the Mohawk, Oneida, Onondaga, Cayuga and Seneca nations together. The Onondaga account describes Hiawatha grieving and the Peacemaker using strands of shell beads, or wampum, in words of condolence. Hiawatha then helped carry the message of peace to the nations. The exact date of their union is unknown."
title = "Hiawatha"
lang = "en"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Haudenosaunee oral tradition remembers Hiawatha, also called Aionwatha, for helping the Peacemaker bring the Mohawk, Oneida, Onondaga, Cayuga and Seneca nations together. The Onondaga account describes Hiawatha grieving and the Peacemaker using strands of shell beads, or wampum, in words of condolence. Hiawatha then helped carry the message of peace to the nations. The exact date of their union is unknown."]
sections = [{ title = "The belt that records the peace", paragraphs = ["The Hiawatha Belt records the agreement with five figures joined across a field of purple shell beads. The central figure, the Tree of Peace, stands for the Onondaga, who keep the council fire. The nations maintained their own councils while dealing with shared affairs under a common law. The Confederacy later welcomed the Tuscarora, who joined in the early eighteenth century. The belt remains a record of the original five nations’ agreement and is present at Grand Council to remind leaders of their responsibilities to coming generations."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.es]
text = "La tradición oral haudenosaunee recuerda a Hiawatha, también llamado Aionwatha, por ayudar al Pacificador a reunir a las naciones mohawk, oneida, onondaga, cayuga y seneca. Según el relato onondaga, mientras Hiawatha estaba de duelo, el Pacificador usó hileras de cuentas de concha, llamadas wampum, al dirigirle palabras de consuelo. Hiawatha ayudó después a llevar el mensaje de paz a las naciones. La fecha exacta de su unión se desconoce."
title = "Hiawatha"
lang = "es"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["La tradición oral haudenosaunee recuerda a Hiawatha, también llamado Aionwatha, por ayudar al Pacificador a reunir a las naciones mohawk, oneida, onondaga, cayuga y seneca. Según el relato onondaga, mientras Hiawatha estaba de duelo, el Pacificador usó hileras de cuentas de concha, llamadas wampum, al dirigirle palabras de consuelo. Hiawatha ayudó después a llevar el mensaje de paz a las naciones. La fecha exacta de su unión se desconoce."]
sections = [{ title = "El cinturón que registra la paz", paragraphs = ["El cinturón de Hiawatha registra el acuerdo con cinco figuras unidas sobre un fondo de cuentas moradas. La figura central, el Árbol de la Paz, representa a los onondaga, guardianes del fuego del consejo. Las naciones conservaron sus propios consejos y trataron los asuntos compartidos bajo una ley común. A principios del siglo XVIII se incorporaron los tuscarora. El cinturón conserva la memoria del acuerdo de las cinco naciones originales y está presente en el Gran Consejo para recordar a sus dirigentes su responsabilidad con las generaciones venideras."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.fr]
text = "La tradition orale haudenosaunee se souvient de Hiawatha, aussi appelé Aionwatha, pour son aide au Pacificateur dans le rapprochement des nations mohawk, oneida, onondaga, cayuga et seneca. Dans le récit onondaga, Hiawatha est en deuil et le Pacificateur lui adresse des paroles de consolation en tenant des rangs de perles de coquillage, le wampum. Hiawatha aide ensuite à porter le message de paix. La date exacte de l’union demeure inconnue."
title = "Hiawatha"
lang = "fr"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["La tradition orale haudenosaunee se souvient de Hiawatha, aussi appelé Aionwatha, pour son aide au Pacificateur dans le rapprochement des nations mohawk, oneida, onondaga, cayuga et seneca. Dans le récit onondaga, Hiawatha est en deuil et le Pacificateur lui adresse des paroles de consolation en tenant des rangs de perles de coquillage, le wampum. Hiawatha aide ensuite à porter le message de paix. La date exacte de l’union demeure inconnue."]
sections = [{ title = "La ceinture qui consigne la paix", paragraphs = ["La ceinture de Hiawatha consigne cet accord par cinq figures reliées sur un fond de perles violettes. La figure centrale, l’Arbre de la Paix, représente les Onondagas, gardiens du feu du conseil. Les nations ont conservé leurs propres conseils et ont réglé les affaires communes sous une même loi. Les Tuscaroras les ont rejointes au début du XVIIIe siècle. La ceinture garde la mémoire de l’accord initial et accompagne le Grand Conseil pour rappeler aux dirigeants leurs responsabilités envers les générations futures."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.de]
text = "Die mündliche Überlieferung der Haudenosaunee erinnert an Hiawatha, auch Aionwatha genannt, als Helfer des Friedensstifters bei der Vereinigung der Mohawk, Oneida, Onondaga, Cayuga und Seneca. Nach der Erzählung der Onondaga war Hiawatha in Trauer. Der Friedensstifter hielt Schnüre aus Muschelperlen, Wampum, und sprach ihm Trost zu. Danach half Hiawatha, den Nationen die Botschaft des Friedens zu überbringen. Das genaue Datum ihrer Vereinigung ist unbekannt."
title = "Hiawatha"
lang = "de"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Die mündliche Überlieferung der Haudenosaunee erinnert an Hiawatha, auch Aionwatha genannt, als Helfer des Friedensstifters bei der Vereinigung der Mohawk, Oneida, Onondaga, Cayuga und Seneca. Nach der Erzählung der Onondaga war Hiawatha in Trauer. Der Friedensstifter hielt Schnüre aus Muschelperlen, Wampum, und sprach ihm Trost zu. Danach half Hiawatha, den Nationen die Botschaft des Friedens zu überbringen. Das genaue Datum ihrer Vereinigung ist unbekannt."]
sections = [{ title = "Der Gürtel als Zeugnis des Friedens", paragraphs = ["Der Hiawatha-Gürtel hält die Übereinkunft mit fünf verbundenen Figuren auf violettem Muschelperlengrund fest. In der Mitte steht der Friedensbaum für die Onondaga, die das Ratsfeuer hüten. Die Nationen behielten ihre eigenen Räte und regelten gemeinsame Angelegenheiten unter einem gemeinsamen Gesetz. Im frühen achtzehnten Jahrhundert kamen die Tuscarora hinzu. Der Gürtel erinnert den Großen Rat bis heute an die ursprüngliche Übereinkunft und an die Verantwortung gegenüber kommenden Generationen."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.it]
text = "La tradizione orale haudenosaunee ricorda Hiawatha, detto anche Aionwatha, per aver aiutato il Pacificatore a riunire le nazioni mohawk, oneida, onondaga, cayuga e seneca. Nel racconto degli Onondaga, Hiawatha è in lutto e il Pacificatore gli rivolge parole di conforto con fili di perline di conchiglia, il wampum. Hiawatha aiuta poi a portare il messaggio di pace alle nazioni. La data esatta della loro unione è sconosciuta."
title = "Hiawatha"
lang = "it"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["La tradizione orale haudenosaunee ricorda Hiawatha, detto anche Aionwatha, per aver aiutato il Pacificatore a riunire le nazioni mohawk, oneida, onondaga, cayuga e seneca. Nel racconto degli Onondaga, Hiawatha è in lutto e il Pacificatore gli rivolge parole di conforto con fili di perline di conchiglia, il wampum. Hiawatha aiuta poi a portare il messaggio di pace alle nazioni. La data esatta della loro unione è sconosciuta."]
sections = [{ title = "La cintura che registra la pace", paragraphs = ["La cintura di Hiawatha registra l’accordo con cinque figure unite su un fondo di perline viola. L’Albero della Pace, al centro, rappresenta gli Onondaga, custodi del fuoco del consiglio. Le nazioni conservarono i propri consigli e trattarono gli affari comuni sotto una stessa legge. I Tuscarora si aggiunsero all’inizio del Settecento. La cintura conserva la memoria dell’accordo delle cinque nazioni originarie ed è presente al Gran Consiglio per ricordare ai capi la loro responsabilità verso le generazioni future."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.tr]
text = "Haudenosaunee sözlü geleneği, Aionwatha adıyla da bilinen Hiawatha’yı Barış Yapıcı’ya Mohawk, Oneida, Onondaga, Cayuga ve Seneca halklarını bir araya getirmede yardım eden kişi olarak hatırlar. Onondaga anlatısında Hiawatha yas tutarken Barış Yapıcı, wampum denen deniz kabuğu boncuk dizilerini kullanarak ona teselli sözleri söyler. Hiawatha daha sonra barış çağrısının halklara iletilmesine yardım eder. Birleşmenin kesin tarihi bilinmez."
title = "Hiawatha"
lang = "tr"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Haudenosaunee sözlü geleneği, Aionwatha adıyla da bilinen Hiawatha’yı Barış Yapıcı’ya Mohawk, Oneida, Onondaga, Cayuga ve Seneca halklarını bir araya getirmede yardım eden kişi olarak hatırlar. Onondaga anlatısında Hiawatha yas tutarken Barış Yapıcı, wampum denen deniz kabuğu boncuk dizilerini kullanarak ona teselli sözleri söyler. Hiawatha daha sonra barış çağrısının halklara iletilmesine yardım eder. Birleşmenin kesin tarihi bilinmez."]
sections = [{ title = "Barışı kayda geçiren kemer", paragraphs = ["Hiawatha Kemeri, mor kabuk boncukları üzerinde birbirine bağlı beş simgeyle anlaşmayı kaydeder. Ortadaki Barış Ağacı, konsey ateşini koruyan Onondagaları temsil eder. Halklar kendi konseylerini korurken ortak işlerini aynı yasa uyarınca ele aldı. Tuscaroralar on sekizinci yüzyılın başlarında konfederasyona katıldı. Kemer, ilk beş halkın anlaşmasının kaydı olarak Büyük Konsey’de bulunur ve liderlere gelecek kuşaklara karşı sorumluluklarını hatırlatır."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.zh-CN]
text = "豪德诺索尼的口述传统记得海华沙，也称艾昂瓦塔，是协助和平缔造者把莫霍克、奥奈达、奥农达加、卡尤加和塞内卡五个民族团结起来的人。按照奥农达加民族讲述的故事，海华沙当时正在哀悼。和平缔造者拿起海华沙串好的贝珠，用安慰的话帮助他走出悲痛。这些贝珠和串饰称为温帕姆。此后，海华沙帮助把和平的信息传给各个民族。五个民族结成联盟的确切年份并不清楚，联盟的自述也没有为这段历史指定一个具体日期。不同于只用文字讲述一场会议，贝珠带把参与的民族和彼此之间的关系织成能够在议事时重温的图案。"
title = "海华沙"
lang = "zh-CN"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["豪德诺索尼的口述传统记得海华沙，也称艾昂瓦塔，是协助和平缔造者把莫霍克、奥奈达、奥农达加、卡尤加和塞内卡五个民族团结起来的人。按照奥农达加民族讲述的故事，海华沙当时正在哀悼。和平缔造者拿起海华沙串好的贝珠，用安慰的话帮助他走出悲痛。这些贝珠和串饰称为温帕姆。此后，海华沙帮助把和平的信息传给各个民族。五个民族结成联盟的确切年份并不清楚，联盟的自述也没有为这段历史指定一个具体日期。不同于只用文字讲述一场会议，贝珠带把参与的民族和彼此之间的关系织成能够在议事时重温的图案。"]
sections = [{ title = "记录和平的贝珠带", paragraphs = ["海华沙贝珠带的紫色背景上有五个相连的图形。从东端开始依次代表莫霍克、奥奈达、奥农达加、卡尤加和塞内卡。居中的图形是和平之树，代表守护议会之火的奥农达加。两端的莫霍克与塞内卡分别守护象征性长屋的东西入口。传统把联盟比作共同的长屋，每个民族保有自己的议事火和议会，在共同法律之下处理涉及联盟的事务。族母参与选择议事的首领，也有权撤换他们。十八世纪初，来自南方的塔斯卡罗拉加入联盟，成员由五个民族增至六个。贝珠带继续记录最初五个民族缔结的协议。奥农达加民族说明，大议会召开时会陈列这条贝珠带，提醒首领维护和平，并考虑今天的决定会怎样影响未来的世代。它所记下的关系允许各民族在保有自身议会的同时，通过共同的议事方式处理共有问题。在这段口述传统里，安抚哀伤和传递和平信息也是建立联盟的一部分。长屋、议会之火与树的意象把各民族在联盟中的职责联系在一起。奥农达加的讲述还将和平之树和放下武器的约定联系起来。联盟的说明与贝珠带的图案都保留了这些叙事，记录的重点是达成并维持和平的责任。奥农达加的叙述也用共用一只碗和一把勺子的比喻，说明结盟者怎样和平共享资源。"] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.ja]
text = "ハウデノサウニーの口承では、ハイアワサはアイオンワサとも呼ばれ、ピースメーカーがモホーク、オナイダ、オノンダガ、カユーガ、セネカの五つのネーションを結びつけるのを助けた。オノンダガの伝承によると、悲しみに沈んでいたハイアワサに、ピースメーカーは彼の貝の玉を連ねたワンパムを手にして慰めの言葉をかけた。その後、ハイアワサは平和の知らせを各ネーションに伝えるのを助けた。五つのネーションが結びついた正確な年は分かっていない。連邦自身の説明も特定の年を挙げず、出来事を長く伝えられてきた口承として扱っている。"
title = "ハイアワサ"
lang = "ja"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["ハウデノサウニーの口承では、ハイアワサはアイオンワサとも呼ばれ、ピースメーカーがモホーク、オナイダ、オノンダガ、カユーガ、セネカの五つのネーションを結びつけるのを助けた。オノンダガの伝承によると、悲しみに沈んでいたハイアワサに、ピースメーカーは彼の貝の玉を連ねたワンパムを手にして慰めの言葉をかけた。その後、ハイアワサは平和の知らせを各ネーションに伝えるのを助けた。五つのネーションが結びついた正確な年は分かっていない。連邦自身の説明も特定の年を挙げず、出来事を長く伝えられてきた口承として扱っている。"]
sections = [{ title = "平和を記録する帯", paragraphs = ["ハイアワサの帯には、紫色の貝の玉を背景に五つのつながった図形が織られている。東から順にモホーク、オナイダ、オノンダガ、カユーガ、セネカを表す。中央にある平和の木は、評議の火を守るオノンダガのしるしである。東端と西端のネーションは、連邦を象徴する長屋の入り口を守る。伝承では、五つのネーションはそれぞれの評議会を保ち、連邦に関わる事柄を共通の法の下で話し合う。氏族の母たちは評議会の指導者を選び、交代させる権限も持つ。十八世紀の初めに南から移ったタスカローラが加わり、連邦は六つのネーションとなった。帯が記録しているのは、最初の五つのネーションの合意である。オノンダガの説明によれば、帯は大評議会の場に置かれ、指導者に平和を守り、これから生まれる世代に配慮する責任を思い出させる。口承に登場する慰めのワンパムと、合意を記録する帯の役割は、同じ貝の玉が人に語りかけ、決定を覚えておくために使われてきたことを伝えている。平和の木の下に武器を埋めたという伝承も、帯の中央の図形を説明する際に語られる。一つの皿と一つの匙を共に使うという比喩も、平和の約束を伝えている。"] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.ko]
text = "하우데노쇼니 구전에서 하이어와사는 아이온와타라고도 불리며, 평화의 사자가 모호크, 오나이다, 오논다가, 카유가, 세네카 다섯 민족을 잇는 일을 도운 사람으로 기억된다. 오논다가의 이야기에서는 하이어와사가 슬픔에 잠겼을 때 평화의 사자가 조개 구슬을 꿴 왐펌을 들고 위로의 말을 건넸다. 이후 하이어와사는 여러 민족에 평화의 메시지를 전하는 데 힘을 보탰다. 다섯 민족이 연맹을 맺은 정확한 해는 알려지지 않았다. 연맹 자체의 설명도 특정 연도를 제시하지 않고 오래 전해 온 구전으로 이 일을 설명한다."
title = "하이어와사"
lang = "ko"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["하우데노쇼니 구전에서 하이어와사는 아이온와타라고도 불리며, 평화의 사자가 모호크, 오나이다, 오논다가, 카유가, 세네카 다섯 민족을 잇는 일을 도운 사람으로 기억된다. 오논다가의 이야기에서는 하이어와사가 슬픔에 잠겼을 때 평화의 사자가 조개 구슬을 꿴 왐펌을 들고 위로의 말을 건넸다. 이후 하이어와사는 여러 민족에 평화의 메시지를 전하는 데 힘을 보탰다. 다섯 민족이 연맹을 맺은 정확한 해는 알려지지 않았다. 연맹 자체의 설명도 특정 연도를 제시하지 않고 오래 전해 온 구전으로 이 일을 설명한다."]
sections = [{ title = "평화를 기록한 띠", paragraphs = ["하이어와사의 띠에는 보라색 조개 구슬을 바탕으로 다섯 도형이 이어져 있다. 동쪽부터 모호크, 오나이다, 오논다가, 카유가, 세네카를 나타낸다. 가운데 평화의 나무는 회의의 불을 지키는 오논다가를 상징한다. 모호크와 세네카는 연맹을 비유하는 긴 집의 동쪽과 서쪽 출입구를 지킨다. 각 민족은 자체 회의를 유지하고 연맹 전체에 관한 일은 공통의 법 아래에서 논의한다. 씨족의 어머니들은 회의 지도자를 고르고 교체할 권한도 갖는다. 18세기 초 남쪽에서 온 투스카로라가 연맹에 합류해 여섯 민족이 되었다. 띠는 처음 다섯 민족의 합의를 기록한다. 오논다가 민족은 이 띠를 대회의에 놓아 지도자들이 평화를 지키고 미래 세대를 생각할 책임을 기억하게 한다고 설명한다. 위로의 말을 전할 때 등장하는 왐펌과 여러 민족의 합의를 남긴 띠는, 조개 구슬이 말의 뜻을 전달하고 결정을 기억하는 데 쓰였음을 보여 준다. 평화의 나무 밑에 무기를 묻었다는 전승도 띠 가운데 있는 도형과 연결된다."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.ar]
text = "تذكر الرواية الشفوية للهاودينوشوني هياواثا، المعروف أيضا باسم أيونواثا، لمساعدته صانع السلام في جمع أمم الموهوك والأونيدا والأونونداغا والكايوغا والسينيكا. وفي رواية الأونونداغا كان هياواثا في حداد، فخاطبه صانع السلام بكلمات المواساة وهو يحمل خيوطا من خرز الأصداف المعروفة باسم وامبوم. ثم ساعد هياواثا في نقل رسالة السلام إلى الأمم. ولا يعرف التاريخ الدقيق لاتحادها."
title = "هياواثا"
lang = "ar"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["تذكر الرواية الشفوية للهاودينوشوني هياواثا، المعروف أيضا باسم أيونواثا، لمساعدته صانع السلام في جمع أمم الموهوك والأونيدا والأونونداغا والكايوغا والسينيكا. وفي رواية الأونونداغا كان هياواثا في حداد، فخاطبه صانع السلام بكلمات المواساة وهو يحمل خيوطا من خرز الأصداف المعروفة باسم وامبوم. ثم ساعد هياواثا في نقل رسالة السلام إلى الأمم. ولا يعرف التاريخ الدقيق لاتحادها."]
sections = [{ title = "الحزام الذي يسجل السلام", paragraphs = ["يسجل حزام هياواثا الاتفاق بخمسة رموز متصلة على خلفية من خرز أرجواني. وتمثل شجرة السلام في الوسط الأونونداغا، حراس نار المجلس. واحتفظت الأمم بمجالسها الخاصة وعالجت شؤونها المشتركة بموجب قانون واحد. وانضمت أمة التوسكارورا في أوائل القرن الثامن عشر. ويظل الحزام سجلا لاتفاق الأمم الخمس الأولى، ويحضر في المجلس الكبير لتذكير القادة بمسؤوليتهم تجاه الأجيال المقبلة. وتدل رموزه على شعوب لها مجالسها وأدوارها داخل الاتحاد."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.ru]
text = "Устное предание хауденосауни помнит Гайавату, также известного как Айонвата, как помощника Миротворца в объединении народов мохок, онайда, онондага, кайюга и сенека. В рассказе онондага Гайавата был в трауре, и Миротворец утешил его, держа нити из бусин-раковин, называемых вампумом. Затем Гайавата помог донести весть о мире до народов. Точная дата объединения неизвестна."
title = "Гайавата"
lang = "ru"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Устное предание хауденосауни помнит Гайавату, также известного как Айонвата, как помощника Миротворца в объединении народов мохок, онайда, онондага, кайюга и сенека. В рассказе онондага Гайавата был в трауре, и Миротворец утешил его, держа нити из бусин-раковин, называемых вампумом. Затем Гайавата помог донести весть о мире до народов. Точная дата объединения неизвестна."]
sections = [{ title = "Пояс, хранящий память о мире", paragraphs = ["Пояс Гайаваты хранит память о соглашении. На фоне из фиолетовых бусин расположены пять связанных знаков. В центре изображено Древо мира, символ онондага, хранителей огня совета. Народы сохранили собственные советы и решали общие дела по единому закону. В начале XVIII века к конфедерации присоединились тускарора. На Великом совете пояс напоминает о договоре пяти первоначальных народов и об ответственности перед будущими поколениями."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.vi]
text = "Truyền thống truyền miệng Haudenosaunee nhớ đến Hiawatha, còn gọi là Aionwatha, vì đã giúp Người Kiến Tạo Hòa Bình tập hợp năm dân tộc Mohawk, Oneida, Onondaga, Cayuga và Seneca. Theo lời kể của người Onondaga, khi Hiawatha đau buồn, Người Kiến Tạo Hòa Bình dùng các chuỗi hạt vỏ sò, gọi là wampum, khi nói lời an ủi. Hiawatha sau đó giúp đưa thông điệp hòa bình đến các dân tộc. Thời điểm họ liên kết chưa được xác định chính xác."
title = "Hiawatha"
lang = "vi"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Truyền thống truyền miệng Haudenosaunee nhớ đến Hiawatha, còn gọi là Aionwatha, vì đã giúp Người Kiến Tạo Hòa Bình tập hợp năm dân tộc Mohawk, Oneida, Onondaga, Cayuga và Seneca. Theo lời kể của người Onondaga, khi Hiawatha đau buồn, Người Kiến Tạo Hòa Bình dùng các chuỗi hạt vỏ sò, gọi là wampum, khi nói lời an ủi. Hiawatha sau đó giúp đưa thông điệp hòa bình đến các dân tộc. Thời điểm họ liên kết chưa được xác định chính xác."]
sections = [{ title = "Chiếc đai ghi lại hòa bình", paragraphs = ["Đai Hiawatha ghi lại thỏa thuận bằng năm hình nối nhau trên nền hạt tím. Hình trung tâm, Cây Hòa Bình, tượng trưng cho người Onondaga, những người giữ lửa hội đồng. Mỗi dân tộc giữ hội đồng riêng và giải quyết việc chung theo một luật chung. Người Tuscarora gia nhập vào đầu thế kỷ XVIII. Chiếc đai lưu giữ ký ức về thỏa thuận của năm dân tộc ban đầu và hiện diện tại Đại Hội Đồng để nhắc các lãnh đạo về trách nhiệm với thế hệ sau."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.id]
text = "Tradisi lisan Haudenosaunee mengenang Hiawatha, juga disebut Aionwatha, karena membantu Sang Pembawa Damai menyatukan bangsa Mohawk, Oneida, Onondaga, Cayuga, dan Seneca. Dalam kisah Onondaga, Hiawatha sedang berduka, dan Sang Pembawa Damai menggunakan untaian manik-manik kerang yang disebut wampum untuk menyampaikan penghiburan. Hiawatha kemudian membantu membawa pesan damai kepada bangsa-bangsa itu. Tanggal pasti penyatuan mereka tidak diketahui."
title = "Hiawatha"
lang = "id"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Tradisi lisan Haudenosaunee mengenang Hiawatha, juga disebut Aionwatha, karena membantu Sang Pembawa Damai menyatukan bangsa Mohawk, Oneida, Onondaga, Cayuga, dan Seneca. Dalam kisah Onondaga, Hiawatha sedang berduka, dan Sang Pembawa Damai menggunakan untaian manik-manik kerang yang disebut wampum untuk menyampaikan penghiburan. Hiawatha kemudian membantu membawa pesan damai kepada bangsa-bangsa itu. Tanggal pasti penyatuan mereka tidak diketahui."]
sections = [{ title = "Sabuk yang mencatat perdamaian", paragraphs = ["Sabuk Hiawatha mencatat kesepakatan dengan lima bentuk yang saling terhubung di atas latar manik-manik ungu. Pohon Perdamaian di tengah mewakili Onondaga, penjaga api dewan. Masing-masing bangsa mempertahankan dewannya sendiri dan membahas urusan bersama di bawah satu hukum. Bangsa Tuscarora bergabung pada awal abad kedelapan belas. Sabuk itu menyimpan kesepakatan lima bangsa awal dan hadir dalam Dewan Agung untuk mengingatkan para pemimpin akan tanggung jawab kepada generasi mendatang."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.fil]
text = "Sa tradisyong pasalita ng Haudenosaunee, inaalala si Hiawatha, na tinatawag ding Aionwatha, sa pagtulong sa Tagapamayapa na tipunin ang mga bansang Mohawk, Oneida, Onondaga, Cayuga at Seneca. Ayon sa salaysay ng Onondaga, nagdadalamhati si Hiawatha nang gamitin ng Tagapamayapa ang mga hibla ng butil na yari sa kabibe, o wampum, habang nagbibigay ng aliw. Tumulong si Hiawatha na dalhin ang mensahe ng kapayapaan sa mga bansa. Hindi alam ang tiyak na petsa ng pagsasama nila."
title = "Hiawatha"
lang = "fil"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["Sa tradisyong pasalita ng Haudenosaunee, inaalala si Hiawatha, na tinatawag ding Aionwatha, sa pagtulong sa Tagapamayapa na tipunin ang mga bansang Mohawk, Oneida, Onondaga, Cayuga at Seneca. Ayon sa salaysay ng Onondaga, nagdadalamhati si Hiawatha nang gamitin ng Tagapamayapa ang mga hibla ng butil na yari sa kabibe, o wampum, habang nagbibigay ng aliw. Tumulong si Hiawatha na dalhin ang mensahe ng kapayapaan sa mga bansa. Hindi alam ang tiyak na petsa ng pagsasama nila."]
sections = [{ title = "Ang sinturong nagtatala ng kapayapaan", paragraphs = ["Nakatala ang kasunduan sa Sinturon ni Hiawatha sa limang magkaugnay na sagisag sa ibabaw ng mga butil na kulay ube. Nasa gitna ang Puno ng Kapayapaan para sa Onondaga, na nagbabantay ng apoy ng konseho. Pinanatili ng bawat bansa ang sariling konseho at pinagkasunduan ang mga usaping pare-pareho nilang kinakaharap sa ilalim ng iisang batas. Sumali ang Tuscarora sa unang bahagi ng ika-18 siglo. Inihaharap ang sinturon sa Dakilang Konseho bilang alaala ng unang limang bansa at paalala ng tungkulin sa susunod na mga salinlahi."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]

[articles.pt-BR]
text = "A tradição oral haudenosaunee lembra Hiawatha, também chamado Aionwatha, por ajudar o Pacificador a unir as nações mohawk, oneida, onondaga, cayuga e seneca. No relato onondaga, Hiawatha estava de luto e o Pacificador usou fios de contas de concha, o wampum, ao lhe dirigir palavras de consolo. Hiawatha depois ajudou a levar a mensagem de paz às nações. A data exata da união é desconhecida."
title = "Hiawatha"
lang = "pt-BR"
url = "https://www.onondaganation.org/history/"
shortArticle = true
intro = ["A tradição oral haudenosaunee lembra Hiawatha, também chamado Aionwatha, por ajudar o Pacificador a unir as nações mohawk, oneida, onondaga, cayuga e seneca. No relato onondaga, Hiawatha estava de luto e o Pacificador usou fios de contas de concha, o wampum, ao lhe dirigir palavras de consolo. Hiawatha depois ajudou a levar a mensagem de paz às nações. A data exata da união é desconhecida."]
sections = [{ title = "O cinto que registra a paz", paragraphs = ["O Cinto de Hiawatha registra o acordo com cinco figuras ligadas sobre um fundo de contas roxas. A figura central, a Árvore da Paz, representa os onondaga, guardiões do fogo do conselho. Cada nação manteve seu conselho e tratou dos assuntos compartilhados sob uma lei comum. Os tuscarora se juntaram à confederação no início do século XVIII. O cinto preserva o acordo das cinco nações originais e está presente no Grande Conselho para lembrar aos líderes sua responsabilidade com as gerações futuras."] }]
sources = [{ title = "Onondaga Nation, History", url = "https://www.onondaganation.org/history/" }, { title = "Onondaga Nation, Hiawatha Belt", url = "https://www.onondaganation.org/culture/wampum/hiawatha-belt/" }, { title = "Haudenosaunee Confederacy, Who We Are", url = "https://www.haudenosauneeconfederacy.com/who-we-are/" }, { title = "Onondaga Nation, Today", url = "https://www.onondaganation.org/aboutus/today/" }]
