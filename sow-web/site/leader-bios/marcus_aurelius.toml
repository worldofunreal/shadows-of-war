[articles.en]
text = "Marcus Aurelius Antoninus was Roman emperor from 161 to 180 and a Stoic philosopher. He was a member of the Nerva–Antonine dynasty, the last of the rulers later known as the Five Good Emperors and the last emperor of the Pax Romana, an age of relative peace, calm, and stability for the Roman Empire lasting from 27 BC to 180 AD."
title = "Marcus Aurelius"
lang = "en"
url = "https://en.wikipedia.org/wiki/Marcus_Aurelius"
intro = [
  "Marcus Aurelius Antoninus ( or-EE-lee-əs; Latin: [ˈmaːrkʊs au̯ˈreːli.us antoːˈniːnʊs]; 26 April 121 – 17 March 180) was Roman emperor from 161 to 180 and a Stoic philosopher. He was a member of the Nerva–Antonine dynasty, the last of the rulers later known as the Five Good Emperors and the last emperor of the Pax Romana, an age of relative peace, calm, and stability for the Roman Empire lasting from 27 BC to 180 AD. He served as Roman consul in 140, 145, and 161.",
  "Marcus Aurelius was the son of the praetor Marcus Annius Verus and his wife Domitia Calvilla. He was related through marriage to the emperors Trajan and Hadrian. Marcus was three when his father died, and he was raised by his mother and paternal grandfather. After Hadrian's adoptive son, Aelius Caesar, died in 138, Hadrian adopted Marcus's uncle Antoninus Pius as his new heir. In turn, Antoninus adopted Marcus and Lucius, the son of Aelius. Hadrian died that year, and Antoninus became emperor. Now heir to the throne, Marcus studied Greek and Latin under tutors such as Herodes Atticus and Marcus Cornelius Fronto. He married Antoninus's daughter Faustina in 145.",
  "After Antoninus died in 161, Marcus acceded to the throne alongside his adoptive brother, who took the regnal name Lucius Aurelius Verus. Under the reign of Marcus Aurelius, the Roman Empire witnessed much military conflict. In the East, the Romans fought the Parthian War of Lucius Verus with a revitalised Parthian Empire and the rebel Kingdom of Armenia. Marcus defeated the Marcomanni, Quadi, and Iazyges in the Marcomannic Wars. These and other Germanic peoples began to represent a troubling reality for the Empire. He reduced the silver purity of the Roman currency, the denarius. The persecution of Christians in the Roman Empire appears to have increased during his reign, although his involvement is unlikely since there are no Christian sources ascribing him the blame, and he was praised by Justin Martyr and Tertullian. The Antonine Plague broke out in 165 or 166 and devastated the population of the Roman Empire, causing the deaths of five to ten million people. Lucius Verus may have died from the plague in 169. When Marcus himself died in 180, he was succeeded by his son Commodus.",
  "Commodus's succession after Marcus has been a subject of debate among both contemporary and modern historians. The column and equestrian statue of Marcus Aurelius still stand in Rome, where they were erected in celebration of his military victories. As a philosopher, his work Meditations is one of the most important sources for the modern understanding of ancient Stoic philosophy. These writings have been praised by fellow writers, philosophers, monarchs, and politicians centuries after his death.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Marcus was born in Rome on 26 April 121. His birth name is sometimes given as Marcus Annius Verus, but sources assign this name to him upon his father's death and unofficial adoption by his grandfather, upon his coming of age. He may have been known as \"Marcus Annius Catilius Severus\", at birth or some point in his youth, or \"Marcus Catilius Severus Annius Verus\". Upon his adoption by Antoninus as heir to the throne, he was known as \"Marcus Aelius Aurelius Verus Caesar\" and, upon his ascension, he was \"Marcus Aurelius Antoninus Augustus\" until his death; Epiphanius of Salamis, in his chronology of the Roman emperors included in his On Weights and Measures, calls him Marcus Aurelius Verus.",
      "The father of Marcus Aurelius was Marcus Annius Verus (III). His gens Annia was of Italic origin, but settled at some point in the small colony of Ucubi (Colonia Claritas Iulia Ucubi) south-east of Córdoba in Iberian Baetica (modern Andalusia, Spain); the gens had legendary claims of descendance from Numa Pompilius. The Annii Veri rose to prominence in Rome in the late 1st century AD. Marcus's great-grandfather Marcus Annius Verus (I) was a senator and (according to the Historia Augusta) ex-praetor; his grandfather Marcus Annius Verus (II) was made patrician in 73–74. Through his grandmother Rupilia Faustina, Marcus was related to the Nerva-Antonine dynasty; Rupilla was the step-daughter of Salonia Matidia, who was the niece of the emperor Trajan.",
      "Marcus's mother, Domitia Lucilla Minor (also known as Domitia Calvilla), was the daughter of the Roman patrician P. Calvisius Tullus and inherited a great fortune (described at length in one of Pliny's letters) from her parents and grandparents. Her inheritance included large brickworks on the outskirts of Rome – a profitable enterprise in an era when the city was experiencing a construction boom – and the Horti Domitia Calvillae (or Lucillae), a villa on the Caelian Hill of Rome. Marcus himself was born and raised in the Horti and referred to the Caelian Hill as 'My Caelian'.",
    ] },
  { "title" = "Emperor (161 – 180)", "paragraphs" = [
      "After Antoninus died in 161, Marcus was effectively sole ruler of the Empire. The formalities of the position would follow. The Senate would soon grant him the name Augustus and the title imperator, and he would soon be formally elected as pontifex maximus, chief priest of the official cults. Marcus made some show of resistance: the biographer writes that he was 'compelled' to take imperial power. This may have been a genuine horror imperii, 'fear of imperial power'. Marcus, with his preference for the philosophic life, found the imperial office unappealing. His training as a Stoic however, had made the choice clear to him that it was his duty.",
      "Although Marcus showed no personal affection for Hadrian (significantly, he does not thank him in the first book of his Meditations), he presumably believed it his duty to enact the man's succession plans. Thus, although the Senate planned to confirm Marcus alone, he refused to take office unless Lucius received equal powers. The Senate accepted, granting Lucius the imperium, the tribunician power, and the title Augustus. Marcus became, in official titulature, Imperator Caesar Marcus Aurelius Antoninus Augustus; Lucius, forgoing his name Commodus and taking Marcus's family name Verus, became Imperator Caesar Lucius Aurelius Verus Augustus. It was the first time that Rome was ruled by two emperors.",
      "In spite of their nominal equality, Marcus held more auctoritas, or 'authority', than Lucius. He had been consul once more than Lucius, he had shared in Antoninus's rule, and he alone was pontifex maximus. It would have been clear to the public which emperor was the more senior. As the biographer wrote: \"Verus obeyed Marcus [...] as a lieutenant obeys a proconsul or a governor obeys the emperor\".",
    ] },
  { "title" = "Philosophy", "paragraphs" = [
      "While on campaign between 170 and 180, Marcus wrote his Meditations in Greek as a source for his own guidance and self-improvement. The original title of this work, if it had one, is unknown. Meditations – as well as other titles including To Himself – were adopted later. It was a favourite of Frederick the Great, John Stuart Mill, Matthew Arnold, and Goethe. It has been considered by many commentators to be one of the greatest works of philosophy. Meditations sold 16,000 copies in 2012. In 2019, 100,000 copies were sold.",
      "It is not known how widely Marcus's writings were circulated after his death. There are stray references in the ancient literature to the popularity of his precepts, and Julian the Apostate was well aware of his reputation as a philosopher, though he does not specifically mention Meditations. It survived in the scholarly traditions of the Eastern Church, and the first surviving quotes of the book, as well as the first known reference to it by name (Marcus's writings to himself) are from Arethas of Caesarea in the 10th century and in the Byzantine Suda (perhaps inserted by Arethas himself). It was first published in 1558 in Zurich by Wilhelm Xylander, from a manuscript reportedly lost shortly afterwards. The oldest surviving complete manuscript copy is in the Vatican library and dates to the 14th century.",
      "Marcus acquired the reputation of a philosopher king within his lifetime, and the title would remain after his death; both Dio and the biographer call him \"the philosopher\". Christians such as Justin Martyr, Athenagoras, and Eusebius also gave him the title. The last went so far as to call him \"more philanthropic and philosophic\" than Antoninus and Hadrian, and set him against the persecuting emperors Domitian and Nero to make the contrast bolder.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The equestrian statue of Marcus Aurelius in Rome is the only Roman equestrian statue which has survived into the modern period. Crafted of bronze in c. 175, it stands 11.6 ft (3.5 m) and is now located in the Capitoline Museums of Rome. The emperor's hand is outstretched in an act of clemency offered to a bested enemy, while his weary facial expression due to the stress of leading Rome into nearly constant battles perhaps represents a break with the classical tradition of sculpture.",
      "Marcus's victory column, established in Rome either in his last few years of life or after his reign and completed in 193, was built to commemorate his victory over the Sarmatians and Germanic tribes in 176. A spiral of carved reliefs wraps around the column, showing scenes from his military campaigns. A statue of Marcus had stood atop the column but disappeared during the Middle Ages. It was replaced with a statue of Saint Paul in 1589 by Pope Sixtus V. The column of Marcus and the column of Trajan are often compared by scholars given how they are both Doric in style, had a pedestal at the base, had sculpted friezes depicting their respective military victories, and a statue on top.",
    ] },
]

[articles.es]
text = "Marco Aurelio Antonino (en latín: Marcus Aurelius Antoninus; Roma, 26 de abril de 121​-Vindobona o Sirmio, 17 de marzo de 180​), conocido como Marco Aurelio, fue un emperador del Imperio romano desde el año 161 hasta el año de su muerte en 180. Fue el último de los llamados Cinco Buenos Emperadores, tercero de los emperadores procedentes de una familia de antiguos colonos itálicos asentados en la provincia de Baetica,​​ y está considerado como una de las figuras más representativas de la filosofía estoica."
title = "Marco Aurelio"
lang = "es"
url = "https://es.wikipedia.org/wiki/Marco_Aurelio"
intro = [
  "Marco Aurelio Antonino (en latín: Marcus Aurelius Antoninus; Roma, 26 de abril de 121​-Vindobona o Sirmio, 17 de marzo de 180​), conocido como Marco Aurelio, fue un emperador del Imperio romano desde el año 161 hasta el año de su muerte en 180. Fue el último de los llamados Cinco Buenos Emperadores, tercero de los emperadores procedentes de una familia de antiguos colonos itálicos asentados en la provincia de Baetica,​​ y está considerado como una de las figuras más representativas de la filosofía estoica. Marco Aurelio y Lucio Vero fueron hijos adoptivos de Antonino Pío por mandato de Adriano, y fueron también coemperadores del Imperio.​",
  "Marco Aurelio era hijo del pretor Marco Annio Vero y su esposa Domicia Lucila. Estaba emparentado por medio de su esposa con los emperadores Trajano y Adriano. Marco Aurelio tenía tres años de edad cuando murió su padre y fue criado por su madre y su abuelo paterno Marco Annio Vero, cónsul y prefecto de Roma. Cuando murió Lucio Elio César, el hijo adoptivo de Adriano, en 138, Adriano adoptó al esposo de la tía de Marco Aurelio, Antonino Pío, como su nuevo heredero. A su vez, Antonino adoptó a Marco Aurelio (cuyo nombre fue cambiado al de Marco Elio Aurelio Vero) y a Lucio Vero, el hijo de Elio. Adriano murió ese año y Antonino se convirtió en el emperador. Como heredero al trono, Marco Aurelio estudió griego y latín con tutores como Herodes Ático o Marco Cornelio Frontón. Se casó con la hija de Antonino, Faustina, en 145.",
  "Tras la muerte de Antonino en 161, Marco Aurelio subió al trono junto con su hermano adoptivo, quien adoptó el nombre real de Lucio Aurelio Vero. Su gobierno estuvo marcado por los conflictos militares en Asia, frente a un revitalizado Imperio parto, y en Germania Superior, frente a las tribus bárbaras asentadas a lo largo del Limes Germanicus, en la Galia y a lo largo del Danubio. Durante el período de su imperio tuvo que hacer frente a una revuelta en las provincias del este liderada por Avidio Casio, que aplastó. Gobernó brevemente en solitario tras la muerte de Lucio Vero como consecuencia de la Peste antonina en 169, aunque desde 177 gobernó junto a su hijo Cómodo, quien le sucedería. La peste antonina estalló en 165 o 166 y devastó la población del Imperio romano, causando la muerte de cinco a diez millones de personas. Marco Aurelio redujo la pureza de la plata del denario, la moneda romana. La persecución a los cristianos en el Imperio romano también parece haber aumentado durante su reinado, si bien es improbable que él haya estado involucrado en tanto ninguna fuente cristiana le culpa y antes bien fue elogiado por Justino Mártir y Tertuliano.​",
  "La gran obra de Marco Aurelio, Meditaciones, escrita en griego helenístico durante las campañas de la década de 170, todavía está considerada como un monumento al gobierno perfecto. Se la suele describir como «una obra escrita de manera exquisita y con infinita ternura».​ Marco Aurelio ha simbolizad por muchas generaciones en Occidente la era dorada del Imperio romano.​",
]
sections = [
  { "title" = "Familia", "paragraphs" = [
      "Era el único heredero varón del político Marco Annio Vero y Domicia Lucila. Fruto de este matrimonio nació también su hermana menor, Annia Cornificia Faustina, la cual era aproximadamente dos años más joven que él. Domicia Lucila procedía de una rica y poderosa familia de rango consular, mientras que el padre de Marco Aurelio procedía de una familia de colonos itálicos pertenecientes a una rama de la gens Annia,​ oriundos de",
      "Setia (ciudad del Lacio, en Italia),​​ pero asentados en la provincia de Hispania Baetica y más precisamente en Ucubi (actual Espejo, Córdoba);​",
      "​ su padre, habiendo entrado en el Senado romano, había ostentado el cargo de pretor y había muerto cuando su hijo tenía tres años de edad. Cuando ascendió al trono, Marco Aurelio siempre alegó que su madre le había enseñado que era posible vivir sin ostentación (Meditaciones, 1.3.).​",
    ] },
  { "title" = "Heredero del Imperio", "paragraphs" = [
      "En el año 136, el emperador Adriano designó como su heredero a Lucio Ceionio Cómodo, conocido comúnmente con el nombre de Lucio Elio César. Por su parte, Marco Aurelio había atraído la atención de Adriano, que le apodó cariñosamente verissimus. Este término podría traducirse como honesto. Cuando el joven noble tenía seis años, fue el propio emperador Adriano el que gestionó su ingreso en el ordo equester.​ Posteriormente, Marco Aurelio fue prometido en matrimonio con la hija de Elio César, Ceionia Fabia. Sin embargo, tras la muerte de Elio el compromiso fue anulado y Marco Aurelio se prometió con la hija de Antonino.",
      "Adriano, al morir su hijo adoptivo, Lucio Elio César, decidió nombrar como heredero del Imperio a Antonino Pío con la condición de que adoptara a Marco Aurelio, entonces llamado Marco Elio Aurelio Vero, y a Lucio Ceionio Cómodo, el hijo de Lucio Elio, al que posteriormente se conocería como Lucio Vero, como herederos y que les nombrara como los siguientes en la línea sucesoria.",
      "Antonino cumplió su palabra y tras su adopción formal, les designó como sus herederos y sucesores al trono el 25 de febrero de 138, cuando Marco Aurelio tenía solamente 17 años de edad. A la edad de 40 años, Marco Aurelio ascendió finalmente al trono junto con Lucio Vero, situación que se prolongaría hasta la muerte del segundo. Historiadores modernos han teorizado que los nombramientos de Elio César y Antonino Pío como césares estaban destinados únicamente a legitimar el ascenso de los jóvenes y precoces Marco Aurelio y Lucio Vero.",
    ] },
  { "title" = "Emperador de Roma", "paragraphs" = [
      "Cuando Antonino Pío murió el 7 de marzo de 161, Marco Aurelio aceptó el trono con la condición de que Vero y él fueran nombrados de manera conjunta Augusto. Al ser nombrado emperador, cambió de manera definitiva su nombre por el de Marco Aurelio Antonino. A pesar de esta disposición, Vero, menos popular y más joven que Marco Aurelio, aceptó un papel subordinado en el gobierno del Imperio.​",
      "La terca insistencia de Marco Aurelio en que Vero fuera elegido emperador junto a él motivó la lealtad de este hacia el primero durante toda su vida. La sucesión conjunta pudo haber sido debida a que Vero contaba con experiencia y talento militar, algo muy necesario durante el mandato de Marco Aurelio, en el que el Imperio se mantuvo constantemente en guerra con varios pueblos. Urgía una figura autoritaria y valorada entre los soldados, y Marco Aurelio no podía defender los frentes de Partia y Germania al mismo tiempo. A pesar de todo, Marco Aurelio podría haber nombrado a un general para que liderara las legiones en el este. No obstante, existía un mal precedente por el cual los generales Julio César y Vespasiano habían derrocado a sus respectivos gobiernos instalándose ellos mismos en una posición de poder incontestable. Marco Aurelio solucionó el problema enviando a Vero a comandar las legiones asentadas en Oriente. Vero constituía una figura lo suficientemente autoritaria como para garantizar la plena lealtad de las tropas, pero no era lo suficientemente poderoso como para poder aspirar a derrocar a Marco Aurelio. La maniobra del emperador salió bien y Vero se mantuvo leal hasta su muerte en una campaña del año 169.",
      "El imperio compartido recuerda ligeramente al sistema electivo empleado en la República romana, en el que no se permitía a ningún hombre ostentar el poder supremo. El gobierno conjunto fue revivido por el emperador Diocleciano, durante el establecimiento de la Tetrarquía a finales del siglo III.",
    ] },
  { "title" = "Muerte y sucesión", "paragraphs" = [
      "Marco Aurelio murió el 17 de marzo de 180 en la ciudad de Vindobona (moderna Viena), en compañía de su hijo y sucesor Cómodo. Tras su muerte fue deificado y sus cenizas se transportaron a Roma, donde permanecieron en el Mausoleo de Adriano (moderno Castillo de Sant'Angelo), hasta el saqueo visigodo de la ciudad en el año 410. Se construyó además una columna conmemorando sus victorias contra los sármatas y los germanos.",
      "A su muerte, Marco Aurelio fue capaz de asegurar la sucesión de su hijo Cómodo, al que nombró César en 166 y con el que compartió el gobierno del Imperio desde el año 177. Sin embargo, al final esta decisión se tornaría muy poco afortunada. Este nombramiento, que puso fin a una serie de «emperadores adoptivos», fue criticado posteriormente por una serie de historiadores, debido sobre todo a que Cómodo se convirtió en un líder político y militar paranoico, tremendamente egoísta y afectado por problemas neuróticos. Por esta razón, la muerte de Marco Aurelio ha sido considerada como el fin de la época de mayor prosperidad del Imperio, conocida como Pax Romana. Es posible que la elección de Cómodo se debiera a la ausencia de otros candidatos o al miedo de que una sucesión incierta diera pie a una guerra civil.",
    ] },
]

[articles.fr]
text = "Marc Aurèle (en latin : Marcus Aurelius), né le 26 avril 121 à Rome et mort le 17 mars 180 à Sirmium ou à Vindobona, est un empereur et philosophe romain de la dynastie des Antonins, consul en 140, 145 et 161, régnant de 161 à 180. Dernier des « cinq bons empereurs » selon Machiavel, il est aussi le dernier empereur de la période de la « paix romaine », période de relative stabilité commencée sous le règne d'Auguste (27 av."
title = "Marc Aurèle"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Marc_Aur%C3%A8le"
intro = [
  "Marc Aurèle (en latin : Marcus Aurelius), né le 26 avril 121 à Rome et mort le 17 mars 180 à Sirmium ou à Vindobona, est un empereur et philosophe romain de la dynastie des Antonins, consul en 140, 145 et 161, régnant de 161 à 180.",
  "Dernier des « cinq bons empereurs » selon Machiavel, il est aussi le dernier empereur de la période de la « paix romaine », période de relative stabilité commencée sous le règne d'Auguste (27 av. J.-C. à 14), succédant à la période des guerres civiles (49 à 30 av. J.-C.).",
  "Marc Aurèle naît sous le règne d'Hadrien. Il est le fils du préteur Marcus Annius Verus et de l'héritière Domitia Lucilla Minor. Son père meurt alors qu'il est encore enfant et Marc Aurèle est élevé par sa mère et ses grands-pères. En 138, après la mort de Lucius Aelius, fils adoptif d'Hadrien, l'empereur adopte l'oncle de Marc Aurèle, Antonin le Pieux, comme nouvel héritier. À son tour, Antonin adopte Marc Aurèle et Lucius Aurelius Verus, le fils d'Aelius. Hadrien meurt cette année-là et Antonin devient empereur. Alors héritier du trône, Marc Aurèle étudie les lettres grecques et latines sous la direction de tuteurs tels qu'Hérode Atticus et Fronton. Il entretient par la suite une correspondance étroite avec Fronton pendant de nombreuses années. Marc Aurèle épouse la fille d'Antonin, Faustine la Jeune, en 145. Après la mort d'Antonin en 161, Marc Aurèle accède au trône aux côtés de son frère adoptif Lucius.",
  "Le règne de Marc Aurèle est marqué par des conflits militaires. En Orient, l'Empire romain combat avec succès un Empire parthe revitalisé et le royaume rebelle d'Arménie. Marc Aurèle défait les Marcomans, Quades et Sarmates Iazyges dans les guerres marcomanes. Cependant, ces peuples et d'autres peuples germaniques continuent de représenter une menace pour l'Empire, et les conflits armés reprennent très vite malgré une trêve signée. En outre, une grave pandémie connue comme la « peste antonine » éclate vers 166 et dévaste la population de l'Empire pendant plusieurs décennies.",
]
sections = [
  { "title" = "Origines et noms", "paragraphs" = [
      "La famille du père de Marc Aurèle, Marcus Annius Verus III, est apparentée à la gens Annia qui n'a pas laissé jusqu'alors de trace importante dans les annales de l'histoire romaine, mais s'est répandue en Italie et dans les provinces. L'histoire des Annii Veri semble commencer au milieu du Ier siècle en Espagne romaine, dans la province de Bétique, à Ucubi (Colonia Claritas Iulia Ucubi — aujourd'hui Espejo) —, une petite ville située au sud-est de Cordoue.",
      "Les Annii Veri s'imposent à Rome à la fin du Ier siècle apr. J.-C., avec l'arrière-grand-père de Marc Aurèle, Marcus Annius Verus I, qui est sénateur et, selon l’Histoire Auguste, ancien préteur ; son grand-père Marcus Annius Verus II est fait patricien en 73 ou 74. Du côté de sa grand-mère paternelle Rupilia Faustina (en), et par le père de celle-ci, Libo Rupilius Frugi, Marc Aurèle descend de Numa Pompilius. Certains, à la suite de Jérôme Carcopino, ont conjecturé que la mère de cette dernière — dont le nom est inconnu — pourrait être Salonia Matidia, nièce sororale de l'empereur Trajan et mère par un troisième mariage de Vibia Sabina, la femme d'Hadrien. Cette hypothèse a été invalidé par Ronald Syme, d'après l'onomastique, aucun descendant de Rupilia Faustina ne reprend les éléments de Salonii ou Matidii dans leurs noms, et le silence des sources (Dion Cassius est trop vague) va à l'encontre de cette hypothèse. Une autre hypothèse, défendue par Christian Settipani, suppose que la mère de Rupilia Faustina serait une fille de l'éphémère empereur Vitellius et de sa seconde épouse Galeria Fundana. Premièrement, le lien entre Hadrien et Marc Aurèle est plus probablement à chercher chez les Annii Veri, originaires de Bétique, comme la famille paternelle d'Hadrien. Ensuite, le fait que le nom de Galeria soit abondamment repris dans la descendance féminine de Rupilia Faustina, est la preuve que celui-ci devait revêtir une signification aristocratique aux yeux des descendants de Rupilia Faustina, alors même que les Galerii sont très rares dans l'ordre sénatorial. Enfin, grâce à Suétone, on sait que la fille de Vitellius a fait un très beau mariage sous le règne de Vespasien. Face à cette ascendance impériale de Marc Aurèle, le silence des sources s'explique probablement par…",
      "La mère de Marc Aurèle, Domitia Lucilla Minor (également connue sous le nom de Domitia Calvilla), issue de l'union du patricien romain Publius Calvisius Ruso avec la riche Domitia Lucilla Maior, hérite d'une fortune colossale de ses parents et grands-parents. Elle est ainsi propriétaire de grandes briqueteries dans la banlieue de Rome — une entreprise rentable à une époque où la ville est en pleine expansion — ainsi que des Horti Domitia Calvillae (ou Lucillae), une villa domaniale sur la colline du Cælius à Rome.",
    ] },
  { "title" = "Biographie", "paragraphs" = [
      "Marc Aurèle naît à Rome de Domitia Lucilla Minor et Marcus Annius Verus III le 26 avril 121, ou, selon le calendrier romain, le sixième jour avant les calendes de mai, l'année du deuxième consulat de son grand-père Marcus Annius Verus, qui correspond à l'année 874 de la fondation de Rome. Les premières années de la vie de Marc Aurèle sont largement entourées d'incertitude. Marc Aurèle naît dans la villa Horti Domitia Calvillae appartenant à sa mère et située sur le Cælius qu'il appelle affectueusement « mon Cælius ». C'est alors un faubourg prisé de l'élite, avec peu de bâtiments publics mais où se concentrent les demeures et jardins de l'aristocratie.",
      "Sa sœur cadette, Annia Cornificia Faustina, naît probablement en 122 ou 123. Son père meurt jeune, vraisemblablement en 124 ou 125, alors qu'il est préteur. Bien qu'il l'ait à peine connu, Marc Aurèle écrit dans ses Pensées pour moi-même qu'il apprend « la modestie et la virilité » du souvenir de son père et de sa réputation posthume. Lucilla ne s'est jamais remariée.",
      "La mère de Marc Aurèle, conformément à la coutume de la nobilitas, passe peu de temps avec son fils, le confiant aux soins de nourrices. Néanmoins, Marc Aurèle attribue à sa mère « la piété et la générosité ; l’habitude de s’abstenir non pas seulement de faire le mal, mais même d’en concevoir jamais la pensée ; et aussi, la simplicité de vie, si loin du faste ordinaire des gens opulents ». Dans ses lettres, Marc Aurèle fait de fréquentes et affectueuses références à sa mère, morte vers 156, lui exprimant sa gratitude : « ma mère, qui devait mourir à la fleur de son âge, a pu cependant passer avec moi ses dernières années ».",
    ] },
  { "title" = "Pratique du pouvoir", "paragraphs" = [
      "Les tâches administratives de Marc Aurèle consistent prioritairement à clarifier et améliorer le système déjà en place, la plupart de ses actes étant motivés par le mauvais état financier de l'empire : il régularise l'utilisation d'un registre de la population — chaque citoyen romain peut enregistrer ses enfants dans les trente jours suivant leur naissance —, système remontant à Auguste ; il crée un poste spécifiquement pour l'assignation de tutelles, géré par un sénateur romain ; il augmente considérablement le nombre de curateurs de cités, un poste qui devient un passage presque obligatoire pour quiconque désire devenir un jour sénateur.",
      "Marc Aurèle passe également une grande partie de son règne à défendre les frontières de l'empire.",
      "Les affaires judiciaires ont une place importante dans le règne de Marc Aurèle. Il travaille avec minutie sur chaque cas, s'aide de l'avis du conseil impérial et traite toutes les affaires avec la même attention. Certains procès durent jusqu'à douze jours et sont parfois menés de nuit. Marc Aurèle croit fermement que chaque détail d'une affaire doit être analysé et que la moindre erreur pourrait remettre en cause le bien-fondé de sa décision. Toutes les décisions judiciaires sont prises au nom de Marc Aurèle et de Lucius Aurelius Verus, bien que ce dernier soit très souvent en voyage. À une occasion, les empereurs établissent l'innocence d'un enfant qui a tué un parent dans un moment de folie, recourant ainsi à un premier concept de maladie mentale. Les avocats de profession qualifient Marc Aurèle d'« empereur versé dans le droit » et, comme le soutient Papinien, « très prudent et consciencieusement juste ». Il manifeste un vif intérêt pour trois domaines du droit : la libération des esclaves, la protection des orphelins et des enfants, et le choix des conseillers municipaux (décurions). Il réévalue la monnaie qu'il a précédemment dévaluée, mais, deux ans plus tard, elle connaît une nouvelle dévaluation en raison des guerres marcomanes qui amènent une grave crise militaire au sein de l'empire.",
    ] },
  { "title" = "Pensées pour moi-même", "paragraphs" = [
      "Lors de campagnes militaires entre 170 et 180, Marc Aurèle écrit ses pensées en grec comme source d'inspiration et d'amélioration personnelle. Le titre original de cette œuvre, si elle en avait un, est inconnu. Le titre Pensées pour moi-même, parfois simplement Pensées, est adopté plus tard. Les Pensées sont considérées comme un chef-d'œuvre de littérature et de philosophie, et contiennent les principales maximes du stoïcisme. Elles font partie des principaux ouvrages de ce mouvement philosophique, avec le Manuel et les Entretiens d'Épictète ainsi que l'œuvre de Sénèque. Le livre fait entre autres partie des lectures de la reine Christine, de Frédéric le Grand, de John Stuart Mill, de Matthew Arnold, de Johann Wolfgang von Goethe, Giacomo Leopardi, Arthur Schopenhauer, Emil Cioran, Léon Tolstoï, Simone Weil, Michel Onfray, Wen Jiabao et Bill Clinton.",
      "On ignore dans quelle mesure les écrits de Marc Aurèle sont diffusés après sa mort. Certaines références littéraires anciennes concernant la popularité de ses préceptes sont erronées, et Julien l'Apostat, qui prend Marc Aurèle comme modèle autant pour ses principes que pour ses actes, ne mentionne pas spécifiquement les Pensées pour moi-même. Les premières mentions du livre, ainsi que son premier nom connu les écrits de Marc Aurèle à lui-même, proviennent d'Aréthas de Césarée au Xe siècle et de la Souda byzantine. Il est publié pour la première fois en 1558 à Zurich par Guilielmus Xylander à partir d'un manuscrit perdu peu après. La plus ancienne copie manuscrite complète qui subsiste se trouve à la bibliothèque du Vatican et date du XIVe siècle.",
      "Marc Aurèle semble reprendre les positions stoïciennes classiques, en partant de Zénon de Kition à Épictète, en soulignant le sentiment d'impuissance de l'être humain face à la divinité et au destin, ainsi que la superficialité des représentations humaines. Marc Aurèle, en tant que dernier grand philosophe stoïcien, n'a pas réellement d'apport fondamental au stoïcisme, bien que son ouvrage Pensées pour moi-même soit une synthèse complète du mouvement philosophique. Il s'est laissé guider par la philosophie même pendant les moments difficiles de sa vie publique et personnelle (entre autres le nombre élevé de ses enfants morts jeunes ; seuls cinq de ses treize enfants ont atteint l'âge adulte), et il a pu, en tant qu'homme d'État, suivre la voie du philosophe.",
    ] },
  { "title" = "Postérité et représentations", "paragraphs" = [
      "La statue équestre de Marc Aurèle à Rome est la seule statue équestre romaine qui ait survécu à l'époque moderne, peut-être parce qu'elle est identifiée à tort au Moyen Âge comme une représentation de l'empereur chrétien Constantin le Grand, évitant ainsi la destruction infligée aux statues de personnages païens. Fabriquée en bronze vers 175, elle mesure 3,5 mètres et se trouve aujourd'hui dans les musées du Capitole à Rome. La main de l'empereur est tendue dans un acte de clémence offert à l'ennemi vaincu, tandis que l'expression de son visage, fatigué par le stress de mener Rome dans des batailles presque constantes, représente peut-être une rupture avec la tradition classique de la sculpture. Depuis 2002, la statue figure sur les pièces de 50 centimes d'euro italiennes.",
      "La colonne de Marc-Aurèle, établie à Rome soit dans les dernières années de sa vie, soit après son règne et achevée en 193, est construite pour commémorer sa victoire sur les Sarmates et les tribus germaniques en 176. Une spirale de reliefs sculptés s'enroule autour de la colonne, montrant des scènes de ses campagnes militaires. Une statue de Marc Aurèle se trouvait au sommet de la colonne mais disparaît au cours du Moyen Âge. Elle est remplacée par une statue de Saint Paul en 1589 par le pape Sixte V. La colonne de Marc Aurèle et la colonne de Trajan sont souvent comparées par les érudits étant donné qu'elles sont toutes deux de style dorique, qu'elles ont un piédestal à la base, des frises sculptées représentant leurs victoires militaires respectives et une statue au sommet.",
      "En 1939, un buste en or de Marc Aurèle est retrouvé à Avenches, en Suisse, dans une canalisation sous la cour du sanctuaire du Cigognier. Il y aurait été placé afin de le protéger d'une menace étrangère, peut-être à l'occasion d'une invasion des Alamans. Réalisé autour de l'an 180, il a probablement servi d'imago pour les étendards romains, puis peut-être d'image de culte pour la cité romaine d'Aventicum. Il est l'un des trois derniers bustes en or d'empereur romain ayant échappé au recyclage de l'or. Le buste est exposé pour la première fois en 1996 et est conservé par le musée romain d'Avenches.",
    ] },
]

[articles.it]
text = "Cesare Marco Aurelio Antonino Augusto (in latino Caesar Marcus Aurelius Antoninus Augustus; nelle epigrafi: IMP·CAES·M·AVREL·ANTONINVS·AVG; Roma, 26 aprile 121 – Sirmio o Vindobona, 17 marzo 180), meglio conosciuto semplicemente come Marco Aurelio, è stato un imperatore, filosofo e scrittore romano. Su indicazione dell'imperatore Adriano, fu adottato nel 138 dal futuro suocero e zio Antonino Pio, che lo nominò co-erede al trono imperiale."
title = "Marco Aurelio"
lang = "it"
url = "https://it.wikipedia.org/wiki/Marco_Aurelio"
intro = [
  "Cesare Marco Aurelio Antonino Augusto (in latino Caesar Marcus Aurelius Antoninus Augustus; nelle epigrafi: IMP·CAES·M·AVREL·ANTONINVS·AVG; Roma, 26 aprile 121 – Sirmio o Vindobona, 17 marzo 180), meglio conosciuto semplicemente come Marco Aurelio, è stato un imperatore, filosofo e scrittore romano. Su indicazione dell'imperatore Adriano, fu adottato nel 138 dal futuro suocero e zio Antonino Pio, che lo nominò co-erede al trono imperiale.",
  "Nato Marco Annio Catilio Severo (Marcus Annius Catilius Severus), divenne Marco Annio Vero (Marcus Annius Verus) che era il nome di suo padre al momento del matrimonio con la propria cugina Faustina, e assunse quindi il nome di Marco Aurelio Cesare figlio dell'Augusto (Marcus Aurelius Caesar Augusti filius) durante l'impero di Antonino stesso.",
  "Marco Aurelio fu imperatore dal 161 fino alla sua morte, avvenuta per malattia nel 180 a Sirmio secondo il contemporaneo Tertulliano o presso Vindobona. Fino al 169 mantenne la coreggenza dell'impero assieme a Lucio Vero, suo fratello adottivo nonché suo genero, anch'egli adottato da Antonino Pio. Dal 177, morto Lucio Vero, associò al trono suo figlio Commodo. È considerato dalla storiografia tradizionale come un sovrano illuminato, il quinto e ultimo dei cosiddetti \"buoni imperatori\" menzionati da Edward Gibbon. Il suo regno fu tuttavia funestato da conflitti bellici (guerre partiche e marcomanniche), carestie e pestilenze.",
  "Marco Aurelio è ricordato anche come importante filosofo stoico, autore dei Colloqui con sé stesso (Τὰ εἰς ἑαυτόν nell'originale in greco). Alcuni imperatori successivi utilizzarono il nome \"Marco Aurelio\" per accreditare un inesistente legame familiare con lui.",
]
sections = [
  { "title" = "Fonti biografiche, storiografia antica e moderna", "paragraphs" = [
      "Le principali fonti per la vita e il ruolo di Marco Aurelio sono frammentarie e spesso inaffidabili. Il gruppo più importante è rappresentato dalle biografie contenute nella Historia Augusta, composte in epoca successiva al IV secolo.",
      "Le biografie derivate principalmente da fonti ormai perdute (come Mario Massimo), ma anche da Eutropio e Aurelio Vittore, ovvero quelle di Marco Aurelio, Adriano, Antonino Pio e Lucio Vero, sono ritenute accurate e affidabili.",
      "Di Frontone, maestro di retorica di Marco e di vari funzionari di Antonino Pio, si conservano una serie di manoscritti irregolari, che coprono il periodo che va dal 138 al 166. Nei Colloqui con sé stesso Marco offre una finestra sulla sua vita interiore, ma gran parte dei libri risulta senza riferimenti cronologici e con pochi accenni al mondo esterno.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "La famiglia di Marco era di origine romana, ma stabilita da tempo a Ucubi (Colonia Claritas Iulia Ucubi, odierna Espejo), una piccola cittadina della Spagna romana situata a sud est di Cordŭba. Essa salì alla ribalta alla fine del I secolo, quando il suo bisnonno, Marco Annio Vero, fu senatore e forse pretore. Nel 73–74, il nonno, anch'egli di nome Marco Annio Vero, fu elevato al rango di patrizio. Il terzo Marco Annio Vero, cioè suo padre, sposò Domizia Lucilla. Lucilla maggiore, la di lei nonna materna, aveva ereditato una grande fortuna, tra cui una fabbrica di mattoni (figlina) a Roma, attività alquanto redditizia in un'epoca in cui la città era interessata da una notevole espansione edilizia.",
      "La famiglia della madre era di rango consolare, mentre quella del padre vantava addirittura una discendenza da Numa Pompilio.",
      "Marco Aurelio nacque a Roma da Lucilla e Vero il 26 aprile del 121, secondo il calendario romano il sesto giorno prima delle calende di maggio, l'anno del secondo consolato di suo nonno Marco Annio Vero, corrispondente all'anno 874 dalla fondazione di Roma; la sorella, Annia Cornificia Faustina, nacque probabilmente nel 122 o nel 123. Il padre Annio Vero morì giovane, durante la sua pretura, presumibilmente nel 124, quando Marco aveva solo tre anni. Anche se difficilmente può averlo conosciuto, Marco Aurelio scrisse nelle sue Meditazioni che aveva imparato \"modestia e virilità\" dal ricordo di suo padre e dalla sua reputazione postuma. Lucilla non si risposò più.",
    ] },
  { "title" = "Matrimonio e discendenza", "paragraphs" = [
      "Marco Aurelio sposò sua cugina Annia Galeria Faustina, da cui ebbe almeno quattordici figli in trent'anni, incluse due coppie di gemelli. Di loro, solo un figlio e cinque figlie sopravvissero all'infanzia.",
      "Annia Aurelia Galeria Lucilla (150–182); sposò prima l'imperatore Lucio Vero e poi Tiberio Claudio Pompeiano, con discendenza da entrambi i matrimoni;",
      "Annia Aurelia Galeria Faustina (151–post 182); sposò Gneo Claudio Severo, con discendenza;",
    ] },
  { "title" = "Carattere e pensiero filosofico", "paragraphs" = [
      "Marco Aurelio fu l'ultimo grande esponente dello stoicismo. Tra il 170 e il 180, Marco scrisse i Colloqui con sé stesso, come esercizio per il proprio orientamento e automiglioramento. Il titolo è stato un'aggiunta postuma, originariamente Marco intitolò l'opera A sé stesso, ma non si sa se avesse intenzione di renderla pubblica. Il libro è considerato uno dei capolavori letterari e filosofici di tutti i tempi.",
    ] },
]

[articles.tr]
text = "Marcus Aurelius Antoninus (/ɔːˈriːliəs/ or-EE-lee-əs; Latince telaffuz: [ˈmaːrkʊs au̯ˈreːliʊs antoːˈniːnʊs]; 26 Nisan 121 - 17 Mart 180), 161 ile 180 yılları arasında Roma imparatoru olan Stoacı bir filozoftur. Nerva-Antoninus hanedanının bir üyesi, daha sonra Beş İyi İmparator olarak bilinen yöneticilerin sonuncusu ve Roma İmparatorluğu için MÖ 27'den MS 180'e kadar süren göreceli bir barış, sükûnet ve istikrar çağı olan Pax Romana'nın son imparatoruydu."
title = "Marcus Aurelius"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Marcus_Aurelius"
intro = [
  "Marcus Aurelius Antoninus (/ɔːˈriːliəs/ or-EE-lee-əs; Latince telaffuz: [ˈmaːrkʊs au̯ˈreːliʊs antoːˈniːnʊs]; 26 Nisan 121 - 17 Mart 180), 161 ile 180 yılları arasında Roma imparatoru olan Stoacı bir filozoftur. Nerva-Antoninus hanedanının bir üyesi, daha sonra Beş İyi İmparator olarak bilinen yöneticilerin sonuncusu ve Roma İmparatorluğu için MÖ 27'den MS 180'e kadar süren göreceli bir barış, sükûnet ve istikrar çağı olan Pax Romana'nın son imparatoruydu. 140, 145 ve 161 yıllarında Roma Konsülü olarak görev yaptı.",
  "Marcus Aurelius, praetor Marcus Annius Verus ve karısı Domitia Calvilla'nın oğluydu. İmparator Trajan ve Hadrianus ile evlilik yoluyla akrabaydı. Babası öldüğünde Marcus üç yaşındaydı ve annesi ile dedesi tarafından büyütüldü. Hadrianus'un evlatlık oğlu Aelius Caesar 138 yılında öldükten sonra, Hadrianus Marcus'un amcası Antoninus Pius'u yeni varisi olarak evlat edindi. Antoninus da Marcus'u ve Aelius'un oğlu Lucius'u evlat edindi. Hadrianus o yıl öldü ve Antoninus imparator oldu. Artık tahtın varisi olan Marcus, İrodis Attikos ve Marcus Cornelius Fronto gibi öğretmenlerden Yunanca ve Latince eğitimi aldı. Antoninus'un kızı Faustina ile 145 yılında evlendi.",
  "Antoninus, 161 yılında öldükten sonra Marcus, Lucius Aurelius Verus adını alan üvey kardeşiyle birlikte tahta geçti. Marcus Aurelius'un hükümdarlığı döneminde Roma İmparatorluğu pek çok askeri çatışmaya sahne oldu. Doğu'da Romalılar, Part İmparatorluğu ve isyancı Ermenistan Krallığı ile savaştı. Marcus, Markoman Savaşları'nda Markomanlar, Quadi ve Sarmatian Iazyges'i yendi. Bunlar ve diğer Cermen halkları, İmparatorluk için rahatsız edici bir gerçeklik oluşturmaya başladı. Roma para birimi denarius'un gümüş saflığını düşürdü. Roma İmparatorluğu'nda Hristiyanlara yönelik zulümlerin onun döneminde arttığı düşünülse de, dönemin kaynaklarında böyle bir zulüm yer almadı ve Iustinus ve Tertullianus'un eserlerinde \"Hristiyanların koruyucusu\" olarak adlandırıldı. 165 ya da 166 yılında patlak veren Antoninus vebası, Roma İmparatorluğu'nun nüfusunu harap ederek 5 ila 10 milyon insanın ölümüne neden oldu. Marcus, 180 yılında öldüğünde yerine oğlu Commodus geçti.",
  "Commodus'un Marcus'tan sonra tahta geçmesi, hem çağdaş hem de modern tarihçiler arasında tartışma konusu oldu. Marcus Aurelius Sütunu ve Marcus Aurelius'un Atlı Heykeli, askeri zaferlerini kutlamak için dikildikleri Roma'da hâlen ayakta durmaktadır. Bir filozof olarak Kendime Düşünceler adlı eseri, antik Stoacı felsefenin modern anlayışı için en önemli kaynaklardan biridir. Bu yazılar, ölümünden yüzyıllar sonra diğer yazarlar, filozoflar, hükümdarlar ve politikacılar tarafından övgüyle karşılandı.",
]
sections = [
  { "title" = "İlk yılları", "paragraphs" = [
      "Marcus, 26 Nisan 121 tarihinde Roma'da doğdu. Doğum adı bazen Marcus Annius Verus olarak verilir, ancak kaynaklar bu adı ona babasının ölümü ve reşit olduktan sonra büyükbabası tarafından gayri resmî olarak evlat edinilmesi üzerine verir. Doğduğunda ya da gençliğinin bir noktasında Marcus Annius Catilius Severus veya Marcus Catilius Severus Annius Verus olarak biliniyor olabilir. Antoninus tarafından tahtın vârisi olarak evlat edinildikten sonra Marcus Aelius Aurelius Verus Caesar ve tahta çıktıktan sonra ölümüne kadar Marcus Aurelius Antoninus Augustus olarak tanındı. Salamisli Epifanios, Ağırlıklar ve Ölçüler Üzerine adlı eserinde yer verdiği Roma imparatorları kronolojisinde onu Marcus Aurelius Verus olarak adlandırır.",
      "Marcus Aurelius'un babası Marcus Annius Verus (III) idi. Mensubu olduğu Annia sülalesi, İtalyan kökenliydi, ancak zamanla İberya'daki Baetica eyaletinde, günümüzde İspanya'nın Endülüs bölgesinde yer alan Córdoba'nın güneydoğusundaki küçük bir Roma kolonisi olan Ucubi'ye yerleşti. Bu sülale, efsanevi olarak Roma'nın ikinci kralı Numa Pompilius'un soyundan geldiğini iddia ediyordu. Annii Veri ailesi, Roma'da 1. yüzyılın sonlarına doğru yükselişe geçti. Marcus'un büyük büyükbabası Marcus Annius Verus (I), senatör ve eski praetordu. Büyükbabası Marcus Annius Verus (II) ise 73-74 yıllarında patrici statüsüne yükseltildi. Anne tarafından ise Marcus Aurelius, Nerva-Antoninus hanedanıyla bağlantılıydı. Büyükannesi Rupilia Faustina, İmparator Trajan'ın yeğeni olan Salonia Matidia'nın üvey kızıydı.",
      "Marcus'un annesi Domitia Lucilla Minor, Roma'nın soylu ailelerinden birine mensup olan P. Calvisius Tullus'un kızıydı. Ailesinden ve büyüklerinden büyük bir servet miras aldı; bu servet, Plinius'un mektuplarından birinde ayrıntılı şekilde anlatılmaktadır. Mirası arasında, Roma'nın hızla geliştiği ve inşaat faaliyetlerinin yoğun olduğu bir dönemde büyük kazanç sağlayan Roma dışındaki geniş tuğla üretim tesisleri bulunuyordu. Ayrıca, Roma'nın Caelian Tepesi'nde yer alan Horti Domitia Calvillae adlı bir villaya da sahipti. Marcus Aurelius, çocukluğunu bu villada geçirdi ve burada büyüdü. Caelian Tepesi'ne duyduğu bağlılığını, onu ‘‘Benim Caelian'ım’' şeklinde anarak ifade etti.",
    ] },
  { "title" = "Roma imparatoru", "paragraphs" = [
      "Antoninus Pius'un (7 Mart 161) ölümü üzerine Lucius Verus'la birlikte ikili imparatorluk koşullarını kabul etti. (Augusti). Teoride yasal olarak eşit olmalarına rağmen, Verus hem daha genç hem de daha az tanınmış olması sebebiyle pratikte ikinci sıradaydı.",
      "Müşterek dönüşüm belki de Marcus Aurelius'un sürekli olarak imparatorluğun dışında birileriyle savaşta olması nedeniyle askeri deneyimlerden hareketle hayata geçirilmişti. İmparatorun hem Germen hem de Pers cephesindeki birliklere aynı anda kumanda edecek yeteneği henüz olmadığından bir hayli otoriter bir yöneticiye ihtiyaç vardı. Ancak Jül Sezar ve Vespasian örneklerinde olduğu gibi herhangi bir komutanın yetkiyle birliklerin başına geçirilmesi zamanla bu generallerin birliklerin yardımıyla yönetimi ele geçirip kendilerini diktatör olarak ilan etmeleriyle sonuçlanma riskine sahipti. Marcus Aurelius problemi Verus'u doğu lejyonları komutanı yaparak çözdü. Verus birliklerini onların sadâkatiyle otoriter biçimde yönetecek kadar güçlüydü ve aynı zamanda Marcus'u devirecek kadar dürtüye de sahipti. Verus 169'da bir seferde ölene kadar sadık kaldı.",
      "Müşterek İmparatorluk hafiften Roma Cumhuriyeti döneminde bir kişinin tüm gücü elinde toplamasını engelleyen ve collegiality prensibine istinaden çalışan bir politik sistemi anımsatır. Müşterek yönetim 3. yüzyıl sonlarında Diocletianus'un Tetrarşiyi (dörtlü yönetim) ilan etmesiyle yeniden hayat buldu.",
    ] },
  { "title" = "Savaşları", "paragraphs" = [
      "Asya'da tekrar güçlenen Part İmparatorluğu, 161'de iki Roma ordusunu bozguna uğrattıktan sonra Ermenistan ve Suriye'yi işgal etmişti. Marcus Aurelius, Müşterek İmparator Verus'u lejyonları kumanda etmesi ve tehlikeyi önlemesi için doğuya gönderdi. Savaş 166 yılında, her ne kadar Gaius Avidius Cassius gibi alt kademedeki generallerin liyakati ile kazanılmış olsa da başarıyla sona erdi. Savaştan dönüşte Verus triumph'la (bir tür onursal karşılama töreni) ödüllendirildi; geçit töreni oldukça sıra dışıydı çünkü törende iki İmparator vardı ve İmparatorların oğulları ve evlenmemiş kızlarıyla birlikte oldukça büyük bir aile kutlamasıydı. Bu arada fırsattan istifade Marcus Aurelius'un, beş yaşındaki oğlu Commodus ve üç yaşındaki Annius Verus'a Sezar statüsü verildi.",
      "Savaştan dönen ordunun tüm İmparatorluğa yaydığı veba (çiçek hastalığı olduğu da iddia edilir) birkaç yıl boyunca etkili oldu.",
      "160'ların başında, Germen kabileler ve diğer kuzeyli halklar kuzeydeki sınır boyunca (limes Germanicus) yağmalarla Tuna nehrini geçerek Galya içlerine ulaşmıştı. Batı yönündeki bu yeni şiddet dalgası, belki de uzak doğudaki kabileler yüzündendi. Germania Superior (yukarı Germanya eyaleti) idari bölgesi Catti'deki ilk işgal 162'de püskürtüldü. Asıl büyük işgal, MS 19'dan beri Roma vatandaşı olan Bohemyalı Marcomanni kabilesinin 166'da Lombardlar ve diğer Germen kabilelerle Tuna nehrini geçtiği zaman ortaya çıktı. Yine bu sıralarda Sarmatianlar, Tuna ve Tisza nehirleri arasından saldırdı.",
    ] },
  { "title" = "Çin'le ilk temas", "paragraphs" = [
      "Marcus Aurelius zamanında, Han hanedanı kayıtları 166'da Roma'dan bir temsil heyetinin Çin'in başkenti Luoyang'da Çin imparatoru Huan'la görüştüğünü yazar. Kayıtlara göre, Romalılar Antun tarafından gönderildiklerini belirttiler. Belirtilen tarihe göre bu Marcus Aurelius Antoninus olabilir. Diğer taraftan, çağdaşı Roma kayıtları Çin'le irtibat için herhangi bir girişimden söz etmez.",
    ] },
]

[articles.ja]
text = "マルクス・アウレリウス・アントニヌス（古典ラテン語：Marcus Aurelius Antoninus 121年4月26日 - 180年3月17日）は、第16代ローマ皇帝である。五賢帝最後の皇帝。第15代皇帝アントニヌス・ピウスの后妃ファウスティナ・マイヨル（大ファウスティナ）の甥で先帝の外戚にあたり、また大ファウスティナはハドリアヌスとトラヤヌスの傍系血族でもある。 外叔父アントニヌスの皇女で自身の従姉妹であるファウスティナ・ミノル（小ファウスティナ）と結婚して帝位を継承したが、共同皇帝としてハドリアヌスの重臣の子ルキウス・ウェルスが立てられていた。アウレリウスは小ファウスティナとの長女ルキッラを嫁がせて両皇帝の結束を固めたが、169年にウェルスが崩御した事で単独の皇帝となった。 対外政策ではパルティアとの戦争に勝利を収めたが、蛮族への予防戦争として始めたマルコマンニ人、クアディ人、サルマティア人などへの遠征（マルコマンニ戦争）は長期戦となり、国力を疲弊させ、自らも陣中で崩御した。 ストア哲学などの学識に長け、良く国を治めた事からネルウァ、トラヤヌス、ハドリアヌス、アントニヌスと並ぶ、この時代の名君の一人（五賢帝）と評価されている。軍事よりも学問を好んだ皇帝という姿は、彼の著作である『自省録』への評価を通じて今日も維持されている。これは『国家』を執筆したプラトンの時代から学識者にとって理想とされた「哲人君主」の実現例と見なされているからである。 また、『後漢書』に見られる大秦国王の安敦とは、彼のことだとされているが、使節が所持していた物品がいずれも南方のものであったり、ローマ側の文献に一切記録がないことから、商人が彼の名を使い王朝との貿易を行おうとしたのではないかとされており、現代では「大秦国王安敦」を彼であるとする説は否定的に見られている。"
title = "マルクス・アウレリウス・アントニヌス"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%83%9E%E3%83%AB%E3%82%AF%E3%82%B9%E3%83%BB%E3%82%A2%E3%82%A6%E3%83%AC%E3%83%AA%E3%82%A6%E3%82%B9%E3%83%BB%E3%82%A2%E3%83%B3%E3%83%88%E3%83%8B%E3%83%8C%E3%82%B9"
intro = [
  "マルクス・アウレリウス・アントニヌス（古典ラテン語：Marcus Aurelius Antoninus 121年4月26日 - 180年3月17日）は、第16代ローマ皇帝である。五賢帝最後の皇帝。第15代皇帝アントニヌス・ピウスの后妃ファウスティナ・マイヨル（大ファウスティナ）の甥で先帝の外戚にあたり、また大ファウスティナはハドリアヌスとトラヤヌスの傍系血族でもある。",
  "外叔父アントニヌスの皇女で自身の従姉妹であるファウスティナ・ミノル（小ファウスティナ）と結婚して帝位を継承したが、共同皇帝としてハドリアヌスの重臣の子ルキウス・ウェルスが立てられていた。アウレリウスは小ファウスティナとの長女ルキッラを嫁がせて両皇帝の結束を固めたが、169年にウェルスが崩御した事で単独の皇帝となった。",
  "対外政策ではパルティアとの戦争に勝利を収めたが、蛮族への予防戦争として始めたマルコマンニ人、クアディ人、サルマティア人などへの遠征（マルコマンニ戦争）は長期戦となり、国力を疲弊させ、自らも陣中で崩御した。",
  "ストア哲学などの学識に長け、良く国を治めた事からネルウァ、トラヤヌス、ハドリアヌス、アントニヌスと並ぶ、この時代の名君の一人（五賢帝）と評価されている。軍事よりも学問を好んだ皇帝という姿は、彼の著作である『自省録』への評価を通じて今日も維持されている。これは『国家』を執筆したプラトンの時代から学識者にとって理想とされた「哲人君主」の実現例と見なされているからである。",
]
sections = [
  { "title" = "歴史資料", "paragraphs" = [
      "マルクス・アウレリウスの人生と治世に関する資料は疎らで、信憑性の薄い物が多く含まれている。例えば主要な情報源とされる『ローマ皇帝群像』は多くの問題を持った資料であり、引用元の資料よりも価値は低い。ハドリアヌスからアウレリウスまでの評伝は作中でも比較的に信憑性があるが、それでもアエリウス・ウェルスやガイウス・アウィディウス・カッシウスの評伝は完全な捏造であると見られる。",
      "マルクス・アウレリウス自身は『自省録』という著作を残したが、これは主にアウレリウスの内面についての記述や思索であって、俗事の出来事については余り触れられていない。同時代の歴史家にはカッシウス・ディオがおり、特に軍政についての記述においては重要な記録を残している。しかしディオの元老院階級としての偏見や、帝国領土の拡大に対する反対意見は真意を不明瞭にしている。",
      "他にアウレリウスと関わった様々な人が残した記録は、細かい出来事についての詳細を提供している。アントニヌス朝の貴族達について記録した宮殿医ガレノス、時代の風潮を推測させるアイリオス・アリスティデスの演説、そして東ローマ時代の勅法彙纂に記録されるアウレリウスの法整備などがそれにあたる。碑銘、通貨なども治世を調べる上での情報源とされる。",
    ] },
  { "title" = "生い立ち", "paragraphs" = [
      "父方の一族であるウェルス家は属州ヒスパニア・バエティカのコルドバに所領を持ち、西暦1世紀頃からローマ中央でも知られた存在にまで台頭し始めた。曽祖父アンニウス・ウェルス1世が元老院議員として議席を与えられ、祖父のウェルス2世の代で貴族に列された。アンニウス・ウェルス3世はドミティア・ルキッラと結婚してカティリウス・セウェルス（アウレリウス）という子を儲けた 両親には二人の子供がおり、アウレリウス以外にコルニフィキアという姉がいた。ドミティア・ルキッラは、有力貴族のカルビシウス・トゥルス・ルッソの子であり、また母の大ドミティアも親族の財産を相続した資産家であった（この事はガイウス・プリニウス・カエキリウス・セクンドゥスの書簡にも書き残されている）。彼女は後に煉瓦生産の工房など、両親の財産を相続してウェルス家を更に富ませた。",
      "父であるウェルス3世も元老院で法務官などの要職を歴任していたが、アウレリウスが3歳の時に病没した。従って後の皇帝としての方針に父の影響がどの程度あったのかは不明であるが、彼自身は『自省録』で彼が「謙虚と剛毅さ」を父の思い出と死後の話で学び知ったと語っている。母ドミティアは再婚しなかったが、当時の貴族階級にとっての常として子供の養育は家庭教師や侍従達に任せていた。一方で貴族としての優雅な生活で堕落しないように「宗教的な敬虔さ」と「粗食」を躾として教えられたという。アウレリウスは母親についての感謝を述べる手紙を書き残している。",
      "父の死後、アウレリウスは祖父ウェルス2世に引き取られ、ルキウス・カティリウス・セウェルスという男性が養育を手伝った。ルキウス・カティリウスは「母方の曾祖父」と言われ、恐らくは大ドルシッラの継父であったと見られている。アウレリウスは彼の両親が残したカエリウスの丘にある邸宅で過ごし、そこは僅かな公共施設を除けば殆どが貴族の別荘からなる高級住宅街であった。また祖父はラテラノ大聖堂の近くに邸宅を持ち、アウレリウスにとって馴染み深い場所となった。祖父の教育については「良心と自制心」を教わったと書き残しているが、祖父が祖母の死後に連れてきた妾とは折り合いが悪かったという 幸いにして妾が出入りするようになって直に家から出られた事を、アウレリウスは幸運だったと述べている。",
    ] },
  { "title" = "治世", "paragraphs" = [
      "アントニヌス帝崩御後、誰もが甥にして娘婿であるアウレリウスの即位を有力視し、実質的に皇帝候補者は一人だけのように扱われた。元老院は直ちにアウグストゥス（尊厳者）とインペラトル（軍指揮官）の二大称号を授与、更には最高神官長にも就任した。アウレリウスは皇帝即位を拒む素振りを見せ、複数の伝記作家は「彼は無理に帝位を継がされたのだ」とまで論じている。事実はともかく、アウレリウスのストア派的な価値観からすれば皇帝としての権力に魅力を感じず、退廃した宮廷での政務を好ましく思わなかった可能性はある。",
      "また叔父と自身の即位を企てたハドリアヌス帝を個人的に好んではいなかった（『自省録』ではハドリアヌスに辛辣な評価を与えている）が、恩人の考えに狂いを生じさせるのも不義理と考えていた。従って元老院と叔父が意図的に除外していたルキウス・ウェルスも、ハドリアヌス帝の遺言の通りに自らの共同皇帝にするように命じた。かくしてルキウスも共同皇帝として元老院から認可され、「アウグストゥス」「インペラトル」の称号と護民官職権を得た。",
      "戴冠した二人はそれぞれ皇帝インペラトル・カエサル・マルクス・アウレリウス・アントニヌス・アウグストゥス（Imperator Caesar Marcus Aurelius Antoninus Augustus）、共同皇帝インペラトル・カエサル・ルキウス・アウレリウス・ウェルス・アウグストゥス（Imperator Caesar Lucius Aurelius Verus Augustus）と名乗った。いわゆる「共同皇帝制」が採用されたのはこれが初めての事例となった。名目上はともかく、実質的にアウレリウスの方が遥かに多くの権限を持ち、ルキウスはアウレリウスの共同者でしかなかった。どちらが皇帝で、どちらがその共同皇帝かは民衆の間ですら明らかであった。伝記作家は「ルキウスはアウレリウスに従った。ちょうど属州総督が皇帝に従うのと同じ理屈で、臣下として従ったのだ」と書き残している。",
    ] },
  { "title" = "著作", "paragraphs" = [
      "アウレリウスはマルコマンニ戦争の後半から、自らへの戒めを兼ねて思索を綴って著作『自省録』を完成させた。本来は他者に公開するために書いた訳ではなかった為、原文には「自分自身へ」と簡潔な表題が書かれていた。彼は少年期に傾倒したストア派の禁欲主義を生涯にわたって守り続け、これを美徳として価値観の中心に置いていた。したがってストア派の思想書として第一に挙げられ、近代でもフリードリヒ2世、ジョン・スチュアート・ミル、マシュー・アーノルド、ヨハン・ヴォルフガング・フォン・ゲーテ、温家宝などが愛読書としていた。",
      "『自省録』が後世のローマ帝国にどんな程度の影響を与えたのかは定かではないが、後世の皇帝であるフラウィウス・クラウディウス・ユリアヌスは『自省録』自体には触れないながらもアウレリウスの哲学者としての影響を論じている。現在見ることができる『自省録』は10世紀に書かれた原文の写本を1558年に出版形式に直したものである。",
    ] },
]

[articles.ko]
text = "마르쿠스 아우렐리우스 안토니누스(라틴어: Marcus Aurelius Antoninus, 121년 4월 26일 - 180년 3월 17일)는 로마 제국의 제16대 황제(161 - 180년)이자 스토아 학파 철학자이다. 그는 오현제 (약 13세기 뒤에 니콜로 마키아벨리가 붙인 용어)라고 알려진 통치자들 중 마지막 인물이자, 두 번째로는 마르쿠스 아우렐리우스의 아들 콤모두스 이전 로마 제국의 상대적 평화와 안정성의 시기인 팍스 로마나 (기원전 27년에서 서기 180년)의 마지막 황제였다."
title = "마르쿠스 아우렐리우스"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EB%A7%88%EB%A5%B4%EC%BF%A0%EC%8A%A4_%EC%95%84%EC%9A%B0%EB%A0%90%EB%A6%AC%EC%9A%B0%EC%8A%A4"
intro = [
  "마르쿠스 아우렐리우스 안토니누스(라틴어: Marcus Aurelius Antoninus, 121년 4월 26일 - 180년 3월 17일)는 로마 제국의 제16대 황제(161 - 180년)이자 스토아 학파 철학자이다. 그는 오현제 (약 13세기 뒤에 니콜로 마키아벨리가 붙인 용어)라고 알려진 통치자들 중 마지막 인물이자, 두 번째로는 마르쿠스 아우렐리우스의 아들 콤모두스 이전 로마 제국의 상대적 평화와 안정성의 시기인 팍스 로마나 (기원전 27년에서 서기 180년)의 마지막 황제였다. 그는 140년, 145년, 161년에 집정관직을 수행하기도 했다.",
  "마르쿠스는 하드리아누스 치세에 하드리아누스의 조카이자 법무관인 마르쿠스 안니우스 베루스와 도미티아 칼빌라의 아들로 태어났다. 그의 아버지는 그가 세 살 때 죽었고, 그의 어머니와 조부가 그를 길렀다. 하드리아누스의 양자 아일리우스 카이사르가 138년에 사망한 뒤, 하드리아누스는 마르쿠스의 삼촌인 안토니누스 피우스를 새로운 후계자로 받아들였다. 그 대가로, 안토니누스는 마르쿠스와, 아일리우스의 아들인 베루스를 양자로 받아들였다. 하드리아누스는 그 해에 죽었고, 안토니누스가 황제가 되었다. 이제부터 황제 자리의 후계자인 마르쿠스는 헤로데스 아티쿠스와 마르쿠스 코르넬리우스 프론토 같은 스승들 밑에서 그리스어와 라틴어를 수학했다. 그는 145년에 안토니누스의 딸인 파우스티나와 혼인했다.",
  "안토니누스가 161년에 죽은 뒤, 마르쿠스는 루키우스 베루스라는 이름으로 황제 자리에 오른 양형제와 같이 황제가 되었다. 마르쿠스의 치세에, 로마 제국은 막대한 군사 분쟁을 맞이했다. 동방 지역에서, 로마인들은 기세를 회복한 파르티아 제국과 로마에 저항한 아르메니아 왕국 등과 성공적으로 전쟁을 치렀다. 마르쿠스는 마르코만니 전쟁에서 마르코만니족, 콰디족, 사르마티아족계의 야지게스족을 제압했으나, 이들 및 다른 게르만족들이 로마 제국에 문제의 실체로 모습을 드러내기 시작했다. 그는 로마 화폐인 데나리우스의 은 순도를 교정하였다. 로마 제국의 기독교 박해기 마르쿠스 집권기에 커졌던 것으로 보이지만, 이 상황에서 그의 개입에 대해선 알려진 것은 없다. 안토니누스 역병이 165년이나 166년에 발생하여 로마 제국의 인구를 휩쓸어, 인구 1,000만 명 중에 500만 명의 죽음을 야기하였다. 루키우스 베루스는 169년에 역병으로 사망했을 것으로 보인다.",
  "일부 이전 통치자들과 달리, 마르쿠스는 후계자에 양자를 쓰지 않기로 택하였다. 그의 자녀들에는 베루스와 결혼한 루킬라 그리고, 콤모두스가 있었는데, 마르쿠스 이후 콤모두스의 즉위는 동시대와 현대 역사가들 양쪽에서 논쟁의 대상이었다. 마르쿠스 아우렐리우스 원주와 기마상은 여전히 로마에 서 있으며, 이들 시설들은 마르쿠스의 군사적 승리를 기념하여 만들어졌다. 동시대 전기작가들이 마르쿠스를 칭했던 ‘철학자’가 쓴 《명상록》은 고대 스토아 철학을 오늘날 이해하는 데 있어 중요한 자료이다. 명상록은 그가 죽고 수 세기 뒤에 작가들, 철학자들, 군주들, 정치인들한테서 극찬을 받고 있다.",
]
sections = [
  { "title" = "사료", "paragraphs" = [
      "마르쿠스 아우렐리우스의 생애와 통치를 묘사한 주요 사료들은 불완전하고 빈번하게 신뢰할만하지 못하다. ‘히스토리아 아우구스타’에 포함된 가장 중요한 자료들 그리고 전기 내용들은 서기 4세기 전환기에 한 작가 집단들을 통해 쓰여졌다고 주장되지만, 이 사료들은 실제로는 대략 서기 395년 무렵에 단일 작가 (여기에서는 ‘전기작가’로 지칭)가 썼다고도 여겨진다. 후대의 전기집 및 부제와 황제 지위 주장자들의 전기집은 신뢰도가 떨어지지만, 현재는 소실된 초기의 사료들 (마리우스 막시무스 또는 이그노투스) 작성된 초기 전기집들이 훨씬 더 정확하다. 마르쿠스의 생애와 통치 부분에 있어서, 하드리아누스, 안토니누스, 마르쿠스, 루키우스의 전기집들은 대개 신뢰할 수 있지만, 아일리우스 베루스와 아비디우스 카시우스의 전기집들은 그렇지 못하다.",
      "마르쿠스의 스승 프론토와 여러 안토니누스 시대의 관료들 간의 서한 본문이 138년경에서 166년 기간을 다루는 불완전한 필사본들 속에 남아있다. 마르쿠스의 ‘명상록’은 그의 내면의 인생에 대한 창을 제공하지만, 대개 시대를 추정할 수 없고 세속적 일에 대해선 거의 상세한 언급을 하지 않는다. 이 시기의 주요 출처는 비티니아의 니카이아 출신 그리스 원로원 의원인 카시우스 디오으로, 8권으로 로마 건국부터 229년까지의 로마 역사에 대해서 썼다. 디오는 이 시기 군사 역사에 있어 매우 중요하지만 그의 원로원 의원 계급적 편견과 제국의 확장에 대한 강한 반대는 그의 관점을 불명확하게 한다. 안토니누스 시대 엘리트들의 습관에 대한 의사 갈레노스의 저술들, 이 당시의 기질에 대한 아일리우스 아리스티데스의 연설문, 마르쿠스의 법률서에 대해 ‘학설휘찬’과 ‘유스티니아누스 법전’에 남아있는 내용 등 일부 다른 문헌 자료들에서는 상세한 내용을 전하고 있다. 비문과 화폐 발견물 등도 문헌 자료를 보충하고 있다.",
    ] },
  { "title" = "어린 시절", "paragraphs" = [
      "마르쿠스는 121년 4월 26일 로마에서 태어났다. 출생 당시의 이름은 마르쿠스 안니우스 베루스로 추정되지만, 일부 자료들에서는 이 이름을 그의 아버지가 사망했을 당시와 그의 할아버지가 그를 비공식적 입양했을 때, 성년이 되었을 때, 그가 혼인을 했을 당시로 보았다. 그는 출생 당시나 어렸을 적 어느 시점에는, 마르쿠스 안니우스 카틸리우스 세베루스, 혹은 마르쿠스 카틸리우스 세베루스 안니우스 베루스라고 알려졌을 수 있다. 그가 안토니누스에게 황제 후계자로 간택되었을 당시, 그는 마르쿠스 아일리우스 아우렐리우스 베루스 카이사르라고 알려졌고, 즉위 후로는 사망할 때까지 마르쿠스 아우렐리우스 안토니누스 아우구스투스라고 알려졌다. 살라미스의 에피파니오는 저서 ‘도량형에 대하여’(Περὶ μέτρων καὶ στάθμων)가 들어가 있는, 로마 황제들의 전기집에서 그를 ‘마르쿠스 아우렐리우스 베루스’라고 칭했다.",
      "마르쿠스의 아버지 가문은 로마의 이탈리아계 히스파니아를 기원으로 한다. 그의 아버지는 마르쿠스 안니우스 베루스이다. 안니우스 일족은 누마 폼필리우스의 후손이라는 전설상의 주장과 함께 이탈리아족을 기원으로 하며, 안니우스 일족의 한 분파가 이베리아반도의 바이티카에 있는 코르도바에서 남동쪽 떨어진 작은 마을 우쿠비로 이주했다. 로마령 스페인 속주를 근거로 한, 이 분파의 아우렐리우스 (Aurelii) 일족 계열인 안니우스 베루스 (Annii Veri) 일족은 서기 1세기 후기에 로마에서 위세를 키워갔다. 마르쿠스의 증조부 마르쿠스 안니우스 베루스는 원로원 의원이었고 히스토리아 아우구스타에 따르면 전직 법무관이기도 했다. 조부인 마르쿠스 안니우스 베루스는 73–74년에 파트리키가 되었다. 조모 루필리아 파우스티나를 통해서, 마르쿠스는 네르바-안토니누스 왕조에 속하였다. 트라야누스 황제의 누이 조카 살로니아 마티디아는 루필라의 어머니이었고 하드리아누스의 아내 사비나의 이복 자매였다.",
      "마르쿠스의 어머니 도미티아 루킬라 미노르 (혹은 도미티아 칼빌라)는 로마의 파트리키 계급인 P. 칼비시우스 툴루스의 딸이고 부모와 조부모한테서 큰 재산 (플리니우스의 서신들 중 하나에서 묘사됨). 그녀의 재산에는 당시 건설붐을 겪고 있던 로마시의 상황에서 수익성 있는 사업이던 로마시 외각의 커다란 벽돌 공장들과, 로마의 카일리우스 언덕에 있던 빌라인 ‘호르티 도미티아 칼빌라이’(Horti Domitia Calvillae) 혹은 ‘루킬라이’(Lucillae)가 있었다. 마르쿠스 그 자체도 호르티에서 태어나 자랐고 카일리우스 언덕을 ‘나의 카일리우스’라고 칭하기도 했다.",
    ] },
  { "title" = "치세", "paragraphs" = [
      "안토니누스가 161년에 사망한 뒤, 마르쿠스는 로마 제국의 사실상의 단독 통치자였다. 황제 즉위에 관한 형식상의 절차가 따랐을 것이다. 원로원은 곧장 그에게 아우구스투스라는 이름과 '임페라토르'라는 칭호를 내려주었을 것이고, 그는 바로 로마의 국가 종교 최고 사제인 '폰티펙스 막시무스'로 공식적으로 선출되었을 것이다. 마르쿠스는 일종의 황제 즉위에 대한 거부 모습를 보였는데, 전기작가는 그가 황제의 권력을 강제로 갖게 되었다고 기록하였다. 이는 진실로 '황제 권력의 두려움'(horror imperii)이었을 수 있다. 철학자로서의 삶에 대한 선호가 있던 마르쿠스는 황궁이 매력적이지 못한 곳이라는 걸 알고 있었다. 하지만 스토아 철학자로서 그의 단련이 그에게 황제가 되는 것이 그의 의무라는 점을 명확하게 하였다.",
      "마르쿠스가 하드리아누스에 대한 개인적 애정을 보인 바는 없으나 (특히나, 그는 '명상록' 제1권에서 그에 대한 감사함을 표하지 않았다), 그는 아마 그 자의 승계 계획을 이뤄지게 하는 것이 그의 의무라고 믿은 것 같다. 따라서, 원로원이 마르쿠스의 승인을 단독으로 계획했다 하더라도, 그는 루키우스가 동일한 권한을 받지 않는 한 황제 자리를 거부하였다. 원로원은 이를 받아들이고, 루키우스에게 '임페리움', 호민관 권한, 아우구스투스 칭호를 부여하였다. 마르쿠스는 공식 칭호가 임페라토르 카이사르 마르쿠스 아우렐리우스 안토니누스 아우구스투스가 되었고, 루키우스는 콤모두스라는 자신의 이름을 포기하고 마르쿠스의 가문 명칭 베루스를 취하며 임페라토르 카이사르 마르쿠스 아우렐리우스 베루스 아우구스투스가 되었다. 이 둘의 즉위는 로마가 두 명의 황제의 통치를 받은 첫 사례였다.",
      "이들간의 명목상의 동일함에도, 마르쿠스가 루키우스보다 더 많은 '아욱토리타스'(권위)를 가졌다. 그는 루키우스보다 한 차례 더 집정관을 지냈고, 안토니누스의 집권기에 통치에 참여했으며, 단독으로 '폰티펙스 막시무스'이기도 하였다. 어느 황제가 더 손위인지는 민중들에게 분명했을 것이다. 전기 작가는 \"부관이 프로콘술에게 복종하듯 또는 총독이 황제에게 복종하듯... 베루스는 마르쿠스에게 복종했다.\"라고 글을 남겼다.",
    ] },
  { "title" = "기독교인들에 대한 태도", "paragraphs" = [
      "기독교 시대의 1-2세기에서, 기독교인들의 박해에 대한 주 책임자는 로마의 지방 관리들이었다. 2세기에, 로마 황제들은 기독교를 자신들의 심복들이 처리할 지역 문제로 다뤘다. 로마 제국의 여러 지역에서 기독교인들의 박해 수와 심각성은 마르쿠스 집권기에 늘어난 것으로 보인다. 마르쿠스 자신이 이러한 박해를 지시, 장려 또는 인지한 정도는 불분명하고 역사가들 사이에서 많이 논의되었다. 초기 기독교 옹호자인 순교자 유스티노는 저서 호교론 제1권 (서기 140년-150년 사이 저술)에서 마르쿠스 아우렐리우스가 로마 원로원에 보낸, 전장의 일을 묘사한 서신 (마르쿠스가 황제에 오르기 전에 씀)를 첨부하였는데, 이 문서에서 마르쿠스는 기독교인들의 기도가 \"하늘에서 물이 쏟아져\" 그의 군대의 물 부족 사태를 해결하여 그 후, \"우리는 즉시 기독교 신의 존재를 인식했다.\"라며 믿고 있다. 마르쿠스는 원로원에 로마에 의한 기독교 박해의 초기 정책을 중단할 것을 요청한다. 이 서신은 유스티노가 포함한 로마 황제들의 사례 중 하나로, 나머지 두 개 (이 중엔 아우렐리우스의 서신을 포함)는 위조된 것으로 여겨진다.",
    ] },
  { "title" = "유산과 평판", "paragraphs" = [
      "마르쿠스는 생애 동안 철인왕이라는 평판을 얻었고, 이 칭호는 사후에도 유지되었을 것이며 디오와 전기 작가 모두 그를 '철인'이라 칭했다. 유스티노 순교자, 아테나고라스, 에우세비우스 같은 기독교인들 역시도 그에 대해 같은 칭호로 불렀다. 에우세비우스는 그에 대해서 안토니누스와 하드리아누스보다 '한층 더 박애적이고 철학적이다'라고 하기까지 하였으며, 기독교인들에게 박해를 가하는 도미티아누스와 네로와 대조적으로 마르쿠스한테 대비를 두드러지도록 하였다.",
      "역사가 헤로디아노스는 다음과 같이 기록했다:황제들 중에 유일하게, 그는 몇 가지 말이나 철학적 교리의 지식이 아닌 그의 비난할 점이 없는 인성과 생애의 절제된 방식으로 자신의 학식을 증명해냈다.",
      "이언 킹은 마르쿠스의 유산이 비극적이라 하였다: 자기 절제적이고, 의무적이고, 다른 이들에게 존경 받을 만한 [황제의] 스토아 철학은 사망 당시에 그가 택한 황가의 혈통에게 너무나 비참하게 버려졌다.",
    ] },
]

[articles.ar]
text = "ماركوس أوريليوس أنطونينوس أغسطس أو مُرْقُس أُورُلْيُوس أَنْطُنْيَنْس أُغُسْطُس (اللاتينية: Marcus Aurelius Antoninus Augustus) (26 أبريل 121 - 17 مارس 180) هو فيلسوف رواقي وإمبراطور الروم السادس عشر (161 - 180) وخامس الأباطرة الأنطونيين الرومان. وهو أبو الإمبراطور قومودوس."
title = "ماركوس أوريليوس"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D9%85%D8%A7%D8%B1%D9%83%D9%88%D8%B3_%D8%A3%D9%88%D8%B1%D9%8A%D9%84%D9%8A%D9%88%D8%B3"
intro = [
  "ماركوس أوريليوس أنطونينوس أغسطس أو مُرْقُس أُورُلْيُوس أَنْطُنْيَنْس أُغُسْطُس (اللاتينية: Marcus Aurelius Antoninus Augustus) (26 أبريل 121 - 17 مارس 180) هو فيلسوف رواقي وإمبراطور الروم السادس عشر (161 - 180) وخامس الأباطرة الأنطونيين الرومان. وهو أبو الإمبراطور قومودوس. كان هو «خامس الأباطرة الصالحين» حكموا الإمبراطورية الرومانية من 96 إلى 180م، كما أنه يُعتبر من أعيان ورؤوس الفلاسفة الرواقيين. تولى مُلْك الإمبراطورية الرومية بالشراكة مع أخيه المُتبنى لوسيوس فيروس من 161م وحتى وفاة فيروس في 166م، ومن ثم مع ابنه قومودوس منذ عام 177م.",
  "الوحيد الذي أُطلق عليه إسم الفيلسوف من بين القياصرة الروم، كان مجتهداً بالفلسفة الرواقية، إنتشرت مصنفاته الفلسفية الشخصية والتي سُميت لاحقاً بالتأملات مصدراً هاماً للمفهوم الحديث للفلسفة الرواقية القديمة، والتي مازالت تعتبر من قبل الكثيرين من أهل التاريخ كأحد أجَلّْ المصنفات الفلسفية والكتب الأدبية في السياسة والملك.",
  "إنتصرت الإمبراطورية الرومية في عهده على ثورة الأشكانيين في المشرق، حيث أخمد الأرطبون أفيديوس كاسيوس التمرد الذي حدث في العاصمة الأشكانية قطيسفون في عام 164م. ونجح أورليوس في صد غارات القبائل الجرمانية: الماركومانيون والكواديون والسرمثيون، في الغزوات الماركومانية في أوروبا الوسطى إلى بلاد الغال على طول نهر الدانوب. بالرغم من تهديدات القبائل الجرمانية التي بدأت بالتسبب بتدويخ وإزعاج الإمبراطورية.",
  "وبموته في عام 180م إنتهى عصر ما يُعرف بالسلام الرومي، والذي تلاه إضطرابات كثيره في الغرب مَهدت لبداية سقوط الإمبراطورية الرومانية الغربية.",
]
sections = [
  { "title" = "أصلة ومنشأه", "paragraphs" = [
      "يُعتقد بأن إسمه في صباه كان مرقس أنيوس فيروس (اللاتينية: Marcus Annius Verus)، وأختلفت بعض الأقاويل بصحة إسمه هذا عندما رعاه جده بعد وفاة أبيه، أو عندما بلغ رُشده. ربما كان معروفاً عند ولادته أو في أحد سنين حياته الأولى باسم مرقس أنيوس كتليوس سويرس (اللاتينية: Marcus Annius Catilius Severus). وربما قد دُعي بي مرقس كاتليوس سويرس أنيوس فيروس (اللاتينية: Marcus Catilius Severus Annius Verus). عندما إستلم الإمبراطورية عُرف باسم مرقس إليوس أورليوس فيروس قيصر (اللاتينية: Marcus Aelius Aurelius Verus Caesar)، وبعد فترة من اعتلاءه العرش وحتى هلاكة كان يُعرف بمرقس أورليوس أنطنينس أغسطس (اللاتينية: Marcus Aurelius Antoninus Augustus).",
      "أسرة ماركوس من شيجة، وهي قريةٌ صغيرة في جنوب شرق قرطبة من أعمال إسبانية. وبرزت أسرتهُ في أواخر القرن الأول الميلادي، كان جد ماركوس الأكبر ماركوس أنيوس فيروس الأول شيخاً وبريتوراً سابق. في عامي 73-74 للميلاد عُين جده ماركوس أنيوس فيروس الثاني بطريقاً أو كاهناً. تزوج والده ماركوس أنيوس فيروس الثالث بدومطيا لوسيلا.",
      "لوسيلا هي ابنة أحد البطارقة، والدتها دومطيا لوسيلا الكبرى ورثت أموالاً كثيرة من جد أمها وجد أبيها المتبنى. وقد حصلت لوسيلا الصغرى قدراً من هذه الثروة من أمها، بما في ذلك مصنع قرميد في أحد ضواحي رومية الكبرى، وكان يدر عليها أموالًا كثيره حينها عندما أزدهرت رومية الكبرى إزدهاراً عظيماً.",
    ] },
  { "title" = "مؤلفاته", "paragraphs" = [
      "ان ماركوس اوريليوس خلّد اسمه بين الاباطرة العظام لسبب لا صلة مباشرة له بالسلطة. إذ أنه اشتهر بطول باعه في مضمار الفلسفة اليونانية، ووضع مؤلفاً باللغة اليونانية من 12 فصلا عرف بـ«التأملات»، يعد من أبرز آثار الفكر الفلسفي الرواقي، ويعرض إيمانه بأن الحياة الخلوقة السوية تفضي إلى السكينة والطمأنينة، ويشدد على فضائل الحكمة والعدالة والاعتدال والصلابة في المواقف.",
    ] },
  { "title" = "آثاره في ليبيا", "paragraphs" = [
      "قوس ماركوس اوريليوس (في العاصمة الليبية طرابلس -«أويا»)، في حي باب البحر. ويعتبر واحداً من الآثار الرومانية العديدة التي تزخر بها ليبيا شرقاً وغرباً، ولا سيما في شحات ولبدة الكبرى (لابتيس ماغنا) وصبراتة. ويرى الباحثون في التاريخ الفينيقي لليبيا أن اتجاهات أبواب قوس ماركوس اوريليوس تمثل اتجاهات المدينة الفينيقية القديمة التي اقيمت عليها مدينة رومانية في طرابلس.",
    ] },
  { "title" = "أفلام", "paragraphs" = [
      "فيلم جلادييتور \"gladiator\"بطوله راسل كرو\"russell crowe\" وهو من أشهر الافلام التي أنتجت بهذا الصدد",
      "The Fall of the Roman Empire, سقوط الإمبراطورية الرومانية (1964)، بطولة اليك غينيس Alec Guinness",
      "'\"فيلم صمت الحملان. ساعد في انتشار مقولات ماركوس اوريليوس المقتبسة من كتابه ' تأملات:\" عن أي شيء، ولا يسال 'ما هو في ذاته؟ ما هي طبيعته؟ \"",
    ] },
]

[articles.ru]
text = "Марк Авре́лий Антони́н (лат. Marcus Aurelius Antoninus; при рождении — Марк А́нний Вер, лат."
title = "Марк Аврелий"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D1%80%D0%BA_%D0%90%D0%B2%D1%80%D0%B5%D0%BB%D0%B8%D0%B9"
intro = [
  "Марк Авре́лий Антони́н (лат. Marcus Aurelius Antoninus; при рождении — Марк А́нний Вер, лат. Marcus Annius Verus; 26 апреля 121, Рим — 17 марта 180, Виндобона) — римский император с 161 года из династии Антонинов, философ, представитель позднего стоицизма, последователь Эпиктета. Последний из пяти хороших императоров.",
]
sections = [
  { "title" = "Происхождение", "paragraphs" = [
      "Марк Аврелий принадлежал к сенаторской семье испанского происхождения. Его прадед по отцу Анний Вер (преномен неизвестен) переехал в Рим из Бетики, получил претуру при императоре Нероне, а при Веспасиане был включён в состав патрициата (73/74 год). Сын Вера, Марк Анний Вер, трижды занимал должность консула (в 97, 121 и 126 годах) и породнился с императорской фамилией. Его жена Рупилия Фаустина (бабушка Марка Аврелия) была единоутробной сестрой жены Адриана Вибии Сабины и приходилась внучатой племянницей Траяну. Дочь Вера и Рупилии, Галерия Фаустина, стала женой Тита Аврелия Фульва Бойония Аррия Антонина, более известного как Антонин Пий, — пасынка Адриана и наследника его власти.",
      "Отцом Марка Аврелия был ещё один Марк Анний Вер (сын Марка Анния-старшего и Рупилии Фаустины), а матерью — Домиция Луцилла, дочь консула 109 года Публия Кальвизия Тулла Рузона.",
    ] },
  { "title" = "Ранние годы", "paragraphs" = [
      "Марк Анний Вер (позднее после первого усыновления — Марк Анний Катилий Север, а после второго — Марк Элий Аврелий Вер Цезарь), вошедший в историю под именем Марка Аврелия, родился в Риме 26 апреля 121 года, в период, когда его дед по отцу был во второй раз консулом и одновременно префектом Рима. Семейство Анниев Веров находилось на вершине экономического и политического влияния, к которой пришло в годы правления династии Флавиев. Он был первоначально усыновлён третьим мужем матери императора Адриана Домиции Луциллы Паулины — Публием Катилием Севером (консулом 120 года) и стал именоваться Марком Аннием Катилием Севером.",
      "Марк Анний получил богатое образование, которым после смерти отца занимался под руководством деда Марка Анния Вера (бывшего консула). Он изучал латинскую и греческую литературу, римское право, ораторское искусство (которое ему преподавал Марк Корнелий Фронтон), философию и рисование. Юношу особенно привлекала философия, в рамках которой он отдавал предпочтение стоицизму и, несмотря на слабое здоровье, старался следовать всем суровым предписаниям стоической доктрины.",
      "Возвышение молодого Марка Анния началось ещё при жизни императора Адриана: когда умер предполагаемый наследник Адриана Луций Элий, тот усыновил нового наследника Тита Аврелия Антония (в будущем императора Антонина Пия), но поставил условием, что тот в свою очередь усыновит двух юношей — Луция Вера (сына Луция Элия) и Марка Анния Вера (чья тётка к этому времени была женой самого Тита Аврелия). После усыновления Марк Анний получил имя Марк Элий Аврелий Вер. Несмотря на юный возраст, он был намечен в квесторы, в 139 году вступил в должность и начал заниматься административной деятельностью. На всём протяжении правления Антонина Пия играл активную роль в управлении страной. В 140 и 145 годах занимал пост консула, а в 146 (или 147) году получил полномочия империя и плебейского трибуна. С этого момента Марк Аврелий был фактическим соправителем Пия Антонина и участвовал в принятии императором ключевых для страны решений (второй приёмный сын императора был почти на десять лет младше и соответствующие полномочия получил позже).",
    ] },
  { "title" = "Правление", "paragraphs" = [
      "Будучи вынужден значительную часть правления провести в военных лагерях (см. Военные действия), в вопросах гражданского правления Марк Аврелий преимущественно полагался на позицию Сената. Марк Аврелий многому научился у своего приёмного отца Антонина Пия. Подобно ему, Марк Аврелий всячески подчёркивал своё уважение к Сенату как учреждению и к сенаторам как членам этого учреждения.",
      "Большое внимание император уделял судопроизводству. В его правление был достигнут значительный прогресс в устранении противоречий и излишних жестокостей в области гражданского права, в особенности в тех его сферах, которые касались участи наиболее бесправных представителей общества — рабов, детей, вдов. Изменения коснулись также законов о наследовании, где больший вес стал уделяться претензиям на кровное родство. В большинстве случаев изменения в законодательстве не были радикальными и скорее носили характер постепенных улучшений в правовой сфере, которые были начаты ещё при предшественниках Марка Аврелия. Сам он, не будучи выдающимся законодателем, в то же время активно следил за справедливым исполнением законов. В то же время при Марке Аврелии продолжилась начатая в правление Пия Антонина реакционная тенденция в развитии уголовного законодательства: укоренялось классовое разделение субъектов права на honestiores и humiliores и закреплялись в законах более суровые и позорные наказания для последних.",
      "В правление Марка Аврелия положение христиан в империи оставалось таким же, как при двух его предшественниках: христианская вера формально представляла собой наказуемое преступление, но исполнение этого закона не было ревностным. Тем не менее христиане периодически становились жертвами общественного мнения, обвинявшего их в разнообразных социальных и экономических бедствиях, и администраторы на местах приводили в действие существующие суровые законы. Согласно Дж. Э. Круку, именно таковы, вероятнее всего, были обстоятельства жестоких гонений на христиан в Лугдуне в 177 году. Возможно, что хотя «император-философ» сам не инициировал новых преследований христиан, де-факто они были сильнее, чем при его предшественниках.",
    ] },
  { "title" = "Философия", "paragraphs" = [
      "Марк Аврелий оставил философские записи — 12 написанных на греческом языке «книг» (глав книги), которым обычно приписывают общее название «К самому себе». Среди учителей философии Марка Аврелия были стоики: Юний Рустик, Аполлоний Халкедонский, Максим Клавдий.",
      "Будучи представителем позднего стоицизма, Марк Аврелий наибольшее внимание в своей философии уделяет этике, а остальные разделы философии служат целям пропедевтическим.",
      "Предшествующая традиция стоицизма различала в человеке тело и душу, представляющую собой пневму. Марк Аврелий усматривает в человеке три начала, добавляя к душе (или пневме) и телу (или плоти) ещё интеллект (или разум, или нус). Если прежние стоики считали душу-пневму главенствующим началом, то Марк Аврелий называет ведущим началом разум. Разум-нус представляет неиссякаемый источник импульсов, необходимых для достойной человека жизни. Нужно привести свой разум в согласие с природой целого и достигнуть благодаря этому бесстрастия. В согласии со всеобщим разумом заключено счастье.",
    ] },
]

[articles.vi]
text = "Marcus Aurelius Antoninus Augustus (ngày 26 tháng 4 năm 121 – 17 tháng 3 năm 180) là một Hoàng đế La Mã, trị vì từ năm 161 đến khi ông mất vào năm 180. Ông từng là quan chấp chính của Đế quốc La Mã vào năm 140."
title = "Marcus Aurelius"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Marcus_Aurelius"
intro = [
  "Marcus Aurelius Antoninus Augustus (ngày 26 tháng 4 năm 121 – 17 tháng 3 năm 180) là một Hoàng đế La Mã, trị vì từ năm 161 đến khi ông mất vào năm 180. Ông từng là quan chấp chính của Đế quốc La Mã vào năm 140. Từ thuở thiếu thời ông đã được học kỹ về triết học, và sau này, ông được vị minh quân Antoninus Pius chọn làm con nuôi để thừa kế ngai vàng. Sau khi Antoninus Pius qua đời, ông là đồng Hoàng đế cùng Lucius Verus trị vì từ năm 161 cho đến khi Hoàng đế Lucius mất năm 169. Về cuối đời, ông đồng trị vì với Hoàng đế Commodus – con trai của ông, cho đến khi ông tạ thế. Ông là vị Hoàng đế thứ 16 của Đế quốc La Mã (nếu tính luôn cả bốn ông vua trị vì ngắn ngủi trong Năm Tứ đế), là vị Hoàng đế cuối cùng trong thời đại Ngũ hiền đế, và cũng được xem là một trong những nhà hiền triết kiệt xuất của chủ nghĩa khắc kỷ.",
  "Là một chiến binh, ông đã xây dựng Đế quốc La Mã cường thịnh. Dưới triều đại lâu dài của vua Marcus Aurelius, Quân đội La Mã phải vào sinh ra tử chinh chiến chống Đế quốc Parthia đang phục hưng, và chống nhau với các bộ lạc man tộc German dọc theo biến giới phía Bắc Limes Germanicus – những người đã tiến vào xứ Gaule và vượt qua sông Danube. Những chiến binh tinh nhuệ của ông đã kéo rốc đến châu Á, đánh thắng quân Parthia và chiếm lĩnh được cả thành Ctesiphon là kinh đô của người Parthia. Trong khi đó, ở phương Bắc, nhà vua trở thành \"nhà chinh phạt của giặc rợ German\" nhờ thân chinh khởi binh đại phá tan tác man tộc German vào năm 172. Ở phía Đông Đế quốc, một viên thống soái của Quân đội La Mã là Avidus Cassius, dù đã lập nên nhiều chiến công cho ông, khởi binh làm loạn vào năm 175 giữa lúc nhà vua đang suýt nữa tiến đánh người German. Ông đã truyền lệnh cho tướng sĩ thẳng tay dập tắt cuộc phản loạn, và bản thân Avidus Cassius cũng bị tiêu diệt. Mặc dù sự bách hại Kitô hữu tại Đế quốc La Mã được cho là gia tăng trong thời đại của ông nhưng thái độ đích thực của ông đối với các Kitô hữu không được rõ.",
  "Là một vị Hoàng đế tài cao học rộng, ông đã ban hành nhiều cải cách. Tác phẩm Suy tưởng được Hoàng đế Marcus Aurelius thân hành ngự bút viết trong những năm tháng binh lửa từ năm 170 đến năm 180 (bằng tiếng Hy Lạp), được xem là một tác phẩm kinh điển của triết học Khắc kỷ, về trách nhiệm và sự phục vụ của chính quyền. Qua cuốn sách này, chúng ta biết rằng ông đã tiếp nhận tư tưởng của nhà văn hào Platon về một ông vua - hiền triết như thế nào Và chúng ta cũng biết được về cuộc sống nội tâm của bậc đại minh quân La Mã. Nhờ đó, ông trở thành một vị vua - hiền triết mẫu mực, dù rằng ông bách chiến bách thắng trong những cuộc binh đao. Marcus Aurelius là người cuối cùng trong Ngũ Hiền Đế, cũng là nhà cai trị cuối cùng của thời đại Pax Romana.",
]
sections = [
  { "title" = "Nguồn tài liệu", "paragraphs" = [
      "Những nguồn tài liệu chính về cuộc đời và triều đại của Hoàng đế Marcus Aurelius đều rời rạc và thường không đáng tin cậy. Tuyển tập tài liệu quan trọng nhất là những tiểu sử vua chúa La Mã cổ trong bộ sử Historia Augusta, được cho là viết bởi một nhóm tác giả vào đầu thế kỷ thứ IV, nhưng thực chất là được viết bởi một tác giả duy nhất (trong bài này gọi là \"nhà tiểu sử học viết về ông\") từ cuối thế kỷ thứ IV (khoảng 395). Bộ sử \"Historia Augusta\" bao gồm một loạt tiểu sử nói phét và hư cấu về các vị Hoàng đế cấp dưới và những tên vua cướp ngôi, nhưng những tiểu sử viết trước đó, chủ yếu là dựa theo những tư liệu cổ mà ngày nay đã mất (Marius Maximus và Ignotus), thì viết tốt hơn nhiều. Về cuộc đời và triều đại của Hoàng đế Marcus Aurelius, tiểu sử của các vị Hoàng đế Hadrianus, Antoninus Pius, Marcus Aurelius và Lucius Verus đều có uy tín cao, nhưng những tiểu sử của Aelius Verus và Avidius Cassius – một tên vua cướp ngôi cùng thời với Marcus Aurelius – đều là tự bịa đặt ra.",
      "Nhà giáo Fronto và một vài triều thần nhà Antoninus vẫn còn hiện hữu trong một loạt văn kiện rời rạc, kể về thời kỳ lịch sử từ khoảng năm 138 cho đến năm 166. Tác phẩm Suy tưởng do nhà vua thân hành ngự bút viết giúp cho chúng ta am hiểu về cuộc sống nội tâm của ông, nhưng không làm cho chúng ta hiểu được năm tháng của các sự kiện, và chỉ có một vài ghi chú đặc biệt về tình hình thế giới khi ông trị vì La Mã. Một tài liệu viết chi tiết chủ yếu về thời đại đó là của Cassius Dio, một Thượng Nghị sĩ người Hy Lạp ở thành Nicaea xứ Bithynia, đã viết lịch sử La Mã kể từ thời lập quốc cho đến năm 229 trong 80 cuốn sách. Bộ sử của Dio thật cần thiết đối với lịch sử quân sự thời đó, nhưng ông có quan điểm chống đối mạnh mẽ đối với các cuộc chinh phạt của Đế quốc La Mã và hay có luận điểm hợp với cái chức Thượng Nghị sĩ của ông. Một số tư liệu văn chương khác cung cấp những chi tiết đặc biệt: gồm có các tác phẩm của thầy thuốc Galen viết về tập quán của các vua nhà Antoninus, những bài diễn văn của Aelius Aristides về bản chất của thời gian, và những thành phần trong các Bộ luật Digest và Codex Justinianus nói về luật lệ đất nước đời vua Marcus Aurelius. Các bi văn và đồng tiền cũng bổ sung cho những tư liệu văn chương. Ở thời hiện đại, nhà sử học Frank McLynn có viết nên tác phẩm \"Marcus Aurelius: A Life\" - một cuốn tiểu sử được đánh giá rất cao, đã kể về cuộc đời và sự nghiệp của vị đại minh quân. Một cuốn tiểu sử hiện đại khác có giá trị cao về vị đại anh quân La Mã cũng được nhà sử học Anthony Birley làm nên, đó là tác phẩm \"Marcus Aurelius: A Biography\".",
    ] },
  { "title" = "Thời niên thiếu và sự nghiệp", "paragraphs" = [
      "Dòng họ Annia của Marcus Aurelius Antoninus không được biết đến nhiều trong lịch sử. Chỉ có thành viên nổi tiếng của họ là Titus Annius Milo, một người đàn ông được biết đến với việc góp phần vào sự sụp đổ của chế độ cộng hòa thông qua việc sử dụng bạo lực chính trị. Gia đình của Marcus Aurelius Antoninus có nguồn gốc ở Ucubi, một thị trấn nhỏ phía đông nam của Córdoba thuộc Baetica Iberia. Gia đình đã trở nên nổi vật vào những năm đầu thế kỉ 1 CN, dù tự nhận là hậu duệ của Numa Pompilius – ông vua thứ hai của Vương quốc La Mã xưa. Theo Dio, nhà Annia là họ hàng của Hoàng đế Hadrianus. Ông cố nội của Marcus, Marcus Annius Verus (I) là một thượng nghị sĩ và (theo Historia Augusta) là cựu quan coi quốc khố. Trong các năm 73 - 74, ông nội của ông Marcus Annius Verus (II) trở thành một quý tộc. Con trai cả của Verus – cha của Marcus Aurelius – Marcus Annius Verus (III) kết hôn với Domitia Lucilla. Lucilla là con gái của một nhà quý tộc tên là P. Calvisius Tullus Ruso với Domitia Lucilla Lớn. Domitia Lucilla Lớn đã được thừa kế một gia sản đồ sộ (được mô tả rất dài trong các lá thư của Pliny) từ ông ngoại và bà nội cho người con nuôi. Lucilla Trẻ sẽ có được nhiều của cải của người mẹ, bao gồm một công trình bằng gạch lớn ở ngoại ô của kinh thành La Mã.",
      "Lucilla và Verus (III) có hai người con: một cậu con trai là Marcus Aurelius chào đời vào ngày 26 tháng 4 năm 121, và một cô con gái là Annia Cornificia Faustina có lẽ hạ sinh vào năm 122 hoặc là năm 123. Trong khi làm Pháp quan thì Verus (III) có lẽ qua đời vào năm 124, khi ấy Marcus Aurelius chỉ mới có ba tuổi. Tuy ông khó có thể am hiểu về cha mình vì Verus (III) đã ra đi thật quá sớm, trong tác phẩm Suy tưởng của mình Marcus Aurelius ngự bút rằng ông đã học hỏi được \"tính thanh đạm và mạnh mẽ\" từ những ký ức về người cha cũng như danh thơm mà Verus (III) có được sau khi qua đời. Lucilla không tái hôn. Lucilla, theo truyền thống của phần lớn quý tộc La Mã thời đó, có lẽ không bỏ nhiều thời gian ra để chăm sóc con trai. Marcus Aurelius được các \"bảo mẫu\" giáo dưỡng. Nhưng theo ghi chép của Marcus Aurelius, mẹ đã dạy cho ông đức tính \"sùng đạo, ăn mặc từ tốn\" và làm cách nào để tránh khỏi \"những lối sống sung túc\". Trong các lá thư của ông, Marcus Aurelius nhiều lần đề cập đến mẹ và thể hiện rằng ông rất yêu thương bà; ông ca ngợi người mẹ của mình, \"dù số phận đã khiến bà mất sớm, thế nhưng bà đã dành những tháng năm cuối cùng của mình với Trẫm\".",
      "Sau này cha của ông, Marcus Aurelius được ông nội của mình là Marcus Annius Verus (II) nhận làm con nuôi. Ngoài ra có một nhân vật khác là ông Lucius Catilius Severus cũng tham gia vào việc nuôi dạy Marcus Aurelius. Severus được miêu tả là \"ông cố ngoại\" của Marcus Aurelius; ông có lẽ là cha dượng của Lucilla Lớn. Tại căn nhà của cha mẹ ông trên ngọn đồi Caelian, ông được khôn lớn, và sau ông này ông sẽ còn gọi miền này là \"Caelian của Trẫm\" viết niềm yêu mến. Miền Caelian lúc ấy đã được nâng cấp, với ít công trình công cộng nhưng có nhiều tư dinh của tầng lớp qu1y tộc. Ông nội của Marcus Aurelius có một dinh thự gần Lateran, tại đây Marcus Aurelius sẽ sinh sống trong phần lớn thời thơ ấu của ông. Ông biết ơn người ông nội vì đã dạy dỗ cho ông \"nhân cách cao đẹp và tránh né thói xấu\". Ông chẳng mấy ưa thích cái cô tình nhân của ông nội mình, đã chung sống với ông nội mình sau khi bà nội của Marcus Aurelius là Rupilia Faustina qua đời. Marcus Aurelius vui mừng rằng ông đã không phải sống với cô tình nhân này lâu hơn nữa.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Marcus Aurelius là một trong những bậc minh quân thánh chúa trong lịch sử, là một trong những danh nhân lỗi lạc nhất trong thời kỳ cổ đại. Thật là khó tìm ra những người chỉ trích ông. Có tác giả còn gọi ông là \"Đức Phật của La Mã\". Với tác phẩm \"Suy tưởng\", ông thể hiện rõ tài năng của một nhà triết học. Nhà sử học Edward Gibbon đã tỏ lòng kính trọng vị Hoàng đế \"nghiêm khắc với chính mình, khoan dung cho lầm lỗi của người khác, công minh và hòa hợp với toàn thể nhân loại\" (1783). 80 năm sau khi Gibbon, Matthew Arnold được truyền cảm hứng qua việc đọc phiên bản Anh ngữ mới của Suy tưởng, đã cho rằng: \"Thật không thể nào không hiểu biết về Marcus Aurelius\". Lúc sinh thời, ông đã được tôn vinh là một vị vua - hiền triết, và sau khi ông mất ngoại hiệu này vẫn còn trường tồn vĩnh cửu theo thời gian; cả Cassius Dio và nhà tiểu sử học viết về ông đều gọi ông là \"nhà triết học\". Không những thế, các Ki-tô hữu như Thánh Justinus Người tử đạo, Athenagoras, Melito cũng đặt cho ông ngoại hiệu này luôn. Nhà tiểu sử học này còn đi xa đến mức ca ngợi Marcus Aurelius \"nhân đạo và am tường triết hoc\" hơn các tiên đế Pius và Hadrian, và đặt ông trái ngược hòa toàn với các vị Hoàng đế tàn bạo như Domitian và Nero. Nhà sử học Herodtian có viết:",
      "Đại văn hào người Anh là Shakespeare khen Marcus Aurelius là \"người La Mã cao quý hơn cả\". Theo lời bàn của Hoàng đế Pescennicus Niger (135–194), Marcus Aurelius cùng với Antoninus Pius và Traianus là ba vị Hoàng đế xuất sắc nhất của La Mã cổ đại. Người ta kể rằng Hoàng đế Diocletianus (244–311) đã tỏ lòng thành kính tiên đế Marcus Aurelius. Vào thế kỷ thứ XVI, nhà văn Tây Ban Nha Antonio de Guevara có viết cuốn tiểu thuyết giáo dục \"Reloj de Príncipes\" mà Marcus Aurelius là nhân vật nam chính (1529). Cuốn sách được dịch sang Anh ngữ vào năm 1531. Nhà chính trị và bình luận cánh tả cấp tiến Hoa Kỳ Pat Buchanan nổi tiếng là từng tố cáo Tổng thống George W. Bush \"không phải vua Marcus Aurelius\". Nhà sử học người Pháp Ernest Renan cho rằng trong lịch sử chỉ có hai ví dụ tiêu biểu hơn cả về việc một loạt các ông vua xuất sắc nối ngôi nhau: đó là một loại các triều đại anh quân Babur, Humayun và Akbar ở Ấn Độ, cùng với hai triều đại minh quân Antoninus Pius cùng Marcus Aurelius ở Đế quốc La Mã vô cùng rộng lớn. Theo Ernest Renan, Marcus Aurelius có những điểm giống với minh quân Akbar của Ấn Độ. Chính nền quân chủ truyền hiền từ thời vua Nerva đã mang lại cho La Mã một loạt các đại minh quân như Marcus Aurelius là một điển hành.",
      "Hoàng đế Julianus (332–363), khi viết về các đời Hoàng đế trong lịch sử La Mã cổ, đã hoàn toàn công nhận Marcus Aurelius là một bậc đại minh quân lần đầu tiên. Julianus cho rằng chỉ có mỗi Alexandros Đại Đế là ngang hàng với Marcus Aurelius trong chính sử từ xưa đến nay, và ca ngợi ông vì sự bền chí ngang với thần linh, vì sự am hiểu sâu sắc của ông về lúc nào nói, lúc nào im, và ông còn có tài truyền cảm triết lý đến mức \"đưa người khác trở thành chư thần\". \"Bộc trực và không có khuyết điểm nào\" (theo Julianus), Hoàng đế Marcus Aurelius không những trở thành một bậc đại anh quân đánh phục hơn hẳn các vị vua khác, nhưng còn hiền đức hơn họ hẳn. Vị đại minh quân Julianus đã tôn vinh Marcus Aurelius hơn hẳn mọi ông hoàng bà chúa khác, và kể rằng đôi mắt và nếp nhăn trên trán của ông bộc lộ rõ hiệu lực của những công trình nghiên cứu lâu dài mà ông đã lao đầu vào. Ông chỉ có ba vết nhơ là nuông chiều Hoàng hậu Faustina, Hoàng tử Commodus và đồng Hoàng đế Lucius Verus – nhưng điều đó thể hiện nhân tính của ông, và sự cưng chiều con cái của ông có thể được phân tích như một lỗi lầm nhân văn và thánh thiện, mà chính nhà thi hào Homer đã thừa nhận. Thật không hề khó hiểu tại sao Julianus lại ngưỡng mộ Marcus Aurelius đến như vậy. Giống như vị tiên đế nhiều thế hệ trước – Marcus Aurelius, Julianus cũng phải xông pha trên hai mặt trận, và cũng luôn phải đối phó với các man tộc ở phương Bắc. Nói chung, hai vị hiền đế này phải nói là vô cùng giống nhau. Trong khi các bậc cố nhân Julius Caesar, Augustus và Traianus là những vị anh hùng thượng võ thì Marcus Aurelius lại là một ông vua - hiền triết hiếu hòa.",
    ] },
  { "title" = "Thái độ đối với Kitô hữu", "paragraphs" = [
      "Trong hai thế kỷ đầu Công Nguyên, hầu như chỉ các quan chức La Mã địa phương là người ra lệnh bách hại các Kitô hữu. Vào thế kỷ thứ hai, các hoàng đế coi Kitô giáo là vấn đề địa phương cho cấp dưới xử lý. Số lượng và mức độ bách hại ở nhiều nơi trong đế quốc dường như tăng dưới thời trị vì của Marcus. Ở chừng mực nào mà các cuộc bách hại này do chính Marcus điều động, khuyến khích hay ý thức được thì lại không rõ ràng và các sử gia vẫn còn đang tranh luận về điều này. Nhà hộ giáo thời sơ khởi Justinô Tử đạo ghi lại trong cuốn Hộ giáo đầu tiên (khoảng từ 140 tới 150 CN) một bức thư của Marcus Aurelius gửi đến viện nguyên lão La Mã (trước khi ông lên ngôi hoàng đế) kể về một chiến địa mà tại đó Marcus tin rằng lời cầu nguyện của các Kitô hữu đã cứu đoàn quân của ông khỏi chết khát khi mà \"nước đổ xuống từ thiên đường\", và rồi \"chúng tôi tức khắc công nhận sự hiện diện của Thiên Chúa\". Tiếp tục bức thư, Marcus đề nghị viện nguyên lão dừng lại tiến trình bách hại Kitô hữu trước đó.",
    ] },
]

[articles.id]
text = "Markus Aurelius (26 April 121 – 17 Maret 180) adalah kaisar Romawi yang memerintah dari tahun 161 hingga kematiannya pada 180 M. Sebagai salah satu dari \"Lima Kaisar Baik\", masa pemerintahannya sering dianggap sebagai puncak kedamaian dan stabilitas Kekaisaran Romawi."
title = "Markus Aurelius"
lang = "id"
url = "https://id.wikipedia.org/wiki/Markus_Aurelius"
intro = [
  "Markus Aurelius (26 April 121 – 17 Maret 180) adalah kaisar Romawi yang memerintah dari tahun 161 hingga kematiannya pada 180 M. Sebagai salah satu dari \"Lima Kaisar Baik\", masa pemerintahannya sering dianggap sebagai puncak kedamaian dan stabilitas Kekaisaran Romawi. Markus juga terkenal sebagai seorang filsuf Stoik, dan karya tulisnya yang berjudul Meditationes (Renungan), menjadi salah satu teks utama dalam filsafat Stoisisme dan tetap berpengaruh hingga hari ini.",
]
sections = [
  { "title" = "Kehidupan Awal dan Latar Belakang", "paragraphs" = [
      "Markus Aurelius lahir dengan nama lengkap Marcus Annius Verus pada 26 April 121 di Roma, dalam sebuah keluarga bangsawan Romawi. Ayahnya, Annius Verus, berasal dari sebuah keluarga senatorial terkemuka, sementara ibunya, Domitia Lucilla, adalah keturunan dari keluarga kaya yang memiliki tanah luas. Markus menjadi yatim piatu pada usia dini, dan kakeknya dari pihak ibu, Marcus Annius Verus, mengambil alih sebagai wali dan pendidiknya.",
      "Sebagai seorang anak muda, Markus menunjukkan minat yang besar pada filsafat. Pada usia 12 tahun, ia mulai tertarik pada ajaran Stoisisme, sebuah aliran filsafat yang menekankan pengendalian diri, kebajikan, dan hidup sesuai dengan alam. Dia belajar dari berbagai filsuf dan orator terkemuka pada masanya, termasuk Apollonius dari Khalkis dan Junius Rusticus.",
    ] },
  { "title" = "Jalan Menuju Kekaisaran", "paragraphs" = [
      "Pada tahun 138, Kaisar Hadrianus, yang tidak memiliki anak kandung, mengadopsi Antoninus Pius sebagai pewarisnya. Sebagai syarat adopsi, Hadrianus meminta Antoninus untuk mengadopsi Markus Aurelius dan Lucius Verus sebagai putra-putranya. Dengan demikian, Markus Aurelius menjadi calon penerus takhta Romawi.",
      "Selama masa pemerintahan Antoninus Pius (138–161), Markus menerima pendidikan yang ketat dalam politik dan administrasi. Ia menjabat sebagai konsul pada beberapa kesempatan dan menunjukkan kompetensinya dalam memimpin urusan negara. Hubungan antara Markus dan Antoninus sangat erat, dan Markus sering disebut sebagai anak angkat yang penuh rasa hormat dan loyalitas.",
    ] },
  { "title" = "Pemerintahan Bersama Lucius Verus (161–169)", "paragraphs" = [
      "Setelah kematian Antoninus Pius pada tahun 161, Markus Aurelius naik takhta sebagai kaisar, tetapi dia berbagi kekuasaan dengan saudaranya, Lucius Verus. Ini merupakan pertama kalinya Kekaisaran Romawi dipimpin oleh dua kaisar bersamaan. Namun, meskipun berbagi gelar, Markus dianggap sebagai pemimpin utama.",
      "Pada masa pemerintahannya bersama Lucius Verus, Kekaisaran menghadapi beberapa tantangan besar, termasuk perang di Timur melawan Kekaisaran Parthia (161–166). Lucius memimpin pasukan Romawi dalam kampanye ini, sementara Markus mengawasi administrasi di Roma. Perang berakhir dengan kemenangan Romawi, tetapi membawa kembali wabah penyakit yang menyebar ke seluruh kekaisaran, yang dikenal sebagai Wabah Antoninus (165–180), menyebabkan kematian jutaan orang.",
    ] },
  { "title" = "Perang Markomani dan Krisis di Perbatasan (169–180)", "paragraphs" = [
      "Setelah kematian Lucius Verus pada tahun 169, Markus Aurelius memerintah sendiri. Salah satu tantangan terbesarnya selama periode ini adalah ancaman dari suku-suku barbar di perbatasan utara Kekaisaran, terutama Markomani, Quadi, dan suku-suku Jermanik lainnya. Pada tahun 166, suku-suku ini mulai menyerang wilayah Romawi di sepanjang perbatasan Danube, memicu serangkaian konflik yang dikenal sebagai Perang Markomani.",
      "Markus menghabiskan banyak tahun terakhir hidupnya di medan perang, memimpin pasukan Romawi secara langsung untuk mempertahankan kekaisaran. Dia mendirikan markas di Carnuntum, di perbatasan Pannonia (sekarang Austria), dan meskipun menghadapi banyak kesulitan, dia berhasil mempertahankan wilayah Romawi. Konflik ini juga memberi kesempatan kepada Markus untuk menguji prinsip-prinsip Stoik yang dia anut, terutama ketahanan dan pengendalian diri dalam menghadapi kesulitan.",
    ] },
]

[articles.pt]
text = "Marco Aurélio (Roma, 26 de abril de 121 – Vindobona ou Sirmio, 17 de março de 180) foi o imperador romano de 161 até sua morte. Era filho de Domícia Lucila e do pretor Marco Ânio Vero, sobrinho do imperador Adriano."
title = "Marco Aurélio"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Marco_Aur%C3%A9lio"
intro = [
  "Marco Aurélio (Roma, 26 de abril de 121 – Vindobona ou Sirmio, 17 de março de 180) foi o imperador romano de 161 até sua morte. Era filho de Domícia Lucila e do pretor Marco Ânio Vero, sobrinho do imperador Adriano. Seu pai morreu quando tinha três anos e ele foi criado por sua mãe e avô. Adriano adotou Antonino Pio, tio de Marco Aurélio, como novo herdeiro em 138. Antonino, por sua vez, adotou Marco Aurélio e Lúcio Vero, filho de Lucio Élio. Adriano morreu no mesmo ano e Antonino tornou-se o imperador. Marco Aurélio, agora como herdeiro do trono, estudou grego e latim com tutores como Herodes Ático e Marco Cornélio Frontão. Ele se casou com Faustina, a Jovem, a única filha de Antonino Pio, em 145, com quem teve pelo menos catorze filhos.",
  "Antonino Pio morreu em 161 e Marco Aurélio ascendeu ao trono junto com Lúcio Vero, a primeira vez que o Império Romano foi governado por dois imperadores. Durante seu reinado, Roma participou de vários conflitos militares. No leste, houve uma campanha bem-sucedida contra a Pártia e Armênia, enquanto Marco Aurélio derrotou os marcomanos, quados e sármatas jáziges nas Guerras Marcomanas. Economicamente, ele modificou a pureza do denário, a moeda romana. A perseguição dos cristãos aparentemente aumentou durante seu reinado, porém seu envolvimento é improvável. A peste antonina estourou em 165 ou 166, devastando população do império e causando a morte de cinco a dez milhões de pessoas, incluindo possivelmente Lúcio Vero em 169.",
  "Diferentemente de seus predecessores, Marco Aurélio escolheu não adotar um herdeiro. Seus filhos incluíram Lucila, que se casou com Lúcio Vero, e Cômodo, que governou junto com seu pai a partir de 176 e o sucedeu como único imperador após sua morte. Monumentos em sua homenagem, como uma coluna e uma estátua equestre, foram erguidos em celebração a suas vitórias e sobrevivem até hoje. Marco Aurélio também dedicou boa parte de seu tempo para estudos filosóficos, tornando-se um dos maiores aderentes do estoicismo. Sua obra Meditações é uma das melhores fontes para a compreensão da antiga filosofia estoica. Estes escritos já foram muito elogiados por figuras proeminentes pelos séculos após sua morte.",
]
sections = [
  { "title" = "Fontes", "paragraphs" = [
      "As principais fontes sobre a vida de Marco Aurélio são fragmentadas e frequentemente não confiáveis. As mais importante são as biografias da História Augusta, supostamente escrita por um grupo de autores na virada do século VI, porém acredita-se na verdade que é a obra de um único autor por volta de 395. As biografias posteriores e as de imperadores subordinados e usurpadores não são confiáveis, mas as mais antigas, derivadas principalmente de fontes antigas hoje perdidas, são mais precisas. Para a vida de Marco Aurélio, sua biografia e aquelas de Adriano, Antonino Pio e Lúcio Vero são em sua maior parte confiáveis, porém aquelas de Lúcio Élio e Avídio Cássio não são.",
      "Correspondências entre Marco Cornélio Frontão, tutor de Marco Aurélio, com vários oficiais de Antonino Pio sobreviveram como uma série de manuscritos fragmentados, cobrindo o período de aproximadamente 138 até 166. O próprio Meditações de Marco Aurélio oferece uma visão de sua vida interior, mas não possui datas em sua maior parte e faz poucas referências a eventos externos. A principal fonte para o período é Cássio Dião, um senador grego da Bitínia que escreveu uma história de Roma desde sua fundação até 229 em oitenta livros. Dião é vital para a história militar do período, porém seus preconceitos senatoriais e grande oposição à expansão imperial atrapalham sua perspectiva. Outras fontes literárias proporcionam detalhes específicos: os escritos do médico Cláudio Galeno sobre os hábitos da elite antonina, os discursos de Élio Aristides sobre humor da época e as constituições preservadas no Digesta e no Códice de Justiniano sobre as obras jurídicas de Marco Aurélio. Inscrições e moedas suplementam as fontes literárias.",
    ] },
  { "title" = "Início de vida", "paragraphs" = [
      "Marco nasceu em Roma em 26 de abril de 121. Seu nome de nascimento algumas vezes é dito como tendo sido Marco Ânio Vero, porém fontes dizem que ele recebeu esse nome após a morte de seu pai e adoção não-oficial por seu avô, quando chegou na maioridade. É possível que tenha sido conhecido como Marco Ânio Catílio Severo ao nascer ou durante sua juventude, ou mesmo Marco Catílio Severo Ânio Vero. Passou a se chamar Marco Élio Aurélio Vero César ao ser adotado por Antonio Pio como herdeiro do trono e, depois de sua ascensão, foi conhecido como Marco Aurélio Antonino Augusto até morrer. Epifânio de Salamina o chamou de Marco Aurélio Vero.",
      "A família paterna de Marco Aurélio era de origem romana ítalo-hispânica. Seu pai foi o pretor Marco Ânio Vero. A gens Ânia era de origem italiana, e um ramo dela mudou-se para Úcubos, uma pequena cidade ao sudeste de Córdova, na Bética. Este ramo dos Aurélios com base na Espanha romana, os Ânios Veros, ganhou destaque em Roma no final do século I. O bisavô de Marco, Marco Ânio Vero, era um senador e, de acordo com a História Augusta, pretor. Seu avô, Marco Ânio Vero, foi prefeito de Roma, cônsul três vezes e tornou-se patrício em 73-74. Por meio de sua avó Rupília — sobrinha-neta do imperador Trajano e meia-irmã das imperatrizes Víbia Sabina e Matídia Menor — Marco era um membro da dinastia Nerva-Antonina.",
      "Sua mãe, Domícia Lucila, era filha do patrício romano Cneu Domício Tulo e herdou uma grande fortuna de seus pais e avós. Sua herança incluía grandes olarias nos arredores de Roma - um empreendimento lucrativo em uma época em que a cidade estava passando por uma onda de construção - e uma villa na colina do Célio em Roma.",
    ] },
  { "title" = "Vida adulta", "paragraphs" = [
      "Imediatamente após a morte de Adriano, Antonino se aproximou de Marco e solicitou que seus arranjos de casamento fossem alterados: o noivado de Marco com Ceiônia Fábia seria anulado, e ele se tornaria noivo de Faustina, filha de Antonino. O noivado de Faustina com o irmão de Ceiônia, Lúcio Cômodo, também teria de ser anulado. Marco consentiu com a proposta e foi nomeado César em 139, e cônsul em 140, junto com Antonino. Como herdeiro aparente, Marco tornou-se chefe da ordem equestre e assumiu o nome Marco Élio Aurélio Vero César. A pedido do Senado, foi admitido em todos os colégios sacerdotais. Antonino exigiu que Marco residisse no palácio imperial no Palatino, e assumisse os hábitos de sua nova condição, a \"pompa da corte\", contra o desejo de Marco, que lutaria para reconciliar a vida de cortesão com seus anseios filosóficos.",
      "Como questor, Marco teria pouco trabalho administrativo real para fazer. Leria cartas imperiais ao Senado quando Antonino estivesse ausente e faria trabalho de secretariado para os senadores, além de fazer discursos treinando sua oratória. Em 1º de janeiro de 145 foi nomeado cônsul pela segunda vez. Em abril de 145 casou-se com Faustina. Foram emitidas moedas com as efígies do casal. Em 146 recebeu poder tribunício e o imperium proconsular, tornando-se na prática co-imperador com Antonino e participando das decisões e atos do governo.",
      "Nesta época continuou seus estudos sob a orientação de Anino Macer, Canínio Celer, Herodes Ático e especialmente com o retórico, gramático e advogado Marco Cornélio Frontão, de quem tornou-se amigo íntimo, apesar das reservas que o professor mantinha contra a filosofia. O filósofo estoico Júnio Rústico também exerceu muita influência sobre ele.",
    ] },
  { "title" = "Reinado", "paragraphs" = [
      "Imediatamente após a confirmação do Senado, os dois imperadores seguiram para o acampamento da guarda pretoriana. Lúcio se dirigiu às tropas reunidas, que os aclamaram como imperadores. Então, como todo novo imperador desde Cláudio, Lúcio prometeu às tropas uma doação especial. Esta doação foi o dobro do costume: 20 000 sestércios per capita, e mais para os oficiais. Em troca dessa recompensa, equivalente a vários anos de pagamento, as tropas juraram proteger os imperadores. A cerimônia talvez não fosse necessária, visto que a ascensão de Marco fora pacífica e sem oposição, mas era uma boa segurança contra futuros problemas militares. Marco e Lúcio se tornaram estimados junto ao povo de Roma, que aprovava fortemente seu comportamento civil sem pompas. Os imperadores permitiram a liberdade de expressão, evidenciada pelo fato de o escritor de comédias Marulo ter sido capaz de criticá-los sem sofrer represálias. No outono de 161 ou na primavera de 162 o rio Tibre transbordou, inundando grande parte de Roma, afogando muitos animais e deixando a cidade com fome. Marco e Lúcio deram à crise uma atenção pessoal.",
      "Inicialmente, seu governo continuou a perseguição aos cristãos e ao cristianismo, intensificando-a em um segundo momento. Nos últimos anos, em que pese a não revogação formal das leis persecutórias, houve a abertura de liberdade de facto aos cristãos e à Igreja Católica no espaço público. Esta política foi mantida e expandida por Cômodo, que se afastou de disputas religiosas.",
      "Os primeiros problemas de seu reinado surgiram com os partas na fronteira oriental. Em 161, o xainxá Vologases IV (r. 147–191) invadiu o Reino da Armênia, que era um Estado cliente de Roma, e instalou no trono Aurélio Pácoro. Convencido pelo profeta Alexandre de Abonútico de que poderia derrotar os partas facilmente e ganhar a glória para si mesmo, Marco Sedácio Severiano, legado da Capadócia, liderou uma legião para a Armênia, mas seu exército era pequeno e Severiano foi preso pelo general parta Cosroes em Elegeia, uma cidade logo além das fronteiras da Capadócia. Severiano fez alguns esforços infrutíferos para enfrentar Cosroes, mas acabou cometendo suicídio e sua legião foi massacrada. A campanha durou apenas três dias. No ano seguinte Atídio Corneliano, governador da Síria, também foi derrotado.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Marco Aurélio foi o último dos \"cinco bons imperadores\", adquiriu a reputação de rei-filósofo ainda em vida, e o título permaneceria após seu desaparecimento. Cristãos como Justino Mártir, Atenágoras de Atenas e Eusébio também lhe deram o título. Para os historiadores antigos, notadamente Dião Cássio e Herodiano, o reinado de Marco Aurélio teria sido o último momento de uma Roma feliz, cuja harmonia foi quebrada com a subida de Cômodo ao poder.",
      "Segundo Joshua Mark, \"foi aclamado como 'o mais nobre de todos os homens que, por pura inteligência e força de caráter, valorizaram e alcançaram o bem pelo bem em si e não por qualquer recompensa' (Grant, 139). Seu reinado foi caracterizado pela devoção ao seu povo e isso, bem como seu trabalho filosófico duradouro, Meditações, atesta a verdade do louvor de Grant. O acadêmico Michael Grant, entretanto, dificilmente é o primeiro a expressar tais sentimentos. Aurélio foi altamente respeitado em sua vida e é referido como 'o filósofo' por fontes antigas posteriores, como Dião Cássio e o autor (ou autores) da História Augusta\".",
      "Essa visão altamente positiva se tornou quase uma unanimidade historiográfica que persiste até na atualidade. Contudo, em tempos recentes diversos estudos vêm questionando esse consenso sobre o governante imaculadamente virtuoso e bem-sucedido, apresentando-o mais realisticamente como um personagem nuançado e humano, sujeito a contradições e fraquezas. Em primeiro lugar, a imagem de perfeição que se formou em seu redor, estabelecida na Antiguidade e muito repetida posteriormente, deve ser entendida como uma idealização, e sua transmissão da Antiguidade para os tempos modernos se deve em grande parte ao trabalho do historiador Edward Gibbon. Para Mariana Cerri, Gibbon fez uma leitura acrítica das fontes antigas, e \"as boas relações que Marco Aurélio manteve com o Senado lhe garantiram boa reputação histórico-biográfica, o que não têm continuação no sucessor Cômodo que é, na opinião do Senado, pior do que Nero ou Domiciano. Dessa maneira, Gibbon percebe o período dos Antoninos, até o governo de Cômodo, como 'o período da história do mundo durante o qual a condição da raça humana foi mais ditosa e mais próspera'. Em contrapartida, com Cômodo, passando pelos Severos, inicia-se o 'declínio e queda' do Império\". Para Igor Cardoso, a influência da narrativa de Gibbon está presente na obra de importantes historiadores contemporâneos que se dedicaram a Marco Aurélio, como Anthony Birley e Pierre Hadot, dentre outros, \"ao apresentarem o imperador Marco Aurélio como bom governante em razão da aplicação de algumas teorias estoicas em sua administração\". Segundo Deivid Valerio Gaia, \"os elogios à dinastia Antonina são quase um topos na historiografia e na literatura tanto antigas quanto contemporâneas. Não obstante, hoje, o acesso a uma documentação mais variada e a formação de…",
    ] },
]

