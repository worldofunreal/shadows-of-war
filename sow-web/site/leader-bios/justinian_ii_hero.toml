[articles.en]
text = "Justinian II, son of Emperor Constantine IV, ruled the Byzantine Empire from 685 to 695 and again from 705 to 711. He came to the throne as a teenager and pursued military campaigns and imperial reforms, but heavy taxation and political conflict weakened his support. In 695, a revolt led by the general Leontius removed him from power. Justinian was captured, had his nose cut off, and was exiled to Cherson in Crimea."
title = "Justinian II"
lang = "en"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Justinian II, son of Emperor Constantine IV, ruled the Byzantine Empire from 685 to 695 and again from 705 to 711. He came to the throne as a teenager and pursued military campaigns and imperial reforms, but heavy taxation and political conflict weakened his support. In 695, a revolt led by the general Leontius removed him from power. Justinian was captured, had his nose cut off, and was exiled to Cherson in Crimea.",
  "The mutilation was meant to make a return to the throne seem impossible. Justinian survived, built alliances in exile, and eventually gained help from the Bulgar ruler Tervel. In 705 he returned to Constantinople with Bulgar support. Byzantine chronicles relate that, after the city’s defenses blocked a direct assault, Justinian and a small group entered through an aqueduct and helped seize the capital. This episode gives his ability its name, “The Aqueduct Return.”",
  "Justinian regained the throne and ruled for six more years, until another revolt overthrew and killed him in 711. Rhinotmetos means “cut-nosed” and refers to his mutilation. Written accounts support the loss of his nose, but surviving imperial coins do not show it. A later story that he wore a golden prosthesis is not considered reliable evidence, so the details of his appearance remain uncertain.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.es]
text = "Justiniano II, hijo del emperador Constantino IV, gobernó el Imperio bizantino de 685 a 695 y nuevamente de 705 a 711. Llegó al trono siendo adolescente y promovió campañas militares y reformas, pero los impuestos elevados y los conflictos políticos debilitaron su apoyo. En 695, una rebelión encabezada por el general Leoncio lo depuso. Fue capturado, le cortaron la nariz y lo enviaron al exilio en Quersoneso, en Crimea."
title = "Justiniano II"
lang = "es"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Justiniano II, hijo del emperador Constantino IV, gobernó el Imperio bizantino de 685 a 695 y nuevamente de 705 a 711. Llegó al trono siendo adolescente y promovió campañas militares y reformas, pero los impuestos elevados y los conflictos políticos debilitaron su apoyo. En 695, una rebelión encabezada por el general Leoncio lo depuso. Fue capturado, le cortaron la nariz y lo enviaron al exilio en Quersoneso, en Crimea.",
  "La mutilación pretendía hacer imposible su regreso al poder. Justiniano sobrevivió, reunió aliados durante el exilio y obtuvo el apoyo del gobernante búlgaro Tervel. En 705 volvió a Constantinopla con ayuda búlgara. Las crónicas bizantinas cuentan que, después de que las defensas impidieran un asalto directo, Justiniano y un pequeño grupo entraron por un acueducto y ayudaron a tomar la capital. De ese episodio toma su nombre la habilidad «Regreso por el acueducto».",
  "Justiniano recuperó el trono y gobernó seis años más, hasta que otra rebelión lo derrocó y mató en 711. Rhinotmetos significa «de nariz cortada». Los relatos escritos respaldan que perdió la nariz, pero las monedas imperiales conservadas no la muestran. Una historia posterior afirma que llevó una prótesis de oro, aunque no se considera una prueba fiable. Por ello, los detalles de su aspecto siguen siendo inciertos.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.fr]
text = "Justinien II, fils de l’empereur Constantin IV, régna sur l’Empire byzantin de 685 à 695, puis de 705 à 711. Il monta sur le trône adolescent et mena des campagnes militaires et des réformes impériales. La forte fiscalité et ses conflits politiques affaiblirent toutefois son soutien. En 695, une révolte conduite par le général Léonce le renversa. Capturé, il eut le nez coupé et fut exilé à Cherson, en Crimée."
title = "Justinien II"
lang = "fr"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Justinien II, fils de l’empereur Constantin IV, régna sur l’Empire byzantin de 685 à 695, puis de 705 à 711. Il monta sur le trône adolescent et mena des campagnes militaires et des réformes impériales. La forte fiscalité et ses conflits politiques affaiblirent toutefois son soutien. En 695, une révolte conduite par le général Léonce le renversa. Capturé, il eut le nez coupé et fut exilé à Cherson, en Crimée.",
  "Cette mutilation devait rendre tout retour au pouvoir impensable. Justinien survécut, noua des alliances pendant son exil et obtint l’appui du souverain bulgare Tervel. En 705, il revint à Constantinople avec le soutien des Bulgares. Les chroniques byzantines racontent que, les défenses empêchant un assaut direct, Justinien et quelques compagnons entrèrent par un aqueduc et contribuèrent à prendre la capitale. Cet épisode inspire le nom de sa capacité, « Retour par l’aqueduc ».",
  "Justinien retrouva le trône et régna six années supplémentaires, jusqu’à ce qu’une nouvelle révolte le renverse et le fasse tuer en 711. Rhinotmète signifie « au nez coupé ». Les récits écrits attestent la perte de son nez, mais les monnaies impériales conservées ne la représentent pas. Une histoire tardive lui attribue un nez artificiel en or sans constituer une preuve fiable. Son apparence exacte demeure incertaine.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.de]
text = "Justinian II., Sohn von Kaiser Konstantin IV., regierte das Byzantinische Reich von 685 bis 695 und erneut von 705 bis 711. Er bestieg den Thron als Jugendlicher und führte Feldzüge sowie Reformen durch. Hohe Steuern und politische Konflikte schwächten jedoch seine Unterstützung. 695 stürzte ihn ein Aufstand unter Führung des Generals Leontios. Justinian wurde gefangen genommen, ihm wurde die Nase abgeschnitten, und er wurde nach Cherson auf der Krim verbannt."
title = "Justinian II."
lang = "de"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Justinian II., Sohn von Kaiser Konstantin IV., regierte das Byzantinische Reich von 685 bis 695 und erneut von 705 bis 711. Er bestieg den Thron als Jugendlicher und führte Feldzüge sowie Reformen durch. Hohe Steuern und politische Konflikte schwächten jedoch seine Unterstützung. 695 stürzte ihn ein Aufstand unter Führung des Generals Leontios. Justinian wurde gefangen genommen, ihm wurde die Nase abgeschnitten, und er wurde nach Cherson auf der Krim verbannt.",
  "Die Verstümmelung sollte eine Rückkehr auf den Thron unmöglich erscheinen lassen. Justinian überlebte, gewann während seines Exils Verbündete und erhielt Hilfe vom bulgarischen Herrscher Tervel. 705 kehrte er mit bulgarischer Unterstützung nach Konstantinopel zurück. Byzantinische Chroniken berichten, dass Justinian und einige Gefährten durch einen Aquädukt in die Stadt gelangten, nachdem die Verteidigung einen direkten Angriff abgewehrt hatte. Diese Episode gab seiner Fähigkeit den Namen „Rückkehr durch den Aquädukt“.",
  "Justinian gewann den Thron zurück und herrschte weitere sechs Jahre, bis ihn 711 ein neuer Aufstand stürzte und töten ließ. Rhinotmetos bedeutet „mit abgeschnittener Nase“. Schriftliche Berichte belegen den Verlust der Nase, doch erhaltene Kaisermünzen zeigen ihn nicht. Eine spätere Erzählung über eine goldene Nasenprothese gilt nicht als verlässlicher Nachweis. Sein genaues Aussehen bleibt ungewiss.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.it]
text = "Giustiniano II, figlio dell’imperatore Costantino IV, governò l’Impero bizantino dal 685 al 695 e di nuovo dal 705 al 711. Salì al trono da adolescente e promosse campagne militari e riforme, ma le imposte elevate e i conflitti politici indebolirono il suo sostegno. Nel 695 una rivolta guidata dal generale Leonzio lo depose. Fu catturato, gli venne tagliato il naso e fu esiliato a Cherson, in Crimea."
title = "Giustiniano II"
lang = "it"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Giustiniano II, figlio dell’imperatore Costantino IV, governò l’Impero bizantino dal 685 al 695 e di nuovo dal 705 al 711. Salì al trono da adolescente e promosse campagne militari e riforme, ma le imposte elevate e i conflitti politici indebolirono il suo sostegno. Nel 695 una rivolta guidata dal generale Leonzio lo depose. Fu catturato, gli venne tagliato il naso e fu esiliato a Cherson, in Crimea.",
  "La mutilazione doveva rendere impensabile un suo ritorno al potere. Giustiniano sopravvisse, costruì alleanze durante l’esilio e ottenne l’aiuto del sovrano bulgaro Tervel. Nel 705 tornò a Costantinopoli con il sostegno dei Bulgari. Le cronache bizantine raccontano che, dopo che le difese ebbero fermato un attacco frontale, Giustiniano e pochi compagni entrarono attraverso un acquedotto e contribuirono a conquistare la capitale. Da questo episodio deriva il nome dell’abilità, «Ritorno attraverso l’acquedotto».",
  "Giustiniano riprese il trono e governò per altri sei anni, finché una nuova rivolta lo depose e lo uccise nel 711. Rhinotmetos significa «dal naso tagliato». Le fonti scritte sostengono che perse il naso, ma le monete imperiali conservate non lo mostrano. Un racconto successivo dice che portasse una protesi d’oro, ma non è considerato una prova attendibile. I dettagli del suo aspetto restano incerti.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.tr]
text = "İmparator IV. Konstantinos’un oğlu II. Justinianus, Bizans İmparatorluğu’nu 685–695 ve yeniden 705–711 yılları arasında yönetti. Tahta genç yaşta çıktı; askerî seferler ve reformlar yürüttü, ancak ağır vergiler ve siyasi çatışmalar desteğini azalttı. 695’te general Leontios’un önderliğindeki bir isyan onu tahttan indirdi. Justinianus yakalandı, burnu kesildi ve Kırım’daki Herson’a sürgün edildi."
title = "II. Justinianus"
lang = "tr"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "İmparator IV. Konstantinos’un oğlu II. Justinianus, Bizans İmparatorluğu’nu 685–695 ve yeniden 705–711 yılları arasında yönetti. Tahta genç yaşta çıktı; askerî seferler ve reformlar yürüttü, ancak ağır vergiler ve siyasi çatışmalar desteğini azalttı. 695’te general Leontios’un önderliğindeki bir isyan onu tahttan indirdi. Justinianus yakalandı, burnu kesildi ve Kırım’daki Herson’a sürgün edildi.",
  "Bu sakatlama onun yeniden tahta çıkmasını imkânsız göstermek amacı taşıyordu. Justinianus hayatta kaldı, sürgünde müttefikler edindi ve Bulgar hükümdarı Tervel’in desteğini aldı. 705’te Bulgarların yardımıyla Konstantinopolis’e döndü. Bizans kronikleri, surlar doğrudan saldırıyı engelledikten sonra Justinianus’un birkaç yoldaşıyla bir su kemerinden şehre girerek başkentin ele geçirilmesine yardım ettiğini aktarır. Yeteneğin “Su kemerinden dönüş” adı bu anlatıdan gelir.",
  "Justinianus tahtını geri aldı ve 711’de yeni bir isyanla devrilip öldürülene kadar altı yıl daha hüküm sürdü. Rhinotmetos lakabı “burnu kesilmiş” anlamına gelir. Yazılı kaynaklar burnunun kesildiğini destekler, ancak günümüze ulaşan imparatorluk sikkeleri bunu göstermez. Daha geç bir anlatıda altın bir burun taktığı söylenir; bu bilgi güvenilir kanıt kabul edilmez. Görünüşünün ayrıntıları belirsizdir.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.zh]
text = "查士丁尼二世是皇帝君士坦丁四世之子，曾于685至695年以及705至711年两度统治拜占庭帝国。他在少年时期即位，发动军事行动并推动改革，但沉重税负和政治冲突逐渐削弱了他的支持。695年，将军利昂提奥斯发动叛乱并夺取皇位。查士丁尼被捕，鼻子遭到割除，随后被流放到克里米亚的赫尔松。"
title = "查士丁尼二世"
lang = "zh"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "查士丁尼二世是皇帝君士坦丁四世之子，曾于685至695年以及705至711年两度统治拜占庭帝国。他在少年时期即位，发动军事行动并推动改革，但沉重税负和政治冲突逐渐削弱了他的支持。695年，将军利昂提奥斯发动叛乱并夺取皇位。查士丁尼被捕，鼻子遭到割除，随后被流放到克里米亚的赫尔松。",
  "割鼻旨在让他无法再登上皇位。查士丁尼在流放中幸存，并逐步建立联盟，最终得到保加利亚统治者特尔韦尔的援助。705年，他在保加利亚军队支持下返回君士坦丁堡。拜占庭编年史记载，城防使正面进攻受阻后，查士丁尼与少数随从经由一条引水道进入城内，协助夺回首都。游戏能力“引水道归来”取材于这段传统记载。",
  "查士丁尼复位后又统治六年，直到711年再次遭到叛乱并被杀。他的绰号Rhinotmetos意为“割鼻者”。书面记载支持他曾被割鼻，但保存下来的皇帝钱币并未表现这一特征。较晚的故事称他佩戴金鼻假体，却没有可靠证据支持，因此他的真实外貌仍不确定。",
  "他的经历体现了拜占庭皇位斗争中流放、身体刑罚和军事结盟交织的一面。他在两次统治之间经历长期放逐，重返首都依赖外部盟军和城内支持者。705年的复位没有带来稳定，帝国内部的权力斗争持续到他第二次被推翻。能力名称突出这段复位故事，同时保留它来自编年史记载、细节仍有不确定性的背景。",
  "他的故事还说明，重返首都不仅依靠个人意志，也需要军事盟友和城内支持者共同配合。关于705年进入城市的具体过程来自拜占庭编年史，介绍时应明确它是史料所传。金制假鼻是后世传闻，缺少可靠依据，不宜当作确定事实。",
  "这段历史的具体过程仍以编年史叙述为依据，金制假鼻的故事并未得到可靠证据证实。",
  "因此，关于他如何进入城内的叙述应注明这是编年史保存下来的记载。能力名称突出这段戏剧性的复位经历，但不能据此认定路线的每个细节都已得到同时代材料独立证实。对鼻部修复的说法，也应区分后世传闻与可以核实的证据。",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.ja]
text = "ユスティニアヌス2世は皇帝コンスタンティノス4世の息子で、ビザンツ帝国を685年から695年、さらに705年から711年まで統治した。若くして即位し軍事遠征や改革を進めたが、重税や政治勢力との対立によって支持を失った。695年、将軍レオンティオスが率いる反乱で退位させられ、鼻を切り落とされたのち、クリミアのケルソンへ追放された。"
title = "ユスティニアヌス2世"
lang = "ja"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "ユスティニアヌス2世は皇帝コンスタンティノス4世の息子で、ビザンツ帝国を685年から695年、さらに705年から711年まで統治した。若くして即位し軍事遠征や改革を進めたが、重税や政治勢力との対立によって支持を失った。695年、将軍レオンティオスが率いる反乱で退位させられ、鼻を切り落とされたのち、クリミアのケルソンへ追放された。",
  "この身体刑は、彼が再び皇帝になる可能性を断つためのものだった。ユスティニアヌスは追放先で生き延び、同盟を築き、ブルガリアの支配者テルヴェルの支援を得た。705年、ブルガリア軍とともにコンスタンティノープルへ戻った。ビザンツの年代記は、城壁への正面攻撃が阻まれた後、本人と少数の仲間が水道橋を通って市内に入り、首都の奪回を助けたと伝える。能力名「水道橋からの帰還」はこの伝承にちなむ。",
  "復位後、ユスティニアヌスはさらに6年間統治し、711年に再度の反乱で倒され、殺された。異名リノトメトスは「鼻を切られた者」を意味する。文献は鼻を切り落とされたことを伝えるが、現存する皇帝貨幣にはその姿が描かれていない。後世には金製の義鼻を着けたという話もあるものの、信頼できる証拠とは見なされず、実際の容貌には不明な点が残る。",
  "彼の生涯は宮廷の権力闘争に追放、身体刑、軍事同盟が結びついていたことを示している。二度の治世の間、長い亡命生活を送り、首都へ戻るには国外の軍事支援と市内の協力者が必要だった。705年の復位後も帝国は安定せず、宮廷内の対立は彼が再び倒されるまで続いた。能力名は年代記の逸話を反映しつつ、それが史料に基づく伝承であることを踏まえている。",
  "彼の帰還は本人の意志だけでなく、国外の軍事同盟者と首都の協力者にも支えられた。705年に水道橋を通った経緯はビザンツ年代記に記されているため、確定した目撃証言ではなく史料に伝わる話として紹介する。金製の義鼻は後世の伝承で、信頼できる根拠に乏しい。",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.ko]
text = "유스티니아누스 2세는 콘스탄티노스 4세의 아들로, 비잔티움 제국을 685년부터 695년까지, 그리고 705년부터 711년까지 통치했다. 젊은 나이에 황제가 되어 군사 원정과 개혁을 추진했지만, 무거운 세금과 정치 세력과의 갈등으로 지지를 잃었다. 695년 레온티오스 장군이 이끈 반란으로 폐위되었고, 붙잡힌 뒤 코가 잘린 채 크림반도의 케르손으로 추방되었다."
title = "유스티니아누스 2세"
lang = "ko"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "유스티니아누스 2세는 콘스탄티노스 4세의 아들로, 비잔티움 제국을 685년부터 695년까지, 그리고 705년부터 711년까지 통치했다. 젊은 나이에 황제가 되어 군사 원정과 개혁을 추진했지만, 무거운 세금과 정치 세력과의 갈등으로 지지를 잃었다. 695년 레온티오스 장군이 이끈 반란으로 폐위되었고, 붙잡힌 뒤 코가 잘린 채 크림반도의 케르손으로 추방되었다.",
  "코를 자르는 형벌은 그가 다시 황제가 되는 일을 불가능하게 보이도록 하기 위한 것이었다. 유스티니아누스는 유배지에서 살아남아 동맹을 만들었고, 불가르의 통치자 테르벨에게 도움을 받았다. 705년 불가르 군대의 지원을 받아 콘스탄티노폴리스로 돌아왔다. 비잔티움 연대기는 성벽을 향한 정면 공격이 막힌 뒤, 그와 몇몇 동료가 수로를 통해 도시에 들어가 수도를 장악하는 데 힘을 보탰다고 전한다. 능력 이름인 ‘수로를 통한 귀환’은 이 기록에서 따왔다.",
  "복위한 유스티니아누스는 6년 더 통치했지만, 711년 다시 일어난 반란으로 폐위되고 살해되었다. ‘리노트메토스’라는 별칭은 ‘코가 잘린 사람’을 뜻한다. 문헌은 코가 잘렸다고 전하지만 현존하는 황제 주화에는 그 모습이 나타나지 않는다. 후대 기록에는 금으로 만든 의수를 착용했다는 이야기도 있으나 믿을 만한 증거로 여겨지지 않는다. 실제 외모에 관한 세부 사항은 확실하지 않다.",
  "그의 생애는 비잔티움 궁정의 권력 다툼에서 추방과 신체형, 군사 동맹이 어떻게 얽혔는지를 보여 준다. 두 차례 통치 사이에 오랜 망명 생활을 했고, 수도로 돌아오기 위해 외국 군대와 도시 안의 협력자 모두가 필요했다. 705년의 복위 뒤에도 제국은 안정되지 않았으며, 궁정의 갈등은 그가 다시 폐위될 때까지 이어졌다. 능력 이름은 귀환 이야기를 반영하면서도 그 세부가 연대기의 전승에 근거한다는 점을 고려한다.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.ar]
text = "كان جستنيان الثاني ابن الإمبراطور قسطنطين الرابع، وحكم الإمبراطورية البيزنطية من عام 685 إلى 695، ثم من عام 705 إلى 711. تولى العرش شاباً وخاض حملات عسكرية، لكن الضرائب الثقيلة والصراع مع جماعات سياسية أضعفا نفوذه. وفي عام 695 أطاح به تمرد قاده ليونتيوس. أُسر جستنيان وقُطع أنفه ونُفي إلى خيرسون في شبه جزيرة القرم."
title = "جستنيان الثاني"
lang = "ar"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "كان جستنيان الثاني ابن الإمبراطور قسطنطين الرابع، وحكم الإمبراطورية البيزنطية من عام 685 إلى 695، ثم من عام 705 إلى 711. تولى العرش شاباً وخاض حملات عسكرية، لكن الضرائب الثقيلة والصراع مع جماعات سياسية أضعفا نفوذه. وفي عام 695 أطاح به تمرد قاده ليونتيوس. أُسر جستنيان وقُطع أنفه ونُفي إلى خيرسون في شبه جزيرة القرم.",
  "كان المقصود من التشويه جعل عودته إلى العرش تبدو مستحيلة. نجا جستنيان وبنى تحالفات خلال منفاه، ثم حصل على دعم الحاكم البلغاري ترفل. وفي عام 705 عاد إلى القسطنطينية بمساندة القوات البلغارية. تروي المدونات البيزنطية أنه بعد تعذر الهجوم المباشر على أسوار المدينة دخل جستنيان مع عدد قليل من رفاقه عبر قناة مائية، وساعدوا على السيطرة على العاصمة. ومن هذه الرواية جاء اسم قدرته «العودة عبر القناة المائية».",
  "استعاد جستنيان العرش وحكم ست سنوات أخرى، إلى أن أطاح به تمرد جديد وقُتل عام 711. ولقبه «رينوتميتوس» يعني «مقطوع الأنف». تؤيد الروايات المكتوبة أنه فقد أنفه، لكن النقود الإمبراطورية الباقية لا تصوره بهذه الهيئة. وتورد حكاية متأخرة أنه استخدم أنفاً صناعياً من الذهب، إلا أن ذلك لا يُعد دليلاً موثوقاً؛ لذلك تبقى تفاصيل مظهره غير مؤكدة.",
  "تعكس حياته ارتباط المنفى والعقوبات الجسدية والتحالفات العسكرية بصراع السلطة في البلاط البيزنطي. أمضى فترة طويلة خارج الإمبراطورية بين عهديه، ولم تكن عودته إلى العاصمة ممكنة إلا بفضل حلفاء من الخارج ومؤيدين داخلها. ولم تحقق عودته عام 705 استقراراً دائماً، إذ استمر الصراع السياسي حتى أُطيح به مرة أخرى. يستند اسم القدرة إلى رواية تاريخية عن استعادة العاصمة، مع التعامل معها بوصفها خبراً تنقله المدونات لا وصفاً مؤكداً لكل التفاصيل.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.vi]
text = "Justinian II, con trai Hoàng đế Constantine IV, cai trị Đế quốc Byzantine từ năm 685 đến 695 và một lần nữa từ năm 705 đến 711. Ông lên ngôi khi còn trẻ, tiến hành chiến dịch quân sự và cải cách triều đình, nhưng thuế khóa nặng nề cùng xung đột chính trị làm suy giảm sự ủng hộ. Năm 695, cuộc nổi dậy do tướng Leontios lãnh đạo đã phế truất ông. Justinian bị bắt, bị cắt mũi rồi lưu đày đến Cherson ở bán đảo Crimea."
title = "Justinian II"
lang = "vi"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Justinian II, con trai Hoàng đế Constantine IV, cai trị Đế quốc Byzantine từ năm 685 đến 695 và một lần nữa từ năm 705 đến 711. Ông lên ngôi khi còn trẻ, tiến hành chiến dịch quân sự và cải cách triều đình, nhưng thuế khóa nặng nề cùng xung đột chính trị làm suy giảm sự ủng hộ. Năm 695, cuộc nổi dậy do tướng Leontios lãnh đạo đã phế truất ông. Justinian bị bắt, bị cắt mũi rồi lưu đày đến Cherson ở bán đảo Crimea.",
  "Việc làm nhục thân thể nhằm khiến khả năng ông trở lại ngai vàng dường như không thể xảy ra. Justinian sống sót, xây dựng liên minh trong thời gian lưu đày và nhận được sự giúp đỡ của người cai trị Bulgaria Tervel. Năm 705, ông trở về Constantinople với lực lượng Bulgaria hỗ trợ. Các biên niên sử Byzantine kể rằng sau khi tường thành chặn đứng cuộc tấn công trực diện, Justinian cùng một nhóm nhỏ đi vào thành phố qua đường dẫn nước và góp phần chiếm lại kinh đô. Tên năng lực “Trở về qua đường dẫn nước” lấy cảm hứng từ câu chuyện này.",
  "Justinian giành lại ngai vàng và cai trị thêm sáu năm, cho đến khi một cuộc nổi dậy khác lật đổ và giết ông vào năm 711. Biệt danh Rhinotmetos có nghĩa là “người bị cắt mũi”. Các ghi chép bằng văn bản ủng hộ việc ông mất mũi, nhưng tiền xu hoàng gia còn lại không thể hiện điều đó. Một câu chuyện muộn nói rằng ông đeo mũi giả bằng vàng, nhưng không được xem là bằng chứng đáng tin; diện mạo chính xác của ông vẫn chưa rõ.",
  "Cuộc đời ông cho thấy lưu đày, hình phạt thân thể và liên minh quân sự đan xen trong tranh giành quyền lực ở triều đình Byzantine. Giữa hai triều đại, ông sống xa kinh đô và cần cả quân đội đồng minh bên ngoài lẫn người ủng hộ bên trong để quay về. Việc phục vị năm 705 không chấm dứt bất ổn; xung đột chính trị tiếp diễn cho đến khi ông bị phế truất lần nữa. Tên năng lực nhấn mạnh câu chuyện về cuộc trở về, đồng thời ghi nhận rằng chi tiết được lưu truyền qua các biên niên sử.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
  { title = "Justinian Rhinotmetos: A Byzantine Rhinoplasty? (Cureus / PubMed Central)", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11438545/" },
]

[articles.pt]
text = "Justiniano II, filho do imperador Constantino IV, governou o Império Bizantino de 685 a 695 e novamente de 705 a 711. Chegou ao trono ainda jovem e promoveu campanhas militares, mas impostos elevados e conflitos políticos enfraqueceram seu apoio. Em 695, uma revolta liderada pelo general Leôncio o depôs. Justiniano foi capturado, teve o nariz cortado e acabou exilado em Quersoneso, na Crimeia."
title = "Justiniano II"
lang = "pt"
url = "https://www.roman-emperors.sites.luc.edu/Just2.htm"
intro = [
  "Justiniano II, filho do imperador Constantino IV, governou o Império Bizantino de 685 a 695 e novamente de 705 a 711. Chegou ao trono ainda jovem e promoveu campanhas militares, mas impostos elevados e conflitos políticos enfraqueceram seu apoio. Em 695, uma revolta liderada pelo general Leôncio o depôs. Justiniano foi capturado, teve o nariz cortado e acabou exilado em Quersoneso, na Crimeia.",
  "A mutilação pretendia tornar impossível seu retorno ao poder. Justiniano sobreviveu, formou alianças durante o exílio e recebeu o apoio do governante búlgaro Tervel. Em 705, voltou a Constantinopla com auxílio búlgaro. As crônicas bizantinas relatam que, depois que as defesas da cidade impediram um ataque frontal, Justiniano e um pequeno grupo entraram por um aqueduto e ajudaram a tomar a capital. Essa narrativa inspira o nome de sua habilidade: “Retorno pelo aqueduto”.",
  "Justiniano recuperou o trono e governou por mais seis anos, até ser deposto e morto por outra revolta em 711. O apelido Rhinotmetos significa “nariz cortado” e alude à mutilação. Relatos escritos sustentam que ele perdeu o nariz, mas as moedas imperiais preservadas não o mostram assim. Uma história posterior afirma que ele usava uma prótese de ouro, porém ela não é considerada evidência confiável. Por isso, os detalhes de sua aparência permanecem incertos.",
]
sections = []
shortArticle = true
sources = [
  { title = "Justinian II (De Imperatoribus Romanis)", url = "https://www.roman-emperors.sites.luc.edu/Just2.htm" },
