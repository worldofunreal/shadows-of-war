[articles.en]
text = "Tomyris also called Thomyris, Tomris, or Tomiride, was a 6th-century BC queen of the Massagetae, a nomadic people who inhabited the Eurasian steppe. Tomyris is known only from the writings of the Greek historian Herodotus, according to whom she led her armies to defend against an attack by Cyrus the Great of the Achaemenid Empire, and defeated and killed him in 530 BC."
title = "Tomyris"
lang = "en"
url = "https://en.wikipedia.org/wiki/Tomyris"
intro = [
  "Tomyris (; Saka: *Taumuriyah; Ancient Greek: Τόμυρις, romanized: Tómuris; Latin: Tomyris) also called Thomyris, Tomris, or Tomiride, was a 6th-century BC queen of the Massagetae, a nomadic people who inhabited the Eurasian steppe. Tomyris is known only from the writings of the Greek historian Herodotus, according to whom she led her armies to defend against an attack by Cyrus the Great of the Achaemenid Empire, and defeated and killed him in 530 BC. She is not mentioned in the few other early sources covering the period, especially Ctesias.",
  "Tomyris became a popular subject in European art and literature during the Renaissance. In visual art, she was typically depicted either receiving the head of Cyrus or placing it into a vessel filled with blood, a motif derived from one version of the accounts. This theme belonged to the 'Power of Women' tradition in Renaissance art, which celebrated women who triumphed over men in various ways.",
]
sections = [
  { "title" = "Name", "paragraphs" = [
      "The name Tomyris is the Latin form of the Ancient Greek name Tomuris (Τόμυρις), which is itself the Hellenisation of the Saka name *Taumuriyah, meaning \"of family\" derived from a cognate of the Avestan word taoxman (𐬙𐬀𐬊𐬑𐬨𐬀𐬥) and of the Old Persian word taumā (𐎫𐎢𐎶𐎠), meaning \"seed,\" \"germ,\" and \"kinship.\"",
    ] },
  { "title" = "History", "paragraphs" = [
      "Tomyris was the widow of the king of the Massagetae, whom she succeeded as the queen of the tribe after he died.",
      "When the founder of the Persian Achaemenid Empire, Cyrus, asked for the hand of Tomyris with the intent of acquiring her kingdom through the marriage, she understood Cyrus's aims and rejected his proposal. On the advice of the Lydian Croesus, Cyrus responded to Tomyris's rejection by deciding to invade the Massagetae.",
      "When Cyrus started building a bridge on the Araxes river with the intent of attacking the Massagetae, Tomyris advised him to remain satisfied with ruling his own kingdom and to allow her to rule her kingdom. Cyrus's initial assault was routed by the Massagetae, after which he set up a fancy banquet with large amounts of wine in the tents of his camp as an ambush and withdrew.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The history of Tomyris has been incorporated into the tradition of Western art; Rubens, Allegrini, Luca Ferrari, Mattia Preti, Gustave Moreau and the sculptor Severo Calzetta da Ravenna are among the many artists who have portrayed events in the life of Tomyris and her defeat of Cyrus and his armies.",
      "Eustache Deschamps added Tomyris to his poetry as one of the nine Female Worthies in the late 14th century.",
      "In Shakespeare's earliest play King Henry VI (Part I), the Countess of Auvergne, while awaiting Lord Talbot's arrival, references Tomyris (Act II, Sc. iii).",
    ] },
  { "title" = "In popular culture", "paragraphs" = [
      "Toʻmarisning Koʻzlari (The Eyes of Tomyris) is a 1984 book of poems and stories by Uzbek author Khurshid Davron.",
      "Toʻmarisning Aytgani (The Sayings of Tomyris) is a 1996 book of poetry by Uzbek poet Halima Xudoyberdiyeva.",
      "The Kazakhstani film studio \"Kazakhfilm\" released the film Томирис (Tomyris) in late 2019. She is portrayed by Almira Tursyn.",
    ] },
]

[articles.tr]
text = "Tomris (Grekçe: Τόμυρις, Latince: Tomyris), MÖ 6. yüzyılda yaşadığı sanılan, Antik Doğu İran dillerini konuşan, Massaget konfederasyonu üzerinde hüküm sürmüş tarihin ilk kadın hükümdarıdır."
title = "Tomris"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Tomris"
intro = [
  "Tomris (Grekçe: Τόμυρις, Latince: Tomyris), MÖ 6. yüzyılda yaşadığı sanılan, Antik Doğu İran dillerini konuşan, Massaget konfederasyonu üzerinde hüküm sürmüş tarihin ilk kadın hükümdarıdır.",
]
sections = [
  { "title" = "Hayatı", "paragraphs" = [
      "Antik çağda Pers ve Medya'da hüküm süren Ahameniş İmparatorluğu ile büyük bir mücadeleye girişmiştir. Tomris barışçıl ama savunmaya önem veren bir yapıya önem göstermiş, bunu bir zayıflık olarak gören Pers İmparatoru Büyük Kiros ise hiç durmadan Massaget topraklarına akın düzenlemiştir. Persler, Massaget topraklarına girdiği vakit yakılmış tarlalardan başka bir şey bulamıyorlardı. Çünkü Massagetler geri çekiliyor ve savaş için uygun bir mevzi ve an bekliyorlar, bu olmadığı takdirde de savaşa girişmiyorlardı. Massagetleri kovalamaktan bıkan Büyük Kiros İran'a geri dönmek zorunda kalıyordu. Bir süre sonra kendisine tabî olması ve kendisiyle evlenmeyi kabul ettiği takdirde Tomris Hatun ile uğraşmayacağını vadetti. Tomris Hatun bunun bir oyun olduğunu biliyordu ve teklifi reddetti.",
      "Buna kızan Büyük Kiros büyük bir ordu toplayarak tekrar Massaget topraklarına girdi. Bu orduda savaş için eğitilmiş yüzlerce köpek de vardı. Tomris artık kaçmanın yarar sağlamayacağını anlayıp uygun bir alan seçip Büyük Kiros'un ordusunu beklemeye başlar. İki ordu aralarında birkaç kilometre kalacak bir biçimde mevzilenir. Güneş battığı için savaşa tutuşmazlar ancak gece Büyük Kiros bir hile düşünmüş ve iki ordunun arasında bir çadır kurdurmuştur ve içinde güzel kızlar ve yiyecekler ve şarap bulunan çadıra ansızın saldırı düzenleyen Tomris'in oğlu Spargapises ve beraberindeki kuvvetler, içerideki birkaç Pers'i öldürüp eğlenceye dalmışlardır. Ancak birkaç saat sonra bir baskın düzenleyen Pers kuvvetleri çadırı basıp Tomris'in oğlu da olmak üzere içerideki Massagetleri öldürürler. Tomris çok sevdiği oğlunun ölümüne üzülür. Yemin ederek şöyle söyler: Kana susamış Kiros! Sen oğlumu mertlikle değil o içtikçe zıvanadan çıktığın şarapla öldürdün. Ama güneşe yemin ederim ki seni kanla doyuracağım!",
      "İki ordu Milattan Önce 529'da Seyhun nehri yakınlarında savaş düzeni alır. Kanatlara süvarilerini, ön saflara mızraklı piyadelerini, onların arkasına da okçularını dizen İmparator Kiros, şahsi muhafızları olan, efsanevi Ölümsüzler ile merkezde yer alır. Heredot'un \"Yunan toprakları dışındaki en kanlı savaş\" olarak tabir ettiği savaşta Massagetler kanca temrenli okları, güçlü yayları, eyer ve üzengiyle kullandıkları atları sayesinde savaşı kazanır. Ok atmakta usta olan ve savaş arabalarını büyük ustalıkla kullanan Massaget, savaş köpeklerine rağmen Persleri bozguna uğratır. İmparator Kiros, adamlarının çoğunu kaybetmiş, bir kısmı da savaş alanından kaçmıştır. Sadece Ölümsüzler ile kalan Kiros'un etrafı Massagetler tarafından çevrilmiş, İmparator çember içine alınmıştır. Kiros, son bir hamle ile çemberi yarıp kaçmak için savaşırken, atından düşürülüp öldürülmüştür. Ahameniş İmparatorluğu'nun ilk büyük hükümdarı Kiros, ele geçirmek istediği topraklarda önce ordusundan sonra da canından olmuştur.",
    ] },
  { "title" = "Kültürel etkiler", "paragraphs" = [
      "Tomyris adı, Avesta dilindeki \"Taoxman\" (𐬙𐬀𐬊𐬑𐬨𐬀𐬥) ve Eski Farsça \"Taumā\" (𐎫𐎢𐎶𐎠) kelimesinden türetilen \"aile\" anlamına gelen İskit adının Helenleşmesi olan Antik Yunanca Tómuris adının Latince biçimidir. \"tohum\", \"mikrop\" ve \"akrabalık\" anlamına gelen Tumurī̆, Tumuriya, Taumurī̆, Taumuriya, Θumurī̆, Θumuriya, Θaumurī̆, Θaumuriya, Θvāmurī̆ ve Θvāmuriya dahil olmak üzere çeşitli yeniden yapılandırılmış formları önerilmiştir.",
      "İran tarihi ve İran edebiyatı için mühim bir şahsiyet olan Farkapın (Sparqapisin) kızıdır.",
    ] },
]

[articles.vi]
text = "Tomyris (còn gọi là Thomyris hoặc Tomris) là nữ vương của người Massagetae, một bộ tộc du mục Iran cổ đại ở Trung Á trong thế kỷ 6 TCN. Bà nổi tiếng qua ghi chép của sử gia Hy Lạp Herodotus, theo đó bà đã đánh bại và giết Cyrus Đại đế, người sáng lập Đế quốc Achaemenid, vào khoảng năm 530 TCN."
title = "Tomyris"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Tomyris"
intro = [
  "Tomyris (còn gọi là Thomyris hoặc Tomris) là nữ vương của người Massagetae, một bộ tộc du mục Iran cổ đại ở Trung Á trong thế kỷ 6 TCN. Bà nổi tiếng qua ghi chép của sử gia Hy Lạp Herodotus, theo đó bà đã đánh bại và giết Cyrus Đại đế, người sáng lập Đế quốc Achaemenid, vào khoảng năm 530 TCN.",
  "Tomyris là một trong những nữ chiến binh nổi tiếng nhất thời cổ đại và trở thành biểu tượng của sức mạnh nữ giới trong lịch sử cũng như nghệ thuật châu Âu thời Phục Hưng.",
]
sections = [
  { "title" = "Tên gọi", "paragraphs" = [
      "Tên Tomyris là dạng Latinh của tên Hy Lạp cổ Tómuris (Τόμυρις), có nguồn gốc từ tiếng Saka cổ, mang nghĩa liên quan đến “dòng tộc”, “huyết thống” hoặc “gia đình”.",
    ] },
  { "title" = "Tiểu sử", "paragraphs" = [
      "Tomyris trở thành nữ vương của người Massagetae sau khi chồng bà qua đời. Không có nhiều tài liệu ghi lại thời niên thiếu của bà; phần lớn thông tin về Tomyris đến từ Herodotus.",
    ] },
  { "title" = "Chiến tranh với Ba Tư", "paragraphs" = [
      "Theo Herodotus, Cyrus Đại đế muốn cưới Tomyris, nhưng thực chất nhằm thâu tóm vương quốc của bà. Tomyris nhận ra ý đồ này nên từ chối lời cầu hôn.",
      "Sau đó Cyrus quyết định xâm lược lãnh thổ Massagetae. Tomyris cảnh báo ông nên hài lòng với lãnh thổ của mình và không nên tiến quân. Cyrus phớt lờ lời cảnh báo.",
    ] },
  { "title" = "Cái chết của Spargapises", "paragraphs" = [
      "Con trai của Tomyris là Spargapises chỉ huy quân Massagetae. Cyrus dùng mưu đặt tiệc rượu trong doanh trại rồi giả vờ rút quân.",
      "Người Massagetae vốn không quen uống rượu nho nên nhanh chóng say và bị quân Ba Tư tấn công. Nhiều binh sĩ bị giết, Spargapises bị bắt.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Tomyris trở thành biểu tượng của nữ quyền và sức mạnh quân sự. Hình ảnh bà xuất hiện trong nhiều tác phẩm hội họa của Peter Paul Rubens, Mattia Preti và nhiều nghệ sĩ châu Âu khác.",
      "Kazakhstan xem Tomyris là một nữ anh hùng dân tộc và đã phát hành tiền xu mang hình bà.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Tomyris trở thành biểu tượng của nữ quyền và sức mạnh quân sự. Hình ảnh bà xuất hiện trong nhiều tác phẩm hội họa của Peter Paul Rubens, Mattia Preti và nhiều nghệ sĩ châu Âu khác.",
      "Kazakhstan xem Tomyris là một nữ anh hùng dân tộc và đã phát hành tiền xu mang hình bà.",
    ] },
]

