[articles.en]
text = "Suppiluliuma I ruled Hatti in the fourteenth century BCE. His campaigns extended Hittite control into northern Syria, where he installed his son Piyassili as king of Carchemish. His agreement with Shattiwaza of Mitanni linked support for a claimant to a new political settlement."
title = "Suppiluliuma I"
lang = "en"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma I ruled Hatti in the fourteenth century BCE. His campaigns extended Hittite control into northern Syria, where he installed his son Piyassili as king of Carchemish. His agreement with Shattiwaza of Mitanni linked support for a claimant to a new political settlement."]
sections = [{ title = "Hatti and the succession in Mitanni", paragraphs = ["The cuneiform texts catalogued as CTH 51 and 52 preserve accounts in the names of the two rulers. They describe Suppiluliuma’s backing for Shattiwaza and a joint campaign in which the Mitannian claimant and Piyassili crossed the Euphrates. The texts also set out the territorial relationship between Carchemish and Mitanni. The separate accounts give each ruler a voice, although scholars read the resulting arrangement as Hittite overlordship over Mitanni. Their accounts are diplomatic documents with political purposes, and historians distinguish the claims of their preambles from the obligations they record."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.es]
text = "Suppiluliuma I gobernó Hatti en el siglo XIV a. C. Sus campañas extendieron el control hitita al norte de Siria, donde puso a su hijo Piyaššili al frente del reino de Carquemis. Su acuerdo con Šattiwaza de Mitanni ligó el apoyo a un aspirante al trono con un nuevo orden político."
title = "Suppiluliuma I"
lang = "es"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma I gobernó Hatti en el siglo XIV a. C. Sus campañas extendieron el control hitita al norte de Siria, donde puso a su hijo Piyaššili al frente del reino de Carquemis. Su acuerdo con Šattiwaza de Mitanni ligó el apoyo a un aspirante al trono con un nuevo orden político."]
sections = [{ title = "Hatti y la sucesión de Mitanni", paragraphs = ["Los textos cuneiformes CTH 51 y 52 presentan relatos en nombre de los dos gobernantes. Describen el respaldo de Suppiluliuma a Šattiwaza y una campaña conjunta en la que el aspirante mitanio y Piyaššili cruzaron el Éufrates. También fijan la relación territorial entre Carquemis y Mitanni. Aunque cada gobernante tiene voz en los documentos, los especialistas interpretan el acuerdo como una relación de subordinación a Hatti. Las tablillas tenían una finalidad diplomática. Para reconstruir los hechos, se distinguen las versiones interesadas de sus preámbulos y las obligaciones que establecen."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.fr]
text = "Suppiluliuma Ier régna sur le Hatti au XIVe siècle av. J.-C. Ses campagnes étendirent le contrôle hittite au nord de la Syrie, où il plaça son fils Piyassili à la tête du royaume de Karkemish. Son accord avec Shattiwaza du Mitanni associait le soutien à un prétendant au trône à un nouvel ordre politique."
title = "Suppiluliuma Ier"
lang = "fr"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma Ier régna sur le Hatti au XIVe siècle av. J.-C. Ses campagnes étendirent le contrôle hittite au nord de la Syrie, où il plaça son fils Piyassili à la tête du royaume de Karkemish. Son accord avec Shattiwaza du Mitanni associait le soutien à un prétendant au trône à un nouvel ordre politique."]
sections = [{ title = "Le Hatti et la succession du Mitanni", paragraphs = ["Les textes cunéiformes CTH 51 et 52 présentent des récits au nom des deux souverains. Ils décrivent le soutien de Suppiluliuma à Shattiwaza et une campagne commune durant laquelle le prétendant et Piyassili franchirent l’Euphrate. Ils définissent aussi les rapports territoriaux entre Karkemish et le Mitanni. Chaque souverain s’exprime dans les documents, mais les chercheurs interprètent l’accord comme établissant la suzeraineté du Hatti sur le Mitanni. Ces textes répondaient à des objectifs diplomatiques. Les historiens distinguent les récits des préambules et les obligations qui y sont consignées."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.de]
text = "Šuppiluliuma I. regierte Hatti im 14. Jahrhundert v. Chr. Seine Feldzüge weiteten die hethitische Herrschaft auf Nordsyrien aus. Dort setzte er seinen Sohn Piyaššili als König von Karkemiš ein. Die Vereinbarung mit Šattiwaza von Mitanni verband die Unterstützung eines Thronanwärters mit einer neuen politischen Ordnung."
title = "Šuppiluliuma I."
lang = "de"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Šuppiluliuma I. regierte Hatti im 14. Jahrhundert v. Chr. Seine Feldzüge weiteten die hethitische Herrschaft auf Nordsyrien aus. Dort setzte er seinen Sohn Piyaššili als König von Karkemiš ein. Die Vereinbarung mit Šattiwaza von Mitanni verband die Unterstützung eines Thronanwärters mit einer neuen politischen Ordnung."]
sections = [{ title = "Hatti und die Thronfolge in Mitanni", paragraphs = ["Die Keilschrifttexte CTH 51 und 52 berichten im Namen beider Herrscher. Sie beschreiben Šuppiluliumas Unterstützung für Šattiwaza und einen gemeinsamen Feldzug, bei dem der Thronanwärter und Piyaššili den Euphrat überquerten. Die Texte regeln auch das territoriale Verhältnis zwischen Karkemiš und Mitanni. Beide Herrscher treten in den Schriftstücken als Sprecher auf, doch die Forschung sieht in der Übereinkunft eine Oberherrschaft Hattis über Mitanni. Die Texte dienten diplomatischen Zwecken. Die Forschung unterscheidet deshalb die Erzählungen der Präambeln von den festgelegten Verpflichtungen."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.it]
text = "Suppiluliuma I governò Hatti nel XIV secolo a.C. Le sue campagne estesero il controllo ittita nel nord della Siria, dove insediò il figlio Piyassili come re di Carchemish. L’accordo con Shattiwaza di Mitanni unì il sostegno a un pretendente al trono a un nuovo assetto politico."
title = "Suppiluliuma I"
lang = "it"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma I governò Hatti nel XIV secolo a.C. Le sue campagne estesero il controllo ittita nel nord della Siria, dove insediò il figlio Piyassili come re di Carchemish. L’accordo con Shattiwaza di Mitanni unì il sostegno a un pretendente al trono a un nuovo assetto politico."]
sections = [{ title = "Hatti e la successione di Mitanni", paragraphs = ["I testi cuneiformi CTH 51 e 52 narrano gli eventi a nome dei due sovrani. Descrivono l’appoggio di Suppiluliuma a Shattiwaza e la campagna comune in cui il pretendente e Piyassili attraversarono l’Eufrate. Definiscono anche i rapporti territoriali tra Carchemish e Mitanni. Pur dando voce a entrambi i sovrani, i documenti hanno sancito secondo gli studiosi la supremazia di Hatti su Mitanni. Questi testi avevano uno scopo diplomatico. Gli storici distinguono le versioni dei preamboli dagli obblighi che stabiliscono."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.tr]
text = "I. Şuppiluliuma MÖ 14. yüzyılda Hatti’yi yönetti. Seferleri Hitit hâkimiyetini Kuzey Suriye’ye yaydı. Burada oğlu Piyaşşili’yi Karkamış kralı olarak görevlendirdi. Mitannili Şattiwaza ile yaptığı antlaşma, bir taht adayına verilen desteği yeni bir siyasi düzenle birleştirdi."
title = "I. Şuppiluliuma"
lang = "tr"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["I. Şuppiluliuma MÖ 14. yüzyılda Hatti’yi yönetti. Seferleri Hitit hâkimiyetini Kuzey Suriye’ye yaydı. Burada oğlu Piyaşşili’yi Karkamış kralı olarak görevlendirdi. Mitannili Şattiwaza ile yaptığı antlaşma, bir taht adayına verilen desteği yeni bir siyasi düzenle birleştirdi."]
sections = [{ title = "Hatti ve Mitanni’de taht mücadelesi", paragraphs = ["CTH 51 ve 52 olarak sınıflandırılan çivi yazılı metinler iki hükümdar adına anlatılar sunar. Şuppiluliuma’nın Şattiwaza’ya verdiği desteği ve taht adayıyla Piyaşşili’nin Fırat’ı aştığı ortak seferi aktarırlar. Karkamış ile Mitanni arasındaki toprak ilişkisini de düzenlerler. Metinlerde iki hükümdar da konuşsa da araştırmacılar bu düzeni Hatti’nin Mitanni üzerindeki üstünlüğü olarak değerlendirir. Bu belgeler diplomatik amaçlarla hazırlandı. Tarihçiler girişlerdeki anlatıları belirlenen yükümlülüklerden ayrı inceler."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.zh-CN]
text = "公元前十四世纪，苏庇路里乌玛一世从安纳托利亚的哈图沙统治赫梯。他向叙利亚北部扩张，安排自己的儿子治理阿勒颇和卡尔凯美什。与此同时，米坦尼的王位之争给了他干预幼发拉底河另一侧事务的机会。他支持王位争夺者沙提瓦扎，并派出由儿子皮亚西里率领的部队。皮亚西里也叫沙里库舒赫，当时掌管位于幼发拉底河畔的卡尔凯美什。他与沙提瓦扎并肩作战，越过大河，打到了伊里特城。联合作战帮助沙提瓦扎登上王位，也让赫梯国王得以决定双方将如何分配城镇。米坦尼有自己的国王，但沙提瓦扎得到王位所依靠的军力来自赫梯，双方的权力并不对等。"
title = "苏庇路里乌玛一世"
lang = "zh-CN"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["公元前十四世纪，苏庇路里乌玛一世从安纳托利亚的哈图沙统治赫梯。他向叙利亚北部扩张，安排自己的儿子治理阿勒颇和卡尔凯美什。与此同时，米坦尼的王位之争给了他干预幼发拉底河另一侧事务的机会。他支持王位争夺者沙提瓦扎，并派出由儿子皮亚西里率领的部队。皮亚西里也叫沙里库舒赫，当时掌管位于幼发拉底河畔的卡尔凯美什。他与沙提瓦扎并肩作战，越过大河，打到了伊里特城。联合作战帮助沙提瓦扎登上王位，也让赫梯国王得以决定双方将如何分配城镇。米坦尼有自己的国王，但沙提瓦扎得到王位所依靠的军力来自赫梯，双方的权力并不对等。"]
sections = [{ title = "越过幼发拉底河", paragraphs = ["两方立场都反映在流传下来的楔形文字文书中。编目号CTH 51的条约由苏庇路里乌玛一方陈述，CTH 52则以米坦尼国王沙提瓦扎一方的名义订立。研究者在整理残存泥板时也区分文书使用的语言。CTH 52的目录分别列有阿卡德语和赫梯语版本。一份保存下来的阿卡德语残片有几处地名，可以与其他赫梯文献对照。泥板有缺损，有些城镇的名字已经无法完整读出，不过幸存的条款仍能说明，划定疆界和任命统治者是同一次政治安排的两个部分。苏庇路里乌玛将若干设防城镇交给了皮亚西里，并规定部分河岸城市的归属。条约把这些城镇与渡河的军事行动联系起来，回顾皮亚西里如何与沙提瓦扎共同推进。后来，另一位儿子穆尔西里二世在记述父王事迹的文本中，也谈到父亲将卡尔凯美什城及其周边土地交给皮亚西里，并让他在那里称王。把这份王室记述和条约放在一起，可以看到赫梯王权在不同地方采取了不同的治理方式。卡尔凯美什由赫梯王室成员直接主持当地政务，米坦尼则保留了由本地王族出身的沙提瓦扎统治的王国。两位君主在军事上的配合发生在一次具体的王位争夺中，战后的条款则把这种配合延伸为对城镇、疆界和统治权的安排。与只记录胜负的叙事相比，这些条款还保留了征战之后谁有权治理河岸、据点和通道的细节。"] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.ja]
text = "紀元前十四世紀、シュッピルリウマ一世はアナトリアのハットゥシャからヒッタイトを治め、シリア北部に勢力を伸ばした。アレッポとカルケミシュには自分の息子たちを置いた。ユーフラテス川沿いのカルケミシュを任されたのは、シャッリ・クシュフとも呼ばれるピヤッシリである。ミタンニで王位をめぐる争いが起こると、シュッピルリウマは王族のシャッティワザを支援した。ピヤッシリはシャッティワザと軍を進め、ユーフラテス川を越えてイリテに到達した。この行動は、ヒッタイトが川の向こう側の王位継承にどのように関与したかを示している。シャッティワザはヒッタイトの軍事力を後ろ盾にミタンニ王となり、両者の関係が条約に定められた。"
title = "シュッピルリウマ1世"
lang = "ja"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["紀元前十四世紀、シュッピルリウマ一世はアナトリアのハットゥシャからヒッタイトを治め、シリア北部に勢力を伸ばした。アレッポとカルケミシュには自分の息子たちを置いた。ユーフラテス川沿いのカルケミシュを任されたのは、シャッリ・クシュフとも呼ばれるピヤッシリである。ミタンニで王位をめぐる争いが起こると、シュッピルリウマは王族のシャッティワザを支援した。ピヤッシリはシャッティワザと軍を進め、ユーフラテス川を越えてイリテに到達した。この行動は、ヒッタイトが川の向こう側の王位継承にどのように関与したかを示している。シャッティワザはヒッタイトの軍事力を後ろ盾にミタンニ王となり、両者の関係が条約に定められた。"]
sections = [{ title = "ユーフラテスを渡る", paragraphs = ["この取り決めは、楔形文字の粘土板に残る。文書目録でCTH 51に分類される条約はシュッピルリウマ側の立場から書かれ、CTH 52はシャッティワザ側の名で結ばれている。後者にはアッカド語版とヒッタイト語版の区別がある。残存する断片が伝える地名は、ヒッタイトの他の記録と照らし合わせる手がかりになる。シュッピルリウマの条約には、ピヤッシリに与えた要塞都市や川沿いの町の帰属についての条項がある。そこには、二人の王子が川を渡ってイリテまで進んだことも記されている。戦争の記録と土地の割り当てが同じ文書にあるため、軍事行動が戦後の統治にどうつながったかが見えてくる。一部の地名は粘土板の欠損で読み取れないが、川の西岸にある町をどちらが治めるかが条約の具体的な関心事だったことは分かる。のちに別の息子ムルシリ二世がまとめた父の事績にも、カルケミシュの町と土地がピヤッシリに委ねられ、そこで王とされたことが記録されている。カルケミシュにはヒッタイト王家の一員が入り、ミタンニには現地の王家出身のシャッティワザが立った。ミタンニには引き続き自らの王がいたが、王位を得るために受けた支援と条約の条件が、ヒッタイト大王との力関係を定めた。ユーフラテスを挟む地域で、王位への支援、家族による統治、町の帰属が一つの戦役を通じて結びついたのである。"] }]
