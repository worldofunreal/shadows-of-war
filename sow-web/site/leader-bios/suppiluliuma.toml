[articles.ko]
text = "기원전 14세기 수필룰리우마 1세는 아나톨리아의 하투사에서 히타이트를 다스리며 북부 시리아까지 세력을 넓혔다. 그는 알레포와 카르케미시를 두 아들에게 맡겼다. 유프라테스강가에 자리한 카르케미시를 맡은 피야실리는 샤리쿠수흐라는 이름으로도 알려져 있다. 미탄니의 왕위를 둘러싼 다툼이 벌어지자 수필룰리우마는 왕족 샤티와자를 지원했다. 피야실리는 샤티와자와 함께 군대를 이끌고 유프라테스강을 건너 이리테까지 진군했다. 샤티와자가 미탄니 왕이 되는 데에는 히타이트의 군사 지원이 중요한 역할을 했다. 이 지원으로 수필룰리우마는 강 건너 왕위 계승에 관여하고 강을 따라 늘어선 도시의 관할권도 조정할 수 있었다. 카르케미시와 미탄니는 서로 다른 통치자가 다스렸으며, 두 지역의 관계는 전쟁 뒤 맺은 조약에 구체적으로 담겼다."
title = "수필룰리우마 1세"
lang = "ko"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["기원전 14세기 수필룰리우마 1세는 아나톨리아의 하투사에서 히타이트를 다스리며 북부 시리아까지 세력을 넓혔다. 그는 알레포와 카르케미시를 두 아들에게 맡겼다. 유프라테스강가에 자리한 카르케미시를 맡은 피야실리는 샤리쿠수흐라는 이름으로도 알려져 있다. 미탄니의 왕위를 둘러싼 다툼이 벌어지자 수필룰리우마는 왕족 샤티와자를 지원했다. 피야실리는 샤티와자와 함께 군대를 이끌고 유프라테스강을 건너 이리테까지 진군했다. 샤티와자가 미탄니 왕이 되는 데에는 히타이트의 군사 지원이 중요한 역할을 했다. 이 지원으로 수필룰리우마는 강 건너 왕위 계승에 관여하고 강을 따라 늘어선 도시의 관할권도 조정할 수 있었다. 카르케미시와 미탄니는 서로 다른 통치자가 다스렸으며, 두 지역의 관계는 전쟁 뒤 맺은 조약에 구체적으로 담겼다."]
sections = [{ title = "유프라테스강을 건너다", paragraphs = ["이 협약의 내용은 쐐기 문자로 쓰인 점토판 문서에서 확인할 수 있다. 오늘날 CTH 51로 분류되는 문서는 수필룰리우마의 입장에서 작성되었고, CTH 52는 샤티와자의 이름으로 작성된 조약이다. 후자의 문헌 목록에는 아카드어판과 히타이트어판이 구분되어 있다. 아카드어판의 일부에는 다른 히타이트 기록과 대조할 수 있는 지명이 남아 있다. 점토판이 부서져 읽을 수 없는 부분도 있지만, 수필룰리우마가 아들에게 요새 도시를 넘기고 강 서쪽에 있는 몇몇 도시의 관할권을 정했다는 내용은 확인할 수 있다. 조약에는 피야실리와 샤티와자가 함께 강을 건넌 경위도 적혀 있다. 이리테까지 진격한 사실과 전쟁 이후에 어느 통치자가 도시를 맡는지가 한 문서 안에 등장한다. 수필룰리우마의 또 다른 아들 무르실리 2세가 남긴 부왕의 업적 기록에도 아버지가 피야실리에게 카르케미시의 도시와 영토를 맡기고 그곳의 왕으로 삼았다는 내용이 있다. 카르케미시에서는 히타이트 왕실 구성원이 통치했고, 미탄니에서는 현지 왕족 출신인 샤티와자가 왕국을 다스렸다. 같은 군사 원정에 참여했어도 두 사람이 맡은 통치권의 근거에는 차이가 있었다. 샤티와자가 얻은 왕위는 수필룰리우마의 지원과 밀접히 연결되어 있었다. 이 기록들은 당시의 전투가 끝난 뒤에도 강 양쪽의 도시를 누가 관리하는지, 현지 왕과 히타이트 대왕이 어떤 관계를 맺는지가 계속 중요한 문제였음을 보여 준다."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.ar]
text = "حكم شوبيلوليوما الأول حاتي في القرن الرابع عشر قبل الميلاد. ووسّعت حملاته السيطرة الحثية في شمال سوريا، حيث عيّن ابنه بياشيلي ملكًا على كركميش. وربط اتفاقه مع شاتيوازا من ميتاني بين دعم مطالب بالعرش وإقامة ترتيب سياسي جديد."
title = "شوبيلوليوما الأول"
lang = "ar"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["حكم شوبيلوليوما الأول حاتي في القرن الرابع عشر قبل الميلاد. ووسّعت حملاته السيطرة الحثية في شمال سوريا، حيث عيّن ابنه بياشيلي ملكًا على كركميش. وربط اتفاقه مع شاتيوازا من ميتاني بين دعم مطالب بالعرش وإقامة ترتيب سياسي جديد."]
sections = [{ title = "حاتي والصراع على عرش ميتاني", paragraphs = ["تحمل النصوص المسمارية المفهرسة بالرقمين CTH 51 و52 روايتين باسم الحاكمين. وتصف دعم شوبيلوليوما لشاتيوازا وحملة مشتركة عبر فيها المطالب بالعرش وبياشيلي نهر الفرات. وتحدد أيضًا العلاقة الإقليمية بين كركميش وميتاني. وعلى الرغم من أن الوثائق تتحدث باسم الحاكمين، يرى الباحثون أن الترتيب كرّس تبعية ميتاني لحاتي. وُضعت هذه الألواح لأغراض دبلوماسية، ولذلك يميز المؤرخون بين سرد الأحداث في مقدماتها وبين الالتزامات التي تقررها. وتكشف صياغتها كيف عرض كل طرف موقعه في الاتفاق. ولهذا تسجل الألواح نتيجة الحملة على ضفتي النهر."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.ru]
text = "Суппилулиума I правил Хатти в XIV веке до н. э. Его походы распространили хеттскую власть на север Сирии, где он поставил своего сына Пияссили царём Каркемиша. Соглашение с Шаттивазой из Митанни связало поддержку претендента на престол с новым политическим порядком."
title = "Суппилулиума I"
lang = "ru"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Суппилулиума I правил Хатти в XIV веке до н. э. Его походы распространили хеттскую власть на север Сирии, где он поставил своего сына Пияссили царём Каркемиша. Соглашение с Шаттивазой из Митанни связало поддержку претендента на престол с новым политическим порядком."]
sections = [{ title = "Хатти и борьба за престол Митанни", paragraphs = ["Клинописные тексты CTH 51 и 52 излагают события от имени обоих правителей. Они описывают поддержку Шаттивазы Суппилулиумой и совместный поход, в ходе которого претендент и Пияссили пересекли Евфрат. Тексты определяют и территориальные отношения Каркемиша с Митанни. В документах говорят оба правителя, но исследователи трактуют итоговое соглашение как установление верховной власти Хатти над Митанни. Тексты создавались с дипломатической целью. Историки отличают изложение событий в предисловиях от записанных в них обязательств."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.vi]
text = "Suppiluliuma I cai trị Hatti vào thế kỷ XIV TCN. Các chiến dịch của ông mở rộng quyền kiểm soát của Hittite tới miền bắc Syria. Tại đây ông đưa con trai Piyassili lên làm vua Carchemish. Thỏa thuận với Shattiwaza của Mitanni gắn việc hỗ trợ một người tranh ngôi với một trật tự chính trị mới."
title = "Suppiluliuma I"
lang = "vi"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma I cai trị Hatti vào thế kỷ XIV TCN. Các chiến dịch của ông mở rộng quyền kiểm soát của Hittite tới miền bắc Syria. Tại đây ông đưa con trai Piyassili lên làm vua Carchemish. Thỏa thuận với Shattiwaza của Mitanni gắn việc hỗ trợ một người tranh ngôi với một trật tự chính trị mới."]
sections = [{ title = "Hatti và cuộc kế vị ở Mitanni", paragraphs = ["Hai văn bản chữ hình nêm CTH 51 và 52 kể các sự kiện nhân danh hai vị vua. Chúng mô tả sự hỗ trợ của Suppiluliuma dành cho Shattiwaza và chiến dịch chung trong đó người tranh ngôi cùng Piyassili vượt sông Euphrates. Chúng cũng quy định quan hệ lãnh thổ giữa Carchemish và Mitanni. Cả hai vị vua đều có tiếng nói trong các văn bản, nhưng giới nghiên cứu xem đây là một thỏa thuận đặt Mitanni dưới quyền bá chủ của Hatti. Những văn bản ấy phục vụ mục đích ngoại giao. Các nhà sử học phân biệt lời kể ở phần mở đầu với những nghĩa vụ được ghi nhận."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.id]
text = "Suppiluliuma I memerintah Hatti pada abad ke-14 SM. Ekspedisinya memperluas kekuasaan Het ke Suriah utara. Ia menempatkan putranya, Piyassili, sebagai raja Karkemis. Perjanjiannya dengan Shattiwaza dari Mitanni menghubungkan dukungan bagi seorang penuntut takhta dengan tatanan politik baru."
title = "Suppiluliuma I"
lang = "id"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma I memerintah Hatti pada abad ke-14 SM. Ekspedisinya memperluas kekuasaan Het ke Suriah utara. Ia menempatkan putranya, Piyassili, sebagai raja Karkemis. Perjanjiannya dengan Shattiwaza dari Mitanni menghubungkan dukungan bagi seorang penuntut takhta dengan tatanan politik baru."]
sections = [{ title = "Hatti dan perebutan takhta Mitanni", paragraphs = ["Teks paku yang diberi nomor CTH 51 dan 52 mengisahkan peristiwa atas nama kedua penguasa. Keduanya menggambarkan dukungan Suppiluliuma untuk Shattiwaza dan kampanye bersama ketika penuntut takhta dan Piyassili menyeberangi Efrat. Teks tersebut juga menetapkan hubungan wilayah antara Karkemis dan Mitanni. Kedua penguasa diberi suara, tetapi para peneliti membaca tatanan itu sebagai kekuasaan tertinggi Hatti atas Mitanni. Lempeng-lempeng ini disusun untuk tujuan diplomatik. Para sejarawan membedakan kisah yang disajikan dalam pembukaannya dari kewajiban yang ditetapkan."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.fil]
text = "Namuno si Suppiluliuma I sa Hatti noong ika-14 na siglo BK. Pinalawak ng kanyang mga kampanya ang pamumuno ng mga Hittite sa hilagang Syria. Itinalaga niya ang anak niyang si Piyassili bilang hari ng Carchemish. Iniugnay ng kasunduan kay Shattiwaza ng Mitanni ang suporta sa isang naghahabol ng trono sa bagong kaayusang pampolitika."
title = "Suppiluliuma I"
lang = "fil"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Namuno si Suppiluliuma I sa Hatti noong ika-14 na siglo BK. Pinalawak ng kanyang mga kampanya ang pamumuno ng mga Hittite sa hilagang Syria. Itinalaga niya ang anak niyang si Piyassili bilang hari ng Carchemish. Iniugnay ng kasunduan kay Shattiwaza ng Mitanni ang suporta sa isang naghahabol ng trono sa bagong kaayusang pampolitika."]
sections = [{ title = "Hatti at ang paghalili sa trono ng Mitanni", paragraphs = ["Inilalahad ng mga tekstong cuneiform na CTH 51 at 52 ang mga pangyayari sa pangalan ng dalawang pinuno. Isinasalaysay nila ang pagtulong ni Suppiluliuma kay Shattiwaza at ang magkasamang kampanya kung saan tumawid sa Euphrates ang naghahabol ng trono at si Piyassili. Itinatakda rin ang ugnayang teritoryal ng Carchemish at Mitanni. May tinig ang dalawang pinuno sa mga dokumento, ngunit binabasa ng mga mananaliksik ang kasunduan bilang pagpapasailalim ng Mitanni sa Hatti. May layuning diplomatiko ang mga teksto. Ibinubukod ng mga historyador ang mga salaysay sa pambungad sa mga obligasyong itinakda."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]

[articles.pt-BR]
text = "Suppiluliuma I governou Hati no século XIV a.C. Suas campanhas estenderam o domínio hitita ao norte da Síria, onde colocou o filho Piyassili no trono de Carquemis. Seu acordo com Shattiwaza de Mitani uniu o apoio a um pretendente ao trono a uma nova ordem política."
title = "Suppiluliuma I"
lang = "pt-BR"
url = "https://laman.hittites.org/cth/51/"
shortArticle = true
intro = ["Suppiluliuma I governou Hati no século XIV a.C. Suas campanhas estenderam o domínio hitita ao norte da Síria, onde colocou o filho Piyassili no trono de Carquemis. Seu acordo com Shattiwaza de Mitani uniu o apoio a um pretendente ao trono a uma nova ordem política."]
sections = [{ title = "Hati e a sucessão em Mitani", paragraphs = ["Os textos cuneiformes CTH 51 e 52 narram acontecimentos em nome dos dois governantes. Eles descrevem o apoio de Suppiluliuma a Shattiwaza e a campanha em que o pretendente e Piyassili atravessaram o Eufrates. Também definem a relação territorial entre Carquemis e Mitani. Os dois governantes têm voz nos documentos, mas os estudiosos interpretam o acordo como uma relação de subordinação de Mitani a Hati. Os textos tinham finalidade diplomática. Por isso, historiadores distinguem os relatos dos preâmbulos e as obrigações registradas."] }]
sources = [{ title = "LAMAN, CTH 51, Treaty of Šuppiluliuma I with Šattiwaza", url = "https://laman.hittites.org/cth/51/" }, { title = "LAMAN, CTH 52.I, Treaty of Šattiwaza with Šuppiluliuma I", url = "https://laman.hittites.org/cth/52.I/" }, { title = "Gary Beckman, Hittite Diplomatic Texts", url = "https://www.jstor.org/stable/jj.25577269" }, { title = "Orient 51, The Hittite Noun išḫiul-", url = "https://www.jstage.jst.go.jp/article/orient/51/0/51_143/_pdf" }, { title = "Orient 55, Hittite administration of Carchemish", url = "https://www.jstage.jst.go.jp/article/orient/55/0/55_29/_pdf/-char/en" }]
