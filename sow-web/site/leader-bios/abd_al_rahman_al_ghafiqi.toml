  "ʿAbd al-Rahman ibn ʿAbd Allah al-Ghafiqi war Statthalter des umayyadischen al-Andalus und führte einen großen Feldzug nördlich der Pyrenäen. Die erhaltenen Berichte schildern Route und Kämpfe, bestätigen jedoch nicht alle späteren Legenden über die Schlacht oder deren Ausmaß.",
