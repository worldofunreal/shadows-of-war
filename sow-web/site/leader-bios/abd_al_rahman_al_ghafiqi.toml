[articles.pt]
text = "Uma crônica ibérica próxima dos acontecimentos relata que o exército de al-Ghafiqi atravessou áreas montanhosas bascas, entrou em território franco e combateu o duque Eudo da Aquitânia perto dos rios Garona e Dordonha. Eudo teria fugido enquanto a campanha prosseguia. Estudos modernos descrevem a expedição como uma invasão da Aquitânia e registram que Eudo depois pediu ajuda a Carlos Martel. Os exércitos se encontraram na rota entre Tours e Poitiers. Esses relatos situam o comando de al-Ghafiqi em um conflito de fronteira entre o al-Andalus omíada, a Aquitânia e os domínios francos. Al-Ghafiqi morreu na batalha; Oxford observa que seu exército recuou em boa ordem. O confronto é geralmente chamado de Batalha de Tours ou de Poitiers. A data tradicional é outubro de 732, mas alguns estudiosos propõem o fim de 733 ou 734 com base na cronologia ibérica. O local exato e a importância mais ampla do combate também são debatidos. Por isso, este relato não trata como fatos estabelecidos uma data única, números de baixas ou a afirmação de que a batalha encerrou definitivamente a presença muçulmana na Europa Ocidental."
title = "Abd al-Rahman al-Ghafiqi"
lang = "pt"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Governador omíada, comandou uma campanha além dos Pireneus até a Aquitânia; a data da batalha perto de Tours é debatida."
shortArticle = true
intro = [
  "ʿAbd al-Rahman ibn ʿAbd Allah al-Ghafiqi foi governador de al-Andalus sob os omíadas e liderou uma grande expedição ao norte dos Pireneus. Os relatos preservados descrevem o percurso e os combates, mas não confirmam todas as lendas posteriores sobre a batalha ou sua dimensão.",
