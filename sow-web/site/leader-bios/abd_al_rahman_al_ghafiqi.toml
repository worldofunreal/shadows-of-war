[articles.en]
text = "A near-contemporary Iberian chronicle says al-Ghafiqi’s army crossed mountainous Basque country, entered Frankish lands, fought Duke Eudo of Aquitaine near the Garonne and Dordogne, and continued after Eudo fled. Modern scholarship describes the campaign as an invasion of Aquitaine and records that Eudo later sought help from Charles Martel. Their armies met on the route between Tours and Poitiers. These reports place al-Ghafiqi’s command in a frontier conflict among Umayyad al-Andalus, Aquitaine, and the Frankish realms. Al-Ghafiqi was killed in the battle; Oxford notes that his army withdrew in good order. The encounter is commonly called the Battle of Tours or Poitiers. Its traditional date is October 732, but scholars have argued for late 733 or 734 based on Iberian chronology. The precise site and the battle’s broader significance are also disputed. This account therefore avoids treating one date, casualty total, or claim that the battle permanently ended Muslim activity in western Europe as settled fact."
title = "Abd al-Rahman al-Ghafiqi"
lang = "en"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "An Umayyad governor whose campaign crossed the Pyrenees into Aquitaine and ended in the disputed battle near Tours."
shortArticle = true
intro = [
  "ʿAbd al-Rahman ibn ʿAbd Allah al-Ghafiqi served as governor of Umayyad al-Andalus and led a major expedition north of the Pyrenees. Surviving accounts describe the route and clashes, but do not support every later legend about the battle or its scale.",
]
sections = [
  { "title" = "Campaign across the Pyrenees", "paragraphs" = [
    "A near-contemporary Iberian chronicle says al-Ghafiqi’s army crossed mountainous Basque country, entered Frankish lands, fought Duke Eudo of Aquitaine near the Garonne and Dordogne, and continued after Eudo fled. Modern scholarship describes the campaign as an invasion of Aquitaine and records that Eudo later sought help from Charles Martel. Their armies met on the route between Tours and Poitiers. These reports place al-Ghafiqi’s command in a frontier conflict among Umayyad al-Andalus, Aquitaine, and the Frankish realms.",
    "Al-Ghafiqi was killed in the battle; Oxford notes that his army withdrew in good order. The encounter is commonly called the Battle of Tours or Poitiers. Its traditional date is October 732, but scholars have argued for late 733 or 734 based on Iberian chronology. The precise site and the battle’s broader significance are also disputed. This account therefore avoids treating one date, casualty total, or claim that the battle permanently ended Muslim activity in western Europe as settled fact."
  ] },
]
sources = [
  { "title" = "Battle of Tours (732?), Oxford Bibliographies", "url" = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false" },
  { "title" = "Chronica Muzarabica 0047, University of Cologne", "url" = "https://saraceni.uni-koeln.de/wiki/Chronica_Muzarabica_0047" },
]

[articles.es]
text = "Una crónica ibérica cercana a los hechos cuenta que el ejército de al-Ghafiqi atravesó zonas montañosas vascas, entró en territorio franco y combatió contra el duque Eudes de Aquitania cerca de los ríos Garona y Dordoña. La crónica relata que Eudes huyó y que la campaña continuó. La investigación moderna describe la expedición como una invasión de Aquitania y señala que Eudes pidió después ayuda a Carlos Martel. Los ejércitos se enfrentaron en la ruta entre Tours y Poitiers. Estos relatos sitúan el mando de al-Ghafiqi en un conflicto fronterizo entre al-Ándalus omeya, Aquitania y los dominios francos. Al-Ghafiqi murió en la batalla; Oxford señala que su ejército se retiró en buen orden. El enfrentamiento suele llamarse batalla de Tours o de Poitiers. La fecha tradicional es octubre de 732, pero algunos estudiosos proponen finales de 733 o 734 a partir de la cronología ibérica. También se discuten el lugar exacto y la importancia general de la batalla. Por eso este relato no presenta como hechos seguros una fecha única, cifras de bajas ni la idea de que el combate acabó definitivamente con la presencia musulmana en Europa occidental."
title = "Abd al-Rahman al-Ghafiqi"
lang = "es"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Gobernador omeya de al-Ándalus; su campaña cruzó los Pirineos y terminó en la batalla, de fecha discutida, cerca de Tours."
shortArticle = true
intro = [
  "ʿAbd al-Rahman ibn ʿAbd Allah al-Ghafiqi fue gobernador de al-Ándalus bajo los omeyas y dirigió una expedición al norte de los Pirineos. Las fuentes conservadas describen la ruta y los combates, pero no respaldan todas las leyendas posteriores sobre la batalla ni su escala.",
