    "Al-Ghafiqi fut tué lors de la bataille; Oxford précise que son armée se retira en bon ordre. L’affrontement est généralement appelé bataille de Tours ou de Poitiers. La date traditionnelle est octobre 732, mais certains chercheurs proposent la fin de 733 ou 734 à partir de la chronologie ibérique. Le lieu exact et la portée générale de la bataille sont également débattus. Ce récit ne présente donc comme certains ni une date unique, ni des chiffres de pertes, ni l’idée que le combat mit définitivement fin à la présence musulmane en Europe occidentale."
  ] },
]
sources = [
  { "title" = "Battle of Tours (732?), Oxford Bibliographies", "url" = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false" },
