[articles.zh]
text = "一部接近事件年代的伊比利亚编年史称，加菲基的军队穿越巴斯克山区，进入法兰克人的领地，并在加龙河和多尔多涅河附近与阿基坦公爵欧多交战。编年史记载欧多逃离后，远征仍继续进行。现代研究将这次行动描述为对阿基坦的入侵，并指出欧多随后向查理·马特尔求援。双方军队在图尔和普瓦捷之间的道路上相遇。这些记载将加菲基的指挥置于倭马亚安达卢斯、阿基坦和法兰克诸势力之间的边境冲突之中，也说明这不是一场与周边政治毫无关系的单独战役。 加菲基在战斗中阵亡；牛津的研究指出，他的军队有秩序地撤退。这场冲突通常称为图尔战役或普瓦捷战役。传统说法将其日期定在732年10月，但一些学者依据伊比利亚年代记录，认为可能发生于733年末或734年。具体战场和这场战斗更广泛的历史意义也仍有争论。因此，本文不把单一日期、伤亡数字，或战斗永久终止穆斯林在西欧活动的说法，当作已经确定的事实。此外，研究者指出，战斗发生后，穆斯林军队仍继续袭扰法兰克领地，所以不能把这场交战写成西欧军事行动的绝对终点。它属于八世纪伊比利亚、阿基坦与法兰克势力彼此竞争的更长历史过程。史料的年代记录、叙述立场和保存状况各不相同，现代研究也会重新比较这些证据。阅读这段历史时，应将可由编年史支持的行动，与后来赋予战役的象征意义分开；这样既能看见阿尔-加菲基所率远征的真实范围，也不会把争论中的解释误当作确定事实。"
title = "阿卜杜勒-拉赫曼·加菲基"
lang = "zh"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "这位倭马亚王朝安达卢斯总督越过比利牛斯山远征阿基坦；图尔附近战役的年代仍有争议。"
shortArticle = true
intro = [
  "阿卜杜勒-拉赫曼·伊本·阿卜杜拉·加菲基曾任倭马亚王朝安达卢斯的总督，并率领一支大军越过比利牛斯山向北远征。现存史料记载了行军路线和交战经过，但并不能证实后世有关战役规模的所有传说。",
]
sections = [
  { "title" = "越过比利牛斯山的远征", "paragraphs" = [
    "一部接近事件年代的伊比利亚编年史称，加菲基的军队穿越巴斯克山区，进入法兰克人的领地，并在加龙河和多尔多涅河附近与阿基坦公爵欧多交战。编年史记载欧多逃离后，远征仍继续进行。现代研究将这次行动描述为对阿基坦的入侵，并指出欧多随后向查理·马特尔求援。双方军队在图尔和普瓦捷之间的道路上相遇。这些记载将加菲基的指挥置于倭马亚安达卢斯、阿基坦和法兰克诸势力之间的边境冲突之中，也说明这不是一场与周边政治毫无关系的单独战役。",
    "加菲基在战斗中阵亡；牛津的研究指出，他的军队有秩序地撤退。这场冲突通常称为图尔战役或普瓦捷战役。传统说法将其日期定在732年10月，但一些学者依据伊比利亚年代记录，认为可能发生于733年末或734年。具体战场和这场战斗更广泛的历史意义也仍有争论。因此，本文不把单一日期、伤亡数字，或战斗永久终止穆斯林在西欧活动的说法，当作已经确定的事实。此外，研究者指出，战斗发生后，穆斯林军队仍继续袭扰法兰克领地，所以不能把这场交战写成西欧军事行动的绝对终点。它属于八世纪伊比利亚、阿基坦与法兰克势力彼此竞争的更长历史过程。史料的年代记录、叙述立场和保存状况各不相同，现代研究也会重新比较这些证据。阅读这段历史时，应将可由编年史支持的行动，与后来赋予战役的象征意义分开；这样既能看见阿尔-加菲基所率远征的真实范围，也不会把争论中的解释误当作确定事实。"
  ] },
]
sources = [
  { "title" = "Battle of Tours (732?), Oxford Bibliographies", "url" = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false" },
  { "title" = "Chronica Muzarabica 0047, University of Cologne", "url" = "https://saraceni.uni-koeln.de/wiki/Chronica_Muzarabica_0047" },
]

[articles.ja]
text = "事件に比較的近い時代のイベリア年代記によれば、アル＝ガーフィキーの軍はバスク地方の山地を越えてフランク領へ入り、ガロンヌ川とドルドーニュ川の近くでアキテーヌ公エウドと戦った。年代記はエウドが逃れた後も遠征が続いたと記す。近年の研究はこの進軍をアキテーヌへの侵攻と説明し、エウドが後にシャルル・マルテルへ援軍を求めたことを伝えている。両軍はトゥールとポワティエの間の道で対峙した。こうした記録は、アル＝ガーフィキーの指揮をウマイヤ朝アンダルス、アキテーヌ、フランク諸勢力の境界紛争の中に位置づける。 アル＝ガーフィキーはこの戦いで命を落とした。オックスフォードの研究は、彼の軍が秩序を保って退却したと記す。この戦いは一般にトゥールの戦い、またはポワティエの戦いと呼ばれる。伝統的には732年10月とされるが、イベリアの年代記を根拠に733年末または734年とする研究者もいる。正確な場所や戦いの歴史的意義にも議論がある。そのため本稿では、単一の日付、死傷者数、あるいはこの戦いが西ヨーロッパのイスラム勢力を永久に終わらせたという説を確定した事実として扱わない。また、史料の偏りや年代記の食い違いを考慮し、断定できる範囲を区別する必要がある。"
title = "アブド・アッラフマーン・アル＝ガーフィキー"
lang = "ja"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "ウマイヤ朝アンダルスの総督としてピレネーを越えアキテーヌへ遠征した。トゥール近郊の戦いの年代には異説がある。"
shortArticle = true
intro = [
  "アブド・アッラフマーン・イブン・アブドゥッラー・アル＝ガーフィキーは、ウマイヤ朝統治下のアンダルスで総督を務め、ピレネー山脈の北へ大規模な遠征を率いた。現存する記録は進軍経路と戦闘を伝えるが、後世に語られた戦いの規模に関する伝説すべてを裏付けるものではない。",
]
sections = [
  { "title" = "ピレネーを越えた遠征", "paragraphs" = [
    "事件に比較的近い時代のイベリア年代記によれば、アル＝ガーフィキーの軍はバスク地方の山地を越えてフランク領へ入り、ガロンヌ川とドルドーニュ川の近くでアキテーヌ公エウドと戦った。年代記はエウドが逃れた後も遠征が続いたと記す。近年の研究はこの進軍をアキテーヌへの侵攻と説明し、エウドが後にシャルル・マルテルへ援軍を求めたことを伝えている。両軍はトゥールとポワティエの間の道で対峙した。こうした記録は、アル＝ガーフィキーの指揮をウマイヤ朝アンダルス、アキテーヌ、フランク諸勢力の境界紛争の中に位置づける。",
    "アル＝ガーフィキーはこの戦いで命を落とした。オックスフォードの研究は、彼の軍が秩序を保って退却したと記す。この戦いは一般にトゥールの戦い、またはポワティエの戦いと呼ばれる。伝統的には732年10月とされるが、イベリアの年代記を根拠に733年末または734年とする研究者もいる。正確な場所や戦いの歴史的意義にも議論がある。そのため本稿では、単一の日付、死傷者数、あるいはこの戦いが西ヨーロッパのイスラム勢力を永久に終わらせたという説を確定した事実として扱わない。また、史料の偏りや年代記の食い違いを考慮し、断定できる範囲を区別する必要がある。"
  ] },
]
