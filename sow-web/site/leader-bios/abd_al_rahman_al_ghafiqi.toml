[articles.vi]
text = "Một biên niên sử Iberia gần thời điểm sự kiện ghi rằng quân của al-Ghafiqi vượt qua vùng núi của người Basque, tiến vào đất Frank và giao chiến với công tước Eudo xứ Aquitaine gần sông Garonne và Dordogne. Theo biên niên sử, Eudo bỏ chạy trong khi chiến dịch tiếp tục. Nghiên cứu hiện đại mô tả đây là cuộc tiến công vào Aquitaine và cho biết Eudo sau đó tìm sự trợ giúp của Charles Martel. Hai đạo quân gặp nhau trên tuyến đường giữa Tours và Poitiers. Các ghi chép đặt quyền chỉ huy của al-Ghafiqi trong một cuộc xung đột biên giới giữa al-Andalus thời Umayyad, Aquitaine và các lãnh địa Frank. Al-Ghafiqi tử trận; Oxford ghi nhận quân đội của ông rút lui có trật tự. Cuộc giao chiến thường được gọi là trận Tours hoặc Poitiers. Niên đại truyền thống là tháng 10 năm 732, nhưng một số học giả dựa trên niên đại Iberia và đề xuất cuối năm 733 hoặc năm 734. Địa điểm chính xác và ý nghĩa rộng hơn của trận đánh cũng còn tranh luận. Vì vậy, bài viết không coi một niên đại duy nhất, số thương vong hay nhận định rằng trận đánh chấm dứt vĩnh viễn sự hiện diện của người Hồi giáo ở Tây Âu là sự thật đã được xác lập."
title = "Abd al-Rahman al-Ghafiqi"
lang = "vi"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
