[articles.id]
text = "Sebuah kronik Iberia yang dekat dengan masa peristiwa itu menyebut pasukan al-Ghafiqi melintasi wilayah pegunungan Basque, memasuki daerah Franka, lalu bertempur melawan Adipati Eudo dari Aquitaine di dekat sungai Garonne dan Dordogne. Menurut kronik, Eudo melarikan diri sementara ekspedisi berlanjut. Kajian modern menggambarkan gerakan itu sebagai invasi ke Aquitaine dan mencatat bahwa Eudo kemudian meminta bantuan Charles Martel. Kedua pasukan bertemu di jalur antara Tours dan Poitiers. Catatan ini menempatkan kepemimpinan al-Ghafiqi dalam konflik perbatasan antara Al-Andalus Umayyah, Aquitaine, dan wilayah Franka. Al-Ghafiqi gugur dalam pertempuran; Oxford mencatat bahwa pasukannya mundur dengan tertib. Pertempuran itu biasanya disebut Pertempuran Tours atau Poitiers. Tanggal tradisionalnya adalah Oktober 732, tetapi sejumlah sejarawan mengusulkan akhir 733 atau 734 berdasarkan kronologi Iberia. Lokasi persis dan makna yang lebih luas juga diperdebatkan. Karena itu, tulisan ini tidak menyajikan satu tanggal, jumlah korban, atau klaim bahwa pertempuran tersebut secara permanen mengakhiri keberadaan Muslim di Eropa Barat sebagai fakta yang sudah pasti."
title = "Abd al-Rahman al-Ghafiqi"
lang = "id"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
