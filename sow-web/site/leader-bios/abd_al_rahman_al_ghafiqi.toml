[articles.ru]
text = "Близкая к событиям иберийская хроника сообщает, что войско аль-Гафики пересекло горные земли басков, вступило на франкскую территорию и сражалось с герцогом Аквитании Эдом у рек Гаронны и Дордони. По хронике, Эд бежал, а поход продолжился. Современные исследования называют выступление вторжением в Аквитанию и отмечают, что позднее Эд обратился за помощью к Карлу Мартеллу. Их армии встретились на дороге между Туром и Пуатье. Эти сообщения помещают командование аль-Гафики в пограничный конфликт между Омейским аль-Андалусом, Аквитанией и франкскими владениями. Аль-Гафики погиб в битве; Oxford отмечает, что его войско отступило организованно. Столкновение обычно называют битвой при Туре или Пуатье. Традиционная дата — октябрь 732 года, однако некоторые исследователи, опираясь на иберийскую хронологию, предлагают конец 733-го или 734 год. Точное место и более широкое значение битвы также обсуждаются. Поэтому здесь не выдаются за установленные факты одна конкретная дата, число потерь или утверждение, будто сражение навсегда прекратило мусульманское присутствие в Западной Европе."
title = "Абд ар-Рахман аль-Гафики"
lang = "ru"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Омейский наместник провёл поход через Пиренеи в Аквитанию; дата битвы у Тура остаётся предметом споров."
shortArticle = true
intro = [
  "Абд ар-Рахман ибн Абдаллах аль-Гафики был наместником Омейского аль-Андалуса и возглавил крупный поход к северу от Пиренеев. Сохранившиеся свидетельства описывают маршрут и столкновения, но не подтверждают все поздние легенды о битве и её масштабе.",
]
sections = [
