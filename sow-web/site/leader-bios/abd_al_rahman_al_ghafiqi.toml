[articles.fr]
text = "Une chronique ibérique proche des événements rapporte que l’armée d’al-Ghafiqi traversa les régions montagneuses basques, entra en territoire franc et combattit le duc Eudes d’Aquitaine près de la Garonne et de la Dordogne. Eudes aurait fui tandis que l’expédition se poursuivait. Les travaux modernes décrivent l’opération comme une invasion de l’Aquitaine et indiquent qu’Eudes demanda ensuite l’aide de Charles Martel. Leurs armées se rencontrèrent sur la route entre Tours et Poitiers. Ces récits replacent le commandement d’al-Ghafiqi dans un conflit frontalier entre l’al-Andalus omeyyade, l’Aquitaine et les territoires francs. Al-Ghafiqi fut tué lors de la bataille; Oxford précise que son armée se retira en bon ordre. L’affrontement est généralement appelé bataille de Tours ou de Poitiers. La date traditionnelle est octobre 732, mais certains chercheurs proposent la fin de 733 ou 734 à partir de la chronologie ibérique. Le lieu exact et la portée générale de la bataille sont également débattus. Ce récit ne présente donc comme certains ni une date unique, ni des chiffres de pertes, ni l’idée que le combat mit définitivement fin à la présence musulmane en Europe occidentale."
title = "Abd al-Rahman al-Ghafiqi"
lang = "fr"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Gouverneur omeyyade, il mena une campagne au-delà des Pyrénées jusqu’en Aquitaine; la date de la bataille près de Tours reste discutée."
shortArticle = true
intro = [
  "ʿAbd al-Rahman ibn ʿAbd Allah al-Ghafiqi gouverna al-Andalus sous les Omeyyades et dirigea une importante expédition au nord des Pyrénées. Les récits conservés décrivent l’itinéraire et les combats, mais ne confirment pas toutes les légendes postérieures sur la bataille ou son ampleur.",
]
