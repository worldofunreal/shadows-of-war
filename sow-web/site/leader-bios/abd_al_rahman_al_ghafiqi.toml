[articles.fil]
text = "Isinalaysay ng isang kronikang Iberian na malapit sa panahong iyon na tumawid ang hukbo ni al-Ghafiqi sa kabundukan ng mga Basque, pumasok sa lupain ng mga Frank, at nakipaglaban kay Duke Eudo ng Aquitaine malapit sa mga ilog ng Garonne at Dordogne. Ayon sa kronika, tumakas si Eudo habang nagpatuloy ang kampanya. Inilalarawan ng makabagong pananaliksik ang pagsulong bilang pananakop sa Aquitaine at itinatala na humingi kalaunan si Eudo ng tulong kay Charles Martel. Nagtagpo ang kanilang mga hukbo sa daan sa pagitan ng Tours at Poitiers. Inilalagay ng mga salaysay ang pamumuno ni al-Ghafiqi sa isang tunggalian sa hangganan ng Umayyad al-Andalus, Aquitaine, at mga lupain ng Frank. Napatay si al-Ghafiqi sa labanan; ayon sa Oxford, maayos na umatras ang kanyang hukbo. Karaniwang tinatawag ang sagupaan na Labanan sa Tours o Poitiers. Tradisyonal na itinatakda ito sa Oktubre 732, ngunit may mga iskolar na nagmumungkahi ng huling bahagi ng 733 o 734 batay sa kronolohiyang Iberian. Pinagtatalunan din ang eksaktong lugar at ang mas malawak na kahalagahan nito. Kaya hindi itinuturing ng salaysay na ito bilang tiyak ang iisang petsa, bilang ng nasawi, o pahayag na tuluyan nitong tinapos ang presensiyang Muslim sa Kanlurang Europa."
title = "Abd al-Rahman al-Ghafiqi"
lang = "fil"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Pinamunuan ng gobernador ng Umayyad al-Andalus ang kampanyang tumawid sa Pyrenees patungong Aquitaine; pinagtatalunan ang petsa ng labanan malapit sa Tours."
