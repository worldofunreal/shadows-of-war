[articles.ar]
text = "تذكر مدونة إيبيرية كُتبت بعد الأحداث بوقت قريب أن جيش الغافقي اجتاز مناطق الباسك الجبلية ودخل أراضي الفرنجة، ثم قاتل دوق آكيتين أودو قرب نهري غارون ودوردوني. وتقول المدونة إن أودو فرّ بينما واصلت الحملة تقدمها. وتصف دراسات حديثة هذا التحرك بأنه اجتياح لآكيتين، وتشير إلى أن أودو طلب لاحقاً مساعدة شارل مارتل. والتقى الجيشان على الطريق بين تور وبواتييه. وتضع هذه الروايات قيادة الغافقي ضمن صراع حدودي بين الأندلس الأموية وآكيتين وممالك الفرنجة. قُتل الغافقي في المعركة؛ وتشير دراسة أكسفورد إلى أن جيشه انسحب بانتظام. ويُعرف الاشتباك عادة بمعركة تور أو بواتييه. ويؤرخ التقليد المعركة بأكتوبر 732، لكن بعض الباحثين يرجحون أواخر 733 أو سنة 734 استناداً إلى التسلسل الزمني الإيبيري. كما يظل موقعها الدقيق وأهميتها الأوسع موضع نقاش. لذلك لا يعرض هذا النص تاريخاً واحداً أو أعداداً للقتلى أو القول إن المعركة أنهت نهائياً الوجود الإسلامي في أوروبا الغربية بوصفها حقائق محسومة."
title = "عبد الرحمن الغافقي"
lang = "ar"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "قاد والي الأندلس الأموي حملة عبر جبال البرانس إلى آكيتين؛ وما زال تاريخ المعركة قرب تور موضع نقاش."
shortArticle = true
intro = [
  "تولى عبد الرحمن بن عبد الله الغافقي ولاية الأندلس في العصر الأموي، وقاد حملة كبيرة إلى شمال جبال البرانس. وتصف الروايات الباقية مسار الحملة والاشتباكات، لكنها لا تثبت جميع الأساطير اللاحقة عن حجم المعركة.",
