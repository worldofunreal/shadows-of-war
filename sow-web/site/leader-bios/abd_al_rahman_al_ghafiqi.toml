[articles.it]
text = "Una cronaca iberica vicina agli eventi racconta che l’esercito di al-Ghafiqi attraversò le zone montuose basche, entrò in territorio franco e combatté il duca Eudo d’Aquitania presso i fiumi Garonna e Dordogna. Eudo sarebbe fuggito mentre la campagna proseguiva. Gli studi moderni descrivono la spedizione come un’invasione dell’Aquitania e riferiscono che in seguito Eudo chiese aiuto a Carlo Martello. I loro eserciti si scontrarono sulla strada tra Tours e Poitiers. Questi resoconti collocano il comando di al-Ghafiqi in un conflitto di frontiera fra l’al-Andalus omayyade, l’Aquitania e i territori franchi. Al-Ghafiqi morì nello scontro; Oxford osserva che il suo esercito si ritirò in buon ordine. La battaglia è chiamata di solito battaglia di Tours o di Poitiers. La data tradizionale è ottobre 732, ma alcuni studiosi propongono la fine del 733 o il 734 sulla base della cronologia iberica. Anche il luogo preciso e il significato più ampio dello scontro sono discussi. Perciò questo resoconto non presenta come certi una sola data, il numero delle perdite o l’affermazione che la battaglia pose fine per sempre alla presenza musulmana nell’Europa occidentale."
title = "Abd al-Rahman al-Ghafiqi"
lang = "it"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
