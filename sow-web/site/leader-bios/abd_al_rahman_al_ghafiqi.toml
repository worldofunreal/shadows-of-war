[articles.de]
text = "Eine zeitnahe iberische Chronik berichtet, al-Ghafiqis Heer habe das gebirgige Baskenland durchquert, fränkisches Gebiet betreten und nahe Garonne und Dordogne gegen Herzog Eudo von Aquitanien gekämpft. Eudo sei geflohen, während der Feldzug weiterging. Die moderne Forschung beschreibt den Vorstoß als Invasion Aquitaniens und hält fest, dass Eudo später Karl Martell um Hilfe bat. Ihre Heere trafen auf der Route zwischen Tours und Poitiers aufeinander. Die Berichte verorten al-Ghafiqis Führung in einem Grenzkonflikt zwischen dem umayyadischen al-Andalus, Aquitanien und den fränkischen Herrschaftsgebieten. Al-Ghafiqi fiel in der Schlacht; Oxford zufolge zog sich sein Heer geordnet zurück. Die Auseinandersetzung wird meist Schlacht bei Tours oder Poitiers genannt. Als traditionelles Datum gilt Oktober 732, doch manche Forschende setzen sie aufgrund iberischer Chronologie auf Ende 733 oder 734. Auch der genaue Ort und die weiterreichende Bedeutung der Schlacht bleiben umstritten. Deshalb behandelt dieser Text weder ein einzelnes Datum noch Verlustzahlen oder die Behauptung, die Schlacht habe die muslimische Präsenz in Westeuropa dauerhaft beendet, als gesicherte Tatsachen."
title = "Abd al-Rahman al-Ghafiqi"
lang = "de"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Ein umayyadischer Statthalter führte einen Feldzug über die Pyrenäen nach Aquitanien; das Ende bei Tours ist umstritten datiert."
