[articles.ko]
text = "사건과 가까운 시기에 작성된 이베리아 연대기는 알가피키의 군대가 바스크 산악 지대를 지나 프랑크 영토로 들어갔고, 가론강과 도르도뉴강 부근에서 아키텐 공작 에우도와 싸웠다고 전한다. 연대기에 따르면 에우도가 달아난 뒤에도 원정은 계속되었다. 현대 연구는 이를 아키텐 침공으로 설명하며, 에우도가 뒤이어 샤를 마르텔에게 도움을 요청했다고 기록한다. 양측 군대는 투르와 푸아티에 사이의 길에서 맞붙었다. 이 기록은 알가피키의 지휘를 우마이야 왕조의 알안달루스, 아키텐, 프랑크 세력 사이의 국경 분쟁 속에 놓는다. 알가피키는 전투에서 전사했다. 옥스퍼드 연구는 그의 군대가 질서를 유지하며 후퇴했다고 설명한다. 이 충돌은 보통 투르 전투 또는 푸아티에 전투라고 불린다. 전통적인 날짜는 732년 10월이지만, 일부 연구자는 이베리아 연대기를 근거로 733년 말이나 734년으로 본다. 정확한 전장과 전투의 더 넓은 의미도 논쟁 중이다. 따라서 이 글은 하나의 날짜나 사상자 수, 혹은 이 전투가 서유럽에서 무슬림 활동을 영구히 끝냈다는 주장을 확정된 사실로 다루지 않는다."
title = "압드 알라흐만 알가피키"
lang = "ko"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "우마이야 왕조의 알안달루스 총독으로서 피레네를 넘어 아키텐으로 진군했다. 투르 인근 전투의 연대는 논쟁 중이다."
shortArticle = true
intro = [
  "압드 알라흐만 이븐 압둘라 알가피키는 우마이야 왕조 아래 알안달루스의 총독을 지냈으며 피레네 산맥 북쪽으로 대규모 원정을 이끌었다. 남아 있는 기록은 진군 경로와 전투를 설명하지만, 전투의 규모를 둘러싼 후대의 모든 전설을 입증하지는 않는다.",
]
sections = [
  { "title" = "피레네 산맥을 넘은 원정", "paragraphs" = [
    "사건과 가까운 시기에 작성된 이베리아 연대기는 알가피키의 군대가 바스크 산악 지대를 지나 프랑크 영토로 들어갔고, 가론강과 도르도뉴강 부근에서 아키텐 공작 에우도와 싸웠다고 전한다. 연대기에 따르면 에우도가 달아난 뒤에도 원정은 계속되었다. 현대 연구는 이를 아키텐 침공으로 설명하며, 에우도가 뒤이어 샤를 마르텔에게 도움을 요청했다고 기록한다. 양측 군대는 투르와 푸아티에 사이의 길에서 맞붙었다. 이 기록은 알가피키의 지휘를 우마이야 왕조의 알안달루스, 아키텐, 프랑크 세력 사이의 국경 분쟁 속에 놓는다.",
    "알가피키는 전투에서 전사했다. 옥스퍼드 연구는 그의 군대가 질서를 유지하며 후퇴했다고 설명한다. 이 충돌은 보통 투르 전투 또는 푸아티에 전투라고 불린다. 전통적인 날짜는 732년 10월이지만, 일부 연구자는 이베리아 연대기를 근거로 733년 말이나 734년으로 본다. 정확한 전장과 전투의 더 넓은 의미도 논쟁 중이다. 따라서 이 글은 하나의 날짜나 사상자 수, 혹은 이 전투가 서유럽에서 무슬림 활동을 영구히 끝냈다는 주장을 확정된 사실로 다루지 않는다."
  ] },
]
