    "Близкая к событиям иберийская хроника сообщает, что войско аль-Гафики пересекло горные земли басков, вступило на франкскую территорию и сражалось с герцогом Аквитании Эдом у рек Гаронны и Дордони. По хронике, Эд бежал, а поход продолжился. Современные исследования называют выступление вторжением в Аквитанию и отмечают, что позднее Эд обратился за помощью к Карлу Мартеллу. Их армии встретились на дороге между Туром и Пуатье. Эти сообщения помещают командование аль-Гафики в пограничный конфликт между Омейским аль-Андалусом, Аквитанией и франкскими владениями.",
