[articles.tr]
text = "Olaylara yakın dönemde yazılmış bir İber kroniği, al-Gafiki’nin ordusunun dağlık Bask bölgelerini geçtiğini, Frank topraklarına girdiğini ve Akitanya Dükü Eudes ile Garonne ve Dordogne nehirleri yakınlarında savaştığını bildirir. Kroniğe göre Eudes kaçarken sefer devam etti. Modern araştırmalar bu harekâtı Akitanya’nın işgali olarak tanımlar ve Eudes’in daha sonra Charles Martel’den yardım istediğini belirtir. Ordular Tours ile Poitiers arasındaki güzergâhta karşılaştı. Bu kayıtlar, al-Gafiki’nin komutasını Emevî Endülüsü, Akitanya ve Frank toprakları arasındaki bir sınır çatışması bağlamına yerleştirir. Al-Gafiki savaşta öldürüldü; Oxford, ordusunun düzenini koruyarak geri çekildiğini belirtir. Çatışma genellikle Tours ya da Poitiers Savaşı olarak anılır. Geleneksel tarih Ekim 732’dir, ancak bazı araştırmacılar İber kronolojisine dayanarak 733’ün sonlarını veya 734’ü önerir. Kesin konum ve savaşın daha geniş tarihsel önemi de tartışmalıdır. Bu nedenle burada tek bir tarih, kayıp sayısı ya da savaşın Batı Avrupa’daki Müslüman varlığını kalıcı biçimde sona erdirdiği iddiası kesinleşmiş bilgi olarak sunulmaz."
title = "Abd al-Rahman el-Gafiki"
lang = "tr"
url = "https://academic.oup.com/reference/62399/reference-article-abstract/555384777?login=false"
highlight = "Emevî Endülüsü valisi, Pireneler’i aşarak Akitanya’ya uzanan sefere komuta etti; Tours yakınındaki savaşın tarihi tartışmalıdır."
