[articles.en]
text = "Charles V was Holy Roman Emperor and Archduke of Austria from 1519 to 1556, King of Spain from 1516 to 1556, King of Sicily and Naples from 1516 to 1554, and also Lord of the Netherlands and titular Duke of Burgundy from 1506 to 1555. He was heir to and then head of the rising House of Habsburg."
title = "Charles V, Holy Roman Emperor"
lang = "en"
url = "https://en.wikipedia.org/wiki/Charles_V%2C_Holy_Roman_Emperor"
intro = [
  "Charles V (24 February 1500 – 21 September 1558) was Holy Roman Emperor and Archduke of Austria from 1519 to 1556, King of Spain (as Charles I) from 1516 to 1556, King of Sicily and Naples from 1516 to 1554, and also Lord of the Netherlands and titular Duke of Burgundy (as Charles II) from 1506 to 1555. He was heir to and then head of the rising House of Habsburg. His dominions in Europe included the Holy Roman Empire, extending from Germany to northern Italy with rule over the Austrian hereditary lands and Burgundian Low Countries, and Spain with its possessions of the southern Italian kingdoms of Sicily, Naples, and Sardinia. In the Americas, he oversaw the continuation of Spanish colonisation and a short-lived German colonisation. The personal union of the European and American territories he ruled was the first collection of realms labelled \"the empire on which the sun never sets\".",
  "Charles was born in Flanders to Habsburg Archduke Philip the Handsome, son of Maximilian I, Holy Roman Emperor and Mary of Burgundy, and Joanna of Castile, third child of Isabella I of Castile and Ferdinand II of Aragon, the Catholic Monarchs of Spain. Heir of his grandparents, Charles inherited his family's dominions at a young age. After his father's death in 1506, he inherited the Habsburg Netherlands in the Low Countries. In 1516, he became King of Spain as co-monarch of Castile and Aragon with his mother. Spain's possessions included the Castilian colonies of the Spanish West Indies and the Spanish Main, as well as Naples, Sicily and Sardinia. At the death of his paternal grandfather Maximilian in 1519, he inherited the Austrian hereditary lands and was elected as Holy Roman Emperor. He adopted the Imperial name of Charles V as his main title, and styled himself as a new Charlemagne.",
  "Charles revitalised the medieval concept of universal monarchy. With no fixed capital, he made 40 journeys through the different entities he ruled and spent a quarter of his reign travelling within his realms. Although his empire came to him peacefully, he spent most of his life waging war, exhausting his revenues and leaving debts in his attempt to defend the integrity of the Holy Roman Empire from the Protestant Reformation, the expansion of the Ottoman Empire, and in wars with France. Charles borrowed money from German and Italian bankers and, to repay them, relied on the wealth of the Low Countries and the flow of silver from New Spain and Peru, brought under his rule following the Spanish conquest of the Aztec and Inca empires, which caused widespread inflation. He supported the Magellan expedition, which resulted in the first circumnavigation of the world.",
  "Crowned King of Germany in Aachen, Charles sided with Pope Leo X and declared Martin Luther an outlaw at the Diet of Worms in 1521. The same year, Francis I of France, surrounded by the Habsburg possessions, started a war in Italy that led to his capture in the Battle of Pavia (1525). In 1527, Rome was sacked by an army of Charles's mutinous soldiers. Charles then defended Vienna from the Ottoman Turks and obtained coronations as King of Italy and Holy Roman Emperor from Pope Clement VII. In 1535, he took possession of Milan and captured Tunis. However, the loss of Buda during the struggle for Hungary and the Algiers expedition in the early 1540s frustrated his anti-Ottoman policies. After years of negotiations, Charles came to an agreement with Pope Paul III for the organisation of the Council of Trent (1545). The refusal of the Lutheran Schmalkaldic League to recognise the council's validity led to a war, won by Charles. However, Henry II of France offered new support to the Lutheran cause and strengthened the Franco-Ottoman alliance with Suleiman the Magnificent.",
]
sections = [
  { "title" = "Ancestry", "paragraphs" = [
      "Charles of Austria was born on 24 February 1500 in the Prinsenhof of Ghent, a Flemish city of the Habsburg Netherlands, to Philip the Handsome and Joanna of Trastámara. His father Philip, nicknamed Philip the Handsome, was the firstborn son of Maximilian I, Holy Roman Emperor, Archduke of Austria, and Mary of Burgundy, heiress to the Burgundian Netherlands. Charles's mother Joanna of Castile was a younger daughter of Ferdinand II of Aragon and Isabella I of Castile, the Catholic Monarchs of Spain from the House of Trastámara. The political marriage of Philip and Joanna was first conceived in a letter sent by Maximilian to Ferdinand, part of the establishment of an Austro-Spanish alliance opposed to the Kingdom of France in the context of the Italian Wars.",
      "From the moment he became King of the Romans in 1486, Charles's paternal grandfather Maximilian had carried a very financially risky policy of maximum expansionism, relying mostly on the resources of the Austrian hereditary lands. Even though it is often implied by, among others, Erasmus of Rotterdam, that Charles V and the Habsburgs gained their vast empire through peaceful policies (exemplified by the saying Bella gerant aliī, tū fēlix Austria nūbe / Nam quae Mars aliīs, dat tibi regna Venus or \"Let others wage war, but thou, O happy Austria, marry; for those kingdoms which Mars gives to others, Venus gives to thee\", reportedly spoken by Mathias Corvinus), Maximilian and his descendants fought wars aplenty. Maximilian fought 27 wars during his four decades of ruling.",
      "His general strategy was to combine his intricate systems of alliance, wars, military threats and offers of marriage to realise his expansionist ambitions. Ultimately, he succeeded in coercing Bohemia, Hungary and Poland into acquiescence in the Habsburgs' expansionist plan.",
    ] },
  { "title" = "Birth and childhood", "paragraphs" = [
      "Charles's mother went into labour at a ball in February 1500. He was named in honour of Charles the Bold of Burgundy, who had attempted to create a continuous Burgundian State stretching from the North Sea to Savoy. When Charles was born, a poet at the court reported that the people of Ghent \"shouted Austria and Burgundy throughout the whole city for three hours\" to celebrate his birth.",
      "Given the dynastic situation, the newborn was originally heir apparent only of the Habsburg Netherlands, being given the honorary title Duke of Luxembourg. He was also second in line to the Austrian duchies, becoming known in his early years simply as \"Charles of Ghent\". He was baptised at the Church of Saint John by the Bishop of Tournai. The Burgundian nobles Charles I de Croÿ and John III of Glymes were his godfathers, and Margaret of York and Margaret of Austria, Duchess of Savoy, respectively, his step-great-grandmother and aunt, his godmothers. Charles's baptism gifts were a sword and a helmet, objects of Burgundian chivalric tradition representing, respectively, the instrument of war and the symbol of peace. The death in July 1500 of the young heir presumptive Miguel de Paz to the Iberian realms of his maternal grandparents meant baby Charles's future inheritance potentially expanded to include Castile, Aragon, and the overseas possessions in the Americas.",
      "In 1501, his parents, Philip and Joanna, left Charles in the care of Philip's step-grandmother, Margaret of York, in Mechelen and went to Spain. The main goal of their Spanish mission was the recognition of Joanna as Princess of Asturias, following Prince Miguel's death a year earlier. They succeeded despite facing some opposition from the Castilian Cortes, which were reluctant to create the premises for Habsburg succession. In 1504, when her mother Isabella died, Joanna became Queen of Castile. Charles only met his father again in 1503 while his mother returned in 1504 (after giving birth to Ferdinand in Spain). The Spanish Ambassador Gutierre Gómez de Fuensalida reported that Philip often visited and they had lots of fun. The couple's unhappy marriage and Joanna's unstable mental state, however, created many difficulties, making it unsafe for the children to stay with the parents.",
    ] },
  { "title" = "Inheritances", "paragraphs" = [
      "The Burgundian inheritance included the Habsburg Netherlands, which consisted of a large number of lordships in the Low Countries and covered modern-day Belgium, Netherlands and Luxembourg. It also included the Free County of Burgundy (the region of Franche-Comté) and the County of Charolais, but excluded the Duchy of Burgundy, annexed by France in 1477. At the death of Philip in 1506, Charles was recognised as Lord of the Netherlands and count of Burgundy and Charolais, also becoming the titular Duke of Burgundy, and thus being styled as Duke Charles II of Burgundy.",
      "During his childhood and teen years, Charles lived in Mechelen together with his sisters Mary, Eleanor and Isabella at the court of his aunt Margaret of Austria, Duchess of Savoy. William de Croÿ (later prime minister) and Adrian of Utrecht (later Pope Adrian VI) served as his tutors. The culture and courtly life of the Low Countries played an important part in the development of Charles's beliefs. As a member of the Burgundian Order of the Golden Fleece in his infancy, and later its grandmaster, Charles was educated in the ideals of the medieval knights and the desire for Christian unity to fight the infidel. The Low Countries were very rich during his reign, both economically and culturally. Charles was very attached to his homeland and spent a large part of his life in Brussels and Flemish cities.",
      "The Spanish inheritance, resulting from a dynastic union of the crowns of Castile and Aragon, included Spain and the Castilian possessions in the Americas (the Spanish West Indies and the Province of Tierra Firme) and the Aragonese kingdoms of Naples, Sicily, and Sardinia. Joanna inherited these territories in 1516 while confined, allegedly because she was mentally ill. Charles, therefore, claimed the crowns for himself jure matris, thus becoming co-monarch with Joanna with the title of Charles I of Castile and Aragon or Charles I of Spain.",
    ] },
  { "title" = "Reign", "paragraphs" = [
      "In 1506, Charles inherited all of his father's territories in the Low Countries, thus becoming the ruler of the Habsburg Netherlands. His inheritance also included the Free County of Burgundy (region of Franche-Comté) within the Holy Roman Empire, and the County of Charolais in the Kingdom of France. and, most notably, the Low Countries. His territories in the Low Countries mostly lay within the Holy Roman Empire, and partially within the French realm. Thus, Charles's birthplace, the city of Ghent, belonged to the County of Flanders, at that time still being the fief of the French crown. Since he was a minor, his aunt Margaret of Austria acted as regent, as appointed by Emperor Maximilian, until 1515. She soon found herself at war with France over Charles's requirement to pay homage to the French king for Flanders, Artois and Charolais, as his father had done. The outcome was that France relinquished its ancient claim on Flanders and Artois in 1528.",
      "From 1515 to 1523, Charles's government in the Netherlands also had to contend with the rebellion of Frisian peasants (led by Pier Gerlofs Donia and Wijard Jelckama). The rebels were initially successful, but after a series of defeats, the remaining leaders were captured and executed in 1523.",
      "Charles extended the Burgundian territory with the annexation of Tournai, Artois, Utrecht, Groningen, and Guelders. The Seventeen Provinces had been unified by Charles's Burgundian ancestors, but nominally were fiefs of either France or the Holy Roman Empire. Charles eventually won the Guelders Wars and united all provinces under his rule, the last one being the Duchy of Guelders. In 1549, Charles issued a Pragmatic Sanction, declaring the Habsburg Netherlands to be a unified entity of which his family would be the heirs.",
    ] },
  { "title" = "Abdications and death", "paragraphs" = [
      "Between 1554 and 1556, Charles V gradually divided the Habsburg empire between a senior Spanish line and an Austrian branch of the House of Habsburg. His abdications all occurred at the Palace of Coudenberg in Brussels. First, he abdicated the thrones of Sicily and Naples, the latter a Papal fief, and the Imperial Duchy of Milan, in favour of his son Philip II of Spain on 25 July 1554. Philip was secretly invested with Milan already in 1540 and again in 1546, but only in 1554 did the Emperor make it public. Upon the abdications of Naples and Sicily, Philip was invested by Pope Julius III with the Kingdom of Naples on 2 October and with the Kingdom of Sicily on 18 November.",
      "The most famous – and only public – abdication took place a year later, on 25 October 1555, when Charles announced to the States General of the Netherlands (reunited in the great hall where he was emancipated forty years before by Emperor Maximilian) his abdication of those territories in favour of his son Philip as well as his intention to step down from all of his positions and retire to a monastery. During the ceremony, the gout-afflicted Emperor Charles V leaned on the shoulder of his advisor William the Silent and, crying, pronounced his resignation speech:",
      "When I was nineteen [...] I undertook to be a candidate for the Imperial crown, not to increase my possessions but rather to engage myself more vigorously in working for the welfare of Germany and my other realms [...] and in the hopes of thereby bringing peace among the Christian peoples and uniting their fighting forces for the defence of the Catholic faith against the Ottomans. [...] I had almost reached my goal when the attack by the French king and some German princes called me once more to arms. Against my enemies, I accomplished what I could, but success in war lies in the hands of God, who gives victory or takes it away, as He pleases. [...] I must, for my part, confess that I have often misled myself, either from youthful inexperience, from the pride of mature years, or from some other weakness of human nature. I nonetheless declare to you that I never knowingly or willingly acted unjustly. [...] If actions of this kind are nevertheless justly laid to my account, I formally assure you now that I did them unknowingly and against my own intention. I therefore beg those present today, whom I have offended in this respect, together with those who are absent, to forgive me.",
    ] },
]

[articles.es]
text = "Carlos I de España y V del Sacro Imperio Romano Germánico (Gante, 24 de febrero de 1500-Cuacos de Yuste, 21 de septiembre de 1558), llamado «el César», reinó junto con su madre Juana —esta última de forma solo nominal y hasta 1555— en todos los reinos, estados y señoríos hispánicos con el nombre de Carlos I desde 1516 hasta 1556, reuniendo así por primera vez en una misma persona, de forma efectiva, las coronas de Castilla y Aragón, el Reino de Navarra incluido. Su madre Juana I de Castilla heredó de Isabel la Católica la Corona de Castilla en 1505 y de Fernando el Católico la Corona de Aragón y el Reino de Navarra en 1516, pero desde 1506 no ejerció ningún poder efectivo."
title = "Carlos I de España"
lang = "es"
url = "https://es.wikipedia.org/wiki/Carlos_I_de_Espa%C3%B1a"
intro = [
  "Carlos I de España y V del Sacro Imperio Romano Germánico (Gante, 24 de febrero de 1500-Cuacos de Yuste, 21 de septiembre de 1558), llamado «el César», reinó junto con su madre Juana —esta última de forma solo nominal y hasta 1555— en todos los reinos, estados y señoríos hispánicos con el nombre de Carlos I desde 1516 hasta 1556, reuniendo así por primera vez en una misma persona, de forma efectiva, las coronas de Castilla y Aragón, el Reino de Navarra incluido. Su madre Juana I de Castilla heredó de Isabel la Católica la Corona de Castilla en 1505 y de Fernando el Católico la Corona de Aragón y el Reino de Navarra en 1516, pero desde 1506 no ejerció ningún poder efectivo. Fue emperador del Sacro Imperio Romano Germánico como Carlos V de 1520 a 1558.​",
  "Nació en Flandes, hijo de Juana I de Castilla y Felipe el Hermoso, y nieto por vía paterna del emperador Maximiliano I de Habsburgo y María de Borgoña, de quienes heredó el patrimonio borgoñón y el Archiducado de Austria con el derecho al trono imperial del Sacro Imperio Romano Germánico, y por vía materna de los Reyes Católicos, Isabel I de Castilla y Fernando II de Aragón, de quienes heredó la corona de Castilla, con los dominios en Navarra y las Indias Occidentales, y la corona de Aragón que comprendía los reinos de Nápoles, Sicilia, Cerdeña, Valencia, Mallorca, Aragón y el Principado de Cataluña.​​​",
  "Carlos revitalizó el concepto medieval de monarquía universal (el llamado neogibelinismo o la idea imperial de Carlos V). Sin fijar una capital, realizó 40 viajes por las diferentes entidades que gobernaba y dedicó una cuarta parte de su reinado a viajar dentro de sus reinos. Aunque su imperio le llegó pacíficamente, pasó la mayor parte de su vida librando guerras, agotando sus ingresos y dejando deudas en su intento de defender la integridad del Sacro Imperio Romano Germánico de la Reforma Protestante, la expansión del Imperio Otomano y en guerras con Francia. Carlos pidió prestado dinero a banqueros alemanes e italianos y, para devolverlo, dependió de la riqueza de los Países Bajos y del flujo de plata de Nueva España y Perú, que quedaron bajo su dominio tras la conquista española de los imperios azteca e inca, lo que provocó una inflación generalizada.​",
  "Coronado rey de Alemania en Aquisgrán, Carlos se alió con el papa León X y declaró proscrito a Martín Lutero en la Dieta de Worms en 1521. Derrotó una rebelión en Castilla. En 1521 Francisco I de Francia, rodeado por las posesiones de los Habsburgo, inició una guerra en Italia que lo llevó a su captura en la batalla de Pavía (1525).​ En 1527, Roma fue saqueada por un ejército de soldados amotinados de Carlos. Carlos defendió Viena de los turcos y obtuvo la coronación como rey de Italia y emperador del Sacro Imperio Romano Germánico del papa Clemente VII. En 1535, tomó posesión de Milán y capturó Túnez. Sin embargo, la pérdida de Buda durante la lucha por Hungría y la fallida expedición a Argel a principios de la década de 1540 frustraron sus políticas antiotomanas. Tras años de negociaciones, Carlos llegó a un acuerdo con el papa Pablo III para la organización del Concilio de Trento (1545).​ La negativa de la Liga Luterana de Esmalcalda a reconocer la validez del concilio desencadenó una guerra, ganada por Carlos. Sin embargo, Enrique II de Francia ofreció un nuevo apoyo a la causa luterana y fortaleció la alianza franco-otomana con Solimán el Magnífico.",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "El nacimiento de Carlos de Habsburgo se produjo durante la celebración de un baile en el palacio Casa del Príncipe (Prinsenhof) de Gante, Flandes, cuando la embarazada archiduquesa Doña Juana comenzó a sentir fuertes dolores en el vientre por lo que nació en un retrete, lo que hizo que su nacimiento fuera presenciado por numerosos testigos que identificaran reglamentariamente al neonato evitando así cualquier duda sobre la legitimidad del futuro Heredero.​ Ella quería ponerle el nombre de Juan en recuerdo de su fallecido hermano, pero finalmente fue bautizado como Carlos por deseo de su padre y en recuerdo de su bisabuelo, Carlos el Temerario, quien murió en la batalla de Nancy en 1477.​",
      "El bautizo, celebrado el 7 de marzo, fue oficiado por el obispo de Tournai, Pierre Quick, en la catedral de San Bavón. A él acudieron como madrinas Margarita de Austria, esposa del fallecido príncipe Juan, y Margarita de York, esposa de Carlos el Temerario, y como padrinos Carlos de Croy, príncipe de Chimay, y el señor de Vergás.​",
      "Antes de que cumpliera un año, Felipe nombró a Carlos duque de Luxemburgo y Caballero de la Orden borgoñona del Toisón de Oro. El 16 de noviembre de 1501, Felipe y Juana partieron hacia España para ser jurados en las Cortes como sucesores de los Reyes Católicos y dejaron a Carlos al cuidado de Margarita de York. Durante su paso por Francia, Felipe se reunió con el rey Luis XII y acordó el matrimonio entre la hija de este, Claudia, y Carlos, trato que se renovó con la firma del Tratado de Blois años después.​",
    ] },
  { "title" = "Familia", "paragraphs" = [
      "El 11 de marzo de 1526, Carlos I se casó en el Real Alcázar de Sevilla con su prima Isabel de Portugal, nieta de los Reyes Católicos y hermana de Juan III de Portugal, quien en 1525 se había casado con la hermana de Carlos I, Catalina de Austria. Con ella tuvo los siguientes hijos:​",
      "Felipe (21 de mayo de 1527-13 de septiembre de 1598), sucesor de su padre en el trono de España (juntamente con sus posesiones en América, los Países Bajos, Milán, Cerdeña, Nápoles y Sicilia) con el nombre de Felipe II.",
      "María (21 de junio de 1528-26 de febrero de 1603), quien en 1548 se casó con el emperador Maximiliano II de Habsburgo, su primo hermano.",
    ] },
  { "title" = "Semblanza", "paragraphs" = [
      "El embajador veneciano Gaspar Contarini hacía la siguiente descripción del Emperador Carlos V a los veinticinco años de edad:",
      "El prognatismo que menciona en la descripción final fue una característica física hereditaria y conocida como \"mandíbula de Habsburgo\". Esta deformidad, fruto de la endogamia, le provocaba dificultades para masticar y hablar, siendo una marca distintiva de su linaje que heredó de sus antepasados.​",
    ] },
  { "title" = "Bibliografía", "paragraphs" = [
      "Belenguer, Ernest (1995). El Imperio Hispánico 1479-1665. Grijalbo Mondadori. ISBN 84-253-2861-6.",
      "Cadenas y Vicent, Vicente de (2001). «Conde de Charolais, título que llevó el emperador hasta su muerte». Miscelánea de artículos publicados en la revista \"Hidalguía\". Ediciones Hidalguía.",
      "Casanova Todolí, Ubaldo. Las primeras Cortes Catalanas de Carlos I (Barcelona 1519-1520). Universitat de les Illes Balears. Archivado desde el original el 5 de febrero de 2009. Consultado el 29 de diciembre de 2007.",
    ] },
]

[articles.fr]
text = "Charles de Habsbourg, couramment appelé en français Charles Quint, né le 24 février 1500 à Gand (comté de Flandre) et mort le 21 septembre 1558 au monastère de Yuste (Espagne), élu le 28 juin 1519 empereur sous le nom de Charles V, est le monarque européen le plus puissant de la première moitié du XVIe siècle. Fils de Philippe le Beau et de Jeanne la Folle, il est héritier par son père des possessions de la maison de Habsbourg (archiduché d'Autriche, etc.) ainsi que des dix-sept provinces des Pays-Bas et de la Franche-Comté, et par sa mère des couronnes de Castille et d'Aragon (sous le nom de Charles Ier) et de l'Empire colonial espagnol, ainsi que du royaume de Naples (Charles II)."
title = "Charles Quint"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Charles_Quint"
intro = [
  "Charles de Habsbourg, couramment appelé en français Charles Quint, né le 24 février 1500 à Gand (comté de Flandre) et mort le 21 septembre 1558 au monastère de Yuste (Espagne), élu le 28 juin 1519 empereur sous le nom de Charles V, est le monarque européen le plus puissant de la première moitié du XVIe siècle. Fils de Philippe le Beau et de Jeanne la Folle, il est héritier par son père des possessions de la maison de Habsbourg (archiduché d'Autriche, etc.) ainsi que des dix-sept provinces des Pays-Bas et de la Franche-Comté, et par sa mère des couronnes de Castille et d'Aragon (sous le nom de Charles Ier) et de l'Empire colonial espagnol, ainsi que du royaume de Naples (Charles II).",
  "Cette accumulation de territoires et de pouvoirs est en partie le résultat du hasard (la mort de sa tante, Isabelle d'Aragon, princesse des Asturies, en 1498, puis du fils de cette dernière, l'infant Miguel de la Paz, en juillet 1500, ont fait de sa mère l'héritière des deux couronnes espagnoles), mais surtout le résultat d'une politique délibérée d'alliances matrimoniales qui a fait de lui l'héritier de quatre dynasties : petit-fils de la duchesse Marie de Bourgogne, de Maximilien d'Autriche, d'Isabelle la Catholique, reine de Castille, et de Ferdinand le Catholique, roi d'Aragon et de Naples, il est duc de Bourgogne sous le nom de Charles II, roi des Espagnes sous le nom de Charles Ier (en espagnol Carlos I), mais est surtout passé à la postérité comme l'empereur romain germanique Charles V (en allemand Karl V.).",
  "Il apparaît comme le dernier empereur qui ait souhaité réaliser le rêve carolingien d'un empire à la tête de la chrétienté unie. Cette volonté d'unité chrétienne face à la progression de l'Empire ottoman dans les Balkans et en Méditerranée a été systématiquement combattue par les rois de France François Ier et Henri II, qui recherchent volontiers l'alliance turque, et remise en cause par la Réforme protestante, initiée par Martin Luther à partir de 1517. À ces problèmes qui se posent pendant tout son règne s'ajoutent des révoltes en Castille, dans le Saint-Empire, en Flandre et en Brabant.",
  "Au terme d'une vie de combats, miné physiquement et désabusé par ses échecs face à la France, aux luthériens et à sa propre famille, il se dépouille volontairement de ses pouvoirs. Par une série de conventions avec son frère Ferdinand, il lui cède les États autrichiens et la dignité impériale. Le 25 octobre 1555, à Bruxelles, il abdique ses droits sur les Pays-Bas, unis par la Pragmatique Sanction (1549) et séparés de l'Empire par la transaction d'Augsbourg, en faveur de son fils Philippe, déjà duc de Milan et roi de Naples, et lui cède enfin ses droits sur l'Espagne en 1556. Il se retire alors dans le Monastère de Yuste pour ses dernières années de vie. Il y meurt le 21 septembre 1558, âgé de 58 ans. Ses restes sont transférés en 1574 de ce monastère à la nécropole royale de l'Escurial, édifiée par son fils Philippe à 40 km de Madrid.",
]
sections = [
  { "title" = "Jeunesse", "paragraphs" = [
      "Charles naît le 24 février 1500 au palais aujourd'hui disparu du Prinsenhof de Gand, alors la plus grande ville du comté de Flandre et des Pays-Bas bourguignons.",
      "Son père est Philippe de Habsbourg, dit « Philippe le Beau » (1478-1506), duc de Bourgogne et souverain des Pays-Bas, fils de Marie de Bourgogne (1457-1482), elle-même fille de Charles le Téméraire (1433-1477), de la maison de Valois-Bourgogne, et de l'archiduc Maximilien d'Autriche (1459-1519), de la maison de Habsbourg, futur empereur.",
      "Sa mère est Jeanne Ire de Castille, dite « Jeanne la Folle » (1479-1555), fille de la reine Isabelle de Castille (1451-1504) et du roi Ferdinand d'Aragon (1452-1516), les « Rois catholiques ». Jeanne devient reine de Castille en 1504 et reine d'Aragon en 1516, réunissant les deux royaumes, mais compte tenu de ses problèmes psychiques, sous la tutelle de son père (1504-1516), puis de son fils (1516-1555).",
    ] },
  { "title" = "Personnalité", "paragraphs" = [
      "Charles souffre de la promandibulie habsbourgeoise, déformation congénitale de la mâchoire, qui va empirer dans les générations ultérieures des membres de la maison de Habsbourg. Héritage de ses aïeux bourguignons, c'est une maladie liée aux mariages consanguins qui se pratiquent alors dans les familles régnantes.",
      "Il souffre aussi de crises d'épilepsie et de la goutte, vraisemblablement liée à un régime alimentaire fondé sur les viandes rouges.",
      "Lorsqu'il se retire au monastère de Yuste, il doit utiliser une sorte de chaise roulante pour se déplacer. Pour faciliter l'accès à ses appartements, on lui construit une rampe.",
    ] },
  { "title" = "Les possessions de Charles Quint et leur gouvernement", "paragraphs" = [
      "De 1506 à 1519, Charles de Habsbourg hérite des biens et titres de quatre dynasties, représentées par chacun de ses grands-parents :",
      "la maison de Valois-Bourgogne (Marie de Bourgogne, 1457-1482, puis Philippe le Beau, 1479-1506) : les restes de l'État bourguignon, c'est-à-dire les Pays-Bas bourguignons et le comté de Bourgogne, ensemble de fiefs du Saint-Empire, regroupés dans le cercle impérial de Bourgogne et de fiefs français rassemblés par les ducs de Bourgogne de la maison de Valois (avènement en 1515) ;",
      "la maison d'Aragon (Ferdinand II d'Aragon, 1453-1516) : couronne d'Aragon, comprenant les royaumes d'Aragon, de Valence et de Majorque et la principauté de Catalogne avec ses dépendances en Italie (royaume de Naples, notamment), ainsi que la Haute-Navarre (Pampelune) conquise en 1512 par Ferdinand d'Aragon (avènement en 1516 à la mort de Ferdinand d'Aragon) ;",
    ] },
  { "title" = "Les guerres de Charles Quint", "paragraphs" = [
      "La rivalité avec François Ier marque l'essentiel du règne de Charles Quint, origine de quatre guerres entre eux. Elle se prolonge sous le règne de Henri II qui affrontera ensuite Philippe II.",
      "Les deux souverains sont habités par les revendications de leurs prédécesseurs. François Ier, dont le royaume est encerclé par les possessions de Charles Quint, veut poursuivre l'action de Charles VIII et de Louis XII dans la péninsule italienne, en revendiquant le royaume de Naples et le duché de Milan. De son côté, Charles Quint voudrait récupérer le duché de Bourgogne (capitale : Dijon), berceau de la maison de Valois-Bourgogne dont il se réclame, fief français repris par Louis XI à la suite de la guerre de Succession de Bourgogne après la mort de Charles le Téméraire (traité d'Arras, 1482) et traité de Senlis (1493)) ; il détient toujours en revanche le comté de Bourgogne, fief impérial dont la capitale est Dole.",
      "L'Italie est le principal théâtre de leurs guerres, dites « guerres d'Italie », mais des opérations ont lieu aux Pays-Bas, en Bourgogne et même en Espagne.",
    ] },
  { "title" = "Héritage et patrimoine", "paragraphs" = [
      "« Charles par la divine clémence Empereur des Romains, toujours Auguste, roi de Germanie, de Castille, de León, de Grenade, d'Aragon, de Navarre, de Naples, de Sicile, de Majorque, de Sardaigne, des îles Indes et terres fermes de la mer Océane, archiduc d'Autriche, duc de Bourgogne, de Brabant, de Limbourg, de Luxembourg et de Gueldre, comte de Flandres, d'Artois, de Bourgogne palatin, de Hainaut, de Hollande, de Zélande, de Ferrette, de Haguenau, de Namur et de Zutphen, prince de Souabe, marquis de Saint-Empire, seigneur de Frise, de Salins, de Malines, le dominateur en Asie et en Afrique, roi de la Nouvelle-Espagne, du Pérou, de la Nouvelle-Grenade et du Río de la Plata et suzerain des vice-rois de ces mêmes pays. »",
      "Les armoiries de Charles Quint ont évolué au cours de sa vie. À sa naissance, en 1500, il hérite des armes brisées de son père, écartelées d'Autriche, de Bourgogne moderne, de Bourgogne ancien et de Brabant, chargées du parti de Flandre et de Tyrol, le tout brisées d'un lambel. La mort d'Isabelle la Catholique, en 1504, constitue ses parents les rois de Castille. Les armes familiales sont modifiées pour refléter cette nouvelle situation. On écartèle donc ces armes paternelles avec celles, écartelées du contre écartelé de Castille et de Léon et du parti d'Aragon et de Sicile, le tout enté en pointe de Grenade. Comme le couple se montre inégal, Philippe, duc de Bourgogne face à la reine de Castille, les armes maternelles sont mises au point d'honneur. Charles hérite de cet écartelé pour le moins complexe, tandis que son frère Ferdinand inverse les quartiers paternels et maternels.",
      "À partir de 1519, cet écartelé se place sur l'aigle impériale. Comme la composition devient difficile à graver et à déchiffrer, les armes se simplifient peu à peu. L'écartelé d'Aragon-Castille et d'Autriche-Bourgogne se change graduellement en un simple coupé. Ses derniers sceaux, à Yuste, retournent à l'écartelé de 1506, sans plus d'aigles ni de couronne.",
    ] },
]

[articles.de]
text = "Karl V. (spanisch Carlos I, französisch Charles Quint, niederländisch Karel V; * 24."
title = "Karl V. (HRR)"
lang = "de"
url = "https://de.wikipedia.org/wiki/Karl_V._%28HRR%29"
intro = [
  "Karl V. (spanisch Carlos I, französisch Charles Quint, niederländisch Karel V; * 24. Februar 1500 im Prinzenhof, Gent, Burgundische Niederlande; † 21. September 1558 in Cuacos de Yuste, Spanien) war ein Angehöriger des Herrscherhauses Habsburg, römisch-deutscher König, ab 1530 Kaiser des Heiligen Römischen Reiches und als Karl I. der erste König von Spanien.",
  "Nach dem frühen Tod seines Vaters Philipp I. von Kastilien wurde Karl im Jahr 1506 Landesherr der Burgundischen Niederlande, bestehend aus elf Herzogtümern und Grafschaften, und ab 1516 nach dem Tod seines Großvaters Ferdinand II. von Aragón zusammen mit seiner für unzurechnungsfähig erklärten Mutter Johanna von Kastilien als Carlos I. der erste König von Spanien, genauer von Kastilien, León und Aragón, die er erblich in einer Personalunion vereinigte. Im Jahr 1519 erbte er das Erzherzogtum Österreich und wurde als Karl V. zum römisch-deutschen König gewählt. 1520 wurde er im Kaiserdom zu Aachen durch den Kölner Erzbischof Hermann V. von Wied zum König gekrönt und trug danach, wie sein Großvater Maximilian I. und seine künftigen Nachfolger, zunächst den Titel „erwählter Kaiser des Heiligen Römischen Reiches“. Im Jahre 1530 wurde er in der Basilika San Petronio in Bologna, nicht wie üblich in Rom, als letzter römisch-deutscher König und nach Friedrich III. als zweiter und letzter Habsburger von einem Papst – Clemens VII. – zum Kaiser gekrönt.",
  "Karl verfolgte den Reichsgedanken der Universalmonarchie, wonach dem Kaiser Vorrang vor allen Königen zukam. Er verstand sich als Friedenswahrer in Europa, Beschützer des Abendlandes vor der Expansion des Osmanischen Reiches unter Süleyman I. und als Verteidiger sowie Erneuerer der römisch-katholischen Kirche. Um seine hegemoniale Herrschaftsidee durchsetzen zu können, führte er gegen den französischen König Franz I. ab 1520 zahlreiche Kriege (Italienische Kriege). Dabei konnte sich Karl finanziell auf seine spanischen Besitzungen in Amerika (Vizekönigreich Neuspanien, Vizekönigreich Peru) stützen, jedoch sein angestrebtes Ziel einer dauerhaften Schwächung des zeitweise mit den Osmanen verbündeten Frankreich nicht erreichen.",
  "Im Heiligen Römischen Reich war Karl V. vergeblich bestrebt, die Macht des Monarchen gegenüber den Reichsständen nachhaltig zu stärken. Wesentliche Ursache für sein Scheitern in diesem Bemühen war die ab 1517 einsetzende Reformation, die teilweise durch reichsständische Kräfte unterstützt wurde. Karls häufige kriegsbedingte Abwesenheit trug ein Übriges dazu bei, dass sich die Reformationsbewegung ausbreiten konnte. Die konfessionelle Spaltung des Reiches vor Augen, versuchte er ihr durch die Einberufung des Konzils von Trient (1545 bis 1563) entgegenzuwirken, was jedoch nicht zur Versöhnung der Religionsparteien führte, sondern nach Karls Tod zum Ausgangspunkt der katholischen Gegenreformation wurde. Nach dem Scheitern seiner Bemühungen um einen Ausgleich mit den Protestanten versuchte Karl im Zuge des gewonnenen Schmalkaldischen Krieges, den Reichsständen 1548 mit dem Augsburger Interim eine Lösung des Religionskonflikts zu diktieren. Durch den daraufhin ausbrechenden Fürstenaufstand und die damit verbundene französische Invasion war er gezwungen, eine Koexistenz der Konfessionen im Passauer Vertrag (1552) anzuerkennen, die dann schließlich im Augsburger Religionsfrieden (1555) reichsrechtlich reguliert wurde. Mit der 1532 verfassten Constitutio Criminalis Carolina erließ Karl V. das erste allgemeine Strafgesetzbuch im Heiligen Römischen Reich.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Durch die Ehe Maximilians von Österreich mit Maria von Burgund begann 1477 der Aufstieg des Hauses Habsburg zur europäischen Großmacht. Als Erbin des Herzogtums Burgund war Maria die reichste Braut ihrer Zeit und erhoffte sich durch die Verbindung mit dem Kaiserhaus Unterstützung im Burgundischen Erbfolgekrieg gegen Frankreich. Maximilian wiederum versprach sich einen großen Machtgewinn für seine Dynastie. Letztlich begründete seine Heirat mit Maria den fast 300 Jahre währenden Habsburgisch-französischen Gegensatz. Aus der Ehe gingen zwei Kinder hervor: Philipp der Schöne und Margarete von Österreich. Maria starb bereits 1482 an den Folgen eines Reitunfalls.",
      "Maximilian, ab 1486 als Maximilian I. römisch-deutscher König, war nun Vormund und Regent seines minderjährigen Sohnes in den burgundischen Territorien. Erst mit dem Vertrag von Senlis (1493) gelang es ihm, den Anspruch seiner Dynastie auf die Erbfolge in Burgund gegenüber Frankreich teilweise durchzusetzen und seinem Sohn die Regierung der Freigrafschaft Burgund zu übertragen.",
      "Als Familienoberhaupt war Maximilian auf eine politisch möglichst vorteilhafte Heirat Philipps bedacht und arrangierte eine Verbindung nach Spanien. Dort herrschten die Katholischen Könige Ferdinand II. von Aragón und Isabella I. von Kastilien. Um das Bündnis zu festigen, arrangierten sie 1496/97 eine Doppelhochzeit zwischen Philipp und Johanna, der zweitältesten Tochter des Königspaares, sowie zwischen Margarete und dem spanischen Thronfolger Johann. Nach dem Tod ihrer älteren Geschwister (Johann 1497, Isabella 1498) und ihres Neffen (Miguel da Paz 1500) erkannten die verschiedenen Cortes der spanischen Herrschaftsbereiche Johanna und ihren Ehemann Philipp als Thronfolger der Königreiche Aragón und Kastilien an. In diesen Jahren traten bei Johanna erste Symptome einer Depression auf.",
    ] },
  { "title" = "Europäische Machtpolitik", "paragraphs" = [
      "Um Karls Anspruch, das Kaisertum als übergeordnete, supranationale europäische Ordnungsmacht durchzusetzen, bedurfte es einer den anderen Staaten überlegenen Macht. Dabei spielte das wohlhabende Italien eine zentrale Rolle, denn wenn es gelang, dort maßgeblichen Einfluss zu gewinnen, war die europäische Hegemonie möglich. Daneben wollte der Kaiser das 1477 an Frankreich gefallene Herzogtum Burgund für das Haus Habsburg zurückgewinnen, da seine burgundischen Vorfahren in Dijon bestattet waren. Sein testamentarischer Wunsch von 1522 hob die Bedeutung Burgunds für Karl hervor, indem er verfügte, neben seinen Ahnen in der Chartreuse de Champmol von Dijon beigesetzt zu werden. Mit diesem nostalgischen Bestreben stellte er den Kompromiss der Aufteilung des burgundischen Erbes von 1493 (Vertrag von Senlis) in Frage. Weiterhin wollte Karl V. die französischen Lehnsrechte in der Grafschaft Flandern und dem Artois beenden und beanspruchte auch die südfranzösischen Gebiete der Provence sowie des Languedoc als Reichslehen für sich.",
      "Durch diese territorialen Forderungen geriet Karl in Konflikt mit dem machtbewussten französischen König Franz I., der nicht bereit war, den Ansprüchen nachzugeben. Auch er hegte in Italien Hegemoniebestrebungen: Nach einem militärischen Sieg über die Schweizer in der Schlacht bei Marignano waren 1515 weite Teile Oberitaliens und insbesondere das Herzogtum Mailand an Frankreich gefallen, zusätzlich erhob er Ansprüche auf das Königreich Neapel und die 1512 an Spanien gefallenen Teile des Königreichs Navarra.",
      "Bereits 1520 hatte Karl die Duldung des englischen Königs Heinrich VIII. für seinen geplanten Krieg gegen Frankreich erreicht, ein Jahr später konnte er den Papst für ein antifranzösisches Bündnis gewinnen. Zunächst marschierte der im französischen Exil lebende Henri d’Albret ins spanische Navarra ein, musste sich aber nach ein paar Wochen wieder zurückziehen; auch an der niederländisch-französischen Grenze kam es zu Gefechten. In der zweiten Hälfte des Jahres 1520 begann die direkte Konfrontation zwischen Karl V. und Franz I. in der Champagne sowie Oberitalien, im November 1520 trat auch Heinrich VIII. auf Seiten des Kaisers in den Krieg ein.",
    ] },
  { "title" = "Reichs- und Religionspolitik", "paragraphs" = [
      "Durch Feldzüge, Kriege oder andere Verpflichtungen war Karl V. ab dem Winter 1521/22 neun Jahre lang vom Reich abwesend und hatte seinem Bruder Ferdinand gemäß den Bestimmungen des Vertrages von Brüssel (1522) zahlreiche Kompetenzen übertragen. Er hatte Ferdinand auch zugesagt, dessen Wahl zum römisch-deutschen König und damit zum möglichen Nachfolger zu betreiben. Die Verwaltung des Reiches wurde dadurch erschwert, dass Karl auf den Reichstagen mit eigenen Gesandten vertreten war, deren Instruktionen oft nicht mit dem Statthalter oder dem Reichsregiment abgestimmt waren und er sich persönlich die Bestätigung der Reichstagsbeschlüsse vorbehielt. Darüber hinaus erwies sich das Reichsregiment als wenig effektiv und das Wormser Edikt blieb somit ohne größere Wirkung. Vielmehr beharrten die Reichsstände in der Religionsfrage auf einem allgemeinen oder zumindest einem nationalen Konzil, der Kaiser indes untersagte 1524 die Vorbereitungen zu einem nationalen Konzil. Eine nationalkirchliche Lösung der Religionsfrage war damit nicht mehr möglich.",
      "Zwischen 1524 und 1526 erschütterte der deutsche Bauernkrieg die Verhältnisse im Reich, wobei sich soziale Forderungen und Einflüsse der reformatorischen Bewegung verbanden. An der Niederschlagung dieser Aufstände war der abwesende Kaiser kaum beteiligt, Hauptkontrahenten der Bauern waren der schwäbische Bund und verschiedene Reichsstände.",
      "Auf dem Reichstag von Speyer 1526 kam erneut Bewegung in die Lösung des Religionskonfliktes: Erneut scheiterten Ansätze zu einer Kirchenreform auf nationaler Grundlage am Widerspruch des in Spanien weilenden Kaisers, die Reichsstände drängten weiter auf ein Konzil und beschlossen, dass die Umsetzung des Wormser Edikts in die Verantwortung der einzelnen Stände fallen sollte. Der Reichsabschied legte die Grundlagen für die Konfessionswahl der Reichsstände wie auch für den Aufbau eines reformatorischen Kirchenwesens. Die weitere Expansion der Reformationsbewegung wurde durch die Feindschaft zwischen Kaiser und Papst während der Liga von Cognac weiter erleichtert. Landgraf Philipp von Hessen wurde zum Motor einer protestantischen und zugleich antihabsburgischen Politik. Auf einem weiteren Reichstag in Speyer im Jahr 1529 verschärfte Ferdinand gegen den Willen Karls die Gangart gegenüber den Evangelischen. Diese legten dagegen die Protestation zu Speyer ein, was zur Bezeichnung Protestanten führte. Die evangelischen Stände versuchten vergeblich, Karl V. zu einer Aussetzung des Wormser Edikts zu bewegen. Daraufhin begannen die Protestanten mit den Vorbereitungen zu einem Defensivbündnis.",
    ] },
  { "title" = "Letzte Jahre (1555–1558)", "paragraphs" = [
      "Von der Gicht gezeichnet, das Scheitern seiner Religionspolitik im Reich erkennend und von seiner Familie gedrängt, eine Einigung mit Ferdinand zu finden, entschied sich der Kaiser zur Abdankung.",
      "Die Klärung der Nachfolge hatte Karl schon länger beschäftigt. Das spanische Erbe sollte an seinen Sohn Philipp fallen. Komplizierter war die Nachfolge im Reich. Karl wollte, dass auf Ferdinand auch im Reich Philipp folgen sollte. In Augsburg kam es darüber zu Verhandlungen zwischen Karl, Philipp und Ferdinand. Letzterer hat diesen Plänen widersprochen. Auch Ferdinands Sohn Maximilian war damit nicht einverstanden. Maria von Ungarn versuchte zu vermitteln. Es wurde schließlich vereinbart, dass Ferdinand Philipp helfen sollte, zum römisch-deutschen König gewählt zu werden. Auf Philipp wiederum sollte Maximilian folgen. Außerdem sollte Philipp eine Tochter Ferdinands heiraten. Dieser Plan der spanischen Sukzession scheiterte. Im September 1555 fiel dann die Entscheidung, die Besitzungen zu teilen. Philipp und damit die künftige spanische Linie der Habsburger bekam auch die Niederlande und die italienischen Besitzungen. Ferdinand und Maximilian, die die österreichische Linie begründeten, erhielten die Erblande, Böhmen, Ungarn und den Anspruch auf die Kaiserkrone.",
      "Bereits 1554 war das Königreich Neapel anlässlich der Hochzeit Philipps mit Maria von England an seinen Sohn übergegangen. Staatsrechtlich war Karl selbst erst nach dem Tod seiner Mutter am 13. April 1555 alleiniger König von Spanien geworden. Er verfügte die unbedingte Primogenitur, so dass nach seinem Sohn Philipp dessen Sohn Don Carlos die Nachfolge antreten würde. Am 2. Oktober 1555 legte er das Amt des Großmeisters des Ordens vom Goldenen Vlies nieder. Am 25. Oktober übergab er in Brüssel die Herrschaft über die Niederlande an Philipp. Karl erschien zu diesem feierlichen Staatsakt in Trauerkleidung und gestützt auf Wilhelm von Oranien. In einer Ansprache hielt er Rückblick auf sein Leben.",
    ] },
]

[articles.it]
text = "Carlo V d'Asburgo (Gand, 24 febbraio 1500 – Cuacos de Yuste, 21 settembre 1558) è stato Sacro Romano Imperatore Germanico e arciduca d'Austria dal 1519, re di Spagna (Castiglia e Aragona) dal 1516, e principe sovrano dei Paesi Bassi come duca di Borgogna dal 1506. Fu inoltre re di Napoli, di Sardegna e di Sicilia."
title = "Carlo V d'Asburgo"
lang = "it"
url = "https://it.wikipedia.org/wiki/Carlo_V_d%27Asburgo"
intro = [
  "Carlo V d'Asburgo (Gand, 24 febbraio 1500 – Cuacos de Yuste, 21 settembre 1558) è stato Sacro Romano Imperatore Germanico e arciduca d'Austria dal 1519, re di Spagna (Castiglia e Aragona) dal 1516, e principe sovrano dei Paesi Bassi come duca di Borgogna dal 1506. Fu inoltre re di Napoli, di Sardegna e di Sicilia.",
  "A capo della Casa d'Asburgo durante la prima metà del Cinquecento, fu imperatore di un \"impero sul quale non tramontava mai il sole\" che comprendeva in Europa i Paesi Bassi, la Spagna e i regni aragonesi di Sardegna, Napoli e Sicilia, i territori austriaci, il Sacro Romano Impero esteso su Germania e Nord Italia, nonché le vaste colonie castigliane e una colonia tedesca nelle Americhe.",
  "Nato nel 1500 a Gand da Filippo I d’Asburgo detto \"Il Bello\" (figlio di Massimiliano I d'Austria e Maria di Borgogna) e Giovanna di Castiglia detta \"La Pazza\" (figlia di Isabella di Castiglia e Ferdinando d'Aragona), Carlo ereditò tutti i possedimenti familiari in giovane età, data l'infermità mentale della madre e la morte precoce del padre. All'età di sei anni, scomparso Filippo, divenne duca di Borgogna e pertanto principe dei Paesi Bassi. Dieci anni dopo divenne re di Spagna, entrando in possesso anche delle Indie occidentali castigliane, e dei regni aragonesi di Sardegna, Napoli e Sicilia. A diciannove anni divenne arciduca d'Austria come capo della Casa d'Asburgo e, di conseguenza, grazie all'eredità austriaca, fu designato imperatore del complesso germanico-italiano (Sacro Romano Impero) dai sette principi elettori. Per ottenere la carica Carlo chiese un prestito ad un consorzio di banchieri italiani e tedeschi, tra i quali spiccavano i Fugger ed i Welser.",
  "Beneficiario dell'ambiziosa politica dinastica austriaca, Carlo V riprese il progetto degli imperatori medievali e si pose come obiettivo quello di unire in una monarchia universale cristiana gran parte dell'Europa. A tal fine mise in piedi un vasto esercito costituito da lanzichenecchi tedeschi, tercios spagnoli, cavalieri borgognoni e condottieri italiani. Per sostenere il costo enorme delle sue truppe Carlo V utilizzò l'argento derivante dalle conquiste condotte ai danni di Aztechi e Inca da parte di Hernán Cortés e Francisco Pizarro e cercò altre fonti di ricchezza affidando ai Welser la ricerca della leggendaria El Dorado. Ancora maggiori furono le entrate fiscali garantite dalla potenza economica dei Paesi Bassi.",
]
sections = [
  { "title" = "Genealogia familiare", "paragraphs" = [
      "Carlo era figlio di Filippo il Bello, figlio a sua volta dell'Imperatore Massimiliano I d'Austria e di Maria di Borgogna, erede dei vasti possedimenti dei Duchi di Borgogna. La madre Giovanna di Castiglia e d'Aragona era figlia dei re cattolici Ferdinando II d'Aragona e della sua consorte Isabella di Castiglia. In virtù di questi avi d'eccezione, Carlo poté ereditare un vastissimo impero, oltretutto in continua espansione, ed esteso su tre continenti (Europa, Africa e America). Nelle sue vene infatti scorreva sangue delle più disparate nazionalità: austriaca, tedesca, spagnola, francese, polacca, russa, italiana e inglese.",
      "Tramite il padre discendeva infatti, oltre che naturalmente dagli Asburgo, i quali ormai da tre secoli regnavano sull'Austria e da quasi 100 anni ininterrottamente sul Sacro Romano Impero, anche dalla casata polacca dei Piast, del ramo dei duchi di Masovia, attraverso la trisavola Cimburga di Masovia. Quest'ultima discendeva anche, per via materna, dai Principi di Tver' del Casato di Rurik, tra i quali spicca San Michele di Tver, eroe della resistenza ai Mongoli e venerato dalla Chiesa ortodossa russa. Il marito di Cimburga, il duca di Stiria Ernesto il Ferreo, era invece figlio di Verde Visconti e ciò rendeva Carlo diretto discendente dei Visconti di Milano e quindi pretendente legittimo al Ducato di Milano. Tramite la nonna Maria, duchessa di Borgogna, egli discendeva invece dai re di Francia della Casa dei Valois, diretti discendenti di Ugo Capeto, fondatore della dinastia capetingia. Dalla linea borgognona Carlo vantava inoltre come antenati i duchi di Brabante, eredi dell'ultimo principe carolingio, Carlo I di Lorena, diretto discendente del fondatore del Sacro Romano Impero.",
      "La madre Giovanna invece gli portò la discendenza dalla grande casata castigliana e aragonese dei Trastámara. Essi a loro volta avevano riunito nel loro blasone le eredità delle antiche casate iberiche di Aragona, primi re di Aragona, di León, Castiglia e Navarra, discendenti degli antichi re delle Asturie, di origine visigota. I re di Aragona erano inoltre discendenti degli Hohenstaufen tramite Costanza, figlia di re Manfredi; questo fatto permise a Carlo (che si trovava in questo modo a discendere dall'Imperatore Federico II di Svevia, detto lo \"Stupor Mundi\"), di ereditare i regni di Napoli e Sicilia. Infine, due sue trisavole del lato materno erano Caterina e Filippa di Lancaster, entrambe figlie di Giovanni Plantageneto, I duca di Lancaster, figlio cadetto di Edoardo III, re d'Inghilterra.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Il 21 ottobre 1496, Massimiliano I d'Asburgo, arciduca d'Austria, nonché imperatore del Sacro Romano Impero, mediante un'accorta \"politica matrimoniale\", fece in modo che il proprio figlio ed erede al trono, Filippo, detto \"il bello\", prendesse in moglie Giovanna di Castiglia, figlia minore dei Re Cattolici di Spagna Ferdinando d'Aragona e Isabella di Castiglia. I due si trasferirono nel 1499 da Bruxelles nell'antica capitale Gand, situata nella Contea delle Fiandre, dove il 24 febbraio 1500 nacque Carlo.",
      "Oltre a Carlo, alla coppia nacquero altri cinque figli. Eleonora, la primogenita, che andò in sposa prima a Emanuele I di Aviz, re del Portogallo e poi a Francesco I di Valois-Angoulême, re di Francia. Dopo di lui, in successione, nacquero: Isabella che andò in sposa a Cristiano II di Oldenburg, re di Danimarca; Ferdinando che sposò Anna Jagellone d'Ungheria dando inizio a un rinnovato ramo austriaco degli Asburgo; Maria che andò sposa a Luigi II d'Ungheria e Boemia e infine Caterina che andò sposa a Giovanni III di Aviz, re del Portogallo.",
      "Carlo sarebbe divenuto in breve tempo il sovrano più potente del mondo. L'unico figlio maschio dei nonni materni era già scomparso nel 1497, senza lasciare eredi. Immediatamente dopo morì anche la loro figlia primogenita e nello stesso anno 1500 scomparve anche l'unico figlio maschio di quest'ultima, Michele della Pace d'Aviz a cui sarebbe toccata l'eredità di Castiglia d'Aragona e del Portogallo. Per cui, nell'anno 1504, con la morte della Regina Isabella, sua figlia Giovanna, madre di Carlo, divenne l'erede di tutti i beni di Castiglia e Carlo stesso ne divenne, a sua volta, erede potenziale.",
    ] },
  { "title" = "Discendenza", "paragraphs" = [
      "Isabella (1518 - 1537), come alcuni sostengono forse figlia della regina vedova Germana de Foix",
      "Margherita (1522 – 1586), figlia di Giovanna van der Gheynst, duchessa di Firenze prima, e di Parma poi",
      "Taddea (1523 – 1562), figlia di Orsolina della Penna, si sposò con Sinibaldo di Copeschi",
    ] },
  { "title" = "Titoli", "paragraphs" = [
      "Carlo, per grazia di Dio eletto Sacro Romano Imperatore, per sempre Augusto, re di Germania, re d'Italia, re di tutte le Spagne, di Castiglia, Aragona, León, di Ungheria, di Dalmazia, di Croazia, Navarra, Grenada, Toledo, Valencia, Galizia, Maiorca, Siviglia, Cordova, Murcia, Jaen, Algarves, Algeciras, Gibilterra, Isole Canarie, re di Sicilia Citeriore e Ulteriore, di Sardegna e Corsica, re di Gerusalemme, re delle Indie occidentali e orientali, delle isole e della terraferma del Mare Oceano, arciduca d'Austria, Duca di Borgogna, Brabante, Lorena, Stiria, Carinzia, Carniola, Limburgo, Lussemburgo, Gelderland, Neopatria, Württemberg, langravio di Alsazia, principe di Svevia, Asturia e Catalogna, conte di Fiandra, Asburgo, Tirolo, Gorizia, Barcellona, Artois, Palatino di Borgogna, Hainaut, Olanda, Seeland, Ferrette, Kyburg, Namur, Rossiglione, Cerdagne, Drenthe, Zutphen, margravio del Sacro Romano Impero, Burgau, Oristano e Gociano, Signore di Frisia, Marca vindica, Pordenone, Biscaglia, Molin, Salins, Tripoli e Machelen.",
    ] },
]

[articles.ja]
text = "カール5世（ドイツ語：Karl V、1500年2月24日 - 1558年9月21日）は、神聖ローマ皇帝（在位：1519年 - 1556年）にしてスペイン国王カルロス1世（スペイン語：Carlos I、在位：1516年 - 1556年）。神聖ローマ皇帝マクシミリアン1世の長男フィリップとスペイン女王フアナの嫡子で母語はフランス語。敬虔なカトリック教徒であり、ドイツ諸侯連合と化していた現実の帝国とは異なる中世的・普遍的なキリスト教帝国の理念を信じた。フランス王国と戦ってイタリアでの覇権を勝ち取り、1530年2月22日 ボローニャでイタリア王カルロ5世として戴冠。2日後にはローマ教皇から戴冠された最後の神聖ローマ皇帝カール5世となった（1530年2月24日）。しかし、その間に帝国ではマルティン・ルターによる宗教改革が発生し、アウクスブルクの和議による妥協に追い込まれた。ヨーロッパ各地を転戦した無理が祟って晩年は体調を崩し、嫡子フェリペにスペイン王国を、弟フェルディナントに神聖ローマ帝国を譲り退位した。"
title = "カール5世 (神聖ローマ皇帝)"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%BC%E3%83%AB5%E4%B8%96_%28%E7%A5%9E%E8%81%96%E3%83%AD%E3%83%BC%E3%83%9E%E7%9A%87%E5%B8%9D%29"
intro = [
  "カール5世（ドイツ語：Karl V、1500年2月24日 - 1558年9月21日）は、神聖ローマ皇帝（在位：1519年 - 1556年）にしてスペイン国王カルロス1世（スペイン語：Carlos I、在位：1516年 - 1556年）。神聖ローマ皇帝マクシミリアン1世の長男フィリップとスペイン女王フアナの嫡子で母語はフランス語。敬虔なカトリック教徒であり、ドイツ諸侯連合と化していた現実の帝国とは異なる中世的・普遍的なキリスト教帝国の理念を信じた。フランス王国と戦ってイタリアでの覇権を勝ち取り、1530年2月22日 ボローニャでイタリア王カルロ5世として戴冠。2日後にはローマ教皇から戴冠された最後の神聖ローマ皇帝カール5世となった（1530年2月24日）。しかし、その間に帝国ではマルティン・ルターによる宗教改革が発生し、アウクスブルクの和議による妥協に追い込まれた。ヨーロッパ各地を転戦した無理が祟って晩年は体調を崩し、嫡子フェリペにスペイン王国を、弟フェルディナントに神聖ローマ帝国を譲り退位した。",
]
sections = [
  { "title" = "血筋", "paragraphs" = [
      "ブルゴーニュ公・フィリップ4世とカスティーリャ女王・フアナの間に生まれた。母方の祖父母は結婚によってスペイン王国を誕生させ、のちにグラナダ王国を制圧しイベリア半島からイスラーム勢力を駆逐した「カトリック両王」ことアラゴン国王・フェルナンド2世およびカスティーリャ女王・イサベル1世であった。さらに父方の祖父母は神聖ローマ皇帝であるマクシミリアン1世と、かつてヴァロワ朝フランス王国とすら互角に渡り合った大国ブルゴーニュ公国の女公マリーという、当時のヨーロッパ王族のサラブレッドともいうべき血筋の生まれであった。",
      "カール5世の統治領域の中心はスペインであり母・フアナもスペイン出身であったが、カール5世本人は自分の生まれ故郷のネーデルラント・フランドルに愛着を持っており、言語の問題から当初は馴染めなかった。現代スペインに続く金羊毛騎士団の継承・増員に見られるように、曾祖父・シャルルのブルゴーニュ公国の継承者という自覚も強かった。それでもカール5世はスペイン王位についてから熱心にスペイン語を覚え、スペインを統治した。ちなみに弟のフェルディナントは兄とは対照的に、スペイン生まれのスペイン育ちであるが中欧の神聖ローマ帝国の帝位に就くこととなった。",
      "また、父方からハプスブルク家の血を受け継いだ神聖ローマ皇帝であるものの、ドイツ人とも言いがたい。カール5世はフランドルのガンにて生を享けたが、母語は当時のフランドル貴族の公用語であったフランス語であった。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "1500年にフランドルのガン（ヘント）で生まれ、1517年までネーデルラントで育った。名前は曾祖父・ブルゴーニュ公シャルルにちなむ。共に暮らしていた両親は、1506年にカスティーリャ王位を継承するためスペインへ渡った。残されたカールは叔母のネーデルラント総督マルグリットに育てられた。少年時代の個人教師には、後に教皇 ハドリアヌス6世となったオランダ人、ユトレヒトのアドリアンがおり、恵まれた環境で帝王学を学んだ。さらに側近としてシェブレ侯やジャン・ル・ソヴージュ、メルクリノ・ガッティナラらが従っていた。",
      "1506年、スペインに渡ったばかりの父が急死すると、幼くしてネーデルラントの継承者ブルゴーニュ公となった。1516年に外祖父・フェルナンド2世が死去すると、スペイン語を解さなかったカールはブリュッセルにいながら母フアナと共同統治という形でカスティーリャ国王になった。それは同時にアラゴン王国・ナバラ王国・グラナダ・ナポリ王国・シチリア王国・サルデーニャ王国・スペイン領アメリカにいたる広大な領域の統治者となったことを意味していた。1515年、父方の祖父・神聖ローマ皇帝 マクシミリアン1世によりハンガリー王国・ボヘミア王国の王家であるヤギェウォ家との二重結婚が取り決められたが、アンナ王女がカールと弟フェルディナントのどちらの妃となるかはその時点では未定だった。結婚相手を将来の皇帝であるカールではなくフェルディナントに決めると、ハンガリー王国側からは猛反発を受けたが、フェルディナントとアンナにとっては幸福な結婚となった。",
      "1517年に初めて「本国」スペイン入りし、トルデシリャスで母と再会すると、バリャドリッドで摂政ヒメネス・デ・シスネロス枢機卿を解任して親政を開始。1519年に祖父・マクシミリアン1世が死去すると、オーストリアをはじめとするハプスブルク家の領土を継承した。さらに叔母にして育ての母・マルグリットやフッガー家の支援を得て、1519年6月28日には生涯の宿敵・フランス国王 フランソワ1世を破り、フランクフルトに集まった選帝侯達が全票をカールに投じてローマ王に選出された。しかしこの選挙資金のために統治早々にして莫大な負債を負っている。1520年には戴冠式の途上、イングランド王国に立ち寄って国王 ヘンリー8世夫妻と対面している。ヘンリー8世の王妃キャサリンはカールの叔母だったからである。その後、同年10月22日に伝統に従ってアーヘンでローマ王としての戴冠を受けた。ローマ王となったカールは祖父マクシミリアン1世の例に倣って教皇からの戴冠を受けることなく神聖ローマ皇帝と見なされた。",
    ] },
  { "title" = "容姿", "paragraphs" = [
      "両親の血を引いて生まれつき顎の筋力が弱く、下顎前突症であり、また幼少期の病気により鼻腔が閉塞気味であったため、多くの肖像画でも見られる通り、一見すると非常に下顎が突出しているように見え、常に口の開いた状態だったとされている。彼は均整のとれた体型で、中背で美しい青い目をしていたが、顎のせいで顔がぼやけていたと描写されている。",
    ] },
  { "title" = "子女", "paragraphs" = [
      "1526年3月10日にセビリアの王宮で、ポルトガル国王 マヌエル1世の王女で、互いに母方の従兄妹であるイサベルと結婚した。前年の1525年にイサベルの兄ジョアン3世とカール5世の妹カタリナが結婚するという二重結婚であった。また、カール5世の姉レオノールは1518年にマヌエル1世の3番目の王妃となったが、マヌエル1世とは1521年に死別していた。",
      "人の良い性格であったため、貴族身分の母から庶子が生まれれば認知し、商人・工人身分の母から子が生まれれば修道院などへ入れた。うち有名なのは、ヨハンナ・ファン・デル・ヘインストが儲けたマルガリータ（1522年 - 1586年）と、バルバラ・ブロムベルクが儲けたレパント海戦の英雄ドン・フアン・デ・アウストリア（1547年 - 1578年）である。事跡の不明な子女としては、祖父フェルナンド2世の後妻ジェルメーヌ・ド・フォワが儲けた女子イサベル (es) と夭折した子、オルソリーナ・デッラ・ペンナが儲けた女子タデア、母不詳の女子フアナ、などが知られている。",
    ] },
  { "title" = "人物", "paragraphs" = [
      "カール5世は必ずしもフランス人の血を色濃く引いているわけではなかったが、フランスとパリをこよなく愛した。当時の貴族の常として、西欧最大の都市にして西ヨーロッパ社交界の中心都市であったパリに数回滞在しており、フランス社交界でも「シャルル・カン」（フランス語: Charles Quint）として知られていた。父・フィリップも親仏派だったといわれるが、カール5世は「パリはもはや都市というより、一つの世界だ」（ラテン語: Lutetia non urbs, sed orbis.）と言ったと伝えられる。最もよく使ったのもフランス語だったが、皮肉なことに政治的にはフランス国王と生涯にわたり激しい対立関係にあった。",
      "スペイン国王として、また神聖ローマ皇帝として、生涯かけてヨーロッパ全土を回り、北アフリカにまで足を伸ばしている。多言語話者であったと言われており、カール5世の言葉として伝えられる有名なものに「スペイン語は神への言葉、イタリア語は女性への言葉、フランス語は男性への言葉、ドイツ語は馬への言葉」というものがある。しかし、実際にカール5世が不自由なく完璧に話すことができたのは、母語のフランス語のほかは、スペイン統治者として本格的に学習・使用したスペイン語くらいであった。ドイツ語とイタリア語については完全ではなく、ラテン語も話せたが不十分であった。",
    ] },
]

[articles.vi]
text = "Karl V (tiếng Tây Ban Nha: Carlos; tiếng Đức: Karl; tiếng Hà Lan: Karel; tiếng Ý: Carlo) (24 tháng 2 năm 1500 – 21 tháng 9 năm 1558) là người đã cai trị cả Đế quốc Tây Ban Nha từ năm 1516 và Đế quốc La Mã Thần thánh từ năm 1519, cũng như các vùng đất từng thuộc về Công quốc Bourgogne xưa kia kể từ năm 1506. Ông đã tự nguyện rút lui khỏi những chức vị nay sau một loạt các cuộc thoái vị từ năm 1554 đến 1556."
title = "Karl V của Thánh chế La Mã"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Karl_V_c%E1%BB%A7a_Th%C3%A1nh_ch%E1%BA%BF_La_M%C3%A3"
intro = [
  "Karl V (tiếng Tây Ban Nha: Carlos; tiếng Đức: Karl; tiếng Hà Lan: Karel; tiếng Ý: Carlo) (24 tháng 2 năm 1500 – 21 tháng 9 năm 1558) là người đã cai trị cả Đế quốc Tây Ban Nha từ năm 1516 và Đế quốc La Mã Thần thánh từ năm 1519, cũng như các vùng đất từng thuộc về Công quốc Bourgogne xưa kia kể từ năm 1506. Ông đã tự nguyện rút lui khỏi những chức vị nay sau một loạt các cuộc thoái vị từ năm 1554 đến 1556. Những lãnh thổ mà ông kế thừa bao gồm các lãnh thổ Tây, Trung và Nam Âu và các thuộc địa Tây Ban Nha ở châu Mỹ và châu Á. Kết quả là lãnh thổ của ông trải rộng trên bốn triệu kilômét vuông và là đế quốc đầu tiên được coi \"đế quốc mà mặt trời không bao giờ lặn\".",
  "Karl là người kế thừa 3 triều đại hàng đầu châu Âu: gia tộc Valois-Bourgogne (ở Bourgogne và Hà Lan), Habsburg của Thánh chế La Mã và Trastámara (Tây Ban Nha). Ông kế thừa vùng Hà Lan thuộc Bourgogne và Franche-Comté với tư cách là người thừa kế dòng họ Valois-Burgundy. Áo và các vùng đất khác ở Trung Âu từ triều đại Habsburg của chính ông. Ông cũng được bầu chọn làm người thừa kế của ông nội Maximilian I là Hoàng đế La Mã Thần thánh, một danh hiệu được cách thành viên dòng họ Habsburg nắm giữ từ năm 1440. Từ gia tộc Trastámara Tây Ban Nha, ông kế thừa vương miện Castilla, vốn đang trong quá trình phát triển một đế quốc ở châu Mỹ và châu Á, và Aragón, bao gồm cả một cả một Đế chế ở Địa Trung Hải kéo dài đến miền Nam nước Ý. Karl là vị vua đầu tiên thống nhất hai vương miện Castilla và Aragón và kết quả là ông đôi khi được gọi là vị vua đầu tiên của Tây Ban Nha. Liên minh cá nhân, dưới sự cai trị của Karl, bao gồm Đế quốc La Mã Thần thánh và Đế quốc Tây Ban Nha đã sắp trở thành một chế độ quân chủ toàn cầu kể từ thời Louis Mộ Đạo.",
  "Lo ngại rằng việc kế thừa của ông sẽ biến một đế quốc toàn cầu có thể trở thành hiện thực và ông đang cố trở thành bá chủ châu Âu, Karl trở thành kẻ thù của nhiều người. Triều đại của ông bị chi phối bởi chiến tranh và đặc biệt là do ba cuộc xung đột lớn diễn ra cùng lúc: chiến tranh Habsburg-Valois với Pháp, chiến tranh để chặn bước tiến của Ottoman và phong trào Kháng cách dẫn đến những cuộc xung đột với các Vương hầu người Đức. Những cuộc chiến với Pháp, diễn ra chủ yếu tại Ý, dẫn đến sự phục hồi lãnh thổ bị mất vào đầu triều đại của ông và bao gồm chiến thắng quyết định và bắt sống François I của Pháp tại trận Pavia năm 1525. Nước Pháp đã phục hồi và chiến tranh còn tiếp diễn trong suốt khoảng thời gian còn lại của triều đại Karl. Bằng một cái giá cực đắt, cuộc chiến đã dẫn tới sự phát triển của đội quân tiên phong hiện đại đầu tiên ở châu Âu, Tercio.",
  "Cuộc chiến với đế quốc Ottoman diễn ra tại Hungari và Địa Trung Hải. Sau khi chiếm được phần lớn phía đông và miền trung Hungari vào năm 1526, bước tiến của người Thổ đã bị dừng lại tại cuộc vây hãm thành Viên năm 1529. Một cuộc chiến tranh tàn khốc, tiếp tục bởi Ferdinand (người đã được bầu làm vua Hungary) trong suốt phần còn lại của triều đại của Karl. Tại Địa Trung Hải, dù đã dành một số thành công, Karl vẫn không thể ngăn chặn sự thống trị của hải quân Ottoman ngày càng mạnh và những hoạt động cướp biển của cướp biển Berber. Karl là một người chống lại Phong trào Kháng cách và ở Đức, ông đối lập với những Vương hầu người Đức của Liên minh Schmalkaldic, những người chống lại ông vì động cơ tôn giáo cũng như động cơ quyền lực. Ông đã không thể ngăn cản sự lan rộng của đạo Tin Lành dù ông giành chiến thắng quyết định trước các Vương hầu Tin lành tại trận Mühlberg. Năm 1547, cuối cùng ông buộc phải chấp nhận Hoà ước Augsburg năm 1555, chia rẽ nước Đức ra nhiều giáo phái khác nhau.",
]
sections = [
  { "title" = "Những năm đầu", "paragraphs" = [
      "Karl của Áo sinh vào ngày 24 tháng 2 năm 1500 tại Prinsenhof, một dinh thự tại thành phố thương mại Gent phồn thịnh ở xứ Vlaanderen. Ông là con thứ hai, là con trai trưởng của Philip I của Castilla và Juana I của Castilla. Nhằm tưởng niệm ông ngoại quá cố Charles le Téméraire, Công tước Bourgogne, nên đứa trẻ sơ sinh đã được rửa tội dưới tên Karl tại nhà thờ thánh Bavôniô ở Gent bởi giám mục xứ Tournai vào ngày 7 tháng 3 năm 1500 và nhận được tước hiệu \"Bá tước xứ Luxemburg\". Karl là cháu nội của vua La Mã-Đức (kể từ năm 1508 là Hoàng đế La Mã Thần thánh) Maximilian I của gia tộc Habsburg và Marie I xứ Bourgogne và là cháu ngoại của cặp đôi Fernando II của Aragón và Isabel I của Castilla (\"Quân chủ Công giáo\"). Ông có người chị tên là Leonor, và bốn người em là Isabel, Fernando, María và Catalina của Castilla.",
      "Nhằm công nhận quyền thừa kế vương miện Aragón và Castilla, cha mẹ của Karl đã sang Tây Ban Nha vào năm 1502. Felipe đã quay về Hà Lan vào năm 1503 để cai quản triều chính từ nơi đó. Trong thời gian này, Juana đã bắt đầu xuất hiện triệu chứng của bệnh tâm thần, muộn nhất là khi chồng của bà chết vào năm 1506, bà đã thực sự \"mất liên hệ với thực tại\" và được người đời gọi là \"Juana Điên\" (Juana La Loca). Nhiều khả năng là bà đã mắc bệnh tâm thần phân liệt nên đã được an trí tại một tu viện ở gần Tordesillas vào năm 1506 và sẽ sống tại đó cho đến khi mất ở tuổi 75. Tới tận năm 1517, khi Karl đến Tây Ban Nha nhân dịp đăng quang, ông mới được gặp lại mẹ.",
      "Bởi vậy, kể từ năm 1506, Karl, không mẹ không cha, đã lớn lên cùng hai chị em gái Leonor và Isabel ở nhà của cô Margarete của Áo tại Bruxelles và Mechelen. Những người anh chị em khác đều sống cùng ông bà tại Tây Ban Nha. Margarete, một người có đầu óc chính trị, nhậm chức Thống đốc 17 tỉnh Hà Lan và được bổ nhiệm làm người giám hộ của cháu trai. Bà đã chăm sóc những đứa trẻ bằng lòng thương yêu và được chúng tin tưởng. Bà đã tạo điều kiện để Karl có thể luyện tập, chuẩn bị cho công việc của Quân vương sau này khi lớn lên. Ngoài Margarete ra thì Adriaan của Utrecht, người sau này sẽ trở thành Giáo hoàng Ađrianô VI, cũng đóng một vai trò quan trọng trong thời niên thiếu của Karl. Chính ông là người đã đặt nền tảng cho lòng mộ đạo mà đã đi cùng người học trò suốt cuộc đời (Devotio moderna). Hoàng đế Maximilian đã giao cháu mình quý tộc Guillaume II. de Croÿ truyền tải học vấn cho cháu mình và dạy cho nó cách làm người, cách cư xử, cách sống trong cung. Qua đó, Karl, người vốn có tiếng mẹ đẻ là tiếng Pháp, đã được nuôi lớn theo văn hóa Bourgogne. Ngoài tiếng mẹ đẻ của mình, Karl chỉ nói được một ít tiếng Latinh, tiếng Đức và tiếng Vlaanderen. Mặc dù cơ thể yếu ớt và mảnh dẻ, nhưng bằng sự cầu tiến và sự kỷ luật, Karl đã tập luyện, học được những bản năng quân sự quan trọng nhất, và có thể chứng minh được sự khéo léo, thể lực của bản thân trong những chuyến đi săn hay trong những cuộc đấu thương bằng ngựa. Ngay từ khi còn trẻ và đã đảm nhận trọng trách lớn, xung quanh Karl đã tỏa ra sự cô đơn, bởi vì thế mà trong suốt cuộc đời, ông là một người không dễ gần.",
    ] },
  { "title" = "Thời niên thiếu", "paragraphs" = [
      "Do cái chết của người anh là Juan của Aragón và Castilla và chị gái Isabel của Tây Ban Nha, cũng như của con trai Isabel là Miguel nên mẹ của Karl có thể hy vọng vào vương miện Aragón và Castilla. Vào năm 1502, Juana I của Castilla và chồng Felipe el Hermoso đã chính thức được Cortes (nghị viện) ở Toledo và Salamanca công nhận là người thừa kế. Ngay từ năm 1504, sau cái chết của mẹ là nữ vương Isabel I, Juana đã trở thành người thừa kế của vương miện Castilla dưới sự chấp chính của cha là vua Ferrando II của Aragón.",
      "Sau cái chết của cha Felipe el Hermoso vào ngày 25 tháng 9 năm 1506, cậu bé Karl mới 6 tuổi đã phải tiếp quản miền bắc của công quốc Bourgogne năm xưa. Do áp lực từ giới quý tộc Bourgogne, nên vào ngày 15 tháng 1 năm 1515, Karl đã được tuyên bố là đã trưởng thành và qua đó có thể tự thân chấp chính khi mới 15 tuổi. Triều đình mà Karl thừa kế theo nghi thức Bourgogne ở Bruxelles vẫn còn sống theo truyền thống văn hoá thời Trung cổ, trong khi các quốc gia khác đã bắt đầu hình thành nên nghi thức mới. Lễ hội tỏ sự thần phục đã đi kèm với các hội thao, săn bắn và những bựa tiệc lớn. Vào năm tiếp đó, vua Fernando qua đời. Mặc dù theo di chúc mà vị vua quá cố để lại, người em Fernando vốn lớn lên tại Tây Ban Nha của Karl, đã được đề xuất làm người kế vị, nhưng Karl lại thừa hưởng vương miện Aragón mà ông ngoại để lại dựa theo luật Castilla cổ. Do mẹ ông với tư cách là người thừa kế của Castilla vì mắc bệnh tâm thần mà không thể tự mình tiếp quản triều chính nên quyền nhiếp chính đã rơi vào tay Karl. Ông cai trị vương quốc Castilla với tư cách là nhiếp chính cho đến khi mẹ ông qua đời năm 1555. Trong khoảng thời gian nay, ông cũng được phong làm vua trên danh nghĩa của Castilla. Ở Tây Ban Nha, tuyên bố về sự thừa kế của gia tộc Habsburg tuy đã được thừa nhận, nhưng Karl bị buộc phải đích thân xuất hiện để xác nhận điều đó. Do kế hoạch hành trình bị trì hoãn, nên vào năm 1516, Karl đã ký hiệp ước Noyon với vua Pháp là François I. Hiệp ước này bảo đảm vị thế của Karl cả trong nội bộ lẫn bên ngoài tại công quốc Bourgogne và cho phép ông có thể nắm quyền tại Tây Ban Nha. Nước cờ này được xem là đúng theo ý của một bộ phận quý tộc Bourgogne thân Pháp, trong số đó có một vài cố vấn của Karl.",
      "Năm 1517, Karl sang Tây Ban Nha để được Cortes (nghị viện) công nhận quyền lực của mình tại Aragón vá Castilla. Tại đây, ông lần đầu tiên trong đời gặp đứa em trai là Fernando, vốn được nuôi lớn tại triều đình của ông ngoại. Karl đã có thể giành được chiến thắng trước em trai. Sau đó, ông đã chuyển em trai mình đến Hà Lan, để em mình lớn lên tại đó. Do Karl sử dụng các thân cận người Bourgogne của mình vào các chức vụ quản lý cao trong triều và ban đầu không nói được nửa chữ tiếng Tây Ban Nha, đã làm phật lòng các giai cấp người Tây Ban Nha. Phải sau vài lần nhượng bộ, ví dụ như không mang tiền ra nước ngoài, chỉ bổ nhiệm người bản địa, học tiếng Tây Ban Nha và phải nhanh chóng kết hôn, các giai cấp Castilla và Vương miện Aragón mới tỏ ra thần phục ông. Do Karl là người đầu tiên thống nhất vương miên hai xứ Castilla và Aragón dưới một liên minh cá nhân nên ông được xem là vị vua đầu tiên của Tây Ban Nha. Qua đó, những vùng đất nằm dưới quyền kiểm soát của ông ngoài hai xứ Tây Ban Nha ra còn có Navarra, Napoli, Sicilia, Sardegna, các thuộc địa Tây Ban Nha ở châu Mỹ và trên lý thuyết cũng bao gồm khu vực Thái Bình Dương phía đông quần đảo Maluku (xem bài Hiệp ước Zaragoza).",
    ] },
  { "title" = "Tranh bá châu Âu", "paragraphs" = [
      "Để thực thi tham vọng trở thành người chỉ đạo của châu Âu, đế quốc của Karl cần phải trở nên hùng mạnh hơn các nước khác. Sự phồn vinh của Ý đã đóng một vai trò quan trọng ở đây, bởi vì ai có thể gây được những ảnh hưởng đáng kế tại khu vực này, thì việc trở thành bá chủ châu Âu là điều có thể. Ngoài ra, Karl muốn lấy lại những phần đất của Công quốc Bourgogne đã rơi vào tay Pháp năm 1477 về cho nhà Habsburg, vì những tổ tiên người Bourgogne của ông đều được chôn cất tại Dijon, vốn nay đã bị cắt cho Pháp. Một trong những ước mong ước được ghi lại trong di chúc năm 1522 nhấn mạnh tầm quan trọng của ao ước được chôn bên cạnh tổ tiên của mình trong nhà thờ Carthusian ở Dijon. Với những tham vọng này, ông đã tỏ rõ ý muốn sửa lại thỏa hiệp về việc phân chia di sản Bourgogne từ năm 1477. Karl cũng muốn chấm dứt quyền phong kiến của Pháp ở Flanders và Artois và cũng muốn biến các vùng Provence và Languedoc trở thành một chư hầu của Đế quốc.",
      "Vua Pháp François I vốn cũng là một con người tham vọng, nên không có lý gì lại phải chấp nhận những yêu cầu này của Karl. Ông cũng có tuyên bố lãnh thổ ở Ý: sau khi giành chiến thắng trước quân Thụy Sĩ năm 1515, phần lớn vùng Thượng Ý, đặc biệt là Milano đã rơi vào tay Pháp, ngoài ra ông cũng đòi vương quốc Naples và các phần của vương quốc Navarre đã rơi vào tay Tây Ban Nha vào năm 1512.",
      "Ngay từ năm 1520, Karl V đã đồng thuận cùng dượng là vua Anh Henry VIII lên kế hoạch đánh Pháp. Một năm sau, ông còn kêu gọi Giáo hoàng tham gia Liên minh chống Pháp. Trong bối cảnh đó, chiến tranh đã bắt đầu. Vào lúc đầu, vua Navarre Henri d'Albret đang sống lưu vong ở Pháp, đã tiến quân vào Navarre thuộc Tây Ban Nha, nhưng phải rút quân sau vài tuần. Chiến sự cũng đã xảy ra tại khu vực biên giới Pháp-Hà Lan. Nửa sau của năm 1520, cuộc đụng độ trực tiếp giữa Karl V và François I đã diễn ra ở vùng Champagne ở miền bắc nước Pháp và vùng Thượng Ý. Tháng 11 năm 1520, Henry VIII cũng chính thức tham chiến với tư cách là đồng minh của Hoàng đế. Vào lúc ban đầu, quân đội La Mã Thần thánh khá thành công và đã giành được nhiều thắng lợi, đến tháng 5 năm 1522, vùng Bắc Ý đã năm trong tay họ. Gia tộc Sforza nhận lại Milano với tư cách là chư hầu của Hoàng đế. Công tước Charles III de Bourbon-Montpensier đã từ bỏ vua Pháp. Tuy nhiên, ý đồ muốn cai trị một lãnh thổ độc lập, thoát khỏi sự kiềm chế của Vương miện Pháp đã thất bại. Charles III vì thế mà phải sống lưu vong trong triều đình La Mã Thần thánh. Điềm xấu mà trở nên càng ngày càng rõ rệt đó là việc Giáo hoàng và phía Venezia đang dần dần chuyển sang ủng hộ Pháp, và ở Ý đã dấy nên một phong trào chống đối Hoàng đế.",
    ] },
  { "title" = "Con cái", "paragraphs" = [
      "Carlos và Isabel có tổng cộng 6 người con, tuy nhiên, chỉ có ba người sống đến tuổi trưởng thành:",
      "Do Felipe II là cháu ngoại của Manuel I của Bồ Đào Nha thông qua mẹ ông nên ông nằm trong danh sách một trong những có thể kế tục ngai vàng Bồ Đào Nha. Ông đã tuyên bố điều này sau cái chết của cậu là Henrique, Vua Hồng Y trong năm 1580 và qua đó đó thành lập nên Liên minh Iberia.",
      "Margherita của Áo (1522 – 1586), con gái của Johanna Maria van der Gheynst, là một người hầu của Charles I de Lalaing, Seigneur de Montigny và là con gái của Gilles Johann van der Gheynst và vợ Johanna van der Caye van Cocamby. Ban đầu kết hôn với Alessandro de' Medici, Công tước Firenze và lần hai với Ottavio Farnese, Công tước Parma.",
    ] },
]

[articles.id]
text = "Karl V (bahasa Spanyol: Carlos; bahasa Prancis: Charles; bahasa Jerman: Karl; Dutch: Karel; bahasa Italia: Carlo; 24 Februari 1500 – 21 September 1558) adalah Kaisar Romawi Suci, Raja Spanyol, Naples, dan Sisilia, dan penguasa wilayah Burgundi. Di Spanyol, secara resmi ia mendapat nama Carlos I."
title = "Karl V, Kaisar Romawi Suci"
lang = "id"
url = "https://id.wikipedia.org/wiki/Karl_V%2C_Kaisar_Romawi_Suci"
intro = [
  "Karl V (bahasa Spanyol: Carlos; bahasa Prancis: Charles; bahasa Jerman: Karl; Dutch: Karel; bahasa Italia: Carlo; 24 Februari 1500 – 21 September 1558) adalah Kaisar Romawi Suci, Raja Spanyol, Naples, dan Sisilia, dan penguasa wilayah Burgundi. Di Spanyol, secara resmi ia mendapat nama Carlos I. Orang Spanyol kadang menjulukinya sebagai \"El Dorado\".",
  "Ia terpilih sebagai Kaisar Romawi Suci pada usia 19 tahun dan menduduki jabatan tersebut hingga ia turun takhta pada 1558. Masa kepemimpinannya bersamaan dengan era Renaisans akhir, Reformasi Protestan, dan awal reformasi Katolik. Wilayah kekuasaan Karl V sering disebut dengan \"el imperio en el que nunca se pone el sol\" (kemaharajaan tanpa matahari terbenam) karena mencakup daerah yang sangat luas. Wilayahnya mencakup Austria, Spanyol, Belanda, Italia, hingga benua Amerika. Hal ini juga menyebabkan banyaknya peperangan yang timbul, antara lain dengan Kerajaan Prancis, Kesultanan Utsmaniyah, hingga pangeran-pangeran Protestan Jerman.",
]
sections = [
  { "title" = "Kehidupan awal", "paragraphs" = [
      "Karl lahir di Prinsenhof, sebuah istana di Gent, Flandria Timur, Belgia pada 24 Februari 1500 dari pasangan Philipp I dari Kastilia dari Wangsa Habsburg (putra Maximilian I, Kaisar Romawi Suci, dan Maria dari Burgundy) dan Juana dari Wangsa Spanyol Trastámara (putri Isabel I dari Kastila dan Ferdinand II dari Aragon). Pewaris utama dari empat kakek-neneknya, ia mewarisi semua kekuasaan keluarganya di usia muda. Meski demikian, ia mendapat sedikit perhatian sewaktu kecil.",
      "Kedua orang tuanya lebih banyak menghabiskan waktu di luar negeri untuk mengamankan takhta Spanyol. Pada 1503, Ferdinand, anak kedua Philipp dan Juana serta adik Karl lahir dan dibesarkan di Spanyol. Pada 1506, sesaat setelah Isabel I meninggal dunia, Philipp dan Juana mewarisi takhta Spanyol. Namun, tak lama kemudian Philipp meninggal dunia sehingga Juana sangat berduka dan mengasingkan diri ke Kastil Tordesillas di Kastila. Setelah kematian Philipp, Karl mewarisi Burgundia Belanda, yang untuk sementara berada dalam perwalian bibinya, Margaret.",
      "Karl mendapat pendidikan formal dan politik di Istana Mechelen. Salah satu tutornya adalah Adriaan Florenz Dedel, yang di kemudian hari menjadi Paus Adrianus VI. Ia dikenal menyukai pertarungan dan perburuan.",
    ] },
  { "title" = "Masa pemerintahan", "paragraphs" = [
      "Pada tahun 1516, ia menjadi raja bersama Kastilia dengan ibunya Juana, dan karena itu ia adalah raja Spanyol pertama yang mewarisi negara tersebut secara dinasti disatukan oleh Raja Katolik, kakek nenek dari pihak ibu. Harta milik Spanyol pada aksesinya juga mencakup Hindia Barat yang dikuasai Kastilia dan Kerajaan Napoli, Sisilia, dan Sardinia yang dikuasai Aragon. Saat kematian kakek dari pihak ayah, Maximilian I, pada tahun 1519, ia mewarisi Austria dan menggantikannya sebagai Kaisar Romawi Suci. Dia mengadopsi nama kekaisaran Karl V sebagai gelar utamanya, dan menyebut dirinya sebagai Charlemagne baru. Saat ia bertakhta, Spanyol telah memulai kolonialisme dan imperialisme di Dunia Baru. Sumber daya Spanyol mengalir ke tiga arah, yakni jalur perdagangan di Laut Tengah, Trans-Atlantik, dan Laut Utara.",
      "Karl V merevitalisasi konsep monarki universal dari Abad Pertengahan dan menghabiskan sebagian besar hidupnya mempertahankan kedaulatan Kekaisaran Romawi Suci dari Reformasi Protestan, perluasan Kekaisaran Ottoman, dan serangkaian perang dengan Prancis. Tanpa ibu kota tetap, ia melakukan 40 perjalanan selama hidupnya atau sekitar seperempat masa pemerintahannya, bepergian dari satu negara ke negara lain. Kekaisarannya berperang dengan pasukan Landsknechte Jerman, Tercio Spanyol, Ksatria Burgundia, dan Condottieri Italia.",
      "Karl V dikenal dengan strategi besarnya untuk mempertahankan kedaulatan dan memperluas wilayah kekaisaran. Strategi berawal dari keputusannya pada tahun 1530 untuk mempertahankan kekaisarannya dari beragam musuh, termasuk Turki Ottoman, Prancis, dan kaum Protestan. Hal ini dilakukan dengan menggelar operasi militer di berbagai wilayah: Laut Tengah, Afrika Utara, Italia, Belanda, Laut Atlantik, Amerika, dan Jerman. Namun, keputusannya ini malah menjadi malapetaka karena pada 1540-an kekaisarannya terlalu besar dan pada akhirnya berkontribusi pada kejatuhan Spanyol dan dinasti Habsburg. Menurut Aurelio Espinosa, profesor sejarah di Universitas Negeri Arizona, keputusan Karl ini berkaitan erat dengan kepercayaannya tentang konsep monarki universal dan penyatuan agama di bawah kekaisaran.",
    ] },
  { "title" = "Keluarga", "paragraphs" = [
      "Karl V hanya menikahi seorang istri sepanjang hidupnya, Isabella dari Portugal, pada 1526 saat dia berumur 26 tahun. Pernikahan ini disambut baik oleh penduduk Spanyol. Mereka memiliki tujuh orang anak; tetapi hanya tiga yang bertahan hidup hingga dewasa, yakni Felipe (1527), Maria (1528), dan Juana (1535). Di masa akhir pemerintahannya, Karl V berjuang mencari cara untuk memastikan kepentingan anak-anaknya dan kepentingan adik (Ferdinand) dan keponakannya (Maximilian) terpenuhi dan mempertahankan Dinasti Habsburg.",
    ] },
  { "title" = "Kesehatan", "paragraphs" = [
      "Karl V didiagnosis menderita hiperurisemia atau penyakit asam urat sejak berumur 28 tahun. Dalam beberapa suratnya ke saudaranya dan anak-anaknya, Karl V mengeluh tidak bisa menulis karena penyakitnya membuat persendiannya nyeri dan membengkak sehingga ia memakai bantuan juru tulis. Dokternya telah menyarankan diet ketat, tetapi ia tak mengindahkan saran itu dan menikmati daging dan minuman beralkohol semasa hidupnya.",
      "Penyakit asam urat diduga menjadi salah satu faktor dalam pengambilan keputusannya yang menyangkut banyak negara. Pada 1552, ia menunda serangan untuk mengambil alih Metz karena serangan asam urat, dan sebagai hasilnya kota itu berhasil menahan serangan pasukan kekaisaran. Menurut beberapa penstudi, kegagalan di Metz karena penyakitnya menjadi salah satu alasan ia turun takhta pada 1556 dan pensiun di biara hingga akhir hayatnya. Ia meninggal pada usia 58, diduga karena malaria.",
    ] },
]

[articles.pt]
text = "Carlos V (Gante, 24 de fevereiro de 1500 – Cuacos de Yuste, 21 de setembro de 1558) foi o Sacro Imperador Romano e Arquiduque da Áustria a partir de 1519, Rei da Espanha como Carlos I a partir de 1516 e Senhor dos Países Baixos como Duque da Borgonha a partir de 1506. Como chefe da crescente Casa de Habsburgo durante a primeira metade do século XVI, seus domínios na Europa incluíam o Sacro Império Romano, estendendo-se da Alemanha ao norte da Itália, com domínio direto sobre as terras hereditárias austríacas e os Países Baixos da Borgonha, tendo também unificado a Espanha, com seus reinos do sul da Itália de Nápoles, Sicília e Sardenha."
title = "Carlos V do Sacro Império Romano-Germânico"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Carlos_V_do_Sacro_Imp%C3%A9rio_Romano-Germ%C3%A2nico"
intro = [
  "Carlos V (Gante, 24 de fevereiro de 1500 – Cuacos de Yuste, 21 de setembro de 1558) foi o Sacro Imperador Romano e Arquiduque da Áustria a partir de 1519, Rei da Espanha como Carlos I a partir de 1516 e Senhor dos Países Baixos como Duque da Borgonha a partir de 1506. Como chefe da crescente Casa de Habsburgo durante a primeira metade do século XVI, seus domínios na Europa incluíam o Sacro Império Romano, estendendo-se da Alemanha ao norte da Itália, com domínio direto sobre as terras hereditárias austríacas e os Países Baixos da Borgonha, tendo também unificado a Espanha, com seus reinos do sul da Itália de Nápoles, Sicília e Sardenha. Além disso, em seu reinado ocorreu a intensificação e consolidação da Colonização espanhola da América. A união pessoal dos territórios europeu e americano de Carlos V foi a primeira coleção de reinos rotulados como \"o império sobre o qual o sol nunca se põe\".",
  "Nascido na Flandres, foi o filho primogênito de Filipe, o Belo (filho de Maximiliano I, Sacro Imperador Romano e Maria da Borgonha), da Casa de Habsburgo, e de Joana de Castela (filha de Isabel I de Castela e Fernando II de Aragão), da Casa de Trastâmara. Carlos herdou todos os domínios de sua família ainda jovem, devido à morte prematura de seu pai e à doença mental de sua mãe. Após a morte de Filipe em 1506, ele herdou os países baixos da Borgonha, originalmente mantida por sua avó paterna, Maria. Em 1516, tornou-se monarca da Espanha com sua mãe Joana e, como tal, foi o primeiro rei da Espanha a herdar o país como dinamicamente unificado pelos monarcas católicos, seus avós maternos. As posses espanholas em sua ascensão ao trono também incluíam as Índias Ocidentais castelhanas e os reinos aragoneses de Nápoles, Sicília e Sardenha. Com a morte de seu avô paterno Maximiliano, em 1519, ele herdou a Áustria e foi eleito para sucedê-lo como Sacro Imperador Romano. Ele adotou o nome imperial de Carlos V como seu título principal e se denominou um novo Carlos Magno.",
  "Carlos V revitalizou o conceito medieval da monarquia universal e passou a maior parte de sua vida defendendo a integridade do Sacro Império Romano desde a Reforma Protestante, a expansão do Império Otomano e uma série de guerras com a França. Sem capital fixa, ele fez 40 viagens, viajando de país para país, e estima-se que ele tenha passado um quarto de seu reinado na estrada. As guerras imperiais foram travadas por Lansquenete alemães, Terços espanhóis, cavaleiros da Borgonha e condottieri italianos. Carlos V tomou emprestado dinheiro de banqueiros alemães e italianos e, para pagar tais empréstimos, tendo contado com a economia protocapitalista dos Países Baixos e com os fluxos de metais preciosos da América do Sul para a Espanha, que eram a principal fonte de sua riqueza, mas também a causa da inflação generalizada. Ele ratificou a conquista espanhola dos impérios asteca e inca pelos conquistadores espanhóis Hernán Cortés e Francisco Pizarro, bem como o estabelecimento de Klein-Venedig pela família alemã Welser em busca do lendário El Dorado. Para consolidar o poder em seu reinado inicial, Carlos suprimiu duas insurreições espanholas (a Revolta dos Comuneiros e as Germanías) e duas rebeliões alemãs (Revolta dos Cavaleiros e Guerra dos Camponeses).",
  "Rei coroado na Alemanha, Carlos ficou do lado do papa Leão X e declarou Martinho Lutero um fora da lei na Dieta dos Worms (1521). No mesmo ano, Francisco I de França, cercado pelas posses dos Habsburgo, iniciou um conflito na Lombardia que durou até a Batalha de Pavia (1525), levando à sua prisão temporária. O caso protestante ressurgiu em 1527, quando Roma foi saqueada por um exército dos rebeldes soldados de Carlos, em grande parte da fé luterana. Depois que suas forças deixaram os Estados papais, Carlos V defendeu Viena do Império Otomano e obteve a coroação como rei na Itália pelo papa Clemente VII. Em 1535, ele anexou o ducado vago de Milão e capturou Tunes. No entanto, a perda de Buda durante a luta pela Hungria e a expedição de Argel, no início da década de 1540, frustraram as suas políticas anti-otomanas. Enquanto isso, Carlos V havia chegado a um acordo com o papa Paulo III para a organização do Conselho de Trento (1545). A recusa da Liga de Esmalcalda luterana em reconhecer a validade do Conselho levou a uma guerra vencida por Carlos V com a prisão dos príncipes protestantes. No entanto, Henrique II de França ofereceu novo apoio à causa luterana e fortaleceu uma estreita aliança com o sultão Solimão, o Magnífico, o governante do Império Otomano desde 1520.",
]
sections = [
  { "title" = "Herança e primeiros anos", "paragraphs" = [
      "Carlos nasceu em 24 de fevereiro de 1500 na cidade flamenga de Gante, parte dos Países Baixos Habsburgos no Sacro Império Romano. Ele era o filho mais velho de Filipe, o Belo da Casa Austríaca de Habsburgo (filho de Maximiliano I da Áustria e Maria da Borgonha) e Joana, a Louca da Casa Espanhola de Trastámara (filha de Fernando de Aragão e Isabel de Castela). O casamento de seus pais foi concebido durante a Primeira Guerra Italiana no contexto de uma aliança política, conhecida como Liga Sagrada ou Liga de Veneza, estabelecida contra a Casa de Valois com o objetivo de cercar o Reino da França, formando um anel de poderes hostis ao seu redor. Os acidentes dinásticos acabaram por trazer a pessoa de Carlos de Gante, como era conhecido em seu nascimento, as quatro heranças da Borgonha, Castela, Aragão e Áustria.",
      "A herança da Borgonha incluía os Países Baixos dos Habsburgo, que consistiam em um grande número de senhorios que formaram os Países Baixos e cobriam a Bélgica, a Holanda e o Luxemburgo modernos. A herança expluía a Borgonha propriamente dita, anexada pela França em 1477, com exceção de Franco-Condado. Carlos nasceu nos Países Baixos e seu nome foi escolhido em homenagem ao seu ancestral Carlos, o Temerário da Borgonha. Com a morte de Filipe, em 1506, Carlos foi reconhecido Senhor dos Países Baixos com o título de Carlos II da Borgonha. Durante a infância e adolescência de Carlos, Guillermo de Croÿ (mais tarde primeiro-ministro) e Adriano de Utrecht (mais tarde papa Adriano VI) serviram como seus tutores. A cultura e a vida cortesania dos Países Baixos desempenharam um papel importante no desenvolvimento das crenças de Carlos. Como membro da Ordem Borgonhesa do Tosão de Ouro em sua infância, e mais tarde seu grande mestre, Carlos foi educado com os ideais dos cavaleiros medievais e com o desejo da unidade cristã de combater os infiéis. Os Países Baixos eram muito ricos durante seu reinado, tanto econômica quanto culturalmente. Carlos era muito apegado à sua terra natal e passou grande parte de sua vida em Bruxelas.",
      "A herança espanhola, resultante de uma união dinástica das coroas de Castela e Aragão, incluía a Espanha, as Índias Ocidentais castelhanas e as Duas Sicílias aragoneses. Joana herdou esses territórios em 1516 em uma condição de doença mental. Carlos, portanto, reivindicou as coroas para si próprio jure matris, tornando-se assim monarca de Joana com o título de Carlos I de Castela e Aragão ou Carlos I da Espanha. Castela e Aragão juntos formaram as maiores posses pessoais de Carlos e também forneceram um grande número de generais e terços (a formidável infantaria espanhola da época). No entanto, em sua ascensão ao trono, ele foi visto como um príncipe estrangeiro. Duas rebeliões, a revolta dos germânicos e a revolta dos comuneros, contestaram o governo de Carlos na década de 1520. Após essas revoltas, Carlos colocou os conselheiros espanhóis em uma posição de poder e passou uma parte considerável de sua vida em Castela, incluindo seus últimos anos em um mosteiro. De fato, o lema de Carlos, Plus Ultra (Mais além), tornou-se o lema nacional da Espanha e seu herdeiro, mais tarde Filipe II, nasceu e cresceu em Castela. No entanto, muitos espanhóis acreditavam que seus recursos (em grande parte constituídos por fluxos de prata das Américas) estavam sendo usados para sustentar as políticas de Imperiais Habsburgo que não eram do interesse do país.",
    ] },
  { "title" = "Reinado", "paragraphs" = [
      "Em 1506, Carlos herdou os territórios da Borgonha de seu pai, que incluíam o Franco-Condado e, principalmente, os Países Baixos. Esses últimos territórios estavam no interior do Sacro Império Romano e em suas fronteiras, mas foram formalmente divididos entre feudos do reino alemão e franceses, como o local de nascimento de Carlos na Flandres, um último remanescente do que havia sido um poderoso ator na Guerra dos Cem Anos. Como menor de idade, sua tia Margarida da Áustria (nascida como arquiduquesa de Áustria e em ambos os casamentos como princesa viúva das Astúrias e duquesa viúva de Saboia) atuou como regente, conforme indicado pelo imperador Maximiliano até 1515. Ela logo se viu em guerra com a França por causa da exigência por parte do rei Francês para que Carlos fosse lhe prestar homenagem por Flandres, como seu pai havia feito. O resultado foi que a França abandonou sua reivindicação antiga sobre a Flandres em 1528.",
      "De 1515 a 1523, o governo de Carlos na Holanda também teve que enfrentar a rebelião dos camponeses frísios (liderados por Pier Gerlofs Donia e Wijard Jelckama). Os rebeldes foram inicialmente bem-sucedidos, mas após uma série de derrotas, os líderes restantes foram capturados e decapitados em 1523.",
      "Carlos estendeu o território da Borgonha com a anexação de Tournai, Artésia, Utreque, Groningen e Guelders. As dezessete províncias haviam sido unificadas pelos ancestrais da Borgonha de Carlos, mas nominalmente eram feudos da França ou do Sacro Império Romano. Em 1549, Carlos emitiu uma Sanção Pragmática, declarando os Países Baixos como uma entidade unificada da qual sua família seria herdeira.",
    ] },
  { "title" = "Casamento", "paragraphs" = [
      "Durante sua vida, Carlos V teve várias amantes, entre elas a última esposa de seu avô, Germana de Foix. Essas ligações ocorreram enquanto era solteiro e apenas uma vez durante sua viuvez; não há registros de ter tido casos extraconjugais durante o casamento.",
      "Em 21 de dezembro de 1507, Carlos foi prometido a Maria, de 11 anos, filha do rei Henrique VII da Inglaterra e irmã mais nova do futuro rei Henrique VIII da Inglaterra, que assumiria o trono em dois anos. No entanto, o noivado foi cancelado em 1513, a conselho de Thomas Wolsey, e Maria foi casada com o rei Luís XII da França em 1514.",
      "Após sua ascensão ao trono espanhol, as negociações para o casamento de Carlos começaram logo após sua chegada a Castela, com os nobres castelhanos expressando seus desejos para que ele se casasse com sua prima em primeiro grau Isabel de Portugal, filha do rei Manuel I de Portugal e tia de Carlos, Maria de Aragão. Os nobres desejavam o casamento de Carlos com uma princesa de sangue castelhano, e um casamento com Isabel teria assegurado uma aliança entre Castela e Portugal. No entanto, o rei de 18 anos não teve pressa em se casar e ignorou o conselho dos nobres. Em vez de se casar com Isabel, ele enviou sua irmã Eleanor para se casar com o pai viúvo de Isabel, rei Manuel, em 1518. Em 1521, a conselho de seus conselheiros flamengos, especialmente Guilhermo de Croÿ, Carlos ficou noivo de sua outra prima, Maria, filha de sua tia, Catarina de Aragão, e do rei Henrique VIII, a fim de garantir uma aliança com a Inglaterra. No entanto, esse noivado era muito problemático porque Maria tinha apenas 6 anos na época, o que significava que ele teria que esperar que ela tivesse idade suficiente para se casar.",
    ] },
  { "title" = "Abdicação e morte", "paragraphs" = [
      "Entre 1554 e 1556, Carlos V dividiu gradualmente o império dos Habsburgo entre uma linha espanhola e um ramo alemão-austríaco. Suas abdicações ocorreram no Palácio de Coudenberg e, portanto, são conhecidas como \"abdicações de Bruxelas\" (Abdankung von Brüssel em alemão e Abdicación de Bruselas em espanhol). Primeiro, ele abdicou dos tronos da Sicília e Nápoles, ambos feudos do papado, e do Ducado Imperial de Milão, em favor de seu filho Filipe em 25 de julho de 1554. Filipe já havia sido secretamente administrado Milão em 1540 e novamente em 1546, mas somente em 1554 o imperador tornou público. Após a abdicação de Nápoles e da Sicília, Filipe foi investido pelo papa Júlio III com o reino de Nápoles em 2 de outubro e com o reino da Sicília em 18 de novembro.",
      "A abdicação mais famosa — e apenas pública — ocorreu um ano depois, em 25 de outubro de 1555, quando Carlos anunciou aos Estados Gerais da Holanda, reunidos no grande salão do palácio onde ele emancipou exatamente quarenta anos antes, sua abdicação em favor de seu filho nesses territórios e sua intenção de renunciar a todas as suas possessões e se retirar para um mosteiro. Foi nessa ocasião que Carlos V pronunciou seu discurso de abdicação:",
      "Quando eu tinha dezenove anos, com a morte do imperador, comprometi-me a ser candidato à coroa imperial, não para aumentar minhas posses, mas para me engajar mais vigorosamente em trabalhar pelo bem-estar da Alemanha e de meus outros reinos e na esperança de trazer a paz entre os povos cristãos e unindo suas forças de combate para a defesa da fé católica contra os otomanos. É por isso que eu tive que fazer muitas viagens árduas, tive que travar muitas guerras árduas […] mas nunca intencionalmente, e sempre contra a minha vontade como pessoa atacada […] Eu tinha grandes esperanças — apenas algumas foram cumpridas, e apenas alguns me restam: e à custa de que esforço! Acabou me deixando cansado e enjoado […] Sofri toda a confusão o mais longe possível até hoje, para que ninguém pudesse dizer que me tornei um fugitivo. Mas agora seria irresponsável adiar mais a demissão. Não pense que quero escapar de quaisquer problemas e perigos: minha força simplesmente não é suficiente […] Quanto a mim: sei que cometi muitos erros, grandes erros, primeiro por causa da minha juventude, depois por causa de erro humano e porque das minhas paixões e, finalmente, por causa do cansaço. Mas deliberadamente não fiz mal a ninguém, quem quer que fosse. Se a injustiça tivesse surgido, aconteceu sem o meu conhecimento e apenas por incapacidade: lamento-a publicamente e peço perdão a todos que eu possa ter ofendido.",
    ] },
]

