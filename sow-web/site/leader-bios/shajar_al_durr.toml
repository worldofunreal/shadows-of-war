[articles.en]
text = "Shajar al-Durr, also Shajarat al-Durr, whose royal name was al-Malika ʿAṣmat ad-Dīn ʾUmm-Khalīl Shajar ad-Durr, was a ruler of Egypt. She was of Turkic origin."
title = "Shajar al-Durr"
lang = "en"
url = "https://en.wikipedia.org/wiki/Shajar_al-Durr"
intro = [
  "Shajar al-Durr (Arabic: شجر الدر, lit. 'Tree of Pearls'), also Shajarat al-Durr (شجرة الدر), whose royal name was al-Malika ʿAṣmat ad-Dīn ʾUmm-Khalīl Shajar ad-Durr (الملكة عصمة الدين أم خليل شجر الدر; died 28 April 1257), was a ruler of Egypt. She was of Turkic origin. She was the wife of As-Salih Ayyub, and later of Izz al-Din Aybak, the first sultan of the Mamluk Bahri dynasty. Prior to becoming Ayyub's wife, she was a child slave and Ayyub's concubine.",
  "In political affairs, Shajar al-Durr played a crucial role after the death of her first husband during the Seventh Crusade against Egypt (1249–1250 AD). She became the sultana of Egypt on 2 May 1250, marking the end of the Ayyubid reign and the start of the Mamluk era.",
]
sections = [
  { "title" = "Title", "paragraphs" = [
      "Several sources assert that Shajar al-Durr took the title of sultana (سلطانة sulṭānah), the feminine form of sultan. However, in the historical sources (notably Ibn Wasil) and on Shajar al-Durr's only extant coin, she is named as sultan.",
    ] },
  { "title" = "Early life", "paragraphs" = [
      "Like many of the \"slave-aristocracy\" at the time (such as the mamluks), Shajar al-Durr was likely of Turkic or Armenian origin, and described by historians as a beautiful, pious, and intelligent woman. She was purchased as a slave by As-Salih Ayyub in the Levant before he became a Sultan and accompanied him and Mamluk Rukn al-Din Baybars al-Salihi (not the Baibars who became a Sultan) to Al Karak during his detention there in 1239. Later when As-Salih Ayyub became a Sultan in 1240 she went with him to Egypt and gave birth to their son Khalil who was called al-Malik al-Mansour. Some time after the birth, As-Salih Ayyub married her.",
      "In April 1249, As-Salih Ayyub, who was gravely sick in Syria, returned to Egypt and went to Ashmum-Tanah, near Damietta after he heard that King Louis IX of France had assembled a crusader army in Cyprus and was about to launch an attack against Egypt. In June 1249, the crusaders landed in the abandoned town of Damietta, at the mouth of the river Nile. As-Salih Ayyub was carried on a stretcher to his palace in the better-protected town of Al Mansurah where he died on 22 November 1249 after ruling Egypt for nearly 10 years. Shajar al-Durr informed Emir Fakhr ad-Din ibn as-Shaikh (commander of all the Egyptian army) and Tawashi Jamal ad-Din Muhsin (the chief eunuch who controlled the palace) of the Sultan's death but as the country was under attack by the crusaders they decided to conceal his death. The coffined body of the Sultan was transported in secret by boat to the castle on al-Rudah island in the Nile. Although the deceased Sultan had not left any testimony concerning who should succeed him after his death, Faris ad-Din Aktai was sent to Hasankeyf to call al-Muazzam Turanshah, the son of the deceased Sultan. The eyewitness observers who were alive and in Egypt at the time of the Sultan's death state that documents were forged by a servant who could copy the Sultan's handwriting. Emir Fakhr ad-Din began issuing decrees and giving Sultanic orders and this small circle of advisors succeeded in convincing the people and the other government officials that the Sultan was only ill rather than dead. Shajar al-Durr continued to have food prepared for the sultan and brought to his tent. High officials, the Sultan's Mamluks and soldiers were ordered – by the will of the \"ill\" Sultan – to swear an oath of loyalty to the Sultan, his heir Turanshah and the Atabeg Fakhr ad-Din…",
      "The news of the death of as-Salih Ayyub reached the crusaders in Damietta and with the arrival of reinforcements led by Alphonse, Count of Poitou, the brother of King Louis IX, they decided to march on Cairo. A crusader force led by Louis IX's other brother Robert I of Artois crossed the canal of Ashmum (known today as Albahr Alsaghir) and attacked the Egyptian camp in Gideila, two miles (3 km) from Al Mansurah. Emir Fakhr ad-Din was killed during the sudden attack and the crusader force advanced toward the town of Al Mansurah. Shajar al-Durr agreed to Baibars's plan to defend Al Mansurah. The crusader force was trapped inside the town, Robert of Artois was killed and the crusader force was annihilated by an Egyptian force and the townspeople, led by the men who were about to establish the state which would dominate the southern Mediterranean for decades: Aybak, Qutuz, Baybars and Qalawun.",
    ] },
  { "title" = "Reign as Sultan", "paragraphs" = [
      "After the assassination of Turanshah, the Mamluks and emirs met at the Sultanic Dihliz and decided to install Shajar al-Durr as the new monarch with Izz al-Din Aybak as atabeg (commander in chief). Shajar al-Durr was informed of this at the Citadel of the Mountain in Cairo and she agreed. Shajar al-Durr took the royal name \"al-Malikah Ismat ad-Din Umm-Khalil Shajar al-Durr\" with a few additional titles such as \"Malikat al-Muslimin\" (Queen of the Muslims) and \"Walidat al-Malik al-Mansur Khalil Emir al-Mo'aminin\" (Mother of al-Malik al-Mansur Khalil Emir of the faithful). She was mentioned in the Friday prayers in mosques with names including \"Umm al-Malik Khalil\" (Mother of al-Malik Khalil) and \"Sahibat al-Malik as-Salih\" (Wife of al-Malik as-Salih). Coins were minted with her titles and she signed the decrees with the name \"Walidat Khalil\". Using the names of her late husband and her dead son attempted to gain respect and legitimacy for her reign as an heir of the Sultanate.",
      "After paying homage to Shajar al-Durr, Emir Hossam ad-Din was sent to King Louis IX, who was still imprisoned in Al Mansurah, and it was agreed that Louis IX would leave Egypt alive after paying half of the ransom imposed on him earlier and surrendering Damietta in exchange for his life. Louis surrendered Damietta and sailed to Acre On 8 May 1250, accompanied by about 12,000 freed war prisoners.",
      "News of the murder of al-Muazzam Turanshah and the inauguration of Shajar al-Durr as the new sultana reached Syria. The Syrian Emirs were asked to pay homage to Shajar al-Durr but they refused and the Sultan's deputy in Al Karak rebelled against Cairo. The Syrian emirs in Damascus gave the city to an-Nasir Yusuf, the Ayyubid emir of Aleppo, and the Mamluks in Cairo responded by arresting the emirs who were loyal to the Ayyubids in Egypt.",
    ] },
  { "title" = "Later life", "paragraphs" = [
      "To please the Caliph and secure his recognition, Aybak announced that he was merely a representative of the Abbasid caliph in Baghdad. To placate the Ayyubids in Syria the Mamluks nominated an Ayyubid child named al-Sharaf Musa as a co-sultan. But this did not satisfy the Ayyubids and armed conflicts between the Mamluks and the Ayyubids broke out. The Caliph in Baghdad, preoccupied with the Mongols who were raiding territories not far from his capital, preferred to see the matter settled peacefully between the Mamluks in Egypt and the Ayyubids in Syria. Through negotiation and mediation of the Caliph that followed the bloody conflict, the Mamluks who manifested military superiority reached an agreement with the Ayyubids that gave them control over southern Palestine including Gaza and Jerusalem and the Syrian coast. By this agreement the Mamluks not only added new territories to their dominion but also gained recognition for their new state.",
      "In addition to the conflict with the Ayyubids of Syria, the Mamluks successfully countered serious rebellions in Middle and Upper Egypt. Then, Aybak, fearing the growing power of the Salihiyya Mamluks who, with Shajar al-Durr, had installed him as a sultan, had their leader Faris ad-Din Aktai murdered. The murder of Aktai was followed instantly by a Mamluk exodus to Syria where they joined the Ayyubid an-Nasir Yusuf. Prominent Mamluks like Baibars al-Bunduqdari and Qalawun al-Alfi were among those Mamluks who fled to Syria. Aybak became the sole and absolute ruler of Egypt after the Salihiyya Mamluks who were the supporters of Shajar al-Durr left Egypt and turned against him.",
      "By 1257 disputes and suspicion had become part of the relations between Aybak, a sultan who was searching for security and supremacy, and his wife Shajar al-Durr, a former Sultana who had a strong will and managed a country on edge of collapse during an external invasion.",
    ] },
  { "title" = "Impact", "paragraphs" = [
      "As a manumitted slave who was not of the Ayyubid line, Shajar al-Durr has the distinction of having been the first Mamluk ruler of Egypt and Syria. Aybak and Shajar al-Durr firmly established the Mamluk dynasty that would ultimately repulse the Mongols, expel the European Crusaders from the Holy Land, and remain the most powerful political force in the Middle East until the coming of the Ottomans.",
      "Shajar al-Durr is one of the characters of Sirat al-Zahir Baibars (Life of al-Zahir Baibars), a folkloric epic of thousands of pages that was composed in Egypt during the early Mamluk era and took its final form in the early Ottoman era. The tale, which is a mix of fiction and fact, reflects the fascination of Egyptian common people for both Baibars and Shajar al-Durr. Fatma Shajarat al-Durr, as the tale names Shajar al-Durr, was the daughter of Caliph al-Muqtadir whose kingdom in Baghdad was attacked by the Mongols. She was called Shajarat al-Durr (tree of pearls) because her father dressed her in a dress that was made of pearls. Her father granted her Egypt as she wished to be the Queen of Egypt and as-Salih Ayyub married her in order to stay in power as Egypt was hers. When Baibars was brought to the Citadel in Cairo, she loved him and treated him like a son and he called her his mother. Aybak al-Turkumani, a wicked man, came from al-Mousil to steal Egypt from Shajarat al-Durr and her husband al-Salih Ayyub. Shajarat al-Durr killed Aybak with a sword but, while fleeing from his son, she fell from the roof of the citadel and died. In addition, Shajar al-Durr's name actually means Tree of Pearls, which is why, in poetry, her mention shows a fruit tree that is formed by pieces of mother-of-pearl.",
      "Tayeb Salih in his story \"The Wedding of Zein\" mentioned \"Shajar ad-Durr\" as \"the former slave girl who ruled Egypt in the thirteenth century.\" He has a character in the story say, \"A man's a man even though he's drooling, while a woman's a woman even if she's as beautiful as Shajar ad-Durr.\"",
    ] },
]

[articles.fr]
text = "Chajar ad-Durr (ou Chagarat al-Durr, ou Shajar al-Durr « arbre de perles » ; ? - 28 avril 1257) est une esclave devenue favorite du sultan ayyoubide d'Égypte As-Salih Ayyûb."
title = "Chajar ad-Durr"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Chajar_ad-Durr"
intro = [
  "Chajar ad-Durr (ou Chagarat al-Durr, ou Shajar al-Durr « arbre de perles » ; ? - 28 avril 1257) est une esclave devenue favorite du sultan ayyoubide d'Égypte As-Salih Ayyûb.",
  "Elle a ensuite régné avec le titre de sultan du 2 ou 4 mai 1250 au 30 juillet 1250 avec le titre de Walidat al-Khalil.",
  "Elle meurt le 28 avril 1257, battue à mort par les servantes de l’ancienne compagne de son deuxième mari.",
  "Des historiens français rendirent hommage à la sagesse et haute intelligence politique de cette souveraine « qui s'égala soudain aux meilleurs hommes d'État tandis que d'autres relativisent son rôle ».",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Les historiens ne connaissent pas l'origine de cette esclave offerte à As-Salih Ayyûb alors qu'il était exilé par son père à la forteresse de Kayfa (1232-1238). Ils hésitent entre une origine arménienne, géorgienne ou turque. On ignore jusqu'à son véritable prénom, car elle n'est entrée dans l'Histoire que depuis qu'Al-Sâlih Ayyub l'a surnommée « arbre de pierres précieuses ». À la mort du sultan Al-Kamil, en 1238, son fils aîné Al-Sâlih se rend au Caire pour lui succéder. Très épris de sa favorite, il abandonne ses épouses précédentes et ses enfants à Kayfa pour n'emmener que Chagarat al-Durr. Elle aura un fils, Khalîl, qui mourra, avant son père, à l'âge de six ans, d'où l'appellation ultérieure de Umm Khalîl. As-Salih Ayyûb a eu un autre fils Tûrân Châh.",
      "En 1249, le roi de France Louis IX lance la septième croisade. Les croisés font escale à Chypre.",
      "À ce moment, le sultan As-Salih Ayyûb est à Damas. Pendant son absence, Chajar ad-Durr va jouer le rôle de régente et va organiser la défense de l'Égypte. À peine As-Salih Ayyûb est-il rentré qu'il meurt, le 21 novembre 1249. Pour ne pas affoler les troupes, Chajar ad-Durr cache cette mort en disant que son époux est simplement malade. Lorsque finalement elle annonce le décès d'As-Salih Ayyûb, c'est le fils de celui-ci, Tûrân Châh, qui est désigné héritier. Partis de Chypre, les croisés arrivent à Damiette, dans le delta du Nil, en mai 1249, avec 1 800 navires. La ville est prise, le 8 juin. Cette lourde défaite provoque chez les généraux turcs de la défiance à l'égard de Tûrân Châh, jugé inapte.",
    ] },
  { "title" = "Annexe", "paragraphs" = [
      "(ar) « المماليك البرجيون/الجراكسة/الشركس » (Les Mamelouks burjites / Les Circassiens / Les Tcherkesses)",
      "(en) « Shagrat al-Durr, Sultan of Eqypt (died, 1259) », sur Female Heroes from the Time of the Crusades",
      "Portail de l’Égypte Portail des croisades Portail des femmes et du féminisme Portail du Moyen Âge central",
    ] },
]

[articles.de]
text = "Schadschar ad-Durr (arabisch شجر الدر, DMG Šaǧar ad-Durr, ägyptisch-Arabisch Sheger ed Durr; † 12. April oder 2./3."
title = "Schadschar ad-Durr"
lang = "de"
url = "https://de.wikipedia.org/wiki/Schadschar_ad-Durr"
intro = [
  "Schadschar ad-Durr (arabisch شجر الدر, DMG Šaǧar ad-Durr, ägyptisch-Arabisch Sheger ed Durr; † 12. April oder 2./3. Mai 1257) war für wenige Tage im Jahr 1250, vom 2. Mai bis 31. Juli, die erste und bis heute einzige selbstständige Herrscherin des islamischen Ägypten.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Schadschar ad-Durr („Perlenbaum“) war türkischer, tscherkessischer oder armenischer Abstammung und wurde einst als Haremssklavin an as-Salih Ayyub, den ayyubidischen Emir von Hisn Kayfa, verschenkt. Wegen ihrer Klugheit und Schönheit wurde sie bald dessen Favoritin und schließlich als eine von insgesamt zwei Frauen geheiratet. Sie teilte mit ihm die Gefangenschaft in Karak von 1239 bis 1240 und gebar dabei den Sohn Chalil, der aber noch als Kind starb. Im Sommer 1240 übernahm as-Salih Ayyub die Macht in Ägypten.",
      "Als im Juni 1249 der sechste Kreuzzug unter König Ludwig IX. (Saint Louis) von Frankreich in Ägypten einbrach, war Sultan as-Salih Ayyub schwer erkrankt. Nachdem die Kreuzfahrer Damiette erobert hatten und nach al-Mansura vorgedrungen waren, starb er im November 1249. Um einen Zerfall der politischen Ordnung in dieser Krisenzeit zu verhindern, beschlossen Schadschar ad-Durr und der Befehlshaber der Kavallerie Dschamal ad-Din Muhassan, den Tod des Sultans geheim zu halten. Als Grund für seine Abwesenheit von der Öffentlichkeit gaben sie seine Krankheit an, von der er sich in den Gemächern seines Palastes in al-Mansura erholen wolle. Einzig den zuvor in Ungnade gefallenen Emir Fachr ad-Din Yusuf, welcher wieder als Oberbefehlshaber des Heeres (Atabeg) eingesetzt wurde, weihten sie ein und bildeten mit ihm so ein geheimes Regierungstriumvirat. Schadschar ad-Durr entsandte kurz darauf den Emir Faris ad-Din Aktay nach Hisn Kayfa, der von dort ihren Stiefsohn al-Mu'azzam Turan Schah als Nachfolger seines Vaters nach Ägypten geleiten sollte. Über die Nachfolgeregelung drohte innerhalb der Regierungstroika ein Konflikt zu entbrennen, da Fachr ad-Din Yusuf den Prinzen al-Mughīth ʿUmar als neuen Sultan favorisierte. Der Machtkampf blieb allerdings aus, da der Emir im Kampf um al-Mansura am 8. Februar 1250 gegen die Kreuzritter fiel. Wenige Tage darauf, am 25. Februar, zog Turan Schah in al-Mansura ein, woraufhin der Tod des alten und die Inthronisierung des neuen Sultans offiziell verkündet werden konnten. Schadschar ad-Durr zog sich nun nach Kairo zurück, während ihr Stiefsohn mit der Mamlukengarde den Kampf gegen die Kreuzfahrer fortsetzte, der am 6. April mit der Gefangennahme des Königs von Frankreich siegreich beendet wurde.",
      "Weil der Sieg vor allem durch die Kampfkraft der Mamluken der Bahriyya- und Dschamdariyya-Regimenter ermöglicht worden war, erkannte Sultan Turan Schah in ihnen eine potentielle Gefahr für seine eigene Macht und beschloss daher die Beseitigung ihrer Anführer. Diese aber kamen ihm zuvor und ermordeten ihn am 2. Mai 1250 in Fariskur. In der nun neu aufgeworfenen Herrscherfrage kamen die Mamluken darin überein, Schadschar ad-Durr als die „Mutter König Chalils“ (Umm al-Malik Chalil) zum neuen „Sultan“ auszurufen; als Atabeg wurde ihr der Mamluk Izz ad-Din Aybak zur Seite gestellt. Die selbstständige Herrschaft der ehemaligen Haremssklavin wurde durch die Einsetzung ihres Namens in die Chutba manifestiert, die Predigt zum traditionellen Freitagsgebet, in welcher der Herrschername für die Öffentlichkeit stets genannt wurde. Laut dem Geschichtsschreiber Ibn Wāsil stellte dies einen in der islamischen Welt bis dahin nicht gekannten Vorgang dar. Mittlerweile hatte jedoch der Ayyubide an-Nasir Yusuf die Herrschaft in Damaskus übernommen. Mehrere Mamluken waren auf seine Seite übergegangen. Als es auch in Kairo zu Unruhen kam, entschlossen sich die Mamluken am 31. Juli 1250, Schadschar ad-Durr als Herrscherin abzusetzen und Izz ad-Din Aybak zum neuen Sultan zu proklamieren. Dessen Herrschername al-Mu'izz wurde in die Chutba eingesetzt und dazu heiratete er Schadschar ad-Durr, die somit auch weiterhin großen Einfluss am Hof von Kairo behielt.",
    ] },
  { "title" = "Dritte Herrscherin im Islam", "paragraphs" = [
      "Entgegen der von Ibn Wāṣil verlautbarten Einzigartigkeit der Herrschaft der Schadschar ad-Durrs als Frau über ein islamisches Reich, war sie dennoch nicht die erste. Zwischen den Jahren 1086 und 1138 herrschte im Jemen mit der malika Saiyida al-Hurra Arwa aus der Dynastie der Sulaihiden die erste bekannte Frau als selbstständige Herrscherin in der islamischen Welt. 1236 gelangte im Sultanat von Delhi zudem mit der Unterstützung der Sklavengarde die Prinzessin Radiyya als Alleinherrscherin auf den Thron, also unter ähnlichen Voraussetzungen wie wenig später Schadschar ad-Durr in Ägypten.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Schagiar Eddor. In: Johann Heinrich Zedler: Grosses vollständiges Universal-Lexicon Aller Wissenschafften und Künste. Band 34, Leipzig 1742, Sp. 813 f.",
      "Hossein Kamaly: Shajarra'-al-Durr (d. 1257). Perils of power, between caliphs and mamluks. In: ders.: A history of Islam in 21 women. Oneworld, London 2019, ISBN 978-1-78607-878-0, S. 73–81.",
      "Fatima Mernissi: Herrscherinnen unter dem Halbmond. Die verdrängte Macht der Frauen im Islam. Herder, Freiburg (Breisgau) u. a. 2004, ISBN 3-451-05478-7 (Herder-Spektrum 5478).",
    ] },
]

[articles.tr]
text = "Şecerüddür (Arapça: شجر الدر, tr. \"İncilerin Ağacı\"), Memlûk Sultanlığı'nın ilk hükümdarıdır."
title = "Şecerüddür"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/%C5%9Eecer%C3%BCdd%C3%BCr"
intro = [
  "Şecerüddür (Arapça: شجر الدر, tr. \"İncilerin Ağacı\"), Memlûk Sultanlığı'nın ilk hükümdarıdır. Türk asıllıydı.",
  "Yedinci Haçlı Seferi sırasında Mısır'da Mansure'ye Haçlılar hücumu sırasında kocası olan Eyyubiler Sultanı Salih Eyyub'un savaş şiddetle devam ederken ölmesi üzerine, tahta geçen Muazzam Turanşah bir suikastle öldürülünce 2 Mayıs 1250'de Memlûk emirleri tarafından Sultan olarak seçilmiştir. Böylece İslam döneminde Mısır'da hükümdarlık yapan tek kadındır. Lakin kısa bir süre sonra bir kadının Müslüman bir toplumda hoş karşılanamayacağı anlaşılmıştır. Hem ülke halkı arasında, hem de diğer Müslüman ülke yöneticilerinden tepkiler yükselmeye başlamıştır. Özellikle Bağdat'daki Abbasi halifesinin (Mustasım Billah) biraz ağır ifadeli mektubu durumu içinden çıkılmaz hale getirmiştir. Halife mektubunda “İçinizde sultan olacak erkek yoksa size Bağdat’dan erkek göndereyim” demektedir. Bunun üzerine Şecerüddür Memlûk emiri Aybeg ile evlenip tahtı ona bırakmıştır. Böylece devletin başına bir Memlûk geçmiş, Memlûk Devleti resmen kurulmuştur.",
  "Tarihçilerin çoğunluğu tarafından Türk asıllı olduğu kabul edilir fakat bazı tarihçiler Rum, Bedevi, Ermeni veya Çerkes asıllı olabileceğini iddia etmişlerdir.",
]
sections = [
  { "title" = "Mısır'a gelme", "paragraphs" = [
      "Şecerüddür, Kafkaslardan Mısır'a getirilen büyük olasılıkla Türk, Rum, Ermeni veya Çerkes asıllı olan bir köle idi. Eyyubiler Sultanı Kamil bin Adil'in oğlu olan Salih Eyyub tarafından cariye olarak satın alındı. Tarihçiler Şecerüddür'ü çok güzel, çok zeki ve gayet dindar bir kadın olarak tasvir etmektedirler. 1239'da Salih Eyyub amcası tarafından Nablus'ta yakalanıp Karak kalesinde tutuklandığı zaman yanında cariyesi Şecerüddür ve Memlûk kölesi Rukneddin Baybars (Sultan Baybars olacak değil bir başka kölemen) bulunmaktaydı. 1240'ta Salih Eyyub kardeşi Mısır Sultanı II. Adil'i yakalayıp tutuklayan Memlûklu emirler desteği ile Mısır Eyyubiler Sultanı oldu. Şecerüddür kocası Sultan Salih Eyyub ile Kahire sultanlık sarayına yerleşti. Aynı yıl bir erkek çocukları oldu ve Halil adı verilip Malik el-Mansur olarak anılmaya başladı. Oğlunun doğumundan sonra Sultan Salih Eyyub o zamana kadar cariyesi olan Şecerüddür ile nikâh yapmıştır.",
    ] },
  { "title" = "Yedinci Haçlı Seferi ve Haçlıların Dimyat kalesinin ele geçirmeleri", "paragraphs" = [
      "Fransa Kralı IX. Louis'nin organize ettiği Yedinci Haçlı Seferi'ni Doğu Akdeniz'e yönelmiş ve Kıbrıs'ta mola vermişti. Eyyubiler hükümdarı olan Salih Eyyub bu Haçlılar ordusunun Akka'ya çıkıp Kudüs'e yönelmesini beklediği için Suriye'de bulunmaktaydı. Ama veremden muzdaripdi ve sıhhati gayet fena idi. Kıbrıs'tan gelen habere göre Haçlı ordusu gemileri ile, beklenildiği gibi Filistin'de Akka'ya değil de, Mısır'a karaya çıkartma yapacaktı. Sultan Salih Eyyub gayet acele olarak Mısır'a geçti. Nisan 1249'da Dimyat kalesi yakınlarında Asnum-Tanah'da Haçlıları beklemeye koyuldu. Hasta olduğu için buraya at üzerinde değil sedye ile getirilmişti. Beşinci Haçlı Seferi'nde uzun zaman direnen Dimyat'da bulunan Emir Fahreddin Yunus komutasındaki Mısır ordusu savunucuları Haziran başında Haçlılar ordusunu görününce onlar daha karaya çıkmaya başlamadan Dimyat kalesini boşalttılar ve şehrin sivil halkı da onları takiben şehirden ayrıldılar. Karaya çıkan Haçlılar ordusu Dimyat'a hiç direniş görmeden girdi. Buna bir nedenin Emir Fakreddin Yusuf'un Sultanın gayet ağır hasta olduğunu bilmesi ve ondan Asnum-Tanah'dan bir müddet hiçbir haber gelmemesini Sultan'ın ölmüş olduğuna yorduğu ve bu nedenle Dimyat'ı direnişiz terk ettiğidir. Bu Haçlı seferinin Hristiyan kronikçi-tarihçisi Joinville şöyle demektedir:",
      "\"Müslümanlar sultana üç değişik güvercin postası ile Kral Louis'in karaya çıktığı haberini gönderdiler. Sultan hasta olduğu için iletilerine hiçbir cevap alamadılar. Bu nedenle Sultan'ın öldüğüne inanarak Dimyat kalesini terk ettiler. Türkler bu kaleyi terk ederken kayıklardan yapılmış köprüyü yıkmayıp büyük bir hata yaptılar. Eğer bu köprü yıkılmış olsaydı Nil Nehri ağzında Haçlılar karşıya geçmek için epeyce güçlük ile karşılaşacaklardı. (Joinville, II.Kısım VI. Bölüm 72. paragraf)",
    ] },
  { "title" = "Sultan Salih Eyyub'un ölümü", "paragraphs" = [
      "Sultan yine sedye ile Asnum-Tanah'dan daha korunaklı bir mevki olan Mansure Kalesinde bulunan saraya taşındı. Burada iken bacağında bir abse çıktı ve doktorlar iyileştiremediler. Sultan'ın bacağının kesilmesi gerektiğine karar verdiler. Fakat bu ameliyat yapıldıktan hemen sonra 22 Kasım 1249'da Sultan Salih Eyyub öldü. Mısır Sultanı olarak 10 yıl hüküm sürmüştü. Sultan Salih Eyyub'un cesedi gizlice Nil Nehri üzerinden bulunan ve Memlûklu askerlerinin istirahat mevkii olarak kullanılan Rauda Adasındaki (Kalat-ı Ruda) kalesine götürüldü ve orada gizli bir mezara gömüldü. Haçlılar tehlikesi geçtikten sonra tahta geçen Sultan Aybeg, sultan Salih Eyyub'un mezarını Kahire'de kendi medresesi yanında yaptırdığı türbeye taşıtmıştır.",
      "Dimyat kalesi hiç direnmeden Haçlılar eline geçtikten sonra Haçlılar buradan Mansure Kalesi önlerine yürüdüler. Mansure Kalesi önünde bulunan \"Bahr-El-Saghir\" adli kanal Nil Nehri'nin mevsimlik yükselmesi dolayısıyla kale önünde çok yükselmişti. Mansure Kalesi Eyyubiler ordusu tarafından savunulmaktaydı. Haçlılar kale önünde kanal ötesinde ordugahlarını kurdular. Sular çekilinceye kadar 6 ay Haçlılar ordusu bu kale önünde kaldı. Önce Haçlılarla ufak çatışmalar yapıldı. Eyyubiler Mısır ordusundaki eksiklikler bu ordunun Memlûklu emir komutanları tarafından düzene koyuldu. Başta Emir Fahrettin Yusuf olarak, Mısır ordusunun Memlûklu emirleri Haçlılar ordusuna karşı Mısır ordusunun direnişini organize ettiler.",
      "Tam büyük bir savaş sırasında Sultan ve orduların komutanı olan Sultan Salih Eyyub'un ölmesi Mısır ordusuna moralman büyük bir aksi etki yapacağı aşikardı. Bu nedenle Şecer-üd-Dürr, saray işlerine bakan en yüksek görevli olan hadim Tavası Cemaleddin Muhsin ile ordunun komutanı olan Emir Fahreddin Yusuf'un en önemli tavsiyeleri ile Sultan Salih Eyyub'un ölümünün gizlenmesine karar verdi. Mısır ordusunu idare eden küçük sayıda kölemen Memlûklu emirlerin yardım ve desteği ile Sultan Salih Eyyub'un dul eşi olan Şecer-üd-Dürr kocasının ölümünü gizli tuttu.",
    ] },
  { "title" = "Şecerüddür'ün efektif olarak Mısır Sultanlığı ve Haçlıların mağlup edilmesi", "paragraphs" = [
      "Muzaffer Turanşah Mısır'a Mansure'ye gelinceye kadar Şecer-üd-Dürr efektif olarak Mısır Sultanlığı yapmaya başladı. Sultan ameliyat olmadan önce büyük sayıda boş buyruk kağıdı altına kendi imzasını (alametini) atmıştı. Sultan buyrukları bu boş buyruk kâğıtları kullanılarak Şecer-üd-Dürr ve ordu komutanı Emir Fahrettin Yusuf tarafından hazırlatıldı. Ayrıca Sultan'ın imzalaması gerek diğer belgeler için Sohail adlı bir hizmetkara Sultan'ın imzasını taklit ettirdiler. Böylece Seçer-ud-Durr herkesi Sultan'ın hasta olduğuna inandırdı. Şecer-üd-Dürr sürekli olarak Sultan için her gün yemek hazırlattı; bunlar Sultan'ın çadırına dolu olarak getirildi ve boş kapkacak tabaklar ve çöp oradan alındı. Sultan Salih Eyyub bir veraset belgesi hazırlamamıştı ve oğlu Muazzam Turanşah'ı Mısır'a çağırmakla beraber onun sultan olmasını istediğine dair bir resmî belge bulunmamakta idi. Seçer-ud-Durr böyle bir sahte belge hazırlattı. Bu belge kullanılarak tüm yüksek idare mensuplarının, saraylıların, Memlûklu emir ve askerlerin (ölmüş) Salih Eyyub'un talebine uyarak oğlu ve vârisi Muazzam Turanşah'a biat için yemin etmelerini sağlandı.",
      "Sultan Salih Eyyub'un ölmüş olması ihtimali Mansure'de bulunan birçok Mısırlı idareci ve asker tarafından bilinmekteydi. Yardımcı Sultan olup sultanın ölümünü gizleyen Emir Hüsammedin, (altında Sohail'in taklit ettiği Sultan imzası bulunan) bir sultan buyruğunu aldığı zaman bu belgeyi şüpheli bulup bu buyruk hakkında şikayetlerini en yüksek idari makama sunduğunda Sultanın ölmüş olduğu yanıtını almıştı. Birçok Memlûklu emir ve asker atabey (ordu komutanı) olan Emir Fahreddin Yusuf'un tam bir hükümdar gibi gayet otoriter tutumlarını sultanın öldüğünü bilmesinden dolayı olduğuna yorumlamışlardı. Birçok kişi Muazzam Turanşah'a Hasankeyf'e Emir Farissettin Aktay'ın gönderilmesini Sultanın ölmesinden dolayı olduğunu tahmin etmişlerdi.",
      "Bu haberler Haçlılar kampına da yetişmekteydi ve Haçlıların Dimyat'ta bulunan en yüksek komutanları da Sultan'ın ölmüş olduğuna inanmaya başladılar. Tam bu sırada Avrupa'dan yeniden IX. Louis'in kardeşi Alfonso, Poitou Kontu komutasında büyük bir takviye Haçlı asker Mısır'daki Haçlılar ordusuna katıldı. Yeter sayıda takviyeli olan Haçlı ordusunun doğrudan doğruya Kahire üzerine yürümesi kararlaştırıldı. Bu ordudan ayrılan büyük bir Haçlı ordusu birliği ise Fransa Kralı IX. Louis'in diğer kardeşi olan I. Robert Artoislı emrine verildi. Bu birlik (günümüzde Albahr Alsaghir adı verilen) Asnum kanalından karşıya geçerek Mansure'ye 3 km uzaklıkta olan Gidella'da bulunan Mısır askeri ordugahına bir baskın saldırı düzenledi. Memlûklu ordusu komutanı olan Emir Fahreddin Yusuf bu baskını beklemediği için hiç korumasız bulunmaktaydı. Bir grup Haçlı asker tarafından elbiselerini giyerken öldürüldü. Haçlı birliği daha ilerleyip Mansure şehrine saldırıya başladı. Sultana Şecer-üd-Dürr bu sırada, kendi inisiyatifi ile Mısır ordusunun komutasını üstüne almış olan, kölemen Emir Baybars'in plan tavsiyelerini kabul edip Mısır ordusu Mansure şehrini çok ciddiyetle savunmaya başladı. Hücum eden Haçlı birliği Mansure şehri içinde mahsur kaldı. Bu birliğin komutanı olan Robert Artois öldürüldü ve birliğin tüm üyeleri de öldürülüp birlik imha edildi. Mısır ordusunun Haçlılar baskınından kaçabilen kısım ile şehir halkından oluşan bu zaferi kazanan Mısır ordusuna komuta eden kölemen emir Fariseddin Aktay'dı. Ama bu zaferde diğer önemli rol oynayan komutanlar, Eyyubilerden sonra yıllarca doğu Akdeniz'i korumaları altına alacak Memlûklular devletinin idarecileri olacak olan, kölemen Baybars Bundukdari, Muizziddin Aybeg ve Kalavun El-Alfi idiler.",
    ] },
]

[articles.ja]
text = "シャジャル・アッ＝ドゥッル（シャジャルッドゥッル、アラビア語：شجر الدر 転写：Shajar al-Durr、 ? - 1257年4月28日）は、アイユーブ朝のスルタン、サーリフの夫人で、マムルーク朝の初代君主（在位：1250年）。イスラム世界の歴史において稀少な女性の君主。アイユーブ朝を引き継いでエジプトを支配したマムルーク朝は、初代スルタンにシャジャル・アッ＝ドゥッルを継承したイッズッディーン・アイバクを擬することも多いが、事実上は、わずか3ヶ月であっても統治を行ったシャジャル・アッ＝ドゥッルが開いた王朝であると言える。 幼少時に親族を失い、女官見習奴隷としてカリフの後宮で育ち、アラビア語を身につけたとされる。民族的にはテュルク系あるいはアルメニア系の出身と考えられているが、テュルク系主体のマムルークによって支持されたことから、テュルク系と見たほうが良いようである。その名はアラビア語で「真珠の木」を意味し、これはカリフから与えられた妻妾としての名前であるとされ、本名は不詳。伝記作家のサファディー（1363年没）は「シャジャル・アッ＝ドゥッルは類いまれな美しさで、見識があり、抜け目がなく、知性的であった」と記している。美しい容貌にくわえて、マムルーク軍団バフリーヤを統率する政治的手腕を備えていたとみられる。 スルタンの地位を夫であるアイバクに譲った後、アイバクが軍事同盟を結ぶためにモースルのアミールの親族から若い妻を娶ろうとしたため、嫉妬から夫を殺害した。自らは夫の配下のマムルークに捕らえられ、夫アイバクの元妻によって殺された。"
title = "シャジャル・アッ＝ドゥッル"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B7%E3%83%A3%E3%82%B8%E3%83%A3%E3%83%AB%E3%83%BB%E3%82%A2%E3%83%83%EF%BC%9D%E3%83%89%E3%82%A5%E3%83%83%E3%83%AB"
intro = [
  "シャジャル・アッ＝ドゥッル（シャジャルッドゥッル、アラビア語：شجر الدر 転写：Shajar al-Durr、 ? - 1257年4月28日）は、アイユーブ朝のスルタン、サーリフの夫人で、マムルーク朝の初代君主（在位：1250年）。イスラム世界の歴史において稀少な女性の君主。アイユーブ朝を引き継いでエジプトを支配したマムルーク朝は、初代スルタンにシャジャル・アッ＝ドゥッルを継承したイッズッディーン・アイバクを擬することも多いが、事実上は、わずか3ヶ月であっても統治を行ったシャジャル・アッ＝ドゥッルが開いた王朝であると言える。",
  "幼少時に親族を失い、女官見習奴隷としてカリフの後宮で育ち、アラビア語を身につけたとされる。民族的にはテュルク系あるいはアルメニア系の出身と考えられているが、テュルク系主体のマムルークによって支持されたことから、テュルク系と見たほうが良いようである。その名はアラビア語で「真珠の木」を意味し、これはカリフから与えられた妻妾としての名前であるとされ、本名は不詳。伝記作家のサファディー（1363年没）は「シャジャル・アッ＝ドゥッルは類いまれな美しさで、見識があり、抜け目がなく、知性的であった」と記している。美しい容貌にくわえて、マムルーク軍団バフリーヤを統率する政治的手腕を備えていたとみられる。",
  "スルタンの地位を夫であるアイバクに譲った後、アイバクが軍事同盟を結ぶためにモースルのアミールの親族から若い妻を娶ろうとしたため、嫉妬から夫を殺害した。自らは夫の配下のマムルークに捕らえられ、夫アイバクの元妻によって殺された。",
]
sections = [
  { "title" = "経歴", "paragraphs" = [
      "シャジャル・アッ＝ドゥッルは、もとはバグダードのアッバース朝のカリフの後宮（ハレム）にいた奴隷であったといわれ、のちにアイユーブ朝のエジプト君主となったサーリフに贈られたといわれる。いずれにせよ、1240年頃までにサーリフの寵愛を受け、サーリフの息子ハリール（夭折）を生んで解放奴隷とされ、サーリフの正夫人となった。",
      "1250年にフランス国王ルイ9世率いる十字軍がエジプトに侵攻したとき、サーリフが急死し、サーリフの存命の子トゥーラーン・シャーはイラクにいてエジプトに不在であったため、アイユーブ朝軍の指揮者が不在となる事態に陥った。このとき、シャジャル・アッ＝ドゥッルは軍の動揺を防ぐためにサーリフの死を隠匿し、まだ彼が生きているかのように食事を運ばせる傍ら、自らが夫の名代として政事の決裁を行った。続けて、サーリフの名によって軍を動かし、マンスーラの戦いを勝利に導いて、サーリフ子飼いのマムルーク軍団バフリーヤの絶大な支持を集めた。",
      "戦後、トゥーラーン・シャーがカイロに入り、アイユーブ朝のスルタンに即位するが、やがて継母であるシャジャル・アッ＝ドゥッルがサーリフの財産を握って実権を譲らないことから仲たがいし、また父の子飼いのマムルーク軍団を信頼せず、その有力者を投獄したり、自身の側近を取り立てたりした。このため、1250年にシャジャル・アッ＝ドゥッルはマムルーク達を動かしてトゥーラーン・シャーを殺害し、名実ともにアイユーブ朝を滅ぼした。シャジャル・アッ＝ドゥッルはマムルークの有力者が王位をめぐって策動するのを退け、バフリーヤのマムルークの推戴を受けて、同年5月に「サーリフの僕、ハリールの母」の称号で自らスルタンに即位した。",
    ] },
]

[articles.ar]
text = "شجر الدرّ (أو شجرة الدّر)، (ت 1257) الملقبة بعصمة الدين أم خليل، خوارزمية الأصل، وقيل أنها أرمينية أو تركية. كانت جارية اشتراها السلطان الصالح نجم الدين أيوب، وحظيت عنده بمكانة عالية حتى أعتقها وتزوجها وأنجبت منه ابنها خليل الذي توفي في 2 من صفر 648 هـ (مايو 1250م)."
title = "شجر الدر"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%B4%D8%AC%D8%B1_%D8%A7%D9%84%D8%AF%D8%B1"
intro = [
  "شجر الدرّ (أو شجرة الدّر)، (ت 1257) الملقبة بعصمة الدين أم خليل، خوارزمية الأصل، وقيل أنها أرمينية أو تركية.",
  "كانت جارية اشتراها السلطان الصالح نجم الدين أيوب، وحظيت عنده بمكانة عالية حتى أعتقها وتزوجها وأنجبت منه ابنها خليل الذي توفي في 2 من صفر 648 هـ (مايو 1250م). تولت عرش مصر لمدة ثمانين يومًا بمبايعة من المماليك وأعيان الدولة بعد وفاة السلطان الصالح أيوب، ثم تنازلت عن العرش لزوجها المعز أيبك التركماني سنة 648 هـ (1250م). لعبت دورًا تاريخيًا هامًا أثناء الحملة الصليبية السابعة على مصر وخلال معركة المنصورة.",
]
sections = [
  { "title" = "أصولها", "paragraphs" = [
      "كانت شجرة الدر جارية من أصل تركي أو خوارزمي وقيل إنها أرمنية. اشتراها الصالح أيوب قبل أن يكون سلطاناً، ورافقته في فترة اعتقاله في الكرك سنة 1239 مع مملوك له اسمه ركن الدين بيبرس الصالحي (ليس الظاهر بيبرس الذي أصبح سلطاناَ لاحقاً سنة 1260م) وأنجبت ولدًا اسمه خليل. لُقِبَ بالملك المنصور. وبعد ما خرج الصالح من السجن ذهبت معه إلى مصر وتزوجا هناك.وبعد أن أصبح سلطان مصر سنة (1240 م) بقيت تنوب عنه في الحكم عندما يكون خارج مصر.",
      "في أبريل 1249 م كان الصالح أيوب في الشام يحارب الملوك الأيوبيين الذين ينافسونه على الحكم وصلته أخبار أن ملك فرنسا لويس التاسع (Louis IX)-الذي أصبح قديساً بعد وفاته. في قبرص، وفي طريقه لمصر على رأس حملة صليبية كبيرة حتى يغزوها بالقرب من دمياط على البر الشرقي للفرع الرئيسي للنيل، حتى يجهز الدفاعات لو هجم الصليبيون. وفعلاً، في يونيو 1249 م نزل فرسان وعساكر الحملة الصليبية السابعة من المراكب على بر دمياط ونصبوا خيمة حمراء للملك لويس. وانسحبت العربات التي كان قد وضعها الملك الصالح في دمياط للدفاع عنها فاحتلها الصليبيون بسهولة وهي خالية من سكانها الذين تركوها عندما رأو هروب العربات. فحزن الملك الصالح وأعدم عدداً من راكبي العربات بسبب جبنهم وخروجهم عن أوامره. انتقل الصالح لمكان آمن في المنصورة.وفي 23 نوفمبر 1249 م توفي الملك الصالح بعد أن حكم مصر 10 سنين وفي لحظة حرجة جداً من تاريخها.",
      "استدعت شجرة الدر قائد الجيش المصري «الأمير فخر الدين يوسف» ورئيس القصر السلطاني «الطواشي جمال الدين محسن»، وقالت لهم إن الملك الصالح توفي وأن مصر الآن في موقف صعب من غير حاكم، وهناك غزو خارجي متجمع في دمياط. فاتفق الثلاثة أن يخفوا الخبر حتى لا تضعف معنويات العساكر والناس ويتشجع الصليبيون. وفي السر ومن غير أن يعلم أحد نقلت شجرة الدر جثمان الملك الصالح في مركب على القاهرة ووضعته في قلعة جزيرة الروضة. ومع أن الصالح بن أيوب لم يوص قبل أن يموت بمن يمسك الحكم من بعده، إلا أن شجرة الدر بعثت زعيم المماليك البحرية «فارس الدين أقطاى الجمدار» على حصن كيفا حتى يستدعي «توران شاه» ابن الصالح أيوب ليحكم مصر بدل أبيه المتوفى.",
    ] },
  { "title" = "انتصار المماليك على الحملة الصليبية السابعة", "paragraphs" = [
      "وصلت أخبار وفاة الصالح أيوب للصليبيين في دمياط بطريقة ما. وفي نفس الوقت وصلت إلى دمياط إمدادات مع «الفونس دو بويتي» (Alphonse de Poitiers) أخ الملك لويس. فتشجع الصليبيون وقرروا الخروج من دمياط والتوجه للقاهرة. واستطاعت قوات من الفرسان الصليبيين، بقيادة روبرت دارتوا (Robert d'Artois) أخ الملك لويس، اجتياز قناة اشموم عن طريق مخاضة عرفوها عن طريق أحد قادة العربات. فهجموا فجأة على المعسكر المصري في جديلة على بعد حوالي 3 كليومتر من المنصورة. قتل الأمير فخر الدين يوسف وهو خارج من الحمام على صوت الضجة والصريخ فهربت العساكر التي بغتها الهجوم غير المتوقع وذهبوا إلى المنصورة.",
      "عرض الأمير ركن الدين بيبرس على شجرة الدر، الحاكمة الفعلية لمصر في هذا الوقت، خطة وضعها يدخل فيها الفرسان الصليبيون المندفعون نحو المنصورة في مصيدة فوافقت شجر الدر على الخطة. اجتمع بيبرس وفارس الدين اقطاي الذي أصبح القائد العام للجيوش المصرية. نظم صفوف العساكر المنسحبين من جديلة داخل المنصورة وطلب منهم ومن السكان التزام السكون التام بحيث يظن الصليبيون المهاجمون أن المدينة خالية مثل ما حصل في دمياط. وفعلاً وقع الفرسان الصليبيون في الفخ واندفعوا إلى داخل المنصورة واتجهوا نحو القصر السلطاني حتى يحتلوه. فخرجت لهم المماليك البحرية والمماليك الجمدارية فجأة وهاجموهم من كل ناحية بالسيوف والسهام وخرج سكان المنصورة والمتطوعون وهم يرتدون خوذ من النحاس الأبيض بدل خوذات العساكر وضربوهم بكل ما أوتوا من قوة.",
      "حاصر المماليك القوات الصليبية المهاجمة وأغلقوا الشوارع والحواري وبقي الصليبيون غير قادرين على الهروب ولم يبق أمامهم سوى الموت على الأرض أو أن يرموا أنفسهم في نهر النيل ويغرقوا فيه. اختبأ «روبرت دارتوا» أخ لويس داخل بيت لكن الناس وجدوه وقتلوه، وانتهت المعركة بهزيمة الصليبيين هزيمة منكرة في حواري المنصورة. وقتل منهم عدد كبير لدرجة أنه لم ينج من فرسان المعبد إلا واحد أو اثنان.",
    ] },
  { "title" = "التخلص من توران شاه", "paragraphs" = [
      "بعد النصر تنكر السلطان الجديد لشجرة الدر، وبدلاً من أن يحفظ لها جميلها بعث يهددها ويطالبها بمال أبيه، فكانت تجيبه بأنها أنفقته في شؤون الحرب وتدبير أمور الدولة، فلما اشتد عليها، ورابها خوف منه ذهبت إلى القدس خوفًا من غدر السلطان وانتقامه.",
      "ولم يكتف توران شاه بذلك بل امتد حنقه وغيظه ليشمل أمراء المماليك، أصحاب الفضل الأول في تحقيق النصر العظيم وإلحاق الهزيمة بالحملة الصليبية السابعة، وبدأ يفكر في التخلص منهم غير أنهم كانوا أسبق منه في الحركة وأسرع منه في الإعداد فتخلصوا منه بالقتل على يد أقطاي.",
    ] },
  { "title" = "المبايعة", "paragraphs" = [
      "وجد المماليك أنفسهم في وضع جديد؛ فهم اليوم أصحاب الكلمة الأولى في البلاد ومقاليد الأمور في أيديهم، ولم يعودوا أداة في يد من يستخدمهم لتحقيق مصلحة أو نيل هدف وعليهم أن يختاروا سلطانًا للبلاد. وبدلاً من أن يختاروا واحدًا منهم لتولي شؤون البلاد اختاروا شجرة الدر لتولي هذا المنصب الرفيع.",
      "أخذت البيعة للسلطانة الجديدة ونقش اسمها على السِّكة بالعبارة الآتية «المستعصمية الصالحية ملكة المسلمين والدة خليل أمير المؤمنين».",
      "جدير بالذكر أن شجرة الدر لم تكن أول امرأة تحكم في العالم الإسلامي، فقد سبق أن تولت رضية الدين سلطنة دلهي، واستمر حكمها أربع سنوات (634 - 638 هـ) الموافق (1236 - 1240م). وحكمت أروى بنت أحمد الصليحي من سلالة بنو صليح اليمن من تاريخ (492 - 532 هـ) الموافق (1098 - 1138م).",
    ] },
]

[articles.vi]
text = "Shajar al-Durr (tiếng Ả Rập: شجر الدر, \"Cây ngọc trai\") (tên Hoàng gia: al-Malika 'Asmat ad-Din Umm-Khalil Shajar ad-Durr (tiếng Ả Rập: الملكة عصمة الدين أم خليل شجر الدر) (biệt danh: Um Khalil, Umm Khalil; mẹ của Khalil) (- 28 tháng 4 năm 1257, Cairo) là người phụ nữ Hồi giáo thứ hai (sau Razia Sultana của Delhi) để trở thành một vị vua trong lịch sử Hồi giáo. Bà là vợ của As-Salih Ayyub, Sultan của triều đại Ayyubid và sau Izz al-Din Aybak, Sultan của triều Bahri."
title = "Shajar al-Durr"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Shajar_al-Durr"
intro = [
  "Shajar al-Durr (tiếng Ả Rập: شجر الدر, \"Cây ngọc trai\") (tên Hoàng gia: al-Malika 'Asmat ad-Din Umm-Khalil Shajar ad-Durr (tiếng Ả Rập: الملكة عصمة الدين أم خليل شجر الدر) (biệt danh: Um Khalil, Umm Khalil; mẹ của Khalil) (- 28 tháng 4 năm 1257, Cairo) là người phụ nữ Hồi giáo thứ hai (sau Razia Sultana của Delhi) để trở thành một vị vua trong lịch sử Hồi giáo. Bà là vợ của As-Salih Ayyub, Sultan của triều đại Ayyubid và sau Izz al-Din Aybak, Sultan của triều Bahri.",
  "Trong các vấn đề chính trị, Shajar al-Durr đóng một vai trò quan trọng sau cái chết của chồng đầu tiên của cô trong suốt thập tự chinh thứ bảy chống lại Ai Cập (1249-1250). Cô đã trở thành Sultana của Ai Cập vào ngày 2 tháng 5 năm 1250, đánh dấu sự kết thúc của triều đại Ayyubid và sự khởi đầu của thời đại Mamluk. Có nhiều giả thuyết về nguồn gốc dân tộc của Shajar al-Durr. Nhiều sử gia Hồi giáo tin rằng bà xuất xứ Turkic và một số tin rằng cô ấy có nguồn gốc Armenia.",
]
sections = [
  { "title" = "Bối cảnh", "paragraphs" = [
      "Shajar al-Durr có nguồn gốc từ Turk và được các nhà sử học mô tả là một người phụ nữ xinh đẹp, ngoan đạo và thông minh. và được các sử gia mô tả như là một người phụ nữ xinh đẹp, mộ đạo và thông minh . Cô đã được mua như một nô lệ của As-Salih Ayyub ở Levant trước khi trở thành một Sultan và đi cùng anh ta và Mamluk Baibars (không phải là Baibars người đã trở thành một Sultan) cho Al Karak trong thời gian bị giam giữ ở đó năm 1239. Sau đó khi As-Salih Ayyub trở thành Sultan vào năm 1240, cô đi cùng anh đến Ai Cập và sinh ra con trai của họ là Khalil, người được gọi là al-Malik al-Mansour. Some time after the birth, As-Salih Ayyub married her.",
      "Tháng 4 năm 1249, As-Salih Ayyub, người đã bị bệnh nặng ở Syria, trở về Ai Cập và đến Ashmum-Tanah, gần Damietta sau khi nghe tin vua Louis IX của Pháp đã tập hợp một đội quân thập tự chinh ở Síp Và sắp sửa tấn công Ai Cập. Tháng 6 năm 1249, những người thuộc dòng Xô-viết đã hạ cánh xuống thị trấn Damietta bị bỏ rơi, tại cửa sông Nile. As-Salih Ayyub được mang trên cáng đến cung điện của ông tại thị trấn Al Mansurah được bảo vệ tốt hơn, nơi ông qua đời vào ngày 22 tháng 11 năm 1249 sau khi cai trị Ai Cập trong gần 10 năm. Shajar al-Durr thông báo cho Emir Fakhr ad-Din Yussuf Ben Shaykh (chỉ huy của quân đội Ai Cập) và Tawashi Jamal ad-Din Muhsin (thái giám giám đốc cung điện) về cái chết của Sultan nhưng khi đất nước này bị tấn công bởi Các thánh giá họ đã quyết định để che giấu cái chết của mình. Thân xác của Sultan được vận chuyển bí mật bằng thuyền đến lâu đài trên hòn đảo al-Rudah ở sông Nile. Mặc dù người Sultan đã qua đời đã không để lại bất kỳ lời khai nào về việc ai sẽ thành công sau khi ông qua đời, Faris ad-Din Aktai đã được gửi đến Hasankeyf để gọi al-Muazzam Turanshah, con của người Sultan đã mất. Trước khi chết, Sultan đã ký một số giấy tờ trống ref>According to Al-Maqrizi, Sultan as-Salih Ayyub made 10.000 Alama (Sultan's sign) before his death. (Al-Maqrizi, p. 441/vol.1)</ref> mà Shajar al-Durr và Emir Fakhr ad-Din đã sử dụng để ban hành các nghị định và đưa ra các lệnh của Sultanic Các quan chức cao cấp, Mamluks của Sultan và những người lính được lệnh - theo ý của Sultan \"ốm yếu\" - tuyên thệ trung thành với Sultan, người kế vị Turanshah",
    ] },
]

[articles.id]
text = "Syajar ad-Durr (Arabic: شجر الدر, \"Tree of Pearls\") (Nama kerajaan: al-Malikah `Ashmatuddīn Ummu Khalīl Syajaruddurr (Arab: الملكة عصمة الدين أم خليل شجر الدر) (julukan: أم خليل, Ummu Khalil; bunda Khalil)) (? – 28 April 1257, Kairo) adalah wanita Muslim kedua (setelah Radhiyah Sultanah dari Delhi) yang menjadi penguasa dalam sejarah Islam."
title = "Syajaruddur"
lang = "id"
url = "https://id.wikipedia.org/wiki/Syajaruddur"
intro = [
  "Syajar ad-Durr (Arabic: شجر الدر, \"Tree of Pearls\") (Nama kerajaan: al-Malikah `Ashmatuddīn Ummu Khalīl Syajaruddurr (Arab: الملكة عصمة الدين أم خليل شجر الدر) (julukan: أم خليل, Ummu Khalil; bunda Khalil)) (? – 28 April 1257, Kairo) adalah wanita Muslim kedua (setelah Radhiyah Sultanah dari Delhi) yang menjadi penguasa dalam sejarah Islam. Ia adalah istri Ash-Shalih Ayyub, Sultan Mesir dari dinasti Ayyubiyah dan kemudian Izzuddin Aibak, Sultan Mesir dari dinasti Bahri.",
  "Dalam urusan politik, Syajar al-Durr memainkan peran krusial setelah kematian suami pertamanya pada Perang Salib Ketujuh melawan Mesir (1249–1250). Ia menjadi Sultanah Mesir pada 2 Mei 1250, menandai akhir pemerintahan Ayyubiyah dan dimulainya Mamluk. Terdapat beberapa teori tentang asal muasal etnis Syajar ad-Durr. Beberapa sejarawan Muslim meyakini bahwa ia berdarah Turkik dan beberapa meyakini bahwa ia berdarah Armenia.",
]
sections = [
  { "title" = "Referensi", "paragraphs" = [
      "Idem in English: Bohn, Henry G., The Road to Knowledge of the Return of Kings, Chronicles of the Crusades, AMS Press, 1969.",
      "Al-Maqrizi, al-Mawaiz wa al-'i'tibar bi dhikr al-khitat wa al-'athar,Matabat aladab,Cairo 1996, ISBN 977-241-175-X.",
      "Idem in French: Bouriant, Urbain, Description topographique et historique de l'Egypte,Paris 1895",
    ] },
  { "title" = "Pranala luar", "paragraphs" = [
      "Women in World History – Female Heroes from the Time of the Crusades: Shagrat al-Durr",
    ] },
]

