[articles.tr]
text = "Puyi, 1908’de iki yaşında Qing tahtına çıktı. 12 Şubat 1912’de Xuantong imparatoru adına çıkarılan çekilme fermanı Qing yönetimini sona erdirdi ve Yuan Shikai’ye cumhuriyeti kurma yetkisi verdi. Puyi henüz çocuktu. Dul İmparatoriçe Longyu’nun da yer aldığı saray, cumhuriyetçilerle varılan anlaşmada rol aldı. Anlaşma Puyi’ye unvanını koruma ve ödenek alma hakkı tanıyor, imparatorluk hanesinin geçici olarak Yasak Şehir’de kalmasına izin veriyordu. 1932’de Puyi, Çin’in kuzeydoğusunda Japonya’nın himayesinde kurulan Mançukuo’nun başına getirildi. Eski imparatorluk unvanı siyasi değer taşıyordu ve konumu Japon makamlarına bağlıydı. Bağımlı Saray bu ilişkiyi oyuna taşır. Puyi’den fazla toprağı olan hayattaki müttefikler arasında olağan kara geliri en yüksek olan esas alınır. Puyi bu gelirin yüzde 20’si kadar ek altın alır ve müttefikin altını eksilmez. Koşulları karşılayan müttefik kalmadığında ek gelir sona erer."
title = "Puyi"
lang = "tr"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
