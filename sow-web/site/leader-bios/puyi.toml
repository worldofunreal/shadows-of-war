[articles.vi]
text = "Phổ Nghi lên ngôi nhà Thanh năm 1908 khi mới hai tuổi. Ngày 12 tháng 2 năm 1912, chiếu thoái vị được ban hành dưới danh nghĩa hoàng đế Tuyên Thống, chấm dứt quyền cai trị của nhà Thanh và giao cho Viên Thế Khải tổ chức chính phủ cộng hòa. Phổ Nghi còn nhỏ, nên Long Dụ Hoàng thái hậu và triều đình tham gia thỏa thuận với phe cộng hòa. Các điều khoản cho phép ông giữ danh hiệu, nhận trợ cấp và để hoàng thất tạm trú trong Tử Cấm Thành. Năm 1932, Phổ Nghi được đưa lên đứng đầu Mãn Châu Quốc, chính thể thành lập dưới sự chi phối của Nhật Bản ở vùng Đông Bắc Trung Quốc. Danh hiệu cũ có giá trị chính trị, còn vị thế của ông phụ thuộc vào nhà chức trách Nhật Bản. Triều đình lệ thuộc đưa mối quan hệ này vào trận đấu. Trong số đồng minh còn sống có nhiều lãnh thổ hơn Phổ Nghi, hệ thống chọn người có thu nhập đất liền thông thường cao nhất. Phổ Nghi nhận thêm vàng bằng 20% khoản thu ấy, và đồng minh vẫn giữ nguyên vàng của mình. Thu nhập thêm dừng khi không còn đồng minh đáp ứng điều kiện."
