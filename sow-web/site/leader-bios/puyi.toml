[articles.ru]
text = "Пу И взошёл на престол династии Цин в 1908 году в возрасте двух лет. 12 февраля 1912 года от его имени как императора Сюаньтуна издали указ об отречении. Указ завершил правление Цин и поручил Юань Шикаю организовать республику. Пу И был ребёнком, а соглашением с республиканцами занимались двор и вдовствующая императрица Лунъюй. Условия позволяли ему сохранять титул и получать содержание, а императорскому двору — временно оставаться в Запретном городе. В 1932 году Пу И поставили во главе Маньчжоу-го, государства, созданного на северо-востоке Китая под контролем Японии. Его прежний императорский титул имел политическое значение, а его положение зависело от японских властей. «Зависимый двор» передаёт подобную зависимость в игре. Среди живых союзников с большей территорией, чем у Пу И, выбирается тот, у кого выше обычный сухопутный доход. Пу И получает дополнительно 20% от этого дохода, а союзник сохраняет своё золото. Когда подходящих союзников больше нет, дополнительный доход прекращается."
title = "Пу И"
lang = "ru"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
