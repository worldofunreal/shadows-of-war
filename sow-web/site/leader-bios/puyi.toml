[articles.zh-CN]
text = "溥仪在1908年以两岁之龄继承清朝皇位，年号宣统。1911年武昌起义后，清廷、袁世凯与革命阵营围绕政权转移展开交涉。1912年2月12日，以宣统皇帝名义颁布的退位诏书结束了清朝的统治，并授权袁世凯组织共和政府。当时溥仪仍是孩子，隆裕太后和清廷代表他处理退位事务。与退位相伴的优待条件规定，他可以保留皇帝称号，民国提供岁费，清室暂居紫禁城。这些条款安排的是退位后皇室的地位和生活，与国家政权由谁掌握是两件事。条款由参与交涉的各方达成，诏书以皇帝名义发布的形式也体现了年幼君主所处的位置。宫廷保留部分礼仪与生活安排，但在新的政治制度下，这些待遇要靠共和国承认并履行。关于清室在紫禁城内继续存在的情况，历史学者罗友枝考察了退位条件及其后来遭到修改的经过。 1932年，在日本控制中国东北部分地区的背景下，溥仪被安排担任满洲国执政。1934年，他成为满洲国皇帝。这个政权的建立和运行受日本主导，溥仪的旧皇室身份则具有象征价值。1912年的清室优待条件与1930年代的满洲国属于不同的政治情境。前者涉及从帝制转向共和时的交涉，后者发生在日本扩张和占领的过程中。两段经历都能说明政治身份如何受到其他力量支撑，也有助于理解游戏为何采用依附关系作为机制。游戏中的「附庸宫廷」把这种依赖转化为可以随局势变化的金币收入。系统先选出仍在场上并且领土大于溥仪的盟友，再从中比较常规陆上收入。溥仪从收入最高的一位获得相当于该收入百分之二十的额外金币，盟友仍保留自己的全部收入。若盟友战败、失去足够领土或结束同盟关系，系统会重新判断谁符合条件。没有符合条件的盟友时，额外收入停止。这里的比例是游戏规则，用来表现依赖关系随盟友处境变化的特点。"
title = "溥仪"
lang = "zh-CN"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
shortArticle = true
intro = ["溥仪在1908年以两岁之龄继承清朝皇位，年号宣统。1911年武昌起义后，清廷、袁世凯与革命阵营围绕政权转移展开交涉。1912年2月12日，以宣统皇帝名义颁布的退位诏书结束了清朝的统治，并授权袁世凯组织共和政府。当时溥仪仍是孩子，隆裕太后和清廷代表他处理退位事务。与退位相伴的优待条件规定，他可以保留皇帝称号，民国提供岁费，清室暂居紫禁城。这些条款安排的是退位后皇室的地位和生活，与国家政权由谁掌握是两件事。条款由参与交涉的各方达成，诏书以皇帝名义发布的形式也体现了年幼君主所处的位置。宫廷保留部分礼仪与生活安排，但在新的政治制度下，这些待遇要靠共和国承认并履行。关于清室在紫禁城内继续存在的情况，历史学者罗友枝考察了退位条件及其后来遭到修改的经过。"]
sections = [{ title = "清帝退位与优待条件", paragraphs = ["1932年，在日本控制中国东北部分地区的背景下，溥仪被安排担任满洲国执政。1934年，他成为满洲国皇帝。这个政权的建立和运行受日本主导，溥仪的旧皇室身份则具有象征价值。1912年的清室优待条件与1930年代的满洲国属于不同的政治情境。前者涉及从帝制转向共和时的交涉，后者发生在日本扩张和占领的过程中。两段经历都能说明政治身份如何受到其他力量支撑，也有助于理解游戏为何采用依附关系作为机制。游戏中的「附庸宫廷」把这种依赖转化为可以随局势变化的金币收入。系统先选出仍在场上并且领土大于溥仪的盟友，再从中比较常规陆上收入。溥仪从收入最高的一位获得相当于该收入百分之二十的额外金币，盟友仍保留自己的全部收入。若盟友战败、失去足够领土或结束同盟关系，系统会重新判断谁符合条件。没有符合条件的盟友时，额外收入停止。这里的比例是游戏规则，用来表现依赖关系随盟友处境变化的特点。"] }]
sources = [{ title = "Imperial Edict of the Abdication of the Qing Emperor, National Museum of China", url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html" }, { title = "“Manchukuo,” Oxford Bibliographies in Chinese Studies", url = "https://academic.oup.com/reference/62338/reference-article-abstract/554182557" }, { title = "Edward J. M. Rhoads, Manchus and Han, University of Washington Press", url = "https://uw.manifoldapp.org/read/6dc24326-22ee-4cdc-9f66-52376c2d4f10/section/7e1e0f94-50c9-4c3f-b2cf-83ccff13fb79" }, { title = "Edward J. M. Rhoads, The 1911 Revolution, University of Washington Press", url = "https://uw.manifoldapp.org/read/6dc24326-22ee-4cdc-9f66-52376c2d4f10/section/89a9a5f8-dc3a-4ef2-9fba-bf22b8a40c3b" }, { title = "The Establishment of the Puppet State of Manchukuo, Academy of Chinese Studies", url = "https://www.chiculture.org.hk/en/photo-story/3152" }]

[articles.ja]
text = "溥儀は1908年、二歳で清朝の皇帝となった。元号は宣統である。1911年の武昌蜂起のあと、清朝の宮廷、袁世凱、革命派の間で政権の移行をめぐる交渉が行われた。1912年2月12日、宣統帝の名で退位の詔書が出され、清朝の統治が終わった。詔書は袁世凱に共和政府を組織する権限を与えた。溥儀はまだ幼く、隆裕皇太后と宮廷が退位の手続きを進めた。退位に伴う優待条件では、称号の保持、共和国からの手当、紫禁城での一時的な居住が認められた。共和国が権力を引き継ぐ一方で、清の皇室には住居と生活のための取り決めが残された。歴史家エドワード・ローズは、その取り決めが退位後にどのように適用され、のちに改められたかをたどっている。1924年に条件が改められ、溥儀は紫禁城を退去させられた。 1932年、溥儀は日本が主導して中国東北部に設立した満洲国の執政に就いた。1934年には同国の皇帝となった。かつての皇帝という立場には政治的な意味があったが、満洲国の運営は日本の影響下にあった。清朝の退位後に与えられた優待と、のちの満洲国での立場は、それぞれ共和政への移行と日本の占領という異なる状況から生まれた。ゲームの「従属する宮廷」は、別の勢力との関係に支えられる立場を金の収入として表現する。自分より広い領土を持つ生存中の同盟者を対象に、そのなかで通常の陸上収入が最も多い同盟者を選ぶ。溥儀はその収入の二割に相当する追加の金を受け取る。同盟者は元の収入をそのまま受け取る。領土の変動や同盟の解消によって該当する相手がいなくなると、追加収入も止まる。二割という割合はゲームの設定で、同盟者の領土や収入が変われば、実際に得られる金も変わる。"
title = "溥儀"
lang = "ja"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
