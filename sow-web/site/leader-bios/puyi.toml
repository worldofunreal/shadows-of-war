[articles.ar]
text = "اعتلى بويي عرش أسرة تشينغ عام 1908 في سن الثانية. وفي 12 فبراير 1912 صدر باسمه بصفته الإمبراطور شوانتونغ مرسوم التنازل الذي أنهى حكم تشينغ وأذن ليوان شيكاي بتشكيل حكومة جمهورية. كان بويي طفلاً، وتولت الإمبراطورة الأرملة لونغيو والبلاط جانبهم من التفاوض مع الجمهوريين. ونصت الشروط على احتفاظه بلقبه وتخصيص إعانة له وبقاء الأسرة الإمبراطورية مؤقتاً في المدينة المحرمة. في عام 1932 نُصّب بويي على رأس مانشوكو، وهي دولة أُنشئت تحت السيطرة اليابانية في شمال شرق الصين. احتفظ لقبه السابق بقيمة سياسية، بينما اعتمد موقعه على السلطات اليابانية. وتجسد قدرة «البلاط التابع» هذه العلاقة في اللعبة. من بين الحلفاء الأحياء الذين يملكون أراضي أكثر من بويي، تُحتسب أعلى قيمة للدخل البري العادي. ويحصل بويي على ذهب إضافي يعادل 20% من ذلك الدخل من دون خصم شيء من ذهب الحليف. ويتوقف الدخل الإضافي عند غياب حليف يستوفي الشروط."
title = "بويي"
lang = "ar"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
