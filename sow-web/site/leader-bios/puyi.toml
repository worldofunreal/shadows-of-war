[articles.it]
text = "Puyi salì al trono dei Qing nel 1908, a due anni. Il 12 febbraio 1912 fu emanato a suo nome, come imperatore Xuantong, l’editto di abdicazione che pose fine al governo dei Qing e autorizzò Yuan Shikai a organizzare una repubblica. Puyi era un bambino e la corte, con l’imperatrice vedova Longyu, partecipò all’accordo con i repubblicani. Le condizioni prevedevano il mantenimento del titolo, un appannaggio e la permanenza temporanea della casa imperiale nella Città Proibita. Nel 1932 Puyi fu posto a capo del Manciukuò, uno Stato istituito sotto la tutela giapponese nella Cina nordorientale. Il suo precedente titolo aveva ancora valore politico e la sua posizione dipendeva dalle autorità giapponesi. Corte dipendente riprende questo rapporto nel gioco. Fra gli alleati vivi con più territorio di Puyi, conta quello con le entrate terrestri ordinarie più alte. Puyi riceve oro extra pari al 20% di quelle entrate senza sottrarne all’alleato. Il beneficio cessa quando nessun alleato soddisfa le condizioni."
title = "Puyi"
lang = "it"
