[articles.pt-BR]
text = "Puyi subiu ao trono da dinastia Qing em 1908, aos dois anos. Em 12 de fevereiro de 1912, foi emitido em seu nome, como imperador Xuantong, o edito de abdicação que encerrou o governo Qing e autorizou Yuan Shikai a organizar uma república. Puyi ainda era criança. A corte, com a imperatriz viúva Longyu, participou do acordo com os republicanos. As condições preservaram o título de Puyi, estabeleceram um estipêndio e permitiram que a família imperial permanecesse temporariamente na Cidade Proibida. Em 1932, Puyi foi colocado à frente de Manchukuo, Estado estabelecido sob controle japonês no nordeste da China. O antigo título tinha valor político, enquanto sua posição dependia das autoridades japonesas. Corte dependente adapta essa relação ao jogo. Entre os aliados vivos com mais território do que Puyi, vale aquele com a maior renda terrestre comum. Puyi recebe 20% dessa renda em ouro extra sem desconto no ouro do aliado. O benefício para quando nenhum aliado atende às condições."
title = "Puyi"
lang = "pt-BR"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
