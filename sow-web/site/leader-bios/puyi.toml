[articles.fr]
text = "Puyi monta sur le trône des Qing en 1908, à l’âge de deux ans. Le 12 février 1912, un édit d’abdication fut publié en son nom d’empereur Xuantong. Il mit fin au pouvoir des Qing et chargea Yuan Shikai d’organiser une république. Puyi était enfant et la cour, avec l’impératrice douairière Longyu, prit part à l’accord avec les républicains. Les conditions prévoyaient le maintien de son titre, le versement d’une allocation et le séjour provisoire de la maison impériale dans la Cité interdite. En 1932, Puyi fut placé à la tête du Mandchoukouo, un État établi sous tutelle japonaise dans le nord-est de la Chine. Son ancien titre conservait une valeur politique, tandis que son autorité dépendait des responsables japonais. Cour dépendante transpose cette relation dans la partie. Parmi les alliés vivants possédant plus de terres que Puyi, elle retient celui dont le revenu terrestre ordinaire est le plus élevé. Puyi reçoit l’équivalent de 20% de ce revenu sans prélèvement sur l’or de l’allié. Le supplément cesse lorsqu’aucun allié ne remplit les conditions."
title = "Puyi"
lang = "fr"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
shortArticle = true
intro = ["Puyi monta sur le trône des Qing en 1908, à l’âge de deux ans. Le 12 février 1912, un édit d’abdication fut publié en son nom d’empereur Xuantong. Il mit fin au pouvoir des Qing et chargea Yuan Shikai d’organiser une république. Puyi était enfant et la cour, avec l’impératrice douairière Longyu, prit part à l’accord avec les républicains. Les conditions prévoyaient le maintien de son titre, le versement d’une allocation et le séjour provisoire de la maison impériale dans la Cité interdite."]
