[articles.id]
text = "Puyi naik takhta Dinasti Qing pada 1908 ketika berusia dua tahun. Pada 12 Februari 1912, maklumat turun takhta dikeluarkan atas namanya sebagai Kaisar Xuantong. Maklumat itu mengakhiri pemerintahan Qing dan memberi Yuan Shikai wewenang untuk membentuk republik. Puyi masih kecil, sehingga Ibu Suri Longyu dan istana menangani kesepakatan dengan pihak republik. Syaratnya mempertahankan gelar Puyi, memberinya tunjangan, dan mengizinkan keluarga kekaisaran tinggal sementara di Kota Terlarang. Pada 1932 Puyi ditempatkan sebagai kepala Manchukuo, negara yang dibentuk di bawah kendali Jepang di timur laut Tiongkok. Gelar lamanya bernilai politis, sementara kedudukannya bergantung pada pihak Jepang. Istana Bergantung mengadaptasi hubungan ini ke dalam permainan. Di antara sekutu hidup yang wilayahnya lebih luas daripada milik Puyi, permainan memilih yang pendapatan darat biasanya tertinggi. Puyi mendapat emas tambahan sebesar 20% dari pendapatan itu tanpa mengurangi emas sekutu. Tambahan itu berhenti ketika tak ada sekutu yang memenuhi syarat."
title = "Puyi"
lang = "id"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
