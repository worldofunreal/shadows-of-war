[articles.es]
text = "Puyi subió al trono de la dinastía Qing en 1908, con dos años. El 12 de febrero de 1912 se emitió en su nombre, como emperador Xuantong, el edicto de abdicación que puso fin al gobierno Qing y autorizó a Yuan Shikai a organizar una república. Puyi era un niño. La corte, con la emperatriz viuda Longyu, intervino en el acuerdo con los republicanos. Las condiciones preveían conservar su título, asignarle un estipendio y permitir que la casa imperial permaneciera temporalmente en la Ciudad Prohibida. En 1932, Puyi fue instalado al frente de Manchukuo, un Estado establecido bajo tutela japonesa en el nordeste de China. El valor político de su antiguo título coexistió con su dependencia de las autoridades japonesas. Corte dependiente adapta esa relación a la partida. Entre los aliados vivos con más territorio que Puyi, toma como referencia al que tiene mayor ingreso terrestre ordinario. Puyi recibe un 20% adicional de ese ingreso sin que al aliado se le descuente oro. El beneficio cesa cuando deja de haber un aliado que cumpla las condiciones."
title = "Puyi"
lang = "es"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
