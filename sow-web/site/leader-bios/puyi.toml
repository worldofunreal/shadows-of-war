[articles.de]
text = "Puyi bestieg 1908 im Alter von zwei Jahren den Thron der Qing-Dynastie. Am 12. Februar 1912 wurde in seinem Namen als Kaiser Xuantong das Abdankungsedikt erlassen. Es beendete die Qing-Herrschaft und ermächtigte Yuan Shikai, eine Republik zu organisieren. Puyi war noch ein Kind. Der Hof um Kaiserinwitwe Longyu wirkte an der Einigung mit den Republikanern mit. Die Vereinbarung sah vor, dass Puyi seinen Titel und einen Unterhalt behielt und der kaiserliche Haushalt vorübergehend in der Verbotenen Stadt bleiben durfte. 1932 wurde Puyi an die Spitze von Mandschukuo gesetzt, einem Staat unter japanischer Kontrolle im Nordosten Chinas. Sein früherer Titel hatte politischen Wert, während seine Stellung von den japanischen Behörden abhing. Abhängiger Hof überträgt dieses Verhältnis ins Spiel. Maßgeblich ist das höchste gewöhnliche Landeinkommen unter den lebenden Verbündeten mit mehr Land als Puyi. Puyi erhält 20 Prozent dieses Einkommens zusätzlich, ohne dem Verbündeten Gold abzuziehen. Der Bonus endet, wenn kein Verbündeter mehr die Bedingungen erfüllt."
title = "Puyi"
lang = "de"
