[articles.en]
text = "Puyi became Qing emperor in 1908 at age two. On 12 February 1912, an abdication edict was issued in his name as the Xuantong emperor, ending the Qing monarchy and authorizing Yuan Shikai to establish a republic. Puyi was a child; the court, including Empress Dowager Longyu, handled the decision and its terms. The Republic’s Articles of Favorable Treatment preserved his title for a time, provided a stipend and allowed the imperial household to remain in the Forbidden City. The agreement formed part of a negotiated transfer between the Qing court and the revolutionary Republic, rather than a personal military achievement by Puyi. In 1932 he was installed as head of Manchukuo, a Japanese-led client state whose sovereignty remained contested; the symbolic value of his former title should not be mistaken for independent control over Japanese policy. Dependent Court models reliance on a stronger patron rather than independent command. Puyi receives extra gold based on the ordinary land income of his highest-earning living ally with more territory. The ally loses nothing, and the benefit disappears when there is no eligible patron. This is a strategic abstraction of dependence; it does not attribute the court’s negotiations or Japanese policy to Puyi personally."
title = "Puyi"
lang = "en"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
