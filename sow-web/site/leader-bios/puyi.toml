[articles.fil]
text = "Umupo si Puyi sa trono ng Qing noong 1908, sa edad na dalawang taon. Noong 12 Pebrero 1912, inilabas sa pangalan niya bilang Emperador Xuantong ang kautusan ng pagbibitiw. Tinapos nito ang pamumuno ng Qing at pinahintulutan si Yuan Shikai na bumuo ng republika. Bata pa si Puyi at ang korte, kasama si Emperatris Biyuda Longyu, ang humarap sa kasunduan sa mga republikano. Pinanatili ng mga kondisyon ang kaniyang titulo at naglaan ng sustento at pansamantalang tirahan ng sambahayan sa Ipinagbabawal na Lungsod. Noong 1932, iniluklok si Puyi sa pamumuno ng Manchukuo, estadong itinatag sa ilalim ng kontrol ng Hapon sa hilagang-silangang Tsina. May halagang pampolitika ang dati niyang titulo at nakasalalay sa mga opisyal na Hapones ang kaniyang posisyon. Isinasalin ng Umaasang Korte ang ugnayang ito sa laro. Sa mga buhay na kakamping may mas malaking lupain kaysa kay Puyi, pinipili ang may pinakamataas na karaniwang kita sa lupa. Tumatanggap si Puyi ng dagdag na gintong katumbas ng 20% ng kitang iyon at buo pa rin ang ginto ng kakampi. Humihinto ang dagdag na kita kapag wala nang kakamping pasok sa mga kondisyon."
title = "Puyi"
lang = "fil"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
