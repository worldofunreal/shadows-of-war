[articles.ko]
text = "푸이는 1908년 두 살의 나이로 청의 황제에 올랐다. 연호는 선통이었다. 1911년 우창 봉기 이후 청 조정과 위안스카이, 혁명파 사이에 권력 이양을 둘러싼 교섭이 이어졌다. 1912년 2월 12일 푸이의 이름으로 반포된 퇴위 조서는 청의 통치를 끝내고 위안스카이가 공화 정부를 조직하도록 했다. 당시 푸이는 어린아이였고 룽위 황태후와 청 조정이 퇴위 절차를 맡았다. 함께 정한 우대 조건에 따라 푸이는 황제 칭호를 유지하고 생활비를 받으며 자금성에 임시로 머무를 수 있었다. 공화국이 통치권을 넘겨받는 과정에서 황실의 생활과 지위는 별도 합의에 따라 정해졌다. 에드워드 로즈는 퇴위 뒤 이 합의가 어떻게 적용되었고 이후 어떻게 바뀌었는지 살폈다. 1932년 푸이는 일본 주도로 중국 동북부에 세워진 만주국의 집정이 되었다. 1934년에는 만주국 황제가 되었다. 예전 청 황제라는 지위는 정치적 상징성을 가졌으며, 만주국의 운영은 일본의 통제를 받았다. 퇴위 직후의 청 황실에 대한 우대는 공화정으로 바뀌는 과정에서 생겼고, 만주국에서 푸이의 지위는 일본의 점령과 확장이라는 상황에서 생겼다. 게임의 ‘의존하는 궁정’은 다른 세력과의 관계에 기대는 지위를 금 수입으로 표현한다. 푸이보다 넓은 영토를 지닌 생존 동맹 가운데 일반 육상 수입이 가장 큰 동맹을 기준으로 한다. 푸이는 그 수입의 20%에 해당하는 금을 추가로 얻고 동맹은 자신의 수입을 그대로 받는다. 영토가 줄거나 동맹이 끝나면 조건에 맞는 상대를 다시 판단한다. 적합한 동맹이 없으면 추가 수입도 멈춘다. 20%라는 비율은 게임에서 동맹의 수입 변화를 반영하는 수치다."
title = "푸이"
lang = "ko"
url = "https://en.chnmuseum.cn/collections_577/collection_highlights_608/objects_of_chinese_revolutionary_history_610/202008/t20200806_246813.html"
