[articles.en]
text = "Mandukhai Khatun held political and military authority among the Mongols in the late fifteenth century. After the death of Manduul Khan, she helped restore Chinggisid rule in the succession associated with Dayan Khan. Later Mongolian chronicles also credit her with leading campaigns against the Oirats."
title = "Mandukhai Khatun"
lang = "en"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun held political and military authority among the Mongols in the late fifteenth century. After the death of Manduul Khan, she helped restore Chinggisid rule in the succession associated with Dayan Khan. Later Mongolian chronicles also credit her with leading campaigns against the Oirats."]
sections = [{ title = "The succession and the Oirat campaigns", paragraphs = ["The seventeenth-century Shara Tuji describes Mandukhai leading troops and imposing terms on the Oirats after victory. These terms included restrictions on the titles of dwellings and forms of dress. Other chronicles report the victory but omit the edict. Roman Pochekaev compares those versions, while Junpei Hagiwara’s comparison of Chinese and Mongolian accounts questions the usual identification and chronology of Dayan’s succession. Johan Elverskog reads Mandukhai’s decision as an attempt to bring divided Mongol communities under a common ruler. The chronicles describe those communities as retaining a distinct identity within the new state."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.es]
text = "Mandukhai Khatun ejerció autoridad política y militar entre los mongoles a fines del siglo XV. Tras la muerte de Manduul Kan, contribuyó a restaurar el gobierno del linaje de Gengis Kan en la sucesión asociada con Dayan Kan. Las crónicas mongolas posteriores también le atribuyen el mando en las campañas contra los oirates."
title = "Mandukhai Khatun"
lang = "es"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun ejerció autoridad política y militar entre los mongoles a fines del siglo XV. Tras la muerte de Manduul Kan, contribuyó a restaurar el gobierno del linaje de Gengis Kan en la sucesión asociada con Dayan Kan. Las crónicas mongolas posteriores también le atribuyen el mando en las campañas contra los oirates."]
sections = [{ title = "La sucesión y las campañas contra los oirates", paragraphs = ["La crónica Shara Tuji, del siglo XVII, presenta a Mandukhai al frente de las tropas y le atribuye condiciones impuestas tras la victoria, como límites en la vestimenta y en el nombre que podían dar a sus residencias. Otras crónicas mencionan la victoria y omiten el edicto. Roman Pochekaev compara estas versiones. Al cotejar fuentes chinas y mongolas, Junpei Hagiwara cuestiona la identificación habitual de Dayan y la cronología de su ascenso. Johan Elverskog interpreta las decisiones de Mandukhai como un intento de reunir a las comunidades mongolas bajo un gobernante común. En esas crónicas, las comunidades conservaron su identidad dentro del nuevo Estado."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.fr]
text = "Mandukhai Khatun exerça une autorité politique et militaire parmi les Mongols à la fin du XVe siècle. Après la mort de Manduul Khan, elle contribua au retour de la lignée de Gengis Khan au pouvoir lors de la succession associée à Dayan Khan. Des chroniques mongoles plus tardives lui attribuent aussi le commandement de campagnes contre les Oïrats."
title = "Mandukhai Khatun"
lang = "fr"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun exerça une autorité politique et militaire parmi les Mongols à la fin du XVe siècle. Après la mort de Manduul Khan, elle contribua au retour de la lignée de Gengis Khan au pouvoir lors de la succession associée à Dayan Khan. Des chroniques mongoles plus tardives lui attribuent aussi le commandement de campagnes contre les Oïrats."]
sections = [{ title = "La succession et les campagnes contre les Oïrats", paragraphs = ["Le Shara Tuji, rédigé au XVIIe siècle, décrit Mandukhai à la tête des troupes et lui attribue des conditions imposées après la victoire, touchant notamment aux vêtements et au nom des résidences. D’autres chroniques citent la victoire sans reprendre l’édit. Roman Pochekaev compare ces versions. Le rapprochement des sources chinoises et mongoles par Junpei Hagiwara met en question la chronologie de la succession et l’identité généralement retenue pour Dayan. Selon Johan Elverskog, la décision de Mandukhai cherchait à réunir des communautés divisées sous une même autorité. Les chroniques les dépeignent comme des groupes distincts au sein du nouvel État."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.de]
text = "Mandukhai Khatun übte im späten 15. Jahrhundert politische und militärische Macht unter den Mongolen aus. Nach dem Tod Manduul Khans half sie bei der Wiederherstellung der Herrschaft der Dschingisiden im Zuge der Thronfolge um Dayan Khan. Spätere mongolische Chroniken schreiben ihr auch die Führung von Feldzügen gegen die Oiraten zu."
title = "Mandukhai Khatun"
lang = "de"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun übte im späten 15. Jahrhundert politische und militärische Macht unter den Mongolen aus. Nach dem Tod Manduul Khans half sie bei der Wiederherstellung der Herrschaft der Dschingisiden im Zuge der Thronfolge um Dayan Khan. Spätere mongolische Chroniken schreiben ihr auch die Führung von Feldzügen gegen die Oiraten zu."]
sections = [{ title = "Die Thronfolge und die Feldzüge gegen die Oiraten", paragraphs = ["Das Shara Tuji aus dem 17. Jahrhundert stellt Mandukhai als Heerführerin dar und berichtet von Bedingungen, die sie nach dem Sieg auferlegte. Darunter waren Regeln zur Kleidung und zur Benennung der Wohnstätten. Andere Chroniken erwähnen den Sieg, überliefern aber keinen Erlass. Roman Pochekaev vergleicht diese Fassungen. Junpei Hagiwara zieht nach einem Vergleich chinesischer und mongolischer Quellen die übliche Identifizierung Dayans und die Abfolge der Ereignisse in Zweifel. Johan Elverskog deutet Mandukhais Entscheidung als Versuch, die getrennten mongolischen Gemeinschaften unter einer gemeinsamen Herrschaft zu vereinen. Die Chroniken beschreiben sie als weiterhin eigenständige Gemeinschaften innerhalb dieses Staates."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.it]
text = "Mandukhai Khatun esercitò autorità politica e militare tra i Mongoli alla fine del Quattrocento. Dopo la morte di Manduul Khan contribuì al ritorno al potere della stirpe di Gengis Khan nella successione legata a Dayan Khan. Le cronache mongole successive le attribuiscono anche la guida di campagne contro gli Oirati."
title = "Mandukhai Khatun"
lang = "it"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun esercitò autorità politica e militare tra i Mongoli alla fine del Quattrocento. Dopo la morte di Manduul Khan contribuì al ritorno al potere della stirpe di Gengis Khan nella successione legata a Dayan Khan. Le cronache mongole successive le attribuiscono anche la guida di campagne contro gli Oirati."]
sections = [{ title = "La successione e le campagne contro gli Oirati", paragraphs = ["Lo Shara Tuji, composto nel Seicento, descrive Mandukhai alla testa delle truppe e le attribuisce condizioni imposte dopo la vittoria, riguardanti tra l’altro gli abiti e i nomi delle dimore. Altre cronache citano la vittoria senza riportare l’editto. Roman Pochekaev confronta tali versioni. Dal confronto fra documenti cinesi e mongoli Junpei Hagiwara ha messo in discussione l’identificazione consueta di Dayan e la cronologia della successione. Johan Elverskog interpreta le decisioni di Mandukhai come un tentativo di riunire comunità divise sotto un’autorità comune. Nelle cronache le comunità mantengono una propria identità dentro il nuovo Stato."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.tr]
text = "Manduhay Hatun, 15. yüzyılın sonlarında Moğollar arasında siyasi ve askerî otorite sahibiydi. Manduul Han öldükten sonra Dayan Han’la anılan veraset sürecinde Cengiz Han soyunun yönetimini yeniden kurmaya yardım etti. Sonraki Moğol kronikleri, Oyratlara karşı seferlere komuta ettiğini de anlatır."
title = "Manduhay Hatun"
lang = "tr"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Manduhay Hatun, 15. yüzyılın sonlarında Moğollar arasında siyasi ve askerî otorite sahibiydi. Manduul Han öldükten sonra Dayan Han’la anılan veraset sürecinde Cengiz Han soyunun yönetimini yeniden kurmaya yardım etti. Sonraki Moğol kronikleri, Oyratlara karşı seferlere komuta ettiğini de anlatır."]
sections = [{ title = "Hanlık veraseti ve Oyrat seferleri", paragraphs = ["On yedinci yüzyılda yazılan Şara Tuuci, Manduhay’ı birliklerin başında gösterir. Zaferden sonra giysiler ve konutların adlandırılması konusunda şartlar koyduğunu aktarır. Başka kronikler zaferi kaydederken bu buyruktan söz etmez. Roman Poçekayev söz konusu metinleri karşılaştırır. Çin ve Moğol kaynaklarını birlikte okuyan Junpei Hagiwara, Dayan’ın kimliğine ilişkin yaygın görüşü ve tahta çıkışın kronolojisini tartışmaya açar. Johan Elverskog, Manduhay’ın kararını bölünmüş Moğol topluluklarını ortak bir hükümdarın yönetiminde toplama girişimi olarak yorumlar. Kroniklerde bu topluluklar yeni devlet içinde kendi kimliklerini korurlar."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.zh-CN]
text = "满都海哈屯在十五世纪后期的蒙古政治和军事中掌握权力。满都鲁汗死后，汗位继承与成吉思汗后裔能否恢复权威相连。满都海在后来与达延汗相联系的继承斗争中发挥了重要作用。蒙古文编年史记载她领军征讨瓦剌，并描述她在胜利后处置战败一方的方式。对于汗位继承的具体次序与出征年代，后世史书和同时代留下的材料并不能完全吻合。"
title = "满都海哈屯"
lang = "zh-CN"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["满都海哈屯在十五世纪后期的蒙古政治和军事中掌握权力。满都鲁汗死后，汗位继承与成吉思汗后裔能否恢复权威相连。满都海在后来与达延汗相联系的继承斗争中发挥了重要作用。蒙古文编年史记载她领军征讨瓦剌，并描述她在胜利后处置战败一方的方式。对于汗位继承的具体次序与出征年代，后世史书和同时代留下的材料并不能完全吻合。"]
sections = [{ title = "汗位继承与对瓦剌的征战", paragraphs = ["十七世纪成书的《沙拉图吉》把满都海写成亲自出征的统帅，并在胜利之后给瓦剌定下规矩。叙事涉及服饰上的装饰、住所的称谓以及用餐礼节。按书中说法，瓦剌人请求改变其中一项规定，获准在吃肉时用刀切割。这段文字呈现出后代作者对征服之后如何确立权威的理解。罗曼·波切卡耶夫比较了保留这些规定的作品和只记载战胜瓦剌的作品。他也指出，有些晚出的记述沿用了较早的文字。相似的叙述因此不能一律算作彼此独立的证据。萩原淳平则对读中文和蒙古文资料，对达延汗通常所认定的身份和登位过程提出异议。他的研究显示，给这场继承斗争安排一个所有资料都支持的时间表并不容易。约翰·埃尔弗斯科格从蒙古诸部的政治关系解读满都海的抉择：分立的群体需要共同的统治者来维持秩序。十七世纪初的《俺答汗传》等著作以达延汗的统治解释这一安排，将归附的部众写成共同国家中的不同群体。归于一位统治者之后，这些群体仍保有各自的身份。后代蒙古史书中的六个大部众也称为六万户。一些史书还记载，西部三个部众的首领请达延汗派一位儿子来出任济农，并承认由共同统治体系征收贡赋的权力。这些叙述既保存了有关满都海军政活动的记忆，也体现了较晚时期作者对蒙古政治秩序的看法。因此可以把她参与汗位继承与征战的作用，同诏令原文和个别事件日期的考证分别看待。游戏里的征募比例是用来表现兼并后吸收人力的规则。"] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.ja]
text = "マンドフイ・ハトゥンは、十五世紀後半のモンゴルで政治と軍事の権力を持った。マンドゥール・ハンの死後、ダヤン・ハンと結び付けられる継承争いの中で、チンギス・ハンの一族が権威を回復するのに関わった。後世のモンゴル語の年代記は、彼女がオイラトへの遠征を率いたと伝える。継承と遠征の具体的な順序については、成立時期や言語の異なる史料の間で食い違いがある。"
title = "マンドフイ・ハトゥン"
lang = "ja"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["マンドフイ・ハトゥンは、十五世紀後半のモンゴルで政治と軍事の権力を持った。マンドゥール・ハンの死後、ダヤン・ハンと結び付けられる継承争いの中で、チンギス・ハンの一族が権威を回復するのに関わった。後世のモンゴル語の年代記は、彼女がオイラトへの遠征を率いたと伝える。継承と遠征の具体的な順序については、成立時期や言語の異なる史料の間で食い違いがある。"]
sections = [{ title = "ハン位継承とオイラト遠征", paragraphs = ["十七世紀に編まれた『シャラ・トージ』では、マンドフイは自ら軍を率い、勝利の後でオイラトに条件を課したとされる。そこには住居の呼び方や衣服の装飾、食事の作法に関する規定が含まれている。この年代記によれば、オイラトは規定の一つに変更を求め、食事で肉をナイフで切ることを認められた。ロマン・ポチェカーエフは、こうした命令を記す年代記を、勝利のみを記す他の年代記と比較した。後の書き手が先行する記述を利用した例もあるため、内容の似た記述がいくつかあっても、すべてが独立した証言とは限らない。萩原淳平はモンゴル語と漢文の史料を照合し、ダヤン・ハンとされる人物の同定や、継承の通説に異議を唱えた。軍事行動の細部や日付を再構成する際には、こうした史料の性格が問題になる。一方、ヨハン・エルヴァースコグはマンドフイの判断を、分かれていたモンゴルの諸集団を共通の君主の下にまとめる試みと読む。後の年代記では、征服や服属によって共通の国家が作られ、従った集団はその中で別個の共同体として存続した。六つの大きなウルスは、六トゥメンとも呼ばれる。この記述は十五世紀の出来事についての情報を伝えると同時に、後の時代の人々がダヤン・ハンの国家をどのように理解したかを示す。マンドフイの政治的な役割と、彼女の言葉として伝わる個々の規定の確実性は、こうした史料の違いを踏まえて考える必要がある。ゲームでは征服後に兵を編入することで、この統合の過程を表現している。"] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.ko]
text = "만두하이 하툰은 15세기 후반 몽골에서 정치와 군사에 영향력을 행사했다. 만둘 칸이 죽은 뒤 이어진 계승 분쟁은 칭기즈 칸의 혈통이 권위를 회복하는 과정과 맞물렸다. 만두하이는 다얀 칸과 관련된 이 과정에서 중요한 역할을 맡았다. 후대 몽골 연대기는 그가 직접 오이라트 원정을 이끌었다고 전한다. 당시의 중국 기록과 후대의 몽골 기록은 즉위와 군사 행동의 구체적인 순서에 대해 차이를 보인다."
title = "만두하이 하툰"
lang = "ko"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["만두하이 하툰은 15세기 후반 몽골에서 정치와 군사에 영향력을 행사했다. 만둘 칸이 죽은 뒤 이어진 계승 분쟁은 칭기즈 칸의 혈통이 권위를 회복하는 과정과 맞물렸다. 만두하이는 다얀 칸과 관련된 이 과정에서 중요한 역할을 맡았다. 후대 몽골 연대기는 그가 직접 오이라트 원정을 이끌었다고 전한다. 당시의 중국 기록과 후대의 몽골 기록은 즉위와 군사 행동의 구체적인 순서에 대해 차이를 보인다."]
sections = [{ title = "칸위 계승과 오이라트 원정", paragraphs = ["17세기 몽골 연대기 《샤라 투지》는 만두하이가 군대를 이끌고 승리한 뒤 오이라트에게 여러 조건을 부과했다고 기록했다. 거처를 부르는 방식과 복식의 장식, 식사 예절에 관한 규정이 여기에 포함된다. 이 기록에 따르면 오이라트는 일부 규정을 완화해 달라고 요청했고 고기를 칼로 잘라 먹을 수 있게 되었다. 로만 포체카예프는 명령의 내용을 보존한 연대기와 승리만 전하는 연대기를 대조했다. 후대 문헌이 앞선 문헌을 옮겨 쓴 경우도 있어 비슷한 이야기가 모두 서로 독립된 증거인 것은 아니다. 하기와라 준페이는 중국어와 몽골어 사료를 비교해 다얀 칸의 통상적인 인물 비정과 즉위 과정에 이의를 제기했다. 요한 엘버스코그는 만두하이의 선택을 분열된 몽골 공동체를 공통의 통치자 아래 모으려는 시도로 해석한다. 후대 연대기에서 다얀 칸의 국가에 복속한 집단들은 하나의 통치권에 들어가면서도 공동체의 정체성을 유지했다. 기록은 이 큰 공동체들을 여섯 울루스나 여섯 투멘으로 부른다. 이런 서술은 만두하이의 정치적 역할을 전하면서, 후대 사람들이 이전 시대의 통합을 어떻게 이해했는지도 보여 준다. 연대기의 일화와 명령의 문구, 사건의 연대는 각기 다른 근거를 바탕으로 검토할 필요가 있다. 게임에서는 정복으로 상대를 탈락시켰을 때 예비 병력 일부를 편입하는 규칙으로 통합을 표현한다."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.ar]
text = "مارست ماندوخاي خاتون سلطة سياسية وعسكرية بين المغول في أواخر القرن الخامس عشر. وبعد وفاة ماندول خان ساهمت في عودة الحكم إلى سلالة جنكيز خان ضمن أحداث الخلافة المرتبطة بدايان خان. وتنسب إليها روايات مغولية دُوِّنت لاحقًا قيادة حملات على الأويرات."
title = "ماندوخاي خاتون"
lang = "ar"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["مارست ماندوخاي خاتون سلطة سياسية وعسكرية بين المغول في أواخر القرن الخامس عشر. وبعد وفاة ماندول خان ساهمت في عودة الحكم إلى سلالة جنكيز خان ضمن أحداث الخلافة المرتبطة بدايان خان. وتنسب إليها روايات مغولية دُوِّنت لاحقًا قيادة حملات على الأويرات."]
sections = [{ title = "خلافة الخان والحملات على الأويرات", paragraphs = ["يصف كتاب شارا توجي الذي دُوّن في القرن السابع عشر ماندوخاي وهي تقود القوات. وينسب إليها شروطًا فرضتها بعد الانتصار، شملت اللباس والأسماء التي تُطلق على المساكن. وتورد سجلات أخرى خبر النصر من دون أن تذكر المرسوم. قارن رومان بوتشيكايف تلك الروايات. وبعد مقارنة السجلات الصينية والمغولية، أعاد جونبي هاغيوارا النظر في تحديد هوية دايان وفي ترتيب أحداث تولّيه الحكم. ويرى يوهان إلفرسكوغ أن قرار ماندوخاي كان محاولة لجمع الجماعات المغولية المتفرقة تحت سلطة مشتركة. وتصوّرها السجلات جماعات ذات هويات مميزة بقيت قائمة داخل الدولة الجديدة."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.ru]
text = "Мандухай-хатун обладала политической и военной властью среди монголов в конце XV века. После смерти Мандуул-хана она способствовала восстановлению власти рода Чингисхана в ходе событий, связанных с восшествием Даян-хана. Поздние монгольские летописи приписывают ей руководство походами против ойратов."
title = "Мандухай-хатун"
lang = "ru"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Мандухай-хатун обладала политической и военной властью среди монголов в конце XV века. После смерти Мандуул-хана она способствовала восстановлению власти рода Чингисхана в ходе событий, связанных с восшествием Даян-хана. Поздние монгольские летописи приписывают ей руководство походами против ойратов."]
sections = [{ title = "Престолонаследие и походы на ойратов", paragraphs = ["В «Шара Туджи» XVII века Мандухай возглавляет войско и после победы устанавливает условия, касающиеся одежды и названий жилищ. В других летописях говорится о победе, но самого указа нет. Эти версии сопоставил Роман Почекаев. Дзюмпэй Хагивара сравнил китайские и монгольские источники и поставил под сомнение общепринятую идентификацию Даяна и хронологию его прихода к власти. Йохан Элверскуг объясняет решение Мандухай стремлением объединить разделённые монгольские общности под властью одного правителя. В летописном изложении они сохраняют обособленность внутри нового государства."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.vi]
text = "Mandukhai Khatun nắm quyền lực chính trị và quân sự trong cộng đồng người Mông Cổ vào cuối thế kỷ XV. Sau khi Manduul Khan qua đời, bà góp phần khôi phục quyền cai trị của dòng dõi Thành Cát Tư Hãn trong cuộc kế vị gắn với Dayan Khan. Sử biên niên Mông Cổ viết sau đó còn ghi rằng bà chỉ huy các chiến dịch chống người Oirat."
title = "Mandukhai Khatun"
lang = "vi"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun nắm quyền lực chính trị và quân sự trong cộng đồng người Mông Cổ vào cuối thế kỷ XV. Sau khi Manduul Khan qua đời, bà góp phần khôi phục quyền cai trị của dòng dõi Thành Cát Tư Hãn trong cuộc kế vị gắn với Dayan Khan. Sử biên niên Mông Cổ viết sau đó còn ghi rằng bà chỉ huy các chiến dịch chống người Oirat."]
sections = [{ title = "Kế vị và các chiến dịch chống người Oirat", paragraphs = ["Bộ Shara Tuji thế kỷ XVII mô tả Mandukhai dẫn quân và đặt ra các điều kiện sau chiến thắng, gồm quy định về trang phục và cách gọi nơi ở. Các bộ sử khác ghi chiến thắng mà không nhắc đến sắc lệnh. Roman Pochekaev đối chiếu những dị bản ấy. Khi so sánh sử liệu Trung Quốc và Mông Cổ, Junpei Hagiwara đặt lại vấn đề về cách xác định danh tính Dayan và trình tự ông lên nắm quyền. Johan Elverskog xem quyết định của Mandukhai là một nỗ lực tập hợp các cộng đồng Mông Cổ phân tán dưới một người cai trị chung. Trong các bộ sử, những cộng đồng ấy vẫn giữ bản sắc riêng trong nhà nước mới."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.id]
text = "Mandukhai Khatun memegang wewenang politik dan militer di kalangan bangsa Mongol pada akhir abad ke-15. Setelah Manduul Khan meninggal, ia membantu memulihkan kekuasaan keturunan Jenghis Khan dalam suksesi yang terkait dengan Dayan Khan. Kronik Mongol dari masa berikutnya juga mengaitkannya dengan kepemimpinan ekspedisi melawan orang Oirat."
title = "Mandukhai Khatun"
lang = "id"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun memegang wewenang politik dan militer di kalangan bangsa Mongol pada akhir abad ke-15. Setelah Manduul Khan meninggal, ia membantu memulihkan kekuasaan keturunan Jenghis Khan dalam suksesi yang terkait dengan Dayan Khan. Kronik Mongol dari masa berikutnya juga mengaitkannya dengan kepemimpinan ekspedisi melawan orang Oirat."]
sections = [{ title = "Perebutan takhta dan ekspedisi melawan Oirat", paragraphs = ["Shara Tuji dari abad ke-17 menggambarkan Mandukhai memimpin pasukan dan menetapkan syarat setelah kemenangan, termasuk aturan tentang pakaian dan sebutan bagi tempat tinggal. Kronik lain mencatat kemenangan itu tanpa mengutip maklumatnya. Roman Pochekaev membandingkan versi-versi tersebut. Junpei Hagiwara membandingkan sumber Tiongkok dan Mongol, lalu mempertanyakan identitas Dayan yang lazim diterima serta urutan peristiwa naiknya ia ke takhta. Johan Elverskog menafsirkan keputusan Mandukhai sebagai upaya menghimpun kelompok-kelompok Mongol di bawah satu penguasa. Dalam kronik, kelompok tersebut tetap memiliki identitas masing-masing di dalam negara baru."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.fil]
text = "May kapangyarihang pampolitika at militar si Mandukhai Khatun sa mga Mongol noong huling bahagi ng ika-15 siglo. Pagkamatay ni Manduul Khan, tumulong siyang ibalik sa kapangyarihan ang angkan ni Genghis Khan sa paghaliling kaugnay ni Dayan Khan. Iniuugnay rin sa kanya ng mga sumunod na kronikang Mongol ang pamumuno sa mga kampanya laban sa mga Oirat."
title = "Mandukhai Khatun"
lang = "fil"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["May kapangyarihang pampolitika at militar si Mandukhai Khatun sa mga Mongol noong huling bahagi ng ika-15 siglo. Pagkamatay ni Manduul Khan, tumulong siyang ibalik sa kapangyarihan ang angkan ni Genghis Khan sa paghaliling kaugnay ni Dayan Khan. Iniuugnay rin sa kanya ng mga sumunod na kronikang Mongol ang pamumuno sa mga kampanya laban sa mga Oirat."]
sections = [{ title = "Ang paghalili sa trono at ang mga kampanya laban sa mga Oirat", paragraphs = ["Ayon sa Shara Tuji noong ika-17 siglo, namuno si Mandukhai sa hukbo at nagtakda ng mga kondisyon matapos ang tagumpay, kabilang ang mga tuntunin sa pananamit at pagtawag sa mga tirahan. Itinala ng ibang kronika ang tagumpay at wala roon ang kautusan. Inihambing ni Roman Pochekaev ang mga bersiyong ito. Sa paghahambing sa mga tala ng Tsino at Mongol, kinuwestiyon ni Junpei Hagiwara ang karaniwang pagkakakilanlan kay Dayan at ang pagkakasunod-sunod ng pag-akyat niya sa trono. Para kay Johan Elverskog, ang pasiya ni Mandukhai ay pagtatangkang pag-isahin ang magkakahiwalay na pamayanang Mongol sa ilalim ng iisang pinuno. Sa mga kronika, nanatiling magkakaiba ang mga pamayanang iyon sa loob ng bagong estado."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]

[articles.pt-BR]
text = "Mandukhai Khatun exerceu autoridade política e militar entre os mongóis no fim do século XV. Após a morte de Manduul Khan, ajudou a devolver o poder à linhagem de Gêngis Khan na sucessão associada a Dayan Khan. Crônicas mongóis posteriores também atribuem a ela o comando de campanhas contra os oirates."
title = "Mandukhai Khatun"
lang = "pt-BR"
url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf"
shortArticle = true
intro = ["Mandukhai Khatun exerceu autoridade política e militar entre os mongóis no fim do século XV. Após a morte de Manduul Khan, ajudou a devolver o poder à linhagem de Gêngis Khan na sucessão associada a Dayan Khan. Crônicas mongóis posteriores também atribuem a ela o comando de campanhas contra os oirates."]
sections = [{ title = "A sucessão e as campanhas contra os oirates", paragraphs = ["A crônica Shara Tuji, do século XVII, apresenta Mandukhai à frente das tropas e relata condições que ela teria imposto depois da vitória, incluindo regras sobre roupas e nomes dados a moradias. Outras crônicas citam a vitória sem mencionar o decreto. Roman Pochekaev compara essas versões. Junpei Hagiwara confronta registros chineses e mongóis e questiona a identificação habitual de Dayan e a cronologia de sua ascensão. Johan Elverskog interpreta a decisão de Mandukhai como uma tentativa de reunir comunidades mongóis divididas sob um governante comum. Nas crônicas, essas comunidades mantêm identidades próprias dentro do novo Estado."] }]
sources = [{ title = "Roman Pochekaev, The Edict of Mandukhai Khatun", url = "https://www.orientalstudies.ru/rus/images/pdf/PPV_18_1_2013_12_pochekayev.pdf" }, { title = "Johan Elverskog, Our Great Qing, pp. 19–20", url = "https://paxmongolica.org/wp-content/uploads/2019/09/our-great-qing-the-mongols-buddhism-and-the-state-in-late-imperial-china-johan-elverskog.pdf" }, { title = "Junpei Hagiwara, Dayan Qaxan and His Milieu", url = "https://doi.org/10.14989/shirin_53_776" }]
