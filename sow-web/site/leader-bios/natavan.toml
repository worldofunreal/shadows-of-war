[articles.en]
text = "Khurshid Banu Natavan was an Azerbaijani poet and patron from Shusha, where she died in 1897. Published sources give different birth years, including 1830 and 1832. Her father, Mehdiqulu Khan, was the last khan of Karabakh. Natavan inherited family resources and used them to support cultural and civic work. In 1872 she took charge of the Majlis-i Uns, a literary circle that gathered poets in Shusha and corresponded with other circles. She wrote ghazals and elegies, and some of her poems survived in later collections. Her illustrated album also preserves examples of her work as an artist."
title = "Khurshid Banu Natavan"
lang = "en"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan was an Azerbaijani poet and patron from Shusha, where she died in 1897. Published sources give different birth years, including 1830 and 1832. Her father, Mehdiqulu Khan, was the last khan of Karabakh. Natavan inherited family resources and used them to support cultural and civic work. In 1872 she took charge of the Majlis-i Uns, a literary circle that gathered poets in Shusha and corresponded with other circles. She wrote ghazals and elegies, and some of her poems survived in later collections. Her illustrated album also preserves examples of her work as an artist."]
sections = [{ title = "Water for Shusha", paragraphs = ["Natavan financed a water supply for Shusha. According to the city's monument record, a pipeline carried spring water through clay pipes to a reservoir and from there to a public fountain. The fountain opened in August 1873 and became known as Khan Gizi, or the Khan's Daughter. The documented project supplied drinking water. In the game, Fountain of Shusha adapts that investment as an agricultural benefit. When one of Natavan's cities finishes upgrading to level 2, a free level 1 farm opens at the nearest valid site within 12 tiles. The farm itself is the map signal, with an ability flash on its plot and an activation notice in the HUD."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.es]
text = "Khurshid Banu Natavan fue una poeta y mecenas azerbaiyana de Shusha, donde murió en 1897. Las fuentes publicadas discrepan sobre su año de nacimiento y dan fechas como 1830 y 1832. Era hija de Mehdiqulu Khan, el último kan de Karabaj. Heredó recursos familiares que destinó a obras cívicas y culturales. En 1872 asumió el liderazgo de Majlis-i Uns, un círculo literario que reunía a poetas de Shusha y se relacionaba con otros círculos. Escribió gazales y elegías. Parte de su poesía se conserva en recopilaciones posteriores, y su álbum ilustrado da cuenta también de su obra plástica."
title = "Khurshid Banu Natavan"
lang = "es"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan fue una poeta y mecenas azerbaiyana de Shusha, donde murió en 1897. Las fuentes publicadas discrepan sobre su año de nacimiento y dan fechas como 1830 y 1832. Era hija de Mehdiqulu Khan, el último kan de Karabaj. Heredó recursos familiares que destinó a obras cívicas y culturales. En 1872 asumió el liderazgo de Majlis-i Uns, un círculo literario que reunía a poetas de Shusha y se relacionaba con otros círculos. Escribió gazales y elegías. Parte de su poesía se conserva en recopilaciones posteriores, y su álbum ilustrado da cuenta también de su obra plástica."]
sections = [{ title = "Agua para Shusha", paragraphs = ["Natavan financió el abastecimiento de agua de Shusha. Según el registro municipal del monumento, el agua de manantial llegaba por tuberías de barro a un depósito y de allí a una fuente pública. La fuente entró en servicio en agosto de 1873 y se conoció como Khan Gizi, la hija del kan. La obra abastecía de agua potable a la ciudad. En la partida, Fuente de Shusha adapta esa inversión como un beneficio agrícola. Cuando una ciudad de Natavan termina de subir al nivel 2, se funda una granja de nivel 1 gratis en la casilla válida más cercana, hasta 12 casillas de la ciudad. El terreno de la nueva granja destella y el HUD muestra el aviso de activación."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.fr]
text = "Khurshid Banu Natavan était une poétesse et mécène azerbaïdjanaise de Choucha, où elle mourut en 1897. Les sources publiées divergent sur son année de naissance et donnent notamment 1830 et 1832. Fille de Mehdiqulu Khan, le dernier khan du Karabagh, elle consacra des ressources de sa famille à des projets civiques et culturels. En 1872, elle prit la direction du Majlis-i Uns, un cercle qui réunissait des poètes à Choucha et échangeait avec d’autres cercles. Elle écrivit des ghazals et des élégies, et un album illustré témoigne également de son travail artistique."
title = "Khurshid Banu Natavan"
lang = "fr"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan était une poétesse et mécène azerbaïdjanaise de Choucha, où elle mourut en 1897. Les sources publiées divergent sur son année de naissance et donnent notamment 1830 et 1832. Fille de Mehdiqulu Khan, le dernier khan du Karabagh, elle consacra des ressources de sa famille à des projets civiques et culturels. En 1872, elle prit la direction du Majlis-i Uns, un cercle qui réunissait des poètes à Choucha et échangeait avec d’autres cercles. Elle écrivit des ghazals et des élégies, et un album illustré témoigne également de son travail artistique."]
sections = [{ title = "De l’eau pour Choucha", paragraphs = ["Natavan finança l’approvisionnement de Choucha en eau. D’après le registre municipal du monument, des conduites en argile acheminaient l’eau de source vers un réservoir, puis vers une fontaine publique. Mise en service en août 1873, la fontaine prit le nom de Khan Gizi, la fille du khan. Fontaine de Choucha adapte cet investissement dans la partie. Une ville qui atteint le niveau 2 à la fin de ses travaux établit une ferme de niveau 1 gratuite sur le site valide le plus proche, à 12 cases ou moins. La parcelle de la ferme s’illumine et le HUD annonce l’activation."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.de]
text = "Khurshid Banu Natavan war eine aserbaidschanische Dichterin und Förderin aus Schuscha, wo sie 1897 starb. Veröffentlichte Quellen nennen unterschiedliche Geburtsjahre, darunter 1830 und 1832. Ihr Vater Mehdiqulu Khan war der letzte Khan von Karabach. Natavan setzte Mittel ihrer Familie für gemeinnützige und kulturelle Vorhaben ein. 1872 übernahm sie die Leitung des Majlis-i Uns, eines literarischen Kreises in Schuscha, der sich mit anderen Dichterkreisen austauschte. Sie schrieb Ghasele und Elegien. Ein illustriertes Album bezeugt auch ihre Arbeit als Künstlerin."
title = "Khurshid Banu Natavan"
lang = "de"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan war eine aserbaidschanische Dichterin und Förderin aus Schuscha, wo sie 1897 starb. Veröffentlichte Quellen nennen unterschiedliche Geburtsjahre, darunter 1830 und 1832. Ihr Vater Mehdiqulu Khan war der letzte Khan von Karabach. Natavan setzte Mittel ihrer Familie für gemeinnützige und kulturelle Vorhaben ein. 1872 übernahm sie die Leitung des Majlis-i Uns, eines literarischen Kreises in Schuscha, der sich mit anderen Dichterkreisen austauschte. Sie schrieb Ghasele und Elegien. Ein illustriertes Album bezeugt auch ihre Arbeit als Künstlerin."]
sections = [{ title = "Wasser für Schuscha", paragraphs = ["Natavan finanzierte die Wasserversorgung von Schuscha. Laut dem städtischen Denkmalverzeichnis gelangte Quellwasser durch Tonrohre in ein Becken und von dort zu einem öffentlichen Brunnen. Der Brunnen wurde im August 1873 in Betrieb genommen und als Khan Gizi bekannt, die Tochter des Khans. Brunnen von Schuscha greift diese Investition im Spiel auf. Nach dem Ausbau einer eigenen Stadt auf Stufe 2 entsteht am nächsten gültigen Bauplatz im Umkreis von 12 Feldern ein kostenloser Bauernhof der Stufe 1. Der Bauplatz leuchtet auf und das HUD meldet die Aktivierung."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.it]
text = "Khurshid Banu Natavan fu una poetessa e mecenate azera di Shusha, dove morì nel 1897. Le fonti pubblicate riportano anni di nascita diversi, fra cui il 1830 e il 1832. Era figlia di Mehdiqulu Khan, l’ultimo khan del Karabakh, e destinò risorse della famiglia a opere civiche e culturali. Nel 1872 prese la guida di Majlis-i Uns, un circolo letterario che riuniva poeti a Shusha e teneva contatti con altri circoli. Scrisse ghazal ed elegie, e un suo album illustrato testimonia anche il lavoro artistico."
title = "Khurshid Banu Natavan"
lang = "it"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan fu una poetessa e mecenate azera di Shusha, dove morì nel 1897. Le fonti pubblicate riportano anni di nascita diversi, fra cui il 1830 e il 1832. Era figlia di Mehdiqulu Khan, l’ultimo khan del Karabakh, e destinò risorse della famiglia a opere civiche e culturali. Nel 1872 prese la guida di Majlis-i Uns, un circolo letterario che riuniva poeti a Shusha e teneva contatti con altri circoli. Scrisse ghazal ed elegie, e un suo album illustrato testimonia anche il lavoro artistico."]
sections = [{ title = "Acqua per Shusha", paragraphs = ["Natavan finanziò l’approvvigionamento idrico di Shusha. Il registro municipale del monumento descrive condotte di argilla che portavano acqua di sorgente a un serbatoio e poi a una fontana pubblica. La fontana entrò in funzione nell’agosto 1873 e fu chiamata Khan Gizi, la figlia del khan. Fontana di Shusha porta nel gioco questo investimento. Quando una tua città completa il passaggio al livello 2, si fonda una fattoria di livello 1 gratuita sul sito valido più vicino entro 12 caselle. Il terreno della fattoria si illumina e l’HUD segnala l’attivazione."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.tr]
text = "Hurşid Bânû Nâtevan, 1897’de öldüğü Şuşa’dan bir Azerbaycanlı şair ve sanat hamisiydi. Yayımlanmış kaynaklar doğum yılı için 1830 ve 1832 gibi farklı tarihler verir. Karabağ’ın son hanı Mehdiqulu Han’ın kızıydı ve aile kaynaklarını kamusal ve kültürel işlere ayırdı. 1872’de Şuşa’da şairleri bir araya getiren ve başka şiir çevreleriyle ilişki kuran Meclis-i Üns’ün başına geçti. Gazeller ve mersiyeler yazdı. Resimli albümü de sanat çalışmalarından örnekler barındırır."
title = "Hurşid Bânû Nâtevan"
lang = "tr"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Hurşid Bânû Nâtevan, 1897’de öldüğü Şuşa’dan bir Azerbaycanlı şair ve sanat hamisiydi. Yayımlanmış kaynaklar doğum yılı için 1830 ve 1832 gibi farklı tarihler verir. Karabağ’ın son hanı Mehdiqulu Han’ın kızıydı ve aile kaynaklarını kamusal ve kültürel işlere ayırdı. 1872’de Şuşa’da şairleri bir araya getiren ve başka şiir çevreleriyle ilişki kuran Meclis-i Üns’ün başına geçti. Gazeller ve mersiyeler yazdı. Resimli albümü de sanat çalışmalarından örnekler barındırır."]
sections = [{ title = "Şuşa’ya su", paragraphs = ["Nâtevan, Şuşa’nın su ihtiyacını karşılamak için bir proje finanse etti. Şehrin anıt kaydına göre kaynak suyu kilden borularla önce bir depoya, oradan da halka açık bir çeşmeye ulaştı. Ağustos 1873’te kullanıma giren çeşme Han Kızı adıyla tanındı. Şuşa Çeşmesi bu yatırımı oyuna uyarlar. Kendi şehrin 2. seviyeye yükseltildiğinde, 12 kare içindeki en yakın uygun alanda ücretsiz bir 1. seviye çiftlik kurulur. Çiftliğin alanı parlar ve HUD etkinleşmeyi bildirir."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.zh-CN]
text = "胡尔希德·巴努·纳塔万是来自舒沙的阿塞拜疆诗人和文化赞助人。她于1897年去世。关于她的出生年份，出版资料有不同记载，其中包括1830年和1832年。她的父亲迈赫迪古卢汗是卡拉巴赫最后一位汗。纳塔万继承了家族的资源，并将其中一部分用于公共事业和文化活动。1872年，她主持舒沙的文学团体马吉利斯·温斯。当地诗人在这个团体相聚，也和其他地区的诗人团体交流作品。她创作了抒情诗和挽诗，有一部分作品在她去世后编入诗集。她还绘制图画，留存的插图册为了解她的艺术活动提供了材料。文学聚会与插图册记录了她从事创作的不同方式，也说明她利用自己的财力为本地文化活动提供场所和支持。"
title = "胡尔希德·巴努·纳塔万"
lang = "zh-CN"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["胡尔希德·巴努·纳塔万是来自舒沙的阿塞拜疆诗人和文化赞助人。她于1897年去世。关于她的出生年份，出版资料有不同记载，其中包括1830年和1832年。她的父亲迈赫迪古卢汗是卡拉巴赫最后一位汗。纳塔万继承了家族的资源，并将其中一部分用于公共事业和文化活动。1872年，她主持舒沙的文学团体马吉利斯·温斯。当地诗人在这个团体相聚，也和其他地区的诗人团体交流作品。她创作了抒情诗和挽诗，有一部分作品在她去世后编入诗集。她还绘制图画，留存的插图册为了解她的艺术活动提供了材料。文学聚会与插图册记录了她从事创作的不同方式，也说明她利用自己的财力为本地文化活动提供场所和支持。"]
sections = [{ title = "为舒沙引水", paragraphs = ["纳塔万出资改善舒沙的供水。按照市政府公布的纪念建筑资料，工程把山间泉水经陶制水管引到城中的蓄水设施，再从那里送到公共水泉。这项工程需要选定水源、修建输水线路，并把城外来水接入供居民取用的设施。市政府的记录说，选定的泉水在距城约七点五公里的山脚，纳塔万也为工程请来了专业人员。水泉在1873年8月投入使用，后来人们以汗的女儿来称呼它。工程的直接用途是为市民供应饮用水，留下的水泉也使出资者的名字与城市建设联系起来。游戏中的「舒沙之泉」借用公共设施建成后给周边带来收益的关系，并把收益表现为一座新农场。纳塔万的一座城市完成二级升级时，系统会在十二格以内寻找最近的合法地块。如果存在这样的地块，就免费建立一座已经完工的一级农场。地块仍须符合农场对己方领土、地形和占地的要求。升级完成时若没有合法地点，农场便不会出现。满足条件时，地图会在新农场所在位置闪光，战斗界面也会显示能力已发动的提示。水管和饮用水属于舒沙的历史工程，农场和具体的建造距离则是游戏规则。"] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.ja]
text = "フルシード・バヌ・ナタヴァンはシュシャ出身のアゼルバイジャンの詩人で、文化活動を支援した。1897年に亡くなった。生年は資料によって1830年、1832年など異なる。父のメフディグル・ハンはカラバフ最後のハンで、ナタヴァンは一族から受け継いだ財産を地域の事業や文化活動に用いた。1872年には文学の集まりマジュリス・イ・ウンスを率いるようになった。シュシャの詩人が集い、他の町の詩人の集まりとも交流した。彼女は抒情詩のガザルや哀悼の詩を書いた。のちの詩集に収められた作品があり、自ら絵を描いた画帖も残されている。詩を書くことと、詩人の活動を支えることの両方に携わった人物である。"
title = "フルシード・バヌ・ナタヴァン"
lang = "ja"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["フルシード・バヌ・ナタヴァンはシュシャ出身のアゼルバイジャンの詩人で、文化活動を支援した。1897年に亡くなった。生年は資料によって1830年、1832年など異なる。父のメフディグル・ハンはカラバフ最後のハンで、ナタヴァンは一族から受け継いだ財産を地域の事業や文化活動に用いた。1872年には文学の集まりマジュリス・イ・ウンスを率いるようになった。シュシャの詩人が集い、他の町の詩人の集まりとも交流した。彼女は抒情詩のガザルや哀悼の詩を書いた。のちの詩集に収められた作品があり、自ら絵を描いた画帖も残されている。詩を書くことと、詩人の活動を支えることの両方に携わった人物である。"]
sections = [{ title = "シュシャの水道", paragraphs = ["ナタヴァンはシュシャに水を引く工事の費用を負担した。市が公表する記念建造物の資料によれば、山からの湧き水は土管で貯水池に送られ、そこから公共の水場へ流れた。水源を選んで市内まで水を運び、住民が取水できる場所につなぐ工事だった。水場は1873年8月18日に使われ始め、山の湧き水を市内まで引く設備の終点となった。ハンの娘にちなんだ名で呼ばれるようになった。この施設は住民に飲料水を供給した。ゲームの「シュシャの泉」は、都市の工事が周囲にもたらす利益に着想を得ている。ナタヴァンの都市がレベル2への増築を完了したとき、十二マス以内に建設可能な場所があれば、最も近い場所に完成済みのレベル1の農場が無料で建つ。自分の領土で地形や空き地の条件を満たす場所を探すため、候補がなければ農場はできない。効果が発動すると農場の場所がマップ上で光り、画面にも通知が出る。史実の施設は飲料水のための水道であり、農場を建てる効果はその公共事業をゲーム内で表したものである。"] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.ko]
text = "후르시드 바누 나타반은 슈샤 출신의 아제르바이잔 시인이자 후원자였다. 1897년에 세상을 떠났으며, 출생 연도는 자료에 따라 1830년과 1832년 등으로 다르게 기록된다. 아버지 메흐디굴루 칸은 카라바흐의 마지막 칸이었다. 나타반은 물려받은 자원을 주민을 위한 사업과 문화 활동에 썼다. 1872년에는 슈샤의 시인들이 모이는 마즐리스이 운스를 이끌었다. 이 모임의 시인들은 다른 지역의 문학 모임과도 교류했다. 나타반은 가잘과 애가를 썼고, 일부 작품은 후대의 시집에 실렸다. 직접 그림을 그린 앨범도 남아 있다."
title = "후르시드 바누 나타반"
lang = "ko"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["후르시드 바누 나타반은 슈샤 출신의 아제르바이잔 시인이자 후원자였다. 1897년에 세상을 떠났으며, 출생 연도는 자료에 따라 1830년과 1832년 등으로 다르게 기록된다. 아버지 메흐디굴루 칸은 카라바흐의 마지막 칸이었다. 나타반은 물려받은 자원을 주민을 위한 사업과 문화 활동에 썼다. 1872년에는 슈샤의 시인들이 모이는 마즐리스이 운스를 이끌었다. 이 모임의 시인들은 다른 지역의 문학 모임과도 교류했다. 나타반은 가잘과 애가를 썼고, 일부 작품은 후대의 시집에 실렸다. 직접 그림을 그린 앨범도 남아 있다."]
sections = [{ title = "슈샤에 물을 대다", paragraphs = ["나타반은 슈샤에 물을 공급하는 공사에 비용을 댔다. 시의 기념물 기록에 따르면 산에서 나는 샘물을 점토관에 흘려 저수 시설에 모은 뒤 공공 샘으로 보냈다. 1873년 8월 18일에 가동된 공공 샘은 칸의 딸을 뜻하는 이름으로 알려졌다. 이 공사의 목적은 주민들에게 마실 물을 공급하는 일이었다. 샘은 산의 수원과 도시를 잇는 시설의 끝에 있었다. 게임의 ‘슈샤의 샘’은 도시 시설에 대한 투자가 주변에 혜택을 준다는 점을 농장으로 표현한다. 나타반 소유 도시가 레벨 2 업그레이드를 끝내면 도시에서 12칸 이내의 가장 가까운 적합한 부지에 완공된 레벨 1 농장이 무료로 세워진다. 자기 영토와 지형 등 농장 건설 조건을 충족하는 곳을 찾을 수 있어야 한다. 조건에 맞는 부지가 없으면 농장은 생기지 않는다. 농장이 생기면 지도에서 그 부지가 빛나고 HUD에 발동 안내가 표시된다."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.ar]
text = "كانت خورشيد بانو ناتافان شاعرة أذربيجانية وراعية للفنون من شوشا، حيث توفيت عام 1897. وتذكر المصادر المنشورة سنوات مختلفة لميلادها، منها 1830 و1832. وكان أبوها مهدي قولو خان آخر خانات قره باغ. واستخدمت ما ورثته من موارد الأسرة لدعم أعمال عامة وثقافية. وفي عام 1872 تولت قيادة مجلس الأنس، وهو حلقة أدبية جمعت شعراء شوشا وتبادلت النتاج مع حلقات أخرى. وكتبت الغزل والمراثي، ووصل بعض شعرها في مجموعات لاحقة. كما بقي ألبوم مصور يشهد على عملها الفني."
title = "خورشيد بانو ناتافان"
lang = "ar"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["كانت خورشيد بانو ناتافان شاعرة أذربيجانية وراعية للفنون من شوشا، حيث توفيت عام 1897. وتذكر المصادر المنشورة سنوات مختلفة لميلادها، منها 1830 و1832. وكان أبوها مهدي قولو خان آخر خانات قره باغ. واستخدمت ما ورثته من موارد الأسرة لدعم أعمال عامة وثقافية. وفي عام 1872 تولت قيادة مجلس الأنس، وهو حلقة أدبية جمعت شعراء شوشا وتبادلت النتاج مع حلقات أخرى. وكتبت الغزل والمراثي، ووصل بعض شعرها في مجموعات لاحقة. كما بقي ألبوم مصور يشهد على عملها الفني."]
sections = [{ title = "مياه لشوشا", paragraphs = ["موّلت ناتافان مشروعاً لإمداد شوشا بالمياه. ويذكر سجل المدينة أن مياه الينابيع مرت عبر أنابيب فخارية إلى خزان، ومنه إلى نافورة عامة. بدأ تشغيلها في أغسطس 1873 وعُرفت باسم ابنة الخان. وتستمد قدرة «نافورة شوشا» فكرتها من هذا الاستثمار. عند اكتمال ترقية مدينة تملكها إلى المستوى 2، تُنشأ مزرعة مكتملة مجانية من المستوى 1 في أقرب موقع صالح ضمن 12 خانة. وتضيء أرض المزرعة وتعرض واجهة اللعب إشعار التفعيل."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.ru]
text = "Хуршидбану Натаван была азербайджанской поэтессой и покровительницей искусств из Шуши, где умерла в 1897 году. В опубликованных источниках приводятся разные годы рождения, в том числе 1830 и 1832. Её отец Мехдикули-хан был последним ханом Карабаха. Натаван использовала унаследованные средства для общественных и культурных проектов. В 1872 году она возглавила «Меджлиси-унс», литературный кружок шушинских поэтов, который поддерживал связь с другими кружками. Она писала газели и элегии. Её иллюстрированный альбом сохранил и образцы её художественных работ."
title = "Хуршидбану Натаван"
lang = "ru"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Хуршидбану Натаван была азербайджанской поэтессой и покровительницей искусств из Шуши, где умерла в 1897 году. В опубликованных источниках приводятся разные годы рождения, в том числе 1830 и 1832. Её отец Мехдикули-хан был последним ханом Карабаха. Натаван использовала унаследованные средства для общественных и культурных проектов. В 1872 году она возглавила «Меджлиси-унс», литературный кружок шушинских поэтов, который поддерживал связь с другими кружками. Она писала газели и элегии. Её иллюстрированный альбом сохранил и образцы её художественных работ."]
sections = [{ title = "Вода для Шуши", paragraphs = ["Натаван оплатила устройство водоснабжения Шуши. Согласно городскому описанию памятника, родниковая вода шла по глиняным трубам в резервуар, а оттуда к общественному фонтану. Фонтан начал работать в августе 1873 года и получил название Хан кызы, дочь хана. «Фонтан Шуши» переносит этот вклад в игру. При завершении улучшения своего города до уровня 2 на ближайшем пригодном участке в радиусе 12 клеток появляется бесплатная готовая ферма уровня 1. Участок вспыхивает, и интерфейс показывает уведомление."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.vi]
text = "Khurshid Banu Natavan là nhà thơ và người bảo trợ văn hóa Azerbaijan quê ở Shusha, nơi bà qua đời năm 1897. Các nguồn đã xuất bản ghi những năm sinh khác nhau, trong đó có 1830 và 1832. Cha bà, Mehdiqulu Khan, là vị khan cuối cùng của Karabakh. Natavan dùng tài sản thừa kế của gia đình để hỗ trợ các công trình công cộng và hoạt động văn hóa. Năm 1872 bà đứng đầu Majlis-i Uns, nhóm văn chương quy tụ các nhà thơ ở Shusha và giao lưu với những nhóm khác. Bà sáng tác ghazal và thơ bi ai, đồng thời để lại một tập minh họa."
title = "Khurshid Banu Natavan"
lang = "vi"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan là nhà thơ và người bảo trợ văn hóa Azerbaijan quê ở Shusha, nơi bà qua đời năm 1897. Các nguồn đã xuất bản ghi những năm sinh khác nhau, trong đó có 1830 và 1832. Cha bà, Mehdiqulu Khan, là vị khan cuối cùng của Karabakh. Natavan dùng tài sản thừa kế của gia đình để hỗ trợ các công trình công cộng và hoạt động văn hóa. Năm 1872 bà đứng đầu Majlis-i Uns, nhóm văn chương quy tụ các nhà thơ ở Shusha và giao lưu với những nhóm khác. Bà sáng tác ghazal và thơ bi ai, đồng thời để lại một tập minh họa."]
sections = [{ title = "Nước cho Shusha", paragraphs = ["Natavan tài trợ công trình cấp nước cho Shusha. Theo hồ sơ di tích của thành phố, nước suối đi theo ống đất nung tới bể chứa rồi đến một đài nước công cộng. Đài đi vào hoạt động tháng 8 năm 1873 và được biết đến với tên Khan Gizi, nghĩa là con gái của khan. Đài nước Shusha đưa khoản đầu tư ấy vào trận đấu. Khi một thành phố của Natavan nâng cấp xong lên cấp 2, một trang trại cấp 1 hoàn chỉnh được lập miễn phí tại ô hợp lệ gần nhất trong phạm vi 12 ô. Ô trang trại lóe sáng và giao diện hiện thông báo kích hoạt."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.id]
text = "Khurshid Banu Natavan adalah penyair dan pelindung seni Azerbaijan dari Shusha, tempat ia meninggal pada 1897. Sumber-sumber yang diterbitkan mencatat tahun kelahiran yang berbeda, termasuk 1830 dan 1832. Ayahnya, Mehdiqulu Khan, merupakan khan terakhir Karabakh. Natavan menggunakan sumber daya warisan keluarga untuk mendukung kegiatan masyarakat dan kebudayaan. Pada 1872 ia memimpin Majlis-i Uns, kelompok sastra yang menghimpun penyair Shusha dan berhubungan dengan kelompok lain. Ia menulis gazal dan elegi. Album bergambar yang ditinggalkannya juga menyimpan contoh karya seninya."
title = "Khurshid Banu Natavan"
lang = "id"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan adalah penyair dan pelindung seni Azerbaijan dari Shusha, tempat ia meninggal pada 1897. Sumber-sumber yang diterbitkan mencatat tahun kelahiran yang berbeda, termasuk 1830 dan 1832. Ayahnya, Mehdiqulu Khan, merupakan khan terakhir Karabakh. Natavan menggunakan sumber daya warisan keluarga untuk mendukung kegiatan masyarakat dan kebudayaan. Pada 1872 ia memimpin Majlis-i Uns, kelompok sastra yang menghimpun penyair Shusha dan berhubungan dengan kelompok lain. Ia menulis gazal dan elegi. Album bergambar yang ditinggalkannya juga menyimpan contoh karya seninya."]
sections = [{ title = "Air untuk Shusha", paragraphs = ["Natavan mendanai pasokan air untuk Shusha. Menurut catatan monumen kota, pipa tanah liat membawa air dari mata air ke penampung, lalu ke pancuran umum. Pancuran mulai berfungsi pada Agustus 1873 dan dikenal sebagai Khan Gizi, putri sang khan. Pancuran Shusha mengadaptasi investasi itu ke dalam permainan. Saat kotamu selesai naik ke tingkat 2, pertanian tingkat 1 siap pakai didirikan secara gratis di lokasi sah terdekat dalam jarak 12 petak. Petak pertanian berkilat dan HUD memberi pemberitahuan aktivasi."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.fil]
text = "Si Khurshid Banu Natavan ay isang makata at tagapagtaguyod ng sining na Azerbaijani mula sa Shusha, kung saan siya namatay noong 1897. Iba-iba ang taong ibinibigay ng mga nailathalang sanggunian para sa kaniyang kapanganakan, kabilang ang 1830 at 1832. Anak siya ni Mehdiqulu Khan, ang huling khan ng Karabakh. Ginamit niya ang minanang yaman para sa mga gawaing sibiko at pangkultura. Noong 1872, pinamunuan niya ang Majlis-i Uns, samahan ng mga makata sa Shusha na nakikipag-ugnayan sa ibang grupo. Sumulat siya ng mga ghazal at elehiya, at may natira rin siyang album na may mga guhit."
title = "Khurshid Banu Natavan"
lang = "fil"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Si Khurshid Banu Natavan ay isang makata at tagapagtaguyod ng sining na Azerbaijani mula sa Shusha, kung saan siya namatay noong 1897. Iba-iba ang taong ibinibigay ng mga nailathalang sanggunian para sa kaniyang kapanganakan, kabilang ang 1830 at 1832. Anak siya ni Mehdiqulu Khan, ang huling khan ng Karabakh. Ginamit niya ang minanang yaman para sa mga gawaing sibiko at pangkultura. Noong 1872, pinamunuan niya ang Majlis-i Uns, samahan ng mga makata sa Shusha na nakikipag-ugnayan sa ibang grupo. Sumulat siya ng mga ghazal at elehiya, at may natira rin siyang album na may mga guhit."]
sections = [{ title = "Tubig para sa Shusha", paragraphs = ["Pinondohan ni Natavan ang suplay ng tubig sa Shusha. Ayon sa tala ng lungsod, dumaan ang tubig mula sa bukal sa mga tubong luwad patungo sa imbakan at pagkatapos ay sa pampublikong bukal. Nagsimula itong gamitin noong Agosto 1873 at tinawag na Khan Gizi, ang anak na babae ng khan. Hango rito ang Bukal ng Shusha. Kapag natapos ang pag-upgrade ng lungsod ni Natavan sa antas 2, lilitaw ang libreng sakahang antas 1 sa pinakamalapit na angkop na lugar sa loob ng 12 tile. Kikinang ang lupang iyon at magpapakita ng abiso ang HUD."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]

[articles.pt-BR]
text = "Khurshid Banu Natavan foi uma poeta e mecenas azerbaijana de Shusha, onde morreu em 1897. As fontes publicadas divergem sobre seu ano de nascimento e mencionam datas como 1830 e 1832. Era filha de Mehdiqulu Khan, o último cã de Carabaque, e destinou recursos da família a obras cívicas e culturais. Em 1872, assumiu a direção do Majlis-i Uns, círculo literário que reunia poetas de Shusha e mantinha contato com outros grupos. Escreveu gazais e elegias. Seu álbum ilustrado também preserva exemplos de sua produção artística."
title = "Khurshid Banu Natavan"
lang = "pt-BR"
url = "https://files.preslib.az/projects/shusha/en/c1.pdf"
shortArticle = true
intro = ["Khurshid Banu Natavan foi uma poeta e mecenas azerbaijana de Shusha, onde morreu em 1897. As fontes publicadas divergem sobre seu ano de nascimento e mencionam datas como 1830 e 1832. Era filha de Mehdiqulu Khan, o último cã de Carabaque, e destinou recursos da família a obras cívicas e culturais. Em 1872, assumiu a direção do Majlis-i Uns, círculo literário que reunia poetas de Shusha e mantinha contato com outros grupos. Escreveu gazais e elegias. Seu álbum ilustrado também preserva exemplos de sua produção artística."]
sections = [{ title = "Água para Shusha", paragraphs = ["Natavan financiou o abastecimento de água de Shusha. Segundo o registro municipal do monumento, a água de nascente seguia por tubos de barro até um reservatório e dali até uma fonte pública. A fonte começou a funcionar em agosto de 1873 e ficou conhecida como Khan Gizi, a filha do cã. Fonte de Shusha adapta esse investimento ao jogo. Quando uma cidade de Natavan termina de subir para o nível 2, surge uma fazenda pronta e gratuita de nível 1 no terreno válido mais próximo a até 12 casas. O terreno da fazenda pisca e a interface mostra o aviso de ativação."] }]
sources = [{ title = "Presidential Library of Azerbaijan, Khurshidbanu Natavan", url = "https://files.preslib.az/projects/shusha/en/c1.pdf" }, { title = "Shusha City, Khan Gizi Fountain", url = "https://shusha.gov.az/en/abide/bulaq-2" }, { title = "Yavuz Akpınar, Hurşid Bânû Nâtevan, TDV İslâm Ansiklopedisi", url = "https://islamansiklopedisi.org.tr/hursid-banu-natevan" }]
