[articles.en]
text = "Lobengula Khumalo was the second and last official king of Mthwakazi. Both names in the Ndebele language mean \"the men of the long shields\", a reference to the Ndebele warriors' use of the Nguni shield."
title = "Lobengula"
lang = "en"
url = "https://en.wikipedia.org/wiki/Lobengula"
intro = [
  "Lobengula Khumalo (c. 1835 – c. 1894) was the second and last official king of Mthwakazi (historically called Matabeleland in English). Both names in the Ndebele language mean \"the men of the long shields\", a reference to the Ndebele warriors' use of the Nguni shield.",
]
sections = [
  { "title" = "Background", "paragraphs" = [
      "The Matabele were descendants of a faction of the Zulu people who fled Transvaal in South Africa after the Boers invaded the area running away from the English in the Cape Colony. Mzilikazi settled in Transvaal after running away from Shaka in KwaZulu-Natal. Shaka's military, Mzilikazi led his followers away from Zulu territory after a falling-out. In the late 1830s, they settled in Transvaal. He was ruthless and he pillaged and slaughtered, Mzilikazi rounded up the strong men and women, turning the men into army recruits and the women into concubines for his warriors, his possessions increasing with his power and prestige, and his followers numbering, in due course, more Sotho youths than Zulu. He made himself a king of the Transvaal area. Between 1827 and 1832, Mzilikazi built himself three military strongholds. The largest was Kungwini, situated at the foot of the Wonderboom Mountains on the Apies River, just north of present day Pretoria. Another was Dinaneni, north of the Hartbeespoort Dam, while the third was Hlahlandlela in the territory of the Fokeng near Rustenburg.",
      "Members of the tribe had a privileged position against outsiders whose lives were subject to the will of the king. In return for their privileges, however, the Ndebele people both men and women had to submit to a strict discipline and status within the hierarchy. That set out their duties and responsibilities to the rest of society. Infringements of any social responsibility were punished with death, subject to the king's seldom-awarded reprieve. This tight discipline and loyalty were the secret of the Ndebele's success in dominating their neighbours.",
    ] },
  { "title" = "Birthright", "paragraphs" = [
      "After the death of Mzilikazi, the first king of the Ndebele nation, in 1868, the izinduna, or chiefs, offered the crown to Lobengula, one of Mzilikazi's sons from an inferior wife. Several impis (regiments) led by Chief Mbiko Masuku disputed Lobengula's ascent, and the question was ultimately decided by the arbitration of the assegai, with Lobengula and his impis crushing the rebels. Lobengula's courage in the battle led to his unanimous selection as king.",
    ] },
  { "title" = "Coronation", "paragraphs" = [
      "The coronation of Lobengula took place at Mhlahlandlela, one of the principal military towns. The Ndebele nation assembled in the form of a large semicircle, performed a war dance, and declared their willingness to fight and die for Lobengula. A great number of cattle were slaughtered, and the choicest meats were offered to Mlimo, the Ndebele spiritual leader, and to the dead Mzilikazi. Great quantities of millet beer were also consumed.",
      "About 10,000 Matabele warriors in full war costume attended the crowning of Lobengula. Their costumes consisted of a headdress and short cape made of black ostrich feathers, a kilt made of leopard or other skins and ornamented with the tails of white cattle. Around their arms they wore similar tails and around their ankles they wore rings of brass and other metals. Their weapons consisted of one or more long spears for throwing and a short stabbing-spear or assegai (also the principal weapon of the Zulu people). For defence, they carried large oval shields of ox-hide, either black, white, red, or speckled according to the impi (regiment) they belonged to.",
      "The Ndebele maintained their position due to the greater size and tight discipline in the army, to which every able-bodied man in the tribe owed service. \"The Ndebele army, consisting of 15,000 men in 40 regiments [was] based around Lobengula's capital of Bulawayo.\"",
    ] },
  { "title" = "Rule", "paragraphs" = [
      "In 1870 King Lobengula granted Sir John Swinburne's London and Limpopo Mining Company the right to search for gold and other minerals on a tract of land in the extreme southwest of Matabeleland along the Tati River between the Shashe and Ramaquabane rivers, in what became known as the Tati Concession. However, it was not until about 1890 that any significant mining in the area commenced.",
      "Lobengula had been tolerant of the white hunters who came to Matabeleland; he would even go so far as to punish those of his tribe who threatened the whites. However, when a British team (Francis Thompson, Charles Rudd and Rochfort Maguire) came in 1888 to try to persuade him to grant them the right to dig for minerals in additional parts of his territory, he was wary about entering into negotiations. Lobengula gave his agreement only when his friend, Leander Starr Jameson, a qualified medical doctor who had once treated Lobengula for gout, proposed to secure money and weaponry for the Matabele in addition to a pledge that any people who came to dig would be considered as living in his kingdom. As part of this agreement, and at the insistence of the British, neither the Boers nor the Portuguese would be permitted to settle or gain concessions in Matabeleland. Although, Lobengula was illiterate and was not aware of how damaging this contract was to his country, only found out the real terms of the contract he signed as his subjects found out. After going to friendly English missionaries to confirm this rumor, Lobengula sent two emissaries to the British queen, Victoria, but this proved futile. They were delayed by Alfred Beit's associates at the port. As a last resort, Lobengula formally protested the contract to the queen on 23 April 1889. As a response from the queen's advisor, Lobengula was told it was \"impossible for them to exclude white men\". Lobengula informed Queen Victoria he and his Indunas would recognize the contract as they believe he was tricked. The 25-year Rudd Concession was signed by Lobengula on 30 October 1888.",
    ] },
]

[articles.es]
text = "Lobengula Khumalo (1845-1894) fue el segundo y último rey del pueblo matabele, ahora más conocido como ndebele. Ambos nombres, en la lengua Sindebele, significan \"El pueblo de los escudos largos\", que hace referencia al uso por parte de los guerreros matabele del escudo y la lanza zulúes."
title = "Lobengula"
lang = "es"
url = "https://es.wikipedia.org/wiki/Lobengula"
intro = [
  "Lobengula Khumalo (1845-1894) fue el segundo y último rey del pueblo matabele, ahora más conocido como ndebele. Ambos nombres, en la lengua Sindebele, significan \"El pueblo de los escudos largos\", que hace referencia al uso por parte de los guerreros matabele del escudo y la lanza zulúes.",
]
sections = [
  { "title" = "Antecedentes", "paragraphs" = [
      "Los matabele estaban relacionados con los zulúes y se dirigieron hacia el norte durante el reinado de Shaka después del mfecane (\"el aplastamiento\") o difaqane (\"la diáspora\"). El general Mzilikazi, que había estado junto a Shaka, condujo a sus seguidores al exilio lejos del territorio Zulú luego de que cayera en desgracia con Shaka. A finales de la década de 1830 se asentaron en lo que se denomina en la actualidad Matabeleland, en el oeste de Zimbabue, aunque reclamando la soberanía sobre una zona mucho mayor. El reino resultante era una sociedad de la Edad de Hierro en la cual los miembros de la tribu tenían una posición de privilegio comparada con la que tenían los extranjeros cuyas vidas se encontraban a merced del rey. Sin embargo, a cambio de estos privilegios el pueblo matabele (tanto hombres como mujeres), debía someterse a una disciplina estricta y estatus dentro de la jerarquía y ello determinaba sus obligaciones y responsabilidades con respecto al resto de la sociedad. Las violaciones a la responsabilidad social eran castigadas con la pena de muerte sujeta a la decisión final del rey (que raras veces la condonaba). Esta disciplina y lealtad estricta eran el secreto del éxito de los matabele para dominar a sus vecinos.​",
    ] },
  { "title" = "Ascenso al trono", "paragraphs" = [
      "Luego de la muerte de Mzilikazi el primer rey de la nación Matabele en 1868 el izinduna, o consejo de jefes, ofreció la corona a Lobengula, uno de los hijos de una esposa menor de Mzilikazi. Varios impis (regimientos) disputaron la selección de Lobengula y el tema fue finalmente decidido mediante la asegai, en una pelea en la cual Lobengula y sus impis aplastaron a los rebeldes. El coraje de Lobengula en esta batalla determinó su elección como rey de manera unánime.",
    ] },
  { "title" = "Coronación", "paragraphs" = [
      "La coronación de Lobengula se realizó en Mhlanhlandlela, uno de los principales poblados militares. La nación Matabele se reunió formando un gran semicírculo, danzaron una danza guerrera, y proclamaron su deseo de pelear y morir por Lobengula. Se sacrificó gran número de vacas y los mejores cortes se le ofrecieron a Mlimo, el líder espiritual de los Matabele, y al fallecido Mzilikazi. Se consumieron grandes cantidades de cerveza de mijo.",
      "Unos 10,000 guerreros Matabele vestidos con sus atuendos guerreros concurrieron a la coronación de Lobengula. Sus atuendos consistían en un arreglo en su cabeza y una capa corta de plumas de avestrúz, una falda corta de leopardo u otras pieles y decorados con las colas de ganado blanco. Sus brazos estaban adornados con colas de ganado y alrededor de sus tobillos llevaban anillos de bronce y otros metales. Sus armas eran una o más lanzas largas y una lanza corta o assegai (también el arma principal de los Zulú). Para defenderse portaban largos escudos de forma oval de piel de buey, negros, blancos o rojos o decorados con puntos identificando al impi (regimiento) al cual pertenecían.",
    ] },
]

[articles.de]
text = "Lobengula (* 1833; † ca. 1893 in Matabeleland) war der zweite und zugleich letzte König des Matabele-Königreichs im südlichen Afrika."
title = "Lobengula"
lang = "de"
url = "https://de.wikipedia.org/wiki/Lobengula"
intro = [
  "Lobengula (* 1833; † ca. 1893 in Matabeleland) war der zweite und zugleich letzte König des Matabele-Königreichs im südlichen Afrika.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Lobengula übernahm die Herrschaft von seinem Vater Mzilikazi nach dessen Tod 1868. Lobengula war ein Herrscher von imposanter Gestalt und mit 68 Frauen verheiratet, hatte aber keinen Thronfolger. Zeitgenossen beschreiben Lobengula als einen Herrscher, der mit drakonischer Härte gegenüber Stammesgenossen vorging, um diese seinem autokratischen Regime zu unterwerfen. Er war unter Seinesgleichen so gefürchtet, dass sein Heerführer Unondo sich nach einer verlorenen Schlacht im Matabelekrieg lieber an einem Baum erhängte, als wieder zu Lobengula zurückzukehren.",
      "Während seiner Regierungszeit wurde der Hauptort Bulawayo zu einem wichtigen Knotenpunkt für den Handel im südlichen Afrika. Lobengula setzte die Reformen seines Vaters fort und führte fortschrittliche Sozialsysteme ein. Moderne westliche Prinzipien des kommerziellen Handels wurden anerkannt. Einzigartig auf dem afrikanischen Kontinent wurde ein Kodex individueller, wenngleich auch stark beschränkter Rechte etabliert.",
      "Lobengula kooperierte zunächst mit den Briten. Da er von Cecil Rhodes monatlich große Geldzuwendungen erhielt, konnte Letzterer sich nicht vorstellen, dass Lobengula in einen Konflikt gegen die Briten eintreten würde. Lobengula geriet aber im eigenen Lager in die Kritik, sodass ein Angriff auf die Briten für ihn unausweichlich wurde. Dies führte 1893 zum Ersten Matabelekrieg.",
    ] },
]

[articles.it]
text = "Lobengula Khumalo, trascritto in italiano anche come Lobenguela (1845 – gennaio 1894), è stato il secondo e ultimo re del popolo dei Ndebele (in inglese Matabele). Tale popolazione, con un grado di civiltà paragonabile all'età del ferro, era stanziato in una regione geografica che oggi corrisponde al sud-ovest dello Zimbabwe."
title = "Lobengula"
lang = "it"
url = "https://it.wikipedia.org/wiki/Lobengula"
intro = [
  "Lobengula Khumalo, trascritto in italiano anche come Lobenguela (1845 – gennaio 1894), è stato il secondo e ultimo re del popolo dei Ndebele (in inglese Matabele).",
  "Tale popolazione, con un grado di civiltà paragonabile all'età del ferro, era stanziato in una regione geografica che oggi corrisponde al sud-ovest dello Zimbabwe. Nel 1870 Lobengula salì al trono del regno creato dal padre Mzilikazi, ma il suo periodo di governo fu caratterizzato da vicende molto travagliate che portarono alla perdita dell'indipendenza da parte del popolo Ndebele.",
]
sections = [
  { "title" = "Origini del popolo Ndebele", "paragraphs" = [
      "Mzilikazi, il padre di Lobengula, era un generale del re Shaka, capo del popolo Zulu stanziato nell'Africa del Sud. Negli anni venti del XIX secolo, Mzilikazi si ribellò a Shaka e, alla testa di un gruppo di circa 20.000 persone, migrò verso nord stanziandosi lungo il corso del fiume Vaal, dove la popolazione fuggita con Mzilikazi assunse la denominazione di Ndebele ovvero gente del nord.",
      "In seguito, nel periodo compreso tra il 1836 e il 1838, per sfuggire alla minaccia degli Zulu, il popolo Ndebele si spostò prima verso Ovest e poi, dietro pressione degli Afrikaner, si trasferì ancora più a nord, oltre il fiume Limpopo, costituendovi uno Stato, con capitale a Bulawayo e sottomettendo i gruppi etnici locali, tra i quali figurano tribù di etnia shona. Tale regno nella lingua locale aveva il nome di Mthwakazi, che significa “qualcosa che è diventato grande al momento del concepimento”, ma che in seguito gli Inglesi chiameranno Matabeleland non riuscendo a pronunciare correttamente i termini Ndebele e Mthwakazi.",
    ] },
  { "title" = "Il difficile regno di Lobengula", "paragraphs" = [
      "In seguito alla morte di Mzilikazi, avvenuta il 9 settembre 1868 nei pressi di Bulawayo, si accese una disputa tra le varie fazioni del popolo Ndebele, e solo dopo numerosi scontri, spesso anche violenti, i capi dei guerriglieri, offrirono la corona a Lobengula, che era il figlio di una moglie minore di Mzilikazi.",
      "Lobengula, che le cronache dei visitatori europei del tempo descrivono come un uomo obeso a causa di una dieta ricca di birra di miglio e carne, fu un re meno severo del padre e, consapevole della superiorità militare dei bianchi, cercò di limitare i contatti con i coloni europei.",
      "Il suo regno fu segnato dalle lotte tra le fazioni interne del suo popolo e inoltre, la scoperta di importanti giacimenti minerali nei territori adiacenti e in particolare la scoperta dell'oro verso la fine degli anni 80 del XIX secolo nella vicina regione del Witwatersrand, fece sì che Lobengula fosse assalito da innumerevoli richieste di concessioni da parte di inglesi, portoghesi, tedeschi e afrikaner che avevano lo scopo di sottrarre il territorio al popolo Ndebele.",
    ] },
  { "title" = "La sottomissione del popolo Ndebele", "paragraphs" = [
      "Ben presto Lobengula capì di essere stato ingannato e di aver aperto la strada all'invasione britannica del suo territorio e pertanto, cercò di disconoscere la validità della Concessione Rudd e di ostacolare la colonizzazione da parte degli inglesi i quali, il 12 settembre del 1890, si insediarono in una località che fortificarono e battezzarono col nome di Salisbury, in onore dell'allora Primo Ministro britannico, e che oggi è conosciuta come Harare, ed è la capitale dello Zimbabwe.",
      "Nel novembre 1893, con il pretesto di punire una delle frequenti incursioni Ndebele contro gente appartenente al gruppo etnico degli Shona, stanziata nei pressi della colonia di Salisbury, forze britanniche della British South Africa Company (BSAC), una compagnia commerciale dotata di una sorta di esercito privato fondata nel 1889 da Cecil Rhodes, invasero il regno di Lobengula dando inizio alla cd. prima guerra matabele. Nel giro di poche settimane, grazie all'ausilio delle",
      "mitragliatrici Maxim, l'esercito della BSAC inflisse perdite devastanti all'esercito di Lobengula che era equipaggiato essenzialmente con assegai e vecchi fucili.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "Scouting on Two Continents, by Major Frederick Russell Burnham, D.S.O. LC call number: DT775 .B8 1926. (1926)",
      "The Downfall of Lobengula - The Cause, History & Effect of the Matabeli War by W A Wills and L T Collingridge, (1894)",
      "The Zulus and Matabele, Warrior Nations, by Glen Lyndon Dodds, (Arms and Armour Press, 1998)",
    ] },
]

[articles.ru]
text = "Лобенгула (ок. 1836 или 1845 — возможно, январь 1894) — второй и последний инкоси (вождь, верховный лидер) народа матабеле в южной части Африки, сын инкоси Мзиликази."
title = "Лобенгула"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9B%D0%BE%D0%B1%D0%B5%D0%BD%D0%B3%D1%83%D0%BB%D0%B0"
intro = [
  "Лобенгула (ок. 1836 или 1845 — возможно, январь 1894) — второй и последний инкоси (вождь, верховный лидер) народа матабеле в южной части Африки, сын инкоси Мзиликази. Правил в 1870—1894 годах, будучи последним независимым правителем крупного государства на юге континента.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "Лобенгула взошёл на престол через два года после смерти своего отца. Он пришёл к власти в результате двухлетней гражданской войны с силами своего брата Мангване, причём он лично участвовал в сражениях, чем завоевал расположение ряда военачальников. Его торжественная коронация состоялась в 1870 году в Мланландлеле. В 1872 году с помощью британцев из Наталя он отразил вторжение войск изгнанного Мангване. В 1880-х годах пытался, используя противоречия между британцами, немцами, португальцами и бурами из Трансвааля, дипломатическим путём остановить европейскую экспансию на территориях между Замбези и Лимпопо, не придав, тем не менее, большого значения открытию залежей золота в Витватерсранде в 1886 году. В феврале 1888 года был вынужден подписать договор о «дружбе» с Великобританией, а в октябре того же года — договор о концессии полезных ископаемых его страны с посланцами Сесиля Родса, с которым он был лично знаком. Сыграл свою роль и врач, лечивший Лобенгулу от подагры.",
      "Эти договоры фактически сделали страну ндебеле протекторатом Великобритании, но в 1889 году Лобенгула, осознав, что был обманут, отказался предоставить доступ британцам в ряд районов его государства, а в 1890 году его войска совершили рейд в британский Машоналенд. В ноябре 1893 года Великобритания силами Британской Южно-Африканской компании вторглась в страну ндебеле, объявив причиной войны угрозу со стороны армии Лобенгулы. Британские солдаты активно применяли пулемёт Максима, что привело к большим потерям среди воинов ндебеле.",
      "Доподлинно неизвестно, какая судьба постигла Лобенгулу: по некоторым источникам, уже в декабре 1893 года он был серьёзно болен (возможно, оспой или дизентерией) и умер в январе 1894 года, но информация о его смерти держалась в секрете на протяжении нескольких месяцев. По другой информации, ему удалось бежать через Замбези к дружественным племенам, ещё не подвергшимся колонизации. Известно лишь то, что он отдал приказ сжечь свою столицу, Булавайо, сумел разбить британский отряд, отправленный на его поимку, и двинулся в направлении Замбези. Его формальным преемником стал его сын Наяманда, возглавивший крупное восстание против англичан в 1896 году, которое было подавлено в октябре 1897 года с помощью регулярных войск.",
    ] },
  { "title" = "Личность", "paragraphs" = [
      "Согласно сохранившимся описаниям, Лобенгула был высокого роста и мощного телосложения, весил около 120 килограммов, питался в основном говядиной и просяным пивом. У него было более 20 жён. В начале своего правления он, как сообщается, охотно принимал европейцев, но впоследствии перестал доверять им, особенно узнав о мощи огнестрельного оружия. При этом он был терпим к белым охотникам, заходившим в его владения, но находился в состоянии войны с большинством других африканских племён, окружавших его страну.",
      "Высказывания: «Англия — хамелеон, а я муха», о миссионерах: «Наверное, они верят искренне. Но ведь им и платят, чтобы они так говорили», «Подлинное имя моего народа — зулусы», «разве можно купить народ за какую-либо цену».",
    ] },
  { "title" = "В культуре", "paragraphs" = [
      "В Южной Африке популярна легенда о кладе Лобенгулы. Она нашла отражение в фильме «Шерлок Холмс и происшествие у водопада Виктория», романе Александра Косарева «Глаз Лобенгулы», Уилбура Смита «Леопард охотится в темноте».",
      "Лобенгула являлся персонажем романа Райдера Хаггарда «Бенита» (1906) о кладе в заброшенной португальской крепости на территории племени матабеле.",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Лобенгула // Куна — Ломами. — М. : Советская энциклопедия, 1973. — (Большая советская энциклопедия : [в 30 т.] / гл. ред. А. М. Прохоров ; 1969—1978, т. 14).",
      "Давидсон А. Б. Матабеле и машона в борьбе против английской колонизации. 1888—1897 / Институт востоковедения АН СССР. — М.: Изд-во вост. лит., 1958. — 184 с.",
      "Давидсон А. Б. Лобенгула // История Африки в биографиях / Под общ. ред. акад. РАН А. Б. Давидсона; Российский государственный гуманитарный университет, Институт всеобщей истории РАН. — М.: РГГУ, 2012. — С. 154-166. — 1120 с. — 500 экз. — ISBN 978-5-7281-1358-4.",
    ] },
]

[articles.pt]
text = "Lobengula Cumalo (1845-1894) foi o segundo e último rei do Reino Mutuacazi, a entidade política dos matabeles (ou andebeles setentrionais). Os matabeles/andebeles, liderados por Lobengula, eram conhecidos em língua andebele setentrional como \"os homens de escudos longos\" — uma referência ao uso do escudo e da azagaia pelos guerreiros."
title = "Lobengula"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Lobengula"
intro = [
  "Lobengula Cumalo (1845-1894) foi o segundo e último rei do Reino Mutuacazi, a entidade política dos matabeles (ou andebeles setentrionais).",
  "Os matabeles/andebeles, liderados por Lobengula, eram conhecidos em língua andebele setentrional como \"os homens de escudos longos\" — uma referência ao uso do escudo e da azagaia pelos guerreiros.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "A formação do povo matabele está relacionada à formação dos povos zulus. Os matabeles fugiram para o norte durante o reinado de Shaka Zulu após a Mfecane (\"esmagamento\" ou \"a dispersão\"). O general Mzilikazi do clã cumalo dos zulus levou seus seguidores para longe do território do Reino Zulu depois de um desentendimento. Na década de 1830 se estabeleceram na fronteira do que hoje é chamado Matabelelândia, no oeste do Zimbábue, embora afirmando a soberania de uma área muito maior.",
      "O Reino Mutuacazi (também chamado de Reino Matabele ou Reino Andebele-Mthwakazi), formado como a entidade política dos povos matabeles, era uma sociedade da Idade do Ferro no qual os membros tinham uma posição privilegiada contra estrangeiros, cujas vidas estavam sujeitas à vontade do rei. Em troca de seus privilégios, no entanto, os homens e mulheres matabeles tiveram que se submeter a uma rígida disciplina e hierarquia dentro desta sociedade, com funções e responsabilidades rigorosamente estabelecidas. A violação de qualquer responsabilidade social era punidas com a morte, com o indulto raramente agraciado pelo rei. Esta disciplina rigorosa e a lealdade garantia aos matabeles o domínio sobre seus vizinhos.",
      "Após a morte de Mzilikazi, o primeiro rei do Reino Mutuacazi, em 1868, o izinduna, ou conselho dos chefes, ofereceu a coroa a Lobengula, um dos filhos do Mzilikazi. Vários impis (regimentos) contestaram a decisão em favor de Lobengula e a questão acabou por ser decidida em uma conflito civil, com Lobengula e seus impis leais esmagando os impis rebeldes. A coragem de Lobengula nesta batalha levou a ser considerado, de forma unânime, como rei.",
    ] },
  { "title" = "Descendência", "paragraphs" = [
      "Nguboyenja, que foi enviado à Cidade do Cabo depois da morte de Lobengula e enterrado em Entumbane perto de Mzilikazi, seu avô;",
      "Sidojiwa nascido em Nsindeni 1888 que morreu em 13 de julho de 1960 (enterrado no Entumbane perto Mzilikazi), e;",
    ] },
]

