[articles.en]
title = "Matoaka"
lang = "en"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka was a Powhatan woman and the daughter of the leader English colonists called Powhatan. She grew up in Tsenacomoco, a network of Indigenous communities across the Tidewater region of present-day Virginia. Most surviving accounts of her early life were written by colonists, so dates and some details remain uncertain. Jamestown was founded in 1607 within the Powhatan world. Early relations with newcomers included exchange and diplomacy, then grew more strained as English settlement expanded. Her story belongs to the history of Powhatan communities and their efforts to protect their land and political independence.",
  "In 1613, English captain Samuel Argall seized Matoaka and held her at Henricus. During captivity she was baptized Rebecca and married John Rolfe in 1614. The marriage helped create a period of peace between the Powhatan and English, although it took place under colonial pressure and unequal power. The Rolfes traveled to England in 1616. Matoaka died at Gravesend in 1617, before her planned return to Virginia. Her life connects family history, diplomacy, religious change and the early colonial period. Most surviving written accounts were produced by English colonists and show only part of the experience and perspectives of the Powhatan people.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.fr]
title = "Matoaka"
lang = "fr"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka était une femme powhatanne, fille du chef que les colons anglais appelaient Powhatan. Elle a grandi dans Tsenacomoco, un réseau de communautés autochtones de la région côtière de la Virginie actuelle. Les récits conservés de sa jeunesse ont surtout été écrits par des colons, ce qui rend certaines dates et certains détails incertains. En 1607, les Anglais établissent Jamestown au cœur du monde powhatan. Les premiers rapports entre les communautés comprennent des échanges et des négociations, puis les tensions s’aggravent avec l’expansion coloniale. Ces événements s’inscrivent dans l’histoire des peuples powhatans et dans la défense de leurs terres et de leur autonomie.",
  "En 1613, le capitaine anglais Samuel Argall capture Matoaka et la retient à Henricus. Pendant sa captivité, elle est baptisée Rebecca et épouse John Rolfe en 1614. Cette union contribue à une période de paix entre Powhatans et Anglais, mais elle intervient sous la contrainte et dans un contexte de domination coloniale. La famille Rolfe part pour l’Angleterre en 1616. Matoaka meurt à Gravesend en 1617, avant le retour prévu en Virginie. Son parcours relie l’histoire familiale, la diplomatie et les premières décennies de la colonisation anglaise. Les sources conservées donnent surtout le point de vue des nouveaux arrivants et ne rendent qu’une partie de l’expérience des communautés autochtones.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.de]
title = "Matoaka"
lang = "de"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka war eine Powhatan-Frau und die Tochter des Anführers, den englische Kolonisten Powhatan nannten. Sie wuchs in Tsenacomoco auf, einem Netzwerk indigener Gemeinschaften in der Tidewater-Region des heutigen Virginia. Die überlieferten Berichte über ihre frühen Jahre stammen überwiegend von Kolonisten; deshalb bleiben Datierungen und Einzelheiten unsicher. 1607 gründeten die Engländer Jamestown im Gebiet der Powhatan. Die ersten Kontakte umfassten Handel und Diplomatie, doch mit der Ausweitung der englischen Siedlung nahmen die Spannungen zu. Diese Geschichte gehört zur Geschichte der Powhatan-Gemeinschaften und zu ihrem Einsatz für Land und politische Selbstbestimmung.",
  "1613 nahm der englische Kapitän Samuel Argall Matoaka gefangen und hielt sie in Henricus fest. Während ihrer Gefangenschaft wurde sie auf den Namen Rebecca getauft und heiratete 1614 John Rolfe. Die Ehe trug zu einer Zeit des Friedens zwischen Powhatan und Engländern bei, entstand jedoch unter kolonialem Druck und ungleichen Machtverhältnissen. 1616 reiste die Familie Rolfe nach England. Matoaka starb 1617 in Gravesend, bevor die geplante Rückkehr nach Virginia stattfinden konnte. Ihr Leben verbindet Familiengeschichte, Diplomatie, religiösen Wandel und die frühe Kolonialzeit. Die meisten erhaltenen schriftlichen Quellen wurden von Engländern verfasst und zeigen daher nur einen Teil der Erfahrungen und Sichtweisen der Powhatan.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.it]
title = "Matoaka"
lang = "it"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka era una donna powhatan e figlia del capo che i coloni inglesi chiamavano Powhatan. Crebbe a Tsenacomoco, una rete di comunità indigene nella regione costiera della Virginia odierna. Le testimonianze conservate sulla sua giovinezza furono scritte soprattutto da coloni, quindi date e particolari restano incerti. Nel 1607 gli inglesi fondarono Jamestown nel territorio powhatan. I primi rapporti tra le comunità comprendevano scambi e diplomazia, ma le tensioni aumentarono con l’espansione degli insediamenti inglesi. La sua storia va collocata nella vicenda dei popoli powhatan e nella difesa delle loro terre e della loro autonomia politica.",
  "Nel 1613 il capitano inglese Samuel Argall catturò Matoaka e la trattenne a Henricus. Durante la prigionia fu battezzata con il nome Rebecca e nel 1614 sposò John Rolfe. Il matrimonio contribuì a un periodo di pace tra Powhatan e inglesi, ma avvenne in un contesto di pressione coloniale e di potere diseguale. Nel 1616 la famiglia Rolfe si recò in Inghilterra. Matoaka morì a Gravesend nel 1617, prima del ritorno previsto in Virginia. La sua vita intreccia storia familiare, diplomazia, cambiamento religioso e primi anni della colonizzazione inglese. Le fonti scritte rimaste provengono in gran parte dai coloni e non restituiscono tutte le prospettive delle comunità indigene.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.zh]
title = "Matoaka"
lang = "zh"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka 是一位波瓦坦女性，也是英国殖民者称作 Powhatan 的领袖之女。她成长于 Tsenacomoco，这是由多个原住民社群组成、覆盖今弗吉尼亚潮水地区的政治网络。关于她童年的记录主要由殖民者留下，因此出生年份和部分细节仍无法确定。1607 年，英国人在波瓦坦人的家园中建立詹姆斯敦定居点。早期交往包括贸易、外交和相互协商；随着英国殖民活动扩大，关系逐渐紧张。理解这些事件，需要看到波瓦坦社群努力守护家园与政治自主的历史背景。",
  "1613 年，英国船长塞缪尔·阿盖尔将 Matoaka 劫持并拘留在亨里克斯。被拘留期间，她受洗并取名 Rebecca，随后于 1614 年与 John Rolfe 结婚。这段婚姻促成波瓦坦人与英国人之间一段相对和平的时期，但它发生在殖民压力和权力不平等的环境中。1616 年，Rolfe 一家前往英格兰；Matoaka 于 1617 年在格雷夫森德去世，当时他们正计划返回弗吉尼亚。她的经历同时涉及家庭、外交、宗教转变与殖民权力。现存文字大多由英国殖民者写成，无法完整呈现波瓦坦社群的观点与生活。",
  "波瓦坦联盟由许多地方社群和首领共同维系，不能简单等同于欧洲式的单一王国。詹姆斯敦的粮食供应、安全和贸易都与周围原住民社会相连。随着殖民扩张，土地占有和冲突不断改变双方关系。Matoaka 的经历处在这些更大的政治关系之中，也受到她的家族身份与殖民政策影响。理解她的历史位置，需要把殖民者留下的文字放回波瓦坦人的处境、决策和长期影响之中。此外，定居点扩张改变了协商条件；阅读殖民档案时，也应考虑原住民社区的处境与选择。",
  "波瓦坦人的政治生活建立在多个地方社群及其领导者之间的关系上。英国人的书面材料通常记录他们自身的目标，不能代表所有原住民的声音。Matoaka 的生平因此也呈现了殖民扩张时期外交、家庭关系和权力变化交织的处境。",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.ja]
title = "Matoaka"
lang = "ja"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoakaはポウハタンの女性で、イングランド人入植者がポウハタンと呼んだ指導者の娘でした。彼女は、現在のバージニア州沿岸部に広がる先住民共同体のネットワーク、ツェナコマカで育ちました。幼少期について残る記録の多くは入植者が書いたもので、年代や細部には不確かな点があります。1607年、イングランド人はポウハタンの人々の居住地にジェームズタウンを築きました。当初の交流には交易や外交がありましたが、入植地の拡大とともに緊張が高まりました。彼女の歩みは、土地と政治的自立を守ろうとしたポウハタンの人々の歴史の中で理解する必要があります。",
  "1613年、イングランド人船長サミュエル・アーガルはMatoakaを捕らえ、ヘンリカスに拘束しました。拘束中に彼女は洗礼を受けてRebeccaという名を与えられ、1614年にジョン・ロルフと結婚しました。この結婚はポウハタンの人々とイングランド人の間に一時的な平和をもたらしましたが、植民地支配の圧力と力の不均衡の中で行われました。ロルフ一家は1616年にイングランドへ渡り、Matoakaは予定されていたバージニア帰還を前に、1617年にグレーヴズエンドで亡くなりました。彼女の生涯には家族、外交、宗教の変化、植民地化の影響が重なっています。",
  "ポウハタンの政治社会は複数の地域共同体や指導者によって成り立ち、ヨーロッパの王国と同じ形ではありませんでした。ジェームズタウンの食料や安全も周辺の人々との関係に左右され、植民地の拡大は土地と交渉の条件を変えていきました。残された記録は主として入植者の視点で作られているため、Matoakaの行動を理解する際には、家族の役割だけでなく、共同体の意思や権力の非対称性も考える必要があります。",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.ko]
title = "Matoaka"
lang = "ko"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka는 포우하탄 여성으로, 영국 정착민들이 포우하탄이라고 부른 지도자의 딸이었습니다. 그녀는 오늘날 버지니아 해안 지역에 걸쳐 있던 여러 원주민 공동체의 네트워크인 츠나코마카에서 자랐습니다. 어린 시절에 관한 기록은 대부분 정착민이 남겼기 때문에 연도와 세부 사항은 확실하지 않습니다. 1607년 영국인들은 포우하탄 사람들의 땅에 제임스타운을 세웠습니다. 초기 관계에는 교역과 외교가 있었지만 영국 정착지가 확장되면서 긴장이 커졌습니다. 그녀의 삶은 포우하탄 공동체가 땅과 정치적 자율성을 지키려 했던 역사 속에서 살펴야 합니다.",
  "1613년 영국 선장 새뮤얼 아걸은 Matoaka를 붙잡아 헨리커스에 억류했습니다. 억류 중 그녀는 세례를 받고 Rebecca라는 이름을 받았으며, 1614년 John Rolfe와 결혼했습니다. 이 결혼은 포우하탄 사람들과 영국인 사이에 한동안 평화를 가져왔지만, 식민지의 압력과 불평등한 권력 관계 속에서 이루어졌습니다. 1616년 Rolfe 가족은 영국으로 갔고, Matoaka는 버지니아로 돌아갈 계획을 세우던 중 1617년 그레이브젠드에서 사망했습니다. 그녀의 삶에는 가족사, 외교, 종교적 변화와 초기 식민지화가 함께 얽혀 있습니다.",
  "포우하탄 연합은 여러 공동체와 지도자 사이의 관계로 유지되었으며, 유럽 국가와 같은 단일 체제로 볼 수 없습니다. 제임스타운의 식량과 안전은 주변 원주민 사회와의 관계에 영향을 받았고, 영국 정착지가 넓어지면서 토지와 협상의 조건도 달라졌습니다. 남은 기록은 주로 정착민의 관점에서 쓰였으므로 Matoaka의 삶을 이해할 때 가족사뿐 아니라 공동체의 선택과 권력의 불균형도 함께 살펴야 합니다.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.ar]
title = "Matoaka"
lang = "ar"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "كانت Matoaka امرأة من شعب البوهاتان وابنة القائد الذي أطلق عليه المستعمرون الإنجليز اسم Powhatan. نشأت في تسيناكوموكا، وهي شبكة من مجتمعات السكان الأصليين في منطقة تايدووتر بولاية فرجينيا الحالية. كُتبت معظم الروايات الباقية عن سنواتها الأولى بأقلام المستعمرين، لذلك لا تزال بعض التواريخ والتفاصيل غير مؤكدة. أُنشئت مستوطنة جيمستاون الإنجليزية عام 1607 داخل موطن البوهاتان. شملت الاتصالات المبكرة التبادل التجاري والدبلوماسية، ثم تصاعد التوتر مع توسع الاستيطان الإنجليزي. ينبغي فهم هذه الأحداث ضمن تاريخ مجتمعات البوهاتان وسعيها إلى حماية أرضها واستقلالها السياسي.",
  "في عام 1613 أسر القبطان الإنجليزي صموئيل أرغال Matoaka واحتجزها في هينريكوس. وخلال احتجازها عُمّدت باسم Rebecca، ثم تزوجت John Rolfe عام 1614. ساهم الزواج في فترة من السلام بين البوهاتان والإنجليز، لكنه جرى في ظل ضغط استعماري واختلال واضح في ميزان القوة. سافرت عائلة Rolfe إلى إنجلترا عام 1616. توفيت Matoaka في غريفزند عام 1617 قبل عودتها المقررة إلى فرجينيا. تجمع حياتها بين تاريخ الأسرة والدبلوماسية والتحول الديني وبدايات الاستعمار الإنجليزي. كتب المستعمرون معظم السجلات التي بقيت، ولذلك لا تعرض إلا جزءاً من تجارب مجتمعات السكان الأصليين ووجهات نظرهم.",
  "كان اتحاد البوهاتان شبكة من مجتمعات محلية وقادة، وليس دولة موحدة على النمط الأوروبي. واعتمدت جيمستاون في بدايتها على علاقاتها مع السكان الأصليين في الغذاء والأمن والتبادل. ومع توسع الاستيطان تغيرت شروط التفاوض والسيطرة على الأرض. ولأن معظم الوثائق الباقية كتبها المستعمرون، فمن المهم قراءة حياة Matoaka ضمن قرارات مجتمعها واختلال موازين القوة، لا باعتبارها حكاية فردية منفصلة عن تاريخ شعبها.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.ru]
title = "Matoaka"
lang = "ru"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka была женщиной из народа поухатанов и дочерью вождя, которого английские колонисты называли Powhatan. Она выросла в Ценакомаке — сети коренных общин в прибрежной области современного штата Виргиния. Сохранившиеся сведения о её ранней жизни в основном записали колонисты, поэтому даты и отдельные подробности остаются спорными. В 1607 году англичане основали Джеймстаун на землях поухатанов. Первые отношения включали обмен и дипломатические переговоры, однако по мере расширения английских поселений напряжённость усиливалась. Эту историю следует рассматривать в контексте жизни общин поухатанов и их стремления сохранить землю и политическую самостоятельность.",
  "В 1613 году английский капитан Сэмюэл Аргалл захватил Matoaka и удерживал её в Хенрикусе. Во время плена её крестили под именем Rebecca, а в 1614 году она вышла замуж за John Rolfe. Брак способствовал периоду мира между поухатами и англичанами, но был заключён под давлением колонистов и при неравном соотношении сил. В 1616 году семья Rolfe отправилась в Англию. Matoaka умерла в Грейвзенде в 1617 году, до запланированного возвращения в Виргинию. Её жизнь связана с семейной историей, дипломатией, религиозными переменами и ранним этапом английской колонизации.",
  "Сохранившиеся письменные свидетельства создали преимущественно английские колонисты, поэтому они отражают лишь часть опыта коренных общин. Союз поухатанов складывался из множества местных сообществ и отношений между лидерами, а не был простой копией европейского государства. Расширение Джеймстауна меняло доступ к земле, продовольствию и условиям переговоров. Поэтому историю Matoaka важно связывать с решениями её народа и с неравенством сил, в котором происходили контакты с англичанами.",
]
sections = []
shortArticle = true
sources = [
  { title = "Powhatan (U.S. National Park Service)", url = "https://www.nps.gov/people/powhatan.htm" },
  { title = "Powhatan People and the English at Jamestown (DPLA)", url = "https://www.dp.la/primary-source-sets/powhatan-people-and-the-english-at-jamestown" },
]

[articles.vi]
title = "Matoaka"
lang = "vi"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka là một phụ nữ Powhatan, con gái của vị thủ lĩnh mà người Anh gọi là Powhatan. Bà lớn lên ở Tsenacomoco, mạng lưới các cộng đồng bản địa trải rộng khắp vùng Tidewater thuộc Virginia ngày nay. Những ghi chép còn lại về thời niên thiếu của bà phần lớn do người thuộc địa viết, vì vậy ngày tháng và một số chi tiết vẫn chưa chắc chắn. Năm 1607, người Anh lập khu định cư Jamestown ngay trong vùng đất của người Powhatan. Quan hệ ban đầu có trao đổi và ngoại giao, nhưng căng thẳng tăng lên khi khu định cư Anh mở rộng. Câu chuyện của bà cần được đặt trong lịch sử các cộng đồng Powhatan và nỗ lực bảo vệ đất đai, quyền tự chủ của họ.",
  "Năm 1613, thuyền trưởng Anh Samuel Argall bắt Matoaka và giam bà tại Henricus. Trong thời gian bị giam, bà được rửa tội với tên Rebecca và kết hôn với John Rolfe vào năm 1614. Cuộc hôn nhân góp phần tạo nên một thời kỳ hòa bình giữa người Powhatan và người Anh, nhưng diễn ra dưới áp lực thuộc địa và trong quan hệ quyền lực bất bình đẳng. Năm 1616, gia đình Rolfe sang Anh. Matoaka qua đời tại Gravesend năm 1617, trước chuyến trở về Virginia dự định. Cuộc đời bà gắn với lịch sử gia đình, ngoại giao, biến đổi tôn giáo và giai đoạn đầu của quá trình thuộc địa hóa.",
  "Các ghi chép còn lại phần lớn do người Anh tạo ra nên chỉ phản ánh một phần trải nghiệm của các cộng đồng bản địa. Liên minh Powhatan được duy trì qua nhiều cộng đồng địa phương và mối quan hệ giữa các thủ lĩnh, không giống một quốc gia tập quyền ở châu Âu. Jamestown mở rộng đã làm thay đổi quyền tiếp cận đất đai, lương thực và điều kiện thương lượng. Vì vậy, cần đặt cuộc đời Matoaka trong lựa chọn của cộng đồng bà và sự bất cân xứng quyền lực thời đó.",
]
