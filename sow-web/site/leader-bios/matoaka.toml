[articles.pt]
title = "Matoaka"
lang = "pt"
url = "https://www.nps.gov/people/powhatan.htm"
intro = [
  "Matoaka era uma mulher powhatan e filha do líder que os colonos ingleses chamavam de Powhatan. Ela cresceu em Tsenacomoco, uma rede de comunidades indígenas na região de Tidewater, na atual Virgínia. Os relatos preservados sobre sua juventude foram escritos principalmente por colonos, por isso algumas datas e detalhes continuam incertos. Em 1607, os ingleses fundaram Jamestown dentro do território powhatan. Os primeiros contatos envolveram trocas e diplomacia, mas as tensões aumentaram à medida que a colonização inglesa avançou. Sua trajetória faz parte da história dos povos powhatan e de sua defesa da terra e da autonomia política.",
  "Em 1613, o capitão inglês Samuel Argall capturou Matoaka e a manteve em Henricus. Durante o cativeiro, ela foi batizada com o nome Rebecca e se casou com John Rolfe em 1614. A união contribuiu para um período de paz entre powhatans e ingleses, embora tenha ocorrido sob pressão colonial e em condições de poder desigual. Em 1616, a família Rolfe viajou para a Inglaterra. Matoaka morreu em Gravesend em 1617, antes do retorno planejado à Virgínia. Sua vida reúne história familiar, diplomacia, mudança religiosa e os primeiros anos da colonização inglesa. A maior parte dos registros escritos foi produzida por colonos e mostra apenas uma parte das experiências e perspectivas indígenas.",
]
