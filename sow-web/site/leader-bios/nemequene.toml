[articles.en]
text = "Nemequene or Nemeguene was the third ruler (zipa) of Bacatá as of 1490. His zaque counterpart ruling over the northern area of the Muisca territory was Quemuenchatocha."
title = "Nemequene"
lang = "en"
url = "https://en.wikipedia.org/wiki/Nemequene"
intro = [
  "Nemequene or Nemeguene (died 1514) was the third ruler (zipa) of Bacatá as of 1490. His zaque counterpart ruling over the northern area of the Muisca territory was Quemuenchatocha.",
]
sections = [
  { "title" = "Etymology", "paragraphs" = [
      "Nemequene in the Chibcha language of the Muisca has two possible meanings, derived from the words nymy, \"jaguar\" and quyne, meaning either \"bone\" or \"force\".",
    ] },
  { "title" = "Biography", "paragraphs" = [
      "Nemequene succeeded to the throne of the southern Muisca in 1490 after the death of his predecessor Saguamanchica in the Battle of Chocontá where the zaque of the northern Muisca Michuá had also died. While Nemequene wanted to continue the attacks against the northern Muisca, he had to face the dangers of the Panche to the west of his territory. Nemequene installed his nephew and legal successor Tisquesusa as army general to fight off the Panche with success.",
      "Looking to expand the territory of the southern Muisca, Nemequene succeeded in the conquest of other areas in the central highlands of Colombia; the zipa defeated the cacique of Guatavita and submitted the cacicazgos of Ubaque, Ubaté, Susa, and Fúquene to his rule.",
      "At the end of his reign, Nemequene took up arms against the northern Muisca again, with Tisquesusa and his brother Sagipa as army commanders. Zaque Quemuenchatocha gained support of the caciques of Gámeza, Iraca, Tundama, and Sáchica. The battle of the Arroyo de las Vueltas that followed lasted for half a day and just when Nemequene was about to claim victory, he was hit by an arrow by one of the guecha warriors of the northern Muisca and died five days later of his wounds. Sagipa, the later successor of Tisquesusa and last zipa of the Muisca ordered retreat. Tisquesusa succeeded his uncle as ruler of the southern Muisca until the arrival of the Spanish conquistadors led by Gonzalo Jiménez de Quesada.",
    ] },
  { "title" = "Trivia", "paragraphs" = [
      "Nemocón, the second most important salt mining settlement of the Muisca, is named after Nemequene",
    ] },
]

[articles.es]
text = "Nemequene († 1514), también llamado Nymyquyne, o Nemeguene, fue un Zipa de Bacatá que gobernó durante veinticuatro años, desde 1490 hasta su muerte, en 1514. Fue considerado como el mayor legislador de los muiscas, después de Bochica y Nompanen."
title = "Nemequene"
lang = "es"
url = "https://es.wikipedia.org/wiki/Nemequene"
intro = [
  "Nemequene († 1514), también llamado Nymyquyne, o Nemeguene, fue un Zipa de Bacatá que gobernó durante veinticuatro años, desde 1490 hasta su muerte, en 1514. Fue considerado como el mayor legislador de los muiscas, después de Bochica y Nompanen. Creó una norma legal, conocida como el Código de Nemequene, cuyas leyes estuvieron vigentes incluso hasta algún tiempo después de la conquista española.",
  "Durante su reinado se consolidaron las fronteras del Zipazgo, sometiendo para ello a los múltiples rivales internos.",
]
sections = [
  { "title" = "Etimología del nombre", "paragraphs" = [
      "1. «Hueso de jaguar», interpretado erróneamente por los españoles como \"hueso de león\".",
      "Se trata de una palabra compuesta por dos vocablos: nymy (jaguar, o gato montés)​ y quyne (hueso o fuerza).​",
      "Como la vocal \"y\" era pronunciada por los muiscas de manera intermedia entre la \"e\" y la \"i\", pero más cercana a la \"e\",​ ha perdurado la grafía \"e\" en la escritura de la palabra, como Nemequene, en vez de Nymyquyne.",
    ] },
  { "title" = "Ascenso al trono", "paragraphs" = [
      "En 1490 murieron el Zipa Saguamanchica y el Zaque Michuá en la Batalla de Chocontá. El sucesor de Saguamanchica fue su sobrino, el general de los ejércitos del Zipazgo, Nemequene, quien, recién entronizado, convocó a un concejo de Uzaques (nobles de sangre pura), para nombrar a su sobrino, Tisquesusa, como príncipe heredero y general de los ejércitos. Nemequene confió a Tisquesusa el mando de cuarenta mil güechas (guerreros muiscas), con la misión de someter a los sutagaos, que al enterarse de la muerte de Saguamanchica se habían sublevado con el ánimo de recuperar su independencia y liberarse del yugo del Zipazgo. Encomendada esta misión, Nemequene se ocupó de reunir otro ejército para hacer frente a nuevas invasiones de los panches, quienes también se habían sublevado al enterarse de la muerte de Saguamanchica.",
    ] },
  { "title" = "Pacificación del Zipazgo", "paragraphs" = [
      "El Cacique de Zipaquirá, alentado por los de Guatavita y Ubaté, decidió aprovechar las difíciles condiciones del comienzo del reinado de Nemequene para declararle la guerra al nuevo Zipa. Entre tanto Nemequene, enterado de la rebelión, decidió adelantarse a su enemigo y salirle al encuentro, al mando de dieciséis mil güechas. Los dos ejércitos se encontraron entre Chía y Cajicá, donde las tropas de Bacatá vencieron a las de Zipaquirá. De inmediato Nemequene regresó a Funza, capital del Zipazgo, donde entró al tiempo con Tisquesusa, quien volvía triunfante luego de haber vencido y sometido a los sutagaos.",
      "El príncipe heredero, Tisquesusa, había partido al mando de cuarenta mil güechas, con los que marchó por entre la senda de Tibacuy y Pasca para atacar a los sutagaos, mientras, en otro frente, los enviados de Nemequene fortificaban y guarnicionaban las fronteras con los panches. El Cacique de Fusagasugá, al enterarse de la cercanía de Tisquesusa, intentó huir, dejando a su ejército desorganizado. Sin embargo, Tisquesusa lo capturó y lo ejecutó en el acto. Luego, dejó en Tibacuy una guarnición de güechas y partió para Bacatá con un inmenso botín.​",
      "Ante las continuas rebeliones de Guatavita, que se remontaban al reinado de Saguamanchica, Nemequene ideó una estratagema para lograr un sometimiento definitivo de ese rival.",
    ] },
  { "title" = "El Código de Nemequene", "paragraphs" = [
      "Una vez estuvo consolidada la paz dentro del Zipazgo, y a fin de establecer leyes permanentes al interior de sus dominios, Nemequene creó un Concejo Supremo, dirigido por el Cacique de Suba, ante cuyas decisiones no habría posibilidad de apelación. Dicho Concejo estaba encargado de hacer cumplir las leyes dictadas por Nemequene en su código de justicia.",
      "Pena de muerte contra el homicida, aunque le perdonasen la mujer, los padres y los parientes de la víctima, pues solo Chiminigagua, quien daba la vida, podía perdonar al que la quitaba.",
      "Pena de muerte para el hombre soltero que violase a una mujer. En caso de que el hombre fuera casado, se le permitiría a dos hombres solteros dormir con su esposa, pues esta deshonra era considerada por los muiscas aun peor que la muerte.",
    ] },
]

[articles.ru]
text = "Немекене (Nemequene) († 1514), также известный как Нымыкуйне или Немегуене, был сипой Бакаты, правившим в течение двадцати четырёх лет — с 1490 года до своей смерти в 1514 году. Считался крупнейшим законодателем народа муисков после Бочики и Номпанена."
title = "Немекене"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%BC%D0%B5%D0%BA%D0%B5%D0%BD%D0%B5"
intro = [
  "Немекене (Nemequene) († 1514), также известный как Нымыкуйне или Немегуене, был сипой Бакаты, правившим в течение двадцати четырёх лет — с 1490 года до своей смерти в 1514 году. Считался крупнейшим законодателем народа муисков после Бочики и Номпанена. Он создал правовую норму, известную как Кодекс Немекене, законы которого оставались в силе ещё некоторое время после испанского завоевания.",
  "Во время его правления были укреплены границы Сипатства за счёт подчинения многочисленных внутренних соперников.",
]
sections = [
  { "title" = "Этимология имени", "paragraphs" = [
      "Это составное слово из двух корней: nymy (ягуар или дикий кот) и quyne (кость или сила).",
      "Поскольку гласная «y» произносилась муисками как звук, промежуточный между «е» и «и» (ближе к «е»), в письменной традиции закрепилась форма «Немекене», а не «Нымыкуйне».",
    ] },
  { "title" = "Восхождение на престол", "paragraphs" = [
      "В 1490 году в битве при Чоконте погибли сипа Сагуаманчика и заке Мичуа. Преемником Сагуаманчики стал его племянник — главнокомандующий войсками Сипатства Немекене. Сразу после восшествия на престол он созвал совет узаков (знати «чистой крови»), чтобы назначить своего племянника Тискесусу наследным принцем и главнокомандующим. Немекене доверил Тискесусе командование сорока тысячами гуэча (воинов‑муисков) с задачей подчинить народ сутагао, который, узнав о смерти Сагуаманчики, поднял восстание, стремясь вернуть независимость и освободиться от власти Сипатства. Выполнив эту задачу, Немекене занялся формированием другого войска для отражения новых вторжений народа панчес, также восставшего после известия о смерти Сагуаманчики.",
    ] },
  { "title" = "Умиротворение Сипатства", "paragraphs" = [
      "Вождь Сипакиры, подстрекаемый вождями из Гуатавиты и Убате, решил воспользоваться трудным положением в начале правления Немекене и объявить войну новому сипе. Узнав о восстании, Немекене решил опередить врага и выступил ему навстречу во главе шестнадцати тысяч гуэча. Армии встретились между Чиа и Кахикой, где войска Бакаты разбили силы Сипакиры. Немекене немедленно вернулся в Фунсу, столицу Сипатства, куда одновременно вошёл и Тискесуса, вернувшийся с победой после подчинения сутагао.",
      "Наследный принц Тискесуса выступил во главе сорока тысяч гуэча, двинувшись по дороге между Тибакуем и Паской, чтобы атаковать сутагао, в то время как посланники Немекене укрепляли и охраняли границы с панчес. Вождь Фусагасуги, узнав о приближении Тискесусы, попытался бежать, оставив войско в дезорганизованном состоянии. Однако Тискесуса захватил его и немедленно казнил. Затем он оставил гарнизон из гуэча в Тибакуе и отправился в Бакату с огромной добычей.",
      "Учитывая постоянные восстания в Гуатавите (восходящие ещё к правлению Сагуаманчики), Немекене разработал хитрый план окончательного подчинения этого соперника.",
    ] },
  { "title" = "Кодекс Немекене", "paragraphs" = [
      "После установления мира в Сипатстве Немекене учредил Верховный совет под руководством вождя Субы. Решения этого совета были окончательными и не подлежали обжалованию. Совет отвечал за исполнение законов, изложенных Немекене в его кодексе справедливости.",
      "Смертная казнь для убийцы, даже если жена, родители и родственники жертвы его прощали, поскольку только Чиминигагуа, дарующий жизнь, мог помиловать того, кто её отнял.",
      "Смертная казнь для холостого мужчины, изнасиловавшего женщину. Если мужчина был женат, двум холостым мужчинам разрешалось спать с его женой, поскольку муиски считали такое бесчестье хуже смерти.",
    ] },
]

