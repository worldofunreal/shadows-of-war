[articles.ru]
text = "Навуходоносор II правил Нововавилонским царством приблизительно с 605 по 562 год до н. э. Царские надписи и археологические находки свидетельствуют о работах, изменивших столицу. В городе строили дворцы, храмы, дороги для процессий, ворота и укрепления. В это же время велись походы в Леванте. Вавилонская хроника отмечает взятие Иерусалима в 597 году до н. э., а источники об этих войнах сообщают о переселении жителей Иудеи. Строительные надписи приписывают достижения царю, поэтому историки сопоставляют их с остатками построек и другими письменными свидетельствами. Глиняный цилиндр из собрания Метрополитен-музея рассказывает о сооружении новой внешней стены Вавилона. До этого центральную часть города уже защищали несколько стен. Укрепления документированы лучше, чем Висячие сады, местоположение и заказчик которых остаются предметом споров. «Двойные стены Вавилона» связывают развитие города с усилением защиты. Когда завершается улучшение города, самая низкоуровневая готовая башня игрока в радиусе 20 клеток бесплатно получает один уровень, но не выше четвёртого."
title = "Навуходоносор II"
lang = "ru"
url = "https://www.metmuseum.org/art/collection/search/321676"
