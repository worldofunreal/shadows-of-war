[articles.de]
text = "Nebukadnezar II. regierte das Neubabylonische Reich von etwa 605 bis 562 v. Chr. Königsinschriften und archäologische Funde belegen Bauvorhaben, die die Hauptstadt veränderten. Dazu zählten Paläste, Tempel, Prozessionsstraßen, Tore und Befestigungen. Zur Regierungszeit gehörten auch Feldzüge in der Levante. Eine babylonische Chronik verzeichnet die Eroberung Jerusalems im Jahr 597 v. Chr., und Berichte über diese Kriege beschreiben Deportationen aus Juda. Die Bauinschriften rühmen die Leistungen des Königs. Historiker vergleichen sie daher mit Ausgrabungsbefunden und anderen Schriftquellen. Ein Tonzylinder im Metropolitan Museum of Art dokumentiert den Bau einer neuen äußeren Stadtmauer. Der Stadtkern Babylons war bereits durch mehrere Mauern gesichert. Die Befestigungen sind sicherer belegt als die Hängenden Gärten, deren Standort und Auftraggeber umstritten sind. Babylons Doppelmauer greift im Spiel den Zusammenhang zwischen dem Ausbau der Stadt und dem Ausbau ihrer Verteidigung auf. Nach einem Stadtausbau steigt der eigene fertige Turm mit der niedrigsten Stufe im Umkreis von 20 Feldern kostenlos um eine Stufe, höchstens bis Stufe 4."
title = "Nebukadnezar II."
lang = "de"
url = "https://www.metmuseum.org/art/collection/search/321676"
