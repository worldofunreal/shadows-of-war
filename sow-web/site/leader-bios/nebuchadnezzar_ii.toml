[articles.fil]
text = "Pinamunuan ni Nebuchadnezzar II ang Imperyong Neo-Babilonyo mula bandang 605 hanggang 562 BK. Itinala sa mga inskripsiyong maharlika at mga natuklasang labi ang mga proyektong nagbago sa kabisera. Kabilang dito ang mga palasyo, templo, daanan ng prusisyon, tarangkahan, at tanggulan. Nagkaroon din ng mga kampanyang militar sa Levant. Nasa isang kronikang Babilonyo ang pagsakop sa Jerusalem noong 597 BK, at isinalaysay sa mga tala tungkol sa mga digmaan ang pagpapatapon sa mga taga-Juda. Itinanghal ng mga inskripsiyon ang mga ito bilang mga nagawa ng hari, kaya inihahambing ng mga historyador ang mga ito sa mga labi ng gusali at ibang tala. Itinala ng isang silindrong luwad sa Metropolitan Museum of Art ang pagtatayo ng bagong panlabas na pader. May ilang hanay na ng mga pader sa gitna ng Babilonya. Mas matibay ang ebidensiya para sa mga ito kaysa sa mga Nakabiting Hardin, na pinagtatalunan pa ang lokasyon at nagpagawa. Iniuugnay ng Dobleng Pader ng Babilonya ang pagpapaunlad ng lungsod sa pagtatanggol dito. Pagkatapos ng pag-upgrade ng lungsod, libreng tataas ng isang antas ang iyong tapos na toreng may pinakamababang antas sa loob ng 20 tile, hanggang antas 4."
