[articles.ar]
text = "حكم نبوخذ نصر الثاني الإمبراطورية البابلية الحديثة من نحو 605 إلى 562 قبل الميلاد. وتوثق النقوش الملكية وبقايا المباني أعمالاً غيّرت العاصمة، شملت القصور والمعابد وطرق المواكب والبوابات والتحصينات. كما شهد عهده حملات في بلاد الشام. ويسجل حول بابلي الاستيلاء على القدس سنة 597 قبل الميلاد، وتذكر روايات تلك الحروب ترحيل جماعات من سكان يهوذا. وتنسب نقوش البناء هذه المشروعات إلى الملك، لذلك يقارنها المؤرخون بآثار المباني وبالسجلات المكتوبة لأغراض أخرى. تسجل أسطوانة طينية محفوظة في متحف المتروبوليتان للفنون بناء سور خارجي جديد لبابل. وكان قلب المدينة محمياً قبل ذلك بعدة أسوار. وتوفر الأسطوانة دليلاً على التحصينات، في حين يبقى موقع الحدائق المعلقة وهوية من أمر ببنائها موضع خلاف. وتربط قدرة «أسوار بابل المزدوجة» بين توسعة المدينة وتعزيز دفاعاتها. عند إكمال ترقية مدينة، يرتفع مجاناً مستوى برجك المكتمل الأقل مستوى ضمن 20 خانة بمقدار درجة واحدة، حتى المستوى الرابع."
title = "نبوخذ نصر الثاني"
lang = "ar"
url = "https://www.metmuseum.org/art/collection/search/321676"
shortArticle = true
