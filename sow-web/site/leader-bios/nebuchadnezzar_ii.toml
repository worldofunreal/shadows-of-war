[articles.tr]
text = "II. Nebukadnezar, Yeni Babil İmparatorluğu’nu yaklaşık MÖ 605 ile 562 arasında yönetti. Kraliyet yazıtları ve arkeolojik kalıntılar, başkenti dönüştüren sarayları, tapınakları, tören yollarını, kapıları ve surları belgeler. Hükümdarlığı sırasında Doğu Akdeniz’e de seferler düzenlendi. Bir Babil kroniği Kudüs’ün MÖ 597’de alınışını kaydeder. Seferleri anlatan kaynaklarda Yahuda halkından toplulukların sürgün edilmesi de yer alır. İnşaat yazıtları bu eserleri kralın başarısı olarak sunduğu için tarihçiler metinleri kazı bulguları ve başka kayıtlarla karşılaştırır. Metropolitan Sanat Müzesi’ndeki bir kil silindir, Babil’in yeni dış surunun yapımını anlatır. Şehrin merkezinde zaten birden fazla savunma duvarı vardı. Bu surlar, yeri ve kimin yaptırdığı tartışmalı olan Asma Bahçeler’den daha sağlam biçimde belgelenmiştir. Babil’in Çifte Surları, kent yatırımı ile savunma arasındaki ilişkiyi oyuna taşır. Bir şehir yükseltmesi tamamlanınca, 20 kare içindeki tamamlanmış en düşük seviyeli kendi kulen bir seviye ücretsiz yükselir. Üst sınır 4. seviyedir."
title = "II. Nebukadnezar"
lang = "tr"
url = "https://www.metmuseum.org/art/collection/search/321676"
