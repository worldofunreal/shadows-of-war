[articles.zh-CN]
text = "尼布甲尼撒二世约在公元前605年至前562年统治新巴比伦帝国。考古遗址与王室铭文留下了首都扩建的记录。宫殿、神庙、供仪式队伍经过的道路、城门和防御工事，都属于这一时期的工程。城内的道路和城门服务于日常通行及礼仪，城墙则围护城区。不同种类的工程同时进行，使首都的面貌发生变化。在这一时期，巴比伦还向地中海东岸地区出兵。巴比伦编年史记录了公元前597年攻陷耶路撒冷的战事。关于这些战争的记载也讲到犹大居民遭到迁徙和流放。记述王室工程的铭文往往把成就归于君主，因此研究者也会检查遗址、其他文献和不同类型的泥板记录。编年史按年叙述军事行动，而建筑铭文说明君主如何纪念自己主持的工程，两类文字各有写作目的。这一区分也解释了为什么一场战役和一项工程往往需要查阅不同的资料。 大都会艺术博物馆收藏的一件泥质圆柱刻有楔形文字，记载尼布甲尼撒二世在巴比伦修建新外墙。这样的圆柱是用来记录建筑工程的奠基物。新墙修建以前，巴比伦的核心城区已有多道防线。博物馆的藏品资料把文字记载与这些防御工事联系起来，使人能够区分城内既有的防线与君主新增的外墙。王室铭文关于建造与修复的叙述也说明，防御设施和其他城市工程持续得到投入。后世流传的空中花园故事同样与巴比伦有关，但花园的地点和建造者仍有争论。泥质圆柱提供了关于外墙的实物依据，两类材料能回答的问题不同。游戏的「巴比伦双重城墙」将城市扩建与加强防御联系起来。完成城市升级时，如果20格内有己方已完工且未达到上限的防御塔，其中等级最低的一座会立即免费升一级，最高为4级。这样，城市升级完成后，附近防御工事的变化会直接体现在地图上。游戏中的一座塔代表城市扩建带来的防御投入，具体距离与等级则由游戏规则决定。"
title = "尼布甲尼撒二世"
lang = "zh-CN"
url = "https://www.metmuseum.org/art/collection/search/321676"
