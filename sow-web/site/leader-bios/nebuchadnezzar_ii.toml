[articles.vi]
text = "Nebuchadnezzar II cai trị Đế quốc Tân Babylon từ khoảng năm 605 đến 562 TCN. Văn khắc hoàng gia và di tích khảo cổ ghi nhận những công trình làm thay đổi kinh đô, gồm cung điện, đền thờ, đường rước lễ, cổng thành và hệ thống phòng thủ. Triều đại này cũng tiến hành các chiến dịch ở vùng Levant. Một biên niên sử Babylon ghi lại việc chiếm Jerusalem năm 597 TCN, còn các ghi chép về chiến tranh kể đến việc cưỡng bức di dời người Judah. Vì văn khắc xây dựng ca ngợi công lao nhà vua, giới sử học đối chiếu chúng với di tích và các văn bản khác. Một trụ đất sét tại Bảo tàng Nghệ thuật Metropolitan ghi việc nhà vua xây tường thành ngoài mới cho Babylon. Trước đó, khu vực trung tâm đã có nhiều lớp tường phòng thủ. Những bức tường được chứng thực rõ hơn Vườn treo, công trình có vị trí và người bảo trợ vẫn còn gây tranh luận. Tường thành kép Babylon đưa mối liên hệ giữa mở rộng đô thị và củng cố phòng thủ vào trận đấu. Khi nâng cấp thành phố hoàn tất, tháp đã hoàn tất có cấp thấp nhất của bạn trong phạm vi 20 ô được tăng miễn phí một cấp, tối đa cấp 4."
title = "Nebuchadnezzar II"
lang = "vi"
url = "https://www.metmuseum.org/art/collection/search/321676"
shortArticle = true
intro = ["Nebuchadnezzar II cai trị Đế quốc Tân Babylon từ khoảng năm 605 đến 562 TCN. Văn khắc hoàng gia và di tích khảo cổ ghi nhận những công trình làm thay đổi kinh đô, gồm cung điện, đền thờ, đường rước lễ, cổng thành và hệ thống phòng thủ. Triều đại này cũng tiến hành các chiến dịch ở vùng Levant. Một biên niên sử Babylon ghi lại việc chiếm Jerusalem năm 597 TCN, còn các ghi chép về chiến tranh kể đến việc cưỡng bức di dời người Judah. Vì văn khắc xây dựng ca ngợi công lao nhà vua, giới sử học đối chiếu chúng với di tích và các văn bản khác."]
sections = [{ title = "Thành lũy Babylon", paragraphs = ["Một trụ đất sét tại Bảo tàng Nghệ thuật Metropolitan ghi việc nhà vua xây tường thành ngoài mới cho Babylon. Trước đó, khu vực trung tâm đã có nhiều lớp tường phòng thủ. Những bức tường được chứng thực rõ hơn Vườn treo, công trình có vị trí và người bảo trợ vẫn còn gây tranh luận. Tường thành kép Babylon đưa mối liên hệ giữa mở rộng đô thị và củng cố phòng thủ vào trận đấu. Khi nâng cấp thành phố hoàn tất, tháp đã hoàn tất có cấp thấp nhất của bạn trong phạm vi 20 ô được tăng miễn phí một cấp, tối đa cấp 4."] }]
sources = [{ title = "Cuneiform foundation cylinder of Nebuchadnezzar II, Metropolitan Museum of Art", url = "https://www.metmuseum.org/art/collection/search/321676" }, { title = "Babylonian Chronicle BM 21946, British Museum", url = "https://www.britishmuseum.org/collection/object/W_1896-0409-51" }]

[articles.id]
text = "Nebukadnezar II memerintah Kekaisaran Babilonia Baru dari sekitar 605 hingga 562 SM. Prasasti kerajaan dan temuan arkeologis mendokumentasikan pembangunan yang mengubah ibu kota, termasuk istana, kuil, jalan prosesi, gerbang, dan benteng. Ia juga melancarkan kampanye militer di wilayah Levant. Sebuah kronik Babilonia mencatat penaklukan Yerusalem pada 597 SM, sementara kisah tentang perang tersebut mencatat pengasingan penduduk Yehuda. Prasasti pembangunan menampilkan karya ini sebagai prestasi raja. Sejarawan membandingkannya dengan sisa bangunan dan catatan lain. Sebuah silinder tanah liat di Metropolitan Museum of Art mencatat pembangunan tembok luar baru. Pusat Babilonia sudah memiliki beberapa tembok pertahanan. Benteng itu memiliki bukti yang lebih jelas daripada Taman Gantung, yang lokasi dan pemberi perintah pembangunannya masih diperdebatkan. Tembok Ganda Babilonia menghubungkan pembangunan kota dengan penguatan pertahanannya. Ketika peningkatan kota selesai, menara rampung milikmu dengan tingkat terendah dalam jarak 20 petak langsung naik satu tingkat secara gratis, hingga tingkat 4."
