[articles.it]
text = "Nabucodonosor II governò l’Impero neobabilonese dal 605 circa al 562 a.C. Le iscrizioni reali e i resti archeologici attestano lavori che trasformarono la capitale, tra cui palazzi, templi, strade processionali, porte e difese. Il regno fu segnato anche da campagne nel Levante. Una cronaca babilonese registra la presa di Gerusalemme nel 597 a.C., e i racconti delle campagne documentano le deportazioni di abitanti di Giuda. Poiché le iscrizioni celebrano i risultati del sovrano, gli storici le confrontano con i resti degli edifici e con altre fonti scritte. Un cilindro d’argilla conservato al Metropolitan Museum of Art registra la costruzione di una nuova cinta esterna. Il centro di Babilonia era già protetto da più cerchie di mura. Queste opere sono meglio documentate dei giardini pensili, la cui posizione e committenza sono discusse. Doppie mura di Babilonia riprende il legame tra sviluppo urbano e fortificazione. Completare un potenziamento di una città alza gratuitamente di un livello la propria torre completa di livello più basso entro 20 caselle, fino al livello 4."
title = "Nabucodonosor II"
lang = "it"
url = "https://www.metmuseum.org/art/collection/search/321676"
shortArticle = true
