[articles.en]
text = "Nebuchadnezzar II ruled the Neo-Babylonian Empire from about 605 to 562 BCE. Babylonian royal inscriptions and archaeological remains record an extensive building program that reshaped the capital, including palaces, temples, processional streets, gates, and defensive walls. His reign also included campaigns in the Levant and the conquest of Jerusalem; Babylonian sources and later accounts describe the deportation of Judean groups. Royal inscriptions present these works as the king’s achievements, so historians compare them with archaeological evidence and other contemporary records. A clay foundation cylinder in the Metropolitan Museum of Art records Nebuchadnezzar’s construction of a new outer city wall at Babylon. The museum notes that the city’s inner core also had several fortification walls, while inscriptions from the king describe a sustained program of construction and restoration. These sources make the walls a securely documented part of his rule, distinct from later legends such as the Hanging Gardens, whose location and patronage remain disputed. Double Walls of Babylon links urban investment with defensive construction. Finishing a city upgrade immediately raises one eligible nearby tower by a level. This represents the parallel growth of the city and its fortifications; the free upgrade and twenty-tile radius are game rules."
title = "Nebuchadnezzar II"
lang = "en"
url = "https://www.metmuseum.org/art/collection/search/321676"
shortArticle = true
intro = ["Nebuchadnezzar II ruled the Neo-Babylonian Empire from about 605 to 562 BCE. Babylonian royal inscriptions and archaeological remains record an extensive building program that reshaped the capital, including palaces, temples, processional streets, gates, and defensive walls. His reign also included campaigns in the Levant and the conquest of Jerusalem; Babylonian sources and later accounts describe the deportation of Judean groups. Royal inscriptions present these works as the king’s achievements, so historians compare them with archaeological evidence and other contemporary records."]
