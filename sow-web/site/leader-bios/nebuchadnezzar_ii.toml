[articles.ko]
text = "네부카드네자르 2세는 기원전 605년 무렵부터 기원전 562년까지 신바빌로니아 제국을 다스렸다. 왕실 비문과 발굴된 유적은 이 시기에 수도 바빌론의 궁전, 신전, 행렬이 지나는 길, 성문, 성벽을 새로 짓거나 정비했음을 보여 준다. 수도의 여러 시설을 함께 건설하면서 사람들이 이동하는 길과 도시의 방어 구조가 달라졌다. 그의 치세에는 레반트 지역으로 향하는 원정도 있었다. 바빌로니아 연대기는 기원전 597년 예루살렘 점령을 기록한다. 이 전쟁을 다루는 자료에는 유다 주민들의 강제 이주도 나온다. 공사를 기념한 비문은 왕의 업적에 초점을 둔다. 역사 연구에서는 이런 기록을 발굴 결과나 전쟁을 기록한 연대기와 함께 검토한다. 두 기록은 같은 통치 시기의 서로 다른 활동을 보여 준다. 메트로폴리탄 미술관에 소장된 점토 원통에는 네부카드네자르가 바빌론의 새 외벽을 쌓았다는 내용이 쐐기 문자로 적혀 있다. 건설을 기념하는 이 자료에서 말하는 외벽은 도심을 두른 기존 성벽과 구별된다. 도심에는 이미 여러 겹의 방어 시설이 있었고, 왕의 사업으로 바깥쪽에 새로운 방어선이 더해졌다. 이후 바빌론의 이름과 함께 전해진 공중정원 이야기는 정원의 위치와 건설을 지시한 인물이 모두 논쟁의 대상이다. 성벽의 경우에는 어떤 공사를 했는지 밝히는 물증이 남아 있다. 게임의 ‘바빌론의 이중 성벽’은 도시의 확장과 방어 시설의 확충을 연결한다. 도시 업그레이드를 마치면 20칸 안의 자기 소유 완성된 탑 가운데 상한에 도달하지 않은 가장 낮은 레벨의 탑이 무료로 한 단계 오른다. 탑은 최대 레벨 4까지 올라간다. 도시 건설의 진전이 가까운 방어 시설의 변화로 이어지는 과정을 게임 지도에서 확인할 수 있다."
title = "네부카드네자르 2세"
lang = "ko"
url = "https://www.metmuseum.org/art/collection/search/321676"
shortArticle = true
