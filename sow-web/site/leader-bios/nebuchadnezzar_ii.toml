intro = ["Nabuchodonosor II régna sur l’Empire néo-babylonien d’environ 605 à 562 av. J.-C. Les inscriptions royales et les vestiges archéologiques témoignent de travaux qui transformèrent la capitale. Ils concernent notamment les palais, les temples, les voies processionnelles, les portes et les fortifications. Le règne fut aussi marqué par des campagnes au Levant. Une chronique babylonienne enregistre la prise de Jérusalem en 597 av. J.-C., et les récits de ces campagnes font état de déportations de populations de Juda. Les historiens confrontent les inscriptions de chantier, qui célèbrent le souverain, aux vestiges et à d’autres écrits."]
