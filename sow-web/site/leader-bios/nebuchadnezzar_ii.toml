[articles.ja]
text = "ネブカドネザル二世は紀元前605年ごろから前562年まで、新バビロニア帝国を治めた。王の碑文と発掘された遺構から、首都バビロンで宮殿、神殿、儀礼に使う道路、門、城壁などが整備されたことが分かる。儀礼の通路や神殿と防御施設が同じ時代に整えられ、首都の構造も変わった。国外ではレバント地方への遠征が続いた。バビロニアの年代記は紀元前597年のエルサレム攻略を記録し、一連の戦争を伝える資料にはユダの住民が移送されたことも記されている。王の建築碑文は工事を王自身の功績として伝える。研究者はその記述が発掘資料とどこまで一致するかを確かめ、別の目的で書かれた年代記などと比較する。戦争と工事の記録は、同じ治世の異なる側面を伝えている。それぞれの記録の目的を区別して読むことで、記された出来事と王を称える表現の違いが見えてくる。 メトロポリタン美術館が所蔵する粘土製の円筒には、王がバビロンの新しい外壁を建設したことが楔形文字で記されている。円筒は建築を記念するために作られた資料である。新しい外壁が加わる以前にも、都市の中心部はいくつもの城壁で守られていた。既存の防御施設と外壁を分けて見ると、王の建設事業が防御を外側に広げるものだったことが分かる。後世に名高い空中庭園については、所在地や建設を命じた人物に議論がある。城壁については、円筒に記された工事と遺構を照らし合わせることができる。ゲームの「バビロンの二重城壁」は、都市の増築と防備の強化が連動する様子を表す。都市の増築が完了すると、20マス以内にある自軍の完成済みの塔のうち、上限に達していない最低レベルの一基が無料で一段階上がる。上限はレベル4である。増築をきっかけに周辺の防備が変わることを、塔の強化としてマップ上で確認できる。"
title = "ネブカドネザル2世"
lang = "ja"
url = "https://www.metmuseum.org/art/collection/search/321676"
