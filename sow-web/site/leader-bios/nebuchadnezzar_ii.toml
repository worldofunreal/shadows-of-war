[articles.fr]
text = "Nabuchodonosor II régna sur l’Empire néo-babylonien d’environ 605 à 562 av. J.-C. Les inscriptions royales et les vestiges archéologiques témoignent de travaux qui transformèrent la capitale. Ils concernent notamment les palais, les temples, les voies processionnelles, les portes et les fortifications. Le règne fut aussi marqué par des campagnes au Levant. Une chronique babylonienne enregistre la prise de Jérusalem en 597 av. J.-C., et les récits de ces campagnes font état de déportations de populations de Juda. Les historiens confrontent les inscriptions de chantier, qui célèbrent le souverain, aux vestiges et à d’autres écrits. Un cylindre d’argile conservé au Metropolitan Museum of Art relate la construction d’un nouveau rempart extérieur. Le cœur de Babylone disposait déjà de plusieurs enceintes. Ces fortifications sont mieux attestées que les jardins suspendus, dont l’emplacement et le commanditaire font débat. Double enceinte de Babylone transpose dans la partie le lien entre l’agrandissement d’une ville et le renforcement de ses défenses. Une amélioration de ville achevée fait monter gratuitement d’un niveau votre tour achevée de plus bas niveau à 20 cases ou moins, jusqu’au niveau 4."
title = "Nabuchodonosor II"
lang = "fr"
url = "https://www.metmuseum.org/art/collection/search/321676"
