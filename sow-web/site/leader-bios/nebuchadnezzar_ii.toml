[articles.es]
text = "Nabucodonosor II gobernó el Imperio neobabilónico aproximadamente entre 605 y 562 a. C. Las inscripciones reales y los restos arqueológicos documentan obras que transformaron la capital, entre ellas palacios, templos, vías procesionales, puertas y defensas. El reinado también incluyó campañas en el Levante. Una crónica babilónica registra la toma de Jerusalén en 597 a. C., y los relatos sobre esas campañas dan cuenta de las deportaciones que sufrió la población de Judá. Las inscripciones de obra atribuyen los logros al rey. Los historiadores las contrastan con restos materiales y con registros de otro tipo. Un cilindro de arcilla conservado en el Museo Metropolitano de Arte registra la construcción de una nueva muralla exterior. Babilonia ya contaba con varias líneas de defensa en su núcleo urbano. Las inscripciones permiten seguir estas obras con mayor certeza que los relatos sobre los Jardines Colgantes, cuya ubicación y autoría se discuten. Doble muralla de Babilonia lleva a la partida la relación entre el crecimiento urbano y la fortificación. Al terminar una mejora de ciudad, la torre propia terminada de menor nivel a 20 casillas o menos sube gratis un nivel, hasta nivel 4."
title = "Nabucodonosor II"
lang = "es"
url = "https://www.metmuseum.org/art/collection/search/321676"
shortArticle = true
