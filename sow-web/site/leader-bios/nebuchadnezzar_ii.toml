[articles.pt-BR]
text = "Nabucodonosor II governou o Império Neobabilônico de cerca de 605 a 562 a.C. Inscrições reais e vestígios arqueológicos documentam obras que transformaram a capital, entre elas palácios, templos, vias processionais, portões e defesas. O reinado também foi marcado por campanhas no Levante. Uma crônica babilônica registra a tomada de Jerusalém em 597 a.C., e os relatos dessas guerras descrevem deportações de habitantes de Judá. Como as inscrições celebram as realizações do rei, historiadores as comparam com os vestígios das construções e outros registros escritos. Um cilindro de argila no Metropolitan Museum of Art registra a construção de uma nova muralha externa. O núcleo da Babilônia já contava com várias linhas de defesa. Essas fortificações são mais bem documentadas do que os Jardins Suspensos, cuja localização e autoria seguem em debate. Muralhas duplas da Babilônia leva ao jogo a relação entre ampliação urbana e defesa. Ao concluir uma melhoria de cidade, a sua torre concluída de menor nível a até 20 casas sobe um nível de graça, até o nível 4."
title = "Nabucodonosor II"
lang = "pt-BR"
url = "https://www.metmuseum.org/art/collection/search/321676"
