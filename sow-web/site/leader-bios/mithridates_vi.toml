[articles.en]
text = "Mithridates VI Eupator ruled Pontus on the southern shore of the Black Sea. He extended the kingdom’s influence around the sea and challenged Rome in Anatolia. In the third war against Rome, the general Lucullus drove him out of Pontus. Mithridates took refuge with Tigranes II of Armenia, who had married his daughter. Their alliance gave the Pontic king a place to regroup and men with whom he could return."
title = "Mithridates VI"
lang = "en"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mithridates VI Eupator ruled Pontus on the southern shore of the Black Sea. He extended the kingdom’s influence around the sea and challenged Rome in Anatolia. In the third war against Rome, the general Lucullus drove him out of Pontus. Mithridates took refuge with Tigranes II of Armenia, who had married his daughter. Their alliance gave the Pontic king a place to regroup and men with whom he could return."]
sections = [{ title = "The return to Pontus", paragraphs = ["Appian reports that Mithridates re-entered Pontus with four thousand men of his own and the same number supplied by Tigranes. The figures are those of the ancient account. In 67 BCE he defeated the Roman commander Triarius near Zela, briefly reversing the Roman occupation. The recovery proved temporary. Pompey took over the Roman command, and Mithridates withdrew to the Cimmerian Bosporus, where he died in 63 BCE after his son Pharnaces rebelled."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.es]
text = "Mitrídates VI Eupátor reinó en el Ponto, en la costa meridional del mar Negro. Extendió la influencia de su reino alrededor del mar y se enfrentó a Roma en Anatolia. Durante la tercera guerra contra Roma, el general Lúculo lo expulsó del Ponto. Mitrídates se refugió con Tigranes II de Armenia, que se había casado con su hija. La alianza le dio un lugar donde reorganizarse y tropas con las que emprender el regreso."
title = "Mitrídates VI"
lang = "es"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mitrídates VI Eupátor reinó en el Ponto, en la costa meridional del mar Negro. Extendió la influencia de su reino alrededor del mar y se enfrentó a Roma en Anatolia. Durante la tercera guerra contra Roma, el general Lúculo lo expulsó del Ponto. Mitrídates se refugió con Tigranes II de Armenia, que se había casado con su hija. La alianza le dio un lugar donde reorganizarse y tropas con las que emprender el regreso."]
sections = [{ title = "El regreso al Ponto", paragraphs = ["Apiano cuenta que Mitrídates volvió al Ponto con cuatro mil hombres propios y otros tantos aportados por Tigranes. Son las cifras del relato antiguo. En el 67 a. C. derrotó al comandante romano Triario cerca de Zela y revirtió por un tiempo la ocupación romana. La recuperación fue breve. Pompeyo tomó el mando de las fuerzas romanas y Mitrídates se retiró al Bósforo cimerio. Allí murió en el 63 a. C., después de la rebelión de su hijo Farnaces."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.fr]
text = "Mithridate VI Eupator régna sur le Pont, sur la rive sud de la mer Noire. Il étendit l’influence de son royaume autour de cette mer et affronta Rome en Anatolie. Durant la troisième guerre contre Rome, le général Lucullus le chassa du Pont. Mithridate se réfugia auprès de Tigrane II d’Arménie, qui avait épousé sa fille. Cette alliance lui permit de se regrouper et d’obtenir des hommes pour son retour."
title = "Mithridate VI"
lang = "fr"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mithridate VI Eupator régna sur le Pont, sur la rive sud de la mer Noire. Il étendit l’influence de son royaume autour de cette mer et affronta Rome en Anatolie. Durant la troisième guerre contre Rome, le général Lucullus le chassa du Pont. Mithridate se réfugia auprès de Tigrane II d’Arménie, qui avait épousé sa fille. Cette alliance lui permit de se regrouper et d’obtenir des hommes pour son retour."]
sections = [{ title = "Le retour dans le Pont", paragraphs = ["Appien rapporte que Mithridate rentra dans le Pont avec quatre mille de ses propres hommes et autant de soldats fournis par Tigrane. Ces chiffres sont ceux du récit antique. En 67 av. J.-C., il vainquit le commandant romain Triarius près de Zéla, renversant un temps l’occupation romaine. Le répit fut de courte durée. Pompée prit le commandement des forces romaines et Mithridate se retira dans le Bosphore cimmérien. Il y mourut en 63 av. J.-C. après la révolte de son fils Pharnace."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.de]
text = "Mithridates VI. Eupator herrschte über Pontos an der Südküste des Schwarzen Meeres. Er dehnte den Einfluss seines Reiches rund um das Meer aus und trat Rom in Anatolien entgegen. Im dritten Krieg gegen Rom vertrieb ihn der Feldherr Lucullus aus Pontos. Mithridates fand Zuflucht bei Tigranes II. von Armenien, der seine Tochter geheiratet hatte. Das Bündnis gab ihm Gelegenheit zur Neuaufstellung und Truppen für die Rückkehr."
title = "Mithridates VI."
lang = "de"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mithridates VI. Eupator herrschte über Pontos an der Südküste des Schwarzen Meeres. Er dehnte den Einfluss seines Reiches rund um das Meer aus und trat Rom in Anatolien entgegen. Im dritten Krieg gegen Rom vertrieb ihn der Feldherr Lucullus aus Pontos. Mithridates fand Zuflucht bei Tigranes II. von Armenien, der seine Tochter geheiratet hatte. Das Bündnis gab ihm Gelegenheit zur Neuaufstellung und Truppen für die Rückkehr."]
sections = [{ title = "Die Rückkehr nach Pontos", paragraphs = ["Appian berichtet, Mithridates sei mit viertausend eigenen und ebenso vielen von Tigranes gestellten Männern nach Pontos zurückgekehrt. Die Zahlen stammen aus dem antiken Bericht. 67 v. Chr. besiegte er den römischen Befehlshaber Triarius bei Zela und drängte die Besatzungsmacht zeitweilig zurück. Der Erfolg währte kurz. Pompeius übernahm den römischen Oberbefehl. Mithridates zog sich an den Kimmerischen Bosporus zurück, wo er 63 v. Chr. nach dem Aufstand seines Sohnes Pharnakes starb."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.it]
text = "Mitridate VI Eupatore regnò sul Ponto, sulla costa meridionale del Mar Nero. Estese l’influenza del suo regno intorno al mare e sfidò Roma in Anatolia. Durante la terza guerra contro Roma, il generale Lucullo lo cacciò dal Ponto. Mitridate si rifugiò presso Tigrane II d’Armenia, che aveva sposato sua figlia. L’alleanza gli diede un luogo in cui riorganizzarsi e uomini con cui tornare."
title = "Mitridate VI"
lang = "it"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mitridate VI Eupatore regnò sul Ponto, sulla costa meridionale del Mar Nero. Estese l’influenza del suo regno intorno al mare e sfidò Roma in Anatolia. Durante la terza guerra contro Roma, il generale Lucullo lo cacciò dal Ponto. Mitridate si rifugiò presso Tigrane II d’Armenia, che aveva sposato sua figlia. L’alleanza gli diede un luogo in cui riorganizzarsi e uomini con cui tornare."]
sections = [{ title = "Il ritorno nel Ponto", paragraphs = ["Appiano racconta che Mitridate tornò nel Ponto con quattromila uomini propri e altrettanti forniti da Tigrane. Le cifre appartengono al racconto antico. Nel 67 a.C. sconfisse il comandante romano Triario presso Zela, rovesciando per breve tempo l’occupazione romana. La ripresa durò poco. Pompeo assunse il comando romano e Mitridate si ritirò nel Bosforo Cimmerio, dove morì nel 63 a.C. dopo la rivolta del figlio Farnace."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.tr]
text = "VI. Mithridates Eupator, Karadeniz’in güney kıyısındaki Pontus’u yönetti. Krallığının etkisini Karadeniz çevresinde genişletti ve Anadolu’da Roma’ya meydan okudu. Üçüncü savaş sırasında Romalı komutan Lucullus onu Pontus’tan çıkardı. Mithridates, kızıyla evli olan Ermenistan kralı II. Tigranes’e sığındı. Bu ittifak ona yeniden toparlanabileceği bir yer ve geri dönmek için asker sağladı."
title = "VI. Mithridates"
lang = "tr"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["VI. Mithridates Eupator, Karadeniz’in güney kıyısındaki Pontus’u yönetti. Krallığının etkisini Karadeniz çevresinde genişletti ve Anadolu’da Roma’ya meydan okudu. Üçüncü savaş sırasında Romalı komutan Lucullus onu Pontus’tan çıkardı. Mithridates, kızıyla evli olan Ermenistan kralı II. Tigranes’e sığındı. Bu ittifak ona yeniden toparlanabileceği bir yer ve geri dönmek için asker sağladı."]
sections = [{ title = "Pontus’a dönüş", paragraphs = ["Appianos, Mithridates’in kendi dört bin askeri ve Tigranes’in sağladığı dört bin askerle Pontus’a döndüğünü aktarır. Bu sayılar antik anlatıya aittir. MÖ 67’de Zela yakınında Romalı komutan Triarius’u yendi ve Roma işgalini bir süreliğine tersine çevirdi. Başarı kalıcı olmadı. Pompeius Roma kuvvetlerinin komutasını üstlendi. Mithridates Kimmer Boğazı’na çekildi ve oğlu Pharnakes’in isyanından sonra MÖ 63’te orada öldü."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.zh-CN]
text = "米特里达梯六世是黑海南岸本都王国的君主，尊号欧帕托尔。他把本都的势力扩展到黑海周边，并与罗马共和国争夺在安纳托利亚的影响力。早先，比提尼亚和卡帕多基亚的王位问题曾引起罗马干涉。第一次战争结束时，米特里达梯与苏拉在达尔达诺斯达成和议。罗马将领穆雷纳随后袭击本都，直到苏拉命他停止行动，第二次战争才告结束。此后本都与罗马再度开战。亚美尼亚的提格兰二世迎娶了他的女儿，两位国王建立了联盟。第三次米特里达梯战争中，罗马将领卢库卢斯将他逐出本都，他逃往亚美尼亚，借盟友的支持重新集结军队。古代作者阿庇安记载，两位君主在亚美尼亚境内征募士兵，还曾向帕提亚派遣使者，希望得到支援。罗马方面也派出使者交涉。在罗马军队继续进攻的压力下，两位君主随后分开行动，提格兰退往亚美尼亚内地，米特里达梯则选择率军返回本都。"
title = "米特里达梯六世"
lang = "zh-CN"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["米特里达梯六世是黑海南岸本都王国的君主，尊号欧帕托尔。他把本都的势力扩展到黑海周边，并与罗马共和国争夺在安纳托利亚的影响力。早先，比提尼亚和卡帕多基亚的王位问题曾引起罗马干涉。第一次战争结束时，米特里达梯与苏拉在达尔达诺斯达成和议。罗马将领穆雷纳随后袭击本都，直到苏拉命他停止行动，第二次战争才告结束。此后本都与罗马再度开战。亚美尼亚的提格兰二世迎娶了他的女儿，两位国王建立了联盟。第三次米特里达梯战争中，罗马将领卢库卢斯将他逐出本都，他逃往亚美尼亚，借盟友的支持重新集结军队。古代作者阿庇安记载，两位君主在亚美尼亚境内征募士兵，还曾向帕提亚派遣使者，希望得到支援。罗马方面也派出使者交涉。在罗马军队继续进攻的压力下，两位君主随后分开行动，提格兰退往亚美尼亚内地，米特里达梯则选择率军返回本都。"]
sections = [{ title = "重返本都", paragraphs = ["按阿庇安的说法，米特里达梯返回本都时带了四千名自己的士兵，提格兰又提供了同样数目的援军。兵力数字来自古代史书，难以独立核实。卢库卢斯追击时受到粮秣不足的限制。米特里达梯先与留下指挥罗马部队的法比乌斯交战，特里阿里乌斯后来赶来增援。公元前六十七年，两军在泽拉附近再次相遇。阿庇安说罗马军队先在夜里袭击本都军的前哨，双方一度相持，随后国王发起冲锋，打破了罗马军的阵线。阿庇安也记载国王在追击中受伤，部下鸣号召回军队，他恢复后再往罗马营地，却发现对方已经撤走。泽拉的胜利让本都暂时摆脱罗马军的控制，然而战事还没有结束。庞培接掌罗马军队的指挥权，米特里达梯此后转往黑海北岸的辛梅里安博斯普鲁斯。公元前六十三年，他的儿子法尔纳克斯发动叛乱，米特里达梯在当地去世。从投奔提格兰到重返本都，盟军给了他再战的机会。罗马最终取得优势之前，他已经借这次援助改变过战局。"] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.ja]
text = "ミトリダテス六世エウパトルは、黒海南岸のポントスを治めた王である。黒海の周辺に勢力を伸ばし、アナトリアでローマと対立した。アルメニア王ティグラネス二世はミトリダテスの娘をめとり、両者は同盟を結んだ。第三次ミトリダテス戦争でローマの将軍ルクッルスにポントスを追われたミトリダテスは、ティグラネスのもとに身を寄せた。アッピアノスによると、二人の王はアルメニアで兵を集め、パルティアにも援助を求める使節を送った。ローマ側もパルティアへ使節を送り、相手の動きに対抗した。やがてティグラネスはアルメニアの奥地に退き、ミトリダテスはポントスに残った領土へ向かった。"
title = "ミトリダテス6世"
lang = "ja"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["ミトリダテス六世エウパトルは、黒海南岸のポントスを治めた王である。黒海の周辺に勢力を伸ばし、アナトリアでローマと対立した。アルメニア王ティグラネス二世はミトリダテスの娘をめとり、両者は同盟を結んだ。第三次ミトリダテス戦争でローマの将軍ルクッルスにポントスを追われたミトリダテスは、ティグラネスのもとに身を寄せた。アッピアノスによると、二人の王はアルメニアで兵を集め、パルティアにも援助を求める使節を送った。ローマ側もパルティアへ使節を送り、相手の動きに対抗した。やがてティグラネスはアルメニアの奥地に退き、ミトリダテスはポントスに残った領土へ向かった。"]
sections = [{ title = "ポントスへの帰還", paragraphs = ["アッピアノスは、帰還する王が自軍の四千人と、ティグラネスから受け取った同数の兵を率いていたと記している。兵数は古代の記録に基づくもので、別の資料で確かめることは難しい。ローマ軍のルクッルスは後を追ったものの、補給に苦しんだ。ミトリダテスはまずローマ軍を任されていたファビウスと戦い、やがてファビウスを助けに来たトリアリウスとも対峙した。紀元前六七年、ゼラ付近でトリアリウスが夜に前哨を攻撃したとアッピアノスは伝える。戦いはしばらく決着がつかなかったが、ミトリダテスの突撃がローマ軍の隊列を崩した。同じ史書には、追撃中に王が負傷し、部下が兵を呼び戻したことも記されている。ポントス軍は勝利を収めたものの、その後も戦争は続いた。ポンペイウスがローマ軍の指揮を引き継ぐと、ミトリダテスは黒海北方のキンメリアのボスポロスに退いた。息子ファルナケスが反乱を起こし、王は紀元前六三年にそこで死んだ。ゼラでの勝利に至る一時的な回復には、亡命先で兵を集め、同盟者から増援を受けた経緯があった。"] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.ko]
text = "미트리다테스 6세 에우파토르는 흑해 남쪽 연안의 폰토스를 다스렸다. 왕국의 영향력을 흑해 주변으로 넓혔으며 아나톨리아에서 로마와 맞섰다. 아르메니아 왕 티그라네스 2세는 그의 딸과 결혼했고 두 왕은 동맹을 맺었다. 제3차 미트리다테스 전쟁에서 로마 장군 루쿨루스가 그를 폰토스에서 몰아내자 미트리다테스는 티그라네스에게 몸을 의탁했다. 아피아노스의 기록에 따르면 두 왕은 아르메니아에서 병력을 모았고, 파르티아에도 사절을 보내 지원을 요청했다. 이후 티그라네스는 아르메니아 내륙으로 물러났고 미트리다테스는 자신에게 남아 있던 폰토스 영토로 향했다."
title = "미트리다테스 6세"
lang = "ko"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["미트리다테스 6세 에우파토르는 흑해 남쪽 연안의 폰토스를 다스렸다. 왕국의 영향력을 흑해 주변으로 넓혔으며 아나톨리아에서 로마와 맞섰다. 아르메니아 왕 티그라네스 2세는 그의 딸과 결혼했고 두 왕은 동맹을 맺었다. 제3차 미트리다테스 전쟁에서 로마 장군 루쿨루스가 그를 폰토스에서 몰아내자 미트리다테스는 티그라네스에게 몸을 의탁했다. 아피아노스의 기록에 따르면 두 왕은 아르메니아에서 병력을 모았고, 파르티아에도 사절을 보내 지원을 요청했다. 이후 티그라네스는 아르메니아 내륙으로 물러났고 미트리다테스는 자신에게 남아 있던 폰토스 영토로 향했다."]
sections = [{ title = "폰토스로의 귀환", paragraphs = ["아피아노스에 따르면 귀환하는 왕에게는 자신의 병사 사천 명과 티그라네스가 보내 준 같은 수의 병사가 있었다. 병력의 숫자는 고대 기록이 전하는 것이다. 루쿨루스는 미트리다테스를 뒤쫓았으나 보급에 어려움을 겪었다. 미트리다테스는 먼저 로마군의 파비우스와 싸웠고 뒤이어 파비우스를 지원하러 온 트리아리우스와 맞섰다. 기원전 67년 젤라 근처에서 트리아리우스가 밤에 전초를 공격했다고 아피아노스는 전한다. 한동안 팽팽하던 전투는 미트리다테스의 돌격으로 로마군의 대열이 무너지면서 기울었다. 같은 기록에는 왕이 추격 도중 부상하고 측근들이 군대를 불러들인 일도 나온다. 젤라의 승리로 로마의 점령을 잠시 되돌렸지만 전쟁은 계속되었다. 폼페이우스가 로마군 지휘권을 넘겨받았고 미트리다테스는 흑해 북쪽의 킴메리아 보스포로스로 물러났다. 아들 파르나케스가 반란을 일으킨 뒤 기원전 63년 그곳에서 죽었다. 젤라에서의 한때의 회복은 망명지에서 전력을 재편하고 동맹의 원군을 얻은 결과였다."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.ar]
text = "حكم ميثريدات السادس أوباتور مملكة البنطس على الساحل الجنوبي للبحر الأسود. وسع نفوذ المملكة حول البحر وواجه روما في الأناضول. وفي الحرب الثالثة مع روما طرده القائد لوكولوس من البنطس. فلجأ إلى تيغران الثاني ملك أرمينيا، الذي كان متزوجا من ابنته. وأتاح له التحالف مكانا لإعادة تنظيم صفوفه وقوات تمكنه من العودة إلى مملكته."
title = "ميثريدات السادس"
lang = "ar"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["حكم ميثريدات السادس أوباتور مملكة البنطس على الساحل الجنوبي للبحر الأسود. وسع نفوذ المملكة حول البحر وواجه روما في الأناضول. وفي الحرب الثالثة مع روما طرده القائد لوكولوس من البنطس. فلجأ إلى تيغران الثاني ملك أرمينيا، الذي كان متزوجا من ابنته. وأتاح له التحالف مكانا لإعادة تنظيم صفوفه وقوات تمكنه من العودة إلى مملكته."]
sections = [{ title = "العودة إلى البنطس", paragraphs = ["يروي أبيان أن ميثريدات عاد إلى البنطس بأربعة آلاف من رجاله وبعدد مماثل من الجنود أرسله تيغران. وهذه أرقام الرواية القديمة. وفي سنة 67 قبل الميلاد هزم القائد الروماني ترياريوس قرب زيلا فتراجع الاحتلال الروماني لفترة قصيرة. ثم تولى بومبي قيادة القوات الرومانية وانسحب ميثريدات إلى البوسفور الكيميري، حيث مات سنة 63 قبل الميلاد بعد تمرد ابنه فارناكيس. وهكذا تفصل الروايات بين عودته الناجحة لفترة محدودة وبين النهاية اللاحقة لحكمه في المنطقة."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.ru]
text = "Митридат VI Евпатор правил Понтом на южном берегу Чёрного моря. Он расширил влияние царства вокруг моря и противостоял Риму в Анатолии. Во время третьей войны с Римом полководец Лукулл вытеснил его из Понта. Митридат укрылся у армянского царя Тиграна II, женатого на его дочери. Союз позволил ему собрать силы и получить войска для возвращения."
title = "Митридат VI"
lang = "ru"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Митридат VI Евпатор правил Понтом на южном берегу Чёрного моря. Он расширил влияние царства вокруг моря и противостоял Риму в Анатолии. Во время третьей войны с Римом полководец Лукулл вытеснил его из Понта. Митридат укрылся у армянского царя Тиграна II, женатого на его дочери. Союз позволил ему собрать силы и получить войска для возвращения."]
sections = [{ title = "Возвращение в Понт", paragraphs = ["Аппиан сообщает, что Митридат вернулся в Понт с четырьмя тысячами своих воинов и таким же отрядом от Тиграна. Эти числа приводит античный автор. В 67 году до н. э. Митридат разбил римского военачальника Триария у Зелы и на время оттеснил римлян. Успех оказался недолгим. Римское командование принял Помпей, а Митридат отступил к Боспору Киммерийскому, где умер в 63 году до н. э. после восстания своего сына Фарнака."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.vi]
text = "Mithridates VI Eupator cai trị Pontus ở bờ nam Biển Đen. Ông mở rộng ảnh hưởng của vương quốc quanh vùng biển này và đối đầu với La Mã tại Anatolia. Trong cuộc chiến thứ ba với La Mã, tướng Lucullus đẩy ông khỏi Pontus. Mithridates nương náu với Tigranes II của Armenia, người đã cưới con gái ông. Liên minh giúp vua Pontus có nơi tập hợp lực lượng và có thêm quân để trở về."
title = "Mithridates VI"
lang = "vi"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mithridates VI Eupator cai trị Pontus ở bờ nam Biển Đen. Ông mở rộng ảnh hưởng của vương quốc quanh vùng biển này và đối đầu với La Mã tại Anatolia. Trong cuộc chiến thứ ba với La Mã, tướng Lucullus đẩy ông khỏi Pontus. Mithridates nương náu với Tigranes II của Armenia, người đã cưới con gái ông. Liên minh giúp vua Pontus có nơi tập hợp lực lượng và có thêm quân để trở về."]
sections = [{ title = "Trở về Pontus", paragraphs = ["Appian kể rằng Mithridates trở lại Pontus cùng bốn nghìn quân của mình và một lực lượng bằng thế do Tigranes cung cấp. Những con số ấy đến từ lời kể cổ đại. Năm 67 TCN, ông đánh bại chỉ huy La Mã Triarius gần Zela, tạm thời đẩy lui quân chiếm đóng. Kết quả không kéo dài. Pompey tiếp quản quân La Mã và Mithridates rút tới eo biển Bosporus Cimmeria, nơi ông qua đời năm 63 TCN sau khi con trai Pharnaces nổi dậy."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.id]
text = "Mithridates VI Eupator memerintah Pontus di pesisir selatan Laut Hitam. Ia memperluas pengaruh kerajaannya di sekitar laut tersebut dan menantang Roma di Anatolia. Dalam perang ketiga melawan Roma, Jenderal Lucullus mengusirnya dari Pontus. Mithridates berlindung kepada Tigranes II dari Armenia, yang menikah dengan putrinya. Aliansi itu memberinya tempat untuk menghimpun kekuatan kembali dan pasukan untuk pulang."
title = "Mithridates VI"
lang = "id"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mithridates VI Eupator memerintah Pontus di pesisir selatan Laut Hitam. Ia memperluas pengaruh kerajaannya di sekitar laut tersebut dan menantang Roma di Anatolia. Dalam perang ketiga melawan Roma, Jenderal Lucullus mengusirnya dari Pontus. Mithridates berlindung kepada Tigranes II dari Armenia, yang menikah dengan putrinya. Aliansi itu memberinya tempat untuk menghimpun kekuatan kembali dan pasukan untuk pulang."]
sections = [{ title = "Kembali ke Pontus", paragraphs = ["Appianus mencatat bahwa Mithridates kembali ke Pontus dengan empat ribu pasukan sendiri dan jumlah yang sama dari Tigranes. Angka ini berasal dari catatan kuno. Pada 67 SM ia mengalahkan panglima Romawi Triarius di dekat Zela dan memukul balik pendudukan Roma untuk sementara. Kemenangan itu tidak bertahan lama. Pompeius mengambil alih komando Romawi dan Mithridates mundur ke Bosporus Kimmeria, tempat ia wafat pada 63 SM setelah putranya Pharnaces memberontak."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.fil]
text = "Pinamunuan ni Mithridates VI Eupator ang Pontus sa timog na baybayin ng Dagat Itim. Pinalawak niya ang impluwensiya ng kaharian sa paligid ng dagat at hinarap ang Roma sa Anatolia. Sa ikatlong digmaan laban sa Roma, pinalayas siya ni Heneral Lucullus mula sa Pontus. Sumilong si Mithridates kay Tigranes II ng Armenia, na asawa ng anak niyang babae. Nagkaroon siya ng lugar na mapagtitipunan muli ng puwersa at ng hukbong makakasama sa pagbalik."
title = "Mithridates VI"
lang = "fil"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Pinamunuan ni Mithridates VI Eupator ang Pontus sa timog na baybayin ng Dagat Itim. Pinalawak niya ang impluwensiya ng kaharian sa paligid ng dagat at hinarap ang Roma sa Anatolia. Sa ikatlong digmaan laban sa Roma, pinalayas siya ni Heneral Lucullus mula sa Pontus. Sumilong si Mithridates kay Tigranes II ng Armenia, na asawa ng anak niyang babae. Nagkaroon siya ng lugar na mapagtitipunan muli ng puwersa at ng hukbong makakasama sa pagbalik."]
sections = [{ title = "Pagbalik sa Pontus", paragraphs = ["Ayon kay Appian, bumalik si Mithridates sa Pontus kasama ang apat na libo niyang tauhan at ganoon ding bilang ng sundalong ipinadala ni Tigranes. Ang mga bilang ay mula sa sinaunang salaysay. Noong 67 BCE, tinalo niya ang Romanong kumandanteng si Triarius malapit sa Zela at pansamantalang nabawi ang teritoryo. Kinuha ni Pompey ang pamumuno sa hukbong Romano. Umatras si Mithridates sa Cimmerian Bosporus, kung saan siya namatay noong 63 BCE matapos maghimagsik ang anak niyang si Pharnaces."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]

[articles.pt-BR]
text = "Mitrídates VI Eupátor governou o Ponto, no litoral sul do mar Negro. Ampliou a influência do reino ao redor do mar e enfrentou Roma na Anatólia. Na terceira guerra contra Roma, o general Lúculo o expulsou do Ponto. Mitrídates buscou refúgio junto a Tigranes II da Armênia, que se casara com sua filha. A aliança lhe deu um lugar para reorganizar as forças e tropas para voltar."
title = "Mitrídates VI"
lang = "pt-BR"
url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18"
shortArticle = true
intro = ["Mitrídates VI Eupátor governou o Ponto, no litoral sul do mar Negro. Ampliou a influência do reino ao redor do mar e enfrentou Roma na Anatólia. Na terceira guerra contra Roma, o general Lúculo o expulsou do Ponto. Mitrídates buscou refúgio junto a Tigranes II da Armênia, que se casara com sua filha. A aliança lhe deu um lugar para reorganizar as forças e tropas para voltar."]
sections = [{ title = "O retorno ao Ponto", paragraphs = ["Apiano relata que Mitrídates voltou ao Ponto com quatro mil soldados próprios e outros tantos enviados por Tigranes. Esses números vêm do relato antigo. Em 67 a.C., derrotou o comandante romano Triário perto de Zela, revertendo temporariamente a ocupação romana. A recuperação foi breve. Pompeu assumiu o comando romano, e Mitrídates recuou para o Bósforo Cimério, onde morreu em 63 a.C., após a rebelião do filho Fárnaces."] }]
sources = [{ title = "Appian, Mithridatic Wars, sections 88–89, translated by Horace White", url = "https://www.livius.org/sources/content/appian/appian-the-mithridatic-wars/appian-the-mithridatic-wars-18" }, { title = "Brian McGing, Mithridates VI, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/mithridates-vi-eupator-dionysos/" }, { title = "Duane W. Roller, Lucullus and Mithridates VI, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288105899" }, { title = "Duane W. Roller, The End of the Mithridatic Kingdom, Oxford University Press", url = "https://academic.oup.com/book/33609/chapter-abstract/288106044" }]
