[articles.en]
text = "Totila, original name Baduila, was the penultimate King of the Ostrogoths, reigning from 541 to 552. A skilled military and political leader, Totila reversed the tide of the Gothic War, recovering by 543 almost all the territories in Italy that the Eastern Roman Empire had captured from the Ostrogothic Kingdom in 540."
title = "Totila"
lang = "en"
url = "https://en.wikipedia.org/wiki/Totila"
intro = [
  "Totila, original name Baduila (died 1 July 552), was the penultimate King of the Ostrogoths, reigning from 541 to 552. A skilled military and political leader, Totila reversed the tide of the Gothic War, recovering by 543 almost all the territories in Italy that the Eastern Roman Empire had captured from the Ostrogothic Kingdom in 540.",
  "A grandnephew of Theudis, sword-bearer of Theodoric the Great and king of the Visigoths, Totila was elected king by Ostrogothic nobles in the autumn of 541 after the deaths of two former Ostrogothic kings, Ildibad and Eraric. Both had been killed by the Gothic nobility for attempting to surrender to the Romans. Totila proved himself both as a military and political leader, winning the support of the lower classes by liberating slaves and distributing land to the peasants. After a successful defence at Verona, Totila pursued and defeated a numerically superior army at the Battle of Faventia in 542. Totila followed these victories by defeating the Romans outside Florence and capturing Naples. By 543, fighting on land and sea, he had reconquered the bulk of Rome's southern territories, but not the capital. Rome still held out, and Totila appealed unsuccessfully to the Senate in a letter reminding them of Rome's loyalty to his predecessor Theodoric the Great. In the spring of 544, the Eastern Roman emperor Justinian I sent general Belisarius to recapture Italian territory, but Totila captured Rome in 546 from Belisarius, which was depopulated after a yearlong siege. When Totila left to fight the Byzantines in Lucania, south of Naples, Belisarius retook Rome and rebuilt its fortifications.",
  "After Belisarius retreated to Constantinople in 549, Totila recaptured Rome again and went on to complete the reconquest of Italy and Sicily. By the end of 550, Totila had recaptured nearly all of his previous territorial possession; however, Ravenna and four coastal towns remained under Byzantine control. The following year Justinian sent his general Narses with a force of 35,000 Lombards, Gepids, and Heruli to Italy in a march around the Adriatic Sea; these combined forces approached Ravenna from the north. During the Battle of Taginae, a decisive engagement in the Apennines near present-day Fabriano, the Gothic army was defeated and Totila was mortally wounded. Totila was succeeded by his relative Teia, who later died at the Battle of Mons Lactarius. Pockets of resistance, reinforced by Franks and Alemanni who had invaded Italy in 553, continued until 562, at which point the Byzantines gained control of the country following Justinian's conquests.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "\"Totila\" was the nom de guerre of a man whose real name was Baduila, as can be seen from the coinage he issued. \"Totila\" is the name used by the Byzantine historian Procopius, who accompanied the Byzantine general Belisarius during the Gothic War, and whose chronicles are the main source of information for Totila. According to Henry Bradley, 'Totila' and 'Baduila' are diminutives of Totabadws. Historian Marco Cristini has proposed that the consistent use of the name \"Totila\" by Procopius and other Eastern Roman authors, rather than the Gothic king's actual name \"Baduila\" (as attested on contemporary coinage), may have served a propagandistic purpose. Cristini argues that this naming choice was likely encouraged by Emperor Justinian as a means of delegitimising the Gothic leader. The name \"Totila,\" potentially perceived as diminutive or less dignified, could have been employed to reinforce the narrative of Baduila as a mere usurper or rebel, rather than a legitimate monarch. Given the numismatic evidence, Cristini contends that the true name was certainly known to Byzantine authors, suggesting that its omission was a deliberate rhetorical strategy. Born in Treviso, Totila was a grandnephew of Theudis, king of the Visigoths, and a sword-bearer; a role that made for a good career among his kin.",
      "Totila was elected king of the Ostrogoths in 541 after the assassination of his uncle Ildibad and having surreptitiously engineered the assassination of Ildibad's short-lived successor Eraric, in 541. Like Alaric I, Totila was quite young when he became king and was declared such by the Goths to recover dominion over the Italians. The official Byzantine position, adopted by Procopius and even by the Romanized Goth, Jordanes—writing just before the conclusion of the Gothic Wars—was that Totila was a usurper. According to historian Peter Heather, as Ildebadus's nephew, Totila nonetheless hailed from a prominent Gothic family, one that surrounded and \"even occasionally challenged Theodoric's Amal dynasty\".",
    ] },
  { "title" = "Initial victories", "paragraphs" = [
      "Eraric's murder and replacement with Totila suggested to the Byzantines—since Eraric favoured negotiation with Imperial power—that this Gothic successor likely preferred war and so a Byzantine expeditionary force of twelve thousand men was sent north from Ravenna to Verona to stave off any possible impending attack.",
      "At Verona, a local sympathizer allowed a contingent of Roman soldiers into the city and while the Goths panicked at first, they soon realized that the main army was stopped some distance from the city. They promptly shut the gates and the Roman soldiers who had made it into the city escaped by leaping from the walls. Meanwhile, the Roman forces retreated back to Faenza (Battle of Faventia), where Totila met them with 5,000 men to give battle, while another 300 Gothic archers surprised them from the rear, resulting in a rout, whereby the Goths acquired both prisoners and battle standards. Correspondingly, historian Thomas Burns concludes that Totila was a gifted warrior and governor, and as an Ostrogoth ranks only second to Theodoric the Great himself.",
      "After securing victory in 542 at Faenza, Totila's Goths besieged the stoutly-defended Florence in an effort to open the Via Cassia to Rome but when Imperial forces arrived to relieve the city, Totila withdrew to the Mugello valley, where historian Herwig Wolfram states, they \"inflicted a crushing defeat on the enemy\", at the Battle of Mucellium. Since this region was relatively spared of any previous conflicts, Totila's Goths were able to secure significant provisions and booty. In the meantime, instead of pursuing the conquest of central Italy, where the Imperial forces were too formidable for his small army, he decided to transfer his operations to the south of the peninsula. He captured Beneventum as well as Cumae, which remained a Gothic stronghold even after Gothic kingship no longer existed.",
    ] },
  { "title" = "Taking Naples", "paragraphs" = [
      "Procopius reported (Wars, 7.9–12) that during the next two campaigning seasons, Totila was able to take several strategically important centres, including the fortress at Auximum, which allowed him to cut off land communications between Rome and Ravenna. Additional strongholds at Caesena, Urbinus, Mons Feretris, Petra Pertusa, Campania, Lucania, Apulia, Bruttium, and Calabria also fell to Totila's forces, placing the Goths in command of nearly all of southern Italy. Following these successes, Totila now led his army to Naples, laying siege to the city, which alarmed Justinian. The emperor responded by sending the civilian Maximin to meet the crisis. When Maximin attempted a ploy and sent ample food supplies via ships to give the appearance of a much larger army, it failed as Totila was fully informed of all the facts. The crews were slain and a second effort was made to resupply Conon in Naples. Despite the ships arriving safely, the vessels were blown ashore by a gale and these crews were slain and General Demetrius—sent at Maximin's behest—was taken captive by Totila. The Gothic king had Demetrius's hands cut off and his tongue removed before turning him loose. Nonetheless, Totila offered generous terms to Conon's starving garrison at Naples and they opened their gates in the spring of 543 to the Goths. Historian J.B. Bury writes:",
      "On this occasion Totila exhibited a considerable humanity which was not to be expected, as the historian Procopius remarks, from an enemy or a barbarian. He knew that if an abundance of food were at once supplied, the famished inhabitants would gorge themselves to death. He posted sentinels at the gates and in the harbor and allowed no one to leave the city. Then he dealt out small rations, gradually increasing the quantity every day until the people had recovered their strength. The terms of the capitulation were more than faithfully observed. Conon and his followers were embarked in ships with which the Goths provided them, and when, deciding to sail for Rome, they were hindered by contrary winds, Totila furnished horses, provisions, and guides so that they could make the journey by land.",
      "The fortifications at Naples were partly razed. Totila spent the following season establishing himself in the south and reducing pockets of resistance, besieging the Roman garrisons that remained at Hydruntum, all the while building pressure on Rome itself. Unpaid Imperial troops in central Italy made such poor reputations pillaging the countryside that when Totila turned his attention to taking Rome, he was able proudly to contrast Goth and Greek behaviour in his initial negotiations with the senate. Hearkening back to the rule of Theodoric and Amalasuintha as a reminder of more peaceful times between the two peoples, Totila tried to convince them to throw in their lot with the Goths. His olive branch was rejected, however, and all the Arian priests were expelled from Constantinople, on suspicion of possible collaboration as a Gothic fifth column.",
    ] },
  { "title" = "Siege of Rome", "paragraphs" = [
      "Realizing the gravity of the situation in 544, Justinian issued an edict known as the Pragmatic Sanction, designed to rebuild a working government at Ravenna, and that year he also sent Belisarius back to Italy to counter the growing Gothic threat. Unlike in the past, Belisarius was not graciously financed and so the general used some of his own funds to pay for his journey to Italy. By May 544, both Belisarius and General Vitalius—and a contingent of a mere 4,000 troops—had passed through Thrace and were encamped at Salonia along the Adriatic coast. Meanwhile, Totila was preparing to capture Rome.",
      "Throughout the occupation of Italy, Totila never really wavered from the aim to recover the kingdom and sovereignty for the Goths (Procopius, Wars, 7.1.26), but not solely under those auspices, as historian Walter Goffart suggests; he avows it was also to become \"subcontractors in upholding the nomen Romanum in Italy.\"",
      "Towards the end of 545, the Gothic king took up his station at Tivoli and prepared to starve Rome into surrender, making at the same time elaborate preparations for checking the progress of Belisarius who was advancing to its relief, and whose fleet almost managed to relieve the city. In December 545, Totila besieged Rome and a year later entered and plundered the city, where he prayed at St. Peter's Basilica, suggesting continuity with Theodoric, but the act was near meaningless since the city was practically empty.",
    ] },
  { "title" = "Aftermath", "paragraphs" = [
      "For the Byzantines, the war officially ended in 554, which was followed by the broad promulgation of Justinian's Pragmatic Sanction. One of the stipulations Justinian made clear in this document was the validation of all edicts made by \"legitimate\" kings and those from the Roman people or Senate, while those from Totila—deemed a \"most abominable tyrant\"—were rendered void. The Justinian Code was also retroactively made applicable throughout Italy. Socially, the country was disrupted by the actions of the Goths Witigis, Totila, and Teia, who had collectively fractured the Senate's social standing and the servant-based economy by liberating slaves and coloni. Over the longer term, this also meant that western senators were seen as inferior to their eastern counterparts, which in some ways further contributed to the Byzantine's ascendancy.",
      "Nevertheless, the country was so ravaged by the war that any return to normal life proved impossible and Rome, having suffered through seventeen-years' worth of bitter fighting during the Gothic wars, had been besieged and captured multiple times. French historian Bertrand Lançon described this period of late antiquity as Rome's \"darkest hours.\" In 568, only three years after Justinian's death, most of the country was conquered by Alboin of the Lombards, who absorbed the remaining Ostrogothic population, becoming the heirs of the Ostrogoths in Italy itself.",
    ] },
]

[articles.vi]
text = "Totila, tên thật là Baduila (mất ngày 1 tháng 7 năm 552) là vị vua áp chót của vương quốc Ostrogoth, trị vì từ năm 541 đến năm 552 sau Công nguyên. Là một vị tướng và đồng thời là một chính trị tài ba, Totila đã lật ngược tình thế của cuộc chiến tranh Gothic."
title = "Totila"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Totila"
intro = [
  "Totila, tên thật là Baduila (mất ngày 1 tháng 7 năm 552) là vị vua áp chót của vương quốc Ostrogoth, trị vì từ năm 541 đến năm 552 sau Công nguyên. Là một vị tướng và đồng thời là một chính trị tài ba, Totila đã lật ngược tình thế của cuộc chiến tranh Gothic. Đến năm 543, ông đã tái chiếm gần như tất cả các vùng lãnh thổ ở Ý mà Đế quốc Đông La Mã đã chiếm được từ năm 540.",
  "Là bà con của Theudis, người từng cầm gươm theo hầu Theodoric Đại đế và sau này đã trở thành vua của người Visigoth, Totila đã được giới quý tộc Ostrogoth bầu chọn làm vua vào mùa thu năm 541 sau khi vua Witigis bị bắt làm tù binh và áp giải đến Constantinopolis. Totila đã chứng tỏ mình là một nhà lãnh đạo quân sự và chính trị tài trí, giành được sự ủng hộ của tầng lớp hạ lưu bằng cách giải phóng nô lệ và phân phát đất đai cho nông dân. Sau khi cố thủ thành công Verona, Totila đã đem quân truy kích và đánh bại một đội quân đông gấp đôi tại trận Faventia năm 542. Sau chiến thắng đầu tay này, Totila thu về nhiều thắng lợi khác sau khi đánh bại người La Mã ở bên ngoài thành Firenze và tái chiếm Neapolis. Năm 543, sau nhiều giao tranh trên cạn và trên biển, ông đã tái chiếm phần lớn lãnh thổ bị mất. Do thành Roma vẫn cố thủ không chịu đầu hàng, Totila đã viết thư chiêu hàng gửi viện nguyên lão, nhắc lại lòng trung thành mà họ đã trao cho người tiền nhiệm của ông là Theodoric Đại đế, nhưng bị khước từ. Mùa xuân năm 544, hoàng đế Đông La Mã Justinianus I gửi đại tướng Belisarius sang Ý để tổ chức phản công. Tuy nhiên, Totila đã chiếm được thành Roma vào năm 546 từ tay Belisarius sau một cuộc vây hãm kéo dài cả năm ròng khiến dân số trong thành sụt giảm nghiêm trọng. Tuy nhiên, nhân lúc Tolila phải dẫn quân đến Lucania, nằm ở phía nam Neapolis, để chống cự quân Đông La Mã, Belisarius đã lợi dụng thời cơ để chiếm thành Roma một lần nữa và gia cố lại hệ thống phòng thủ của nó.",
  "Sau khi Belisarius bị triệu hồi về Constantinopolis năm 549, Totila lại một lần nữa chiếm được thành Roma, trên đà tiếp tục hoàn thành cuộc tái chinh phục toàn nước Ý và đảo Sicilia. Đến cuối năm 550, Totila đã tái chiếm tất cả các vùng đất ở Ý ngoại trừ Ravenna và bốn thị trấn ven biển. Năm sau đó, Justinianus giao cho danh tướng Narses một đội quân gồm 35.000 người bao gồm người Lombard, Gepid và Heruli tới Ý sau khi đi vòng quanh biển Adriatic để tiếp cận Ravenna từ phía bắc. Tại trận Taginae, một trận chiến quyết định vào mùa hè năm 552 diễn ra tại gần Fabriano dãy Appennini ngày nay, quân đội Gothic đã bị đánh bại và Totila đã nhận phải vết thương chí mạng. Một người bà con của ông là Teia đã lên ngôi kế vị, không lâu sau đã tử trận tại Mons Lactarius. Một vài nhóm người Ostrogoth nhỏ vẫn tiếp tục tổ chức kháng chiến lẻ tẻ, được hỗ trợ bởi người Frank và người Alemanni khi họ đem quân xâm lược Ý vào năm 553. Cuộc chiến vẫn tiếp diễn cho đến năm 562, khi người Đông La Mã đoạt được kiểm soát toàn bộ đất nước. Bán đảo Ý bị chiến tranh tàn phá khiến việc quay về cuộc sống bình thường là điều bất khả thi. Chỉ ba năm sau khi ông qua đời, phần lớn nước Ý bị vua Alboin của người Lombard chiếm đoạt, người đã thu phục được những người Ostrogoth còn lại.",
]
sections = [
  { "title" = "Tiểu sử", "paragraphs" = [
      "\"Totila\" là biệt hiệu của người đàn ông có tên là Baduila dựa trên những đồng xu mà ông phát hành. \"Totila\" cũng là cái tên được sử gia Đông La Mã Procopius, người đã tháp tùng tướng Belisarius sang Ý trong cuộc chiến tranh Gothic, sử dụng. Các tác phẩm của Procopius là nguồn tài liệu chính về cuộc đời của Totila. Còn theo Henry Bradley, \"Totila\" hay \"Baduila\" đều là nhũ danh của một người tên là \"Totabadws\". Sinh ra tại Treviso, Totila là một người bà con của vua Theudis của người Visigoth. Ít lâu sau cái chết của người chú Hildebad của ông vào năm 541, Totila được giới quý tộc Ostrogoth tôn lên làm vua. Ông được cho là có tham dự vào vụ ám sát người thừa kế yểu mệnh của Hildebad, anh em họ của Totila tên là Eraric năm 541. Theo chính sử Đông La Mã và thậm chí theo nhà sử gia người Goth đã La Mã hoá Jordanes viết trước khi cuộc chiến tranh Gothic kết thúc thì Totila là một kẻ cướp ngôi: cuốn Getica của Jordanes (551) đã bỏ qua những thành công gần đó của Totila.",
      "Cuộc sống và sự nghiệp của ông là phục hồi vương quốc của người Goth tại Ý, và ông đã bắt đầu gánh vác nhiệm vụ này ngay từ khi mới lên ngôi, ông đã tập hợp những người Goth lại với nhau và truyền nhiệt huyết cho họ, Đánh bại một cuộc tấn công của người Đông La Mã tại dinh luỹ của người Goth tại thành phố Verona vào mùa đông năm 541, và đã bại một đội quân mạnh hơn của người La Mã tại Faenza (Trận Faventia) vào mùa xuân năm 542.",
      "Dành thêm chiến thắng khác trong năm 542, ông tránh xa một vị trí được cố thủ một cách chắc chắn là thành phố Firenze. Tại Thung lũng Mugello, Totila đã cho thấy bản chất bao dung của mình bằng cách đối xử nhân từ với tù nhân của mình và để họ cảm phục rồi quy phục mình, ông ra khỏi vùng được phòng thủ tốt Toscana với đội quân mở rộng của mình, trong khi đó ba trong số các tướng La Mã rút khỏi Firenze, chia quân đội của họ thành ba, và chia nhau đển cố thủ thành Perugia, Spoleto và Roma, những thành phố mà Totila sẽ mang quân đến bao vây.",
    ] },
  { "title" = "Tham khảo", "paragraphs" = [
      "Bài viết này bao gồm văn bản từ một ấn phẩm hiện thời trong phạm vi công cộng: Chisholm, Hugh, biên tập (1911). \"Totila\". Encyclopædia Britannica (ấn bản thứ 11). Cambridge University Press.",
    ] },
  { "title" = "Liên kết ngoài", "paragraphs" = [
      "Edward Gibbon, The Decline and Fall of the Roman Empire: vol 4.xliii.3 (Totila chiếm thành Roma)",
      "(bằng tiếng Ý) La guerra gotico-bizantina Lưu trữ ngày 22 tháng 7 năm 2011 tại Wayback Machine",
      "(bằng tiếng Ý) Le sepolture regie del regno italico (secoli VI-X) – Totila (541–552) Lưu trữ ngày 3 tháng 7 năm 2007 tại Wayback Machine",
    ] },
]

