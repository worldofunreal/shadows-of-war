[articles.en]
text = "Suleiman I, commonly known as Suleiman the Magnificent, was the Ottoman sultan from 1520 to 1566. The longest reign among the Ottoman sultans, his rule brought about a notable peak in the Ottoman Empire's economic, military and political power, and raised the number of the empire's subjects to at least 25 million people."
title = "Suleiman the Magnificent"
lang = "en"
url = "https://en.wikipedia.org/wiki/Suleiman_the_Magnificent"
intro = [
  "Suleiman I (6 November 1494 – 6 September 1566), commonly known as Suleiman the Magnificent, was the Ottoman sultan from 1520 to 1566.",
  "The longest reign among the Ottoman sultans, his rule brought about a notable peak in the Ottoman Empire's economic, military and political power, and raised the number of the empire's subjects to at least 25 million people.",
  "After succeeding his father Selim I on 30 September 1520, Suleiman began his reign by launching military campaigns against the Christian powers of Central and Eastern Europe and the Mediterranean; Belgrade fell to him in 1521 and Rhodes in 1522, and at Mohács in 1526, Suleiman broke the strength of the Kingdom of Hungary. Hungary was subsequently divided, with much of it incorporated directly into the empire.",
  "However, his defeat at the siege of Vienna in 1529 prevented him from advancing further into Europe. Suleiman also fought for years against the Shia Islamic Safavid Empire of Iran and annexed Iraq. In North Africa, Ottoman Tripolitania was established and the Ottoman fleet dominated the seas from the Mediterranean to the Red Sea and into the Persian Gulf.",
]
sections = [
  { "title" = "Alternative names and titles", "paragraphs" = [
      "It is unclear when exactly the term Kanûnî (the Lawgiver) first came to be used as an epithet for Suleiman. It is entirely absent from sixteenth and seventeenth-century Ottoman sources and may date from the early 18th century.",
      "There is a tradition of Western origin, according to which Suleiman the Magnificent was \"Suleiman II\", but that tradition has been based on an erroneous assumption that Süleyman Çelebi was to be recognised as a legitimate sultan.",
    ] },
  { "title" = "Early life", "paragraphs" = [
      "Suleiman was born in Trabzon on the southern coast of the Black Sea to Şehzade Selim (later Selim I), probably on 6 November 1494, although this date is not known with absolute certainty or evidence. His mother was Hafsa Sultan, a concubine convert to Islam of unknown origins, who died in 1534. At the age of seven, Suleiman began studies of science, history, literature, theology and military tactics in the schools of the imperial Topkapı Palace in Constantinople. As a young man, he befriended Pargalı Ibrahim, a Greek slave who later became one of his most trusted advisers (but who was later executed on Suleiman's orders). At age seventeen, he was appointed as the governor of first Kaffa (Theodosia), then Manisa, with a brief tenure at Edirne.",
      "Upon the death of his father, Selim I (r. 1512–1520), Suleiman entered Constantinople and ascended to the throne as the tenth Ottoman sultan. An early description of Suleiman, a few weeks following his accession, was provided by the Venetian envoy Bartolomeo Contarini:",
      "The sultan is only twenty-five years [actually 26] old, tall and slender but tough, with a thin and bony face. Facial hair is evident, but only barely. The sultan appears friendly and in good humor. Rumor has it that Suleiman is aptly named, enjoys reading, is knowledgeable and shows good judgment.\"",
    ] },
  { "title" = "Military campaigns", "paragraphs" = [
      "Upon succeeding his father, Suleiman began a series of military conquests, eventually leading to a revolt led by the Ottoman-appointed governor of Damascus in 1521. Suleiman soon made preparations for the conquest of Belgrade from the Kingdom of Hungary—something his great-grandfather Mehmed II had failed to achieve because of John Hunyadi's strong defense in the region. Its capture was vital in removing the Hungarians and Croats who, following the defeats of the Albanians, Bosniaks, Bulgarians, Byzantines and the Serbs, remained the only formidable force who could block further Ottoman gains in Europe. Suleiman encircled Belgrade on 28 August 1521, with 250,000 Turkish soldiers and over 100 ships. and began a series of heavy bombardments from an island in the Danube. Belgrade was made the seat of the Pashalik of Belgrade (also known as the Sanjak of Smederevo), and quickly became the second largest Ottoman town in Europe at over 100,000 people, surpassed only by Constantinople.",
      "The road to Hungary and Austria lay open, but Suleiman turned his attention instead to the Eastern Mediterranean island of Rhodes, the home base of the Knights Hospitaller. Suleiman built a large fortification, Marmaris Castle, that served as a base for the Ottoman Navy. Following a five-month siege, Rhodes capitulated and Suleiman allowed the Knights of Rhodes to depart. The conquest of the island cost the Ottomans 50,000 to 60,000 dead from battle and sickness (Christian claims went as high as 64,000 Ottoman battle deaths and 50,000 disease deaths).",
      "As relations between Hungary and the Ottoman Empire deteriorated, Suleiman resumed his campaign in Central Europe, and on 29 August 1526 he defeated Louis II of Hungary (1506–1526) at the Battle of Mohács. The Hungarian army, encouraged by the nobility to engage prematurely, launched a frontal assault that collapsed under coordinated Ottoman counterattacks. King Louis and much of the Hungarian aristocracy were killed, resulting in the destruction of the royal army and the end of the Jagiellonian dynasty in Hungary and Bohemia. The aftermath saw the partition of Hungary between the Ottoman Empire, the Habsburg monarchy, and the Principality of Transylvania. The battle marked the beginning of sustained Ottoman–Habsburg wars and the decline of Hungary as an independent power. Upon encountering the lifeless body of King Louis, Suleiman is said to have lamented: \"I came indeed in arms against him; but it was not my wish that he should be thus cut off before he scarcely tasted the sweets of life and royalty.\" While Suleiman was campaigning in Hungary, Turkmen tribes in central Anatolia (in Cilicia) revolted under the leadership of Kalender Çelebi.",
    ] },
  { "title" = "Legal and political reforms", "paragraphs" = [
      "While Sultan Suleiman was known as \"the Magnificent\" in the West, he was always Kanuni Suleiman or \"The Lawgiver\" (قانونی) to his Ottoman subjects. The overriding law of the empire was the Shari'ah, or Sacred Law, which as the divine law of Islam was outside of the Sultan's powers to change. Yet an area of distinct law known as the Kanuns (قانون, canonical legislation) was dependent on Suleiman's will alone, covering areas such as criminal law, land tenure and taxation. He collected all the judgments that had been issued by the nine Ottoman Sultans who preceded him. After eliminating duplications and choosing between contradictory statements, he issued a single legal code, all the while being careful not to violate the basic laws of Islam.",
      "It was within this framework that Suleiman, supported by his Grand Mufti Ebussuud, sought to reform the legislation to adapt to a rapidly changing empire. When the Kanun laws attained their final form, the code of laws became known as the kanun‐i Osmani (قانون عثمانی), or the \"Ottoman laws\". Suleiman's legal code was to last more than three hundred years.",
      "The Sultan also played a role in protecting the Jewish subjects of his empire for centuries to come. In late 1553 or 1554, on the suggestion of his favorite doctor and dentist, the Spanish Jew Moses Hamon, the Sultan issued a firman (فرمان) formally denouncing blood libels against the Jews. Furthermore, Suleiman enacted new criminal and police legislation, prescribing a set of fines for specific offenses, as well as reducing the instances requiring death or mutilation. In the area of taxation, taxes were levied on various goods and produce, including animals, mines, profits of trade, and import-export duties.",
    ] },
  { "title" = "Death and legacy", "paragraphs" = [
      "On 6 September 1566, Suleiman, who had set out from Constantinople to command an expedition to Hungary, died before an Ottoman victory at the siege of Szigetvár in Hungary at the age of 71 and his Grand Vizier Sokollu Mehmed Pasha kept his death secret during the retreat for the enthronement of Selim II. The sultan's body was taken back to Istanbul to be buried, while his heart, liver, and some other organs were buried in Turbék, outside Szigetvár. A mausoleum constructed above the burial site came to be regarded as a holy place and pilgrimage site. Within a decade a mosque and Sufi hospice were built near it, and the site was protected by a salaried garrison of several dozen men.",
      "The formation of Suleiman's legacy began even before his death. Throughout his reign literary works were commissioned praising Suleiman and constructing an image of him as an ideal ruler, most significantly by Celalzade Mustafa, chancellor of the empire from 1534 to 1557. Later Ottoman writers applied this idealised image of Suleiman to the Near Eastern literary genre of advice literature named naṣīḥatnāme, urging sultans to conform to his model of rulership and to maintain the empire's institutions in their sixteenth-century form. Such writers were pushing back against the political and institutional transformation of the empire after the middle of the sixteenth century, and portrayed deviation from the norm as it had existed under Suleiman as evidence of the decline of the empire. Western historians, failing to recognise that these 'decline writers' were working within an established literary genre and often had deeply personal reasons for criticizing the empire, long took their claims at face value and consequently adopted the idea that the empire entered a period of decline after the death of Suleiman. Since the 1980s this view has been thoroughly reexamined, and modern scholars have come to overwhelmingly reject the idea of decline, labelling it an \"untrue myth\".",
      "Suleiman's conquests had brought under the control of the Empire major Muslim cities (such as Baghdad), many Balkan provinces (reaching present day Croatia and Hungary), and most of North Africa. His expansion into Europe had given the Ottoman Turks a powerful presence in the European balance of power. Indeed, such was the perceived threat of the Ottoman Empire under the reign of Suleiman that Austria's ambassador Busbecq warned of Europe's imminent conquest: \"On [the Turks'] side are the resources of a mighty empire, strength unimpaired, habituation to victory, endurance of toil, unity, discipline, frugality and watchfulness ... Can we doubt what the result will be? ... When the Turks have settled with Persia, they will fly at our throats supported by the might of the whole East; how unprepared we are I dare not say.\" Suleiman's legacy was not, however, merely in the military field. The French traveler Jean de Thévenot bears witness a century later to the \"strong agricultural base of the country, the well being of the peasantry, the abundance of staple foods and the pre-eminence of organization in Suleiman's government\".",
    ] },
]

[articles.tr]
text = "I. Süleyman (Osmanlıca: سلطان سليمان اول Sultân Süleymân-ı Evvel, divan edebiyatındaki mahlasıyla Muhibbi; 6 Kasım 1494, Trabzon - 7 Eylül 1566, Zigetvar), Osmanlı İmparatorluğu'nun 10."
title = "I. Süleyman"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._S%C3%BCleyman"
intro = [
  "I. Süleyman (Osmanlıca: سلطان سليمان اول Sultân Süleymân-ı Evvel, divan edebiyatındaki mahlasıyla Muhibbi; 6 Kasım 1494, Trabzon - 7 Eylül 1566, Zigetvar), Osmanlı İmparatorluğu'nun 10. padişahı ve 89. İslam halifesidir. Batı'da Muhteşem Süleyman, Doğu'da ise adaletli yönetimine atfen Kanûnî Sultan Süleyman (Osmanlıca: قانونى سلطان سليمان) olarak da bilinmektedir. 1520'den 1566'daki ölümüne kadar, yaklaşık 46 yıl boyunca Osmanlı İmparatorluğu'na hükmetti. Toplamda 13 kez sefere çıktı ve saltanatının 10 yıl, 1 ayını seferlerde geçirdi. Osmanlı İmparatorluğu'nda en uzun süre hüküm süren ve en uzun süre sefer yapan padişahtır. Ayrıca 25 kez sefere çıkan Fatih Sultan Mehmet'ten sonra en çok sefere çıkan ikinci padişahtır.",
  "Şehzadeliği döneminde Süleyman, sırasıyla Şarkî Karahisar, Bolu ve Kefe'de sancakbeyi olarak görev yaptı. Babası I. Selim'in padişah olmasıyla birlikte, 1513 yılında Saruhan Sancakbeyi olarak atandı. Burada daha sonra başdanışmanı olacak olan Pargalı İbrahim ile yakın bir arkadaşlık kurdu. Babasının ölümü üzerinde, 30 Eylül 1520'de tahtın tek varisi olarak padişah oldu. Saltanatına Orta Avrupa ve Akdeniz'deki Hıristiyan güçlere karşı seferler düzenleyerek başladı; 1521'de Belgrad'ı fethetti ve ardından 1522'de Rodos Adası'nı fethetti. Ağustos 1526'da Mohaç Muharebesi'nde Macaristan'ın askerî gücünü kırdı ve büyük bir kısmını topraklarına kattı. Yaklaşık iki saat süren bu muharebe, tarihin en kısa süreli meydan savaşlarından biri olarak kabul edilir. Süleyman, Osmanlı İmparatorluğu'nun ekonomik, askeri ve siyasi gücünün zirvesine hükmederek, 16. yüzyıl Avrupasının önde gelen hükümdarlarından biri haline geldi. Süleyman, 1529'daki Viyana Kuşatması'nda fetihleri kontrol altına alınmadan önce, Hristiyanların kaleleri olan Belgrad ve Rodos'un yanı sıra Macaristan'ın büyük bölümünün fethedilmesinde Osmanlı ordularına bizzat liderlik etti. Safevîlerle olan çatışmasında Orta Doğu'nun büyük bir bölümünü ve Cezayir'e kadar Kuzey Afrika'nın geniş alanlarını ilhak etti. Onun yönetimi altında Osmanlı donanması, Akdeniz'den Kızıldeniz'e ve Basra Körfezi'ne kadar denizlere hâkim oldu. Zigetvar Kuşatması'nın sonlanmasından bir gün önce, 7 Eylül 1566'da 71 yaşındayken öldü.",
  "Genişleyen bir imparatorluğun başında bulunan Süleyman, toplum, eğitim, vergi ve ceza hukuku ile ilgili önemli hukuki değişiklikleri bizzat başlattı. Onun reformları, imparatorluğun baş kadısı Ebussuud Efendi ile birlikte yürütülerek Osmanlı hukukunun iki biçimi olan sultani ve dini hukuk arasındaki ilişkiyi uyumlu hale getirdi. Süleyman, aynı zamanda seçkin bir şair ve kuyumcuydu; Osmanlı İmparatorluğu'nun sanatsal, edebi ve mimari gelişiminde \"Altın Çağ\" dönemini yöneten büyük bir kültür hamisi oldu. Süleyman, Osmanlı geleneğini bozarak, hareminden bir kadın olan, Sünni İslam'a geçen ve kızıl saçları nedeniyle Batı Avrupa'da Roxelana adıyla ünlenen Rutenya kökenli bir Ortodoks Hristiyan olan Hürrem Sultan ile evlendi. Süleyman'ın 46 yıllık iktidarının ardından, 1566'da ölümünün ardından yerine oğlu II. Selim geçti. Süleyman'ın diğer potansiyel varislerinden Mehmed ve Mustafa öldüler; Mehmed 1543'te çiçek hastalığından öldü, Mustafa ise 1553'te sultanın emriyle boğularak öldürüldü. Diğer oğlu Bayezid ise bir isyanın ardından dört oğluyla birlikte 1561'de Süleyman'ın emriyle idam edildi.",
]
sections = [
  { "title" = "İlk yılları", "paragraphs" = [
      "6 Kasım 1494 tarihinde, Trabzon'da doğdu. Babası, Süleyman doğduğu zaman Trabzon valisi olan ve 1512 yılında padişah olarak tahta çıkan I. Selim, annesi ise Ayşe Hafsa Valide Sultan'dır. Çocukluk yıllarını, süt kardeşi Yahya Efendi ile birlikte Trabzon'da geçirdi. 7 yaşındayken; bilim, tarih, edebiyat, din ve askeriye alanlarında eğitim almak için İstanbul'a, Topkapı Sarayı'ndaki Enderûn'a gönderildi.",
      "1508 yılında Şarkî Karahisar Sancak Beyi olarak atandı ancak babası Selim'in kardeşi, Amasya Sancak Beyi Ahmed'in itirazı sonrasında Bolu'ya atandı. Ahmed'in buna da itiraz etmesi sebebiyle atandığı Kefe sancağına 1509 Temmuz'unda çıktı. Babası I. Selim'in 1512'de tahta çıkmasından sonra İstanbul ve Edirne'de oturdu. 1513 yılında Saruhan sancak beyliğine atandı. Burada, sonraları başdanışmanlarından biri olacak olan Pargalı İbrahim ile yakın bir arkadaşlık kurdu. Yaklaşık yedi yıllık Saruhan sancak beyliğinin ardından, 1520 yılının 21 Eylül'ü 22 Eylül'e bağlayan gecesi babası I. Selim'in ölümü üzerine İstanbul'a hareket etti ve tahtta hak iddia edecek başka kimse olmadığından herhangi bir mücadele vermeden 30 Eylül 1520 tarihinde onuncu Osmanlı padişahı olarak tahta çıktı. Tahta geçişinden birkaç hafta sonra Venedik Elçisi Bartolomeo Contarini, Süleyman'ı \"Yirmi altı yaşında, uzun fakat sırım gibi ve kibar görünüşlü. Boynu biraz fazla uzun, yüzü zayıf, burnu kartal gagası gibi kıvrık. Gölge gibi bıyığı ve küçük bir sakalı var. Cildi biraz soluk olsa da yüzü oldukça hoş. Derisi solgunluğa meyilli. Akıllı bir hükümdar olduğu söyleniyor ve herkes onun saltanatının hayırlı olacağını umuyor.\" şeklinde tanımlamıştır.",
    ] },
  { "title" = "Dönemindeki askerî ve siyasî gelişmeler", "paragraphs" = [
      "I. Süleyman'ın tahta geçmesinden kısa bir süre sonra Şam Beylerbeyi Canberdi Gazâlî, Süleyman'ın padişahlığını tanımadı ve kendi hükümdarlığını ilan ederek isyan başlattı. Merkezden gönderilen Ferhad Paşa komutasındaki birlikler, Zülkadriye Eyaleti'nde bulunan kuvvetler ve Şam'daki kuvvetlerin etkinlikleri sonucunda Şam yakınlarında 27 Ocak 1521 tarihinde yapılan Mastaba Muharebesi sonucunda Gazali'nin yenilmesi ve öldürülmesiyle isyan bastırıldı. Gazali'nin yerine Şam Beylerbeyliği'ne Ayas Mehmed Paşa atandı. Aynı yılın sonunda ise doğu cephesinin merkezi halinde bulunan Diyarbakır Beylerbeyi Bıyıklı Mehmed Paşa'nın vefatı üzerine yerine Divane Hüsrev Paşa tayin edildi.",
      "Süleyman ilk seferini 18 Mayıs 1521'de, Macaristan Krallığı'nın yönetimindeki Belgrad (o dönemdeki adı Nándorfehérvár) üzerine yaptı. Çevresindeki Böğürdelen, Zemun ve Salankamen şehirlerinin alınmasının ardından 1 Ağustos günü kuşatılan şehir, 29 Ağustos 1521 tarihinde teslim oldu. Avrupa'da gerçekleştirilebilecek fetih ve seferler için önemli bir merkez olan Belgrad'ın fethi hakkında Kutsal Roma Cermen İmparatorluğu'nun İstanbul elçisi \"Belgrad'ın ele geçirilmesi, Macaristan Krallığı'nın çöküşüne sebep olan olayların başlangıcıydı. II. Lajos'un ölümü, Budin'in ele geçirilişi ve Erdel'in işgaliyle devam eden süreçte Macaristan İmparatorluğu yıkılmış ve diğer ülkeleri de benzer sonu yaşayacağına dair bir korku sarmıştı.\" ifadelerini kullanmıştı.",
      "Ertesi yıl Süleyman, Hospitalier Şövalyeleri'nin bulunduğu Akdeniz'deki Rodos adasına karadan sefer düzenledi. Kuşatmaya katılacak olan Osmanlı donanması ise Haziran 1522'de adanın \"Cem Bahçesi\" körfezine demir attı. Süleyman'ın da arasında olduğu kara kuvvetleri, Marmaris'ten gemi yoluyla 28 Temmuz günü adaya geçti. Yaklaşık 100.000 kişi ve 400 gemiden oluşan Osmanlı ordusu, 6 aydan fazla süren kuşatma, 26 Aralık 1522'de şövalyelerin başı Philippe Villiers de L'Isle-Adam'ın teslim koşullarını kabul etmesi ve adanın hakimiyetinin Osmanlı İmparatorluğu'nun eline geçmesiyle sona erdi. Adada Hristiyan kimliğiyle yaşayan Cem Sultan'ın oğlu Murad ve Murad'ın oğulları boğduruldu, eşi ve iki kızı İstanbul'a gönderildi. Rodos'un alınmasının ardından şövalyelerin elinde bulunan Bodrum, Tahtalı ve Aydos kaleleri ile İstanköy ve Sömbeki adaları da alındı.",
    ] },
  { "title" = "Hukuki ve siyasi reformlar", "paragraphs" = [
      "Sultan Süleyman Batı'da \"Muhteşem\" olarak bilinirken, Osmanlı tebaasında Kanunî (Osmanlıca: قانونی) olarak bilinirdi. Kendisinden önceki dokuz Osmanlı Padişahı tarafından verilen tüm kararları topladı. Yinelemeleri ortadan kaldırdıktan ve çelişkili ifadeler arasında seçim yaptıktan sonra, İslam'ın temel yasalarını ihlal etmeyecek şekilde tek bir kanunname yayınladı. Süleyman bu çerçevede, mevzuatta reform yapmaya çalıştı ve bu reformlar, Şeyhülislamı Ebussuud Efendi tarafından desteklendi. Kanun yasaları nihai halini aldığında Kanun‐i Osmânî (Osmanlıca: قانون عثمانی) olarak bilindi. Süleyman'ın kanunnamesi üç yüz yıldan fazla devam etti.",
    ] },
  { "title" = "Kültür ve sanat alanındaki gelişmeler", "paragraphs" = [
      "I. Süleyman'ın padişahlığı döneminde, I. François tarafından İstanbul'a yollanan Fransız elçi Pierre Gilles'in yazdıklarına göre şehirde Bizans İmparatorluğu döneminden fazla yapı kalmamıştı. Döneminde birden fazla sultan külliye yaptıran Süleyman döneminde ilk olarak, babası I. Selim döneminde yapımına başlanılan I. Selim Külliyesi'nin yapımı tamamlanırken; oğlu Mehmed için Şehzadebaşı Külliyesi ve kendisi için, Osmanlı mimarisinin en önemli örneklerinden biri olarak kabul edilen Süleymaniye Külliyesi yapıldı. Yine padişahın yakınlarının külliyeleri; Rüstem Paşa Külliyesi, Sokollu Mehmed Paşa Külliyesi, Kılıç Ali Paşa Külliyesi, Haseki Külliyesi ve Mihrimah Sultan külliyeleri (Üsküdar ve Edirnekapı'da olmak üzere iki tane), Hadım İbrahim Paşa Külliyesi, Kara Ahmed Paşa Külliyesi de bu dönemde inşa edildi. Öte yandan nüfus artışına bağlı olarak İstanbul'da çekilen su sıkıntısının önüne geçmek amacıyla su tesisleri yenilendi ve Kırkçeşme su sistemi kuruldu.",
      "Bu imar faaliyetlerinde başı çeken kurum, saraya bağlı olarak çalışan ve devlet sınırlarındaki her türlü resmî inşaat işlerini yürüten Hassa Mimarlar Ocağı ile başındaki hassa mimarbaşı idi. Süleyman tahta çıktığı dönemde hassa mimarbaşı, I. Selim döneminde göreve gelen Acem Ali'ydi. 1538 veya 1539 yılında ölen Acem Ali'nin ardından yerine gelen ve Süleyman döneminde yapılan mimari eserlerin çoğunda imzası bulunan Mimar Sinan, Osmanlı döneminin en büyük mimarlarından biri olarak kabul edilmektedir.",
      "I. Süleyman'ın saltanatı döneminde yetişen başlıca şairler arasında Fuzûlî, Bâki, Pîr Sultan Abdal ve Bağdatlı Ruhi gösterilmektedir. Matrakçı Nasuh ise dönemin önemli ressam, tarihçi ve minyatür sanatçılarındandı. Yine bu çağda yaşayan ve Süleymannâme'yi yazan şehnameci Arifî, nakkaş Nigarî ve hattat Ahmed Karahisarî de dönemin önde gelen sanatçıları arasında yer almaktadır.",
    ] },
]

[articles.ja]
text = "スレイマン1世（Kanuni Sultan Süleyman I, オスマントルコ語: سلطان سليمان اول, ラテン文字転写: Sultān Suleimān-i evvel, トルコ語: I. Süleyman、 1494年11月6日 - 1566年9月6日）は、オスマン帝国の第10代皇帝（在位：1520年 - 1566年）。9代皇帝セリム1世の子。 46年の長期にわたる在位の中で13回もの対外遠征を行い、数多くの軍事的成功を収めてオスマン帝国を最盛期に導いた。英語では「壮麗帝（the Magnificent）」のあだ名で呼ばれ、日本ではしばしばスレイマン大帝と称される。トルコでは法典を編纂し帝国の制度を整備したことから「立法帝（カーヌーニー、 オスマントルコ語: القانونى, ラテン文字転写: al‐Qānūnī, トルコ語: Kanuni）」のあだ名で知られている。 名前のスレイマン（Süleyman）とは、ユダヤ教やキリスト教と共にイスラム教でも聖典とされる旧約聖書に記録された古代イスラエルの王、「ソロモン王」のアラビア語形である「スライマーン」（アラビア語: سليمان, Sulaymān）のトルコ語発音である。 またオスマン帝国の歴史において「スレイマン」の名を持つ最初の皇帝であることから「スレイマン1世」と呼ばれるが、まれにバヤズィト1世がアンカラの戦いでティムールに敗れた直後にエディルネで君臨したバヤズィト1世の長男スレイマン・チェレビーを1世に数えることがあるので、その場合は「スレイマン2世」と呼ばれることもある。"
title = "スレイマン1世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%AC%E3%82%A4%E3%83%9E%E3%83%B31%E4%B8%96"
intro = [
  "スレイマン1世（Kanuni Sultan Süleyman I, オスマントルコ語: سلطان سليمان اول, ラテン文字転写: Sultān Suleimān-i evvel, トルコ語: I. Süleyman、 1494年11月6日 - 1566年9月6日）は、オスマン帝国の第10代皇帝（在位：1520年 - 1566年）。9代皇帝セリム1世の子。",
  "46年の長期にわたる在位の中で13回もの対外遠征を行い、数多くの軍事的成功を収めてオスマン帝国を最盛期に導いた。英語では「壮麗帝（the Magnificent）」のあだ名で呼ばれ、日本ではしばしばスレイマン大帝と称される。トルコでは法典を編纂し帝国の制度を整備したことから「立法帝（カーヌーニー、 オスマントルコ語: القانونى, ラテン文字転写: al‐Qānūnī, トルコ語: Kanuni）」のあだ名で知られている。",
  "名前のスレイマン（Süleyman）とは、ユダヤ教やキリスト教と共にイスラム教でも聖典とされる旧約聖書に記録された古代イスラエルの王、「ソロモン王」のアラビア語形である「スライマーン」（アラビア語: سليمان, Sulaymān）のトルコ語発音である。",
  "またオスマン帝国の歴史において「スレイマン」の名を持つ最初の皇帝であることから「スレイマン1世」と呼ばれるが、まれにバヤズィト1世がアンカラの戦いでティムールに敗れた直後にエディルネで君臨したバヤズィト1世の長男スレイマン・チェレビーを1世に数えることがあるので、その場合は「スレイマン2世」と呼ばれることもある。",
]
sections = [
  { "title" = "生涯", "paragraphs" = [
      "1494年11月6日、セリム1世の息子としてアナトリア半島北東のトラブゾンで誕生。マムルーク朝を滅ぼしてシリア、エジプトのアラブ地域を初めて征服した父が不在の間は所領としてあてがわれたマニサの軍事長官を務めていたが、父が在位わずか8年で1520年に没すると首都イスタンブールへ帰還・即位した。前回と前々回のスルタン死去の際には熾烈な後継者争いがあり、後継者になれなかった王子やその子らがほとんど全員処刑されるといった経緯があったが、セリム1世死去の際にはそうした争いはなく、スムーズにスレイマン1世が即位した。スレイマンの他に男児の記録はないことから、スレイマンが唯一の後継者候補だった可能性が示唆される。",
      "若くして東ヨーロッパから中東にまたがる帝国の支配者となったスレイマン1世は即位の同年にシリア知事の反乱に直面、翌1521年にアナトリア中央でイランのサファヴィー朝に通じた部族の反乱も勃発したが、スレイマン1世はいずれも1521年の内に鎮圧して足元を固め、ヨーロッパ方面に向けた遠征を計画した。",
      "1521年からは外征に乗り出し、ハンガリー王国からベオグラードを奪い取り、翌1522年のロドス包囲戦で聖ヨハネ騎士団からロドス島を奪うなど活発な外征を行った。この2ヶ所は曽祖父のメフメト2世が最後まで征服できなかったところであり、これにより帝国内におけるスレイマン1世の支持、評価は著しく向上した。また、ロドス島の征服によって3大陸にまたがるオスマン帝国領土内の海上交通のとげが取り除かれ、領土内の航行が円滑となった。",
    ] },
  { "title" = "スレイマン1世治下の帝国", "paragraphs" = [
      "スレイマン1世の治世でオスマン帝国は更に拡張したが、それは限界を迎えていた。度重なる遠征で財政は枯渇しかかっていて、新たな領土も維持費が莫大にかかるからである。ハンガリー・エジプト・イエメン・地中海沿岸はあまりにも中央から遠いため間接統治となり、総督が現地の募兵と守備兵で軍事力を担うことになった。また、海賊を取り込む方法で地中海を確保したが、陸軍を主眼に置いていたため補助戦力としかなりえず、ポルトガルとの争いで遅れを取っていた。",
      "一方、内政で法と官僚機構の整備が整えられ、地方の法を編集して地方法令集を生み出し、合わせて中央官僚の統制と帝国支配の要として統治法令集も編纂された。法を宗教の観点から見た場合違反かどうかの判定も行われ、その担当であるウラマーの教育課程及び上下関係も定めると共に、ウラマーの最高権威としてシェイヒュルイスラーム(イスラームの長老)という職種がスルタンの側近として重んじられるようになった。スレイマン1世の治世でエブッスード・エフェンディという人物がこの職業を務め、法の編纂とイスラム法による正当性を保障、文官として重要な役割を果たした。",
      "スレイマン1世は哲学などの学問や芸術を好み、「ムヒッビー（恋する者）」の筆名で詩作を行う詩人でもあった。また詩も流行したが、宮廷のゴシップをイスタンブールの大衆に伝える噂としての役割もあり、スレイマン1世とヒュッレムの結婚、皇子ムスタファの処刑、黒幕とされるリュステムの非難にまで及んでいる。詩人は上流階級をパトロンに求めている部分もあり就職の斡旋を依頼しているが、時に政治的背景も絡む場合もあるため、上記の記事は詩人ドゥカーギンザーデ・ヤフヤーがムスタファに同情的な軍人の心情を歌ったものとされている。",
    ] },
  { "title" = "評価", "paragraphs" = [
      "スレイマン1世の治世には軍事的に成功が続き、オスマン帝国がヨーロッパ諸国・イスラム諸国を圧倒したスレイマン1世の治世は栄光の時代として記憶され、「帝国の最盛期」と言われる。またイェニチェリなどの精強な軍事組織や中央集権的な行政制度が、スレイマン1世の時代に完成されると共にもっとも円滑に機能したと言われ、後にオスマン帝国が軍事的な衰退を続ける中で、「栄光のスレイマン1世の時代に立ち返ろう」という主張が繰り返されることになる。",
      "だが、しばしばオスマン帝国の軍事的衰退の原因とされるイェニチェリの急速な拡大などの軍事組織の構造変化も、スレイマン1世の時代に始まったものである。軍事的弛緩はスレイマン1世の晩年に始まっていたと考えることができ、事実、スレイマン1世の死後20年たって、16世紀末イランのサファヴィー朝に名君アッバース1世が現れると、スレイマン1世の治世に獲得されたイラク、アゼルバイジャンの領土は17世紀前半に奪還された。",
      "このほか、フランスと同盟を結んだ際にフランス人に対する領事裁判権や租税免除などの恩恵的な特権を与えた（後にイギリスやオランダにも適用された）ことも、当時は国力差が圧倒的だったため、友好国への恩恵としてのみ機能しており、社会への実害はなかったものの、後にオスマン帝国が衰退するにつれて不平等条約化し、列強の介入要因となって帝国を苦しめることとなる。加えて皇帝自らが政務を行うことが少なくなり、実権は大宰相の手へと移っていった。",
    ] },
]

[articles.ko]
text = "쉴레이만 1세(오스만 튀르크어: سليمان, 튀르키예어: I. Süleyman, 1494년 11월 6일 - 1566년 9월 5일)는 오스만 제국의 제10대 술탄이다(재위 1520년 9월 22일 - 1566년 9월 6일)."
title = "쉴레이만 1세"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EC%89%B4%EB%A0%88%EC%9D%B4%EB%A7%8C_1%EC%84%B8"
intro = [
  "쉴레이만 1세(오스만 튀르크어: سليمان, 튀르키예어: I. Süleyman, 1494년 11월 6일 - 1566년 9월 5일)는 오스만 제국의 제10대 술탄이다(재위 1520년 9월 22일 - 1566년 9월 6일). 군사전략가로서의 능력이 뛰어났던 그는 46년이라 긴 치세 동안 세 대륙을 가로지르며 13차례의 대외원정을 실행에 옮겨 수많은 군사적 업적을 쌓음으로써 오스만 제국의 최전성기를 이룩하였다.",
  "서구인들은 그를 ‘장려한 쉴레이만(the Magnificent)’이라는 별명으로 불렸으며, 한국에서는 흔히 ‘쉴레이만 대제’로 번역된다. 터키에서는 법전을 편찬하여 제국의 제도를 정비한 업적을 높이 사 ‘입법자(Kanuni; 아랍어: القانونى al‐Qānūnī)’라는 별명으로 부르고 있다. 그의 이름 쉴레이만은 유대교와 기독교와 더불어 이슬람교에서도 경전으로 추앙받는 구약성서에 기록된 고대 이스라엘의 왕 솔로몬의 튀르키예어식 발음이다.",
  "당시 이스탄불에 주둔했던 신성로마제국의 한 대사는 쉴레이만에 대해 ‘도리에 어긋나는 모든 것들을 맹렬히 공격하고 무너뜨린 인물’이라며 그를 평했다. 그는 또한 쉴레이만을 작렬하게 내리치는 천둥과 번개의 모습에 비유하기도 했다.",
]
sections = [
  { "title" = "어린 시절", "paragraphs" = [
      "쉴레이만은 1494년 트라브존에서 오스만 제국의 군주 셀림 1세의 아들로 태어났다. 그는 열다섯 살이 되었을 때, 경험이 풍부한 대신의 도움을 받아 소아시아 서부 지방의 마니사 총독직을 맡았다. 또한 부황이 외국으로 출정을 나가면 미래의 군주로서 최선을 다해 국가의 일을 처리했다. 이때부터 그는 나라를 통치하는 데 필요한 능력을 키워나갔으며, 관용을 베푸는 황제가 되기 위한 노력도 게을리 하지 않았다. 1520년 3월에 셀림 1세가 죽자 26살의 젊은 나이에 제위에 오른 쉴레이만은 남북을 오가며 대제국을 지휘하여 혁혁한 성과를 올렸다.",
    ] },
  { "title" = "영토확장", "paragraphs" = [
      "쉴레이만이 첫 번째 공격 목표는 베오그라드와 로도스섬이다. 두곳 모두 부왕때 정복에 실패했었다. 당시 이 두 지역은 모두 중요한 전략적 요충지였다. 베오그라드는 헝가리인이 점령하고 있었기에 유럽을 향한 영토확장에 걸림돌이 되었다. 로도스섬은 1309년 이래 오랫동안 성 요한 기사단의 지배 아래 있었는데, 기사단은 이슬람 상선에 대한 습격과 약탈을 자행하며 오스만과 아라비아의 밀접한 교류를 방해해 왔다.",
      "쉴레이만이 즉위한 지 1년 후, 그는 군사 10만을 이끌고 3주 동안 베오그라드를 맹렬하게 공격했다. 몇 번의 교전 끝에 베오그라드는 마침내 오스만군의 공격에 함락되었다. 그 후 1년 뒤 쉴레이만은 직접 로도스섬을 정복했다. 반년의 시간 동안 병사 5만 명을 잃었지만 쉴레이만은 드디어 아버지 대(代)에 이루지 못한 사업을 완수했다.",
      "1522년 12월 22일, 지난 6개월간의 지리한 공방전 끝에 성 요한 기사단으로부터 항복을 받아내며 정복에 성공하였다. 슐레이만 1세가 10만 대군을 직접 이끌고 작전에 임하며 엄청난 물량을 쏟아부은 결과였다. 로도스섬은 이스탄불과 알레산드리아의 중간 지점에 위치하고 있었기에 해상 교통의 요충지였다. 이곳을 지배하던 성 요한 기사단은 종교적 신념에 입각하여 이슬람 선박에 대해 습격과 해적행위를 하였기 때문에 오스만과 이집트간 해상교역을 방해하고 있었다.",
    ] },
  { "title" = "내치", "paragraphs" = [
      "쉴레이만은 전쟁에서 혁혁한 공로를 세웠을 뿐만 아니라 국가 통치에도 탁월한 재능을 보였다. 쉴레이만이 국내 통치에 심혈을 기울인 결과 오스만 제국은 번영과 번성을 이루었다. 쉴레이만의 능력과 안목이 가장 돋보인 것은 그가 구상한 입법에서였다. 《군하총회》, 《이집트 법전》, 《쉴레이만 법전》 모두 그의 손에서 이루어졌다.",
      "나라의 경제가 활발히 이루어지기 위해서는 공평한 법률 계약으로 사유재산의 보호를 보장해야 한다는 점을 깨달은 쉴레이만은 저명한 법학가들에게 법률을 조정하여 제정하도록 위탁했다. 그 중 《군하총회》는 오스만 제국 역사상 최대의 법전으로 이 법전이 발효된 후 귀족 계층 내부의 혼란이 사라졌고, 제국의 봉건 제도를 안정시키는 데에도 많은 도움이 되었다. 《쉴레이만 법전》은 토지, 전쟁, 군사제도, 지방 치안과 형법 등 각 방면에 대해 세세한 부분까지 규정하고 있다. 그는 이렇게 완벽한 법률을 바탕으로 복잡하고 다양한 계층과 광활한 영토의 대제국을 질서정연하게 통치할 수 있었다. 그래서 쉴레이만이 오랜 기간 전쟁을 했음에도 불구하고 누구 하나 원성을 높이지 않았고, 사회 질서가 확립되면서 백성들의 생활은 안정되었다.",
    ] },
  { "title" = "예술후원", "paragraphs" = [
      "또한 쉴레이만은 중요한 예술 후원자이기도 했다. 건축과 그림, 서예, 조명, 병기, 타일과 직물, 목제품, 금속제품 그리고 문학 등 모두가 그의 통치 기간 중에 꽃을 피웠다. 그는 어릴 때부터 시와 노래를 무척 좋아했으며, 출정 중에도 매일같이 일기를 써 훗날 《전쟁일록》이라는 책으로 펴냈다. 더불어 집정 기간 동안에 건축가 시난을 시켜 쉴레이마니예 모스크 등 많은 모스크를 건축했다.",
    ] },
  { "title" = "마지막 원정과 사망", "paragraphs" = [
      "1566년 5월 초, 쉴레이만 1세는 헝가리 원정을 위해 이스탄불을 떠났다. 이 원정은 쉴레이만에게 있어 13번째 원정이자, 최후의 원정이다. 이미 70대에 접어든 그의 건강은 악화일로였는데, 특히 20년 가까이 괴롭힌 통풍이 문제였다. 때문에 원정에서 쉴레이만은 대부분을 마차에서 지냈고, 원정로 상의 도시에 입성하는 의식을 치룰때만 말에 올랐다. 원정을 시작한지 50일째 되는 날에 파디샤와 대재상 소콜루 메흐메드 파샤가 이끄는 5만 명의 오스만 군대가 베오그라드에 도착했다.",
      "그곳에서 오스만 군대는 헝가리 서남쪽 시게트바르를 향해 진군하기 시작했다. 시게트바르 성채는 오스만-합스부르크 국경 지대에 위치한 요지로, 당시 2,300명가량의 병사가 니콜라스 즈리니의 지휘 아래에 수비중이었다. 오스만 군대는 시게트바르 성을 8월 초에 포위했고, 공성전은 약 1개월가량 지속되었다. 쉴레이만의 건강은 이 기간에 크게 악화되었다. 결국 1566년 9월 5일 1시 30분 경 죽음을 맞이했다. 오스만 군대가 시게트바르 성을 함락시키기 직전의 일이었다. 니콜라스 백작은 해질녁까지 저항하였으나, 결국 휘하의 군대와 함께 전사하고 말았다.",
    ] },
  { "title" = "결혼", "paragraphs" = [
