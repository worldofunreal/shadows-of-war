[articles.ar]
text = "كانت تشين ليانغيو (1574–1648) قائدة عسكرية في عهد أسرة مينغ، وُلدت في تشونغتشو، في المنطقة التي تُعرف اليوم بمقاطعة تشونغ في تشونغتشينغ. ربطها زواجها من ما تشيانشنغ بالإدارة الوراثية لنظام توسي في شيجو، لكن السجلات التاريخية تذكرها أيضاً قائدةً مستقلة نظّمت الجنود وقادتهم. شاركت في قمع تمرد بوزهو، وبعد وفاة ما تولّت قيادة قوات شيجو. وخلال الأزمات العسكرية في أواخر عهد مينغ، استدعاها البلاط مراراً للدفاع عن المنطقة ومساندة حملات أخرى."
