intro = [
  "كانت تشين ليانغيو (1574–1648) قائدة عسكرية في عهد أسرة مينغ، وُلدت في تشونغتشو، في المنطقة التي تُعرف اليوم بمقاطعة تشونغ في تشونغتشينغ. ربطها زواجها من ما تشيانشنغ بالإدارة الوراثية لنظام توسي في شيجو، لكن السجلات التاريخية تذكرها أيضاً قائدةً مستقلة نظّمت الجنود وقادتهم. شاركت في قمع تمرد بوزهو، وبعد وفاة ما تولّت قيادة قوات شيجو. وخلال الأزمات العسكرية في أواخر عهد مينغ، استدعاها البلاط مراراً للدفاع عن المنطقة ومساندة حملات أخرى.",
  "ووفقاً لسجل التاريخ المحلي في تشونغتشينغ، قاتلت تشين وابنها ما شيانغلين قوات تشانغ شيانزونغ في سيتشوان سنة 1634. ويخصص كتاب «تاريخ مينغ» لها ترجمة في قسم القادة العسكريين، وهو سجل مفصل على نحو غير مألوف لامرأة تمتعت بقيادة عسكرية معترف بها. كما يروي الكتاب حملاتها وتقاريرها العسكرية وطلبها مكافأة الجنود الذين قُتلوا. وتُظهر أوامر التعبئة أنها تلقت مهام قيادة مباشرة، ولم يقتصر دورها على إدارة أملاك زوجها. توفيت تشين سنة 1648. وتنبع أهميتها التاريخية من القوات التي قادتها والقرارات العسكرية التي اتخذتها بنفسها، لا من زواجها وحده.",
]
