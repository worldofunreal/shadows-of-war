[articles.en]
text = "Qin Liangyu (1574–1648) was a military commander of the Ming dynasty, born at Zhongzhou in Sichuan, now Zhong County in Chongqing. Her marriage to Ma Qiancheng connected her to Shizhu’s hereditary Tusi administration, but historical records also describe her in her own right as a commander who organized and led troops. She helped suppress the Bozhou rebellion and later took command of Shizhu’s forces after Ma’s death."
title = "Qin Liangyu"
lang = "en"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "A Ming commander who led Shizhu forces and defended the southwest during repeated military crises."
shortArticle = true
intro = [
  "Qin Liangyu (1574–1648) was a military commander of the Ming dynasty, born at Zhongzhou in Sichuan, now Zhong County in Chongqing. Her marriage to Ma Qiancheng connected her to Shizhu’s hereditary Tusi administration, but historical records also describe her in her own right as a commander who organized and led troops. She helped suppress the Bozhou rebellion and later took command of Shizhu’s forces after Ma’s death.",
  "During the military crises of the late Ming, the court repeatedly called Qin into service to defend the region and assist campaigns elsewhere. She mobilized soldiers, made operational decisions, and fought rebel forces in Sichuan. Chongqing’s local history records that in 1634 she and her son Ma Xianglin fought Zhang Xianzhong’s forces. The History of Ming includes Qin’s biography in its section on military figures, preserving an unusually detailed record of a woman exercising recognized command. The biography also recounts her military reports to the court and petitions for recognition of fallen soldiers. She died in 1648. Her historical importance rests on the troops she led and the decisions she made, not simply on her marriage.",
]
sections = []
sources = [
  { title = "Chongqing Local Records Office: Qin Liangyu", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "History of Ming, vol. 273: Qin Liangyu", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
]

[articles.es]
text = "Qin Liangyu (1574–1648) fue una comandante militar de la dinastía Ming. Nació en Zhongzhou, provincia de Sichuan, hoy distrito de Zhong, Chongqing. Su matrimonio con Ma Qiancheng la vinculó con la administración hereditaria tusi de Shizhu, pero las crónicas también la registran como comandante por derecho propio: organizó y condujo tropas. Participó en la represión de la rebelión de Bozhou y, tras la muerte de Ma, asumió el mando de las fuerzas de Shizhu."
title = "Qin Liangyu"
lang = "es"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "Comandante de la dinastía Ming, dirigió las fuerzas de Shizhu y defendió el suroeste en varias crisis militares."
shortArticle = true
intro = [
  "Qin Liangyu (1574–1648) fue una comandante militar de la dinastía Ming. Nació en Zhongzhou, provincia de Sichuan, hoy distrito de Zhong, Chongqing. Su matrimonio con Ma Qiancheng la vinculó con la administración hereditaria tusi de Shizhu, pero las crónicas también la registran como comandante por derecho propio: organizó y condujo tropas. Participó en la represión de la rebelión de Bozhou y, tras la muerte de Ma, asumió el mando de las fuerzas de Shizhu.",
  "Durante las crisis militares del final de los Ming, la corte volvió a convocarla para defender la región y apoyar campañas en otros territorios. Qin movilizó soldados, tomó decisiones operativas y combatió a fuerzas rebeldes en Sichuan. La historia local de Chongqing registra que en 1634 ella y su hijo Ma Xianglin lucharon contra las fuerzas de Zhang Xianzhong. La Historia de los Ming incluye una biografía de Qin en la sección dedicada a figuras militares, un registro inusualmente detallado de una mujer con mando reconocido. También conserva informes militares suyos y solicitudes de reconocimiento para soldados caídos. Murió en 1648. Su importancia histórica se basa en las tropas que dirigió y las decisiones que tomó, no solo en su matrimonio.",
]
sections = []
sources = [
  { title = "Oficina de Crónicas Locales de Chongqing: Qin Liangyu", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "《明史》卷二百七十三：秦良玉传", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
]

[articles.fr]
text = "Qin Liangyu (1574–1648) fut une commandante militaire de la dynastie Ming, née à Zhongzhou, dans l’actuel district de Zhong, à Chongqing. Son mariage avec Ma Qiancheng la lia à l’administration héréditaire tusi de Shizhu, mais les sources la décrivent aussi comme une cheffe militaire à part entière, qui organisait et conduisait des troupes. Elle participa à la répression de la révolte de Bozhou puis, après la mort de Ma, prit la tête des forces de Shizhu."
title = "Qin Liangyu"
lang = "fr"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "Commandante des Ming, elle dirigea les forces de Shizhu et défendit le sud-ouest lors de plusieurs crises militaires."
shortArticle = true
intro = [
  "Qin Liangyu (1574–1648) fut une commandante militaire de la dynastie Ming, née à Zhongzhou, dans l’actuel district de Zhong, à Chongqing. Son mariage avec Ma Qiancheng la lia à l’administration héréditaire tusi de Shizhu, mais les sources la décrivent aussi comme une cheffe militaire à part entière, qui organisait et conduisait des troupes. Elle participa à la répression de la révolte de Bozhou puis, après la mort de Ma, prit la tête des forces de Shizhu.",
  "Lors des crises militaires de la fin des Ming, la cour fit de nouveau appel à Qin pour défendre la région et soutenir des campagnes ailleurs. Elle mobilisa des soldats, prit des décisions opérationnelles et combattit des forces rebelles au Sichuan. Les archives locales de Chongqing indiquent qu’en 1634 elle affronta avec son fils Ma Xianglin les forces de Zhang Xianzhong. L’Histoire des Ming lui consacre une biographie dans sa section sur les figures militaires, témoignage particulièrement détaillé d’une femme investie d’un commandement reconnu. Le texte rapporte également ses comptes rendus militaires et ses demandes de récompense pour les soldats morts. Elle mourut en 1648. Son importance tient aux troupes qu’elle dirigea et à ses propres décisions, pas seulement à son mariage.",
]
