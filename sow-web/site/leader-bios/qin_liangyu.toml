[articles.de]
text = "Qin Liangyu (1574–1648) war eine Militärkommandeurin der Ming-Dynastie. Sie wurde in Zhongzhou geboren, im heutigen Kreis Zhong in Chongqing. Durch ihre Ehe mit Ma Qiancheng war sie mit der erblichen Tusi-Verwaltung von Shizhu verbunden; die Quellen schildern sie jedoch auch als eigenständige Befehlshaberin, die Truppen aufstellte und führte. Sie wirkte an der Niederschlagung des Aufstands von Bozhou mit und übernahm nach Ma Qianchengs Tod das Kommando über die Streitkräfte von Shizhu."
title = "Qin Liangyu"
lang = "de"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "Als Kommandeurin der Ming führte sie die Truppen von Shizhu und verteidigte den Südwesten in mehreren militärischen Krisen."
shortArticle = true
intro = [
  "Qin Liangyu (1574–1648) war eine Militärkommandeurin der Ming-Dynastie. Sie wurde in Zhongzhou geboren, im heutigen Kreis Zhong in Chongqing. Durch ihre Ehe mit Ma Qiancheng war sie mit der erblichen Tusi-Verwaltung von Shizhu verbunden; die Quellen schildern sie jedoch auch als eigenständige Befehlshaberin, die Truppen aufstellte und führte. Sie wirkte an der Niederschlagung des Aufstands von Bozhou mit und übernahm nach Ma Qianchengs Tod das Kommando über die Streitkräfte von Shizhu.",
  "Während der militärischen Krisen am Ende der Ming-Zeit zog der Hof Qin wiederholt zur Verteidigung der Region und zu Feldzügen in anderen Gebieten heran. Sie mobilisierte Soldaten, traf operative Entscheidungen und kämpfte gegen Rebellen in Sichuan. Laut der Lokalgeschichte von Chongqing trat sie 1634 gemeinsam mit ihrem Sohn Ma Xianglin den Truppen von Zhang Xianzhong entgegen. Die Geschichte der Ming widmet Qin im Abschnitt über Militärpersönlichkeiten eine Biografie und bewahrt damit einen ungewöhnlich ausführlichen Bericht über eine Frau mit anerkannter Befehlsgewalt. Sie enthält auch ihre Militärberichte an den Hof und ihre Bitten um Anerkennung gefallener Soldaten. Qin starb 1648. Ihre Bedeutung beruht auf den Truppen, die sie führte, und ihren eigenen Entscheidungen, nicht allein auf ihrer Ehe.",
]
sections = []
sources = [
  { title = "Amt für lokale Chroniken von Chongqing: Qin Liangyu", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "《明史》卷二百七十三：秦良玉传", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
]

[articles.it]
text = "Qin Liangyu (1574–1648) fu una comandante militare della dinastia Ming. Nacque a Zhongzhou, nell’attuale contea di Zhong, a Chongqing. Il matrimonio con Ma Qiancheng la collegò all’amministrazione ereditaria tusi di Shizhu, ma le fonti la descrivono anche come comandante in proprio, capace di organizzare e guidare truppe. Partecipò alla repressione della rivolta di Bozhou e, dopo la morte di Ma, assunse il comando delle forze di Shizhu."
title = "Qin Liangyu"
lang = "it"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "Comandante dei Ming, guidò le forze di Shizhu e difese il sud-ovest durante diverse crisi militari."
shortArticle = true
intro = [
  "Qin Liangyu (1574–1648) fu una comandante militare della dinastia Ming. Nacque a Zhongzhou, nell’attuale contea di Zhong, a Chongqing. Il matrimonio con Ma Qiancheng la collegò all’amministrazione ereditaria tusi di Shizhu, ma le fonti la descrivono anche come comandante in proprio, capace di organizzare e guidare truppe. Partecipò alla repressione della rivolta di Bozhou e, dopo la morte di Ma, assunse il comando delle forze di Shizhu.",
  "Durante le crisi militari della tarda dinastia Ming, la corte richiamò Qin più volte per difendere la regione e sostenere campagne in altri territori. Mobilitò soldati, prese decisioni operative e combatté forze ribelli nel Sichuan. Secondo la storia locale di Chongqing, nel 1634 affrontò le forze di Zhang Xianzhong insieme al figlio Ma Xianglin. La Storia dei Ming le dedica una biografia nella sezione sulle figure militari, una testimonianza insolitamente dettagliata di una donna cui fu riconosciuto il comando. Il testo conserva inoltre rapporti militari inviati da Qin alla corte e richieste di riconoscimento per i soldati caduti. Morì nel 1648. La sua importanza deriva dalle truppe che guidò e dalle decisioni che prese personalmente, non soltanto dal matrimonio.",
]
sections = []
sources = [
  { title = "Ufficio di storia locale di Chongqing: Qin Liangyu", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "《明史》卷二百七十三：秦良玉传", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
]

[articles.tr]
text = "Qin Liangyu (1574–1648), Ming Hanedanı döneminde yaşamış bir askerî komutandı. Bugünkü Chongqing’e bağlı Zhong ilçesinin bulunduğu Zhongzhou’da doğdu. Ma Qiancheng ile evliliği onu Shizhu’daki kalıtsal tusi yönetimine bağladı; ancak tarihî kayıtlar onu kendi adına birlikler kurup yöneten bir komutan olarak da anlatır. Bozhou Ayaklanması’nın bastırılmasına katıldı ve Ma’nın ölümünden sonra Shizhu kuvvetlerinin komutasını devraldı."
title = "Qin Liangyu"
lang = "tr"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "Ming komutanı olarak Shizhu kuvvetlerine liderlik etti ve çeşitli askerî krizlerde güneybatıyı savundu."
shortArticle = true
intro = [
  "Qin Liangyu (1574–1648), Ming Hanedanı döneminde yaşamış bir askerî komutandı. Bugünkü Chongqing’e bağlı Zhong ilçesinin bulunduğu Zhongzhou’da doğdu. Ma Qiancheng ile evliliği onu Shizhu’daki kalıtsal tusi yönetimine bağladı; ancak tarihî kayıtlar onu kendi adına birlikler kurup yöneten bir komutan olarak da anlatır. Bozhou Ayaklanması’nın bastırılmasına katıldı ve Ma’nın ölümünden sonra Shizhu kuvvetlerinin komutasını devraldı.",
  "Ming döneminin sonundaki askerî krizlerde saray, bölgeyi savunması ve başka seferleri desteklemesi için Qin’i tekrar tekrar görevlendirdi. Askerleri seferber etti, operasyon kararları aldı ve Sichuan’daki isyancı kuvvetlerle savaştı. Chongqing yerel tarih kaydına göre 1634’te oğlu Ma Xianglin ile birlikte Zhang Xianzhong’un kuvvetlerine karşı çarpıştı. Ming Tarihi, askerî kişilere ayrılan bölümde Qin’in biyografisine yer verir; bu, tanınmış komuta yetkisi kullanan bir kadın hakkında olağan dışı ölçüde ayrıntılı bir kayıttır. Biyografi, onun saraya gönderdiği askerî raporları ve savaşta ölen askerler için yaptığı ödül başvurularını da aktarır. Qin 1648’de öldü. Tarihsel önemi yalnızca evliliğinden değil, bizzat yönettiği birliklerden ve aldığı askerî kararlardan kaynaklanır.",
]
sections = []
sources = [
  { title = "Chongqing Yerel Tarih Ofisi: Qin Liangyu", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "《明史》卷二百七十三：秦良玉传", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
]

[articles.zh]
text = "秦良玉（1574—1648）是明朝将领，字贞素，出生于明重庆府忠州（今重庆市忠县）。她与石砫宣抚使马千乘成婚，进入西南土司军政体系；但史料记载她并非仅以家族身份出现，而是亲自统率军队、参与重大军事行动。万历年间，她随军参与播州平叛及援辽战事。马千乘去世后，她接掌石砫部众，继续承担朝廷征调与地方防守。"
title = "秦良玉"
lang = "zh"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "明朝将领秦良玉曾率领石砫军队，在多次军事危机中守卫西南地区。"
shortArticle = true
intro = [
  "秦良玉（1574—1648）是明朝将领，字贞素，出生于明重庆府忠州（今重庆市忠县）。她与石砫宣抚使马千乘成婚，进入西南土司军政体系；但史料记载她并非仅以家族身份出现，而是亲自统率军队、参与重大军事行动。万历年间，她随军参与播州平叛及援辽战事。马千乘去世后，她接掌石砫部众，继续承担朝廷征调与地方防守。",
  "《明史》卷二百七十三为秦良玉立传，记述她的军职、战斗、奉诏调兵、上奏军情及军中安排。明末流寇侵扰西南时，她多次组织防守；崇祯七年（1634），重庆地方志记载她与儿子马祥麟在夔州击退张献忠部。地方军政制度解释了她如何取得军职与兵员，但领兵、调度和临阵决策由她本人承担。史书还记载她曾为战死的兄弟请求优恤，并多次奉诏出征。相关记载保存了调令、战事和军事争论，使她的事迹不只是后世传说。她在万历、天启、崇祯数朝持续掌握军队，于1648年去世。她的历史意义在于凭本人名义行使统兵与决策职权，并进入正史将领传记，而非仅因婚姻关系被记住。",
  "《明史》还记载，秦良玉曾率石砫兵赴辽东援助明军，参与浑河作战；后来朝廷多次征调她入援京师。她不仅出兵，还向朝廷上奏说明战况、请求奖恤阵亡亲属，并对后续调兵提出意见。地方土司制度使石砫拥有世袭军队，但战时兵员由秦良玉亲自统率，她也需决定路线、粮运和防守部署。地方志将她的战事放在明末西南边防中叙述，而《明史》则保存朝廷任命、战役和奏疏，提供了不同层次的记录。",
  "她的军队曾被调往四川、贵州、辽东等地，说明其影响不限于一座城寨。面对叛乱与流寇，她与部属在多地作战，也经历失利和军事争论。这样的细节提醒读者，秦良玉不是传奇叙事里的抽象“女将”，而是明代军政体系中承担责任的将领。记载她的材料大多来自官修史书和地方志，因此许多家庭生活细节并不清楚；可确认的核心，是她长期领兵、受朝廷调遣并拥有自己的军事判断。",
]
sections = []
sources = [
  { title = "重庆市地方志办公室：秦良玉", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "《明史》卷二百七十三·秦良玉传", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
]

[articles.vi]
text = "Tần Lương Ngọc (1574–1648) là một nữ chỉ huy quân sự thời nhà Minh, sinh tại Trung Châu, nay thuộc huyện Trung, thành phố Trùng Khánh. Cuộc hôn nhân với Mã Thiên Thừa gắn bà với hệ thống thổ ty cha truyền con nối ở Thạch Trụ, nhưng sử liệu cũng ghi nhận bà là người tự tổ chức và chỉ huy quân đội. Bà tham gia dẹp loạn Bác Châu; sau khi Mã Thiên Thừa qua đời, bà tiếp quản quyền chỉ huy lực lượng Thạch Trụ. Trong những cuộc khủng hoảng quân sự cuối triều Minh, triều đình nhiều lần triệu bà về bảo vệ khu vực và hỗ trợ các chiến dịch khác."
title = "Tần Lương Ngọc"
lang = "vi"
url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html"
highlight = "Bà là nữ tướng nhà Minh, trực tiếp chỉ huy quân Thạch Trụ và bảo vệ vùng tây nam qua nhiều cuộc khủng hoảng."
shortArticle = true
intro = [
  "Tần Lương Ngọc (1574–1648) là một nữ chỉ huy quân sự thời nhà Minh, sinh tại Trung Châu, nay thuộc huyện Trung, thành phố Trùng Khánh. Cuộc hôn nhân với Mã Thiên Thừa gắn bà với hệ thống thổ ty cha truyền con nối ở Thạch Trụ, nhưng sử liệu cũng ghi nhận bà là người tự tổ chức và chỉ huy quân đội. Bà tham gia dẹp loạn Bác Châu; sau khi Mã Thiên Thừa qua đời, bà tiếp quản quyền chỉ huy lực lượng Thạch Trụ. Trong những cuộc khủng hoảng quân sự cuối triều Minh, triều đình nhiều lần triệu bà về bảo vệ khu vực và hỗ trợ các chiến dịch khác.",
  "Theo địa chí Trùng Khánh, năm 1634 bà cùng con trai Mã Tường Lân chiến đấu ở Tứ Xuyên chống lại quân của Trương Hiến Trung. Chính sử Minh sử dành cho Tần Lương Ngọc một tiểu truyện trong phần viết về các tướng lĩnh, lưu lại một ghi chép đặc biệt chi tiết về một phụ nữ được giao quyền chỉ huy quân sự chính thức. Sử sách còn ghi các cuộc hành quân, tấu trình của bà về tình hình chiến trường và việc bà xin triều đình khen thưởng binh sĩ tử trận. Các sắc lệnh điều quân cho thấy bà nhiều lần được giao nhiệm vụ chỉ huy trực tiếp, chứ không chỉ thay chồng trông coi lãnh địa. Bà mất năm 1648. Vai trò lịch sử của bà thể hiện qua đội quân bà chỉ huy và những quyết định quân sự do chính bà đưa ra, chứ không chỉ qua hôn nhân.",
]
sections = []
sources = [
  { title = "Văn phòng Địa chí Trùng Khánh: Tần Lương Ngọc", url = "https://dfz.cq.gov.cn/zqlswh/rwby_417819/202311/t20231102_12510540.html" },
  { title = "《明史》卷二百七十三：秦良玉传", url = "https://www.shidianguji.com/zh/book/LS0024/chapter/LS0024_1492" },
