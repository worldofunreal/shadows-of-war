[articles.en]
text = "Joan of Arc is a patron saint of France, honored as a defender of the French nation for her role in the siege of Orléans and securing the coronation of Charles VII of France during the Hundred Years' War. Claiming to be acting under divine guidance, she became a military leader who gained recognition as a savior of France."
title = "Joan of Arc"
lang = "en"
url = "https://en.wikipedia.org/wiki/Joan_of_Arc"
intro = [
  "Joan of Arc (French: Jeanne d'Arc [ʒan daʁk] ; Middle French: Jehanne Darc [ʒəˈãnə ˈdark]; c. 1412 – 30 May 1431) is a patron saint of France, honored as a defender of the French nation for her role in the siege of Orléans and securing the coronation of Charles VII of France during the Hundred Years' War. Claiming to be acting under divine guidance, she became a military leader who gained recognition as a savior of France.",
  "Joan was born to a propertied peasant family at Domrémy in northeast France. In 1428, she requested to be taken to Charles VII, later testifying that she was guided by visions from the archangel Michael, Saint Margaret, and Saint Catherine to help him save France from English domination. Convinced of her devotion and purity, Charles sent Joan, who was about seventeen years old, to Orléans as part of a relief army. She arrived at the city in April 1429, wielding her banner and bringing hope to the demoralized French army. Nine days after her arrival, the English abandoned the siege. Joan encouraged the French to aggressively pursue the English during the Loire Campaign, which culminated in another decisive victory at Patay, opening the way for the French army to advance on Reims unopposed, where Charles was crowned as the king of France with Joan at his side. These victories boosted French morale, paving the way for their final triumph in the Hundred Years' War several decades later.",
  "After Charles's coronation, Joan participated in the unsuccessful siege of Paris in September 1429 and the failed siege of La Charité in November. Her role in these defeats reduced the court's faith in her. In early 1430, Joan organized a company of volunteers to relieve Compiègne, which had been besieged by the Burgundians—French allies of the English. She was captured by Burgundian troops on 23 May. After trying unsuccessfully to escape, she was handed to the English in November. She was put on trial by Bishop Pierre Cauchon on accusations of heresy, which included blaspheming by wearing men's clothes, acting upon visions that were demonic, and refusing to submit her words and deeds to the judgment of the church. She was declared guilty and burned at the stake on 30 May 1431, aged about nineteen.",
  "In 1456, an inquisitorial court reinvestigated Joan's trial and overturned the verdict, declaring that it was tainted by deceit and procedural errors. Joan has been described as an obedient member of the Catholic Church, an early feminist, and a symbol of freedom and independence. She is popularly revered as a martyr. After the French Revolution, she became a national symbol of France. In 1920, Joan of Arc was canonized by Pope Benedict XV and, two years later, was declared one of the patron saints of France. She is portrayed in numerous cultural works, including literature, music, paintings, sculptures, theater, and film.",
]
sections = [
  { "title" = "Name", "paragraphs" = [
      "Joan of Arc's name was written in a variety of ways. There is no standard spelling of her name before the sixteenth century; her last name was usually written as \"Darc\" without an apostrophe, but there are variants such as \"Tarc\", \"Dart\" or \"Day\". Her father's name was written as \"Tart\" at her trial. She was called \"Jeanne d'Ay de Domrémy\" in Charles VII's 1429 letter granting her a coat of arms. Joan may never have heard herself called \"Jeanne d'Arc\". The first written record of her being called by this name is in 1455, 24 years after her death.",
      "She was not taught to read and write in her childhood, and so dictated her letters. She may later have learned to sign her name, as some of her letters are signed, and she may even have learned to read. Joan referred to herself in the letters as Jeanne la Pucelle (\"Joan the Maiden\") or as la Pucelle (\"the Maiden\"), emphasizing her virginity, and she signed \"Jehanne\". In the sixteenth century, she became known as the \"Maid of Orleans\".",
    ] },
  { "title" = "Birth and historical background", "paragraphs" = [
      "Joan of Arc was born c. 1412 in Domrémy, a small village in the Meuse valley now in the Vosges department in the north-east of France. Her date of birth is unknown and her statements about her age were vague. Her parents were Jacques d'Arc and Isabelle Romée. Joan had three brothers and a sister. Her father was a peasant farmer with about 20 hectares (50 acres) of land, and he supplemented the family income as a village official, collecting taxes and heading the local watch.",
      "She was born during the Hundred Years' War between England and France, which had begun in 1337 over the status of English territories in France and English claims to the French throne. Nearly all the fighting had taken place in France, devastating its economy. At the time of Joan's birth, France was divided politically. The French king Charles VI had recurring bouts of mental illness and was often unable to rule; his brother Louis, Duke of Orléans, and his cousin John the Fearless, Duke of Burgundy, quarreled over the regency of France. In 1407, the Duke of Burgundy ordered the assassination of the Duke of Orléans, precipitating a civil war. Charles of Orléans succeeded his father as duke at the age of thirteen and was placed in the custody of Bernard, Count of Armagnac; his supporters became known as \"Armagnacs\", while supporters of the Duke of Burgundy became known as \"Burgundians\". The future French king Charles VII had assumed the title of dauphin (heir to the throne) after the deaths of his four older brothers and was associated with the Armagnacs.",
      "Henry V of England exploited France's internal divisions when he invaded in 1415. The Burgundians took Paris in 1418. In 1419, the Dauphin offered a truce to negotiate peace with the Duke of Burgundy, but the duke was assassinated by the Dauphin's Armagnac partisans during the negotiations. The new duke of Burgundy, Philip the Good, allied with the English. Charles VI accused the Dauphin of murdering the Duke of Burgundy and declared him unfit to inherit the French throne. During a period of illness, Charles's wife Isabeau of Bavaria stood in for him and signed the Treaty of Troyes, which gave their daughter Catherine of Valois in marriage to Henry V, granted the succession of the French throne to their heirs, and effectively disinherited the Dauphin. This caused rumors that the Dauphin was not King Charles VI's son, but the offspring of an adulterous affair between Isabeau and the murdered duke of Orléans. In 1422, Henry V and Charles VI died within two months of each other; the 9-month-old Henry VI of England was the nominal heir of the Anglo-French dual monarchy as agreed in the treaty, but the Dauphin also claimed the French throne.",
    ] },
  { "title" = "Early life", "paragraphs" = [
      "In her youth, Joan did household chores, spun wool, helped her father in the fields and looked after their animals. Her mother provided Joan's religious education. Much of Domrémy lay in the Duchy of Bar, whose precise feudal status was unclear; though surrounded by pro-Burgundian lands, its people were loyal to the Armagnac cause. By 1419, the war had affected the area, and in 1425, Domrémy was attacked and cattle were stolen. This led to a sentiment among villagers that the English must be expelled from France to achieve peace. Joan had her first vision after this raid.",
      "Joan later testified that when she was thirteen, c. 1425, a figure she identified as Saint Michael surrounded by angels appeared to her in the garden. After this vision, she said she wept because she wanted them to take her with them. Throughout her life, she had visions of St. Michael, a patron saint of the Domrémy area who was seen as a defender of France. She stated that she had these visions frequently and that she often had them when the church bells were rung. Her visions also included St. Margaret and St. Catherine; although Joan never specified, they were probably Margaret of Antioch and Catherine of Alexandria—those most known in the area. Both were known as virgin saints who strove against powerful enemies, were tortured and martyred for their beliefs, and preserved their virtue to the death. Joan testified that she swore a vow of virginity to these voices. When a young man from her village alleged that she had broken a promise of marriage, Joan stated that she had made him no promises, and his case was dismissed by an ecclesiastical court.",
      "During Joan's youth, a prophecy circulating in the French countryside, based on the visions of Marie Robine of Avignon, promised an armed virgin would come forth to save France. Another prophecy, attributed to Merlin, stated that a virgin carrying a banner would put an end to France's suffering. Joan implied she was this promised maiden, reminding the people around her that there was a saying that France would be destroyed by a woman but would be restored by a virgin. In May 1428, she asked her uncle to take her to the nearby town of Vaucouleurs, where she petitioned the garrison commander, Robert de Baudricourt, for an armed escort to the Armagnac court at Chinon. Baudricourt harshly refused and sent her home. In July, Domrémy was raided by Burgundian forces which set fire to the town, destroyed the crops, and forced Joan, her family and the other townspeople to flee. She returned to Vaucouleurs in January 1429. Her petition was refused again, but by this time she had gained the support of two of Baudricourt's soldiers, Jean de Metz and Bertrand de Poulengy. Meanwhile, she was summoned to Nancy under safe conduct by Charles II, Duke of Lorraine, who had heard about Joan during her stay at Vaucouleurs. The duke was ill and thought she might have supernatural powers that could cure him. She offered no cures, but reprimanded him for living with his mistress.",
    ] },
  { "title" = "At the royal court in Chinon", "paragraphs" = [
      "Joan and Charles VII met for the first time in late February or early March 1429 at the royal court in Chinon, when she was seventeen and he was twenty-six. She told him that she had come to raise the siege of Orléans and to lead him to Reims for his coronation. They had a private exchange that made a strong impression on Charles; Jean Pasquerel, Joan's confessor, later testified that Joan told him she had reassured the Dauphin that he was Charles VI's son and the legitimate king.",
      "Charles and his council needed more assurance. They sent Joan to Poitiers to be examined by a council of theologians, who declared that she was a good person and a good Catholic. They did not render a decision on the source of Joan's inspiration, but agreed that sending her to Orléans could be useful to the king and would test whether her inspiration was of divine origin. Joan was then sent to Tours to be physically examined by women directed by Charles's mother-in-law Yolande of Aragon, who verified her virginity. This was to establish if she could indeed be the prophesied virgin savior of France, to show the purity of her devotion, and to ensure she had not consorted with the Devil.",
      "The Dauphin, reassured by the results of these tests, commissioned plate armor for her. She designed her own banner and had a sword brought to her from under the altar in the church at Sainte-Catherine-de-Fierbois. Around this time she began calling herself \"Joan the Maiden\", emphasizing her virginity as a sign of her mission.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Joan is one of the most studied people of the Middle Ages, partly because her two trials provided a wealth of documents. Her image, changing over time, has included being the savior of France, an obedient member of the Catholic Church, a protofeminist, and a symbol of freedom and independence.",
      "Joan's reputation as a military leader who helped drive the English from France began to form before her death. Just after Charles's coronation, Christine de Pizan wrote the poem Ditié de Jehanne D'Arc, celebrating Joan as a supporter of Charles sent by Divine Providence and reflecting French optimism after the triumph at Orléans. As early as 1429, Orléans began holding a celebration in honor of the raising of the siege on 8 May.",
      "After Joan's execution, her role in the Orléans victory encouraged popular support for her rehabilitation. Joan became a central part of the annual celebration, and by 1435, a play, Mistère du siège d'Orléans (Mystery of the Siege of Orléans), portrayed her as the vehicle of the divine will that liberated Orléans. The Orléans festival celebrating Joan continues in modern times.",
    ] },
]

[articles.es]
text = "Juana de Arco (en francés: Jeanne d'Arc;​ Domrémy, c. 1412 -Ruan, 30 de mayo de 1431),​ también conocida como la Doncella de Orleans (en francés: La Pucelle d'Orléans) fue una campesina que, sin educación ni formación militar, lideró ejércitos en defensa de Francia, se convirtió en heroína y luego fue quemada en la hoguera a los 19 años, siglos después fue canonizada, declarada santa patrona de Francia, venerada como defensora de la nación francesa por su papel en el asedio de Orleans y su insistencia en la coronación de Carlos VII de Francia durante la Guerra de los Cien Años."
title = "Juana de Arco"
lang = "es"
url = "https://es.wikipedia.org/wiki/Juana_de_Arco"
intro = [
  "-Ruan, 30 de mayo de 1431),​ también conocida como la Doncella de Orleans (en francés: La Pucelle d'Orléans) fue una campesina que, sin educación ni formación militar, lideró ejércitos en defensa de Francia, se convirtió en heroína y luego fue quemada en la hoguera a los 19 años, siglos después fue canonizada, declarada santa patrona de Francia, venerada como defensora de la nación francesa por su papel en el asedio de Orleans y su insistencia en la coronación de Carlos VII de Francia durante la Guerra de los Cien Años.",
  "Afirmando actuar bajo la guía divina, se convirtió en una líder militar que obtuvo reconocimiento como salvadora de Francia. Fue una joven campesina que es considerada una heroína de Francia por su papel durante la fase final de la guerra de los Cien Años. Juana afirmó haber tenido visiones del Arcángel Miguel, de Santa Margarita y de Catalina de Alejandría, quienes le dieron instrucciones para que ayudara a Carlos VII y liberara a Francia de la dominación inglesa en el período final de la guerra de los Cien Años. Carlos VII, que todavía no había sido coronado, envió a Juana al asedio de Orleans como integrante de un ejército de socorro y fue allí donde ganó gran fama porque el asedio fue levantado solo nueve días después. Otras rápidas victorias permitieron que Carlos VII fuera coronado rey de Francia en Reims. Este evento tan esperado elevó la moral francesa y allanó el camino para su victoria final.",
  "Tras la coronación de Carlos, Juana participó en el infructuoso asedio de París en septiembre de 1429 y en el fallido sitio de La Charité en noviembre. Su papel en estas derrotas redujo la confianza que la corte tenía en ella. A principios de 1430, Juana organizó una compañía de voluntarios para liberar Compiègne, que había sido sitiada por los borgoñones, aliados franceses de los ingleses. El 23 de mayo de 1430, Juana fue capturada en Compiègne por la facción borgoñona, un grupo de nobles franceses aliados con los ingleses. Después fue entregada a los ingleses​ y procesada por el obispo Pierre Cauchon por varias acusaciones.​ Declarada culpable, el duque Juan de Bedford mandó quemarla en la hoguera en Ruan el 30 de mayo de 1431, cuando tenía alrededor de 19 años de edad.​",
  "En 1456 un tribunal inquisitorial autorizado por el papa Calixto III examinó su juicio, anuló los cargos en su contra, la declaró inocente y la nombró mártir.​ En el siglo XVI la convirtieron en símbolo de la Liga Católica y en 1803 fue declarada símbolo nacional de Francia por decisión de Napoleón Bonaparte.​ Fue beatificada en 1909 y canonizada en 1920. Juana de Arco es uno de los nueve santos patronos secundarios de Francia y ha seguido siendo una destacada figura popular y cultural desde el momento de su muerte gracias a que muchos escritores, artistas y compositores se han inspirado en ella. Es venerada popularmente como mártir. Tras la Revolución Francesa, se convirtió en un símbolo nacional de Francia. En 1920, Juana de Arco fue canonizada por el papa Benedicto XV y, dos años más tarde, fue declarada una de las santas patronas de Francia. Aparece representada en numerosas obras culturales, entre ellas obras literarias, musicales, pictóricas, escultóricas y teatrales.",
]
sections = [
  { "title" = "Contexto histórico", "paragraphs" = [
      "La guerra de los Cien Años estalló en 1337 como una disputa por la herencia del trono francés, intercalada con períodos ocasionales de relativa paz. Casi todos los combates habían tenido lugar en Francia y el empleo por parte del ejército inglés de unas destructivas tácticas de tierra quemada habían devastado la economía gala.​ La población de Francia todavía no había recuperado su número previo a la pandemia de Peste negra de mediados del siglo XIV y los comerciantes estaban aislados de los mercados extranjeros. Antes de la aparición de Juana de Arco, los ingleses casi habían logrado su objetivo de una monarquía dual bajo el control inglés, y el ejército francés no había conseguido ninguna victoria importante en lo que dura una generación. En palabras de la historiadora Kelly DeVries, «El reino de Francia ni siquiera era una sombra de lo que había sido en el siglo XIII».​",
      "El rey francés en el momento de nacer Juana, Carlos VI, sufría episodios psicóticos​ que le incapacitaban a menudo para gobernar. Su hermano Luis, duque de Orleans, y su primo Juan Sin Miedo, duque de Borgoña, competían por la regencia de Francia y la tutela de los niños herederos al trono. Esta disputa incluía acusaciones de que Luis estaba teniendo una relación extramarital con la reina, Isabel de Baviera, y de que Juan Sin Miedo había secuestrado a los herederos del trono.​ El conflicto llegó a su punto álgido cuando el duque de Orleans fue asesinado en 1407 por orden del duque de Borgoña.​ Este asesinato dio inicio a una guerra civil.​ El joven Carlos de Orleans sucedió a su padre como duque y fue puesto bajo la custodia de su suegro, Bernardo, conde de Armagnac. Su facción se conoció como la facción «Armagnac», y el partido contrario dirigido por el duque de Borgoña se llamaba la «facción de Borgoña».",
      "Enrique V de Inglaterra se aprovechó de estas divisiones internas para invadir el reino francés en 1415, obteniendo una victoria resonante en Azincourt el 25 de octubre y apoderándose posteriormente de muchas ciudades del norte de Francia durante la campaña de 1417.​ En 1418, París fue tomada por los borgoñones, que masacraron al conde de Armagnac y a unos 2500 de sus seguidores.​ El futuro rey francés, Carlos VII, asumió el título de delfín, el heredero del trono, a la edad de catorce años, después de que murieran consecutivamente sus cuatro hermanos mayores.​ Su primer acto oficial significativo fue firmar un tratado de paz con el duque de Borgoña en 1419, pero esto terminó en desastre cuando los partidarios de Armagnac asesinaron a Juan Sin Miedo durante una reunión bajo la garantía de protección de Carlos. El nuevo duque de Borgoña, Felipe el Bueno, culpó a Carlos del asesinato y se alió con los ingleses, tras lo cual las fuerzas aliadas conquistaron una gran parte de Francia.​",
    ] },
  { "title" = "Biografía", "paragraphs" = [
      "Dado que los registros de la época no son del todo fiables y a las diferentes costumbres contemporáneas, no se sabe con certeza el nombre de Juana de Arco al nacer. Nació y creció en la aldea de Domrémy, en lo que entonces era la frontera nororiental del Reino de Francia.​ Todas sus firmas aparecen con la forma francesa media Jehanne, sin apellido. En el francés moderno, su nombre se traduce siempre como Jeanne d'Arc, lo que refleja los cambios ortográficos debidos a la evolución de la lengua a lo largo del tiempo. Su nombre de pila también se transcribe a veces como «Jeanneton» o «Jeannette», pero es posible que Juana haya eliminado el sufijo diminutivo -eton o -ette en la adolescencia.​",
      "El apellido de Arco es una traducción de d'Arc, que a su vez deriva en el francés del siglo XIX del nombre de su padre, Jacques d'Arc. Los apóstrofos nunca se empleaban en los apellidos franceses del siglo XV, lo que a veces lleva a confundir entre topónimos y otros nombres que empiezan por la letra D. Según los registros latinos, que reflejan ciertamente una diferencia, es más probable que el nombre de su padre fuera Darc.​​ La transliteración era fonética y los registros originales presentan su apellido en al menos nueve formas diferentes, como Dars, Day, Darx, Dare, Tarc, Tart o Dart.​​",
      "Para complicar aún más las cosas, los apellidos no eran universales en el siglo XV y la herencia del apellido no seguía necesariamente los patrones modernos. Juana declaró en el juicio que la costumbre local en su región natal era que las niñas llevaran el apellido de sus madres. La madre de Juana era conocida como Isabelle Romée y como Isabelle de Vouthon, ambas versiones tenían ligeras variaciones en la forma de escribirse el nombre y el apellido en diferentes documentos pero no se conserva ningún registro de la vida de Juana que demuestre que utilizaba el apellido de su madre o de su padre, pero a menudo se refería a sí misma como la Pucelle, que se traduce como «la Doncella». Antes de mediados del siglo XIX, que fue cuando Jeanne d'Arc y Juana de Arco se convirtieron en la forma estándar, la literatura y las obras artísticas que se refieren a ella la suelen describir como la Pucelle o la Doncella de Orleans.​ Su pueblo natal ha sido rebautizado como Domrémy-la-Pucelle para reflejar esa tradición.​",
    ] },
  { "title" = "Primeros años de vida", "paragraphs" = [
      "En su juicio, Juana declaró que tenía unos 19 años, lo que implica que pensaba que había nacido alrededor de 1412. Juana era analfabeta y se piensa que sus cartas fueron dictadas por ella a escribanos y que las firmó con la ayuda de otros.​ Juana era hija de Jacques d'Arc​ e Isabelle Romée,​, residentes en Domrémy, una villa que entonces estaba en la parte francesa del ducado de Bar.​​ Sus progenitores eran propietarios de veinte hectáreas de tierra y además su padre complementaba su trabajo como granjero con un puesto menor como funcionario de la aldea, recaudando impuestos y dirigiendo la guardia local.​ Vivían en una zona aislada del este de Francia que permaneció fiel a la Corona francesa a pesar de estar rodeada por tierras proborgoñonas.​",
      "Hubo diversas incursiones militares borgoñonas en la zona de Domrémy durante la infancia de Juana. En 1419 la guerra ya había empezado a afectar la región.​ En 1425, el ganado de la aldea fue robado por un bandolero de nombre Henri D'Orly,​ y en 1428 la comarca fue saqueada por un ejército borgoñón al mando de Antoine de Vergy, quien incendió la villa y destruyó los cultivos.​",
      "Juana tuvo su primera visión durante esta época.​ Testificó que cuando tenía trece años, alrededor de 1425, se le apareció una figura que ella identificó como San Miguel Arcángel, rodeado por ángeles, en el jardín de su padre.​​ Tras la visión, reportó haber llorado porque quería que se la llevaran con ellos.​ A lo largo de su vida siguió teniendo visiones de San Miguel, así como de Santa Margarita virgen y Santa Catalina de Alejandría.​​En 1428, un joven de su aldea alegó que ella había roto una promesa de matrimonio. El caso fue llevado ante un tribunal eclesiástico en la ciudad de Toul y denegado.​",
    ] },
  { "title" = "Eventos póstumos y juicio de rehabilitación", "paragraphs" = [
      "La ejecución de Juana no cambió la situación militar. Sus triunfos habían levantado la moral de los armagnacs, y los ingleses no fueron capaces de recuperar su impulso.​ La guerra de los Cien Años duró otros veintidós años más después de la ejecución de Juana. Carlos VII conservó la legitimidad como rey de Francia​ a pesar de la coronación rival que se celebró para Enrique VI, en la catedral de Notre Dame de París el 16 de diciembre de 1431.​ Antes de que Inglaterra pudiera reconstruir el poderío militar y su temida fuerza de arqueros, muy diezmados en 1429, perdieron su alianza con Borgoña con la firma del Tratado de Arras en 1435.​ El duque de Bedford murió ese mismo año y Enrique VI se convirtió en el rey más joven de la historia de Inglaterra en gobernar sin un regente. Su débil liderazgo fue probablemente el factor decisivo en el final de tan prolongado conflicto en Francia. La guerra terminó veintidós años después de la muerte de Juana con una victoria francesa en la batalla de Castillon en 1453,​ que condujo a la expulsión de los ingleses de toda Francia excepto de Calais.​",
      "La historiadora Kelly DeVries sostiene que el uso agresivo de la artillería y los asaltos frontales que había empleado Juana de Arco influyeron en las tácticas francesas en el resto de la guerra.​",
      "Tras el final de la guerra de los Cien Años se abrió un nuevo juicio póstumo sobre el caso de Juana de Arco. La ejecución de Juana había creado un lastre político para Carlos, implicando que su consagración como rey de Francia se había logrado gracias a las acciones de una hereje.​ El 15 de febrero de 1450, pocos meses después de recuperar Ruán, Carlos había ordenado a Guillaume Bouillé, teólogo y antiguo rector de la Universidad de París, que abriera una indagación.​ En una breve investigación, Bouillé entrevistó a siete testigos del proceso de Juana y concluyó que el juicio de Juana como hereje había sido arbitrario. Había sido una prisionera de guerra tratada como una presa política, y había sido condenada a muerte sin fundamento.​ El informe de Bouillé no pudo anular oficialmente el veredicto, pero abrió el camino para el posterior nuevo juicio.​",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Juana de Arco se convirtió en una figura semi legendaria durante los cuatro siglos posteriores a su muerte. Las principales fuentes de información sobre ella son las crónicas, como los cinco manuscritos originales de su juicio de condena que aparecieron en antiguos archivos durante el siglo XIX. Poco después, los historiadores también localizaron los registros completos de su juicio de rehabilitación, que contenía testimonios jurados de 115 testigos, y las notas originales en idioma francés en la transcripción en latín del juicio de condena. También aparecieron varias cartas contemporáneas, tres de las cuales llevan la firma de trazos inseguros de Juana, propios de alguien que apenas sabe escribir.​ Esta inusual riqueza de fuentes primarias ha llevado a Kelly DeVries a afirmar que «Ninguna persona de la Edad Media, hombre o mujer, ha sido objeto de más estudios».​",
      "Juana de Arco salió de un pueblo olvidado y saltó a la fama cuando era una campesina adolescente e iletrada. Los reyes franceses e ingleses habían justificado la interminable guerra mediante interpretaciones competitivas de derechos hereditarios, primero en relación con la reclamación de Eduardo III al trono francés y luego la de Enrique VI. El conflicto había sido una disputa legalista entre dos familias reales emparentadas, pero Juana lo transformó con una dimensión religiosa. En palabras del historiador Stephen Richey: «Convirtió lo que había sido una mera disputa dinástica que no importaba al pueblo llano, excepto por su propio sufrimiento, en una apasionada guerra popular de liberación nacional».​ Richey también expresa la amplitud de su eco posterior:",
      "Desde la poetisa Christine de Pizan (1364-1430) hasta la actualidad, las mujeres han considerado a Juana como un ejemplo positivo de mujer valiente y activa. Ella se movía dentro de una tradición religiosa que creía que una persona excepcional de cualquier estamento de la sociedad podría recibir una llamada divina. Parte de la ayuda más importante que tuvo provino de mujeres: la suegra de Carlos VII, Yolanda de Aragón, confirmó la virginidad de Juana y financió su expedición a Orleans. Juana, condesa de Luxemburgo, tía del conde de Luxemburgo que la mantuvo encarcelada en Compiègne, alivió sus condiciones de cautiverio y pudo retrasar su entrega a los ingleses. Finalmente, Ana de Borgoña, duquesa de Bedford y esposa del regente de Inglaterra, declaró a Juana virgen durante las investigaciones previas al juicio.​",
    ] },
]

[articles.fr]
text = "Jeanne d'Arc, dite « la Pucelle », née vers 1412 à Domrémy, village partagé entre le duché de Bar au sud et la châtellenie de Vaucouleurs au nord (où elle vivait), et morte sur le bûcher le 30 mai 1431 à Rouen, capitale du duché de Normandie alors possession anglaise, est une héroïne de l'histoire de France, chef de guerre et sainte de l'Église catholique, surnommée posthumément « la Pucelle d’Orléans ». En 1429, cette jeune fille d'origine paysanne affirme qu'elle a reçu de la part des saints Michel, Marguerite d'Antioche et Catherine d'Alexandrie la mission de délivrer la France de l'occupation anglaise."
title = "Jeanne d'Arc"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Jeanne_d%27Arc"
intro = [
  "Jeanne d'Arc, dite « la Pucelle », née vers 1412 à Domrémy, village partagé entre le duché de Bar au sud et la châtellenie de Vaucouleurs au nord (où elle vivait), et morte sur le bûcher le 30 mai 1431 à Rouen, capitale du duché de Normandie alors possession anglaise, est une héroïne de l'histoire de France, chef de guerre et sainte de l'Église catholique, surnommée posthumément « la Pucelle d’Orléans ».",
  "En 1429, cette jeune fille d'origine paysanne affirme qu'elle a reçu de la part des saints Michel, Marguerite d'Antioche et Catherine d'Alexandrie la mission de délivrer la France de l'occupation anglaise. Elle parvient à rencontrer Charles VII, à conduire victorieusement les troupes françaises contre les armées anglaises, à lever le siège d'Orléans et à conduire le roi au sacre, à Reims, contribuant ainsi à inverser le cours de la guerre de Cent Ans.",
  "Capturée par les Bourguignons à Compiègne en 1430, elle est vendue aux Anglais par Jean de Luxembourg, comte de Ligny, pour la somme de dix mille livres. Elle est brûlée vive en 1431 après un procès en hérésie conduit par Pierre Cauchon, évêque de Beauvais et ancien recteur de l'université de Paris. Entaché de nombreuses irrégularités, ce procès fait l'objet d'une révision ordonnée par le pape Calixte III en 1455. Un second procès est instruit qui conclut, en 1456, à l'innocence de Jeanne et la réhabilite entièrement. Grâce à ces deux procès dont les minutes ont été conservées, elle est l'une des personnalités françaises les mieux connues du Moyen Âge.",
  "Béatifiée en 1909 puis canonisée en 1920, Jeanne d'Arc devient une des deux saintes patronnes secondaires de la France en 1922 par la lettre apostolique Beata Maria Virgo in cælum Assumpta in gallicæ. Sa fête nationale est instituée par la loi en 1920 et fixée au 2e dimanche de mai.",
]
sections = [
  { "title" = "Contexte politique du royaume de France (1407–1429)", "paragraphs" = [
      "L'intervention de Jeanne d'Arc s'inscrit durant la seconde phase de la guerre de Cent Ans, qui voit le conflit séculaire entre les royaumes anglais et français s'enchevêtrer avec une guerre civile résultant de l'antagonisme des princes du sang de la dynastie royale des Valois.",
      "Depuis 1392, le roi de France Charles VI, dit « le Fol », est sujet à des troubles psychiques intermittents qui le contraignent progressivement à délaisser le pouvoir au profit de son Conseil, devenu bientôt le siège de sourdes luttes d'influences entre son frère, le duc Louis d'Orléans, et son cousin, Jean sans Peur, duc de Bourgogne. Ce dernier finit par faire assassiner le duc d'Orléans en novembre 1407, acte déclencheur d'une guerre civile entre les Bourguignons et la maison d'Orléans, dont les partisans sont ensuite appelés « Armagnacs » compte tenu de l'engagement du comte d'Armagnac aux côtés de son beau-fils, Charles d'Orléans, fils et successeur du duc assassiné.",
      "Profitant de ce conflit fratricide, le roi Henri V d'Angleterre, jeune, déterminé et déjà rompu aux armes, relance les hostilités franco-anglaises en réclamant des pans entiers du royaume de France. En 1415, l'armée du monarque Lancastre débarque en Normandie, assiège Harfleur puis taille en pièces la chevalerie française à Azincourt. À compter de 1417, Henri V entame la conquête méthodique de la Normandie et la parachève en s'emparant de la capitale ducale, Rouen, en 1419.",
    ] },
  { "title" = "Biographie", "paragraphs" = [
      "La naissance de Jeanne d'Arc se situe vraisemblablement dans la ferme familiale du père de Jeanne attenante à l'église de Domrémy, village situé aux marches de la Champagne, du Barrois et de la Lorraine, pendant la guerre de Cent Ans qui opposait le royaume de France au royaume d'Angleterre.",
      "Au début du XVe siècle, Domrémy se trouve imbriqué dans un territoire aux suzerainetés diverses. Sur la rive gauche de la Meuse, il peut relever du Barrois mouvant, pour lequel le duc de Bar, par ailleurs souverain dans ses États, prête hommage au roi de France depuis 1301. Mais il semble être plutôt rattaché à la châtellenie de Vaucouleurs, sous l'autorité directe du roi de France, qui y nomme un capitaine (le sire Robert de Baudricourt, au temps de Jeanne d'Arc). Enfin, l'église de Domrémy dépend de la paroisse de Greux, au diocèse de Toul, dont l'évêque est prince du Saint-Empire germanique.",
      "L'historienne médiéviste Colette Beaune précise que Jeanne est née dans la partie sud de Domrémy, côté Barrois mouvant, dans le bailliage de Chaumont-en-Bassigny et la prévôté d'Andelot. Les juges de 1431 corroborent cette origine, de même que les chroniqueurs Jean Chartier et Perceval de Cagny. Seul Perceval de Boulainvilliers considère pour sa part qu'elle est née dans la partie nord, qui relevait de la châtellenie de Vaucouleurs et donc du royaume de France dès 1291.",
    ] },
  { "title" = "Jeanne d'Arc et son époque : enjeux et problèmes", "paragraphs" = [
      "Les deux sources principales sur l'histoire de Jeanne d'Arc sont le procès de la condamnation de 1431 et le procès en nullité de la condamnation de 1455–1456. Le procès-verbal, l'instrumentum publicum, est rédigé quelques années plus tard sous le contrôle du principal greffier Guillaume Manchon par Thomas de Courcelles. Étant des actes juridiques, elles ont l'immense avantage d'être les retranscriptions les plus fidèles des dépositions. Mais elles ne sont pas les seules : des notices, des chroniques ont également été rédigées de son vivant, telle que la Geste des nobles François, la Chronique de la Pucelle, la Chronique de Perceval de Cagny, la Chronique de Monstrelet ou encore le Journal du siège d'Orléans et du voyage de Reims, le Ditié de Jeanne d'Arc de Christine de Pizan, le traité de Jean de Gerson. Il faut ajouter également les rapports des diplomates et autres informateurs (écrits de Jacques Gélu à Charles VII, registres du greffier du Parlement de Paris Clément de Fauquembergue).",
      "C'est Jules Quicherat qui rassemblera de manière quasi exhaustive, en cinq volumes, l'historiographie johannique entre 1841 et 1849. Entre le XVe siècle et le XIXe siècle, une foule d'écrivains, de politiciens, de religieux se sont approprié Jeanne d'Arc, et leurs écrits sont nombreux. Il faut donc être prudent dans la lecture des sources : peu d’entre elles sont contemporaines et elles réinterprètent souvent les sources originelles dans le contexte de leur interprète.",
      "Les procès sont des actes juridiques. Les deux procès ont la particularité d'avoir subi une influence politique évidente, et la méthode inquisitoire suppose bien souvent que l'accusée et les témoins ne répondent qu'aux questions posées. De plus, le procès de 1431 fut retranscrit en latin (vraisemblablement à l'insu de Jeanne), alors que les interrogatoires étaient en français.",
    ] },
  { "title" = "Sa reconnaissance", "paragraphs" = [
      "Dès le XVe siècle, les historiens tendent à occulter Jeanne et il n'est pas question de « miracles ». Ils sont au service du roi et le triomphe de celui-ci ne saurait s'accompagner de l'aide d'une sorcière ou d'une sainte.",
      "Le culte de son vivant ayant rapidement décliné, les siècles suivants ne lui portent qu'un intérêt inconstant. C'est principalement à partir du XIXe siècle que la figure historique de Jeanne d'Arc a été reprise par de nombreux auteurs pour illustrer ou cristalliser des messages religieux, philosophiques ou politiques.",
      "Christine de Pizan est un des rares auteurs contemporains à avoir fait l'éloge de Jeanne d'Arc, la nouvelle Judith. Villon mentionne en deux vers, parmi les Dames du temps jadis, « Jeanne la bonne Lorraine / Qu'Anglois brûlèrent à Rouen ».",
    ] },
]

[articles.de]
text = "Jeanne d’Arc [ʒanˈdaʁk] (* vermutlich 1412 in Domrémy, Lothringen; † 30. Mai 1431 in Rouen, Frankreich), auch Jehanne d’Arc, im deutschsprachigen Raum auch Johanna von Orléans oder Jungfrau von Orléans genannt, war eine französische Widerstandskämpferin im Hundertjährigen Krieg, einem bewaffneten Konflikt zwischen England und Frankreich im 14."
title = "Jeanne d’Arc"
lang = "de"
url = "https://de.wikipedia.org/wiki/Jeanne_d%E2%80%99Arc"
intro = [
  "Jeanne d’Arc [ʒanˈdaʁk] (* vermutlich 1412 in Domrémy, Lothringen; † 30. Mai 1431 in Rouen, Frankreich), auch Jehanne d’Arc, im deutschsprachigen Raum auch Johanna von Orléans oder Jungfrau von Orléans genannt, war eine französische Widerstandskämpferin im Hundertjährigen Krieg, einem bewaffneten Konflikt zwischen England und Frankreich im 14. und 15. Jahrhundert, und wurde deswegen später zur französischen Nationalheldin. Sie wird in der römisch-katholischen Kirche als Jungfrau und Heilige verehrt.",
  "Während des Hundertjährigen Krieges verhalf sie bei Orléans dem Dauphin und späteren französischen König Karl VII. zu einem Sieg über Engländer und Burgunder. Anschließend geleitete sie Karl zu seiner Königssalbung nach Reims. Nach der Niederlage der Franzosen in der Schlacht von Compiègne wurde Jeanne d’Arc am 23. Mai 1430 durch Johann II. von Luxemburg gefangen genommen, später an die Engländer ausgeliefert und schließlich in einem kirchlichen Verfahren des Bischofs von Beauvais, Pierre Cauchon, der pro-englisch eingestellt war, aufgrund verschiedener Anklagen verurteilt. Am 30. Mai 1431 wurde Jeanne d’Arc im Alter von 19 Jahren auf dem Marktplatz von Rouen auf dem Scheiterhaufen verbrannt.",
  "24 Jahre später strengte die Kurie einen Revisionsprozess an, in dem das Urteil aufgehoben und Jeanne zur Märtyrerin erklärt wurde. Im Jahr 1909 wurde sie von Papst Pius X. selig- und 1920 von Papst Benedikt XV. heiliggesprochen. Ihr Gedenktag ist der 30. Mai. An diesem Tag gedenkt man ihrer auch in der Church of England.",
]
sections = [
  { "title" = "Geschichtlicher Hintergrund", "paragraphs" = [
      "Im Hundertjährigen Krieg versuchte das englische Königshaus aufgrund erbrechtlicher Zusammenhänge seine Ansprüche auf den französischen Thron durchzusetzen. Vorausgegangen war der Tod des französischen Königs Karl IV. Der seit 1328 in England herrschende König Eduard III. erhob als Sohn von Isabelle, der Tochter Philipps IV. „des Schönen“, Anspruch auf den Thron. Französische Rechtsgelehrte akzeptierten diesen Anspruch jedoch nicht, da Frauen und deren Erben von der Thronfolge grundsätzlich ausgeschlossen waren. Schließlich wurde Philipp VI. als Nachfahre der Kapetinger aus der Nebenlinie der Valois am 28. Mai 1328 in Reims zum König gesalbt. Nach der Konfiszierung des englischen Herzogtums Guyenne 1337 durch Philipp VI. landete Eduard III. mit 4.000 Rittern und 10.000 Bogenschützen in der Normandie.",
      "1415 besiegte der englische König Heinrich V. die Franzosen in der Schlacht von Azincourt und erhob erneut Anspruch auf den französischen Thron. Englische Truppen hatten den Norden des Landes bis zur Loire besetzt. Orléans, der Schlüssel zur Überquerung des Flusses, war von John of Lancaster, einem Bruder Heinrichs V., eingekesselt (→ Belagerung von Orléans).",
    ] },
  { "title" = "Leben", "paragraphs" = [
      "Weder für Jeanne d’Arcs genauen Tag der Geburt noch für das Geburtsjahr gibt es eine zuverlässige Quelle. Sie wurde während der zweiten Hälfte des Hundertjährigen Krieges in Domrémy, einem kleinen Dorf an der Maas, um 1412 als Tochter von Jacques Darc (oder Jacques Tarc, Tare, Dart, Day, Daix) und Isabelle Romée in eine wohlhabende Bauernfamilie geboren. Die üblich gewordene Schreibweise „d’Arc“ taucht erst im 16. Jahrhundert auf, um die Nobilitierung der Familie anzudeuten.",
      "Mit 13 Jahren hatte Jeanne d’Arc laut Gerichtsprotokoll ihre ersten Visionen. In diesen hörte sie die Stimme der Heiligen Katharina. Später kamen die des Erzengels Michael und der Heiligen Margareta hinzu. Von ihnen erhielt sie den Befehl, Frankreich von den Engländern zu befreien und den Dauphin zum Thron zu führen. Die Erscheinungen wiederholten sich. Gegen Ende Dezember 1428 verließ Jeanne ihr Elternhaus.",
      "Am 1. Januar 1429, im Alter von fast 17 Jahren, versuchte Jeanne d’Arc zum ersten Mal, beim Stadtkommandanten der Festung Vaucouleurs, Robert de Baudricourt, vorzusprechen. Beim dritten Versuch bekam sie eine Audienz. Nachdem sie ihn nach einer erfolgreichen Prüfung ihres Glaubens überzeugt hatte, indem sie ein Kreuz küsste, gab er ihr am 22. Februar 1429 eine Eskorte (Jean de Metz, Bertrand de Poulengey; Anhänger des Dauphins) mit, die sie zu Karl VII. nach Chinon begleiten sollte, das sie am 5. März 1429 nach elf Tagen Ritt durch Feindesland erreichte. Ein Empfehlungsschreiben Baudricourts kündigte ihren Empfang am französischen Hof an. Sie wurde vom Dauphin empfangen. Jeanne überzeugte ihn, dass sie im Namen des Himmels gekommen sei, um Frankreich aus der misslichen Lage zu retten, und sicherte ihm zu, dass er in Reims zum König von Frankreich gesalbt würde. Niemand weiß genau, wie Jeanne den Dauphin überzeugte; es ist nur bekannt, dass sie sich mit ihm in ein Zimmer zurückzog und ihn angeblich an einer ihrer Visionen teilhaben ließ.",
    ] },
  { "title" = "Rezeption", "paragraphs" = [
      "Jeannes Mutter bemühte sich darum, den Prozess neu aufzurollen. 24 Jahre später, am 7. November 1455, eröffnete Karl VII. vor dem Hintergrund veränderter politischer Verhältnisse in der Kathedrale Notre-Dame de Paris einen Rehabilitationsprozess. Karl wollte, nachdem der Hundertjährige Krieg weitgehend zugunsten Frankreichs ausgegangen war, seine Position stärken und der anhaltenden Kritik wegen des Todesurteils gegen die immer noch populäre Jeanne d’Arc ein Ende setzen. Am 7. Juli 1456 wurde das Urteil verkündet: die vollständige Rehabilitierung – allerdings ohne diejenigen zur Verantwortung zu ziehen, die ihren Tod verursacht hatten, zumal die beiden Hauptverantwortlichen bereits verstorben waren.",
      "Am 18. April 1909 wurde Johanna von Papst Pius X. seliggesprochen und am 16. Mai 1920 von Benedikt XV. heiliggesprochen. Sie ist Schutzpatronin von Frankreich (mit den Heiligen Dionysius, Martin, Ludwig und Thérèse von Lisieux), der Städte Rouen und Orléans, der Telegrafie und des Rundfunks. Diese Heiligsprechung wurde als Zeichen der Versöhnung zwischen dem Vatikan und dem französischen Staat interpretiert, welcher für die Päpste nicht nur wegen des hohen katholischen Bevölkerungsanteils, sondern auch wegen Frankreichs Bedeutung als Kolonialmacht und als Schutzmacht der orientalischen Christen sehr wichtig war.",
      "Im 19. Jahrhundert wurde die Gestalt des heldenhaften Bauernmädchens zu einem Nationalmythos der Franzosen verklärt. Sie wurde zum Stoff von Romanen, Theaterstücken und Gesängen, die teilweise in die Weltliteratur eingingen. Da Jeanne sich selbst la Pucelle („die Jungfrau“) nannte, nahm ihr Heimatort diese Bezeichnung in seinen Namen auf und nannte sich Domrémy-la-Pucelle. Ihr Geburtshaus ist erhalten, daneben ist ihr ein Museum gewidmet. An ihrer Hinrichtungsstätte in Rouen steht heute ein Denkmal, daneben eine 1979 eingeweihte und nach ihr benannte Kirche. Auch viele Historiengemälde verklärten sie, zum Beispiel von Jean-Auguste-Dominique Ingres (1780–1867), Paul Delaroche (1797–1856) oder Jules Eugène Lenepveu (1818–1898), der ihr im Pantheon einen ganzen Zyklus von Wandgemälden widmete.",
    ] },
  { "title" = "Quellen", "paragraphs" = [
      "Der Prozess Jeanne d’Arc. Akten und Protokolle 1431 und 1456. Übersetzt und herausgegeben von Ruth Schirmer-Imhoff, 3. Auflage. dtv. München 1978, ISBN 3-423-02909-9.",
    ] },
]

[articles.it]
text = "Giovanna d'Arco, detta la pulzella d'Orléans (in francese Jeanne d'Arc, in francese medio Jehanne Darc, pronuncia: /ʒə.ˈanə dark/; Domrémy, 6 gennaio 1412 – Rouen, 30 maggio 1431), è stata un'eroina nazionale francese. Beatificata nel 1909, è stata proclamata santa da papa Benedetto XV nel 1920."
title = "Giovanna d'Arco"
lang = "it"
url = "https://it.wikipedia.org/wiki/Giovanna_d%27Arco"
intro = [
  "Giovanna d'Arco, detta la pulzella d'Orléans (in francese Jeanne d'Arc, in francese medio Jehanne Darc, pronuncia: /ʒə.ˈanə dark/; Domrémy, 6 gennaio 1412 – Rouen, 30 maggio 1431), è stata un'eroina nazionale francese. Beatificata nel 1909, è stata proclamata santa da papa Benedetto XV nel 1920.",
  "Recuperò alla Francia parte del territorio caduto in mano agli inglesi durante la Guerra dei cent'anni, contribuendo a risollevarne le sorti, guidando vittoriosamente le armate francesi contro quelle inglesi. Catturata dai Borgognoni davanti a Compiègne, Giovanna fu venduta agli inglesi da Giovanni di Lussemburgo, vassallo del re d'Inghilterra. Questi la sottoposero a processo per eresia, al termine del quale fu condannata al rogo e arsa viva il 30 maggio 1431. Nel 1456 papa Callisto III, al termine di una seconda inchiesta, dichiarò la nullità di tale processo.",
  "Beatificata nel 1909 da Pio X e canonizzata nel 1920 da Benedetto XV, nel 1922 Giovanna fu proclamata santa patrona della Francia.",
]
sections = [
  { "title" = "Infanzia e giovinezza", "paragraphs" = [
      "Giovanna nacque a Domrémy (oggi Domrémy-la-Pucelle), da Jacques Darc e Isabelle Romée, in una famiglia di contadini della Lorena, ma appartenente alla parrocchia di Greux e alla castellania di Vaucouleurs, soggetta alla sovranità francese. Giovanna, secondo le testimonianze del tempo, era una ragazzina molto devota e caritatevole; nonostante la giovane età visitava e confortava i malati e non era insolito che offrisse il proprio giaciglio ai senzatetto per dormire lei stessa per terra, sotto la copertura del camino.",
      "All'età di tredici anni iniziò a udire \"voci celestiali\" spesso accompagnate da un bagliore e da visioni dell'arcangelo Michele, di santa Caterina e di santa Margherita, come sosterrà in seguito. La prima volta che queste \"voci\" le si palesarono, secondo il suo stesso racconto reso durante il processo per eresia subíto a Rouen nel 1431, Giovanna si trovava nel giardino della casa paterna; era il mezzodì di un giorno d'estate: sebbene sorpresa e impaurita da quell'esperienza, Giovanna decise di consacrarsi interamente a Dio facendo voto di castità «per tutto il tempo che a Dio fosse piaciuto».",
      "Nell'estate del 1428, a causa della guerra dei cent'anni che opponeva il regno di Francia al regno d'Inghilterra e alla Borgogna, la sua famiglia fuggì dalla valle della Mosa verso Neufchâteau, per sottrarsi alle devastazioni provocate dalle truppe di Antoine de Vergy, capitano borgognone. Era da poco iniziato il 1429 quando gli inglesi erano ormai prossimi a occupare completamente Orléans, cinta d'assedio sin dall'ottobre del 1428: la città, sul lato settentrionale della Loira, per la posizione geografica e il ruolo economico, aveva un valore strategico quale via d'accesso alle regioni meridionali; per Giovanna, che sarebbe diventata figura emblematica della storia di Francia, fu quello il momento - sollecitata dalle \"voci\" che diceva di sentire - per correre in aiuto di Carlo, Delfino di Francia, nella guerra per il trono contro gli inglesi e i loro alleati borgognoni.",
    ] },
  { "title" = "Le gesta belliche", "paragraphs" = [
      "Il viaggio di Giovanna da Vaucouleurs a Chinon per incontrarsi col «gentile Delfino», per usare le sue stesse parole, suscitò di per sé non poco interesse. Districandosi tra i confini sempre incerti e sfumati tra villaggi francesi e anglo-borgognoni per undici giorni, recando con sé la promessa di un aiuto sovrannaturale che sarebbe stato in grado di rovesciare le sorti della guerra, ormai apparentemente segnate, l'esiguo drappello rappresentava l'ultima speranza per il partito che ancora sosteneva il \"re di Bourges\", come veniva sprezzantemente chiamato Carlo VII dai suoi detrattori. Il Bastardo d'Orléans inviò due suoi fidi a Chinon, dove la Pulzella era giunta dopo essere passata per Gien, per raccogliere informazioni, e l'intero paese ne attendeva le gesta.",
      "Senza neppure avvisare i suoi genitori, Giovanna partì da Vaucouleurs il 13 febbraio 1429, diretta a Chinon, accompagnata da un manipolo guidato da un corriere reale, Colet de Vienne, e composto da Jean de Metz e Bertrand de Poulengy, uomini di fiducia di Robert de Baudricourt, seguiti ciascuno da un proprio servitore, e da Richard Larcher, anch'egli soldato al servizio del capitano di Vaucouleurs. Il piccolo drappello percorse una non facile via fra territori contesi, giungendo al castello di Chinon all'inizio del mese di marzo. Il fatto di essere scortata dagli uomini di un capitano fedele al Delfino probabilmente giocò non poco a favore dell'incontro con quest'ultimo.",
      "Presentandosi a Carlo, dopo due giorni di attesa, nella grande sala del castello, durante un'assemblea imponente e alla presenza di circa trecento nobili, Giovanna gli si avvicinò senza indugio e si inginocchiò dicendo: «Nobilissimo signor Delfino». Carlo, fingendosi stupito, indicò il conte di Clermont - che si era vestito con abiti regali proprio per mettere alla prova la contadinella - dicendo: «È questo il re». Giovanna continuò imperterrita a rivolgersi a Carlo, affermando che «il re di Francia è il Re dei Cieli», e di essere stata inviata da Dio per portare soccorso a lui e al suo reame. Tuttavia il Delfino, non fidandosi ancora completamente di lei, la sottopose a un primo esame in materia di fede nella stessa Chinon, dove la ragazza fu ascoltata da alcuni ecclesiastici di chiara fama, fra cui il vescovo di Castres, confessore dello stesso Carlo.",
    ] },
  { "title" = "La cattura", "paragraphs" = [
      "Stanca dell'inattività forzata, Giovanna D'Arco lasciò la corte di Carlo VII tra il marzo e l'aprile 1430, ingaggiando nuovamente combattimenti sporadici con gli anglo-borgognoni. La Pulzella era alla testa di contingenti in parte formati da volontari e in parte da mercenari, tra cui duecento piemontesi agli ordini di Bartolomeo Baretta; al suo comando vi era Arnaud Guillaume de Barbazan, famoso capitano da sempre agli ordini di Carlo VII che, appena liberato (per mano di La Hire) dalla prigionia inglese, aveva conosciuto Giovanna nel febbraio 1430 e che si unì a lei a Lagny. Passando per Melun, Giovanna giunse infine il 6 maggio 1430 a Compiègne, difesa da Guglielmo di Flavy; la città fu posta sotto assedio dalle truppe anglo-borgognone, e Giovanna iniziò una serie di sortite eclatanti ma con scarso esito. A Montargis, il Bastardo d'Orléans fu raggiunto dalla notizia della nuova offensiva borgognona e si mise in viaggio per chiedere al re il comando di un corpo d'armata; lo ottenne, ma troppo tardi per portare soccorso a Giovanna sotto le mura di Compiègne.",
      "Il 23 maggio 1430 Giovanna tentò un attacco a sorpresa contro la città di Margny, dove trovò una resistenza più forte del previsto; dopo essere stata respinta per tre volte, vedendo giungere al nemico altri rinforzi dalle postazioni vicine comandò la ritirata al riparo delle mura di Compiègne. Ad un certo punto il governatore della città, Guglielmo di Flavy, diede ordine di chiudere le porte delle mura nonostante le ultime compagnie non fossero ancora rientrate; ordine che, secondo alcuni, costituirebbe una prova del suo tradimento, essendosi egli accordato segretamente col nemico per rendere possibile la cattura della Pulzella.",
      "Secondo altri storici, tuttavia, benché questa eventualità sia possibile essa non è dimostrabile. Ad ogni modo, mentre l'esercito rientrava nella città, Giovanna, che ne proteggeva la ritirata, circondata ormai da pochi uomini della sua compagnia, fu cinturata e strattonata da cavallo, dovendo arrendersi al Bastardo di Wamdonne combattente agli ordini di Giovanni II di Lussemburgo-Ligny, vassallo del duca di Borgogna, ma al servizio del re d'Inghilterra.",
    ] },
  { "title" = "La prigionia e il processo", "paragraphs" = [
      "Fatta prigioniera insieme al suo intendente Jean d'Aulon e al fratello Pietro, Giovanna fu condotta in un primo tempo alla fortezza di Clairoix, quindi, dopo pochi giorni, al castello di Beaulieu-les-Fontaines dove rimase sino al 10 luglio, e infine al castello di Beaurevoir. Qui, Giovanna venne trattata come una prigioniera d'alto rango e, infine, riuscì a conquistarsi la simpatia di tre dame del castello che, stranamente, portavano il suo stesso nome: Jeanne de Béthune, moglie di Giovanni II di Lussemburgo-Ligny, la di lei figlia di prime nozze Jeanne de Bar e infine Jeanne de Luxembourg, zia del potente vassallo, che giunse sino al punto di minacciare di diseredarlo qualora la Pulzella fosse stata consegnata agli inglesi. Del pari, Giovanna avrebbe ricordato con affetto queste tre donne durante gli interrogatori, ponendole su un piano di rispetto immediatamente inferiore a quello dovuto solo alla propria regina.",
      "Dopo la morte di Jeanne de Luxembourg, sopraggiunta il 18 settembre 1430, tuttavia, il peggior timore di Giovanna si avverò; dopo quattro mesi di prigionia nel castello di Beaurevoir, il vescovo di Beauvais Pietro Cauchon, nella cui diocesi era avvenuta la cattura, si presentò a Giovanni II di Lussemburgo-Ligny versando nelle sue mani la rançon, la cifra sotto cui la Pulzella era stata messa a riscatto, a nome del re d'Inghilterra e, contemporaneamente, rivendicando il proprio diritto a giudicarla secondo il diritto ecclesiastico. La cifra, diecimila lire tornesi, era enorme, paragonabile a quella richiesta per un principe di sangue reale, e per raccoglierla era stato decretato un aumento delle imposte in Normandia, provincia ancora in mano inglese.",
      "Il pagamento del riscatto di un prigioniero aveva lo scopo di restituirgli la libertà; in questo caso, invece, Giovanna fu venduta agli inglesi, cui fu consegnata il 21 novembre 1430 a Le Crotoy, in qualità di prigioniera di guerra, e trasferita, tra novembre e dicembre, numerose volte in diverse piazzeforti, forse per timore di un colpo di mano dei francesi teso a liberarla. Il 23 dicembre dello stesso anno, sei mesi dopo la sua cattura sotto le mura di Compiègne, Giovanna giunse infine a Rouen.",
    ] },
  { "title" = "Il supplizio e la morte", "paragraphs" = [
      "Due frati domenicani, Jean Toutmouillé e Martin Ladvenu, entrarono nella cella di Giovanna il 30 maggio 1431; quest'ultimo la ascoltò in confessione e le comunicò quale sorte era stata decretata per lei quel giorno. Nella sua ultima lamentazione, la Pulzella, vedendo entrare il vescovo Cauchon, esclamò: «Vescovo, muoio per causa vostra.» In seguito, quando questi si fu allontanato, Giovanna chiese di ricevere l'eucaristia. Martin Ladvenu non seppe che cosa risponderle, poiché non era possibile a un eretico comunicarsi e chiese allo stesso Cauchon come dovesse comportarsi; sorprendentemente, e in violazione ancora una volta di ogni norma ecclesiastica, questi rispose di somministrarle il sacramento.",
      "Giovanna fu condotta nella piazza del Mercato Vecchio di Rouen e fu data lettura della sentenza ecclesiastica. Successivamente, senza che il balivo o il suo luogotenente prendessero in custodia la prigioniera, fu abbandonata nelle mani del boia, Geoffroy Thérage, e condotta dove il legno era già pronto, di fronte a una folla numerosa riunitasi per l'occasione. Vestita di un lungo abito bianco e scortata da circa duecento soldati, salì sino al palo dove fu incatenata, sopra una gran quantità di legna. In tal modo, difficilmente avrebbe perso i sensi per asfissia, poiché l'intento era di arderla viva.",
      "Giovanna, caduta in ginocchio, invocò Dio, la Vergine, l'arcangelo Michele, santa Caterina e santa Margherita; domandò e offrì perdono a tutti. Chiese una croce e un soldato inglese, impietosito, prese due rami secchi e li legò a formarne una, che la ragazza strinse al petto; Isambart de La Pierre corse a prendere la croce astile della chiesa e gliela pose dinanzi; infine, i soldati strattonarono il boia e gli ordinarono: «Fa' ciò che devi!». Il fuoco salì veloce e Giovanna chiese dapprima dell'acqua benedetta; poi, investita dalle fiamme, gridò a gran voce: «Gesù!». Morì bruciata a 19 anni.",
    ] },
]

[articles.ja]
text = "ジャンヌ・ダルク（フランス語: Jeanne d'Arc、古綴：Jehanne Darc、IPA: [ʒan daʁk]、英: Joan of Arc、ユリウス暦1412年ごろ1月6日 - 1431年5月30日）は、15世紀のフランス王国の軍人。フランスの国民的ヒロインで、カトリック教会における聖人でもある。「オルレアンの乙女」（フランス語: la Pucelle d'Orléans/英: The Maid of Orléans）とも呼ばれる。"
title = "ジャンヌ・ダルク"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B8%E3%83%A3%E3%83%B3%E3%83%8C%E3%83%BB%E3%83%80%E3%83%AB%E3%82%AF"
intro = [
  "ジャンヌ・ダルク（フランス語: Jeanne d'Arc、古綴：Jehanne Darc、IPA: [ʒan daʁk]、英: Joan of Arc、ユリウス暦1412年ごろ1月6日 - 1431年5月30日）は、15世紀のフランス王国の軍人。フランスの国民的ヒロインで、カトリック教会における聖人でもある。「オルレアンの乙女」（フランス語: la Pucelle d'Orléans/英: The Maid of Orléans）とも呼ばれる。",
]
sections = [
  { "title" = "概要", "paragraphs" = [
      "ジャンヌは現在のフランス東部ドンレミ(現在はドンレミ＝ラ＝ピュセルという街)に、農夫の娘として生まれた。神の啓示を受けたとしてフランス軍に従軍し、イングランドとの百年戦争で重要な戦いに参戦し勝利を収め、各都市をフランスへ取り戻し、のちのフランス王シャルル7世の戴冠を成功させた。",
      "その後ジャンヌはブルゴーニュ公国軍の捕虜となり、身代金と引き換えにイングランドへ引き渡された。イングランドと通じていたボーヴェ司教ピエール・コーションによって「不服従と異端」の疑いで異端審問にかけられ、最終的に異端の判決を受けたジャンヌは、19歳で火刑に処せられてその生涯を終えた。",
      "ジャンヌが死去して25年後に、ローマ教皇カリストゥス3世の命でジャンヌの復権裁判が行われた結果、ジャンヌの無実と殉教が宣言された。その後ジャンヌは1909年に列福、1920年には列聖され、フランスの守護聖人の一人となっている。",
    ] },
  { "title" = "背景", "paragraphs" = [
      "歴史家ケリー・デヴリーズは、ジャンヌが歴史に登場した時代について「彼女（ジャンヌ）を落胆させるものがあったとしたら、1429年当時のフランスの情勢がまさにそれだったであろう」としている。1337年に勃発した百年戦争は、王位をめぐるフランス国内の混乱に乗じてイングランド王がフランス王位継承権に介入しようとしたことが発端だった。ほとんどすべての戦いがフランス国内で行われ、イングランド軍の焦土作戦によってフランス経済は壊滅的な打撃を受けていた。また当時のフランスは黒死病によって人口が減っており、さらに対外貿易も途絶えて外貨が入ってこない状況に置かれていた。ジャンヌが歴史に登場したのは、フランス軍が数十年間にわたって大きな戦いに勝利しておらず、イングランドがフランスをほぼ掌中に収めかけていた時期だった。デヴリーズは当時の「フランス王国にはその前身だった13世紀の（カペー朝の）面影すらなかった」と記している。",
      "ジャンヌが生まれた1412年ごろのフランス王はシャルル6世だったが、精神障害に悩まされており、国内統治がほとんど不可能な状態だった。王不在ともいえるこのような不安定な情勢下で、シャルル6世の弟のオルレアン公ルイと、従兄弟のブルゴーニュ公ジャン1世（無怖公）がフランス摂政の座と王子たちの養育権をめぐって激しく対立した。そして1407年にオルレアン公が無怖公の配下に暗殺されたことで、フランス国内の緊張は一気に高まった。",
      "オルレアン公と無怖公を支持する派閥は、それぞれアルマニャック派とブルゴーニュ派と呼ばれるようになっていった。イングランド王ヘンリー5世は、このフランス国内の混乱を好機ととらえてフランスへと侵攻した。イングランド軍は1415年のアジャンクールの戦いで大勝し、フランス北部の多くの都市をその支配下に置くに至る。そしてのちにフランス王位に就くシャルル7世は、4人の兄が相次いで死去したために14歳のときから王太子と目されていた。",
    ] },
  { "title" = "ジャンヌの生涯", "paragraphs" = [
      "ジャンヌはジャック・ダルクとイザベル・ロメの娘として生まれた。父ジャック・ダルク（1380年 - 1440年）がロメと呼ばれていたイザベル・ヴトン（1377年 - 1458年11月28日）と結婚したのは1405年のことで、2人の間にはジャックマン、ジャン、ピエール、ジャンヌ、カトリーヌの5人の子が生まれている。",
      "ジャンヌが生まれたのはバル公領の村ドンレミで、当時のバル公領は、マース川西部がフランス領、マース川東部が神聖ローマ帝国領で、ドンレミはマース川西部のフランス領に属していた。バル公領はのちにロレーヌ公国に併合され、ドンレミはジャンヌの別称である「オルレアンの乙女（ラ・ピュセル・ドルレアン（la Pucelle d'Orléans）」にちなんでドンレミ＝ラ＝ピュセルと改名されている。",
      "ジャンヌの両親は20ヘクタールほどの土地を所有しており、父ジャックは農業を営むとともに、租税徴収係と村の自警団団長も兼ねていた。当時のドンレミはフランス東部の辺鄙な小村で、周囲をブルゴーニュ公領に囲まれてはいたが、フランス王家への素朴な忠誠心を持った村だった。ジャンヌが幼少のころにドンレミも何度か襲撃に遭い、焼き払われたこともあった。",
    ] },
  { "title" = "ジャンヌの死後", "paragraphs" = [
      "百年戦争はジャンヌの死後も22年にわたって続いた。トロワ条約に則ってフランス王位を主張するイングランド王ヘンリー6世が、10歳の誕生日である1431年12月にフランス王としての戴冠式をパリで挙行してはいたが、フランス王シャルル7世はフランス王位の正当性を保ち続けることに成功していた。",
      "イングランド軍が1429年のパテーの戦いで失った軍事的主導権と長弓部隊を未だ再編成できていなかった1435年に、アラスでフランス、イングランド、ブルゴーニュの3か国会議が開かれた。この会議でそれまでのイングランドとブルゴーニュとの同盟関係は解消され、逆にフランスとブルゴーニュの関係が接近することとなり、アラスの和約締結に繋がった。",
      "シャルル7世との百年戦争を主導し、ヘンリー6世の摂政としてイングランドの国政も担当していたベッドフォード公が1435年9月に死去したが、10代半ばのヘンリー6世は後見人たる新たな摂政を置かず、イングランド史上最年少の国王親政を始めた。そしておそらくはこのヘンリー6世の貧弱な指導力が百年戦争終結の最大の要因となった。歴史家ケリー・デヴリーズは、ジャンヌが採用した積極的な砲火の集中と正面突破作戦が、その後のフランス軍の戦術に影響を与えたとしている。",
    ] },
  { "title" = "後世への影響と評価", "paragraphs" = [
      "ジャンヌはその死後4世紀にわたって半ば神格化されてきた。ジャンヌに関する伝記の主たる情報源は年代記によるものである。ジャンヌが有罪宣告を受けた裁判の内容を記した5冊の年代記装飾写本が、19世紀に古文書の中から発見された。この発見からまもなく歴史家たちの手によって、115人分の宣誓供述書や異端審問裁判でのラテン語で書かれた有罪宣告書の下敷きとなったフランス語での覚書など、ジャンヌの復権裁判の全記録も見つけ出された。当時やりとりされたさまざまな書簡も発見され、それらの中の3通の書簡からは「ジャンヌ（Jehanne）」という、明らかに読み書きの教育を受けていない人物の手による署名が見つかった。これらジャンヌに関して発見された大量の一次資料について、デヴリーズは「男女を問わず中世の人物のなかで、これほど研究の対象となっているものはいない」としている。",
      "辺鄙な小村に生まれた無学な農夫の娘ジャンヌ・ダルクは10代にして途方もない名声を手にいれた。フランスとイングランドの国王は、およそ1000年前に成立し、ヨーロッパの王位継承権の根拠となっていたサリカ法の解釈の違いを言い立て、自分たちの立場を正当化しつつ戦争を継続した。百年戦争は王位継承権に関するフランス王家とイングランド王家との対立だったといえる。しかしジャンヌは、この両国間の戦争に新たな概念と視点をもたらした。あるときジャン・ド・メスがジャンヌに「フランス王が国を追われたら、我々はイングランド人となるのだろうか」と問いかけたことがある。スティーヴン・リッチーは「雲の上の王族たちが小競り合いを繰り返したとしても市井の人々の暮らしは何も変わらない。ただし、市民が祖国存亡の危機だと激怒したときは別だということをジャンヌは理解していた」としている。リッチーはジャンヌは後世に与えた広い訴求力を次のように記している。",
      "男勝りの活躍をしたとはいえ、ジャンヌはフェミニストではなかった。ジャンヌの行動原理は、神の声を聴き自身が選ばれた人間だと信じた、あらゆる階層の人々に見られる伝統的な宗教観に則ったものだった。ジャンヌはフランス軍から戦闘に関係のない女性を追い出し、時には言うことを聞かないこれら非戦闘従軍者を剣の腹で殴りつけたこともあった。とはいえ、15世紀の女権論者の文学者クリスティーヌ・ド・ピザンから今日に至るまで、ジャンヌは勇敢で行動的な女性の好例とみなされている。",
    ] },
]

[articles.ar]
text = "جان دارك أو حَنَّة دَرْك (بالفرنسية: Jeanne d'Arc) الملقبة بعذراء أورليان (بالفرنسية: La Pucelle d'Orléans)، ولدت لعائلة من الفلاحين في الوسط الشرقي من فرنسا عام 1412، وتوفيت في 30 مايو 1431، وتُعدّ بطلة قومية فرنسية وقديسة في الكنيسة الرومانية الكاثوليكية. ادّعت جان دارك الإلهام الإلهي، وقادت الجيش الفرنسي إلى عدة انتصارات مهمّة خلال حرب المئة عام، ممهدةً بذلك الطريق لتتويج شارل السابع ملكاً على البلاد."
title = "جان دارك"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%AC%D8%A7%D9%86_%D8%AF%D8%A7%D8%B1%D9%83"
intro = [
  "جان دارك أو حَنَّة دَرْك (بالفرنسية: Jeanne d'Arc) الملقبة بعذراء أورليان (بالفرنسية: La Pucelle d'Orléans)، ولدت لعائلة من الفلاحين في الوسط الشرقي من فرنسا عام 1412، وتوفيت في 30 مايو 1431، وتُعدّ بطلة قومية فرنسية وقديسة في الكنيسة الرومانية الكاثوليكية. ادّعت جان دارك الإلهام الإلهي، وقادت الجيش الفرنسي إلى عدة انتصارات مهمّة خلال حرب المئة عام، ممهدةً بذلك الطريق لتتويج شارل السابع ملكاً على البلاد. قُبض عليها بعد ذلك وأُرسلت إلى الإنجليز مقابل المال، وحوكمت بتهمة «العصيان والزندقة»، ثم أُعدمت حرقاً بتهمة الهرطقة عندما كانت تبلغ 19 عاماً.",
  "أذن البابا كاليستوس الثالث بعد خمس وعشرين سنة من إعدامها بإعادة النظر في محاكمتها من قِبل لجنة مختصة، التي قضت ببراءتها من التهم التي وُجّهت إليها وأعلنتها بناءً على ذلك شهيدة. تم تطويب جان دارك عام 1909، أعقب ذلك إعلانها قديسة عام 1920. جان دارك هي إحدى القديسين الشفعاء لفرنسا إلى جانب القديس مارتين، ولويس التاسع، وغيرهم. ادّعت جان دارك بأنها رأت الله في رؤيا يأمرها بدعم شارل السابع واستعادة فرنسا من السيطرة الإنجليزية في أواخر حرب المئة عام. بعثها الملك غير المتوّج شارل السابع إلى حصار أورليان، حيث حققت هناك أولى انتصاراتها العسكرية الكبيرة، تبعها عدة انتصارات سريعة أخرى أدّت في نهاية المطاف إلى تتويج شارل السابع في ريمس.",
  "أنشأ الكتاب والسينيمائيون والملحنون العديد من الأعمال عن جان دارك منذ وفاتها باعتبارها إحدى أكثر الشخصيات شعبيةً، وما زالت تظهر في السينما، والمسرح، والتلفزيون، وألعاب الفيديو إلى يومنا هذا.",
]
sections = [
  { "title" = "خلفية", "paragraphs" = [
      "تصف المؤرخة كيلي دايفرس الفترة التي سبقت ظهور جان دارك: «إذا كان شيءٌ ما قادر على إحباطها، فحالة فرنسا كانت كفيلةً بذلك». اندلعت حرب المئة عام 1337 نتيجةً لمطالبة الإنجليز بحق العرش الفرنسي وتخللتها فترات متقطعة من السلام النسبي. شهدت الأراضي الفرنسية وقوع جميع معارك الحرب عليها تقريباً، وأدّى استخدام الجيش الإنجليزي لتكتيكات اعتمدت على ما عُرف فيما بعد باسم سياسة الأرض المحروقة إلى تدمير الاقتصاد الفرنسي. لم يكن الفرنسيون قد تعافوا بعد من الموت الأسود الذي عصف بهم في القرن السابق في ذلك الحين، كما أن التجار كانوا منعزلين عن الأسواق الخارجية. وفي الوقت الذي ظهرت فيه جان دارك، كان الإنجليز على وشك تحقيق هدفهم المتمثل بالسيطرة على العرش الفرنسي، بينما فشل الجيش الفرنسي في تحقيق أي انتصار كبير لمدة جيل كامل. وعلى حد تعبير دايفرس: «لم تكن مملكة فرنسا في ذلك الحين حتى ظلاً لما كانت عليه في القرن الثالث عشر».",
      "عانى شارل السادس ملك فرنسا في ذلك الحين من نوبات من الجنون، وكان عاجزاً عن تولي شؤون الحكم في غالب الأحيان. فتصارع لويس دوق أورليان شقيق الملك الصغير مع ابن عمه جون الأول دوق بورغندي على الحصول على حق الوصاية على حكم فرنسا وعلى أطفال العائلة المالكة، وتصاعد هذا الصراع إلى حد توجيه الإتهامات بوجود علاقة غرامية بين لويس دوق أورليان وزوجة الملك المريض شارل السادس، بالإضافة إلى الإتهامات بخطف أطفال العائلة المالكة. بلغ الصراع ذروته باغتيال دوق أورليان عام 1407 بأوامر من غريمه جان الأول، (الملقب بجان الجسور).",
      "استغل هنري الخامس ملك إنجلترا هذه الاضطرابات في غزو فرنسا، وانتصر انتصاراً حاسماً في معركة أجينكور عام 1415، ليتمكن بذلك من السيطرة على العديد من المدن الواقعة في شمال فرنسا. أصبح الملك المستقبلي شارل السابع ولي العهد وهو في الرابعة عشر من عمره بعدما توفي أشقاؤه الأربعة الكبار. كانت أول أعمال شارل الهامة إبرامه لمعاهدة سلام مع دوق بورغندي عام 1419، لكن نهاية هذا العمل كانت كارثية، حيث قام أنصار لويس دوق أورليان باغتيال جان الجسور دوق بورغندي خلال لقاء له مع شارل السابع تحت ضمان تقديم شارل الحماية له. ألقى فيليب الثالث دوق بورغندي الجديد اللوم على شارل السابع ودخل في تحالف مع الإنجليز، وغزت القوات المتحالفة مناطق واسعة من فرنسا.",
    ] },
  { "title" = "حياتها", "paragraphs" = [
      "جان دارك هي ابنة جاك دارك وإيزابيل روميه. كان والداها يعملان بالفلاحة في قرية صغيرة تُدعى دومريميه الواقعة آنذاك في دوقية بار، أو ما يُعرف حالياً بإقليم فوج في منطقة لورين غرب نهر الميز، في حين كان الجزء الآخر من الدوقية (شرق النهر) تابعاً للإمبراطورية الرومانية المقدسة. سُمّيت قرية دومريميه بعد انضمام دوقية بار إلى منطقة لورين باسم (Domrémy-la-Pucelle) تكريماً لجان دارك. كان لوالدا جان ما يقارب العشرين هكتاراً من الأراضي الزراعية، وكان والدها، بالإضافة إلى عمله بالمزرعة، بمثابة المسؤول عن القرية، يقوم بتحصيل الضرائب ويترأس لجنة الرقابة المحلية. كانت عائلة دارك تعيش في رقعةٍ معزولةٍ في شرقيّ فرنسا، محافظة على ولائها للتاج الفرنسي على الرغم من إحاطة أراضي البورغنديين بها. تعرضت دومريميه لعدة غارات خلال طفولة جان أدّت إحداها إلى إحراق القرية.",
      "قالت جان دارك أثناء محاكمتها أنّ عمرها كان 19 عاماً، مما يعني أنها ولدت في حوالي عام 1412م. كما قالت أنها رأت أول رؤيا لها عام 1424 عندما كانت في الثانية عشرة من عمرها، حيث رأت عندما كانت وحيدةً في أحد الحقول رئيس الملائكة ميخائيل، وكاترينا الإسكندرانية، والقديسة مارغريت الذين طلبوا منها إجلاء الإنجليز من البلاد وإعادة ولي العهد إلى ريمس من أجل تتويجه ملكاً. وقالت جان دارك بأنها بكت حين غادروا، إذ كانوا غايةً في الجمال.",
      "عندما بلغت السادسة عشرة من عمرها، طلبت جان دارك من أحد أقربائها -دوران لاسوا- اصطحابها إلى قرية فوكوليغ المجاورة، لتطلب من قائد الحامية الكونت روبر دو بودريكور الإذن لها بالذهاب إلى البلاط الملكي في شينو الواقعة غرب البلاد. كان رد الكونت على طلبها رداً ساخراً، إلا أنه لم يردعها من الهدف الذي جاءت من أجله. عادت جان دارك إلى هناك مرةً أخرى بعد عدة شهور وحصلت على تأييد اثنين من أصحاب المكانة والنفوذ، هما جان دو متز وبرتران دو بولِنجي. شاركت جان دارك نتيجةً لذلك في إحدى الاجتماعات وعادت مشاركتها عليهم بالنفع، حيث تنبأت بحدوث انسحاب عسكري بالقرب من أورليان.",
    ] },
  { "title" = "فترة ما بعد وفاتها", "paragraphs" = [
      "استمرت حرب المئة عام 22 عاماً بعد وفاة جان دارك، نجح خلالها شارل السابع في المحافظة على شرعية ملكه لفرنسا على الرغم من التتويج الذي أُقيم لغريمه هنري السادس في ديسمبر 1431 والذي صادف بلوغ الملك الإنجليزي سن العاشرة. خسرت إنجلترا تحالفها مع البورغنديين بموجب معاهدة أراس عام 1435 قبل أن تتمكن من إعادة بناء قوتها العسكرية التي خسرتها عام 1429. بالإضافة إلى ذلك، توفي دوق بيدفورد الوصي على العرش في سبتمبر من العام ذاته ليصبح بذلك هنري السادس أصغر ملك إنجليزي يحكم بلا وصي، وكانت قيادته الضعيفة أحد أهم العوامل التي أنهت الصراع. أثر استخدام جان دارك المكثف للمدفعيات وأسلوب المجابهة وجهاً لوجه على التكتيكات الفرنسية لبقية الحرب على حد تعبير المؤرخة كيلي دايفرس.",
      "في عام 1452، وخلال التحقيق في قضية إعدامها، أعلنت الكنيسة أن مسرحية دينية ستُقام على شرفها في أورليان وسيكون من شأنها منح الغفران للحضور من خلال جعل هذا الحدث موقعاً للحج.",
      "فُتحت ملفات محاكمة جان دارك مرةً أخرى بعد أن وضعت الحرب أوزارها. أذن البابا كاليستوس الثالث ببدء هذه الإجراءات -التي عُرفت باسم «بطلان المحاكمة»- بناءً على طلب المحقق العام جان بريال وإيزابيل روميه والدة جان دارك. كان الهدف من إعادة المحاكمة هو التحقيق في ما إذا كانت قد تمّت بشكل عادل ووفقاً للقانون الكنسي. بدأ بريال بالتحقيق عام 1452، وتمّ استئنافه رسمياً في نوفمبر 1455. شملت التحقيقات المستأنفة رجال دين من جميع أنحاء أوروبا واتّبعت الإجراءات القضائية المعمول بها في المحاكم، وقام فريق من اللاهوتيين بتحليل شهادة 115 شاهد. أعلن بريال ملخص ما توصل إليه في يونيو 1456، وهو اعتبار جان دارك شهيدة وكذلك ضلوع الأسقف الراحل بيير كوشون بالهرطقة بسبب إدانته لإمرأة بريئة في سعيه لتحقيق ثأره. وكان السبب الفعلي لإعدامها هو ما يتعلق بقانون اللباس في الكتاب المقدس.",
    ] },
  { "title" = "الإرث", "paragraphs" = [
      "باتت جان دارك شخصيةً شبه أسطورية لأربعة قرون بعد وفاتها. كان المصدر الوحيد للمعلومات المتعلقة بها مستسقاً من سجلات تاريخ السيَر. كما ظهرت خمس مخطوطات أصليّة لمحاكمة إدانتها في أرشيفات قديمة خلال القرن التاسع عشر. كما وجد المؤرخون سجلات إعادة المحاكمة كاملةً، احتوت على شهادات مأخوذة من 115 شاهد، بالإضافة إلى المدونات الفرنسية الأصلية المتعلقة بمحضر محكمة الإدانة المخطوط باللاتينية. ظهرت بالإضافة إلى ما سبق العديد من الوثائق المعاصرة الأخرى ثلاثة منها يحملون توقيع جان (Jehanne) بخط يدل على عدم إلمام كاتبه بالكتابة. هذا الغنى غير العادي من المصادر الأوليّة هو أحد أسباب قول المؤرخة دايفرس الذي معناه: «لم يكن هناك موضوع دراسة لأي شخص عاش في العصور الوسطى سواءً كان ذكراً أو أنثى كما كان لجان دارك».",
      "جاءت جان دارك من قرية مجهولة وبرزت على الساحة عندما كانت في سن المراهقة كفلاحة غير متعلمة. وبينما برر الملوك الفرنسيون والإنجليز الحرب الجارية بتأويلاتهم للقانون السالي ذا الألف عام، إلا أن الصراع في الحقيقة كان يتمحور حول الوراثة بين الملوك. وقالت جان بخصوص هذا الشأن ما معناه: «أليس من الواجب أن يكون ملكنا من مملكتنا، أم هل يجدر بنا أن نكون إنجليزاً؟». وعلى حد تعبير ستيفن ريتشي: «فقد حولت جان دارك ما كان مجرّد شجار بين الأسر الحاكمة لم يسبّب للناس سوى المعاناة إلى حرب ذات شغف شعبي بالتحرر الوطني.» كما يقول ريتشي:",
      "لطالما كانت نظرة النساء إلى جان دارك نظرة إيجابية باعتبارها مثالاً للمرأة الشجاعة وذلك منذ زمن كريستين دي بيزان وحتى الوقت الحاضر. قدمت النساء في حياة جان بعضاً من أهم المساعدات التي قُدمت لها، فحماة شارل السابع -يولاندا الأراغونية- أكدت على عذرية جان وكانت هي من موّل رحلتها إلى أورليان. كما أن جان عمة كونت لوكسمبورغ كانت المرأة التي وضعت جان دارك بعهدتها بعد أسرها في كومبيين، كما ساعدت في تخفيف الأوضاع التي واجهتها جان دارك أثناء الأسر، بالإضافة إلى كونها سبب في تأخير عملية بيع جان دارك للإنجليز. وأخيراً آن دوقة بيدفورد وزوجة الوصي على العرش الإنجليزي، التي أعلنت عذرية جان خلال التحقيقات التي سبقت محاكمتها، مما كان سبباً بطريقة أو بأخرى في عدم اتهام المحكمة لجان دارك بممارسة السحر. كل هذا كان جزءاً من الأساس الذي انطلق منه تقديس جان دارك والدفاع عنها.",
    ] },
]

[articles.vi]
text = "Jeanne d'Arc (tiếng Pháp: Jeanne d'Arc [ʒan daʁk]; tiếng Pháp trung đại: Jehanne d'Arc [ʒəˈãnə ˈdark]; tiếng Anh: Joan of Arc: k. 1412 – 30 tháng 5 năm 1431) là một thánh quan thầy của Pháp, được tôn vinh vì vai trò trong Siege of Orléans và sự kiên quyết của nàng trong việc trao ngôi miện cho Vua Charles VII của Pháp trong Chiến tranh Trăm Năm."
title = "Jeanne d'Arc"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Jeanne_d%27Arc"
intro = [
  "Jeanne d'Arc (tiếng Pháp: Jeanne d'Arc [ʒan daʁk]; tiếng Pháp trung đại: Jehanne d'Arc [ʒəˈãnə ˈdark]; tiếng Anh: Joan of Arc: k. 1412 – 30 tháng 5 năm 1431) là một thánh quan thầy của Pháp, được tôn vinh vì vai trò trong Siege of Orléans và sự kiên quyết của nàng trong việc trao ngôi miện cho Vua Charles VII của Pháp trong Chiến tranh Trăm Năm. Tự nhận là tuân theo chỉ dẫn của thánh thần, nàng đã trở thành một thủ lĩnh quân đội và được công nhận là cứu tinh của Pháp.",
  "Jeanne sinh ra trong một nông gia hữu sản tại Domrémy, miền đông bắc Pháp. Năm 1428, nàng triều kiến trước thái tử Charles, làm chứng về việc nhìn thấy dị kiến từ Tổng lãnh thiên sứ Micae, Thánh Margaret, và Thánh Catarina, chỉ dẫn nàng cứu lấy Pháp khỏi quân xâm lược Anh nhân danh ngài. Bị thuyết phục trước sự chân thành và thuần khiết của Jeanne, Charles cử thiếu nữ mới 17 tuổi theo đoàn quân giải phóng Orléans. Nàng đặt chân tới thành phố vào tháng 4 năm 1429, mang theo hiệu kỳ và truyền cảm hứng cho binh lính nhụt chí cố thủ trong thành. Sau chín ngày, quân Anh bỏ thành và Jeanne thôi thúc quân Pháp rượt đuổi bằng được quân Anh trong Chiến dịch Loire, kết thúc với trận đại thắng tại Patay, mở đường cho Pháp chiếm lại Reims mà không đổ một giọt máu. Tại đây, Charles được suy tôn làm Vua Pháp bên cạnh Jeanne. Những chiến thắng này đã khôi phục nhuệ khí của người Pháp, góp phần dẫn tới thắng lợi cuối cùng của họ trong Chiến tranh Trăm Năm vài thập kỷ sau.",
  "Sau lễ đăng cơ của Charles, Jeanne can dự vào hai cuộc vây hãm bất thành, tại Paris vào tháng 9 năm 1429 và tại La Charité vào tháng 11. Hai biến cố này đã khiến lòng tin của triều đình giảm sút đáng kể. Đầu năm 1430, Jeanne tập hợp một đội lính tự nguyện nhằm phá vây Compiègne, khu vực đang bị chiếm cứ bởi đồng minh Bourgogne của Anh. Ngày 23 tháng 5 năm 1430, nàng rơi vào tay quân Bourgogne. Sau lần trốn chạy bất thành, nàng bị giao nộp cho quân Anh vào tháng 11, rồi bị khép tội dị giáo bởi Giám mục Pierre Cauchon với các cáo buộc như: báng bổ vì mặc quần áo đàn ông, hành động theo các dị kiến quỷ quái và từ chối chịu trách nhiệm cho lời khai của mình trước giáo hội. Ngày 30 tháng 5 năm 1431, nàng bị hỏa hình trên cọc khi mới 19 tuổi.",
  "Năm 1456, một phiên tòa dị giáo được tổ chức nhằm xét lại vụ xử Jeanne và lật trắng án, tuyên bố vụ án đã bị bài hoại bởi sự dối trá và lỗi tiến hành. Jeanne từ đó được tôn làm tử đạo và được nhìn nhận như người con gái tuân phục Giáo hội Công giáo, hay một nhà nữ quyền thuở sớm, tượng trưng cho độc lập tự do. Sau Cách mạng Pháp, nàng trở thành biểu tượng quốc gia của nước này. Năm 1920, Jeanne d'Arc được phong thánh bởi Giáo hội và được tuyên làm quan thầy của Pháp hai năm sau. Hình tượng Jeanne đã xuất hiện dưới nhiều hình thức văn hóa khác nhau như văn học, hội họa, âm nhạc, điêu khắc và kịch nghệ.",
]
sections = [
  { "title" = "Tên gọi", "paragraphs" = [
      "Tên Jeanne d'Arc có nhiều biển thể khác nhau, không có sự thống nhất. Trước thế kỷ thứ 16, vẫn chưa có chuẩn chính tả cụ thể để viết tên nàng; tên cuối của nàng thường được viết là \"Darc\" mà không có dấu phẩy lược, song cũng có các biến thể như \"Tarc\", \"Dart\" hoặc \"Day\". Tên thân phụ của nàng được khai là \"Tart\" tại phiên tòa. Trong lá thư ban phù hiệu áo giáp năm 1429 gửi từ Charles VII, tên nàng được ghi là \"Jeanne d'Ay de Domrémy\". Bình sinh, Jeanne có lẽ chưa bao giờ nghe thấy cái tên \"Jeanne d'Arc\". Ghi chép đầu tiên chứa cái tên này có niên đại về năm 1455, tức 24 năm sau khi nàng mất.",
      "Jeanne hồi nhỏ không được học đọc hoặc viết, vì vậy phải nhờ người khác chép thư hộ. Về sau, nàng có lẽ đã học cách ký tên mình trong một số bức thư, thậm chí có lẽ đã lĩnh hội kỹ năng đọc. Jeanne tự xưng trong các bức thư là Jeanne la Pucelle (\"Jeanne Trinh nữ\") hay ngắn gọn là la Pucelle (\"Trinh nữ\"), nhấn mạnh rằng nàng vẫn còn trinh, đồng thời ký tên là \"Jehanne\". Bước vào thế kỷ thứ 16, nàng bắt đầu được gọi bằng danh xưng \"Trinh nữ xứ Orleans\" [The Maid of Orleans].",
    ] },
  { "title" = "Chào đời và bối cảnh lịch sử", "paragraphs" = [
      "Jeanne d'Arc sinh ra khoảng năm 1412 tại Domrémy, một ngôi làng nhỏ trong thung lũng Meuse nay thuộc tỉnh Vosges ở miền đông bắc Pháp. Không rõ sinh nhật của Jeanne là ngày nào và tuổi của nàng cũng khá mù mịt. Thân sinh của nàng là Jacques d'Arc và Isabelle Romée. Jeanne có ba anh em trai và một người chị hoặc em gái. Cha nàng, Jacques, là một nông dân sở hữu mảnh đất rộng 50 mẫu Anh (20 ha), ngoài ra nhậm hương chức kiêm trương tuần, thúc thuế dân làng để kiếm thêm lương bổng.",
      "Nàng sinh ra vào thời kỳ Chiến tranh Trăm Năm giữa Anh và Pháp, cuộc chiến mà đã bắt đầu từ năm 1337, bắt nguồn từ tranh cãi về các lãnh thổ của Anh ở Pháp và người nối ngôi chính đáng của Pháp. Hầu như tất cả các chiến sự diễn ra trên đất Pháp, tàn phá nền kinh tế nước này. Vào thời điểm Jeanne chào đời, Pháp bị chia rẽ sâu sắc về mặt chính trị. Vua Charles VI đôi khi nổi cơn tâm thần và không có khả năng cai trị; điều này khiến hoàng huynh của ngài, Louis, Công tước xứ Orléans, và anh em thúc bá của ngài, Jean, Công tước xứ Bourgogne, tranh giành quyền nhiếp chính. Năm 1407, Công tước xứ Bourgogne sai người hạ sát Công tước xứ Orléans, nhen nhóm mồi lửa cho một cuộc nội chiến trong tương lai. Charles xứ Orléans nối gót thân phụ, trở thành công tước khi mới 13 tuổi nhưng bị tống giam bởi Bernard, Bá tước xứ Armagnac; những người ủng hộ ông ta được gọi là \"phái Armagnac\" còn những người ủng hộ Công tước xứ Bourgogne được gọi là \"phái Bourgogne\". Nhà vua tương lai của Pháp, Charles VII, được phong tước Dauphin (người kế vị ngai vàng) sau cái chết trước đó của bốn người anh và có quan hệ thân hữu với phái Armagnac.",
      "Henry V của Anh lợi dụng tình hình rối ren ở Pháp để phát động cuộc xâm lược nước này vào năm 1415. Năm 1418, phái Bourgogne chiếm đóng Paris. Năm 1419, Dauphin chiêu dụ một hòa ước với Công tước xứ Bourgogne, song vị này bị ám sát bởi những người Armagnac ủng hộ Charles tại buổi đàm phán. Công tước mới của Bourgogne, Philippe III, chọn liên minh với người Anh. Charles VI quở trách con trai vì giết hại Công tước xứ Bourgogne và tuyên bố vị Dauphin không còn đủ tư cách nối ngôi.",
    ] },
  { "title" = "Cuộc đời kỳ thủy", "paragraphs" = [
      "Thuở nhỏ, Jeanne làm việc nhà, kéo sợi, phụ cha cày đồng và chăn gia súc. Thân mẫu Jeanne đảm bảo con gái được học tập tôn giáo tử tế. Phần lớn Domrémy lúc bấy giờ nằm trong Công quốc Bar, lãnh thổ mà vị thế phong kiến không rõ ràng; tuy bao quanh bởi các vùng đất theo phái Bourgogne, nhân dân nơi đây ủng hộ phái Armagnac. Tới năm 1419, chiến tranh đã lan tới khu vực này, và vào năm 1425, Domrémy bị tấn công và gia súc tại đây bị cướp. Dân làng từ đó rất căm phẫn người Anh. Jeanne nhìn thấy dị kiến đầu tiên sau sự kiện này.",
      "Jeanne có làm chứng rằng ,vào năm 13 tuổi, tức khoảng năm 1425, một hình nhân mà nàng cho là Thánh Micae bao quanh bởi thiên sứ đã hiện ra trong vườn nhà. Sau dị kiến ấy, đôi mắt Jeanne đẫm lệ vì nàng mong muốn các vị thiên sứ đưa mình theo. Xuyên suốt cuộc đời, nàng đã nhiều lần thấy Thánh Micae, quan thầy của Domrémy. Nàng khẳng định những dị kiến ấy diễn ra thường xuyên, nhất là vào những lúc chuông nhà thờ reo. Thánh Margaret và Thánh Catarina cũng hay xuất hiện trong những thị kiến ấy; tuy Jeanne không xác minh, hai vị thánh này có lẽ là Margaret thành Antioch và Catarina thành Alexandria nổi tiếng trong khu vực. Cả hai đều là những thánh trinh nữ chiến đấu chống lại kẻ thù mạnh mẽ, sau bị tra tấn và tử vì đạo, bảo tồn trinh tiết cho tới hơi thở cuối cùng. Jeanne làm chứng rằng nàng đã thề nguyện giữ trinh với những giọng nói ấy. Có lần một chàng trai trong làng cáo buộc Jeanne bội hôn ước với anh ta, Jeanne đáp rằng nàng chưa từng hứa hẹn gì với anh ta, và tòa án giáo hội địa phương bác bỏ cáo trạng ấy.",
      "Thuở thiếu thời của Jeanne, cư dân trong làng truyền tai nhau một lời đồn dựa trên dị kiến của Marie Robine của Avignon, rằng một trinh nữ vận giáp sẽ nổi lên đánh đuổi quân xâm lược. Một lời tiên tri khác, được cho là của Merlin, khẳng định một thiếu nữ cầm hiệu kỳ sẽ chấm dứt sự khổ đau của Pháp. Jeanne ngụ ý nàng chính là trinh nữ trong lời tiên tri, rêu rao với những dân chúng xung quanh rằng, một ả đàn bà sẽ hủy hoại Pháp nhưng một trinh nữ sẽ chấn hưng đất nước. Tháng 5 năm 1428, Jeanne yêu cầu người cậu ngoại đưa tới Vaucouleurs, nơi nàng đòi chỉ huy quân đội địa phương, Robert de Baudricourt, hộ tống tới triều đình Armagnac tại Chinon. Baudricourt từ chối và gửi nàng về nhà. Vào tháng 7, Domrémy bị đột kích và thiêu đốt bởi quân Bourgogne, khiến mùa màng thất bát, buộc gia đình Jeanne và dân làng phải tản cư. Nàng quay lại Vaucouleurs vào tháng 1 năm 1429. Lời thỉnh cầu của nàng một lần nữa bị từ chối, song thu phục được cảm tình của hai người lính dưới trướng Baudricourt, Jean de Metz và Bertrand de Poulengy. Nàng được triệu tới Nancy dưới sự bảo lãnh của Charles II, Công tước xứ Lorraine, người mà đã nghe kể về Jeanne khi dừng chân tại Vaucouleurs. Vị công tước ốm yếu nghĩ rằng nàng ta sở hữu năng lực siêu nhiên có thể chữa khỏi bách bệnh. Lúc diện kiến, Jeanne không đưa ra phương thuốc nào mà thay vào đó khiển trách vị công tước vì chung chạ với tình nhân.",
    ] },
  { "title" = "Cuộc đời và sự nghiệp", "paragraphs" = [
      "Jeanne là con ông Jacques d'Arc và bà Isabelle Romée tại Domrémy, một làng khi đó thuộc lãnh địa quận công xứ Bar (về sau nhập vào tỉnh Lorraine và đổi thành Domrémy-la-Pucelle). Cha mẹ cô sở hữu 50 mẫu đất (0.2 km²), và để thêm thu nhập cha cô còn làm viên chức thu thuế trong làng, cũng như chỉ huy đội dân quân. Họ sống tại một vùng đất hẻo lánh thuộc vùng đông bắc còn trung thành với triều đình Pháp, dù nằm lọt thỏm trong lãnh địa của phe Burgundy. Khi cô còn nhỏ, thỉnh thoảng làng của cô bị đột kích và đốt phá.",
      "Jeanne cho biết cô 19 tuổi khi phiên tòa xử tội cô diễn ra, như vậy cô sinh năm 1412; cô sau này cho biết cô nhận được thiên khải đầu tiên vào khoảng năm 1424 lúc 12 tuổi, khi đó cô đang ở ngoài đồng một mình thì nghe thấy tiếng nói (của thiên sứ). Cô thuật lại là đã òa lên khóc khi họ biến mất vì họ quá sức đẹp đẽ. Cô cho biết Tổng thiên sứ Michael, Thánh nữ Catherine xứ Alexandria, và Thánh nữ Đồng trinh Margaret truyền cho cô đánh đuổi người Anh và đưa Dauphin đến Reims để lên ngôi vua.",
      "Khi 16 tuổi, cô nhờ một người họ hàng, Durand Lassois, đưa cô đến Vaucouleurs để thỉnh cầu chỉ huy đơn vị quân đóng tại đó là Bá tước Robert de Baudricourt cho phép tiếp kiến triều đình Pháp tại Chinon. Bá tước Baudricourt chế giễu cô, nhưng không làm cô nhụt chí. Tới tháng 1, cô lại trở lại, và lần này được hai nhân vật quan trọng ủng hộ Jean de Metz và Bertrand de Poulengy. Nhờ được họ bảo trợ, cô được gặp Bá tước lần thứ hai, và tiên đoán hết sức chính xác về việc quân Pháp thất trận Herrings gần Orléans.",
    ] },
  { "title" = "Ảnh hưởng", "paragraphs" = [
      "Đã từng có nhiều câu chuyện và những bộ phim truyền hình kể về cuộc đời của cô. Và cuộc đời đấu tranh và phục vụ cho Pháp của cô được thể hiện trong game chiến thuật dàn trận nổi tiếng Age of Empires II - The Age of Kings.",
      "Tại Thành phố Hồ Chí Minh, Nhà thờ Ngã Sáu còn được gọi là Nhà thờ Thánh Jeanne d'Arc",
    ] },
]

[articles.id]
text = "Jeanne d'Arc atau Yohana dari Ark (6 Januari 1412 – 31 Mei 1431; bahasa Prancis: Jeanne d'Arc, bahasa Inggris: Joan of Arc) adalah pahlawan negara Prancis dan santa dalam agama Katolik. Di Prancis ia dijuluki La Pucelle yang berarti \"sang dara\" atau \"sang perawan\"."
title = "Jeanne d'Arc"
lang = "id"
url = "https://id.wikipedia.org/wiki/Jeanne_d%27Arc"
intro = [
  "Jeanne d'Arc atau Yohana dari Ark (6 Januari 1412 – 31 Mei 1431; bahasa Prancis: Jeanne d'Arc, bahasa Inggris: Joan of Arc) adalah pahlawan negara Prancis dan santa dalam agama Katolik. Di Prancis ia dijuluki La Pucelle yang berarti \"sang dara\" atau \"sang perawan\". Ia mengaku mendapat suatu pencerahan, yang dipercayainya berasal dari Tuhan, dan menggunakannya untuk membangkitkan semangat pasukan Charles VII untuk merebut kembali bekas wilayah kekuasaan mereka yang dikuasai Inggris dan Burgundi pada masa Perang Seratus Tahun.",
]
sections = [
  { "title" = "Kepahlawanan", "paragraphs" = [
      "Jeanne ditugaskan untuk melakukan pengepungan terhadap Orléans oleh raja Charles VII sebagai upaya pembebasan kota tersebut. Ia menjadi terkenal karena berhasil mengakhiri pengepungan dalam tempo hanya sembilan hari. Kemenangan-kemenangan lain yang diperolehnya, akhirnya berhasil mengantar pemahkotaan Charles VII di Reims.",
      "Setelah pemahkotaan tersebut, pasukannya mencoba operasi militer lanjutan, yang sayangnya kurang berhasil. Jeanne menolak untuk mundur bahkan ketika ia terluka sewaktu mencoba merebut Paris pada musim gugur tahun itu. Akibat intrik di istana, sejak saat itu ia hanya mendapatkan pasukan kecil, dan akhirnya ditangkap pada musim semi berikutnya pada pertempuran di Compiègne. Pengadilan berbau politis yang diadakan Inggris mendakwanya melakukan bidah (ajaran sesat). Penguasa setempat Inggris – John dari Bedford – memerintahkan untuk menghukum Jeanne dengan dibakar hidup-hidup di Rouen. Ia menjadi pahlawan bangsanya pada umur tujuh belas tahun, tetapi wafat pada umur sembilan belas tahun.",
      "Dua puluh empat tahun kemudian, setelah Inggris berhasil diusir dari Prancis, ibunya – Isabelle – berhasil meyakinkan Inquisitor-General, dan Paus Kallixtus III untuk membuka kembali kasus Jeanne. Proses ini akhirnya berhasil menggugurkan dakwaan yang ditujukan kepadanya oleh Inggris. Paus Benediktus XV melakukan kanonisasi terhadap Jeanne pada 16 Mei 1920.",
    ] },
  { "title" = "Latar belakang", "paragraphs" = [
      "Periode sebelum datangnya Jeanne adalah salah satu titik terendah dalam sejarah Prancis. Perang yang berlarut-larut telah menyebabkan kesengsaraan masyarakat, terutama pada bagian utara yang dikuasai oleh Inggris. Ada kemungkinan besar bahwa Prancis akan bergabung dengan Inggris sebagai suatu \"Monarki Kembar\" (\"Dual Monarchy\") di bawah pemerintahan raja Inggris. Raja Prancis pada waktu lahirnya Jeanne, Charles VI menderita penyakit jiwa dan sering tidak mampu untuk memerintah kerajaannya. Dua saudara raja, adipati (duke) John the Fearless dari Burgundi and Louis dari Orléans, bersengketa atas hak perwalian. Perselisihan ini meruncing dengan timbulnya tuduhan perselingkuhan atas Ratu Isabeau dari Bavaria dan penculikan terhadap anak-anak bangsawan, dan mencapai klimaksnya sewaktu John the Fearless memerintahkan pembunuhan atas Louis pada tahun 1407. Pihak-pihak yang setia pada kedua orang ini dikenal sebagai Armagnac dan Burgundian.",
      "Raja Inggris, Henry V, mengambil kesempatan dari kekacauan ini untuk menguasai Prancis. Secara dramatis ia memenangi pertempuran di Agincourt pada 1415, dan terus melanjutkan menguasai kota-kota di bagian utara Prancis. Calon raja Prancis, Charles VII, mendapatkan gelar putra mahkota (bahasa Prancis: dauphin) pada umur empat belas tahun, setelah empat kakaknya meninggal. Tindakan resmi penting pertama yang dilakukannya adalah mengusulkan perjanjian damai dengan John the Fearless pada tahun 1419. Proses ini berakhir dengan musibah sewaktu pendukung Armagnac membunuh Jean yang Tidak Mengenal Takut sewaktu berlangsungnya pertemuan yang dijamin oleh Charles. Adipati Burgundi yang baru, Philip the Good, menyalahkan Charles, dan bersekutu dengan Inggris. Sebagian besar wilayah Prancis pun jatuh ke tangan Inggris.",
      "Pada tahun 1420, Ratu Isabeau dari Bavaria mengadakan Perjanjian Troyes, yang menganugerahkan penerus tahta kepada Henry V dan keturunannya, dengan mengabaikan anaknya, Charles. Perjanjian ini menimbulkan isu bahwa sang dauphin adalah anak haram dan bukan anak sah dari raja. Henry V dan Charles VI meninggal dengan selisih waktu hanya dua bulan satu sama lainnya pada tahun 1422, dan meninggalkan sang bayi, Henry VI dari Inggris, sebagai pewaris kedua kerajaan. Saudara laki-laki Henry V, John dari Lancaster, adipati Bedford, bertindak sebagai wali sementara.",
    ] },
  { "title" = "Riwayat hidup", "paragraphs" = [
      "Jeanne dilahirkan di Domrémy pada tahun 1412 dari Jacques d'Arc dan Isabelle Romée. Orang tuanya adalah petani yang memiliki lahan sekitar 50 hektare. Ayahnya juga menduduki jabatan kecil di pemerintah daerah setempat dan bertugas mengumpulkan pajak serta mengepalai keamanan kota. Keluarga mereka tinggal pada suatu daerah terisolasi di wilayah timur laut yang tetap setia pada Prancis walaupun dikelilingi oleh daerah kekuasaan Burgundi. Beberapa penyerangan terjadi pada masa kecil Jeanne, di mana pada salah satu serangan, desanya dibakar.",
      "Jeanne mengaku bahwa ia mendapatkan pencerahan (vision) pertamanya sekitar 1424. Menurutnya, St. Michael, St. Catherine, dan St. Margaret menyuruhnya mengusir Inggris dan membawa sang dauphin ke Reims untuk diangkat menjadi raja. Pada umur enam belas tahun (1428), ia meminta salah seorang keluarganya, Durand Lassois, untuk membawanya ke Vaucouleurs. Ia meminta komandan garnisun setempat, Count Robert de Baudricourt, untuk izin mengunjungi balairung agung Prancis di Chinon. Jawaban sarkastik Baudricourt tidak menciutkan niatnya. Ia kembali lagi pada bulan Januari dan berhasil mendapat dukungan dua orang: Jean de Metz dan Bertrand de Poulegny. Dengan dukungan mereka, ia berhasil memperoleh kesempatan kedua untuk bicara di mana ia berhasil membuat ramalan mengenai kekalahan di Pertempuran Herrings di dekat Orléans.",
      "Baudricourt mengabulkan permintaan Jeanne untuk menemaninya mengunjungi Chinon setelah mendapat kabar bahwa ramalan yang dibuat Jeanne terbukti tepat. Jeanne menggunakan pakaian laki-laki sewaktu melakukan perjalanan berbahaya melalui wilayah Burgundi. Setelah tiba di balairung agung, ia berhasil meyakinkan Charles VII setelah melalui pembicaraan pribadi. Charles lalu memerintahkan pemeriksaan latar belakang dan teologis terhadap Jeanne di Poitier untuk memverifikasi moralitasnya. Selama proses tersebut, ibu mertua Charles, Yolande dari Aragon, mendanai ekspedisi penyelamatan terhadap Orléans. Jeanne meminta izin untuk berangkat bersama tentara dan mengenakan peralatan seorang ksatria (knight). Karena ia tak memiliki dana, Jeanne tergantung pada donasi untuk pengadaan baju zirah, kuda, pedang, pataka (banner), dan pengiringnya. Sejarawan Stephen W. Richey menjelaskan bahwa dia adalah satu-satunya harapan bagi rezim yang hampir runtuh.",
    ] },
  { "title" = "Pengaruh", "paragraphs" = [
      "Perang Seratus Tahun berlanjut selama 22 tahun sejak kematian Jeanne. Charles VII berhasil mempertahankan legitimasinya sebagai raja Prancis walaupun pada Desember 1431 Henry VI dinobatkan juga pada ulang tahunnya yang ke sepuluh. Sebelum Inggris dapat membangun kembali militernya yang hancur pada tahun 1429, negeri itu kehilangan persekutuannya dengan Burgundi pada Perjanjian Arras pada tahun 1435. Duke dari Bedford wafat pada tahun yang sama sehingga menjadikan Henry VI raja termuda Inggris yang memerintah tanpa wali (regent). Perjanjian tersebut dan lemahnya kepemimpinan Henry VI mungkin merupakan faktor terpenting yang mengakhiri konflik. Kelly DeVries mengungkapkan argumentasi bahwa penggunaan artileri dan penyerangan frontal yang dilakukan Jeanne d'Arc memengaruhi taktik Prancis selama sisa perang.",
      "Sumber utama informasi mengenai Jeanne adalah melalui catatan-catatan terpisah. Lima manuskrip asli dari pengadilannya ditemukan sekitar abad ke-19. Tak lama setelah itu, sejarawan juga menemukan catatan lengkap pengadilan rehabilitasinya, yang mengandung kesaksian di bawah sumpah dari 115 saksi berikut juga catatan asli dalam bahasa Prancis, terjemahan dari transkrip pengadilan awalnya. Berbagai surat juga berhasil ditemukan, tiga di antaranya mengandung tanda tangan \"Jehanne\" yang kelihatannya dibuat oleh tangan orang yang belajar menulis. Melimpahnya ketersediaan naskah sumber pertama yang tak lazim ini merupakan salah satu alasan DeVries mengatakan, \"Tidak ada seorang pun dari Abad Pertengahan, baik laki-laki atau perempuan, yang menjadi subjek penelitian melebihi Jeanne d'Arc.\"",
      "Ia datang dari desa terpencil dan menjadi terkenal sewaktu ia baru saja melepas masa kanak-kanaknya dan ia melakukan itu dengan status sebagai golongan petani yang tak berpendidikan. Raja-raja Prancis dan Inggris membuat pembenaran terhadap perang yang terjadi melalui perang interpretasi terhadap hukum Salic yang telah berumur ribuan tahun. Konflik yang terjadi adalah sengketa waris antara kedua monarki. Jeanne memberikan arti pada ketulusan, sehingga Jean de Metz berucap, \"Haruskah raja diusir dari kerajaan; dan kita menjadi orang Inggris?\" Meminjam kata-kata Stephen Richey, \"Ia mengubah apa yang tadinya hanyalah sengketa antar dinasti yang membuat rakyat jelata tak tergerak, kecuali untuk kesengsaraan mereka sendiri, menjadi suatu perjuangan populer yang penuh semangat demi pembebasan negeri.\" Richey juga menggambarkan:",
    ] },
]

[articles.tl]
text = "Si Santa Juana ng Arko (Pranses: Jeanne d’Arc, Ingles: Joan of Arc) (Enero 1412 – 30 Mayo 1431) ay isa sa mga pambansang bayani ng Pransiya at isang Santo ng Simbahang Katoliko. Sa Mayo 30 ang araw ng kanyang pista."
title = "Juana ng Arko"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Juana_ng_Arko"
intro = [
  "Si Santa Juana ng Arko (Pranses: Jeanne d’Arc, Ingles: Joan of Arc) (Enero 1412 – 30 Mayo 1431) ay isa sa mga pambansang bayani ng Pransiya at isang Santo ng Simbahang Katoliko. Sa Mayo 30 ang araw ng kanyang pista.",
]
sections = [
  { "title" = "Talambuhay", "paragraphs" = [
      "Ipinanganak si Juana sa bayan ng Domrémy (ngayo'y Domrémy-la-Pucelle, o Domremy ng Dalagita), Pransiya noong Enero 6 o 16, 1412. Noong bata pa siya, naririnig na niya ang mga boses nina San Miguel Arkanghel, Sta. Katrina, at Sta. Margaret, at isinabi nang mga ito na ipagtanggol niya ang Pransiya mula sa pananakop ng mga Ingles. Sinundan niya ang utos ng mga tinig at nagbihis lalaki siya't sumapi sa Sandatahang Real ng Pransiya. Isa sa mga himalang nagawa niya ay kilalalin si Carlos, ang Dauphin (pagbigkas: DOfan) o prinsipe ng Pransiya na naging si haring Carlos VII. Sa isang okasyon, sa halip ng pagbihis ni Carlos sa karaniwan niyang mga damit bilang Dauphin ay nagdamit siya ng pangkaraniwang tao at nakipag-halubilo siya sa maraming tao. Kaagad-agad siyang nabuking ni Juana, at inalay ng dalagita ang kaniyang mga serbisyong pansandatahan sa Dauphin. Sa gulang na 17 taon, naging pinuno siya ng Sandatahang Real ng Pransiya at matagumpay na iniligtas ang lungsod ng Orleans mula sa mga Ingles.",
    ] },
  { "title" = "Kamatayan at pagkasanto", "paragraphs" = [
      "Hinuli siya ng mga kalaban niya at ibinenta sa mga Ingles at pagkatapos ng isang paglilitis, sinunog siya sa bayan ng Rouen nang dahil sa krimen ng heresiya at pagiging mangkukulam noong 30 Mayo 1431. Si Juana ay 19 taong gulang pa lamang noong siya'y ibinitay. Isa pang paglilitis ay isinagawa pagkatapos ng kamatayan ni Juana, at idineklara siyang walang sala noong 7 Hulyo 1456. Ginawa siyang Santa ng Simbahang Katoliko ni Santo Papa Benedicto XV noong 16 Mayo 1920.",
    ] },
  { "title" = "Epekto", "paragraphs" = [
      "Dagdag pa sa kaniyang pagiging Banal sa Simbahang Katoliko at patron ng ilang mga bagay-bagay, isa siyang pambansang bayani sa kaniyang katutubong Pransiya, at isang modelo para sa mga babae. Ang isang mahahalintulad dito kay Santa Juana ay si Gabriela Silang, binansagang \"Ang Juana ng Arko ng Ilokos\".",
    ] },
]

[articles.pt]
text = "Joana d’Arc (em francês: Jeanne d’Arc, IPA: [ʒan daʁk]; em francês médio: Jehanne Darc, IPA: [ʒəˈãnə ˈdark]; Domrémy-la-Pucelle, ca. 1412 – Ruão, 30 de maio de 1431) foi uma camponesa e santa francesa canonizada pela Igreja Católica, considerada uma heroína da França pelos seus feitos durante a Guerra dos Cem Anos."
title = "Joana d'Arc"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Joana_d%27Arc"
intro = [
  "Joana d’Arc (em francês: Jeanne d’Arc, IPA: [ʒan daʁk]; em francês médio: Jehanne Darc, IPA: [ʒəˈãnə ˈdark]; Domrémy-la-Pucelle, ca. 1412 – Ruão, 30 de maio de 1431) foi uma camponesa e santa francesa canonizada pela Igreja Católica, considerada uma heroína da França pelos seus feitos durante a Guerra dos Cem Anos. Nasceu filha de Jacques d’Arc e Isabelle Romée, numa família camponesa, em Domrémy no nordeste da França. Joana alegava receber visões divinas do arcanjo Miguel, de Santa Margarida e da Santa Catarina, que a instruíram a ajudar as forças de Carlos VII e livrar a França do domínio da Inglaterra. O não coroado Carlos VII enviou Joana junto com um exército para tentar solucionar o Cerco de Orleães. Após apenas nove dias de ação, a batalha terminou com um resultado favorável aos franceses e Orleães foi libertada, elevando assim a reputação de Joana a condição de heroína nacional aos olhos do povo francês. Seguiu-se uma série de vitórias militares para as forças de Carlos VII, que permitiram sua coroação como rei na Catedral de Reims. Como resultado, a moral da população francesa melhorou e a maré da Guerra dos Cem Anos começou a virar em favor dos franceses.",
  "Após o fracassado Cerco de Paris, contudo, a popularidade de Joana dentre a nobreza francesa despencou. Em 23 de maio de 1430, ela foi capturada em Compiègne pelos Borguinhões, um grupo de franceses que apoiavam os ingleses. Eles a entregaram nas mãos do governo da Inglaterra, que colocaram seu julgamento nas mãos do bispo Pierre Cauchon, jogando contra ela diversas acusações de cunho religioso. Cauchon a declarou culpada e ela foi sentenciada à morte na fogueira. Joana foi executada em 30 de maio de 1431, aos 19 anos de idade. Sua morte, contudo, a elevou aos status de mártir e fez aumentar o fervor patriótico francês contra os ingleses.",
  "Em 1456, um tribunal inquisitorial foi autorizado pelo Papa Calisto III para examinar seu julgamento, revendo suas acusações e proclamando sua inocência, formalmente declarando Joana como uma mártir da igreja. No século XVI ela foi usada como símbolo pela Liga Católica contra os protestantes e, em 1803, Joana foi oficialmente declarada como um símbolo nacional da França por decisão do imperador Napoleão Bonaparte. Ela foi beatificada em 1909 e canonizada em 1920 pelo Vaticano.",
  "Joana d'Arc é atualmente uma dos nove padroeiros da França. Ela permanece uma figura popular no país e pelo mundo, sendo retratada em inúmeras peças de literatura, pinturas, esculturas e outras formas de arte, sendo figura central no trabalho de vários escritores, artistas, cineastas e compositores famosos.",
]
sections = [
  { "title" = "Nome", "paragraphs" = [
      "O nome de Joana d'Arc foi escrito de várias maneiras. Não há uma grafia padrão para seu nome antes do século XVI; seu sobrenome era geralmente escrito como \"Darc\" sem apóstrofo, mas há variantes como \"Tarc\", \"Dart\" ou \"Day\". O nome de seu pai foi escrito como \"Tart\" em seu julgamento. Ela era chamada de \"Jeanne d'Ay de Domrémy\" em uma carta de Carlos VII, de 1429, concedendo-lhe um brasão. Joana pode nunca ter ouvido ser chamada de \"Jeanne d'Arc\". O primeiro registro escrito de que ela foi chamada por esse nome é de 1455, 24 anos após sua morte.",
      "Ela não foi ensinada a ler e escrever na infância e suas cartas foram todas ditadas para uma outra pessoa escrever. Mais tarde, ela pode ter aprendido a assinar seu nome, já que algumas de suas cartas são assinadas e pode até ter aprendido a ler. Joana referia-se a si mesma nas cartas como Jeanne la Pucelle (\"Joana, a Donzela\") ou la Pucelle (\"a Donzela\"), enfatizando sua virgindade, e ela assinava \"Jehanne\". No século XVI, ela ficou conhecida como a \"Donzela de Orleães\".",
    ] },
  { "title" = "Nascimento e contexto histórico", "paragraphs" = [
      "Joana d'Arc nasceu por volta de 1412 em Domrémy, uma pequena vila no vale do Meuse, atualmente no departamento de Vosges, no nordeste da França. Sua data de nascimento é desconhecida, e suas declarações sobre sua idade eram vagas. Seus pais eram Jacques d'Arc e Isabelle Romée. Joana tinha três irmãos e uma irmã. Seu pai era um camponês agricultor com cerca de 50 acres (20 hectares) de terra, e complementava a renda da família como oficial da aldeia, cobrando impostos e liderando a guarda local.",
      "Ela nasceu durante a Guerra dos Cem Anos entre Inglaterra e França, que havia começado em 1337 devido ao status de territórios ingleses na França e às reivindicações inglesas ao trono francês. Quase todos os combates ocorreram na França, devastando sua economia. Na época do nascimento de Joana, a França estava politicamente dividida. O rei francês Carlos VI tinha crises recorrentes de doença mental e frequentemente era incapaz de governar; seu irmão Luís, o Duque de Orleães, e seu primo João Sem Medo, o Duque da Borgonha, disputavam a regência da França. Em 1407, o Duque da Borgonha ordenou o assassinato do Duque de Orleães, precipitando uma guerra civil. Carlos de Orleães sucedeu seu pai como duque aos treze anos e foi colocado sob a custódia de Bernardo, Conde de Armagnac; seus apoiadores ficaram conhecidos como \"Armagnacs\", enquanto os apoiadores do Duque da Borgonha ficaram conhecidos como \"Borguinhões\". O futuro rei francês Carlos VII assumiu o título de Delfim (herdeiro do trono) após a morte de seus quatro irmãos mais velhos e era associado aos Armagnacs.",
      "Henrique V da Inglaterra explorou as divisões internas da França ao invadir o país em 1415. Os Borguinhões tomaram Paris em 1418. Em 1419, o Delfim ofereceu uma trégua para negociar a paz com o Duque da Borgonha, mas o duque foi assassinado por partidários Armagnacs de Carlos durante as negociações. O novo duque da Borgonha, Filipe, o Bom, aliou-se aos ingleses. Carlos VI acusou o Delfim de assassinar o Duque da Borgonha e declarou-o inapto para herdar o trono francês. Durante um período de doença, a esposa de Carlos, Isabel da Baviera, assumiu seu lugar e assinou o Tratado de Troyes, que deu sua filha Catarina de Valois em casamento a Henrique V, garantiu a sucessão do trono francês aos seus herdeiros e efetivamente deserdou o Delfim. Isso gerou rumores de que o Delfim não era filho do rei Carlos VI, mas fruto de um caso adúltero entre Isabel e o duque de Orleães assassinado. Em 1422, Henrique V e Carlos VI morreram com dois meses de diferença; o recém-nascido Henrique VI da Inglaterra era o herdeiro nominal da dupla monarquia anglo-francesa conforme acordado no tratado, mas o Delfim continuava a reivindicar o trono francês.",
    ] },
  { "title" = "Primeiros anos", "paragraphs" = [
      "Em sua juventude, Joana realizava tarefas domésticas, fiava lã, ajudava seu pai nos campos e cuidava dos animais da família. Sua mãe foi responsável pela educação religiosa de Joana. Grande parte de Domrémy ficava no Ducado de Bar, cujo status feudal exato era incerto; embora cercado por terras pró-Borguinhões, seu povo era leal à causa armagnac. Em 1419, a guerra já havia afetado a região e em 1425, Domrémy foi atacada e o gado foi roubado. Isso gerou um sentimento entre os moradores de que os ingleses precisavam ser expulsos da França para alcançar a paz. Joana teve sua primeira visão após esse ataque.",
      "Joana posteriormente testemunhou que, quando tinha treze anos, por volta de 1425, uma figura que ela identificou como São Miguel, cercado por anjos, apareceu a ela no jardim. Após essa visão, ela disse que chorou porque queria que eles a levassem com eles. Ao longo de sua vida, ela teve visões de São Miguel, um santo padroeiro da região de Domrémy que era visto como um defensor da França. Ela afirmou que tinha essas visões frequentemente e que muitas vezes as experimentava quando os sinos da igreja tocavam. Suas visões também incluíam Santa Margarida e Santa Catarina; embora Joana nunca tenha especificado, provavelmente eram Margarida de Antioquia e Catarina de Alexandria, as mais conhecidas na região. Ambas eram conhecidas como santas virgens que enfrentaram inimigos poderosos, foram torturadas e martirizadas por suas crenças e preservaram sua virtude até a morte. Joana testemunhou que jurou um voto de castidade a essas vozes. Quando um jovem de sua vila alegou que ela havia quebrado uma promessa de casamento, Joana declarou que não havia feito nenhuma promessa a ele e o caso foi rejeitado por um tribunal eclesiástico.",
      "Durante a juventude de Joana, circulava no interior da França uma profecia, baseada nas visões de Marie Robine de Avignon, que prometia que uma virgem armada surgiria para salvar a França. Outra profecia, atribuída a Merlin, dizia que uma virgem carregando um estandarte acabaria com o sofrimento da França. Joana deu a entender que era essa donzela prometida, lembrando as pessoas ao seu redor de que havia um ditado que dizia que a França seria destruída por uma mulher, mas seria restaurada por uma virgem. Em maio de 1428, ela pediu a seu tio que a levasse até a cidade próxima de Vaucouleurs, onde solicitou ao comandante da guarnição, Robert de Baudricourt, uma escolta armada para a corte de Carlos VII em Chinon. Baudricourt recusou duramente e a mandou de volta para casa. Em julho, Domrémy foi atacada por tropas borgonhesas, que incendiaram a cidade, destruíram as colheitas e forçaram Joana, sua família e os outros moradores a fugirem. Ela voltou a Vaucouleurs em janeiro de 1429. Sua solicitação foi novamente recusada, mas, dessa vez, ela já havia ganhado o apoio de dois soldados de Baudricourt, Jean de Metz e Bertrand de Poulengy. Enquanto isso, ela foi convocada para Nancy sob salvo-conduto por Carlos II, Duque da Lorena, que havia ouvido falar de Joana durante sua estadia em Vaucouleurs. O duque estava doente e pensava que ela poderia ter poderes sobrenaturais capazes de curá-lo. Ela não ofereceu nenhuma cura, mas o repreendeu por viver com sua amante.",
    ] },
  { "title" = "Encontro com Carlos", "paragraphs" = [
      "Carlos VII encontrou Joana pela primeira vez na Corte Real em Chinon no final de fevereiro ou início de março de 1429, quando ela tinha dezessete anos e ele tinha vinte e seis. Ela disse a ele que havia vindo para encerrar o cerco de Orleães e levá-lo a Reims para sua coroação. Eles tiveram uma conversa privada que causou uma forte impressão em Carlos; ela teria dito para o Delfim: \"Senhor, vim conduzir os seus exércitos à vitória\". Jean Pasquerel, confessor de Joana, posteriormente testemunhou que ela lhe disse que havia tranquilizado o Delfim de que ele era filho de Carlos VI e o legítimo rei.",
      "Carlos e seu conselho precisavam de mais garantias, enviando Joana a Poitiers para ser examinada por um conselho de teólogos, que declararam que ela era uma boa pessoa e uma boa católica. Eles não chegaram a uma decisão sobre a origem da inspiração de Joana, mas concordaram que enviá-la a Orleães poderia ser útil ao rei e serviria para testar se sua inspiração era de origem divina. Joana foi então enviada a Tours para ser examinada fisicamente por mulheres designadas pela sogra de Carlos, Iolanda de Aragão, que verificaram sua virgindade. Isso foi feito para estabelecer se ela poderia de fato ser a virgem salvadora da França prevista na profecia, para mostrar a pureza de sua devoção e para garantir que ela não havia se envolvido com o Diabo.",
      "O Delfim, tranquilizado pelos resultados desses testes, encomendou uma armadura de placas para ela. Joana desenhou seu próprio estandarte e mandou trazer uma espada debaixo do altar na igreja de Sainte-Catherine-de-Fierbois. Por volta dessa época, ela começou a se autodenominar \"Joana, a Donzela\", enfatizando sua virgindade como um sinal de sua missão.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Joana é uma das pessoas mais estudadas da Idade Média, em parte porque seus dois julgamentos forneceram uma riqueza de documentos. Sua imagem, mudando ao longo do tempo, incluiu a de salvadora da França, filha obediente da Igreja Católica Romana, uma feminista pioneira e símbolo de liberdade e independência.",
      "A reputação de Joana como líder militar que ajudou a expulsar os ingleses da França começou a se formar antes de sua morte. Logo após a coroação de Carlos VII, Cristina de Pisano escreveu o poema Ditié de Jehanne D'Arc, celebrando Joana como uma apoiadora de Carlos enviada pela Divina Providência e refletindo o otimismo francês após o triunfo em Orleães. Já em 1429, Orleães começou a realizar uma celebração em homenagem ao fim do cerco em 8 de maio.",
      "Após a execução de Joana, seu papel na vitória de Orleães incentivou o apoio popular à sua reabilitação. Joana tornou-se uma parte central da celebração anual e, em 1435, uma peça, Mistère du siège d'Orléans (\"Mistério do Cerco de Orleães\"), a retratava como o instrumento da vontade divina que libertou Orleães. O festival de Orleães celebrando Joana continua nos tempos modernos.",
    ] },
]

