[articles.en]
text = "The Wanli Emperor, personal name Zhu Yijun, was the 14th emperor of the Ming dynasty of China, reigning from 1572 to 1620. He succeeded his father, the Longqing Emperor."
title = "Wanli Emperor"
lang = "en"
url = "https://en.wikipedia.org/wiki/Wanli_Emperor"
intro = [
  "The Wanli Emperor (4 September 1563 – 18 August 1620), personal name Zhu Yijun, was the 14th emperor of the Ming dynasty of China, reigning from 1572 to 1620. He succeeded his father, the Longqing Emperor.",
  "The Wanli Emperor ascended the throne at the age of nine. During the first ten years of his reign, Grand Secretary Zhang Juzheng effectively led the government, while the Emperor's mother, Lady Li, and the eunuch Feng Bao also played significant roles. The country experienced economic and military prosperity, reaching a level of power not seen since the early 15th century. The Emperor held great respect and appreciation for Zhang Juzheng, but as time passed, various factions within the government openly opposed Zhang, and the Emperor started to consider his influential position a burden. After Zhang died in 1582, the Emperor made significant changes to his administrative arrangements.",
  "Ming China saw three major campaigns in the last decade of the 16th century. A Ming force of 40,000 soldiers had quelled a large rebellion in Ningxia by October 1592, allowing the Ming to shift their focus to Korea. Concurrently, Japan invaded Korea, leading to a joint Korean-Chinese force, including 40,000 Ming soldiers, pushing the Japanese out of most of Korea and forcing them to retreat to the southeast coast by 1593. In 1597, a second Japanese invasion was thwarted, and the suppression of the Yang Yinglong rebellion in southwest China concluded in a few months from 1599 due to Ming forces concentrating there amidst the ongoing war with Japan. In the final years of the Wanli era, the Jurchens grew stronger on the northeastern frontiers and posed a significant threat. In 1619, they defeated the Ming armies in the Battle of Sarhu and captured part of Liaodong.",
  "Over time, the Emperor grew increasingly disillusioned with the constant demoralizing attacks and counterattacks from officials, causing him to become increasingly isolated. In the 1580s and 1590s, he attempted to promote his third son, Zhu Changxun, as heir to the throne, but many officials supported his eldest son, Zhu Changluo. This led to ongoing conflicts between the Emperor and his ministers for over fifteen years. Eventually, the Emperor appointed Zhu Changluo as heir in 1601, and Zhu Changluo later succeeded his father as the Taichang Emperor in 1620. In 1596, the Wanli Emperor attempted to establish a parallel administration composed of eunuchs, separate from the officials who had traditionally governed the empire, but this effort was abandoned in 1606. The governance of the country remained in the hands of Confucian intellectuals, who were often embroiled in disputes with each other. The opposition Donglin movement continued to criticize the Emperor and his followers, while pro-government officials were divided based on their regional origins.",
]
sections = [
  { "title" = "Early childhood", "paragraphs" = [
      "Zhu Yijun, the future Wanli Emperor, was born on 4 September 1563 during the reign of his grandfather, the Jiajing Emperor, who ruled China's Ming dynasty from 1521 to 1567. His father, Zhu Zaiji, was the heir to the throne, and his mother, Lady Li, was one of Zhu Zaiji's concubines. He had two older brothers, both of whom died in early childhood before 1563, and a younger brother, Zhu Yiliu (朱翊鏐; 1568–1614), who was made Prince of Lu in 1571. Zhu Zaiji ascended the throne as the Longqing Emperor in 1567. On 5 July 1572, the Longqing Emperor died at the age of 35, and Zhu Yijun succeeded his father two weeks later on 19 July 1572. He adopted the era name Wanli, which means \"ten thousand years (of rule)\".",
    ] },
  { "title" = "Early reign: Zhang Juzheng's leadership (1572–1582)", "paragraphs" = [
      "At the end of the Longqing Emperor's reign, the government was led by Senior Grand Secretary Gao Gong. Shortly after the Wanli Emperor's accession, an alliance between the influential eunuch Feng Bao and Grand Secretary Zhang Juzheng succeeded in removing Gao. Zhang replaced Gao and remained in power until his death in 1582. Seeking to \"enrich the country and strengthen the army\", Zhang promoted Legalist rather than Confucian policies. He centralized government, expanded imperial authority at the expense of local interests, streamlined administration, and strengthened the military. His reforms included closing local academies and placing investigating censors under the Grand Secretariat's control. The Empress Dowager served as regent, and she and Feng Bao supported Zhang. Zhang selected his colleagues in the Grand Secretariat and extended informal influence over the Ministry of Rites and the Censorate through loyal appointments in central and regional offices. Although he lacked formal authority to issue orders, this arrangement gave him considerable power. He also redirected censors from personal vendettas toward tax collection and suppressing banditry. The efficiency of Ming administration improved markedly between 1572 and 1582, reaching a level seen only in the dynasty's early years.",
      "Zhang implemented a series of reforms, including the conversion of tax payments from goods to silver (the single whip reform), changes to the old military field system, and revisions to county accounts on corvée labor, fees, and surcharges between 1572 and 1579. A new cadastre was compiled from 1580 to 1582, and these reforms were formalized empire-wide through revised lists of taxpayers' obligations, unified into payments in silver. As part of the administrative reforms, unnecessary activities were abolished or limited, state support for Confucian students was reduced, and provincial authorities were instructed to require only one-third of the former corvée labor. Postal services were also curtailed. Despite these measures, tax rates remained unchanged and arrears were strictly enforced, enabling Zhang to generate a surplus of income over expenditure. This was a notable achievement, as the Ming state usually lacked financial reserves in the 16th century. Improved savings and tax collection produced substantial reserves: by 1582, granaries around the capital held nine years' worth of grain; the Taicang treasury (太倉庫) contained 6 million liang (about 223 tons) of silver; the Court of the Imperial Stud (太僕寺) held another 4 million; and 2.5 million was stored in Nanjing. Smaller reserves also existed in Sichuan, Zhejiang, and Guangxi. Despite these successes, Zhang introduced no institutional innovations, instead improving existing procedures under the slogan of restoring the order of the early Ming period.",
      "As a proponent of peace with the Mongols, Zhang rejected the proposal of Minister of War Tan Lun for a pre-emptive strike against them. Instead, he ordered Qi Jiguang, commander of the northeastern border, to maintain an armed peace. This decision not only allowed for a reduction in the border army, but also resulted in the return of surplus soldiers to their family farms. Zhang rejected the notion that military affairs were less important than civilian ones, and challenged the dominance of civilian dignitaries over military leaders. He appointed capable military leaders such as Qi Jiguang, Wang Chonggu (王崇古), Tan Lun, Liang Menglong (梁夢龍), and Li Chengliang to positions of responsibility. Additionally, he implemented a combination of defensive and offensive measures to strengthen border defenses and fostered peaceful relations with neighboring countries by opening border markets, particularly in the northwest.",
    ] },
  { "title" = "Later reign (1582–1620)", "paragraphs" = [
      "After Zhang's death, Empress Dowager Li formed alliances with his successors, Shen Shixing, Xu Guo (許國), and Wang Xijue. A coalition emerged between the Empress Dowager, the grand secretaries, the Ministry of Personnel, and the Censorate to ensure efficient administration of the empire. The opposition objected to this alliance and deemed it illegal, but with the absence of a strong statesman in the Grand Secretariat, there was no one to bring the administration under control. Both the Emperor and opposition officials feared the concentration of power in the Grand Secretariat and worked to prevent it. From 1582 to 1591, the Grand Secretariat was led briefly by Zhang Siwei (張四維) and then for eight years by Shen Shixing. Shen attempted to find compromises between the Emperor and the bureaucracy, while also tolerating criticism and respecting the decisions of ministries and the censors, but his efforts to create a cooperative and cohesive atmosphere were unsuccessful. In 1590, the Grand Secretariat's alliance with the leadership of the Ministry of Personnel and the Censorate fell apart, causing Shen to lose much of his influence. He was eventually forced to resign in 1591 due to his approach to the succession issue, which had lost him the confidence of opposition officials.",
      "After 1582, the Emperor chose the leaders of the Grand Secretariat from among the opponents of Zhang Juzheng (after Shen Shixing, the position was held by Wang Jiaping (王家屏), Wang Xijue, and Zhao Zhigao (趙志皋) until 1601). Except for the short-lived Wang Jiaping, all of Zhang's successors—including Shen Yiguan (沈一貫), Zhu Geng (朱賡), Li Tingji (李廷機), Ye Xianggao, and Fang Congzhe (方從哲)—fell out of favor and were either accused by censors during their lifetime or posthumously.",
      "Opposition to Zhang, led by Gu Xiancheng, succeeded after his death in condemning him and purging his followers from the bureaucracy. This, however, enabled censors to criticize senior officials more freely, which angered the Emperor and caused widespread dissatisfaction, as the critics offered no constructive solutions. Zhang's opponents soon became entangled in persistent factional disputes, obstructing efforts to restore a strong centralized government. From 1585, censors also began to criticize the Emperor's private life. His reluctance to impose harsh punishments emboldened them. The Wanli Emperor attempted to silence informants among his servants and gradually ceased responding to criticism. In 1588, accusations that he had accepted a bribe from a eunuch shocked the Emperor and led him to withdraw from cooperation with officials. He minimized contact with them, canceled the morning audience, and appeared publicly only at military celebrations. Communication with the bureaucracy was largely limited to written reports, often unanswered. Toward the end of his reign, he obstructed personnel appointments, leaving offices vacant and allowing officials to depart without written consent—an illegal practice that went unpunished. By 1603, nine of thirteen regional inspector posts remained unfilled, and by 1604, nearly half of prefectural offices and more than half of ministerial and vice-ministerial posts in both capitals were vacant. The Emperor also deliberately left many eunuch posts empty, especially the head of the Directorate of Ceremonial, in an effort to weaken ties between eunuchs and officials. This policy resulted in significant financial savings from unoccupied positions.",
    ] },
  { "title" = "Military campaigns", "paragraphs" = [
      "In March 1592, a rebellion broke out in Ningxia, an important fortress city on the northwestern frontier. Led by Chinese officer Liu Dongyang, the soldiers of the garrison revolted. The rebellion was also joined by Pubei, a Mongol and deputy regional commander who had three thousand horsemen in his personal guard. Due to his origin, the rebellion was attributed to him. The rebels successfully took control of Ningxia and nearly fifty nearby fortresses. They demanded recognition from the government, threatening to ally with the Ordos Mongols. At the time, Ningxia had a population of 300,000 and a garrison of 30,000 (or 20,000) soldiers. The city walls were six meters thick and nine meters high, making it a formidable stronghold. The rebels were experienced soldiers.",
      "On 19 April, the Emperor was informed of the uprising and immediately summoned Minister of War Shi Xing (石星). Following the minister's proposal, he ordered the mobilization of 7,000 soldiers from Xuanhua and Shanxi. Wei Xueceng, an experienced military official and commander-in-chief of the three border regions (Xuanfu, Shanxi, and Datong), was entrusted with the task of suppressing the rebellion. The Emperor provided him with a number of officers and officials, including Ma Gui. Wei successfully secured the southern bank of the Yellow River, captured key forts, and within weeks recaptured nearby frontier forts, leaving only the city of Ningxia under rebel control, but he then declared that he did not have enough men and equipment and took a passive stance. Despite the reinforcements provided, he insisted on negotiating with the insurgents, citing concerns for the lives of civilians in Ningxia. The Emperor discussed the situation with the grand secretaries, the censors and the ministers, and ultimately took a decisive position to suppress the rebellion as quickly as possible. For the next six weeks, Ming troops besieged Ningxia, occasionally facing resistance from the Mongols. In the fourth month of the year, the Ming launched an attack on the city and managed to eliminate about 3,000 defenders, but their attempt to penetrate the city through the northern gate failed and resulted in heavy losses.",
      "In an effort to conduct the siege operations more effectively, the Emperor appointed Li Rusong as the military superintendent in charge of suppressing the rebellion. The bureaucracy in the capital were shocked at this appointment, as civilian officials, not professional officers, traditionally held the position and overall command. In July, Ming reinforcements arrived at Ningxia and skirmishes between the besiegers and the rebels continued. At the end of July, Li also arrived and began attacking the city day and night in early August. The rebels were only able to repel them with difficulty. Meanwhile, the Japanese were successfully occupying Korea, prompting the Emperor to urge a swift resolution of the situation. In late August, Wei Xueceng was arrested for his reluctance and taken to Beijing. The Emperor then approved Shi Xing's plan to build ramparts around the city and fill the interior, including the city itself, with water.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "In the final months of his life, the Wanli Emperor's health deteriorated significantly. In 1620, he experienced severe dizziness and was confined to his bed. He died on 18 August 1620. The day after his death, an edict was issued ordering the transfer of one million liang of silver from the Emperor's treasury to the frontier troops. Two days later, an additional million was sent from the treasury to strengthen the defenses of Liaodong. The edict also called for the abolition of mining and trade dues, and the dismissal of the eunuchs responsible for collecting them. On 28 August, the Wanli Emperor's eldest son, Zhu Changluo, ascended the throne as the Taichang Emperor.",
      "The Wanli Emperor was buried in the Ming tombs at the foot of Tianshou Mountain outside Beijing, where thirteen of the sixteen Ming emperors were interred. His burial complex, the Ding Mausoleum, was constructed between 1584 and 1590 and consists of three walled courtyards and an underground palace beneath a large burial mound. Excavated by Chinese archaeologists in 1956–1957, the underground complex contained several chambers, including the burial chamber of the Wanli Emperor, Empress Wang, and the mother of the Taichang Emperor. More than 3,000 artifacts were recovered, including jewelry, gold and silver objects, jade and porcelain wares, clothing, and imperial crowns. Since the 1990s, the excavation has been criticized in China for its unprofessional methods, as many wooden and textile artifacts could not be properly preserved. In addition, numerous finds, including the remains of the Emperor and his consorts, were destroyed during the Cultural Revolution.",
    ] },
]

[articles.es]
text = "El Emperador Wanli en chino tradicional, 萬曆帝; pinyin, Wànlì Dì; (4 de septiembre de 1563 – 18 de agosto de 1620), nombre personal Zhu Yijun (en chino tradicional, 朱翊鈞; pinyin, Zhū Yìjūn), fue el XIV Emperador de la dinastía Ming, reinó desde 1572 hasta 1620. «Wanli», el nombre de la era de su reinado, significa literalmente «diez mil calendarios»."
title = "Emperador Wanli"
lang = "es"
url = "https://es.wikipedia.org/wiki/Emperador_Wanli"
intro = [
  "El Emperador Wanli en chino tradicional, 萬曆帝; pinyin, Wànlì Dì; (4 de septiembre de 1563 – 18 de agosto de 1620), nombre personal Zhu Yijun (en chino tradicional, 朱翊鈞; pinyin, Zhū Yìjūn), fue el XIV Emperador de la dinastía Ming, reinó desde 1572 hasta 1620. «Wanli», el nombre de la era de su reinado, significa literalmente «diez mil calendarios». Fue el tercer hijo del Emperador Longqing. Su reinado de 48 años (1572-1620) fue el más largo entre todos los emperadores de la dinastía Ming.​ Fue testigo de varios éxitos en su reinado, seguido del declive de la dinastía cuando el emperador se retiró de su papel activo en el gobierno alrededor de 1600.",
]
sections = [
  { "title" = "Reinado temprano (1572-1582)", "paragraphs" = [
      "Zhu Yijun ascendió al trono a la edad de diez años y adoptó el nombre de reinado «Wanli», por lo que históricamente se le conoce como el Emperador Wanli. Durante los primeros diez años de su reinado, fue ayudado por el Gran Secretario Principal (shǒufǔ) Zhang Juzheng, quien gobernó el país como regente de Yijun. Durante este período, el emperador Wanli respetó profundamente a Zhang como un valioso mentor y ministro. Las competiciones de tiro con arco, la equitación y la caligrafía fueron algunos de los pasatiempos de Wanli.​",
      "Cuando Zhang Juzheng fue nombrado ministro de la dinastía Ming en 1572, lanzó una reforma con el nombre de «acatamiento de las reglas de los antepasados». Comenzó por rectificar la administración con una serie de medidas, como reducir el personal redundante y mejorar la evaluación del desempeño de los funcionarios. Esto mejoró la calidad y la eficiencia de la administración de los funcionarios y, con base en estos hechos, lanzó reformas relevantes en los campos de la tierra, las finanzas y los asuntos militares. En esencia, la reforma de Zhang Juzheng fue una rectificación de las enfermedades sociales sin ofender a las políticas establecidas y al sistema fiscal de la dinastía Ming. Aunque no erradicó la corrupción política y la anexión de tierras, alivió positivamente las contradicciones sociales. Además, Zhang protegió eficientemente a la dinastía de Japón, yurchenes y mongoles para poder ahorrar gastos de defensa nacional. En la década de 1580, Zhang almacenó una cantidad inmensurable de plata, equivalente a solo 10 años de los ingresos fiscales totales de Ming. Los años del régimen de Wanli llevaron a un renacimiento económico, cultural y militar, una era conocida en China como el renacimiento de Wanli (萬曆 中興).",
      "Durante los primeros diez años de la era Wanli, la economía y el poder militar de la dinastía Ming prosperaron de una manera que no se había visto desde el Emperador Yongle y el Gobierno de Ren y Xuan, de 1402 a 1435. Después de la muerte de Zhang, el Emperador Wanli se sintió libre para actuar de forma independiente y revirtió muchas de las mejoras administrativas de Zhang. En 1584, el emperador Wanli emitió un edicto confiscando toda la riqueza personal de Zhang y purgando a los miembros de su familia. Especialmente después de 1586, cuando tuvo conflictos con vasallos sobre su heredero, Wanli decidió no celebrar el consejo durante 20 años. El declive de la dinastía Ming comenzó en el ínterin.",
    ] },
  { "title" = "Reinado medio (1582-1600)", "paragraphs" = [
      "Después de la muerte de Zhang Juzheng, el emperador Wanli decidió tomar el control personal completo del gobierno. Durante esta primera parte de su reinado, demostró ser un emperador competente y diligente. En general, la economía siguió prosperando y el imperio siguió siendo poderoso. A diferencia de los últimos 20 años de su reinado, el Emperador Wanli en este momento asistía a todas las reuniones de la mañana y discutía asuntos de estado.",
      "Los primeros 18 años de la era Wanli estarían dominados por tres guerras que enfrentó con éxito:",
      "Motín de Ningxia: en las regiones fronterizas del norte, un general Ming (Liu Dongyang) se rebeló y se alió con los mongoles, liderados por el Príncipe Pubei, para atacar el Imperio Ming.​ En este momento, el Emperador Wanli envió a Ma Gui y Li Rusong para manejar la situación, lo que resultó en un éxito general.​ El conflicto duró entre 1592 y 1593 e impidió que los Ming pudieran socorrer de manera inmediata a su aliado coreano de la invasión japonesa.​",
    ] },
  { "title" = "Reinado tardío (1600-1620)", "paragraphs" = [
      "Durante los últimos años del reinado del emperador Wanli, se alejó por completo de su papel imperial y, de hecho, se declaró en huelga. Se negó a asistir a las reuniones matutinas, a ver a sus ministros o actuar según los memorandos. También se negó a hacer los nombramientos de personal necesarios y, como resultado, todo el escalón superior de la administración Ming se quedó sin personal. Sin embargo, prestó mucha atención a la construcción de su propia tumba, una estructura magnífica que tardó décadas en completarse.",
      "Hay varias razones por las que el emperador Wanli descuidó deliberadamente sus deberes como emperador. Una fue que se desencantó con los ataques moralistas y los contraataques de los funcionarios, arraigados en una ortodoxia confuciana abstracta.​ Sin embargo, una razón más importante fue una disputa sobre la sucesión imperial. La consorte favorita del emperador era la consorte Zheng, y durante las décadas de 1580 y 1590, el emperador deseaba mucho que el hijo que tuvo con ella (Zhu Changxun) fuese el príncipe heredero, a pesar de que solo era el tercer hijo del emperador y no era el favorito para la sucesión. Muchos de sus poderosos ministros se opusieron, y esto provocó un enfrentamiento entre soberanos y ministros que duró más de 15 años. En octubre de 1601, el emperador Wanli finalmente cedió y promovió a Zhu Changluo, el futuro emperador Taichang, como príncipe heredero. Aunque los ministros parecen haber triunfado, el emperador Wanli adoptó una política de resistencia pasiva, negándose a desempeñar su papel para permitir que el gobierno funcione adecuadamente, lo que provocó graves problemas tanto dentro de la propia China como en las fronteras.​ Además, el emperador continuó expresando su objeción a la elección de Zhu Changluo como heredero natural, incluso retrasando el entierro de la princesa Guo (esposa de Changluo) por dos años, antes de permitirle ser enterrada apropiadamente.​",
      "En este momento comenzó el crecimiento de lo que se convertiría en la amenaza manchú. El área conocida como Manchuria en el noreste de China, fue conquistada gradualmente por los Yurchen, comandados por su cacique Nurhaci. Nurhaci continuaría creando la dinastía Jin (la precursora de la dinastía Qing), que ahora se convertiría en una amenaza inmediata para la dinastía Ming. Para entonces, después de 20 años de disfunción imperial, el ejército Ming estaba en fuerte declive. Si bien los Yurchenes eran menos numerosos, eran más feroces y mejores luchadores. Por ejemplo, en la Batalla de Nun Er Chu en 1619, el gobierno Ming envió un ejército de 200 000 contra el ejército de Jin de 60 000, con Nurhaci controlando seis estandartes y 45 000 tropas como ataque central, mientras que Daišan y Hung Taiji controlaban cada uno a 7500 tropas y un estandarte, atacaron desde los lados. Después de cinco días de batalla, el ejército Ming sufrió bajas de más de 100 000, con el 70% de su suministro de alimentos robado.",
    ] },
  { "title" = "Legado y muerte", "paragraphs" = [
      "Su reinado también experimentó fuertes presiones fiscales y militares, especialmente durante los últimos años de la era Wanli, cuando los manchúes comenzaron a realizar incursiones en la frontera norte del Imperio Ming. Sus depredaciones crecientes en última instancia conducirían a la caída de la dinastía en 1644. La caída de la dinastía Ming no fue el resultado de las actuaciones del último emperador, Chongzhen, sino debido a las consecuencias persistentes de la negligencia grave del emperador Wanli con sus deberes como Emperador.",
      "El Emperador Wanli murió en 1620 y fue enterrado en el Mausoleo Dingling entre las tumbas Ming en las afueras de Pekín. Su tumba es una de las más grandes de los alrededores y una de las dos únicas que están abiertas al público. La tumba fue excavada en 1956 y sigue siendo la única tumba imperial que se ha excavado desde la fundación de la República Popular China en 1949. En 1966, durante la Revolución Cultural, los Guardias Rojos irrumpieron en el Mausoleo de Dingling y arrastraron los restos del emperador Wanli y sus dos emperatrices al frente de la tumba, donde fueron denunciados póstumamente y quemados después de que se tomaron fotografías de sus cráneos.​ También se destruyeron miles de otros artefactos.​",
      "Muchos libros antiguos de historia china sobre la dinastía Ming comúnmente afirman que el régimen de Wanli causó la rápida caída de la dinastía. Sin embargo, hay diferentes opiniones sobre porqué Wanli fue negligente durante mucho tiempo. Algunos historiadores afirman que sufrió una depresión severa después de la muerte de Zhang en 1582, que era un consumidor habitual de opio y que padecía una rara enfermedad en la espalda y las piernas, por lo que no podía caminar sin ayuda. Cuando su tumba fue excavada en 1958, sus restos fueron inspeccionados y los historiadores descubrieron que la parte superior del cuerpo de Wanli estaba notablemente doblada. Veinte años después de su muerte, la dinastía Ming fue conquistada por los manchúes (dinastía Qing).",
    ] },
]

[articles.zh]
text = "明神宗朱翊钧（1563年9月4日—1620年8月18日），或稱萬曆帝，號禹齋，為明朝皇帝，年号万历，明穆宗朱载坖三子，生母李貴妃。隆慶六年（1572年）穆宗駕崩，九岁的朱翊钧登基，是为明神宗。在位48年，是明代在位時間最長的皇帝，谥号為「範天合道哲肃敦简光文章武安仁止孝显皇帝」。 明神宗在位前十五年，在首輔兼帝師张居正的領導下明朝一度呈現中興景象，史稱萬曆中興，而在位中期亦主持万历三大征，保護藩屬，巩固疆土。在張居正死後始親政，因國本之爭等問題而倦於朝政，自此不上朝，國家機器運轉近乎停滞，徵礦稅亦被評為一病。萬曆年間利瑪竇覲見明神宗，開始西學東漸，但同時朝廷內東林黨爭開始萌芽、塞外又有後金勢力虎視眈眈，在其晚年佔領了明朝東北大部分地區，使明朝逐步退守山海關。"
title = "明神宗"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E6%98%8E%E7%A5%9E%E5%AE%97"
intro = [
  "明神宗朱翊钧（1563年9月4日—1620年8月18日），或稱萬曆帝，號禹齋，為明朝皇帝，年号万历，明穆宗朱载坖三子，生母李貴妃。隆慶六年（1572年）穆宗駕崩，九岁的朱翊钧登基，是为明神宗。在位48年，是明代在位時間最長的皇帝，谥号為「範天合道哲肃敦简光文章武安仁止孝显皇帝」。",
  "明神宗在位前十五年，在首輔兼帝師张居正的領導下明朝一度呈現中興景象，史稱萬曆中興，而在位中期亦主持万历三大征，保護藩屬，巩固疆土。在張居正死後始親政，因國本之爭等問題而倦於朝政，自此不上朝，國家機器運轉近乎停滞，徵礦稅亦被評為一病。萬曆年間利瑪竇覲見明神宗，開始西學東漸，但同時朝廷內東林黨爭開始萌芽、塞外又有後金勢力虎視眈眈，在其晚年佔領了明朝東北大部分地區，使明朝逐步退守山海關。",
]
sections = [
  { "title" = "人物生平", "paragraphs" = [
      "作为实际上的长子，父亲明穆宗在登基后称他为“朕元子”。隆庆元年正月十八日（1567年），父亲正式起名为朱翊钧，意思是「夫钧者，言圣王制驭天下犹制器者之转钧也，其为义大矣。」隆慶二年（1568年）被立為皇太子。幼時朱翊钧就十分聰惠，明穆宗在宮中騎馬時，年幼的朱翊钧就大叫道：「父皇為天下之主，獨騎疾騁，萬一馬驚，卻如何是好？」穆宗聽後歡喜萬分，馬上下馬過來摟朱翊鈞在懷裡褒賞一番。其母李贵妃教子非常嚴格，每次經筵結束以後，便督促考問他今天所學的內容。朱翊鈞小時候稍有懈怠，李贵妃就將其召至面前長跪。",
      "隆庆五年冬，父亲明穆宗为他举行了成人冠礼。他被引导至殿前特设的帷帐内，按照礼仪规定进行三次更衣，每次以不同的服饰在众人面前亮相。一旦离开帷帐，他手持玉圭，接受引导行礼，并使用专门设计的酒杯饮酒。整个过程都由礼官的导唱和音乐伴奏，耗时近半天。次日，他再次被引导至殿前，端坐接受百官的庆贺，姿态庄重。",
      "隆慶六年，父親明穆宗駕崩，朱翊鈞即位，改元萬曆，堅持按照祖宗舊制，舉日講，御經筵，讀經傳、史書。而他每天读书亦十分用功，朝章典故都读很多遍，即使是隆冬盛暑亦从不间断，以後隨朱翊钧年渐长而学愈进，另外他的書法好，筆劃遒勁，經常親自賜墨寶給大臣，連張居正仔細端詳作品，也不得不承認皇帝的書法是「揮瀚灑墨，初若並不經意，而鋒穎所落卻是奇秀天成」，但張居正終究認為他應該成為一位聖君而非書法家，便劈頭蓋臉奏訓一頓，自此直到張居正死後朱翊鈞才重新接觸書法。",
    ] },
  { "title" = "駕崩", "paragraphs" = [
      "朝鮮一國為此舉哀。皇太子朱常洛立即发内帑百万犒赏边关将士。停止所有矿税，召回以言得罪的诸臣。不久，再发内帑百万犒边。八月即位，改元泰昌，是为明光宗，光宗即位後，內閣先是為神宗擬上廟號顯宗、諡號恭皇帝，後來，朝臣認為諡號的「恭」是晋恭帝（零陵王）、隋恭帝（酅國公）兩位末代皇帝的諡號，先帝聖謨不可殫述，而帝堯運乃神之德，於是後改成為其上廟號神宗，諡號顯皇帝。九月，在位不足三十天的明光宗便在红丸案之中暴毙。因光宗即位不到一個月即告駕崩，孫子熹宗朱由校即位後，於十月丙午（10月27日）葬神宗於定陵。",
    ] },
  { "title" = "陵寝墓地", "paragraphs" = [
      "万历帝的定陵1958年被发掘，万历帝只剩骨架，“生前体形上部为驼背”、左腳略右腳短。文革時期的1966年8月24日，遗骨被紅衛兵付之一炬。因此，萬曆皇帝之所以三十年不上朝的原因，有一說是認為自己身形不正，感到自卑，所以不敢見人。",
      "1955年10月4日，郭沫若、沈雁冰、吴晗、邓拓、范文澜、张苏等人联名提交《关于发掘明长陵的请示报告》给国务院秘书长习仲勋。报告转给主管文化工作的国务院副总理陈毅，并呈报国务院总理周恩来。文化部文物局局长郑振铎、中国科学院考古研究所副所长夏鼐得知后认为条件不成熟，强烈反对贸然发掘，高层形成一场争论。周恩来向毛泽东作了汇报，毛泽东点头后，周恩来批下“原则同意”四字。长陵发掘委员会委员夏鼐负责发掘的技术指导，便让其学生赵其昌（后任首都博物馆馆长）做前期调研。赵其昌带探工在长陵未找到发掘线索。在向夏鼐、吴晗等人汇报后，经商讨决定先试掘献陵，积累经验再发掘长陵。后来吴晗和夏鼐认为试掘献陵对长陵的发掘参考价值不大，吴晗提议试掘永陵，遭夏鼐强烈反对，认为这与发掘长陵无异；试掘思陵，吴晗认为太小，是妃子墓改建。此后吴晗和夏鼐才想到定陵。杨仕、岳南合著的《定陵地下玄宫洞开记》认为，吴晗和夏鼐想到定陵的原因有二，“第一，定陵是十三陵中营建年代较晚的一个，地面建筑保存得比较完整，将来修复起来也容易些。第二，万历是明朝统治时间最长的一个，做了48年皇帝，可能史料会多一些。” 定陵的開挖始末，《風雪定陵》一書有詳細的介紹。",
      "1956年5月开始试掘，历时一年试掘成功，1957年打开玄宫。其玄宫由前室、中室、后室、左配室、右配室组成，石条起券，前室前面有隧道券，总面积1195平方米，出土文物3000多件。1959年9月30日，就定陵原址建为“定陵博物馆”，郭沫若题写馆名。1959年10月1日正式对外开放。由于技术水平落后，出土的大批文物无法保存，发掘出土的丝织品变硬腐化。郑振铎、夏鼐为此上书国务院，请求立即停止再批准发掘帝王陵墓的申请，国务院总理周恩来同意了他们的意见。不主动发掘帝王陵墓自此成为中国考古界的定规。",
    ] },
  { "title" = "人物評價", "paragraphs" = [
      "明朝官修的編年體史書《明神宗顯皇帝實錄》總評萬曆皇帝一生說：“蓋上仁孝聖神，逈絕千古，享國愈久，聖德彌隆，無挽近綜核之煩，而自臻治古幾康之理。海內沐浴玄化幾五十年，國祚靈長，永永無極，所培毓遠矣。先是因秉軸者懲操切之過，不無稍劑以寬大，而上明習政事，乾綱獨攬，予奪進退，莫可測識。晚頗厭言官章奏，概置不報，然每遇大事，未嘗不折衷群議，歸之聖裁。中外振聳，四封宴如，雖以憂勤之主極意治平而不得者，上獨以深居靜攝得之，周之成康，漢之文景，未足況也。至慈護先考，終始無間，尤非草野所得窺，而為堯為舜之旨，更諄諄以期。 ……廟號曰神，殆真如神雲。”",
      "钱谦益：“国家修明昌大之运，自世庙以迄神庙，比及百年，可谓极盛矣。”“万历中，正国家日中豫泰之候。”“当盛明日中，君臣大有为之日。”“呜呼，我神宗显皇帝，丕承谟烈，久道化成，制科取士，人物滋茂。”",
      "夏允彝：“神庙冲龄践祚，睿质夙成……士大夫以气节相矜，虽无姚、宋之辅，亦无愧开元之盛时也。”“神庙睿圣非常，虽御朝日希，而柄不旁落，止以鄙夷群臣之故，置庶务于不理。士大夫益纵横于下，而国事大坏。”",
    ] },
  { "title" = "軼事", "paragraphs" = [
      "萬曆元年十月八日，是日講的日子，朱翊鈞在文華殿聽張居正進講《帝鑑圖說》。當張居正講到宋仁宗不喜珠飾，值得效法時，朱翊鈞立即表示同感：“賢臣才是寶，珠玉又有何益！”張居正接著說：“聖明的君主貴五穀而賤珠玉，五穀可以養人，而金玉飢不可食，寒不可衣，《書經》稱不作無益害有益，不貴異物賤用物，道理也就在這裡。”“是啊！宮裡的人喜歡裝飾，我在年賜時每每節省，宮人們都有意見，我說國庫的積蓄又有多少呢？”朱翊鈞又回答說。張居正便誇獎道：“皇上能這樣說，真是社稷生靈的福氣啊！”當時朱翊鈞才不過十歲。",
      "萬曆二年，朝鮮使臣許篈、趙憲前來朝貢。許篈在其前往中國記錄見聞的《朝天記》對年幼的萬曆天子的形象進行了描寫，記載其「聲甚清朗」「天威甚邇，龍顏壯大，語聲鏗然，不勝歡欣之極」同行的另一位使臣趙憲則更生動地記錄地在《朝天日記》道：「上年僅十二歲，而注視別人時十分老成，端坐在龍椅上也不曾搖動，並不會叫太監內臣傳達他的旨意，反而是親自對臣工下聖諭，而聲音玉質淵秀，金聲清暢。一聽到年幼天子的聲音，就感動起來，對以後天下太平萬歲的希望，也更加愈切了。」，而趙憲甚至把年幼的萬曆天子與其父明穆宗作比較，卻指出其父上朝時精神不集中、時常東張西望，而且聲音微弱，需要宦官再去大聲宣旨，儀態形像不佳。",
      "自從張居正去世以後，萬曆終於能擺脫出翰林學士的羈絆；而自從他成為父親以來，李太后也不再管他的生活。但是，皇帝自幼聰惠，在這個時候確實已經成年了，他已經不再有興趣和小宦官去打鬧，而是變成了一個喜歡讀書的人。他命令大學士把本朝諸祖宗的“實錄”抄出副本供他閱讀，又命令宦官在北京城內收買新出版的各種書籍，包括詩歌、論議、醫藥、劇本、小說等各個方面。",
    ] },
]

[articles.ko]
text = "명 신종 만력제(明 神宗 萬曆帝, 1563년 9월 4일~1620년 8월 18일)는 명나라의 제13대 황제이고, 휘는 익균(翊鈞)이다. 융경제의 3남이다."
title = "만력제"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EB%A7%8C%EB%A0%A5%EC%A0%9C"
intro = [
  "명 신종 만력제(明 神宗 萬曆帝, 1563년 9월 4일~1620년 8월 18일)는 명나라의 제13대 황제이고, 휘는 익균(翊鈞)이다. 융경제의 3남이다. 1572년부터 1620년까지 48년간 재위하였다.",
  "신종 만력제 주익균(神宗 萬曆帝 朱翊鈞)의 치세는, 역대 명나라 황제들의 통치 기간 중 가장 길며, 동시에 명나라가 건국된 지 200년쯤 지나고 나서, 그의 치세 초기에 만력중흥(萬曆中興)이라는 국가의 번화를 꽃피웠으나, 아울러 치세 말년기에는 오히려 명나라 황조가 갈수록 중과부적인 쇠락의 나락으로 서서히 몰락해 가는 시기에 속하기도 하였다. 묘호는 신종(神宗)이고, 정식 시호는 범천합도철숙돈간광문장무안인지효현황제(範天合道哲肅敦簡光文章武安仁止孝顯皇帝)로, 1572년 7월 5일부터 1620년 8월 18일까지 재위하는 동안 1572년 7월 5일부터 1582년 7월 9일까지 중신 재상이었던 장거정(張居正)이 섭정하였고 1582년 7월 9일부터 1620년 8월 18일 붕어할 때까지 친정하였다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "유왕 주재후의 3남으로 태어났으며, 큰형과 둘째 형이 병으로 모두 죽자 유왕세자(裕王世子)에 봉해졌다. 1567년 아버지가 황위에 오르자 황태자에 책봉되었고 1572년에는 10살의 나이로 황위에 올랐다. 만력제는 정치를 잘 알지 못했던 등극 초기에는 모든 일을 재상 장거정에게 맡겼다. 오랫동안 그의 스승이었던 인연 때문이었다. 장거정의 교육 방식은 너무 엄격해 어린 만력제의 숨통을 조이기 일쑤였다. 공론을 줄이고 명실상부, 기강 확립, 명령 복종, 군비 확충 등을 중시한 그는 ‘철혈 재상’이라는 별명이 붙을 정도로 사심 없이, 그러면서도 단호하게 국사를 처리했으며 개혁에도 열심이었다. 덕분에 명나라는 그런대로 모양새를 갖출 수 있었다.",
      "만력제가 제위에 오른 지 10년째 되던 해 장거정이 세상을 떠났다. 그동안 기를 펴지 못했던 반대파들은 입을 모아 장거정의 비리를 들추며 공격하기 시작했다.",
      "처음에는 장거정을 편들었던 만력제도 그의 재산이 자신을 능가한다는 소문을 듣고는 장거정의 가산을 몰수했다. 이후 그는 30년 간 여러 가지 구실을 대며 정사를 돌보지 않아 나라가 깊은 수렁에 빠져갔고, 나라에 아무리 위급한 일이 생겨도 동전 한 닢 내놓지 않는 지독한 구두쇠가 되어 갔다. 반면 돈이 되는 일이라면 무슨 일이라도 했다. 황제 개인의 재산은 날이 갈수록 늘어 갔으나 국고는 점점 줄어들었다. 황제가 돈을 밝히니 고관과 환관들은 매관매직을 일삼는 탐관오리가 되어갔고 정치에 관심이 없었던 만력제는 아부하는 자를 재상에 앉혀 놓고 오로지 치부에만 열성을 보였다. 거기다 술과 여자까지 밝혔다.",
    ] },
  { "title" = "조선에의 영향", "paragraphs" = [
      "당대와 후대를 통틀어 명나라 멸망의 원흉으로 지목된 만큼, 평판이 매우 좋지 못한 군주이지만, 임진왜란 문제에 있어서만은 매우 적극적으로 정책을 펼쳐, 조선에 군사를 파견하고, 조선을 재정적으로 도와 고려황제로 별칭되기도 한다. 그런 영향으로 조선에서는 송시열이 제자인 권상하에게 만력제와 숭정제의 제사를 지낼 사당을 만들도록 하였는데 이것이 바로 충북 화양계곡의 만동묘(萬東廟)이다. 만동묘는 공자의 만절필동에서 유래된 말로 황하가 만 번 굽이쳐도 동해로 흐른다는 뜻이다. 대명천지, 숭정천하 등 명나라가 망했어도 조선이 명나라의 원군으로 나라를 건졌다는 글귀가 암벽에 새겨져 오늘날까지 전해져 온다.",
      "만동묘는 도산서원과 함께 조선의 4대 서원으로 명성을 떨쳤으나 흥선대원군의 서원 철폐로 헐려버리고 지금은 묘정비만 존재하고 있다. 만력제가 주었다는 이순신 팔사품이 사실 조선에서 후대에 자기들끼리 교차검증한 사료들을 바탕으로 주장한 사기에 불과하다는 의혹이 있다.",
    ] },
]

[articles.ar]
text = "الإمبراطور وانلي (Wanli Emperor) (([غير محدد] خطأ: {{اللغة}}: وسيط غير صالح: |s= (مساعدة))) (وُلد في 4 من سبتمبر 1563م وتوفي في 18 من أغسطس عام 1620م) كان الإمبراطور الرابع عشر لسلالة مينغ، وحكم منذ عام 1572 وحتى عام 1620. خلف والده، الإمبراطور لونغ تشينغ."
title = "الإمبراطور وانلي"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A7%D9%84%D8%A5%D9%85%D8%A8%D8%B1%D8%A7%D8%B7%D9%88%D8%B1_%D9%88%D8%A7%D9%86%D9%84%D9%8A"
intro = [
  "الإمبراطور وانلي (Wanli Emperor) (([غير محدد] خطأ: {{اللغة}}: وسيط غير صالح: |s= (مساعدة))) (وُلد في 4 من سبتمبر 1563م وتوفي في 18 من أغسطس عام 1620م) كان الإمبراطور الرابع عشر لسلالة مينغ، وحكم منذ عام 1572 وحتى عام 1620. خلف والده، الإمبراطور لونغ تشينغ. كانت مدة حكمه 48 عامًا، وهي الأطول بين جميع أباطرة سلالة مينغ.",
  "اعتلى إمبراطور وانلي العرش في سن التاسعة. خلال السنوات العشر الأولى من حكمه، تلقى الإمبراطور الشاب المساعدة والقيادة الفعالة من السكرتير الكبير والمدير الماهر تشانغ جو تشنغ. بدعم من والدة الإمبراطور، السيدة لي، والخصيان الإمبراطوريين بقيادة فنغ باو، شهدت البلاد ازدهارًا اقتصاديًا وعسكريًا، ووصلت إلى مستوى من القوة لم تشهده منذ أوائل القرن الخامس عشر. كان الإمبراطور يكن احترامًا وتقديرًا كبيرين لسكرتيره الكبير. ومع ذلك، مع مرور الوقت، عارضت فصائل مختلفة داخل الحكومة تشانغ علنًا، مما تسبب في أن يصبح منصبه المؤثر في الحكومة وفي البلاط عبئًا على الملك. في عام 1582، توفي تشانغ وفي غضون أشهر، طرد الإمبراطور فنغ باو. ثم اكتسب تقديرًا وأجرى تغييرات كبيرة على الترتيبات الإدارية لتشانغ.",
  "تميزت حقبة وانلي بازدهار كبير في الصناعة، لا سيما في إنتاج الحرير والقطن والخزف. شهدت الزراعة نموًا ملحوظًا، وشهدت التجارة بين المناطق والتجارة الخارجية زيادة ملحوظة. كان لهذا التطور الأثر الأكبر في جيانغنان، حيث ازدهرت مدن مثل سوتشو وسونغجيانغ وجياشينغ ونانجينغ. ومع ذلك، ورغم النمو الاقتصادي العام للإمبراطورية، ظلت مالية الدولة في حالة سيئة. بينما تمتع التجار الأثرياء والنبلاء بحياة رغيدة، ظل غالبية الفلاحين وعمال المياومة يعيشون في فقر.",
  "شهد العقد الأخير من القرن السادس عشر ثلاث حملات كبرى. قمعت قوة من سلالة مينغ قوامها 40 ألف جندي تمردًا كبيرًا في نينغشيا بحلول أكتوبر 1592، مما سمح لهم بتحويل تركيزهم إلى كوريا. في الوقت نفسه، غزا تويوتومي هيده-يوشي كوريا بقوة 200 ألف جندي، مما أدى إلى تشكيل قوة كورية صينية مشتركة، ضمت 40 ألف جندي من سلالة مينغ، دافعةً اليابانيين خارج معظم أنحاء كوريا وأجبرتهم على التراجع إلى الساحل الجنوبي الشرقي بحلول عام 1593. في عام 1597، أُحبط غزو ياباني ثانٍ، وانتهى قمع تمرد يانغ ينغلونغ في جنوب غرب الصين في غضون بضعة أشهر من عام 1599، وذلك بفضل تمركز قوات مينغ هناك في خضم الحرب الدائرة مع اليابان.",
]
sections = [
  { "title" = "الطفولة وارتقاء العرش", "paragraphs" = [
      "ولد تشو ييجون، إمبراطور وانلي المستقبلي، في 4 سبتمبر 1563 لأبيه تشو زايجي، وريث عرش سلالة مينغ، وإحدى محظياته، السيدة لي. كان له شقيقان أكبر منه سنًا، توفيا في طفولتهما قبل عام 1563، وشقيق أصغر، تشو ييليو (1568-1614)، الذي عُيّن أميرًا على لو عام 1571.",
      "أصبح تشو زايجي إمبراطورًا لسلالة مينغ عام 1567، وحكم باسم إمبراطور لونغتشينغ، لكنه توفي بعد خمس سنوات في 5 يوليو 1572. ثم اعتلى تشو ييجون العرش بعد أسبوعين في 19 يوليو 1572. واتخذ اسم العصر وانلي، الذي يعني عشرة آلاف تقويم. قبل وفاته، كلّف إمبراطور لونغتشينغ الوزير تشانغ جوتشنغ بتولي شؤون الدولة، وأن يصبح مستشارًا مخلصًا للإمبراطور الشاب.",
      "عُرف إمبراطور وانلي بنشاطه وحيويته في شبابه. وُصف بأنه سريع التعلم، ذكي، وواسع الاطلاع، ودائم الاطلاع على مجريات الأمور في الإمبراطورية. عيّن تشانغ جو تشنغ ثمانية معلمين لتعليم إمبراطور وانلي الكونفوشيوسية والتاريخ والخط. ركزت دروس التاريخ على تعليمه أمثلة جيدة وسيئة في الحكم، وجمع تشانغ جو تشنغ بنفسه مجموعة من القصص التاريخية ليتعلم منها الإمبراطور. إلا أن شغف إمبراطور وانلي بالخط أثار قلق تشانغ، الذي خشي أن تُشتت هذه الهواية الفارغة انتباهه عن واجباته كرجل دولة. نتيجةً لذلك، أوقف تشانغ تدريجيًا دروس الخط التي كان يُقدمها إمبراطور وانلي. بين عامي 1583 و1588، زار إمبراطور وانلي العديد من الأضرحة قرب بكين، واهتم بتدريب حرس القصر. ومع ذلك، كانت والدته، تشانغ جو تشنغ، وكبار المسؤولين في بكين قلقين من أن يصبح حاكمًا مشابهًا للإمبراطور تشنغده (حكم 1505-1521)، وثنوه عن السفر خارج المدينة المحرمة ومتابعة اهتماماته في الجيش وركوب الخيل والرماية. تحت ضغطهم، توقف إمبراطور وانلي عن مغادرة بكين بعد عام 1588 وتوقف عن المشاركة في التضحيات العامة بعد عام 1591. ألغى اجتماع البلاط الصباحي الذي كان يُعقد قبل الفجر والدراسة المسائية للكونفوشيوسية (بعد غروب الشمس). في شبابه، كان إمبراطور وانلي مطيعًا لوالدته وأظهر احترامًا للخصيان والأمناء الكبار. ومع ذلك، مع تقدمه في السن، أصبح ساخرًا ومتشككًا تجاه الطقوس والبيروقراطيين. ربطته معارضته للواجبات الملكية الطقسية بجده الإمبراطور جياجينغ (حكم 1521-1567)، لكنه كان يفتقر إلى حسم الإمبراطور جياجينغ وبريقه. بدلًا من شغف الإمبراطور جياجينغ بالطاوية، اتجه الإمبراطور وانلي نحو البوذية.",
    ] },
]

[articles.vi]
text = "Minh Thần Tông (chữ Hán: 明神宗, bính âm: Ming Shenzong, 4 tháng 9, 1563 – 18 tháng 8 năm 1620) hay Vạn Lịch Đế (萬曆帝), là vị hoàng đế thứ 14 của nhà Minh trong lịch sử Trung Quốc. Ông trị vì trong 48 năm, lâu dài nhất trong các vị Hoàng đế nhà Minh và triều đại của ông cũng chứng kiến sự suy tàn dần dần của nhà Minh."
title = "Minh Thần Tông"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Minh_Th%E1%BA%A7n_T%C3%B4ng"
intro = [
  "Minh Thần Tông (chữ Hán: 明神宗, bính âm: Ming Shenzong, 4 tháng 9, 1563 – 18 tháng 8 năm 1620) hay Vạn Lịch Đế (萬曆帝), là vị hoàng đế thứ 14 của nhà Minh trong lịch sử Trung Quốc. Ông trị vì trong 48 năm, lâu dài nhất trong các vị Hoàng đế nhà Minh và triều đại của ông cũng chứng kiến sự suy tàn dần dần của nhà Minh.",
  "Thuở nhỏ khi mới lên ngôi, ông được Hiếu Định thái hậu và Thái sư Trương Cư Chính nhiếp chính, tuy nhiên trong thời gian này ông luôn lo sợ bị mẹ phế bỏ để đưa người em trai lên thay mỗi khi phạm lỗi. Sau cái chết của Trương Cư Chính, Vạn Lịch Đế bắt đầu tự mình chấp chính, sức mạnh của đế quốc vẫn tiếp tục phát triển, thời kỳ này gọi là Vạn Lịch trung hưng (萬曆中興). Nhưng sau 18 năm ông bắt đầu chán nản và lao vào cuộc sống trụy lạc xa hoa, hoang dâm vô độ trong 20 năm cuối đời, thậm chí từ chối lên triều để điều hành công việc của đất nước, sử sách gọi là Vạn Lịch đãi chính (萬曆怠政).",
  "Lối sống này giống như của ông nội ông, Minh Thế Tông Gia Tĩnh hoàng đế, người đã từ bỏ trách nhiệm với đất nước để đi luyện đan dược trường sinh. Chính lối sống đó đã hủy hoại hệ thống cai trị của nhà Minh và đặt gánh nặng lên quốc khố và đời sống kinh tế của người dân, khi các cuộc nổi loạn của nông dân bắt đầu diễn ra và dẫn đến sự suy vong của nhà Minh.",
]
sections = [
  { "title" = "Tiểu sử", "paragraphs" = [
      "Thần Tông hoàng đế tên thật là Chu Dực Quân (朱翊鈞), sinh vào ngày 4 tháng 9, năm 1563 tại Tử Cấm Thành. Ông là con trai thứ ba của Minh Mục Tông Chu Tái Hậu, mẹ ông là Hiếu Định hoàng hậu Lý thị, người Thông Châu, vào hầu Mục Tông khi còn là Dụ vương với thân phận thị nữ của Hiếu An hoàng hậu.",
      "Năm 1568, 2 năm sau khi Minh Mục Tông lên ngôi, Chu Dực Quân được phong làm Hoàng thái tử.",
      "Năm 1572, ngày 5 tháng 7, Minh Mục Tông chết. Thái tử Chu Dực Quân mới chưa đầy 10 tuổi được lên ngôi Hoàng đế, lấy niên hiệu là Vạn Lịch (萬曆), Hoàng thái hậu Lý thị dạy bảo và phụ chính.",
    ] },
  { "title" = "Vạn Lịch trung hưng", "paragraphs" = [
      "Từ năm 1572 đến năm 1582 là thời kì hưng thịnh của triều đại Vạn Lịch. Kho lương tích trữ đủ dùng trong hơn 10 năm, quốc khố có hơn 400 vạn lượng vàng. Năm 1573, Thái sư Trương Cư Chính một mặt giảm bớt quan lại vô dụng, mặt khác bắt đầu kiểm soát chi phí hoàng thất, bởi vậy đã mang lại nhiều hiệu quả nhất định.",
      "Năm 1577, Trương Cư Chính đề xuất tiến hành đo đạc đất đai trong cả nước, tăng cường sản xuất. Tới năm 1581, Trương Cư Chính hoàn tất việc đo đạc đất đai, tổng số đất đo đạc là 900 vạn khoảnh, nhiều hơn 800 vạn khoảnh thời Minh Hiếu Tông Hoằng Trị. Đồng thời Trương Cư Chính còn trọng dụng hiền tài như Thích Kế Quang, Lý Thành Lương và Vương Sùng Cổ và tìm nhiều chính sách để vỗ về với nhà Bắc Nguyên ở Mông Cổ. Vạn Lịch khen Trương Cư Chính biết dùng người thỏa đáng.",
      "Thời gian 10 năm đầu thời Vạn Lịch, nhà Minh được chứng kiến sự phát triển về quân sự và thịnh vượng về kinh tế trong hơn cả trăm năm từ thời Vĩnh Lạc của Minh Thành Tổ và thời Nhân Tuyên chi trị của Minh Nhân Tông và Minh Tuyên Tông.",
    ] },
  { "title" = "Vạn Lịch chấp chính", "paragraphs" = [
      "Sau khi Trương Cư Chính mất rồi, Vạn Lịch quyết định nắm trọn quyền hành điều khiển đất nước, trong thời gian đầu tự mình chấp chính, Vạn Lịch chứng tỏ được mình là một hoàng đế có thẩm quyền và siêng năng. Nhìn chung, thời gian này (1582 - 1600) đất nước vẫn phát triển về kinh tế và hùng mạnh về quân sự nhờ việc thừa hưởng những thành quả của cuộc cải cách của Trương Cư Chính. Khác với thời gian 20 năm cuối đời, lúc này Vạn Lịch vẫn tham dự các buổi thiết triều sáng và lắng nghe, thảo luận các vấn đề của đất nước.",
      "Trong thời gian 18 năm tự mình chấp chính, Vạn Lịch hoàng đế đã thực hiện 3 chiến dịch quân sự lớn một cách thành công:",
      "Phòng thủ trước sự tấn công của Mông Cổ: Ở biên giới phía bắc, một cuộc phản loạn nổ ra và thủ lĩnh phản quân đã kết minh với quân Mông Cổ, đề nghị làm nội ứng cho quân Mông Cổ và yêu cầu quân Mông Cổ tấn công nhà Minh. Vạn Lịch cử Lý Thành Lương và các con đi dẹp, đánh lùi được quân Mông Cổ và diệt được phản loạn.",
    ] },
  { "title" = "Vạn Lịch đãi chính", "paragraphs" = [
      "Thời gian 20 năm cuối đời, Vạn Lịch Đế triệt để xa lánh vai trò của mình trong triều đình, hay trên thực tế là bãi công. Hoàng đế luôn viện cớ \"long thể bất an\" để từ chối các buổi triều kiến, không xử lý tấu chương thậm chí không gặp thần tử. Do vậy các đại thần rất khó để được gặp mặt ông, nên họ đua nhau dâng sớ khuyên can. Nhìn thấy tấu sớ dâng lên ngày một nhiều, Vạn Lịch vô cùng bực bội, từ đó công khai luôn việc bê trễ triều chính của mình. Ông cũng không thèm quan tâm đến việc bổ nhiệm nhân sự, việc này dẫn đến các chức vụ cao cấp của triều đình bị thiếu khuyết nghiêm trọng, ảnh hưởng đến trị lý đất nước. Tuy nhiên, Hoàng đế lại đặt sự tập trung vào việc kiến tạo lăng mộ cho bản thân, một lăng mộ nguy nga hùng tráng mà mất thập kỉ mới hoàn thành.",
      "Năm 1614, sinh mẫu của Vạn Lịch Đế là Hiếu Định thái hậu Lý thị qua đời, không còn ai ngăn cản, Vạn Lịch Đế thả sức ăn chơi. Ông cho khôi phục những chức quan mà Trương Cư Chính đã bãi miễn trước đây. Vạn Lịch Đế tiếp tục cho trọng dụng hoạn quan để ăn chơi trác táng, tự vạch ra chế độ sinh hoạt cho riêng mình để thể hiện uy lực của thiên triều, ai mà can gián đều bị khép tội phải chết. Vạn Lịch mỗi đêm thường uống rượu say khướt đến khuya rồi đánh đập các cung nữ. Hoàng đế còn học hút thuốc lá, chơi hoa và chim.",
      "Vì suốt ngày chỉ lo ăn chơi xa xỉ và háo sắc nên sức khỏe của Vạn Lịch Đế ngày một suy nhược, lại chi tiêu hoang phí, quốc khố ngày càng cạn kiệt. Để có tiền Vạn Lịch đã cho đặt thêm một loại thuế là \"Khoáng thuế\", gây ra nhiều tệ hại cho dân gian đương thời. Mỗi khi có khởi nghĩa nông dân nổ ra, Vạn Lịch Đế thường cho những lực lượng rất lớn đi đánh dẹp những cuộc khởi nghĩa nhỏ. Như vậy hoàng đế đã tự tiêu hao nhân lực và tiền bạc của mình.",
    ] },
]

[articles.id]
text = "Kaisar Wanli (Hanzi: 万历, 4 September 1563-18 Agustus 1620) adalah kaisar ke-13 dari Dinasti Ming yang memerintah dari tahun 1572 hingga 1620, pemerintahannya adalah yang terpanjang di antara keenambelas kaisar Ming. Pada masa pemerintahannya Dinasti Ming mengalami penurunan drastis."
title = "Kaisar Wanli"
lang = "id"
url = "https://id.wikipedia.org/wiki/Kaisar_Wanli"
intro = [
  "Kaisar Wanli (Hanzi: 万历, 4 September 1563-18 Agustus 1620) adalah kaisar ke-13 dari Dinasti Ming yang memerintah dari tahun 1572 hingga 1620, pemerintahannya adalah yang terpanjang di antara keenambelas kaisar Ming. Pada masa pemerintahannya Dinasti Ming mengalami penurunan drastis. Dia terlahir dengan nama Zhu Yijun （朱翊鈞）, putra ke-3 Kaisar Longqing.",
]
sections = [
  { "title" = "Kehidupan awal", "paragraphs" = [
      "Zhu Yijun sebenarnya seorang anak yang cerdas sejak kecil. Suatu ketika dia melihat ayahnya memacu kuda dengan sangat kencang dan berseru padanya, “Ayah kaisar, engkau adalah penguasa di bumi, hal yang tidak baik akan terjadi bila ayah berkuda sekencang itu !”. Umurnya baru enam tahun ketika berkata demikian, Longqing sangat terkesan dengan sikapnya itu, dia segera turun dari kuda dan menggelarinya putra mahkota.",
      "Tahun 1572, Longqing wafat dan Zhu Yijun yang baru berumur 9 tahun naik tahta menggantikannya, rezimnya dinamakan Wanli. Sepuluh tahun pertama masa pemerintahannya, dia dibantu oleh ibu suri, ibunya, dan negarawan besar, Zhang Juzheng yang juga menjadi guru yang membimbingnya sejak kecil. Zhang diangkat sebagai kanselir agung. Sebagai administrator yang kompeten, Zhang melakukan reformasi dalam berbagai bidang seperti mereformasi ekonomi dan pertanian serta memperketat sistem ujian kerajaan. Hal ini menciptakan stabilitas sosial bagi Tiongkok.",
    ] },
  { "title" = "Pasca kematian Zhang Juzheng", "paragraphs" = [
      "Zhang meninggal pada tahun 1582. Sepeninggalnya, Wanli merasa terbebas dari pengawasan Zhang dan atas hasutan para pejabat dan kasim yang tidak menyukai Zhang dia membatalkan program-program yang telah dirancang Zhang. Dinasti Ming yang baru saja bangkit kembali mengalami kemunduran. Wanli mulai terjerumus dalam kebejatan moral dan pemborosan harta negara. Di istana belakang dia memiliki ratusan wanita yang siap dipanggil kapan saja, dia juga minum-minum tanpa terkendali dan setelah mabuk bisa membunuh siapa saja yang menyinggungnya.",
