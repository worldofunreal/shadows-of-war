[articles.en]
text = "Chilperic I was the king of Neustria from 561 to his death. He was one of the sons of the Frankish king Clotaire I and Queen Aregund."
title = "Chilperic I"
lang = "en"
url = "https://en.wikipedia.org/wiki/Chilperic_I"
intro = [
  "Chilperic I (c. 539 – September 583) was the king of Neustria (or Soissons) from 561 to his death. He was one of the sons of the Frankish king Clotaire I and Queen Aregund.",
]
sections = [
  { "title" = "Life", "paragraphs" = [
      "Immediately after the death of his father in 561, he endeavoured to take possession of the whole kingdom, seized the treasure amassed in the royal town of Berny and entered Paris. His brothers, however, compelled him to divide the kingdom with them, and Soissons, together with Amiens, Arras, Cambrai, Thérouanne, Tournai and Boulogne fell to Chilperic's share. His eldest brother Charibert received Paris, the second-eldest brother Guntram received Burgundy with its capital at Orléans, and Sigebert received Austrasia. On the death of Charibert in 567, Chilperic's estates were augmented when the brothers divided Charibert's kingdom among themselves and agreed to share Paris and the territory around it.",
      "Not long after his accession, however, he was at war with Sigebert, with whom he would long remain in a state of—at the very least—antipathy. This started when Sigebert marched against the Avars and defeated them possibly in Thuringia and possibly pushed them out of the Elbe. Chilperic, seeing that his brother was far from his lands, attacked Reims and took it. Soon Sigebert returned however and took Reims and marched to Soissons, where he defeated, seized the city, and imprisoned Chilperic's eldest son, Theudebert. The war flared in 567, at the death of Charibert. Chilperic immediately invaded Sigebert's new lands, but Sigebert defeated him. Chilperic later allied with Guntram against Sigebert (573), but Guntram changed sides due to fear of a large army Sigebert gathered past the Rhine and he crossed through Burgundy to bypass Chilperic's strong defenses. Chilperic again lost the war.",
      "When Sigebert married Brunhilda, daughter of the Visigothic sovereign in Spain (Athanagild), Chilperic also wished to make a brilliant marriage. He had already repudiated his first wife, Audovera, and had taken as his concubine a serving-woman called Fredegund. He accordingly dismissed Fredegund, and married Brunhilda's sister, Galswintha. But he soon tired of his new partner, and one morning Galswintha was found strangled in her bed. A few days afterwards Chilperic married Fredegund.",
    ] },
  { "title" = "Family", "paragraphs" = [
      "Merovech (killed by a servant at his request in 577), married the widow Brunhilda (his aunt by marriage) and became his father's enemy",
      "His concubinage and subsequent marriage to Fredegund in about 568 produced six more legitimate offspring:",
      "Chlothar II (before September 584 – 18 October 629), Chilperic's successor in Neustria, later sole king of the Franks",
    ] },
  { "title" = "Etymology", "paragraphs" = [
      "Chilperic's name in Frankish meant \"powerful supporter\", akin to German hilfreich \"auxiliary\" (cf. German Hilfe \"help, aid\" and reich \"rich, orig. powerful\")",
    ] },
]

[articles.fr]
text = "Chilpéric Ier, né entre 525 et 534, mort assassiné entre le 20 et le 28 septembre 584 à Chelles, est un souverain franc de la dynastie des Mérovingiens. Petit-fils de Clovis et fils de Clotaire Ier, il est roi de Soissons de 561 à 584."
title = "Chilpéric Ier (roi des Francs)"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Chilp%C3%A9ric_Ier_%28roi_des_Francs%29"
intro = [
  "Chilpéric Ier, né entre 525 et 534, mort assassiné entre le 20 et le 28 septembre 584 à Chelles, est un souverain franc de la dynastie des Mérovingiens. Petit-fils de Clovis et fils de Clotaire Ier, il est roi de Soissons de 561 à 584.",
  "À la mort de Clotaire Ier, le royaume des Francs, réunifié en 558, est partagé entre ses quatre fils : Sigebert, Gontran, Caribert et leur demi-frère Chilpéric, qui reçoit le royaume de Soissons. Il est l'un des derniers rois mérovingiens à régner de manière autoritaire sur ses sujets avant que le pouvoir ne s'effrite, capté par une noblesse ambitieuse. Une grande partie de son règne est occupée par des conflits avec ses frères, mais surtout avec Sigebert dans la première moitié des années 570.",
  "Chilpéric est marié trois fois. Sa deuxième épouse, la princesse wisigothe Galswinthe, meurt assassinée en 568 et le roi se remarie rapidement avec Frédégonde. Son conflit avec Sigebert se double ainsi de la rivalité entre Frédégonde et Brunehaut, épouse de Sigebert et sœur de Galswinthe. Cette période de luttes intestines, la « faide royale », ne prend fin qu'en 613, avec la victoire de Clotaire II, le seul fils survivant de Chilpéric et Frédégonde, sur Brunehaut et ses descendants.",
  "Chilpéric apparaît sous un jour négatif dans l'Histoire des Francs de Grégoire de Tours qui le surnomme « le Néron et l'Hérode de notre temps ».",
]
sections = [
  { "title" = "Contexte historique : territoires francs au VIe siècle", "paragraphs" = [
      "Chilpéric Ier naît dans une des familles princières franques, issue de Mérovée et de Clovis, fondateurs de la dynastie mérovingienne. Les Mérovingiens constituèrent la première dynastie qui régna sur la majorité des territoires actuellement français et belge, ainsi que sur une partie du Sud de l’Allemagne et de la Suisse, du Ve jusqu’au VIIIe siècle, après la fin des invasions barbares dans les provinces romaines occidentales, dont la Gaule. Ils sont issus des Francs saliens, qui étaient établis au Ve siècle dans les régions de Cambrai et de Tournai, en Gaule belgique.",
      "Le règne de Chilpéric se situe dans le cadre territorial et politique résultant du partage du royaume franc, qui eut lieu en 561, à la mort de Clotaire, fils de Clovis. Lors de la disparition de Clovis en 511, quatre royaumes avaient été créés avec pour capitales : Reims, Soissons, Paris et Orléans, l'Aquitaine étant répartie séparément. Dans les années 550, Clotaire, dernier survivant des quatre frères, avait reconstitué l'unité du royaume franc, augmenté du territoire burgonde, conquis entre-temps.",
      "La société se compose d'hommes et de femmes libres (ingenui) formant la plus grande partie du peuple franc. Ils ont l'obligation de servir dans l'armée du roi, avec le droit de prendre part à la justice publique, et sont commandés par l'intermédiaire des ducs et des comtes. Il existe également des populations dépendantes comme les esclaves locataires d'une ferme (servi casati), les esclaves domestiques, et les esclaves travailleurs agricoles sur les grandes propriétés.",
    ] },
  { "title" = "Biographie", "paragraphs" = [
      "Chilpéric est le fils de Clotaire Ier et de sa seconde épouse, la reine Arégonde. Sa date de naissance n'est pas clairement établie : entre 525 et 527 selon Frédéric Armand, vers 537 pour Pierre Riché et Christian Settipani.",
      "Chilpéric est la forme francisée d'un nom vieux-francique qui apparaît dans les textes latins sous les formes Chilpericus (chez Grégoire de Tours et Venance Fortunat) ou Hilpericus (chez Marius d'Avenches et Paul Diacre). La forme francique originelle n'est pas attestée, mais elle peut être reconstituée en */χilprik/, où χ représente un k palatalisé. Elle se compose des éléments /χilp/ « aide » et /rik/ « puissant, riche ». Venance Fortunat emploie pour désigner Chilpéric l'expression adjutor fortis, « auxiliaire courageux », qui constitue en fait une traduction littérale du nom francique.",
      "Le choix de ce nom est probablement influencé par la reine Clotilde, épouse de Clovis et mère de Clotaire. Il apparaît à deux reprises dans la famille des rois des Burgondes au Ve siècle : Chilpéric Ier et Chilpéric II sont respectivement le grand-oncle et le père de Clotilde.",
    ] },
  { "title" = "Mariages et descendance", "paragraphs" = [
      "En 568, Chilpéric se remarie avec Galswinthe, fille d’Athanagild, roi des Wisigoths, et sœur de Brunehilde. Elle entre rapidement en conflit avec son mari à propos de la liaison qu'il entretient avec Frédégonde, réclame son retour en Hispanie et est retrouvée étranglée dans son lit.",
      "En troisièmes noces, Chilpéric épouse Frédégonde (morte en 597), probablement issue d’un milieu peu élevé, comme le suggère Grégoire de Tours. De ce mariage sont nés :",
    ] },
  { "title" = "Aspects généraux du règne de Chilpéric", "paragraphs" = [
      "Les rois mérovingiens considérant que le royaume est leur propriété, règnent sans partage et ne reconnaissent pas l'existence de biens ou de services publics qui sont pris en charge par les comtes et les évêques. Un maire du palais (major domus, devenu majordome), Badegisèle, est le supérieur de tous les fonctionnaires royaux ainsi que des Grands et des commis et a pour fonction leur coordination. Les décisions prises n'émanent que du roi qui ne rend de comptes à personne. Cependant, Chilpéric prend conseil auprès d'« hommes de bien », notamment lors du conflit qui l'oppose à Gontran, d'évêques ou de son épouse Frédégonde.",
      "Divers témoignages émanant de Grégoire de Tours nous permettent de nous forger une opinion sur ses jugements que l'évêque Venance Fortunat juge « intègres, mesurés, désintéressés ». Il cite notamment une profanation perpétrée par des Grands, en 579, qui se sont entretués dans la basilique Saint-Denis. Le roi décide de laisser l'évêque de Paris les juger. Il épargne de la peine de mort, en 580, l'archidiacre de Tours Platon et Galien, ami de Grégoire. En 581, suivant la demande de Grégoire de Tours, il laisse la vie sauve à des voleurs qui ont pillé la basilique Saint-Martin de Tours et remet les biens volés aux clercs de la basilique. En 582, un Juif nommé Pathir converti au christianisme, que Chilpéric a parrainé, est renvoyé en Burgondie, sa province d'origine, tandis que ses esclaves ou domestiques sont condamnés à mort, pour avoir assassiné un autre Juif de Paris nommé Priscus, conseiller du roi, qui refusait le baptême, sans dommage pour lui mais ensuite le roi exige la conversion de tous les Juifs parisiens. Ledit Pathir se réfugie avec ses domestiques dans l'église Saint-Julien-le-Pauvre et réussit à s'enfuir, mais l'un de ses serviteurs est sauvagement tué par la foule.",
      "En 582, l'évêque Carterius de Périgueux et le diacre Fronton sont pardonnés pour avoir insulté le roi dans une lettre. On constate aussi que le roi ne spolie pas automatiquement autrui : à la mort du comte Nonnichius en 582, le roi distribue ses biens à diverses personnes. Après la trahison de Godin, ses villae lui sont reprises pour être données à la basilique Saint-Médard. En 577, après avoir remplacé le comte Ennodius mis en place par Childebert II, il lui confisque ses biens et les lui rend un an après. Le seul cas où Chilpéric confisque des biens est celui où les frères Burgolène et Dodon sont exécutés pour crime de lèse-majesté, crime pour lequel la loi préconise la mort et la confiscation des biens des coupables.",
    ] },
]

[articles.it]
text = "Chilperico I (535 circa – Chelles, settembre o ottobre 584) è stato un re franco della dinastia dei merovingi che, dal 561 alla morte, regnò sull'Austrasia del Nord-ovest, acquisendo nel corso del suo regno anche la Neustria e l'Aquitania."
title = "Chilperico I"
lang = "it"
url = "https://it.wikipedia.org/wiki/Chilperico_I"
intro = [
  "Chilperico I (535 circa – Chelles, settembre o ottobre 584) è stato un re franco della dinastia dei merovingi che, dal 561 alla morte, regnò sull'Austrasia del Nord-ovest, acquisendo nel corso del suo regno anche la Neustria e l'Aquitania.",
]
sections = [
  { "title" = "Origini", "paragraphs" = [
      "Era figlio del re dei Franchi Sali della dinastia merovingia Clotario I e, secondo il vescovo Gregorio di Tours (536 – 597), della sua quarta moglie, Aregonda, di cui non si conoscono gli ascendenti.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Alla morte del padre, nel 561, sempre secondo Gregorio di Tours e confermato anche dalle cronache del vescovo Mario di Avenches, i quattro figli di Clotario I che erano ancora in vita si divisero il regno del padre in quattro parti e a Chilperico toccò quello che era stato il regno di suo padre Clotario, il regno di Soissons), cioè l'Austrasia del nord-ovest.",
      "Fin dall'inizio il suo regno fu caratterizzato dagli scontri con il fratellastro Sigeberto I, re della vicina Austrasia, che tentò di conquistare approfittando del fatto che Sigeberto era impegnato a contrastare gli Avari, riuscendo a conquistare Reims.Dopo avere sconfitto gli Avari Sigeberto marciò contro Chilperico, riuscendo ad occupare Soissons, capitale del regno di Chilperico e a catturare Teodeberto, il maggiore dei suoi figli, che gli fu restituito, in buona salute, l'anno successivo.",
      "Nel 566 un altro evento suscitò l'invidia di Chilperico I: nell'ottica dell'alleanza con i Visigoti il matrimonio di Sigeberto I con la principessa Brunechilde (Mérida, circa 543 – Renève, autunno 613), figlia del re dei Visigoti di Spagna Atanagildo e di Gosvinta dei Balti (?-589). Brunechilde, che oltre ad essere bella e con una ricca dote, era anche intelligente ed istruita, lasciò l'arianesimo e abbracciò la fede cattolica.",
    ] },
  { "title" = "Matrimoni e discendenza", "paragraphs" = [
      "Teodeberto (circa 550-573), citato da Gregorio di Tours come figlio primogenito, fu catturato a Soissons dallo zio Sigeberto e restituito, in buona salute, al padre un anno dopo. Fu ucciso in battaglia, durante la guerra civile, dopo avere devastato la Turenna",
      "Meroveo (?-Thérouanne 577), erede del regno di Neustria dopo la morte del fratello, che sposò la zia, la regina madre di Austrasia Brunechilde",
      "Clodoveo (?-Noisy-le-Grand 580), citato da Gregorio di Tours come figlio terzogenito, dopo la morte di Meroveo si rifugiò a Bordeaux. Fu ucciso per ordine della matrigna Fredegonda e fu sepolto accanto al fratello Meroveo in un monastero alle porte di Parigi, il monastero di san Vincenzo, che in seguito divenne famoso con il nome di Saint-Germain-des-Prés",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "Christian Pfister, La Gallia sotto i Franchi merovingi. Vicende storiche, in Storia del mondo medievale - Vol. I, Cambridge, Cambridge University Press, 1978, pp. 688-711.",
      "Christian Pfister, La Gallia sotto i Franchi merovingi, istituzioni, in Storia del mondo medievale - Vol. I, Cambridge, Cambridge University Press, 1978, pp. 712-742.",
      "Rafael Altamira, La Spagna sotto i visigoti, in Storia del mondo medievale - Vol. I, Cambridge, Cambridge University Press, 1978, pp. 743-779.",
    ] },
]

[articles.pt]
text = "Quilperico I (ca. 539 — Setembro de 584) foi rei da Nêustria (ou Soissons) de 561 até sua morte."
title = "Quilperico I"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Quilperico_I"
intro = [
  "Quilperico I (ca. 539 — Setembro de 584) foi rei da Nêustria (ou Soissons) de 561 até sua morte. Era um dos filhos de Clotário I, rei de todos os francos, e Aregunda.",
]
sections = [
  { "title" = "Vida", "paragraphs" = [
      "Imediatamente após a morte de seu pai, em 561, ele se empenhou em tomar posse de todo o reino, sequestrando o tesouro acumulado na cidade real de Berny e entrando em Paris. Seus irmãos, no entanto, forçaram-no a dividir o reino com eles, e Soissons, junto com Amiens, Arrás, Cambraia, Thérouanne, Tournai e Bolonha ficaram com Quilperico I. Seu irmão mais velho Cariberto recebeu Paris, Gontrão recebeu a Borgonha com sua capital em Orleães e Sigeberto I recebeu a Austrásia.À morte de Cariberto em 567, suas posses foram aumentadas quando seus irmãos dividiram o reino de Cariberto entre eles e combinaram compartilhar Paris.",
      "Não muito após sua acessão, no entanto, ele entrou em guerra com Sigeberto, com quem ficaria num longo estado de antipatia. Sigeberto o derrotou e marchou para Soissons, onde ele derrotou e aprisionou o primogênito de Quilperico, Teodeberto. A guerra ampliou-se em 567, com a morte de Cariberto. Quilperico imediatamente invadiu as novas terras de Sigeberto, mas Sigeberto novamente o derrotou. Quilperico, então, aliou-se a Gontrão contra Sigeberto (573), mas Gontrão mudou de lado e Quilperico sofreu mais uma derrota.",
      "Quando Sigeberto desposou Brunilda, filha do soberano visigodo da Espanha, Atanagildo, Quilperico também quis realizar um grande casamento. Ele já havia repudiado sua primeira esposa, Audovera, e tinha tomado como concubina uma serviçal chamada Fredegunda. Conseqüentemente, ele dispensou Fredegunda e se casou com a irmã de Brunilda, Galsuinta. Mas ele logo se cansaria de sua nova parceira, e numa manhã Galsuinta foi encontrada estrangulada em sua cama. Em poucos dias Quilperico casou-se com Fredegunda.",
    ] },
  { "title" = "Casamentos e filhos", "paragraphs" = [
      "em Março de 567, Ruão, com Galsuinta (◊ c. 540 † 568) filha de Atanagildo I, rei dos visigodos da Espanha. Sem filhos.",
      "♀ Rigunda (◊ 569 † ?) foi noiva de Recaredo I, rei dos visigodos da Espanha, mas não chegou a se casar.",
    ] },
  { "title" = "Referências", "paragraphs" = [
      "History of the Franks: Books I-X no site Medieval Sourcebook.Este artigo incorpora texto (em inglês) da Encyclopædia Britannica (11.ª edição), publicação em domínio público.",
    ] },
]

