[articles.en]
text = "Thusnelda was a Cheruscan noblewoman in the early first century CE. Her father Segestes sought Roman support, while her husband Arminius led resistance to Rome. According to Tacitus, in 15 CE Arminius's forces besieged Segestes, who appealed to Germanicus. The Roman army relieved the siege and took custody of Thusnelda, then pregnant. Segestes's speech in Tacitus says that she had been with him against her will. Tacitus portrays her meeting captivity without pleading, a scene written from a Roman perspective that presents her own response within a conflict between factions."
title = "Thusnelda"
lang = "en"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda was a Cheruscan noblewoman in the early first century CE. Her father Segestes sought Roman support, while her husband Arminius led resistance to Rome. According to Tacitus, in 15 CE Arminius's forces besieged Segestes, who appealed to Germanicus. The Roman army relieved the siege and took custody of Thusnelda, then pregnant. Segestes's speech in Tacitus says that she had been with him against her will. Tacitus portrays her meeting captivity without pleading, a scene written from a Roman perspective that presents her own response within a conflict between factions."]
sections = [{ title = "Capture and the triumph of Germanicus", paragraphs = ["Strabo names Thusnelda and her son Thumelicus among the captives displayed in Germanicus's triumph in Rome, held in 17 CE. Segestes watched the procession as a Roman guest. The ancient accounts leave much of Thusnelda's life undocumented and give the scene of capture different weight from the procession. Unbowed in Captivity takes her response in Tacitus as its inspiration. When a rival captures a city with at least two active levels, it loses one completed level and any upgrade underway is canceled. The city still changes hands, and the effect can occur once per city. The reduction in level represents a victory that yields less than the captor expected."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.es]
text = "Thusnelda fue una noble querusca de principios del siglo I d. C. Su padre Segestes buscó el apoyo romano, mientras su esposo Arminio encabezó la resistencia. Según Tácito, en el año 15 las fuerzas de Arminio sitiaron a Segestes, quien pidió ayuda a Germánico. El ejército romano levantó el sitio y tomó bajo custodia a Thusnelda, que estaba embarazada. En el discurso que Tácito atribuye a Segestes, este admite que ella estaba con él contra su voluntad. El historiador romano la retrata afrontando la captura sin suplicar."
title = "Thusnelda"
lang = "es"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda fue una noble querusca de principios del siglo I d. C. Su padre Segestes buscó el apoyo romano, mientras su esposo Arminio encabezó la resistencia. Según Tácito, en el año 15 las fuerzas de Arminio sitiaron a Segestes, quien pidió ayuda a Germánico. El ejército romano levantó el sitio y tomó bajo custodia a Thusnelda, que estaba embarazada. En el discurso que Tácito atribuye a Segestes, este admite que ella estaba con él contra su voluntad. El historiador romano la retrata afrontando la captura sin suplicar."]
sections = [{ title = "Captura y triunfo de Germánico", paragraphs = ["Estrabón menciona a Thusnelda y a su hijo Tumélico entre los cautivos exhibidos en el triunfo de Germánico en Roma en el año 17. Segestes presenció el desfile como invitado romano. Las fuentes conservadas cuentan poco de su vida fuera de estos episodios. Entereza en cautiverio toma como inspiración su actitud en el relato de Tácito. Cuando un rival conquista una ciudad suya con nivel activo 2 o superior, la ciudad pierde un nivel terminado y se cancela cualquier mejora en curso. La ciudad cambia de dueño y el efecto ocurre una vez por ciudad. La reducción hace que el conquistador se lleve una ciudad menos desarrollada."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.fr]
text = "Thusnelda était une noble chérusque du début du Ier siècle apr. J.-C. Son père Segestes recherchait l’appui de Rome, tandis que son époux Arminius dirigeait la résistance. Selon Tacite, en 15 les forces d’Arminius assiégèrent Segestes, qui appela Germanicus à l’aide. L’armée romaine leva le siège et prit sous sa garde Thusnelda, alors enceinte. Dans le discours que Tacite prête à Segestes, celui-ci dit qu’elle se trouvait chez lui contre son gré. L’historien romain la montre affrontant sa capture sans supplier."
title = "Thusnelda"
lang = "fr"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda était une noble chérusque du début du Ier siècle apr. J.-C. Son père Segestes recherchait l’appui de Rome, tandis que son époux Arminius dirigeait la résistance. Selon Tacite, en 15 les forces d’Arminius assiégèrent Segestes, qui appela Germanicus à l’aide. L’armée romaine leva le siège et prit sous sa garde Thusnelda, alors enceinte. Dans le discours que Tacite prête à Segestes, celui-ci dit qu’elle se trouvait chez lui contre son gré. L’historien romain la montre affrontant sa capture sans supplier."]
sections = [{ title = "La capture et le triomphe de Germanicus", paragraphs = ["Strabon cite Thusnelda et son fils Thumelicus parmi les captifs exhibés lors du triomphe de Germanicus à Rome en 17. Segestes assista au défilé comme invité des Romains. Les sources conservées renseignent peu sa vie en dehors de ces épisodes. Digne en captivité s’inspire de l’attitude que Tacite lui prête. Lorsqu’un rival prend une de ses villes de niveau actif 2 ou plus, elle perd un niveau achevé et toute amélioration en cours est annulée. La ville change de camp et l’effet se produit une fois par ville."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.de]
text = "Thusnelda war eine cheruskische Adlige des frühen ersten Jahrhunderts n. Chr. Ihr Vater Segestes suchte römische Unterstützung, während ihr Mann Arminius den Widerstand gegen Rom anführte. Laut Tacitus belagerten die Truppen des Arminius im Jahr 15 Segestes, der Germanicus um Hilfe bat. Das römische Heer beendete die Belagerung und nahm die schwangere Thusnelda in Gewahrsam. In der Rede, die Tacitus Segestes zuschreibt, räumt er ein, dass sie gegen ihren Willen bei ihm war. Der römische Historiker schildert sie als Gefangene, die sich ohne Flehen behauptet."
title = "Thusnelda"
lang = "de"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda war eine cheruskische Adlige des frühen ersten Jahrhunderts n. Chr. Ihr Vater Segestes suchte römische Unterstützung, während ihr Mann Arminius den Widerstand gegen Rom anführte. Laut Tacitus belagerten die Truppen des Arminius im Jahr 15 Segestes, der Germanicus um Hilfe bat. Das römische Heer beendete die Belagerung und nahm die schwangere Thusnelda in Gewahrsam. In der Rede, die Tacitus Segestes zuschreibt, räumt er ein, dass sie gegen ihren Willen bei ihm war. Der römische Historiker schildert sie als Gefangene, die sich ohne Flehen behauptet."]
sections = [{ title = "Gefangennahme und Triumph des Germanicus", paragraphs = ["Strabon nennt Thusnelda und ihren Sohn Thumelicus unter den Gefangenen im Triumphzug des Germanicus im Jahr 17 in Rom. Segestes sah als Gast der Römer zu. Außerhalb dieser Episoden geben die Quellen wenig über ihr Leben preis. Unbeugsam in Gefangenschaft greift ihre Haltung in Tacitus’ Darstellung auf. Erobert ein Rivale eine ihrer Städte mit aktiver Stufe 2 oder höher, verliert sie eine fertige Stufe und ein laufender Ausbau endet. Die Stadt wechselt den Besitzer, und der Effekt tritt einmal pro Stadt ein."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.it]
text = "Thusnelda era una nobildonna dei Cherusci all’inizio del I secolo d.C. Suo padre Segeste cercava il sostegno di Roma, mentre suo marito Arminio guidava la resistenza. Secondo Tacito, nel 15 le forze di Arminio assediarono Segeste, che chiese aiuto a Germanico. L’esercito romano ruppe l’assedio e prese in custodia Thusnelda, allora incinta. Nel discorso che Tacito attribuisce a Segeste, lui dice che era con lui contro la sua volontà. Lo storico romano la ritrae mentre affronta la cattura senza supplicare."
title = "Thusnelda"
lang = "it"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda era una nobildonna dei Cherusci all’inizio del I secolo d.C. Suo padre Segeste cercava il sostegno di Roma, mentre suo marito Arminio guidava la resistenza. Secondo Tacito, nel 15 le forze di Arminio assediarono Segeste, che chiese aiuto a Germanico. L’esercito romano ruppe l’assedio e prese in custodia Thusnelda, allora incinta. Nel discorso che Tacito attribuisce a Segeste, lui dice che era con lui contro la sua volontà. Lo storico romano la ritrae mentre affronta la cattura senza supplicare."]
sections = [{ title = "La cattura e il trionfo di Germanico", paragraphs = ["Strabone nomina Thusnelda e suo figlio Tumelico tra i prigionieri esibiti nel trionfo di Germanico a Roma nel 17. Segeste assistette al corteo come ospite dei Romani. Le fonti conservate raccontano poco della sua vita al di fuori di questi episodi. Indomita in prigionia si ispira al suo atteggiamento nel racconto di Tacito. Quando un rivale prende una sua città di livello attivo 2 o superiore, la città perde un livello completato e l’eventuale potenziamento in corso viene annullato. La città cambia padrone e l’effetto si verifica una volta per città."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.tr]
text = "Thusnelda, MS birinci yüzyıl başlarında yaşamış Kerusk soylusu bir kadındı. Babası Segestes Roma’nın desteğini ararken, eşi Arminius Roma’ya karşı direnişi yönetiyordu. Tacitus’a göre 15 yılında Arminius’un kuvvetleri Segestes’i kuşattı ve Segestes Germanicus’tan yardım istedi. Roma ordusu kuşatmayı kaldırdı ve hamile olan Thusnelda’yı gözetim altına aldı. Tacitus’un Segestes’e atfettiği konuşmada, onun kendi isteği dışında yanında bulunduğu belirtilir. Romalı tarihçi, Thusnelda’yı esarete yalvarmadan karşı koyan biri olarak anlatır."
title = "Thusnelda"
lang = "tr"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda, MS birinci yüzyıl başlarında yaşamış Kerusk soylusu bir kadındı. Babası Segestes Roma’nın desteğini ararken, eşi Arminius Roma’ya karşı direnişi yönetiyordu. Tacitus’a göre 15 yılında Arminius’un kuvvetleri Segestes’i kuşattı ve Segestes Germanicus’tan yardım istedi. Roma ordusu kuşatmayı kaldırdı ve hamile olan Thusnelda’yı gözetim altına aldı. Tacitus’un Segestes’e atfettiği konuşmada, onun kendi isteği dışında yanında bulunduğu belirtilir. Romalı tarihçi, Thusnelda’yı esarete yalvarmadan karşı koyan biri olarak anlatır."]
sections = [{ title = "Esaret ve Germanicus’un zafer alayı", paragraphs = ["Strabon, Thusnelda ve oğlu Thumelicus’u 17 yılında Roma’da düzenlenen Germanicus’un zafer alayındaki esirler arasında sayar. Segestes geçidi Romalıların konuğu olarak izledi. Kaynaklar bu olayların dışında Thusnelda’nın yaşamı hakkında az bilgi verir. Esarette Boyun Eğmez, Tacitus’un anlattığı tutumdan esinlenir. Bir rakip onun etkin seviyesi 2 veya daha yüksek şehrini ele geçirirse şehir bir tamamlanmış seviye kaybeder ve süren yükseltme iptal edilir. Şehir el değiştirir ve etki şehir başına bir kez işler."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.zh-CN]
text = "图斯内尔达是公元一世纪早期的切鲁西贵族女子。她的父亲塞格斯特斯寻求罗马支持，丈夫阿尔米尼乌斯则领导抵抗罗马的行动。按照罗马史家塔西佗的叙述，公元15年，阿尔米尼乌斯的军队围困塞格斯特斯，后者向日耳曼尼库斯求助。罗马军队解围，接管了塞格斯特斯的家属和随从，当时身怀有孕的图斯内尔达也在其中。塔西佗写到，塞格斯特斯承认她并非自愿留在他身边。塔西佗笔下的图斯内尔达面对俘获者时没有开口求饶，目光落在自己的腹部。作者用这一举动刻画她在压力下的反应。这个场景所用的词语和对人物性格的判断都出自罗马作者，读者可以借此了解作者如何表现一名被俘的切鲁西女子，同时需要留意记录的立场。"
title = "图斯内尔达"
lang = "zh-CN"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["图斯内尔达是公元一世纪早期的切鲁西贵族女子。她的父亲塞格斯特斯寻求罗马支持，丈夫阿尔米尼乌斯则领导抵抗罗马的行动。按照罗马史家塔西佗的叙述，公元15年，阿尔米尼乌斯的军队围困塞格斯特斯，后者向日耳曼尼库斯求助。罗马军队解围，接管了塞格斯特斯的家属和随从，当时身怀有孕的图斯内尔达也在其中。塔西佗写到，塞格斯特斯承认她并非自愿留在他身边。塔西佗笔下的图斯内尔达面对俘获者时没有开口求饶，目光落在自己的腹部。作者用这一举动刻画她在压力下的反应。这个场景所用的词语和对人物性格的判断都出自罗马作者，读者可以借此了解作者如何表现一名被俘的切鲁西女子，同时需要留意记录的立场。"]
sections = [{ title = "被俘与日耳曼尼库斯的凯旋式", paragraphs = ["斯特拉波在《地理志》中列举了公元17年日耳曼尼库斯在罗马举行凯旋式时公开展示的俘虏。图斯内尔达和她的儿子图梅利库斯都在其中，而塞格斯特斯受到罗马人礼遇，在场观看游行。凯旋式把远方的战争带到罗马城内，俘虏在仪式中的身份也影响观众对胜利的理解。研究罗马俘获制度的科斯格雷夫把这段叙述放在胜利者公开展示俘虏的习惯中考察。两份文献分别让人看到她落入罗马控制的过程和这次俘获后来怎样出现在罗马公共仪式上。她在这两次事件之外的生平缺乏详细记载。游戏中的「被俘不屈」取材于塔西佗对她面对俘获者的描写。对手夺取图斯内尔达的一座城市时，如果该城已有两个或更多完成的等级，就会失去一个有效等级。正在进行的城市升级也会取消，城市则归攻占的一方。每座城市只会因这项能力降级一次。如果同一座城市被夺回又失守，已经用过的保护不会再次发生。发动时，失守城市的位置会在地图上闪光，征服者和图斯内尔达都会收到提示。游戏用占领所得减少来表现被俘时仍保持不屈的主题，城市等级与施工属于游戏规则。"] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.ja]
text = "トゥスネルダは紀元一世紀初頭のケルスキ族の貴族女性だった。父のセゲステスはローマの支援を求め、夫のアルミニウスはローマへの抵抗を率いた。ローマの歴史家タキトゥスによれば、15年にアルミニウス側がセゲステスを包囲し、セゲステスはゲルマニクスに救援を求めた。ローマ軍が包囲を解き、身ごもっていたトゥスネルダはローマ側の手に渡った。タキトゥスが伝えるセゲステスの言葉には、彼女が自分の意志でそこにいたのではないという説明がある。タキトゥスは、捕らえられた彼女が言葉で助けを請わず、自らの腹に目を向けたと描く。この場面はローマの著述家による描写で、彼女が置かれた状況と、それに対する姿勢を伝えている。"
title = "トゥスネルダ"
lang = "ja"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["トゥスネルダは紀元一世紀初頭のケルスキ族の貴族女性だった。父のセゲステスはローマの支援を求め、夫のアルミニウスはローマへの抵抗を率いた。ローマの歴史家タキトゥスによれば、15年にアルミニウス側がセゲステスを包囲し、セゲステスはゲルマニクスに救援を求めた。ローマ軍が包囲を解き、身ごもっていたトゥスネルダはローマ側の手に渡った。タキトゥスが伝えるセゲステスの言葉には、彼女が自分の意志でそこにいたのではないという説明がある。タキトゥスは、捕らえられた彼女が言葉で助けを請わず、自らの腹に目を向けたと描く。この場面はローマの著述家による描写で、彼女が置かれた状況と、それに対する姿勢を伝えている。"]
sections = [{ title = "捕囚とゲルマニクスの凱旋", paragraphs = ["ストラボンは『地理誌』で、17年にローマで行われたゲルマニクスの凱旋式に、トゥスネルダと息子のトゥメリクスが捕虜として出されたと記す。セゲステスはローマ側の客として行列を見た。ローマの捕囚を研究したコスグレーヴは、この場面を、勝者が捕虜を公衆に見せた慣行と結び付けて考察している。二つの記録は、捕らえられた場面と、その捕囚がローマでどう見せられたかを別々に伝えている。それ以外の生涯を詳しく知る資料は少ない。ゲームの「囚われても屈せず」は、タキトゥスが描いた捕囚時の態度に着想を得た。敵が稼働レベル2以上の自軍都市を占領すると、その都市の完成レベルが一段階下がり、進行中の増築は中止される。都市の支配者は占領した側に変わる。同じ都市が奪い返されて再び落ちても、効果は都市ごとに一回である。発動すると都市の位置が光り、双方に通知される。建設レベルの減少は、捕らえられても屈しなかったという描写をゲームで表すための設定である。"] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.ko]
text = "투스넬다는 기원후 1세기 초 케루스키족 귀족 여성이었다. 아버지 세게스테스는 로마의 지원을 구했고 남편 아르미니우스는 로마에 맞선 저항을 이끌었다. 로마 역사학자 타키투스에 따르면 15년 아르미니우스의 군대가 세게스테스를 포위하자, 세게스테스는 게르마니쿠스에게 구원을 요청했다. 로마군이 포위를 풀었고, 임신 중이던 투스넬다는 로마 측에 넘겨졌다. 타키투스가 기록한 연설에서 세게스테스는 딸이 자의로 그곳에 머문 것이 아니었다고 말했다. 타키투스는 그녀가 붙잡힌 뒤에도 애원하지 않고 자신의 배를 바라봤다고 그렸다. 이 장면은 로마 저술가의 서술을 통해 전해진다."
title = "투스넬다"
lang = "ko"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["투스넬다는 기원후 1세기 초 케루스키족 귀족 여성이었다. 아버지 세게스테스는 로마의 지원을 구했고 남편 아르미니우스는 로마에 맞선 저항을 이끌었다. 로마 역사학자 타키투스에 따르면 15년 아르미니우스의 군대가 세게스테스를 포위하자, 세게스테스는 게르마니쿠스에게 구원을 요청했다. 로마군이 포위를 풀었고, 임신 중이던 투스넬다는 로마 측에 넘겨졌다. 타키투스가 기록한 연설에서 세게스테스는 딸이 자의로 그곳에 머문 것이 아니었다고 말했다. 타키투스는 그녀가 붙잡힌 뒤에도 애원하지 않고 자신의 배를 바라봤다고 그렸다. 이 장면은 로마 저술가의 서술을 통해 전해진다."]
sections = [{ title = "포로와 게르마니쿠스의 개선식", paragraphs = ["스트라본은 17년 로마에서 열린 게르마니쿠스의 개선식에 투스넬다와 아들 투멜리쿠스가 포로로 등장했다고 기록했다. 세게스테스는 로마의 손님으로 그 행렬을 지켜봤다. 이 행렬에서는 전쟁의 결과가 로마 시민들에게 공개되었다. 두 기록은 포로가 된 순간과 로마에서 포로를 공개한 순간을 각각 보여 준다. 이 사건들 밖의 생애를 자세히 알려 주는 자료는 드물다. 게임의 ‘포로가 되어도 굴하지 않다’는 타키투스가 묘사한 태도에서 착안했다. 적이 투스넬다의 가동 레벨 2 이상 도시를 점령하면 완료 레벨이 한 단계 내려가고 진행 중인 업그레이드는 취소된다. 도시의 소유권은 점령한 쪽으로 넘어간다. 같은 도시를 되찾았다가 다시 빼앗겨도 이 효과는 한 번만 적용된다. 발동하면 도시의 위치가 지도에서 빛나고 양쪽 플레이어에게 알림이 표시된다."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.ar]
text = "كانت توسنيلدا نبيلة من الكيروسكيين في أوائل القرن الأول الميلادي. طلب أبوها سيغيستيس دعم روما، بينما قاد زوجها أرمينيوس المقاومة ضدها. ويقول تاسيتوس إن قوات أرمينيوس حاصرت سيغيستيس عام 15، فطلب النجدة من جرمانيكوس. وفك الجيش الروماني الحصار وأخذ توسنيلدا في عهدته وهي حامل. وفي الخطاب الذي ينسبه تاسيتوس إلى سيغيستيس، يذكر أنها كانت عنده على غير إرادتها. ويصورها المؤرخ الروماني وهي تواجه أسرها من دون تضرع."
title = "توسنيلدا"
lang = "ar"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["كانت توسنيلدا نبيلة من الكيروسكيين في أوائل القرن الأول الميلادي. طلب أبوها سيغيستيس دعم روما، بينما قاد زوجها أرمينيوس المقاومة ضدها. ويقول تاسيتوس إن قوات أرمينيوس حاصرت سيغيستيس عام 15، فطلب النجدة من جرمانيكوس. وفك الجيش الروماني الحصار وأخذ توسنيلدا في عهدته وهي حامل. وفي الخطاب الذي ينسبه تاسيتوس إلى سيغيستيس، يذكر أنها كانت عنده على غير إرادتها. ويصورها المؤرخ الروماني وهي تواجه أسرها من دون تضرع."]
sections = [{ title = "الأسر وموكب انتصار جرمانيكوس", paragraphs = ["يذكر سترابون توسنيلدا وابنها توميليكوس ضمن الأسرى الذين عُرضوا في موكب انتصار جرمانيكوس في روما عام 17. وشاهد سيغيستيس الموكب ضيفاً لدى الرومان. وتقدم المصادر الباقية معلومات قليلة عن حياتها خارج هذه الحوادث. وتستلهم قدرة «صمود في الأسر» موقفها في رواية تاسيتوس. عندما يحتل خصم مدينة لها بمستوى عامل 2 أو أكثر، تخسر المدينة مستوى مكتملاً وتُلغى أي ترقية جارية. تنتقل المدينة إلى مالكها الجديد، ويحدث التأثير مرة واحدة لكل مدينة."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.ru]
text = "Туснельда была знатной женщиной из племени херусков в начале I века н. э. Её отец Сегест искал поддержки Рима, а муж Арминий возглавлял сопротивление. По словам Тацита, в 15 году войска Арминия осадили Сегеста, и тот обратился за помощью к Германику. Римское войско сняло осаду и взяло под стражу беременную Туснельду. В речи, которую Тацит приписывает Сегесту, тот признаёт, что она была у него против воли. Римский историк описывает, как она встретила пленение без мольбы."
title = "Туснельда"
lang = "ru"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Туснельда была знатной женщиной из племени херусков в начале I века н. э. Её отец Сегест искал поддержки Рима, а муж Арминий возглавлял сопротивление. По словам Тацита, в 15 году войска Арминия осадили Сегеста, и тот обратился за помощью к Германику. Римское войско сняло осаду и взяло под стражу беременную Туснельду. В речи, которую Тацит приписывает Сегесту, тот признаёт, что она была у него против воли. Римский историк описывает, как она встретила пленение без мольбы."]
sections = [{ title = "Пленение и триумф Германика", paragraphs = ["Страбон называет Туснельду и её сына Тумелика среди пленников, которых показали на триумфе Германика в Риме в 17 году. Сегест смотрел шествие как гость римлян. За пределами этих событий источники мало рассказывают о её жизни. «Несломленная в плену» вдохновлена её поведением в рассказе Тацита. Если соперник захватывает её город с активным уровнем 2 или выше, город теряет один готовый уровень, а текущее улучшение отменяется. Город переходит к захватчику, и эффект срабатывает один раз для каждого города."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.vi]
text = "Thusnelda là một phụ nữ quý tộc người Cherusci vào đầu thế kỷ I CN. Cha bà, Segestes, tìm sự hỗ trợ của La Mã, còn chồng bà, Arminius, lãnh đạo cuộc kháng cự. Theo Tacitus, năm 15 quân của Arminius vây Segestes, khiến ông cầu cứu Germanicus. Quân La Mã phá vòng vây và giữ Thusnelda, lúc đó đang mang thai. Trong lời phát biểu mà Tacitus gán cho Segestes, ông thừa nhận bà ở đó trái ý mình. Sử gia La Mã mô tả bà đối diện cảnh bị bắt mà không van xin."
title = "Thusnelda"
lang = "vi"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda là một phụ nữ quý tộc người Cherusci vào đầu thế kỷ I CN. Cha bà, Segestes, tìm sự hỗ trợ của La Mã, còn chồng bà, Arminius, lãnh đạo cuộc kháng cự. Theo Tacitus, năm 15 quân của Arminius vây Segestes, khiến ông cầu cứu Germanicus. Quân La Mã phá vòng vây và giữ Thusnelda, lúc đó đang mang thai. Trong lời phát biểu mà Tacitus gán cho Segestes, ông thừa nhận bà ở đó trái ý mình. Sử gia La Mã mô tả bà đối diện cảnh bị bắt mà không van xin."]
sections = [{ title = "Bị bắt và lễ khải hoàn của Germanicus", paragraphs = ["Strabo ghi Thusnelda và con trai Thumelicus nằm trong số tù nhân bị đưa ra trong lễ khải hoàn của Germanicus tại Rome năm 17. Segestes xem cuộc diễu hành với tư cách khách của La Mã. Tư liệu còn lại ít nói về cuộc đời bà ngoài những sự kiện này. Bất khuất trong cảnh giam cầm lấy ý tưởng từ thái độ của bà trong lời kể của Tacitus. Khi đối thủ chiếm một thành phố của bà có cấp hoạt động từ 2 trở lên, thành phố mất một cấp đã hoàn thành và nâng cấp đang diễn ra bị hủy. Thành phố vẫn đổi chủ và hiệu ứng xảy ra một lần mỗi thành phố."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.id]
text = "Thusnelda adalah bangsawati Cherusci pada awal abad pertama Masehi. Ayahnya, Segestes, mencari dukungan Romawi, sedangkan suaminya, Arminius, memimpin perlawanan. Menurut Tacitus, pada 15 M pasukan Arminius mengepung Segestes, yang meminta bantuan Germanicus. Pasukan Romawi mematahkan pengepungan dan menahan Thusnelda, yang sedang hamil. Dalam pidato yang dinisbatkan Tacitus kepada Segestes, ia mengakui bahwa Thusnelda berada di rumahnya di luar kehendaknya. Sejarawan Romawi itu menggambarkannya menghadapi penawanan tanpa memohon."
title = "Thusnelda"
lang = "id"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Thusnelda adalah bangsawati Cherusci pada awal abad pertama Masehi. Ayahnya, Segestes, mencari dukungan Romawi, sedangkan suaminya, Arminius, memimpin perlawanan. Menurut Tacitus, pada 15 M pasukan Arminius mengepung Segestes, yang meminta bantuan Germanicus. Pasukan Romawi mematahkan pengepungan dan menahan Thusnelda, yang sedang hamil. Dalam pidato yang dinisbatkan Tacitus kepada Segestes, ia mengakui bahwa Thusnelda berada di rumahnya di luar kehendaknya. Sejarawan Romawi itu menggambarkannya menghadapi penawanan tanpa memohon."]
sections = [{ title = "Penawanan dan pawai kemenangan Germanicus", paragraphs = ["Strabo menyebut Thusnelda dan putranya Thumelicus di antara tawanan yang dipertontonkan dalam pawai kemenangan Germanicus di Roma pada 17 M. Segestes menonton sebagai tamu Romawi. Catatan yang bertahan hanya sedikit membahas hidupnya di luar peristiwa itu. Tegar dalam Tawanan terinspirasi oleh sikapnya dalam kisah Tacitus. Saat lawan merebut kotanya dengan tingkat aktif 2 atau lebih, kota kehilangan satu tingkat yang sudah selesai dan peningkatan yang berjalan dibatalkan. Kota tetap berpindah tangan dan efek berlaku sekali per kota."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.fil]
text = "Si Thusnelda ay isang babaeng maharlika ng mga Cherusci noong unang bahagi ng unang siglo CE. Humingi ng suporta sa Roma ang ama niyang si Segestes, habang pinamunuan ng asawa niyang si Arminius ang paglaban. Ayon kay Tacitus, kinubkob ng hukbo ni Arminius si Segestes noong 15 CE, kaya humingi ito ng tulong kay Germanicus. Binasag ng mga Romano ang pagkubkob at kinuha nila si Thusnelda, na nagdadalang-tao noon. Sa talumpating iniugnay ni Tacitus kay Segestes, sinabi nitong labag sa kalooban ng anak ang pananatili sa kaniya. Inilarawan ng historyador na Romano ang pagharap ni Thusnelda sa pagkabihag nang hindi nagmamakaawa."
title = "Thusnelda"
lang = "fil"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
shortArticle = true
intro = ["Si Thusnelda ay isang babaeng maharlika ng mga Cherusci noong unang bahagi ng unang siglo CE. Humingi ng suporta sa Roma ang ama niyang si Segestes, habang pinamunuan ng asawa niyang si Arminius ang paglaban. Ayon kay Tacitus, kinubkob ng hukbo ni Arminius si Segestes noong 15 CE, kaya humingi ito ng tulong kay Germanicus. Binasag ng mga Romano ang pagkubkob at kinuha nila si Thusnelda, na nagdadalang-tao noon. Sa talumpating iniugnay ni Tacitus kay Segestes, sinabi nitong labag sa kalooban ng anak ang pananatili sa kaniya. Inilarawan ng historyador na Romano ang pagharap ni Thusnelda sa pagkabihag nang hindi nagmamakaawa."]
sections = [{ title = "Pagkabihag at prusisyon ni Germanicus", paragraphs = ["Binanggit ni Strabo si Thusnelda at ang anak niyang si Thumelicus sa mga bihag na ipinarada sa tagumpay ni Germanicus sa Roma noong 17 CE. Nanood si Segestes bilang panauhin ng mga Romano. Kaunti ang nalalaman tungkol sa buhay niya sa labas ng mga pangyayaring ito. Hango ang Matatag sa Pagkabihag sa tindig niya sa salaysay ni Tacitus. Kapag sinakop ng kalaban ang lungsod niya na may aktibong antas 2 o mas mataas, mawawalan ito ng isang tapos na antas at makakansela ang kasalukuyang pag-upgrade. Mapupunta pa rin sa kalaban ang lungsod at isang beses lamang ito mangyayari bawat lungsod."] }]
sources = [{ title = "Tacitus, Annals 1.57–58, LacusCurtius, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html" }, { title = "Strabo, Geography 7.1.4, Perseus Digital Library, Tufts University", url = "https://beta.perseus.tufts.edu/urn%3Acts%3AgreekLit%3Atlg0099.tlg001.perseus-eng4/section%3A7.1.4/" }, { title = "Elinor Grace Cosgrave, Captive-taking in the Late Roman Republic and Early Principate, University of Leeds", url = "https://etheses.whiterose.ac.uk/id/eprint/29163/" }]

[articles.pt-BR]
text = "Thusnelda foi uma nobre querusca do início do século I d.C. Seu pai, Segestes, buscou apoio romano, enquanto seu marido, Armínio, liderou a resistência. Segundo Tácito, em 15 as forças de Armínio cercaram Segestes, que pediu ajuda a Germânico. O exército romano rompeu o cerco e tomou sob custódia Thusnelda, então grávida. No discurso que Tácito atribui a Segestes, ele admite que ela estava com ele contra a própria vontade. O historiador romano a retrata enfrentando a captura sem implorar."
title = "Thusnelda"
lang = "pt-BR"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/1D%2A.html"
