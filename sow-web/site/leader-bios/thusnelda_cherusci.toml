intro = ["Thusnelda foi uma nobre querusca do início do século I d.C. Seu pai, Segestes, buscou apoio romano, enquanto seu marido, Armínio, liderou a resistência. Segundo Tácito, em 15 as forças de Armínio cercaram Segestes, que pediu ajuda a Germânico. O exército romano rompeu o cerco e tomou sob custódia Thusnelda, então grávida. No discurso que Tácito atribui a Segestes, ele admite que ela estava com ele contra a própria vontade. O historiador romano a retrata enfrentando a captura sem implorar."]
sections = [{ title = "Captura e triunfo de Germânico", paragraphs = ["Estrabão menciona Thusnelda e seu filho Tumélico entre os cativos exibidos no triunfo de Germânico em Roma no ano 17. Segestes assistiu à procissão como convidado dos romanos. Os registros preservados contam pouco sobre a vida dela fora desses episódios. Firme no cativeiro se inspira em sua atitude no relato de Tácito. Quando um rival captura uma cidade dela de nível ativo 2 ou maior, a cidade perde um nível concluído e qualquer melhoria em andamento é cancelada. A cidade muda de dono e o efeito ocorre uma vez por cidade."] }]
