[articles.en]
text = "Boudica or Boudicca was a queen of the ancient British Iceni tribe who led a failed uprising against the conquering forces of the Roman Empire in AD 60 or 61. She is considered a British national heroine and a symbol of the struggle for justice and independence."
title = "Boudica"
lang = "en"
url = "https://en.wikipedia.org/wiki/Boudica"
intro = [
  "Boudica or Boudicca (, from Brythonic *boudi 'victory, win' + *-kā (adjectival suffix), i.e., 'Victorious Woman', known in Latin chronicles as Boadicea or Boudicea and in Welsh as Buddug, pronounced [ˈbɨðɨɡ]) was a queen of the ancient British Iceni tribe who led a failed uprising against the conquering forces of the Roman Empire in AD 60 or 61. She is considered a British national heroine and a symbol of the struggle for justice and independence.",
  "Boudica's husband, Prasutagus, with whom she had two daughters, ruled as a nominally independent ally of Rome. He left his kingdom jointly to his daughters and to the Roman emperor in his will. When he died, his will was ignored, and the kingdom was annexed and his property taken. According to the Roman historian Tacitus, Boudica was flogged and her daughters raped. The historian Cassius Dio wrote that previous imperial donations to influential Britons were confiscated and the Roman financier and philosopher Seneca called in the loans he had forced on the reluctant Britons.",
  "In ad AD 60/61, Boudica led the Iceni and other British tribes in revolt. They destroyed Camulodunum (modern Colchester), earlier the capital of the Trinovantes but at that time a colonia for discharged Roman soldiers. Upon hearing of the revolt, the Roman governor Gaius Suetonius Paulinus hurried from the island of Mona (modern Anglesey) to Londinium, the 20-year-old commercial settlement that was the rebels' next target. Unable to defend the settlement, he abandoned it. Boudica's army defeated a detachment of the Legio IX Hispana and burned both Londinium and Verulamium. In all, an estimated 70,000–80,000 Romans and Britons were killed by Boudica's followers. Suetonius, meanwhile, regrouped his forces, possibly in the West Midlands, and despite being heavily outnumbered, he decisively defeated the Britons. Boudica died, by suicide or illness, shortly afterwards. The crisis of 60/61 caused Nero to consider withdrawing all his imperial forces from Britain, but Suetonius's victory over Boudica confirmed Roman control of the province.",
  "Interest in these events was revived in the English Renaissance and led to Boudica's fame in the Victorian era and as a cultural symbol in Britain.",
]
sections = [
  { "title" = "Background", "paragraphs" = [
      "Boudica was the consort of Prasutagus, king of the Iceni, a tribe who inhabited what is now the English county of Norfolk and parts of the neighbouring counties of Cambridgeshire, Suffolk and Lincolnshire. The Iceni produced some of the earliest known British coins. They had revolted against the Romans in 47 when the Roman governor Publius Ostorius Scapula planned to disarm all the peoples of Britain under Roman control. The Romans allowed the kingdom to retain its independence once the uprising was suppressed.",
    ] },
  { "title" = "Events leading to the revolt", "paragraphs" = [
      "On his death in AD 60/61, Prasutagus made his two daughters as well as the Roman Emperor Nero his heirs. The Romans ignored the will, and the kingdom was absorbed into the province of Britannia. Catus Decianus, procurator of Britain, was sent to secure the Iceni kingdom for Rome.",
      "The Romans' next actions were described by Tacitus, who detailed pillaging of the countryside, the ransacking of the king's household, and the brutal treatment of Boudica and her daughters. According to Tacitus, Boudica was flogged and her daughters were raped. These abuses are not mentioned in Dio's account, who instead cites three different causes for the rebellion: the recalling of loans that were given to the Britons by Seneca; Decianus Catus's confiscation of money formerly loaned to the Britons by the Emperor Claudius; and Boudica's own entreaties. The loans were thought by the Iceni to have been repaid by gift exchange.",
      "Dio gives Boudica a speech to her people and their allies reminding them that life was much better before the Roman occupation, stressing that wealth cannot be enjoyed under slavery and placing the blame upon herself for not expelling the Romans as they had done when Julius Caesar invaded. The willingness of those seen as barbarians to sacrifice a higher quality of living under the Romans in exchange for their freedom and personal liberty was an important part of what Dio considered to be motivation for the rebellions.",
    ] },
  { "title" = "Uprising", "paragraphs" = [
      "The first target of the rebels was Camulodunum (modern Colchester), a Roman colonia for retired soldiers. A Roman temple had been erected there to Claudius, at great expense to the local population. Combined with brutal treatment of the Britons by the veterans, this had caused resentment towards the Romans.",
      "The Iceni and the Trinovantes comprised an army of 120,000 men. Dio claimed that Boudica called upon the British goddess of victory Andraste to aid her army. Once the revolt had begun, the only Roman troops available to provide assistance, aside from the few within the colony, were 200 auxiliaries located in London, who were not equipped to fight Boudica's army. Camulodunum was captured by the rebels; those inhabitants who survived the initial attack took refuge in the Temple of Claudius for two days before they were killed. Quintus Petillius Cerialis, then commanding the Legio IX Hispana, attempted to relieve Camulodunum, but suffered an overwhelming defeat. The infantry with him were all killed and only the commander and some of his cavalry escaped. After this disaster, Catus Decianus, whose behaviour had provoked the rebellion, fled abroad to Gaul.",
      "Suetonius was leading a campaign against the island of Mona, off the coast of North Wales. On hearing the news of the Iceni uprising, he left a garrison on Mona and returned to deal with Boudica. He moved quickly with a force of men through hostile territory to Londinium, which he reached before the arrival of Boudica's army but, outnumbered, he decided to abandon the town to the rebels, who burned it down after torturing and killing everyone who had remained. The rebels also sacked the municipium of Verulamium (modern St Albans), north-west of London, though the extent of its destruction is unclear.",
    ] },
  { "title" = "Name", "paragraphs" = [
      "Boudica may have been an honorific title, in which case the name by which she was known during most of her life is unknown. The English linguist and translator Kenneth Jackson concluded that the name Boudica—based on later developments in Welsh (Buddug) and Irish (Buaidheach)—derives from the Proto-Celtic feminine adjective *boudīkā 'victorious', which in turn is derived from the Celtic word *boudā 'victory', and that the correct spelling of the name in Common Brittonic (the British Celtic language) is Boudica, pronounced [boʊˈdiːkaː]. Variations on the historically correct Boudica include Boudicca, Bonduca, Boadicea, and Buduica. The Gaulish version of her name is attested in inscriptions as Boudiga in Bordeaux, Boudica in Lusitania, and Bodicca in Algeria.",
      "Boudica's name was spelt incorrectly by Dio, who used Buduica. Her name was also misspelled by Tacitus, who added a second 'c.' After the misspelling was copied by a medieval scribe, further variations began to appear. Along with the second 'c' becoming an 'e,' an 'a' appeared in place of the 'u', which produced the medieval (and most common) version of the name, Boadicea. The true spelling was totally obscured when Boadicea first appeared in around the 17th century. William Cowper used this spelling in his poem Boadicea, an Ode (1782), which readapted Boudica's story to fit the context of Britain's rising territorial and political ambitions.",
    ] },
]

[articles.es]
text = "Boudica (del britónico *boudi, 'victoria, triunfo' + sufijo *-kā 'tener', es decir, 'Mujer Victoriosa',) fue una reina guerrera de la antigua tribu británica de los icenos, que acaudilló a varias tribus britanas, incluyendo a sus vecinos los trinovantes, durante el mayor (aunque fallido) levantamiento en Britania contra la ocupación romana, en el año 60 o 61 d. C., durante el reinado del emperador Nerón."
title = "Boudica"
lang = "es"
url = "https://es.wikipedia.org/wiki/Boudica"
intro = [
  "Boudica (del britónico *boudi, 'victoria, triunfo' + sufijo *-kā 'tener', es decir, 'Mujer Victoriosa',) fue una reina guerrera de la antigua tribu británica de los icenos, que acaudilló a varias tribus britanas, incluyendo a sus vecinos los trinovantes, durante el mayor (aunque fallido) levantamiento en Britania contra la ocupación romana, en el año 60 o 61 d. C., durante el reinado del emperador Nerón. Estos hechos fueron narrados sobre todo por dos historiadores, Tácito (en sus Anales y en La vida de Julio Agrícola) y Dion Casio (en Historia romana). También se la conoce como Búdica, Buduica, Bonduca o por su forma latinizada de Boadicea. Se la considera una heroína nacional británica y un símbolo de la lucha por la justicia y la independencia.",
  "Su esposo, Prasutago, con quien tuvo dos hijas, gobernó como un aliado nominalmente independiente de Roma. Legó su reino conjuntamente a sus hijas y al emperador romano en su testamento. A su muerte, sin embargo, su testamento fue ignorado, el reino fue anexado y sus propiedades confiscadas. Según el historiador romano Tácito, Boudica fue azotada y sus hijas violadas. El historiador Dion Casio escribió que donaciones imperiales previas a britones influyentes fueron confiscadas y que el financiero y filósofo romano Séneca exigió el pago de los préstamos que había impuesto a los reticentes britones.",
  "En el año 60 o 61 d. C., Boudica lideró una revuelta de los icenos y otras tribus britonas a lo largo de la Anglia Oriental. Destruyeron Camulodunum (la actual Colchester), anteriormente capital de los trinovantes, pero en aquel entonces una colonia para soldados romanos licenciados. Al enterarse de la revuelta, el gobernador romano Cayo Suetonio Paulino se apresuró a partir de la isla de Mona (la actual Anglesey) hacia Londinium, el asentamiento comercial de 20 años de antigüedad que se convertiría en el próximo objetivo de los rebeldes. Incapaz de defender el asentamiento, lo abandonó. El ejército de Boudica derrotó a un destacamento de la Legio IX Hispana e incendió Londinium y Verulamio. En total, se estima que entre 70 000 y 80 000 romanos y britanos fueron asesinados por los seguidores de Boudica. Suetonio, mientras tanto, reagrupó sus fuerzas, posiblemente en las Tierras Medias Occidentales, y a pesar de ser ampliamente superado en número, derrotó decisivamente a los britanos. Boudica murió poco después, por suicidio o enfermedad. La crisis del 60/61 llevó a Nerón a considerar la retirada de todas sus fuerzas imperiales de Britania, pero la victoria de Suetonio sobre Boudica confirmó el control romano de la provincia.",
  "El interés por estos acontecimientos resurgió en el Renacimiento inglés y propició la fama de Boudica en la época victoriana y como símbolo cultural en Gran Bretaña. Considerada una heroína nacional de Inglaterra, Boudica ha inspirado numerosos libros y películas.",
]
sections = [
  { "title" = "Datos biográficos", "paragraphs" = [
      "Tácito y Dion Casio coinciden en que Boudica provenía de una familia de aristócratas icenos. De ella narra Dión Casio que «poseía una inteligencia mayor que la que generalmente tienen las mujeres», que era alta, de voz áspera y mirada feroz, cabello pelirrojo hasta la cadera, túnica de muchos colores y un manto grueso ajustado con un broche. Siempre usaba un grueso collar de oro, posiblemente un torque, aditamento que entre los pueblos celtas siempre significaba nobleza.",
      "Su esposo Prasutago (Prasutagus), probablemente llamado Esuprasto (Esuprastus), era el rey de los icenos, tribu que habitaba la zona del actual Norfolk (al este de Inglaterra). Al principio no fueron parte del territorio invadido por los romanos, porque tuvieron el estatuto de aliados durante la conquista romana de Britania llevada a cabo por Claudio y sus generales en el año 43.",
      "Como todos los pueblos celtas, daban gran importancia a su independencia, habiéndose dado varios roces entre los romanos y los icenos con anterioridad al levantamiento del año 60, el más importante de los cuales se verificó cuando el entonces gobernador de Britania Publio Ostorio Escápula los amenazó con desarmarlos.​",
    ] },
  { "title" = "Reconocimiento", "paragraphs" = [
      "Boudica forma parte de la instalación de la artista feminista Judy Chicago, The Dinner Party. Esta es una historia simbólica de la mujer en la civilización occidental que representa a 1.038 mujeres de la historia -39 de ellas están representadas por cubiertos y otras 999 en los nombres que están inscritos en The Heritage Floor sobre el que descansa la mesa.​ Chicago y su equipo decidieron utilizar imágenes celtas para representarla como reina guerrera.​",
    ] },
  { "title" = "Bibliografía", "paragraphs" = [
      "Dión Casio: Historia romana Obra completa. Madrid: Gredos, 2004. ISBN 978-84-249-2727-1.",
      "GOLDSWORTHY, Adrian: El ejército romano. España: Akal (Colección Grandes Temas n.º 5), 2007. ISBN 978-84-460-2234-3.",
      "Webster, Graham (2007). Boudica: la reina guerrera. Barcelona: Editorial Planeta. ISBN 978-84-08-07269-0.",
    ] },
  { "title" = "Enlaces externos", "paragraphs" = [
      "Gracia Alonso, Francisco: «Boudica, la rebelión de la reina guerrera de Britania contra Roma», en National Geographic.",
    ] },
]

[articles.fr]
text = "Boudica, Boudicca ou Boadicée (Boadicea en latin, Boudica en anglais), née vers 30 et morte en 61, était une reine des Icènes, un peuple celte vivant dans la région du Norfolk, dans le sud-est de l'actuelle Grande-Bretagne. Boudica était l'épouse de Prasutagos, un roi celte qui avait prêté allégeance à Rome, dans l'espoir de préserver ainsi l'indépendance de son peuple."
title = "Boudica"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Boudica"
intro = [
  "Boudica, Boudicca ou Boadicée (Boadicea en latin, Boudica en anglais), née vers 30 et morte en 61, était une reine des Icènes, un peuple celte vivant dans la région du Norfolk, dans le sud-est de l'actuelle Grande-Bretagne.",
  "Boudica était l'épouse de Prasutagos, un roi celte qui avait prêté allégeance à Rome, dans l'espoir de préserver ainsi l'indépendance de son peuple. Pour éviter la guerre, il légua son royaume à Rome à condition que sa femme puisse continuer à régner et que sa famille conserve ses privilèges.",
  "À la suite de conflits commerciaux, financiers et fonciers entre l'aristocratie icène et les administrateurs et marchands romains, les Romains décidèrent cependant de s'emparer de la totalité du royaume, confisquèrent les biens de la famille royale et fouettèrent Boudica en place publique, un châtiment habituellement appliqué aux esclaves. Humiliée, elle déclencha alors un soulèvement contre l'occupation romaine.",
  "À la tête d'une coalition de tribus bretonnes, elle lança une campagne militaire au sud de l'île, pillant et brûlant plusieurs villes romaines dont Camulodunum et Londinium.",
]
sections = [
  { "title" = "Nom", "paragraphs" = [
      "Cette reine est connue sous différents noms, successivement utilisés au cours de l'Histoire.",
      "L’historien romain Tacite la désigne dans ses écrits sous le nom de Boudicca. D’après le linguiste Kenneth Jackson, le nom serait dérivé de l’adjectif proto-celtique *boudīkā : « gagnante », lui-même dérivé de *boudi « gain, profit, victoire » (proche du gallois budd, du cornique boud du breton contemporain buz et du vieil irlandais búaid).",
      "À l’époque de la dynastie des Tudors, de nouvelles appellations apparaissent. En 1612, le poète anglais Edmund Spenser lui dédie une tragi-comédie, dans laquelle il la prénomme Bunduca. Au XVIIe siècle, un autre poète britannique, William Cowper, compose une ode qui popularise une nouvelle appellation, celle de Boadicea, francisée en Boadicée.",
    ] },
  { "title" = "Portrait", "paragraphs" = [
      "L'historien grec Dion Cassius est le seul à avoir brossé un portrait de Boadicée : « grande, terrible à voir et dotée d'une voix puissante. Des cheveux roux flamboyants lui tombaient jusqu'aux genoux, et elle portait un torque d'or décoré, une tunique multicolore et un épais manteau retenu par une broche. Elle était armée d'une longue lance et inspirait la terreur à ceux qui l'apercevaient. ». Sa sépulture restant inconnue, il est impossible de vérifier si cette description correspond à la réalité.",
    ] },
  { "title" = "Biographie", "paragraphs" = [
      "Les éléments biographiques sont maigres et les versions de Tacite et de Dion Cassius divergent sur plusieurs points. Pour Tacite, Boadicée est la reine des Icènes ; Dion Cassius dit simplement qu'elle est de lignée royale. Selon Tacite, elle aurait eu deux filles dont Dion Cassius ne souffle mot. Les deux auteurs divergent également sur la cause de sa mort : suicide par le poison s'il faut en croire Tacite, maladie selon Dion Cassius. Pour ce dernier, elle agit non seulement en chef de guerre mais également en prêtresse, pratiquant la divination au moyen d'un lièvre et invoquant le dieu Andrast ou Andat, connu par ce seul texte, et dont ce n'est peut-être pas le vrai nom, car les noms des dieux étaient tabous et non-prononcés dans la religion bretonne, qui les désignait par des adjectifs ou des allusions.",
    ] },
  { "title" = "Révolte", "paragraphs" = [
      "Vers l'an 60, pensant garantir l'avenir de son peuple tout en se ménageant les bonnes grâces de l'empereur Néron, le roi icène Prasutagos légua son royaume-client à l'Empire romain, tout en faisant de ses filles ses cohéritières, selon Tacite.",
      "Cette double dévolution fit cohabiter le droit coutumier icène avec le droit romain, et l'aristocratie icène entra en conflit avec les intérêts de l'Empire romain. Pour Rome, le royaume icène était désormais une colonie romaine et c'est pourquoi Catus Decianus, procurateur romain chargé de l'exécution testamentaire, réclama aux nobles icènes le remboursement d'exemptions de taxes consenties par le précédent empereur, Claude. Au même moment, le philosophe Sénèque, qui avait prêté aux Icènes dix millions de drachmes, en réclama le remboursement immédiat. Devant leurs protestations, Catus Decianus augmenta les impôts, puis saisit des biens et des terres pour les attribuer aux vétérans de l'armée romaine qui s'établissaient dans le pays, traitant les autochtones en esclaves dans l'esprit de Vae victis (« malheur aux vaincus »). Tout ceci fut interprété par la noblesse icène comme un enchaînement d'humiliations, culminant avec la flagellation de Boadicée avec des verges devant son peuple et le viol de ses deux très jeunes filles par des légionnaires — châtiments habituellement réservés aux esclaves.",
      "En réaction, la noblesse icène, Boadicée et une large part de son peuple prirent les armes contre les Romains. Tacite rapporte comment, debout sur un char, elle haranguait les Icènes en leur disant qu’« elle ne venait pas, fière de ses nobles aïeux, réclamer son royaume et ses richesses ; elle venait, comme simple femme, venger sa liberté ravie, son corps déchiré de verges, l'honneur de ses filles indignement flétri » pour conclure que « femme, c'était là sa résolution : quant aux hommes, ils pouvaient choisir de vivre en esclaves ». Constituant une armée, elle chercha des alliés chez ses voisins, les Trinovantes (dans l'actuel Suffolk), et d'autres nations britonniques.",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "La révolte de Boadicée fut oubliée pendant tout le Moyen Âge, et c'est sous le règne d'une femme de pouvoir qu'elle ressurgit. Au XVIe siècle, au moment où l'Angleterre commençait à s'affirmer sur les mers, Élisabeth Ire, qui connaissait Tacite et Dion Cassius, se servit de l'exemple et du courage de cette reine bretonne pour asseoir son autorité et renforcer l'identité nationale. Un siècle plus tard, Boadicée devient une figure connue du passé et inspire de nombreux récits. Au XIXe siècle, ce fut la reine Victoria qui la prit pour référence. On demanda alors au sculpteur Thomas Thornycroft (en) de représenter la reine des Icènes, en sorte que depuis 1902 on peut admirer devant le Parlement une sculpture de Boadicée conduisant son char, en compagnie de ses deux filles.",
      "Depuis le XXe siècle, les études sur Boadicée se sont multipliées et diversifiées. Les récits de Tacite et Dion Cassius furent passés au crible. On s'intéressa aux sources dont disposaient ces deux auteurs, ainsi qu'au déroulé exact des événements. Les fouilles de Colchester, Londres et St Albans, qui apportèrent de nouveaux éléments sur l'époque de la révolte et confirmèrent des incendies simultanés, furent à l'origine de ces publications.",
      "Pendant la deuxième moitié du XXe siècle, le mouvement féministe s'empara à son tour de la figure de cette reine censée « avoir tenu en échec un monde d'hommes », tandis que les historiens affirment qu'il s'agit d'une révolte contre la spoliation des indigènes par les colons romains des deux sexes et que l'armée de Boadicée était aussi masculine que les troupes romaines.",
    ] },
]

[articles.de]
text = "Boudicca (['bu:dɪka]; auch: Boudica, Boudouika, Boadicea, Voadicea, Bonduca; † um 61 n. Chr.) war eine britannische Heerführerin vermutlich königlicher Abstammung, die 60/61, in den frühen Jahren der römischen Besetzung Britanniens, den letztlich erfolglosen Boudicca-Aufstand anführte."
title = "Boudicca"
lang = "de"
url = "https://de.wikipedia.org/wiki/Boudicca"
intro = [
  "Boudicca (['bu:dɪka]; auch: Boudica, Boudouika, Boadicea, Voadicea, Bonduca; † um 61 n. Chr.) war eine britannische Heerführerin vermutlich königlicher Abstammung, die 60/61, in den frühen Jahren der römischen Besetzung Britanniens, den letztlich erfolglosen Boudicca-Aufstand anführte. Während des Aufstands zogen die keltischen Stämme der Icener und der Trinovanten unter der Führung von Boudicca gegen die römischen Siedlungen im heutigen Colchester, London und St Albans in den Kampf, töteten schätzungsweise 70.000 römische Siedler sowie romanisierte Einwohner der Siedlungen und brannten die Siedlungen ganz oder teilweise nieder. Boudiccas Armee wurde schließlich von römischen Truppen unter dem Statthalter Gaius Suetonius Paulinus vernichtend geschlagen. Boudicca soll sich Tacitus zufolge danach vergiftet haben; Cassius Dio dagegen schreibt, sie sei erkrankt und schließlich gestorben.",
  "Boudicca ist seit der Renaissance in England eine nationale Ikone und eine beliebte Figur in Kunst, Literatur und Popkultur. In vielen volkstümlichen britischen Geschichtsdarstellungen ist Boudicca eine Volksheldin, vergleichbar mit anderen historischen oder legendären Figuren der britischen Geschichte wie König Artus oder Alfred dem Großen. Historiker ordnen sie in die Reihe der Persönlichkeiten ein, die gegen die römische Herrschaft rebelliert haben, darunter Vercingetorix in Gallien, Arminius in Germanien und Bar Kochba in Judäa.",
]
sections = [
  { "title" = "Quellenlage", "paragraphs" = [
      "Da die Stämme Britanniens keine schriftlichen Zeugnisse hinterließen, ist die Sicht auf Boudicca nur durch die römische Geschichtsschreibung geprägt: Boudicca und der Aufstand werden in den Annalen und der Biografie Agricola (De vita Iulii Agricolae) des Geschichtsschreibers Tacitus beschrieben; ferner verfasste Cassius Dio in seiner Römischen Geschichte einen Bericht. Beide waren keine Augenzeugen, auch schrieben sie mit zeitlichem Abstand zu den Ereignissen. Tacitus wird häufig als die zuverlässigere Quelle angesehen, denn er wurde um 58 geboren und lebte damit zu einer Zeit, als die Erinnerung an den Aufstand 60/61 in Britannien noch lebendig war. Andererseits führten die Abweichungen zwischen seinem und Cassius Dios Bericht auch zu der Annahme, dass Tacitus hauptsächlich eine politische Tendenz verfolgte und so viele Informationen lediglich als literarische Topoi zur effektvolleren Ausgestaltung der Erzählung dienen.",
      "Auf jeden Fall wertete Tacitus für seine Annalen viele ältere, größtenteils anonyme Quellen und Senatsakten aus. Speziell über den Boudicca-Aufstand hatte er zudem wahrscheinlich Detailkenntnisse durch seinen Schwiegervater Gnaeus Iulius Agricola. Agricola war zwischen 58 und 62 in Britannien stationiert, zu Beginn als Militärtribun im Stab des Statthalters Gaius Suetonius Paulinus, zuletzt als Statthalter. Agricola war also zur Zeit des Boudicca-Aufstands in Britannien, hatte dadurch zuverlässige Detailinformationen über den Aufstand und war möglicherweise an den relevanten Militäraktionen beteiligt.",
      "Cassius Dio wurde um 163 unserer Zeitrechnung geboren und schrieb etwa 150 Jahre nach dem Boudicca-Aufstand. Er war außerdem auch geografisch weit von den Ereignissen in Britannien entfernt. Historiker gehen davon aus, dass Cassius Dios Berichte aus zweiter Hand sind und er selbst Britannien nie besucht hat. Dio recherchierte jedoch vor der Abfassung des Werkes gründlich – seiner eigenen Aussage nach zehn Jahre lang – und verarbeitete Material aus älteren Quellen, die er allerdings – wie in der antiken Geschichtsschreibung häufig – nicht nennt. In seiner römischen Geschichte fokussiert Dio gerne auf tragische Ereignisse wie Erdbeben und Massaker. Daher gilt es als möglich, dass er seine Geschichte um ihres emotionalen Effekts willen noch mit fiktionalen Elementen anreicherte. Für die Einschätzung seines Quellenwertes kommt erschwerend hinzu, dass weite Teile seines Werkes – darunter auch die Passagen zum Boudicca-Aufstand – nicht im Original erhalten sind, sondern nur in einer Zusammenfassung (Epitome) des byzantinischen Mönchs Johannes Xiphilinos aus dem 11. Jahrhundert.",
    ] },
  { "title" = "Name", "paragraphs" = [
      "In der handschriftlichen Überlieferung von Tacitus’ Annalen finden sich verschiedene Schreibweisen ihres Namens, die in den modernen Ausgaben in aller Regel zu Boudicca vereinheitlicht werden. Cassius Dio, dessen Römische Geschichte die zweite antike Quelle zu Boudicca ist, schreibt ihren Namen Boudouika (Βουδουίκα).",
      "Im Mittelalter entstand eine weitere Variante von Boudiccas Namen, als ein Schreiber beim Kopieren eines Manuskripts vermutlich ‚u‘ durch ‚a‘ ersetzte und das zweite ‚c‘ durch ein ‚e‘. Diese Schreibweise Boadicea wurde vor allem durch die romantischen Dichter während der Zeit Königin Victorias im 19. Jahrhundert populär gemacht. Zu weiteren Schreibweisen in Literatur und historischer Geschichtsschreibung zählen Voadicia (beispielsweise in Polydore Vergils Anglica Historica), Voadicea (beispielsweise in Raphael Holinsheds The Chronicles of England, Scotland and Ireland) und Bonduca (beispielsweise in John Fletchers gleichnamigem Theaterstück von 1609).",
      "Vergleiche mit späteren walisischen Wortformen sowie mit keltischen Inschriften in Frankreich und auf der iberischen Halbinsel legen nahe, dass der Name tatsächlich Boudica (mit einem ‚c‘) und nicht Boudicca war. Boudica geht auf das keltische Wort für Sieg, bouda, zurück, Boudica bedeutet also ‚die Siegreiche‘. In der neueren englischsprachigen Forschung hat sich der ursprüngliche keltische Name Boudica inzwischen wieder durchgesetzt. In der deutschsprachigen Literatur findet man noch die Schreibweise Boudicca, wie etwa in Einführungen in die englische Geschichte oder in Darstellungen über die Kelten.",
    ] },
  { "title" = "Leben", "paragraphs" = [
      "Über Boudiccas Leben vor dem Aufstand gegen die Römer sind nur wenige Details bekannt. Insbesondere wird unter Historikern diskutiert, welchen Status Boudicca hatte, darunter Ehefrau eines Klientelkönigs, regierende Königin oder militärische Anführerin. Die Quellen sind diesbezüglich nicht eindeutig.",
      "In den Annalen wird Boudicca als Ehefrau des Prasutagus, der als Klientelkönig Roms über die Icener herrschte, beschrieben. Wie man aus Münzfunden weiß, siedelten die Icener im Norden des heutigen East Anglia, nördlich des Stammesgebiets der Trinovanten. Tacitus schreibt, dass Prasutagus im Jahr 61 nach einer langen Herrschaft in Wohlstand starb. Archäologische Funde auf dem ehemaligen Gebiet der Icener wie die Snettisham-Horte liefern Hinweise darauf, dass der von Tacitus erwähnte Wohlstand der Icener wohl den Tatsachen entsprach.",
      "Laut Tacitus hinterließ Prasutagus ein Testament, in dem er seine beiden Töchter und den damaligen römischen Kaiser Nero zu gleichen Teilen zu seinen Erben machte. Die Archäologin Miranda Aldhouse Green spekuliert über die Gründe, warum Boudicca als Nachfolgerin in Prasutagus’ Testament nicht erwähnt wird, und vermutet unterschiedliche Einstellungen von Prasutagus und Boudicca gegenüber der römischen Besatzung: Bei Prasutagus scheine eine prorömische Einstellung vorgeherrscht zu haben, während Boudicca möglicherweise bereits eher antirömisch eingestellt gewesen sei.",
    ] },
  { "title" = "Rezeption in der Geschichtsschreibung und Forschungsgeschichte", "paragraphs" = [
      "Boudiccas Darstellung in Tacitus’ Annalen fokussiert stark auf ihre Rolle als Mutter, die sich für das Unrecht, das ihr selbst, ihren Töchtern und ihrem Stamm angetan wurde, rächen will. Ihr Aufstand hatte nach Tacitus gute Gründe, da er durch das Verhalten der römischen Obrigkeit provoziert worden sei. Boudicca steht damit im Kontrast zur keltischen Königin Cartimandua, die von Tacitus als verräterisch und ehebrecherisch dargestellt wird. Boudiccas Handlungen waren nach der Darstellung des Tacitus dagegen zwar irregeleitet, aber moralisch gerechtfertigt. Bei Cassius Dio ist Boudicca keine Sympathiefigur, sondern eine furchterregende und mächtige Kriegerkönigin, die an Beschreibungen der mythischen Amazonen erinnert. Die ausführliche Beschreibung der vernichteten Städte, der Toten und des Chaos, das sie und ihre Truppen hinterließen, diente vor allem dazu, Boudicca und ihre Anhänger als fremdartige und brutale Barbaren darzustellen.",
      "Sowohl Tacitus als auch Cassius Dio binden außerdem fiktive Ansprachen von Boudicca einerseits und dem römischen Feldherrn Suetonius Paulinus andererseits in ihre Schilderung ein, die beide Anführer vor ihren jeweiligen Truppen gehalten haben sollen. Solche Reden waren in der antiken Geschichtsschreibung nicht unüblich. Sie gehen allerdings weder auf tatsächlich gehaltene Ansprachen zurück noch reflektieren sie zwingend die Ansichten des Verfassers zu den Ereignissen. Vielmehr dienten solche Einschübe Autoren wie Tacitus und Dio als rhetorisches Mittel, um bestimmte wichtige Fragestellungen oder Ideen im Zusammenhang mit dem behandelten historischen Geschehen aus unterschiedlichen Perspektiven zu präsentieren. Im Rahmen der literarischen Vorstellung eines Kampfes zwischen dekadenter, korrupter Hochkultur und primitiven, aber moralisch integren „Randvölkern“ repräsentiert Boudicca in ihren angeblichen Reden also eine bestimmte, von den Autoren konzipierte Perspektive: Als Frau in einer traditionellen Männerrolle ist sie prädestiniert dafür, Kritik an der verweichlichten und „unmännlich“ gewordenen römischen Elite zu äußern. Bei Tacitus wird Boudiccas Eintreten für die Freiheit gleichzeitig jedoch auch mit innerrömischem Widerstand gegen die Monarchie parallelisiert. Ihr Kampf gegen die römische Herrschaft erscheint als Vergleichsfall zum innerrömischen Widerstand gegen die Kaiserherrschaft und ist genau wie dieser aus der Sicht des Tacitus angesichts der Machtverhältnisse zum Scheitern verurteilt. Unterschwellig wird Boudicca in seiner Schilderung damit zur Vertreterin des alten römischen Freiheitsideals, während ihre römischen Gegner politisch und gesellschaftlich ihre Freiheit verloren haben.",
      "Boudiccas Aufstand (wenn auch nicht ihr Name) fand nach der Römerzeit noch kurze Erwähnung in De Excidio et Conquestu Britanniae (dt. „Über den Untergang und die Eroberung Britanniens“) des Mönches Gildas aus dem 6. Jahrhundert und im historiographischen Werk Historia ecclesiastica gentis Anglorum (dt. „Kirchengeschichte des englischen Volkes“) von Beda Venerabilis aus dem 8. Jahrhundert. Danach geriet Boudicca in Vergessenheit, weil englische Gelehrte im Mittelalter keinen Zugang zu den Quellen der klassischen Antike hatten.",
    ] },
]

[articles.it]
text = "Boudicca (pronuncia /bouˈdikka/), o Bodicca, o ancora Boadicea (33 – 60/61), è stata una regina della tribù degli Iceni, una popolazione che viveva nell'Inghilterra orientale. Guidò la più grande rivolta anti-romana delle tribù dell'isola."
title = "Boudicca"
lang = "it"
url = "https://it.wikipedia.org/wiki/Boudicca"
intro = [
  "Boudicca (pronuncia /bouˈdikka/), o Bodicca, o ancora Boadicea (33 – 60/61), è stata una regina della tribù degli Iceni, una popolazione che viveva nell'Inghilterra orientale. Guidò la più grande rivolta anti-romana delle tribù dell'isola.",
  "Il suo nome è stato tramandato in diversi modi a causa di corruttele presenti nei manoscritti medioevali delle opere tacitiane: dal XVII agli inizi del XIX secolo si registra, infatti, un'alternanza tra le forme Boadicea e Voadica. Basandosi sull'evoluzione del gallese e dell'irlandese, il linguista Kenneth Jackson ha concluso che il nome originale in brittonico antico dovrebbe essere stato Boudica (AFI: /bɒʊ'diː.ka:/). La parola deriva dalla radice celtica *boudā, che significa \"vittoria\".",
  "Le fonti principali sulla vita della regina e sulla sua rivolta provengono dal De vita et moribus Iulii Agricolae di Tacito e dalla Storia Romana di Cassio Dione.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Secondo Tacito, Boudicca era parte di una famiglia nobile e all'età di circa sette anni sarebbe andata a vivere con una seconda famiglia, presso cui rimase fino ai 14 anni circa. Fu in questo periodo che apprese storia, tradizioni, religione e cultura delle tribù celtiche e imparò l'arte militare.",
      "Nel 43 gli Iceni, abitanti dell'Inghilterra orientale e alleati con Roma, si rivoltarono quando il legato Publio Ostorio Scapula ordinò il disarmo totale della tribù a causa di diverse ribellioni scoppiate sull'isola. Gli Iceni si coalizzarono con altre tribù vicine, tuttavia furono sconfitti e il re Antedio fu deposto e sostituito da un re filo-romano, Prasutago, anche se la tribù mantenne la propria indipendenza.",
      "Attorno al 47 Boudicca tornò a casa e la sua famiglia la diede in moglie a Prasutago stesso, dal quale ebbe due figlie.",
    ] },
  { "title" = "Nella cultura di massa", "paragraphs" = [
      "A Boudicca sono state dedicate diverse statue tra cui le più famose sono: Boadicea e le sue figlie, opera di Thomas Thornycroft situata all'estremità occidentale del ponte di Westminster e un'altra statua, opera di J. Havard Thomas, esposta nel Municipio di Cardiff accanto agli eroi gallesi; quest'ultima rappresenta un unicum nel contesto in cui è collocata in quanto donna e in quanto non gallese (almeno secondo i confini attuali).",
      "Nel Medioevo la figura di Boudicca fu dimenticata, tant'è che non compare in nessuna fonte.",
      "Ricomparve poi nel XVI secolo, dopo la riscoperta delle opere di Tacito e di Cassio Dione Cocceiano da parte di Polidoro Virgili, anche se all'inizio si pensò che la \"Voadicea\" tacitiana e la \"Bunduica\" dionea fossero due donne diverse. A partire dal XVII secolo la sua storia ispirò diversi autori.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Boudicca, su Treccani.it – Enciclopedie on line, Istituto dell'Enciclopedia Italiana.",
    ] },
]

[articles.tr]
text = "Boudica (Boudicca ya da eski adıyla Boadicea olarak da bilinir) (ö. MS 60 ya da 61), MS 61 yılında Romalıların Büyük Britanya'daki işgalci güçlerine karşı bir isyan başlatan, Kuzey Britanya'nın Norfolk bölgesinde yaşayan Iceni kabilesinin kraliçesi."
title = "Boudica"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Boudica"
intro = [
  "Boudica (Boudicca ya da eski adıyla Boadicea olarak da bilinir) (ö. MS 60 ya da 61), MS 61 yılında Romalıların Büyük Britanya'daki işgalci güçlerine karşı bir isyan başlatan, Kuzey Britanya'nın Norfolk bölgesinde yaşayan Iceni kabilesinin kraliçesi.",
  "Boudica'nın kocası ve varlıklı bir ön-Romalı olan Iceni kralı Prasutagus ölünce, İmparatorluğa bağlı müvekkil krallıkların yaptığı gibi krallığını Roma'ya bırakmak yerine kızları ve Roma imparatoruna ortaklaşa olarak miras bıraktı. Roma kanunlarına göre kadınlar varis olamadığından İmparatorluk bu kararı reddetti ve procurator Catus Decianus tüm mülkünü haczettirdi. Krallık fethedilmiş varsayılarak İmparatorluğa katıldı. Prasutagus'un dulu Boudica kırbaçlatıldı, kızlarına tecavüz edildi.",
  "60 ya da 61 yılında Roma eyalet valisi Gaius Suetonius Paulinus'un Gallere doğru bir sefere çıkmasını fırsat bilen Iceni, Trinovanteler ve diğerlerini Boudica liderliğinde ayaklandılar. Vali Suetonius Paulinus ve Lejyonları tarafından kesin olarak yenilgiye uğratılmadan önce, Camulodunum (Colchester), Londinium (Londra) ve Verulamium (St Albans) şehirlerini yıkıp, talan ettiler. (Yıkılıp talan edilen üç şehirde ölenlerin toplamı aşağı yukarı 70.000-80.000 kişi arasındadır.) Britonlar sayıca Romalılardan fazla olduğu halde, Roma lejyonlarının mükemmel disiplin ve taktiği onlara mutlak bir zafer kazandırdı. Roma İmparatoru Nero'nun ortaya çıkan bu kriz karşısında adada bulunan tüm birlikleri geri çekmeyi tasarladığı sırada gelen Suetonius'un bu zaferi, adadaki Roma varlığını sağlamlaştırmıştır.",
  "Bu olayların kayıtları, tarihçiler Tacitus ve Cassius Dio'nun, eserlerinden Rönesans döneminde yeniden öğrenildi ve Victoria devrinde, Kraliçe I. Victoria tarafından adaşı olarak ilan edilmesiyle birlikte Boudica'nın efsanevi ünü ortaya çıktı. Boudica, bu dönemden sonra Birleşik Krallık'ta önemli bir kültürel sembol olarak kalmıştır.",
]
sections = [
  { "title" = "Konuyla ilgili yayınlar", "paragraphs" = [
      "Richard Hingley & Christina Unwin, Boudica: Iron Age Warrior Queen (Boudica: Demir Çağının Savaşçı kraliçesi), 2004",
      "Manfred Böckl: Die letzte Königin der Kelten. (Keltlerin son Kraliçesi). (Boudica'nın hayatının anlatan Almanca kitap). (Yasal hakları: Aufbau Verlag, Berlin, Almanya, 2005.)",
    ] },
  { "title" = "Dış bağlantılar", "paragraphs" = [
      "Roman-Britain.co.uk 29 Ocak 2022 tarihinde Wayback Machine sitesinde arşivlendi. adlı sitede Iceni hakkında bilgi 19 Ocak 2022 tarihinde Wayback Machine sitesinde arşivlendi. (İngilizce), 2008-02-08 tarihinde erişildi.",
      "PBS Boudica / Savaşçı Kraliçenin web sitesi 14 Aralık 2007 tarihinde Wayback Machine sitesinde arşivlendi., (İngilizce), 2008-02-08 tarihinde erişildi.",
    ] },
]

[articles.zh]
text = "布狄卡（Boudica 或 Boudicca ，发音为 /ˈbuːdɪkə, boʊˈdɪkə/ ，源自布立吞语 *boudi‘胜利，获胜’ + *-kā‘具有’后缀，即‘胜利女神’之意 ），在拉丁编年史中被称为博阿迪西亚（Boadicea ）或布狄卡（Boudicea ），在威尔士语中称为巴德杜格（Buddug ，发音为 [ˈbɨðɨɡ] ），是古代不列颠爱西尼部落的王后。公元60年或61年，她领导了一场反抗罗马帝国征服力量但最终失败的起义。她被视为不列颠民族女英雄，也是为正义与独立而斗争的象征。 布狄卡的丈夫普拉苏塔古斯（Prasutagus ）与她育有两个女儿，作为名义上独立的罗马盟友统治国家。他在遗嘱中把王国共同留给女儿们和罗马皇帝。他去世后，遗嘱遭无视，王国被吞并，财产被没收。据罗马历史学家塔西佗（Tacitus ）记载，布狄卡被鞭打，她的女儿们被强奸 。历史学家卡西乌斯·狄奥（Cassius Dio ）写道，先前罗马帝国捐赠给有影响力的不列颠人的财物被没收，罗马金融家兼哲学家塞内卡（Seneca ）也收回了他强迫不情愿的不列颠人接受的贷款 。 公元60年至61年，布狄卡（Boudica）率领爱西尼部落（Iceni）及其他不列颠部落发动起义。他们摧毁了卡姆罗杜努姆（Camulodunum，即现代的科尔切斯特），这里曾是特里诺文特人（Trinovantes）的首府，当时则是为退役罗马士兵设立的殖民地。罗马总督盖乌斯·苏埃托尼乌斯·保利努斯（Gaius Suetonius Paulinus）听闻起义后，从莫纳岛（Mona，即现代的安格尔西岛）匆忙赶往伦蒂尼恩（Londinium，也就是伦敦）。这座已有20年历史的商业定居点是起义军的下一个目标，因无力防守，他选择放弃。布狄卡的军队击败了西班牙第九军团（Legio IX Hispana ）的一支分遣队，还焚毁了卡姆罗杜努姆和维鲁拉米恩（Verulamium ）。据估计，布狄卡的追随者总共杀死了约7万到8万名罗马人和不列颠人。与此同时，苏埃托尼乌斯可能在西米德兰兹郡重新集结部队，尽管兵力悬殊，他仍决定性地击败了不列颠人。不久后，布狄卡自杀或因病离世。公元60年至61年的这场危机，曾让尼禄（Nero ）考虑从不列颠撤回所有帝国军队，但苏埃托尼乌斯战胜布狄卡一事，巩固了罗马对该省的控制。 到了英国文艺复兴时期，人们对这些事件的兴趣重燃，这使得布狄卡在维多利亚时代声名远扬，并成为不列颠的一个文化象征。"
title = "布狄卡"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%B8%83%E7%8B%84%E5%8D%A1"
intro = [
  "布狄卡（Boudica 或 Boudicca ，发音为 /ˈbuːdɪkə, boʊˈdɪkə/ ，源自布立吞语 *boudi‘胜利，获胜’ + *-kā‘具有’后缀，即‘胜利女神’之意 ），在拉丁编年史中被称为博阿迪西亚（Boadicea ）或布狄卡（Boudicea ），在威尔士语中称为巴德杜格（Buddug ，发音为 [ˈbɨðɨɡ] ），是古代不列颠爱西尼部落的王后。公元60年或61年，她领导了一场反抗罗马帝国征服力量但最终失败的起义。她被视为不列颠民族女英雄，也是为正义与独立而斗争的象征。",
  "布狄卡的丈夫普拉苏塔古斯（Prasutagus ）与她育有两个女儿，作为名义上独立的罗马盟友统治国家。他在遗嘱中把王国共同留给女儿们和罗马皇帝。他去世后，遗嘱遭无视，王国被吞并，财产被没收。据罗马历史学家塔西佗（Tacitus ）记载，布狄卡被鞭打，她的女儿们被强奸 。历史学家卡西乌斯·狄奥（Cassius Dio ）写道，先前罗马帝国捐赠给有影响力的不列颠人的财物被没收，罗马金融家兼哲学家塞内卡（Seneca ）也收回了他强迫不情愿的不列颠人接受的贷款 。",
  "公元60年至61年，布狄卡（Boudica）率领爱西尼部落（Iceni）及其他不列颠部落发动起义。他们摧毁了卡姆罗杜努姆（Camulodunum，即现代的科尔切斯特），这里曾是特里诺文特人（Trinovantes）的首府，当时则是为退役罗马士兵设立的殖民地。罗马总督盖乌斯·苏埃托尼乌斯·保利努斯（Gaius Suetonius Paulinus）听闻起义后，从莫纳岛（Mona，即现代的安格尔西岛）匆忙赶往伦蒂尼恩（Londinium，也就是伦敦）。这座已有20年历史的商业定居点是起义军的下一个目标，因无力防守，他选择放弃。布狄卡的军队击败了西班牙第九军团（Legio IX Hispana ）的一支分遣队，还焚毁了卡姆罗杜努姆和维鲁拉米恩（Verulamium ）。据估计，布狄卡的追随者总共杀死了约7万到8万名罗马人和不列颠人。与此同时，苏埃托尼乌斯可能在西米德兰兹郡重新集结部队，尽管兵力悬殊，他仍决定性地击败了不列颠人。不久后，布狄卡自杀或因病离世。公元60年至61年的这场危机，曾让尼禄（Nero ）考虑从不列颠撤回所有帝国军队，但苏埃托尼乌斯战胜布狄卡一事，巩固了罗马对该省的控制。",
]
sections = [
  { "title" = "历史来源", "paragraphs" = [
      "对罗马帝国发起的布狄卡起义，在古典古代三位罗马历史学家的四部作品中被提及：塔西佗（Tacitus ）所著《阿古利可拉传》（Agricola ，约公元98年 ）和《编年史》（Annals ，约公元110年 ）；苏埃托尼乌斯（Suetonius ）在《十二凯撒传》（Lives of the Caesars ，公元121年 ）中对起义的提及；以及卡西乌斯·狄奥（Cassius Dio ）所著帝国史（约公元202年 - 235年 ）中篇幅最长、对起义的详细描述 。",
      "塔西佗（Tacitus）在起义发生数年后才进行记述，但他的岳父格奈乌斯·尤利乌斯·阿古利可拉（Gnaeus Julius Agricola）是这些事件的目击者，因为阿格里科拉在此期间曾在保利努斯（Suetonius Paulinus）麾下于不列颠担任军事保民官 。",
      "卡西乌斯·狄奥（Cassius Dio）在布狄卡去世约140年后，开始撰写罗马及其帝国的历史。他的著作大多散失，关于布狄卡的记载仅存于11世纪拜占庭僧侣约翰·西菲利努斯（John Xiphilinus）所作的节录中。与塔西佗相比，他提供了更丰富、更耸人听闻的细节，但总体而言，这些细节往往是虚构的 。",
    ] },
  { "title" = "背景", "paragraphs" = [
      "布狄卡是爱西尼部落（lceni）国王普拉苏塔古斯（Prasutagus）的王后。爱西尼部落居住在如今的英格兰诺福克郡（Norfolk），以及邻近的剑桥郡（Cambridgeshire）萨福克郡（Suffolk）和林肯郡（Linconlnshire）的部分地区。爱西尼人铸造了一些已知最早的不列颠硬币。公元47年，罗马总督普布利乌斯·斯卡普拉（Publius Ostorius Scapula)计划解除罗马控制下不列颠所有民族的武装，当时爱西尼人曾发动起义反抗罗马人。起义被镇压后，罗马人允许该国王保留其独立性。",
    ] },
  { "title" = "导致起义的事件", "paragraphs" = [
      "公元60年至61年普拉苏塔古斯（Prasutagus）去世时，他指定自己的两个女儿和罗马皇帝尼禄（Nero）为继承人 。罗马人无视这份遗嘱，将王国并入不列颠尼亚省。负责不列颠事务的财务官卡图斯·德奇阿努斯（Catus Decianus）被派去为罗马夺取爱西尼王国 。",
      "罗马人接下来的行动由塔西佗（Tacitus）记述，其中包括对乡村的大肆掠夺、洗劫王室宅邸，以及对布狄卡（Boudica）和她女儿们的残暴对待 。据塔西佗记载，布狄卡被鞭打，她的女儿们遭强奸 。卡西乌斯·狄奥的记述中未提及这些暴行，而是列举了起义的三个不同起因：塞内卡（Seneca）收回借给不列颠人的贷款；德奇阿努斯·卡图斯（Decianus Catus）没收先前皇帝克劳狄乌斯（Claudius）借给不列颠人的钱财；以及布狄卡本人的恳求 。爱西尼人认为，这些贷款已通过礼品交换的方式偿还 。",
      "卡西乌斯·狄奥让布狄卡向她的子民和盟友发表演说，提醒他们在罗马占领前生活要好得多，强调在奴隶制下无法享受财富，并将未能像尤利乌斯·凯撒（Julius Caesar）入侵时那样驱逐罗马人归咎于自己 。在迪奥看来，那些被视为蛮族的人愿意放弃在罗马统治下更高质量的生活，以换取自由和人身自由，这是起义动机的重要组成部分 。",
    ] },
  { "title" = "起义", "paragraphs" = [
      "起义者的第一个目标是卡姆罗杜努姆（即现代的科尔切斯特），这里是罗马为退役士兵设立的殖民地 。 当地耗费巨资为克劳狄乌斯皇帝修建了一座罗马神庙。再加上退伍老兵对不列颠人的残暴对待，这引发了人们对罗马人的怨恨 。",
      "爱西尼人和特里诺凡特人组成了一支12万人的军队 。卡西乌斯·狄奥称，布狄卡祈求不列颠胜利女神安德拉斯特（Andraste）庇佑她的军队 。起义爆发后，唯一能提供援助的罗马军队是伦敦城内为数不多的辅助军，但他们装备不足，无法与布狄卡的军队抗衡。卡姆罗杜努姆被起义者攻陷 ，在最初攻击中幸存的居民躲进克劳狄乌斯神庙，两天后惨遭杀害 。昆图斯·佩蒂利乌斯·塞里亚利斯（Quintus Petillius Cerialis）当时指挥着西班牙第九军团（Legio IX Hispana ），试图援救卡姆罗杜努姆，却遭遇惨败。他的步兵全部阵亡，仅有部分骑兵逃脱。这场灾难发生后，引发起义的罪魁祸首卡图斯·德奇阿努斯（Catus Decianus）逃往高卢。",
      "苏埃托尼乌斯（Suetonius）当时正在北威尔士海岸外的莫纳岛（Mona ）发动战役。听闻爱西尼人起义的消息后，他在莫纳岛留下一支驻军，随后返回应对布狄卡 。他率部队迅速穿越敌境，赶在布狄卡的军队抵达前到达伦迪尼姆 ，但因兵力悬殊，他决定放弃这座城镇。起义者占领城镇后，对留下的所有人施以酷刑并杀害，之后将城镇焚毁。起义者还洗劫了位于伦敦西北方的维鲁拉米恩（即现代的圣奥尔本斯 ），不过其遭破坏的程度尚不明确 。",
    ] },
  { "title" = "名字", "paragraphs" = [
      "“布狄卡（Boudica）”可能是一个尊称 ，这样的话，她一生中大部分时间所用的本名就不得而知了 。英国语言学家兼翻译家肯尼斯·杰克逊（Kenneth Jackson）推断，“布狄卡（Boudica）”这一名字——基于威尔士语（Buddug）和爱尔兰语（Buaidheach）后来的演变——源自原始凯尔特语阴性形容词 *boudikā（“胜利的” ），而该形容词又源于凯尔特语单词 *boudā（“胜利” ），且在古不列颠语（古布立吞语 ）中，该名字的正确拼写是 Boudica，发音为 [boʊˈdiːkaː]。历史上正确拼写 “Boudica” 的变体有 Boudicca、Bonduca、Boadicea 和 Buduica 。在铭文里，其高卢语形式被证实为 Boudiga，如在波尔多（Bordeaux）、卢西塔尼亚（Lusitania）的 Boudica 以及阿尔及利亚（Algeria）的 Bodicca 。",
      "卡西乌斯·狄奥曾错误拼写布狄卡的名字，写成 Buduica 。塔西佗（Tacitus）也拼写错误，多加了一个 “c” 。中世纪的一名抄写员抄录了这个错误拼写后，更多变体开始出现。第二个 “c” 变成 “e” ，“u” 的位置出现 “a” ，由此产生了该名字的中世纪（也是最常见的 ）版本 “Boadicea” 。17世纪左右 “Boadicea” 首次出现时，其正确拼写完全被掩盖了 。威廉·古柏（William Cowper）在他1782年的诗歌《布狄卡，一首颂歌》（Boadicea, an Ode ）中使用了这个拼写，该诗歌重新演绎了布狄卡的故事，以契合不列颠不断上升的领土与政治野心 。",
    ] },
]

[articles.ar]
text = "بوديكا Boudicca أو بواديكيا Boadicea وعرفت في الويلزية باسم بودوغ Buddug كانت ملكة على قبيلة إيكيني الكلتية البريطانية وقادت انتفاضة ضد قوات الإمبراطورية الرومانية في عام 60 أو 61 ميلادي، وتوفيت بعد فترة قصيرة من فشل ثورتها. وهي تعتبر بطلة شعبية في بريطانيا."
title = "بوديكا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A8%D9%88%D8%AF%D9%8A%D9%83%D8%A7"
intro = [
  "بوديكا Boudicca أو بواديكيا Boadicea وعرفت في الويلزية باسم بودوغ Buddug كانت ملكة على قبيلة إيكيني الكلتية البريطانية وقادت انتفاضة ضد قوات الإمبراطورية الرومانية في عام 60 أو 61 ميلادي، وتوفيت بعد فترة قصيرة من فشل ثورتها. وهي تعتبر بطلة شعبية في بريطانيا.",
  "كان زوج بوديكا يدعى براسوتاغوس، وحكم كحليف مستقل اسميا عن روما وترك حكم مملكته في وصيته بالاشتراك بين بناته والإمبراطور الروماني. إلا أن الإمبراطور تجاهل وصيته وضم المملكة. وذكر تاكيتوس في حولياته أنه تم جلد بوديكا واغتصبت بناتها. يقدم كاسيوس ديو تفسيرا بديلا لرد بوديكا، قائلا أنه تم مصادرة التبرعات الإمبراطورية السابقة للبريطانيين النافذين، وطالب الممول والفيلسوف الروماني سينيكا الأصغر بالقروض التي فرضها على البريطانيين المترددين.",
  "في عام 60 أو 61 ميلادي، كان الحاكم الروماني غايوس سوتونيوس باولينوس يخيم على جزيرة أنغلزي قبالة الساحل الشمالي الغربي لويلز، وقاد بوديكا قبائل إيكيني، ترينوفانتيس وقبائل أخرى في الثورة. ودمروا مدينة كامولودونوم (كولشستر الحديثة)، والتي كانت وقتها مستوطنة للجنود الرومان وموقع معبد للإمبراطور السابق كلوديوس. أسرع سوتونيوس إلى لندينيوم (لندن الحديثة)، وهي مستوطنة تجارية وكانت الهدف التالي للمتمردين. بعد أن رأى الرومان أنهم يفتقرون إلى العدد الكافي للدفاع عن المستوطنة، تم إجلاء المستوطنة وهجرها. قادت بوديكا 100,000 بريطاني لمحاربة الفيلق التاسع الإسباني، وأحرقت ودمرت مدن لوندينيوم وفيرولاميوم (سانت ألبانز الحديثة).",
  "قدر أن سبعين أو ثمانين ألفا من الرومان والبريطانيين قتلوا في المدن الثلاث على يد جيوش بوديكا. وفي الوقت نفسه، أعاد سويتونيوس جمع قواته في منطقة ميدلاند الغربية، وهزم البريطانيين في معركة واتلينغ ستريت رغم أنه عدد جنوده كان أقل بكثير من خصومه. جعلت هذه الازمة نيرون يفكر بسحب جميع القوات الرومانية من بريطانيا، على أن انتصار سوتونيوس في النهاية على بوديكا أكد سيطرة روما على المقاطعة. تختلف المصادر الموجودة بين تاكيتوس وكاسيوس ديو على مصير بوديكا، حيث إما أنها قتلت نفسها لتتجنب القبض عليها أو أنها ماتت بسبب المرض.",
]
sections = [
  { "title" = "نبذة تاريخية", "paragraphs" = [
      "أولى تاسيتس اهتمامًا خاصًا لبريطانيا حيث خدم والد زوجته نيياس جولياس أغريقولا ثلاث فترات حكم (وكان موضوع كتابه الأول). كان أغريقولا أطربونًا عسكريًا (قاضي عسكري) في عهد سوتونيوس بولينوس، والذي من شبه المؤكد أنه قدم لتاسيتس مصدر شهود عيان لثورة بوديكا. تُعرف رواية كاسيوس ديو فقط من خلال إحدى الخلاصات (بالإنجليزية: epitome) وتُعتبر مصادره غير مؤكدة. من المتفق عليه عمومًا أن روايته تستند إلى رواية تاسيتس، لكنه يبسّط تسلسل الأحداث ويضيف تفاصيل، مثل المطالبة بالقروض، التي لم يذكرها تاسيتس.",
      "من المتفق عليه أن بوديكا تنحدر من أصل ملكي. يصفها كاسيوس ديو بأنها طويلة القامة مع شعرها الأسمر المصفر المتدلي حتى أسفل خصرها وذات صوت أجش ونظرة ثاقبة. يذكر أنها كانت ترتدي عادةً قلادة ذهبية كبيرة (ربما تورك) وسترة ملونة وعباءة سميكة مثبتة بواسطة مشبك بروش.",
      "كان زوج بوديكا، براسوتاغوس، ملك قبيلة إيسيني التي سكن شعبها فيما يُعرف الآن بمقاطعة نورفك. أثناء غزو كلوديوس لجنوب بريطانيا عام 43 ميلادي، تحالف الإيسينيون في البداية مع روما. كانوا فخورين باستقلالهم وثاروا عام 47 ميلادي عندما خطط الحاكم الروماني آنذاك بوبليوس أوستوريوس سكابولا لنزع السلاح من أيدي جميع الشعوب في منطقة بريطانيا الخاضعة للسيطرة الرومانية بعد عدد من الثورات المحلية. هزمهم أوستوريوس واستمر بإخماد الثورات الأخرى في جميع أنحاء بريطانيا. حافظ الإيسينيون على استقلالهم تحت زعامة براسوتاغوس. من غير المعروف فيما إذا كان قد أصبح ملكًا فقط بعد هزيمة أوستوريوس للإيسينيين؛ إذ لم يؤرخ تاسيتس بداية عهد براسوتاغوس وقد ذكره لأول مرة كملك طويل العهد متوفى عندما كتب عن ثورة بوديكا.",
    ] },
]

[articles.ru]
text = "Бо́удикка (Бо́удика, Бу́дика, кельт. Boudic(c)a, неточная римская передача Боадицея, лат."
title = "Боудикка"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%91%D0%BE%D1%83%D0%B4%D0%B8%D0%BA%D0%BA%D0%B0"
intro = [
  "Бо́удикка (Бо́удика, Бу́дика, кельт. Boudic(c)a, неточная римская передача Боадицея, лат. Boadicea) — жена Прасутага, тигерна зависимого от Рима бриттского племени иценов.",
  "После смерти мужа римские войска заняли её земли, а император Нерон лишил её титула, царство было аннексировано, земли конфискованы, а имущество описано. Имущество благородных жителей приравнено было к имуществу рабов. Согласно Тациту, Боудикку прилюдно выпороли, а её дочерей изнасиловали, что побудило её возглавить антиримское восстание 61 года.",
]
sections = [
  { "title" = "История", "paragraphs" = [
      "Муж Боудикки Прасутаг был тигерном иценов, населявших земли в районе современного Норфолка на востоке современной Англии. Эти земли фактически не были подконтрольны Риму, поскольку во время завоевания Британии императором Клавдием в 43 году ицены вместе с десятью другими племенами (Прасутаг, вероятно, тогда уже был тигерном) присоединились к его войскам в качестве союзников. В 47 году, во время попытки Публия Остория Скапулы разоружить их, они смогли отстоять своё право на независимость. Прокуратор поручил Прасутагу как царю-клиенту охрану близлежащих морских и речных путей, особенно устьев рек. Прасутаг был старше жены и прожил долгую жизнь. Чтобы сохранить свой род, он наравне с двумя дочерьми сделал сонаследником престола римского императора.",
      "Оставлять независимость союзным царствам было нормальной римской практикой, при условии, что царство завещалось после смерти ныне здравствующего союзного царя римскому императору. Таким образом, например, были присоединены к империи провинции Вифиния и Галатия. Также римские законы позволяли наследование только по мужской линии. Поэтому все попытки Прасутага сохранить на престоле свой род были тщетными. После его смерти царство было аннексировано, земли конфискованы, а имущество описано. Имущество благородных жителей и рабов теперь было одинаково. Согласно Тациту, Боудикку прилюдно выпороли, а её дочерей изнасиловали. Также была изъята в счёт погашения долга казна Прасутага, который был должен очень много денег Сенеке.",
      "В 61 году, когда наместник Гай Светоний Паулин возглавил кампанию на острове Англси (римское название — Мона), который был убежищем для бриттских бунтовщиков и цитаделью друидов, ицены, поддерживаемые многими своими соседями, в том числе и триновантами, подняли восстание (бунт). Их вдохновил пример Арминия, вождя германского племени херусков, в 9 году поднявшего восстание против римлян и изгнавшего их из своих земель. Дион Кассий пишет, что перед началом восстания Боудикка гадала с помощью зайца, отпускаемого от пол платья (это указывает на то, что Боудикка была ещё и жрицей) и принесла жертвы Андрасте — богине победы, которой была посвящена.",
    ] },
  { "title" = "Этимология имени", "paragraphs" = [
      "До последнего десятилетия XX века имя этой царицы чаще всего произносили как «Боадицея». Это связано с тем, что под ним она фигурирует у Тацита (Boadicea, Boudicea). У Диона Кассия приведена греческая форма имени — Βουδουικα, Βουνδουικα или Βοδουικα.",
      "Скорее всего, имя её происходит от кельтского слова bouda — победа. Слово boudīko значило у кельтов «победоносный». Похожие имена существовали в Лузитании — написание Boudica, в Бордо — Boudiga. У галлов была богиня Boudiga, которая видимо была богиней победы, военной удачи. В настоящее время считается правильным произношение этого имени как Боудикка (по правилам валлийского и ирландского языков).",
    ] },
  { "title" = "Почитание", "paragraphs" = [
      "Фигура Боудикки была окружена своеобразным романтическим культом при английских королевах Елизавете и Виктории — не в последнюю очередь потому, что её имя значит «победа» (как и имя Виктория). В викторианский период появляются многочисленные скульптурные изображения свободолюбивой предводительницы иценов.",
      "Парадокс состоит в том, что образ «туземной» воительницы, которая принесла себя в жертву борьбе с величайшей империей своего времени, был переосмыслен как символ Британской империи — крупнейшей империи в истории человечества.",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Речкин А. В. Королева железного века против Рима. — М.: Вече, 2021. — 288 p. — (Всемирная история). — ISBN 978-5-4484-2676-6.",
      "Fields, Nic. Boudicca’s Rebellion AD 60–61: The Britons rise up against Rome. — Osprey Publishing, 2011. — 96 p. — ISBN 9781849083133.",
    ] },
]

[articles.vi]
text = "Boudica hoặc Boudicca (UK: , US: ), hoặc Boadicea (, also US: ) hoặc Boudicea hoặc Buddug (IPA: [ˈbɨðɨɡ]), là nữ hoàng cai trị người Briton Iceni thuộc người Celt đã lãnh đạo một cuộc nổi dậy chống lại lực lượng chiếm đóng của đế chế La Mã."
title = "Boudica"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Boudica"
intro = [
  "Boudica hoặc Boudicca (UK: , US: ), hoặc Boadicea (, also US: ) hoặc Boudicea hoặc Buddug (IPA: [ˈbɨðɨɡ]), là nữ hoàng cai trị người Briton Iceni thuộc người Celt đã lãnh đạo một cuộc nổi dậy chống lại lực lượng chiếm đóng của đế chế La Mã.",
]
sections = [
  { "title" = "Lịch sử", "paragraphs" = [
      "Nữ hoàng Boudica sinh năm 30 ở vùng Đông Nam nước Anh. Khoảng năm 48, bà kết hôn với Prasutagus, người đứng đầu bộ lạc Iceni ở vùng này. Họ sống ở Norfolk và lúc này, bộ lạc Iceni chỉ có được một nền bán độc lập bởi sự chiếm đóng của những người La Mã. Prasutagus mặc dù được trao quyền tự do với vị trí là vua của người Iceni nhưng lại phải nằm dưới sự cai trị của Rome. Mặc dù chỉ được hưởng một ít thuận lợi đến từ những điều luật của người La Mã nhưng người dân Iceni phải chịu đựng nhiều sự phẫn uất cũng như thân phận nô lệ và thuế cao.",
      "Sau cái chết của Prasutagus, theo pháp luật La Mã quy định, phần lớn tài sản của ông ta sẽ được chuyển cho hoàng đế La Mã. Tuy nhiên, những chỉ huy của các bộ lạc La Mã ở địa phương đã xem đây là một lý do để tịch thu tất cả tài sản của Prasutagus và các thành viên khác đứng đầu bộ tộc Iceni. Trong suốt cuộc đời mình, Prasutagus đã phải liên tục trả nhiều món nợ cho chúng và đến khi vợ ông - Boudica không tiếp tục duy trì việc này thì bà đã bị bọn chúng lột hết áo quần và mang ra đánh đập trước công chúng.",
      "Tacitus - nhà sử học La Mã - viết rằng, những người lính La Mã còn cưỡng bức các con gái của bà. Rồi các bộ tộc khác như Trinobantes cũng bị đối xử tương tự, dẫnh đến những cuộc nổi loạn ngày càng tăng của người Anh bản địa.",
    ] },
  { "title" = "Tham khảo", "paragraphs" = [
      "Aldhouse-Green, M. (2006). Boudica Britannia: Rebel, War-Leader and Queen. Pearson Longman.",
      "de la Bédoyère, Guy (2003). \"Bleeding from the Roman Rods: Boudica\". Defying Rome: The Rebels of Roman Britain. Tempus: Stroud.",
      "Böckl, Manfred (2005). Die letzte Königin der Kelten [The last Queen of the Celts] (bằng tiếng Đức). Berlin: Aufbau Verlag.",
    ] },
]

[articles.id]
text = "Boudica (; ejaan alternatif: Boudicca), juga dikenal dengan nama Boadicea , atau dalam bahasa Wales disebut Buddug [ˈbɨ̞ðɨ̞ɡ], (kematian tahun 60 atau 61) adalah ratu suku Iceni yang melancarkan pemberontakan melawan tentara Romawi. Suami Boudica yang bernama Prasutagus merupakan penguasa suku Iceni."
title = "Boudica"
lang = "id"
url = "https://id.wikipedia.org/wiki/Boudica"
intro = [
  "Boudica (; ejaan alternatif: Boudicca), juga dikenal dengan nama Boadicea , atau dalam bahasa Wales disebut Buddug [ˈbɨ̞ðɨ̞ɡ], (kematian tahun 60 atau 61) adalah ratu suku Iceni yang melancarkan pemberontakan melawan tentara Romawi.",
  "Suami Boudica yang bernama Prasutagus merupakan penguasa suku Iceni. Ia berkuasa sebagai sekutu Roma yang merdeka dan dalam wasiatnya ingin agar kerajaannya diperintah bersama oleh putri-putrinya dan kaisar Romawi. Namun, setelah ia meninggal, wasiatnya diabaikan dan kerajaannya dicaplok Romawi seolah telah ditaklukkan. Boudica dicambuk, putri-putrinya diperkosa, dan pemodal Romawi menagih utang mereka.",
  "Pada tahun 60 atau 61, saat gubernur Romawi Gaius Suetonius Paulinus sedang memimpin kampanye militer di pulau Anglesey, Boudica memimpin Iceni, Trinovantes, dan suku-suku lainnya dalam sebuah pemberontakan besar. Mereka berhasil menghancurkan Camulodunum (kini Colchester). Camulodunum awalnya merupakan ibu kota Trinovantes, tetapi saat itu merupakan colonia (permukiman untuk tentara Romawi yang telah dibebastugaskan) serta tempat berdirinya kuil untuk mantan Kaisar Romawi Claudius. Setelah mendengar kabar pemberontakan, Suetonius bergegas menuju Londinium (kini London), permukiman komersial berusia dua puluh tahun yang menjadi target pemberontak yang selanjutnya.",
  "Bangsa Romawi sadar bahwa mereka tidak punya cukup pasukan, sehingga mereka meninggalkan Londinium. Boudica memimpin 100.000 pasukan Iceni, Trinovantes, dan lainnya dalam pertempuran melawan Legio IX Hispana dan berhasil membakar dan menghancurkan Londinium dan Verulamium (kini St Albans). Diperkirakan 70.000–80.000 orang Romawi dan Britania di ketiga kota tersebut tewas dibunuh oleh pasukan Boudica. Sementara itu, Suetonius menyusun kembali pasukannya di West Midlands, dan meskipun kalah jumlah mereka berhasil mengalahkan Boudica dalam Pertempuran Watling Street.",
]
sections = [
  { "title" = "Pranala luar", "paragraphs" = [
      "Warrior queens and blind critics - article on the 2004 film King Arthur which discusses Boudica",
    ] },
]

[articles.tl]
text = "Si Boudica, na binabaybay din bilang Boudicca, at nakikilala ng mga Romano bilang Boudicea at Boadicea (ipinanganak noong humigit-kumulang sa 25 AD - namatay noong 60 AD o 61 AD) ay ang reyna ng mga Keltikong mga taong Iceni na nasa Norfolk, sa Silangang Anglia (silangang bahagi ng Britanya; ang \"Anglia\" ay ang pangalang Latin para sa \"Inglatera\"). Asawa si Boudica ni Prasutagus, na isa sa mga haring Britaniko na nagtangkang makiisa sa mga Romano nang sakupin ng mga ito ang Britanya."
title = "Boudica"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Boudica"
intro = [
  "Si Boudica, na binabaybay din bilang Boudicca, at nakikilala ng mga Romano bilang Boudicea at Boadicea (ipinanganak noong humigit-kumulang sa 25 AD - namatay noong 60 AD o 61 AD) ay ang reyna ng mga Keltikong mga taong Iceni na nasa Norfolk, sa Silangang Anglia (silangang bahagi ng Britanya; ang \"Anglia\" ay ang pangalang Latin para sa \"Inglatera\"). Asawa si Boudica ni Prasutagus, na isa sa mga haring Britaniko na nagtangkang makiisa sa mga Romano nang sakupin ng mga ito ang Britanya. Nang mamatay si Prasutagus, binalewala ng mga Romano ang kaniyang kagustuhan, na pinananatiling ang kaharian ni Prasutagus ay nasa ilalim ng kapangyarihan ng emperador ng Roma. Ninakaw ng mga Romano ang mga lupain ni Boudica. Nang angkinin ni Boudica ang tronong iniwan ni Prasutagus, pinalatigo siya ni Catus Decianus sa kaniyang mga sundalo. Inabuso rin ng mga sundalong ito ang mga anak na babae ni Boudica. Naging tanyag si Boudica, na inilarawan bilang isang babaeng mataas at mapula ang buhok, dahil sa kaniyang pamumuno sa kaniyang tribong Iceni sa panghihimagsik laban sa Imperyong Romano na tumataban sa pulo ng Britanya noong kaniyang kapanahunan. Una niyang sinalakay ang Camulodunum (na nakikilala sa kasalukuyan bilang Colchester), na nasundan ng paglusob sa Verulamium (St. Albans), at tinupok nila ang Londinium (ang kasalukuyang London). Nakapaslang ang pangkat na Iceniano ni Boudica ng 70,000 mga Romano at mga kaanib nito. Itinuturing na may pagkamatagumpay si Boudica sa pagpupunyaging ito. Nang malaman ito ng mga Romano, nagtipon ang mga Romano ng mas malaking hukbong panlupa at nagkaroon ng isang labanan. Nagapi ng hukbong Romano ang panghihimagsik. Dahil nahiwatigan ni Boudica na matatalo siya ng mga Romano, nagpatiwakal siya sa pamamagitan ng paglason sa sarili, sa halip na maging…",
]
sections = [
  { "title" = "Mga sanggunian", "paragraphs" = [
      "Ang lathalaing ito na tungkol sa Talambuhay at United Kingdom ay isang usbong. Makatutulong ka sa Wikipedia sa pagpapalawig nito.",
    ] },
]

[articles.pt]
text = "Boadiceia (FO 1943: Boadicéia) (também Boudica, Boudicca, Boadicea, Buduica e Bonduca) foi uma rainha celta que liderou os icenos, juntamente com outras tribos, como os trinovantes, em um levante contra as forças romanas que ocupavam a Grã-Bretanha em 60 ou 61 durante o reinado do imperador Nero. Estes eventos foram relatados por dois historiadores, Tácito (em seus Anais e Agrícola) e Dião Cássio (em sua História romana)."
title = "Boadiceia"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Boadiceia"
intro = [
  "Boadiceia (FO 1943: Boadicéia) (também Boudica, Boudicca, Boadicea, Buduica e Bonduca) foi uma rainha celta que liderou os icenos, juntamente com outras tribos, como os trinovantes, em um levante contra as forças romanas que ocupavam a Grã-Bretanha em 60 ou 61 durante o reinado do imperador Nero. Estes eventos foram relatados por dois historiadores, Tácito (em seus Anais e Agrícola) e Dião Cássio (em sua História romana).",
]
sections = [
  { "title" = "Registros históricos", "paragraphs" = [
      "\"Boadiceia era alta, terrível de olhar e abençoada com uma voz poderosa. Uma cascata de cabelos vermelhos alcançava seus joelhos; usava um colar dourado composto de ornamentos, uma veste multicolorida e sobre esta um casaco grosso preso por um broche. Carregava uma lança comprida para assustar todos os que lhe deitassem os olhos.\"",
      "Cássio relata ainda que ela cometeu todo o tipo de atrocidade em nome de uma deusa chamada Andraste, que seria a equivalente britânico de Vitória, deusa romana. O próprio nome de Boadiceia (do britônico *boudi 'vitória, vencer' + o sufixo adjetivo *-kā), significa \"mulher vitoriosa\".",
    ] },
  { "title" = "História", "paragraphs" = [
      "Boadiceia era casada com Prasutagos, o rei dos icenos, que havia feito um trato com os romanos tornando-se aliado do Império Romano. Com a sua morte, Boadiceia assumiu a liderança de seu povo. Contudo, os romanos ignoraram o testamento e o procurador Cato Deciano apropriou-se de toda a herança do rei falecido. Quando os icenos protestaram contra tal abuso, na pessoa da sua rainha viúva Boadiceia, Cato Deciano ordenou às suas tropas sufocar o protesto, e estas ultrapassaram-se no emprego da força, açoitando a rainha e estuprando suas filhas.",
      "Ela ficou revoltada com o tratamento dado pelos romanos e começou uma revolta, unindo os povos próximos da sua cidade para lutar pela libertação do jugo romano. Eles chegaram a tomar e massacrar algumas cidades que estavam sob controle do Império Romano.",
      "Depois de algumas perdas, o exército romano se reorganizou e atraiu os rebeldes liderados por Boadiceia, em maior número, para um terreno adequado às táticas militares romanas, comandados pelo governador da Britânia, Caio Suetônio Paulino e conseguiu derrotá-los. Esta revolta foi uma das mais violentas contra o Império Romano.",
    ] },
  { "title" = "Boadiceia na Inglaterra vitoriana", "paragraphs" = [
      "A fama de Boadiceia tomou proporções lendárias na Grã-Bretanha, e a rainha Vitória foi vista como sua equivalente em termos de grandeza.",
      "A grande estátua de bronze de Boadiceia, ao lado da ponte de Westminster e do Palácio de Westminster foi inaugurada pelo príncipe Alberto e executada por Thomas Thornycroft. Representa Boadiceia em sua carruagem de guerra junto com suas filhas.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "COLLINGRIDGE, Vanessa. Boudica: the life of Britain's legendary warrior queen, 2006, 390 páginas.",
    ] },
]

