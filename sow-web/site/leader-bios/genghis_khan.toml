intro = [
  "成吉思汗（约1162年—1227年8月25日），本名铁木真，是大蒙古国的创建者，被后世元朝追尊为元太祖。成吉思汗一生大多时光都用于统合蒙古族诸部落，继而发起连番军事征伐，征服中国及中亚的大片疆土。",
  "成吉思汗是蒙古孛儿只斤氏首领也速该和妻子诃额仑的长子，生于1155年至1167年间，因铁木真兀格而取名「铁木真」。铁木真八岁时，父亲亡故，他的家庭遭部落抛弃。铁木真家道几近赤贫，为巩固自己在家庭中的地位，杀死同父异母兄长別克帖兒。铁木真极具领袖魅力，助其吸引首批追随者，并与札木合、脱斡邻勒二位重要草原首领结为同盟；他们合力夺回遭劫掠者掳去的铁木真新婚妻子孛儿帖。然而随着铁木真声名渐起，他与札木合逐渐关系恶化，最终公然交战。约1187年，铁木真在十三翼之战中大败，此后数年可能沦为金朝臣属；待1196年再度崛起，他旋即开始积聚权势。后来脱斡邻勒视铁木真为威胁，于1203年对他发动突袭，是为合兰真沙陀之战。铁木真先是撤退，继而重整旗鼓，于班朱尼河盟誓，在折折运都山之战击败脱斡邻勒；他击败乃蛮部且处决札木合后，遂成为蒙古草原上唯一的统治者。",
  "1206年，铁木真在忽里勒台上正式采用“成吉思汗”这一名号，其确切含义未详。成吉思汗推行旨在确保长治久安的改革，将蒙古部落的结构改造成一心效命于皇室的兼顾任用贤才与贵族秩序的集权体制。挫败权势萨满阔阔出的政变图谋后，成吉思汗开始巩固自己权力。1209年，成吉思汗率大军袭扰邻国西夏，西夏于次年接受蒙古所提条件。继而，成吉思汗发起征伐金朝的战事，历时四载，至1215年攻占金朝都城中都而告终，但蒙金之间的战事在此之后仍持续进行。成吉思汗的部将者别于1218年兼并中亚国家西辽。翌年，成吉思汗在花剌子模王朝处决自己派去的使者后，怒而兴兵入侵，此战倾覆花剌子模王朝，蹂躏河中地区与呼罗珊地区，而者别与其同僚速不台率军远征，抵至格鲁吉亚与基辅罗斯。1227年，成吉思汗在征伐西夏的行军途中驾崩；历经两年空位期后，他的第三子暨继承人窝阔台于1229年登上皇位。",
  "成吉思汗至今仍是颇具争议的人物。成吉思汗对追随者慷慨且极为忠诚，但对敌人极冷酷无情。成吉思汗为谋求称霸天下，广纳各方建言，他深信萨满教至上神祇腾格里已注定他要统治世界。成吉思汗麾下蒙古军队征伐造成规模巨大的人口损失，相关死亡人数长期存在学术争议，他征服之举亦促成广袤地域内前所未有的商业与文化交流。在俄罗斯与阿拉伯世界，成吉思汗被视为落后、野蛮的暴君，但近来西方学界已开始重新审视此前视他为野蛮军阀的观点。藏传佛教传入蒙古之後，后世逐渐出现将成吉思汗神化的传说（成吉思汗在世之时，藏传佛教尚未大规模传入蒙古高原）。在现代的蒙古国，其诞辰纪念日被设为“蒙古自豪日”。蒙古人视其为蒙古民族的缔造者和蒙古国家的开国之父。",
]
sections = [
  { "title" = "名号", "paragraphs" = [
      "因蒙古语并无通用的罗马化拼写系统，现代蒙古人名的拼写方式差异很大，发音可能与原名大相径庭。成吉思汗本名鐵木真（ᠲᠡᠮᠦᠵᠢᠨ；Temüjin），也曾譯為忒没真或特穆津。在英语中，此一詞彙有时也拼写为“Temuchin”。",
      "最常被译为“成吉思”的尊号，源自蒙古语的ᠴᠢᠩᠭᠢᠰ，其罗马化拼写可为Činggis。该词被音译写为汉字“成吉思”，音译为波斯语则是چنگیز（Čəngīz）。由于阿拉伯语中没有类似[tʃ]（在蒙古语和波斯语罗马化拼写中用č表示）的发音，所以写作者将这个名字转写为J̌ingiz，叙利亚语作者则使用Šīngīz。除18世纪基于对波斯文献的误读而引入英语的“Genghis”外，现代英语中的拼写还包括“Chinggis”、“Chingis”、“Jinghis”、“Jengiz”等。根據畏兀儿蒙古文史料的記載，成吉思汗生前頭銜為「汗」，窩闊台繼位後才開始廣泛使用來自突厥語的「合罕」一詞；此一詞彙在汉语中可对译为可汗或皇帝。清朝以前的汉语史料，并无「成吉思汗」之称，多用成吉思合罕、成吉思可汗或成吉思皇帝称呼他。由于满语中稱呼君主的「han」（汗）前「qa」的音早已脱落，音译为汉语时，均译为“汗”，而非“可汗”，虽然清代也曾有青吉思汗的译名，但最终成吉思汗一詞成為通稱。即便清末引入西方文献以後，漢語史料仍常将“成吉思可汗”改称为“成吉思汗”。时至今日，“成吉思汗”仍是此人最常用的称呼，国际上亦以“Genghis Khan”作为其通称。",
      "1265年11月23日，成吉思汗之孙忽必烈追尊祖父庙号为太祖，1266年11月16日，上谥号为圣武皇帝。1271年，忽必烈改国号为大元。1310年1月7日，忽必烈的曾孙曲律皇帝又将此谥号加上尊谥，扩展为法天啟運聖武皇帝。",
    ] },
  { "title" = "史料来源", "paragraphs" = [
      "由于相关史料是用欧亚大陆十几种语言所写成，故而现代历史学家发现汇编成吉思汗生平的相关信息颇为棘手。所有涉及成吉思汗青少年时光及崛起的记载都源于两部蒙古语史料——《蒙古秘史》与《金册》。《金册》现已失传，它为两部汉文史书——14世纪的《元史》和《圣武亲征录》提供创作灵感。《元史》虽然编纂质量欠佳，但对各场战役及相关人物提供大量细节；《圣武亲征录》在编年叙事上更为严谨，但未对成吉思汗有所批评，且偶尔还存在讹误。",
      "《蒙古秘史》因在14、15世纪被音译为汉字而得以留存。《蒙古秘史》的历史真实性一直存在争议：20世纪的汉学家阿瑟·韦利认为它是一部没有史学价值的文学作品，但近世历史学家却对这部作品更为采信。尽管该书的编年顺序明显存疑，且部分章节为求叙事更佳而有所删改，但《蒙古秘史》仍备受重视，因为这位匿名作者常常对成吉思汗提出批评：除将他描述为优柔寡断、有恐犬症外，《蒙古秘史》还载录他杀害兄长、其子术赤可能为私生子等诸多禁忌之事。",
      "多部波斯文史书亦留存于世，它们对成吉思汗及蒙古人或褒或贬，态度不一。明哈吉·朱兹贾尼和阿塔·蔑里克·志费尼皆在1260年完成各自所著史书。朱兹贾尼亲眼目睹蒙古征服的残暴行径，他的史书《纳昔儿史话》所体现出的敌意正反映出他的亲身经历。与朱兹贾尼同时代的志费尼，曾两次前赴蒙古，并在蒙古后继国伊利汗国政权中担任要职，故而他的态度更为同情蒙古；他在《世界征服者史》中所述对于成吉思汗西征诸事最为可靠。最重要的波斯文史料当属拉施德丁奉成吉思汗后裔合赞之命于14世纪初编纂的《史集》。合赞允许拉施特查阅《金册》等蒙古机密史料，使他得与忽必烈的使者孛罗丞相等蒙古口述传统方面的专家交流。由于是在撰写官方史书，拉施特对不便或禁忌的细节有所删改。",
    ] },
  { "title" = "早年", "paragraphs" = [
      "铁木真出生年份存在争议，历史学家各有倾向的不同日期：1155年、1162年、1167年。有些传统说法认为铁木真出生于猪儿年，也就是1155年或1167年。虽然赵珙和拉施德丁的著述支持1155年这一说法，但《元史》、《圣武亲征录》等其他主要史料则倾向于1162年。蒙古人民共和国曾选择在1962年纪念成吉思汗诞辰800周年。汉学家伯希和所支持的1167年这一说法源于次要史料——元代文人杨维桢的文章《三史正统辨》，但与成吉思汗生平事迹相比，1167年这一说法比1155年更为契合，因为若出生于1155年，则意味着他三十多岁才有子女，且年逾古稀仍征战不息。多数历史学家认可的出生年份是1162年；历史学家保罗·拉契涅夫斯基（Paul Ratchnevsky）指出，铁木真本人可能都不清楚确切年份。铁木真的出生地亦存争议；《蒙古秘史》记载为斡难河右岸的迭里温孛勒答合，然而有人认为在今蒙古国肯特省达达勒，也有人认为在今俄罗斯外貝加爾邊疆區阿加布里亞特區南部。",
      "铁木真出生于蒙古乞颜部的孛儿只斤氏，在当时，“蒙古”一词仅指蒙古高原东北部一个部落的成员；由于此部落在大蒙古国形成过程中起核心作用，后来他们的名称就被用来指代所有部落。父亲是也速该，把传奇战神孛端察儿蒙合黑奉为鼻祖，母亲是诃额仑，出生于弘吉剌部的斡勒忽讷氏，诃额仑新婚时，也速该从她的蔑儿乞新郎赤列都处将她抢走，自此成为他的正妻。铁木真本名由来存在争议：早期说法是，他父亲刚自征讨塔塔儿部的胜仗中归来，带回一名叫铁木真兀格的俘虏，遂以这名俘虏之名给新生儿取名，以庆胜利；后世说法则强调词根“temür”（意为“铁”），并与“铁木真”意为“铁匠”的说法联系起来。",
      "围绕铁木真的出生有数则传说。其中最著名的一则，是说铁木真出生时手中紧握着一块血块，此为亚洲民间传说中预示此子将成为勇士的象征。亦有说法称，诃额仑因感光而受孕，此光预示着此子的命运，此传说与孛儿只斤氏神话祖先阿兰豁阿的传说相呼应。也速该和诃额仑在铁木真之后，又育有三子：合撒儿、合赤温、帖木格，另有一女帖木仑。铁木真还有两名同父异母兄弟别克帖儿和别勒古台，他们是也速该次妻速赤格勒所生，速赤吉勒的身份未详。兄弟姐妹皆成长于也速该位于斡难河畔的主营地，于此学习骑马射箭。",
    ] },
  { "title" = "崛起掌权", "paragraphs" = [
      "铁木真年满十五岁成年后，返回德薛禅处迎娶孛儿帖。德薛禅见原本以为已死的女婿尚在人世，欣喜不已，遂同意这门婚事，并陪同新婚夫妇返回铁木真营帐；其妻子搠坛赠予诃额仑一件昂贵的貂皮斗篷。铁木真欲寻一庇护者，便将这件斗篷转赠给克烈部可汗脱斡邻勒，脱斡邻勒曾与也速该并肩作战，并与他结为安答。脱斡邻勒统治着蒙古中部的大片领土，但对众多追随者心存疑虑。因急需忠诚之士替代，脱斡邻勒对这份贵重礼物十分满意，欣然接纳铁木真受其庇护。二人关系日益密切，铁木真也开始招揽追随者，诸如者勒蔑等那可儿纷纷投效于他。大约在此期间，铁木真与孛儿帖育有他们的第一个孩子，是个女儿，名为豁真。",
      "不久之后，约三百名蔑儿乞人为报复也速该抢走诃额仑之举，突袭铁木真的营帐。铁木真及他弟弟得以藏身于不儿罕合勒敦山，然而孛儿帖与速赤格勒却遭掳掠。依收继婚之法，孛儿帖被嫁给已故赤列都之弟赤勒格儿。铁木真向脱斡邻勒以及儿时好友、已成为札达兰部首领的札木合求援。两位首领皆愿出兵两万，由札木合指挥，此战很快获胜。当时已怀有身孕的孛儿帖被成功找回，不久便生下一子，名为术赤；尽管铁木真视如己出，但术赤生父之谜却伴随他一生。《蒙古秘史》对此有所述载，与拉施德丁的记载有所不同，拉施德丁为维护家族声誉，隐去任何有关私生子的暗示。在接下来的十五年间，铁木真与孛儿帖又育有三子（察合台、窝阔台、拖雷）四女（扯扯亦坚、阿剌合、秃满伦、阿儿塔隆）。",
      "据《蒙古秘史》记载，铁木真与札木合的追随者一起扎营达一年半之久，其间二人重结安答之盟，大被同眠。该史料将这段时期描述为好友间的亲密相处，然而拉契涅夫斯基质疑，铁木真是否实际上是以投身札木合麾下为代价，换取他在对抗蔑儿乞人时的援助。矛盾渐生，两位首领最终分道扬镳，表面缘由是札木合就扎营之事说过一句隐晦之语；据《蒙古秘史》记载，札木合说：“铁木真、铁木真，我的好安答！靠座山坡扎营吧，好让牧马人有行帐！找个河岸扎营吧，好让牧羊人充其腹！ ”无论如何，铁木真听从诃额仑与孛儿帖的建议，开始建立独立的追随者队伍。多数部落首领仍追随札木合，但有四十一位首领连同众多百姓支持铁木真，其中包括兀良哈部的者勒蔑的两名弟弟察兀儿罕与速不台、巴鲁剌思部的忽必来与忽都思兄弟二人、斡勒忽讷兀惕部的轻吉牙歹等其他部落和氏族人。许多人被铁木真身为公正慷慨、能给予更好生活的领主的名声所吸引，且前来投奔的萨满巫师豁儿赤预言上天已赋予铁木真伟大的使命。",
    ] },
  { "title" = "驾崩及后续影响", "paragraphs" = [
      "1226年末至1227年初冬季，成吉思汗狩猎时坠马，随后数月病情日益加重。这使得中兴府的围攻进度放缓，因为他的诸子与将领劝他结束征战，返回蒙古养病，称西夏来年仍可征讨。成吉思汗因西夏主将阿沙敢不的侮辱而大怒，坚持继续围攻。成吉思汗于1227年8月18日或25日驾崩，但驾崩消息被严格保密，毫不知情的中兴府次月沦陷。城中百姓惨遭屠戮，用曼的话说，西夏文明在这场“非常成功的种族文化灭绝”中基本被抹去。皇帝确切的死因一直饱受猜测。拉施德丁与《元史》提及他身患疾病——可能是疟疾、斑疹伤寒、腺鼠疫。马可·波罗称他在一次围城中中箭身亡，柏郎嘉宾则称成吉思汗遭雷击而死。围绕此事还衍生出诸多传说——其中最著名的一则是说，美丽的古儿别速，她原是西夏皇帝之妻，在与成吉思汗性交时用匕首刺伤他的生殖器。",
      "成吉思汗驾崩后，关于其安葬地的争议百出。一说成吉思汗驾崩后，遗体运回蒙古，葬于肯特山的不儿罕合勒敦山之上或附近，此地乃他多年前选定之所。葬礼及下葬的具体细节并未对外公开；不儿罕山被宣布为“伟大的禁地”（ikh khorig，意为禁止入内的区域），除兀良哈守卫外，任何人不得靠近。1229年窝阔台即位时，曾向陵墓供奉祭品三日，并献祭三十名少女；而拉契涅夫斯基推测，由于蒙古人不懂遺體保存技術，可能将皇帝葬于鄂尔多斯，以防遗体在运往蒙古途中因夏季高温而腐坏；艾骛德则否定这一假说。今天中華人民共和國内蒙古自治区鄂尔多斯市伊金霍洛旗有一座「成吉思汗陵」，由元朝的太庙「八白室」演化而來，供奉了成吉思汗的数件遗物，而当地政府则宣称成吉思汗“就安葬在伊金霍洛”，饱受争议。",
      "蒙古草原各部落并无固定的继承制度，但常采用某种形式的幼子继承制，即幼子继承，因幼子自立门户、招揽追随者的时间最短，需仰仗父亲的遗产助力。然而，幼子继承制仅适用于财产，不涉及头衔。",
    ] },
]

[articles.ar]
text = "جِنْكِيزْ خَانْ (بالمنغولية: Чингис Хаан) (1165 - 1227م). هو مؤسس وإمبراطور الإمبراطورية المغولية والتي اعتبرت أضخم إمبراطورية في التاريخ ككتلة واحدة بعد وفاته."
title = "جنكيز خان"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%AC%D9%86%D9%83%D9%8A%D8%B2_%D8%AE%D8%A7%D9%86"
intro = [
  "جِنْكِيزْ خَانْ (بالمنغولية: Чингис Хаан) (1165 - 1227م). هو مؤسس وإمبراطور الإمبراطورية المغولية والتي اعتبرت أضخم إمبراطورية في التاريخ ككتلة واحدة بعد وفاته. برز بعد توحيده عدة قبائل رحل لشمال شرق آسيا. فبعد إنشائه إمبراطورية المغول وتسميته «بجنكيز خان» بدأ بحملاته العسكرية فهاجم الدولة القراخطائية والقوقاز والدولة الخوارزمية وزيا الغربية وإمبراطورية جين. وفي نهاية حياته كانت إمبراطوريته قد احتلت جزءً ضخمًا من أواسط آسيا والصين.",
  "كان قائدًا عسكريًّا شديد البأس، وكانت له القدرة على تجميع الناس حوله، وبدأ في التوسع تدريجيًّا في المناطق المحيطة به، وسرعان ما اتسعت مملكته حتى بلغت حدودها من كوريا شرقًا إلى حدود الدولة الخوارزمية الإسلامية غربًا، ومن سهول سيبريا شمالاً إلى بحر الصين جنوبًا، أي أنها كانت تضم من دول العالم حاليًا: الصين وإيران وكازاخستان وكوريا الشمالية والجنوبية ومنغوليا وفيتنام وتايلاند وأجزاء من سيبيريا، إلى جانب مملكة لاوس وميانمار ونيبال وبوتان.",
  "وقبل أن يتوفى جنكيز خان أوصى أن يكون خليفته هو أوقطاي خان وقسم إمبراطوريته إلى خانيات بين أبنائه وأحفاده. وقد توفي سنة 1227 بعد أن هزم التانجوت وقد دفن في قبر مجهول لايعرف بالضبط أين مكانه في منغوليا. وبدأ أحفاده بتوسيع إمبراطوريتهم خلال أرجاء أوراسيا من خلال احتلال و/أو إنشاء ممالك تابعة لهم داخل الصين الحالية وكوريا والقوقاز وممالك آسيا الوسطى، وأجزاء ضخمة من أوروبا الشرقية والشرق الأوسط.",
  "بجانب إنجازاته العسكرية الضخمة، فجنكيز خان جعل الإمبراطورية المغولية تتطور في وسائل أخرى. حيث أنه أصدر مرسومًا باعتماد الأبجدية الأويغورية كنظام الكتابة في الإمبراطورية المغولية. لقد شجع أيضا التسامح الديني داخل إمبراطوريته، وأنشأ إمبراطورية موحدة من قبائل شمال شرق آسيا الرحل. ويكن له المغول الحاليون شديد الاحترام ويعتبرونه الأب المؤسس لدولة منغوليا.",
]
sections = [
  { "title" = "تأصيل اسمه", "paragraphs" = [
      "جنكيز خان (بالمنغولية:Чингис Хаан)، (تكتب الصينية: 成吉思汗) وتهجئتها بطريقة پن ين pinyin هي: cheng1 ji1 si1 kang1)، أو تيموجين (بالصينية:鐵木真)، وهجاؤها بطريقة پن ين pinyin هو: Temüjin",
      "«جنكيز خان» كلمة تعني: قاهر العالم، أو ملك ملوك العالم، أو القوي، حسب الترجمات المختلفة للغة المنغولية، واسمه الأصلي «تيموجين» أو «تيموغين».",
    ] },
  { "title" = "بداية حياته", "paragraphs" = [
      "يتصل نسب تيموجين مباشرة مع جده خابول خان وأمباغاي، وأخيه كوتولا خان الذين تزعموا الاتحاد المنغولي فعندما انتقل دعم سلالة جين الصينية من المغول إلى التتار سنة 1161 وحطموا خابول خان. فعندئذ برز والد جنكيز واسمه يسوغي (زعيم أسرة بورجيقن وهي أسرة حاكمة لعشيرة قيات المغولية وابن أخ أمباغاي وكوتولا خان) ولكن هذا المنصب نازعته عليه أسرة تاي تشيود المنافسة، الذين ينحدرون مباشرة من أمباغاي، فعندما قوي نفوذ التتار بعد سنة 1161، حول حكام الأسرة جين دعمهم إلى قبيلة الكراييت",
      "وهو أبو الإمبراطور تولوي وجد كلٍ من الإمبراطور منكو خان والإمبراطور قوبلاي خان والإمبراطور هولاكو خان والإمبراطور إريك بوك.",
      "لم يذكر عن سنوات حياة تيموجين الأولى سوى القليل بسبب ندرة السجلات المكتوبة المعاصرة له، وإن كان هناك بعضا من المعلومات الواقعية والتي تعطي تفصيلا عن تلك السنوات، ولكن تبقى تلك المصادر القليلة محل نزاع.",
    ] },
  { "title" = "توحيد القبائل وتأسيس الدولة", "paragraphs" = [
      "قسمت هضبة آسيا الوسطى و (شمال الصين) في زمن تيموجين (أوائل القرن 13) إلى عدة قبائل متحدة أو كونفدراليات منها قبائل الميركيت والنايمان والتتار وخاماق المغول والكراييت، التي كانت كل منها بارزة بذاتها ولكنها في كثير من الأحيان غير ودية تجاه بعضها البعض كما يتضح من الغزوات الفجائية ربما تكون للنهب وأحيانا انتقامية.",
      "بدأ صعود تيموجين البطيء نحو السلطة حيث قدم نفسه حليفا (أو تابعا وفقا لمصادر أخرى) لزعيم قبيلة الكراييت طغرل صديق والده العزيز (وتسمى تلك الصداقة أخوة الدم). وقد توطدت تلك العلاقة عندما خطف الميركيتيون بورته زوجة تيموجين، فطلب تيموجين مساعدته، فاستجاب له بإعطاء تابعه 200,000 مقاتل من الكرايت، واقترح بأن يشرك معه صديق طفولته جاموقا، الذي أصبح بعد ذلك خانا على قبيلته. بالرغم من نجاح تلك الحملة التي أدت إلى تحرير بورته وهزيمة المركيت الشديدة، إلا أنه مهد طريق الانقسام بين أصدقاء الطفولة جاموقا وتيموجين. فقد كان تيموجين قبل ذلك قد تعاهد مع جاموقا عهد الدم، وأن يظلا وغبين لبعضهما البعض إلى الأبد.",
      "بعد أن استتب الأمر لجنكيز خان اتجه إلى إصلاح الشؤون الداخلية، فأنشأ مجلسًا للحكم يسمّى \"قوريلتاي\" سنة (603هـ=1206م) ودعاه للاجتماع، وفيه تحددت لأول مرة شارات ملكه، ونظم إمبراطوريته، ووضع لشعبه دستورًا محكمًا يسمى «قانون الياسا» لتنظيم الحياة، بعد أن رأى أن الآداب والأعراف والتقاليد المغولية لا تفي بمتطلبات الدولة الجديدة، ولم تكن مدونة، فأعاد النظر في بعضها، وقبل بعضها الآخر، ورد ما رآه غير ملائم. وتناول الدستورُ أمورًا متعددةً لتنظيم الحياة بالدولة الناشئة، وألزم أجهزة الدولة بتطبيق بنودها والعمل بموجبها، وشدد على معاقبة المخطئين.",
    ] },
  { "title" = "إمبراطورية المغول", "paragraphs" = [
      "حُكمت الإمبراطورية المغولية بقانون مدني وعسكري يدعى الياسق، والذي وضعه جنكيز خان. لم تؤكد الإمبراطورية المغولية على أهمية العرق والإثنية في المجال الإداري، وتبنّت بدلا من ذلك منهجا يعتمد على الجدارة، وكان الاستثناء حكم جنكيز خان وعائلته. كانت الإمبراطورية المغولية واحدة من أكثر الإمبراطوريات المتنوعة تنوعًا عرقيًا وثقافيًا في التاريخ، بما يتناسب مع حجمها. اعتبر العديد من سكان الإمبراطورية الرُحّل أنفسهم، مغولًا في الحياة العسكرية والمدنية، بمن فيهم المغول والأتراك وغيرهم، وكذلك العديد من سلالة خان من مختلف الأعراق، كجزء من الإمبراطورية المغولية مثل محمد خان.",
      "وُجدت إعفاءات ضريبية للشخصيات الدينية، وكذلك للمعلمين والأطباء على حدا ما. مارست الإمبراطورية المغولية التسامح الديني، إذ اعتبرت التقاليد المغولية أن الدين مفهوم شخصي، ولا يخضع للقانون أو التدخل. تحول أونغ خان، معلم جنكيز خان ومنافسه لاحقا، إلى المسيحية النسطورية، في وقت ما قبل تولي جنكيز خان الحكم. كانت القبائل المغولية المختلفة شامانية، أو بوذية، أو مسيحية، وكان التسامح الديني بذلك، مفهومًا راسخًا في السهوب الآسيوية.",
      "حاول جنكيز خان في أواخر حياته- وفقا للمؤرخين المنغوليين المعاصرين- إنشاء دولة مدنية في ظل الياسق العظيم، والذي كان ليحقق المساواة القانونية لجميع الأفراد، بمن فيهم النساء. لا يوجد أي دليل على ذلك، أو على إلغاء السياسات التمييزية تجاه الشعوب المقيمة مثل الصينيين. لعبت النساء دورًا مهمًا نسبيًا في الإمبراطورية المغولية وفي الأسرة، إذ تولت توراكينا خاتون على سبيل المثال حكم الإمبراطورية المغولية لفترة وجيزة، حتى اختير القائد خاقان لاحقا. يشير الباحثون المعاصرون إلى السياسة المزعومة التي شجعت التجارة والتواصل باسم باكس منغوليكا (السلام المغولي).",
    ] },
]

[articles.id]
text = "Jenghis Khan, lahir sebagai Temüjin (bahasa Mongol: Темүзин; Temüzin; ca 1162 – Agustus 1227), adalah seorang pendiri dan pemimpin (khan) pertama Kekaisaran Mongol. Ia menghabiskan sebagian besar hidupnya untuk menyatukan suku-suku Mongol dan kemudian memimpin serangkaian kampanye militer yang menaklukkan sebagian besar wilayah Tiongkok dan Asia Tengah."
title = "Jenghis Khan"
lang = "id"
url = "https://id.wikipedia.org/wiki/Jenghis_Khan"
intro = [
  "Jenghis Khan, lahir sebagai Temüjin (bahasa Mongol: Темүзин; Temüzin; ca 1162 – Agustus 1227), adalah seorang pendiri dan pemimpin (khan) pertama Kekaisaran Mongol. Ia menghabiskan sebagian besar hidupnya untuk menyatukan suku-suku Mongol dan kemudian memimpin serangkaian kampanye militer yang menaklukkan sebagian besar wilayah Tiongkok dan Asia Tengah.",
  "Temüjin yang lahir antara tahun 1155 dan 1167 merupakan putra sulung dari pasangan Yesugei, kepala suku Mongol dari klan Borjigin dan istri utamanya Hö'elün. Ketika Temüjin berusia delapan tahun, ayahnya meninggal dan suku mereka meninggalkan keluarga Temujin. Dengan keluarganya yang hampir sepenuhnya miskin, Temüjin membunuh kakak tirinya untuk memperkuat posisinya di dalam keluarga. Pribadinya yang karismatik membantunya mendapatkan pengikut dan mengikat persekutuan dengan dua pemimpin padang rumput yang kuat, Jamukha dan Toghrul. Bersama-sama, mereka menyelamatkan istri Temüjin, Börte, yang diculik oleh perampok. Namun, seiring dengan meningkatnya pamor Temüjin, hubungannya dengan Jamukha berubah menjadi konflik. Pada sekitar 1187, Temüjin mengalami kekalahan besar dan mungkin menghabiskan beberapa tahun berikutnya di bawah kendali dinasti Jin. Pada 1196, ia muncul kembali dan dengan cepat mulai mendapatkan kekuasaan. Toghrul, yang melihat Temüjin sebagai ancaman, melancarkan serangan mendadak terhadapnya pada 1203. Temüjin mundur, tetapi kemudian berkumpul kembali dan mengalahkan Toghrul. Setelah mengalahkan suku Naiman dan mengeksekusi Jamukha, Temüjin menjadi penguasa tunggal padang rumput Mongolia.",
  "Pada 1206, Temüjin mengambil gelar “Jenghis Khan”, meskipun arti sebenarnya dari gelar tersebut tidak jelas. Ia menerapkan reformasi untuk menciptakan stabilitas jangka panjang, mengubah tatanan kesukuan bangsa Mongol menjadi sistem meritokrasi terpadu dalam kesetiaan kepada wangsa yang berkuasa. Setelah menghentikan upaya kudeta oleh seorang dukun yang kuat, Jenghis Khan mulai mengkonsolidasikan kekuasaannya. Pada 1209, ia memimpin serangan besar-besaran ke negara tetangga, Xia Barat sehingga mereka tunduk kepada tuntutan Mongol setahun kemudian. Ia lalu meluncurkan kampanye militer selama empat tahun melawan dinasti Jin, yang berakhir pada 1215 dengan kejatuhan ibu kota mereka di Zhongdu. Pada 1218, jenderalnya, Jebe, mencaplok negara Qara Khitai di Asia Tengah. Tahun berikutnya, Jenghis Khan menginvasi Kekaisaran Khwarezmia setelah utusannya dieksekusi. Kampanye ini meruntuhkan negara Khwarezmia serta menghancurkan wilayah Transoxiana dan Khorasan. Sementara, Jebe dan seorang jenderal lainnya, Subutai, memimpin ekspedisi yang mencapai Georgia dan Rus' Kiev. Jenghis Khan meninggal pada 1227 saat memadamkan pemberontakan di Xia Barat. Setelah jeda dua tahun, putra ketiganya dan pewaris Ögedei naik takhta pada 1229.",
  "Jenghis Khan merupakan tokoh sejarah yang kontroversial. Ia sangat setia dan murah hati kepada para pengikutnya, tetapi tidak menunjukkan belas kasihan kepada musuh-musuhnya. Ia mencari nasihat dari berbagai sumber dalam upayanya menjadi penakluk dunia, sebuah peran yang ia yakini telah ditakdirkan untuknya oleh dewa Tengri. Di bawah kepemimpinannya, tentara Mongol membunuh jutaan orang, tetapi penaklukannya juga memungkinkan tingkat perdagangan dan pertukaran budaya yang belum pernah terjadi sebelumnya di wilayah yang begitu luas. Di Rusia dan dunia Arab, ia dikenang sebagai seorang tiran yang brutal, sementara para cendekiawan Barat baru-baru ini mengevaluasi kembali penggambaran sebelumnya tentang dirinya sebagai panglima perang yang biadab. Setelah kematiannya, ia dipuja di Mongolia dan kini dihormati sebagai bapak pendiri bangsa.",
]
sections = [
  { "title" = "Nama dan gelar", "paragraphs" = [
      "Nama-nama Mongolia tidak memiliki satu cara baku untuk ditulis dalam alfabet Romawi sehingga ejaannya bisa sangat bervariasi dan menghasilkan pengucapan yang berbeda dari aslinya. Gelar kehormatan yang paling sering ditulis sebagai “Genghis” berasal dari bahasa Mongolia ᠴᠢᠩᠭᠢᠰ ᠬᠠᠭᠠᠨ, yang dapat dilatinkan menjadi Činggis. Nama ini diadaptasi ke dalam bahasa Tionghoa sebagai 成吉思 Chéngjísī dan ke dalam bahasa Persia sebagai چنگیز Čəngīz. Karena bahasa Arab tidak memiliki bunyi yang mirip dengan [tʃ] dalam bahasa Mongolia dan Persia, penulis Arab menuliskan nama tersebut sebagai J̌ingiz, sementara penulis Suriah menggunakan Šīngīz.",
      "Selain “Genghis,” yang masuk ke dalam bahasa Inggris pada abad ke-18 karena kesalahan pembacaan sumber-sumber Persia, ejaan bahasa Inggris modern untuk namanya meliputi “Chinggis,” “Chingis,” “Jinghis,” dan “Jengiz.” Nama lahirnya, “Temüjin” (ᠲᠡᠮᠦᠵᠢᠨ; 鐵木真 Tiěmùzhēn), terkadang juga dieja “Temuchin” dalam bahasa Inggris.",
      "Ketika cucu Jenghis Khan, Kubilai Khan, mendirikan dinasti Yuan pada tahun 1271, ia menghormati kakeknya dengan nama kuil Taizu (太祖, yang berarti “Nenek Moyang Tertinggi”) dan nama anumerta Shengwu Huangdi (聖武皇帝, yang berarti “Kaisar Militer Suci”). Kemudian, cicit Kubilai, Külüg Khan, memperpanjang gelar ini menjadi Fatian Qiyun Shengwu Huangdi (法天啟運聖武皇帝), yang berarti “Penerjemah Hukum Langit, Pemrakarsa Keberuntungan, Kaisar Suci-Militer”.",
    ] },
  { "title" = "Sumber", "paragraphs" = [
      "Karena sumber-sumber tentang Jenghis Khan ditulis dalam lebih dari selusin bahasa dari seluruh Eurasia, para sejarawan modern mengalami kesulitan untuk mengumpulkan informasi tentang kehidupannya. Satu-satunya catatan rinci tentang masa muda dan kebangkitannya menuju kekuasaan berasal dari dua sumber berbahasa Mongolia: Sejarah Rahasia Bangsa Mongol dan Altan Debter (Buku Emas). Altan Debter kini telah hilang, tetapi sempat mengilhami dua kronik Tiongkok, yaitu Sejarah Yuan dari abad ke-14 dan Shengwu qinzheng lu (Kampanye Jenghis Khan). Meskipun tidak disunting dengan baik, Sejarah Yuan memberikan penguraian terperinci bagi tiap-tiap kampanye militer dan tokoh-tokohnya. Shengwu, meskipun lebih teratur secara kronologis, menghindari kritik terhadap Jenghis dan terkadang mengandung kekeliruan.",
      "Naskah penuh Sejarah Rahasia hanya bertahan dalam bentuk alih aksara Han yang disalin antara abad ke-14 dan ke-15. Keakuratannya sebagai catatan sejarah telah diperdebatkan: Ahli sinologi abad ke-20, Arthur Waley, menganggapnya sebagai karya sastra tanpa nilai sejarah. Meski begitu, sejarawan di kemudian hari telah menanggapi karya ini dengan lebih serius. Walaupun urut-urutan kejadian dalam karya ini dipertanyakan dengan beberapa bagian yang tampaknya diubah atau dihilangkan agar pengisahannya lebih luwes, Sejarah Rahasia sangat dihargai karena penulis anonimnya sering mengkritik Jenghis Khan. Penulisnya menggambarkan Jenghis Khan sebagai sosok peragu dan memiliki fobia pada anjing serta memasukkan bahasan tabu seperti pembunuhan saudaranya dan keraguan akan keabsahan nasab putranya, Jochi.",
      "Beberapa kronik Persia yang masih bertahan menunjukkan perpaduan antara pandangan positif dan negatif terhadap Jenghis Khan dan bangsa Mongol, seperti misalnya tawarikh karya Minhaj-i Siraj Juzjani dan Ata-Malik Juvayni, yang sama-sama selesai disusun pada tahun 1260. Juzjani, yang menyaksikan langsung kebrutalan penaklukan bangsa Mongol, menulis dengan rasa permusuhan yang jelas terhadap mereka. Sebaliknya, Juvayni, yang dua kali melakukan perjalanan ke Mongolia dan memegang posisi tinggi di negara penerus Mongol, lebih bersimpati. Catatannya paling dapat diandalkan untuk kampanye-kampanye Jenghis Khan ke barat. Sumber Persia yang paling penting adalah Jami' at-Tawarikh (Ringkasan Sejarah), yang disusun oleh Rasyiduddin atas permintaan keturunan Jenghis, Ghazan, pada awal abad ke-14. Ghazan memberi Rasyiduddin akses khusus ke sumber-sumber rahasia Mongol seperti Altan Debter dan para ahli tradisi lisan Mongol, termasuk duta besar Kubilai Khan, Bolad Chingsang. Karena Rasyiduddin sedang menulis kronik resmi, ia menyensor setiap detail yang tidak nyaman atau tabu.",
    ] },
  { "title" = "Kehidupan awal", "paragraphs" = [
      "Tahun kelahiran Temüjin tidak pasti. Para sejarawan berbeda pendapat mengenai tahun lahirnya, entah itu 1155, 1162, atau 1167. Beberapa riwayat mengatakan bahwa ia lahir pada Tahun Babi, yang bisa jadi pada tahun 1155 atau 1167. Tahun 1155 didukung oleh tulisan-tulisan Zhao Hong dan Rasyiduddin, sementara sumber-sumber utama seperti Sejarah Yuan dan Shengwu lebih memilih tahun 1162. Penanggalan tahun 1167, yang dipilih oleh ahli sinologi Paul Pelliot, berasal dari sumber kurang dikenal karya seniman Yuan, Yang Weizhen, tetapi lebih sesuai dengan peristiwa kehidupan Jenghis Khan daripada tahun 1155, yang berarti bahwa ia tidak memiliki anak sampai usia tiga puluhan dan masih turut berperang pada usia tujuh puluhan. Sebagian besar sejarawan menerima tahun 1162 sebagai tanggal yang tepat. Sejarawan Paul Ratchnevsky mencatat bahwa Temüjin sendiri mungkin tak tahu persis tahun kelahirannya. Lokasi kelahirannya, yang dicatat dalam Sejarah Rahasia sebagai Delüün Boldog di dekat Sungai Onon, juga masih diperdebatkan, bisa jadi di Dadal, Provinsi Khentii atau di selatan Okrug Agin-Buryat, Rusia.",
      "Temüjin lahir ke dalam klan Borjigin di bawah suku Mongol dari pasangan Yesügei, seorang kepala suku yang mengaku bernasab kepada pejuang legendaris Bodonchar Munkhag serta istri utamanya, Hö'elün, yang berasal dari klan Olkhonud dan direbut oleh Yesügei dari mempelai pria bersuku Merkit, Chiledu. Asal-usul nama lahirnya masih diperdebatkan: beberapa riwayat awal mengatakan bahwa ayahnya mengambil nama tersebut dari Temüchin-uge, seorang tawanannya dari pertempuran melawan Tatar, sebagai pengingat atas kemenangan. Sementara, riwayat-riwayat di kemudian hari menghubungkan nama tersebut dengan kata temür yang berarti 'besi', sehingga “Temüjin” mungkin saja bermakna 'pandai besi'.",
      "Terdapat beberapa legenda seputar kelahiran Temüjin. Salah satu yang paling terkenal adalah bahwa ia lahir dengan gumpalan darah di tangannya. Penggambaran ini merupakan sebuah motif cerita rakyat khas Asia yang menjadi pertanda bahwa anak itu akan menjadi seorang pejuang. Legenda lain mengatakan bahwa Hö'elün hamil dari seberkas cahaya yang menandakan terangnya masa depan anak tersebut, sebuah kisah yang mirip dengan mitos asal-usul leluhur Borjigin, Alan Gua. Setelah Temüjin, Yesügei dan Hö'elün memiliki tiga anak laki-laki—Qasar, Hachiun, dan Temüge—serta seorang anak perempuan, Temülün. Temüjin juga memiliki dua saudara tiri, Behter dan Belgutei, dari istri kedua Yesügei, Sochigel, yang latar belakangnya tidak diketahui. Kakak beradik ini tumbuh besar di perkemahan utama Yesügei di tepi Sungai Onon, kala mereka belajar menunggang kuda dan memanah.",
    ] },
  { "title" = "Naik ke tampuk kekuasaan", "paragraphs" = [
      "Ketika Temüjin berumur lima belas tahun dan dianggap mencapai usia mayoritas, ia kembali menemui Dei Sechen untuk menikahi Börte. Merasa bungah dapat berjumpa kembali dengan menantu yang dikiranya telah meninggal, Dei Sechen menyetujui pernikahan tersebut dan mendampingi pasangan pengantin baru ini kembali ke perkemahan Temüjin. Istri Dei Sechen, Čotan, memberikan Hö'elün sebuah jubah musang yang berharga sebagai hadiah. Demi menarik hati seorang patron, Temüjin memutuskan untuk menghadiahkan jubah ini kepada Toghrul, khan (penguasa) dari suku Kerait, yang merupakan sekutu Yesügei dan telah melakukan pakta anda dengannya. Toghrul memerintah wilayah yang luas di Mongolia tengah, tetapi mewaspadai banyak pengikutnya merasa senang dengan pemberian itu dan menjadikan Temüjin di bawah perlindungannya. Ketika mereka makin dekat, Temüjin mulai mengumpulkan pengikut, termasuk nökod seperti Jelme. Sekitar waktu ini, Temüjin dan Börte memiliki anak pertama mereka, seorang anak perempuan bernama Qojin.",
      "Segera setelah itu, sekitar 300 orang Merkit menyerang perkemahan Temüjin untuk membalas dendam atas penculikan Hö'elün yang dilakukan oleh Yesügei. Meskipun Temüjin dan saudara-saudaranya berhasil bersembunyi di gunung Burkhan Khaldun, Börte dan Sochigel berhasil ditawan oleh Merkit. Börte dinikahkan dengan adik laki-laki mendiang Chiledu, mengikuti hukum levirat. Temüjin meminta bantuan dari Toghrul dan teman masa kecilnya, Jamukha, yang telah menjadi kepala suku Jadaran. Kedua kepala suku itu bersedia menggerakkan pasukan yang terdiri dari 20.000 prajurit. Di bawah pimpinan Jamukha, mereka dengan cepat memenangkan pertempuran. Börte, yang saat itu sedang hamil, diselamatkan dan kemudian melahirkan seorang putra, Jochi. Meskipun Temüjin membesarkan Jochi layaknya putra sendiri, keraguan mengenai nasab Jochi selalu mengikutinya sepanjang hayat. Kisah ini ada di Sejarah Rahasia, tetapi tidak dicatat oleh Rasyiduddin, yang berupaya melindungi reputasi keluarganya dengan menghilangkan segala kesan ketidakabsahan. Selama 15 tahun berikutnya, Temüjin dan Börte memiliki tiga anak laki-laki (Chagatai, Ögedei, dan Tolui) dan empat anak perempuan (Checheyigen, Alaqa, Tümelün, dan Al Altan).",
      "Para pengikut Temüjin dan Jamukha berkemah bersama selama sekitar satu setengah tahun. Selama itu pula, kedua pemimpin memperbaharui pakta anda mereka, bahkan turut berbagi selimut, sebagaimana dicatat oleh Sejarah Rahasia. Sumber tersebut menggambarkan masa ini sebagai penjalinan hubungan erat antar sahabat. Walaupun demikian, Ratchnevsky menduga bahwa Temüjin mungkin saja melayani Jamukha sebagai imbalan atas bantuannya melawan orang Merkit. Pada akhirnya, kedua pemimpin itu berpisah, konon karena ujaran terselubung Jamukha tentang berkemah yang ditafsirkan oleh Börte sebagai tanda bahwa ia telah muak terhadap mereka. Mengikuti saran dari Hö'elün dan Börte, Temüjin memutuskan untuk mulai membangun kelompok pengikutnya sendiri yang merdeka. Meskipun para pemimpin suku utama tetap bersama Jamukha, 41 pemimpin, bersama dengan banyak orang biasa, memilih untuk mendukung Temüjin. Mereka termasuk orang-orang dari suku Uriankhai, Barula, dan Olkhonud. Mereka tertarik pada Temüjin karena pamornya sebagai pemimpin adil dan murah hati yang menawarkan taraf hidup lebih baik dan karena para dukun meramalkan bahwa ia ditakdirkan untuk menjadi orang besar.",
    ] },
]

[articles.tl]
text = "Si Genghis Khan (ipinanganak sa pangalang Temüjin; c. 1162 – Agosto 1227), kilala rin bilang Chinggis Khan, ay ang nagtatag at unang khan ng Imperyong Monggol."
title = "Genghis Khan"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Genghis_Khan"
intro = [
  "Si Genghis Khan (ipinanganak sa pangalang Temüjin; c. 1162 – Agosto 1227), kilala rin bilang Chinggis Khan, ay ang nagtatag at unang khan ng Imperyong Monggol. Matapos gugulin ang halos buong buhay niya sa pag-iisa sa mga tribong Monggol, naglunsad siya ng serye ng mga kampanyang militar, at sinakop ang malaking bahagi ng Tsina at Gitnang Asya.",
  "Pormal na inangkin ni Temüjin ang titulong \"Genghis Khan\" na may di-tiyak na kahulugan, sa isang pagpupulong noong 1206. Sa pagsasagawa ng mga reporma upang matiyak ang pangmatagalang katatagan, binago niya ang istraktura ng tribo ng mga Monggol na maging meritokrasiya na nakatuon sa paglilingkod sa naghaharing pamilya. Matapos hadlangan ang kudetang sinubukan ng isang makapangyarihang shaman, sinimulan ni Genghis na patatagin ang kanyang kapangyarihan. Noong 1209, pinangunahan niya ang malawakang pagsalakay sa karatig na Kanlurang Xia na sumang-ayon sa mga tuntunin ng Monggol sa sumunod na taon. Pagkatapos, naglunsad siya ng kampanya laban sa dinastiyang Jin, na tumagal ng apat na taon at nagwakas noong 1215 nang makuha ang kabisera ng Jin na Zhongdu. Sinakop ng kanyang heneral na si Jebe ang estado ng Qara Khitai sa Gitnang Asya noong 1218. Naudyukan si Genghis na salakayin ang Imperyong Khwarazmia nang sumunod na taon sa pamamagitan ng pagbitay sa kanyang mga sugo. Ang kampanya ay nagpabagsak sa estado ng Khwarazmia at nagwasak sa mga rehiyon ng Transoxiana at Khorasan, habang pinangunahan ni Jebe at ang kanyang kasamahan na si Subutai sa isang ekspedisyon na umabot sa Georgia at Kievan Rus'. Noong 1227, namatay si Genghis habang sinusupil ang rebeldeng Kanlurang Xia. Kasunod ng dalawang taong interegno, lumuklok sa trono noong 1229 ang kanyang ikatlong anak na lalaki at tagapagmana na si Ögedei.",
  "Nananatiling kontrobersiyal si Genghis Khan. Siya ay naging mapagbigay at napakatapat sa kanyang mga tagasunod, ngunit walang awa sa kanyang mga kaaway. Tinanggap niya ang payo mula sa mga iba't ibang tao sa kanyang hangarin para mangibabaw sa mundo, na pinaniwalaan niyang itinalaga siya ni Tengri, ang pinakamataas na deidad ng mga shaman. Sa ilalim ni Genghis, pumatay ng milyun-milyong tao ang hukbong Monggol, nagdulot din ang kanyang mga pananakop ng wala pang katulad na pagpapalitan ng komersyo at kultura sa napakalawak na heograpikal na pook. Sa Rusya at mundong Arabe, naaalala siya bilang atrasado at malupit na maniniil, habang nagsisimulang suriin muli ng kamakailangang Kanluraning iskolarsip ang dati nitong pagtingin sa kanya bilang barbarong kumander. Nang pagkamatay, ginawang bathala siya sa Monggolya; kjinikilala siya ng mga modernong Monggol bilang tagapagtatag ng kanilang bansa.",
]
sections = [
  { "title" = "Pangalan at titulo", "paragraphs" = [
      "Walang unibersal na sistema ng romanisasyon para sa wikang Monggol; kaya, lubhang magkakaiba ang mga modernong pagbaybay ng mga pangalang Monggol at maaaring magresulta sa malaking pagkakaiba sa pagbigkas kumpara sa orihinal. Hinango ang panggalang na pinakakaraniwang isinasalin bilang \"Genghis\" sa Monggol na ᠴᠢᠩᠭᠢᠰ, na maaaring iromanisa bilang Činggis. Inangkop ito sa Tsino bilang 成吉思 Chéngjísī, at sa Persa bilang چنگیز Čəngīz. Dahil walang katunog ng [tʃ] sa Arabe, kinakatawan ng č sa mga romanisasyon ng Monggol at Persa, isinalin ng mga manunulat ang pangalan bilang J̌ingiz, habang ginamit ng mga may-akdang Siriako ang Šīngīz.",
      "Bukod sa \"Genghis\" na ipinakilala sa wikang Ingles noong ika-18 siglo batay sa maling pagbabasa ng mga sangguniang Persa, kabilang sa mga modernong pagbaybay sa Ingles ang \"Chinggis\", \"Chingis\", \"Jinghis\", at \"Jengiz\". Minsan, binabaybay ang kanyang ngalan sa kapanganakan, \"Temüjin\" (ᠲᠡᠮᠦᠵᠢᠨ; 鐵木真 Tiěmùzhēn) bilang \"Temuchin\" sa Ingles.",
      "Nang itatag ng apo ni Genghis na si Kublai Khan ang dinastiyang Yuan noong 1271, ipinagkaloob niya ang pantemplong ngalan na Taizu (太祖, 'Supremong Ninuno') at postumong ngalan na Shengwu Huangdi (聖武皇帝, 'Banal na Emperador Militar') sa kanyang lolo. Kalaunan, pinalawak ng apo sa tuhod ni Kublai na si Külüg Khan ang titulong ito na maging Fatian Qiyun Shengwu Huangdi (法天啟運聖武皇帝, 'Tagapagsalin ng Makalangit na Batas, Tagapagsimula ng Magandang Kapalaran, Banal na Emperador Militar').",
    ] },
  { "title" = "Pinagkunan ng impormasyon", "paragraphs" = [
      "Dahil nakasulat ang mga sanggunian sa higit sa isang dosenang mga wika mula sa buong Eurasya, nahirapan ang mga modernong istoryador na magtipon ng impormasyon tungkol sa buhay ni Genghis Khan. Ang lahat ng mga salaysay ng kanyang pagbibinata at pagbangon sa kapangyarihan ay nagmula sa dalawang sanggunian sa wikang Monggol—ang Sikretong Kasaysayan ng mga Monggol at Altan Debter (Gintong Aklat). Nagsilbing inspirasyon ang ikalawa, na nawala na ngayon, ng dalawang Tsinong salaysay—ang Kasaysayan ng Yuan at Shengwu qinzheng lu (Mga Kampanya ni Genghis Khan) ng ika-14 na siglo.",
      "Umiiral pa rin ang Sikretong Kasaysayan dahil naisatitik ito sa mga Tsinong titik noong ika-14 at ika-15 siglo. Pinagtalunan ang pagiging makasaysayan nito: itinuring ni Arthur Waley, isang sinolohista ng ika-20 siglo, na isa itong akdang pampanitikan na walang historiograpikal na halaga, ngunit mas pinaniniwalaan ng mga kamakailang istoryador ang gawain. Bagama't malinaw na pinaghihinalaan ang kronolohiya ng akda at inalis o binago ang ilang mga sipi para gumanda ang pagsasalaysay, lubos na pinahahalagahan ang Sikretong Kasaysayan dahil madalas na mapamintas kay Genghis Khan ang hindi kilalang may-akda: bukod sa paglalarawan sa kanya bilang urong-sulong at takot sa aso, nagsasalaysay din ang Sikretong Kasaysayan ng mga di-pinagtatalakayang kaganapan tulad ng pagpatay sa kanyang kapatid at ang posibilidad ng pagiging di-lehitimo ng kanyang anak na si Jochi.",
      "Umiiral pa rin ang ilang salaysay sa wikang Persa, na maaaring may positibo o negatibong saloobin kay Genghis Khan at sa mga Monggol. Parehong natapos nina Minhaj-i Siraj Juzjani at Ata-Malik Juvayni ang kani-kanilang mga salaysay noong 1260. Naging saksi si Juzjani sa kalupitan ng mga panlulupig ng Monggol, at ang poot ng kanyang salaysay ay sumasalamin sa kanyang mga karanasan. Mas madamayin si Juvayni, ang kanyang kontemporaryo na naglakbay sa Mongolia nang dalawang beses at nakakuha ng mataas na posisyon sa administrasyon ng kahaliling estado ng mga Monggol; ang kanyang salaysay ay ang pinakamaaasahan ukol sa mga kanlurang kampanya ni Genghis Khan. Ang pinakamahalagang sanggunian sa Persa ay ang Jami' al-tawarikh (Kompendyo ng mga Salaysay) na pinagsama-sama ni Rashid al-Din sa utos ng inapo ni Genghis na si Ghazan noong unang bahagi ng ika-14 na siglo. Binigyan ni Ghazan si Rashid ng pribilehiyong akses sa mga kompidensyal na sangguniang Monggol tulad ng Altan Debter at sa mga eksperto sa mga bibigang tradisyon ng mga Monggol, kabilang dito ang embahador ni Kublai Khan na si Bolad Chingsang. Dahil nagsulat siya ng opisyal na salaysay, sinensor ni Rashid ang mga inkombenyente o ipinagbabawal na detalye.",
    ] },
  { "title" = "Pag-akyat sa Trono", "paragraphs" = [
      "Ang nagmana ng trono ay ang kanyang ikatlong anak si Ogedei Khan na ipinagpatuloy ang pagpapalawak sa imperyo at hinati din naman ang kanyang imperyo sa kanyang mga anak na lalaki. Ang kanlurang bahagi ay napunta kay Jochi (namatay noon 1226 at nahati ito sa Bughaw na Horde at Puting Horde), ang gitnang Asya ay napunta kay Chagatai Khan, at ang lupain ng mga Mongol ay napunta kay Tolui na naging rehente rin ng imperyo bago si Ogedei ang mahirang",
    ] },
]

[articles.pt]
text = "Gengis Khan (em mongol: Чингис Хаан; romaniz.: Tchingis Khaan; 1162 — 18 de agosto de 1227), também grafado como Gengis Cã, Gêngis Cã ou Gengiscão, foi estadista, governador militar e o primeiro grão-cã, fundador do Império Mongol. No início do século XIII, uniu todas as tribos nómadas das estepes da Ásia Central (Caraítas, Uigures, Naimanos, Merquites, Mongóis e Tártaros) sob a égide da identidade política mongol."
title = "Gengis Khan"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Gengis_Khan"
intro = [
  "Gengis Khan (em mongol: Чингис Хаан; romaniz.: Tchingis Khaan; 1162 — 18 de agosto de 1227), também grafado como Gengis Cã, Gêngis Cã ou Gengiscão, foi estadista, governador militar e o primeiro grão-cã, fundador do Império Mongol. No início do século XIII, uniu todas as tribos nómadas das estepes da Ásia Central (Caraítas, Uigures, Naimanos, Merquites, Mongóis e Tártaros) sob a égide da identidade política mongol. Durante o seu reinado, entre 1206 e 1227, Gengis Cã governou as dinastias Xia Ocidental e Jin no Norte da China; o Canato Caraquitai no Turquestão e Transoxiana; lançou campanhas contra os corasmianos na Corásmia, Coração e Irão, os georgianos no Cáucaso, os principados russos na Estepe dos Quipechaques, os quipechaques e os búlgaros do Volga. Como resultado, Gengis Cã estabeleceu um império que se estendia do Oceano Pacífico ao Mar Cáspio e ao norte do Mar Negro.",
  "Nascido com o nome de Temujim nas proximidades do rio Onon, perto do lago Baical, inicialmente enfrentou a rejeição da sua família por seu próprio clã Borjiguim e da tribo Quiad (起延) do Império Mongol.[carece de fontes]? Reinou da primavera de 1206 a 25 de agosto de 1227, por 22 anos. Conseguiu conquistar a sua liderança, vencer os seus rivais e unificar os povos mongóis sob seu comando. Estrategista brilhante, com hábeis arqueiros montados à sua disposição, venceu a Muralha da China, conquistou o Império Tangute e lançou as bases para a conquista do restante da China. Na sequência, estendeu o seu império em direção ao oeste e ao sul e tornou-se o líder militar que mais conquistou territórios na história, controlando quase vinte milhões de km².",
  "Gengis morreu antes de ver seu império alcançar sua extensão máxima, mas todos os líderes mongóis posteriores associariam sua própria glória às conquistas de Gengis, \"que foi um dos comandantes militares mais bem-sucedidos da história da humanidade\". Gengis Cã, transformou a estrutura tribal dos mongóis numa meritocracia integrada a serviço da família governante, e construiu um exército com base na habilidade e superioridade individual de cada um, estratégias apoiadas no sistema decimal derivada da tradição das estepes, tornou-se reconhecido como um grande soldado graças ao serviço postal e à rede de espionagem que estabeleceu, e à valorização intelectual de cada indivíduo. Com as suas regras codificadas conhecidas como Código Genghis Khan, ele também proibiu a tortura, a mentira, o roubo e o adultério. Também legislou que artesãos, médicos, indivíduos educados com certas habilidades de conhecimento e clérigos de todas as religiões deveriam ser respeitados e isentos de impostos, independentemente da sua nacionalidade. Entretanto, as suas campanhas foram naturalmente acompanhadas por massacres em larga escala das populações civis, sendo estimado que causou a morte de trinta a sessenta milhões de pessoas, mas a suas conquistas facilitaram trocas comerciais e culturais sem precedentes em vastas áreas geográficas. Teve cerca de quinhentas esposas e concubinas.",
]
sections = [
  { "title" = "Juventude", "paragraphs" = [
      "Temudjin nasceu na Mongólia na década de 1160, provavelmente em 1162. Supõe-se que seja descendente de um líder mongol conhecido como Cabul Cã, do clã Bojigin, que por breves anos obteve controle sobre uma Mongólia unificada. Entretanto, na época do nascimento de Temudjin, os mongóis estavam divididos em diversas tribos e clãs, cada uma governada por um cã, ou \"Senhor\", que se impunha mais pela força do que pela ascendência nobre. Com Temudjin não seria diferente. Quando tinha nove anos, Temudjin foi ao clã dos Merquitas para escolher uma esposa e refazer a paz entre os clãs (há muito tempo, seu pai havia roubado a esposa do Cã dos Merquitas e se casado com ela, ela era a mãe de Temudjin), mas no caminho, parou para pernoitar num clã aliado, os Onggirat, aonde se apaixonou por Borte. Pediu ao pai para praticar a escolha de esposas ali, porém, ao invés de apenas praticar, escolheu oficialmente Borte como sua noiva. No caminho de volta, seu pai, Yesugei, foi envenenado por membros da tribo dos tártaros. Sem que os filhos de Yesugei tivessem idade para assumir o controle da tribo, esta passou a ser comandada por um novo cã, Targutai, ex-soldado de Yesugei, que expulsou a família do clã para evitar futura contestação de sua liderança, forçando-os a sobreviver nas estepes, sem gado ou cavalos.",
      "Passou a infância inteira tentando fugir do algoz Targutai. Quando tinha 16 anos, a fim de cimentar alianças entre a sua tribo e tribo de sua esposa, Börte, teve quatro filhos que receberam os nomes: Jochi (1185-1226), Chagatai (1187-1241), Gedei (1189-1241), e Tolui (1190-1232). Ele também teve outros filhos de outras mulheres, mas seus nomes não são lembrados porque não recebem uma herança que lhes daria autoridade no clã. Aos 17 anos conseguiu reencontrar Börte, casando-se.",
    ] },
  { "title" = "Ascensão", "paragraphs" = [
      "Como quase todos os mongóis, Temudjin provavelmente tinha sido treinado como arqueiro montado desde muito jovem. A habilidade na montaria, comandada apenas com os joelhos e a destreza no arco e flecha, aliada a uma vida dura nas estepes tornavam os guerreiros mongóis muito temidos e respeitados. Depois de casar-se com Borte, Temudjin seguiu com ela por um caminho incerto pela Mongólia, até que, um dia, os dois foram encontrados por um grupo de merquitas comandados por Chitedu (ex-marido da mãe de Temudjin), que queria a esposa de Temudjin como vingança pela ofensa que seu pai havia feito antigamente. Temudjin reuniu alguns homens e foi até Jamuca pedir ajuda para resgatar Borte.",
      "Ao destruir os merquites, Temudjin encontrou provavelmente Börte Ujin grávida, fazendo sua primeira paternidade ser duvidosa. Após restabelecer seu clã (formado por seus homens que sobreviveram à guerra e pelo remanescente do povo dos merquites), Temudjin seguiu como nômade pela Mongólia, porém alguns homens de Jamuca se uniram a ele, ganhando o rancor de Jamuca, que ordenou a seus homens escravizarem e levar Temudjin até a China.",
      "Sua esposa Borte consegue resgatá-lo e não quis voltar à Mongólia, afirmando que ela estava corrompida e sem leis. Determinado a unificar a Mongólia, Temudjin determinou as leis dos mongóis. Nessa época, a força de Temudjin era conhecida em toda a Mongólia. Temudjin seguiu pregando a unificação da Mongólia nos clãs e muitos cãs se uniram a ele, porém, a maioria dos clãs se uniram a Jamuca, que pregava a destruição de Temudjin. Finalmente, a Mongólia estava dividida em duas: o exército de Temudjin e o exército de Jamuca. Os dois exércitos se encontraram para a batalha final na qual Temudjin foi o vencedor.",
    ] },
  { "title" = "Táticas de guerra", "paragraphs" = [
      "Gengis criou táticas de guerra revolucionárias para as batalhas nas estepes e também é considerado um dos percussores da Guerra humanitária junto com Átila segundo Noam Chomsky. Seu exército era disciplinado, temido e impiedoso. A arma tradicional dos mongóis era o arco mongol, espécie de arco recurvo composto por madeira, cola e chifres de animais, que possibilitava que com a redução de força relativa ao arco longo, os arqueiros conseguissem atirar com mais agilidade e mais precisão. O tamanho relativamente menor em relação ao arco longo, também possibilitava maior portabilidade em cima da montaria, com isso tornou obrigatório o treinamento dessa arma. Os cavaleiros eram treinados para atirar a flecha com o cavalo em movimento. Um detalhe era que, para maior precisão, a flecha era disparada no momento em que o cavalo estivesse em pleno galope. Esses cavaleiros, os chamados mangudais, eram uma arma poderosa contra a infantaria inimiga, já que juntavam dois princípios: arco e flecha e cavalaria, ou seja, um mangudai poderia ser rápido e preciso para atingir os inimigos mesmo estando longe. O arco mongol era até mais potente que os arcos longos utilizados pelos ingleses e galeses com grande êxito em batalhas contra os franceses durante a Guerra dos Cem anos.",
