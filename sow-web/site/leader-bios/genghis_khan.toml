  { "title" = "Legado", "paragraphs" = [
      "Antes da morte de Gengis, este estabeleceu seu filho, Ogedai Khan, como seu sucessor. Ogedai encarregou-se de expandir o território mongol ao máximo, da Síria à Indochina, da Pérsia à Sibéria, da Hungria à China. Posteriormente, o grande império foi dividido em 4 partes entre filhos e netos de Genghis, porém nenhum destes novos canatos teriam uma existência longa.",
      "Com as bases lançadas por Gengis pela conquista da China, seu neto Cublai Cã em 1271 assegurou o domínio mongol sob o território chinês e lá fundou a dinastia mongólica dos Yuan, anexando a China a seu império. A primeira dinastia que não era de Etnia han a reger o território chinês, Yuan é conhecida por abrir as portas para os primeiros principais contatos europeus com o extremo da Ásia. É no período da Dinastia Yuan em que Marco Polo, viajante italiano, concretiza sua exploração pela Ásia, e também quando demais missionários europeus, como João de Montecorvino, seguem viagem pelo território.",
