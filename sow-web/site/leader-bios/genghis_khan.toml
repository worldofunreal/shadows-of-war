[articles.en]
text = "Genghis Khan, also known as Chinggis Khan, was the founder and first khan of the Mongol Empire. After spending most of his life uniting the Mongol tribes, he launched a series of military campaigns, conquering large parts of China and Central Asia."
title = "Genghis Khan"
lang = "en"
url = "https://en.wikipedia.org/wiki/Genghis_Khan"
intro = [
  "Genghis Khan (born Temüjin; c. 1162 – 18 or 25 August 1227), also known as Chinggis Khan, was the founder and first khan of the Mongol Empire. After spending most of his life uniting the Mongol tribes, he launched a series of military campaigns, conquering large parts of China and Central Asia.",
  "Genghis Khan was born Temüjin between 1155 and 1167 as the eldest child of Yesugei, a Mongol chieftain of the Borjigin clan, and his wife Hö'elün. When Temüjin was eight, his father died and his family was abandoned by its tribe. Reduced to near-poverty, Temüjin killed his older half-brother Behter to secure his familial position. His charismatic personality helped to attract his first followers and to form alliances with two prominent steppe leaders named Jamukha and Toghrul; they worked together to retrieve Temüjin's newlywed wife Börte, who had been kidnapped by raiders. As his reputation grew, his relationship with Jamukha deteriorated into open warfare. Temüjin was badly defeated in c. 1187, and may have spent the following years as a subject of the Jin dynasty; upon reemerging in 1196, he swiftly began gaining power. Toghrul came to view Temüjin as a threat and launched a surprise attack on him in 1203. Temüjin regrouped and overpowered Toghrul. After defeating the Naiman tribe and executing Jamukha, he was left as the sole ruler on the Mongolian steppe.",
  "Temüjin formally adopted the title \"Genghis Khan\", the meaning of which is uncertain, at an assembly in 1206. Carrying out reforms designed to ensure long-term stability, he transformed the Mongols' tribal structure into an integrated meritocracy dedicated to the service of the ruling family. After thwarting a coup attempt from a powerful shaman, Genghis began to consolidate his power. In 1209, he led a large-scale raid against the neighbouring Western Xia, who agreed to Mongol terms the following year. He then launched a campaign against the Jin dynasty, which lasted for four years and ended in 1215 with the capture of the Jin capital Zhongdu. His general Jebe annexed the Central Asian state of Qara Khitai in 1218. The following year, Genghis invaded the Khwarazmian Empire following the execution of his envoys; the campaign toppled the Khwarazmian state and devastated the regions of Transoxiana and Khorasan, while Jebe and his colleague Subutai led an expedition that reached Georgia and Kievan Rus'. In 1227, Genghis died while subduing the rebellious Western Xia. Following a two-year interregnum, his third son and heir Ögedei acceded to the throne in 1229.",
  "Genghis Khan remains a controversial figure. He was generous and intensely loyal to his followers, but ruthless towards his enemies. He welcomed advice from diverse sources in his quest for world domination, for which he believed the shamanic supreme deity Tengri had destined him. The Mongol army under Genghis killed millions of people, yet his conquests also facilitated unprecedented commercial and cultural exchange over a vast geographical area. He is remembered as a backward, savage tyrant in Russia and the Arab world while Western scholarship since the 1990s has begun to reassess the previous view of him as a barbarian warlord. He was posthumously deified in Mongolia; modern Mongolians recognise him as the founding father of their nation.",
]
sections = [
  { "title" = "Name and title", "paragraphs" = [
      "There is no universal romanisation system used for Mongolian; as a result, modern spellings of Mongolian names vary greatly and may result in considerably different pronunciations from the original. The honorific most commonly rendered as \"Genghis\" ultimately derives from the Mongolian ᠴᠢᠩᠭᠢᠰ, which may be romanised as Činggis. This was adapted into Chinese as 成吉思 Chéngjísī, and into Persian as چنگیز Čəngīz. As Arabic lacks a sound similar to [tʃ], represented in the Mongolian and Persian romanisations by ⟨č⟩, writers transcribed the name as J̌ingiz, while Syriac authors used Šīngīz.",
      "In addition to \"Genghis\", introduced into English during the 18th century based on a misreading of Persian sources, modern English spellings include \"Chinggis\", \"Chingis\", \"Jinghis\", and \"Jengiz\". His birth name \"Temüjin\" (ᠲᠡᠮᠦᠵᠢᠨ; 鐵木真 Tiěmùzhēn) is sometimes also spelled \"Temuchin\" in English.",
      "When Genghis's grandson Kublai Khan established the Yuan dynasty in 1271, he bestowed the temple name Taizu (太祖, meaning 'Supreme Progenitor') and the posthumous name Shengwu Huangdi (聖武皇帝, meaning 'Holy-Martial Emperor') upon his grandfather. Kublai's great-grandson Külüg Khan later expanded this title into Fatian Qiyun Shengwu Huangdi (法天啟運聖武皇帝, meaning 'Interpreter of the Heavenly Law, Initiator of the Good Fortune, Holy-Martial Emperor').",
    ] },
  { "title" = "Early life", "paragraphs" = [
      "The year of Temüjin's birth is disputed, as historians favour different dates: 1155, 1162, or 1167. Some traditions place his birth in the Year of the Pig, which was either 1155 or 1167. While a dating to 1155 is supported by the writings of both Zhao Hong and Rashid al-Din, other major sources such as the History of Yuan and the Shengwu favour the year 1162. The 1167 dating, favoured by the sinologist Paul Pelliot, is derived from a minor source—a text of the Yuan artist Yang Weizhen—but is more compatible with the events of Genghis Khan's life than a 1155 placement, which implies that he did not have children until after the age of thirty and continued actively campaigning into his seventh decade. 1162 is the date accepted by most historians; the historian Paul Ratchnevsky noted that Temüjin himself may not have known the truth. The location of Temüjin's birth, which the Secret History records as Delüün Boldog on the Onon River, is similarly debated: it has been placed at either Dadal in Khentii Province or in southern Agin-Buryat Okrug, Russia.",
      "Temüjin was born into the Borjigin clan of the Mongol tribe to Yesügei, a chieftain who claimed descent from the legendary warlord Bodonchar Munkhag, and his principal wife Hö'elün, originally of the Olkhonud clan, whom Yesügei had abducted from her Merkit bridegroom Chiledu. The origin of his birth name is contested: the earliest traditions hold that his father had just returned from a successful campaign against the Tatars with a captive named Temüchin-uge, after whom he named the newborn in celebration of his victory, while later traditions highlight the root temür (meaning 'iron') and connect to theories that \"Temüjin\" means 'blacksmith'.",
      "Several legends surround Temüjin's birth. The most prominent is that he was born clutching a blood clot in his hand, a motif in Asian folklore indicating the child would be a warrior. Others claimed that Hö'elün was impregnated by a ray of light which announced the child's destiny, a legend which echoed that of the mythical Borjigin ancestor Alan Gua. Yesügei and Hö'elün had three younger sons after Temüjin: Qasar, Hachiun, and Temüge, as well as one daughter, Temülün. Temüjin also had two half-brothers, Behter and Belgutei, from Yesügei's secondary wife Sochigel, whose identity is uncertain. The siblings grew up at Yesugei's main camp on the banks of the Onon, where they learned how to ride a horse and shoot a bow.",
    ] },
  { "title" = "Rise to power", "paragraphs" = [
      "Temüjin returned to Dei Sechen to marry Börte when he reached the age of majority at fifteen. Delighted to see the son-in-law he feared had died, Dei Sechen consented to the marriage and accompanied the newlyweds back to Temüjin's camp; his wife Čotan presented Hö'elün with an expensive sable cloak. Seeking a patron, Temüjin chose to regift the cloak to Toghrul, khan (ruler) of the Kerait tribe, who had fought alongside Yesügei and sworn the anda pact with him. Toghrul ruled a vast territory in central Mongolia but distrusted many of his followers. In need of loyal replacements, he was delighted with the valuable gift and welcomed Temüjin into his protection. The two grew close, and Temüjin began to build a following, as nökod such as Jelme entered into his service. Temüjin and Börte had their first child, a daughter named Qojin, around this time.",
      "Soon afterwards, seeking revenge for Yesügei's abduction of Hö'elün, around 300 Merkits raided Temüjin's camp. While Temüjin and his brothers were able to hide on Burkhan Khaldun mountain, Börte and Sochigel were abducted. In accordance with levirate law, Börte was given in marriage to the younger brother of the now-deceased Chiledu. Temüjin appealed for aid from Toghrul and his childhood anda Jamukha, who had risen to become chief of the Jadaran tribe. Both chiefs were willing to field armies of 20,000 warriors, and with Jamukha in command, the campaign was soon won. A now-pregnant Börte was recovered successfully and soon gave birth to a son, Jochi; although Temüjin raised him as his own, questions over his true paternity followed Jochi throughout his life. This is narrated in the Secret History and contrasts with Rashid al-Din's account, which protects the family's reputation by removing any hint of illegitimacy. Over the next decade and a half, Temüjin and Börte had three more sons (Chagatai, Ögedei, and Tolui) and four more daughters (Checheyigen, Alaqa, Tümelün, and Al-Altan).",
      "The followers of Temüjin and Jamukha camped together for a year and a half, during which their leaders reforged their anda pact and slept together under one blanket, according to the Secret History. The source presents this period as close friends bonding, but Ratchnevsky questioned if Temüjin actually entered into Jamukha's service in return for the assistance with the Merkits. Tensions arose and the two leaders parted, ostensibly on account of a cryptic remark made by Jamukha on the subject of camping; in any case, Temüjin followed the advice of Hö'elün and Börte and began to build an independent following. The major tribal rulers remained with Jamukha, but forty-one leaders gave their support to Temüjin along with many commoners: these included Subutai and others of the Uriankhai, the Barulas, the Olkhonuds, and many more. Many were attracted by Temüjin's reputation as a fair and generous lord who could offer better lives, while his shamans prophesied that heaven had allocated him a great destiny.",
    ] },
  { "title" = "Early reign: reforms and Chinese campaigns (1206–1215)", "paragraphs" = [
      "Now sole ruler of the steppe, Temüjin held a large assembly called a kurultai at the source of the Onon River in 1206. Here, he formally adopted the title \"Genghis Khan\", the etymology and meaning of which have been much debated. Some commentators hold that the title had no meaning, simply representing Temüjin's eschewal of the traditional gurkhan title, which had been accorded to Jamukha and was thus of lesser worth. Another theory suggests that the word \"Genghis\" bears connotations of strength, firmness, hardness, or righteousness. A third hypothesis proposes that the title is related to the Turkic tängiz ('ocean'), the title \"Genghis Khan\" would mean \"master of the ocean\", and as the ocean was believed to surround the earth, the title thus ultimately implied \"Universal Ruler\".",
      "Genghis Khan then began a \"social revolution\", in May's words. As traditional tribal systems had primarily evolved to benefit small clans and families, they were unsuitable as the foundations for larger states and had been the downfall of previous steppe confederations. Genghis thus began a series of administrative reforms designed to suppress the power of tribal affiliations and to replace them with unconditional loyalty to the khan and the ruling family. As most of the traditional tribal leaders had been killed during his rise to power, Genghis was able to reconstruct the Mongol social hierarchy in his favour. The highest tier was occupied solely by his and his brothers' families, who became known as the altan uruq (lit. 'Golden Family') or chaghan yasun (lit. 'white bone'); underneath them came the qara yasun (lit. 'black bone'; sometimes qarachu), composed of the surviving pre-empire aristocracy and the most important of the new families.",
      "To break any concept of tribal loyalty, Mongol society was reorganised into a military decimal system. Every man between the age of fifteen and seventy was conscripted into a minqan (pl. minkad), a unit of a thousand soldiers, which was further subdivided into units of hundreds (jaghun, pl. jaghat) and tens (arban, pl. arbat). The units also encompassed each man's household, meaning that each military minqan was supported by a minqan of households in what May has termed \"a military–industrial complex\". Each minqan operated as both a political and social unit, while the warriors of defeated tribes were dispersed to different minqad to make it difficult for them to rebel as a single body. This was intended to ensure the disappearance of old tribal identities, replacing them with loyalty to the \"Great Mongol State\", and to commanders who had gained their rank through merit and loyalty to the khan. This particular reform proved extremely effective—even after the division of the Mongol Empire, fragmentation never happened along tribal lines. Instead, the descendants of Genghis continued to reign unchallenged, in some cases until as late as the 1700s, and even powerful non-imperial dynasts such as Timur and Edigu were compelled to rule from behind a puppet ruler of his lineage.",
    ] },
  { "title" = "Legacy and historical assessment", "paragraphs" = [
      "Genghis Khan left a vast and controversial legacy. His unification of the Mongol tribes and his foundation of the largest contiguous state in world history \"permanently alter[ed] the worldview of European, Islamic, [and] East Asian civilizations\", according to Atwood. His conquests enabled the creation of Eurasian trading systems unprecedented in their scale, which brought wealth and security to the tribes. Although he very likely did not codify the written body of laws known as the Great Yasa, he did reorganise the legal system and establish a powerful judicial authority under Shigi Qutuqu.",
      "On the other hand, his conquests were ruthless and brutal. The prosperous civilizations of China, Central Asia, and Persia were devastated by the Mongol assaults, and underwent multi-generational trauma and suffering as a result. Perhaps Genghis's greatest failing was his inability to create a working succession system—his division of his empire into appanages, meant to ensure stability, actually did the reverse, as local and state-wide interests diverged and the empire began splitting into the Golden Horde, the Chagatai Khanate, the Ilkhanate, and the Yuan dynasty in the late 1200s. In the mid-1990s, the Washington Post acclaimed Genghis Khan as the \"man of the millennium\" who \"embodied the half-civilized, half-savage duality of the human race\". This complex image has remained prevalent in modern scholarship, with historians emphasising both Genghis Khan's positive and negative contributions.",
      "For many centuries, Genghis was remembered in Mongolia as a religious figure, not a political one. After Altan Khan converted to Tibetan Buddhism in the late 1500s, Genghis was deified and given a central role in the Mongolian religious tradition. As a deity, Genghis drew upon Buddhist, shamanistic, and folk traditions: for example, he was defined as a new incarnation of a chakravartin (idealised ruler) like Ashoka, or of Vajrapani, the martial bodhisattva; he was connected genealogically to the Buddha and to ancient Buddhist kings; he was invoked during weddings and festivals; and he took a large role in ancestor veneration rituals. He also became the focus point of a sleeping hero legend, which says he will return to help the Mongol people in a time of great need. His cult was centred at the naiman chagan ordon (lit. '\"Eight White Yurts\"'), today a mausoleum in Inner Mongolia, China.",
    ] },
]

[articles.es]
text = "Gengis Kan (mongol moderno Чингис хаан, Chinguis Jaan ; mongol clásico: ᠴᠢᠩᠭᠢᠰ ᠬᠠᠭᠠᠨ, «Chiñguis Jagan»; nacido Temuyín; Dulun Boldak, c. 1162-Yinchuan, 18 de agosto de 1227) fue un guerrero y conquistador mongol que unificó a las tribus nómadas de esta etnia del norte de Asia, fundador y primer Gran Kan del Imperio mongol, considerado el imperio contiguo más grande de la historia."
title = "Gengis Kan"
lang = "es"
url = "https://es.wikipedia.org/wiki/Gengis_Kan"
intro = [
  "Gengis Kan (mongol moderno Чингис хаан, Chinguis Jaan ; mongol clásico: ᠴᠢᠩᠭᠢᠰ ᠬᠠᠭᠠᠨ, «Chiñguis Jagan»; nacido Temuyín; Dulun Boldak, c. 1162-Yinchuan, 18 de agosto de 1227) fue un guerrero y conquistador mongol que unificó a las tribus nómadas de esta etnia del norte de Asia, fundador y primer Gran Kan del Imperio mongol, considerado el imperio contiguo más grande de la historia. Bajo su liderazgo como Gran Kan, los mongoles comenzaron una oleada de conquistas que extendió su dominio a un vasto territorio, desde Europa Oriental hasta el océano Pacífico, y desde Siberia hasta Mesopotamia, la India e Indochina. En la primera fase de esta expansión, las hordas mongolas conquistaron importantes reinos de Asia, como el Imperio Jin del norte de China (1211-1216), el Imperio tanguta, el kanato de Kara-Kitai, el Imperio corasmio o la dinastía Song en el sur de China.",
  "Sus excepcionales éxitos militares convirtieron a Gengis Kan en uno de los conquistadores más importantes de todos los tiempos y, al final de la vida del gran kan, el Imperio mongol ocupaba una parte sustancial de Asia Central y China.​ Gengis Kan y su historia de conquista tienen una temible reputación en las historias locales.​ Muchos cronistas medievales e historiadores modernos describen las conquistas de Gengis Kan como una destrucción total a una escala sin precedentes que condujo a una disminución drástica de la población en algunas regiones como resultado tanto de los exterminios masivos como de la hambruna. Las estimaciones del número de personas que murieron como consecuencia de las campañas militares de Gengis Kan van desde unos cuatro millones en las estimaciones más conservadoras hasta sesenta millones en los relatos históricos más liberales.​​​ Por otro lado, el reino budista uigur de Qocho, por ejemplo, lo veía como un libertador y abandonó voluntariamente el imperio Qara Khitai para convertirse en vasallos mongoles. Gengis Kan también fue retratado benéficamente por fuentes del Renacimiento temprano por respeto a la gran difusión de la cultura, la tecnología y las ideas a lo largo de la Ruta de la Seda bajo el Imperio mongol.",
  "Más allá de sus éxitos militares, los logros civiles de Gengis Kan incluyeron el establecimiento de la ley mongola y la adopción del alfabeto uigur como sistema de escritura en sus vastos territorios. También practicó la meritocracia y la tolerancia religiosa. Los mongoles actuales lo consideran el padre fundador de Mongolia por unificar las tribus nómadas del noreste de Asia.​ Al poner la Ruta de la Seda bajo un entorno político cohesivo, también facilitó considerablemente la comunicación y el comercio entre el noreste de Asia, el sudoeste asiático musulmán y la Europa cristiana, impulsando el comercio global y expandiendo los horizontes culturales de todas las civilizaciones euroasiáticas de la época.​",
]
sections = [
  { "title" = "Etimología", "paragraphs" = [
      "Su verdadero nombre era Temüyín (en chino tradicional, 鐵木眞; en chino simplificado, 铁木真; pinyin, Tiěmùzhēn), que significa 'de hierro o herrero'. La versión china es T'ie mou jen, que significa 'hombre supremo en la tierra'. Gengis es el nombre que recibió tras ser entronizado como gran kan de los mongoles en 1206. Es un título que en mongol se escribe actualmente con caracteres cirílicos como Чингис Хаан, en chino es 成吉思汗 (pinyin: Chèngjísī Hàn) y en turco Cengiz Han o Cengiz Kaan.[cita requerida]",
      "En español la grafía tradicional es Gengis Kan,​ aunque también se encuentra escrito como Gengis Khan, Genghis Khan, Gengis Jan, Cingiz Jan, etc. Como variante de la realización fonética del nombre, también puede hallarse la forma Genguis Kan.",
      "La pronunciación original de su nombre en español moderno sería Chinguis Jaan (ver arriba) o Yenguis Jaan. En otras lenguas europeas, como el inglés o el francés, la ortografía más habitual es \"Genghis Khan\", ya que en estos idiomas no existe el sonido \"j\" /χ/, y se representa con kh, que tiene valor fonético de /k/ aspirada en esas lenguas.​",
    ] },
  { "title" = "Biografía", "paragraphs" = [
      "Temüyín nació en un ambiente aristocrático, en una sociedad profundamente feudal. Fue el primer hijo de Hoelun, segunda esposa de Yesügei, que era el jefe del clan Borjigin en la confederación nómada mongola Jamag,​ sobrino de Ambaghai y Qutula Kan,​​ y aliado de Toghrul de la tribu Keraita.​ Temüyín estaba emparentado por parte de su padre con Qabul Kan (un noble que había hostilizado las fronteras de la China yurchen y recibido de ellos el título de kan), Ambaghai y Qutula Kan, que habían encabezado la confederación Khamag Mongol y eran descendientes de Bodonchar Munkhag (c. 900),​​ mientras que su madre, Hoelun, pertenecía al sublinaje Olkunut de la tribu Jongirad.​​ El origen noble de Temüyín le facilitó, más adelante, solicitar ayuda a las demás tribus mongolas y, finalmente, consolidarlas.​",
      "La fecha y el lugar de nacimiento de Gengis Kan son bastante inciertos; los relatos históricos asignan fechas de nacimiento que van desde 1155 a 1182 y una gran variedad de posibles lugares de nacimiento. El historiador árabe Rashid al-Din afirmó que Gengis Kan nació en 1155, mientras que la Historia de Yuan anota su año de nacimiento como 1162, y fuentes tibetanas presentan inverosímilmente 1182 como la fecha correcta. Estudios históricos modernos han confirmado en gran medida que la fecha de 1162 presentada por la historia china es la más realista, dados los importantes problemas asociados a cómo las fechas de 1155 o 1182 se reflejarían en otros acontecimientos de la línea temporal de Gengis Kan.​ Aceptar una fecha de nacimiento en 1155, por ejemplo, convertiría a Gengis Kan en padre a la edad de 30 años e implicaría que comandó personalmente la expedición contra los tanguts a la edad de 72 años. La Historia secreta de los mongoles relata que Temüyín era un bebé durante el ataque de los merkits, mientras que una fecha de nacimiento de 1155 le habría hecho tener 18 años.​ La fecha de 1162​ ha sido confirmada por varias fuentes, incluyendo un estudio de 1992 sobre el calendario mongol encargado por la UNESCO, que sugirió la fecha concreta del 1 de mayo de 1162.",
      "El lugar de nacimiento de Gengis Kan está en gran medida rodeado de misterio, con una amplia gama de ubicaciones propuestas, muchas de ellas en las proximidades de la montaña Burjan Jaldun. Uno de estos lugares es Dulun-Boldaq, que se encuentra cerca de los ríos Onon y Kerulen.​",
    ] },
  { "title" = "Unificación y expansión", "paragraphs" = [
      "Al final del siglo XII los yurchen en China promovieron una campaña contra los tártaros, a quienes habían utilizado anteriormente para eliminar a Qabul Kan, y que ahora se habían vuelto demasiado fuertes, empezando a resultar una amenaza. Para ello propusieron a los clanes keraitas (bajo el mando de Togril) luchar contra sus vecinos por el oeste mientras los propios yurchen atacarían por el sur. Al lado de su aliado lucharían Temüyín y sus hombres.",
      "Cuando la campaña terminó, los tártaros habían dejado de ser un pueblo independiente y habían sido sometidos al poder de ambos clanes. Los chinos otorgaron títulos a sus aliados, pero en estos se reflejaba una subordinación de Temüyín a Togril, que recibió el título de wang (rey). Después de esta importante victoria ambos aliados siguieron sometiendo a una serie de tribus vecinas y ampliando aún más su poder. Y Jamukha, viendo semejante ascensión, reunió una coalición de todas las tribus descontentas o resentidas con Temüyín y su aliado.",
      "El Wang-Heang Togril, quizás también asustado por el creciente aumento de poder de Temüyín, ahora su anda, o debido a su avanzada edad, comenzó a desarrollar una actitud reacia a colaborar, hasta que acabó significando la ruptura. Concretamente, el desencadenante fue la negativa del Togril a dar a su hija en matrimonio a Jochi (hijo mayor de Temüyín) esto provocó la ruptura y el preludio para la guerra entre ambas facciones. El Wang-Kan se alió con Jamukha y le puso al frente de su ejército. Cuando se produjo el enfrentamiento las divisiones internas entre la facción de Jamukha y Togril les llevaron a la derrota, así como el abandono de muchos clanes que luchaban a su lado para adherirse voluntariamente a la causa de Temüyín, bajo la que veían mejores posibilidades de futuro.",
    ] },
  { "title" = "Campañas militares, 1207-1227", "paragraphs" = [
      "Durante el ascenso político de Gengis Kan en 1206, el Imperio Mongol creado por Gengis Kan y sus aliados compartía sus fronteras occidentales con las de la dinastía tangut de Xia Occidental. Al este y al sur de la dinastía Xia Occidental se encontraba la dinastía Jin, militarmente superior, fundada por los yurchens manchúes, que gobernaban el norte de China además de ser los gobernantes supremos tradicionales de las tribus mongolas durante siglos.​",
      "Si bien era militarmente inferior a su vecina Jin, Xia Occidental seguía ejerciendo una importante influencia en las estepas septentrionales adyacentes.​ Tras la muerte del líder de los keraitas Ong Kan a manos del emergente imperio mongol de Temüjín en 1203, el líder keraita Nilqa Senggum lideró a un pequeño grupo de seguidores hacia Xia Occidental antes de ser expulsado posteriormente de este territorio.​",
      "Utilizando como pretexto el refugio temporal de su rival Nilga Senggum en Xia Occidental, Temüjín lanzó una incursión contra el estado en 1205 en la región de Ejin.​ Al año siguiente, en 1206, Temüjín fue proclamado formalmente Gengis Kan, gobernante de todos los mongoles, marcando el inicio oficial del Imperio Mongol, y ese mismo año el emperador Huanzong de Xia Occidental fue depuesto por Li Anquan en un golpe de Estado. En 1207, Genghis lideró otra incursión en Xia Occidental, invadiendo la región de Ordos y saqueando Wuhai, la principal guarnición a lo largo del río Amarillo, antes de retirarse en 1208. A continuación, Gengis empezó a prepararse para una invasión a gran escala, organizando a su pueblo, su ejército y su estado para prepararse primero para la guerra.​",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "Según la Historia de Yuan, documento oficial encargado durante la dinastía Ming de China, Gengis Kan murió durante su última campaña contra Xia Occidental, cayendo enfermo el 18 de agosto de 1227 y falleciendo el 25 de agosto de 1227.​ La causa exacta de su muerte sigue siendo un misterio, y se atribuye a diversas causas: enfermedad, muerte en combate o heridas sufridas durante la caza o en batalla.​​​Según La historia secreta de los mongoles, Gengis Kan se cayó de su caballo mientras cazaba y murió a causa de la herida. La Crónica de Galitzia y Volinia afirma que fue muerto en batalla contra Xia occidental, mientras que Marco Polo escribió que murió tras la infección de una herida de flecha que recibió durante su última campaña.​ Crónicas mongolas posteriores relacionan la muerte de Gengis con una princesa de Xia Occidental tomada como botín de guerra. Una crónica de principios del siglo XVII relata incluso la leyenda de que la princesa escondió una pequeña daga y lo apuñaló o castró.​ Sin embargo, todas estas leyendas se inventaron mucho después de la muerte de Gengis Kan.​ Por el contrario, un estudio de 2021 concluyó que probablemente murió de peste bubónica, tras investigar reportes de los signos clínicos que presentaron tanto el Kan como su ejército, que a su vez coincidían con los síntomas asociados a la cepa de peste presente en Xia Occidental en aquella época.​",
      "Años antes de su muerte, Gengis Kan pidió ser enterrado sin marcas, según las costumbres de su tribu.​Tras su muerte, su cuerpo fue devuelto a Mongolia y presumiblemente a su lugar de nacimiento en Khentii Aimag, donde muchos suponen que está enterrado en algún lugar cerca del río Onon y la montaña Burjan Jaldun (parte de la cordillera de Jenti). Con todo, se desconoce actualmente el paradero de su tumba. Según la leyenda, la escolta funeraria mató a todo el que se cruzara en su camino para ocultar dónde fue enterrado finalmente. El mausoleo de Gengis Kan, construido muchos años después de su muerte, es su monumento conmemorativo, pero no su lugar de enterramiento. En la actualidad, la búsqueda de la tumba perdida del Gran Kan se ha convertido en uno de los grandes retos de la arqueología moderna.​",
    ] },
]

[articles.fr]
text = "Temüjin Borjigin, dit Gengis Khan, né vers 1155 ou 1162 dans le Khamag Mongol, l'actuelle province de Khentii en Mongolie, et mort en août 1227 dans l'actuel xian de Qingshui (Chine), est le fondateur de l'Empire mongol. Temüjin est l'aîné des enfants de Yesügei, un chef mongol du clan Borjigin, et de sa femme Hö'elün."
title = "Gengis Khan"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Gengis_Khan"
intro = [
  "Temüjin Borjigin, dit Gengis Khan, né vers 1155 ou 1162 dans le Khamag Mongol, l'actuelle province de Khentii en Mongolie, et mort en août 1227 dans l'actuel xian de Qingshui (Chine), est le fondateur de l'Empire mongol.",
  "Temüjin est l'aîné des enfants de Yesügei, un chef mongol du clan Borjigin, et de sa femme Hö'elün. À l'âge de 8 ans, son père meurt et sa famille est abandonnée par sa tribu. Après une jeunesse réduite à la pauvreté, il s'associe à deux puissants chefs des steppes, Djamuqa et Toghril, qui l'aident à enlever, pour l'épouser, sa future femme Börte. En 1187, un conflit éclate avec Djamuqa et Gengis Khan est défait. Il pourrait avoir été sujet de la dynastie Jin avant de revenir sur la scène politique mongole en 1196. En 1203, il affronte ses deux anciens alliés. Après avoir vaincu les Naïmans, il soumet Toghril et exécute Djamuqa, devenant le dernier khan de la steppe mongole.",
  "En 1206, lors d'un qurultay (assemblée exécutive formée de notables et de militaires), Temüjin prend le titre de Gengis Khan. Il mène alors des réformes destinées à assurer la stabilité à long terme. Il transforme la structure tribale des Mongols en une méritocratie intégrée, vouée au service de la famille régnante. Après avoir déjoué une tentative de coup d'État d'un puissant chaman, Gengis Khan cherche à consolider son pouvoir. En 1209, il entreprend d'envahir la Chine, en menant la conquête des Xia occidentaux, qui acceptent de se soumettre l'année suivante. Il lance ensuite une campagne contre la dynastie Jin qui se termine en 1215 avec la prise de Zhongdu (Pékin). Son général Djebé annexe les Kara-Khitans en 1218. En 1219, il soumet l'Empire khwarazien par une invasion qui dévaste les grandes villes de Transoxiane et du Grand Khorasan, tandis que ses généraux Djebé et Subötai atteignent la Géorgie et la Rus' de Kiev. Gengis Khan meurt en 1227, tandis qu'il combat les Xia occidentaux rebelles.",
  "Son fils Tolui assure la régence durant un interrègne de deux ans, jusqu'à ce que le troisième fils de Gengis Khan, Ögedei, accède au trône en 1229.",
]
sections = [
  { "title" = "Nom et variantes", "paragraphs" = [
      "Gengis Khan (mongol : ᠴᠢᠩᠭᠢᠰᠬᠠᠭᠠᠨ, API Khalkha : [ˈtʃɪŋɡɪs ˈxɑːŋ], VPMC : Činggis qaɣan, cyrillique : Чингис Хаан, Tchinguis Khaan, MNS : Chingis Khaan, littéralement : « souverain universel »), est d'abord nommé Temüjin (mongol : ᠲᠡᠮᠦᠵᠢᠨ, cyrillique : Тэмүжин, Témudjin).",
      "Il n'existe pas de système de romanisation universel utilisé pour le mongol. Par conséquent, l'orthographe moderne des noms mongols varie considérablement et entraîne des différences de prononciation. Le titre honorifique « Gengis » dérive du mongol ᠴᠢᠩᠭᠢᠰ, qui se romanise en Činggis. En chinois, le titre se lit Chéngjísī (成吉思-, et en persan Čəngīz (چنگیز). Comme l'arabe ne possède pas de son similaire à [tʃ], les auteurs retranscrivent le nom sous la forme J̌ingiz, tandis que les auteurs syriaques préfèrent Šīngīz.",
      "Le nom « Gengis » est introduit en Europe au XVIIIe siècle à partir d'une mauvaise lecture de sources persanes, les orthographes du nom ont pour variante « Chinggis », « Chingis », « Jinghis » et « Jengiz ». Son nom de naissance « Temüjin » (ᠲᠡᠮᠦᠵᠢᠨ ; 鐵木真 ;Tiěmùzhēn) est parfois également orthographié « Temuchin ».",
    ] },
  { "title" = "Biographie", "paragraphs" = [
      "Le contexte historique dans lequel vit Gengis Khan est celui des empires nomades. Le peuple turco-mongol dont est issu Gengis Khan descendrait des Xianbei, pour les Chinois Hu de l'Est, hypothèse la plus probable. Ces proto-mongols parlent le khitan, une langue affiliée au mongol. Ce sont des pasteurs nomades, qui au IIe siècle ont chassé les Xiongnu, établis dans l'actuelle Mongolie orientale depuis le IIe siècle av. J.-C. Fondateurs du premier Empire des steppes, ces Huns d'Asie aux origines mal connues sont en effet les premiers nomades à dominer un ensemble territorial et y installent une capitale : Long Cheng.",
      "Au IVe siècle, c'est au tour des tribus du Kaghanat Rouran de contrôler une région qui s'étend du Xinjiang à la Sibérie. Peuple de métallurgistes, ils sont les premiers à appeler leur chef Khagan, (aussi écrit sous la forme Khaan). Ce titre se différencie du Khan, il lui est supérieur et peut être compris comme « Grand Khan ». Il serait l'équivalent de la dignité impériale en Europe.",
      "En 552, ce sont les Göktürks qui s'emparent du territoire. Ils surveillent les accès aux routes de la soie et avec Byzance attaquent les Sassanides. L'espace de domination s'agrandit encore, allant du Caucase aux côtes de la Mer Jaune. Avec les Köktürks naît l'idée du chef au mandat divin, homme-providence qui voue sa vie à la soumission des peuples étrangers. De plus, le système administratif türk inspirera les Mongols, avec la création d'une trentaine de bureaux destinés aux affaires étrangères, civiles ou encore militaires. C'est aussi la date d'introduction du système d'écriture türk, remplacé plus tard par l'alphabet ouïghour (ou vieux ouïghour, dérivé de l'alphabet syriaque et à l'origine de la Mongol et de la mandchoue), un élément important dans l'unité et la gestion de cet Empire des steppes.",
    ] },
  { "title" = "Succession", "paragraphs" = [
      "Les tribus de la steppe mongole n'ont pas de système de succession fixe, mais ont souvent recours à une forme d'ultimogéniture (succession du plus jeune fils) en ce qui concerne les biens, car le plus jeune aurait moins eu l'occasion d'en acquérir Ce type de succession ne s'applique pas aux titres.",
      "L'Histoire secrète rapporte que Gengis aurait choisi son successeur lors des préparatifs de l'invasion khwarazmienne en 1219 ; Rashid al-Din, d'autre part, affirme que la décision est prise avant la campagne finale de Gengis contre les Xia.",
      "« Nos descendants se vêtiront d'habits dorés, mangeront des mets gras et sucrés, monteront d'excellents coursiers, presseront dans leurs bras les plus belles femmes et oublieront qu'ils nous le doivent. »",
    ] },
  { "title" = "Mariages et descendance", "paragraphs" = [
      "Temüjin se marie vers 1178 avec Börte, fille de Deï-Setchen (en) de la tribu des Qonggirad. Elle reste son épouse principale jusqu'à sa mort. Ils ont neuf enfants, quatre fils et cinq filles, qui deviennent tous des personnages majeurs de l'empire mongol. Gengis Khan accorde aux fils de Börte des apanages substantiels et marie ses filles dans des familles importantes afin de s'assurer leur soutien. Les enfants de Börte sont :",
      "Qojin (en), née vers 1179, qui épouse Butu de la tribu des Ikires (veuf de Temülün, la sœur de Gengis Khan) entre 1203 et 1206 ;",
      "Djötchi, né vers 1182 et mort avant son père, dont la paternité est incertaine bien que Gengis Khan lui-même ne l'ait jamais remise en doute ; son apanage, le long de l'Irtych, est à l'origine de la Horde d'or ;",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "Bien qu'il soit aujourd'hui célèbre pour ses conquêtes militaires, on sait très peu de choses sur la carrière militaire personnelle de Gengis Khan. Ses compétences sont davantage adaptées à l’identification de commandants potentiels. Sa réforme socio-militaire, qui instaure une chaîne de commandement méritocratique, donne à l'armée mongole une supériorité militaire, même si elle n'est pas innovante sur le plan technique ou tactique. L'armée de Gengis Khan est caractérisée par sa discipline draconienne, sa capacité à recueillir et à utiliser efficacement des renseignements militaires, sa maîtrise de la guerre psychologique et sa volonté d'être totalement impitoyable.",
      "Gengis Khan reprend et met en exergue les atouts des Mongols, ce qui sera la base des conquêtes mongoles. Mais Gengis Khan participe en de nombreux points au développement de nouvelles stratégies et tactiques de combat.L'armée repose sur un système décimal, sans doute d'origine achéménide, le « tümen », les armées étant divisées en groupes de 10, 100, 1 000 et 10 000 hommes. Les liens étroits des clans mongols sont adaptés aux unités de combat, mettant l'accent sur le collectif avec les recrues au centre et les vétérans sur les ailes.",
      "Dès 1217, Gengis s'intéresse au problème des attaques des places fortifiées. Aidés par des artilleurs chinois qu'il forme en corps d'armée, ils mettent progressivement au point les techniques qui feront d'eux de redoutables meneurs de sièges, en particulier grâce à la poudre à canon.",
    ] },
]

[articles.de]
text = "Dschingis Khan, ursprünglich Temüdschin oder Temüüdschin (* wahrscheinlich um 1155, 1162 oder 1167; † wahrscheinlich am 18. August 1227), war ein Khagan der Mongolen und Begründer des Mongolischen Reichs."
title = "Dschingis Khan"
lang = "de"
url = "https://de.wikipedia.org/wiki/Dschingis_Khan"
intro = [
  "Dschingis Khan, ursprünglich Temüdschin oder Temüüdschin (* wahrscheinlich um 1155, 1162 oder 1167; † wahrscheinlich am 18. August 1227), war ein Khagan der Mongolen und Begründer des Mongolischen Reichs. Er vereinte die mongolischen Stämme und eroberte weite Teile Zentralasiens und Nordchinas. Seine Regierungszeit als erster Khagan der Mongolen dauerte von 1206 bis 1227.",
  "Er vereinte die mongolischen Stämme auf dem Territorium der heutigen zentralen und nördlichen Mongolei und führte sie zum Sieg gegen mehrere benachbarte Völker. Nach der Ernennung zum Khagan aller Mongolen begann er mit der Eroberung weiterer Gebiete; im Osten bis an das Japanische Meer und im Westen bis zum Kaspischen Meer. Um dieses Reich zu verwalten, ließ er eine eigene Schrift entwickeln und setzte schriftliche und für alle verbindliche Gesetze durch. Nach seinem Tod wurde das Reich unter seinen Söhnen aufgeteilt und noch weiter vergrößert, fiel aber zwei Generationen später auseinander.",
]
sections = [
  { "title" = "Name und Schreibweisen", "paragraphs" = [
      "Der Geburtsname war Temüdschin (mongolisch Тэмүжин, mongolisch ᠲᠡᠮᠦᠵᠢᠨ temüǰin), auch Temüüdschin geschrieben (mongolisch Тэмүүжин); er bedeutet im Tatarischen „der Schmied“. Temüdschin erhielt diesen Namen von seinem Vater. Nach alter mongolischer Sitte stammte der Name von einem gefangenen Feind.",
      "Der Titel Dschingis Khan (mongolisch Чингис Хаан, mongolisch ᠴᠢᠩᠭᠢᠰ ᠬᠠᠭᠠᠨ činggis qaγan) wurde Temüdschin im Jahr 1206 verliehen (siehe unten). Andere Schreibweisen sind Genghis Khan, Cinggis-Khan, Dschingis-Chan und Djingis Chan. Die im europäischen Raum weit verbreitete Schreibweise Genghis Khan geht auf D’Herbelot zurück, von dem sie Gibbon übernahm.",
      "Dschingis Khan entstand aus der chinesisch-türkischen Zusammensetzung chêng-sze khan (aus chinesisch chêng-sze: „edler Reiter/Ritter“ und alttürkisch khan: „Herrscher“) mit der Bedeutung: „Herrscher der edlen Reiter“.",
    ] },
  { "title" = "Leben", "paragraphs" = [
      "1206: Ernennung Temüdschins zum mongolischen Khagan Dschingis Khan auf dem Kuriltai an der Quelle des Onon.",
      "1207/09: Unterwerfung der Tanguten und Errichtung eines Heerlagers auf der chinesischen Seite der chinesischen Mauer für weitere Eroberungszüge.",
      "1211: Eindringen in das Gebiet der Jin-Dynastie und Vordringen bis zur Halbinsel Shandong.",
    ] },
  { "title" = "Nachwirkung", "paragraphs" = [
      "Die nach Dschingis Khans Tod geschriebene Geheime Geschichte der Mongolen stellt heraus, dass er aufgrund seines Werdeganges höchsten Wert auf die persönliche Treue und Loyalität der Menschen gegenüber ihrem Herren oder ihren Freunden legte.",
      "Außerdem war er in religiösen Dingen sehr tolerant und bereit, jeder Glaubensrichtung und jeder Staatsphilosophie sein Ohr zu leihen. Gegen Ende seines Lebens begriff er offenbar, dass seine Regierungsprinzipien nicht die einzig gültigen waren, und setzte Berater wie den Kitan Yelü Chucai und den Choresm-Türken Machmud Jalatwatsch in Spitzenpositionen ein, um sein Reich umfassend zu organisieren. Allerdings trug dieses Bemühen erst nach seinem Tod unter seinen Söhnen und Enkeln Früchte. Dschingis Khans Reich wurde weiter ausgebaut und war gegen 1260 im Inneren so gut organisiert und befriedet, wie es für die meisten seiner Territorien zu keiner anderen Zeit der Fall war. Entsprechend spricht man von dieser Epoche auch als Pax Mongolica und das Reich umfasste in seiner größten Ausdehnung – je nach Quelle – circa 26 bis 31 Millionen km² und war somit etwa anderthalb mal bis doppelt so groß, wie Russland als heute größter Staat.",
    ] },
  { "title" = "Nachkommen", "paragraphs" = [
      "Dschingis Khan zeugte mit einer Vielzahl von Frauen zahlreiche Kinder, und mehrere seiner Söhne und Enkel taten es ihm darin gleich. Nach Schätzungen sind heute etwa 16 Millionen Männer Nachfahren des Mongolenherrschers. Diese Schätzung wird nicht allgemein akzeptiert. Zwischen Pazifischem Ozean und Kaspischem Meer ist bei etwa acht Prozent der männlichen Bevölkerung eine gemeinsame genetische Signatur im Y-Chromosom feststellbar. Forscher datierten den Ursprung dieses Merkmals wenige Generationen vor Dschingis Khan. Es wird darum angenommen, dass er und seine nahen männlichen Verwandten möglicherweise für dessen ungewöhnlich starke Verbreitung verantwortlich waren. Die Bestätigung dieser Spekulation könnte allein die Analyse seiner DNS liefern.",
    ] },
]

[articles.it]
text = "Genghis Khān (o , o Chinggis; in mongolo Чингис хаан, Čingis khaan; nato come Temüjin Borjigin, in mongolo: ᠲᠡᠮᠦᠵᠢᠨ, in cirillico: Тэмүжин; alto corso dell'Onon, 16 aprile 1162 – Yinchuan, 18 agosto 1227) è stato un condottiero e sovrano mongolo. Dopo aver unificato le tribù mongole e turche, creò l'Impero mongolo, uno degli imperi più grandi del mondo che, sotto di lui, arrivò dalla zona settentrionale della Cina fino alla Persia nord-orientale."
title = "Gengis Khan"
lang = "it"
url = "https://it.wikipedia.org/wiki/Gengis_Khan"
intro = [
  "Genghis Khān (o , o Chinggis; in mongolo Чингис хаан, Čingis khaan; nato come Temüjin Borjigin, in mongolo: ᠲᠡᠮᠦᠵᠢᠨ, in cirillico: Тэмүжин; alto corso dell'Onon, 16 aprile 1162 – Yinchuan, 18 agosto 1227) è stato un condottiero e sovrano mongolo.",
  "Dopo aver unificato le tribù mongole e turche, creò l'Impero mongolo, uno degli imperi più grandi del mondo che, sotto di lui, arrivò dalla zona settentrionale della Cina fino alla Persia nord-orientale. Con i suoi successori arrivò alla conquista della maggior parte dell'Asia centrale, dell'intera Cina, della Rus' di Kiev, della Persia, del Medio Oriente e di parte dell'Europa orientale, dando vita, anche se per breve tempo, al più vasto impero terrestre, per continuità territoriale, della storia umana. Fu sepolto in Mongolia, in un luogo imprecisato.",
  "Gengis Khan e il suo impero hanno una temibile reputazione, rimasta molto impressa nelle storie locali dei Paesi in cui passarono le sue truppe. Molti cronisti medievali e storici moderni descrivono le conquiste di Gengis Khan come distruzione su scala senza precedenti, tali da causare un drastico calo della popolazione a causa di stermini di massa e carestia. Una stima prudente parla di circa quattro milioni di civili (mentre altre cifre vanno da quaranta a sessanta milioni) che persero la vita a causa delle sue campagne militari. Al contrario, i buddisti uiguri del Regno di Qocho, che lasciò volentieri l'impero dei Kara Khitay per diventare vassallo dei Mongoli, lo vedevano come un liberatore. Gengis Khan è stato anche ritratto positivamente dalle prime fonti del Rinascimento in segno di rispetto per la grande diffusione della cultura, della tecnologia e delle idee sotto l'Impero mongolo, ma anche per aver combattuto ferocemente contro numerose nazioni del mondo islamico. Alla fine della vita del Gran Khan, l'Impero mongolo occupò una parte sostanziale dell'Asia centrale e della Cina. Grazie ai suoi eccezionali successi militari, Gengis Khan è considerato come uno dei più grandi conquistatori di tutti i tempi (insieme ad altre grandi personalità storiche come Alessandro Magno, Saladino, Giulio Cesare, Attila, Carlo Magno e Napoleone).",
  "Oltre ai suoi successi militari, Gengis Khan fece progredire l'Impero mongolo anche in altri modi. Decretò l'adozione della scrittura uigura come sistema di scrittura dell'Impero mongolo. Praticò la meritocrazia e incoraggiò la tolleranza religiosa nell'Impero mongolo, unificando le tribù nomadi del Nord-est asiatico. Gli attuali mongoli lo considerano il padre fondatore della Mongolia. È anche accreditato di aver costituito un ambiente politico omogeneo per l'intera via della seta. Ciò ha facilitato le comunicazioni e gli scambi commerciali tra l'Asia nordorientale, l'Asia sudoccidentale musulmana e l'Europa cristiana, ampliando gli orizzonti culturali di tutte e tre le aree.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "I primi anni di vita di Gengis Khan sono poco noti e controversi perché descritti solamente dopo la sua morte. L'anno di nascita è incerto: alcuni storici propongono il 1155 e altri il 1167, mentre le cronache cinesi indicano il 1162.",
      "La madre Hoelun, della tribù dei Merkit, da poco sposata con Yeke-Ciledu, fratello minore del capo della tribù dei Merkit, era stata rapita in una scorreria organizzata da Yesugei con l'aiuto dei suoi fratelli, Nekun-taiji e Daritai. Yesugei era il capo del clan Borjigin della tribù dei Kereiti, Mongoli praticanti il cristianesimo nestoriano. I due ebbero un primo figlio (ne ebbero altri quattro: i tre maschi Khasar, Qachiun e Temüge e la femmina Tamülün), cui diedero il nome di Temüjin, in onore di un valoroso capitano tartaro che il padre aveva appena catturato in battaglia. Secondo alcuni, il nome deriva da tomor (\"ferro\").",
      "Temüjin sarebbe nato tra le montagne della provincia del Hėntij, precisamente sul Deluun Boldog (\"colle della malinconia\"), che si trova vicino al monte sacro Burhan Haldun, lungo le rive del fiume Onon e vicino al fiume Hėrlėn, presso Lamyn Uhaa (pressappoco l'attuale sum di Bindėr, non lontano da Ulan Bator); altri pensano che Gengis Khan fosse nato vicino a Dadal. Secondo la tradizione mongola, Gengis Khan nacque \"il giorno chiaro del primo mese dell'estate dell'anno del cavallo d'acqua del terzo ciclo\" (ogni ciclo del calendario mongolo durava 60 anni) e venne alla luce stringendo nel piccolo pugno un grumo di sangue, segno che il suo destino sarebbe stato quello di un grande guerriero.",
    ] },
  { "title" = "Caratteristiche fisiche", "paragraphs" = [
      "Non esistono ritratti o raffigurazioni attendibili di Temujin in quanto sono tutte opere postume e da ritenersi interpretazioni artistiche fantasiose, compresa la più famosa raffigurazione conservata al National Palace Museum di Taipei (Taiwan).",
    ] },
  { "title" = "Leggende", "paragraphs" = [
      "Secondo una teoria divenuta popolare nella cultura giapponese, Gengis Khan e il celebre comandante giapponese Minamoto no Yoshitsune furono la stessa persona: quest'ultimo non sarebbe davvero morto suicida, bensì fuggito segretamente in Mongolia.",
      "Gengis Khan era un discendente di Bondonchar Munkhag, che, secondo una leggenda riportata dalla Storia segreta dei mongoli fu concepito dalla madre Alan Goa dopo la morte del marito, in seguito alla visita notturna di un essere luminoso che la donna identificò con il dio Tengri.",
    ] },
  { "title" = "L'eredità di Gengis Khan", "paragraphs" = [
      "Gengis Khan ebbe da varie mogli e concubine numerosi figli e figlie, a ciascuno dei quali vennero assegnati titoli e guerrieri, ma per i 4 figli maschi avuti dalla prima e principale moglie Börte furono riconosciuti i più alti onori ed il diritto di successione per le cariche più rilevanti; questi quattro erano:",
      "Djuci (Joci) + 1227, dalla cui discendenza nacquero sovrani e condottieri del Khanato dell'Orda d'Oro (Sira Ordu), ovvero i Kipchak, la Grande Orda di Saraj (-1502), l'Orda Bianca (Sibir Ordu, 1277-1581), e l'Orda Azzurra da cui derivano i khanati di Crimea (1428-1784), di Kazan' (1437-1552), di Kasimov (1454), di Astrachan' (1466-1557).",
      "Chagatai (Čagatay), vi discende l'Orda Nera (Kara Ordu) dei Cara Chitai di Kirman e di Buchara (-1369) da cui discenderanno i Moghul imperatori dell'India (-1858).",
    ] },
]

[articles.tr]
text = "Cengiz Han, (doğum adıyla Temuçin ya da Timuçin, 1162 - Ağustos 1227), Moğol İmparatorluğu'nun kurucusu ve ilk Han'ı olan Moğol komutan ve hükümdardır. Hükümdarlığı döneminde gerçekleştirdiği hiçbir savaşı kaybetmeyen Timuçin, dünya tarihinin en büyük askerî liderlerinden birisi olarak kabul edilmektedir."
title = "Cengiz Han"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Cengiz_Han"
intro = [
  "Cengiz Han, (doğum adıyla Temuçin ya da Timuçin, 1162 - Ağustos 1227), Moğol İmparatorluğu'nun kurucusu ve ilk Han'ı olan Moğol komutan ve hükümdardır. Hükümdarlığı döneminde gerçekleştirdiği hiçbir savaşı kaybetmeyen Timuçin, dünya tarihinin en büyük askerî liderlerinden birisi olarak kabul edilmektedir. Bu sebeple doğum ismi olan Timuçin'den çok, \"güçlü hükümdar\" anlamına gelen Cengiz Han ismiyle anılmaktadır. 13. yüzyılın başında Orta Asya'daki tüm göçebe bozkır kavimlerini birleştirip, bir ulus hâline getirerek Moğol siyasi kimliği çatısı altında toplamıştır. Cengiz Han, hükümdarlığı döneminde 1206-1227 arasında, Kuzey Çin'deki Batı Xia ve Jin Hanedanı; Türkistan'daki Kara Hıtay, Maveraünnehir; Harezm, Horasan ve İran'daki Harezmşahlar, Kafkasya'daki Gürcüler, Deşt-i Kıpçak'taki Rus Knezlikleri, Kıpçaklar ile İdil Bulgarları üzerine seferler yaptı. Bunların sonucunda Pasifik Okyanusu'ndan Hazar Denizi'ne ve Karadeniz'in kuzeyine kadar uzanan bir imparatorluk kurdu.",
  "Bozkır geleneğinden gelen onlu teşkilatı kullanarak yetenek ve kişilerin bireysel üstünlüğüne dayanan meritokratik bir ordu oluşturan Cengiz Han'ın büyük bir asker olarak ün kazanmasının temelinde, kurduğu posta teşkilatı ve casus ağı ile istihbarat sanatına verdiği büyük değer önemli bir yer tutmaktadır. Yaptığı seferler sonucunda pek çok kent tahrip olmuş ve milyonlarca insan da katledilmiştir ancak Cengiz Yasası adı ile metinleştirilen kuralları ile işkenceyi, yalan söylemeyi, hırsızlık yapmayı ve zina etmeyi de yasaklamış; zanaatkârlar, doktorlar, belli bilgi becerisi olan eğitimli kişiler ve her dinden din adamlarına, hangi ulustan olursa olsun aralarında bir ayrım yapılmaksızın saygı gösterilmesi ve vergiden muaf tutulmalarını da yasalaştırmıştır.",
  "Cengiz Han aynı zamanda, halkının yazıya sahip olmasını sağlamak için Uygurlardan önemli kişileri başkenti Karakurum'a çağırmış ve Moğolca için Uygur alfabesini uyarlatarak bunu çocuklarına da öğretmesini istemiştir. Bu sayede Moğol dilinin de yazılı duruma getirilmesini sağlamıştır.",
  "Cengiz Han, 1227 yılında Kuzey Çin'deki Tangutlar'ı yendiği seferden dönerken bilinmeyen bir nedenle öldü. Mezarının yeri ise günümüzde hâlâ bilinmemektedir. Ünlü bir söylentiye göre, kendisi ölmeden önce mezarının gizli tutulmasını vasiyet etmiş, o ölünce de yakınları onu bilinmeyen bir yere gömmüş, daha sonra cenazeye katılan herkes mezarın yeri hiçbir biçimde bilinmesin diye kendilerini öldürmüştür. Fakat bu iddia, birçok kişi tarafından uydurma olarak kabul edilir. Günümüzde arkeologlar Cengiz'in gömüldüğü yere yaklaştıklarını düşünüyorlar. İlerleyen yıllarda modern Moğolistan'ın olağanüstü bir keşfe ev sahipliği yapması mümkündür.",
]
sections = [
  { "title" = "Ataları ve kökleri", "paragraphs" = [
      "Cengiz Han'ın soyağacı yarı mitolojik bir biçimde sis perdesi arkasındadır. Onun atalarının ve kendisinin doğuş efsanesi, Moğol mitolojisinin önemli belgelerindendir. Yazılış tarihi itibarı ile Cengiz Han'ın yaşadığı döneme en yakın olanı Şamanizm etkilerinin görüldüğü, 1240 yılında Moğolca olarak kaleme alınmış olan Moğolların Gizli Tarihi adlı yapıta göre Cengiz Han'dan 10 kuşak önce yaşayan Alangoya, Cengiz Han soyunun efsanevi büyük annesi olarak kabul edilmiştir. Moğolların Gizli Tarihinde yer alan efsaneye göre Alangoya dul kaldıktan sonra evlenmediği hâlde üç oğlu daha olmuştur. Cengiz Han ve onun bağlı olduğu Börçiginler bu çocuklardan “Bodoncar” adlı en küçük olanının soyundan gelmektedir. Alangoya efsanesi yalnızca Cengiz Han'ı değil onunla birlikte “Nirun” yani ışığın çocukları adı verilen bir yığın boyu ilgilendirse de Cengiz Han soyunun en büyük efsanesi olarak kabul edilmiştir. Nirun boylarından öncelikle Cengiz Han'ın boyu Borciginler ardından Tayciutlar, Barlaslar, Derbenler, Salciutlar ve başka birkaç boy daha sayılabilir. 1140 yılında Moğol kabilelerinden Börçiginlere ilişkin Kabul, bütün Moğolların ilk lideri olarak “Han” sanını almıştır. Cengiz Han'ın babası Yesügey Bahadır onun torunudur.",
      "Kabul Han ve onun ardılı Ambakay Han zamanında Moğollar, Çin'deki Jin İmparatorluğu ile mücadele edecek kadar güçlenseler de Tatarlar, Çinlileri hoşnut etmek için Ambakay'ı Çin'e teslim ettiler. Ambakay hiç alışılmadık bir biçimde, “tahta eşek şekli” denen bir duruma sokularak çarmıha gerilip infaz edildi. Cengiz Han'ın büyük amcası Kutua, bu hakarete Çin üzerine ve Tatarlara bir dizi saldırı düzenleyerek yanıt verdi ve bu akınlar sonunda “Moğol Herkülü” sanını kazandı. Ancak, 1160 yılında, ayrıntıları bilinmeyen bir dizi olay sonunda, Kuzey Çin'in egemeni Jin Hanedanı, Moğolları hezimete uğrattı. Moğollar bir süre karmaşa içinde dağıldılar. Sefalet içinde yüzen bu karmaşık durumdaki Moğollar'ın içerisindeki önemsiz liderlerden biri olan Kabul Han'ın torunu Yesügey Bahadır, ittifaklar kurarak Moğolları güçlendirmeye çalıştı. Moğolların batı komşularından biri olan Türk boylarından Keraitler idi. Keraitler 200 yıldan beri Nasturi Hristiyan'dı. Hristiyan Keraitlerin o zamanki lideri Tuğrul idi. Tuğrul, 1160 yılında iç sorunlar sonucu tahtını yitirmişti. Moğolların lideri Yesügey, Tuğrul'a kabilesinin önderliğini yeniden ele geçirmesi için yardım etti. Tuğrul ve Yesügey anda ile kardeşlik yemini ettikten sonra, daha sonraları Moğolların yeniden ortaya çıkışında olağanüstü önem taşıdığını kanıtlayacak olan bir ittifak kurdular.",
      "Söylentilere ve efsaneye göre Yesügey Bahadır bir gün Onon Irmağı kıyılarında şahini ile avlanırken gelinleri taşımak için özel olarak ayrılmış, bir at arabasına rastladı. Yesügey, arabada oturan kıza ilk görüşte âşık olmuştu. Yesügey iki kardeşini yanına alarak ve birlikte ağır ağır giden düğün arabasına yetiştiler. Üç kardeş Onggirat boyunun Olkunat kabilesinden olan Höelin adındaki yeni evli gelini yakaladılar. Höelin başka seçme şansı olmadığı için Yesügey Bahadır'ı yeni kocası olarak kabullendi. Yesügey onunla, doğurduğu oğlan bir kahraman olacak diyerek evlenmişti.",
    ] },
  { "title" = "Doğumu", "paragraphs" = [
      "Evlilikten bir süre sonra Yesügey, Tatarlar üzerine yaptığı bir akından geri döndüğünde, karısı Höelin'in hamile olduğu haberiyle karşılandı. Kaynaklarda bebeğin doğumu sırasında Höelin'in kapısına bir yay ve ok asılarak şeytanın girmesinin engellendiği ancak yakın akrabalar ve bir kadın Şamanın ebe olarak görev yaptığı ileri sürülmektedir. Şaman, bebeği çok yakından inceleyerek, geleceği hakkında kehanette bulunabilecek bir im arayacaktı. Efsaneye göre sağ avucunun içinde sonraları gayet doğal olarak, gücün ve çok kan dökeceğinin simgesi olarak nitelendirilecek aşık kemiği biçiminde bir kan pıhtısı ile doğdu. Yesügey Bahadır düşman olduğu Tatar kabilelerinden birinin reisi olan Temuçin adlı bir kişiyi tutsak almıştı. İşte bu tutsak ve olay üzerine Yesügey Bahadır oğluna Temuçin adını verdi. Temuçin, katı, sağlam, sert, dayanıklı ve demir gibi anlamlarına gelmektedir.",
      "Arap ve İranlı tarihçilere göre Temuçin'in doğum tarihi 26 Ocak 1155'tir. Ancak Çin kaynaklarınca Temuçin, 12 Hayvanlı Türk takvimine göre domuz yılının başında dünyaya gelmiştir. Bu hesapla 12 Hayvanlı Türk Takviminde 1 yıl 12 yılı kapsadığı için 1155 ile 1167 arasında sonu 2 ile biten bütün yıllardan yola çıkarak doğum tarihinin 1162 olabileceği kabul edilmektedir. Uzmanlar Temuçin'in doğum tarihini nasıl kanıtlamaya çalışıyorlarsa doğum yerinin de kesin olarak nerede olduğunu tartışmaktalar. Cengiz Han zamanından günümüze kalan tek kaynak olan “Moğolların Gizli Tarihi” adlı yapıtta bu yerin Onon yakınlarında Dülün-Boldak adıyla bilinen bölge olduğu yazmaktadır. Bu adın anlamı “Dalak Tepeciği” idir.",
    ] },
  { "title" = "Çocukluk ve gençlik yılları", "paragraphs" = [
      "Yesügey Bahadır ve Höelin'in Temuçin'den başka Hasar, Haçi ve Temüge adlarını taşıyan üç oğlu ile Temulun adında bir kızları olmuştur. Bunun yanı sıra Temuçin'in Bekter ve Belgütay adlı iki üvey kardeşi vardı. Temuçin 9 yaşındayken, babası Yesügey Bahadır onu evlendirmek için kendisini de yanına alarak Temuçin'in annesi Höelin'in kabilesi olan Onkıratların yanına gitti. Yesügey, kayın biraderinin kızı Börte'yi oğlu Temuçin'e istedi. Börte adındaki kız Temuçin'den bir yaş büyüktü. Anlaşma gereği Temuçin orada kalacaktı. Burada evlilik yaşı olan, 10 yaşına gelene kadar evin başkanına hizmet edecekti. Fakat Yesügey Bahadır evine dönerken yolda karşılaştığı ve konuk olduğu Tatarlar tarafından, eski husumetlerinin sonucu olarak zehirlendi. Yesugey Bahadır ne olursa olsun ölmeden önce Temuçin'in geri getirilmesi için emir verdi fakat Temuçin gelmeden öldü. Temuçin ve ailesi, ilk olarak akraba kabilelerden Tayciutlara katılmaya karar vererek yanlarına gittiler ancak, Tayciutlar Temuçin ile ailesini yanlarına almak istemediler. Yesügey'in erkek kardeşleri de Höelin ve çocuklarına yardım etmediler. Bir süre sonra da Yesügey'in kabilesi Temuçin'in annesi Höelin'in yani bir kadının emri altında kalmak istemeyerek göç etti. Höelin, kabilesinin sürülerinden hiçbir hak iddia etmeyerek Burhan Haldun Dağının eteklerindeki ormanlık yamaçlara ailesi ile birlikte yerleşti. Sürü sahibi olamadıkları için et yiyemeden, süt içemeden sadece ırmakta balıkçılık yaparak, ormanda yabani meyveler ve kökler toplayarak yaşamlarını sürdürebiliyorlardı. Temuçin, on-on bir yaşlarında iken çok iyi bir arkadaş edindi. Bu çocuk Cacırat boyundan Camuka adlı kendi yaşıtında birisi idi. Sonunda dostlukları o derece ilerlemişti ki anda yani kan kardeşi olmak için and içtiler. Temuçin, 13 yaşında iken üvey…",
      "Bu olayın üzerinden bir yıl geçmişti. Aile yalnızca bir sürüye ve dokuz tane ata sahipti. Bir gün Temuçin'in üvey kardeşi Belgütay'ın marmot avlamak için kamp dışına çıktığı sırada hırsızlar kalan sekiz atı çaldılar. Temuçin ellerinde kalan son ata atladı ve sonraki iki gün boyunca hırsızların izini sürdü. Üçüncü gün sabahı bir çadıra ve çadırın yanındaki ağıldaki oldukça büyük bir at sürüsüyle ilgilenen Bughurçi adlı bir gence rastladı. Bughurçi, Temuçin'in uzun süredir koşturduğu atının durumunu görünce Temuçin'e yorgunluktan neredeyse ölmek üzere olan atını sürüsündeki zinde atlardan biriyle değiştirmesi için ısrar etti. Temuçin atını değiştirip oradan ayrılırken Bughurçi aniden bir karar verdi ve at hırsızlığı hepimizin ortak sorunu bende seninle birlikte geleceğim dedi. Üç gün sonra Temuçin ve Bughurçi hırsızlara ve çalıntı atlardan oluşan sürülere yetişti. İki arkadaş anında harekete geçerek sürünün arkasına daldı ve Temuçin'e ait olan atların iplerini kesip yedeklerine alarak dörtnala uzaklaştılar. Bughurçi'nin babasının kampına yaklaştıkları sırada Temuçin, sen olmasaydın atlarımı nasıl bulurdum gel bunları üleşelim yalnızca hangilerini almak istediğini söyle yeter dedi. Babası varlıklı biri olan Bughurçi hayır diye yanıtladı. Temuçin gerçekten Bughurçi'nin asil davranışını unutmayacak ve Bughurçi ileride yanından ayırmadığı sağ kolu, atlarının baş seyisi, zırhlı tümen komutanı ve Moğolların en büyük generallerinden biri olacaktı.",
      "Temuçin, 9 yaşındayken nişanlandığı Börte ile babasının ölmeden önce kararlaştırdığı gibi evlilik düğünü yapmak için kayınpederini ziyaret etmeye ve evlilik anlaşmasına hâlâ razı olup olmadığını sormak için üvey kardeşi Belgütay ile birlikte Kongirat ülkesine doğru yola çıktı. Temuçin'i çok iyi karşıladılar ve evlilik gerçekleşti. Evlilik tarihi olarak kesin olmamakla birlikte 1178, 1180 ve 1181 tarihleri ileri sürülmektedir. Temuçin Börte ile evlendiği zamanlarda Merkit kabilesinin büyük bir saldırısına uğradı. Bu saldırıda Temuçin kendi canını ve karargahını kurtardığı hâlde henüz yeni evlendiği eşi Börte Merkitler tarafından kaçırıldı. Bataklıkları yararak düşmanı ağır yenilgiye uğratan Temuçin, karısını onların elinden alamamış ancak bu zafer ona çok büyük bir ün ve saygınlık kazandırmıştı. Temuçin'in doğumundan önce babası Yesügey Bahadır, Keraitlerin lideri Tuğrul ile kardeşlik yemini etmişti. Temuçin, kardeşi Kasar ve üvey kardeşi Belgütay'ı yanına alarak yeni bir müttefik kazanmaya gitti. Başlarına geleni Tuğrul'a anlattı. Önceden Temuçin'in babası tarafından yardım gördüğünü hatırlayan Tuğrul Han, Temuçin'i korumasına aldı. Tuğrul onu çok iyi karşıladı ve kendisine evladım diye hitap etti. Tuğrul, Temuçin'in Cungar kabilesi şefi Camuka'ya da uğramalarını ve onlarında desteğini almalarını söyledi. Üç kardeş Camuka'ya da giderek durumu anlattılar. Temuçin'in kan kardeşi olan Camuka, kendi namusu gibi öfkelendi ve Tuğrul'u verdiği söze uyacağını teyit etti.",
    ] },
  { "title" = "1206 kurultayı ve Temuçin'in Cengiz Han oluşu", "paragraphs" = [
      "Tuğrul ile Camuka'nın ortadan kaldırılması ve Temuçin'in Merkitler'i, Naymanlar'ı, Keraitler'i, Tatarlar'ı ve diğer küçük boyları liderliği altında birleştirmesi onu Orta Asya bozkırlarındaki tek güç durumuna getirdi. 1206 yılının ilkbaharında Onon ırmağının kaynaklarında, kendisine bağlanmış olan bütün boyları bir araya getirerek büyük bir kurultay topladı. Tüm göçebe konfederasyonları birleştiren Temuçin tek bir ulus yarattı ve bu ulusa “Moğol Ulusu” adını verdi. Artık o Moğolların salt efendisi idi. 1206 kurultayının en önemli kararı Temuçin'in daha önce aldığı “Kağan” sanına ek olarak “Cengiz” sanını almasıdır. Bu tarihten sonra kendisine “Cengiz Kağan” ya da “Cengiz Han” diye söylenmesini istemiştir. Aslında bu o dönemin söyleyişi ile “Çinngiz Kan” biçiminde idi. Temuçin bu sırada 44 yaşında bulunuyordu. Moğol toplumu, Cengiz Han'dan önce örgütsüzdü. 1206 kurultayında devletin ordu ve toplumsal örgütü düzenlendi. Cengiz Han kurultayda Mukhulai'ı baş yardımcısı, süvari birliklerinin başındaki Bugurçi'yi de danışmanı olarak atadı. Celme ve Subutay kardeşleri ise binbaşı olarak atadı. Tayciutlardan kaçtığı sırada kendisini kurtaran Sorhan Şira, her iki oğlu gibi Cengiz Han'ın yaveri ve ok taşıyıcısı oldu. Bu atamalar göçebe imparatorluğun yönetiminde büyük değişiklilere damgasını vurdu. Moğol birliği geçmişte boy rekabetlerinden büyük zarar görmüştü. Cengiz Han şimdi atayacağı kişileri boy hiyerarşisine göre değil liyakate göre belirleyecekti. Anahtar sözcük ise içten bağlılık idi. Sorhan Şira ve oğulları hiçlikten yöneticiliğe gelmiş tek örnek değillerdi. Çobanlar, marangozlar vb. aynı haklara sahipti. Celme ve Subutay birer demircinin oğulları idi. Subutay, stratejik zekasından dolayı Cengiz Han'ın ailesinden olmadan Cengiz Han'a en yakın ad durumuna gelmiştir.…",
    ] },
]

