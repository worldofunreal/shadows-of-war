text = "成吉思汗（约1162年—1227年8月25日），本名铁木真，是大蒙古国的创建者，被后世元朝追尊为元太祖。成吉思汗一生大多时光都用于统合蒙古族诸部落，继而发起连番军事征伐，征服中国及中亚的大片疆土。 成吉思汗是蒙古孛儿只斤氏首领也速该和妻子诃额仑的长子，生于1155年至1167年间，因铁木真兀格而取名「铁木真」。铁木真八岁时，父亲亡故，他的家庭遭部落抛弃。铁木真家道几近赤贫，为巩固自己在家庭中的地位，杀死同父异母兄长別克帖兒。铁木真极具领袖魅力，助其吸引首批追随者，并与札木合、脱斡邻勒二位重要草原首领结为同盟；他们合力夺回遭劫掠者掳去的铁木真新婚妻子孛儿帖。然而随着铁木真声名渐起，他与札木合逐渐关系恶化，最终公然交战。约1187年，铁木真在十三翼之战中大败，此后数年可能沦为金朝臣属；待1196年再度崛起，他旋即开始积聚权势。后来脱斡邻勒视铁木真为威胁，于1203年对他发动突袭，是为合兰真沙陀之战。铁木真先是撤退，继而重整旗鼓，于班朱尼河盟誓，在折折运都山之战击败脱斡邻勒；他击败乃蛮部且处决札木合后，遂成为蒙古草原上唯一的统治者。 1206年，铁木真在忽里勒台上正式采用“成吉思汗”这一名号，其确切含义未详。成吉思汗推行旨在确保长治久安的改革，将蒙古部落的结构改造成一心效命于皇室的兼顾任用贤才与贵族秩序的集权体制。挫败权势萨满阔阔出的政变图谋后，成吉思汗开始巩固自己权力。1209年，成吉思汗率大军袭扰邻国西夏，西夏于次年接受蒙古所提条件。继而，成吉思汗发起征伐金朝的战事，历时四载，至1215年攻占金朝都城中都而告终，但蒙金之间的战事在此之后仍持续进行。成吉思汗的部将者别于1218年兼并中亚国家西辽。翌年，成吉思汗在花剌子模王朝处决自己派去的使者后，怒而兴兵入侵，此战倾覆花剌子模王朝，蹂躏河中地区与呼罗珊地区，而者别与其同僚速不台率军远征，抵至格鲁吉亚与基辅罗斯。1227年，成吉思汗在征伐西夏的行军途中驾崩；历经两年空位期后，他的第三子暨继承人窝阔台于1229年登上皇位。…"
title = "成吉思汗"
lang = "zh"
