[articles.fil]
text = "Si Muʿizz al-Din Muhammad ibn Sam, na kilala bilang Muhammad ng Ghor, ang namuno sa sangay ng mga Ghurid sa Ghazni mula 1173. Hati sila ng kapatid niyang si Ghiyath al-Din sa kapangyarihan ng dinastiya. Mula sa mga lupaing nasa Afghanistan ngayon, nagtatag ang mga Ghurid ng imperyong umabot sa hilagang India at tumagal nang maikling panahon. Pinaghihiwalay ng historyador na si Clifford Edmund Bosworth ang paglawak na masusubaybayan sa mga kampanya at ang mga kuwento ng pinagmulan na hinubog ng talaangkanan ng korte. Sa Tarain noong 1191, natalo ang hukbo ni Muhammad kay Prithviraj III, pinuno ng mga Chauhan. Ayon sa historyador na si Richard M. Eaton, inayos ni Muhammad ang kaniyang mga kawal na nakasakay sa kabayo upang harapin ang mga elepante ng kalaban. Bumalik siya sa Tarain noong 1192 at nabihag si Prithviraj. Pinalawak pa ng mga Ghurid ang kanilang nasasakupan at tumulong ang mga kumander ni Muhammad sa pagtatatag ng Sultanato ng Delhi. Isinasadula ng Pagbalik sa Tarain ang muling pagsalakay sa parehong kalaban matapos umatras. Kapag iniurong ang pag-atakeng tumagal nang hindi bababa sa 3 segundo, lalakas nang 35% ang mga atake sa kalabang iyon sa loob ng 30 segundo. Mananatili ang karaniwang mga pagkalugi sa pag-urong."
title = "Muhammad ng Ghor"
lang = "fil"
url = "https://www.iranicaonline.org/articles/ghurids/"
