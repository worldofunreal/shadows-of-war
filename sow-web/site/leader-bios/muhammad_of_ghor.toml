[articles.en]
text = "Muʿizz al-Din Muhammad ibn Sam, known as Muhammad of Ghor, ruled the Ghurid branch at Ghazni from 1173 and shared sovereignty with his brother Ghiyath al-Din. The Ghurids built a short-lived power based in today’s Afghanistan that reached into northern India. Historian Clifford Edmund Bosworth traces their expansion and the later role of Muhammad’s commanders, while noting how much of the dynasty’s early origin story was constructed through court genealogy. At Tarain in 1191, Muhammad’s forces were defeated by the Chauhan ruler Prithviraj III. According to historian Richard M. Eaton, Muhammad regrouped, trained his cavalry and horses to face the opponent’s elephants, and returned to the same field in 1192, when Prithviraj was captured. Ghurid armies subsequently annexed political centres across northern India, while their commanders helped establish the Delhi Sultanate. Return to Tarain represents returning to an opponent after a setback. Withdrawing an attack that lasted at least three seconds opens a thirty-second window of increased strength against that same rival, while normal retreat losses remain. The time limits and strength increase are game abstractions of regrouping and returning, not numerical historical claims."
title = "Muhammad of Ghor"
lang = "en"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
intro = ["Muʿizz al-Din Muhammad ibn Sam, known as Muhammad of Ghor, ruled the Ghurid branch at Ghazni from 1173 and shared sovereignty with his brother Ghiyath al-Din. The Ghurids built a short-lived power based in today’s Afghanistan that reached into northern India. Historian Clifford Edmund Bosworth traces their expansion and the later role of Muhammad’s commanders, while noting how much of the dynasty’s early origin story was constructed through court genealogy."]
