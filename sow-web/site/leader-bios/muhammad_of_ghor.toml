[articles.de]
text = "Muʿizz al-Din Muhammad ibn Sam, bekannt als Muhammad von Ghor, regierte ab 1173 den ghuridischen Herrschaftsbereich in Ghazni. Er teilte die dynastische Macht mit seinem Bruder Ghiyath al-Din. Von Gebieten im heutigen Afghanistan aus errichteten die Ghuriden ein kurzlebiges Reich, das bis nach Nordindien reichte. Der Historiker Clifford Edmund Bosworth unterscheidet die durch Feldzüge belegte Expansion von den höfischen Genealogien, die die Erzählungen über die frühen Ursprünge der Dynastie prägten. Bei Tarain wurden Muhammads Truppen 1191 von Prithviraj III. aus der Chauhan-Dynastie geschlagen. Dem Historiker Richard M. Eaton zufolge stellte Muhammad seine Reiterei neu auf, um den Kriegselefanten des Gegners zu begegnen. 1192 kehrte er nach Tarain zurück, und Prithviraj geriet in Gefangenschaft. Die Ghuriden dehnten ihre Herrschaft danach aus, und Muhammads Befehlshaber legten den Grundstein für das Sultanat von Delhi. Rückkehr nach Tarain greift den erneuten Angriff auf denselben Rivalen nach einem Rückzug auf. Ziehst du einen Angriff nach mindestens 3 Sekunden zurück, steigt deine Angriffsstärke gegen diesen Rivalen 30 Sekunden lang um 35 Prozent. Die üblichen Rückzugsverluste gelten weiter."
title = "Muhammad von Ghor"
lang = "de"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
