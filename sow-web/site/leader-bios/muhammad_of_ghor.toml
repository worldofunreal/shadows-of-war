[articles.ko]
text = "고르의 무함마드로 알려진 무이즈 앗딘 무함마드 이븐 삼은 1173년부터 가즈니에 있던 고르 왕조의 한 분파를 다스렸다. 왕조의 권력은 형 기야스 앗딘과 나눴으며, 형은 피루즈쿠흐를 중심으로 통치했다. 두 형제의 시대에 왕조는 오늘날 아프가니스탄에 해당하는 지역에서 인도 북부까지 세력을 뻗었다. 역사학자 클리퍼드 에드먼드 보즈워스는 전쟁과 정치 기록에서 확인할 수 있는 이 확장 과정과, 궁정에서 만든 족보를 바탕으로 전해진 왕조 초기의 이야기를 구분한다. 족보가 왕실이 자신의 기원을 설명하는 방식을 보여 준다면, 원정 기록은 통치자들이 어디로 세력을 넓혔는지 살필 근거가 된다. 1191년 타라인에서 무함마드의 군대는 차우한 왕조의 프리트비라지 3세에게 패했다. 역사학자 리처드 M. 이튼에 따르면 무함마드는 패배 후 군대를 다시 모으고, 상대의 전투 코끼리에 맞서도록 기병대를 정비했다. 1192년 무함마드는 타라인으로 돌아왔고 프리트비라지는 포로가 됐다. 두 전투는 같은 곳에서 벌어졌지만 정치적 결과는 달랐다. 고르의 군대는 그 뒤 인도 북부의 거점들을 차지했고, 무함마드의 지휘관들이 그곳에 마련한 기반은 델리 술탄국의 성립으로 이어졌다. 게임의 ‘타라인으로의 귀환’은 패배 후 부대를 재정비해 같은 상대에게 돌아오는 과정을 표현한다. 최소 3초 동안 이어진 공격을 철수시키면, 이후 30초 동안 그 상대에 대한 공격력이 35% 오른다. 다른 상대를 공격할 때에는 강화가 적용되지 않는다. 철수에 따른 손실은 평소대로 발생하므로 철수 비용과 다시 공격할 기회를 함께 고려해야 한다."
title = "고르의 무함마드"
lang = "ko"
url = "https://www.iranicaonline.org/articles/ghurids/"
