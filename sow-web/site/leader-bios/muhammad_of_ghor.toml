[articles.ru]
text = "Муизз ад-Дин Мухаммад ибн Сам, известный как Мухаммад Гури, с 1173 года правил газнийской ветвью Гуридов. Он разделял династическую власть со своим братом Гияс ад-Дином. Из областей нынешнего Афганистана Гуриды распространили власть на север Индии, создав недолговечную империю. Историк Клиффорд Эдмунд Босуорт отличает завоевания, которые можно проследить по сведениям о походах, от придворных генеалогий, определивших рассказы о происхождении династии. В 1191 году у Тараина войска Мухаммада потерпели поражение от правителя Чауханов Притхвираджа III. По изложению историка Ричарда Итона, Мухаммад перестроил конницу для борьбы с боевыми слонами противника. В 1192 году он вернулся к Тараину, и Притхвирадж попал в плен. Гуриды продолжили расширять свои владения, а командиры Мухаммада заложили основы Делийского султаната. «Возвращение к Тараину» передаёт повторный удар по прежнему противнику после отступления. Если отозвать атаку спустя не менее трёх секунд, атаки на того же соперника усиливаются на 35% на 30 секунд. Обычные потери при отступлении сохраняются."
title = "Мухаммад Гури"
lang = "ru"
url = "https://www.iranicaonline.org/articles/ghurids/"
