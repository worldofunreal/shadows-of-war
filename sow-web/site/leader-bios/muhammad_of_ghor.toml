[articles.tr]
text = "Gurlu Muhammed olarak bilinen Muizzüddin Muhammed bin Sam, 1173’ten itibaren Gazne’deki Gurlu kolunu yönetti. Hanedan iktidarını ağabeyi Gıyâseddin ile paylaştı. Gurlular bugünkü Afganistan topraklarından kuzey Hindistan’a uzanan kısa ömürlü bir imparatorluk kurdu. Tarihçi Clifford Edmund Bosworth, seferlere ilişkin kayıtlarla izlenebilen bu genişlemeyi hanedanın kökenlerine dair anlatıları şekillendiren saray şecerelerinden ayırır. Muhammed’in kuvvetleri 1191’de Tarain’de Çavhan hükümdarı III. Prithviraj’a yenildi. Tarihçi Richard M. Eaton’a göre Muhammed, rakibinin savaş fillerine karşı süvarilerini yeniden düzenledi. 1192’de Tarain’e döndü ve Prithviraj esir alındı. Gurlu orduları daha sonra egemenlik alanını genişletti ve Muhammed’in komutanları Delhi Sultanlığı’nın kuruluşuna katkıda bulundu. Tarain’e Dönüş, geri çekildikten sonra aynı rakibe yeniden saldırmayı temsil eder. En az 3 saniye süren bir saldırıyı geri çekersen o rakibe karşı saldırı gücün 30 saniye boyunca yüzde 35 artar. Olağan geri çekilme kayıpları uygulanır."
title = "Gurlu Muhammed"
lang = "tr"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
