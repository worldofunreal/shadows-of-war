[articles.es]
text = "Muʿizz al-Din Muhammad ibn Sam, conocido como Muhammad de Ghor, gobernó la rama gúrida de Gazni desde 1173 y compartió el poder dinástico con su hermano Ghiyath al-Din. Los gúridas formaron un imperio de corta duración desde territorios del actual Afganistán y extendieron su dominio al norte de la India. El historiador Clifford Edmund Bosworth distingue esa expansión, que puede seguirse en los registros de las campañas, de las genealogías cortesanas que dieron forma a los relatos sobre los orígenes de la dinastía. En Tarain, en 1191, las fuerzas de Muhammad fueron derrotadas por Prithviraj III, gobernante de los chahamanas o chauhanes. Según el historiador Richard M. Eaton, Muhammad reorganizó su caballería para enfrentarse a los elefantes del adversario. Regresó a Tarain en 1192 y Prithviraj fue capturado. Los ejércitos gúridas ampliaron después su dominio, y los mandos de Muhammad contribuyeron a establecer el sultanato de Delhi. Regreso a Tarain representa volver contra el mismo rival tras una retirada. Si retiras un ataque que duró al menos 3 segundos, ganas un 35% de fuerza contra ese rival durante 30 segundos. Se aplican las bajas habituales de la retirada."
title = "Muhammad de Ghor"
lang = "es"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
intro = ["Muʿizz al-Din Muhammad ibn Sam, conocido como Muhammad de Ghor, gobernó la rama gúrida de Gazni desde 1173 y compartió el poder dinástico con su hermano Ghiyath al-Din. Los gúridas formaron un imperio de corta duración desde territorios del actual Afganistán y extendieron su dominio al norte de la India. El historiador Clifford Edmund Bosworth distingue esa expansión, que puede seguirse en los registros de las campañas, de las genealogías cortesanas que dieron forma a los relatos sobre los orígenes de la dinastía."]
