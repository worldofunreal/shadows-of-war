[articles.fr]
text = "Muʿizz al-Din Muhammad ibn Sam, dit Muhammad de Ghor, gouverna la branche ghuride de Ghazni à partir de 1173 et partagea le pouvoir dynastique avec son frère Ghiyath al-Din. Depuis des territoires de l’actuel Afghanistan, les Ghurides établirent un empire de courte durée qui s’étendit au nord de l’Inde. L’historien Clifford Edmund Bosworth distingue cette expansion, que l’on peut suivre dans les récits de campagne, des généalogies de cour qui ont façonné les récits sur les origines de la dynastie. À Tarain, en 1191, les forces de Muhammad furent vaincues par Prithviraj III, souverain des Chauhan. Selon l’historien Richard M. Eaton, Muhammad réorganisa sa cavalerie pour affronter les éléphants de son adversaire. Il revint à Tarain en 1192 et Prithviraj fut capturé. Les armées ghurides étendirent ensuite leur domination et les commandants de Muhammad contribuèrent à établir le sultanat de Delhi. Retour à Tarain représente une nouvelle attaque contre le même rival après une retraite. Si vous retirez une attaque qui a duré au moins 3 secondes, vos attaques contre ce rival gagnent 35% de force pendant 30 secondes. Les pertes de retraite habituelles s’appliquent."
title = "Muhammad de Ghor"
lang = "fr"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
intro = ["Muʿizz al-Din Muhammad ibn Sam, dit Muhammad de Ghor, gouverna la branche ghuride de Ghazni à partir de 1173 et partagea le pouvoir dynastique avec son frère Ghiyath al-Din. Depuis des territoires de l’actuel Afghanistan, les Ghurides établirent un empire de courte durée qui s’étendit au nord de l’Inde. L’historien Clifford Edmund Bosworth distingue cette expansion, que l’on peut suivre dans les récits de campagne, des généalogies de cour qui ont façonné les récits sur les origines de la dynastie."]
