[articles.pt-BR]
text = "Muʿizz al-Din Muhammad ibn Sam, conhecido como Muhammad de Ghor, governou o ramo gúrida de Ghazni a partir de 1173 e dividiu o poder dinástico com seu irmão Ghiyath al-Din. De territórios do atual Afeganistão, os gúridas formaram um império de curta duração que se estendeu até o norte da Índia. O historiador Clifford Edmund Bosworth distingue essa expansão, que pode ser acompanhada em relatos de campanha, das genealogias da corte que moldaram as narrativas sobre as origens da dinastia. Em Tarain, em 1191, as forças de Muhammad foram derrotadas por Prithviraj III, governante dos Chauhan. Segundo o historiador Richard M. Eaton, Muhammad reorganizou sua cavalaria para enfrentar os elefantes do adversário. Voltou a Tarain em 1192 e Prithviraj foi capturado. Os exércitos gúridas ampliaram seu domínio, e os comandantes de Muhammad contribuíram para estabelecer o Sultanato de Délhi. Retorno a Tarain representa voltar a atacar o mesmo rival após um recuo. Se recuar de um ataque que durou ao menos 3 segundos, seus ataques contra aquele rival ganham 35% de força por 30 segundos. As perdas normais da retirada continuam valendo."
title = "Muhammad de Ghor"
lang = "pt-BR"
url = "https://www.iranicaonline.org/articles/ghurids/"
