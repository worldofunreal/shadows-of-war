[articles.zh-CN]
text = "穆伊兹丁·穆罕默德·伊本·萨姆通常被称为古尔的穆罕默德。他自1173年起在加兹尼统治古尔王朝的一支，与兄长吉亚斯丁分掌王朝权力。两人的政治中心分别设在加兹尼和菲鲁兹库赫。在他们统治期间，古尔王朝达到疆域最广的阶段，从今日阿富汗一带向南亚北部扩张。历史学家克利福德·埃德蒙·博斯沃思梳理了这一过程。他区分了能从战事和政治变化中追踪的扩张，与宫廷谱系塑造的早期王朝故事。谱系说明宫廷怎样叙述家族的来历，而军事记录则使人能够追踪政权的行动。加兹尼的穆罕默德以苏丹身份活动，逐渐把军队的行动范围向东推进，派遣将领控制其后取得的据点。博斯沃思记载，他的军队曾取道戈马尔山口，攻占木尔坦和乌奇。这些较早的行动发生在塔赖因交锋之前，可以看出古尔势力如何从加兹尼逐步进入印度河流域，再向更远处推进。 1191年，穆罕默德的军队在塔赖因被乔汉王朝的普里特维拉杰三世击败。历史学家理查德·伊顿认为，穆罕默德在失利后重新组织队伍，让骑兵准备应对敌方的战象。1192年，他回到塔赖因，普里特维拉杰随后被俘。两场战斗发生在同一地点，却带来不同的政治结果。古尔军队后来在印度北部占领更多政治中心。穆罕默德的将领在这一带建立的权力基础，也对德里苏丹国的形成起了作用。游戏中的「重返塔赖因」取材于失利后重整部队、再次面对同一个对手的过程。一场攻击进行至少三秒后，玩家主动撤回部队，就会进入三十秒的反击窗口。在这段时间里，只对刚刚交战的同一个对手提高百分之三十五的攻击强度。玩家若转去攻击其他对手，则得不到这项加成。撤退仍按照通常规则产生损失，因此玩家需要权衡撤出部队的代价和再次出击的机会。计时和强度属于游戏规则，用于把两次交锋之间的重整过程转化为可操作的条件。"
title = "古尔王朝的穆罕默德"
lang = "zh-CN"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
