[articles.vi]
text = "Muʿizz al-Din Muhammad ibn Sam, được biết đến với tên Muhammad xứ Ghor, cai trị nhánh Ghazni của triều Ghurid từ năm 1173. Ông chia sẻ quyền lực của vương triều với anh mình là Ghiyath al-Din. Từ vùng đất nay thuộc Afghanistan, người Ghurid lập một đế quốc tồn tại ngắn ngủi và mở rộng đến miền bắc Ấn Độ. Sử gia Clifford Edmund Bosworth phân biệt quá trình bành trướng có thể lần theo qua các chiến dịch với những câu chuyện nguồn gốc được định hình bởi gia phả cung đình. Ở Tarain năm 1191, lực lượng của Muhammad bị Prithviraj III, vua của triều Chauhan, đánh bại. Theo sử gia Richard M. Eaton, Muhammad tổ chức lại kỵ binh để đối phó với voi chiến của đối phương. Ông trở lại Tarain năm 1192 và Prithviraj bị bắt. Quân Ghurid tiếp tục mở rộng quyền cai trị, còn các chỉ huy của Muhammad đặt nền móng cho Vương quốc Hồi giáo Delhi. Trở lại Tarain thể hiện việc đánh lại cùng một đối thủ sau khi rút quân. Khi rút một cuộc tấn công đã kéo dài ít nhất 3 giây, các đợt tấn công đối thủ ấy mạnh hơn 35% trong 30 giây. Tổn thất rút lui vẫn áp dụng."
title = "Muhammad xứ Ghor"
lang = "vi"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
intro = ["Muʿizz al-Din Muhammad ibn Sam, được biết đến với tên Muhammad xứ Ghor, cai trị nhánh Ghazni của triều Ghurid từ năm 1173. Ông chia sẻ quyền lực của vương triều với anh mình là Ghiyath al-Din. Từ vùng đất nay thuộc Afghanistan, người Ghurid lập một đế quốc tồn tại ngắn ngủi và mở rộng đến miền bắc Ấn Độ. Sử gia Clifford Edmund Bosworth phân biệt quá trình bành trướng có thể lần theo qua các chiến dịch với những câu chuyện nguồn gốc được định hình bởi gia phả cung đình."]
sections = [{ title = "Trở lại Tarain", paragraphs = ["Ở Tarain năm 1191, lực lượng của Muhammad bị Prithviraj III, vua của triều Chauhan, đánh bại. Theo sử gia Richard M. Eaton, Muhammad tổ chức lại kỵ binh để đối phó với voi chiến của đối phương. Ông trở lại Tarain năm 1192 và Prithviraj bị bắt. Quân Ghurid tiếp tục mở rộng quyền cai trị, còn các chỉ huy của Muhammad đặt nền móng cho Vương quốc Hồi giáo Delhi. Trở lại Tarain thể hiện việc đánh lại cùng một đối thủ sau khi rút quân. Khi rút một cuộc tấn công đã kéo dài ít nhất 3 giây, các đợt tấn công đối thủ ấy mạnh hơn 35% trong 30 giây. Tổn thất rút lui vẫn áp dụng."] }]
sources = [{ title = "“Ghurids,” Encyclopaedia Iranica, Clifford Edmund Bosworth", url = "https://www.iranicaonline.org/articles/ghurids/" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }]

[articles.id]
text = "Muʿizz al-Din Muhammad ibn Sam, dikenal sebagai Muhammad dari Ghor, memerintah cabang Ghuriyah di Ghazni sejak 1173. Ia berbagi kekuasaan dinasti dengan saudaranya, Ghiyath al-Din. Dari wilayah yang kini menjadi bagian dari Afganistan, Ghuriyah mendirikan kekaisaran berumur singkat yang meluas sampai India utara. Sejarawan Clifford Edmund Bosworth membedakan perluasan yang dapat ditelusuri melalui catatan kampanye dari kisah asal-usul dinasti yang dibentuk oleh silsilah istana. Di Tarain pada 1191, pasukan Muhammad dikalahkan oleh Prithviraj III, penguasa Chauhan. Menurut sejarawan Richard M. Eaton, Muhammad menyusun kembali pasukan berkudanya untuk menghadapi gajah perang lawan. Ia kembali ke Tarain pada 1192 dan Prithviraj ditawan. Pasukan Ghuriyah kemudian memperluas kekuasaan, dan para panglima Muhammad membantu mendirikan Kesultanan Delhi. Kembali ke Tarain menggambarkan serangan ulang terhadap lawan yang sama setelah mundur. Tarik serangan yang telah berlangsung setidaknya 3 detik untuk mendapatkan tambahan kekuatan 35% terhadap lawan itu selama 30 detik. Kerugian penarikan biasa tetap berlaku."
title = "Muhammad dari Ghor"
lang = "id"
url = "https://www.iranicaonline.org/articles/ghurids/"
