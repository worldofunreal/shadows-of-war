[articles.ja]
text = "ムイッズッディーン・ムハンマド・イブン・サームは、ゴールのムハンマドとして知られる。1173年からガズナのゴール朝を治め、兄のギヤースッディーンと王朝の権力を分け合った。兄はフィーローズクーフを拠点とした。兄弟の治世にゴール朝の支配圏は最も広がり、現在のアフガニスタンにあたる地域から北インドに及んだ。歴史家クリフォード・エドマンド・ボズワースは、遠征や政治の記録からたどることができる拡大の過程と、宮廷の系譜によって形づくられた王朝の起源の物語を区別している。系譜には一族が自らの来歴をどう伝えたかが表れ、遠征の記録からは王朝がどこに勢力を広げたかが分かる。ボズワースによれば、ムハンマドはゴーマル峠を通ってムルターンとウッチを攻略した。 1191年、ムハンマドの軍はタラーインでチャーハマーナ朝のプリトヴィーラージャ三世に敗れた。歴史家リチャード・M・イートンによると、ムハンマドは軍を立て直し、相手の戦象と戦うために騎兵を整えた。1192年に同じタラーインへ戻り、プリトヴィーラージャは捕らえられた。二度の戦いの間には、敗北を受けて再び軍をまとめる時間があった。その後、ゴール朝の軍は北インドの諸拠点に進出した。ムハンマドの指揮官たちが現地に築いた足場は、デリー・スルターン朝の成立にもつながった。ゲームの「タラーインへの帰還」は、一度退いたあとで同じ相手と再び戦う過程に着想を得ている。敵への攻撃を開始してから少なくとも三秒後に撤退させると、三十秒間、その敵に対する攻撃力が三十五パーセント上がる。相手を変えれば強化の対象外となる。撤退による損失は通常どおり発生するため、撤退の負担と再攻撃の機会を考えて使う能力である。"
title = "ゴールのムハンマド"
lang = "ja"
url = "https://www.iranicaonline.org/articles/ghurids/"
shortArticle = true
