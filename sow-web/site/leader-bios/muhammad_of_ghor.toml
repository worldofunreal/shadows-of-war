[articles.it]
text = "Muʿizz al-Din Muhammad ibn Sam, noto come Muhammad di Ghor, governò il ramo ghuride di Ghazni dal 1173 e condivise il potere dinastico con il fratello Ghiyath al-Din. Partendo da territori dell’attuale Afghanistan, i Ghuridi crearono un impero di breve durata esteso all’India settentrionale. Lo storico Clifford Edmund Bosworth distingue l’espansione documentata dai resoconti delle campagne dalle genealogie di corte che hanno plasmato il racconto delle origini della dinastia. A Tarain, nel 1191, le forze di Muhammad furono sconfitte da Prithviraj III, sovrano dei Chauhan. Secondo lo storico Richard M. Eaton, Muhammad riorganizzò la cavalleria per affrontare gli elefanti dell’avversario. Tornò a Tarain nel 1192 e Prithviraj fu catturato. Gli eserciti ghuridi estesero poi il loro dominio e i comandanti di Muhammad contribuirono alla nascita del sultanato di Delhi. Ritorno a Tarain rappresenta un nuovo attacco contro lo stesso rivale dopo una ritirata. Ritirando un attacco durato almeno 3 secondi, ottieni il 35% di forza in più contro quel rivale per 30 secondi. Le normali perdite da ritirata restano."
title = "Muhammad di Ghor"
lang = "it"
url = "https://www.iranicaonline.org/articles/ghurids/"
