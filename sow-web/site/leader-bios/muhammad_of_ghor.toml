[articles.ar]
text = "حكم معز الدين محمد بن سام، المعروف بمحمد الغوري، فرع الدولة الغورية في غزنة منذ عام 1173، وتقاسم سلطة الأسرة مع أخيه غياث الدين. وأقام الغوريون دولة قصيرة العمر امتدت من أراضٍ تقع اليوم في أفغانستان إلى شمال الهند. ويميّز المؤرخ كليفورد إدموند بوزورث بين التوسع الذي يمكن تتبعه في أخبار الحملات وبين روايات الأصول التي صاغتها أنساب البلاط. في تراين عام 1191 هزم بريثفيراج الثالث، حاكم تشوهان، قوات محمد. وبحسب المؤرخ ريتشارد إيتون، أعاد محمد تنظيم فرسانه لمواجهة فيلة خصمه. عاد إلى تراين عام 1192 وأُسر بريثفيراج. ووسعت الجيوش الغورية نفوذها بعدها، وأسهم قادة محمد في تأسيس سلطنة دلهي. وتجسد قدرة «العودة إلى تراين» معاودة الهجوم على الخصم نفسه بعد الانسحاب. عند سحب هجوم استمر ثلاث ثوانٍ على الأقل، تزداد قوة الهجوم على ذلك الخصم بنسبة 35% لمدة ثلاثين ثانية، مع بقاء خسائر الانسحاب المعتادة."
title = "محمد الغوري"
lang = "ar"
url = "https://www.iranicaonline.org/articles/ghurids/"
