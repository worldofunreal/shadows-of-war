[articles.en]
text = "Khosrow I, known as Anushirvan, ruled the Sasanian Empire from 531 to 579. He reorganized the army into four regional commands. Surviving seals name generals responsible for the eastern, southern, western and northern quarters. He also continued the land survey begun under his father Kavad I and used it to establish fixed tax assessments."
title = "Khosrow I"
lang = "en"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Khosrow I, known as Anushirvan, ruled the Sasanian Empire from 531 to 579. He reorganized the army into four regional commands. Surviving seals name generals responsible for the eastern, southern, western and northern quarters. He also continued the land survey begun under his father Kavad I and used it to establish fixed tax assessments."]
sections = [{ title = "Four commands for an empire", paragraphs = ["His reign combined administrative change with war against the Eastern Roman Empire. Khosrow took Antioch in 540 and settled deportees from the city near Ctesiphon. Procopius describes this settlement from the Roman side. After years of fighting and truces, the two empires agreed to a fifty-year peace in 562. Later traditions celebrated Khosrow as a model of justice. The seals provide contemporary evidence for the regional commands, while much of the detailed account of taxation comes from later writers. Scholars distinguish reforms begun under Kavad from the system carried into effect under his son."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.es]
text = "Khosrow I, conocido como Anushirván, gobernó el Imperio sasánida entre 531 y 579. Reorganizó el ejército en cuatro mandos regionales. Los sellos conservados identifican a los generales responsables de oriente, sur, occidente y norte. También continuó el catastro iniciado bajo su padre, Kavadh I, y lo usó para fijar las cuotas del impuesto territorial."
title = "Khosrow I"
lang = "es"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Khosrow I, conocido como Anushirván, gobernó el Imperio sasánida entre 531 y 579. Reorganizó el ejército en cuatro mandos regionales. Los sellos conservados identifican a los generales responsables de oriente, sur, occidente y norte. También continuó el catastro iniciado bajo su padre, Kavadh I, y lo usó para fijar las cuotas del impuesto territorial."]
sections = [{ title = "Cuatro mandos para un imperio", paragraphs = ["Su reinado combinó cambios administrativos con guerras contra el Imperio romano de Oriente. Khosrow tomó Antioquía en 540 y asentó a personas deportadas de la ciudad cerca de Ctesifonte. Procopio describió este traslado desde el lado romano. Tras años de combates y treguas, ambos imperios acordaron en 562 una paz de cincuenta años. Tradiciones posteriores celebraron a Khosrow como modelo de justicia. Los sellos son testimonios contemporáneos de los mandos regionales. Muchos detalles sobre los impuestos, en cambio, se conocen por autores posteriores. Los estudios distinguen las medidas iniciadas por Kavadh del sistema que su hijo llevó a la práctica."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.fr]
text = "Khosro Ier, dit Anouchirvan, régna sur l’Empire sassanide de 531 à 579. Il réorganisa l’armée en quatre commandements régionaux. Des sceaux conservés nomment les généraux chargés de l’Est, du Sud, de l’Ouest et du Nord. Il poursuivit aussi l’arpentage lancé sous son père Kavadh Ier pour établir un barème fixe de l’impôt foncier."
title = "Khosro Ier"
lang = "fr"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Khosro Ier, dit Anouchirvan, régna sur l’Empire sassanide de 531 à 579. Il réorganisa l’armée en quatre commandements régionaux. Des sceaux conservés nomment les généraux chargés de l’Est, du Sud, de l’Ouest et du Nord. Il poursuivit aussi l’arpentage lancé sous son père Kavadh Ier pour établir un barème fixe de l’impôt foncier."]
sections = [{ title = "Quatre commandements pour un empire", paragraphs = ["Son règne associa les réformes administratives aux guerres contre l’Empire romain d’Orient. Khosro prit Antioche en 540 et installa des habitants déportés de la ville près de Ctésiphon. Procope décrit ce déplacement du point de vue romain. Après des années de combats et de trêves, les deux empires conclurent en 562 une paix de cinquante ans. Des traditions ultérieures firent de Khosro un modèle de justice. Les sceaux attestent les commandements régionaux à l’époque, tandis que beaucoup de détails sur la fiscalité viennent d’auteurs plus tardifs. Les travaux historiques distinguent les réformes amorcées par Kavadh et leur mise en œuvre sous son fils."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.de]
text = "Chosrau I., auch als Anuschirwan bekannt, regierte das Sassanidenreich von 531 bis 579. Er gliederte das Heer in vier Regionalkommandos. Erhaltene Siegel nennen die Generäle für die östlichen, südlichen, westlichen und nördlichen Gebiete. Außerdem führte er die unter seinem Vater Kavadh I. begonnene Landvermessung fort und nutzte sie als Grundlage für feste Grundsteuersätze."
title = "Chosrau I."
lang = "de"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Chosrau I., auch als Anuschirwan bekannt, regierte das Sassanidenreich von 531 bis 579. Er gliederte das Heer in vier Regionalkommandos. Erhaltene Siegel nennen die Generäle für die östlichen, südlichen, westlichen und nördlichen Gebiete. Außerdem führte er die unter seinem Vater Kavadh I. begonnene Landvermessung fort und nutzte sie als Grundlage für feste Grundsteuersätze."]
sections = [{ title = "Vier Kommandos für ein Reich", paragraphs = ["Seine Regierungszeit verband den Umbau der Verwaltung mit Kriegen gegen das Oströmische Reich. Chosrau nahm 540 Antiochia ein und siedelte aus der Stadt verschleppte Menschen in der Nähe von Ktesiphon an. Prokop schildert die Umsiedlung aus römischer Sicht. Nach Jahren des Krieges und mehrerer Waffenruhen vereinbarten die Reiche 562 einen Frieden für fünfzig Jahre. Spätere Überlieferungen rühmten Chosrau als Vorbild der Gerechtigkeit. Die Siegel sind zeitgenössische Belege für die Kommandos. Viele Einzelheiten zur Besteuerung stammen aus späteren Texten. Die Forschung unterscheidet die unter Kavadh eingeleiteten Reformen von ihrer Umsetzung unter seinem Sohn."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.it]
text = "Cosroe I, detto Anushirvan, regnò sull’Impero sasanide dal 531 al 579. Riorganizzò l’esercito in quattro comandi regionali. I sigilli conservati indicano i generali responsabili di oriente, meridione, occidente e settentrione. Proseguì inoltre il rilevamento delle terre iniziato sotto il padre, Kavadh I, e lo usò per fissare le quote dell’imposta fondiaria."
title = "Cosroe I"
lang = "it"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Cosroe I, detto Anushirvan, regnò sull’Impero sasanide dal 531 al 579. Riorganizzò l’esercito in quattro comandi regionali. I sigilli conservati indicano i generali responsabili di oriente, meridione, occidente e settentrione. Proseguì inoltre il rilevamento delle terre iniziato sotto il padre, Kavadh I, e lo usò per fissare le quote dell’imposta fondiaria."]
sections = [{ title = "Quattro comandi per un impero", paragraphs = ["Il suo regno unì cambiamenti amministrativi e guerre contro l’Impero romano d’Oriente. Cosroe prese Antiochia nel 540 e trasferì persone deportate dalla città nei pressi di Ctesifonte. Procopio descrisse il trasferimento dalla prospettiva romana. Dopo anni di combattimenti e tregue, nel 562 i due imperi concordarono una pace di cinquant’anni. Le tradizioni successive celebrarono Cosroe come modello di giustizia. I sigilli sono testimonianze contemporanee dei comandi regionali, mentre molti particolari sulla tassazione provengono da autori più tardi. Gli storici distinguono le iniziative di Kavadh dalla loro attuazione sotto il figlio."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.tr]
text = "Enûşirvân adıyla da bilinen I. Hüsrev, 531’den 579’a kadar Sasani İmparatorluğu’nu yönetti. Orduyu dört bölge komutanlığı hâlinde yeniden düzenledi. Günümüze ulaşan mühürlerde doğu, güney, batı ve kuzeyden sorumlu komutanların unvanları bulunur. Babası I. Kavâd döneminde başlayan arazi sayımını da sürdürdü ve toprak vergisi için sabit oranlar belirledi."
title = "I. Hüsrev"
lang = "tr"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Enûşirvân adıyla da bilinen I. Hüsrev, 531’den 579’a kadar Sasani İmparatorluğu’nu yönetti. Orduyu dört bölge komutanlığı hâlinde yeniden düzenledi. Günümüze ulaşan mühürlerde doğu, güney, batı ve kuzeyden sorumlu komutanların unvanları bulunur. Babası I. Kavâd döneminde başlayan arazi sayımını da sürdürdü ve toprak vergisi için sabit oranlar belirledi."]
sections = [{ title = "İmparatorluğun dört komutanlığı", paragraphs = ["Hükümdarlığı, idari değişikliklerin yanı sıra Doğu Roma İmparatorluğu ile savaşlara sahne oldu. Hüsrev 540’ta Antakya’yı aldı ve şehirden zorla götürülen insanları Tizpon yakınlarına yerleştirdi. Prokopios bu iskânı Roma tarafından anlatır. Yıllar süren savaş ve ateşkeslerden sonra iki imparatorluk 562’de elli yıllık barış üzerinde anlaştı. Sonraki gelenekler Hüsrev’i adil hükümdar örneği olarak andı. Mühürler bölge komutanlıklarının çağdaş kanıtıdır. Vergilendirmeye ilişkin ayrıntıların çoğu ise daha sonraki yazarlardan gelir. Araştırmacılar Kavâd’ın başlattığı düzenlemelerle oğlunun uyguladığı sistemi birbirinden ayırır."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.zh-CN]
text = "霍斯劳一世又称安努希尔万，于531年至579年统治萨珊帝国。他把军队的指挥权分配给四个地区的将领。保存下来的印章记录了分别负责东、南、西、北的军职。他也继续推行父亲卡瓦德一世晚年开始的土地测量，并以登记资料为基础制定固定的土地税额。"
title = "霍斯劳一世"
lang = "zh-CN"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["霍斯劳一世又称安努希尔万，于531年至579年统治萨珊帝国。他把军队的指挥权分配给四个地区的将领。保存下来的印章记录了分别负责东、南、西、北的军职。他也继续推行父亲卡瓦德一世晚年开始的土地测量，并以登记资料为基础制定固定的土地税额。"]
sections = [{ title = "帝国的四个军事辖区", paragraphs = ["军事改革改变了军队的指挥方式。过去由一位最高统帅承担的职责被分给四位地区将领。各辖区在中古波斯语文献里称为库斯特，含有方位的意思。印章上的头衔把将领与具体辖区联系起来，因此可以和后世史书的说法互相参照。土地税的改革同样改变了政府管理地方的方式。对田地和作物的登记使官员可以按照预先规定的税率征收。旧制度按每次收获分取一定份额。现存材料对实施细节的记载并不均衡，许多内容是通过较晚的作者传下来的。因此，研究者通常区分卡瓦德时期开始的调查和霍斯劳即位后推行的制度。与此同时，帝国与东罗马之间的战争也影响了他的统治。霍斯劳在540年攻占安条克，将部分居民强制迁到泰西封附近的新城。罗马史家普罗科皮乌斯从自己一方的视角记述了这次迁移，也描述了新居民受到的供给和管理。两国在边境地区继续交战，并多次谈判和休战。562年双方订立了为期五十年的和约，其中包括对边防、贸易以及外交往来的约定。后来伊斯兰时代的作品经常把霍斯劳塑造成公正君主的典范。理解这一形象需要把后来的政治典范与具体时代的材料放在一起比较。有关军事改革，印章提供了与当时官职直接相关的证据。有关税制，较晚的文字保留了旧制度和新制度的比较，但也留下了对于实际执行和地方差异的疑问。战争的经过则可以对照普罗科皮乌斯等作者记述的东罗马视角。不同来源回答的问题各不相同，从官员使用的头衔、征税依据的变化，到战后城市居民的去向，都需要分别核对。保留这种区分也有助于理解同一个统治者为何既因改革而受到赞颂，又在敌对帝国的记述中留下攻城和强制迁徙的记录。"] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.ja]
text = "アヌーシールワーンとも呼ばれるホスロー1世は、531年から579年までサーサーン朝を治めた。軍を四つの方面軍に再編し、東、南、西、北をそれぞれ担当する司令官を置いた。現存する印章には各方面を担当した軍人の称号が残る。父カワード1世の時代に始まった土地調査も引き継ぎ、地税を定額で賦課する基礎とした。"
title = "ホスロー1世"
lang = "ja"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["アヌーシールワーンとも呼ばれるホスロー1世は、531年から579年までサーサーン朝を治めた。軍を四つの方面軍に再編し、東、南、西、北をそれぞれ担当する司令官を置いた。現存する印章には各方面を担当した軍人の称号が残る。父カワード1世の時代に始まった土地調査も引き継ぎ、地税を定額で賦課する基礎とした。"]
sections = [{ title = "帝国を支える四つの司令部", paragraphs = ["軍の再編によって、それまで一人の最高司令官に集まっていた任務が、四つの方面に分けられた。中期ペルシア語のクストは方角や方面を表す。印章にはその方角と軍司令官の称号が記されており、後世の歴史書に伝わる四分制を同時代の資料から確かめることができる。税制については、耕地や作物の調査をもとに税額を決める仕組みが整えられた。制度の細部を伝える文献の多くは後代に成立している。研究者はカワードの晩年に始まった調査と、その息子のもとで実施された仕組みを区別して考える。こうした改革と並行して、ホスローは東ローマ帝国と戦った。540年にアンティオキアを占領し、そこから連行した住民をクテシフォン近くに移住させた。東ローマ側の著者プロコピオスは、新たな居住地と移された住民への措置を記している。国境周辺で戦闘と休戦を繰り返した後、両国は562年に五十年の和平を結んだ。取り決めには国境の安全や交易、使節の扱いも含まれた。後のイスラム時代には、ホスローを公正な君主の模範として語る伝統が広がった。その評価の成立を調べる際には、王についての後世の物語と、官職を示す印章や戦争を伝える文献とをそれぞれの時代に即して読む必要がある。印章が伝えるのは職務の名称と担当方面であり、徴税の手続きや住民の暮らしは別の資料からたどることになる。こうした異なる資料を照らし合わせることで、一人の王のもとで軍制、税制、外交がどう変わったかを個別に検討できる。"] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.ko]
text = "아누시르반으로도 알려진 호스로 1세는 531년부터 579년까지 사산 제국을 다스렸다. 그는 군을 네 지역 사령부로 재편했다. 남아 있는 인장은 동쪽과 남쪽, 서쪽과 북쪽을 맡은 장군들의 칭호를 전한다. 그는 아버지 카바드 1세 때 시작된 토지 조사도 계속하여 일정한 토지세를 부과하는 근거로 삼았다."
title = "호스로 1세"
lang = "ko"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["아누시르반으로도 알려진 호스로 1세는 531년부터 579년까지 사산 제국을 다스렸다. 그는 군을 네 지역 사령부로 재편했다. 남아 있는 인장은 동쪽과 남쪽, 서쪽과 북쪽을 맡은 장군들의 칭호를 전한다. 그는 아버지 카바드 1세 때 시작된 토지 조사도 계속하여 일정한 토지세를 부과하는 근거로 삼았다."]
sections = [{ title = "제국의 네 사령부", paragraphs = ["군제 개편으로 한 명의 최고 사령관이 맡던 임무가 네 지역의 지휘관에게 나뉘었다. 중세 페르시아어로 방향 또는 방면을 뜻하는 쿠스트가 각 군사 구역을 가리켰다. 장군들의 인장에 관직명과 담당 지역이 남아 있어 후대 문헌에 전하는 사령부 편제를 당시의 자료와 대조할 수 있다. 토지와 작물을 조사한 기록은 세금을 정해진 기준에 따라 부과하는 데 쓰였다. 이 제도의 세부 사항을 전하는 기록은 상당수가 후대에 작성되었다. 연구자들은 카바드 때 시작한 조사와 호스로 치세에 시행된 제도를 구분한다. 그가 행정 제도를 바꾸는 동안 동로마 제국과의 전쟁도 계속되었다. 호스로는 540년에 안티오키아를 점령했고, 그곳에서 강제로 옮겨 온 주민들을 크테시폰 인근에 정착시켰다. 동로마의 저술가 프로코피우스는 새 정착지와 이주민에 대한 조치를 자신의 관점에서 기록했다. 오랜 전투와 휴전을 거친 뒤 두 제국은 562년에 오십 년을 기한으로 평화 조약을 맺었다. 조약은 국경 문제와 교역, 사절의 대우도 다루었다. 후대 이슬람 시대의 전승은 호스로를 정의로운 왕의 본보기로 칭송했다. 이런 평가가 어떻게 전해졌는지 살펴볼 때는 왕을 칭송한 이야기와 실제 관직을 적은 인장을 각기 다른 시대의 자료로 읽는 것이 중요하다. 군제에 관한 인장의 증거, 세금에 관한 후대 문헌, 전쟁에 관한 동로마 저자의 기록은 서로 다른 질문에 답한다. 함께 검토하면 호스로의 치세가 행정 개혁과 국경 전쟁 모두로 기억된 이유를 이해할 수 있다."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.ar]
text = "حكم كسرى الأول، المعروف بأنوشروان، الإمبراطورية الساسانية من سنة 531 إلى سنة 579. أعاد تنظيم الجيش في أربع قيادات إقليمية. وتذكر الأختام الباقية القادة المسؤولين عن الشرق والجنوب والغرب والشمال. كما تابع مسح الأراضي الذي بدأ في عهد أبيه قباذ الأول واعتمد عليه في تحديد مقادير ثابتة لضريبة الأرض."
title = "كسرى الأول"
lang = "ar"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["حكم كسرى الأول، المعروف بأنوشروان، الإمبراطورية الساسانية من سنة 531 إلى سنة 579. أعاد تنظيم الجيش في أربع قيادات إقليمية. وتذكر الأختام الباقية القادة المسؤولين عن الشرق والجنوب والغرب والشمال. كما تابع مسح الأراضي الذي بدأ في عهد أبيه قباذ الأول واعتمد عليه في تحديد مقادير ثابتة لضريبة الأرض."]
sections = [{ title = "أربع قيادات لإمبراطورية", paragraphs = ["جمع عهده بين التغيير الإداري والحرب مع الإمبراطورية الرومانية الشرقية. استولى كسرى على أنطاكية سنة 540 وأسكن أشخاصًا هجّرهم منها قرب طيسفون. ووصف بروكوبيوس هذا الترحيل من الجانب الروماني. وبعد سنوات من القتال والهدن، اتفقت الدولتان سنة 562 على صلح لخمسين عامًا. احتفت به التقاليد اللاحقة مثالًا للملك العادل. وتشهد الأختام المعاصرة على القيادات الإقليمية، بينما تأتي تفاصيل كثيرة عن الضرائب من مؤلفين متأخرين. ويميز الباحثون بين الإصلاحات التي بدأها قباذ والنظام الذي دخل حيز التنفيذ في عهد ابنه."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.ru]
text = "Хосров I, известный как Ануширван, правил Сасанидской державой с 531 по 579 год. Он разделил войско на четыре региональных командования. Сохранившиеся печати называют военачальников, отвечавших за восток, юг, запад и север. Хосров также продолжил межевание земель, начатое при его отце Каваде I, и установил на его основе фиксированные ставки земельного налога."
title = "Хосров I"
lang = "ru"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Хосров I, известный как Ануширван, правил Сасанидской державой с 531 по 579 год. Он разделил войско на четыре региональных командования. Сохранившиеся печати называют военачальников, отвечавших за восток, юг, запад и север. Хосров также продолжил межевание земель, начатое при его отце Каваде I, и установил на его основе фиксированные ставки земельного налога."]
sections = [{ title = "Четыре командования державы", paragraphs = ["Административные преобразования сочетались с войнами против Восточной Римской империи. В 540 году Хосров взял Антиохию и поселил вывезенных из города жителей близ Ктесифона. Прокопий описал переселение с римской стороны. После долгих боёв и перемирий обе державы в 562 году договорились о пятидесятилетнем мире. Позднейшая традиция прославляла Хосрова как образец справедливого царя. Печати служат современным той эпохе свидетельством о командованиях, тогда как многие подробности налогообложения известны по поздним текстам. Исследователи различают начинания Кавада и систему, введённую в действие при его сыне."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.vi]
text = "Khosrow I, còn gọi là Anushirvan, cai trị Đế quốc Sasan từ năm 531 đến 579. Ông tổ chức quân đội thành bốn bộ chỉ huy khu vực. Những con dấu còn lại ghi chức danh các tướng phụ trách phía đông, nam, tây và bắc. Ông cũng tiếp tục cuộc đo đạc đất đai khởi sự dưới thời cha mình là Kavad I và dựa vào đó để ấn định mức thuế đất."
title = "Khosrow I"
lang = "vi"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Khosrow I, còn gọi là Anushirvan, cai trị Đế quốc Sasan từ năm 531 đến 579. Ông tổ chức quân đội thành bốn bộ chỉ huy khu vực. Những con dấu còn lại ghi chức danh các tướng phụ trách phía đông, nam, tây và bắc. Ông cũng tiếp tục cuộc đo đạc đất đai khởi sự dưới thời cha mình là Kavad I và dựa vào đó để ấn định mức thuế đất."]
sections = [{ title = "Bốn bộ chỉ huy của đế quốc", paragraphs = ["Triều đại của ông vừa có cải cách hành chính vừa có chiến tranh với Đế quốc Đông La Mã. Khosrow chiếm Antioch năm 540 và đưa những người bị trục xuất khỏi thành phố tới định cư gần Ctesiphon. Procopius kể lại cuộc di dời từ phía La Mã. Sau nhiều năm giao tranh và đình chiến, hai đế quốc ký hòa ước năm mươi năm vào năm 562. Truyền thống đời sau ca ngợi Khosrow như một vị vua công minh. Con dấu là bằng chứng đương thời về các bộ chỉ huy, còn nhiều chi tiết về thuế xuất hiện trong tác phẩm muộn hơn. Giới nghiên cứu phân biệt những cải cách bắt đầu dưới thời Kavad với hệ thống được thực thi dưới thời con ông."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.id]
text = "Khosrow I, yang dikenal sebagai Anushirvan, memerintah Kekaisaran Sasaniyah dari 531 sampai 579. Ia membagi pimpinan militer menjadi empat komando wilayah. Meterai yang bertahan mencatat para panglima yang bertanggung jawab atas wilayah timur, selatan, barat, dan utara. Ia juga meneruskan pendataan tanah yang dimulai pada masa ayahnya, Kavad I, dan menjadikannya dasar untuk menetapkan tarif pajak tanah yang tetap."
title = "Khosrow I"
lang = "id"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Khosrow I, yang dikenal sebagai Anushirvan, memerintah Kekaisaran Sasaniyah dari 531 sampai 579. Ia membagi pimpinan militer menjadi empat komando wilayah. Meterai yang bertahan mencatat para panglima yang bertanggung jawab atas wilayah timur, selatan, barat, dan utara. Ia juga meneruskan pendataan tanah yang dimulai pada masa ayahnya, Kavad I, dan menjadikannya dasar untuk menetapkan tarif pajak tanah yang tetap."]
sections = [{ title = "Empat komando untuk satu kekaisaran", paragraphs = ["Perubahan administrasi pada masa pemerintahannya berlangsung bersamaan dengan perang melawan Kekaisaran Romawi Timur. Khosrow merebut Antiokhia pada 540 dan menempatkan penduduk yang diusir dari kota itu di dekat Ktesifon. Procopius menggambarkan pemindahan itu dari pihak Romawi. Sesudah bertahun-tahun berperang dan melakukan gencatan senjata, kedua kekaisaran menyepakati perdamaian lima puluh tahun pada 562. Tradisi kemudian mengenangnya sebagai teladan raja yang adil. Meterai memberikan bukti sezaman tentang komando wilayah, sedangkan banyak rincian perpajakan berasal dari penulis yang lebih belakangan. Para peneliti membedakan langkah awal Kavad dengan penerapan sistem itu pada masa putranya."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.fil]
text = "Si Khosrow I, na tinatawag ding Anushirvan, ang namuno sa Imperyong Sasanian mula 531 hanggang 579. Hinati niya ang pamunuan ng hukbo sa apat na kumand na panrehiyon. Makikita sa mga natirang selyo ang mga heneral na namahala sa silangan, timog, kanluran at hilaga. Ipinagpatuloy din niya ang pagsukat sa lupain na sinimulan sa panahon ng kanyang amang si Kavad I, at ibinatay rito ang takdang buwis sa lupa."
title = "Khosrow I"
lang = "fil"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Si Khosrow I, na tinatawag ding Anushirvan, ang namuno sa Imperyong Sasanian mula 531 hanggang 579. Hinati niya ang pamunuan ng hukbo sa apat na kumand na panrehiyon. Makikita sa mga natirang selyo ang mga heneral na namahala sa silangan, timog, kanluran at hilaga. Ipinagpatuloy din niya ang pagsukat sa lupain na sinimulan sa panahon ng kanyang amang si Kavad I, at ibinatay rito ang takdang buwis sa lupa."]
sections = [{ title = "Apat na kumand ng imperyo", paragraphs = ["Nagpatupad siya ng mga pagbabago sa pamamahala habang nakikipagdigma sa Imperyong Romano sa Silangan. Sinakop niya ang Antioch noong 540 at pinatira malapit sa Ctesiphon ang mga taong sapilitang inalis sa lungsod. Isinalaysay ni Procopius ang paglilipat mula sa panig ng mga Romano. Matapos ang mga taon ng labanan at tigil-putukan, nagkasundo ang mga imperyo sa limampung taong kapayapaan noong 562. Kalaunan, ginunita si Khosrow bilang huwaran ng makatarungang hari. Ang mga selyo ay ebidensiya mula sa panahong iyon tungkol sa mga kumand, samantalang maraming detalye ng pagbubuwis ang mula sa mas huling manunulat. Pinag-iiba ng mga iskolar ang mga hakbang na sinimulan ni Kavad at ang sistemang ipinatupad ng anak niya."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]

[articles.pt-BR]
text = "Cosroes I, conhecido como Anushirvan, governou o Império Sassânida de 531 a 579. Ele reorganizou o exército em quatro comandos regionais. Selos preservados identificam os generais responsáveis pelo leste, sul, oeste e norte. Também deu continuidade ao levantamento de terras iniciado sob seu pai, Cavades I, e usou os dados para fixar as taxas do imposto fundiário."
title = "Cosroes I"
lang = "pt-BR"
url = "https://www.iranicaonline.org/articles/kosrow/"
shortArticle = true
intro = ["Cosroes I, conhecido como Anushirvan, governou o Império Sassânida de 531 a 579. Ele reorganizou o exército em quatro comandos regionais. Selos preservados identificam os generais responsáveis pelo leste, sul, oeste e norte. Também deu continuidade ao levantamento de terras iniciado sob seu pai, Cavades I, e usou os dados para fixar as taxas do imposto fundiário."]
sections = [{ title = "Quatro comandos para um império", paragraphs = ["Seu reinado combinou mudanças administrativas e guerras contra o Império Romano do Oriente. Cosroes tomou Antioquia em 540 e instalou pessoas deportadas da cidade perto de Ctesifonte. Procópio descreveu o deslocamento do ponto de vista romano. Após anos de combates e tréguas, os impérios acertaram uma paz de cinquenta anos em 562. Tradições posteriores celebraram Cosroes como exemplo de justiça. Os selos são testemunhos da época sobre os comandos regionais. Muitos detalhes da tributação vêm de autores posteriores. Pesquisadores distinguem as medidas iniciadas por Cavades do sistema posto em prática por seu filho."] }]
sources = [{ title = "Encyclopaedia Iranica, Khosrow I", url = "https://www.iranicaonline.org/articles/kosrow/" }, { title = "Encyclopaedia Iranica, Khosrow I: Reforms", url = "https://www.iranicaonline.org/articles/kosrow/kosrow-i-ii-reforms/" }, { title = "Rika Gyselen, Spahbed, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/spahbed/" }, { title = "Procopius, Persian Wars II.14, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Wars/2D%2A.html" }, { title = "Encyclopaedia Iranica, Byzantine-Iranian Relations", url = "https://www.iranicaonline.org/articles/byzantine-iranian-relations/" }]
