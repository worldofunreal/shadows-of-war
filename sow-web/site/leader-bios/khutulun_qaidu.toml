[articles.en]
text = "Khutulun, also written Qutulun, was a Mongol princess and military commander in Central Asia. Her father Qaidu headed a realm of the house of Ögödei and resisted the authority of Qubilai and his successors. Marco Polo calls her Aijaruc and describes her riding ahead on campaign to seize enemy soldiers. He also tells of suitors staking horses on wrestling matches. The victories and horse counts belong to his account and are difficult to corroborate."
title = "Khutulun"
lang = "en"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, also written Qutulun, was a Mongol princess and military commander in Central Asia. Her father Qaidu headed a realm of the house of Ögödei and resisted the authority of Qubilai and his successors. Marco Polo calls her Aijaruc and describes her riding ahead on campaign to seize enemy soldiers. He also tells of suitors staking horses on wrestling matches. The victories and horse counts belong to his account and are difficult to corroborate."]
sections = [{ title = "A commander of the Ögödeid army", paragraphs = ["The Persian chronicles help reconstruct her role after Qaidu’s death in 1301. Khutulun backed her brother Orus, whom Qaidu had named as heir. The Chaghadaid ruler Du’a instead secured Chapar’s accession. Khutulun guarded her father’s tomb in the region between the Ili and Chu rivers. When Chapar called in the Ögödeid forces around 1306, she came at the head of her own military unit, described as a nominal thousand. The record of that command documents her military authority separately from the stories of her wrestling victories."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.es]
text = "Khutulun, también llamada Qutulun, fue una princesa y comandante mongola en Asia Central. Su padre, Qaidu, encabezó un dominio de la casa de Ogodei y resistió la autoridad de Kublai y sus sucesores. Marco Polo la llama Aijaruc y relata que salía a caballo durante las campañas para apresar combatientes enemigos. También cuenta que sus pretendientes apostaban caballos en combates de lucha. Es difícil corroborar los resultados de esos duelos y las cifras de caballos que da el relato."
title = "Khutulun"
lang = "es"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, también llamada Qutulun, fue una princesa y comandante mongola en Asia Central. Su padre, Qaidu, encabezó un dominio de la casa de Ogodei y resistió la autoridad de Kublai y sus sucesores. Marco Polo la llama Aijaruc y relata que salía a caballo durante las campañas para apresar combatientes enemigos. También cuenta que sus pretendientes apostaban caballos en combates de lucha. Es difícil corroborar los resultados de esos duelos y las cifras de caballos que da el relato."]
sections = [{ title = "Una comandante del ejército ogodeida", paragraphs = ["Las crónicas persas permiten reconstruir su actuación tras la muerte de Qaidu en 1301. Khutulun apoyó a su hermano Orus, a quien su padre había designado heredero. Du'a, kan de la casa de Chagatai, consiguió en cambio la entronización de Chapar. Khutulun custodiaba la tumba de su padre en la región entre los ríos Ilí y Chu. Cuando Chapar convocó a las fuerzas ogodeidas hacia 1306, ella acudió al frente de su propia unidad, descrita como una formación nominal de mil guerreros. Ese registro de mando documenta su autoridad militar por separado de los relatos de lucha."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.fr]
text = "Khutulun, aussi appelée Qutulun, fut princesse et commandante mongole en Asie centrale. Son père Qaïdu dirigeait un domaine de la maison d’Ögödei et résistait à l’autorité de Kubilaï et de ses successeurs. Marco Polo l’appelle Aijaruc et raconte qu’elle s’avançait à cheval en campagne pour faire des prisonniers. Il décrit aussi des prétendants qui misaient des chevaux lors de combats de lutte. Les victoires et les nombres avancés dans ce récit restent difficiles à vérifier."
title = "Khutulun"
lang = "fr"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, aussi appelée Qutulun, fut princesse et commandante mongole en Asie centrale. Son père Qaïdu dirigeait un domaine de la maison d’Ögödei et résistait à l’autorité de Kubilaï et de ses successeurs. Marco Polo l’appelle Aijaruc et raconte qu’elle s’avançait à cheval en campagne pour faire des prisonniers. Il décrit aussi des prétendants qui misaient des chevaux lors de combats de lutte. Les victoires et les nombres avancés dans ce récit restent difficiles à vérifier."]
sections = [{ title = "Une commandante de l’armée ögödéide", paragraphs = ["Les chroniques persanes renseignent sur son rôle après la mort de Qaïdu en 1301. Khutulun soutint son frère Orus, que leur père avait désigné comme héritier. Le khan chagataïde Du’a obtint l’avènement de Chapar. Khutulun devint gardienne du tombeau de son père dans la région entre l’Ili et le Tchou. Lorsque Chapar appela les forces ögödéides vers 1306, elle arriva à la tête de sa propre unité, donnée pour un millier de combattants en théorie. Cette mention de son commandement atteste son autorité militaire indépendamment des récits de lutte."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.de]
text = "Khutulun, auch Qutulun geschrieben, war eine mongolische Prinzessin und Heerführerin in Zentralasien. Ihr Vater Qaidu stand an der Spitze eines Herrschaftsgebiets des Hauses Ögedei und widersetzte sich Kublai und dessen Nachfolgern. Marco Polo nennt sie Aijaruc und berichtet, sie sei auf Feldzügen vorgeritten, um Gegner gefangen zu nehmen. Er erzählt auch von Freiern, die bei Ringkämpfen Pferde als Einsatz boten. Die Siege und die Zahl der Pferde lassen sich schwer überprüfen."
title = "Khutulun"
lang = "de"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, auch Qutulun geschrieben, war eine mongolische Prinzessin und Heerführerin in Zentralasien. Ihr Vater Qaidu stand an der Spitze eines Herrschaftsgebiets des Hauses Ögedei und widersetzte sich Kublai und dessen Nachfolgern. Marco Polo nennt sie Aijaruc und berichtet, sie sei auf Feldzügen vorgeritten, um Gegner gefangen zu nehmen. Er erzählt auch von Freiern, die bei Ringkämpfen Pferde als Einsatz boten. Die Siege und die Zahl der Pferde lassen sich schwer überprüfen."]
sections = [{ title = "Eine Befehlshaberin der Ögedeiden", paragraphs = ["Persische Chroniken erlauben Rückschlüsse auf ihre Rolle nach Qaidus Tod im Jahr 1301. Khutulun unterstützte ihren Bruder Orus, den ihr Vater als Erben bestimmt hatte. Der Tschagatai-Khan Du’a setzte dagegen Chapar durch. Khutulun hütete Qaidus Grab in der Gegend zwischen Ili und Tschüi. Als Chapar um 1306 die ögedeidischen Truppen aufbot, führte Khutulun eine eigene Einheit, die nominell tausend Krieger umfasste. Diese Erwähnung ihres Kommandos belegt ihre militärische Stellung unabhängig von den Geschichten über ihre Ringkämpfe."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.it]
text = "Khutulun, chiamata anche Qutulun, fu una principessa mongola e comandante militare in Asia centrale. Suo padre Qaidu governava un dominio della casa di Ögödei e si oppose all’autorità di Qubilai e dei suoi successori. Marco Polo la chiama Aijaruc e racconta che si lanciava a cavallo davanti ai suoi per catturare soldati nemici. Parla anche di pretendenti che scommettevano cavalli in incontri di lotta. È difficile confermare vittorie e cifre riferite da quel racconto."
title = "Khutulun"
lang = "it"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, chiamata anche Qutulun, fu una principessa mongola e comandante militare in Asia centrale. Suo padre Qaidu governava un dominio della casa di Ögödei e si oppose all’autorità di Qubilai e dei suoi successori. Marco Polo la chiama Aijaruc e racconta che si lanciava a cavallo davanti ai suoi per catturare soldati nemici. Parla anche di pretendenti che scommettevano cavalli in incontri di lotta. È difficile confermare vittorie e cifre riferite da quel racconto."]
sections = [{ title = "Una comandante dell’esercito ögödeide", paragraphs = ["Le cronache persiane permettono di ricostruire il suo ruolo dopo la morte di Qaidu nel 1301. Khutulun sostenne il fratello Orus, che il padre aveva designato come erede. Il khan chagataide Du’a riuscì invece a far salire al potere Chapar. Khutulun custodì la tomba del padre nella regione fra i fiumi Ili e Chu. Quando Chapar convocò le forze ögödeidi intorno al 1306, si presentò al comando di una propria unità, nominalmente di mille guerrieri. Questa testimonianza sul suo comando documenta un ruolo militare distinto dai racconti delle gare di lotta."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.tr]
text = "Qutulun olarak da yazılan Khutulun, Orta Asya’da yaşamış bir Moğol prensesi ve askeri komutandı. Babası Kaydu, Ögedey hanedanına bağlı bir yönetimin başındaydı ve Kubilay ile ardıllarının otoritesine karşı koydu. Marco Polo ona Aijaruc adını verir ve seferlerde atıyla öne çıkarak düşman savaşçılarını esir aldığını anlatır. Aynı anlatıda evlenmek isteyenlerin güreşlerde at ortaya koyduğu da söylenir. Bu zaferleri ve at sayılarını doğrulamak güçtür."
title = "Khutulun"
lang = "tr"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Qutulun olarak da yazılan Khutulun, Orta Asya’da yaşamış bir Moğol prensesi ve askeri komutandı. Babası Kaydu, Ögedey hanedanına bağlı bir yönetimin başındaydı ve Kubilay ile ardıllarının otoritesine karşı koydu. Marco Polo ona Aijaruc adını verir ve seferlerde atıyla öne çıkarak düşman savaşçılarını esir aldığını anlatır. Aynı anlatıda evlenmek isteyenlerin güreşlerde at ortaya koyduğu da söylenir. Bu zaferleri ve at sayılarını doğrulamak güçtür."]
sections = [{ title = "Ögedey ordusunda bir komutan", paragraphs = ["Farsça kronikler, Kaydu’nun 1301’deki ölümünden sonraki rolünü anlamamıza yardımcı olur. Khutulun, babasının veliaht seçtiği kardeşi Orus’u destekledi. Çağatay hanı Du’a ise Çapar’ın tahta çıkmasını sağladı. Khutulun, İli ve Çu nehirleri arasındaki bölgede babasının mezarını korudu. Çapar 1306 dolaylarında Ögedey kuvvetlerini topladığında, nominal olarak bin savaşçıdan oluşan kendi birliğinin başında geldi. Komutanlığına ilişkin bu kayıt, güreş anlatılarından ayrı olarak askeri yetkisini belgeliyor."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.zh-CN]
text = "忽图伦是活跃在中亚的蒙古公主和军事指挥者。她的名字也常转写为库图伦。她的父亲海都出自窝阔台家族，在中亚统辖自己的领地，曾与忽必烈及其继任者争夺权力。海都一度与察合台系的统治者结盟，两家在中亚各有自己的政治根基。一二七一年，海都以窝阔台系汗的身份重新组织本家领地。之后他支持都哇成为察合台系的汗，两人在海都去世前长期合作。到忽图伦必须为父亲的继承安排表态时，这位旧盟友已经成了左右继承结果的关键人物。马可·波罗的记述把忽图伦称为艾贾鲁克，说她在出征时骑马冲到敌军阵前，擒住对手，再把俘虏带回。这个细节来自旅行记的叙事。书中还写到有人为求婚而与她摔跤，并把马匹作为赌注。故事中她每次都获胜，传下的马匹数量很大，但这些数字和各场比赛的经过难以独立核实。现代研究把这类故事与波斯文史料中记载的军事活动对照起来看。"
title = "忽图伦"
lang = "zh-CN"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["忽图伦是活跃在中亚的蒙古公主和军事指挥者。她的名字也常转写为库图伦。她的父亲海都出自窝阔台家族，在中亚统辖自己的领地，曾与忽必烈及其继任者争夺权力。海都一度与察合台系的统治者结盟，两家在中亚各有自己的政治根基。一二七一年，海都以窝阔台系汗的身份重新组织本家领地。之后他支持都哇成为察合台系的汗，两人在海都去世前长期合作。到忽图伦必须为父亲的继承安排表态时，这位旧盟友已经成了左右继承结果的关键人物。马可·波罗的记述把忽图伦称为艾贾鲁克，说她在出征时骑马冲到敌军阵前，擒住对手，再把俘虏带回。这个细节来自旅行记的叙事。书中还写到有人为求婚而与她摔跤，并把马匹作为赌注。故事中她每次都获胜，传下的马匹数量很大，但这些数字和各场比赛的经过难以独立核实。现代研究把这类故事与波斯文史料中记载的军事活动对照起来看。"]
sections = [{ title = "窝阔台家族的军事统帅", paragraphs = ["海都在一三〇一年去世后，家族内部发生继承之争。忽图伦支持父亲指定的继承人斡鲁思，察合台系的都哇则扶立了察八儿。忽图伦后来守护父亲的墓地，研究者将其大致定位在伊犁河与楚河之间的山地。守墓涉及营地和武装力量，也使她远离了争夺权位的中心。约在一三〇六年，察八儿为抵抗都哇的压力召集窝阔台家族的军队。忽图伦带着一支归她指挥的部队到来。史料把这支部队记为千人编制，实际参加战斗的具体人数没有可靠记录。她在召集名册里和诸王及海都的旧将并列，是这段军事经历中可以具体指出的一项证据。后来，都哇得到元朝军队的支援，窝阔台一方败北，忽图伦家族的营地也受到袭击。她此后的行踪和去世的确切经过并不清楚，因而不宜给出确定的死因。相比于摔跤比赛的故事，这些资料让人看到她在家族继承和战争中的实际选择，包括支持哪一位继承人、守护哪一处营地，以及应召时亲自率领哪一支部队。"] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.ja]
text = "クトゥルンは中央アジアで活動したモンゴルの王女であり、部隊を率いた指揮官でもあった。父のカイドゥはオゴデイ家の勢力を中央アジアで率い、クビライやその後継者の権威に対抗した。カイドゥはチャガタイ家の君主と協力したが、それぞれの家には独自の勢力基盤があった。父と長く協力したドゥアは、のちにオゴデイ家の後継者を決めるうえで大きな力を持った。マルコ・ポーロは彼女をアイジャルクと呼び、遠征の際に馬で敵陣に駆け込み、捕らえた兵を連れ帰ったと伝える。また、求婚者が馬を賭けて彼女と組み打ちをしたという話も書いている。試合の勝敗や馬の数を独立した史料で確認することは難しい。ポーロの物語と、同時代に近いペルシア語の年代記が伝える軍事活動を見比べると、彼女がどのような立場で戦ったかを考える手がかりになる。"
title = "クトゥルン"
lang = "ja"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["クトゥルンは中央アジアで活動したモンゴルの王女であり、部隊を率いた指揮官でもあった。父のカイドゥはオゴデイ家の勢力を中央アジアで率い、クビライやその後継者の権威に対抗した。カイドゥはチャガタイ家の君主と協力したが、それぞれの家には独自の勢力基盤があった。父と長く協力したドゥアは、のちにオゴデイ家の後継者を決めるうえで大きな力を持った。マルコ・ポーロは彼女をアイジャルクと呼び、遠征の際に馬で敵陣に駆け込み、捕らえた兵を連れ帰ったと伝える。また、求婚者が馬を賭けて彼女と組み打ちをしたという話も書いている。試合の勝敗や馬の数を独立した史料で確認することは難しい。ポーロの物語と、同時代に近いペルシア語の年代記が伝える軍事活動を見比べると、彼女がどのような立場で戦ったかを考える手がかりになる。"]
sections = [{ title = "オゴデイ家の部隊を率いて", paragraphs = ["一三〇一年に父が死去した後、クトゥルンは父が後継者に指名した兄弟オルスを支持した。一方、チャガタイ家のドゥアはチャパルを即位させた。クトゥルンはイリ川とチュー川の間にあったとされる父の墓を守った。墓を守る役目には、聖域を武力で守ることも含まれていた。およそ一三〇六年、チャパルがオゴデイ家の兵を招集すると、彼女は自らの部隊を率いて加わった。この部隊は千人隊と記録されるが、その時の実際の兵員数は分かっていない。召集された諸王や将軍に交じって、彼女が部隊の指揮官として記録されていることが重要である。その後、ドゥアは元の援軍を得てオゴデイ家の勢力を破り、クトゥルンの一族がいた野営地も襲撃された。彼女の最期については詳しいことが分かっていない。王位をめぐる争いで支持する相手を選び、招集に応じて自ら兵を率いた記録は、組み打ちの逸話とは別に彼女の軍事的な役割を示している。"] }]
