[articles.ko]
text = "쿠툴룬은 중앙아시아에서 활동한 몽골의 공주이자 군 지휘관이었다. 아버지 카이두는 오고타이 가문의 세력을 이끌었고 쿠빌라이와 그 후계자들의 권위에 맞섰다. 카이두는 차가타이 가문의 군주와 협력했지만 두 가문은 중앙아시아에서 각각 별개의 기반을 가지고 있었다. 마르코 폴로는 쿠툴룬을 아이자루크라고 부르며, 원정 중 말을 달려 적진에 뛰어들어 상대 병사를 사로잡았다고 이야기한다. 구혼자들이 말을 걸고 그녀와 씨름을 했다는 이야기도 전한다. 대결의 결과나 말의 수를 다른 자료로 확인하기는 어렵다. 이러한 일화와 페르시아어 연대기에 실린 기록을 함께 살피면 그녀가 군대와 왕위 계승 문제에 어떻게 관여했는지 더 구체적으로 볼 수 있다."
title = "쿠툴룬"
lang = "ko"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["쿠툴룬은 중앙아시아에서 활동한 몽골의 공주이자 군 지휘관이었다. 아버지 카이두는 오고타이 가문의 세력을 이끌었고 쿠빌라이와 그 후계자들의 권위에 맞섰다. 카이두는 차가타이 가문의 군주와 협력했지만 두 가문은 중앙아시아에서 각각 별개의 기반을 가지고 있었다. 마르코 폴로는 쿠툴룬을 아이자루크라고 부르며, 원정 중 말을 달려 적진에 뛰어들어 상대 병사를 사로잡았다고 이야기한다. 구혼자들이 말을 걸고 그녀와 씨름을 했다는 이야기도 전한다. 대결의 결과나 말의 수를 다른 자료로 확인하기는 어렵다. 이러한 일화와 페르시아어 연대기에 실린 기록을 함께 살피면 그녀가 군대와 왕위 계승 문제에 어떻게 관여했는지 더 구체적으로 볼 수 있다."]
sections = [{ title = "오고타이 가문의 지휘관", paragraphs = ["카이두가 1301년에 죽자 쿠툴룬은 아버지가 후계자로 지명한 오루스를 지지했다. 그러나 차가타이 칸 두아는 차파르를 왕위에 올렸다. 쿠툴룬은 일리강과 추강 사이로 추정되는 지역에서 아버지의 무덤을 지켰다. 무덤을 지키는 일에는 무장한 세력으로 성역을 보호하는 임무도 있었다. 1306년 무렵 차파르가 오고타이 가문의 군대를 소집하자 쿠툴룬은 직접 자기 부대를 이끌고 합류했다. 그 부대는 편제상 천 명 규모로 기록되지만 실제 전투에 참가한 인원은 알려져 있지 않다. 여러 왕자와 장군이 소집된 기록에 쿠툴룬이 독자적인 부대의 지휘관으로 등장한다. 이후 두아는 원나라 군대의 지원을 받아 오고타이 가문의 세력을 꺾었고, 쿠툴룬의 가족이 머물던 야영지도 공격을 받았다. 그녀가 어떤 경위로 죽었는지는 확실하지 않다. 구혼자와의 씨름 이야기와 달리, 어느 후계자를 지지했고 어느 부대를 이끌었는지는 그녀가 전쟁과 계승 분쟁에서 맡은 역할을 구체적으로 보여 준다."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.ar]
text = "كانت خوتولون، المعروفة أيضا باسم قوتولون، أميرة مغولية وقائدة عسكرية في آسيا الوسطى. كان أبوها قايدو يحكم بلادا تابعة لبيت أوقطاي ويقاوم سلطة قوبلاي وخلفائه. يسميها ماركو بولو أيجاروق ويروي أنها كانت تندفع على ظهر جوادها أثناء الحملات لأسر مقاتلين من الخصم. ويروي أيضا أن الخطاب كانوا يراهنون بالخيول في مباريات المصارعة. ويصعب التحقق من الانتصارات وأعداد الخيول الواردة في روايته."
title = "خوتولون"
lang = "ar"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["كانت خوتولون، المعروفة أيضا باسم قوتولون، أميرة مغولية وقائدة عسكرية في آسيا الوسطى. كان أبوها قايدو يحكم بلادا تابعة لبيت أوقطاي ويقاوم سلطة قوبلاي وخلفائه. يسميها ماركو بولو أيجاروق ويروي أنها كانت تندفع على ظهر جوادها أثناء الحملات لأسر مقاتلين من الخصم. ويروي أيضا أن الخطاب كانوا يراهنون بالخيول في مباريات المصارعة. ويصعب التحقق من الانتصارات وأعداد الخيول الواردة في روايته."]
sections = [{ title = "قائدة في جيش آل أوقطاي", paragraphs = ["تساعد السجلات الفارسية على فهم دورها بعد وفاة قايدو سنة 1301. أيدت خوتولون أخاها أوروس الذي اختاره أبوه وريثا. لكن خان جغتاي دوا أقام تشابار على العرش. وتولت خوتولون حراسة قبر أبيها في المنطقة الواقعة بين نهري إيلي وتشو. وحين جمع تشابار قوات آل أوقطاي نحو سنة 1306 حضرت خوتولون على رأس وحدتها العسكرية التي وصفت بأنها وحدة من ألف مقاتل من حيث التنظيم. ويوثق ذكر هذه القيادة سلطتها العسكرية بصورة مستقلة عن قصص المصارعة."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.ru]
text = "Хутулун, также известная как Кутулун, была монгольской принцессой и военачальницей в Центральной Азии. Её отец Хайду возглавлял владение дома Угэдэя и противостоял власти Хубилая и его преемников. Марко Поло называет её Айджарук и рассказывает, как она выезжала вперёд во время похода, чтобы захватить противника в плен. Он также описывает поединки, на которые женихи выставляли лошадей. Победы и количество лошадей в этом рассказе трудно подтвердить."
title = "Хутулун"
lang = "ru"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Хутулун, также известная как Кутулун, была монгольской принцессой и военачальницей в Центральной Азии. Её отец Хайду возглавлял владение дома Угэдэя и противостоял власти Хубилая и его преемников. Марко Поло называет её Айджарук и рассказывает, как она выезжала вперёд во время похода, чтобы захватить противника в плен. Он также описывает поединки, на которые женихи выставляли лошадей. Победы и количество лошадей в этом рассказе трудно подтвердить."]
sections = [{ title = "Военачальница дома Угэдэя", paragraphs = ["Персидские хроники позволяют восстановить её роль после смерти Хайду в 1301 году. Хутулун поддержала брата Оруса, которого отец назначил наследником. Однако чагатайский хан Дува добился воцарения Чапара. Хутулун охраняла гробницу отца в районе между реками Или и Чу. Когда Чапар около 1306 года созвал войска дома Угэдэя, она прибыла во главе собственного отряда, номинально насчитывавшего тысячу воинов. Эта запись о её командовании свидетельствует о её военной роли независимо от рассказов о борьбе."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.vi]
text = "Khutulun, còn viết là Qutulun, là công chúa và chỉ huy quân sự người Mông Cổ ở Trung Á. Cha bà là Qaidu, người đứng đầu một lãnh địa của dòng Ögödei và chống lại quyền lực của Hốt Tất Liệt cùng những người kế vị. Marco Polo gọi bà là Aijaruc và kể bà thường cưỡi ngựa tiến lên trong các chiến dịch để bắt lính địch. Ông cũng kể những người cầu hôn đem ngựa ra đánh cược trong các trận đấu vật. Số ngựa và các chiến thắng trong câu chuyện ấy khó kiểm chứng."
title = "Khutulun"
lang = "vi"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, còn viết là Qutulun, là công chúa và chỉ huy quân sự người Mông Cổ ở Trung Á. Cha bà là Qaidu, người đứng đầu một lãnh địa của dòng Ögödei và chống lại quyền lực của Hốt Tất Liệt cùng những người kế vị. Marco Polo gọi bà là Aijaruc và kể bà thường cưỡi ngựa tiến lên trong các chiến dịch để bắt lính địch. Ông cũng kể những người cầu hôn đem ngựa ra đánh cược trong các trận đấu vật. Số ngựa và các chiến thắng trong câu chuyện ấy khó kiểm chứng."]
sections = [{ title = "Nữ chỉ huy của quân Ögödei", paragraphs = ["Các biên niên sử Ba Tư giúp xác định vai trò của bà sau khi Qaidu mất năm 1301. Khutulun ủng hộ người anh em Orus, người mà cha bà chọn làm người kế vị. Tuy nhiên, hãn Du’a của dòng Chagatai đưa Chapar lên nắm quyền. Khutulun trông coi mộ cha ở vùng giữa sông Ili và sông Chu. Khoảng năm 1306, khi Chapar triệu tập lực lượng dòng Ögödei, bà dẫn đơn vị của mình đến, một đội quân được mô tả là có quân số danh nghĩa một nghìn người. Ghi chép về quyền chỉ huy ấy độc lập với các câu chuyện đấu vật."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.id]
text = "Khutulun, juga ditulis Qutulun, adalah putri Mongol dan panglima militer di Asia Tengah. Ayahnya, Qaidu, memimpin wilayah kekuasaan wangsa Ögödei dan menentang wewenang Kubilai beserta para penerusnya. Marco Polo menyebutnya Aijaruc dan berkisah bahwa ia memacu kudanya ke depan dalam peperangan untuk menawan prajurit musuh. Ia juga mengisahkan para pelamar yang mempertaruhkan kuda dalam pertandingan gulat. Kemenangan dan jumlah kuda dalam kisah itu sulit diverifikasi."
title = "Khutulun"
lang = "id"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, juga ditulis Qutulun, adalah putri Mongol dan panglima militer di Asia Tengah. Ayahnya, Qaidu, memimpin wilayah kekuasaan wangsa Ögödei dan menentang wewenang Kubilai beserta para penerusnya. Marco Polo menyebutnya Aijaruc dan berkisah bahwa ia memacu kudanya ke depan dalam peperangan untuk menawan prajurit musuh. Ia juga mengisahkan para pelamar yang mempertaruhkan kuda dalam pertandingan gulat. Kemenangan dan jumlah kuda dalam kisah itu sulit diverifikasi."]
sections = [{ title = "Panglima pasukan keturunan Ögödei", paragraphs = ["Kronik Persia mencatat perannya setelah Qaidu wafat pada 1301. Khutulun mendukung saudaranya Orus, yang ditunjuk ayahnya sebagai pewaris. Namun, Khan Du’a dari wangsa Chagatai berhasil mengangkat Chapar. Khutulun menjaga makam ayahnya di kawasan antara Sungai Ili dan Sungai Chu. Ketika Chapar memanggil pasukan wangsa Ögödei sekitar 1306, ia datang memimpin satuan miliknya sendiri, dengan kekuatan nominal seribu prajurit. Catatan tentang satuan ini menjadi bukti kedudukan militernya di luar kisah pertandingan gulat."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.fil]
text = "Si Khutulun, na isinusulat ding Qutulun, ay isang prinsesang Mongol at kumandante sa Gitnang Asya. Pinamunuan ng ama niyang si Qaidu ang isang nasasakupan ng angkan ni Ögödei at tinutulan ang kapangyarihan ni Kublai at ng mga humalili sa kaniya. Tinawag siyang Aijaruc ni Marco Polo, na nagkuwento na nauuna siyang mangabayo sa mga kampanya para manghuli ng kalaban. Isinalaysay rin ni Polo ang tungkol sa mga manliligaw na tumataya ng mga kabayo sa pakikipagbuno. Mahirap tiyakin ang mga panalo at bilang ng kabayo sa salaysay."
title = "Khutulun"
lang = "fil"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Si Khutulun, na isinusulat ding Qutulun, ay isang prinsesang Mongol at kumandante sa Gitnang Asya. Pinamunuan ng ama niyang si Qaidu ang isang nasasakupan ng angkan ni Ögödei at tinutulan ang kapangyarihan ni Kublai at ng mga humalili sa kaniya. Tinawag siyang Aijaruc ni Marco Polo, na nagkuwento na nauuna siyang mangabayo sa mga kampanya para manghuli ng kalaban. Isinalaysay rin ni Polo ang tungkol sa mga manliligaw na tumataya ng mga kabayo sa pakikipagbuno. Mahirap tiyakin ang mga panalo at bilang ng kabayo sa salaysay."]
sections = [{ title = "Kumandante ng hukbo ng angkan ni Ögödei", paragraphs = ["Nakatala sa mga kronikang Persiano ang papel niya matapos mamatay si Qaidu noong 1301. Sinuportahan ni Khutulun ang kapatid niyang si Orus, na pinili ng ama na humalili. Gayunman, naipaupo ng khan ng angkan ni Chagatai na si Du’a si Chapar. Binantayan ni Khutulun ang libingan ng ama sa pagitan ng mga ilog Ili at Chu. Nang tipunin ni Chapar ang mga hukbo ng angkan ni Ögödei bandang 1306, namuno si Khutulun sa sarili niyang yunit na nakatalang may nominal na isang libong mandirigma. Patunay ang tala ng kumand na iyon sa tungkulin niya sa hukbo."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]

[articles.pt-BR]
text = "Khutulun, também chamada Qutulun, foi uma princesa e comandante militar mongol na Ásia Central. Seu pai, Qaidu, chefiava um domínio da casa de Ögödei e resistia à autoridade de Cublai e seus sucessores. Marco Polo a chama de Aijaruc e conta que ela avançava a cavalo durante as campanhas para capturar combatentes inimigos. Ele também descreve pretendentes que apostavam cavalos em combates de luta. As vitórias e o número de cavalos mencionados nesse relato são difíceis de confirmar."
title = "Khutulun"
lang = "pt-BR"
url = "https://www.jstor.org/stable/j.ctv125jrx5.9"
shortArticle = true
intro = ["Khutulun, também chamada Qutulun, foi uma princesa e comandante militar mongol na Ásia Central. Seu pai, Qaidu, chefiava um domínio da casa de Ögödei e resistia à autoridade de Cublai e seus sucessores. Marco Polo a chama de Aijaruc e conta que ela avançava a cavalo durante as campanhas para capturar combatentes inimigos. Ele também descreve pretendentes que apostavam cavalos em combates de luta. As vitórias e o número de cavalos mencionados nesse relato são difíceis de confirmar."]
sections = [{ title = "Uma comandante do exército de Ögödei", paragraphs = ["As crônicas persas permitem reconstituir sua atuação após a morte de Qaidu em 1301. Khutulun apoiou o irmão Orus, designado herdeiro pelo pai. Du’a, cã da casa de Chagatai, conseguiu em vez disso entronizar Chapar. Khutulun guardou o túmulo do pai na região entre os rios Ili e Chu. Quando Chapar convocou as forças da casa de Ögödei por volta de 1306, ela compareceu à frente de uma unidade própria, nominalmente de mil combatentes. Esse registro documenta sua autoridade militar à parte das histórias de luta."] }]
sources = [{ title = "Michal Biran, Qutulun: The Warrior Princess of Mongol Central Asia", url = "https://www.jstor.org/stable/j.ctv125jrx5.9" }, { title = "Marco Polo, Travels, book IV, chapter IV, Yule edition", url = "https://www.gutenberg.org/cache/epub/12410/pg12410-images.html" }, { title = "Michal Biran, Qaidu and the Rise of the Independent Mongol State in Central Asia", url = "https://www.routledge.com/Qaidu-and-the-Rise-of-the-Independent-Mongol-State-In-Central-Asia/Biran/p/book/9781315026947" }]
