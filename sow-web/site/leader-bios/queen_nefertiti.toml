[articles.pt-BR]
text = "Nefertiti foi a Grande Esposa Real de Aquenáton durante a XVIII dinastia do Egito. Em Aquetáton, hoje Amarna, teve um papel visível no culto a Aton. Um fragmento de quartzito vermelho no Museu Petrie a mostra vertendo uma libação sob os raios do disco solar."
title = "Nefertiti"
lang = "pt-BR"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti foi a Grande Esposa Real de Aquenáton durante a XVIII dinastia do Egito. Em Aquetáton, hoje Amarna, teve um papel visível no culto a Aton. Um fragmento de quartzito vermelho no Museu Petrie a mostra vertendo uma libação sob os raios do disco solar."]
sections = [{ title = "O papel da rainha em Amarna", paragraphs = ["Com base nos relevos encontrados em escavações, o Projeto Amarna relaciona parte do complexo de Kom el-Nana a um santuário solar associado a Nefertiti. Pátios abertos deixavam entrar a luz, e pequenos blocos de pedra chamados talatat serviam para erguer paredes de espaços que dispensavam coberturas pesadas. Uma inscrição de pedreira em Dayr Abu Hinnis ainda chama Nefertiti de Grande Esposa Real no décimo sexto ano de Aquenáton. Continua em debate se depois ela reinou com o nome de Neferneferuaton. Os relevos e o santuário registram seu papel cerimonial em Amarna."] }]
