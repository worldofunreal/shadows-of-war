[articles.en]
text = "Nefertiti was Great Royal Wife to Akhenaten in Egypt’s Eighteenth Dynasty. At Akhetaten, now Amarna, she took a visible role in the worship of the Aten. A red quartzite fragment in the Petrie Museum shows her making a libation beneath the rays of the sun disk."
title = "Nefertiti"
lang = "en"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti was Great Royal Wife to Akhenaten in Egypt’s Eighteenth Dynasty. At Akhetaten, now Amarna, she took a visible role in the worship of the Aten. A red quartzite fragment in the Petrie Museum shows her making a libation beneath the rays of the sun disk."]
sections = [{ title = "The queen’s role at Amarna", paragraphs = ["The Amarna Project identifies part of the complex at Kom el-Nana as a sun shrine associated with Nefertiti, based on excavated relief fragments. At Amarna, open courts admitted sunlight and builders used small stone blocks known as talatat, practical for the walls of spaces that did not need heavy stone roofs. A quarry inscription at Dayr Abu Hinnis names Nefertiti as Great Royal Wife in Akhenaten’s sixteenth year, placing her at court late in his reign. Whether she later ruled under the name Neferneferuaten remains debated. The shrine and the reliefs establish her own ceremonial role at Amarna."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.es]
text = "Nefertiti fue Gran Esposa Real de Akenatón durante la dinastía XVIII de Egipto. En Ajetatón, la actual Amarna, tuvo un papel visible en el culto a Atón. Un fragmento de cuarcita roja del Museo Petrie la representa vertiendo una libación bajo los rayos del disco solar."
title = "Nefertiti"
lang = "es"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti fue Gran Esposa Real de Akenatón durante la dinastía XVIII de Egipto. En Ajetatón, la actual Amarna, tuvo un papel visible en el culto a Atón. Un fragmento de cuarcita roja del Museo Petrie la representa vertiendo una libación bajo los rayos del disco solar."]
sections = [{ title = "El papel de la reina en Amarna", paragraphs = ["El Proyecto Amarna identifica parte del conjunto de Kom el-Nana con un santuario solar asociado a Nefertiti, a partir de fragmentos de relieves hallados en la excavación. Los patios abiertos dejaban pasar la luz, y las paredes de espacios que prescindían de cubiertas pesadas se podían levantar con pequeños bloques de piedra llamados talatat. Una inscripción de cantera en Dayr Abu Hinnis todavía llama a Nefertiti Gran Esposa Real en el año 16 de Akenatón. Si más tarde reinó con el nombre de Neferneferuatón sigue siendo objeto de debate. Los relieves y el santuario documentan su papel ceremonial en la ciudad."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.fr]
text = "Néfertiti était la grande épouse royale d’Akhenaton sous la XVIIIe dynastie égyptienne. À Akhetaton, aujourd’hui Amarna, elle occupait une place visible dans le culte d’Aton. Un fragment de quartzite rouge conservé au musée Petrie la montre en train de verser une libation sous les rayons du disque solaire."
title = "Néfertiti"
lang = "fr"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Néfertiti était la grande épouse royale d’Akhenaton sous la XVIIIe dynastie égyptienne. À Akhetaton, aujourd’hui Amarna, elle occupait une place visible dans le culte d’Aton. Un fragment de quartzite rouge conservé au musée Petrie la montre en train de verser une libation sous les rayons du disque solaire."]
sections = [{ title = "Le rôle de la reine à Amarna", paragraphs = ["D’après les fragments de reliefs mis au jour, le Projet Amarna associe une partie du complexe de Kom el-Nana à un sanctuaire solaire de Néfertiti. Des cours ouvertes laissaient entrer la lumière, et de petits blocs de pierre appelés talatates permettaient de bâtir les murs des espaces dépourvus de toiture lourde. Une inscription de carrière à Dayr Abu Hinnis désigne encore Néfertiti comme grande épouse royale en l’an 16 du règne d’Akhenaton. Son identification avec la souveraine Néfernéferouaton reste débattue. Les reliefs et le sanctuaire témoignent de son rôle cérémoniel à Amarna."] }]
