[articles.fil]
text = "Si Nefertiti ang Dakilang Maharlikang Asawa ni Akhenaten noong Ikalabingwalong Dinastiya ng Ehipto. Sa Akhetaten, na ngayon ay Amarna, kitang-kita ang papel niya sa pagsamba kay Aten. Ipinakikita sa piraso ng pulang quartzite sa Petrie Museum ang pagbuhos niya ng alay sa ilalim ng sinag ng araw."
title = "Nefertiti"
lang = "fil"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Si Nefertiti ang Dakilang Maharlikang Asawa ni Akhenaten noong Ikalabingwalong Dinastiya ng Ehipto. Sa Akhetaten, na ngayon ay Amarna, kitang-kita ang papel niya sa pagsamba kay Aten. Ipinakikita sa piraso ng pulang quartzite sa Petrie Museum ang pagbuhos niya ng alay sa ilalim ng sinag ng araw."]
sections = [{ title = "Ang papel ng reyna sa Amarna", paragraphs = ["Batay sa mga inukit na batong nahukay, iniuugnay ng Amarna Project ang isang bahagi ng Kom el-Nana sa isang dambana ng araw na may kaugnayan kay Nefertiti. Nakapapasok ang sikat ng araw sa mga bukas na patyo. Maaaring gamitin sa mga pader na hindi sumusuporta sa mabibigat na bubong ang maliliit na tipak ng batong tinatawag na talatat. Tinatawag pa ring Dakilang Maharlikang Asawa si Nefertiti sa isang inskripsiyon sa tibagan sa Dayr Abu Hinnis na may petsa sa ikalabing-anim na taon ng paghahari ni Akhenaten. Pinagtatalunan kung namuno siya pagkaraan sa pangalang Neferneferuaten. Ipinakikita ng dambana at mga ukit ang papel niya sa mga ritwal sa Amarna."] }]
