[articles.de]
text = "Nofretete war die Große Königliche Gemahlin Echnatons in der 18. Dynastie Ägyptens. In Achetaton, dem heutigen Amarna, nahm sie eine sichtbare Rolle im Kult des Aton ein. Ein Fragment aus rotem Quarzit im Petrie Museum zeigt, wie sie unter den Strahlen der Sonnenscheibe ein Trankopfer darbringt."
title = "Nofretete"
lang = "de"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nofretete war die Große Königliche Gemahlin Echnatons in der 18. Dynastie Ägyptens. In Achetaton, dem heutigen Amarna, nahm sie eine sichtbare Rolle im Kult des Aton ein. Ein Fragment aus rotem Quarzit im Petrie Museum zeigt, wie sie unter den Strahlen der Sonnenscheibe ein Trankopfer darbringt."]
sections = [{ title = "Die Rolle der Königin in Amarna", paragraphs = ["Anhand ausgegrabener Reliefstücke bringt das Amarna Project einen Teil der Anlage von Kom el-Nana mit einem Sonnenheiligtum Nofretetes in Verbindung. Offene Höfe ließen das Sonnenlicht einfallen. Für die Wände von Bereichen ohne schweres Steindach ließen sich kleine Steinblöcke verwenden, die als Talatat bekannt sind. Eine Steinbruchinschrift in Dayr Abu Hinnis nennt Nofretete noch im 16. Regierungsjahr Echnatons als Große Königliche Gemahlin. Ob sie später unter dem Namen Neferneferuaton herrschte, ist umstritten. Reliefs und Heiligtum belegen ihre zeremonielle Rolle in Amarna."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.it]
text = "Nefertiti fu la Grande Sposa Reale di Akhenaton durante la XVIII dinastia egizia. Ad Akhetaton, l’odierna Amarna, ebbe un ruolo visibile nel culto di Aton. Un frammento di quarzite rossa del Petrie Museum la raffigura mentre versa una libagione sotto i raggi del disco solare."
title = "Nefertiti"
lang = "it"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti fu la Grande Sposa Reale di Akhenaton durante la XVIII dinastia egizia. Ad Akhetaton, l’odierna Amarna, ebbe un ruolo visibile nel culto di Aton. Un frammento di quarzite rossa del Petrie Museum la raffigura mentre versa una libagione sotto i raggi del disco solare."]
sections = [{ title = "Il ruolo della regina ad Amarna", paragraphs = ["Il Progetto Amarna, sulla base di frammenti di rilievi rinvenuti negli scavi, collega parte del complesso di Kom el-Nana a un santuario solare di Nefertiti. I cortili aperti lasciavano entrare la luce e piccoli blocchi di pietra detti talatat permettevano di costruire le pareti degli spazi privi di coperture pesanti. Un’iscrizione di cava a Dayr Abu Hinnis la chiama ancora Grande Sposa Reale nell’anno 16 di Akhenaton. Si discute se abbia poi regnato con il nome di Neferneferuaton. I rilievi e il santuario documentano il suo ruolo cerimoniale ad Amarna."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.tr]
text = "Nefertiti, Mısır’ın On Sekizinci Hanedanı döneminde Akhenaton’un Büyük Kraliyet Eşi’ydi. Bugün Amarna olarak bilinen Akhetaton’da Aten tapımında görünür bir rol üstlendi. Petrie Müzesi’ndeki kırmızı kuvarsit bir parça, güneş diskinin ışınları altında içki sunusu yaptığını gösterir."
title = "Nefertiti"
lang = "tr"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti, Mısır’ın On Sekizinci Hanedanı döneminde Akhenaton’un Büyük Kraliyet Eşi’ydi. Bugün Amarna olarak bilinen Akhetaton’da Aten tapımında görünür bir rol üstlendi. Petrie Müzesi’ndeki kırmızı kuvarsit bir parça, güneş diskinin ışınları altında içki sunusu yaptığını gösterir."]
sections = [{ title = "Kraliçenin Amarna’daki rolü", paragraphs = ["Amarna Projesi, kazıda bulunan kabartma parçalarına dayanarak Kom el-Nana’daki yapının bir bölümünü Nefertiti’ye bağlı bir güneş tapınağıyla ilişkilendirir. Açık avlular güneş ışığını alıyordu. Ağır taş çatı gerektirmeyen bölümlerin duvarlarında talatat denilen küçük taş bloklar kullanılabiliyordu. Dayr Ebu Hinnis’teki bir taş ocağı yazıtında Nefertiti, Akhenaton’un saltanatının on altıncı yılında hâlâ Büyük Kraliyet Eşi olarak anılır. Daha sonra Neferneferuaton adıyla hüküm sürüp sürmediği tartışmalıdır. Kabartmalar ve tapınak, Amarna’daki törensel rolünü belgeler."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.zh-CN]
text = "娜芙蒂蒂是古埃及第十八王朝阿肯那顿的大王妻。阿肯那顿把王室中心迁到阿赫塔顿，也就是今天的阿玛尔纳。王后在当地的阿顿崇拜中有清楚可见的仪式角色。皮特里博物馆收藏的一块红色石英岩残片来自阿玛尔纳，其上雕有她的头部和手臂。她正在倾倒祭酒，太阳圆盘的光线末端有手伸向她。另一些浮雕把她与阿肯那顿和女儿梅里塔顿一同刻在供桌旁。两类图像分别保存了她独自祭献和王室成员共同祭献的场面。"
title = "娜芙蒂蒂"
lang = "zh-CN"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["娜芙蒂蒂是古埃及第十八王朝阿肯那顿的大王妻。阿肯那顿把王室中心迁到阿赫塔顿，也就是今天的阿玛尔纳。王后在当地的阿顿崇拜中有清楚可见的仪式角色。皮特里博物馆收藏的一块红色石英岩残片来自阿玛尔纳，其上雕有她的头部和手臂。她正在倾倒祭酒，太阳圆盘的光线末端有手伸向她。另一些浮雕把她与阿肯那顿和女儿梅里塔顿一同刻在供桌旁。两类图像分别保存了她独自祭献和王室成员共同祭献的场面。"]
sections = [{ title = "王后在阿玛尔纳的仪式角色", paragraphs = ["阿玛尔纳考古项目在科姆纳纳清理出建筑遗迹和浮雕残片。对残片铭文的研究把其中一部分建筑认定为与娜芙蒂蒂有关的太阳神圣所。遗址后来建有一座基督教修道院，其建筑使用了古代材料，给辨认早期建筑带来困难。研究者利用浮雕、文字和建筑遗迹来重建这座圣所的用途。大都会艺术博物馆也指出，当地的太阳崇拜可以利用露天庭院，让光线直接照入。建筑物不需要支撑沉重石顶的墙面可以使用较小、容易搬运的塔拉塔特石块。大都会的研究把这种石块的典型尺寸写为约二十六乘五十二乘二十四厘米。卡纳克也保留了当时建筑使用的石块，它们后来被拆下用于填筑其他神庙的塔门。阿玛尔纳大阿顿神庙的发掘出土了雕有成排供桌的这类石块，桌上可见面包和其他供品。这些遗物可以说明祭祀如何安排，也留下当时工匠所用材料和建造方法的线索。阿玛尔纳附近代尔阿布欣尼斯的石灰岩采石场则保存了一条标有阿肯那顿在位第十六年的铭文，仍用大王妻的头衔称呼娜芙蒂蒂。这条记录说明她在该王统治晚期仍在世，并继续使用王后的头衔。她后来是否就是使用涅弗涅弗鲁阿顿王名的那位统治者，仍有争论。采石场铭文能确定的是那一年使用的称号。圣所与祭献浮雕则有助于了解她在阿玛尔纳仪式中的作用。游戏把当时便于搬运的小型石块和工坊供应转化为一项建设规则。"] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.ja]
text = "ネフェルティティは古代エジプト第十八王朝の王アクエンアテンの大王妃だった。現在アマルナと呼ばれるアケトアテンで、彼女は太陽円盤アテンの祭祀に目立つ役割を果たした。ペトリー博物館が所蔵する赤色珪岩の断片には、彼女が太陽の光の下で神酒を注ぐ姿が刻まれている。別の石の断片には、王と王妃、その娘メリトアテンが供物台の前に立つ場面が残る。王妃が自ら供物を捧げる場面と、家族で祭祀を行う場面がともに伝わっている。"
title = "ネフェルティティ"
lang = "ja"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["ネフェルティティは古代エジプト第十八王朝の王アクエンアテンの大王妃だった。現在アマルナと呼ばれるアケトアテンで、彼女は太陽円盤アテンの祭祀に目立つ役割を果たした。ペトリー博物館が所蔵する赤色珪岩の断片には、彼女が太陽の光の下で神酒を注ぐ姿が刻まれている。別の石の断片には、王と王妃、その娘メリトアテンが供物台の前に立つ場面が残る。王妃が自ら供物を捧げる場面と、家族で祭祀を行う場面がともに伝わっている。"]
sections = [{ title = "アマルナにおける王妃の役割", paragraphs = ["アマルナ調査隊は、コム・エル・ナナで出土した浮彫の断片と銘文から、遺構の一部をネフェルティティに関係する太陽の聖所と考えている。後世の修道院が古代の建材を再利用し、もとの建物の一部を覆っていたため、調査では建物の痕跡と断片の双方が手掛かりになった。当時の太陽神祭祀に用いられた中庭には、太陽の光が入るように屋根がなかった。重い石の屋根を支える必要のない壁には、タラタートと呼ばれる小ぶりな石材を使えた。アテン大神殿から出土した石の一つには、パンや供物を載せた台が列をなす様子が彫られており、神殿で行われた祭祀の一端が分かる。アマルナの近くにあるデイル・アブー・ヒンニスの採石場では、アクエンアテンの治世第十六年と記された銘文が見つかった。そこにはネフェルティティが大王妃として記されている。これは王の治世の終わり近くにも彼女が生きており、その称号を用いていたことを示す。後にネフェルネフェルウアテンという名で統治した人物と同一かどうかには議論がある。採石場の銘文で確かめられる当時の称号と、後の王位に関する仮説は区別される。アマルナの聖所と浮彫は、王妃自身が祭祀で果たした役割を調べる手掛かりとなる。"] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.ko]
text = "네페르티티는 고대 이집트 제18왕조에서 아케나텐의 대왕비였다. 오늘날 아마르나라 불리는 아케트아텐에서 그는 태양 원반 아텐을 섬기는 의례에 참여했다. 페트리 박물관이 소장한 붉은 규암 조각에는 태양빛 아래에서 액체 제물을 붓는 그의 모습이 새겨져 있다. 다른 석재 조각에는 아케나텐, 네페르티티, 그들의 딸 메리타텐이 제물을 올리는 탁자 앞에 서 있다. 이 자료들에는 왕비가 직접 제물을 바치는 모습과 왕실 가족이 함께 의례에 참여하는 모습이 모두 남아 있다."
title = "네페르티티"
lang = "ko"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["네페르티티는 고대 이집트 제18왕조에서 아케나텐의 대왕비였다. 오늘날 아마르나라 불리는 아케트아텐에서 그는 태양 원반 아텐을 섬기는 의례에 참여했다. 페트리 박물관이 소장한 붉은 규암 조각에는 태양빛 아래에서 액체 제물을 붓는 그의 모습이 새겨져 있다. 다른 석재 조각에는 아케나텐, 네페르티티, 그들의 딸 메리타텐이 제물을 올리는 탁자 앞에 서 있다. 이 자료들에는 왕비가 직접 제물을 바치는 모습과 왕실 가족이 함께 의례에 참여하는 모습이 모두 남아 있다."]
sections = [{ title = "아마르나에서 왕비가 맡은 역할", paragraphs = ["아마르나 발굴단은 콤 엘나나 유적에서 찾은 부조 조각과 명문을 바탕으로 건축물의 일부를 네페르티티와 관련된 태양 신전으로 해석한다. 후대의 수도원이 앞선 건물 위에 들어섰고 옛 건축 재료를 재사용했다. 그래서 발굴 과정에서 발견한 조각과 남은 건물의 배치를 함께 살펴야 한다. 아마르나의 태양 의례에는 빛이 들어오는 지붕 없는 뜰이 쓰였다. 무거운 돌 지붕을 떠받칠 필요가 없는 벽에는 탈라타트라고 부르는 작은 석재를 사용할 수 있었다. 아텐 대신전에서 출토된 석재 중 하나에는 빵과 제물을 얹은 탁자들이 줄지어 새겨져 있다. 이 조각을 통해 당시 제물의 종류와 배치를 살펴볼 수 있다. 아마르나 인근 다이르 아부 힌니스 채석장에서 발견된 명문은 아케나텐 재위 16년을 기록하면서 네페르티티를 대왕비라고 부른다. 그가 아케나텐 치세 후반까지 생존했고 당시에도 그 칭호를 썼다는 증거다. 이후 네페르네페루아텐이라는 왕명으로 통치한 인물이 네페르티티였는지는 여전히 논의된다. 채석장 명문은 날짜가 확인되는 왕비의 칭호를 보여 주고, 아마르나의 부조와 신전은 그가 직접 맡은 의례의 성격을 보여 준다."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.ar]
text = "كانت نفرتيتي الزوجة الملكية الكبرى لأخناتون في الأسرة الثامنة عشرة بمصر. وكان لها حضور بارز في عبادة آتون في أخيتاتون، التي تُعرف اليوم بتل العمارنة. وتُظهرها قطعة من الكوارتزيت الأحمر محفوظة في متحف بيتري وهي تسكب قربانًا تحت أشعة قرص الشمس."
title = "نفرتيتي"
lang = "ar"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["كانت نفرتيتي الزوجة الملكية الكبرى لأخناتون في الأسرة الثامنة عشرة بمصر. وكان لها حضور بارز في عبادة آتون في أخيتاتون، التي تُعرف اليوم بتل العمارنة. وتُظهرها قطعة من الكوارتزيت الأحمر محفوظة في متحف بيتري وهي تسكب قربانًا تحت أشعة قرص الشمس."]
sections = [{ title = "دور الملكة في العمارنة", paragraphs = ["يربط مشروع العمارنة جزءًا من مجمع كوم النانا بمزار شمسي ارتبط بنفرتيتي، استنادًا إلى أجزاء من نقوش بارزة استُخرجت في الحفريات. وكانت الأفنية المفتوحة تسمح بدخول ضوء الشمس، وأمكن بناء جدران المساحات التي لم تحتج إلى أسقف حجرية ثقيلة بكتل صغيرة تُعرف باسم التلاتات. ويذكر نقش في محجر دير أبو حنس نفرتيتي بصفتها الزوجة الملكية الكبرى في العام السادس عشر من حكم أخناتون، مما يوثّق مكانتها في أواخر عهده. وما زال الباحثون يناقشون إن كانت قد حكمت لاحقًا باسم نفرنفروآتون. وتوثق النقوش والمزار دورها في الشعائر الدينية في العمارنة."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.ru]
text = "Нефертити была великой царской супругой Эхнатона во времена XVIII династии Египта. В Ахетатоне, нынешней Амарне, она занимала заметное место в культе Атона. Фрагмент красного кварцита из Музея Петри изображает её совершающей возлияние под лучами солнечного диска."
title = "Нефертити"
lang = "ru"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Нефертити была великой царской супругой Эхнатона во времена XVIII династии Египта. В Ахетатоне, нынешней Амарне, она занимала заметное место в культе Атона. Фрагмент красного кварцита из Музея Петри изображает её совершающей возлияние под лучами солнечного диска."]
sections = [{ title = "Роль царицы в Амарне", paragraphs = ["Участники Амарнского проекта на основании найденных при раскопках рельефов связывают часть комплекса Ком-эль-Нана с солнечным святилищем Нефертити. Открытые дворы пропускали солнечный свет. Для стен помещений, не требовавших тяжёлых каменных крыш, применялись небольшие блоки, известные как талататы. Надпись в каменоломне Дайр-Абу-Хиннис называет Нефертити великой царской супругой ещё на шестнадцатом году правления Эхнатона. Вопрос о том, правила ли она позднее под именем Нефернефруатон, остаётся спорным. Рельефы и святилище свидетельствуют о её обрядовой роли в Амарне."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.vi]
text = "Nefertiti là Đại Vương Phi của Akhenaten dưới Vương triều thứ Mười tám của Ai Cập. Tại Akhetaten, nay là Amarna, bà giữ vai trò nổi bật trong việc thờ thần Aten. Một mảnh đá thạch anh đỏ ở Bảo tàng Petrie khắc cảnh bà rót lễ vật dưới những tia sáng của đĩa mặt trời."
title = "Nefertiti"
lang = "vi"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti là Đại Vương Phi của Akhenaten dưới Vương triều thứ Mười tám của Ai Cập. Tại Akhetaten, nay là Amarna, bà giữ vai trò nổi bật trong việc thờ thần Aten. Một mảnh đá thạch anh đỏ ở Bảo tàng Petrie khắc cảnh bà rót lễ vật dưới những tia sáng của đĩa mặt trời."]
sections = [{ title = "Vai trò của hoàng hậu ở Amarna", paragraphs = ["Dựa vào các mảnh phù điêu khai quật được, Dự án Amarna liên hệ một phần quần thể Kom el-Nana với một điện thờ mặt trời gắn với Nefertiti. Các sân mở đón ánh sáng mặt trời. Những khối đá nhỏ gọi là talatat có thể dùng để xây tường cho các khu vực không cần mái đá nặng. Một văn khắc ở mỏ đá Dayr Abu Hinnis vẫn gọi Nefertiti là Đại Vương Phi vào năm trị vì thứ mười sáu của Akhenaten. Việc bà có trị vì sau đó với tên Neferneferuaten hay không vẫn còn được tranh luận. Các phù điêu và điện thờ ghi nhận vai trò nghi lễ của bà ở Amarna."] }]
sources = [{ title = "Petrie Museum, UCL, Nefertiti making libation (UC040)", url = "https://collections.ucl.ac.uk/Details/petrie/1238" }, { title = "Amarna Project, Kom el-Nana", url = "https://www.amarnaproject.com/amarna-the-place/kom-el-nana/" }, { title = "The Metropolitan Museum of Art, Art, Architecture, and the City in the Reign of Akhenaten", url = "https://www.metmuseum.org/fr/essays/art-architecture-and-the-city-in-the-reign-of-amenhotep-iv-akhenaten-ca-13531336-b-c" }, { title = "KU Leuven, Dayr Abu Hinnis inscription, Year 16", url = "https://www.arts.kuleuven.be/dayr-al-barsha/news/year-16-graffito-nefertiti" }, { title = "Athena Van der Perre, The Year 16 Graffito of Akhenaten", url = "https://fundacionieae.es/wp-content/uploads/2024/08/21_Van_der_Perre_engl.pdf" }, { title = "Petrie Museum, UCL, Akhenaten and the rays of the sun god Aten (UC401)", url = "https://www.ucl.ac.uk/engage/museums-collections/petrie-museum-egyptian-and-sudanese-archaeology/top-objects-petrie-museum/akhenaten-and-rays-sun-god-aten" }, { title = "The Metropolitan Museum of Art, Talatat with Offerings in the Temple", url = "https://www.metmuseum.org/art/collection/search/572218" }]

[articles.id]
text = "Nefertiti adalah Permaisuri Agung Akhenaten pada Dinasti Kedelapan Belas Mesir. Ia memegang peran yang terlihat dalam pemujaan Aten di Akhetaten, kini Amarna. Sebuah fragmen kuarsit merah di Museum Petrie memperlihatkan Nefertiti menuangkan persembahan cair di bawah sinar cakram matahari."
title = "Nefertiti"
lang = "id"
url = "https://collections.ucl.ac.uk/Details/petrie/1238"
shortArticle = true
intro = ["Nefertiti adalah Permaisuri Agung Akhenaten pada Dinasti Kedelapan Belas Mesir. Ia memegang peran yang terlihat dalam pemujaan Aten di Akhetaten, kini Amarna. Sebuah fragmen kuarsit merah di Museum Petrie memperlihatkan Nefertiti menuangkan persembahan cair di bawah sinar cakram matahari."]
sections = [{ title = "Peran ratu di Amarna", paragraphs = ["Berdasarkan pecahan relief hasil penggalian, Proyek Amarna menghubungkan sebagian kompleks Kom el-Nana dengan tempat pemujaan matahari yang berkaitan dengan Nefertiti. Pelataran terbuka memungkinkan sinar matahari masuk. Balok-balok batu kecil yang dikenal sebagai talatat dapat digunakan untuk dinding ruang yang tidak memerlukan atap batu berat. Prasasti di tambang Dayr Abu Hinnis masih menyebut Nefertiti sebagai Permaisuri Agung pada tahun keenam belas pemerintahan Akhenaten. Apakah ia kemudian bertakhta dengan nama Neferneferuaten masih diperdebatkan. Relief dan bangunan suci itu mencatat peran upacaranya di Amarna."] }]
