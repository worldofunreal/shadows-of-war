[articles.de]
text = "Peter I. (1672–1725) regierte Russland in einer Zeit tiefgreifender politischer, militärischer und administrativer Veränderungen. Ab 1682 teilte er sich den Thron mit seinem Halbbruder Iwan V. und ab 1696 herrschte er allein. Er strebte für Russland Zugang zur Ostsee und zum Schwarzen Meer an. Die Asow-Feldzüge machten den Schiffbau zu einer Priorität, und Peter ließ eine ständige Marine aufbauen. 1703 gründete er Sankt Petersburg. Der Frieden von Nystad beendete 1721 den Großen Nordischen Krieg. Im selben Jahr nahm Peter den Kaisertitel an. Steuern und Zwangsrekrutierung belasteten die Bevölkerung schwer. Die russische Präsidentenbibliothek dokumentiert Peters persönliche Mitwirkung am Schiffbau und an der Marineordnung von 1720. Nach den Feldzügen bei Asow und an der Ostsee erhielt die ständige Flotte damit ein Regelwerk. Mit der Gründung Sankt Petersburgs an der Newa verband Peter Eroberung, Befestigung und Ostseezugang. Fenster zur Ostsee setzt diesen Brückenkopf spielerisch um. Bei der Eroberung einer feindlichen Küste entsteht einmal pro Partie ein kostenloser, fertiger Hafen auf einem geeigneten Bauplatz in der Nähe."
title = "Peter der Große"
lang = "de"
url = "https://www.prlib.ru/news/659663"
shortArticle = true
