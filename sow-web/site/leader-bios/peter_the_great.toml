[articles.pt-BR]
text = "Pedro I (1672–1725) governou a Rússia em um período de grandes transformações políticas, militares e administrativas. Dividiu o trono com o meio-irmão Ivan V a partir de 1682 e passou a governar sozinho em 1696. Seu governo buscou acesso ao mar Negro e ao Báltico. As campanhas de Azov tornaram a construção de navios uma prioridade e Pedro promoveu uma marinha permanente. Fundou São Petersburgo em 1703. O Tratado de Nystad encerrou a Grande Guerra do Norte em 1721, ano em que Pedro assumiu o título de imperador. Os impostos e o recrutamento compulsório impuseram à população boa parte dos custos dessas reformas. A Biblioteca Presidencial da Rússia registra a participação de Pedro na construção de navios e na preparação do regulamento naval de 1720. O regulamento organizou a frota permanente após as campanhas de Azov e do Báltico. A fundação de São Petersburgo às margens do Neva ligou a conquista militar, a construção de fortificações e o acesso ao mar. Janela para o Báltico traduz esse ponto de apoio em uma habilidade. Ao conquistar um litoral inimigo, Pedro pode estabelecer gratuitamente um porto pronto em um local próximo que atenda às regras de construção, uma vez por partida."
title = "Pedro, o Grande"
lang = "pt-BR"
url = "https://www.prlib.ru/news/659663"
