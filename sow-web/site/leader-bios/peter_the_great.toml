[articles.it]
text = "Pietro I (1672–1725) governò la Russia in un periodo di profonde trasformazioni politiche, militari e amministrative. Dal 1682 condivise il trono con il fratellastro Ivan V e dal 1696 governò da solo. Cercò di assicurare alla Russia uno sbocco sul mar Nero e sul Baltico. Le campagne di Azov resero prioritaria la costruzione di navi e Pietro promosse una marina permanente. Fondò San Pietroburgo nel 1703. Nel 1721 il trattato di Nystad concluse la grande guerra del Nord e Pietro assunse il titolo di imperatore. La popolazione sostenne il peso della fiscalità e del reclutamento obbligatorio. La Biblioteca presidenziale russa documenta la partecipazione diretta di Pietro alla costruzione di navi e alla stesura del regolamento navale del 1720. Dopo le campagne di Azov e del Baltico, il regolamento fornì alla flotta permanente un insieme di norme. La fondazione di San Pietroburgo sulla Neva unì conquista, fortificazioni e accesso al Baltico. Finestra sul Baltico riprende questa base strategica nel gioco. Dopo aver conquistato una costa nemica, Pietro può stabilire gratuitamente un porto completo in un sito vicino adatto, una volta per partita."
title = "Pietro il Grande"
lang = "it"
url = "https://www.prlib.ru/news/659663"
