[articles.ja]
text = "ピョートル一世（1672～1725年）は、政治、軍事、行政の大きな変革期にロシアを統治した。1682年から異母兄イヴァン五世と共同でツァーリとなり、1696年に兄が亡くなると単独で統治するようになった。政権は黒海とバルト海への出口を求めた。黒海につながるアゾフをめぐる戦いで造船の必要性が高まり、ピョートルは常設海軍の整備を進めた。1703年にはネヴァ川の河口近くにサンクトペテルブルクを建設した。この地点を確保することで、ロシアはバルト海と結び付く航路に拠点を得た。大北方戦争は長期にわたり、1721年のニスタット条約で終結した。ピョートルは同じ年に皇帝の称号を得た。遠征と制度の改変を続けるためには、人員や資材を継続して集める必要があった。重い課税と徴兵は住民に大きな負担を課し、海軍建設や国家機構の拡充の費用は広く社会に及んだ。 ロシア大統領図書館の資料によれば、ピョートルは造船に関わり、1720年の海軍規則の準備にも直接参加した。アゾフやバルト海での作戦を経て、艦艇を戦役のたびに集めるだけでは海への通路を維持できなかった。常設艦隊を運用するには、船を造る仕事に加えて、艦上での任務や指揮を制度として整えることが必要だった。海軍規則はこの艦隊を継続して運用するための取り決めを定めた。ネヴァ川沿いのサンクトペテルブルクでは、軍事的な占領と要塞の建設が、バルト海への航路を確保する事業と結び付いた。市の公文書館が紹介する都市の歴史は、創建時から後年の改名に至る経緯をたどっている。艦隊の歴史を伝える資料と合わせて読むと、海に出るためには沿岸に足場を築き、それを長期にわたって使えるようにする必要があったことが分かる。ゲームの「バルト海への窓」は、この足場を築く過程を表している。敵の海岸を占領すると、近くに建設可能な場所があれば、完成済みの港を無料で一つ設置できる。発動は一試合につき一回で、史実で時間を要した港の建設を占領直後の効果として扱う。"
title = "ピョートル大帝"
lang = "ja"
url = "https://www.prlib.ru/news/659663"
