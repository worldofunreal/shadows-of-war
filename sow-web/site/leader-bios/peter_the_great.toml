[articles.fr]
text = "Pierre Ier (1672–1725) régna sur la Russie à une époque de transformations politiques, militaires et administratives. Il partagea le trône avec son demi-frère Ivan V à partir de 1682 et régna seul à partir de 1696. Il chercha à assurer à la Russie un accès à la mer Noire et à la Baltique. Les campagnes d’Azov firent de la construction navale une priorité et Pierre fit établir une flotte permanente. Il fonda Saint-Pétersbourg en 1703. Le traité de Nystad mit fin à la grande guerre du Nord en 1721, année où Pierre prit le titre d’empereur. Les prélèvements et la conscription imposèrent un coût élevé à la population. La Bibliothèque présidentielle russe rapporte que Pierre participa à la construction de navires et à la rédaction du règlement naval de 1720. Celui-ci fixa les règles de la flotte après les campagnes d’Azov et de la Baltique. En fondant Saint-Pétersbourg sur la Neva, Pierre associa conquête, fortification et accès à la Baltique. Fenêtre sur la Baltique transpose cet ancrage dans le jeu. La prise d’une côte ennemie permet d’établir gratuitement un port achevé sur un emplacement valide à proximité, une fois par partie."
title = "Pierre le Grand"
lang = "fr"
url = "https://www.prlib.ru/news/659663"
