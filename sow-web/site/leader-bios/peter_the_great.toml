[articles.zh-CN]
text = "彼得一世（1672—1725）通常被称为彼得大帝。他统治时期，俄国的行政、军队和对外关系都发生了重大变化。1682年起，他与同父异母的哥哥伊凡五世共居沙皇之位。伊凡于1696年去世后，彼得开始独自执政。俄国争取通往黑海和波罗的海的通道，舰队的作用也因此日益突出。亚速战事使造船成为紧迫任务，随后建立常备海军也成为国家政策。1703年，彼得在涅瓦河畔建立圣彼得堡。此举把战时占领的河口地区变成俄国经营波罗的海航路的立足点。大北方战争历时多年，直到1721年《尼斯塔德和约》缔结才告结束。同年，彼得采用皇帝称号。改革扩大了国家调动兵员和资源的能力，也给普通居民增加了沉重负担。维持舰队、军队和新设机构需要长期投入，赋税和强制征兵让许多家庭承担了扩张与改制的代价。 俄罗斯总统图书馆记录了彼得参与建造舰船和筹备1720年海军条例的情况。条例为舰队的日常运作制定规则。亚速和波罗的海的战事表明，取得水路通道以后，还需要有组织地维持舰船和人员，才能长期保有海上力量。因此，船只的建造、舰队的管理以及岸上设施的建设是彼此关联的工作。圣彼得堡的历史也显示了这种联系。涅瓦河把河口要塞与通向波罗的海的航路连在一起。俄国在这一带经营据点，需要把军事进展转化为可以守卫和补给的港口。圣彼得堡档案馆收录的城市史资料以这座城市的创建为起点，讲述后来城市名称的演变。它从地方的角度补充了海军条例所体现的制度改革。游戏中的「通向波罗的海的窗口」取材于夺取海岸与建立据点之间的关系。彼得攻占敌方海岸后，如果附近有符合建造条件的地块，便能在那里免费获得一座已经竣工的港口。这一效果每局只触发一次。游戏把从军事占领到建设港口的过程压缩成一个回合内可识别的事件。"
title = "彼得大帝"
lang = "zh-CN"
url = "https://www.prlib.ru/news/659663"
