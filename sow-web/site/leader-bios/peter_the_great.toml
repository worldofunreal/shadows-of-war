[articles.en]
text = "Peter I (1672–1725), known as Peter the Great, ruled Russia during a period of major political, military, and administrative change. He shared the throne with his half-brother Ivan V from 1682 and became sole ruler in 1696. His government reorganized the state and pursued access to the Baltic and Black seas. The Azov campaigns helped make naval construction a central priority, and Peter later directed the creation of a permanent Russian navy. His reign also brought the founding of Saint Petersburg in 1703 and Russia’s victory in the Great Northern War, which ended with the Treaty of Nystad in 1721. Peter was crowned emperor in 1721. These reforms relied on coercive taxation and conscription and imposed severe burdens on the population; his state-building cannot be separated from those costs. Peter took an unusually direct role in naval affairs. The Presidential Library describes him as personally participating in the preparation of the 1720 Naval Charter and in shipbuilding. The charter set rules for the new fleet after the earlier Azov and Baltic campaigns had exposed the need for a permanent maritime force. The foundation of Saint Petersburg at the Neva in 1703 linked conquest, fortification and access to the Baltic. Window to the Baltic represents that strategic foothold: gaining an enemy coast establishes one free completed port at a legal nearby site, once per match. The automatic building is a gameplay abstraction, not a claim that a port was built instantly."
title = "Peter the Great"
lang = "en"
url = "https://www.prlib.ru/news/659663"
shortArticle = true
intro = ["Peter I (1672–1725), known as Peter the Great, ruled Russia during a period of major political, military, and administrative change. He shared the throne with his half-brother Ivan V from 1682 and became sole ruler in 1696. His government reorganized the state and pursued access to the Baltic and Black seas. The Azov campaigns helped make naval construction a central priority, and Peter later directed the creation of a permanent Russian navy. His reign also brought the founding of Saint Petersburg in 1703 and Russia’s victory in the Great Northern War, which ended with the Treaty of Nystad in 1721. Peter was crowned emperor in 1721. These reforms relied on coercive taxation and conscription and imposed severe burdens on the population; his state-building cannot be separated from those costs."]
sections = [{ title = "Naval reform", paragraphs = ["Peter took an unusually direct role in naval affairs. The Presidential Library describes him as personally participating in the preparation of the 1720 Naval Charter and in shipbuilding. The charter set rules for the new fleet after the earlier Azov and Baltic campaigns had exposed the need for a permanent maritime force. The foundation of Saint Petersburg at the Neva in 1703 linked conquest, fortification and access to the Baltic. Window to the Baltic represents that strategic foothold: gaining an enemy coast establishes one free completed port at a legal nearby site, once per match. The automatic building is a gameplay abstraction, not a claim that a port was built instantly."] }]
sources = [{ title = "Saint Petersburg archives, Three names of the northern capital", url = "https://spbarchives.ru/1716" }]

[articles.es]
text = "Pedro I (1672–1725) gobernó Rusia durante una etapa de profundas reformas militares, políticas y administrativas. Compartió el trono con su medio hermano Iván V desde 1682 y gobernó solo a partir de 1696. Buscó dar a Rusia acceso al mar Negro y al Báltico. Las campañas de Azov convirtieron la construcción de barcos en una prioridad y Pedro impulsó una armada permanente. Fundó San Petersburgo en 1703. En 1721 el tratado de Nystad cerró la Gran Guerra del Norte y Pedro asumió el título de emperador. Los impuestos y el reclutamiento forzoso trasladaron a la población buena parte del costo de aquellas reformas. La Biblioteca Presidencial documenta la participación de Pedro en la construcción de barcos y en la preparación del reglamento naval de 1720. El nuevo reglamento fijó normas para una flota permanente tras las campañas de Azov y del Báltico. La fundación de San Petersburgo en el Neva vinculó la conquista militar con la fortificación y el acceso al mar. Ventana al Báltico lleva esa relación a la partida. Al conquistar costa enemiga, Pedro puede establecer un puerto terminado y gratuito en una casilla cercana apta, una vez por partida."
title = "Pedro el Grande"
lang = "es"
url = "https://www.prlib.ru/news/659663"
shortArticle = true
