[articles.ar]
text = "حكم بطرس الأول (1672–1725) روسيا في مرحلة شهدت تحولات سياسية وعسكرية وإدارية واسعة. شارك أخاه غير الشقيق إيفان الخامس العرش منذ عام 1682، وانفرد بالحكم عام 1696. سعت حكومته إلى فتح طرق نحو البحر الأسود وبحر البلطيق. جعلت حملات آزوف بناء السفن أولوية، وأشرف بطرس على إنشاء بحرية روسية دائمة. أسس سانت بطرسبرغ عام 1703. وانتهت حرب الشمال الكبرى بمعاهدة نيستاد عام 1721، وفي العام نفسه اتخذ بطرس لقب الإمبراطور. وتحمل السكان عبئاً ثقيلاً من الضرائب والتجنيد الإجباري اللذين اعتمدت عليهما هذه التحولات. توثق المكتبة الرئاسية الروسية مشاركة بطرس في بناء السفن وفي إعداد النظام البحري الصادر عام 1720. وضع النظام قواعد لعمل الأسطول الدائم بعد حملات آزوف والبلطيق. وربط تأسيس سانت بطرسبرغ على نهر نيفا بين السيطرة العسكرية والتحصين والوصول إلى بحر البلطيق. وتستمد قدرة «نافذة على البلطيق» فكرتها من إنشاء موطئ قدم على الساحل. فبعد الاستيلاء على ساحل خصم، يستطيع بطرس إقامة ميناء مكتمل مجاناً في موقع قريب صالح للبناء، مرة واحدة في المباراة."
title = "بطرس الأكبر"
lang = "ar"
url = "https://www.prlib.ru/news/659663"
