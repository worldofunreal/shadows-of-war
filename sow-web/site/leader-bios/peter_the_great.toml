[articles.tr]
text = "I. Petro (1672–1725), Rusya’yı siyasi, askerî ve idari dönüşümlerin yaşandığı bir dönemde yönetti. 1682’den itibaren tahtı üvey kardeşi V. İvan ile paylaştı, 1696’dan sonra tek başına hüküm sürdü. Rusya’ya Karadeniz ve Baltık Denizi’nde çıkış sağlamaya çalıştı. Azak seferleri gemi yapımını öncelikli hâle getirdi ve Petro kalıcı bir donanma kurdurdu. 1703’te Sankt-Peterburg’u kurdu. 1721’de Nystad Antlaşması Büyük Kuzey Savaşı’nı sona erdirdi ve Petro aynı yıl imparator unvanını aldı. Ağır vergiler ve zorunlu askerlik halkın omuzlarına büyük bir yük bindirdi. Rusya Başkanlık Kütüphanesi, Petro’nun gemi yapımına ve 1720 Denizcilik Nizamnamesi’nin hazırlanmasına doğrudan katıldığını kaydeder. Nizamname, Azak ve Baltık seferlerinden sonra sürekli bir donanmanın işleyişini düzenledi. Neva kıyısında Sankt-Peterburg’un kurulması fetih, tahkimat ve Baltık’a erişimi birbirine bağladı. Baltık’a Açılan Pencere bu stratejik dayanağı oyuna taşır. Düşman kıyısı ele geçirilince yakınlardaki uygun bir alanda ücretsiz ve hazır bir liman kurulur. Etki maç başına bir kez gerçekleşir."
title = "Büyük Petro"
lang = "tr"
url = "https://www.prlib.ru/news/659663"
