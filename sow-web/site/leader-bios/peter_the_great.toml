[articles.fil]
text = "Pinamunuan ni Pedro I (1672–1725) ang Rusya sa panahon ng malalaking pagbabago sa politika, hukbo, at pamamahala. Mula 1682, kahati niya sa trono ang kapatid sa ama na si Ivan V. Mag-isa siyang namuno mula 1696. Nagsikap ang kaniyang pamahalaan na magkaroon ng daan patungong Dagat Itim at Dagat Baltiko. Dahil sa mga kampanya sa Azov, naging prayoridad ang paggawa ng barko at ipinagawa ni Pedro ang isang permanenteng hukbong-dagat. Itinatag niya ang San Petersburgo noong 1703. Tinapos ng Kasunduan sa Nystad ang Dakilang Digmaan sa Hilaga noong 1721, taon din ng pagtanggap ni Pedro sa titulong emperador. Mabigat sa mamamayan ang buwis at sapilitang pagsisilbi sa hukbo. Itinala ng Aklatang Pampanguluhan ng Rusya ang pakikilahok ni Pedro sa paggawa ng barko at sa paghahanda ng mga tuntuning pandagat noong 1720. Itinakda ng mga ito kung paano patatakbuhin ang permanenteng plota matapos ang mga kampanya sa Azov at Baltiko. Pinag-ugnay ng pagtatatag ng San Petersburgo sa Ilog Neva ang pagsakop, pagpapatibay ng tanggulan, at pagbubukas ng daan sa dagat. Mula rito ang kakayahang Bintana sa Baltiko. Sa pagsakop ng baybayin ng kaaway, makapagtatatag si Pedro ng isang tapos na daungan nang libre sa angkop na lugar na malapit, isang beses bawat laban."
title = "Pedro ang Dakila"
lang = "fil"
url = "https://www.prlib.ru/news/659663"
