[articles.ko]
text = "표트르 1세(1672~1725)는 러시아의 정치와 군사, 행정 제도가 크게 변하던 시기에 통치했다. 1682년부터 이복형 이반 5세와 왕위를 공유했고, 형이 세상을 떠난 1696년부터 단독으로 나라를 다스렸다. 그의 정부는 흑해와 발트해로 이어지는 통로를 확보하려 했다. 아조프 원정을 거치면서 군함 건조가 중요한 과제가 되었고, 표트르는 상설 해군을 건설했다. 1703년에는 네바강 하구에 가까운 곳에 상트페테르부르크를 세웠다. 발트해에 닿는 수로 주변에 군사 거점을 마련한 일이 도시 건설로 이어진 것이다. 오랫동안 계속된 대북방전쟁은 1721년 뉘스타드 조약으로 끝났다. 표트르는 같은 해 황제 칭호를 얻었다. 새 군대와 함대, 행정 기관을 유지하려면 사람과 재원을 지속적으로 동원해야 했다. 그 과정에서 세금과 강제 징집의 부담이 주민들에게 돌아갔다. 러시아 대통령 도서관은 표트르가 배를 만드는 일에 관여하고 1720년 해군 규정의 준비에도 직접 참여했다고 기록한다. 아조프와 발트해에서의 전쟁을 거친 뒤에는 원정 때마다 배를 모으는 방식으로 해상 통로를 유지하기 어려웠다. 상설 함대를 운영하려면 군함을 만드는 작업과 함대의 임무를 정하는 제도가 모두 필요했다. 1720년 규정은 그러한 함대를 지속적으로 운용할 기준을 마련했다. 네바강의 상트페테르부르크는 해군 개혁과 함께 진행된 해안 거점 건설의 사례다. 이곳에서 점령지 방어를 위한 요새 건설은 발트해로 이어지는 항로의 확보와 맞물렸다. 상트페테르부르크 시립 기록관은 도시가 건설된 때부터 그 이름이 바뀐 과정까지 정리해 공개하고 있다. 도시 기록과 해군 규정은 수로를 점령한 뒤에도 기지와 함대를 유지하는 일이 이어졌음을 보여 준다. 게임의 ‘발트해로 향한 창’은 이러한 거점 확보를 표현한다. 적의 해안을 점령하면 근처에서 조건에 맞는 부지를 찾아 완공된 항구 하나를 무료로 세운다. 효과는 경기마다 한 번 발생한다. 해안 점령과 항만 건설 사이에 걸린 시간은 게임 규칙에 맞추어 압축했다."
title = "표트르 대제"
lang = "ko"
url = "https://www.prlib.ru/news/659663"
shortArticle = true
