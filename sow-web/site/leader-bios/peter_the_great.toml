[articles.id]
text = "Pyotr I (1672–1725) memerintah Rusia pada masa perubahan besar dalam politik, militer, dan administrasi. Ia berbagi takhta dengan saudara tirinya, Ivan V, sejak 1682 dan memerintah sendiri mulai 1696. Pemerintahannya berupaya mendapatkan akses ke Laut Hitam dan Laut Baltik. Kampanye Azov menjadikan pembuatan kapal sebagai prioritas dan Pyotr memimpin pembentukan angkatan laut permanen. Ia mendirikan Sankt-Peterburg pada 1703. Perjanjian Nystad mengakhiri Perang Utara Raya pada 1721, tahun ketika Pyotr mengambil gelar kaisar. Pajak dan wajib militer membebani penduduk yang ikut menanggung biaya perubahan tersebut. Perpustakaan Kepresidenan Rusia mencatat keterlibatan langsung Pyotr dalam pembuatan kapal dan penyusunan peraturan angkatan laut tahun 1720. Peraturan itu menetapkan tata kerja armada permanen setelah kampanye di Azov dan Baltik. Pendirian Sankt-Peterburg di Sungai Neva menghubungkan penaklukan, pembangunan benteng, dan akses ke Baltik. Jendela ke Baltik membawa perebutan pijakan itu ke dalam permainan. Setelah merebut pesisir musuh, Pyotr dapat mendirikan satu pelabuhan siap pakai secara gratis di lokasi sah yang berdekatan, sekali per pertandingan."
title = "Pyotr yang Agung"
lang = "id"
url = "https://www.prlib.ru/news/659663"
