[articles.ru]
text = "Пётр I (1672–1725) правил Россией в эпоху крупных политических, военных и административных преобразований. С 1682 года он делил престол со своим единокровным братом Иваном V, а в 1696 году стал единоличным правителем. Его правительство добивалось выхода к Чёрному и Балтийскому морям. Азовские походы сделали кораблестроение первоочередной задачей, и Пётр организовал создание регулярного флота. В 1703 году он основал Санкт-Петербург. Северная война завершилась Ништадтским миром в 1721 году, тогда же Пётр принял титул императора. Налоги и рекрутские наборы возложили значительную часть издержек реформ на население. Президентская библиотека рассказывает об участии Петра в кораблестроении и подготовке Морского устава 1720 года. После Азовских походов и боевых действий на Балтике устав установил порядок службы постоянного флота. Основание Санкт-Петербурга на Неве связало завоевание, строительство укреплений и выход к Балтийскому морю. «Окно в Балтику» переносит эту связь в игру. При захвате вражеского побережья Пётр может бесплатно основать готовый порт на подходящем участке поблизости один раз за матч."
title = "Пётр Великий"
lang = "ru"
url = "https://www.prlib.ru/news/659663"
shortArticle = true
