[articles.vi]
text = "Pyotr I (1672–1725) trị vì nước Nga trong giai đoạn biến đổi lớn về chính trị, quân sự và hành chính. Từ năm 1682 ông cùng anh cùng cha khác mẹ là Ivan V giữ ngôi Sa hoàng, rồi cai trị một mình từ năm 1696. Triều đình tìm đường ra biển Đen và biển Baltic. Các chiến dịch Azov đưa việc đóng tàu lên hàng ưu tiên, và Pyotr chỉ đạo xây dựng một lực lượng hải quân thường trực. Ông lập thành phố Sankt-Peterburg năm 1703. Hòa ước Nystad kết thúc Đại chiến phương Bắc vào năm 1721, cũng là năm Pyotr nhận tước hiệu hoàng đế. Thuế khóa và việc cưỡng bách tòng quân đặt gánh nặng lớn lên dân chúng. Thư viện Tổng thống Nga ghi nhận Pyotr trực tiếp tham gia đóng tàu và soạn quy chế hải quân năm 1720. Quy chế đặt ra các quy tắc cho hạm đội thường trực sau những chiến dịch ở Azov và Baltic. Việc lập Sankt-Peterburg bên sông Neva gắn việc chiếm đóng và xây công sự với việc mở đường ra biển. Kỹ năng Cửa ngõ Baltic đưa mối liên hệ ấy vào trận đấu. Khi chiếm bờ biển của đối phương, Pyotr có thể lập miễn phí một cảng hoàn chỉnh ở vị trí hợp lệ gần đó, một lần mỗi trận."
title = "Pyotr Đại đế"
lang = "vi"
