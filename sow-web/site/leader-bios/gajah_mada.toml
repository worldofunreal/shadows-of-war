[articles.en]
text = "Gajah Mada was a mahapatih and prominent general of the Javanese Majapahit Empire. He is known for unifying the Nusantara archipelago, bringing the empire to its peak of glory."
title = "Gajah Mada"
lang = "en"
url = "https://en.wikipedia.org/wiki/Gajah_Mada"
intro = [
  "Gajah Mada (c. 1290 – c. 1364, also known as Jirnnodhara) was a mahapatih and prominent general of the Javanese Majapahit Empire. He is known for unifying the Nusantara archipelago, bringing the empire to its peak of glory. According to legend, he even went as far as delivering an oath called Sumpah Palapa, in which he vowed not to rest until he had accomplished his goal of unification. His accomplishments had been heavily credited in Old Javanese manuscripts, poems and inscriptions.",
  "During his reign, the Hindu epics, including the Rāmāyana and the Mahābhārata, became ingrained in the Javanese culture and worldview through the performing arts of wayang kulit (“leather puppets”). He is considered an important national hero in modern Indonesia, as well as a symbol of patriotism and national unity. Historical accounts of his life, political career, and administration are taken from several sources, mainly the Pararaton (\"The Book of Kings\"), the Nagarakretagama (a Javanese-language eulogy), and an inscription dating from the mid-14th century.",
]
sections = [
  { "title" = "Depiction", "paragraphs" = [
      "Much of the modern popular depiction of Gajah Mada derives from the imagination of Mohammad Yamin in his 1945 book Gajah Mada: Pahlawan Persatuan Nusantara. One day in the 1940s, Yamin visited Trowulan, the site of the capital city of the former Majapahit kingdom. He found fragments of terracotta, one of which was a piggy bank in the form of the face of a man with a stocky face and curly hair. Based on the look on the piggy bank's face, Yamin interpreted this as the face of Gajah Mada, the unifier of the archipelago. Yamin then asked the artist Henk Ngantung to make a painting based on the terracotta fragment. The painting was displayed as the cover of Yamin's book. Many people disagree with Yamin's opinion because it is impossible for the face of a figure as big as Gajah Mada to be displayed in a piggy bank. Such a portrayal is considered an insult because usually the state leaders during the Hindu-Buddhist era, including Majapahit, were made in effigy as statues. Some even believe that the face was none other than Yamin's own face.",
      "Another illustration of the historical Gajah Mada, different from Yamin's, is the result of research at the University of Indonesia by archaeologist Agus Aris Munandar. He interpreted that Gajah Mada was depicted as Bima in wayang shadow-puppet shows, with a transverse mustache. In popular depiction, Gajah Mada is mostly shown bare-chested, wearing a sarong, and using a weapon in the form of a kris. While this may have been true on civilian duties, his official outfit might have been different: a Sundanese patih explained in the kidung Sundayana that Gajah Mada wore a gold-embossed karambalangan (breastplate) and was armed with a gold-layered spear and a shield full of diamond decoration.",
      "According to Munandar, at first Gajah Mada was depicted as a Brajanata character from the Panji tales, and as Bima from the Mahābhārata in later eras. The Panji story was known earlier than the activities of making Bima statues, which apparently began in the mid-15th century, so the former was likely Gajah Mada's original depiction. The glorification of Gajah Mada in the first stage is profane—in the form of its depiction as Brajanata, but then the glorification of Gajah Mada occurs in the second stage which is more sacred, which is equated with Bima as an aspect of Siva. In the statue found at the National Museum of Indonesia (No. 5136/310d), the statue is depicted with a sturdy body, transverse mustache, and wavy curls, at the top of the head there is a hair tie with a ribbon forming like a tekes hat. He wears clothes and jewelry, bracelets, and an upper armband in the form of a snake-like Bima's.",
    ] },
  { "title" = "Meaning of name", "paragraphs" = [
      "The word \"Gajah\" (elephant) refers to a large animal that is respected by other animals. In Hindu mythology it is believed to be a vahana (animal mount) of the god Indra. Elephants are also associated with Ganesha, the elephant-headed god with a human body, the son of Shiva and Parvati. As for the word \"Mada\", in the ancient Javanese language (possibly derived from Sanskrit, where the word has the same meaning), it means \"drunk\". When an elephant is drunk, he will walk arbitrarily and violently, overcoming all obstacles. So when it is associated with the figure of Gajah Mada, the name can be interpreted in two ways, namely:",
      "He considered himself to be the vehicle of the king, the executor of the king's orders, just as the elephant Airavata became the vahana of the god Indra.",
      "He is a person who seems drunk and violent when faced with various obstacles that will hinder the progress of the kingdom. It really is the right choice of name and it seems that the name has been carefully thought out, its meaning having been previously used for his name.",
    ] },
  { "title" = "Rise to power", "paragraphs" = [
      "Not much is known about Gajah Mada's early life, but he was born into an ordinary family. Early accounts mention his career as a commander of the Bhayangkara, an elite royal guard for the Majapahit king and royal family.",
      "When Rakrian Kuti, an official from Majapahit, rebelled against King Jayanegara (r. 1309–1328) in 1321, Gajah Mada and the mahapatih Arya Tadah rescued the king and his family by escaping from the capital city of Trowulan. Later Gajah Mada helped the king return to the capital and crush the rebellion. Seven years later, Jayanegara was murdered by the court physician Rakrian Tanca, an aide of Rakrian Kuti.",
      "Another version suggests that Jayanegara was assassinated by Gajah Mada in 1328. Jayanegara was overly protective of his two half-sisters, born from Kertarajasa's youngest queen, Dyah Dewi Gayatri. Complaints by the two young princesses led to the intervention of Gajah Mada. His solution was to arrange for a surgeon to murder the king while pretending to perform surgery.",
    ] },
  { "title" = "Palapa oath and empire expansion", "paragraphs" = [
      "It is said that it was during his appointment as mahapatih under queen Tribhuwanatunggadewi that Gajah Mada took his famous oath, the Palapa Oath or Sumpah Palapa. The telling of the oath is described in the Pararaton (Book of Kings), an account of Javanese history that dates from the 15th or 16th century:",
      "Sira Gajah Madapatih amangkubhumi tan ayun amuktia palapa, sira Gajah Mada: \"Lamun huwus kalah nusantara isun amukti palapa, lamun kalah ring Gurun, ring Seran, Tañjungpura, ring Haru, ring Pahang, Dompo, ring Bali, Sunda, Palembang, Tumasik, samana isun amukti palapa\".",
      "[Eventually] Gajah Mada became patih mangkubumi, [but] did not want to amukti palapa. Gajah Mada [swore], \"If I have conquered the Nusantara Archipelago, [then] I will amukti palapa. If [I have] conquered Gurun, Seram, Tanjungpura, Haru, Pahang, Dompo, Bali, Sunda, Palembang, Tumasik (Singapore), then I will amukti palapa.\"",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "His reign helped further Indianisation of Javanese culture through the spread of Hinduism and sanskritization.",
      "The Blahbatuh royal house in Gianyar, Bali, has been performing Gajah Mada's mask dance drama ritually for the past 600 years. The mask of Gajah Mada has been protected and brought to life every couple of years to unite and harmonize the world, this sacred ritual was intended to bring peace to Bali.",
      "Gajah Mada's legacy is important for Indonesian Nationalism, and invoked by the Indonesian Nationalist movement in the early 20th century. The Nationalists prior to the Japanese invasion, notably Sukarno and Mohammad Yamin, often cited Gajah Mada's oath and Nagarakretagama as the inspiration and a historical proof of Indonesian past greatness — that Indonesians could unite, despite vast territory and various cultures. The Gajah Mada campaign that united the far flung islands within the Indonesian archipelago under Majapahit suzerainty, was used by Indonesian nationalists to argue that an ancient form of unity had existed prior to Dutch colonialism. Thus, Gajah Mada was a great inspiration during the Indonesian National Revolution for independence from Dutch colonization.",
    ] },
]

[articles.es]
text = "Gayamada (Gajah Mada, f. 1364)​) fue un célebre militar y consejero del emperador Hayam Wuruk de Mayapajit.​ Fue, después del propio emperador, la persona más poderosa y popular de la corte,​ ostentando el título de patih o primer ministro."
title = "Gajamada"
lang = "es"
url = "https://es.wikipedia.org/wiki/Gajamada"
intro = [
  "Gayamada (Gajah Mada, f. 1364)​) fue un célebre militar y consejero del emperador Hayam Wuruk de Mayapajit.​ Fue, después del propio emperador, la persona más poderosa y popular de la corte,​ ostentando el título de patih o primer ministro.",
  "Durante su vida el Imperio mayapajit ocupó la mayor parte del archipiélago indonesio y algunos territorios más allá de él, alcanzando su esplendor,​ precisamente gracias a la flota de Gayamada, que conquistó lugares desde zonas de Nueva Guinea al este hasta islas de Filipinas al norte, incluyendo territorios no identificados que incluso pudieran pertenecer a la costa noroeste de Australia.​​",
  "A mediados del siglo XX su figura idealizada fue convertida por el nacionalismo indonesio en un héroe nacional, símbolo de la primera unificación del amplio país insular.",
]
sections = [
  { "title" = "Ascender al poder", "paragraphs" = [
      "No se sabe mucho sobre los primeros años de Gajamada, pero nació en una familia común. Algunas crónicas mencionan su carrera como comandante del Bhayangkara, una guardia real de élite para el rey de Majapahit y la familia real.",
      "Cuando Rakrian Kuti, uno de los oficiales en Majapahit, se rebeló contra el rey Jayanegara (gobernó 1309-1328) en 1321, Gajamada y el entonces mahapatih Arya Tadah ayudaron al rey y su familia a escapar de la ciudad capital de Trowulan. Más tarde, Gajamada ayudó al rey a regresar a la capital y aplastar la rebelión. Siete años después, Jayanegara fue asesinado por el médico de la corte Rakrian Tanca, uno de los ayudantes de Rakrian Kuti.",
      "Otra versión sugiere que Jayanagara fue asesinado por el propio Gajamada en 1328, quién había hecho arreglos para que el cirujano asesinara al rey mientras pretendía realizar una cirugía.",
    ] },
  { "title" = "El juramento Palapa y expansión del imperio", "paragraphs" = [
      "Se dice que durante su nombramiento como mahapatih bajo la reina Tribhuwanatunggadewi, Gajah Mada hizo su famoso juramento, el juramento Palapa o Sumpah Palapa. El juramento es descrito en el Pararaton (Libro de los Reyes), un relato sobre la historia de Java que data del siglo XV o XVI:",
      "“Sira Gajah Mada pepatih amungkubumi tan ayun amukita palapa, sira Gajah Mada: Lamun huwus kalah nusantara Ingsun amukti palapa, lamun kalah ring Gurun, ring Seram, Tanjungpura, ring Haru, ring Pahang, Dompo, ring Bali, Sunda, Palembang, Temasek, samana ingsun amukti palapa “",
      "\"Gajah Mada, el primer ministro, dijo que no probaría ninguna especia. Dijo Gajah Mada: Si se pierde Nusantara (Nusantara= Nusa antara= territorios externos), no probaré \"palapa\" (\"frutas y/o especias\"). No lo haré si el dominio de Gurun, el dominio de Seram, Tanjungpura, el dominio de Haru, el dominio de Pahang, Dompo, el dominio de Bali, Sonda, Palembang, Tumasik, en cuyo caso nunca probaré ninguna especia.\"",
    ] },
  { "title" = "La Batalla de Bubat", "paragraphs" = [
      "En 1357, el único estado restante en rechazar la hegemonía de Mahapajit era Sonda, en Java occidental, limítrofe con el reino de Majapahit. El rey Hayam Wuruk pretendió casarse con Dyah Pitaloka Citraresmi, una princesa sondanesa, hija del rey de Sonda. A Gajah Mada se le dio la tarea de ir a la plaza Bubat, en la parte norte de Trowulan, para dar la bienvenida a la princesa cuando llegó con su padre, y escoltarlos al palacio Majapahit.",
      "Gajah Mada aprovechó esta oportunidad de reclamar la sumisión de Sonda a Majapahit. Mientras el rey de Sonda creía que el matrimonio real era una señal de nueva alianza entre Sonda y Majapahit, Gajah Mada pensaba de otra manera. Declaró que la princesa de Sonda no iba a ser recibida como la reina de Majapahit, sino meramente como concubina, como señal de sumisión de Sonda a Majapahit. Este malentendido llevó la vergüenza y hostilidad entre el séquito real, estallando una escaramuza, y la batalla se extendió por Bubat. El rey de Sonda con todos sus guardias así como el cortejo real fueron rodeados por las tropas de Majapahit, y posteriormente asesinados en la plaza Bubat. La tradición menciona que la princesa Dyah Pitaloka Citraresmi desconsolada, se suicidó.",
      "Hayam Wuruk quedó profundamente impresionado por la tragedia. Cortesanos, ministros y nobles de Majapahit culparon a Gajah Mada de esta imprudencia, y las consecuencias brutales que esta llevó no fueron del gusto de la familia real de Majapahit. Gajah Mada quedó deshonrado y pasó el resto de sus días en su propiedad de Madakaripura en Probolinggo en Java oriental.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Su reinado, como parte de la Indoesfera o región del sureste asiático bajo la influencia cultural de la India, ayudó al arraigo de esa indianización de la cultura javanesa a través de la difusión del Hinduismo y el sánscrito. Se tradujo al javanés el Mahabarata y el Ramayana y se generalizó el wayang kulit o teatro de sombras tradicional.",
      "La casa real Blahbatuh en Gianyar, Bali, ha contado la historia idealizada de Gajah Mada en un baile de máscaras ritual desde el siglo XVI. La máscara de Gajah Mada ha sido protegida y manejada cada dos años para unir y armonizar el mundo, pues este ritual sagrado se pretende trae la paz a Bali.​",
      "El legado de Gajah Mada es importante para el nacionalismo indonesio, e invocado por el movimiento nacionalista indonesio de inicios del siglo XX. Los nacionalistas con anterioridad a la invasión japonesa, notablemente Sukarno y Mohammad Yamin, mencionaron a menudo el juramento de Gajah Mada y el Nagarakretagama como inspiración y una prueba histórica de la pasada grandeza indonesia — porque entonces los indonesios pudieron unirse por primera vez, a pesar del vasto territorio y varias culturas. Las campañas de Gajah Mada unieron las islas dentro del archipiélago indonesio bajo el gobierno de Majapahit, lo que fue utilizado por los nacionalistas indonesios para argumentar que una forma antigua de unidad había existido con anterioridad al colonialismo holandés.​ Así, Gajah Mada fue una inspiración importante durante la Revolución Nacional indonesia por la independencia de la colonización holandesa.",
    ] },
]

[articles.fr]
text = "Gajah Mada (mort en 1364) était, d'après d'anciens manuscrits et la tradition javanaise, un chef militaire et mahapatih (premier ministre) du royaume de Majapahit, nommé par la reine Tribhuwana Wijayatunggadewi, dans l'est de Java en Indonésie. On considère que c'est lui qui a porté le royaume au faîte de sa puissance et de sa gloire."
title = "Gajah Mada"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Gajah_Mada"
intro = [
  "Gajah Mada (mort en 1364) était, d'après d'anciens manuscrits et la tradition javanaise, un chef militaire et mahapatih (premier ministre) du royaume de Majapahit, nommé par la reine Tribhuwana Wijayatunggadewi, dans l'est de Java en Indonésie. On considère que c'est lui qui a porté le royaume au faîte de sa puissance et de sa gloire.",
  "Le Nagarakertagama, un poème épique écrit en 1365, donc après sa mort, sous le règne du roi Hayam Wuruk,",
  "Le Pararaton ou \"Livre des rois\", une chronique écrite au XVIe siècle qui décline la généalogie des rois de Singasari et Majapahit,",
  "Le Kidung Sunda, un poème probablement écrit aussi au XVIe siècle, qui raconte l'amour malheureux de Hayam Wuruk pour une princesse du royaume de Sunda.",
]
sections = [
  { "title" = "Culture populaire", "paragraphs" = [
      "Gajah Mada apparait dans l'extension Brave New World du jeu vidéo Civilization V, où il dirige l'Indonésie.",
      "Gajah Mada apparaît dans le jeu Age of Empires II: Rise of the Rajas en tant que narrateur et protagoniste principal de la campagne malaise.",
      "Gadjah Mada est le nom d'un destroyer de l'arbre asiatique dans le jeu World of Warships. Il représente un navire conçu au Royaume-Uni pour les Pays-Bas et vendu après la Seconde Guerre mondiale à l'Indonésie indépendante (ex-Indes néerlandaises). Il est de Tier 8.",
    ] },
]

[articles.de]
text = "Gajah Mada, auch Gadjah Mada († 1364) war von 1331 bis zu seinem Tod Premierminister und Militärführer von Majapahit. Er leistete den Schwur Sumpah Palapa, keine gewürzten Speisen mehr zu essen, bis große Teile des Malaiischen Archipel unter der Macht Majapahit vereint sind."
title = "Gajah Mada"
lang = "de"
url = "https://de.wikipedia.org/wiki/Gajah_Mada"
intro = [
  "Gajah Mada, auch Gadjah Mada († 1364) war von 1331 bis zu seinem Tod Premierminister und Militärführer von Majapahit. Er leistete den Schwur Sumpah Palapa, keine gewürzten Speisen mehr zu essen, bis große Teile des Malaiischen Archipel unter der Macht Majapahit vereint sind.",
  "Unter seiner Regentschaft dehnte sich der Machtbereich des Reichs über Java, Sumatra bis nach Bali 1343 aus.",
]
sections = [
  { "title" = "Frühes Leben", "paragraphs" = [
      "Über sein frühes Leben gibt es keine Informationen, außer dass er als Bürger geboren wurde. Seine Intelligenz, sein Mut und seine Loyalität gegenüber König Jayanagara (1309–28) verhalfen ihm zur Macht während einer Rebellion, angeführt von Kuti im Jahr 1319. Er diente als Oberhaupt der königlichen Leibwache, die König Jayanagara nach Badander brachte, als Kuti die Hauptstadt von Majapahit eroberte. Nachdem er einen sicheren Ort für den König gefunden hatte, kehrte er in die Hauptstadt zurück und verbreitete das Gerücht, der König sei getötet worden. Er entdeckte, dass viele Offiziere durch den mutmaßlichen Tod des Königs verärgert waren und dass Kuti unter den Leuten offensichtlich unpopulär war. Da Gajah Mada wusste, dass der König immer noch treue Anhänger hatte, organisierte er heimlich eine Aufstandsbekämpfung, bei der Kuti getötet und der König wiederhergestellt wurde. Als Belohnung wurde Gajah Mada zum Patih (Minister) von Daha und später zum Patih von Daha und Janggala ernannt, eine Position, die ihn zu einem Mitglied der herrschenden Elite machte. Prapanca, ein Gerichtsdichter und Historiker, bezeichnete Gajah Mada als „eloquent, scharf, aufrichtig und nüchtern“.",
    ] },
  { "title" = "Loyalität gegenüber dem König", "paragraphs" = [
      "Gajah Madas Loyalität gegenüber Jayanagara ließ jedoch nach, als der König seine Frau in Besitz nahm. Als Jayanagara im Jahr 1328 krank wurde, wies Gajah Mada den Gerichtsmediziner Tancha an, den König während einer Operation zu töten. Nach dem Tod des Königs wurde Tancha von Gajah Mada beschuldigt und hingerichtet. Da der König keinen Sohn hatte, wurde seine Tochter Tribhuwana Wijayattungga Dewi Herrscherin.",
    ] },
  { "title" = "Zerschlagung der Rebellion in Sadeng", "paragraphs" = [
      "Während der Herrschaft von Tribhuvana (1328–50) wurde Gajah Mada allmählich die mächtigste Figur in Majapahit. Im Jahr 1331 fand in Sadeng (Ost-Java) eine Rebellion statt. Gajah Mada schickte sofort eine Militärexpedition in die Gegend, aber ein Minister von Majapahit, der Kembar genannt wurde, versuchte ihn davon abzuhalten, Sadeng zu betreten. Gajah Mada hat die Blockade gebrochen und die Schlacht gewonnen.",
    ] },
  { "title" = "Ernennung als Minister", "paragraphs" = [
      "Nach seiner Rückkehr wurde Gajah Mada als Mapatih oder Premierminister von Majapahit ernannt. Zur gleichen Zeit legte er vor dem Ministerrat einen feierlichen Eid ab, dass er Palapa (Privilegien des Urlaubs oder die Einnahmen aus seinem Lehen) nicht genießen würde, bevor er den gesamten Archipel für Majapahit erobert hatte. Als Kembar und andere Minister diese fantastische Prahlerei verspotteten, entfernte Gajah Mada mit Hilfe der Königin Kembar und ihrer Anhänger aus dem Amt. Nach seinen Plänen führte Gajah Mada 1343 eine militärische Expedition durch, die Bali eroberte.",
      "Tribhuvana dankte 1350 ab und wurde von ihrem Sohn Hayam Wuruk abgelöst. Während seiner Regierungszeit erreichte Majapahit den Höhepunkt seiner Macht und kontrollierte den gesamten indonesischen Archipel. Der junge König schien damit zufrieden zu sein, die Führung der Angelegenheiten vollständig in den Händen seines Premierministers zu lassen.",
    ] },
]

[articles.it]
text = "Gajah Mada, o anche Gadjah Mada (circa 1290 – 1364), è stato un militare indonesiano fu, secondo la tradizione, il mahapatih (\"primo ministro\" o \"vicereggente\") dell'antico regno di Majapahit, a cui viene attribuito il merito di aver unificato l'arcipelago indonesiano. Le sue lodi sono cantate da Mpu Prapanca nel poema epico Nagarakretagama, ed è considerato un eroe nazionale dell'Indonesia moderna."
title = "Gajah Mada"
lang = "it"
url = "https://it.wikipedia.org/wiki/Gajah_Mada"
intro = [
  "Gajah Mada, o anche Gadjah Mada (circa 1290 – 1364), è stato un militare indonesiano fu, secondo la tradizione, il mahapatih (\"primo ministro\" o \"vicereggente\") dell'antico regno di Majapahit, a cui viene attribuito il merito di aver unificato l'arcipelago indonesiano.",
  "Le sue lodi sono cantate da Mpu Prapanca nel poema epico Nagarakretagama, ed è considerato un eroe nazionale dell'Indonesia moderna.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Della sua giovinezza non si sa nulla eccetto il fatto che fosse di umili origini. Fece carriera a palazzo entrando a far parte della guardia del corpo reale e, durante una rivolta orchestrata nel 1319 da uno degli ufficiali, Rakrian Kuti, portò in salvo il re Jayanagara, nascondendolo in un villaggio di nome Badander; ritornato nella capitale, fece spargere la voce della morte del re e scoprì che molti alti funzionari erano rimasti scossi dalla notizia, e che non erano contenti dell'usurpatore. Avviò quindi una controrivolta, durante la quale Kuti venne ucciso e Jayanagara reinsediato sul trono; come ricompensa della sua lealtà, il re lo nominò patih (\"ministro\") di Daha e poi anche di Janggala, una posizione di grande potere.",
      "Più avanti, Jayanagara si appropriò della moglie di Gajah Mada: nel 1328, quindi, Gajah Mada diede istruzioni al medico di corte, Tancha, perché uccidesse il re durante un'operazione. Una volta morto il re (e fatto giustiziatore Tancha per l'accaduto), al trono ascese sua figlia, Tribhuvana, poiché Jayanagara non aveva eredi maschi.",
      "Durante il regno di quest'ultima Gajah Mada scalò ulteriormente i vertici del potere nel governo di Majapahit: nel 1331, di ritorno da una spedizione militare nel Sadeng dove aveva sedato una rivolta, venne nominato mahapatih (primo ministro). Nella stessa occasione, giurò solennemente che si sarebbe astenuto dal palapa (comunemente interpretato come \"cibo speziato\") fino a che non avesse conquistato tutto l'arcipelago.",
    ] },
  { "title" = "Nella cultura di massa", "paragraphs" = [
      "Gajah Mada compare come personaggio centrale di una pentalogia di romanzi scritti da Langit Kresna Hariadi e pubblicati tra il 2004 e il 2007.",
      "È anche il leader della civiltà indonesiana nell'espansione Brave New World di Sid Meier's Civilization V.",
      "L'espansione Rise of the Rajas di Age of Empires II contiene una campagna indonesiana dedicata all'impero di Majapahit e a tutti i suoi personaggi più famosi, tra cui appunto anche lo stesso Gajah Mada. La campagna inizia con la fondazione dell'impero Majapahit dopo l'invasione mongola in Indonesia, la conquista dell'arcipelago dopo il Patto di Palapa e la tragedia di Bubat che portò Gajah Mada alla sua caduta.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "(EN) Leo Suryadinata, Gajah Mada, su Enciclopedia Britannica, Encyclopædia Britannica, Inc.",
    ] },
]

[articles.zh]
text = "加查·馬達（印尼語：Gajah Mada，1290年—1364年） 又譯加查·瑪達、加札·馬達、迦查·馬達、嘎迦·瑪達。是印尼古代滿者伯夷帝國的政治軍事領袖，在三任國王之下擔任巴迪（意近首相） ，因創造該帝國的鼎盛時期而著名，綽號「大象將軍」。。他曾經立了名為帕拉帕誓言（或作Sumpah Palapa）的誓言，宣布他在為滿者伯夷征服整個約當今印尼的整個群島之前，不吃任何有香料的食物。 在現代的印度尼西亞，他作為重要的民族英雄， 以及國家統一與愛國主義的象徵。 關於他的生平及政治舉措主要來自幾個資料。其中最主要的是《列王書》、《那加克塔加瑪》 (14世紀的爪哇語史詩)，以及13世紀晚期到14世紀的碑刻文字。"
title = "加查·馬達"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%8A%A0%E6%9F%A5%C2%B7%E9%A6%AC%E9%81%94"
intro = [
  "加查·馬達（印尼語：Gajah Mada，1290年—1364年） 又譯加查·瑪達、加札·馬達、迦查·馬達、嘎迦·瑪達。是印尼古代滿者伯夷帝國的政治軍事領袖，在三任國王之下擔任巴迪（意近首相） ，因創造該帝國的鼎盛時期而著名，綽號「大象將軍」。。他曾經立了名為帕拉帕誓言（或作Sumpah Palapa）的誓言，宣布他在為滿者伯夷征服整個約當今印尼的整個群島之前，不吃任何有香料的食物。 在現代的印度尼西亞，他作為重要的民族英雄， 以及國家統一與愛國主義的象徵。",
]
sections = [
  { "title" = "崛起掌權", "paragraphs" = [
      "加查·馬達的早期生平沒有很多的相關資料，關於他生平最早的一些敘述提及他作為滿者伯夷王家的護衛。當滿者伯夷官員古狄（Rakrian Kuti）於1321年反抗國王查雅納迦拉（1309年-1328年在位）時，加查·馬達與另一大臣Arya Tadah合力協助國王和其家族逃離首都，並對外佯稱國王已死亡，之後加查·馬達回首都查看形勢，並進一步協助國王回到首都並平定叛亂，因而獲得重用，陸續封為章加拉和諫義里等地的首長（paith）。",
      "到了1328年，查雅納迦拉被宮庭醫生丹查（一說為古狄的協助者）暗殺。但根據《列王書》中的另一種說法，查雅納迦拉是被加查·馬達所暗殺。此說認為因為國王查雅納迦拉與加查·馬達的妻子有染，因此加查·馬達派出丹查，趁著為國王進行手術時刺殺他，隨後加查·馬達又殺了丹查滅口。",
    ] },
  { "title" = "帕拉帕誓言和向外擴張", "paragraphs" = [
      "“Sira Gajah Mada pepatih amungkubumi tan ayun amukita palapa, sira Gajah Mada: Lamun huwus kalah nusantara Ingsun amukti palapa, lamun kalah ring Gurun, ring Seram, Tanjungpura, ring Haru, ring Pahang, Dompo, ring Bali, Sunda, Palembang, Temasek, samana ingsun amukti palapa.”",
      "「首相加查·馬達將不會吃任何香料。加查·馬達立誓 : 如果失去了馬來世界（nusantara原意為外在的領土）我將不會吃\"palapa\" （包括水果和香料），若未能得到庫崙、斯蘭、丹戎布拉、哑鲁、彭亨、冬坡、巴里、巽他、 巨港、淡馬錫等領土的話，我將不吃任何香料。」",
      "雖然他的誓言一度受到輕視和取笑，但加查·馬達持續努力於他統一馬來世界的夢想。很快地，他於1343年征服了鄰近的峇里和龍目。之後他派海軍西向攻擊巨港的三佛齊。並安排滿者伯夷王族的Adityawarman，在西蘇門答臘統治米南加保人。",
    ] },
  { "title" = "布巴特之戰與加查·馬達之死", "paragraphs" = [
      "在1357年時，唯一不承認滿者伯夷帝國權威的就是位於西爪哇的巽他王國。國王烏魯克想要迎娶巽他的公主。加查·馬達負責在布巴特平原迎接公主和巽他國王，但加查·馬達要求巽他應以屬國地位來進行此一婚事，遭到巽他國王拒絕，此事造成雙方的衝突而產生布巴特之戰。滿者伯夷軍隊包圍了巽他的軍隊，最後巽他國王被殺，公主Dyah Pitaloka Citraresmi也自殺身亡。烏魯克對此事不滿，因而指責加查·馬達，並解除他的首相職務，甚至他的住宅受到軍隊搜查。加查·馬達一度躲藏至鄉下，但後來又一度被國召回重任首相。巽他王國則在之後數年也成為滿者伯夷的朝貢國。",
      "加查·馬達於1364年去世， 他死後烏魯克國王認為加查·馬達在時首相（mahapatih）一職過度將權力集中於一人，因此將該權限分予四個mahamantri (意近秘書)，以便提昇國王自己的權力。烏魯克國王在加查·馬達死後仍能維持他為滿者伯夷所創造出的權威，但烏魯克王死後滿者伯夷就逐漸走向衰落。",
    ] },
  { "title" = "影響", "paragraphs" = [
      "在峇里島Gianyar的Blahbatuh Royal House至今600年來都進行加查·馬達的儀式性面具舞劇。加查·馬達的面具被妥善保存，並兩年一出現一次用於祈求統一與和諧，這個儀式被認為能帶給峇里島和平。",
      "加查·馬達為印尼的民族主義留下重要的遺產，並在20世紀初開始的印度尼西亞民族覺醒中被啟用。在日本入侵前的民族主義者如蘇卡諾和Mohammad Yamin，經常引用加查·馬達的誓言以及記述滿者伯夷歷史的《那加克塔加瑪》作為啟發以及印尼過往光榮歷史的證明—印尼雖然有很廣大的領土以及不同的文化，仍然能統一。加查·馬達將印尼諸島統一於滿者伯夷之下的努力也被印尼民族主義者拿來證明，在荷蘭殖民統治之前就已曾經存在統一的印尼。 因此加查·馬達在印尼脫離荷蘭殖民的印度尼西亞獨立革命中，扮演了啟發性的角色。",
      "在1942年，只有230個印尼原住民能獲得高等教育。印尼共和國的成員因此希望改變此狀況，開始建立國立大學來收印尼當地人。位於日惹的加查馬達大學於1949年建立，即以加查·馬達的名字命名。該大學以作為最先開放印尼當地住民入學的醫學院而知名。除了西爪哇地區以外，很多印尼城市的街道都命名為加查·馬達。還有一家羽毛球品牌也以他的名字命名。印度尼西亚海军的第一艘航空母艦，就是意大利海军退役航艦加里波底號航空母艦（Giuseppe Garibaldi），在印軍服役後，以「加查馬達號」（KRI Gajah Mada）為艦名。印尼的第一個通訊衛星命名為 帕拉帕衛星，即意指它和帕拉帕誓言一樣在國家統一上具有重要地位。",
    ] },
  { "title" = "大眾文化", "paragraphs" = [
      "在電子遊戲文明帝國V的資料片美麗新世界中，加查·馬達出現作為印尼文明的領袖。在電子遊戲世紀帝國II：帝王世紀的資料片世紀帝國II：拉者崛起中，加查·馬達出現作為馬來文明的戰役主角。",
    ] },
]

[articles.id]
text = "Gajah Mada (bahasa Jawa: ꦓꦗꦃꦩꦢ; ca 1290 – ca 1364), dikenal juga dengan nama lain Jirnnodhara adalah seorang panglima perang dan Mapatih (Perdana menteri) yang sangat berpengaruh di Nusantara pada zaman kerajaan Majapahit. Menurut berbagai sumber puisi, kitab, dan prasasti dari zaman Jawa Kuno, ia memulai kariernya tahun 1313, dan semakin menanjak setelah peristiwa pemberontakan Ra Kuti pada masa pemerintahan Sri Jayanagara, yang mengangkatnya sebagai Patih."
title = "Gajah Mada"
lang = "id"
url = "https://id.wikipedia.org/wiki/Gajah_Mada"
intro = [
  "Gajah Mada (bahasa Jawa: ꦓꦗꦃꦩꦢ; ca 1290 – ca 1364), dikenal juga dengan nama lain Jirnnodhara adalah seorang panglima perang dan Mapatih (Perdana menteri) yang sangat berpengaruh di Nusantara pada zaman kerajaan Majapahit.",
  "Menurut berbagai sumber puisi, kitab, dan prasasti dari zaman Jawa Kuno, ia memulai kariernya tahun 1313, dan semakin menanjak setelah peristiwa pemberontakan Ra Kuti pada masa pemerintahan Sri Jayanagara, yang mengangkatnya sebagai Patih. Dia diangkat menjadi patih (perdana menteri) pada masa Ratu Tribhuwanatunggadewi dan kariernya berlanjut hingga masa kekuasaan Hayam Wuruk yang mengantarkan Majapahit ke puncak kejayaannya. Ia diketahui menganut keyakinan Syiwa-Budha.",
  "Gajah Mada terkenal dengan sumpahnya, yaitu Sumpah Palapa, yang tercatat di dalam Pararaton. Ia menyatakan tidak akan istirahat atau menikmati kesenangan sebelum berhasil menyatukan Nusantara. Meskipun ia adalah salah satu tokoh sentral saat itu, sangat sedikit catatan-catatan sejarah yang ditemukan mengenai dirinya. Wajah sesungguhnya dari tokoh Gajah Mada, saat ini masih kontroversial. Banyak masyarakat Indonesia masa sekarang yang menganggapnya sebagai pahlawan dan simbol nasionalisme Indonesia dan persatuan Nusantara.",
]
sections = [
  { "title" = "Penggambaran rupa", "paragraphs" = [
      "Penggambaran rupa Gajah Mada yang populer di media sebenarnya adalah imajinasi dari Mohammad Yamin, di bukunya yang berjudul \"Gajah Mada: Pahlawan Persatuan Nusantara\", terbit pertama kali tahun 1945. Pada suatu hari di tahun 1940-an, Yamin mengunjungi Trowu­lan untuk melihat lokasi bekas kerajaan Majapahit. Ia menemukan pecahan terakota, salah satunya celengan berupa wajah seorang pria berwajah gempal dan berambut ikal. Berdasar bentuk muka wajah ce­lengan itu, Yamin menafsirkan seperti itulah wajah Gajah Mada sang pemersatu Nusantara. Yamin kemudian meminta seniman Henk Ngantung membuat lukisan seperti terakota tersebut. Hasil lukisan lalu dipampang sebagai sampul muka buku karya Yamin. Banyak orang yang menentang pendapat Yamin, karena mustahil wajah tokoh sebesar Gajah Mada dipampangkan di celengan. Hal semacam itu adalah penghinaan karena biasanya para pemuka negara pada zaman Hindu Buddha, termasuk Majapahit, diarcakan. Bebe­rapa orang bahkan yakin bahwa wajah yang disangka Gajah Mada itu tidak lain adalah wajah Yamin sendiri.",
      "Ada pula gambaran lain soal sosok Gajah Mada, berbeda dari yang diilustrasikan M. Yamin, yakni hasil penelitian arkeolog Universitas Indonesia Agus Aris Munandar. Dia mengilustrasikan Gajah Mada selayaknya sosok Bima dalam pewayangan, yakni berkumis melintang. Dalam media populer, Gajah Mada kebanyakan ditampilkan bertelanjang dada, memakai kain sarung, dan menggunakan senjata berupa keris. Meskipun ini mungkin benar dalam tugas sipil, pakaian lapangannya mungkin berbeda: Seorang patih Sunda menerangkan, seperti yang tertulis dalam kidung Sundayana, bahwa Gajah Mada mengenakan karambalangan (lapis logam di depan dada—breastplate) berhias timbul dari emas, bersenjata tombak berlapis emas, dan perisai penuh dengan hiasan dari intan berlian.",
      "Menurut Munandar, pada awalnya Gajah Mada diarcakan sebagai tokoh Brajanata dalam cerita panji, dan sebagai Bima dalam cerita Mahabharata pada masa kemudian. Pada awalnya Gajah Mada tidak langsung diarcakan sebagai tokoh Bima, ia diarcakan sebagai tokoh Brajanata karena kisah Panji lebih dulu dikenal daripada kegiatan pembuatan arca-arca Bima yang agaknya mulai berlangsung pada pertengahan abad ke-15. Pemuliaan Gajah Mada pada tahap pertama bersifat profan—adalah dalam bentuk pengarcaannya sebagai Brajanata, tetapi selanjutnya terjadi pemuliaan Gajah Mada dalam tahap kedua yang lebih bersifat sakral, yaitu disetarakan dengan Bima sebagai salah satu aspek Siwa. Pada arca yang terdapat di Museum Nasional, arca tersebut digambarkan berbadan tegap, kumis melintang, rambut ikal berombak, di bagian puncak kepala terdapat ikatan rambut dengan pita membentuk seperti topi tekes. Ia mengenakan busana dan perhiasan gelang dan kelat lengan atas berupa ular sebagaimana Bima.",
    ] },
  { "title" = "Arti nama", "paragraphs" = [
      "Kata \"Gajah\" mengacu kepada hewan yang besar yang disegani hewan lainnya, dalam mitologi Hindu dipercaya sebagai wahana (hewan tunggangan) dari dewa Indra. Gajah juga dihubungkan dengan Ganesa, dewa berkepala gajah berbadan manusia, putra Siwa dan Parwati. Adapun kata \"Mada\" dalam bahasa Jawa kuno artinya mabuk, bisa dibayangkan jika seekor gajah sedang mabuk, ia akan berjalan seenaknya, beringas, menerabas segala rintangan. Maka apabila dihubungkan dengan tokoh Gajah Mada, nama itu dapat ditafsirkan dalam 2 sifat, yaitu:",
      "Ia menganggap dirinya sebagai wahana raja, pelaksana perintah-perintah raja, sebagaimana gajah Airawata menjadi wahana dewa Indra.",
      "Ia adalah orang yang seakan-akan mabuk dan beringas apabila menghadapi berbagai rintangan yang akan menghambat kemajuan kerajaan. Sungguh merupakan pilihan nama yang tepat dan agaknya nama itu telah dipikirkan masak-masak maknanya sebelum dipakai untuk nama dirinya.",
    ] },
  { "title" = "Kelahiran", "paragraphs" = [
      "“Pada tahun saka 1213/1291 M, Bulan Jyesta, pada waktu itu saat wafatnya Paduka Bhatara yang dimakamkan di Siwabudha…Rakryan Mapatih Mpu Mada, yang seolah-olah sebagai yoni bagi Bhatara Sapta Prabhu, dengan yang terutama di antaranya ialah Sri Tribhuwanottunggadewi Maharajasa Jayawisnuwarddhani, cucu-cucu putra dan putri paduka Bhatara Sri Krtanagarajnaneuwarabraja Namabhiseka pada waktu itu saat Rakryan Mapatih Jirnnodhara membuat caitya bagi para brahmana tertinggi Siwa dan Buddha yang mengikuti wafatnya paduka Bhatara dan sang Mahawrddhamantri (Mpu Raganatha) yang gugur di kaki Bhatara.”",
      "Demikian bunyi Prasasti Gajah Mada yang bertarikh 1273 saka atau tahun 1351. Sebagai mahamantri terkemuka, Gajah Mada dapat mengeluarkan prasastinya sendiri dan berhak memberi titah membangun bangunan suci (caitya) untuk tokoh yang sudah meninggal. Prasasti itu memberitakan pembangunan caitya bagi Kertanagara. Raja terakhir Singhasari itu gugur di istananya bersama patihnya, Mpu Raganatha dan para brahmana Siva dan Buddha, akibat serangan tentara Jayakatwang dari Kediri.",
      "Menurut arkeolog Universitas Indonesia, Agus Aris Munandar, agaknya Gajah Mada memiliki alasan khusus mengapa memilih membangunkan caitya bagi Kertanagara daripada tokoh-tokoh pendahulu lainnya. Padahal, selama era Majapahit yang dipandang penting tentunya Raden Wijaya sebagai pendiri Kerajaan Majapahit. kemungkinan besar bangunan suci yang didirikan atas perintah Gajah Mada adalah Candi Singhasari di Malang. Pasalnya, Prasasti Gajah Mada ditemukan di halaman Candi Singhasari. Bangunan candi lain yang dihubungkan dengan Kertanagara, yaitu Candi Jawi di Pasuruan. Candi ini sangat mungkin didirikan tidak lama setelah tewasnya Kertanagara di Kedaton Singhasari.",
    ] },
  { "title" = "Biografi", "paragraphs" = [
      "Tidak ada informasi dalam sumber sejarah yang tersedia saat pada awal kehidupannya, kecuali bahwa ia dilahirkan sebagai seorang biasa yang kariernya naik saat menjadi Bekel (kepala pasukan) Bhayangkara (pengawal Raja) pada masa Prabu Jayanagara (1309–1328). Terdapat sumber yang mengatakan bahwa Gajah Mada bernama lahir Mada, sedangkan nama Gajah Mada kemungkinan merupakan nama sejak menjabat sebagai patih.",
      "Menurut Pararaton, Gajah Mada sebagai komandan pasukan khusus Bhayangkara berhasil menyelamatkan Prabu Jayanagara (1309–1328) ke desa Badander dan memadamkan pemberontakan Ra Kuti (salah seorang Dharmaputra, pegawai istana yang diistimewakan sejak masa Raden Wijaya). Sebagai balas jasa, dalam pupuh Désawarnana atau Nāgarakṛtāgama karya Prapanca disebutkan bahwa Jayanagara mengangkat Gajah Mada menjadi patih Kahuripan (1319). Dua tahun kemudian, dia menggantikan Arya Tilam yang mangkat sebagai patih di Daha / Kediri. Pengangkatan ini membuatnya kemudian masuk ke strata sosial elitis istana Majapahit pada saat itu. Selain itu, Gajah Mada digambarkan pula sebagai \"seorang yang mengesankan, berbicara dengan tajam atau tegas, jujur dan tulus ikhlas serta berpikiran sehat\".",
      "Pasca Jayanagara mangkat, Arya Tadah yang merupakan Patih Amangkubhumi mengajukan pengunduran diri dari jabatannya kepada Ibusuri Gayatri yang menggantikan kedudukan Jayanegara dan menunjuk Patih Gajah Mada dari Daha/Kediri. Gajah Mada sebagai Patih Daha sendiri tak langsung menyetujuinya, tetapi ia ingin membuat jasa terlebih dahulu pada Majapahit dengan menaklukkan Keta dan Sadeng yang saat itu sedang memberontak.",
    ] },
]

[articles.ar]
text = "جاجاه مادا (Gajah Mada) (تترجم إلى Elephant General) (حوالي عام 1290 – حوالي عام 1364) - هو قائد عسكري هندوسي جاوي (جزيرة تابعة لإندونيسيا حاليا) عرف أنه كان قويًا كما جاء في المخطوطات القديمة الجاوية والقصائد وعلم الأساطير- كان أحد وزراء إمبراطورية ماجاباهيت أو رئيس وزرائها، حيث يرجع له الفضل في وصول الإمبراطورية إلى قمة مجدها. حلف جاجاه مادا يمينًا تُعرف باسم Sumpah Palapa تعهَّد خلالها بألا يتناول أي طعام يحتوي على توابل حتى يستولي على أرخبيل نوسانتارا بـجنوب شرق آسيا لصالح إمبراطورية ماجاباهيت.، كما كان يُعد أحد أبطال إندونيسيا الحديثة القوميين البارزين وكان رمزا من الرموز الوطنية."
title = "جاجاه مادا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%AC%D8%A7%D8%AC%D8%A7%D9%87_%D9%85%D8%A7%D8%AF%D8%A7"
intro = [
  "جاجاه مادا (Gajah Mada) (تترجم إلى Elephant General) (حوالي عام 1290 – حوالي عام 1364) - هو قائد عسكري هندوسي جاوي (جزيرة تابعة لإندونيسيا حاليا) عرف أنه كان قويًا كما جاء في المخطوطات القديمة الجاوية والقصائد وعلم الأساطير- كان أحد وزراء إمبراطورية ماجاباهيت أو رئيس وزرائها، حيث يرجع له الفضل في وصول الإمبراطورية إلى قمة مجدها. حلف جاجاه مادا يمينًا تُعرف باسم Sumpah Palapa تعهَّد خلالها بألا يتناول أي طعام يحتوي على توابل حتى يستولي على أرخبيل نوسانتارا بـجنوب شرق آسيا لصالح إمبراطورية ماجاباهيت.، كما كان يُعد أحد أبطال إندونيسيا الحديثة القوميين البارزين وكان رمزا من الرموز الوطنية.",
]
sections = [
  { "title" = "الوصول إلى وزير إمبراطورية ماجاباهيت", "paragraphs" = [
      "لا يُعرف الكثير عن طفولة جاجاه مادا. أشارت بعض الروايات إلى وظيفته كقائدٍ لـبهايانجكارا (Bhayangkara) وحارسٍ مبجَّل لملوك إمبراطورية ماجاباهيت وعائلاتهم. عندما تمرَّد أحد مسئولي الإمبراطورية الذي يُدعى راكريان كوتي (Rakrian Kuti) على ملكها جايانيجارا (Jayanegara) (الذي حكمها في الفترة من عام 1309 إلى عام 1328) في عام 1321 قام كلٌ من جاجاه مادا ووزير إمبراطورية ماجاباهيت السابق آريا تاداه (Arya Tadah) بمساعدة الملك وعائلته على الهروب من قرية ترولان (Trowulan) التي تقع في العاصمة، ثم ساعده جاجاه مادا بعد ذلك على العودة إلى العاصمة والقضاء على التمرد. وبعد مرور سبعة أعوام قُتل جايانيجارا على يد راكريان تانكا (Rakrian Tanca) طبيب المحكمة وأحد أعوان راكريان كوتي.",
      "وقد جاء في النسخة المترجَمة لقصيدة ناجاراكريتاجاما (Nagarakretagama) (إحدى الملاحم المكتوبة بـاللغة الجاوية التي يعود تاريخها إلى القرن الرابع عشر) والتي أيدتها الكتابات التي يرجع تاريخها إلى الفترة بين نهاية القرن الثالث عشر وبداية القرن الرابع عشر أن جاجاه مادا هو الذي اغتال جايانيجارا في عام 1328. وقد قيل أن والدي جايانيجارا كانا يفضلانه على شقيقتيه، حيث إن والدته كانت أصغر بنات الملك كيرتاراجاسا (Kertarajasa) والتي تُدعى دياه ديوي جاياتري (Dyah Dewi Gayatri). جعلت شكاوى الأميرتين الصغيرتين جاجاه مادا يتدخل، حيث اتفق مع أحد الجراحين على قتل الملك مدعيًا أنه يُجري له عملية جراحية.",
      "خلفت جايانيجارا شقيقته تريبهوانا ويجاياتونجاديوي (Tribhuwana Wijayatunggadewi) (التي حكمت الإمبراطورية في الفترة ما بين عام 1328 وعام 1350)، حيث عُين جاجاه مادا وزيرًا للإمبراطورية خلال فترة ولايتها في عام 1329 بعد تقاعد آريا تاداه.",
    ] },
  { "title" = "Sumpah Palapa", "paragraphs" = [
      "يقال إن جاجاه مادا أدى يمينه الشهيرة Sumpah Palapa عند تعيينه وزيرًا خلال فترة ولاية الملكة تريبهوانا تونجاديوي (Tribhuwanatunggadewi). حيث تم وصف نص اليمين في باراراتون (Pararaton) (كتاب الملوك) التي تُعد إحدى روايات التاريخ الجاوي والتي يعود تاريخها إلى القرن الخامس عشر أو السادس عشر:",
      "“Sira Gajah Mada pepatih amungkubumi tan ayun amukita palapa, sira Gajah Mada : Lamun huwus kalah nusantara Ingsun amukti palapa, lamun kalah ring Gurun, ring Seram, Tanjungpura, ring Haru, ring Pahang, Dompo, ring Bali, Sunda, Palembang, Tumasik, samana ingsun amukti palapa “",
      "«تعهَّد السيد جاجاه مادا رئيس الوزراء أنه لن يتناول أي طعام يحتوي على توابل، كما صرح بالآتي: لن أتناول»palapa\" (\"فواكه أو توابل أو كليهما«) في حالة ضياع أرخبيل نوسانتارا (نوسانتارا= Nusa antara= المناطق الخارجية). لن أتناول أبدًا أي طعام يحتوي توابل إذا لم أستول على كلٍ من جورون (Gurun) وجزيرة سيرام ومقاطعة تانجونجبورا (Tanjungpura) ومقاطعة هارو (Haru) وفهغ ودومبو (Dompo) ومقاطعة بالي وسوندا (Sunda) ومدينة فلمبان وتوماسيك (Tumasik).»",
    ] },
  { "title" = "حادثة بوبات (Bubat)", "paragraphs" = [
      "في عام 1357 كانت سوندا (Sunda) التي تقع في جاوة الغربية والتي تحد إمبراطورية ماجاباهيت هي الولاية الوحيدة التي رفضت أن تعترف بـهيمنة إمبراطورية ماجاباهيت. أراد الملك هايام وروك أن يتزوج إحدى أميرات مملكة سوندا (Sunda) وابنة مَلكها التي تُدعى دياه بيتالوكا سيتراريزمي (Dyah Pitaloka Citraresmi). تولى جاجاه مادا مهمة الذهاب إلى ساحة بوبات (Bubat) التي تقع عند الجزء الشمالي من قرية ترولان(Trowulan) لاستقبال الأميرة حيث وصلت بصحبة أبيها إلى قصر إمبراطورية ماجاباهيت.",
      "انتهز جاجاه مادا هذه الفرصة ليطالب سوندا (Sunda) بالتسليم لحكم إمبراطورية ماجاباهيت. بينما اعتقد ملك سوندا (Sunda) أن هذا الزواج الملكي يُعد بمثابة رمز لإقامة تحالف جديد بين سوندا (Sunda) وإمبراطورية ماجاباهيت إلا أن جاجاه مادا كان يفكر بطريقةٍ أخرى، وبناءً عليه أعلن الملك أن أميرة سوندا (Sunda) لن تُدعى فيما يعد عقيلة الملك الجديد لإمبراطورية ماجاباهيت، بل ستصبح مجرد عشيقة مما يدل على تسليمه سوندا (Sunda) إلى إمبراطورية ماجاباهيت. أدى سوء الفهم هذا إلى الحرج والعداء الذي سرعان ما تصاعد إلى مناوشاتٍ وأدى إلى نشوب معركة بوبات (Bubat) واسعة النطاق. أسفرت هذه المعركة عن قهر قوات إمبراطورية ماجاباهيت لملك سوندا (Sunda) وجميع حراسه والحزب الملكي الذين لاقوا حتفهم فيما بعد في ميدان بوبات (Bubat). أشارت الروايات التراثية إلى أن الأميرة دياه بيتالوكا سيتراريزمي قد انتحرت.",
      "مثَّلت هذه المأساة صدمةً كبيرةً لهايام وروك. ألقت حاشية إمبراطورية ماجاباهيت ووزراؤها ونبلاؤها اللوم على جاجاه مادا لتهوره ولأن كل هذه الأعمال الوحشية لا تروق للعائلة المالكة للإمبراطورية. وعلى التوّ تم تخفيض رتبة جاجاه مادا وقضى بقية حياته في منطقة ماداكاريبورا (Madakaripura) التي تقع في مدينة بروبولينجو (Probolinggo) في مقاطعة جاوة الشرقية.",
    ] },
  { "title" = "الإرث", "paragraphs" = [
      "اهتمت الحركات القومية الإندونيسية بوصية جاجاه مادا، حيث قامت الحركة القومية الإندونيسية بتنفيذها في أوائل القرن العشرين. كان القوميّون وبخاصة سوكارنو (Sukarno) قبل الغزو الياباني كثيرًا ما يستشهدون بجاجاه مادا ويمينه كمصدر للإلهام وسند تاريخي للعظمة التي شهدتها إندونيسيا في عهده. كان بوِسع الإندونيسيين أن يتَّحدوا رغم اتساع مساحة أرضهم وتعدد ثقافاتهم، وبالتالي كان جاجاه مادا أحد مصادر تشجيعهم أثناء الثورة الوطنية الإندونيسية على الاستقلال عن الاستعمار الهولندي.",
      "في عام 1942 حصل 230 شخصًا فقط من سكان إندونيسيا على التعليم الجامعي. سعى الجمهوريون للتخلص من اللامبالاة الهولندية حيث قاموا بإنشاء جامعة جاجاه مادا في مدينة يوجياكارتا والتي تُعد أول جامعة للدولة تَقبل سكان إندونيسيا الأصليين pribumi دون أي مقابل مادي، حيث سُميت هذه الجامعة على اسم جاجاه مادا تكريمًا له وتم الانتهاء من إنشائها في عام 1945 وحظيَت بشرف كونها أول كلية طب تَقبل سكان إندونيسيا الأصليين دون أي مقابل مادي. كان أول قمر صناعي إندونيسي لـالاتصال عن بعد يُعرف باسم قمر بلبا الصناعي (Satelit Palapa) مما يدل على دوره في توحيد البلاد. تحتوي العديد من المدن في إندونيسيا عدا سيما جاوة الغربية على شوارع مُسماة على اسم جاجاه مادا، كما أن الطثة التي تُستخدم في رياضة البدمينتون مسماة أيضًا على اسمه.",
    ] },
]

