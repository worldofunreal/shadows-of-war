[articles.en]
text = "Constantine I, also known as Constantine the Great, was a Roman emperor from AD 306 to 337, co-ruling as part of the Tetrarchy until 324. The first Roman emperor to convert to Christianity, Constantine played a pivotal role in elevating the religion's status in the Roman Empire, with the Edict of Milan decriminalising its practice and ceasing Christian persecution."
title = "Constantine the Great"
lang = "en"
url = "https://en.wikipedia.org/wiki/Constantine_the_Great"
intro = [
  "Constantine I (27 February 272 – 22 May 337), also known as Constantine the Great, was a Roman emperor from AD 306 to 337, co-ruling as part of the Tetrarchy until 324. The first Roman emperor to convert to Christianity, Constantine played a pivotal role in elevating the religion's status in the Roman Empire, with the Edict of Milan decriminalising its practice and ceasing Christian persecution. He founded the city of Constantinople (now Istanbul) and made it the capital of the Empire, which it remained for over a millennium.",
  "Born in Naissus, a city located in the province of Moesia Superior (now Niš, Serbia), Constantine was the son of Flavius Constantius, a Roman army officer from Moesia Superior, who would become one of the four emperors of the Tetrarchy. His mother, Helena, was a Greek woman of low birth, probably from Bithynia. Later canonised as a saint, she is credited for the conversion of her son in some traditions, though others believe that Constantine converted her. He served with distinction under emperors Diocletian and Galerius. He began his career by campaigning in the eastern provinces against the Persians, before being recalled to the west in AD 305 to fight with his father in the province of Britannia. After his father's death in 306, Constantine was proclaimed as augustus (emperor) by his army at Eboracum (York, England). He eventually emerged victorious in the civil wars of the Tetrarchy against the emperors Maxentius and Licinius to become the sole ruler of the empire in 324.",
  "Upon his accession, Constantine enacted many reforms to strengthen the empire. He restructured the government, separating civil and military authorities. To combat inflation, he introduced the solidus, a new gold coin that became the standard for Byzantine and European currencies for more than a thousand years. He disbanded the Praetorian Guard, which had supported Maxentius. The Roman army was reorganised to consist of mobile units (comitatenses), often around the emperor, to serve on campaigns against external enemies or Roman rebels, and frontier-garrison troops (limitanei) who could counter barbarian raids but were less and less effective against full-scale barbarian invasions. Constantine pursued campaigns against the tribes on the Roman frontiers—such as the Franks, the Alemanni, the Goths, and the Sarmatians—and resettled territories abandoned by his predecessors during the Crisis of the Third Century with citizens of Roman society.",
  "Although Constantine lived much of his life as a pagan, he later became a catechumen, as he began to favour Christianity in 312, finally being baptised by Eusebius of Nicomedia, an Arian bishop. He played an influential role in the proclamation of the Edict of Milan in 313, which legalised Christianity in the Roman Empire. He convoked the First Council of Nicaea in 325, which produced the Christian statement of belief known as the Nicene Creed. On his orders, the Church of the Holy Sepulchre was built at the site claimed to be the tomb of Jesus in Jerusalem and was deemed the holiest place in Christendom. He has historically been referred to as the \"First Christian Emperor\", but while he did favour the Christian Church, some modern scholars debate his beliefs and even his comprehension of Christianity. He strongly influenced the Christianization of the Roman Empire and is venerated as a saint in Eastern Christianity and parts of Western Christianity.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Constantine was born on 27 February 272. While his official birthday is recorded in sources, his year of birth is not, and scholars have given several estimates between 271 and 280, with most leaning for 272 or 273. However, the evidence points to 272 being the correct year. He was born inside the city of Naissus, during a time when the unity of the Empire was threatened by the breakaway wars of the Palmyrene Empire. The city (modern Niš, Serbia) was located in Dardania within the province of Moesia Superior. His father was Flavius Constantius, an Illyrian or, according to his nephew, Julian The Apostate, a Thracian. His original full name, as well as that of his father, is not known. His praenomen is variously given as Lucius, Marcus and Gaius. Whatever the case, praenomina had already disappeared from most public records by this time. He also adopted the name \"Valerius\", the nomen of emperor Diocletian, following his father's ascension as caesar.",
      "Constantine probably spent little time with his father Constantius, who was an officer in the Roman army, part of Emperor Aurelian's imperial bodyguard. Being described as a tolerant and politically skilled man, Constantius advanced through the ranks, earning the governorship of Dalmatia from Emperor Diocletian, another of Aurelian's companions from Illyricum, in 284 or 285. Constantine's mother was Helena, a Greek woman of low social standing, possibly from Drepanum (later renamed Helenopolis) of Bithynia, which would likely have made her a Greek-speaker. It is uncertain whether she was legally married to Constantius or merely his concubine. Constantine's own language was Latin, and during his public speeches in the church councils, which were held in Greek, he needed Greek translators.",
      "In April 286 Diocletian declared Maximian, another colleague from Illyricum, his co-emperor. Each emperor would have his own court, his own military and administrative faculties, and each would rule with a separate praetorian prefect as chief lieutenant. Maximian ruled in the West, from his capitals at Mediolanum (Milan, Italy) or Augusta Treverorum (Trier, Germany), while Diocletian ruled in the East, from Nicomedia (İzmit, Turkey). The division was merely pragmatic: the empire was called \"indivisible\" in official panegyric, and both emperors could move freely throughout the empire. In 288, Maximian appointed Constantius to serve as his praetorian prefect in Gaul. Constantius left Helena to marry Maximian's stepdaughter Theodora in 288 or 289.",
    ] },
  { "title" = "Emperor (306–337)", "paragraphs" = [
      "Constantine's share of the empire consisted of Britain, Gaul, and Spain. He commanded one of the largest Roman armies, stationed along the strategically important Rhine frontier. He remained in Britain after his promotion to emperor, driving back the tribes of the Picts and securing his control in the northwestern dioceses. He completed the military bases begun under his father's rule and ordered the region's roads repaired. He then left for Augusta Treverorum (Trier) in Gaul, the Tetrarchic capital of the northwestern Roman Empire. The Franks learned of Constantine's acclamation and invaded Gaul across the lower Rhine over the winter of 306–307. He drove them back beyond the Rhine and captured kings Ascaric and Merogais; the kings and their soldiers were fed to the beasts of Trier Amphitheater in the adventus (arrival) celebrations which followed.",
      "Constantine began a major expansion of Trier. He strengthened the circuit wall around the city with military towers and fortified gates, and he began building a palace complex in the northeastern part of the city. To the south of his palace, he ordered the construction of a large formal audience hall and a massive imperial bathhouse. He sponsored many building projects throughout Gaul during his tenure as emperor of the West, especially in Augustodunum (Autun) and Arelate (Arles). According to Lactantius, Constantine followed a tolerant policy towards Christianity, although he may not have yet adopted the Christian faith. There is no consensus among scholars on Constantine's religious convictions at the beginning of his reign, and some suggest an adoption of Christianity from his youth. Regardless, he probably judged toleration a more sensible policy than open persecution and a way to distinguish himself from the \"great persecutor\" Galerius. He decreed a formal end to persecution and returned to Christians all that they had lost under the first of the persecuting edicts.",
      "Constantine was largely untried and had a hint of illegitimacy about him; he relied on his father's reputation in his early propaganda, which gave as much coverage to his father's deeds as to his. His military skill and building projects, however, soon gave the panegyrist the opportunity to comment favourably on the similarities between father and son, and Eusebius remarked that Constantine was a \"renewal, as it were, in his own person, of his father's life and reign\". Constantinian coinage, sculpture, and oratory also show a tendency for disdain towards the \"barbarians\" beyond the frontiers. He minted a coin issue after his victory over the Alemanni which depicts weeping and begging Alemannic tribesmen, \"the Alemanni conquered\" beneath the phrase \"Romans' rejoicing\". There was little sympathy for these enemies; as his panegyrist declared, \"It is a stupid clemency that spares the conquered foe.\"",
    ] },
  { "title" = "Assessment and legacy", "paragraphs" = [
      "Constantine reunited the empire under one emperor, and he won major victories over the Franks and Alamanni in 306–308, the Franks again in 313–314, the Goths in 332, and the Sarmatians in 334. By 336, he had reoccupied most of the long-lost province of Dacia which Aurelian had been forced to abandon in 271. At the time of his death, he was planning a great expedition to end raids on the eastern provinces from the Persian Empire.",
      "In the cultural sphere, Constantine revived the clean-shaven face fashion of earlier emperors, originally introduced among the Romans by Scipio Africanus (236–183 BC) and changed into the wearing of the beard by Hadrian (r. 117–138). With some departures, such as Julian the Apostate (r. 360–363), this new Roman imperial fashion lasted until the reign of Phocas (r. 602–610) in the 7th century.",
      "The Holy Roman Empire reckoned Constantine among the venerable figures of its tradition. In the later Byzantine state, it became a great honour for an emperor to be hailed as a \"new Constantine\"; ten emperors carried the name, including the last emperor of the Eastern Roman Empire. Charlemagne used monumental Constantinian forms in his court to suggest that he was Constantine's successor and equal. Charlemagne, Henry VIII, Philip II of Spain, Godfrey of Bouillon, the House of Capet, the House of Habsburg, the House of Stuart, the Macedonian dynasty and the Phokas family claimed descent from Constantine. Geoffrey of Monmouth embroidered a tale that the legendary king of Britain, King Arthur, was also a descendant of Constantine. Constantine acquired a mythic role as a hero and warrior against heathens. In later Byzantine legend, Constantine's building activity was also projected beyond Constantinople. The medieval Patria of Constantinople says that, after subduing the Scythians, he founded Persthlaba, Distra, Pliskouba and Konstantia. His reception as a saint seems to have spread within the Byzantine empire during wars against the Sasanian Persians and the Muslims in the late 6th and 7th century. The motif of the Romanesque equestrian, the mounted figure in the posture of a triumphant Roman emperor, became a visual metaphor in statuary in praise of local benefactors. The name \"Constantine\" enjoyed renewed popularity in western France in the 11th and 12th centuries. During the Fascist period in Italy in the 20th century, parallels between Constantine and Mussolini became especially popular after the signing of the Lateran Pacts by the Italian State and the Catholic Church in 1929. Mussolini's perceived role in bringing about the historic agreement was sometimes even…",
    ] },
]

[articles.es]
text = "Flavio Valerio Constantino (en latín: Flavius Valerius Constantinus; Naissus, 27 de febrero de c. 272, 280 o 288 - Nicomedia, 22 de mayo de 337)​​​​también conocido como Constantino el Grande, fue emperador romano desde el 25 de julio del año 306 hasta su muerte."
title = "Constantino I"
lang = "es"
url = "https://es.wikipedia.org/wiki/Constantino_I"
intro = [
  "Flavio Valerio Constantino (en latín: Flavius Valerius Constantinus; Naissus, 27 de febrero de c. 272, 280 o 288 - Nicomedia, 22 de mayo de 337)​​​​también conocido como Constantino el Grande, fue emperador romano desde el 25 de julio del año 306 hasta su muerte.",
  "Fue el primer emperador en dar libertad de culto al cristianismo haciendo cumplir el Edicto de tolerancia de Serdica de 311 del emperador Galerio que puso fin a la persecución a los cristianos en el Imperio romano (y que se completó con el llamado Edicto de Milán de 313). Promovió la convocatoria del Primer Concilio de Nicea en 325, que unificó la doctrina cristiana en el Credo de Nicea. Los historiadores, desde Lactancio y Eusebio de Cesarea hasta el presente, lo consideran el primer emperador cristiano,​ si bien no se bautizó hasta el final de su vida.​",
  "Constantino es conocido también por haber fundado una capital imperial sobre la antigua ciudad griega de Bizancio a la cual llamó Constantinopla; «ciudad de Constantino» (actual Estambul, en Turquía).",
  "La Iglesia ortodoxa venera a Constantino I como santo y le dio el título de Equiapóstolico (ισαπόστολος Κωνσταντίνος, isapóstolos Konstantínos, ‘igual a los apóstoles’) por sus servicios a la iglesia. También es venerado por las Iglesias ortodoxas orientales y la Iglesia católica bizantina griega.Su fiesta se celebra el 21 de mayo.​",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "Constantino nació hacia el año 272 o 280 o 282 (o en algún año entre el 270 y el 288) en Naïssus (la actual ciudad de Niš, Serbia), hijo de Constancio I,​​​​​​ y de Helena, una moza de postas proveniente de Bitinia, que había sido tomada como concubina por Constancio en los inicios de su carrera militar.​​ Tuvo que abandonarla al concertarse su matrimonio con la hijastra del augusto de Occidente Maximiano, Flavia Maximiana Teodora, pero Constancio se hizo cargo del hijo bastardo que había tenido con ella​​ (que desapareció de su entorno y solo volverá a aparecer cuando a partir de 324 Constantino se convierte en emperador único).​ Sobre la niñez y juventud de Constantino no se sabe nada.​",
      "Al principio del siglo IV, el imperio estaba gobernado por una tetrarquía: dos augustos, Diocleciano y Maximiano, y dos césares, Galerio y Constancio I (sus subordinados y sus supuestos sucesores).​ Los cuatro compartían el poder, pero Diocleciano, creador del nuevo sistema de gobierno, era la suprema autoridad indiscutida (hasta los sobrenombres que adoptaron los dos augustos manifestaban una clara diferencia: «Iovius, que deriva de Júpiter, se añadía al primer augusto; al otro se añadía Herculius, que procede de Heracles/Hércules, y que hacía referencia al mito según el cual este era hijo de Júpiter»).​ El joven Constantino sirvió en la corte de Diocleciano en Nicomedia tras el nombramiento de su padre como uno de los dos césares de la Tetrarquía en 293.​​ Allí prosiguió su educación superior en griego y en latín, como correspondía a un joven romano de buena familia, y acompañó a Diocleciano en sus campañas militares, probablemente en Egipto y en Mesopotamia.​ En esos años —la fecha exacta se desconoce— se casó con Minervina, una joven perteneciente a la aristocracia de la que se sabe muy poco y a la que probablemente conoció en una visita a Antioquía. Tuvieron un hijo, Crispo, que posiblemente nació en el año 303. Minervina es probable que muriera en el parto o poco después.​",
      "El año 305 marcó el final de la primera tetrarquía con la renuncia de los dos augustos Diocleciano y Maximiano.​​​​ De esta forma los dos césares accedieron a la categoría de augustos y dos oficiales ilirios fueron nombrados nuevos césares. La segunda tetrarquía quedaba así formada: Constancio I y Valerio Severo, como augusto y césar respectivamente, en Occidente y Galerio y Maximino Daya,su sobrino, en la parte oriental del imperio. «En realidad, fue Galerio el verdadero sucesor de Diocleciano, a quien debían su poder tanto Daya como Severo, mientras Constancio, ocupado en la administración de los territorios que le habían sido asignados, se mantenía al margen», ha afirmado José Manuel Roldán Hervás. «Estaba claro que en el nuevo colegio imperial la voz cantante iba a llevarla Galerio», ha subrayado también Luis Agustín García Moreno.​​​​​​ Por su parte Constantino, tras la abdicación de Diocleciano, pasó a estar a las órdenes de Galerio combatiendo a los sármatas, aunque pronto fue reclamado por su padre Constancio Cloro con el que marchó a Britania para combatir a los pictos que amenazaban las fronteras de la provincia.​​",
    ] },
  { "title" = "Constantino y el cristianismo", "paragraphs" = [
      "Según Paul Veyne, la conversión de Constantino al cristianismo «le permitió participar en lo que consideraba una epopeya sobrenatural, asumir el mando y garantizar así la salvación de la humanidad. […] Constantino se tenía por elegido, destinado por el Decreto divino para desempeñar un papel providencial en la economía milenaria de la salvación». «Constantino no dejará de repetir que él no es sino el servidor de Cristo, quien lo ha tomado a su servicio y le procura siempre la victoria». En 314 escribió a los obispos, «sus muy queridos hermanos», que «la santa piedad eterna e inconcebible de nuestro Dios se niega absolutamente a tolerar que la condición humana continúe por mucho más tiempo entre tinieblas».​ En ese mismo año le escribe al gobernador de África que «la voluntad divina [le] ha confiado el gobierno del universo». Y en 325 escribe a sus nuevos súbditos de la provincia romana de Siria Palestina: «Las pruebas más luminosas y evidentes han demostrado que, por las inspiraciones y favores que se digna multiplicar en mi favor, Dios ha expulsado de la tierra la maldad [de los perseguidores] que oprimía antes a toda la humanidad».​",
      "Sin embargo, Manfred Clauss ha afirmado que «Constantino, al convertirse al cristianismo, cambió únicamente la persona del dios, sin abandonar del todo la idea de la divinidad que había tenido hasta entonces y sin preocuparse demasiado de los dogmas cristianos».​",
      "A pesar de que en algún momento se puso en duda la franqueza de la conversión de Constantino al cristianismo —por ejemplo, Voltaire aseguró en el siglo XVIII que «Constantino no era cristiano» y que «no sabía qué partido tomar ni a quién perseguir»—​ hoy en día los historiadores están de acuerdo en considerar a Constantino un creyente sincero y así lo demuestran, como ha destacado Paul Veyne, los numerosos «textos salidos de su mano, sus leyes, sus sermones, sus edictos y sus cartas… Prueban la convicción que albergaba de su misión y demuestran línea a línea el más ortodoxo cristianismo».​ Lo mismo ha señalado Tiphaine Moreau, coautora del libro Constantin, un Auguste chrétien (2012).​ Manfred Clauss, no obstante, ha matizado que «es difícil concretar cómo era su cristianismo, qué era lo que él entendía bajo el concepto de “credo cristiano”», aunque subraya que es «un hecho irrefutable para todos los autores modernos y antiguos» que «Constantino era cristiano».​",
    ] },
  { "title" = "Política religiosa", "paragraphs" = [
      "Según Manfred Clauss, la política religiosa de Constantino siguió «dos líneas fundamentales: por un lado, el apoyo del culto cristiano, y, al mismo tiempo, la insistencia en el derecho de todos los hombres a la libre práctica de la religión». Sin embargo, tras su victoria sobre Licinio en 324, lo que le convirtió en emperador único, «se produjo una auténtica cesura» «que le fue llevando progresivamente a que el culto por él protegido se convirtiese en único. Por eso las medidas en contra de los llamados herejes fueron más rigurosas que las que se había tomado precedentemente frente a los seguidores de otros cultos. Al final se produjo un enorme fortalecimiento de los cultos cristianos, que Constantino había comprometido en la responsabilidad para con el Estado».​",
      "Un punto de vista similar es el que sostiene Claire Sotinel cuando señala que antes del año 324 Constantino se mantuvo discreto sobre sus propias convicciones y que durante esos primeros años de su reinado coexistieron la ambigüedad en el vocabulario para referirse a la divinidad suprema y el uso de figuras del culto tradicional, por lo que sus opiniones religiosas no suscitaron una gran oposición entre los no cristianos.​ «Cuando Constantino se convirtió al cristianismo, ignoraba donde se metía. Pensaba simplemente haber encontrado un dios más eficaz que los otros para llevarle a la victoria y asegurar la prosperidad y la unidad de ese inmenso cuerpo que era el Imperio».​ Pero a partir del 324 «Constantino dio una nueva amplitud a su adhesión al dios de los cristianos y a su apoyo a las Iglesias. [...] Esperaba a la vez asegurar la paz civil y crear las condiciones favorables a una conversión universal al cristianismo. [...] Expresando muy claramente su adhesión al cristianismo y su deseo de ver esta religión desempeñar un papel dominante en el Imperio, Constantino legisló sobre los cultos de manera restrictiva, pero no abiertamente hostil... [y] el culto imperial continuó durante toda la dinastía constantiniana».​ «Durante varios decenios, religiones diferentes se repartieron el espacio público, incluso privado, en una configuración profundamente nueva».​",
      "Algunos autores han considerado que el Edicto de Milán de 313, firmado por Constantino y por el coemperador Licinio, fue la norma que decretó la libertad de cultos en todo el Imperio Romano poniendo así fin a las persecuciones de los cristianos.​ Sin embargo, como ha señalado, entre otros, Paul Veyne, «la tolerancia estaba establecida desde hacía dos años» por el edicto de tolerancia de Galerio, promulgado en Serdica el 30 de abril de 311, por lo que «después de su victoria en el puente Milvio, Constantino [que ya había aplicado el decreto de Galerio en las “provincias” romanas que controlaba antes de derrotar a Majencio] no tuvo necesidad ninguna de promulgar un edicto en tal sentido». El edicto era en realidad un mandatum, una epístula dirigida a un gobernador de Oriente que contenía instrucciones para el cumplimiento del edicto de Galerio, ampliado con la restitución de los bienes de las iglesias por acuerdo de los dos emperadores.​​ «Esta carta, conocida con el nombre de “Edicto de Milán”, tenía valor de ley puesto que debía ser proclamada y mostrada por todas partes, con el fin de que todos la conocieran», ha señalado Tiphaine Moreau. Esta misma historiadora ha destacado que «hay que comprender esta decisión como una necesidad de mantener la pax deorum (‘la paz de los dioses’) por parte de los dos Augustos... Las comunidades cristianas recibían por esta carta una existencia legal. El cristianismo ganó ciertamente en visibilidad a partir de ese momento».​",
    ] },
  { "title" = "Política secular", "paragraphs" = [
      "A diferencia de la política religiosa, se dispone de poca información de la política secular. Los autores cristianos Lactancio y Eusebio de Cesarea se ocupan poco del asunto y el que más lo trata es Zósimo, un autor «pagano» que no fue contemporáneo de Constantino y cuya credibilidad es discutible porque muestra una profunda animadversión hacia el «impío» emperador, al contrario de Lactancio y Eusebio de Cesarea que caen en el extremo contrario, la adulación y el elogio sin límites.​ A pesar de estas limitaciones se considera que en este campo Constantino continuó en gran medida las reformas de su antecesor Diocleciano.​​​​ «No obstante, la obra constantiniana tiene un sello propio», ha afirmado Gonzalo Bravo.​",
      "«Constantino quiso fundar la unidad del Imperio sobre la prosperidad y la paz, y sobre el éxito dinástico... La cohesión a la que el emperador aspiraba pasaba por la ley (la legislación de Constantino fue abundante en materia de derecho civil y penal), por la difusión de la imagen imperial, por la fidelidad de una administración ampliamente reorganizada y de un ejército mimado por el poder. El resultado fue un éxito: no solo la autoridad del príncipe fue prácticamente indiscutida, sino la pertenencia a la dinastía constantiniana iba a dar hasta el final del siglo legitimidad para aspirar al poder», ha indicado, por su parte, Claire Sotinel.​",
      "David Potter coincide con Sotinel: Constantino «creía que el trabajo del emperador era defender el imperio de los enemigos externos mientras creaba una sociedad más justa y ordenada para sus súbditos; puede ser visto a menudo actuando según esos principios».​",
    ] },
  { "title" = "El legado de Constantino", "paragraphs" = [
      "Constantino tuvo que hacer frente a tres amenazas exteriores: en el Rin, en el Danubio y en la frontera oriental. En el Rin combatió a los francos y a los alamanes durante sus primeros años de reinado. Fue su hijo, el césar Crispo quien logró estabilizar esa parte del limes con una gran victoria en 320, que confirmó en 328 Constantino II, quien desde Tréveris lanzó campañas militares victoriosas contra los alamanes.​​ A Tréveris, convertida en la capital de Occidente,​ acudió en 328 el propio Constantino para celebrar los triunfos junto a su hijo.​",
      "En cuanto al frente del Danubio, son poco conocidas las guerras que mantuvo Constantino contra godos y sármatas. En el año 334 quedaron completamente sometidos y Constantino les permitió a unos trescientos mil sármatas, así como a vándalos desplazados por los godos del Danubio, asentarse en tierras fronterizas para cultivarlas y defenderlas.​ Dos años antes los godos, derrotados por su hijo el césar Constantino II y con los que se había firmado un tratado,​ habían comenzado a establecerse en la antigua Dacia trajana —y a convertirse al cristianismo arriano—.​​ Tras su campaña en el limes del Danubio que quedó asegurado​​ Constantino se vanaglorió de haber llevado la verdad del cristianismo a los bárbaros.​",
      "Por último, en el limes oriental tuvo que hacer frente al Imperio Sasánida. Tras su subida al trono, Sapor II había roto el periodo de paz impuesto por Diocleciano en 298 con el propósito de intentar recuperar territorios de Armenia y de Mesopotamia que los romanos habían arrebatado a los persas tras su victoria en 297, y en 334 había invadido el reino de Armenia, un reino cristiano desde 303 tras la conversión de su rey Tiridates III, y depuesto al rey Tiram, sucesor de Tiridates y aliado de los romanos. Constantino envió previamente a combatir a Sapor a su sobrino Anibaliano, al que nombró rex regum Ponticarum gentium (‘rey de reyes del pueblo del Ponto’), lo que constituía una provocación, ya que era el título que ostentaban los monarcas sasánidas.​​​ Tampoco fue un gesto amistoso la carta que le envió Constantino a Sapor exigiéndole que protegiera a los numerosos cristianos presentes en sus Estados.​​ Pero cuando en la primavera de 337 preparaba una gran campaña militar contra Sapor Constantino enfermó y murió poco después, dejando el problema sin resolver.​​​",
    ] },
]

[articles.fr]
text = "Constantin Ier (latin : Flavius Valerius Aurelius Constantinus ; en grec ancien : Κωνσταντῖνος / Kônstantînos), né le 27 février 272 à Naissus (l’actuelle Niš en Serbie) en Mésie supérieure et mort le 22 mai 337 près de Nicomédie (l’actuelle Izmit en Turquie), dans la Province Romaine de Bithynie et Pont, est un empereur romain majeur du IVe siècle. Bien qu'il ait été initialement proclamé Auguste de façon illégitime par ses troupes, à la mort de son père Constance Chlore en 306, son règne est entériné en 310 par l'empereur Galère, et se poursuit sans discontinuer jusqu'à sa mort en 337."
title = "Constantin Ier (empereur romain)"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Constantin_Ier_%28empereur_romain%29"
intro = [
  "Constantin Ier (latin : Flavius Valerius Aurelius Constantinus ; en grec ancien : Κωνσταντῖνος / Kônstantînos), né le 27 février 272 à Naissus (l’actuelle Niš en Serbie) en Mésie supérieure et mort le 22 mai 337 près de Nicomédie (l’actuelle Izmit en Turquie), dans la Province Romaine de Bithynie et Pont, est un empereur romain majeur du IVe siècle.",
  "Bien qu'il ait été initialement proclamé Auguste de façon illégitime par ses troupes, à la mort de son père Constance Chlore en 306, son règne est entériné en 310 par l'empereur Galère, et se poursuit sans discontinuer jusqu'à sa mort en 337. Il parvient à unifier le pouvoir impérial en 324 en triomphant sur son co-empereur Licinius, mettant ainsi fin à trente-huit années de tétrarchie. Il a donc été seul maître de l'Empire romain pendant treize ans.",
  "L'empereur Constantin Ier mène une vie politique militaire, religieuse et économique profondément réformatrice, qui lui permet de réunir sous son unique autorité un Empire affaibli et divisé. Il se débarrasse des empereurs Maxence en 312 (bataille du pont Milvius) et Licinius en 324 (bataille d'Andrinople).",
  "Son règne voit l'établissement de la liberté de culte individuel, qui met fin aux persécutions des chrétiens (édit de Milan, cosigné avec l'empereur Licinius en 313).",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Flavius Valerius Constantinus naît vraisemblablement à Naïssus en Dardanie, dans la province romaine de Mésie (actuelle Niš en Serbie), le 27 février 272. Son année de naissance est cependant sujette à controverses. Il est le premier fils de Constance, alors militaire émérite, et d'Hélène, une Grecque de basse extraction — sans doute servante d'auberge (stabuleria) — originaire de la Bythinie en Anatolie. La nature de la relation entre Constance et Hélène fait l'objet de débats : certaines sources les désignent comme époux, tandis que d'autres affirment leur statut de simple concubins. Eutrope décrit ainsi Constantin comme issu d'un « obscuriore matrimonio » (un mariage obscur, incertain).",
      "Constantin grandit dans un Empire politiquement instable. Entre la mort d'Aurélien en 275 et l’avènement de Dioclétien neuf ans plus tard en 284, six empereurs se succèdent, dans ce que les historiens nommeront la crise du troisième siècle.",
      "En 286, Dioclétien désigne Maximien comme co-empereur pour la partie occidentale de l'Empire. Constance, alors gouverneur de Dalmatie, est fait préfet du prétoire par ce dernier deux ans plus tard en 288. La tétrarchie est finalement instaurée en 293. Dioclétien et Maximien, augustes en Orient et en Occident, désignent Galère et Constance comme césars respectifs. Pour consolider le rapprochement d'avec les nouveaux empereurs, Constance, aux alentours de cette date, répudie Hélène pour épouser Théodora, la fille de Maximien — tout comme Galère épousera Valeria, la fille de Dioclétien. De plus, les deux césars sont officiellement adoptés par leurs empereurs respectifs. Constance s'installe à Trèves avec Théodora et mène différentes expéditions militaires contre les barbares dans le nord de la Gaule et en Bretagne (actuelle Grande-Bretagne), laissant Constantin et Hélène en Illyrie.",
    ] },
  { "title" = "Canonisation", "paragraphs" = [
      "D'après Eusèbe de Césarée, Constantin Ier serait mort le dimanche de Pentecôte 22 mai 337. Il est inscrit dans la plupart des calendriers orthodoxes le 21 mai avec sa mère Hélène, parfois le 22 (comme dans le lectionnaire de Jérusalem), comme Saint Constantin (Άγιος Κωνσταντίνος). Il est considéré dans l'Église orthodoxe grecque comme Ισαπόστολος Κωνσταντίνος : « Constantin égal aux Apôtres ».",
    ] },
  { "title" = "Légende", "paragraphs" = [
      "Geoffroy de Monmouth évoque le personnage de Constantin dans son Historia regum Britanniae (« Histoire des rois de Bretagne »). Selon lui, Constantin est le fils de Constance et d'Hélène, la fille du roi breton Coel Hen, se basant sur l'Historia Anglorum d'Henri de Huntingdon. Constantin devient « roi des Bretons » à la mort de son père. Il est ensuite proclamé empereur romain à Eboracum et quitte la Bretagne. Octavius, duc des Gewissae, se rebelle et revendique la royauté. Constantin envoie des légions dirigées par son grand-oncle Trahern (le frère de Coel Hen), qui échoue cependant à reprendre le trône.",
    ] },
  { "title" = "Documentaires", "paragraphs" = [
      "2006 : Rome, Grandeur et Décadence d'un Empire épisode Constantin, le premier empereur chrétien de Tim Dunn",
      "2008 : L'Apocalypse épisode La conversion de Constantin de Jérôme Prieur et Gérard Mordillat",
      "2019 : Quand l'histoire fait dates épisode 315 - La donation de Constantin de Denis Van Waerebke et Patrick Boucheron",
    ] },
]

[articles.de]
text = "Flavius Valerius Constantinus (* an einem 27. Februar zwischen 270 und 288 in Naissus, Moesia Superior; † 22."
title = "Konstantin der Große"
lang = "de"
url = "https://de.wikipedia.org/wiki/Konstantin_der_Gro%C3%9Fe"
intro = [
  "Flavius Valerius Constantinus (* an einem 27. Februar zwischen 270 und 288 in Naissus, Moesia Superior; † 22. Mai 337 in Achyrona, einer Vorstadt von Nikomedia), bekannt als Konstantin der Große (altgriechisch Κωνσταντῖνος ὁ Μέγας), in der Herrscherzählung Konstantin I., war von 306 bis 337 römischer Kaiser. Ab 324 regierte er bis zu seinem Tod als alleiniger Augustus.",
  "Konstantins Aufstieg zur Macht vollzog sich im Rahmen der Auflösung der römischen Tetrarchie („Viererherrschaft“), die Kaiser Diokletian errichtet hatte. 306 trat Konstantin das Erbe seines Vaters Constantius I. an, nachdem dessen Soldaten ihn zum Kaiser ausgerufen hatten. Bis 312 hatte sich Konstantin im Westen, 324 auch im Gesamtreich durchgesetzt. Folgenreich war seine Regierungszeit vor allem aufgrund der von ihm eingeleiteten konstantinischen Wende, mit der der Aufstieg des Christentums zur wichtigsten Religion im Imperium Romanum begann. Seit 313 garantierte die Mailänder Vereinbarung im ganzen Reich die Religionsfreiheit, womit sie auch das noch einige Jahre zuvor verfolgte Christentum erlaubte. In der Folgezeit privilegierte Konstantin das Christentum. 325 berief er das Erste Konzil von Nicäa ein, um innerchristliche Streitigkeiten (arianischer Streit) beizulegen. Im Inneren trieb Konstantin mehrere Reformen voran, die das Reich während der weiteren Spätantike prägten. Außenpolitisch gelang ihm eine Sicherung und Stabilisierung der Grenzen.",
  "Nach 324 verlegte Konstantin seine Residenz in den Osten des Reiches, in die nach ihm benannte Stadt Konstantinopel („Konstantinsstadt“). Viele Einzelheiten seiner Politik sind bis heute umstritten, besonders Fragen, die sein Verhältnis zum Christentum betreffen.",
]
sections = [
  { "title" = "Das Römische Reich zur Zeit Konstantins", "paragraphs" = [
      "Das Imperium Romanum war im 3. Jahrhundert in eine Krisenzeit geraten (Reichskrise des 3. Jahrhunderts), in der die innenpolitische Instabilität und der Druck auf die Grenzen zunahmen. An Rhein und Donau sorgten verschiedene Germanenstämme bzw. neue gentile Großverbände wie die Franken, Alamannen und Goten für Unruhe. Mehrmals drangen Gruppen von „Barbaren“ auf römisches Gebiet vor und plünderten römische Städte, die zuvor fast zwei Jahrhunderte lang weitgehend von Angriffen verschont geblieben waren. Im Osten war 224/226 das Sassanidenreich entstanden, das zum gefährlichsten Rivalen Roms wurde (siehe Römisch-Persische Kriege). Im Inneren des Imperiums stützten sich zahlreiche Usurpatoren und Usurpationsversuche vor allem auf die großen Heeresverbände, die nun die Kaisermacht legitimierten (Soldatenkaiser), so dass endlose Bürgerkriege das Imperium erschütterten. Wenngleich nicht alle Lebensbereiche und Provinzen von der Krise hart betroffen waren und diese keineswegs ununterbrochen andauerte, erwies sie sich doch als eine schwere Belastungsprobe für das Reich.",
      "Kaiser wie Aurelian leiteten daher seit den 270er Jahren Reformen ein, doch erst dem 284 an die Macht gekommenen Diokletian gelang es, das Reich auf ein neues Fundament zu stellen. Er betrieb weitreichende Reformen und gestaltete das Reich grundlegend um. Diokletian führte unter anderem ein neues Steuersystem (Capitatio-Iugatio) ein und ordnete das Heer durch Aufteilung in Comitatenses als mobiles Feldheer und Limitanei als Grenztruppen neu. Die Krise wurde endgültig überwunden, das Reich trat in die Spätantike ein. Als Reaktion auf die gleichzeitigen militärischen Belastungen an den verschiedenen Grenzen und die ständigen Usurpationen ehrgeiziger Generäle wurde ein Mehrkaisertum eingeführt, die Tetrarchie, in der Diokletian als senior Augustus mit drei ihm untergeordneten Mitkaisern fungierte. Dieses System beruhte auf Ernennung von Nachfolgern statt dynastischer Erbfolge und diente vor allem der Verhinderung von Usurpationen. Die Diokletianische Christenverfolgung in den letzten Regierungsjahren des Kaisers war die letzte und schwerste der Christenverfolgungen im Römischen Reich. 305 trat Diokletian freiwillig zurück und zwang seinen Mitkaiser Maximian, diesem Beispiel zu folgen, so dass nunmehr die bisherigen Unterkaiser Constantius I. (als Ersatz für Maximian im Westen) sowie Galerius (als Ersatz für Diokletian im Osten) als Seniorkaiser (Augusti) nachfolgten. Dennoch setzte sich bald entgegen Diokletians Absicht wieder das dynastische Prinzip durch (siehe Auflösung der römischen Tetrarchie). Ein jahrelanger blutiger Bürgerkrieg entbrannte, an dessen Ende Konstantin Alleinherrscher des Imperiums war.",
    ] },
  { "title" = "Leben", "paragraphs" = [
      "Konstantin wurde am 27. Februar eines unbekannten Jahres in der Stadt Naissus (heute Niš in Serbien) geboren. Sein Alter zum Zeitpunkt seines Todes (337) wird in den Quellen sehr unterschiedlich angegeben. Daher variieren in der Forschung die Ansätze für das Geburtsjahr zwischen 270 und 288, wobei eine frühe Datierung als plausibler gilt. Seine Eltern waren Constantius und Helena. Helena soll den Quellen zufolge von sehr niedriger Herkunft gewesen sein. Ambrosius von Mailand zufolge war sie Stallmagd (stabularia). Dies ist inzwischen teils dahingehend interpretiert worden, dass ihr Vater ein Beamter des Cursus publicus gewesen sei (Stallmeister); demnach wäre sie durchaus von hoher Geburt gewesen. In späteren Jahren wurde sie jedenfalls Christin, angeblich unter dem Einfluss ihres Sohnes. Sie ist am Hof Konstantins belegt, hat Pilgerreisen unternommen und spielte in der späteren christlichen Legende um das „Wahre Kreuz Christi“ eine wichtige Rolle.",
      "Constantius stammte wie viele römische Militärs aus dem Illyricum und war in einfachen Verhältnissen herangewachsen. Er neigte zum Henotheismus und verehrte vermutlich den Sonnengott Sol. Constantius war wohl unter den Kaisern Aurelian und Probus Offizier gewesen, gelangte aber erst unter Diokletian zu politischer Bedeutung. Dass er von Kaiser Claudius Gothicus abstammte, wie später behauptet wurde, gilt meist als Erfindung. Er war offenbar ein fähiger Militär und errang etwa 288/89 einen Sieg über die Franken. Wie lange die Beziehung zwischen Constantius und Helena hielt, ist unklar. Eine legitime Ehe ist, obwohl in manchen Quellen angedeutet, angezweifelt worden; in der Forschung ist diese Frage jedoch umstritten. Eine eventuell illegitime Herkunft wäre aus Legitimationsgründen problematisch gewesen, doch bekannte sich Constantius offenbar zu seinem Sohn und kümmerte sich um dessen Erziehung. Konstantin hatte noch sechs Halbgeschwister aus der spätestens 289 geschlossenen Ehe seines Vaters mit Theodora, einer Stieftochter Kaiser Maximians: die Brüder Julius Constantius, Flavius Dalmatius und Flavius Hannibalianus sowie die Schwestern Constantia, Eutropia und Anastasia.",
      "Sonst ist über Konstantins Kindheit und Jugend kaum etwas bekannt, zumal bereits früh die Legendenbildung um Konstantin einsetzte. Nachdem Constantius 293 in Diokletians Tetrarchie westlicher Caesar (Unterkaiser) unter Maximian geworden war, lebte Konstantin zuerst am Hof des Seniorkaisers Diokletian im Osten. Dort erhielt er eine formale, auch literarische Ausbildung, so dass er als recht gebildeter Mann gelten konnte. Vermutlich kam er auch in Kontakt mit dem gebildeten Christen Lactantius, der am Hof Diokletians tätig war. Lactantius legte dann zu Beginn der diokletianischen Christenverfolgung im Jahr 303, die das Ende eines seit 40 Jahren bestehenden Religionsfriedens markierte, sein Amt nieder. Ob Konstantin an dieser Verfolgung beteiligt war, ist unbekannt; es spricht aber nichts dafür. Er machte Karriere im Militär, bekleidete wohl den Posten eines Militärtribuns und zeichnete sich unter Galerius bei Kämpfen gegen die Sarmaten an der Donau aus.",
    ] },
  { "title" = "Nachwirkung", "paragraphs" = [
      "Konstantin zählt zu den bedeutendsten, aber auch umstrittensten Personen der Geschichte. Bereits in der Spätantike variierte die Beurteilung seiner Person und seiner Politik ganz erheblich, was großenteils vom religiösen Standpunkt des jeweiligen Betrachters abhing. Für die Christen war die Herrschaft Konstantins ein entscheidender Wendepunkt, sie waren dem Kaiser daher überaus dankbar. Lactantius brachte in seinem Werk De mortibus persecutorum (um 315) noch eher allgemein und durchaus mit antipaganer Polemik verknüpft seine Freude über das Ende der Christenverfolgung zum Ausdruck. Die Erhebung Konstantins zum Kaiser führte er direkt auf das Walten Gottes zurück. Der etwas später schreibende Eusebios von Kaisareia lobte in seiner Kirchengeschichte sowie vor allem in seiner Lebensbeschreibung Konstantins den Kaiser explizit und überschwänglich. Er beschrieb ihn als überzeugten Christen, der durch die „Vision“ vor der Schlacht an der Milvischen Brücke eine dramatische Bekehrung erlebte. Das von Eusebios vermittelte tendenziöse und überzeichnete Konstantinbild war sehr wirkungsmächtig, zumal es den Kaiser zum idealen christlichen Herrscher stilisiert. Das Werk vermittelt aber auch wichtige Informationen, ohne die keine Geschichte Konstantins geschrieben werden könnte.",
      "Die allgemein positive christliche Einschätzung setzte sich in den diversen spätantiken Kirchengeschichten fort, so bei Sokrates Scholastikos, Sozomenos und Theodoret, später auch etwa bei Gelasios von Kyzikos. Sie griffen das von Eusebios vermittelte Bild auf und schilderten Konstantin als frommen christlichen Herrscher. Dieses Konstantinbild wirkte auch in der byzantinischen Geschichtsschreibung stark nach. Nur vereinzelt finden sich kritische Stimmen wie in der Chronik des Hieronymus. Im Zusammenhang mit dem arianischen Streit kam es außerdem bei Athanasios und einigen ihm folgenden Autoren zu einer partiell kritischen Beurteilung. Trotz einer überwiegend positiven Darstellung wurde Konstantins zuletzt eher proarianische Politik missbilligend vermerkt. Der im frühen 5. Jahrhundert tätige Kirchengeschichtsschreiber Philostorgios, ein „radikaler Arianer“, dessen Werk Spuren der Verarbeitung paganer Quellen zeigt, bietet eine von der vorherrschenden Sichtweise etwas abweichende Beurteilung des Kaisers.",
      "Der zeitgenössische pagane Geschichtsschreiber Praxagoras lobte den Kaiser panegyrisch; er hat vermutlich auch Konstantins Beinamen „der Große“ eingeführt. Ansonsten fielen die Urteile der erhaltenen paganen Geschichtsschreiber überwiegend negativ aus. Konstantins Neffe Julian, der letzte pagane Kaiser (361–363), kritisierte ihn scharf und machte das Christentum für die blutigen Ereignisse des Jahres 337 verantwortlich. Libanios und Themistios beklagten hohe Steuern und damit verbunden eine angebliche Geldgier Konstantins, doch sind derartige Vorwürfe in der antiken Literatur gängige Topoi und nicht besonders aussagekräftig. Gegen die Religionspolitik Konstantins polemisierende pagane Autoren schoben ihm auf unterschiedliche Weise die Schuld an mancherlei negativen Ereignissen zu. In den diversen Breviarien (kurzgefassten Geschichtswerken) des 4. Jahrhunderts findet die Privilegierung des Christentums keine Erwähnung, allerdings erscheint hier Konstantin durchaus als tüchtiger Herrscher, der militärische Erfolge vorweisen konnte. Die Konstantin betreffenden Passagen im großen Geschichtswerk des Ammianus Marcellinus (Ende des 4. Jahrhunderts) sind nicht überliefert, doch in den erhaltenen Teilen finden sich Spuren einer antikonstantinischen Polemik. Besonders scharf attackierten die Geschichtsschreiber Eunapios von Sardes (um 400) und Zosimos (um 500) den Kaiser; für sie war er „geradezu der Totengräber des Reiches“. Zosimos hebt vor allem die Familienmorde von 326 hervor und erklärt damit – historisch falsch – die Hinwendung Konstantins zum Christentum. Für die Zeit vor 324 stellt er ihn als fähigen Herrscher dar, der nur mit göttlichem Beistand seine Erfolge feiern konnte und dessen schlechte Seiten noch nicht zutage traten. Zum christlichen Glauben habe er sich erst…",
    ] },
  { "title" = "Beurteilung in der Forschung", "paragraphs" = [
      "In der historischen Forschung sind seit dem 19. Jahrhundert viele Punkte umstritten. Die Einschätzung Konstantins wird durch die Quellenlage erschwert: Oft sind die Berichte verworren und widersprüchlich und die Selbstinszenierung des Kaisers ist schwer zu durchschauen.",
      "Das Bild Konstantins in Edward Gibbons großem Werk Decline and Fall of the Roman Empire spiegelt die zwiespältige Beurteilung in den spätantiken Quellen. Konstantin erscheint als fähiger Militär und Politiker, der aber gemäß Gibbons These vom Verfall des Reichs durch die Christianisierung korrumpiert worden sei. Doch war Gibbons Charakterisierung in der Forschung nicht besonders wirkungsmächtig. Hinsichtlich Konstantins Hinwendung zum Christentum sprechen manche Forscher von einem machtpolitisch kalkulierten Akt oder schenken den christlich tradierten Berichten keinen bzw. wenig Glauben.",
      "Am einflussreichsten war diesbezüglich der Schweizer Kulturhistoriker Jacob Burckhardt, dessen Ende 1852 erstmals erschienene Darstellung Die Zeit Constantins des Großen bis heute viel von ihrem Wert behalten hat, wenngleich einige Aspekte überholt sind, beispielsweise seine scharfe Trennung von Politik und Religion in der Spätantike. Burckhardts Konstantin ist ein „großer Mann“, aber auch ein rücksichtsloser und unreligiöser Egoist. Er habe die Bedeutung des Christentums erkannt und beschlossen, dies für seine Zwecke zu nutzen und das Reich zu einen. Otto Seeck zog die Visionserlebnisse nicht in Zweifel. Für ihn war Konstantin ein durchaus fähiger Kaiser, der aber zu leichtsinnig und zu sehr von Ratschlägen seiner Vertrauten abhängig gewesen sei. Den Übertritt zum Christentum erklärte er mit einer echten Überzeugung. An Burckhardts Urteil schloss Henri Grégoire an, der Konstantins Privilegierung des Christentums aus reinem Machtkalkül zu erklären versuchte. Für Grégoire (dessen Thesen kaum rezipiert wurden) war letztendlich Licinius im Osten der eigentliche Förderer des Christentums, von ihm sei auch die Mailänder Vereinbarung ausgegangen.",
    ] },
]

[articles.it]
text = "Flavio Valerio Aurelio Costantino, conosciuto anche come Costantino il Grande e Costantino I (in latino Flavius Valerius Aurelius Constantinus; in greco antico Κωνσταντῖνος ὁ Μέγας?, Konstantînos o Mégas; Naissus, 27 febbraio 274 – Nicomedia, 22 maggio 337), è stato un imperatore romano che regnò dal 306 fino alla sua morte. Costantino è una delle figure più importanti dell'Impero romano, che riformò largamente e nel quale permise e favorì la diffusione del cristianesimo."
title = "Costantino I"
lang = "it"
url = "https://it.wikipedia.org/wiki/Costantino_I"
intro = [
  "Flavio Valerio Aurelio Costantino, conosciuto anche come Costantino il Grande e Costantino I (in latino Flavius Valerius Aurelius Constantinus; in greco antico Κωνσταντῖνος ὁ Μέγας?, Konstantînos o Mégas; Naissus, 27 febbraio 274 – Nicomedia, 22 maggio 337), è stato un imperatore romano che regnò dal 306 fino alla sua morte.",
  "Costantino è una delle figure più importanti dell'Impero romano, che riformò largamente e nel quale permise e favorì la diffusione del cristianesimo. Tra i suoi interventi più significativi, la riorganizzazione dell'amministrazione e dell'esercito, la creazione di una nuova capitale a oriente, Costantinopoli, e la promulgazione dell'Editto di Milano sulla libertà religiosa.",
  "La Chiesa ortodossa e le Chiese di rito orientale lo venerano come santo, presente nel loro calendario liturgico, col titolo di Eguale agli apostoli; mentre il suo nome non è presente nel Martirologio Romano, il catalogo ufficiale dei santi riconosciuti dalla Chiesa cattolica, quindi non è considerato santo dai cattolici (nonostante la venerazione plurisecolare di cui gode in alcuni luoghi come in Sardegna).",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Le fonti primarie sulla vita di Costantino e sulle relative vicende da imperatore devono essere prese con la dovuta cautela. La principale fonte contemporanea è costituita da Eusebio di Cesarea, autore di una Storia Ecclesiastica che non manca di esaltare la gloria e la nobiltà di Costantino in quanto imperatore cristiano, a cui fece seguito una Vita di Costantino che ne costituisce una vera e propria agiografia. Anche Lattanzio, nel suo De mortibus persecutorum, delinea in modo netto la distinzione fra il pio Costantino e il perverso Diocleziano (Salona, 22 dicembre 244 – Spalato, 313). Distinzione forse non del tutto disinteressata, visto che Lattanzio, nato in Nordafrica da famiglia pagana e convertitosi al cristianesimo, dovette fuggire precipitosamente da Nicomedia, sede imperiale di Diocleziano, all'alba dell'ultima persecuzione contro i cristiani, nel 303.",
      "La stessa cautela deve valere per la Storia Nuova di Zosimo, pagano e anticristiano, che mostra evidenti pregiudizi in senso opposto. Infine, l'appendice alla storia di Ottato di Milevi sullo scisma donatista racchiude alcune lettere che Costantino avrebbe inviato ai cristiani del Nordafrica e che, se autentiche, potrebbero rivelare alcuni tratti del pensiero dell'imperatore riguardo alla questione cristiana.",
      "Costantino nacque a Naissus (odierna Niš, in Serbia), un modesto centro situato nella provincia romana della Mesia Superiore. Fu figlio del Cesare d'Occidente Costanzo Cloro, militare e politico romano di origini illiriche e nativo della Dardania, e di Elena, una donna greca originaria di Drepana (successivamente ridenominata Elenopoli dallo stesso Costantino in suo onore), nella Bitinia (nell'Anatolia nord-occidentale), di cui però s'ignora se fosse sua moglie o semplicemente una sua concubina. Il futuro imperatore fu di madrelingua latina e, nonostante le origini elleniche materne, ebbe sempre difficoltà nel padroneggiare il greco, tanto da doversi avvalere d'interpreti con locutori ellenofoni. Si conosce pochissimo della sua gioventù: perfino la sua data di nascita è incerta e generalmente collocata tra il 271 ed il 275. Forse è proprio durante l'adolescenza che gli fu affibbiato il soprannome dispregiativo Trachala, da interpretare nel senso di \"viscido come una lumaca\".",
    ] },
  { "title" = "Culto", "paragraphs" = [
      "Anche se divenuto cristiano, alla morte Costantino venne divinizzato (divus), per decreto del senato, con la cerimonia pagana dell'apoteosi, come era consuetudine per gli imperatori romani.",
      "Costantino, nonostante avesse iniziato a costruire un grandioso mausoleo di famiglia a Roma, lo lasciò a sua madre (il cd. Mausoleo di Elena) e volle essere sepolto a Costantinopoli, nella Chiesa dei Santi Apostoli, divenendo così il primo imperatore a essere sepolto in una chiesa cristiana.",
      "Costantino è considerato santo dalla Chiesa ortodossa, che secondo il Sinassario Costantinopolitano lo celebra il 21 maggio assieme alla madre Elena.",
    ] },
  { "title" = "Località italiane in cui è attestato il culto a San Costantino imperatore", "paragraphs" = [
      "Calabria, Provincia di Vibo Valentia, Briatico, San Costantino di Briatico (frazione)",
      "Sardegna, Provincia di Oristano, Siamaggiore, Parrocchiale di San Costantino Magno Imperatore",
      "Sardegna, Città metropolitana di Sassari, Pozzomaggiore, Chiesa di San Costantino (Pozzomaggiore)",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "Andreas Alföldi, Costantino tra paganesimo e cristianesimo, Laterza, Roma-Bari, 1976.",
      "Alessandro Barbero, Costantino il Vincitore, Salerno Editrice, Roma, 2016, ISBN 978-88-6973-138-9.",
      "Timothy Barnes, The victories of Constantine, in Zeitschrift für Papyrologie und Epigraphik 20, 1976, pp. 149–155.",
    ] },
]

[articles.tr]
text = "I. Konstantin (27 Şubat 272 - 22 Mayıs 337), ayrıca Büyük Konstantin olarak da bilinir, MS 306 - 337 yılları arasında hüküm süren ve Hristiyanlığı kabul eden ilk Roma imparatorudur."
title = "I. Konstantin"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._Konstantin"
intro = [
  "I. Konstantin (27 Şubat 272 - 22 Mayıs 337), ayrıca Büyük Konstantin olarak da bilinir, MS 306 - 337 yılları arasında hüküm süren ve Hristiyanlığı kabul eden ilk Roma imparatorudur. Roma'da Hristiyanlığın statüsünün yükseltilmesinde, Hristiyan ibadetlerinin suç olmaktan çıkarılmasında ve onlara yönelik zulmün durdurulmasında önemli bir rol oynadı. Böylelikle Roma İmparatorluğu'nun Hristiyanlaşmasında bir dönüm noktası oldu. Konstantinopolis şehrini kurdu ve bin yıldan fazla bir süre boyunca imparatorluğun başkenti olarak kalmasını sağladı.",
  "Mezya'daki Dardania'da (günümüzde Niş, Sırbistan) doğan Konstantin, İlirya kökenli bir Roma ordusu subayı olan ve Tetrarşi'nin dört imparatorundan biri olacak Flavius Constantius'un oğluydu. Annesi Helena ise düşük sınıftan bir kadındı ve muhtemelen Anadolu'dan geliyordu. Daha sonra azize ilan edilen Helena, bazı geleneklere göre oğlunun Hristiyanlığa geçmesini sağlayan kişi olarak kabul edilirken, bazıları ise Konstantin'in onu dönüştürdüğüne inanır. Konstantin, Roma imparatorları Diocletianus ve Galerius'un yönetimi altında üstün başarılar sergiledi. Kariyerine doğu eyaletlerinde Perslere karşı savaşarak başladı, ancak MS 305'te batıya çağrılarak Britanya eyaletinde babasının yanında savaştı. Babasının 306'da ölmesinin ardından Konstantin, ordusu tarafından Eboracum'da augustus (imparator) ilan edildi. Sonunda imparatorlar Maxentius ve Licinius'a karşı iç savaşlardan galip çıkarak, 324 yılında Roma İmparatorluğu'nun tek hükümdarı oldu.",
  "Konstantin tahta çıktıktan sonra imparatorluğu güçlendirmek için çok sayıda reform gerçekleştirdi. Sivil ve askeri otoriteleri birbirinden ayırarak devleti yeniden yapılandırdı. Enflasyonla mücadele etmek için, bin yıldan fazla bir süre Bizans ve Avrupa para birimleri için standart haline gelen yeni bir altın sikke olan solidus'u tanıttı.",
]
sections = [
  { "title" = "Hayatı", "paragraphs" = [
      "I. Konstantin, (günümüzde Sırbistan Cumhuriyeti içinde yer alan) tarihte ise İlirya toprakları içerisinde yer alan Naissus'da (Niş)'da 22 Şubat 272'de doğdu. Babası o zaman bir Romalı general olan Konstantius Chlorus idi. Annesi Helena idi ve VI. yüzyıl tarihçisi Prokopius'a göre, Küçük Asya'da (modern Anadolu) bulunan Bitinya eyaletinin \"Drepana\" adındaki kentinde doğmuştu. Bazı kaynaklar annesi Helena'nın General Konstantinius Cholorus ile evli olmayıp onun cariyesi olduğunu bildirirler. Konstantin'in babası yüksek rütbeli bir subaydı ve Konstantin gençlik yıllarını, İmparator Diocletianus'un sarayının bulunduğu, günümüzde Türkiye'nin İzmit ilçesinde bulunan Nicomedia'da geçirdi.",
      "286'da Nicomedia'da yaşayıp o kenti Roma İmparatorluğu'nun idare merkezi olan kullanan imparator Dioclietianus, kendine yakın olan general Maximinus'u imparatorluğunun Batı kısmını yönetmek üzere Roma'da Augustus rütbesi ile ortak imparatorluğa yükseltmişti. Konstatinus Cholorus bu sırada Roma'da Praetorian Prefect (Roma'da imparatorluk muhafızlarının lideri) idi. 291'de 19 yaşında iken Konstantin o zaman imparator Diocletianus'un yaşadığı Roma İmparatorluğu'nun idari merkezi olan Nikomedia'da imparatorun hizmetine girdi. 293'te babası Kontantinus Cholorus, Batı'yı yöneten Augustus Maximinus'a daha yakın olmak için (daha önce evli ise Helena'yı boşayarak, evli değilse onu evinden uzaklaştırarak) Maximinus'un kızı Flavia Maximiana Theodora ile evlilik yaptı.",
      "293 yılında İmparator Diocletianus imparatorluğun idaresinde gayet büyük bir reform yaparak Roma İmparatorluğu'nu Batı ve Doğu parçaları olarak ikiye bölerek Tetrarşi sistemini oluşturdu. Her parça bir \"Augustus\" tarafından yönetilecekti ve onun tayin edeceği bir \"Sezar\" tarafından desteklenecekti. Konstantin'in babası Konstantius Chlorus bu sistem içinde hemen en yüksek mevkilere erişmeye başladı. (293-305 döneminden Batı'da Maximianus ile Sezar olarak; 305 - 306'da Batı'da Augustus olarak ve Doğu'da Augustus olarak Galerius imparatorluk yaptı.",
    ] },
  { "title" = "Reformları", "paragraphs" = [
      "Doğu Roma İmparatorluğu'nun kurucusu olarak bilinen I. Konstantin, imparatorluk sınırları içinde yaşayan Hristiyanlara din özgürlüğü tanıması ve tüm imparatorluğun pagan inanç sistemini bu tek tanrılı yeni dine geçirmeye başlamasıyla tanınır. Bu tavrı nedeniyle Ortodoks kiliseleri tarafından \"azizlik\" mertebesine yükseltilerek kutsanan I. Konstantin'in aslında, imparatorluğun dört bir yanında yayılan bu dine karşı durmanın yaratacağı gerginlikleri engellemek için bu yolu izlediği düşünülmektedir. Dönemi boyunca hem Roma'nın çok tanrılı inanç sistemine hem de yeni Hristiyan dinine saygı gösteren I. Konstantin, sikkelerinde Apollon gibi Roma tanrılarına yer vermekten hatta kimi zaman kendisini \"Güneş Tanrısı\" Sol Invictus şeklinde resmetmekten de kaçınmamıştır. Aynı dönemde paraların üzerinde Grek alfabesindeki Hi (X) ve Ro (P) harfleri ile erken dönem Hristiyanlığın sembollerinden biri olan Labarum'a da yer vermiştir. Roma kaynaklarında, I. Konstantin'in hayatı boyunca Hristiyan olmadığı, ölüm döşeğindeyken vaftiz edildiği söylenmektedir.",
      "Onun tarafından yaptırılan Aziz Petrus ve Aziz Pavlus bazilikaları geleneğe göre elçilerin iman uğruna öldüğü veya gömüldüğü yerlere inşa edilmiştir.",
      "İmparator I. Konstantin, ayrıca 325'te Kilisenin bölünmesini önlemek umuduyla tüm Hristiyan din adamlarının katıldığı bir konseyi İznik'te toplamış fakat amacına ulaşamamıştır.",
    ] },
  { "title" = "Popüler kültürdeki yeri", "paragraphs" = [
      "2014 yılında, Mine Gökçe Kırıkkanat tarafından, Bir Hristiyan Masalı adında bir kitap yazılmıştır. Kitap, Vatikan Gizli Arşivleri'nde Donatio Constantini olarak da geçen ve kamuoyunda Büyük Konstantin'in vasiyeti olarak tanınan belgenin, aslında sahte bir belge olduğuna dair çalışmasını konu almaktadır.",
    ] },
  { "title" = "Konuyla ilgili yayınlar", "paragraphs" = [
      "Bahar, Hasan (2011), Roma ve Bizans Tarihi, İstanbul: Kömen Yayınları ISBN 978-9756527634",
      "Bowman, Alan; Cameron, Averil ve Garnsey, Peter (eds) (2005) The Cambridge Ancient History, Volume XII: The Crisis of Empire Rev.ed., Cambridge: Cambridge University Press ISBN 9780521301992 (İngilizce)",
    ] },
]

