text = "君士坦丁一世（拉丁語：Constantinus，希臘語：Κωνσταντίνος；272年2月27日—337年5月22日），又稱君士坦丁大帝（拉丁語：Constantinus Magnus），基督教尊稱為伊利里亞的聖君士坦丁，306年至337年在位的羅馬皇帝。他是第一位信仰基督教的皇帝，在313年与李锡尼共同頒佈《米蘭敕令》，承認在帝国轄境有信仰基督教的自由。 君士坦丁出生于上默西亚行省内索斯（或译奈苏斯，今塞尔维亚尼什）。他的父亲弗拉维乌斯·君士坦提乌斯是来自上默西亚的一名罗马军官，后来成为四帝共治制下的四位皇帝之一。母亲海伦娜是一位出身卑微的希腊女子，可能来自比提尼亚，后被封为圣人。君士坦丁曾在戴克里先和伽列里乌斯两位皇帝麾下效力，表现卓著。他的军旅生涯始于东方行省，曾参加对波斯人的战争。公元305年，他被召回西方，与父亲一同在不列颠尼亚行省作战。306年父亲去世后，君士坦丁在埃伯拉肯（今英格兰约克），被军队黄袍加身，拥立为奥古斯都。此后，他在四帝内战中先后击败马克森提乌斯和李锡尼两位皇帝，最终于324年成为罗马帝国唯一的统治者。 即位后，君士坦丁推行了多项旨在巩固帝国的改革。他重组政府，将文职权力与军事权力分开。为遏制通货膨胀，他发行了一种名为“索利都斯”的新金币，并成为此后的东罗马帝国及欧洲货币制度的重要标准。他还解散了罗马禁卫军，并将罗马军队被重新编组为两大部分：一类是通常驻扎在皇帝身边、可以迅速调动的野战军（comitatenses），负责出征对抗外敌或镇压罗马内部的叛乱；另一类是驻守边疆的边防军（limitanei），能够抵御蛮族的小规模袭扰。君士坦丁还对罗马边境附近的多个部族发动战争，包括法兰克人、阿勒曼尼人、哥特人和萨马提亚人，并组织罗马居民重新定居于那些在三世纪危机期间被其前任放弃的地区。…"
title = "君士坦丁大帝"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%90%9B%E5%A3%AB%E5%9D%A6%E4%B8%81%E5%A4%A7%E5%B8%9D"
intro = [
  "君士坦丁一世（拉丁語：Constantinus，希臘語：Κωνσταντίνος；272年2月27日—337年5月22日），又稱君士坦丁大帝（拉丁語：Constantinus Magnus），基督教尊稱為伊利里亞的聖君士坦丁，306年至337年在位的羅馬皇帝。他是第一位信仰基督教的皇帝，在313年与李锡尼共同頒佈《米蘭敕令》，承認在帝国轄境有信仰基督教的自由。",
  "君士坦丁出生于上默西亚行省内索斯（或译奈苏斯，今塞尔维亚尼什）。他的父亲弗拉维乌斯·君士坦提乌斯是来自上默西亚的一名罗马军官，后来成为四帝共治制下的四位皇帝之一。母亲海伦娜是一位出身卑微的希腊女子，可能来自比提尼亚，后被封为圣人。君士坦丁曾在戴克里先和伽列里乌斯两位皇帝麾下效力，表现卓著。他的军旅生涯始于东方行省，曾参加对波斯人的战争。公元305年，他被召回西方，与父亲一同在不列颠尼亚行省作战。306年父亲去世后，君士坦丁在埃伯拉肯（今英格兰约克），被军队黄袍加身，拥立为奥古斯都。此后，他在四帝内战中先后击败马克森提乌斯和李锡尼两位皇帝，最终于324年成为罗马帝国唯一的统治者。",
  "即位后，君士坦丁推行了多项旨在巩固帝国的改革。他重组政府，将文职权力与军事权力分开。为遏制通货膨胀，他发行了一种名为“索利都斯”的新金币，并成为此后的东罗马帝国及欧洲货币制度的重要标准。他还解散了罗马禁卫军，并将罗马军队被重新编组为两大部分：一类是通常驻扎在皇帝身边、可以迅速调动的野战军（comitatenses），负责出征对抗外敌或镇压罗马内部的叛乱；另一类是驻守边疆的边防军（limitanei），能够抵御蛮族的小规模袭扰。君士坦丁还对罗马边境附近的多个部族发动战争，包括法兰克人、阿勒曼尼人、哥特人和萨马提亚人，并组织罗马居民重新定居于那些在三世纪危机期间被其前任放弃的地区。",
  "尽管君士坦丁一生中的大部分时间都以异教徒身份生活，但他在312年开始公开倾向基督教，后来成为慕道者，最终由阿里乌派的尼科米底亚主教尤西比乌斯为他施洗。313年，其与李锡尼共同颁布了《米兰敕令》，使基督教在罗马帝国获得合法地位。325年，他召集第一次尼西亚大公会议，会议制定了后来被称为《尼西亚信经》的基督教信仰宣言。在他的命令下，人们在耶路撒冷一处被认为是耶稣墓地的地点修建了圣墓教堂；这座教堂后来被视为基督教世界最神圣的场所。历史上，君士坦丁常被称为“第一位基督教皇帝”。然而，尽管他确实优待基督教会，一些现代学者仍对其个人信仰，乃至他对基督教的理解程度存在争议。他在东方基督教以及西方基督教的部分教会中被尊奉为圣人，并为推动基督教进入罗马主流文化作出了重要贡献。",
]
sections = [
  { "title" = "古代研究", "paragraphs" = [
      "君士坦丁是一位具有重大历史影响的统治者，同时也始终是一个充满争议的人物。他身后声誉的起伏，反映了有关其统治时期的古代史料所具有的特殊性质。这些史料数量丰富、记述详尽，但深受当时官方宣传的影响，往往带有明显的片面性。与其生平和统治直接相关的同时代历史著作或传记因各种原因均未能保存下来。现存保存最接近此类作品的是优西比乌的《君士坦丁传》（Vita Constantini）。这部作品写于335年至339年之间，兼具颂词与圣徒传记的性质，旨在赞颂君士坦丁在道德和宗教方面的美德。《君士坦丁传》塑造了一个颇具争议的、极为正面的君士坦丁形象，现代历史学家经常对其可靠性提出质疑，被怀疑是君士坦丁对自身的政治宣传。关于君士坦丁最为完整的世俗传记，是作者不详、成书年代亦不确定的《瓦莱西亚佚名录》前篇中的《君士坦丁的起源》（Origo Constantini）。该书主要关注军事和政治事件，却忽略其在文化及宗教方面的作为。",
      "拉克坦提乌斯的《论迫害者之死》是一部讨论戴克里先及四帝共治时期的基督教政治性论著。它提供了许多有关君士坦丁前任及其早年生涯的宝贵细节，但叙述带有明显倾向性。索克拉蒂斯、索佐门和狄奥多勒所著的《教会史》（Historia Ecclesiastica），则记述了君士坦丁统治后期的教会争端。这些教会史家生活在狄奥多西二世统治时期，距离君士坦丁时代已有约一个世纪。他们通过转移重点、歪曲事实和有意含混的叙述，使君士坦丁时代的历史事件与神学思想变得模糊不清。与君士坦丁同时代的正统派基督徒亚历山大的亚他那修，其著作也保存至今；阿里乌派史家菲洛斯托尔吉乌斯所著的教会史同样留存下来，不过二者的立场倾向也同样鲜明。",
      "奥勒留·维克托的《诸凯撒传》（De Caesaribus）、欧特罗皮乌斯的《罗马史概要》（Breviarium）、费斯图斯的《概要》（Breviarium），以及匿名作者所著的《诸凯撒事略》（Epitome de Caesaribus），都以简略的形式记述了这一时期的世俗政治史和军事史。这些作品虽然并非出自基督教作者之手，却普遍对君士坦丁持正面态度，同时回避了对其宗教政策的记述。",
    ] },
  { "title" = "早期事蹟", "paragraphs" = [
      "君士坦丁出生于罗马帝国上麦西亚行省的内索斯（今塞尔维亚东部的尼什），在274年2月27日出生(也有可能是在272年)。他是帝国的西部奥古斯都（参见四帝共治制）君士坦提乌斯一世的长子。母亲海伦娜是一家小旅店的女仆，君士坦丁是她与父親的私生子。但英国历史学者爱德华·吉本的怀疑这种说法，他认为，海伦娜是这家小旅店的主人，她与君士坦提乌斯一世的婚姻是合法的。君士坦提乌斯一世是個寬容且有政治技巧的人，他統治下的地區對基督教的迫害較輕，君士坦丁和他父親共處的時間可能不長。不论如何，当293年君士坦提乌斯被帝國西部奥古斯都（皇帝）马克西米安任命为凱撒（副皇帝）后，他就离弃了海伦娜而与马克西米安之女狄奥多拉结婚。",
      "305年，君士坦提烏斯渡海進入不列顛，前往該島的最北端，對皮克特人發動了軍事遠征，並於306年1月7日取得勝利，獲得稱號「不列顛尼克征服者二世」。君士坦提烏斯退到埃伯拉肯（約克）過冬後，原計畫繼續征戰，但於306年7月25日駕崩。臨終前，君士坦提烏斯向軍隊推薦他的兒子作為繼承人；因此，君士坦丁在約克被軍隊擁立為西部的奧古斯都。君士坦丁出兵控制了不列颠和高卢地区。但後來君士坦丁接受已升為東部奧古斯都的伽列里烏斯之命，改稱西部凱撒。307與310年君士坦丁又反覆自稱為羅馬西部的奧古斯都。",
    ] },
  { "title" = "四帝內戰", "paragraphs" = [
      "戴克里先的继承者、东部奥古斯都伽列里乌斯于311年死后，四位奥古斯都（四帝）：李锡尼、马克森提乌斯、馬克西米努斯和君士坦丁展开內戰。君士坦丁联合李锡尼反对马克森提乌斯。他越过阿尔卑斯山，占领意大利。312年10月28日，君士坦丁在台伯河上米爾維安大橋附近的决战（米爾維安大橋戰役）中击败马克森提乌斯。马克森提乌斯在逃跑中落水而死。313年，君士坦丁与李锡尼在麦地奥兰（即今日米兰）会晤。李锡尼与君士坦丁的同父异母姊妹君士坦提娅结婚，以巩固两人的同盟。两位奥古斯都同时签署了米兰敕令，给予基督教在帝国境内的合法地位。",
      "313年，李锡尼在小亚细亚战胜馬克西米努斯，与君士坦丁瓜分了帝国。但是，他们之间的和睦仅仅维持了一年。两人都为独霸帝国而投入了新的战斗。314年发生的冲突未分胜负。324年君士坦丁击溃李锡尼，在李錫尼的妻子向君士坦丁苦苦求情下，李錫尼在生命無虞的保证下投降。然而君士坦丁在325年以阴谋叛变和私通蛮族的罪名将李锡尼绞死，从此成为罗马世界唯一的统治者。",
    ] },
  { "title" = "政治活動", "paragraphs" = [
      "君士坦丁一世試圖取消戴克里先的四帝共治制，但帝國局勢的混亂迫使他任命自己的親信為共治者。君士坦丁一世最初任命長子克里斯普斯為凱撒，但後者由於受到繼母法伍斯塔的誣陷而於326年被處死。君士坦丁不久以通奸罪把法烏斯塔也處死，但任命她所生的三個兒子為凱撒：君士坦丁二世统治西班牙、高盧和不列顛；君士坦提烏斯二世统治亞洲和埃及；君士坦斯一世统治意大利和迦太基。君士坦丁一世實際上是繼承了戴克里先的做法。",
      "在君士坦丁一世時代，羅馬帝國變成了軍事官僚國家。專橫跋扈的近衛軍被取消，代之以大量蠻族士兵加入帝國的軍隊。普通平民为逃避兵役竟采取自残的办法。臃肿的官僚系统更加庞大。颁布过一些保护贫民的法令，但由于普遍的目无法纪而很少得以实行。对奴隶的惩罚变本加厉：根据君士坦丁的法令，实际上已经恢复了主人杀死奴隶的权力（曾被哈德良皇帝废除）。各阶层的依附加大，农民被束缚于土地（332年法令），手工业者被束缚于城市，元老被固定在元老院裏。君士坦丁一世继续提倡戴克里先引入的东方专制君主的礼节（戴皇冠，臣民须向皇帝行跪拜礼等）。总而言之，君士坦丁完善了戴克里先的专制君主制度（Dominus），这种制度的目的是以公开的强制手段克服罗马的经济危机。",
    ] },
]

[articles.ja]
text = "ガイウス・フラウィウス・ウァレリウス・コンスタンティヌス（古典ラテン語：Gaius Flavius Valerius Constantinus ガーイウス・フラーウィウス・ウァレリウス・コーンスタンティーヌス、270年代前半の2月27日-337年5月22日）は、ローマ帝国の皇帝（在位：306年-337年）。複数の皇帝によって分割されていた帝国を再統一し、元老院からマクシムス（Maximus、偉大な/大帝）の称号を与えられた。 ローマ帝国の皇帝として初めてキリスト教を信仰した人物であり、その後のキリスト教の発展と拡大に重大な影響を与えた。このためキリスト教の歴史上特に重要な人物の1人であり、正教会、東方諸教会、東方典礼カトリック教会など、主要な宗派において聖人とされている。また、コンスタンティヌス1世が自らの名前を付して建設した都市コンスタンティノープル（現：イスタンブル）は、その後東ローマ帝国（ビザンツ帝国）の首都となり、正教会の総本山としての機能を果たした。"
title = "コンスタンティヌス1世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B3%E3%83%B3%E3%82%B9%E3%82%BF%E3%83%B3%E3%83%86%E3%82%A3%E3%83%8C%E3%82%B91%E4%B8%96"
intro = [
  "ガイウス・フラウィウス・ウァレリウス・コンスタンティヌス（古典ラテン語：Gaius Flavius Valerius Constantinus ガーイウス・フラーウィウス・ウァレリウス・コーンスタンティーヌス、270年代前半の2月27日-337年5月22日）は、ローマ帝国の皇帝（在位：306年-337年）。複数の皇帝によって分割されていた帝国を再統一し、元老院からマクシムス（Maximus、偉大な/大帝）の称号を与えられた。",
  "ローマ帝国の皇帝として初めてキリスト教を信仰した人物であり、その後のキリスト教の発展と拡大に重大な影響を与えた。このためキリスト教の歴史上特に重要な人物の1人であり、正教会、東方諸教会、東方典礼カトリック教会など、主要な宗派において聖人とされている。また、コンスタンティヌス1世が自らの名前を付して建設した都市コンスタンティノープル（現：イスタンブル）は、その後東ローマ帝国（ビザンツ帝国）の首都となり、正教会の総本山としての機能を果たした。",
]
sections = [
  { "title" = "概要", "paragraphs" = [
      "コンスタンティヌス1世はモエシア属州のナイッスス（現：セルビア領ニシュ）でローマ帝国の軍人コンスタンティウス・クロルスの息子として生まれた。父はその後、ローマ帝国でテトラルキア（四帝統治）体制が形成されると西の副帝（カエサル）を務め、後に正帝（アウグストゥス、在位305年-306年）となった。父がブリタンニア（現：イギリス）で死亡した後、コンスタンティヌス1世はその軍団をひき継いで306年に正帝を自称し、312年に東の正帝ガレリウスから正式に正帝としての承認を獲得した。軍人として卓越した手腕を発揮し、帝国国境外の「蛮族」との戦いに従事するとともに、複数の皇帝たちの間で戦われた内戦で勝利を重ねた。306年の正帝自称以来、20年近い歳月を費やして対立する皇帝たちを打ち破り（310年にマクシミアヌス、312年にマクセンティウス、324年にリキニウス）、ローマ帝国を再統一した。",
      "3世紀の危機と呼ばれる長い政治的・軍事的な動乱の時代を経ていたローマ帝国では、長期にわたって内政の再編が行われていた。コンスタンティヌス1世に先立ってこの混乱を一時終息させたディオクレティアヌス帝（在位：284年-305年）も新しい安定した統治機構の形成を模索し、各種の改革を実施していた。単独の皇帝となったコンスタンティヌス1世はディオクレティアヌスの改革を引き継ぎ、官僚制を整備し、文官と武官を分離するなどしてこれを完成させた。",
      "内政的には、ディオクレティアヌス帝まで拡大し続けたエクィテス（equites、騎士）身分の重職への登用を止め、かわりに形骸化しつつあった元老院を拡充させた。そしてこれまで騎士身分のための職だった官職を元老院身分にまで解放し、元老院身分者を大幅に増加させた。また半公式の身分であった伯（Comes、総監）を公式の身分とした。この結果、従来の元老院身分の構成員が大きく変化するとともに、元老院身分と騎士身分を内包し、それを超える新たな社会的地位が形作られた。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "コンスタンティヌス1世、即ちフラウィウス・ウァレリウス・コンスタンティヌスはモエシア属州のナイッスス（現：セルビアのニシュ）に生まれた。誕生日は2月27日であるが、生年は明らかではなく現代の学者による推定は西暦270年から290年までの範囲に及ぶ。誕生日がわかるのは後世この日が祝日とされたためである。主にアウレリウス・ウィクトルやエウセビオスが残した年齢と崩御年、在位期間の記録に基づいて計算すると270年代前半の生誕となり、これが「慎重な見解」であるとされる。しかし、その他の生年を導き出すことが可能な根拠もあり正確には不明である。コンスタンティヌス自身が自分が生まれた正確な年を知らなかった可能性もある。",
      "父親はローマの将軍フラウィウス・ウァレリウス・コンスタンティウス、即ちコンスタンティウス・クロルス(250年3月31日 - 306年7月25日、ラテン語: Flavius Valerius Constantius、ギリシア語: Κωνστάντιος χλωρός）であり、母親はその最初の妻ヘレナである。後にコンスタンティヌス1世は父コンスタンティウスの出自をクラウディウス・ゴティクス帝（在位：268年-270年）と結び付けたが、これが真実である可能性はほとんど無い。コンスタンティウスはまた貴族出身ともされるが、恐らくは農民であり一兵卒から成り上がったものであろう。ビテュニアのドレパナ（小アジア北西部）出身とも伝えられる母ヘレナが卑賎な身分の出身であったことは広く知られており、彼女は給仕婦であったともナイッススの宿屋で働いていたとも言われる。彼女はコンスタンティウスが西の正帝マクシミアヌスの義娘であるフラウィア・マクシミアナ・テオドラと結婚する際、政略的な理由から離縁されたが、コンスタンティヌスは母ヘレナとの間に密接な関係を維持した。コンスタンティウスとテオドラの間には6人の子供が生まれた。",
      "コンスタンティヌスが生まれた当時、ローマ帝国は一般に3世紀の危機と呼ばれる政治・軍事的混乱の時代の終末期にあり、主にバルカン半島の農民（イリュリア人）などから成り上がった皇帝たち（軍人皇帝）が次々と即位していた。父コンスタンティウスの出世もまたこの歴史的な経緯の中に位置付けられる。この混乱はコンスタンティヌスが極若い頃に皇帝として即位したディオクレティアヌス帝（在位：284年-305年）によって収拾され、彼は293年までに2名の正帝（アウグストゥス）と2名の副帝（カエサル）によって帝国を統治する四分統治（テトラルキア）体制を確立した。",
    ] },
  { "title" = "統治", "paragraphs" = [
      "324年、彼はボスポラス海峡に面する要衝の都市ビュザンティオン（ビュザンティウム）に自らの名前を与えコンスタンティノープル（コンスタンティノポリス、コンスタンティヌスの町）と改称した。この都市は海陸が交叉する地理上の要衝であり、ドナウ川の国境とアジアの国境の双方へ睨みを利かせる拠点として優れていたことに加え、ローマ帝国の政治・経済・文化の重心が東方へと移っていたことがこの選択に繋がった。母なる都市ローマを模して7つの丘が定められ14区が設置されたという。また、元老院や聖堂、広場（フォルム）、宮殿やその他の公共施設が建設された。工事の完了を待たず、330年5月11日には落成式が執り行われた。",
      "コンスタンティノープル建設はコンスタンティヌス1世の政策の中でも後世の歴史に最も大きな影響を残したものの1つであり、「新たなるローマ」として建設されたと後世の記録は伝えるが、同時代の記録者たちはコンスタンティノープルの建設にほとんど注意を払っていない。実際には新たなるローマという認識は建設当時には無かったとも言われている。これは当時属州の都市に皇帝が名前を付けることはあり触れたことであったためであろう。皇帝が都市に自分の名前を与えるのは、初代アウグストゥスの頃から繰り返されてきたことであり、ローマ帝国の領内は皇帝の名を与えられた都市がひしめいていた。また、ローマ帝国の重心が東に移っていることも周知のことで、コンスタンティヌス1世の姿勢は特に特殊なものではなく、既にディオクレティアヌスやガレリウスといった上位の正帝がニコメディアを中心に、東方に拠点を構えて滞在し続ける状況は何十年も継続していた。当時ローマは首都長官（Praefectus urbi）の管理下に置かれ、精神的な面を含めて首都であることに変わりなかったが、行政の中心としての役割を果たさなくなって久しく、実質的な行政府は前線で外敵と（そしてしばしば内戦を）戦う皇帝たちに付随して移動していた。皇帝がローマ市に立ち寄ることは滅多になく、平時にはそれぞれの任地の都市に建設した宮殿に居住しており、コンスタンティヌス1世も西の正帝であった頃はトリーアに住み、イリュリクムを平定した後にはセルディカ（現：ブルガリア領ソフィア）を「我がローマ」と言ったと伝えられる。",
      "上記のようにコンスタンティヌス1世が実際にコンスタンティノープルを「新たなローマ」として建設したのかは定かではないが、しかし一般的な都市よりは特別な存在に仕立て上げられたことも事実であった。新都市建設にあたっては惜しみない費用がかけられ、建築部材や装飾用の美術品を求めて各地の神殿から略奪が行われた。その市域は既存のビュザンティオンの3.5倍にも拡張され、都市を囲う城壁や宮殿も用意された。ローマ市よりは明確に格下であったにせよ、一般的な属州都市よりは高い法的地位が与えられ、ビュザンティオンの都市参事会を改組して元老院が置かれた。ローマの元老院議員は爵位としてクラーリッシムスだったのに対しコンスタンティノープルの元老院は格下のクラールスとされた。両都市の位置付けが法的に対等となるのはコンスタンティウス2世の治世であり、実際にコンスタンティノープルが事実上の「首都」として機能し始めるのはテオドシウス1世（在位：379年-395年）の治世のことである。",
    ] },
  { "title" = "キリスト教", "paragraphs" = [
      "コンスタンティヌス1世は、初めてのキリスト教徒ローマ皇帝として有名である。それ以前のローマ帝国では、ネロ帝（54年-68年）のキリスト教徒迫害に始まり、ディオクレティアヌス帝（284年-305年）の大迫害まで、何度かキリスト教が迫害を受ける時期があった。そんな一部の時期を除くほとんどの間、キリスト教徒であることは黙認されていたが、発覚した場合は改宗を迫られ拒絶した者は処刑された。",
      "しかし、ローマの正帝の1人として実力を持っていたコンスタンティヌス1世は312年（と、言われる）頃に何らかの形でキリスト教を受け入れた。伝説によると、コンスタンティヌス1世が改宗したのは、神の予兆を見たためと伝えられる。コンスタンティヌス1世は、312年にマクセンティウス軍と戦うためにミルウィウス橋に向かう行軍中に太陽の前に逆十字とギリシア文字 Χ と Ρ（ギリシア語で「キリスト」の先頭2文字）が浮かび、並んで「この印と共にあれば勝てる」というギリシア語が浮かんでいるのを見た。この伝説はラクタンティウスなどいくつかの資料で詳しく伝えられているが、4-5世紀頃の文献に多く現れる神の予兆や魔法などの話のひとつである。この後のローマ軍団兵の盾にはそれを模った紋章（ラバルム）が描かれたという。",
      "当時キリスト教はローマ帝国の領内に強固に根付きつつあったが、キリスト教徒ローマ皇帝の登場、すなわち、コンスタンティヌス1世の改宗はその当然の帰結であったわけではない。コンスタンティヌス1世の改宗の時点で、ローマ帝国内のキリスト教徒比率は多く見積もっても10パーセント程度でしかなかったと見られているし、またジョーンズによれば、キリスト教徒は都市部に偏在しており、主要な支持基盤は下層・中産階級を構成する手工業者や書記。小売商、商人、下級都市参事会員などであったという。",
    ] },
]

[articles.ru]
text = "Фла́вий Вале́рий Авре́лий Константи́н, Константи́н I, Константи́н Вели́кий (лат. Flavius Valerius Aurelius Constantinus; 27 февраля 272, Наисс, Верхняя Мёзия — 22 мая 337, Никомедия, Вифиния и Понт) — римский император с 306 по 337 год."
title = "Константин I Великий"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9A%D0%BE%D0%BD%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%BD_I_%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%B8%D0%B9"
intro = [
  "Фла́вий Вале́рий Авре́лий Константи́н, Константи́н I, Константи́н Вели́кий (лат. Flavius Valerius Aurelius Constantinus; 27 февраля 272, Наисс, Верхняя Мёзия — 22 мая 337, Никомедия, Вифиния и Понт) — римский император с 306 по 337 год. После смерти отца, в 306 году, был провозглашён войском августом, после победы над Максенцием в 312 году в битве у Мульвийского моста и над Лицинием в 324 стал единственным полновластным правителем римского государства; сделал христианство господствующей религией, в 330 году перенёс столицу государства в Византий, в дальнейшем переименованный им в свою честь (Константинополь), организовал новое государственное устройство. С именем Константина I связано окончательное установление в Римской империи системы домината, то есть неограниченной власти императора. Монарх стал пользоваться невиданными до того почестями. Константин почитается некоторыми христианскими церквями как святой в лике равноапостольных (Святой Равноапостольный царь Константин). В то же время Римско-католическая церковь долго не включала его имя в список своих святых, но после Брестской унии имя Константина вошло в список святых Католической церкви, он почитается в настоящее время как святой в лике равноапостольных, память 21 мая или 3 июня в храмах, использующих восточный обряд.",
]
sections = [
  { "title" = "Семья", "paragraphs" = [
      "Константин (Флавий Валерий Аврелий Константин) родился в провинции Верхняя Мёзия в городе Наиссе (современный Ниш в Сербии) 27 февраля около 272 года (точный год рождения не установлен). Отцом Константина был Констанций I Хлор (Флавий Валерий Констанций Хлор), впоследствии провозглашённый цезарем, а матерью — его сожительница (конкубина) — христианка Елена, происходившая из простой семьи (она была дочерью трактирщика из Вифинии). Согласно историку Евтропию, Констанций был «мужем великим и доброжелательности величайшей», поэтому отличался терпимостью к христианам. Впоследствии Констанцию Хлору пришлось разойтись с ней и жениться на падчерице императора Августа Максимиана Геркулия Феодоре. При этом Елена продолжала занимать видное место при дворе сначала своего бывшего мужа, а затем и сына. В результате этого брака у Константина оказалось три единокровных брата (Далмаций Старший, Юлий Констанций, Аннибалиан) и три единокровных сестры (Анастасия, Констанция I, Евтропия II). В ранней молодости Константин служил в армии при Диоклетиане в Никомедии, участвовал в походах в Персию и Египет.",
    ] },
  { "title" = "Борьба за власть", "paragraphs" = [
      "В 285 году император Диоклетиан утвердил новую систему управления империей, согласно которой у власти находились не один, а сразу четыре правителя, двое из которых назывались августами (старшими императорами), а двое других цезарями (младшими). Предполагалось, что спустя 20 лет правления августы отрекутся от власти в пользу цезарей, которые, в свою очередь, также должны были назначить себе преемников. В том же году Диоклетиан выбрал себе в соправители Максимиана, при этом отдав ему в управление западную часть империи, а себе оставив восток. В 293 году августы выбрали себе преемников. Одним из них стал отец Константина, Констанций, бывший тогда префектом Галлии, место другого занял Галерий, ставший впоследствии одним из жесточайших гонителей христиан. В 305 году, спустя 20 лет после установления тетрархии, оба августа подали в отставку и Констанций I Хлор с Галерием стали полноправными правителями империи (первый на западе, а второй на востоке). К этому моменту Констанций был уже очень слаб здоровьем и его соправитель надеялся на его скорую смерть. Почувствовав приближение смерти, Констанций пожелал видеть своего сына Константина, находящегося в этот момент, практически на правах заложника, в столице восточного августа Никомедии. Галерий не желал отпускать Константина к отцу, так как боялся, что воины объявят его августом, что не входило в планы императора. Он хотел подчинить себе всю империю, поставив на место Констанция своего ставленника Флавия Севера. Галерий изначально разрешил отправиться к отцу, но быстро передумал и велел остановить Константина, однако Константин уже отправился в Британию к своему отцу. Армия провозгласила Константина императором после смерти его отца Констанция I в 306 г. под Эбораком (современный город Йорк, Великобритания).",
      "Волей-неволей Галерию пришлось смириться с этим, но под предлогом, что Константин ещё слишком молод, он признал его только цезарем. Августом же он назначил Севера. Формально Константин занимал положение подчинённого по отношению к Флавию Северу, но на самом деле это было не так. В Галлии, где находилась резиденция Константина, стояли лично ему преданные легионы, население провинции, благодаря мягкой и справедливой политике его отца, доверяло ему. Флавий Север не имел такой прочной основы.",
      "В 306 году в Риме случилось восстание, в ходе которого Максенций, сын отрёкшегося Максимиана, пришёл к власти. Константин охотно пошёл на соглашение с ним, пытаясь использовать его для уничтожения Флавия Севера. Пытаясь подавить восстание, Север осадил Рим, но взять его не смог и отступил в хорошо укреплённую Равенну. Максимиан, вернувшийся к власти после провозглашения сына цезарем, пошёл на хитрость. Он убедил Севера, что среди его приближённых против него составлен заговор, и если он сдастся на милость Максимиану, ему сохранят жизнь. Когда Север сдался, его привезли в Рим и заставили покончить с собой. После его гибели сам император Галерий пытался подавить восстание. Он вторгся в Италию, однако ничего не смог сделать с неприступными твердынями Рима и Равенны. В 308 году взамен Севера он объявил августом Запада Лициния, который реально контролировал лишь балканские провинции. В этом же году цезарь Максимин II Даза объявил себя августом, и Галерию пришлось присвоить Константину такой же титул (так как до этого они оба были цезарями). Таким образом в 308 году империя оказалась под властью сразу 5 полноправных правителей, каждый из которых не подчинялся другому.",
    ] },
  { "title" = "Правление Константина", "paragraphs" = [
      "Став полновластным правителем империи, Константин продолжил политику Диоклетиана по закреплению свободных земледельцев за их землёй, при этом сильно возросли налоги, так как государству нужны были средства на восстановление империи после 20 лет гражданских войн. Кроме того, Константин развил бурную строительную деятельность, что также требовало дополнительных затрат. Государство было разделено Константином на 4 округа: Восток, Иллирию, Италию и Галлию, которые делились на более мелкие административные единицы — диоцезы. Он также учредил государственный совет при императоре — консисторий.",
      "Также Константин в 314—324 годах провёл монетную реформу, которая была усовершенствованием денежной реформы, проведённой в 296 году императором Диоклетианом.",
      "В начале своего правления Константин, как и все предыдущие императоры, был язычником. По вопросу причин принятия христианства существуют разные версии.",
    ] },
  { "title" = "Последние годы и смерть", "paragraphs" = [
      "5 июля 328 император лично открывает «Константинов мост» через Дунай в Суцидаве в Дакии, который стал самым длинным речным мостом древности. Его общая протяжённость составляла 2437 метров, из которых 1137 метров проходили над Дунаем. Ширина моста составляла 5,7 метров, а высота над уровнем реки — 10 метров. В планах Константина было возвращение Дакии, которая была оставлена ещё в 271 году при императоре Аврелиане.",
      "В 332 году Константин провёл совместную с сарматами войну против готов. Вестготы под предводительством Ариариха вышли из Ойума и стали продвигаться на территории сарматов в Дакии. Сарматы попросили у Константина помощь, и 20 апреля 332 года римская армия под предводительством его сына Константина II разбила варваров, уничтожив «голодом и холодом» около 100 000 варваров. В 334 сарматы устраивают переворот против своих лидеров и тогда Константин начинает войну уже с сарматами. Разбив их войска Константин расселяет часть выживших в Иллирии в качестве крестьян, а других забирает в свою армию. Поселенные в определённых землях варвары, известные как колоны, стали прообразом крепостных крестьян, так как не имели права покидать обрабатываемую ими землю. В 336 году Константин получает титул Dacicus maximus.",
      "После успехов в Дакии, Константин планирует начать войну с Сасанидской Персией. В 338 году заканчивал действие Нисибисский мирный договор и обе страны готовились к войне. Константин пишет письмо шахиншаху Шапуру II, в котором говорит о своём покровительстве персидских христиан и требует прекратить притеснения, которые начались после принятия Римом христианства как официальной религии. Константин планировал принять крещение в реке Иордан перед тем как войти на территорию Персии, но он заболел весной 337 года.",
    ] },
  { "title" = "Память", "paragraphs" = [
      "За свою деятельность по распространению христианства Константин вместе со своею матерью Еленою канонизирован в лике равноапостольных.",
      "в православной церкви — 21 мая (3 июня), в поместных православных церквах, использующих юлианский календарь; 21 мая, в поместных православных церквах, использующих новоюлианский календарь;",
    ] },
]

[articles.vi]
text = "Flavius Valerius Aurelius Constantinus (sinh vào ngày 27 tháng 2 khoảng năm 280 – mất ngày 22 tháng 5 năm 337), thường được biết đến là Constantinus I, Constantinus Đại Đế hay Thánh Constantinus (đối với các tín hữu Chính thống giáo Đông phương), là hoàng đế La Mã từ năm 306 đến khi mất. Constantinus I là vua La Mã đầu tiên cải đạo sang Ki-tô giáo và là người đã ban bố Sắc lệnh Milano chấm dứt thảm sát tín đồ Ki-tô giáo trong toàn đế quốc Constantinus I là con của vua Constantius Chlorus, đã lên kế vị tại York (nước Anh ngày nay) sau khi phụ hoàng chết năm 306."
title = "Constantinus Đại đế"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Constantinus_%C4%90%E1%BA%A1i_%C4%91%E1%BA%BF"
intro = [
  "Flavius Valerius Aurelius Constantinus (sinh vào ngày 27 tháng 2 khoảng năm 280 – mất ngày 22 tháng 5 năm 337), thường được biết đến là Constantinus I, Constantinus Đại Đế hay Thánh Constantinus (đối với các tín hữu Chính thống giáo Đông phương), là hoàng đế La Mã từ năm 306 đến khi mất. Constantinus I là vua La Mã đầu tiên cải đạo sang Ki-tô giáo và là người đã ban bố Sắc lệnh Milano chấm dứt thảm sát tín đồ Ki-tô giáo trong toàn đế quốc",
  "Constantinus I là con của vua Constantius Chlorus, đã lên kế vị tại York (nước Anh ngày nay) sau khi phụ hoàng chết năm 306. Ông là nhà lãnh đạo đầu tiên trong lịch sử phương Tây thực hiện chính sách tự do tôn giáo; nhưng trên thực tế, Constantinus không phải là một tín đồ Kitô giáo và sử dụng hình ảnh của Chúa trong việc đánh bại các phe đối lập trong nước và củng cố quyền lực của mình. Lịch phụng vụ nghi lễ Byzantium, được Giáo hội Chính thống giáo Đông phương và các giáo hội Công giáo Đông phương tuân giữ, liệt kê cả Constantinus I và mẹ của ông là Helena là hai vị Thánh. Mặc dù không được kể vào danh sách các vị Thánh của Giáo hội Công giáo Latinh (Tây phương) nhưng Constantinus I vẫn được họ kính trọng với danh hiệu \"Đại Đế\" vì những đóng góp của ông cho Kitô giáo. Nhiều giáo dân Ki-tô coi Constantinus I cùng với Chúa Giêsu và Thánh Phaolô là 3 nhân vật quan trọng nhất trong quá trình thành lập và phát triển của giáo hội Ki-tô giáo.",
  "Về đối ngoại, triều đại Constantinus chứng kiến nhiều cuộc chiến tranh giữa La Mã với các man tộc phía bắc. Constantinus đã đánh bại các bộ tộc Frank, Sarmatia và Goth và ép nhiều người thuộc các sắc dân này gia nhập quân đội La Mã. Năm 324, Constantinus I tuyên bố đổi tên thành phố Byzantium thành Tân La Mã (Nova Roma) và vào 11 tháng 5 năm 330 ông chính thức dời đô về Nova Roma. Sau khi Constantinus chết năm 337, chính phủ La Mã đã đổi tên thủ đô mới thành Constantinopolis, có nghĩa là Thành phố của Constantinus. Thành Constantinopolis vẫn là thủ đô của Đế quốc Đông La Mã trên hơn một ngàn năm, chỉ bị ngắt quãng tạm thời bởi sự đốt phá và chiếm đóng của quân Thập tự chinh lần thứ tư năm 1204, cho đến khi rơi vào người Thổ Nhĩ Kỳ năm 1453. Mặc dù là một hoàng đế có công tích lừng lẫy, Constantinus đã bị nhiều người thời hậu cổ đại và cận đại (trong đó có cả cháu ông là vua Julianus sau này) phê phán như một hôn quân bạo chúa, đã gây nhiều tai họa đối với thần dân và ích kỷ chỉ theo đuổi lợi ích riêng của mình.",
]
sections = [
  { "title" = "Cuộc đời", "paragraphs" = [
      "Flavius Valerius Aurelius Constantinus được sinh ra ở Naissus (nay là Niš, Serbia) ở tỉnh Moesia Superior vào 27 tháng 2 khoảng 280. Cha của ông là Flavius Constantius, một cư dân bản địa của Moesia (sau này là Dacia Ripensis). Constantinus có thể đã dành ít thời gian với cha mình. Constantius đã là một sĩ quan trong quân đội La Mã vào năm 272, thành viên trong lực lượng cận vệ hoàng gia của Hoàng đế Aurelianus. Constantius đã thăng tiến qua nhiều cấp bậc, ông ta đã nhận được chức Thống đốc Dalmatia dưới triều đại Hoàng đế Diocletianus, một người đồng hương khác của Aurelianus từ Illyricum, vào năm 284 hoặc 285. Mẹ ông là Helena. Helena, người có ảnh hưởng to lớn xuyên suốt cuộc đời của con trai, xuất thân từ một gia đình khiêm tốn; Ambrose viết rằng bà làm việc trong một quán rượu.",
      "Trong năm 285, Diocletianus đã tuyên bố Maximianus, một đồng nghiệp đến từ Illyricum, là đồng hoàng đế của ông ta. Mỗi hoàng đế sẽ có triều đình riêng của mình, quân đội và bộ máy hành chính riêng, và mỗi người sẽ cai trị cùng với một praetorian prefect riêng biệt. Maximianus cai trị ở phía Tây, từ kinh đô của ông ta tại Mediolanum (Milan, Italy) hoặc Augusta Treverorum (Trier, Đức), trong khi Diocletianus cai trị ở phía Đông, từ Nicomedia (İzmit, Thổ Nhĩ Kỳ). Việc phân chia chỉ đơn thuần là sự thực dụng: Đế quốc vẫn được coi là \"không hề chia tách\" trong những bài văn ca ngợi chính thức, và cả hai vị hoàng đế có thể tự do di chuyển khắp đế quốc Năm 288, Maximianus bổ nhiệm Constantius vào chức vụ praetorian prefect của ông ta ở Gaul. Constantius sau đó bỏ vợ vào khoảng năm 288 hoặc 289 để thành hôn với Flavia Maximiana Theodora, con gái riêng của Hoàng đế Tây La Mã Maximian, mặc dù vậy Constantinus đã tái lập mẹ ông, bà Helena, như là \"Augusta, mẹ của Caesar\" sau khi cha ông qua đời. Theodora cho ra đời sáu người anh em kế của Constantine, trong đó có cả Julius Constantius.",
      "Cậu bé Constantinus được giáo dục tốt, trở thành người nói thông thạo tiếng Hy Lạp, và rất am hiểu về triết học. Ông phục vụ trong triều đình của Diocletianus ở Nicomedia, sau khi cha ông được phong như là một trong hai caesares (hoàng đế trẻ) của Tứ đầu chế năm 293. Năm 305, cả augusti (hoàng đế cả), Diocletianus và Maximianus, thoái vị, và Constantius lên nối ngôi Maximianus với vai trò là Augustus phía tây. Mặc dù con trai hợp pháp của hai hoàng đế là có ở đó (Constantinus và Maxentius, con của Maximianus), cả hai đều không được để ý tới trong quá trình chuyển giao quyền lực. Thay vào đó, Severus và Maximinus Daia được phong hai vị caesar. Bởi vì Diocletianus không hoàn toàn tin tưởng Constantius - không ai trong số các Tetrarch hoàn toàn tin cậy các đồng nghiệp của họ - Constantinus đã giữ vai trò như là của một con tin, một công cụ để đảm bảo cho một thái độ tốt nhất của Constantius. Constantinus dù sao cũng là thành viên nổi bật của triều đình: ông đã chiến đấu cho Diocletianus và Galerius ở châu Á, ông cũng đã tham gia chiến dịch chống lại người rợ ở phía bên kia sông Danube vào năm 296, và chiến đấu với người Ba Tư dưới trướng Diocletianus ở Syria (297) và dưới quyền Galerius ở vùng Lưỡng Hà (năm 298-99)",
    ] },
  { "title" = "Constantinus I và Công giáo", "paragraphs" = [
      "Constantinus I có lẽ được biết đến nhiều nhất như là Hoàng đế đầu tiên theo Công giáo của Đế quốc La Mã. Triều đại của ông là một bước ngoặt lịch sử của Kitô giáo. Vào năm 313, Constantinus I công bố chấp nhận Công giáo trong Sắc chỉ Milanô, bãi bỏ những trừng phạt đối với những người theo Công giáo (mà vì vậy nhiều người đã tử vì đạo trong các cuộc thảm sát người theo Công giáo trước đây và trả lại các tài sản đã bị tịch thu của Giáo hội. Tuy một sắc lệnh tương tự đã được ban hành vào năm 311 bởi Galerius, lúc đó là hoàng đế cả của Tứ đầu chế (Tetrarchy), triều đại lâu dài của Constantinus, sự cải đạo của ông, và sự bảo trợ Giáo hội của ông đã thiết lập lại vị thế mới của Công giáo trong toàn đế quốc.",
      "Các học giả vẫn còn tranh cãi liệu là Constantinus đã chuyển theo Công giáo thời trẻ theo mẹ ông là bà Helena, hay là ông chuyển dần sang Kitô giáo trong suốt cuộc đời. Constantinus trên 40 tuổi khi cuối cùng ông tuyên bố rằng mình theo Kitô giáo. Khi viết cho những người Kitô giáo, Constantinus nói rõ là ông tin là những sự thành công của ông là do sự bảo vệ của Thiên Chúa vĩ đại của Kitô giáo. Trong suốt triều đại của ông, Constantinus đã bảo trợ Giáo hội về mặt tài chính, xây dựng nhiều vương cung thánh đường khác nhau, ban những đặc quyền (như miễn một số thuế), thăng chức những người Kitô giáo tới những chức vụ cao, và trả lại những tài sản tịch thu trong Đại thảm sát thời Diocletian. Những công trình nổi tiếng của ông bao gồm Nhà thờ Mộ Thánh và Vương cung thánh đường Thánh Phêrô (nhà thờ cũ).",
      "Triều đại của Constantinus đã thiết lập một tiền lệ cho một vị trí Giáo hoàng trong Giáo hội Công giáo; Constantinus tự cho mình có trách nhiệm với Thiên Chúa về sức khỏe ở mặt tâm linh của thần dân của ông ta, và do đó ông có trách nhiệm duy trì sự chính thống. Đối với Constantinus, hoàng đế không quyết định ra giáo lý - đó là trách nhiệm của các giám mục - mà đúng hơn vai trò của ông là bảo vệ giáo lý, diệt bỏ những điều dị giáo, và ủng hộ một sự thống nhất về các vấn đề tôn giáo. Hoàng đế đảm bảo rằng Thiên Chúa được tôn thờ đúng cách trong đế quốc của ông; và tôn thờ thế nào là đúng đắn là do Giáo hội quyết định.",
    ] },
  { "title" = "Constantinus và người Do Thái", "paragraphs" = [
      "Constantinus đã ban hành một số đạo luật có liên quan tới người Do Thái: họ bị cấm không được sở hữu nô lệ theo Kitô giáo và không được cắt bì nô lệ của họ. Chuyển đạo từ Kitô giáo sang Do Thái giáo bị cấm. Hội họp nghi lễ tôn giáo bị giới hạn, nhưng người Do Thái được phép vào Jerusalem vào dịp Tisha B'Av, Tưởng niệm ngày Đền thờ ở Jerusalem bị phá hủy. Constantinus cũng thực thi nghị quyết của Công đồng Nicaea cấm kỷ niệm Lễ Tiệc ly vào ngày Lễ Vượt qua của người Do Thái (ngày 14 tháng Nisan) (xem thêm Quartodecimanism và tranh cãi lễ Phục sinh.",
    ] },
  { "title" = "Các cải cách", "paragraphs" = [
      "Các đồng xu cho đúc bởi các hoàng đế thường cho thấy các chi tiết về các hình tượng cá nhân của họ. Trong phần đầu của triều Constantinus, các biểu tượng đầu tiên của Mars (thần chiến tranh) và sau đó (từ 310) là Apollo như là thần Mặt trời luôn luôn xuất hiện trên mặt trái của đồng xu. Mars đã là biểu tượng của Tứ đầu chế (Tetrarchy), và Constantinus sử dụng biểu tượng này để nhấn mạnh sự hợp pháp của quyền lực của ông. Sau khi phá vỡ liên minh với bạn cũ của cha ông là Maximian năm 309–310, Constantine bắt đầu tuyên bố sự truyền ngôi là hợp pháp từ vị Hoàng đế thế kỉ thứ 3 là Marcus Aurelius Claudius Gothicus (Claudius II), người anh hùng chiến thắng của Trận đánh Naissus (Tháng 9, 268).",
      "Gothicus đã tuyên bố về sự bảo vệ linh thiêng của Apollo-Sol Invictus (Thần Mặt trời). Constantinus cũng tuyên bố liên minh với Sol Invictus, là vị thần linh cuối cùng xuất hiện trên các đồng xu của ông ta. Mặt trái của những đồng xu thời ông liên tục trong nhiều năm là \"người bạn, Mặt trời không thể bị chinh phục\" của ông — dòng chú thích là SOLI INVICTO COMITI.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Constanstinus I là người đã góp phần Kitô giáo trở thành tôn giáo lớn nhất của nền văn minh phương Tây trong nhiều thế kỷ. Ngoài ra, việc Constantinus dời đô về Constantinopolis cũng giúp duy trì sự tồn tại của đế quốc La Mã thêm hàng nghìn năm nữa. Mặc dù ông được các gán danh hiệu \"Đại đế\" là vì lòng mộ đạo của ông đối với Ki-tô giáo, Constantinus cũng là 1 chỉ huy quân sự tài ba. Không chỉ thống nhất đế quốc dưới sự cai trị của 1 vị vua duy nhất, Constantinus đã đánh bại người Frank và người Alamanni trong những trận đánh đẫm máu vào các năm 306 – 308, người Frank một lần nữa vào các năm 313 – 314, người Tervingian Goth vào năm 332 và người Sarmatia năm 334. Bằng những chiến thắng này, Constantinus đã thu hồi hầu hết các tỉnh đã bị mất từ lâu như Dacia, Hoàng đế Aurelianus đã bị buộc phải bỏ tỉnh này năm 271. Vào thời gian ông qua đời, ông đang chuẩn bị tiến hành một xâm lược Ba Tư để trả đũa các cuộc cướp phá của họ vào lãnh thổ phía đông La Mã.",
      "Trên phương diện văn hóa, Constantinus đã có nhiều đóng góp cho sự hồi sinh của phong tục cạo râu của các nguyên thủ La Mã từ thời Augustus đến Traianus. Phong tục này đã được đại tướng Scipio Africanus khởi xướng từ trước Tây lịch, và sau khi Constantinus chết, nó tiếp tục tồn tại cho tới thời kỳ Phocas cai trị Đông La Mã.",
      "Bên cạnh đó, Constantinus đã bị cháu là hoàng đế-triết gia Julianus chỉ trích kịch liệt. Julianus coi Constantinus I là một tên hôn quân vô độ, và điều này dẫn đến tranh cãi về ông ngay từ thời Hậu Cổ đại. Nhà sử học Đa thần giáp Zosimus coi Constantinus là 1 kẻ có tội với sự tồn tại và phát triển của La Mã, là tác nhân khiến đế quốc Tây La Mã sụp đổ. Tuy nhiên, học giả Kitô giáo như Lactantius và Eusebius đã tán thưởng Constantinus I là người bảo vệ của toàn nhân loại, do Chúa phái xuống trần gian. Trong suốt thời kỳ Trung Cổ, ông vẫn luôn được ca ngợi theo luận điểm ấy. Đế quốc Đông La Mã đã xem Constantinus I là vị vua khai quốc và Đế quốc La-Đức cũng xem ông là một trong những bậc tiền bối đáng tôn kính. Tại Đông La Mã, các hoàng đế kế nghiệp Constantinus luôn mong muốn và tỏ ra vinh dự khi được tôn xưng là \"Constantinus mới\". Có 10 hoàng đế Đông La Mã, kể cả vị hoàng đế cuối cùng, đã lấy đế hiệu là Constantinus. Hầu hết các giáo hội Kitô giáo Đông phương đều xem Constantinus là một vị thánh. Ở phía đông đôi khi ông được gọi là \"Ngang với thánh tông đồ\" (isapostolos) hay là \"thánh tông đồ thứ 13\" Lưu trữ ngày 27 tháng 9 năm 2007 tại Wayback Machine.",
    ] },
]

[articles.id]
text = "Konstantinus Agung (bahasa Latin: Flavius Valerius Aurelius Constantinus Augustus; bahasa Yunani Koine: Κωνσταντῖνος ὁ Μέγας, Konstantinos ho Megas; 27 Februari ca 272 M – 22 Mei 337 M), juga dikenal sebagai Konstantinus I atau Santo Konstantinus (dalam Gereja Ortodoks sebagai Santo Konstantinus Agung, Setara Rasul), merupakan seorang Kaisar Romawi dari tahun 306 sampai 337 M. Konstantinus adalah putra dari Flavius Valerius Konstantius, seorang perwira tentara Romawi, dan Helena istrinya."
title = "Konstantinus Agung"
lang = "id"
url = "https://id.wikipedia.org/wiki/Konstantinus_Agung"
intro = [
  "Konstantinus Agung (bahasa Latin: Flavius Valerius Aurelius Constantinus Augustus; bahasa Yunani Koine: Κωνσταντῖνος ὁ Μέγας, Konstantinos ho Megas; 27 Februari ca 272 M – 22 Mei 337 M), juga dikenal sebagai Konstantinus I atau Santo Konstantinus (dalam Gereja Ortodoks sebagai Santo Konstantinus Agung, Setara Rasul), merupakan seorang Kaisar Romawi dari tahun 306 sampai 337 M. Konstantinus adalah putra dari Flavius Valerius Konstantius, seorang perwira tentara Romawi, dan Helena istrinya. Ayahnya menjadi Caesar, wakil kaisar, di barat pada tahun 293 M. Konstantinus diutus ke timur, di mana ia menapaki pangkat-pangkatnya hingga menjadi seorang tribun militer di bawah Kaisar Diokletianus dan Galerius. Pada tahun 305 Konstantius meraih pangkat Augustus, kaisar barat senior, dan Konstantinus dipanggil ke barat untuk membantu ayahnya melangsungkan kampanye di Britania. Dengan pengakuan sebagai kaisar oleh pasukannya di Eboracum (York masa kini) setelah ayahnya meninggal dunia pada tahun 306 M, Konstantinus meraih kemenangan dalam serangkaian perang saudara melawan Kaisar Maxentius dan Lisinius hingga ia menjadi penguasa tunggal di barat maupun timur pada tahun 324 M.",
  "Sebagai kaisar, Konstantinus melakukan banyak reformasi di bidang administrasi, keuangan, sosial, dan militer untuk memperkuat kekaisaran. Pemerintahan direstrukturisasi, serta dilakukan pemisahan kewenangan sipil dan militer. Koin emas baru, yakni solidus, dikeluarkan untuk mengatasi inflasi. Ini menjadi standar mata uang Bizantin dan Eropa selama lebih dari seribu tahun. Sebagai kaisar Romawi pertama yang mengaku melakukan konversi ke Kekristenan, Konstantinus memainkan suatu peranan penting dalam mendeklarasikan Maklumat Milan pada tahun 313, yang menetapkan toleransi bagi Kekristenan di dalam kekaisaran. Ia menghimpun Konsili Nicea Pertama pada tahun 325; pada saat itu kaum Kristiani menyatakan pengakuan iman mereka melalui Kredo Nicea. Dalam bidang militer, tentara Romawi direorganisasi sehingga terdiri dari unit lapangan yang mobil dan tentara garnisun yang mampu menghadapi ancaman internal dan invasi kaum barbar. Konstantinus melakukan kampanye-kampanye militer yang sukses terhadap suku-suku di perbatasan Romawi—suku Franka, Alemanni, Goth, dan Sarmatia—bahkan memukimkan kembali wilayah-wilayah yang ditinggalkan oleh para pendahulunya selama gejolak pada abad sebelumnya.",
  "Masa pemerintahan Konstantinus menandai suatu zaman yang berbeda dalam sejarah Kekaisaran Romawi. Ia membangun kediaman kekaisaran yang baru di Bizantium dan mengganti nama kota itu menjadi Konstantinopel (Kota Konstantinus) menurut namanya sendiri (julukan \"Roma Baru\" yang bersifat pujian baru timbul belakangan, dan tidak pernah menjadi julukan resmi). Kota ini nantinya menjadi ibu kota Kekaisaran selama lebih dari seribu tahun, dan karenanya Kekaisaran Timur yang terbentuk kelak menjadi dikenal sebagai Kekaisaran Bizantin. Warisan politiknya yang lebih berdampak langsung yaitu, ketika meninggalkan kekaisaran untuk para putranya, ia menggantikan sistem tetrarki Diokletianus dengan prinsip suksesi dinasti. Reputasinya berkembang selama masa pemerintahan anak-anaknya dan berabad-abad setelah pemerintahannya. Gereja abad pertengahan mempertahankannya sebagai salah seorang teladan kebajikan, sementara para penguasa sekuler merujuknya sebagai suatu prototipe, titik acuan, serta simbol identitas dan legitimasi kekaisaran. Mulai dari Masa Renaisans, timbul penilaian-penilaian yang lebih kritis atas pemerintahannya karena ditemukannya kembali sumber-sumber anti-Konstantinian. Para kritikus menggambarkannya sebagai seorang tiran. Tren dalam keilmuan modern dan baru-baru ini berupaya untuk menyeimbangkan kedua sisi ekstrem keilmuan sebelumnya.",
  "Konstantinus merupakan seorang tokoh penting dalam sejarah Kekristenan. Gereja Makam Kudus, yang dibangun atas perintahnya di lokasi yang diklaim sebagai makam Yesus di Yerusalem, menjadi tempat tersuci dalam dunia Kristiani. Klaim Kepausan atas kekuasaan temporal pada Abad Pertengahan Tinggi didasarkan pada sebuah dokumen yang disebut Donasi Konstantinus. Konstantinus Agung dihormati sebagai orang kudus (santo) oleh kalangan Ortodoks Timur, Katolik Bizantin, dan Anglikan.",
]
sections = [
  { "title" = "Sumber-sumber", "paragraphs" = [
      "Konstantinus adalah salah seorang penguasa besar yang penting dalam sejarah, dan ia senantiasa menjadi salah seorang tokoh yang kontroversial. Naik turunnya reputasi Konstantinus mencerminkan sifat dari sumber-sumber kuno seputar pemerintahannya. Sumber-sumber ini sangat banyak tersedia dan terperinci, tetapi sangat dipengaruhi oleh propaganda resmi periode tersebut, dan sering kali hanya sepihak. Tidak terdapat cerita sejarah ataupun biografi yang masih terlestarikan hingga sekarang berkenaan dengan pemerintahan dan kehidupan Konstantinus. Sumber pengganti yang terdekat adalah Vita Constantini karya Eusebius dari Kaisarea, suatu karya yang merupakan paduan dari eulogi dan hagiografi. Ditulis antara tahun 335 M dan ca 339 M, Vita meninggikan kebajikan religius dan moral dari Konstantinus. Vita menciptakan suatu citra positif Konstantinus yang menimbulkan perdebatan, dan para sejarawan modern sering kali menantang keandalannya. Seluruh kehidupan sekuler Konstantinus dikisahkan dalam sebuah karya anonim berjudul Origo Constantini. Sebagai sebuah karya yang tidak jelas tarikhnya, Origo berfokus pada peristiwa-peristiwa militer dan politik, mengabaikan hal-hal religius dan kultural.",
      "De Mortibus Persecutorum karya Laktansius, sebuah pamflet politis Kristiani pada masa pemerintahan Diokletianus dan periode Tetrarki, menyajikan informasi berharga namun terdapat rincian tendesius mengenai para pendahulu dan masa muda Konstantinus. Sejarah-sejarah gerejawi dari Sokrates, Sozomen, dan Teodoretus mendeskripsikan perselisihan keagamaan pada masa akhir pemerintahan Konstantinus. Karya-karya para sejarawan gerejawi itu ditulis pada masa pemerintahan Teodosius II (408–50 M), seabad setelah pemerintahan Konstantinus, serta dianggap mengaburkan peristiwa-peristiwa dan teologi-teologi pada zaman Konstantinus melalui penyimpangan, kekeliruan, dan ketidakjelasan yang disengaja. Tulisan-tulisan kontemporer dari dari seorang Kristiani ortodoks bernama Athanasius dan sejarah gerejawi dari seorang Arian bernama Filostorgius juga masih terlestarikan hingga saat ini, kendati terdapat bias yang tidak kalah tegasnya.",
      "Berbagai epitome dari Aurelius Victor (De Caesaribus), Eutropius (Breviarium), Festus (Breviarium), dan penulis anonim Epitome de Caesaribus menyajikan sejarah militer dan politik sekuler yang dipadatkan dari periode tersebut. Meskipun bukan sumber Kristiani, epitome-epitome itu melukiskan suatu citra baik Konstantinus, tetapi tidak mengandung referensi seputar kebijakan-kebijakan keagamaan Konstantinus. Panegyrici Latini, suatu kumpulan panegirik dari akhir abad ke-3 dan awal abad ke-4, menyajikan informasi berharga mengenai politik dan ideologi pada periode tetrarki dan masa muda Konstantinus. Arsitektur kontemporer, seperti Pelengkung Konstantinus di Roma dan istana-istana di Gamzigrad dan Kordoba, peninggalan epigrafi, dan uang logam dari era tersebut melengkapi sumber-sumber literer yang tersedia.",
    ] },
  { "title" = "Masa muda", "paragraphs" = [
      "Flavius Valerius Konstantinus, nama aslinya, dilahirkan di kota Naissus (sekarang Niš, Serbia), bagian dari Provinsi Dardania di Moesia pada tanggal 27 Februari, mungkin ca 272 M. Ayahnya adalah Flavius Konstantius, orang Iliria, dan asli dari Provinsi Dardania di Moesia (Dacia Ripensis kelak). Konstantinus kemungkinan hanya menghabiskan sedikit waktu dengan ayahnya, yang adalah seorang perwira tentara Romawi dan termasuk salah seorang pengawal imperial Kaisar Aurelianus. Sang ayah, Konstantius, digambarkan sebagai seorang yang toleran dan memiliki ketrampilan berpolitik, yang menapaki kariernya tahap demi tahap, dijadikan gubernur Dalmatia oleh Kaisar Diokletianus, salah seorang kolega Aurelianus dari Ilirikum, pada tahun 284 atau 285. Ibu Konstantinus adalah Helena, kemungkinan seorang Bitinia dengan status sosial rendah. Tidak dapat dipastikan apakah ia menikah secara sah dengan Konstantius, atau hanya menjadi selirnya. Tidak ada kejelasan apakah Konstantinus dapat berbicara bahasa Trakia, bahasa utamanya adalah Latin dan ia membutuhkan penerjemah Yunani saat berpidato di hadapan publik.",
      "Pada bulan Juli 285 M, Diokletianus mendeklarasikan Maximianus, koleganya yang lain dari Ilirikum, sebagai rekan-kaisar. Masing-masing kaisar memiliki istana sendiri, kekuasaan administratif serta militer tersendiri, dan masing-masing memerintah dengan prefek praetoria terpisah sebagai deputi kepala. Maximianus memerintah di Barat, dari ibu kotanya di Mediolanum (Milan, Italia) atau Augusta Treverorum (Trier, Jerman), sementara Diokletianus memerintah di Timur, dari Nikomedia (İzmit, Turki). Pembagian ini dianggap pragmatis: Kekaisaran disebut \"tak terbagi\" dalam panegirik resmi, dan kedua kaisar dapat bergerak dengan bebas di seluruh Kekaisaran. Pada tahun 288, Maximianus menunjuk Konstantius sebagai prefek praetorianya di Galia. Konstantius meninggalkan Helena untuk menikahi Teodora, anak tiri Maximianus, pada tahun 288 atau 289.",
      "Diokletianus kembali membagi Kekaisaran pada tahun 293 M, menunjuk dua Caesar (kaisar junior) untuk memerintah atas wilayah pembagian lanjutan di Timur dan Barat. Keduanya berada di bawah Augustus (kaisar senior) masing-masing, tetapi mereka dapat bertindak dengan otoritas tertinggi dalam wilayah kekuasaan masing-masing. Sistem ini kelak disebut Tetrarki. Penunjukkan pertama Diokletianus untuk jabatan Caesar adalah Konstantius; penunjukkan kedua adalah Galerius, yang berasal dari Felix Romuliana. Menurut Laktansius, Galerius adalah seorang yang brutal dan bersifat kebinatangan. Kendati sama-sama menganut paganisme dari aristokrasi Roma, ia dipandang oleh mereka sebagai seorang sosok asing, seorang semibarbar. Pada tanggal 1 Maret, Konstantius dipromosikan ke jabatan Caesar, dikirim ke Galia untuk memerangi pemberontakan Karausius dan Alektus. Kendati terdapat implikasi meritokratis, Tetrarki tersebut mempertahankan peninggalan dari hak istimewa keturunan, dan Konstantinus segera menjadi kandidat utama Caesar pada masa mendatang setelah ayahnya mendapatkan posisi tersebut. Konstantinus mendiami istana Diokletianus, tempat ia hidup sebagai pewaris ayahnya sebagaimana dihipotesiskan.",
    ] },
  { "title" = "Pemerintahan awal", "paragraphs" = [
      "Bagian wilayah Kekaisaran yang menjadi kekuasaan Konstantinus meliputi Britania, Galia, dan Spanyol. Dengan demikian ia memimpin salah satu pasukan terbesar Romawi, yang menempati perbatasan penting Rhein. Setelah promosinya menjadi kaisar, Konstantinus tetap di Britania, mengusir kembali suku Pict dan mengamankan kendalinya di keuskupan-keuskupan sipil bagian barat laut. Ia menyelesaikan rekonstruksi pangkalan-pangkalan militer yang dimulai sejak pemerintahan ayahnya, dan memerintahkan perbaikan jalan raya di kawasan itu. Ia segera berangkat menuju Augusta Treverorum (Trier) di Galia, ibu kota Tetrarki di Kekaisaran Romawi bagian barat laut. Suku Franka, setelah mengetahui aklamasi Konstantinus, menginvasi Galia di hilir Sungai Rhein selama musim dingin tahun 306–307 M. Konstantinus mengusir mereka kembali ke luar Rhein dan menangkap dua raja mereka, Ascaric dan Merogaisus. Kedua raja dan tentara mereka dijadikan mangsa hewan-hewan di amfiteater Trier dalam perayaan-perayaan adventus (kedatangan) yang mengiringinya.",
      "Konstantinus memulai perluasan Trier. Ia memperkuat dinding yang mengelilingi kota dengan menara-menara militer dan gerbang-gerbang berkubu, serta mulai membangun kompleks istana di bagian timur laut kota. Di sisi selatan istananya, ia memerintahkan pembangunan sebuah balairung formal yang besar, dan sebuah pemandian imperial yang sangat besar. Konstantinus memprakarsai banyak proyek bangunan di seluruh Galia selama masa jabatannya sebagai kaisar Barat, khususnya di Augustodunum (Autun) dan Arelate (Arles). Menurut Laktansius, Konstantinus mengikuti jejak ayahnya dalam hal kebijakan toleransi terhadap Kekristenan. Meskipun belum menjadi seorang penganut Kristiani, ia mungkin pada saat itu menilainya sebagai kebijakan yang lebih bijaksana daripada penganiayaan secara terbuka, dan sebagai salah satu cara untuk membedakan dirinya dari sang \"penganiaya besar\", Galerius. Konstantinus secara resmi memutuskan diakhirinya penganiayaan, dan mengembalikan segala milik penganut Kristiani yang telah hilang selama masa penganiayaan.",
      "Karena Konstantinus umumnya masih belum teruji dan memiliki suatu jejak ilegitimasi, ia mengandalkan reputasi ayahnya dalam propaganda awalnya: berbagai panegirik tertua mengenai Konstantinus memuat perbuatan-perbuatan ayahnya sebanyak perbuatan-perbuatan Konstantinus sendiri. Proyek-proyek bangunan dan keterampilan militer Konstantinus segera memberikan sang panegiris kesempatan untuk berkomentar positif mengenai kesamaan antara ayah dan putranya. Eusebius mengatakan bahwa Konstantinus adalah suatu \"pembaruan dari kehidupan dan pemerintahan ayahnya, seakan-akan di dalam pribadinya sendiri\". Oratoria, patung, dan uang logam Konstantinian juga menunjukkan suatu kecenderungan baru yang merendahkan \"bangsa barbar\" d luar perbatasan. Setelah kemenangan Konstantinus atas suku Alemanni, ia mencetak koin yang menggambarkan suku Alemanni sedang meratap dan memohon—\"Suku Alemanni takluk\"—di bawah frasa \"Kegembiraan bangsa Romawi\". Hanya ada sedikit simpati bagi musuh-musuh itu. Panegirisnya menyatakan: \"Adalah suatu ampunan yang bodoh jika menyayangkan musuh yang ditaklukkan.\"",
    ] },
  { "title" = "Perang saudara", "paragraphs" = [
      "Pada pertengahan tahun 310 M, penyakit yang diderita Galerius membuatnya tidak dapat lagi melibatkan diri dalam politik imperial. Catatan mengenai tindakan terakhirnya masih terlestarikan: sebuah surat kepada para pimpinan provinsi yang diberikan di Nikomedia pada tanggal 30 April 311 M, menyatakan akhir dari masa penganiayaan, dan dimulainya kembali toleransi keagamaan. Ia wafat tidak lama setelah proklamasi maklumat tersebut, menyingkirkan sedikit isu yang masih tersisa dalam Tetrarki. Maximinus melakukan mobilisasi untuk melawan Lisinius, dan merebut Asia Kecil. Suatu perdamaian yang tergesa-gesa ditandatangani di atas sebuah perahu di tengah Selat Bosporus. Sementara Konstantinus berkeliling mengunjungi Britania dan Galia, Maxentius bersiap untuk perang. Ia membentengi Italia utara, dan memperkuat dukungannya dalam komunitas Kristiani dengan mengizinkan mereka memilih Uskup Roma yang baru, Paus Eusebius.",
      "Kekuasaan Maxentius bagaimanapun tetap tidak aman. Dukungan awalnya menghilang di tengah tarif pajak yang tinggi dan kelesuan perdagangan; terjadi kerusuhan di Roma dan Kartago; dan Domitius Aleksander berhasil merebut kekuasaannya untuk sementara waktu di Afrika. Pada tahun 312 M, ia adalah orang yang nyaris tidak toleran, bukan orang yang didukung secara aktif, bahkan di antara warga Italia penganut Kekristenan. Pada musim panas tahun 311 M, Maxentius melakukan mobilisasi untuk melawan Konstantinus ketika Lisinius terlibat dalam urusan-urusan penting di Timur. Ia menyatakan perang terhadap Konstantinus, bersumpah untuk membalas \"pembunuhan\" ayahnya. Demi mencegah Maxentius menjalin aliansi dengan Lisinius untuk melawannya, Konstantinus membentuk sendiri aliansinya dengan Lisinius saat musim dingin tahun 311–312 M, dan menawarkan Konstantia saudarinya untuk dinikahi. Maximinus menganggap kesepakatan Konstantinus dengan Lisinius sebagai suatu penghinaan terhadap otoritasnya. Sebagai tanggapan, ia mengirim utusan ke Roma, menawarkan pengakuan politik kepada Maxentius dengan imbalan dukungan militer. Maxentius menerimanya. Menurut Eusebius, perjalanan antar daerah menjadi tidak memungkinkan, dan terjadi penumpukan militer di mana-mana. Tidak ada \"tempat di mana orang tidak mengharapkan terjadinya permusuhan setiap hari\".",
      "Para jenderal dan penasihat Konstantinus memperingatkan untuk tidak melangsungkan serangan pendahuluan terhadap Maxentius; bahkan para peramalnya menyarankan hal serupa, dengan menyatakan bahwa pengurbanan-pengurbanan telah menghasilkan pertanda kurang baik. Konstantinus, dengan semangat yang meninggalkan suatu kesan mendalam pada para pengikutnya, menginspirasi beberapa dari mereka untuk percaya bahwa ia mendapat sejumlah petunjuk supranatural, untuk mengabaikan semua peringatan ini. Pada awal musim semi tahun 312 M, Konstantinus menyeberangi Pegunungan Alpen Kottian dengan seperempat pasukannya yang berjumlah sekitar 40.000. Kota pertama yang ditemui pasukannya adalah Segusium (Susa, Italia), suatu kota dengan pertahanan kuat yang menutup pintu gerbangnya bagi dia. Konstantinus memerintahkan tentaranya untuk membakar pintu gerbang itu dan memanjat temboknya. Ia merebut kota tersebut dalam waktu singkat. Konstantinus memerintahkan pasukannya untuk tidak menjarah kota, dan melanjutkan perjalanan bersama mereka menuju Italia utara.",
    ] },
]

[articles.tl]
text = "Si Caesar Flavius Valerius Aurelius Constantinus Augustus (27 Pebrero c. 272 – 22 Mayo 337), karaniwang kilala bilang Constantino I, Dakilang Constantino, Constantino ang Dakila, o (sa Silanganing Simbahang Ortodokso, Koptikong Ortodoksong Simbahan ng Alehandriya, Ortodoksiyang Oriental at Simbahang Katoliko mga Kristiyano) San Constantino, ay gumanap na Emperador Romano mula 306 AD, at siyang walang kumalabang tagapaghawak ng tanggapan mula 324 hanggang kanyang kamatayan noong 337 AD."
title = "Dakilang Constantino"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Dakilang_Constantino"
intro = [
  "Si Caesar Flavius Valerius Aurelius Constantinus Augustus (27 Pebrero c. 272 – 22 Mayo 337), karaniwang kilala bilang Constantino I, Dakilang Constantino, Constantino ang Dakila, o (sa Silanganing Simbahang Ortodokso, Koptikong Ortodoksong Simbahan ng Alehandriya, Ortodoksiyang Oriental at Simbahang Katoliko mga Kristiyano) San Constantino, ay gumanap na Emperador Romano mula 306 AD, at siyang walang kumalabang tagapaghawak ng tanggapan mula 324 hanggang kanyang kamatayan noong 337 AD. Kilalang-kilala dahil sa kanyang pagiging unang Kristiyanong Romanong emperador, binaligtad o tinanggal ni Constantino I ang mga pag-uusig na isinagawa ng kanyang pinalitang emperador na si Diocleciano, at naglabas ng (kapanalig ang kanyang kasamang emperador din na si Licinius) ang Edikto ng Milano noong 313, na nagpahayag at nagdeklara ng tolerasyon ng relihiyon sa kabuoan ng imperyo.",
  "Nakatala sina Constantino I at ang kanyang inang si Helena ng Konstantinople bilang mga santo sa Bisantinong kalendaryong liturhikal, na sinusunod sa ritong Bisantino ng Silanganing Simbahang Ortodokso at ng Silanganing mga Simbahang Katoliko. Bagaman hindi siya kabilang sa talaan ng mga santo ng Simbahang Latin (sa ritong Latin), na kumikilala sa iba pang mga taong may pangalang Constantino bilang mga santo, pinaparangalan si Constantino I sa pamamagitan ng pagdaragdag ng \"Ang Dakila\" sa kanyang pangalan dahil sa kanyang mga ambag sa Kristiyanismo.",
  "Binago rin ni Constantino I ang sinaunang kolonyang Griyego ng Byzantium upang maging isang bago niyang tahanang imperyal, na mananatiling isang kabisera ng Imperyong Bisantino sa loob ng isang libong mga taon. Ang Byzantium ay naging Constantinople o \"Lungsod ni Konstantino\", na ngayo'y Istanbul.",
]
sections = [
  { "title" = "Talambuhay", "paragraphs" = [
      "Si Flavius Valerius Constantinus na orihinal na pangalan ni Constantino I ay ipinanganak sa Naissus sa probinsiyang Dardania ng Moesia sa kasalukuyang panahong Niš, Serbia noong Pebrero 27 sa hindi matiyak na tao na malamang ay malapit sa 272 CE. Ang kanyang ama ay si Flavius Constantius na katutubo ng probinsiyang Dardania na kalaunan ay Dacia Ripensis. Ang kanyang ama ay isang opiser ng hukbong ROmano na bahagi ng mga bantay ng emperador Aurelian. Ang kanyang ama ay naging gobernador ng Dalmatia mula kay Emperador Diocletian na isa pang kasama ni Aurelia mula sa Illyricum, noong 284 o 285. Ang ina ni Constantino ay si Helene na isang babaeng Bithynian na may mababang katayuan sa lipunan. Hindi matiyak kung siya ay legal na ikinasal sa ama ni Constantino I o isa lamang kerida. Noong Hulyo 285, inihayag ni Diocletian si Maximian na isa pang kasama mula sa Illyricum bilang kanyang kapwa-emperador. Ang bawat emperador ay may sarili nilang korte, militar, at mga kagawarang administratibo at mamumuno na may hiwalay na prepektong praetoriano bilang hepeng tenyente. Si Maximian ay namuno sa Kanluran mula sa kanyang mga kabisera sa Mediolanum (Milan, Italya) o Augusta Treverorum (Trier, Alemanya) samantlang si Diocletian ay namuno sa Silangan mula sa Nicomedia (İzmit, Turkey). Ang paghahati ay isa lamang pragmatiko. Ang imperyo ay hindi mahahati sa opsiyal na panegyric at ang parehong emperador ay malayang makagagalaw sa buong imperyo. Noong 288, hinirang ni Maximian si Constantius na kanyang maging perpektong praetorian sa Gaul. Iniwan ni Constantius si Helena upang pakasalan ang anak ng asawa ni Maximianna si Theodora noong 288 o 289. Hinating muli ni Diocletian ang imperyo noong 293 at humirang ng dalawang mga caesar (batang emperador) upang mamuno sa mga karagdagan pang…",
    ] },
  { "title" = "Kristiyanismo", "paragraphs" = [
      "Ayon sa mga manunulat na Kristiyano, nang maging emperador si Dakilang Constantino I ng Kanlurang Imperyo Romano noong 312 CE, kanyang itinuro ang kanyang pagkapanalo sa isang labanan sa diyos ng Kristiyanismo. Inangkin ng mga sangguniang Kristiyano na si Constantino I ay tumingin sa araw bago ang labanan sa tulay na Milvian at nakita ang isang krus ng liwanag sa itaas nito na may mga salitang \"ΕΝ ΤΟΥΤΩ ΝΙΚΑ\" (\"sa pamamagitan nito, sumakop!\"). Iniutos ni Constantino sa kanyang mga hukbo na palamutian ang kanilang mga kalasag ng isang simbolong Kristiyano (Chi Ro) at pagkatapos nito ay nanalo sa labanan.",
      "Pagkatapos ng labanan sa tulay ng Milvian, ang bagong emperador na Constantino I ay hindi pumansin sa mga dambana ng mga diyos na Romano sa Capitolino at hindi rin nagsagawa ng mga handog ayon sa kustombreng Romano upang ipagdiwang ang pagpasok ng pagwawagi sa Roma. Sa halip nito, siya ay tuwirang tumungo sa palasyo ng emperador. Gayunpaman, ang karamihan ng mga maimpluwensiyal na tao sa imperyo Romano lalo na ang mga opisyal ng militar ay hindi nagpaakay sa Kristiyanismo at nanatiling lumalahok sa relihiyon ng Sinaunang Roma. Sa pamumuno ni Constantino I, kanyang sinikap na pahupain ang mga paksiyong ito na hindi Kristiyano. Ang mga salaping Romano na inilimbag hanggang 8 taon pagkatapos ng labanan sa tulay na Milvian ay naglalaman pa rin ng mga imahen ng mga Diyos na Romano. Ang mga monumentong unang kinomisyong itayo ni Constantino I gaya ng Arko ni Constantino ay hindi naglalaman ng anumang reperensiya sa Kristiyanismo. Sa halip, ang mga munting estatwa ng Diyos na Romanong si Sol Invictus na dala dala ng mga tagapagdala ng pamantayan ay lumilitaw sa tatlong lugar sa mga relief ng Arko ni Constantino. Ang mga opisyal na barya ni Constantino I ay patuloy na naglalaman ng mga imahen ni Sol Invictus hanggang noong 325/6 CE.",
      "Kasama ng emperador ng Silangan Imperyo Romano na si Licinius, si Constantino ay naglabas ng Kautusan ng Milan na nag-atas ng pagpayag ng lahat ng mga relihiyon sa imperyo kabilang ang mga tradisyonal na relihiyong Romano at ang Kristiyanismo. Ang kautusang ito ay humigit din sa mas maagang Kautusan ni Galerius noong 311 dahil sa pagbabalik nito ng mga kinumpiskang mga pag-aari ng Simbahang Kristiyano. Gayunpaman, ang atas na ito ay may kaunting epekto sa mga saloobin ng tao. Ang mga bagong batas ay nilikha upang isabatas ang ilan sa mga paniniwala at kasanayang Kristiyano. Ang pinakamalaking epekto sa Kristiyanismo ni Constantino ang kanyang pagtangkilik sa relihiyong ito. Siya ay nagkaloob ng malalaking regalo ng mga lupain at salapi sa simbahan at nag-alok ng mga eksempsiyon sa buwis at iba pang mga legal na katayuan sa mga pag-aari ng simbahan at mga tauhan nito. Ang pinagsamang mga regalong ito at ang mga kalaunan pang regalo ni Constantino sa simbahan ay gumawa sa simbahan na pinakamalaking may ari ng lupain sa Kanluranin noong ikaanim na siglo CE. Ang karamihan sa mga regalong ito ay pinondohan sa pamamagitan ng malalang mga pagbubuwis sa mga kultong pagano. Ang ilang mga kultong pagano ay pinwersang tumigil sa kawalan ng mga pondo. Nang ito ay mangyari, pinalitan ng simbahang Kristiyano ang nakaraang papel ng mga kulto sa pagkalinga sa mga mahihirap ng lipunan. Sa isang repleksiyon ng tumaas na katayuan ng kaparian sa imperyo Romano, ang mga ito ay nagsimulang magsuot ng kasuotan ng mga sambahayan ng mga marharlika.",
    ] },
]

[articles.pt]
text = "Constantino I (Naísso, 27 de fevereiro de 272 – Nicomédia, 22 de maio de 337), conhecido como Constantino, o Grande, foi um imperador romano proclamado Augusto por suas tropas em 25 de julho de 306, passando a governar uma parte cada vez maior do Império Romano até sua morte. É lembrado sobretudo por ter sido o primeiro imperador romano a converter-se ao cristianismo, fato que marcou profundamente o curso da história religiosa, política e cultural do Ocidente e do Oriente cristão."
title = "Constantino"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Constantino"
intro = [
  "Constantino I (Naísso, 27 de fevereiro de 272 – Nicomédia, 22 de maio de 337), conhecido como Constantino, o Grande, foi um imperador romano proclamado Augusto por suas tropas em 25 de julho de 306, passando a governar uma parte cada vez maior do Império Romano até sua morte. É lembrado sobretudo por ter sido o primeiro imperador romano a converter-se ao cristianismo, fato que marcou profundamente o curso da história religiosa, política e cultural do Ocidente e do Oriente cristão.",
  "Durante seu reinado, Constantino envolveu-se em uma série de guerras civis que culminaram na derrota de seus rivais Magêncio e Licínio, consolidando sua autoridade como imperador único. Paralelamente, conduziu campanhas militares bem-sucedidas contra diversos povos considerados bárbaros, entre eles os francos, alamanos, visigodos e sármatas, assegurando as fronteiras do império mesmo após a reconquista da Dácia, região que havia sido abandonada no século anterior. Seu governo caracterizou-se por um esforço de estabilização política e militar em um período de profundas transformações internas.",
  "A conversão de Constantino ao cristianismo, tradicionalmente associada à visão da cruz antes da Batalha da Ponte Mílvia (312), inaugurou uma nova relação entre o Império Romano e a Igreja. Embora seu percurso religioso tenha sido gradual, seu apoio ao cristianismo manifestou-se de modo concreto por meio de leis favoráveis aos cristãos, do fim das perseguições sistemáticas por meio do Édito de Milão (313) e da promoção da unidade da fé, destacando-se a convocação do Concílio de Niceia, em 325, decisivo para a formulação da doutrina cristológica.",
  "Um dos atos mais duradouros de seu reinado foi a fundação de uma nova capital imperial em Bizâncio, à qual deu o nome de Nova Roma. A cidade, contudo, passou a ser conhecida como Constantinopla, em sua homenagem, e tornar-se-ia a capital do Império Romano do Oriente por mais de mil anos. Por esse motivo, Constantino é frequentemente considerado um dos fundadores do mundo bizantino. A cidade, hoje chamada Istambul, permaneceu como centro político e cultural de sucessivos impérios até o século XX.",
]
sections = [
  { "title" = "Fontes", "paragraphs" = [
      "Constantino era um governante de grande importância histórica e sempre foi uma figura controversa. As flutuações na reputação de Constantino refletem a natureza das fontes antigas de seu reinado. Estas são abundantes e detalhadas, mas foram fortemente influenciadas pela propaganda oficial do período, e são muitas vezes unilaterais. Não há histórias de sobreviventes ou biografias que lidaram com a vida de Constantino e do Estado. Os mais próximos subsídios são a Vida de Constantino de Eusébio de Cesareia, uma obra que é uma mistura de elogio e hagiografia. Escrito entre 335 e cerca de 339, a Vita exalta virtudes morais e religiosas de Constantino. A Vita cria uma imagem tendenciosamente positiva de Constantino, de que os historiadores modernos vêm frequentemente contestando a fiabilidade. A mais completa vita secular de Constantino é do anónimo Origo Constantini. Uma obra de data incerta, o Origo concentra-se em acontecimentos militares e políticos, em detrimento de assuntos culturais e religiosos.",
    ] },
  { "title" = "Ascensão a Augusto do Ocidente", "paragraphs" = [
      "Nascido em Naísso, na Mésia Superior (actual Niš na Sérvia), filho de Constâncio Cloro (ou Constâncio I Cloro) e da filha de um casal de donos de uma albergaria na Bitínia, Helena de Constantinopla, Constantino teve uma boa educação — especialmente por ser filho de uma mulher de língua grega e haver vivido no Oriente grego, o que facilitou-lhe o acesso à cultura bilíngue própria da elite romana — e serviu no tribunal de Diocleciano depois do seu pai ter sido nomeado um dos dois césares, na altura um imperador júnior, na Tetrarquia em 293. Embora a sua condição junto de Diocleciano fosse em parte a de um refém, Constantino serviu nas campanhas do césar Galério e de Diocleciano contra os sassânidas e os sármatas. Aquando da abdicação conjunta de Diocleciano e Maximiano em 305, Constâncio seria proclamado augusto, mas Constantino seria descartado como césar em proveito de Valério Severo (também conhecido modernamente como Severo II, título que jamais usou, para não ser confundido com o grande imperador do século anterior, Septímio Severo).",
      "Pouco antes da morte do seu pai, em 25 de julho de 306, Constantino conseguiu a permissão de Galério para se reunir a ele no Ocidente, chegando a fazer uma campanha juntamente com Constâncio Cloro contra os pictos, estando junto do leito de morte do seu pai em Ebóraco (atual Iorque, na Inglaterra) na Britânia, o que lhe permitiu impor o princípio da hereditariedade em seu proveito, proclamando-se \"césar\" e sendo reconhecido como tal por Galério, então feito \"augusto\" do Oriente. Desde o início de seu reinado, assim, Constantino tinha o controle da Britânia, Gália, Germânia e Hispânia, com sua capital em Augusta dos Tréveros, cidade que fez embelezar e fortificar.",
      "Nos dezoito anos seguintes, combateu uma série de batalhas e guerras que o fizeram o governador supremo do Império Romano. Como Maximiano desejava retomar a sua posição de augusto, da qual se havia afastado a contragosto juntamente com Diocleciano, Constantino recebeu-o na sua corte e aliou-se a ele por um casamento em 307 com a filha de sete anos de Maximiano, Fausta, o que lhe permitiu ser reconhecido tacitamente como Augusto em 308 por Galério numa conferência tetrárquica em Carnunto (atual Petronell-Carnuntum na Áustria). Em 309, no entanto, Constantino enfrentaria o seu sogro, que tentava recuperar abertamente o poder, capturando-o em Marselha e mandando assassiná-lo. Em 310, Constantino seria formalmente reconhecido como Augusto por Galério. Severo havendo sido entrementes eliminado, em 307, por Magêncio, filho de Maximiano que se havia proclamado imperador em Roma, Constantino deveria acabar por enfrentar o seu cunhado para conseguir o domínio completo do Ocidente romano. Após uma série de mediações fracassadas e lutas confusas, Constantino, após apoiar o usurpador africano Lúcio Domício Alexandre, cortando o fornecimento de trigo de Roma, de 308 a 309, desceu em 312 até Itália para eliminar Magêncio.",
    ] },
  { "title" = "Imperador (306–337)", "paragraphs" = [
      "A porção do império sob a jurisdição de Constantino compreendia a Britânia, a Gália e a Hispânia. Ele comandava um dos maiores exércitos romanos, aquartelado ao longo da fronteira estrategicamente vital do Reno. Ele permaneceu na Britânia após sua aclamação como imperador, repelindo as tribos dos pictos e consolidando seu controle sobre as dioceses do noroeste. Concluiu as obras de fortificações militares iniciadas durante o governo de seu pai e ordenou a restauração das vias da região. Em seguida, partiu para Augusta Treverorum (Tréveris) na Gália, a capital tetrárquica do noroeste do Império Romano. Ao tomarem conhecimento da aclamação de Constantino, os francos invadiram a Gália transpondo o Baixo Reno durante o inverno de 306–307. Constantino rechaçou-os para além do Reno e capturou os reis Ascárico e Merogaiso; os monarcas bárbaros e seus guerreiros foram lançados às feras no Anfiteatro de Tréveris durante as celebrações triunfais de adventus (chegada solene) que se seguiram.",
      "Constantino deu início a uma ampla expansão de Tréveris. Reforçou a muralha que circundava a cidade com torres militares e portões fortificados, e iniciou a construção de um complexo palaciano no setor nordeste da urbe. Ao sul de seu palácio, ordenou a ereção de uma grandiosa basílica de audiências (sala de recepção formal) e de um colossal edifício termal imperial. Patrocinou inúmeros projetos arquitetônicos por toda a Gália durante seu governo como soberano do Ocidente, com destaque para Augustoduno (Autun) e Arelate (Arles). Segundo Lactâncio, Constantino adotou uma política de tolerância para com o cristianismo, embora talvez ainda não houvesse abraçado formalmente a fé cristã. Não há consenso historiográfico acerca das convicções religiosas de Constantino no início de seu principado, sugerindo alguns pesquisadores uma adesão ao cristianismo desde a juventude. Independentemente disso, ele provavelmente considerou a tolerância uma política mais sensata e pragmática do que a perseguição aberta, além de um meio estratégico para distinguir-se do grande perseguidor Galério. Decretou o fim formal das perseguições e restituiu aos cristãos todos os bens e propriedades confiscados sob o primeiro dos editos persecutórios.",
      "Constantino era ainda pouco experimentado e pesava sobre ele certa pecha de ilegitimidade; apoiava-se na reputação de seu pai em sua propaganda inicial, que concedia tanto destaque aos feitos paternos quanto aos seus próprios. Sua perícia militar e seus projetos arquitetônicos, contudo, logo proporcionaram aos panegiristas a oportunidade de traçar paralelos elogiosos entre pai e filho, tendo Eusébio observado que Constantino representava uma renovação, por assim dizer, em sua própria pessoa, da vida e do reinado de seu pai. A iconografia monetária, a estatuária e a oratória constantinianas revelam também patente desdém para com os bárbaros além das fronteiras. Ele mandou cunhar uma emissão de moedas após sua vitória sobre os alamanos representando guerreiros alamanos em pranto e súplica sob a legenda os alamanos conquistados e a epígrafe alegria dos romanos (gaudium Romanorum). Havia escassa complacência para com tais adversários; como declarou seu panegirista: É uma clemência estúpida poupar o inimigo derrotado.",
    ] },
  { "title" = "Religião", "paragraphs" = [
      "O facto de Constantino ser um imperador de legitimidade duvidosa foi algo que sempre influiu nas suas preocupações religiosas e ideológicas: enquanto esteve diretamente ligado a Maximiano, ele apresentou-se como o protegido de Hércules, deus que havia sido apresentado como padroeiro de Maximiano na primeira tetrarquia. Ao romper com o seu sogro e após o ter eliminado, Constantino passou a colocar-se sob a proteção da divindade padroeira dos imperadores-soldados do século anterior, Deus Sol Invicto, ao mesmo tempo que fez circular uma ficção genealógica (um panegírico da época. Para disfarçar a óbvia invenção, dizia, dirigindo-se retoricamente ao próprio Constantino, que se tratava dum facto \"ignorado pela multidão, mas perfeitamente conhecido pelos que te amam\") pela qual ele seria o descendente do imperador Cláudio II — ou Cláudio Gótico — conhecido pelas suas grandes vitórias militares, por haver restabelecido a disciplina no exército romano, e por ter estimulado o culto ao Sol.",
      "Constantino acabou, no entanto, por entrar na História como primeiro imperador romano a professar o cristianismo, na sequência da sua vitória sobre Magêncio na Batalha da Ponte Mílvia, em 28 de outubro de 312, perto de Roma, que ele mais tarde atribuiu ao Deus cristão. Segundo a tradição, na noite anterior à batalha sonhou com uma cruz, e nela estava escrito em latim:",
      "De manhã, um pouco antes da batalha, mandou que pintassem uma cruz nos escudos dos soldados e conseguiu uma vitória esmagadora sobre o inimigo. Esta narrativa tradicional não é hoje considerada um facto histórico, tratando-se antes da fusão de duas narrativas de factos diversos encontrados na biografia de Constantino pelo bispo Eusébio de Cesareia.",
