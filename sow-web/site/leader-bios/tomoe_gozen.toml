[articles.en]
text = "Tomoe Gozen was an onna-musha, a female samurai, mentioned in The Tale of the Heike. There is doubt as to whether she existed as she does not appear in any primary accounts of the Genpei War."
title = "Tomoe Gozen"
lang = "en"
url = "https://en.wikipedia.org/wiki/Tomoe_Gozen"
intro = [
  "Tomoe Gozen (巴 御前, Japanese pronunciation: [tomo.e]) was an onna-musha, a female samurai, mentioned in The Tale of the Heike. There is doubt as to whether she existed as she does not appear in any primary accounts of the Genpei War. She supposedly served under the samurai lord Minamoto no Yoshinaka during the Battle of Awazu, part of the Genpei War in the late Heian period, which led to the establishment of the Kamakura shogunate.",
]
sections = [
  { "title" = "Genpei War", "paragraphs" = [
      "Under the leadership of Yoshinaka she commanded 300 samurai against 2,000 warriors of the rival Taira clan during the war. After defeating the Taira in 1182 and driving them into the western provinces, Yoshinaka took Kyoto and desired to be the leader of the Minamoto clan. His cousin Yoritomo was prompted to crush Yoshinaka, and sent his brothers Yoshitsune and Noriyori to kill him.",
      "Yoshinaka fought Yoritomo's forces at the Battle of Awazu on February 21, 1184, where Tomoe is known for beheading Honda no Morishige, leader of the Musashi Clan. She presented his head to her master Yoshinaka. Although Yoshinaka's troops fought bravely, they were outnumbered and overwhelmed. When Yoshinaka was defeated there, with only a few of his soldiers standing, he told Tomoe Gozen to flee because he wanted to die with his foster brother.",
      "There are varied accounts of what followed. She is also known for having killed Uchida Ieyoshi and for escaping capture by Hatakeyama Shigetada. She then retired to become a Buddhist nun, remaining so supposedly until 1247 AD.",
    ] },
]

[articles.zh]
text = "巴御前（日語：巴御前／ともえごぜん，羅馬化：Tomoe Gozen，字鞆繪；生卒年不詳，約為12世紀前後）是平安時代末期的著名女武者。據《平家物語》記載，她是侍奉源義仲的女武者；據《源平闘諍錄》記載，她是樋口兼光的女兒；據《源平盛衰記》記載，她是中原兼遠的女兒、樋口兼光、今井兼平的姊妹、源義仲的妾。義仲敗亡後即下落不明，其後事跡眾說紛紜；後經過不斷演化，成為日本文學作品中所塑造的英雄人物之一。"
title = "巴御前"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%B7%B4%E5%BE%A1%E5%89%8D"
intro = [
  "巴御前（日語：巴御前／ともえごぜん，羅馬化：Tomoe Gozen，字鞆繪；生卒年不詳，約為12世紀前後）是平安時代末期的著名女武者。據《平家物語》記載，她是侍奉源義仲的女武者；據《源平闘諍錄》記載，她是樋口兼光的女兒；據《源平盛衰記》記載，她是中原兼遠的女兒、樋口兼光、今井兼平的姊妹、源義仲的妾。義仲敗亡後即下落不明，其後事跡眾說紛紜；後經過不斷演化，成為日本文學作品中所塑造的英雄人物之一。",
]
sections = [
  { "title" = "人物像", "paragraphs" = [
      "「木曾殿從信濃帶來了兩個侍女，一個叫巴，另一個叫山吹。山吹（因病）被好好照顧著留在都城裡。其中巴更是膚色白皙、頭髮長、相貌出眾。更是強弓精兵、一人當千。」在宇治川之戰的記載中，義仲失敗後，最後只剩下他自己、今井兼平、巴御前、手塚光盛和手塚別當5人，但巴御前竟然沒有被打倒。義仲對巴說：「妳是女性，所以妳想逃到哪裡就逃到哪裡。我已下定決心要戰鬥到底，如果最後連女性都帶在身邊，那就不太好。」巴雖然不願意離開，但被義仲再三勸說，最後才說：「讓我最後再盡一份力吧。」在這時，有名的敵將御田（恩田）八郎師重出現，巴便騎著馬沖向他，砍下他的首級。之後巴脫下鎧甲，逃往東國，從此在故事中消失蹤影。",
      "在八坂流的『百二十句本』中，巴在擊退追兵後，被義仲勸說要退走，她認為最後的奉公就是為後世祈福，於是朝東方而去，下落不明。而在『長門本』中則說，巴在逃亡後，定居於越後國的友杉，並成為尼姑。",
      "被認為保留最原初形式的『延慶本』記載，巴從小就與義仲一同成長，擅長武術格鬥，是義仲鍛煉的練習對象。長大後她也被召喚參加戰鬥。當義仲勢力僅剩7人時，巴就從左右兩側包夾攻擊敵軍，結果更成功斬首兩名武將。到粟津之戰時，義仲勢力只剩下5人，但巴已下落不明，不知是死在戰場上還是逃脫。",
    ] },
  { "title" = "史實以外", "paragraphs" = [
      "巴御前這個角色只出現在軍記物語『平家物語』和『源平盛衰記』中，在當時的一手史料以及鎌倉幕府所編纂的『吾妻鏡』中，都沒有確認到她的存在。她作為一位女武將的描述也令人存疑，很可能是文學創作的虛構成分。在『平家物語』中，對巴御前的描述非常簡略，也未提及與義仲的關係，但在後來編撰的『源平盛衰記』中，她的人物形象則被大幅增添和刻畫。",
      "不過，在『吾妻鏡』中有記載，越後城氏的一族板額御前，在作為討伐軍一員時表現出色，給予敵軍重大損害。這顯示，當時信濃和甲信越地區的武士家庭，女性也接受了一線級的戰鬥訓練,能夠參與實際作戰。在鎌倉時代，男女平等的財產分配制度也使得女性參與戰鬥的情況得到承認。",
      "此外，在神話故事中，也有很多女性參與戰鬥的例子，如神功皇后、崇神天皇時代統治期間叛亂的武埴安彦命及其妻吾田媛，以及隨日本武尊東征的弟橘媛等，以當時的女性參加戰鬥並不罕見。對於巴御前的情況，《源平盛衰記》也描述她「額上戴天冠」，暗示她具有一定的宗教性特質。該書又稱巴與義仲的乳母子，這與柳田國男提出的「妹之力」概念也有相關聯。",
    ] },
  { "title" = "異説", "paragraphs" = [
      "明治時代的自由民權運動家武居用拙在他的著作『岐蘇古今沿革志』中記載如下：從小接受皇別的中原兼遠精心教育的人物有木曾義仲、巴御前、今井兼平、樋口兼光。義仲起兵後，能戰鬥的女性只有巴一人。作為義仲的貼身侍從與他共同生存、共同戰鬥，是巴的願望所在。在軍記物語『源平盛衰記』中，巴被描述為兼遠的女兒，成為義仲的妾侍。但現實來看，皇別的兼遠決不可能將自己的女兒降為妾侍(遊女或便女)。義仲的貼身側室應該就是巴。而且巴早在義仲起兵前就已經生下義高，說明她原本是義仲的正室。到義仲起兵時，能夠作戰的只有巴，她不得不成為義仲的貼身侍從，與他共同奮戰。巴御前的形象只出現在『平家物語』和『源平盛衰記』這些軍記物語中，在當時的一手史料或鎌倉幕府編纂的『吾妻鏡』中都找不到她的記錄。『源平盛衰記』很可能包含大量文學虛構成分。作為敗者，他們將妾侍和正妻搞混淆，這無疑是一種侮辱和凌虐；正確的情況應該是，他們將(地方豪族的女兒或敗者的女兒)納為妾侍，而(同盟國的女兒或皇族的女兒)則作為正室。",
    ] },
  { "title" = "墓所", "paragraphs" = [
      "義仲寺（滋賀縣大津市） - 根據寺廟的傳說，巴御前在近江粟津的村落中，為了祭拜戰死的義仲而修建茅蓬庵居。。別名『巴寺』。寺廟內有一座被稱為巴塚的墓地，據信就是巴御前的墓。",
      "巴塚公園（富山縣南礪市） - 南礪市的福光地區，據『源平盛衰記』等記載是巴御前長眠的地方。公園內有一座據說埋葬她遺體的塚。旁邊種有一棵高12公尺、樹幹周圍3公尺的松樹，是該市指定的天然紀念物。每年10月22日，也就是傳說中巴御前忌日當天，都會在此舉辦「巴忌」的追悼活動。。",
      "倶利伽羅縣定公園（富山縣小矢部市） - 倶利伽羅峠之戰的古戰場。公園內有巴塚和葵塚兩座墓碑。葵御前是與巴御前一同效忠於義仲，並在倶利伽羅峠之戰中犧牲的人物。傳說巴御前臨終時曾說：「我死後，請將我葬在礪波山上的葵塚旁邊」。。這片區域被指定為「葵塚・巴塚古墳群」，列為埋藏文化資產。",
    ] },
  { "title" = "延伸閱讀", "paragraphs" = [
      "Faure, Bernard. (2003). The Power of Denial: Buddhism, Purity, and Gender. Princeton: Princeton University Press. ISBN 0-691-09170-6/ISBN 978-0-691-09170-9; ISBN 0-691-09171-4/ISBN 978-0-691-09171-6; OCLC 49626418 （页面存档备份，存于互联网档案馆）",
      "Joly, Henri L. (1967). Legend in Japanese Art: a Description of Historical Episodes, Legendary Characters, Folk-lore Myths, Religious Symbolism, Illustrated in the Arts of Old Japan. Rutland, Vermont: Tuttle. ISBN 0-8048-0358-7/ISBN 978-0-8048-0358-8; OCLC 219871829 （页面存档备份，存于互联网档案馆）",
      "Kitagawa, Hiroshi and Bruce T. Tsuchida, ed. (1975). The Tale of the Heike. Tokyo: University of Tokyo Press. ISBN 0-86008-128-1 OCLC 164803926 （页面存档备份，存于互联网档案馆）",
    ] },
  { "title" = "外部連結", "paragraphs" = [
      "Famous Women of Japanese History（页面存档备份，存于互联网档案馆）. The Samurai Archives Japanese History Page.",
    ] },
]

[articles.ko]
text = "도모에 고젠(일본어: 巴御前 토모에 고젠[*], 생몰년 미상) 은, 헤이안 시대 말기의 시나노 무장이다. 군담소설 《헤이케 이야기》에는 무장 미나모토노 요시나카의 편녀(便女) 로, 《겐페이 투쟁록》(源平闘諍録)에는 히구치 가네미쓰(樋口兼光)의 딸, 《겐페이 성쇠기》(源平盛衰記)에는 나카하라노 가네토(中原兼遠)의 딸이자 히쿠치 가네미쓰·이마이 가네히라(今井兼平)의 딸로 요시나카의 처가 되었다."
title = "도모에 고젠"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EB%8F%84%EB%AA%A8%EC%97%90_%EA%B3%A0%EC%A0%A0"
intro = [
  "군담소설 《헤이케 이야기》에는 무장 미나모토노 요시나카의 편녀(便女) 로, 《겐페이 투쟁록》(源平闘諍録)에는 히구치 가네미쓰(樋口兼光)의 딸, 《겐페이 성쇠기》(源平盛衰記)에는 나카하라노 가네토(中原兼遠)의 딸이자 히쿠치 가네미쓰·이마이 가네히라(今井兼平)의 딸로 요시나카의 처가 되었다. 으레 부인으로 해석되지만, 미나모토노 요시나카의 아내는 도모에가 아니다.",
]
sections = [
  { "title" = "약력", "paragraphs" = [
      "《헤이케 이야기》에는 ‘기소의 최후[木曾最期]’에서만 도모에의 이름이 등장한다. 그녀가 평생의 주인이자 낭군으로 섬겼던 미나모토노 요시나카(源義仲)의 휘하 장수였던 히쿠치 가네미쓰, 이마이 가네히라, 그리고 네노이 유키치카(根井行親)와 다테 지카타다(楯親忠) 등 ‘기소 사천왕’과 함께 요시나카를 따라 헤이케 타도에 종군해, 큰 칼과 억센 활을 들고 싸웠던 여자 무사로 묘사되고 있으며, “요시나카 공은 시나노에서 도모에와 야마부키(山吹), 두 명의 편녀(便女)를 거느리고 왔다. 야마부키는 병이 있어 수도에 머물렀다. 도모에는 흰 피부에 머리는 길었으며, 용모가 몹시 아름다웠다. 강궁의 정병으로 혼자서 능히 천 명을 맞섰다.”라고 되어 있다.",
      "《헤이케 이야기》에는 교토에서 헤이케를 몰아냈지만 교토의 치안 회복은 물론 법황과의 관계 회복에도 실패하고, 요시쓰네에 쫓겨 달아나던 미나모토노 요시나카가 300기를 가지고 여기저기서 출몰하는 군사들에 맞서서 끝까지 싸웠지만, 다 싸워 이기고 보니 남은 것은 다섯 기밖에 되지 않았다. 다섯 기 가운데는 도모에도 포함되어 있었다. 요시나카는 자신의 불리함을 깨닫고 도모에에게 “너는 여자니 어디로든 피해라. 나는 전사할 각오를 한 몸, 붙잡히게 된다면 자결할 것이다. 마지막까지 여자나 끼고 있었다는 소리는 듣고 싶지 않다.”라며 도모에를 피신시키려 했다. 도모에는 떠나려 하지 않았지만, 요시나카가 끝까지 도망칠 것을 권하자 “마지막 봉공(奉公)으로 제가 싸우는 모습을 보여드리겠습니다.”라는 말과 함께, 마침 30기를 거느리고 나타난 무사시의 장사 온다 모로시게에게 달려가, 모로시게 옆에 말을 대고 힘껏 잡아채서 자신이 타고 있던 안장 앞가리개에 밀어붙인 다음 목을 비틀어 베고 집어던져 버렸다. 그리고 갑주를 벗어 던지고 동쪽을 향해 달아나는 것으로 《헤이케 이야기》 속에서 자취를 감춘다.",
      "이건 가쿠이치본(覺一本)이고, 야사카본(八坂本) 《헤이케 이야기》에서는 도모에를 쫓아온 적장을 거꾸로 공격해 쓰러뜨린 뒤 다시 요시나카에게 왔다. 자신을 떠나지 않으려는 도모에에게 “너의 후사를 잇는 것이 네가 나를 위해 할 수 있는 마지막 봉공이다.”라고 하는 말을 듣고서야 동쪽을 향해 사라졌다고 되어 있다.",
    ] },
  { "title" = "역사로서의 도모에", "paragraphs" = [
      "여자 무장에 대한 《헤이케 이야기》나 《겐페이 성쇠기》의 기술은 사실로 다 믿기에는 미심쩍은 부분이 많이 있어 문학적 각색일 가능성도 높다. 다만 가마쿠라 막부의 정사인 《아즈마카가미》(吾妻鏡)에는 겐린(建仁) 원년(1201년)에 에치고(越後)에서 반란이 일어났을 때, 에치고 죠씨(越後城氏) 집안의 한가쿠 고젠(坂額御前)이라는 여자의 분투로 막부의 토벌군이 큰 피해를 입었다는 기사가 있다. 당시의 가이ㆍ시나노ㆍ에치고 지방에서는 무사의 집안의 여자들도 제1급에 준하는 전투훈련을 받았다는 것은 확실하다.",
      "일본의 소설가 가이온지 쥬고로(海音寺潮五郞)는 긴지(金刺) 집안이 소유했던 성읍 가운데 ‘야마후키’라는 이름을 가진 성이 있는 점을 들어, 도모에와 야마후키는 요시나카의 지지 세력이던 나카하라(中原)ㆍ긴지 집안의 사람 가운데 무예에 뛰어난 여자를 골라서 부관 내지 비서관으로 삼아 파견했던 것 같다고 추측하고 있다.",
    ] },
  { "title" = "전설", "paragraphs" = [
      "나가노 현의 기소 군 히요시무라(日義村)에는 도모에가후치(巴之淵)라는 지명이 남아있는데, 원래 도모에가 이 강에 살던 용의 화신으로서 인간의 모습으로 현신해 요시나카를 도왔다는 이 지방 전승에서 유래한 이름이다.",
      "또 이런 전설도 있다. 헤이케 타도의 영지를 받은 요시나카가 구리카라(倶利伽羅)라는 고갯길로 진군할 때였는데, 인근 마을에 살던 도모에가 강에서 옷감을 말리는데 거기로 요시나카의 말이 지나가는 바람에 물이 튀어서 옷감이 젖어버렸고, 화가 한 도모에는 대번에 요시나카를 말을 탄 그대로 확 들어올려 도이데(戶出) 마을로 던져버렸다. 그대로 수십 매나 되는 논 위로 던져진 요시나카는 그대로 소나무의 가지에 걸려버렸지만, 화내기는커녕 오히려 요시나카는 도모에를 데리고 전쟁에 나아갔다고 한다. 도이데 중심부에는 도모에 정(巴町)이라는 마을이 있고, 해마다 도이데노 신사(戶出野神社)의 가을 마쓰리 때면 마을의 여자아이가 뽑혀 도모에 고젠으로 분장하고 참가한다.",
      "요시나카가 말과 함께 걸린 소나무는 후세에 말걸이 소나무(駒かけの松)라고 불렀다고 하는데, 나무가 있었다는 장소조차 기록에 없을 뿐 아니라 도이데에 보관된 자료를 봐도 그런 전설은 없다. 지금의 오시미즈 지역에 마을이 생긴 것은 에도 초기의 일이지 헤이안 시대에는 그 지역에 마을이 있지도 않았고, 있었다 해도 인근 요시즈미(吉住) 마을(지금의 일본 다카오카 시 토이데 요시즈미)의 일부에 불과했다. 다이쇼 8년에 간행된 토이데 관련 사료에는 주에이(壽永) 3년(1183년) 5월 11일에 한야노(般若野)에서 구리카라로 향하던 요시나카가 잠깐 쉬느라 말을 매어두었다는 말걸이 소나무(駒繋ぎの松)의 전설만 나온다. 나무는 정작 1894년(메이지 24년) 9월 11일에 서남쪽에서 불어온 폭풍으로 나무의 가지 한 쪽이 꺾였고, 1909년(메이지 42년) 8월에 전부 베여나가 지금은 흔적만 남았다.",
    ] },
]

[articles.ar]
text = "توموي غوزين (باليابانية: 巴 御前)؛ محاربة ساموراي «أوننا بوغيشا؛ محاربة عسكرية أنثى» عاشت في أواخر القرن الثاني عشر بين عامي (1157م-1247م)، اشتهرت بشجاعتها وقوتها. تزوجت من ميناموتو نو يوشيناكا وعملت تحت امرته في حرب غينبيه كما كانت جزءً من الحرب التي أدت إلى اختيار أول شوغن (حاكم عسكري) في اليابان، وأكثر ما عرفت فيه هو ولائها وشجاعتها خاصةً في معركة أوازو عام 1184 والتي أدت إلى هزيمة جيش زوجها يوشيناكا."
title = "توموي غوزين"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%AA%D9%88%D9%85%D9%88%D9%8A_%D8%BA%D9%88%D8%B2%D9%8A%D9%86"
intro = [
  "توموي غوزين (باليابانية: 巴 御前)؛ محاربة ساموراي «أوننا بوغيشا؛ محاربة عسكرية أنثى» عاشت في أواخر القرن الثاني عشر بين عامي (1157م-1247م)، اشتهرت بشجاعتها وقوتها. تزوجت من ميناموتو نو يوشيناكا وعملت تحت امرته في حرب غينبيه كما كانت جزءً من الحرب التي أدت إلى اختيار أول شوغن (حاكم عسكري) في اليابان، وأكثر ما عرفت فيه هو ولائها وشجاعتها خاصةً في معركة أوازو عام 1184 والتي أدت إلى هزيمة جيش زوجها يوشيناكا.",
  "كانت لعائلتها علاقات قوية مع يوشيناكا. فوالدها (ناكاهارا كانيتو) ومربيها كانا مؤيدان للحاكم يوشيناكا بقوة، كما أن والدتها كانت مرضعة يوشيناكا. وخدم إثنين من إخوتها الأكبر منها كقادة عسكريين تحت إمرة يوشيناكا.",
]
sections = [
  { "title" = "تاريخياً", "paragraphs" = [
      "ورد ذكرها في ملحمة هيكي التي كتبت في القرن الـ 14 كما يلي:«كانت توموي جميلة، ذات بشرة بيضاء وشعر طويل وملامح ساحرة. كانت أيضًا رامية سهام قوية بشكل ملحوظ، وكسيافة تساوي ألف محارب، وعلى استعداد لمواجهة شيطان أو إله، راكبة على الخيل أو سيرًا على الأقدام. تعاملت مع الخيول الغير مروضة بمهارة رائعة. وركبتها وعادت سالمة من مواقف خطيرة. كلما اقتربت المعركة، أرسلها يوشيناكا كقائد أول على جيشه، مجهزة بدرع قوي وسيف كبير وقوس ضخم. نفذت أفعال بطولية أكثر من أي من محارب آخر.»بعد هزيمة قبيلة تايرا ودفعها إلى المقاطعات الغربية، إستولى يوشيناكا على مدينة كيوتو وتقرر أن يكون قائدًا لعشيرة ميناموتو، لكن ابن عمه يوريتومو الذي كان يعاديه طلب أن يسحق يوشيناكا، ولهذا أرسل إخوته يوشيتسونيه ونورييوري لقتله، حارب يوشيناكا قوات يوريتومو في معركة أوازو التي حصلت بتاريخ 21 فبراير 1184، وفيها تمكنت توموي من إقتحام جيش العدو وحاربت أحد اقوى جنودهم وأردته مقطوع الرأس. لكن وبالرغم من أن قوات يوشيناكا قاتلت بشجاعة، إلا أن عدد جيش العدو كان يفوقهم بكثير مما تسبب بخسارتهم المعركة، وعندها هُزِم يوشيناكا هناك، مع عدد قليل فقط من جنوده، أخبر توموي غوزين بأن تهرب لأنه أراد أن يموت مع شقيقه بالتبني ايماي كانيهيرا، وأيضاً قال إنه سيخجل إذا مات مع امرأة.",
      "إشتهرت توموي بمواقف أخرى متنوعة منها.منها أنها قطعت رأس هوندا نو موريشيغي في معركة أوازو في عام 1184، كما عرفت أيضًا بقتلها اوتشيدا إييوشي أحد اتباع العدو بعد فشله بالإمساك بها برفقة هاتاكياما شيغيتادا وتمكنت من الهرب منهم.",
    ] },
  { "title" = "في الثقافة والاعمال الخيالية", "paragraphs" = [
