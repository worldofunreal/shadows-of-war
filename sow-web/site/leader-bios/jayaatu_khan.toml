[articles.en]
text = "Jayaatu Khan, also known by his temple name as the Emperor Wenzong of Yuan, was an emperor of the Yuan dynasty. Apart from Emperor of China, he is regarded as the 12th Khagan of the Mongol Empire, although it was only nominal due to the division of the empire."
title = "Jayaatu Khan Tugh Temür"
lang = "en"
url = "https://en.wikipedia.org/wiki/Jayaatu_Khan_Tugh_Tem%C3%BCr"
intro = [
  "Jayaatu Khan (born Tugh Temür; 16 February 1304 – 2 September 1332), also known by his temple name as the Emperor Wenzong of Yuan, was an emperor of the Yuan dynasty. Apart from Emperor of China, he is regarded as the 12th Khagan of the Mongol Empire, although it was only nominal due to the division of the empire.",
  "He first ruled from 16 October 1328 to 26 February 1329 before abdicating in favour of his brother Kusala (Emperor Mingzong), and again ruled from 8 September 1329 to 2 September 1332 after Kusala's death.",
  "Thanks to his father's loyal partisans, Tugh Temür did restore the line of Khayishan (Emperor Wuzong) to the throne but persecuted his eldest brother Kusala's family, and later expressed remorse for what he had done to him. His name means \"Blessed/lucky Khan\".",
  "Tugh Temür sponsored many cultural activities, wrote poetry, painted, and read Chinese classical texts. Examples of his quite competent poetry and calligraphy have survived. He mandated and closely monitored the compilation called \"The Imperial Dynasty's grand institutions for managing the world\"; through this textual production, he proclaimed his reign as new beginning, which took stock of the administrative practices and rules of the past and looked forward to a fresh chapter in Yuan dynastic governance. But his reign was brief, and his administration was in the hands of powerful ministers, such as El Temür of the Qipchaq and Bayan of the Merkid who had helped him to win the succession struggle in 1328.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "He was the second son of Khayishan (Külüg Khan or Emperor Wuzong) and a Tangut woman, who was posthumously promoted as an empress in 1329 after her son's ascension, and a younger brother of Kuśala. When his father Khayishan suddenly died and his younger brother Ayurbarwada inherited the Yuan throne in 1311, he and his brother were removed from the central government by his grandmother Dagi and other Khunggirad faction members including Temüder since they were not mothered by Khunggirad khatuns. After Ayurbarwada's son Shidibala ascended the throne in 1320, Tugh Temür was banished to Hainan. When Shidibala was assassinated and Yesün Temür took over as the new ruler, conditions improved for Tugh Temür. He was given the title of Prince of Huai (Chinese: 懷王) and relocated to Jiankang (modern-day Nanjing) and then to Jiangling. By this time he already showed a wide range of scholarly and artistic interests and had surrounded himself with many distinguished Chinese literati and artists. As the persecuted sons of Khayishan Külüg Khan, Tugh Temür and Kusala still enjoyed a measure of sympathy among the Borjigin princes and, more importantly, the lingering loyalty of some of their father's followers who had survived various political purges.",
    ] },
  { "title" = "Civil war", "paragraphs" = [
      "The death of Yesün Temür Khan in Shangdu in 1328 gave Khayishan's line an opportunity to surface. But it was mainly due to El Temür's political ingenuity, whose Qipchaq family reached its zenith under Khayishan. He activated a conspiracy in the capital Khanbaliq (Dadu, modern Beijing) to overthrow the court at Shangdu. He and his entourages enjoyed enormous geographical and economic advantages over the loyalists of Yesun Temur. Tugh Temür was recalled to Khanbaliq by El Temür since his more influential brother Kuśala stayed in far-away Central Asia. He was installed as the new ruler in Khanbaliq in September while Yesün Temür's son Ragibagh succeeded to the throne in Shangdu with the support from Yesün Temür's favourite retainer Dawlat Shah.",
      "Ragibagh's forces broke through the Great Wall at several points, and penetrated as far as the outskirts of Khanbaliq. El Temür, however, was able to turn the tide quickly in his favour. The restorationists from Manchuria (Liaodong) and eastern Mongolia launched a surprise attack on the loyalists. Their army under the command of Bukha Temur and Orlug Temur, descendants of Genghis Khan's brothers, surrounded Shangdu on 14 November, at a time most of the loyalists were involved on the Great Wall front. The loyalists in Shangdu surrendered on the very next day, and Dawlat Shah and most of the leading loyalists were taken prisoner and later executed. Ragibagh was reported to be missing. With the surrender of Shangdu, the way to restoring Khayishan's imperial line was cleared, although the loyalists elsewhere continued the fighting until 1332.",
    ] },
  { "title" = "Regicide and purge", "paragraphs" = [
      "At the same time, however, his elder brother Khutughtu Khan Kusala gathered support from princes and generals in Mongolia and Chagatai Khanate and entered Karakorum with the overwhelming military presence. Realizing disadvantages, Tugh Temür declared abdication and summoned his brother. Accompanied by the Chagatai ruler Eljigidey, Kusala in response enthroned himself on 27 February 1329 north of Karakorum. El Temür brought the imperial seal to Kuśala in Mongolia and announced Dadu's intent to welcome him, and Tugh Temür was made heir apparent. According to an oral tradition, Kuśala's retainers treated him discourteously when he came to the camp of Kuśala, thus making him both fearful and angry. Kuśala thanked El Temür and appointed him grand councillor of the right wing of the Secretariat with the title darqan taishi. Kuśala had appointed his loyal followers to essential posts in the Secretariat, the Bureau of Military Affairs, and the Censorate.",
      "On his way to Dadu, on 26 August, Kuśala met with Tugh Temür in Ongghuchad near Shangdu. Only four days after a banquet with Tugh Temür, he suddenly died or was killed with poison by El Temür, who feared losing power to princes and officers of the Chagatai Khanate and Mongolia who followed Kuśala. Tugh Temür was restored to the throne on 8 September 1329. His conspiracy and victory over the loyalists and the death of Kusala eliminated the power of the steppe candidates from Mongolia.",
      "Tugh Temür's administration carried out a bloody purge against its enemies. Not only were leading supporters of Yesün Temür's successor Raghibagh executed or exiled, but their properties were confiscated. Tugh Temür denied the posthumous names of Yesün Temür and Raghibagh and destroyed the chamber in the imperial shrine that contained the tablet of Yesün Temür's father Gammala. El Temür purged pro-Kuśala officers and brought power to warlords.",
    ] },
  { "title" = "Reign", "paragraphs" = [
      "Because Tugh Temür's accession was so transparently illegitimate, it was more important for his regime than for any previous reign to rely on liberal enfeoffments and generous awards to rally support from the nobility and officialdom. During his four-year reign, twenty-four princely titles were handed out, nine of which were of the first rank. Of these nine first-rank princes, seven were not even Kublai Khan's descendants. Not only were the imperial grants restored in 1329, but all the properties confiscated from the Shangdu loyalists also were given to princes and officials who had made contributions to the restoration; in all, 125 individual properties are estimated to have changed hands.",
      "Action was also taken to win recognition from the other Mongol khanates to be accepted as their nominal suzerain. Tugh Temür sent three princes with lavish gifts to the Golden Horde, the Chagatai Khanate and the Ilkhanate. And he also sent Muqali's descendant Naimantai to Eljigidey, who strongly supported Kusala, to give the royal seal and gifts in order to mollify his anger. However, Tugh Temür made regarding success, and saw favourable responses. Thus Tugh Temür was able to re-establish suzerainty over the Mongol world for himself and to maintain a close relationship with the three western khanates.",
      "The four-year reign of Jayaatu Khan Tugh Temür was dominated by El Temur and Bayan of the Merkid. As the persons who had been chiefly responsible for making the restoration possible, they acquired a measure of power and honour that had never before been attained by any official in the Yuan. They built their own power bases in the bureaucracy and the military, and their role overshadowed Tugh Temür. Tugh Temür honoured his father's former ministers and gave them honorific titles, and restored the honours of Sanpo and Toghto who had been persecuted by Ayurbarwada. The participants in the restoration were given most of the positions of importance in his administration. A few of the Muslims held posts in provinces, however, they did not have any position in the central government.",
    ] },
]

