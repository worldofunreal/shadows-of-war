[articles.en]
text = "Al-Zahir Baibars ruled the Mamluk Sultanate from 1260 to 1277. A gold dinar from Cairo in the Louvre preserves his name and titles. His campaigns extended Mamluk control in the Levant, where in 1271 he led a coalition against the Hospitaller fortress of Krak des Chevaliers."
title = "Baibars"
lang = "en"
url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271"
shortArticle = true
intro = ["Al-Zahir Baibars ruled the Mamluk Sultanate from 1260 to 1277. A gold dinar from Cairo in the Louvre preserves his name and titles. His campaigns extended Mamluk control in the Levant, where in 1271 he led a coalition against the Hospitaller fortress of Krak des Chevaliers."]
sections = [{ title = "The siege of the Krak des Chevaliers", paragraphs = ["The archaeological account describes the capture of the settlement below the fortress, followed by assaults on its outer defences. Siege machines struck the walls while sappers from Aleppo dug beneath towers on several fronts. A tower collapsed on March 30, allowing the besiegers into the lower ward. The remaining garrison asked for safe conduct on April 8. Baibars then ordered the defences restored. Accounts of his reign include a biography written by his own secretary, Ibn Abd al-Zahir. Its perspective and the surviving fortifications provide different kinds of evidence about the campaign."] }]
sources = [{ title = "French Ministry of Culture, Baybars’ Siege of 1271", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271" }, { title = "French Ministry of Culture, The Krak des Chevaliers under the Mamluks", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/krak-des-chevaliers-under-mamluks" }, { title = "Louvre, Mamluk Dinar in the Name of Baybars", url = "https://collections.louvre.fr/en/ark:/53355/cl010320831" }, { title = "Amina A. Elbendary, Changing Medieval Perceptions of al-Zahir Baybars", url = "https://knowledge.uchicago.edu/records/wrem2-htd76" }]

[articles.es]
text = "Al-Zahir Baibars gobernó el Sultanato mameluco de 1260 a 1277. Un dinar de oro procedente de El Cairo y conservado en el Louvre lleva su nombre y sus títulos. Sus campañas extendieron el dominio mameluco en el Levante. En 1271 encabezó una coalición contra la fortaleza hospitalaria del Crac de los Caballeros."
title = "Baibars"
lang = "es"
url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271"
shortArticle = true
intro = ["Al-Zahir Baibars gobernó el Sultanato mameluco de 1260 a 1277. Un dinar de oro procedente de El Cairo y conservado en el Louvre lleva su nombre y sus títulos. Sus campañas extendieron el dominio mameluco en el Levante. En 1271 encabezó una coalición contra la fortaleza hospitalaria del Crac de los Caballeros."]
sections = [{ title = "El sitio del Crac de los Caballeros", paragraphs = ["Según el estudio arqueológico, los sitiadores tomaron el poblado al pie de la fortaleza y asaltaron sus defensas exteriores. Las máquinas de asedio batían los muros mientras zapadores de Alepo excavaban bajo las torres en varios frentes. El 30 de marzo cayó una torre y se abrió el paso al recinto inferior. La guarnición que seguía resistiendo pidió salvoconducto el 8 de abril. Baibars ordenó luego restaurar las defensas. Su secretario, Ibn Abd al-Zahir, escribió una biografía del sultán. El relato de corte y las fortificaciones conservadas aportan evidencias de distinto tipo sobre la campaña."] }]
sources = [{ title = "French Ministry of Culture, Baybars’ Siege of 1271", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271" }, { title = "French Ministry of Culture, The Krak des Chevaliers under the Mamluks", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/krak-des-chevaliers-under-mamluks" }, { title = "Louvre, Mamluk Dinar in the Name of Baybars", url = "https://collections.louvre.fr/en/ark:/53355/cl010320831" }, { title = "Amina A. Elbendary, Changing Medieval Perceptions of al-Zahir Baybars", url = "https://knowledge.uchicago.edu/records/wrem2-htd76" }]

[articles.fr]
text = "Al-Zahir Baybars régna sur le sultanat mamelouk de 1260 à 1277. Un dinar d’or du Caire conservé au Louvre porte son nom et ses titres. Ses campagnes étendirent l’autorité mamelouke au Levant. En 1271, il conduisit une coalition contre la forteresse hospitalière du Crac des Chevaliers."
title = "Baybars"
lang = "fr"
url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271"
shortArticle = true
intro = ["Al-Zahir Baybars régna sur le sultanat mamelouk de 1260 à 1277. Un dinar d’or du Caire conservé au Louvre porte son nom et ses titres. Ses campagnes étendirent l’autorité mamelouke au Levant. En 1271, il conduisit une coalition contre la forteresse hospitalière du Crac des Chevaliers."]
sections = [{ title = "Le siège du Crac des Chevaliers", paragraphs = ["L’étude archéologique retrace la prise du bourg au pied du château, puis les assauts contre les défenses extérieures. Les engins frappèrent les murs tandis que des sapeurs d’Alep creusaient sous les tours sur plusieurs fronts. Le 30 mars, l’effondrement d’une tour ouvrit une brèche vers l’enceinte basse. Le reste de la garnison demanda un sauf-conduit le 8 avril. Baybars fit ensuite restaurer les défenses. Son secrétaire, Ibn Abd al-Zahir, rédigea une biographie du souverain. Le récit de cour et les fortifications conservées éclairent la campagne de différentes façons."] }]
sources = [{ title = "French Ministry of Culture, Baybars’ Siege of 1271", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271" }, { title = "French Ministry of Culture, The Krak des Chevaliers under the Mamluks", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/krak-des-chevaliers-under-mamluks" }, { title = "Louvre, Mamluk Dinar in the Name of Baybars", url = "https://collections.louvre.fr/en/ark:/53355/cl010320831" }, { title = "Amina A. Elbendary, Changing Medieval Perceptions of al-Zahir Baybars", url = "https://knowledge.uchicago.edu/records/wrem2-htd76" }]

[articles.de]
text = "Al-Zahir Baibars regierte das Mamlukensultanat von 1260 bis 1277. Ein goldener Dinar aus Kairo im Louvre trägt seinen Namen und seine Titel. Seine Feldzüge weiteten die mamlukische Herrschaft in der Levante aus. 1271 führte er ein Bündnisheer gegen die Johanniterfestung Krak des Chevaliers."
title = "Baibars"
lang = "de"
url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271"
shortArticle = true
intro = ["Al-Zahir Baibars regierte das Mamlukensultanat von 1260 bis 1277. Ein goldener Dinar aus Kairo im Louvre trägt seinen Namen und seine Titel. Seine Feldzüge weiteten die mamlukische Herrschaft in der Levante aus. 1271 führte er ein Bündnisheer gegen die Johanniterfestung Krak des Chevaliers."]
sections = [{ title = "Die Belagerung des Krak des Chevaliers", paragraphs = ["Der archäologische Bericht beschreibt die Einnahme des Ortes am Fuß der Burg und die Angriffe auf die äußeren Verteidigungsanlagen. Belagerungsmaschinen beschossen die Mauern. Sappeure aus Aleppo gruben an mehreren Fronten unter den Türmen. Als am 30. März ein Turm einstürzte, drangen die Belagerer in die untere Befestigung ein. Die verbliebene Besatzung bat am 8. April um freies Geleit. Baibars ließ die Anlagen wiederherstellen. Sein Sekretär Ibn Abd al-Zahir schrieb eine Biografie des Sultans. Dieser Bericht und die erhaltene Burg geben unterschiedliche Einblicke in den Feldzug."] }]
sources = [{ title = "French Ministry of Culture, Baybars’ Siege of 1271", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271" }, { title = "French Ministry of Culture, The Krak des Chevaliers under the Mamluks", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/krak-des-chevaliers-under-mamluks" }, { title = "Louvre, Mamluk Dinar in the Name of Baybars", url = "https://collections.louvre.fr/en/ark:/53355/cl010320831" }, { title = "Amina A. Elbendary, Changing Medieval Perceptions of al-Zahir Baybars", url = "https://knowledge.uchicago.edu/records/wrem2-htd76" }]

[articles.it]
text = "Al-Zahir Baybars governò il sultanato mamelucco dal 1260 al 1277. Un dinaro d’oro del Cairo conservato al Louvre porta il suo nome e i suoi titoli. Le sue campagne estesero il dominio mamelucco nel Levante. Nel 1271 guidò una coalizione contro la fortezza ospitaliera del Krak dei Cavalieri."
title = "Baybars"
lang = "it"
url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271"
shortArticle = true
intro = ["Al-Zahir Baybars governò il sultanato mamelucco dal 1260 al 1277. Un dinaro d’oro del Cairo conservato al Louvre porta il suo nome e i suoi titoli. Le sue campagne estesero il dominio mamelucco nel Levante. Nel 1271 guidò una coalizione contro la fortezza ospitaliera del Krak dei Cavalieri."]
sections = [{ title = "L’assedio del Krak dei Cavalieri", paragraphs = ["Lo studio archeologico ricostruisce la presa dell’abitato ai piedi del castello e gli assalti alle difese esterne. Le macchine colpirono le mura mentre gli zappatori di Aleppo scavavano sotto le torri su più fronti. Il crollo di una torre il 30 marzo aprì un varco verso la cinta inferiore. L’8 aprile la guarnigione superstite chiese un salvacondotto. Baybars fece poi riparare le difese. Il suo segretario Ibn Abd al-Zahir scrisse una biografia del sultano. Il racconto di corte e le fortificazioni superstiti offrono testimonianze di tipo diverso sulla campagna."] }]
sources = [{ title = "French Ministry of Culture, Baybars’ Siege of 1271", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271" }, { title = "French Ministry of Culture, The Krak des Chevaliers under the Mamluks", url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/krak-des-chevaliers-under-mamluks" }, { title = "Louvre, Mamluk Dinar in the Name of Baybars", url = "https://collections.louvre.fr/en/ark:/53355/cl010320831" }, { title = "Amina A. Elbendary, Changing Medieval Perceptions of al-Zahir Baybars", url = "https://knowledge.uchicago.edu/records/wrem2-htd76" }]

[articles.tr]
text = "El-Zâhir Baybars, 1260 ile 1277 arasında Memlûk Sultanlığı’nı yönetti. Louvre’daki Kahire menşeli bir altın dinar onun adını ve unvanlarını taşır. Seferleri Memlûk hâkimiyetini Levant’ta genişletti. 1271’de Hospitalierlerin Krak des Chevaliers kalesine karşı bir koalisyona komuta etti."
title = "Baybars"
lang = "tr"
url = "https://archeologie.culture.gouv.fr/crac-chevaliers/en/baybars-siege-1271"
shortArticle = true
intro = ["El-Zâhir Baybars, 1260 ile 1277 arasında Memlûk Sultanlığı’nı yönetti. Louvre’daki Kahire menşeli bir altın dinar onun adını ve unvanlarını taşır. Seferleri Memlûk hâkimiyetini Levant’ta genişletti. 1271’de Hospitalierlerin Krak des Chevaliers kalesine karşı bir koalisyona komuta etti."]
sections = [{ title = "Krak des Chevaliers kuşatması", paragraphs = ["Arkeolojik araştırma, önce kale eteğindeki yerleşimin, ardından dış savunma hatlarının hedef alındığını gösterir. Kuşatma makineleri duvarları döverken Halep’ten gelen lağımcılar birkaç cephede kulelerin altında kazı yaptı. 30 Mart’ta bir kulenin çökmesi aşağı avluya girişi açtı. Kalan garnizon 8 Nisan’da güvenli geçiş istedi. Baybars, kalenin savunmalarının onarılmasını emretti. Kâtibi İbn Abdüzzâhir sultanın biyografisini yazdı. Saray anlatısı ve ayakta kalan tahkimat sefer hakkında farklı türden kanıtlar sunar."] }]
