[articles.en]
text = "When Kamehameha I died in 1819, Kaʻahumanu declared that she would share rule with his successor Liholiho, Kamehameha II. She became the first holder of the office of kuhina nui. In its early years the office carried authority comparable to the king’s in decisions over land, agreements and justice. Kaʻahumanu continued to govern as regent for Kauikeaouli, Kamehameha III, until her death in 1832."
title = "Kaʻahumanu"
lang = "en"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["When Kamehameha I died in 1819, Kaʻahumanu declared that she would share rule with his successor Liholiho, Kamehameha II. She became the first holder of the office of kuhina nui. In its early years the office carried authority comparable to the king’s in decisions over land, agreements and justice. Kaʻahumanu continued to govern as regent for Kauikeaouli, Kamehameha III, until her death in 1832."]
sections = [{ title = "The decision to eat together", paragraphs = ["In 1819 Kaʻahumanu and Keōpūolani backed the ending of the ʻaikapu restrictions on men and women eating together and on certain foods. Liholiho’s participation in a shared meal made the break public. The change, known as ʻai noa, met resistance led by Kekuaokalani. His forces were defeated at Lekeleke in Kona. The events changed how royal authority, religious obligations and daily life were linked in the Hawaiian Kingdom."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.es]
text = "Tras la muerte de Kamehameha I en 1819, Kaʻahumanu anunció que compartiría el gobierno con su sucesor Liholiho, Kamehameha II. Fue la primera en ocupar el cargo de kuhina nui. En sus primeros años, ese cargo daba una autoridad comparable a la del rey en decisiones sobre tierras, acuerdos y justicia. Kaʻahumanu siguió gobernando como regente de Kauikeaouli, Kamehameha III, hasta su muerte en 1832."
title = "Kaʻahumanu"
lang = "es"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Tras la muerte de Kamehameha I en 1819, Kaʻahumanu anunció que compartiría el gobierno con su sucesor Liholiho, Kamehameha II. Fue la primera en ocupar el cargo de kuhina nui. En sus primeros años, ese cargo daba una autoridad comparable a la del rey en decisiones sobre tierras, acuerdos y justicia. Kaʻahumanu siguió gobernando como regente de Kauikeaouli, Kamehameha III, hasta su muerte en 1832."]
sections = [{ title = "La decisión de comer juntos", paragraphs = ["En 1819 Kaʻahumanu y Keōpūolani respaldaron el fin del ʻaikapu, que separaba a hombres y mujeres al comer y restringía ciertos alimentos. Al participar en una comida compartida, Liholiho hizo pública la ruptura. El cambio, conocido como ʻai noa, encontró la oposición encabezada por Kekuaokalani. Sus fuerzas fueron derrotadas en Lekeleke, en Kona. Estos hechos cambiaron la relación entre el poder de los gobernantes, las obligaciones religiosas y la vida cotidiana en el Reino de Hawái."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.fr]
text = "À la mort de Kamehameha Ier en 1819, Kaʻahumanu annonça qu’elle partagerait le pouvoir avec son successeur Liholiho, Kamehameha II. Elle inaugura la charge de kuhina nui. Dans les premières années, cette fonction donnait une autorité comparable à celle du roi sur les terres, les accords et la justice. Kaʻahumanu continua à gouverner en tant que régente de Kauikeaouli, Kamehameha III, jusqu’à sa mort en 1832."
title = "Kaʻahumanu"
lang = "fr"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["À la mort de Kamehameha Ier en 1819, Kaʻahumanu annonça qu’elle partagerait le pouvoir avec son successeur Liholiho, Kamehameha II. Elle inaugura la charge de kuhina nui. Dans les premières années, cette fonction donnait une autorité comparable à celle du roi sur les terres, les accords et la justice. Kaʻahumanu continua à gouverner en tant que régente de Kauikeaouli, Kamehameha III, jusqu’à sa mort en 1832."]
sections = [{ title = "La décision de manger ensemble", paragraphs = ["En 1819, Kaʻahumanu et Keōpūolani soutinrent l’abandon de lʻaikapu, qui séparait hommes et femmes aux repas et interdisait certains aliments. En prenant part à un repas commun, Liholiho rendit la rupture publique. Le changement, appelé ʻai noa, rencontra l’opposition menée par Kekuaokalani. Ses forces furent défaites à Lekeleke, dans le Kona. Ces événements modifièrent le rapport entre pouvoir royal, obligations religieuses et vie quotidienne dans le royaume d’Hawaï."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.de]
text = "Nach Kamehamehas I. Tod 1819 erklärte Kaʻahumanu, sie werde die Herrschaft mit seinem Nachfolger Liholiho, Kamehameha II., teilen. Sie übernahm als Erste das Amt der kuhina nui. In den frühen Jahren verlieh das Amt bei Entscheidungen über Land, Abkommen und Rechtsprechung eine mit der des Königs vergleichbare Autorität. Kaʻahumanu regierte danach als Regentin für Kauikeaouli, Kamehameha III., bis zu ihrem Tod 1832."
title = "Kaʻahumanu"
lang = "de"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Nach Kamehamehas I. Tod 1819 erklärte Kaʻahumanu, sie werde die Herrschaft mit seinem Nachfolger Liholiho, Kamehameha II., teilen. Sie übernahm als Erste das Amt der kuhina nui. In den frühen Jahren verlieh das Amt bei Entscheidungen über Land, Abkommen und Rechtsprechung eine mit der des Königs vergleichbare Autorität. Kaʻahumanu regierte danach als Regentin für Kauikeaouli, Kamehameha III., bis zu ihrem Tod 1832."]
sections = [{ title = "Die Entscheidung für ein gemeinsames Mahl", paragraphs = ["1819 unterstützten Kaʻahumanu und Keōpūolani die Aufhebung der ʻaikapu-Regeln, die Männer und Frauen beim Essen trennten und bestimmte Speisen verboten. Mit seiner Teilnahme an einem gemeinsamen Mahl machte Liholiho den Bruch öffentlich. Die unter dem Namen ʻai noa bekannte Veränderung stieß auf Widerstand unter Kekuaokalani. Seine Truppen wurden bei Lekeleke in Kona besiegt. Damit wandelte sich das Verhältnis von königlicher Herrschaft, religiösen Pflichten und Alltag im Königreich Hawaiʻi."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.it]
text = "Alla morte di Kamehameha I nel 1819, Kaʻahumanu dichiarò che avrebbe condiviso il governo con il successore Liholiho, Kamehameha II. Fu la prima a ricoprire l’incarico di kuhina nui. Nei primi anni, la carica attribuiva un’autorità paragonabile a quella del re nelle decisioni su terre, accordi e giustizia. Kaʻahumanu continuò a governare come reggente di Kauikeaouli, Kamehameha III, fino alla morte nel 1832."
title = "Kaʻahumanu"
lang = "it"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Alla morte di Kamehameha I nel 1819, Kaʻahumanu dichiarò che avrebbe condiviso il governo con il successore Liholiho, Kamehameha II. Fu la prima a ricoprire l’incarico di kuhina nui. Nei primi anni, la carica attribuiva un’autorità paragonabile a quella del re nelle decisioni su terre, accordi e giustizia. Kaʻahumanu continuò a governare come reggente di Kauikeaouli, Kamehameha III, fino alla morte nel 1832."]
sections = [{ title = "La decisione di mangiare insieme", paragraphs = ["Nel 1819 Kaʻahumanu e Keōpūolani sostennero la fine dellʻaikapu, che imponeva a uomini e donne di mangiare separati e vietava certi alimenti. Partecipando a un pasto comune, Liholiho rese pubblica la rottura. Il cambiamento, noto come ʻai noa, incontrò l’opposizione di Kekuaokalani. Le sue forze furono sconfitte a Lekeleke, nel Kona. Questi eventi cambiarono i rapporti fra autorità regia, doveri religiosi e vita quotidiana nel regno delle Hawaii."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.tr]
text = "I. Kamehameha 1819’da ölünce Kaʻahumanu, onun halefi Liholiho ile, yani II. Kamehameha ile yönetimi paylaşacağını açıkladı. Kuhina nui görevini üstlenen ilk kişi oldu. Bu makam ilk yıllarında toprak, anlaşmalar ve adalet konularında kralınkine denk bir yetki veriyordu. Kaʻahumanu, III. Kamehameha olarak bilinen Kauikeaouli’nin naibi olarak 1832’deki ölümüne kadar yönetimde kaldı."
title = "Kaʻahumanu"
lang = "tr"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["I. Kamehameha 1819’da ölünce Kaʻahumanu, onun halefi Liholiho ile, yani II. Kamehameha ile yönetimi paylaşacağını açıkladı. Kuhina nui görevini üstlenen ilk kişi oldu. Bu makam ilk yıllarında toprak, anlaşmalar ve adalet konularında kralınkine denk bir yetki veriyordu. Kaʻahumanu, III. Kamehameha olarak bilinen Kauikeaouli’nin naibi olarak 1832’deki ölümüne kadar yönetimde kaldı."]
sections = [{ title = "Birlikte yeme kararı", paragraphs = ["Kaʻahumanu ve Keōpūolani 1819’da kadınların ve erkeklerin ayrı yemek yemesini öngören ve kimi yiyecekleri yasaklayan ʻaikapu kurallarının kaldırılmasını destekledi. Liholiho birlikte yenilen bir yemeğe katılarak kopuşu duyurdu. ʻAi noa adı verilen değişikliğe Kekuaokalani öncülüğünde karşı çıkıldı. Kuvvetleri Kona’daki Lekeleke’de yenildi. Bu olaylar Hawaii Krallığı’nda kraliyet otoritesi, dinî yükümlülükler ve gündelik hayat arasındaki ilişkiyi değiştirdi."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.zh-CN]
text = "一八一九年卡美哈梅哈一世去世后，卡阿胡马努宣布与继位的利霍利霍共同治理王国。利霍利霍即卡美哈梅哈二世。卡阿胡马努成为首位库希纳努伊。这个职务在设立之初具有与国王相当的权力，参与分配土地、订立协议和处理司法事务。其职责后来载入一八四〇年宪法，但卡阿胡马努行使这项权力早于成文宪法。利霍利霍前往英国后，她继续掌政。卡乌伊凯奥乌利继位为卡美哈梅哈三世，她又以摄政身份继续治理，直到一八三二年去世。她在卡美哈梅哈一世的宫廷中已经参与政事，继位时宣布共治则使这种影响成为明确的政府职务。她也参与处理王国与考艾岛的关系，并于一八二一年与考艾岛的卡乌穆阿利伊结婚。"
title = "卡阿胡马努"
lang = "zh-CN"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["一八一九年卡美哈梅哈一世去世后，卡阿胡马努宣布与继位的利霍利霍共同治理王国。利霍利霍即卡美哈梅哈二世。卡阿胡马努成为首位库希纳努伊。这个职务在设立之初具有与国王相当的权力，参与分配土地、订立协议和处理司法事务。其职责后来载入一八四〇年宪法，但卡阿胡马努行使这项权力早于成文宪法。利霍利霍前往英国后，她继续掌政。卡乌伊凯奥乌利继位为卡美哈梅哈三世，她又以摄政身份继续治理，直到一八三二年去世。她在卡美哈梅哈一世的宫廷中已经参与政事，继位时宣布共治则使这种影响成为明确的政府职务。她也参与处理王国与考艾岛的关系，并于一八二一年与考艾岛的卡乌穆阿利伊结婚。"]
sections = [{ title = "决定同席而食", paragraphs = ["一八一九年，卡阿胡马努与利霍利霍的母亲凯奥普奥拉尼共同推动终止分隔男女饮食的禁制。夏威夷语称这些规矩为 ʻaikapu，其中也有对某些食物的限制。利霍利霍参加男女同席的宴饮，使这一改变公开化。新的做法被称为 ʻai noa，意思是可以自由同席而食。决定作出后，拥护旧规的人并未全部接受。凯库阿奥卡拉尼组织反抗，他掌管着与先王有关的战神信仰。双方在夏威夷岛科纳的莱凯莱凯交战，凯库阿奥卡拉尼一方落败。这场冲突说明饮食规定关系到宗教权威和治理秩序，撤除这些规定也是一项政治选择。卡阿胡马努后来接受基督教，支持夏威夷语读写教育，也曾下令放弃或拆毁一些旧有宗教设施。传教活动随之扩大。这些变化各有不同的发生时间。最初结束饮食禁制的决定是在王室成员和夏威夷首领之间酝酿并实行的。关于这段历史，夏威夷大学的记述同时强调卡阿胡马努、凯奥普奥拉尼和利霍利霍各自的作用，以及反对这一变化的人所作的选择。州档案记录的职务沿革，则有助于区分她个人的摄政权力与此后逐步成文的制度。"] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.ja]
text = "一八一九年にカメハメハ一世が死去すると、カアフマヌは後を継ぐリホリホ、すなわちカメハメハ二世と統治を分かち合うと宣言した。彼女はクヒナ・ヌイの初代となった。初期のこの職は、土地の配分や協定、裁判について国王に匹敵する権限を持っていた。職務が成文憲法に定められたのは、彼女の死後の一八四〇年である。クヒナ・ヌイの職は彼女の死後も残り、初期には高い位にあった女性の首長たちが受け継いだ。リホリホが英国へ出発した後もカアフマヌは政務を続け、カウイケアオウリがカメハメハ三世になるとその摂政を務めた。一八三二年に死去するまで統治に携わった。また、カウアイ島の統治者カウムアリイと一八二一年に結婚し、王国と同島の関係にも関わった。"
title = "カアフマヌ"
lang = "ja"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["一八一九年にカメハメハ一世が死去すると、カアフマヌは後を継ぐリホリホ、すなわちカメハメハ二世と統治を分かち合うと宣言した。彼女はクヒナ・ヌイの初代となった。初期のこの職は、土地の配分や協定、裁判について国王に匹敵する権限を持っていた。職務が成文憲法に定められたのは、彼女の死後の一八四〇年である。クヒナ・ヌイの職は彼女の死後も残り、初期には高い位にあった女性の首長たちが受け継いだ。リホリホが英国へ出発した後もカアフマヌは政務を続け、カウイケアオウリがカメハメハ三世になるとその摂政を務めた。一八三二年に死去するまで統治に携わった。また、カウアイ島の統治者カウムアリイと一八二一年に結婚し、王国と同島の関係にも関わった。"]
sections = [{ title = "共に食べるという決断", paragraphs = ["一八一九年、カアフマヌとリホリホの母ケオプオラニは、男女が別々に食べることや特定の食物を禁じるアイクプの規則を終わらせるよう働きかけた。リホリホが男女の共にする食事に加わり、規則を破る決断を公のものにした。この変化はアイ・ノアと呼ばれる。すべての首長が賛成したわけではない。先王ゆかりの軍神を守る立場にあったケクアオカラニが抵抗を率いた。その勢力はハワイ島コナのレケレケで敗れた。この争いは、食事のしきたりが宗教的権威と統治に深く結びついていたことを示している。その後カアフマヌはキリスト教を受け入れ、ハワイ語の読み書きの教育を後押しした。古い宗教施設の一部を放棄させ、取り壊しを命じたことも記録されている。食事の改革、摂政としての統治、宗教をめぐる後年の政策は、それぞれ異なる時期の選択だった。ハワイ大学の記述は、改革に関わった二人の女性首長と国王、抵抗した首長たちにそれぞれの役割があったことを伝えている。"] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.ko]
text = "1819년 카메하메하 1세가 사망하자 카아후마누는 후계자인 리홀리호, 곧 카메하메하 2세와 통치권을 나누겠다고 선언했다. 그녀는 초대 쿠히나 누이가 되었다. 이 직책은 초기에는 토지 배분, 협정, 재판과 관련된 결정에서 국왕에 견줄 권한을 가졌다. 직책이 성문 헌법에 명시된 것은 그녀가 죽은 뒤인 1840년이었다. 리홀리호가 영국으로 떠난 뒤에도 카아후마누는 정무를 이어갔으며, 카우이케아울리가 카메하메하 3세가 되자 섭정을 맡았다. 1832년 사망할 때까지 통치에 관여했다. 1821년에는 카우아이섬의 통치자 카우무알리이와 결혼해 왕국과 그 섬의 관계에도 관여했다."
title = "카아후마누"
lang = "ko"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["1819년 카메하메하 1세가 사망하자 카아후마누는 후계자인 리홀리호, 곧 카메하메하 2세와 통치권을 나누겠다고 선언했다. 그녀는 초대 쿠히나 누이가 되었다. 이 직책은 초기에는 토지 배분, 협정, 재판과 관련된 결정에서 국왕에 견줄 권한을 가졌다. 직책이 성문 헌법에 명시된 것은 그녀가 죽은 뒤인 1840년이었다. 리홀리호가 영국으로 떠난 뒤에도 카아후마누는 정무를 이어갔으며, 카우이케아울리가 카메하메하 3세가 되자 섭정을 맡았다. 1832년 사망할 때까지 통치에 관여했다. 1821년에는 카우아이섬의 통치자 카우무알리이와 결혼해 왕국과 그 섬의 관계에도 관여했다."]
sections = [{ title = "함께 먹기로 한 결정", paragraphs = ["1819년 카아후마누와 리홀리호의 어머니 케오푸올라니는 남녀가 따로 먹게 하고 특정 음식을 금하던 아이카푸 규정을 끝내는 데 앞장섰다. 리홀리호가 남녀가 함께하는 식사에 참여하면서 규정을 어기기로 한 결정이 공개되었다. 이 변화는 아이 노아라고 불렸다. 선왕과 관련된 전쟁 신을 지키던 케쿠아오칼라니가 반대 세력을 이끌었다. 그의 군대는 하와이섬 코나 지역의 레켈레케에서 패했다. 이 일은 식사 관습이 종교적 권위와 왕국의 통치에 깊이 연결되어 있었음을 보여 준다. 카아후마누는 이후 기독교를 받아들였고 하와이어 읽기와 쓰기 교육을 지원했다. 일부 옛 종교 시설을 버리거나 철거하도록 한 일도 기록에 남아 있다. 식사 규정을 바꾼 일과 섭정기에 내린 종교 정책은 서로 다른 시기의 결정이었다. 하와이 대학의 기록은 이 변화에 두 여성 지도자와 국왕, 그리고 이에 맞선 추장들이 각각 어떤 역할을 했는지 살핀다."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.ar]
text = "عند وفاة كاميهاميها الأول سنة 1819، أعلنت كاأهومانو أنها ستتقاسم الحكم مع خليفته ليهوليهو، كاميهاميها الثاني. وكانت أول من شغل منصب كوهينا نوي. ومنح المنصب في سنواته الأولى سلطة تماثل سلطة الملك في شؤون الأراضي والاتفاقات والقضاء. وواصلت الحكم وصية على كاويكياولي، كاميهاميها الثالث، حتى وفاتها سنة 1832."
title = "كاأهومانو"
lang = "ar"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["عند وفاة كاميهاميها الأول سنة 1819، أعلنت كاأهومانو أنها ستتقاسم الحكم مع خليفته ليهوليهو، كاميهاميها الثاني. وكانت أول من شغل منصب كوهينا نوي. ومنح المنصب في سنواته الأولى سلطة تماثل سلطة الملك في شؤون الأراضي والاتفاقات والقضاء. وواصلت الحكم وصية على كاويكياولي، كاميهاميها الثالث، حتى وفاتها سنة 1832."]
sections = [{ title = "قرار الأكل معا", paragraphs = ["في سنة 1819 أيدت كاأهومانو وكيوبوولاني إنهاء قيود «آي كابو»، التي فصلت الرجال والنساء عند الأكل وحظرت بعض الأطعمة. وأعلن ليهوليهو القطيعة بمشاركته في وجبة مشتركة. ولقي التغيير المعروف باسم «آي نوا» معارضة قادها كيكواوكالاني، وهزمت قواته في ليكيليكي بمنطقة كونا. وغيرت هذه الأحداث العلاقة بين السلطة الملكية والواجبات الدينية والحياة اليومية في مملكة هاواي. وتوضح مشاركة أكثر من حاكم أن القرار كان جزءا من صراع على شكل الحكم بعد وفاة الملك."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.ru]
text = "После смерти Камеамеа I в 1819 году Каахуману объявила, что разделит власть с его преемником Лихолихо, Камеамеа II. Она первой заняла должность кухина нуи. В первые годы эта должность давала власть, сопоставимую с королевской, в вопросах земли, соглашений и правосудия. Каахуману продолжала править в качестве регента при Кауикеаоули, Камеамеа III, вплоть до своей смерти в 1832 году."
title = "Каахуману"
lang = "ru"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["После смерти Камеамеа I в 1819 году Каахуману объявила, что разделит власть с его преемником Лихолихо, Камеамеа II. Она первой заняла должность кухина нуи. В первые годы эта должность давала власть, сопоставимую с королевской, в вопросах земли, соглашений и правосудия. Каахуману продолжала править в качестве регента при Кауикеаоули, Камеамеа III, вплоть до своей смерти в 1832 году."]
sections = [{ title = "Решение есть вместе", paragraphs = ["В 1819 году Каахуману и Кеопуолани поддержали отмену правил аи капу, разделявших мужчин и женщин за едой и запрещавших некоторые продукты. Лихолихо сделал разрыв с прежним порядком публичным, приняв участие в общей трапезе. Перемена, получившая название аи ноа, встретила сопротивление во главе с Кекуаокалани. Его войска потерпели поражение у Лекелеке в Коне. Эти события изменили связь между королевской властью, религиозными обязанностями и повседневной жизнью Гавайского королевства."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.vi]
text = "Khi Kamehameha I qua đời năm 1819, Kaʻahumanu tuyên bố sẽ chia sẻ quyền cai trị với người kế vị là Liholiho, tức Kamehameha II. Bà là người đầu tiên giữ chức kuhina nui. Trong những năm đầu, chức vụ này có thẩm quyền tương đương nhà vua trong các quyết định về đất đai, thỏa thuận và tư pháp. Kaʻahumanu tiếp tục cai trị với tư cách nhiếp chính cho Kauikeaouli, tức Kamehameha III, đến khi qua đời năm 1832."
title = "Kaʻahumanu"
lang = "vi"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Khi Kamehameha I qua đời năm 1819, Kaʻahumanu tuyên bố sẽ chia sẻ quyền cai trị với người kế vị là Liholiho, tức Kamehameha II. Bà là người đầu tiên giữ chức kuhina nui. Trong những năm đầu, chức vụ này có thẩm quyền tương đương nhà vua trong các quyết định về đất đai, thỏa thuận và tư pháp. Kaʻahumanu tiếp tục cai trị với tư cách nhiếp chính cho Kauikeaouli, tức Kamehameha III, đến khi qua đời năm 1832."]
sections = [{ title = "Quyết định dùng bữa cùng nhau", paragraphs = ["Năm 1819 Kaʻahumanu và Keōpūolani ủng hộ việc chấm dứt các quy định ʻaikapu vốn tách nam nữ khi ăn và cấm một số thức ăn. Liholiho công khai phá lệ khi tham dự một bữa ăn chung. Sự thay đổi, gọi là ʻai noa, vấp phải sự phản đối do Kekuaokalani lãnh đạo. Lực lượng của ông bị đánh bại tại Lekeleke ở Kona. Những sự kiện này thay đổi mối quan hệ giữa quyền lực hoàng gia, nghĩa vụ tôn giáo và đời sống hằng ngày ở Vương quốc Hawaiʻi."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.id]
text = "Ketika Kamehameha I meninggal pada 1819, Kaʻahumanu menyatakan akan berbagi kekuasaan dengan penggantinya, Liholiho, yang menjadi Kamehameha II. Ia menjadi orang pertama yang menjabat sebagai kuhina nui. Pada tahun-tahun awal, jabatan itu memiliki wewenang sebanding dengan raja dalam perkara tanah, perjanjian, dan peradilan. Ia terus memerintah sebagai wali bagi Kauikeaouli, Kamehameha III, hingga wafat pada 1832."
title = "Kaʻahumanu"
lang = "id"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Ketika Kamehameha I meninggal pada 1819, Kaʻahumanu menyatakan akan berbagi kekuasaan dengan penggantinya, Liholiho, yang menjadi Kamehameha II. Ia menjadi orang pertama yang menjabat sebagai kuhina nui. Pada tahun-tahun awal, jabatan itu memiliki wewenang sebanding dengan raja dalam perkara tanah, perjanjian, dan peradilan. Ia terus memerintah sebagai wali bagi Kauikeaouli, Kamehameha III, hingga wafat pada 1832."]
sections = [{ title = "Keputusan makan bersama", paragraphs = ["Pada 1819 Kaʻahumanu dan Keōpūolani mendukung pengakhiran aturan ʻaikapu yang memisahkan laki-laki dan perempuan saat makan serta melarang makanan tertentu. Kehadiran Liholiho dalam jamuan bersama menjadikan perubahan itu terbuka. Perubahan yang disebut ʻai noa ini menghadapi perlawanan pimpinan Kekuaokalani. Pasukannya kalah di Lekeleke, Kona. Peristiwa tersebut mengubah hubungan antara kekuasaan kerajaan, kewajiban keagamaan, dan kehidupan sehari-hari di Hawaiʻi."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.fil]
text = "Pagkamatay ni Kamehameha I noong 1819, ipinahayag ni Kaʻahumanu na makikibahagi siya sa pamamahala ng humalili sa kaniya na si Liholiho, o Kamehameha II. Siya ang unang humawak sa tungkulin ng kuhina nui. Sa mga unang taon, ang tungkulin ay may kapangyarihang maihahambing sa hari sa usapin ng lupa, kasunduan at katarungan. Patuloy siyang namahala bilang rehente ni Kauikeaouli, o Kamehameha III, hanggang sa pagkamatay niya noong 1832."
title = "Kaʻahumanu"
lang = "fil"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Pagkamatay ni Kamehameha I noong 1819, ipinahayag ni Kaʻahumanu na makikibahagi siya sa pamamahala ng humalili sa kaniya na si Liholiho, o Kamehameha II. Siya ang unang humawak sa tungkulin ng kuhina nui. Sa mga unang taon, ang tungkulin ay may kapangyarihang maihahambing sa hari sa usapin ng lupa, kasunduan at katarungan. Patuloy siyang namahala bilang rehente ni Kauikeaouli, o Kamehameha III, hanggang sa pagkamatay niya noong 1832."]
sections = [{ title = "Ang pasyang kumain nang magkakasama", paragraphs = ["Noong 1819, sinuportahan nina Kaʻahumanu at Keōpūolani ang pagwawakas sa ʻaikapu, na naghihiwalay sa mga babae at lalaki sa pagkain at nagbabawal ng ilang pagkain. Naging hayag ang pagbabago nang sumali si Liholiho sa isang salu-salo. Hinarap ng pagbabagong tinawag na ʻai noa ang pagtutol sa pamumuno ni Kekuaokalani. Natalo ang mga puwersa nito sa Lekeleke, sa Kona. Binago ng mga pangyayari ang ugnayan ng pamumuno, relihiyon at pang-araw-araw na buhay sa kaharian."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]

[articles.pt-BR]
text = "Após a morte de Kamehameha I em 1819, Kaʻahumanu declarou que dividiria o governo com seu sucessor Liholiho, Kamehameha II. Foi a primeira a ocupar o cargo de kuhina nui. Nos primeiros anos, o cargo conferia autoridade comparável à do rei em decisões sobre terras, acordos e justiça. Kaʻahumanu continuou a governar como regente de Kauikeaouli, Kamehameha III, até morrer em 1832."
title = "Kaʻahumanu"
lang = "pt-BR"
url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/"
shortArticle = true
intro = ["Após a morte de Kamehameha I em 1819, Kaʻahumanu declarou que dividiria o governo com seu sucessor Liholiho, Kamehameha II. Foi a primeira a ocupar o cargo de kuhina nui. Nos primeiros anos, o cargo conferia autoridade comparável à do rei em decisões sobre terras, acordos e justiça. Kaʻahumanu continuou a governar como regente de Kauikeaouli, Kamehameha III, até morrer em 1832."]
sections = [{ title = "A decisão de comer juntos", paragraphs = ["Em 1819, Kaʻahumanu e Keōpūolani apoiaram o fim do ʻaikapu, que separava homens e mulheres nas refeições e restringia certos alimentos. Liholiho tornou pública a ruptura ao participar de uma refeição conjunta. A mudança, conhecida como ʻai noa, enfrentou a resistência liderada por Kekuaokalani. Suas forças foram derrotadas em Lekeleke, na região de Kona. Os acontecimentos transformaram as relações entre autoridade real, obrigações religiosas e vida cotidiana no Reino do Havaí."] }]
sources = [{ title = "Hawaiʻi State Archives, Kuhina Nui, 1819–1864", url = "https://ags.hawaii.gov/archives/online-exhibitions/centennial-exhibit/kuhina-nui-1819-1864/" }, { title = "University of Hawaiʻi, Ka Hulina Au: The ending of ʻaikapu and the battle of Lekeleke", url = "https://www.hawaii.edu/news/2019/11/04/ka-hulina-au-the-changing-time/" }, { title = "Paul D’Arcy, Transforming Hawaiʻi, ANU Press", url = "https://press-files.anu.edu.au/downloads/press/n4217/html/ch06.xhtml" }, { title = "U.S. National Park Service, Queen Kaʻahumanu", url = "https://www.nps.gov/articles/000/queen-ka-ahumanu.htm" }]
