[articles.en]
text = "Catherine II, known as Catherine the Great, was Empress of Russia from 9 July 1762 until her death in 1796. Before her accession, Catherine had been a royal consort as the wife of Emperor Peter III, whom she overthrew in a coup d'état."
title = "Catherine the Great"
lang = "en"
url = "https://en.wikipedia.org/wiki/Catherine_the_Great"
intro = [
  "Catherine II (born Sophie Auguste Friederike von Anhalt-Zerbst; 2 May 1729 – 17 November 1796), known as Catherine the Great, was Empress of Russia from 9 July 1762 until her death in 1796. Before her accession, Catherine had been a royal consort as the wife of Emperor Peter III, whom she overthrew in a coup d'état. Her reign of over 34 years saw an era of prosperity during the Enlightenment in which many new cities, universities and theatres were established; large-scale immigration from the rest of Europe occurred; and the Russian Empire was recognised as a great power of Europe.",
  "Born a German princess, Catherine married Peter, a grandson of Peter the Great, at the age of 16. Peter became Emperor of Russia in 1762, reigning for seven months before his deposition and possible assassination at the hands of Catherine. During her reign, she often maintained close alliances with noble favourites such as Count Grigory Orlov and Grigory Potemkin. She appointed and worked with several highly successful generals such as Alexander Suvorov and Pyotr Rumyantsev and admirals such as Samuel Greig and Fyodor Ushakov. She governed at a time when the Russian Empire was expanding rapidly by conquest and diplomacy. In the west, she installed her former lover to the throne of Poland, which was eventually partitioned. In the south, the Crimean Khanate was annexed following victories over the Bar Confederation and the Ottoman Empire in the Russo-Turkish War. With the support of Great Britain, Russia colonised the territories of New Russia along the coasts of the Black and Azov seas. In the east, Russians became the first Europeans to colonise Alaska, establishing Russian America.",
  "Many cities and towns were founded on Catherine's orders in the newly conquered lands, most notably Yekaterinoslav, Kherson, Nikolayev, and Sevastopol. An admirer of Peter the Great, Catherine continued to modernise Russia along Western European culture. However, military conscription and the economy continued to depend on serfdom, and the increasing demands of the state and of private landowners intensified the exploitation of serf labour. This was one of the chief reasons behind rebellions, including Pugachev's Rebellion of Cossacks, nomads, peoples of the Volga, and peasants.",
  "The Manifesto on Freedom of the Nobility, issued during the short reign of Peter III and confirmed by Catherine, freed Russian nobles from compulsory military or state service. The construction of many mansions of the nobility in the classical style endorsed by the empress changed the face of the country. She is often included in the ranks of the enlightened despots. Catherine presided over the age of the Russian Enlightenment and established the Smolny Institute of Noble Maidens, the first state-financed higher education institution for women in Europe. Her reign promoted the institutionalisation of provincial administration, and the development of public education, including the establishment a state-organised school system.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Catherine was born on 2 May 1729 as Princess Sophie Auguste Friederike von Anhalt-Zerbst-Dornburg, in the city of Stettin (now known as Szczecin) within the Province of Pomerania in the Kingdom of Prussia. She was delivered in her family's residence in the neoclassical building at the current 1 Farna Street (then Große Domstraße 1), where she resided for the first few years of her life, before her family moved to the Ducal Castle in Stettin. Her mother was Joanna Elisabeth of Holstein-Gottorp. Her father, Christian August, Prince of Anhalt-Zerbst, belonged to the ruling German family of Anhalt. He failed to become the Duke of Courland and Semigallia and, at the time of his daughter's birth, he held the rank of a Prussian general in his capacity as governor of the city of Stettin. However, because her second cousin Charles Peter Ulrich converted to Eastern Orthodox Christianity, her mother's brother, Adolf Frederick, became the heir to the Swedish throne and two of her first cousins, Gustav III and Charles XIII, became Kings of Sweden.",
      "In accordance with the prevailing custom among the ruling dynasties of Germany, she received her education chiefly from a French governess and from tutors. According to her memoirs, Sophie was considered a tomboy and trained herself to master a sword.",
      "Sophie found her childhood to be uneventful; she once wrote to her correspondent Baron Grimm, \"I see nothing of interest in it\". Although Sophie was born a princess, her family had little money; her rise to power was supported by her mother Joanna's wealthy relatives, who were both nobles and royal relations. The more than 300 sovereign entities of the Holy Roman Empire, many of them small and powerless, made for a highly competitive political system in which the various princely families competed for advantages over one another, often by way of political marriages.",
    ] },
  { "title" = "Marriage and succession", "paragraphs" = [
      "The choice of Sophie as wife of the future emperor was a result of the Lopukhina affair, in which Count Jean Armand de Lestocq and King Frederick the Great of Prussia took an active part. The objective was to strengthen the friendship between Prussia and Russia, to weaken the influence of Austria, and to overthrow the chancellor Alexey Bestuzhev-Ryumin, a known partisan of the Austrian alliance on whom the reigning Russian Empress Elizabeth relied. The diplomatic intrigue failed, largely due to the intervention of Sophie's mother, Joanna Elisabeth.",
      "Contemporary and later accounts present Joanna as a figure of strong will and ambition, often involved in court affairs. Her efforts to secure her daughter’s advantageous marriage in Russia brought her into conflict with Empress Elizabeth, who ultimately expelled her from the country amid allegations of espionage on behalf of King Frederick. Elizabeth knew the family well and had intended to marry Joanna's brother, Charles Augustus (Karl August von Holstein). He died of smallpox in 1727 in Saint Petersburg, just before the wedding could take place. Despite Joanna's interference, Elizabeth took a strong liking to Sophie, and Sophie and Peter were eventually married in 1745.",
      "When Sophie arrived in Russia in 1744 at age 15, she spared no effort to ingratiate herself not only with Elizabeth, but also with Elizabeth's lover Alexei Razumovsky and with the Russian people at large. She zealously applied herself to learning the Russian language, rising late at night to repeat her lessons in her bedroom. She became ill with pneumonia, but survived and recovered. In her memoirs, she wrote that she made the decision then to do whatever was necessary and to profess to believe whatever was required of her to become qualified to wear the crown. Although she was able to learn Russian, she spoke with a heavy accent, and made grammatical errors. In most circumstances Catherine II spoke French in her court. In fact the use of French as the main language of the Russian imperial court continued until 1812, when it became politically incorrect to speak French in court due to the French invasion of Russia.",
    ] },
  { "title" = "Reign (1762–1796)", "paragraphs" = [
      "Catherine was crowned at the Assumption Cathedral in Moscow on 22 September 1762. Her coronation marks the creation of one of the main treasures of the Romanov dynasty, the Great Imperial Crown of Russia, designed by Swiss-French court diamond jeweller Jérémie Pauzié. Inspired by Byzantine design, the crown was constructed of two half spheres, one gold and one silver, representing the Eastern and Western Roman Empires, divided by a foliate garland and fastened with a low hoop.",
      "The crown contains 75 pearls and 4,936 Indian diamonds forming laurel and oak leaves, the symbols of power and strength, and is surmounted by a 398.62-carat ruby spinel and a diamond cross. The crown was produced in a record two months and weighed 2.3kg (5.1 lbs). From 1762, the Great Imperial Crown was the coronation crown of all Romanov emperors until the monarchy's abolition in 1917. It is now on display in the Moscow Kremlin Armoury Museum.",
      "One of Catherine's early acts following her accession concerned the rehabilitation of Alexey Bestuzhev-Ryumin, who had been arrested and disgraced during Elizabeth's reign. In a manifesto dated 31 August 1762, Catherine publicly declared his innocence, restored his former ranks and honours, and granted him an annual pension of 20,000 rubles. Although the manifesto acknowledged that Bestuzhev had been unjustly condemned, it did not attribute the injustice to Elizabeth's intentions. Instead, Catherine maintained that the former chancellor had fallen victim to deception and intrigue, contrary to the wishes of the deceased empress.",
    ] },
  { "title" = "Arts and culture", "paragraphs" = [
      "Catherine was a patron of the arts, literature, and education. The Hermitage Museum, which now occupies the whole Winter Palace, began as Catherine's personal collection. The empress was a great lover of art and books, and ordered the construction of the Hermitage in 1770 to house her expanding collection of paintings, sculpture, and books. By 1790, the Hermitage was home to 38,000 books, 10,000 gems, and 10,000 drawings. Two wings were devoted to her collections of \"curiosities\".",
      "She ordered the planting of the first English landscape garden at Tsarskoye Selo in May 1770. In a letter to Voltaire in 1772, she wrote: \"Right now I adore English gardens, curves, gentle slopes, ponds in the form of lakes, archipelagos on dry land, and I have a profound scorn for straight lines, symmetric avenues. I hate fountains that torture water in order to make it take a course contrary to its nature: Statues are relegated to galleries, vestibules etc.; in a word, Anglomania is the master of my plantomania\".",
      "Catherine shared in the general European craze for all things Chinese, and made a point of collecting Chinese art and buying porcelain in the popular Chinoiserie style. Between 1762 and 1766, she had built the \"Chinese Palace\" at Oranienbaum which reflected the chinoiserie style of architecture and gardening. The Chinese Palace was designed by the Italian architect Antonio Rinaldi who specialised in the chinoiserie style. In 1779, she hired the Scottish architect Charles Cameron to build the Chinese Village at Tsarskoye Selo. Catherine had at first attempted to hire a Chinese architect to build the Chinese Village, and on finding that was impossible, settled on Cameron, who likewise specialised in the chinoiserie style.",
    ] },
  { "title" = "Final months and death", "paragraphs" = [
      "Catherine's life and reign included many personal successes, but they ended in two failures. Her Swedish cousin (once removed), King Gustav IV Adolf, visited her in September 1796, the empress's intention being that her granddaughter Alexandra should become queen of Sweden by marriage. A ball was given at the imperial court on 11 September when the engagement was supposed to be announced. Gustav Adolph felt pressured to accept that Alexandra would not convert to Lutheranism, and though he was delighted by the young lady, he refused to appear at the ball and left for Stockholm. The frustration affected Catherine's health. She recovered well enough to begin to plan a ceremony which would establish her favourite grandson Alexander as her heir, superseding her difficult son Paul, but she died before the announcement could be made, just over two months after the engagement ball.",
      "On 16 November [O.S. 5 November] 1796, Catherine rose early in the morning and had her usual morning coffee, soon settling down to work on papers; she told her lady's maid, Maria Perekusikhina, that she had slept better than she had in a long time. Sometime after 9:00 she was found on the floor with her face purplish, her pulse weak, her breathing shallow and laboured. The court physician diagnosed a stroke and despite attempts to revive her, she fell into a coma. She was given the last rites and died the following evening around 9:45. An autopsy confirmed a stroke as the cause of death.",
      "Later, several rumours circulated regarding the cause and manner of her death. The most famous of these rumors is that she died after committing bestiality with her horse. This rumor was widely circulated by satirical British and French publications at the time of her death. In his 1647 book Beschreibung der muscowitischen und persischen Reise (Description of the Muscovite and Persian journey), German scholar Adam Olearius alleged a supposed Russian tendency towards bestiality with horses. This was repeated in anti-Russian literature throughout the 17th and 18th centuries to illustrate the claimed barbarous Asian nature of Russia.",
    ] },
]

[articles.es]
text = "Catalina II de Rusia (en ruso: Екатерина Алексеевна, Ekaterina Alekséyevna), llamada Catalina la Grande (en ruso: Екатерина Великая, Ekaterina Velíkaya; Szczecin (Stettin), Pomerania, Reino de Prusia, ​ actualmente Polonia, 21 de abril de 1729-San Petersburgo, Imperio ruso, 17 de noviembre de 1796 según el calendario gregoriano), fue emperatriz reinante de Rusia durante 34 años, desde el 28 de junio de 1762 hasta su muerte, a los 67 años. Llegó al poder después de derrocar a su marido, Pedro III."
title = "Catalina II de Rusia"
lang = "es"
url = "https://es.wikipedia.org/wiki/Catalina_II_de_Rusia"
intro = [
  "Catalina II de Rusia (en ruso: Екатерина Алексеевна, Ekaterina Alekséyevna), llamada Catalina la Grande (en ruso: Екатерина Великая, Ekaterina Velíkaya; Szczecin (Stettin), Pomerania, Reino de Prusia, ​ actualmente Polonia, 21 de abril de 1729-San Petersburgo, Imperio ruso, 17 de noviembre de 1796 según el calendario gregoriano), fue emperatriz reinante de Rusia durante 34 años, desde el 28 de junio de 1762 hasta su muerte, a los 67 años. Llegó al poder después de derrocar a su marido, Pedro III. Durante su largo reinado, inspirado por las ideas de la Ilustración, Rusia experimentó un renacimiento de la cultura y las ciencias, que condujo a la fundación de muchas nuevas ciudades, universidades y teatros, junto con una inmigración a gran escala desde el resto de Europa y el reconocimiento de Rusia como una de las grandes potencias de Europa.",
  "La vida de Catalina se divide en dos partes, aproximadamente de la misma duración. Entre 1729 y 1762, pasó de ser una princesa alemana a una gran duquesa rusa; a partir de 1762 hasta que falleciera en 1796, fue emperatriz de Rusia. La principal fuente de información sobre su vida personal son sus Memorias,​ escritas en francés.​",
  "Tras ascender al poder y ponerse a gobernar el Imperio, Catalina confió a menudo en sus nobles favoritos, sobre todo el conde Grigori Orlov y Gregorio Potemkin. Con la ayuda de generales de gran éxito, como Alexander Suvórov o Piotr Rumiántsev, y almirantes como Samuel Greig o Fiódor Ushakov, gobernó en una época en la que el Imperio ruso se estaba expandiendo rápidamente por medio de la conquista y la diplomacia. En el sur, el Kanato de Crimea fue anexado tras las victorias sobre la Confederación de Bar y el Imperio otomano en la Guerra ruso-turca. Con el apoyo de Gran Bretaña, Rusia colonizó los territorios de la Nueva Rusia a lo largo de las costas de los mares Negro y Azov. En el oeste, la Mancomunidad de Polonia-Lituania, gobernada por el antiguo amante de Catalina, el rey Estanislao Augusto Poniatowski, fue repartida en varias ocasiones y el Imperio ruso obtuvo la mayor parte. En el este, los rusos se convirtieron en los primeros europeos en colonizar Alaska, estableciendo la América rusa.",
  "Muchas ciudades y pueblos se fundaron por orden de Catalina en las tierras recién conquistadas, sobre todo Yekaterinoslav, Jersón, Nicolaiev y Sebastopol. Catalina, admiradora de Pedro el Grande, continuó modernizando Rusia de acuerdo con las directrices de la Europa occidental. Sin embargo, el servicio militar obligatorio y la economía siguieron dependiendo de la servidumbre, y las crecientes demandas del Estado y de los terratenientes privados intensificaron la explotación del trabajo de los siervos. Esta fue una de las principales razones detrás de las rebeliones, incluida la rebelión de Pugachov de cosacos, nómadas, pueblos del Volga y campesinos.",
]
sections = [
  { "title" = "Primeros años", "paragraphs" = [
      "Catalina nació en Stettin, provincia de Pomerania, Reino de Prusia (actual Szczecin, Polonia). El padre de Catalina, Cristián Augusto, príncipe de Anhalt-Zerbst, era un general prusiano de la familia gobernante alemana de Anhalt, que ejercía de Gobernador de la ciudad de Stettin en nombre del rey de Prusia.​ Su madre era Juana Isabel de Holstein-Gottorp. Aunque nació como Sofía Federica Augusta (Sophie Friederike Auguste von Anhalt-Zerbst, apodada «Figchen»), una princesa alemana de rango menor, Catalina tenía una remota ascendencia sueca relacionada con Carlos IX.​ Debido a que el primo segundo de Sofía, Pedro III, se había convertido al cristianismo ortodoxo, el hermano de su madre llegó a ser el heredero del trono sueco y dos de sus primos hermanos, Gustavo III y Carlos XIII, más tarde llegaron a ser reyes de Suecia.​",
      "De acuerdo con la costumbre imperante por entonces entre las dinastías gobernantes de Alemania, recibió su educación principalmente de una institutriz francesa y de tutores.​ Isabel Babette Cardel era el nombre de la gobernanta francesa que le enseñó a leer, escribir y hablar francés a la pequeña futura emperatriz. Entre otros, le hizo leer a Corneille, Racine y Moliere, cosa que influiría en el futuro. El pastor luterano y capellán castrense, Wagner, complementó estos primeros estudios con clases de religión, geografía e historia.​Según sus memorias, Catalina era considerada una marimacho y había aprendido a dominar la espada.",
      "Aunque Catalina nació princesa, su familia tenía muy poco dinero. Su ascenso al poder fue apoyado por los ricos parientes de su madre Juana, que eran tanto nobles como parientes reales.​ Las más de 300 entidades soberanas del Sacro Imperio Romano Germánico, muchas de ellas bastante pequeñas y sin poder, crearon un sistema político altamente competitivo en el que las diversas familias principescas luchaban por aventajarse una a la otra, a menudo mediante matrimonios políticos.​ Para las familias principescas alemanas más pequeñas, un matrimonio ventajoso era uno de los mejores medios para promover sus intereses, y la joven Catalina fue preparada durante toda su infancia para convertirse en la esposa de un gobernante poderoso con el fin de mejorar la posición de su dinastía. Además de su alemán nativo, Catalina llegó a dominar el francés, la lengua franca de las élites europeas en el siglo XVIII.​ De joven recibió la educación estándar para una princesa alemana del siglo XVIII, concentrándose en la etiqueta, el francés y la teología luterana.​",
    ] },
  { "title" = "Matrimonio y reinado de Pedro III", "paragraphs" = [
      "La elección de Catalina como la futura esposa del zar (Pedro de Holstein-Gottorp) la realizó la emperatriz Isabel I y fue comunicada por carta a la familia cuando la seleccionada contaba 14 años de edad.​La madre de Catalina, Juana Isabel de Holstein-Gottorp, que seguía con interés los asuntos rusos, preveía el matrimonio de su hija con Pedro en fecha próxima. Tras enviar retratos de su hija a la corte rusa, fue invitada a viajar con ella a Rusia en enero de 1744. Influyó en la elección la gestión diplomática entre el conde Lestocq y Federico II de Prusia en el llamado asunto Lopujiná.​ Ambos querían fortalecer la amistad entre Prusia y Rusia para debilitar la influencia de Austria y arruinar al canciller Alekséi Bestúzhev-Ryumin, consejero de la zarina Isabel, que era un conocido partidario de la alianza ruso-austríaca.​ Además, a la emperatriz le gustaba esa familia, ya que ella había estado prometida al tío materno de Catalina, Carlos Augusto de Holstein-Gottorp, que había muerto de viruela en 1727 antes de que se casaran.​​ Asimismo, Catalina era joven y carecía de experiencia política, por lo que posiblemente no representaba mayor peligro para el trono ruso. Por su parte, Catalina, que entonces tenía 14 años, comprendía lo que estaba en juego. Lejos de ignorar el prestigio y el poder asociados a su futuro estatus, hizo caso omiso de las dudas de su madre.",
      "En febrero de 1744, Catalina y su familia fueron recibidos por un gran fasto en Moscú, conociendo a la zarina Isabel I en el palacio de Annenhof, entonces residencia de la familia imperial. Allí mismo le fue concedido el título de Gran Duquesa Catalina Alekseyevna.​",
      "La intriga diplomática casi fracasa, en gran medida debido a la intervención de la madre de Catalina, Juana Isabel, una inteligente y ambiciosa mujer. La imagen histórica de la madre de Catalina ha quedado como la de una mujer emocionalmente fría, así como una trepadora social que amaba las intrigas y los chismes de la corte.​​ Juana estaba tan cegada por la ambición de convertir a su hija en emperatriz de Rusia que logró enfurecer a la zarina Isabel, la cual la obligó a salir del país, acusándola de espiar para el rey de Prusia.​​ No obstante, a Isabel siempre le gustó la hija, y finalmente el matrimonio se celebró en 1745.​",
    ] },
  { "title" = "El golpe de Estado de 1762", "paragraphs" = [
      "Aparte de brindarles tal experiencia gobernando, el matrimonio fracasó debido supuestamente a la impotencia y la inmadurez del gran duque Pedro, que contaba 18 años el día de la boda y no pudo consumarlo durante ocho años.​​​ Tras ocho años de matrimonio (1753), Catalina seguía sin tener hijos. La emperatriz Isabel I, ella misma sin hijos, insistía a su sobrino para que le diera un heredero. Incluso, al parecer, le propuso que tomara como amante al príncipe Lev Alexandrovitch Narychkin (1733-1799) o al conde Sergéi Saltykov. Para entonces, el distanciamiento de la pareja parece ser definitivo y Pedro toma una amante (Yelizaveta Vorontsova),​ mientras que Catalina no duda en replicarle involucrándose con otras figuras prominentes de la corte y manteniendo relaciones con Sergéi Saltykov, Charles Hanbury Williams, Estanislao II Poniatowski y otros hombres a lo largo de su reinado.​​ Pronto ganó popularidad entre varios grupos políticos poderosos que se oponían a su marido. Se hizo amiga de Catalina Dáshkova, la hermana de la amante de su marido, quien le presentó a varios grupos de políticos poderosos que se oponían a él. Sin embargo, Catalina había estado metida en planes militares contra Isabel, desde al menos 1749, con el probable objetivo de deshacerse posteriormente de Pedro III. En 1754 tuvo un hijo, Pablo (1754-1801), cuya paternidad es ambigua.",
      "Aburrida de su marido, Catalina se volvió una ávida lectora de libros, principalmente en francés. Menospreciaba a su marido por la devoción de este a la lectura, por un lado, de «libros de oraciones luteranos, y por el otro, de historia y el juicio de algunos ladrones de caminos que habían sido ahorcados o despedazados en la rueda». Catalina leía mucho y se mantenía informada sobre los acontecimientos de Rusia y del resto de Europa. Fue durante este período cuando leyó por primera vez a Voltaire y otros filósofos de la Ilustración francesa. A medida que iba aprendiendo ruso, se interesó cada vez más por la literatura de su país de adopción. Finalmente, fueron los Anales de Tácito los que provocaron lo que ella llamaba una «revolución» en su mente adolescente, ya que Tácito fue el primer intelectual que leyó que entendía las políticas de poder tal como eran, no como deberían ser. Catalina quedó impresionada especialmente por su argumento de que las personas no actúan por sus profesas razones idealistas y, en cambio, aprendió que era necesario buscar los «motivos ocultos e interesados».​Mantuvo correspondencia con muchas de las mentes prominentes de la época, tales como Voltaire y Diderot.​​",
      "En 1759, Catalina quedó embarazada de su segunda hija, Anna, que sólo vivió 14 meses. Debido a varios rumores sobre la promiscuidad de Catalina, a Pedro se le hizo creer que no era el padre biológico del niño y se sabe que proclamó: «¡Vete al diablo!» cuando Catalina rechazó enojada sus acusaciones. En consecuencia, Catalina pasó gran parte de este tiempo sola en su tocador privado para esconderse de la personalidad abrasiva de Pedro.​ En la primera versión de sus memorias, editadas y publicadas por Aleksandr Herzen, Catalina dio a entender claramente que el verdadero padre de su hijo Pablo no era Pedro, sino Serguéi Saltykov.​",
    ] },
  { "title" = "Reinado (1762-1796)", "paragraphs" = [
      "Catalina fue coronada en la Catedral de la Dormición de Moscú el 22 de septiembre de 1762. Su coronación marca la creación de uno de los principales tesoros de la dinastía Romanov, la Corona Imperial de Rusia, diseñada por el joyero de diamantes de la corte, suizo-francés Jérémie Pauzié. Inspirada en el diseño bizantino, la corona estaba construida con dos medias esferas, una de oro y otra de plata, que representaban los Imperios Romanos de Oriente y Occidente, divididas por una guirnalda foliada y sujetas con un aro bajo.",
      "La corona contiene 75 perlas y 4.936 diamantes indios que forman hojas de laurel y roble, símbolos del poder y la fuerza, y está rematada por una espinela de rubí de 398,62 quilates que perteneció a la emperatriz Isabel I y una cruz de diamantes. La corona se creó en un tiempo récord de dos meses y pesaba 2,3 kg. A partir de 1762, la Gran Corona Imperial fue la corona de coronación de todos los emperadores Romanov hasta la abolición de la monarquía en 1917. Es uno de los principales tesoros de la dinastía Romanov y ahora se exhibe en el Museo de Armería del Kremlin de Moscú.",
      "Tras asumir el control de Rusia, Catalina II revirtió inmediatamente las reformas de Pedro III, devolviendo a la Iglesia ortodoxa toda la tierra que había sido secularizada, devolviendo los viejos uniformes y estructura a los regimientos de la Guardia y cancelando la guerra con Dinamarca.​​",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "En la madrugada del 16 de noviembre de 1796, Catalina II se levantó temprano en la mañana y tomó su café matutino habitual, y pronto se dispuso a trabajar en sus asuntos; le dijo a su doncella, Maria Perekusikhina, que había dormido mejor que en mucho tiempo.​ En algún momento después de las 9:00 a. m. la encontraron en el suelo con la cara violácea, el pulso débil y la respiración entrecortada.​ El médico de la corte le diagnosticó un derrame cerebral (confirmado después en una autopsia)​​ y, a pesar de los intentos de reanimarla, cayó en coma. Se le dieron los últimos ritos y murió la noche siguiente alrededor de las 9:45.​",
      "Fue enterrada con una corona de oro en la cabeza y con un vestido de brocado plateado.​ Sus restos se encuentran en la Catedral de San Pedro y San Pablo de San Petersburgo.",
    ] },
]

[articles.fr]
text = "Catherine II (en russe : Екатерина II) ou Catherine la Grande (Екатери́на Вели́кая), née Sophie Frédérique Augusta d'Anhalt-Zerbst le 2 mai 1729 à Stettin en Poméranie (devenu Szczecin en Pologne) et morte le 17 novembre 1796 à Saint-Pétersbourg, est l'épouse de l'empereur Pierre III. Elle devient impératrice régnante de Russie, du 9 juillet 1762 à sa mort le 17 novembre 1796, à la suite d'un coup d'État contre Pierre III, incarcéré puis exécuté le 17 juillet sur les ordres de Catherine."
title = "Catherine II"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Catherine_II"
intro = [
  "Catherine II (en russe : Екатерина II) ou Catherine la Grande (Екатери́на Вели́кая), née Sophie Frédérique Augusta d'Anhalt-Zerbst le 2 mai 1729 à Stettin en Poméranie (devenu Szczecin en Pologne) et morte le 17 novembre 1796 à Saint-Pétersbourg, est l'épouse de l'empereur Pierre III. Elle devient impératrice régnante de Russie, du 9 juillet 1762 à sa mort le 17 novembre 1796, à la suite d'un coup d'État contre Pierre III, incarcéré puis exécuté le 17 juillet sur les ordres de Catherine.",
  "Prénommée Catherine lors de son baptême orthodoxe, nécessaire avant son mariage avec le prince Pierre, elle devient impératrice consort après l'avènement de celui-ci (5 janvier 1762). Après son coup d'État, elle se fait proclamer « impératrice et autocrate de toutes les Russies ».",
  "Elle règne personnellement sur l'Empire russe. Sous son règne, la Russie connaît une grande expansion territoriale vers l'ouest et le sud (plus de 500 000 km2), notamment à l'occasion des trois partages de la Pologne (1772, 1793 et 1795) et de guerres victorieuses contre l'Empire ottoman.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Sophie Frédérique Augusta d'Anhalt-Zerbst est l'aînée des enfants de Christian-Auguste d'Anhalt-Zerbst et de son épouse Jeanne-Élisabeth de Holstein-Gottorp. Lors de sa naissance, ses parents déplorent qu’elle ne soit pas un garçon.",
      "Membre de la maison d'Anhalt-Zerbst, son père est d'abord officier dans l'armée du royaume de Prusse, un des principaux États du Saint-Empire romain germanique. En 1729, il est commandant de la place de Stettin, résidant au château ducal où sa fille naît. En 1741, il devient gouverneur de la province prussienne de Poméranie ultérieure. En 1742, il hérite de la principauté souveraine d'Anhalt-Zerbst.",
      "Sophie reçoit une éducation protestante, austère et rigide ; entourée de peu d’affection, elle est marquée par une Française huguenote, Babette Cardel, qui dirige son éducation, lui enseignant, outre la langue française, les manières et les coutumes de la société aristocratique dont elle doit faire partie. Mais elle lui donne aussi le goût de la littérature française de son époque. Dès ses onze ans, la princesse se tourne vers des activités intellectuelles, telles que la lecture et les études. Introduite par sa mère dans plusieurs cours allemandes, elle se fait remarquer par son charisme[pas clair].",
    ] },
  { "title" = "Catherine II et le bouddhisme de Bouriatie", "paragraphs" = [
      "Catherine II a admis le bouddhisme, pratiqué par le peuple des Bouriates, qui vivent en Sibérie autour du lac Baïkal, parmi les religions autorisées dans l'Empire.",
      "Les Bouriates la considèrent, ainsi que ses successeurs, comme réincarnation de Tara blanche, divinité associée à la dimension féminine de la compassion.",
      "Cette tradition, qui date peut-être seulement du XIXe siècle, s'est interrompue pendant la période soviétique, avant d'être reprise sous la présidence de Dmitri Medvedev après sa visite en 2009 en Bouriatie.",
    ] },
  { "title" = "Hommages", "paragraphs" = [
      "Statue érigée à Odessa (alors en Russie) en 1900 ; elle est démontée en 1920, lors de la première indépendance de l'Ukraine, réinstallée en 2006[pourquoi ?], et de nouveau démontée en 2022, à la suite de l’invasion de l'Ukraine par la Russie.",
    ] },
  { "title" = "Publications", "paragraphs" = [
      "On a d'elle, en russe, de nombreux écrits, des comédies, le livret L'Administration initiale d'Oleg (ru).",
      "Instructions adressées par sa majesté l'impératrice de toutes les Russies à la commission établie pour travailler à l'exécution d'un projet d'un nouveau code de loix, Yverdon, 1769, disponible sur Google Books.",
      "Code russe ou instructions adressées par sa majesté l'impératrice de toutes les Russies à la commission établie pour travailler à l'exécution d'un projet d'un nouveau code de lois, Amsterdam, 1775, 3e édition.",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "En 2009, un documentaire-fiction, intitulé Catherine II : nuits blanches à Saint-Pétersbourg, lui est consacré dans le cadre de l'émission Secrets d'Histoire.",
      "Elle est mentionnée dans la chanson Alexander the Great vs Ivan the Terrible (« Alexandre le Grand contre Ivan le Terrible ») d'Epic Rap Battles of History (ERB), interprétée par Meghan Tonjes.",
      "Elle apparait dans la comédie musicale The Baddest Bitches in Herstory (deuxième saison de RuPaul's Drag Race: All Stars), où son rôle tenu par Ginger Minj.",
    ] },
]

[articles.de]
text = "Katharina II., genannt Katharina die Große (russisch Екатерина Великая/Jekaterina Welikaja; * 2. Mai 1729 als Sophie Auguste Friederike von Anhalt-Zerbst in Stettin; † 6."
title = "Katharina II."
lang = "de"
url = "https://de.wikipedia.org/wiki/Katharina_II."
intro = [
  "Katharina II., genannt Katharina die Große (russisch Екатерина Великая/Jekaterina Welikaja; * 2. Mai 1729 als Sophie Auguste Friederike von Anhalt-Zerbst in Stettin; † 6. Novemberjul. / 17. November 1796greg. in Sankt Petersburg), war ab dem 9. Juli 1762 Kaiserin von Russland und ab 1793 Herrin von Jever. Sie ist in unserer Zeitrechnung die einzige Herrscherin, der in der Geschichtsschreibung der Beiname die Große verliehen wurde. Katharina II. war eine Repräsentantin des aufgeklärten Absolutismus.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Katharina II. wurde 1729 als Prinzessin Sophie Auguste Friederike von Anhalt-Zerbst (in der Literatur gewöhnlich Sophie oder Sophia von Anhalt-Zerbst genannt) in Stettin geboren. Sie war eine Tochter von Fürst Christian August von Anhalt-Zerbst aus dem Geschlecht der Askanier, der als preußischer General dort Gouverneur war, und von dessen Gemahlin Johanna Elisabeth von Holstein-Gottorf, der jüngeren Schwester von Adolf Friedrich, der 1751 schwedischer König wurde. Somit war Katharina eine Verwandte des neuen schwedischen Herrscherhauses Holstein-Gottorf.",
      "Ihre Kindheit verbrachte sie im Stettiner Schloss, unterbrochen von Besuchen bei ihrer Verwandtschaft u. a. in Braunschweig, Zerbst, Berlin und Varel. 1739 hielt sie sich im Eutiner Schloss auf, wo sie ihrem zukünftigen Gatten erstmals begegnete. Nach dem Tod von Johann August von Anhalt-Zerbst und der dadurch bedingten Regierungsübernahme ihres Vaters Christian August im Jahr 1742 zog die Familie im Dezember 1742 ins Zerbster Schloss.",
      "1743 beschloss Kaiserin Elisabeth Petrowna auf Anraten Friedrichs II., den russländischen Thronfolger Großfürst Peter Fjodorowitsch mit Sophie zu vermählen, seiner Cousine zweiten Grades. Peter Fjodorowitsch wurde 1762 als Peter III. zum ersten Kaiser aus der bis 1917 regierenden Dynastie Romanow-Holstein-Gottorp. Im Januar 1744 begann Sophies Reise von Zerbst nach Russland über Berlin, wo sie Friedrich II. besuchte, Reval und Sankt Petersburg nach Moskau, wo sie im Februar 1744 eintraf. Mit Ehrgeiz und Zielstrebigkeit erlernte die begabte Vierzehnjährige schnell die russische Sprache und versuchte, sich am Hof zu integrieren. Zugleich ließ sie sich im orthodoxen Glauben unterweisen, denn sie sah in dem Glaubenswechsel einen notwendigen Schritt auf ihrem Weg. Ihr Vater, ein tiefgläubiger Lutheraner, war gegen die Konversion. Am 28. Junijul. / 9. Juli 1744greg. wurde Sophie in die Russisch-Orthodoxe Kirche aufgenommen. Damit verbunden war der Namenswechsel, aus Sophie wurde Jekaterina Alexejewna (russisch Екатерина Алексеевна). Den Namen Katharina hatte die regierende Kaiserin Elisabeth zur Erinnerung an ihre Mutter Katharina I. bestimmt. Am gleichen Tag wurde Katharina zur Großfürstin erhoben. Die Verlobung fand am 29. Junijul. / 10. Juli 1744greg. statt und am 21. Augustjul. / 1. September 1745greg. war die Hochzeit. Die Hochzeitsfeierlichkeiten dauerten zehn Tage. Die Ehe war nicht harmonisch. Schon in der Hochzeitsnacht wurde deutlich, dass der Großfürst nur wenig Interesse und Zuneigung für Katharina empfand: Während sie auf ihn im Schlafgemach wartete, kam er spät nachts betrunken von der Feier.",
    ] },
  { "title" = "Innenpolitik", "paragraphs" = [
      "Das Leitbild ihrer Regierung entwickelte Katharina aus Voltaires These, „dass im Jahrhundert der Aufklärung nicht mehr die großen Waffentaten, sondern die Veränderungen der Sitten, die Gesetzgebung, Handel, Gewerbe und Verkehr, Künste und Bildung von der Geschichtsschreibung gewürdigt werden sollen“, die er in seinem",
      "Im Juli 1762, wenige Tage nach dem Staatsstreich, verkündete sie in einem Manifest, wie sie ihr Land regieren wollte:",
      "Schon bald nach ihrer Machtübernahme, am 14. Oktober 1762, erließ Katharina ein Manifest, in dem der Kaiserliche Senat ausdrücklich die Erlaubnis erhielt, Ausländern die Ansiedlung im Land zu gestatten. Da die Veröffentlichung dieses Manifests nicht die erhoffte Resonanz im Ausland hatte, unterschrieb Katharina II. am 22. Juli 1763 ein weiteres Manifest, mit dem sie tausenden deutschen Bauern die Ansiedlung in den Ebenen beiderseits der Wolga ermöglichte. Sie versprach den Siedlern Religionsfreiheit, Steuerfreiheit und das Verfügungsrecht über ihr Land. Das war der Anfang der sogenannten Wolgadeutschen.",
    ] },
  { "title" = "Außenpolitik", "paragraphs" = [
      "Katharina II. baute den Machtbereich Russlands in einem Maße aus wie kein russischer Herrscher vor ihr. In zwei russisch-türkischen Kriegen 1768–1774 sowie 1787–1792 eroberte sie den Zugang zum Schwarzen Meer und weite Küstengebiete. Im Ergebnis der drei Teilungen Polens gewann Russland eine Million km² Landgebiete und sechs Millionen Menschen dazu. Katharinas „Griechisches Projekt“, das heißt die Eroberung Konstantinopels und die Neugründung des Byzantinischen Reiches unter russischer Herrschaft (Griechischer Plan), scheiterte am einseitigen Kriegsaustritt Österreichs im letzten der beiden Türkenkriege Katharinas sowie an der gleichzeitigen Gefahr des Angriffs der Schweden. Dennoch konnten nach der Annexion der Krim 1783 und der Zerschlagung des Krimkhanats weite Teile der heutigen Südukraine als Provinz Neurussland erschlossen und besiedelt werden. Auch auf dem diplomatischen Parkett Europas konnte Katharina II. Erfolge erzielen. Durch ihre Vermittlerrolle im Frieden von Teschen wurde der Bayerische Erbfolgekrieg beendet. Während des Unabhängigkeitskrieges der USA brachte sie eine gegen England gerichtete Koalition für bewaffnete Neutralität zum Schutz des neutralen Handels zustande. Nach dem Tod ihres Bruders Fürst Friedrich August von Anhalt-Zerbst erbte Katharina II. 1793 die Herrschaft Jever, die 1795 noch einmal durch die Zerbster Teilung konkretisiert wurde. Als Statthalterin setzte sie ihre Schwägerin Friederike Auguste Sophie ein.",
      "Im ersten Jahrzehnt von Katharinas Herrschaft entwickelte ihr außenpolitischer Berater Nikita Panin das sogenannte Nordische System, eine Sicherheitsarchitektur rund um die Ostsee. Bündnisse mit England, Dänemark und Preußen sollten ein Gegengewicht gegen das Haus Habsburg und Frankreich aufbauen. Polen und Schweden hingegen sollten in Passivität gehalten werden: 1765 Militärbündnis mit Dänemark; 1767 Vorvertrag mit Dänemark zum 1773 unterzeichneten Vertrag von Zarskoje Selo, der den Dänischen Gesamtstaat begründete und als das größte territoriale Tauschgeschäft Europas im 18. Jahrhundert gilt (das Haus Romanow-Holstein-Gottorp tauschte seine Anteile am Herzogtum Holstein gegen andere Territorien). Der Gottorper Vertrag löst 1768 Hamburg aus der Abhängigkeit vom Herzogtum Holstein, Hamburg wird reichsunmittelbare Stadt. Ein militärisches Bündnis mit England kam zwar nicht zustande, aber 1766 wurde ein Handelsvertrag mit 20-jähriger Laufzeit geschlossen, der es ermöglichte, eine russische Handelsflotte aufzubauen und die britische Dominanz im Ostseehandel einzudämmen.",
      "Der Preußisch-russische Allianzvertrag (1764) hatte eine Stoßrichtung gegen Polen-Litauen. Beide Vertragspartner verpflichteten sich, die chaotischen Verfassungszustände in Polen zu erhalten und bei den bevorstehenden Königswahlen für Stanislaus II. August Poniatowski einzutreten, den Günstling Katharinas II. Im September 1764 wurde Poniatowski zum König von Polen gewählt. Als im Dezember 1764 der Sejm sich in eine Generalföderation umwandelte und sich damit vom Liberum Veto (Einstimmigkeitsprinzip), dem wesentlichen Hebel des russischen Einflusses, befreite, ließ Katharina prorussische Edelleute mobilisieren, die sich unter der Forderung nach Religionsfreiheit im März 1767 mit orthodoxen Dissidenten zur Konföderation von Sluzk bzw. mit protestantischen Dissidenten zur Konföderation von Thorn zusammenschlossen. Daraufhin organisierten sich die Katholiken im Juni 1767 in der Konföderation von Radom. Bei allen drei Konföderationen agierte Katharinas Gesandter Nikolaj Repnin im Hintergrund. In Anwesenheit von 10.000 Mann russischer Truppen in Warschau ließ Repnin im Oktober 1767 einen außerordentlichen Sejm einberufen, den sogenannte Repnin-Sejm. Mit Bestechung und Einschüchterung erreichte er, dass die Abgeordneten im Februar 1768 dem „Ewigen Vertrag“ mit Russland zustimmten, der die Gewährung der vollen staatsbürgerlichen und religiösen Rechte für Protestanten und Orthodoxe sowie eine Bestätigung des Liberum veto im Parlament festschrieb.",
    ] },
  { "title" = "Nachkommen", "paragraphs" = [
      "Pawel (Paul) Petrowitsch (* 20. Septemberjul. / 1. Oktober 1754greg. in Sankt Petersburg; † 12. Märzjul. / 24. März 1801greg. ebenda), war 1762 bis 1773 Herzog von Holstein-Gottorf und von 1796 bis 1801 Kaiser von Russland",
      "Aus der Verbindung mit Grigori Orlow stammen (die Töchter galten offiziell als angenommene Töchter Orlows, Katharinas Mutterschaft ist umstritten):",
      "Natalja Alexejewa (1758–1808), ⚭ 1777 Friedrich von Buxhoeveden (1750–1811), russischer General der Infanterie",
    ] },
]

[articles.it]
text = "Caterina II di Russia (in russo Екатери́на II Алексе́евна?, Ekaterina II Alekseevna; Stettino, 2 maggio 1729 – San Pietroburgo, 17 novembre 1796) conosciuta come Caterina la Grande (in russo Екатери́на Вели́кая?, Ekaterína Velíkaja), fu imperatrice di Russia dal 1762 alla morte. Fu uno dei più significativi esempi di dispotismo illuminato."
title = "Caterina II di Russia"
lang = "it"
url = "https://it.wikipedia.org/wiki/Caterina_II_di_Russia"
intro = [
  "Caterina II di Russia (in russo Екатери́на II Алексе́евна?, Ekaterina II Alekseevna; Stettino, 2 maggio 1729 – San Pietroburgo, 17 novembre 1796) conosciuta come Caterina la Grande (in russo Екатери́на Вели́кая?, Ekaterína Velíkaja), fu imperatrice di Russia dal 1762 alla morte. Fu uno dei più significativi esempi di dispotismo illuminato.",
  "Nata a Stettino come Sofia Augusta Federica di Anhalt-Zerbst (in tedesco Sophie Auguste Friederike von Anhalt-Zerbst), figlia del principe Cristiano Augusto, sovrano del Principato di Anhalt-Zerbst, venne data in sposa, sedicenne, all'erede al trono dell'Impero russo, il granduca Pietro Fëdorovič, futuro Pietro III di Russia. Con un colpo di Stato detronizzò il marito alla fine della guerra dei sette anni. Sotto il suo regno l'Impero russo accrebbe la sua potenza e visse uno dei periodi di maggior riconoscimento a livello europeo.",
  "Volendo applicare al suo metodo di governo i principi illuministi, Caterina promosse la redazione di un nuovo codice ispirato alle idee degli enciclopedisti. Con i propri favoriti, in particolare Grigorij Orlov e a Grigorij Potëmkin, ma anche i generali di grande successo Pëtr Rumjancev e Aleksandr Suvorov, e ammiragli come Fëdor Ušakov, espanse rapidamente l'egemonia russa: a ovest approfittò dello smembramento della Confederazione polacco-lituana, occupando poi, in seguito alle guerre russo-turche, la Crimea; all'estremo est incominciò la colonizzazione dell'Alaska.",
  "Ammiratrice di Pietro il Grande, Caterina continuò a modernizzare la Russia secondo le idee dell'assolutismo illuminato: si interessò ai problemi dell'istruzione, fondando il primo istituto di istruzione superiore femminile in Europa, delle finanze e della creazione di nuove cittadine fondate su suo ordine. Tuttavia la sua politica comportò un aumento del numero dei servi della gleba, con conseguente malcontento popolare e lo scoppio di numerose rivolte, represse violentemente, come quella guidata da Pugačëv.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Sofia Augusta Federica di Anhalt-Zerbst nacque il 2 maggio (21 aprile per gli ortodossi) 1729 a Stettino, in Pomerania, nell'allora Regno di Prussia (attualmente in Polonia). Era figlia di Cristiano Augusto di Anhalt-Zerbst, principe di Anhalt-Zerbst, generale prussiano e governatore di Stettino per conto della Prussia, e di sua moglie, Giovanna di Holstein-Gottorp, una principessa tedesca. Due dei suoi cugini di primo grado divennero sovrani di Svezia: Gustavo III e Carlo XIII.",
      "Secondo il costume tipico dell'epoca presso le famiglie nobili della Germania, ricevette un'educazione accurata e di ottimo livello, in particolare dalla propria governante francese e dai propri tutori. Durante la sua infanzia venne spesso trascurata dalla madre, la quale le preferiva il fratello minore Guglielmo Cristiano Federico, e Caterina soffrì a lungo di questo fatto. Il suo precettore era di fede protestante, ma la giovane Sofia non condivise mai la visione del mondo del suo insegnante.",
      "Fin da bambina si mostrò di carattere vivace, estroverso, animata da una curiosità non comune, con la quale, partecipando ai balli, ai banchetti e ai salotti della nobiltà, sbalordì molti interlocutori. Un episodio, in particolare, spinse la madre a contrastarne il carattere pieno di orgoglio: quando si presentò al cospetto di Federico Guglielmo I di Prussia, la bambina si rifiutò di baciare l'orlo dell'abito del monarca, perché era troppo corto e non riusciva a raggiungerlo.",
    ] },
  { "title" = "Gli amori di Caterina II", "paragraphs" = [
      "Caterina, durante il suo lungo regno, ebbe molti amanti, giungendo spesso a elevarli in posizioni di rilievo per il periodo del loro favore presso la sovrana, per poi pensionarli con doni e grandi magioni. La percentuale del denaro speso per la corte incrementò dal 10,4% del 1767 all'11,4% del 1781 e poi al 13,5% del 1795. Caterina regalò 66 000 schiavi fra il 1762 e il 1772, 202 000 fra il 1773 e il 1793 e 100 000 in un sol giorno, il 18 agosto 1795.",
      "Quando la sua relazione con l'amante e consigliere Grigorij Aleksandrovič Potëmkin terminò nel 1776, questi riuscì addirittura a trovare il suo sostituto per la zarina, uomo che avesse la bellezza fisica e le facoltà mentali per reggerne l'interesse (come Aleksandr Dmitriev-Mamonov e poi Nicholas Alexander Suk). Le storie d'amore di Caterina non si concludevano quasi mai con violenza, anzi la sovrana rimaneva generosa con i suoi ex amanti anche dopo la rottura con loro. Uno dei suoi amanti, Pëtr Zavadovskij, ricevette 50 000 rubli, una pensione di 5 000 rubli e 4 000 schiavi in Ucraina dopo che la zarina l'ebbe scaricato nel 1777. L'ultimo dei suoi amanti, il principe Zubov, aveva 38 anni in meno dell'imperatrice.",
      "Caterina mantenne con sé anche il figlio illegittimo avuto da Grigori Orlov (Aleksej Grigor'evič Bobrinskij, elevato poi al rango di conte da Paolo I) sistemandolo a Tula, lontano dalla corte.",
    ] },
  { "title" = "Discendenza", "paragraphs" = [
      "Dopo due aborti spontanei (il primo il 20 dicembre 1752, che non ebbe conseguenze per la sua salute, e il secondo 30 giugno 1753, da cui impiegò due settimane per riprendersi), Caterina ebbe due figli, Paolo Petrovič (1754-1801) e Anna Petrovna (9 dicembre 1757 – 8 marzo 1759), con i quali non ebbe modo di creare un normale rapporto per via della zarina Elisabetta, che le portò via i bambini appena nati, occupandosene ella stessa nei suoi appartamenti privati.",
      "Data la nota libertà sessuale della zarina la paternità di Paolo è stata data da molti per incerta: egli infatti potrebbe essere stato figlio sia di Pietro III sia di uno degli amanti di Caterina, Sergej Saltykov (che i pettegolezzi di corte volevano essere dietro anche alle prime due gravidanze interrotte di Caterina). Caterina stessa nei suoi diari suggerisce questa possibilità come la più probabile, anche se sembra si ricredette quando, crescendo, Paolo mostrò spiccate somiglianze sia fisiche che caratteriali con il suo padre ufficiale Pietro. Il padre di Anna fu invece con tutta probabilità Stanislao Poniatowski, futuro sovrano polacco, anche se pure in questo caso la paternità ufficiale fu attribuita a Pietro. Anna morì a un anno e mezzo, in concomitanza con la morte della nonna materna, cosa che provocò a Caterina uno shock di diversi giorni, che passò in lacrime, inconsolabile. Ciononostante, non parlò della morte della figlia nelle sue memorie, né sembra che la nominò mai più dopo il funerale. Paolo Petrovič crebbe all'ombra di Elisabetta e non legò mai con la madre: alla sua morte salì al trono come lo zar Paolo I di Russia.",
      "Aleksej Grigor'evič Bobrinskij, creato conte Bobrinskij (11 aprile 1762 - 20 giugno 1813), nacque dalla relazione con il conte Grigorij Grigor'evič Orlov. Sposò la baronessa Anna Dorotea di Ungern-Sternberg ed ebbe quattro figli e una figlia.",
    ] },
  { "title" = "Eredità storica culturale", "paragraphs" = [
      "Lo straordinario personaggio di Caterina di Russia ha dato vita, oltre a numerosi libri e saggi, a decine di opere teatrali (da ricordare la commedia Whom Glory Still Adores, scritta da George Bernard Shaw) e film, incentrati sulla sua vita e sul suo mitico personaggio.",
      "Il lato sessualmente intraprendente del suo carattere, evidente anche nella lunga serie di amanti della zarina, fece nascere molte leggende sulla sua vita privata e nel XX secolo ha affascinato l'attrice Mae West, che negli anni '40, dopo avere tentato invano di portare il personaggio sullo schermo, realizzò uno spettacolo teatrale, dal titolo Catherine Was Great, in cui indossava i panni della tempestosa sovrana.",
    ] },
]

