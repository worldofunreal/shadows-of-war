text = "叶卡捷琳娜二世（俄語：Екатерина II；1729年5月2日—1796年11月17日），通称叶卡捷琳娜大帝（俄語：Екатерина Великая），或依照英文中譯為凱薩琳二世（Catherine II）或凱薩琳大帝（Catherine the Great），俄羅斯女皇（1762年－1796年在位），为皇帝彼得三世之妻，通过政变废黜其夫婿後即位为女皇，其長達34年的統治使她成為俄罗斯帝国史上在位时间最长的君主。在其治下俄罗斯经历复兴，达到顶峰并成为世界大國。 叶卡捷琳娜即位和在位均时常依靠其宠幸贵族的协助，如奥尔洛夫和波将金。在苏沃洛夫、鲁缅采夫和乌沙科夫等将领支持之下，叶卡捷琳娜治下的俄罗斯帝国通过军事及外交迅速扩张。在南方，俄罗斯通过俄土战争击败奥斯曼帝国并击溃克里米亚汗国，对黑海及亚速海的广阔区域进行了殖民（即新俄罗斯）；在西方，叶卡捷琳娜安排情人斯坦尼斯瓦夫·奥古斯特统治的波兰立陶宛联邦被瓜分，俄罗斯获得最大面积的领土；在东部，俄罗斯开始对阿拉斯加进行殖民，其子保罗一世统治时建立俄属北美。 叶卡捷琳娜改革行政区划，诸多新城镇在其令下建立起来。她跟随其所景仰的彼得大帝的步伐，继续根据西欧模式对俄罗斯进行现代化革新，但征兵制及经济仍旧以农奴制为基础，国家及地主的需求越来越依赖于农奴，由此导致了多次叛乱，农民及哥萨克的普加乔夫起义即为一例。 叶卡捷琳娜统治时期被称为“叶卡捷琳娜时代”，通常被认为是俄罗斯帝国及俄罗斯贵族的黄金时代。彼得三世在位时颁布，由叶卡捷琳娜确认延续的《贵族自由宣言》将贵族由强制兵役和国家公务中解放出来。叶卡捷琳娜推动诸多古典主义贵族建筑的建设，改变了俄国的面貌。她热心支持启蒙时代理念，由此获得开明专制君主一称。叶卡捷琳娜亦支持艺术事业，推动了俄罗斯启蒙时期的发展。这一时期所建立斯莫尔尼宫是欧洲首家由国家资助的女性高等教育机构。"
title = "叶卡捷琳娜二世"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%8F%B6%E5%8D%A1%E6%8D%B7%E7%90%B3%E5%A8%9C%E4%BA%8C%E4%B8%96"
intro = [
