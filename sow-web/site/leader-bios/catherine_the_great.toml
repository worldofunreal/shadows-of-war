  "叶卡捷琳娜改革行政区划，诸多新城镇在其令下建立起来。她跟随其所景仰的彼得大帝的步伐，继续根据西欧模式对俄罗斯进行现代化革新，但征兵制及经济仍旧以农奴制为基础，国家及地主的需求越来越依赖于农奴，由此导致了多次叛乱，农民及哥萨克的普加乔夫起义即为一例。",
  "叶卡捷琳娜统治时期被称为“叶卡捷琳娜时代”，通常被认为是俄罗斯帝国及俄罗斯贵族的黄金时代。彼得三世在位时颁布，由叶卡捷琳娜确认延续的《贵族自由宣言》将贵族由强制兵役和国家公务中解放出来。叶卡捷琳娜推动诸多古典主义贵族建筑的建设，改变了俄国的面貌。她热心支持启蒙时代理念，由此获得开明专制君主一称。叶卡捷琳娜亦支持艺术事业，推动了俄罗斯启蒙时期的发展。这一时期所建立斯莫尔尼宫是欧洲首家由国家资助的女性高等教育机构。",
]
sections = [
  { "title" = "早年", "paragraphs" = [
      "1729年5月2日，叶卡捷琳娜二世出生于普魯士波美拉尼亚斯德丁，与俄罗斯留里克王朝有着血缘联系。她原名安哈尔特-采尔布斯特-多恩堡的索菲·弗雷德里克·奥古斯塔（Sophie Friederike Auguste von Anhalt-Zerbst-Dornburg）。她的父亲克里斯蒂安·奧古斯特属于统治安哈尔特的德意志王室，这在当时并不是一个显赫的公国。克里斯蒂安·奥古斯特是普魯士軍隊中的一位將軍，负责管理斯德丁（今波兰什切青）。蘇菲亞有两位表弟是瑞典国王：古斯塔夫三世和卡尔十三世。出于德意志王室的传统，蘇菲亞的早期教育主要来自法国家庭教师。蘇菲亞的童年波澜不惊，她曾对自己的同伴格林姆男爵（Baron Grimm）说过：「我从中看不到任何趣味。」尽管蘇菲亞身为公主，但她的家庭其实并不富裕，是她母亲既富且贵的王室亲戚在支持她。",
    ] },
  { "title" = "与彼得的婚姻", "paragraphs" = [
      "1742年，蘇菲亞的遠房表哥，霍爾斯坦公爵卡尔·彼得·乌尔里希，也就是俄皇彼得一世的外孫，被他的姨母，當時的俄皇伊丽莎白選中，成為俄羅斯帝國的儲君。普魯士國王腓特烈二世和莱斯托克伯爵进而谋划联姻，以此推翻俄奥联盟的代理人，女皇所信赖的大宰相贝斯图佐夫，进而加强俄普合作。在腓特烈二世的安排下，1742年冬天，安哈特公爵夫人帶著蘇菲亞來到柏林覲見腓特烈二世。腓特烈對蘇菲亞公主感到滿意，認為她可以成為俄羅斯皇儲的妻子，於是請來最好的法國畫師為蘇菲亞公主畫一幅肖像畫，然後把這幅肖像送到聖彼得堡供女皇過目。安哈爾特公爵一家等待足足一年。在這一年裡，聖彼得堡的俄羅斯宮廷反復研究各種聯姻方案，最終選擇落在安哈特公國的蘇菲亞·奧古斯特公主身上。",
      "1744年1月，來自聖彼得堡的信使帶來了伊莉莎白女皇的一封信，邀請安哈特公爵夫人喬安娜和蘇菲亞公主前往俄羅斯做客，同時帶來的還有一張為數一萬盧布的支票，作為公爵夫人母女倆人在路上的開銷。雖然信中沒有寫明邀請的目的，但安哈特公爵一家都清楚這是什麼意思—伊莉莎白女皇選中了蘇菲亞做太子妃。",
      "1744年2月9日，蘇菲亞公主抵達莫斯科。伊莉莎白女皇對安哈特公爵夫人母女給予熱情招待。然而整场外交努力却差点因为蘇菲亞的母亲乔安娜·伊丽莎白一败涂地。据记载她是一位薄情寡恩，出口成「脏」的女人，热衷于流言蜚语和宫廷密谋，一心沉迷于女儿将成为俄罗斯皇后的虚荣之中，最终触怒伊丽莎白女皇。女皇最终以间谍为名将其驱逐出境。事实上女皇非常了解蘇菲亞一家，她原本是要和乔安娜的哥哥卡尔·奥古斯特·冯·霍尔斯坦在1727年结婚的，但新郎在婚礼举行前卻因罹患天花而病逝。",
    ] },
  { "title" = "彼得三世与1762年7月政变", "paragraphs" = [
      "彼得非常崇拜普鲁士国王腓特烈二世。当时俄普正在七年战争中为敌，彼得继位后，不仅下令停止与普鲁士为敌，还将包括柏林在内的大片所占领土归还腓特烈二世。此外，彼得还介入荷尔斯泰因公国与丹麦的石勒苏益格争端。其偏袒普鲁士的政策与古怪脾氣引得贵族和军队非常不满，他们很快在叶卡捷琳娜周围团结，形成了一个政治团体。",
      "1762年7月，在继位六个月后，彼得与自己荷尔斯泰因的朝臣和亲属前往奥拉宁鲍姆度假，而把叶卡捷琳娜留在了圣彼得堡。7月8日晚（旧历6月27日），叶卡捷琳娜得知彼得逮捕了她的一位同谋，先前的计划必须马上实施。叶卡捷琳娜离开宫殿，前往近卫军团处发表演讲，号召士兵保护自己。叶卡捷琳娜随后与近卫军团前往赛摩诺维斯基兵营，在那里接受僧侶的祝福，成为全俄罗斯君主。叶卡捷琳娜随后逮捕了彼得，强迫他签订退位诏书。政变八天之后的7月17日，彼得三世在罗普恰死于阿列克谢·格里戈里耶维奇·奥尔洛夫（格里高利·奥尔洛夫之弟，随后亦成为女皇宫廷宠臣）之手。历史学家并未发现叶卡捷琳娜本人与谋杀的关联。",
      "彼得三世倒台后，俄罗斯当时还存在着其他潜在的皇位竞争者：自六个月大起就一直被拘禁在拉多加湖的什利谢利堡的伊凡六世（1740-1764）；以及塔拉坎诺娃女公爵。伊凡六世最终死于1764年在一次未成功的营救政变。因为叶卡捷琳娜和伊丽莎白女皇一样曾下令，如果有人尝试营救伊凡六世，就将其处决。伊凡因为多年的监禁，已经失去了理智，即便身为傀儡，他也无法勝任。而塔拉坎诺娃女公爵于1775年被叶卡捷琳娜派人以诱骗的方式绑架至圣彼得堡，同年年底病死在彼得保罗要塞的地牢里。",
    ] },
  { "title" = "执政", "paragraphs" = [
      "1762年6月28日，叶卡捷琳娜在情人格里高利·奥尔洛夫的帮助下召集支持她的军队在圣彼得堡宣称自己为全俄罗斯的女皇叶卡捷琳娜二世，并任命长子保罗为继承人。9月22日，叶卡捷琳娜正式于莫斯科加冕。叶卡捷琳娜的加冕礼是罗曼诺夫王朝第一次使用俄罗斯帝国冠冕。这件由瑞士珠宝匠拉赫米·波杰设计的珍宝受到东罗马帝国皇冠的启发，由金银两个半球组成，象征东、西罗马帝国。帝国冠冕中间分开东西半球的桂冠上是75颗钻石和4,936颗印度钻石组成的月桂和橡树叶。桂冠顶还有一个钻石十字架和一颗重达398.62克拉的红宝石。",
      "尽管帝国冠冕耗费甚巨，但拉赫米·波杰仅用了两个月就完成了这件杰作，最终成品也只重2.3千克。自叶卡捷琳娜二世起，直到最后一位皇帝尼古拉二世，所有的俄罗斯皇帝都在冠冕礼上戴着帝国冠冕。帝国冠冕现藏于莫斯科克里姆林宫军械库。",
      "在叶卡捷琳娜统治期间，俄罗斯帝国向南、向西扩张，从奥斯曼帝国和波兰立陶宛联邦手中将包括新俄罗斯、克里米亚、北高加索、右岸乌克兰、白俄罗斯、立陶宛和库尔兰在内的大片领土纳入囊中。叶卡捷琳娜总计为俄罗斯增加了20万平方英里（52万平方公里）的土地。",
    ] },
  { "title" = "最终岁月", "paragraphs" = [
      "叶卡捷琳娜一生历经无数成功和荣耀，但行近终点的时候命运却开始展现残酷的另一面。1796年9月，瑞典国王古斯塔夫四世·阿道夫前来圣彼得堡拜访她。女皇希望能把自己的孙女亚历山德拉嫁给瑞典国王，于9月11日在宫廷内召开了盛大的舞会，打算届时宣布两人订婚的消息。但古斯塔夫·阿道夫知道亚历山德拉不会改信路德宗，拒绝订婚，没有出席舞会，回到了斯德哥尔摩。叶卡捷琳娜为此大发雷霆，健康也受到了影响。她本打算让钟爱的孙子亚历山大一世越过不成器的儿子保罗一世直接继位。但这场舞会严重损害了她的健康，两个月后就因中风去世，最终没能实现自己的计划。",
      "1796年11月16日（俄曆11月5日），叶卡捷琳娜起得很早，照常用早餐、喝咖啡，伏案工作。她的侍女玛利亚·佩罗库斯金娜询问女皇的睡眠品質，叶卡捷琳娜回答她自己已经很长时间没睡得这么香了。上午九点左右，叶卡捷琳娜前往更衣室，入厕时突发中风。察觉到女皇失踪之后，侍者扎卡·佐托夫冲进房间，发现叶卡捷琳娜倒在地上，面色青紫，脉搏微弱，呼吸迟缓。仆人们将叶卡捷琳娜送回房间。四十五分钟后，御医苏格兰人约翰·罗杰森赶到，诊断结果是突发中风。尽管进行了种种尝试，但女皇还是陷入了无法苏醒的休克。临终圣事举行之后，叶卡捷琳娜二世在当天晚間九點四十五分左右崩逝於俄羅斯聖彼得堡市普希金市沙皇村，享壽六十七歲，結束了長達三十四年的統治。次日的尸检结果证明死因确是中风。",
      "叶卡捷琳娜曾于1792年命秘书亚历山大·瓦西利维奇·科拉波维特斯基记录遗嘱，其中详细描述了女皇自己的葬礼安排：“寿衣应为白裙，头上应有金冠，上刻朕的教名。丧期最长六个月，越短越好。”女皇最终入殓时头戴金冠，身着银色织锦长裙。11月25日，金绣装饰的棺椁放在安东尼奥·里纳尔迪设计的大厅中供人瞻仰。伊丽莎白·维杰·勒布伦的回忆录记载了葬礼的细节：“女皇的遗体在富丽堂皇的房间里停灵六周，长明灯日夜不息。女皇的周围是俄国所有城镇的纹章。她戴着面纱，金发披着。来凭吊的贵妇亲吻她的双手——或者至少尝试这么做。”叶卡捷琳娜女皇最後安葬于圣彼得堡的彼得保罗大教堂內。",
    ] },
]

[articles.ja]
text = "エカチェリーナ2世（エカチェリーナ2世アレクセーエヴナ、ロシア語: Екатерина II Алексеевна, ラテン文字転写: Yekaterina II Alekseyevna （イカチリーナ・フタラーヤ・アレクセーエヴナ）、1729年4月21日（ロシア暦）/5月2日（グレゴリオ暦） - 1796年11月6日（ロシア暦）/11月17日（グレゴリオ暦））は、ロマノフ朝第8代ロシア皇帝（女帝）。在位は1762年6月28日（ロシア暦）/7月9日（グレゴリオ暦） - 1796年11月6日（ロシア暦）/11月17日（グレゴリオ暦）。夫は第7代皇帝ピョートル3世ならびにグリゴリー・ポチョムキン（秘密結婚）、子は第9代皇帝パーヴェル1世ほか。ドイツ語では「カトリーナ2世（Katharina II）」英語では「キャサリン2世（Catherine II.）」 とも呼ばれる。 プロイセンのフリードリヒ2世（大王）やオーストリアのヨーゼフ2世と共に啓蒙専制君主の代表とされる。ロシア帝国の領土をポーランドやウクライナに拡大し、大帝（ヴェリーカヤ、Вели́кая）と称される。 帝政時代にロシア帝国国立銀行が発行していた100ルーブル紙幣の肖像に描かれていたほか、沿ドニエストル共和国の国立銀行が発行する500沿ドニエストル・ルーブルにも描かれていた。"
title = "エカチェリーナ2世 (ロシア皇帝)"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%A8%E3%82%AB%E3%83%81%E3%82%A7%E3%83%AA%E3%83%BC%E3%83%8A2%E4%B8%96_%28%E3%83%AD%E3%82%B7%E3%82%A2%E7%9A%87%E5%B8%9D%29"
intro = [
  "エカチェリーナ2世（エカチェリーナ2世アレクセーエヴナ、ロシア語: Екатерина II Алексеевна, ラテン文字転写: Yekaterina II Alekseyevna （イカチリーナ・フタラーヤ・アレクセーエヴナ）、1729年4月21日（ロシア暦）/5月2日（グレゴリオ暦） - 1796年11月6日（ロシア暦）/11月17日（グレゴリオ暦））は、ロマノフ朝第8代ロシア皇帝（女帝）。在位は1762年6月28日（ロシア暦）/7月9日（グレゴリオ暦） - 1796年11月6日（ロシア暦）/11月17日（グレゴリオ暦）。夫は第7代皇帝ピョートル3世ならびにグリゴリー・ポチョムキン（秘密結婚）、子は第9代皇帝パーヴェル1世ほか。ドイツ語では「カトリーナ2世（Katharina II）」英語では「キャサリン2世（Catherine II.）」 とも呼ばれる。",
  "プロイセンのフリードリヒ2世（大王）やオーストリアのヨーゼフ2世と共に啓蒙専制君主の代表とされる。ロシア帝国の領土をポーランドやウクライナに拡大し、大帝（ヴェリーカヤ、Вели́кая）と称される。",
  "帝政時代にロシア帝国国立銀行が発行していた100ルーブル紙幣の肖像に描かれていたほか、沿ドニエストル共和国の国立銀行が発行する500沿ドニエストル・ルーブルにも描かれていた。",
]
sections = [
  { "title" = "生涯", "paragraphs" = [
      "1729年4月21日（ロシア暦）/5月2日（グレゴリオ暦）、北ドイツ（現在はポーランド領）ポンメルンのシュテッティンで神聖ローマ帝国領邦君主アンハルト＝ツェルプスト侯クリスティアン・アウグスト（プロイセン軍少将）の娘として生まれた。キリスト教ルター派の洗礼を受け、ゾフィー・アウグステ・フリーデリケ（Sophie Auguste Friederike）と名づけられた。",
      "母のヨハンナ・エリーザベトは、デンマーク王家オルデンブルク家の分家でやはり北ドイツの小邦領主であるホルシュタイン＝ゴットルプ家出身であったが、次兄アドルフ・フレドリクは後にスウェーデンの王位を継承した。弟が2人で、上の弟は12歳で死亡、下の弟フリードリヒ・アウグストは後にアンハルト＝ツェルプスト侯領を継ぐ。",
      "ゾフィーは2歳の時からフランス人ユグノーの家庭教師に育てられ、特に2番目の家庭教師バベ・カルデル嬢にはロシアへ行くまで教えを受けた。その結果、フランス語に堪能で合理的な精神を持った少女に育つ。乗馬も達者だったが、音楽は苦手。美貌と言えるほどの器量の持ち主ではなかったが、生来の優れた頭脳を活かし、知性や教養を磨いて魅力的で美しい女性となる努力を重ねた。本来、家柄的にはとても大国の后妃候補に挙がる身分ではなかったが、母ヨハンナの早世した長兄カール・アウグストがロシア女帝エリザヴェータ・ペトロヴナの若かりしころの婚約者であった縁もあり、ゾフィーは14歳でロシア皇太子妃候補となる。",
    ] },
  { "title" = "称号", "paragraphs" = [
      "1729年4月21日（ロシア暦）/5月2日（グレゴリオ暦） – 1745年8月10日（ロシア暦）/8月21日（グレゴリオ暦）侯女殿下 ゾフィー・アウグスタ・フレデリーケ・アンハルト＝ツェルプスト侯女",
      "1745年8月10日（ロシア暦）/8月21日（グレゴリオ暦） – 1761年12月25日（ロシア暦）/1762年1月5日（グレゴリオ暦）皇太子妃殿下 エカチェリーナ・アレクセーエヴナ大公妃",
    ] },
  { "title" = "人物", "paragraphs" = [
      "ロシアの文化・教育の整備にも力を注ぎ、英邁の誉れ高い女性側近ダーシュコワ夫人をアカデミー長官に据え、ロシア語辞典の編纂事業に着手し、後世のロシア文学発展の基盤を造る。ボリショイ劇場や離宮エルミタージュ宮殿（現在の小エルミタージュのこと。後に隣接する冬宮など新旧の宮殿と合わせ、現在はエルミタージュ美術館として一般公開）の建設にも熱心であった。また、女子貴族のための学校「スモーリヌィ女学院」を設立し、ヨーロッパ諸国の宮廷・社交界に送り込む貴婦人の養成にも力を入れた。エカチェリーナ2世自身も文筆に勝れ、回想録、書簡、童話、戯曲などの文芸作品を残している。",
      "その一方、晩年になって革命勢力への警戒心から民間の文化活動を監視するようになる。その一例としてロシア初の諷刺雑誌を刊行し、啓蒙主義者として数えられるニコライ・ノヴィコフを1792年に逮捕させ、1796年までペトロ・パヴロフスク要塞に投獄したことが挙げられる。",
      "私生活の面では生涯に約10人の公認の愛人を持ち、数百ともいわれる愛人を抱え、夜ごとに人を変えて寝室をともにしたとする伝説もある。孫のニコライ1世には「玉座の上の娼婦」とまで酷評される始末であった。",
    ] },
  { "title" = "日本人が見たエカチェリーナ2世", "paragraphs" = [
      "1783年、伊勢白子（現在の三重県鈴鹿市）の船頭である大黒屋光太夫は、江戸への航海途中に漂流し、アリューシャン列島のアムチトカ島に漂着。その後ロシア人に助けられ、シベリアの首府イルクーツクに滞在した。ここで学者のキリル・ラックスマンの援助で、帰国請願のためサンクト・ペテルブルクに向かい、1791年、エカチェリーナ2世に拝謁して、帰国の儀を聞き届けられている。",
      "キリルの次男アダム・ラックスマンが、江戸幕府の統治下で鎖国状態を続けてきた日本に対して、大黒屋光太夫および小市、磯吉の三名を返還すると同時に、シベリア総督の通商要望の信書を手渡すために、遣日使節として日本に派遣され、1792年、光太夫らは蝦夷地の根室（現在の北海道根室市）に帰着した。",
      "1803年にはアレクサンドル1世（エカチェリーナ2世の孫）に、津太夫ら若宮丸乗組員10名の日本人が拝謁したが、その際の通訳を新蔵（大黒屋光太夫と共にアムチトカ島に漂着したがロシアに帰化）が行っている。",
    ] },
  { "title" = "現代における評価", "paragraphs" = [
      "エカテリーナ2世時代に露土戦争での獲得地に建設された、ウクライナの港湾都市オデーサに建てられていたエカテリーナ2世像は、2022年ロシアのウクライナ侵攻に伴う反露感情の高まりを受けて、同年12月28日夜から翌日未明にかけて撤去された。エカテリーナ2世を含めたロシア帝国に思い入れを持ち、ウクライナ侵攻を発動したロシア連邦大統領ウラジーミル・プーチンは同年10月、この像は「ウクライナの過激な民族主義者すら撤去しようとしない」と牽制していた。",
    ] },
  { "title" = "関連書籍", "paragraphs" = [
      "新版『女帝エカテリーナ』中公文庫 上・下、1985年。改版 中公文庫BIBLIO、2002年6月。ISBN 978-4-12-204044-1, 978-4-12-204045-8。",
      "小野理子『不思議な恋文 - 女帝エカテリーナとポチョムキンの往復書簡 - 』東洋書店〈ユーラシア・ブックレット No.23〉、2001年11月。ISBN 978-4-88595-363-7。",
      "小野理子・山口智子共著『恋文 - 女帝エカテリーナ二世 発見された千百六十二通の手紙 - 』アーティストハウスパブリッシャーズ、2006年10月。ISBN 978-4-86234-054-2。2006年に日本テレビ系列で放送されたドキュメンタリー番組「女帝エカテリーナ〜愛のエルミタージュ〜」の関連本。",
    ] },
]

[articles.ru]
text = "Екатери́на II Алексе́евна, Екатери́на Вели́кая, урождённая Софи́я Авгу́ста Фредери́ка А́нгальт-Це́рбстская (нем. Sophie Auguste Friederike von Anhalt-Zerbst-Dornburg; 21 апреля [2 мая] 1729, Штеттин, Пруссия — 6 [17] ноября 1796, Зимний дворец, Санкт-Петербург, Российская империя) — царствующая императрица Всероссийская с 1762 года, единственный представитель немецкого дома Асканиев на русском престоле, государственная деятельница и меценат, одна из самых знаменитых женщин эпохи Просвещения."
title = "Екатерина II"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%95%D0%BA%D0%B0%D1%82%D0%B5%D1%80%D0%B8%D0%BD%D0%B0_II"
intro = [
  "Екатери́на II Алексе́евна, Екатери́на Вели́кая, урождённая Софи́я Авгу́ста Фредери́ка А́нгальт-Це́рбстская (нем. Sophie Auguste Friederike von Anhalt-Zerbst-Dornburg; 21 апреля [2 мая] 1729, Штеттин, Пруссия — 6 ноября 1796, Зимний дворец, Санкт-Петербург, Российская империя) — царствующая императрица Всероссийская с 1762 года, единственный представитель немецкого дома Асканиев на русском престоле, государственная деятельница и меценат, одна из самых знаменитых женщин эпохи Просвещения.",
  "Будучи дочерью владетельного князя Ангальт-Цербстского, Екатерина взошла на престол в результате дворцового переворота против своего мужа — Петра III, вскоре погибшего при невыясненных обстоятельствах (возможно, он был убит). Она взошла на престол, следуя прецеденту, созданному Екатериной I, сменившей своего умершего мужа Петра Великого в 1725 году.",
  "Екатерининская эпоха ознаменовалась максимальным закрепощением крестьян и всесторонним расширением привилегий дворянства.",
  "При Екатерине Великой границы Российской империи были значительно сдвинуты на запад (разделы Польши) и юг (присоединение Новороссии, Крыма, отчасти Кавказа). Были созданы условия для свободной деятельности всех конфессий; положение староверов (раскольников) было облегчено.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "София Фредерика Августа Ангальт-Цербстская родилась 21 апреля (2 мая) 1729 года в немецком городе Штеттине — столице Померании (ныне — Щецин, Польша), в доме № 791 на Домштрассе (нем. Domstraße).",
      "Отец Кристиан Август Ангальт-Цербстский происходил из цербст-дорнбургской линии Ангальтского дома и состоял на службе у прусского короля, был полковым командиром, комендантом, затем губернатором города Штеттина, где будущая императрица и появилась на свет, баллотировался в курляндские герцоги, но неудачно, службу закончил прусским фельдмаршалом. Мать — Иоганна Елизавета, из Готторпского владетельного дома, четвёртая дочь князя Гольштейн-Готторпского, после смерти отца воспитывалась при дворе своего дяди, владетельного князя Брауншвейга. Родословная Иоганны Елизаветы восходит к Кристиану I, королю Дании, Норвегии и Швеции, первому герцогу Шлезвиг-Гольштейнскому и основателю династии Ольденбургов.",
      "Дядя по материнской линии Адольф-Фридрих был в 1743 году избран в наследники шведского престола, на который он вступил в 1751 году под именем Адольфа-Фредрика. Другой дядя, Карл Эйтинский, по замыслу Екатерины I, должен был стать мужем её дочери Елизаветы, однако умер от оспы в преддверии свадебных торжеств в Санкт-Петербурге.",
    ] },
  { "title" = "Характеристики правления", "paragraphs" = [
      "Приверженность Екатерины идеям Просвещения в значительной мере предопределила то, что для характеристики внутренней политики екатерининского времени часто используется термин «просвещённый абсолютизм». Некоторые идеи Просвещения она действительно воплотила в жизнь. Так, по мнению Екатерины, основанному на трудах французского философа Монтескьё, обширные российские пространства и суровость климата обусловливают закономерность и необходимость самодержавия в России. Исходя из этого, при Екатерине происходило укрепление самодержавия, усиление бюрократического аппарата, централизации страны и унификации системы управления. Однако идеи, высказанные Дидро и Вольтером, приверженцем которых на словах она являлась, не соответствовали её внутренней политике. Они отстаивали мысль о том, что каждый человек рождается свободным, и выступали за равенство всех людей и устранение средневековых форм эксплуатации и деспотических форм государственного управления. Вопреки этим идеям при Екатерине происходило дальнейшее ухудшение положения крепостных крестьян, усиливалась их эксплуатация, росло неравенство вследствие предоставления ещё больших привилегий дворянству. В целом историки характеризуют её политику как «продворянскую» и полагают, что, вопреки частым высказываниям императрицы о её «неусыпной заботе о благе всех подданных», понятие общего блага в эпоху Екатерины являлось такой же фикцией, как и в целом в России XVIII века.",
      "Вскоре после переворота государственный деятель Н. И. Панин предложил создать Императорский совет: шесть или восемь высших сановников правят совместно с монархом (как кондиции 1730 года). Екатерина отвергла этот проект.",
      "По другому проекту Панина был преобразован Сенат — 15 (26) декабря 1763 года он был разделён на шесть департаментов, возглавляемых обер-прокурорами, во главе становился генерал-прокурор. Каждый департамент имел определённые полномочия. Общие полномочия Сената были сокращены: в частности, он лишился законодательной инициативы и стал органом контроля за деятельностью государственного аппарата и высшей судебной инстанцией. Центр законотворческой деятельности переместился непосредственно к Екатерине и её кабинету со статс-секретарями.",
    ] },
  { "title" = "Личная жизнь", "paragraphs" = [
      "Для комфортабельного перемещения по стране Екатерина обустроила сеть путевых дворцов вдоль дороги из Петербурга в Москву (от Чесменского до Петровского) и лишь в конце жизни занялась возведением новой загородной резиденции в Пелле (не сохранилась). Кроме того, её заботило отсутствие просторной и современной резиденции в Москве и её окрестностях. Хотя она бывала в старой столице не часто, Екатерина на протяжении ряда лет лелеяла планы перестройки Московского Кремля, а также строительства пригородных дворцов в Лефортове, Коломенском и Царицыне. По разным причинам ни один из этих проектов не был доведён до конца.",
      "Екатерина II имела многочисленных любовников список которых, составленный писателем М. Н. Лонгиновым и опубликованный историком Петром Бартеневым в журнале «Русский архив» за период с 1753 по 1796 год, то есть за 43 года, насчитывает 15 человек. Самыми известными из них были Сергей Салтыков, Григорий Орлов, конной гвардии поручик Васильчиков, Григорий Потёмкин, гусар Семён Зорич, Александр Ланской; последним фаворитом был корнет Платон Зубов, ставший генералом. С Потёмкиным, по некоторым данным, Екатерина была тайно обвенчана (1775, см. Свадьба Екатерины II и Потёмкина). После 1762 года она планировала брак с Орловым, однако по советам приближённых отказалась от этой идеи.",
      "Любовные связи Екатерины отмечены чередой скандалов. Так, Григорий Орлов, будучи её фаворитом, в то же самое время (по свидетельству Михаила Щербатова) сожительствовал со всеми её фрейлинами и даже со своей двоюродной 13-летней сестрой. Фаворит императрицы Ланской употреблял возбуждающее средство для увеличения «мужской силы» (контарид) во всё возрастающих дозах, что, по-видимому, по заключению придворного врача Вейкарта, явилось причиной его неожиданной смерти в юном возрасте. Её последнему фавориту Платону Зубову было чуть более 20 лет, тогда как Екатерина в то время находилась в возрасте старше 60 лет. Историками упоминается множество других скандальных подробностей («взятка» в 100 тыс. руб., уплачивавшаяся Потёмкину будущими фаворитами императрицы, многие из которых являлись до этого его адъютантами, опробование их «мужской силы» её фрейлинами и т. д.).",
    ] },
  { "title" = "Награды", "paragraphs" = [
      "Знаки и звёзды орденов, принадлежавших императрице Екатерине II, находятся в настоящее время в экспозиции музея Оружейная палата (зал 4, витрина 29).",
    ] },
  { "title" = "Память", "paragraphs" = [
      "В честь императрицы Екатерины II в 1935 году английскими путешественниками был назван остров Катерин (Тихий океан, побережье Северной Америки, архипелаг Александра, 57°18′ с. ш., 134°49′ з. д.).",
      "А. П. Сумароков сочинил поэтическое переложение 110-го псалма Псалтири, в котором по начальным буквам строк образуется акростих «ЕКАТЕРИНА ВЕЛИКАЯ».",
    ] },
]

[articles.pt]
text = "Catarina II (Estetino, 2 de maio de 1729 – São Petersburgo, 17 de novembro de 1796), também conhecida como Catarina, a Grande, foi Imperatriz da Rússia de 1762 a 1796. Uma princesa alemã por nascimento, chegou ao poder após um golpe de estado contra seu próprio marido, Pedro III."
title = "Catarina II da Rússia"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Catarina_II_da_R%C3%BAssia"
intro = [
  "Catarina II (Estetino, 2 de maio de 1729 – São Petersburgo, 17 de novembro de 1796), também conhecida como Catarina, a Grande, foi Imperatriz da Rússia de 1762 a 1796. Uma princesa alemã por nascimento, chegou ao poder após um golpe de estado contra seu próprio marido, Pedro III. Seu longo reinado marcou a era de ouro do Iluminismo na Rússia, com a fundação de cidades, universidades e teatros, além do incentivo à imigração europeia e da consolidação do país como uma das grandes potências da Europa.",
  "Nascida princesa Sofia Frederica Augusta de Anhalt-Zerbst, casou-se, em 1745, com o herdeiro do trono russo, Carlos Pedro Ulrico de Holsácia-Gottorp, futuro czar Pedro III da Rússia. Em 1762, após um golpe de Estado que depôs o marido, assumiu o trono como imperatriz reinante. Durante seu governo, o Império Russo expandiu significativamente seu território, incorporando áreas da atual Ucrânia, participando das Partilhas da Polônia e conquistando territórios do Império Otomano.",
  "Admiradora de Pedro, o Grande, Catarina continuou a modernizar a Rússia de acordo com os ideais do absolutismo esclarecido. No início do reinado, promoveu reformas administrativas, educacionais e culturais. Contudo, suas políticas levaram a um aumento no número de servos, resultando em descontentamento popular e na eclosão de numerosas revoltas, violentamente reprimidas. Após a Revolução Francesa, abandonou parte de sua postura reformista, intensificou a censura e perseguiu movimentos considerados subversivos.",
  "Catarina ficou conhecida por seus numerosos amantes, em sua maioria homens mais jovens, muitos dos quais alcançaram influência política graças à proximidade com a imperatriz. O mais célebre deles foi Gregório Potemkin.",
]
sections = [
  { "title" = "Início de vida", "paragraphs" = [
      "Sofia Frederica Augusta de Anhalt-Zerbst nasceu às duas horas da madrugada de 2 de maio de 1729, como filha do príncipe Cristiano Augusto de Anhalt-Zerbst e da princesa Joana Isabel de Holsácia-Gottorp. Seu pai era membro de um ramo secundário da Casa de Ascânia e servia como governador da fortaleza de Estetino, na Pomerânia Prussiana. Sua mãe pertencia à Casa de Holsácia-Gottorp, dinastia que reinava na Suécia. De posição social superior à da família do marido, Joana Isabel casou-se com Cristiano Augusto em uma união arranjada, posteriormente descrita como infeliz em razão da diferença de idade e das divergências de temperamento entre os cônjuges.",
      "Sofia cresceu em Estetino. Segundo suas Memórias, sua mãe demonstrava preferência pelo filho mais novo, Guilherme Cristiano, que apresentava problemas de saúde, mantendo uma relação distante com a filha. Joana Isabel também lhe impunha uma disciplina rigorosa, desencorajando demonstrações de orgulho e exigindo estrita observância da etiqueta aristocrática.",
      "Como era costume entre as famílias principescas alemãs do século XVIII, Sofia foi educada por governantas e tutores particulares. Recebeu instrução em francês, música, dança, equitação, religião e etiqueta. Sua principal governanta, Elizabeth Cardel, apelidada de Babet, exerceu influência significativa em sua educação e formação moral. Sofia destacou-se pela curiosidade intelectual. Nas aulas de religião, questionava frequentemente seus professores sobre temas teológicos, entrando em conflito com seu tutor, Herr Wagner, que defendia a aceitação dos ensinamentos religiosos pela fé. Mais tarde, Sofia atribuiu essas experiências ao desenvolvimento de sua preferência por argumentos fundamentados na razão em vez da coerção.",
    ] },
  { "title" = "Vida na Rússia", "paragraphs" = [
      "Em 1741, a ascensão da imperatriz Isabel da Rússia ao trono fortaleceu os vínculos entre a corte russa e a Casa de Holsácia-Gottorp, à qual pertencia a mãe de Sofia, Joana Isabel. Isabel havia sido noiva de Carlos Augusto de Holsácia-Gottorp, irmão mais velho de Joana Isabel, falecido em São Petersburgo antes da celebração do casamento, e mantinha estreitas relações com a família. Após uma troca de correspondências e presentes entre Joana Isabel e a imperatriz, Sofia foi considerada uma possível noiva para o herdeiro do trono russo, o duque Carlos Pedro Ulrico de Holsácia-Gottorp.",
      "No início de 1744, Sofia e sua mãe viajaram para a Rússia a convite da imperatriz. Em Moscou, reencontraram Carlos Pedro Ulrico, que Sofia conhecera cinco anos antes na Alemanha, e foram recebidas por Isabel. Pouco depois de sua chegada, Sofia iniciou o estudo da língua russa e da doutrina da Igreja Ortodoxa Russa. Sua instrução religiosa foi confiada ao bispo Simon Todorski, enquanto o ensino do idioma ficou a cargo de professores designados pela corte. Diferentemente de Pedro, Sofia dedicou-se intensamente ao aprendizado da língua e da religião. Durante esse período, Sofia contraiu pneumonia após expor-se ao frio enquanto estudava russo durante a noite. A doença provocou preocupação na corte, mas sua recuperação contribuiu para aumentar sua popularidade entre os russos, que passaram a associar sua dedicação ao desejo de integrar-se ao país.",
      "Com o consentimento de seu pai, Sofia renunciou ao luteranismo e foi recebida na Igreja Ortodoxa Russa em 28 de junho de 1744, ocasião em que adotou o nome de Catarina Alexeievna. No dia seguinte, foi oficialmente noiva de Carlos Pedro Ulrico, recebendo o título de grã-duquesa e o tratamento de Alteza Imperial.",
    ] },
  { "title" = "Reinado", "paragraphs" = [
      "No final de 1761, o agravamento da saúde da imperatriz Isabel tornou iminente a sucessão ao trono. Catarina via a ascensão de Pedro como inevitável, mas sua própria posição permanecia incerta, sobretudo após a perda de importantes aliados políticos. Diante desse cenário, passou a considerar diferentes possibilidades para o novo reinado, incluindo, ainda que remotamente, a de assumir o poder.",
      "Em 5 de janeiro de 1765 (25 de dezembro de 1761 no calendário juliano), Isabel sofreu um grave derrame e morreu poucos dias depois, sem alterar a ordem sucessória. Pedro foi proclamado imperador como Pedro III, enquanto Catarina assumiu formalmente a posição de imperatriz consorte. A mudança de governo, porém, não fortaleceu a posição de Catarina, que continuou politicamente isolada enquanto o imperador privilegiava sua amante, Isabel Vorontsova, e manifestava a intenção de afastá-la da corte.",
      "Entretanto, o reinado de Pedro III durou apenas seis meses e foi marcado por decisões que ampliaram sua impopularidade: admirador de Frederico, o Grande, retirou a Rússia da Guerra dos Sete Anos, aproximou-se da Prússia e iniciou reformas militares inspiradas no modelo prussiano. Também entrou em conflito com a Igreja Ortodoxa e preparou uma campanha contra a Dinamarca em defesa dos interesses da Holsácia, medidas que provocaram crescente oposição entre militares, membros da nobreza e setores da administração imperial.",
    ] },
  { "title" = "Romances", "paragraphs" = [
      "Ao longo de sua vida, Catarina II manteve romances com importantes membros da nobreza e da elite política europeia, alguns dos quais tiveram repercussões tanto na esfera pessoal quanto na política imperial.",
      "Seu primeiro relacionamento de maior notoriedade foi com Estanislau Augusto Poniatowski, diplomata polonês com quem se envolveu entre 1755 e 1758, ainda durante o casamento com Pedro III. Parte da historiografia atribui a Poniatowski a paternidade da grã-duquesa Ana Petrovna (1757–1759), embora a criança tenha sido oficialmente reconhecida como filha de Pedro III. Com o apoio de Catarina, Poniatowski foi eleito rei da Polônia em 1764, fortalecendo a influência russa sobre a Comunidade Polaco-Lituana.",
      "Após esse relacionamento, Catarina envolveu-se com Gregório Orlov, oficial da Guarda Imperial e um dos principais articuladores do golpe de Estado que a levou ao trono em 1762. Dessa relação nasceu Alexei Grigorievich Bobrinsky (1762–1813), cuja paternidade foi amplamente reconhecida. Orlov recebeu o título de conde, propriedades e grande prestígio na corte, mas o relacionamento terminou alguns anos depois.",
    ] },
  { "title" = "Vida posterior e morte", "paragraphs" = [
      "Apesar de a vida e o reinado de Catarina II terem sido marcados por importantes realizações, seus últimos meses foram acompanhados por acontecimentos que frustraram alguns de seus planos. Em setembro de 1796, seu primo, o rei Gustavo IV Adolfo da Suécia, visitou a corte russa em meio às negociações para um casamento com sua neta, Alexandra Pavlovna. O noivado seria anunciado durante um baile na corte imperial, em 11 de setembro. No entanto, Gustavo Adolfo recusou-se a prosseguir com o compromisso ao saber que Alexandra não pretendia converter-se ao luteranismo, retornando posteriormente a Estocolmo. O episódio desagradou profundamente a imperatriz e coincidiu com o agravamento de seu estado de saúde. Ainda assim, Catarina recuperou-se temporariamente e passou a considerar a possibilidade de alterar a sucessão ao trono, transferindo a Coroa diretamente para seu neto Alexandre Pavlovich e excluindo seu filho Paulo da linha sucessória. O plano, contudo, não foi oficializado antes de sua morte.",
      "Na manhã de 16 de novembro de 1796, Catarina levantou-se e seguiu sua rotina habitual, tomando o café da manhã e dirigindo-se ao escritório para trabalhar. Pouco depois, ao ser questionada por sua criada, Maria Perekusikhina, sobre como havia dormido, respondeu que já não descansava bem havia muito tempo. Por volta das nove horas da manhã, a imperatriz dirigiu-se ao seu aposento e sofreu um desmaio. Diante de sua demora, o criado Zakhar Zotov entrou no cômodo e a encontrou caída no chão. Catarina apresentava o rosto arroxeado, pulso fraco e respiração irregular. Os criados a levaram para seus aposentos e, aproximadamente quarenta e cinco minutos depois, o médico da corte, o escocês John Rogerson, examinou-a e concluiu que ela havia sofrido um acidente vascular cerebral (AVC). Apesar dos esforços médicos, a imperatriz permaneceu em coma e faleceu na noite seguinte, por volta das 21h45. A autópsia realizada posteriormente confirmou o AVC como causa da morte.",
      "Após sua morte, surgiram diversos rumores sobre suas circunstâncias, sendo o mais conhecido o de que teria morrido em decorrência de um ato de bestialidade com um cavalo. Sem qualquer fundamento, essa narrativa foi difundida por publicações satíricas britânicas e francesas e retomava estereótipos anti-russos dos séculos XVII e XVIII, utilizados para retratar a Rússia como uma sociedade bárbara e atrasada.",
    ] },
]

