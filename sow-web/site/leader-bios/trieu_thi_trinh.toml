[articles.en]
text = "Lady Triệu or Triệu Ẩu was a female warrior in 3rd-century Vietnam who managed, for a time, to resist the rule of the Chinese Eastern Wu dynasty. She is also called Triệu Thị Trinh, although her actual given name is unknown."
title = "Lady Triệu"
lang = "en"
url = "https://en.wikipedia.org/wiki/Lady_Tri%E1%BB%87u"
intro = [
  "Lady Triệu (Vietnamese: Bà Triệu, [ɓà ʈ͡ʂiə̂ˀw], Chữ Nôm: 婆趙, died 248 AD) or Triệu Ẩu ([ʈ͡ʂiə̂ˀw ʌ̂u], Chữ Hán: 趙嫗) was a female warrior in 3rd-century Vietnam who managed, for a time, to resist the rule of the Chinese Eastern Wu dynasty. She is also called Triệu Thị Trinh, although her actual given name is unknown.",
  "The uprising of Lady Triệu is usually depicted in modern Vietnamese National History as one of many chapters constituting a \"long national independence struggle to end foreign domination.\" She is also known as Lệ Hải Bà Vương (chữ Hán: 麗海婆王, lit. \"beautiful sea's lady king\"). She is quoted as saying, \"I want to ride storms, slay orcas in the open sea, drive out the aggressors, reconquer the country and undo the ties of serfdom, not to bend my back to be the concubine of whatever man.\"",
]
sections = [
  { "title" = "Background", "paragraphs" = [
      "In 226, Sun Quan sent 3,000 troops to reassert direct Chinese control over Jiaozhi and also to eradicate Shi Xie's family. Sun Quan's forces, under Lü Dai, captured and beheaded Shi Hui along with all of his family, then stormed Jiuzhen and killed ten thousand people there, along with surviving members of Shi Xie's family. Sun Quan divided Jiaozhi into two separated provinces, Jiaozhou and Guangzhou. In 231, Eastern Wu again sent a general to Jiuzhen to \"exterminate and pacify the barbarous Yue tribes.\"",
    ] },
  { "title" = "Biography", "paragraphs" = [
      "In 248, the people of Jiaozhi and Jiuzhen districts of Jiao province rebelled against the Wu Chinese. A local woman named Triệu Ẩu in Jiuzhen led the rebellion, followed by a hundred chieftains who led fifty thousand families in her revolt. Eastern Wu sent Lu Yin to deal with the rebels, and put Lady Trieu to death after several months of warfare. Keith Taylor wrote in 1983: \"Although Chinese records did not mention Lady Trieu, she was described by Le Tac, a 13th-century Vietnamese scholar exiled in Yuan China in his Annan zhilue as a woman who had a yard-long breast and fought on an elephant in battle.\" K. W. Taylor argued that \"the resistance of Lady Trieu was for them (Chinese) simply a kind of stubborn barbarism that was wiped out as a matter of course and was of no historical interest.\" Catherine Churchman (2016) indicates that Taylor is mistaken about Chinese records not mentioning her. According to Churchman, the oldest and also most detailed record of Lady Trieu came from a chronicle called Jiaozhou ji (交州記) of Liu Xinqi (written during the Western Jin dynasty (265–318)), and was quoted in the Taiping Yulan (c. 980), which was the source text for all subsequent accounts.",
    ] },
  { "title" = "Jin conquest of Jiaozhou", "paragraphs" = [
      "In 263, Lü Xing (呂興), a prefecture official in Jiaozhou, revolted with support from local people and soldiers, murdering Wu administrators Sun Xu (孫諝) and Deng Xun (鄧荀), then sent envoys to Cao Wei to request military assistance. Jiaozhi, Jiuzhen and Rinan were transferred to Wei control. In February 266, Western Jin replaced Cao Wei and immediately sent Yang Chi to annex Jiaozhou with local support. In 268, Eastern Wu dispatched two generals, Liu Jun and Xiu Ze to reconquer Jiaozhou from the Jin, but were defeated by Jin armies. In 270, Jin and Wu armies clashed in Hepu Commandery, Guangxi. The Wu general, Tao Huang, managed to get contact with Luong Ky, a local commander of the Fuyan barbarians (扶嚴夷) who was collaborating with the Jin, and convinced him to switch side to the Wu, enabling the Wu army to recapture Jiaozhi's ports and main towns in 271. Fighting continued in the countryside until 280, when the Jin dynasty finally destroyed Eastern Wu, reunifying China.",
    ] },
  { "title" = "Vietnamese account", "paragraphs" = [
      "Đại Việt sử ký toàn thư (大越史記全書 Complete annals of Great Viet), written during the Lê dynasty, said the following about Lady Trieu:",
      "The Mậu Thìn year, , (11th year of Emperor Diên Hy of Han (Han Yanxi 漢延熙); 11th year of Xích Ô (Chiwu 赤烏)). The people of Cửu Chân (Jiuzhen 九真) again attacked citadels, the prefecture was in rebellion. The Wu king appointed the Hành Dương Imperial Secretist Lục Dận [Lu Yin] (some sources said Lục Thương [Lu Shang]) to Inspectorship of Jiaozhou. Dận arrived, used the people's respect for him to call them to lay down arms, people surrendered, numbering more than 30,000 households, and the prefecture was once again peaceful. Afterwards, a woman from the Cửu Chân commandery named Triệu Ẩu assembled people and attacked several commanderies (Ẩu has breasts 3 thước [1.2 m] long, tied them behind her back, often rides elephants to fight). Dận was able to subdue [her]. (Giao Chỉ records only write: In the mountains of Cửu Chân commandery there was a young woman surnamed Triệu, with breasts 3 thước long, unmarried, assembled people and robbed the commanderies, often wore gilded coarse tunics and toothed footwears (or toothed footwears made from gilded coarse clothes?), and fought while sitting on an elephant's head, after she died she became an immortal).",
      "Việt Nam sử lược (A Brief History of Vietnam), written in the early 20th century by Vietnamese historian Trần Trọng Kim, said the following about Lady Trieu:",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Today, many Vietnamese city streets are named after Triệu Thị Trinh. There are Bà Triệu streets in Huế, Hà Nội, Ho Chi Minh City, as well of several statues within temples across the country.",
    ] },
]

[articles.it]
text = "Bà Triệu (Chữ Nôm: 婆趙, [ɓàː t͡ɕiə̂ˀu], lett. \"Signora Triệu\") o Triệu Ẩu (Chữ Nôm: 趙嫗, [ t͡ɕiə̂ˀu ʔə̂u]) (2 ottobre 226 – Distretto di Hậu Lộc, 4 aprile 248) è stata una condottiera ribelle vietnamita del III secolo che riuscì, per un certo periodo, a resistere al dominio della dinastia cinese orientale Wu."
title = "Bà Triệu"
lang = "it"
url = "https://it.wikipedia.org/wiki/B%C3%A0_Tri%E1%BB%87u"
intro = [
  "Bà Triệu (Chữ Nôm: 婆趙, [ɓàː t͡ɕiə̂ˀu], lett. \"Signora Triệu\") o Triệu Ẩu (Chữ Nôm: 趙嫗, [ t͡ɕiə̂ˀu ʔə̂u]) (2 ottobre 226 – Distretto di Hậu Lộc, 4 aprile 248) è stata una condottiera ribelle vietnamita del III secolo che riuscì, per un certo periodo, a resistere al dominio della dinastia cinese orientale Wu.",
  "È anche chiamata Triệu Thị Trinh, anche se il suo vero nome è sconosciuto. Si dice che abbia detto: \"Vorrei cavalcare le tempeste, uccidere le orche in mare aperto, scacciare gli aggressori, riconquistare il Paese, sciogliere i legami della servitù e non piegare mai la schiena per essere la concubina di qualunque uomo.\" La rivolta di Bà Triệu è solitamente descritta nella moderna storia nazionale vietnamita come uno dei tanti capitoli che costituiscono una \"lunga lotta per l'indipendenza nazionale per porre fine alla dominazione straniera\". È anche conosciuta come Lệ Hải Bà Vương (Chữ nho: 麗海婆王, lett. \"La bella signora re del mare\").",
]
sections = [
  { "title" = "Contesto storico", "paragraphs" = [
      "Nel 226 l'imperatore Sun Quan inviò 3 000 soldati per riaffermare il controllo diretto cinese su Jiaozhi e anche per sradicare la famiglia Shi Xie. Le forze di Sun Quan catturarono e decapitarono Shi Hui insieme a tutta la sua famiglia, quindi presero d'assalto Jiuzhen e uccisero diecimila persone, insieme ai membri sopravvissuti della famiglia di Shi Xie. Sun Quan divise Jiaozhi in due province separate, Jiaozhou e Guangzhou. Nel 231, il Wu orientale inviò nuovamente un generale a Jiuzhen per \"sterminare e pacificare le barbare tribù Yue\".",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Nel 248 la popolazione dei distretti di Jiaozhi e Jiuzhen della provincia di Jiaozhou si ribellò contro i cinesi Wu. Una donna locale di nome Triệu Ẩu guidò la ribellione a Jiuzhen, seguita da un centinaio di capi guidati da cinquantamila famiglie nella sua rivolta. Il Wu orientale inviò Lu Yin a ocuparsi dei ribelli e mise a morte Bà Trieu dopo diversi mesi di guerra. Sebbene i documenti cinesi non menzionassero Bà Trieu, fu descritta da Le Tac, uno studioso vietnamita del XIII secolo esiliato nella Cina Yuan nel suo Annan zhilue come una donna che aveva seni lunghi un metro e combatteva su un elefante in battaglia. K. W. Taylor ha sostenuto che \"la resistenza di Bà Trieu era per loro (cinesi) semplicemente una sorta di barbarie ostinata che venne spazzata via come ovvio e non aveva alcun interesse storico\". Catherine Churchman (2016) indica che Taylor si sbaglia sul fatto che i documenti cinesi non la menzionino. Secondo Churchman, la documentazione più antica e anche più dettagliata di Bà Trieu proveniva da Jiaozhou ji di Liu Xinqi, ed era citata nel Taiping Yulan (c. 980), che era il testo di partenza per tutti i resoconti successivi.",
      "Nel 263 Lu Xing (呂興), un funzionario della prefettura di Jiaozhou, ottenne il sostegno della popolazione locale e dei soldati, uccidendo gli amministratori Wu Sun Xu (孫諝) e Deng Xun (鄧荀), quindi inviò legati a Cao Wei richiedendo assistenza militare. Jiaozhi, Jiuzhen e Rinan furono trasferiti a Wei. Nel 265 la dinastia Jin (266–420) sostituì Cao Wei, inviando immediatamente Yang Chi ad annettere Jiaozhou con il sostegno locale. Nel 268 Wu inviò due generali, Liu Chun e Hsiu Tse a riconquistare Jiaozhou, ma furono respinti dagli eserciti Jin. Nel 270 gli eserciti Jin e Wu si scontrarono a Hepu. Tao Huang, il generale dei Wu, contattò Luong Ky, un comandante locale che collaborava con i Jin e lo convinse a passare dalla parte dei Wu, consentendo all'esercito Wu di riconquistare i porti e le principali città di Jiaozhi nel 271. I combattimenti continuarono nelle campagne fino al 280, quando Jin distrusse i Wu, riunificando la Cina.",
    ] },
  { "title" = "Resoconto vietnamita", "paragraphs" = [
      "Đại Việt sử ký toàn thư (大越史記全書, lett. \"Annali completi del Grande Viet\"), scritto durante la dinastia Lê, riporta quanto segue su Bà Trieu:",
      "Việt Nam sử lược (\"Una breve storia del Vietnam\"), un libro di storia scritto all'inizio del XX secolo dallo storico vietnamita Trần Trọng Kim, riporta quanto segue su Bà Trieu:",
    ] },
  { "title" = "Altri resoconti", "paragraphs" = [
      "La prima menzione di Trieu Thi Trinh può essere rinvenuta nel Jiaozhou Ji (交州记), scritto durante la dinastia Jin e raccolto nel Taiping Yulan. Nel libro Vietnamese Tradition on Trial, 1920-1945 scritto da David G. Marr, un docente americano, è narrata la storia di Trieu Thi Trinh come segue: Trieu Thi Trinh era una donna alta 9 piedi (2,7 m) che aveva seni lunghi 3 piedi (0,91 m). Aveva anche una voce che risuonava come la campana di un tempio e poteva mangiare molti becchi di riso e camminare per 500 leghe al giorno. Inoltre Trinh aveva una bellezza capace di scuotere l'animo di qualsiasi uomo. A causa dei ripetuti alterchi, uccise sua cognata e si recò in una foresta nella quale radunò un piccolo esercito con cui attaccò i cinesi. Quando suo fratello cercò di convincerla a ribellarsi, ella gli disse:",
      "Dopo aver ascoltato le parole di Trinh, suo fratello decise di unirsi a lei. All'inizio i cinesi sottovalutarono Trinh per il suo essere una comandante donna, ma dopo alcuni scontri la temevano a causa del suo sguardo. Tre secoli dopo, offriva ancora sostegno spirituale agli uomini vietnamiti oppositori dei cinesi. Nel corso dell'XI secolo venne onorata dalla corte Lý con numerosi titoli postumi. Durante la dinastia Lê, il neoconfucianesimo divenne l'ideologia nazionale del Vietnam e molti studiosi cercarono prepotentemente di conformare le pratiche di Trieu Thi Trinh al neoconfucianesimo. Tuttavia, è sopravvissuta a tutte le loro manipolazioni.",
    ] },
  { "title" = "Eredità culturale", "paragraphs" = [
      "Triệu Thị Trinh è un'eroina molto celebrata e molte strade portano il suo nome nelle città vietnamite (ci sono strade Bà Triệu a Huế, Hanoi, città di Ho Chi Minh e in molte altre città).",
    ] },
]

[articles.vi]
text = "Bà Triệu (chữ Hán: 趙婆, còn gọi là Triệu Trinh Nương, Triệu Thị Trinh hay Triệu Quốc Trinh, sinh ngày 8 tháng 11 năm 226 – mất ngày 2 tháng 4 năm 248) là một thủ lĩnh khởi nghĩa ở Việt Nam thế kỷ thứ 3."
title = "Bà Triệu"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/B%C3%A0_Tri%E1%BB%87u"
intro = [
  "Bà Triệu (chữ Hán: 趙婆, còn gọi là Triệu Trinh Nương, Triệu Thị Trinh hay Triệu Quốc Trinh, sinh ngày 8 tháng 11 năm 226 – mất ngày 2 tháng 4 năm 248) là một thủ lĩnh khởi nghĩa ở Việt Nam thế kỷ thứ 3.",
]
sections = [
  { "title" = "Cuộc đời và sự nghiệp", "paragraphs" = [
      "Triệu Thị Trinh sinh ngày 2 tháng 10 năm Bính Ngọ (226) tại miền núi Quan Yên (hay Quân Yên), quận Cửu Chân (nay thuộc làng Quan Yên, hay còn gọi là Yên Thôn, xã Định Tân, tỉnh Thanh Hóa).",
      "Từ nhỏ, bà sớm tỏ ra có chí khí hơn người. Khi cha bà hỏi về chí hướng mai sau, tuy còn ít tuổi, bà đã rắn rỏi thưa: \"Lớn lên con sẽ đi đánh giặc như bà Trưng Trắc, Trưng Nhị\". Cha mẹ đều mất sớm, Bà Triệu đến ở với anh là Triệu Quốc Đạt, một hào trưởng ở Quan Yên.",
      "Lớn lên, bà là người có sức mạnh, giỏi võ nghệ, lại có chí lớn. Đến năm 19 tuổi gặp phải người chị dâu (vợ ông Đạt) ác nghiệt, bà giết chị dâu rồi vào ở trong núi Nưa (nay thuộc các thị trấn Nưa huyện Triệu Sơn, xã Mậu Lâm huyện Như Thanh, xã Trung Thành huyện Nông Cống, Thanh Hóa), chiêu mộ được hơn ngàn tráng sĩ.",
    ] },
  { "title" = "Câu nói", "paragraphs" = [
      "Câu nói này thấy chép đầu tiên trong sách Thanh Hóa kỷ thắng của Vương Duy Trinh, sống vào thế kỷ 19, từng làm tổng đốc Thanh Hóa. Không thấy các bộ chính sử xưa hơn nhắc tới câu nói này, nên không rõ tính xác thực.",
    ] },
  { "title" = "Di sản & dấu tích", "paragraphs" = [
      "Hiện nay, nơi núi Tùng (xã Triệu Lộc) vẫn còn di tích lăng mộ của bà. Cách nơi bà mất không xa, trên núi Gai ngay sát Quốc lộ 1 (đoạn đi qua thôn Phú Điền, xã Triệu Lộc, cách hành phố Thanh Hóa 18km về phía Bắc) là đền thờ bà. Hằng năm, vào ngày 21 tháng 2 (âm lịch), người dân trong vùng vẫn tổ chức làm lễ giỗ bà.",
      "Tên của bà được đặt cho một số địa danh tại tỉnh Thanh Hóa như huyện Triệu Sơn (từ năm 1964) và xã Triệu Lộc (thuộc huyện Hậu Lộc, từ năm 1954). Tại nhiều tỉnh thành ở Việt Nam, tên bà cũng đã được dùng để đặt tên cho nhiều trường học và đường phố; riêng tại Hà Nội, có một con đường mang tên phố Bà Triệu, và tại Đà Nẵng cũng như vậy nhưng lại viết là Triệu Nữ Vương.",
      "Ở Trà Vinh, tại ngôi miếu được gọi là Lầu Bà Cố Hỷ có thờ bà Triệu Thị Trinh, truyền thuyết dân gian nói rằng xưa kia có 2 sắc phong cho hai anh em bà Triệu (Triệu Thị Trinh và Triệu Quốc Đạt) bị trận bão lớn từ Bắc trôi dạt vào nơi đây, nhân dân đưa hai đạo sắc ra biển nhưng vẫn lại trôi tấp trở vào, nghĩ sắc chọn nơi đây để ngự và làm nơi thờ tự nên người dân ở đây cử người ra Thanh Hóa và lấy kiểu đền thờ bà Triệu Thị Trinh về đây xây cất và thờ cúng.. Bà Cố Hỷ được đồng nhất với bà Triệu và được nhân dân thờ phượng cùng với Triệu Minh Công (tức Triệu Quốc Đạt).",
    ] },
  { "title" = "Nhận định", "paragraphs" = [
      "Đại Việt sử ký toàn thư (Ngô Sĩ Liên, thế kỷ 15):Triệu Ẩu là người con gái ở quận Cửu Chân, họp quân trong núi, đánh phá thành ấp, các bộ đều theo như bóng theo hình, dễ hơn trở bàn tay. Tuy chưa chiếm giữ được đất Lĩnh Biểu như việc cũ của Trưng Vương, nhưng cũng là bậc hùng tài trong nữ giới. Ngô Sĩ Liên (1998). ''Đại Việt sử ký toàn thư'', Nội các quan bản, bản dịch của Viện Sử học, Hà Nội: Nhà xuất bản Khoa học Xã hội, quyển 3, tr. 141",
      "Khâm định Việt sử Thông giám Cương mục (Quốc sử quán triều Nguyễn, thế kỷ 19):Con gái nước ta có nhiều người hùng dũng lạ thường. Bà Triệu Ẩu thật xứng đáng là một nữ kiệt, khí phách hơn người, dẫu là nam nhi cũng khó sánh bằng. Quốc sử quán triều Nguyễn (1998). ''Khâm định Việt sử Thông giám Cương mục'', bản dịch của Viện Sử học, Hà Nội: Nhà xuất bản Giáo dục, quyển 1, tr. 89.",
      "Triệu Ẩu (tức Bà Triệu) là người con gái ở quận Cửu Chân, họp quân trong núi, đánh phá thành ấp, các bộ đều theo như bóng theo hình, dễ hơn trở bàn tay. Tuy chưa chiếm giữ được đất Lĩnh Biểu như việc cũ của Trưng Vương, nhưng cũng là bậc hùng tài trong nữ giới.",
    ] },
]

[articles.tl]
text = "Si Binibining Triệu (Vietnamese: Bà Triệu, [ɓàː t͡ɕiə̂ˀu], Chữ Nôm: 婆趙 226 - 248) o Triệu Ẩu siglo Vietnam na pinamamahalaan, para sa isang panahon , upang labanan ang pamumuno ng Chinese Eastern Wu dynasty. Tinatawag din siyang Triệu Thị Trinh, bagama't hindi alam ang kanyang aktwal na pangalan."
title = "Binibining Triệu"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Binibining_Tri%E1%BB%87u"
intro = [
  "Si Binibining Triệu (Vietnamese: Bà Triệu, [ɓàː t͡ɕiə̂ˀu], Chữ Nôm: 婆趙 226 - 248) o Triệu Ẩu siglo Vietnam na pinamamahalaan, para sa isang panahon , upang labanan ang pamumuno ng Chinese Eastern Wu dynasty. Tinatawag din siyang Triệu Thị Trinh, bagama't hindi alam ang kanyang aktwal na pangalan. Siya ay sinipi na nagsasabing, \"Gusto kong sumakay sa mga bagyo, pumatay ng mga orca sa bukas na dagat, palayasin ang mga aggressor, muling sakupin ang bansa, alisin ang mga ugnayan ng pagkaalipin, at hindi kailanman yumuko ang aking likod upang maging asawa ng sinumang lalaki. \" Ang pag-aalsa ng Binibining Triệu ay karaniwang inilalarawan sa modernong Vietnamese National History bilang isa sa maraming mga kabanata na bumubuo ng isang \"mahabang pambansang pakikibaka para sa kalayaan upang wakasan ang dayuhang dominasyon.\" Kilala rin siya bilang Lệ Hải Bà Vương (chữ Hán: 麗海婆王, lit. \"magandang sea's lady king\").",
]
sections = [
  { "title" = "Background", "paragraphs" = [
      "Noong 226, nagpadala si Sun Quan ng 3,000 tropa upang muling igiit ang direktang kontrol ng mga Tsino sa Jiaozhi at upang lipulin din ang pamilyang Shi Xie . Hinuli at pinugutan ng mga pwersa ni Sun Quan si Shi Hui kasama ang lahat ng kanyang pamilya, pagkatapos ay nilusob si Jiuzhen at pinatay ang sampung libong tao, kasama ang mga nabubuhay na miyembro ng pamilya ni Shi Xie. Hinati ni Sun Quan ang Jiaozhi sa dalawang magkahiwalay na lalawigan, ang Jiaozhou at Guangzhou. Noong 231, nagpadala muli ang Eastern Wu ng isang heneral sa Jiuzhen upang \"lipulin at patahimikin ang mga barbarous na tribo ng Yue .\"",
    ] },
  { "title" = "Talambuhay", "paragraphs" = [
      "Noong 248, ang mga tao ng Jiaozhi at Jiuzhen na distrito ng Jiaozhou province ay naghimagsik laban sa Wu Chinese. Isang lokal na babae na nagngangalang Triệu Ẩu sa Jiuzhen ang nanguna sa paghihimagsik, na sinundan ng isang daang pinuno na namuno sa limampung libong pamilya sa kanyang pag-aalsa. Ipinadala ng Eastern Wu si Lu Yin upang harapin ang mga rebelde, at pinatay si Binibining Trieu pagkatapos ng ilang buwang pakikidigma. Bagama't hindi binanggit ng mga rekord ng Tsino si Binibining Trieu, inilarawan siya ni Le Tac, isang iskolar na Vietnamese noong ika-13 siglo na ipinatapon sa Yuan China sa kanyang Annan zhilue bilang isang babae na may isang bakuran na dibdib at nakipaglaban sa isang elepante sa labanan. Nagtalo si KW Taylor na \"ang paglaban ng Binibining Trieu ay para sa kanila (Intsik) ay isang uri lamang ng matigas na barbarismo na nawasak bilang isang bagay at walang interes sa kasaysayan.\" Isinasaad ni Catherine Churchman (2016) na nagkakamali si Taylor tungkol sa mga rekord ng Tsino na hindi siya binanggit. Ayon kay Churchman, ang pinakamatanda at pinakadetalyadong talaan ng Binibining Trieu ay nagmula sa Jiaozhou ji ng Liu Xinqi, at sinipi sa Taiping Yulan (c. 980), na siyang pinagmulang teksto para sa lahat ng kasunod na mga account.",
    ] },
]

