[articles.en]
text = "Salah ad-Din Yusuf ibn Ayyub, commonly known as Saladin, was the founder of the Ayyubid dynasty and the first sultan of both Egypt and Syria. A Sunni Muslim ruler of Kurdish origin, Saladin was an important figure of the Third Crusade and spearheaded the Muslim military effort against the Crusader states in the Levant."
title = "Saladin"
lang = "en"
url = "https://en.wikipedia.org/wiki/Saladin"
intro = [
  "Salah ad-Din Yusuf ibn Ayyub (c. 1137 – 4 March 1193), commonly known as Saladin, was the founder of the Ayyubid dynasty and the first sultan of both Egypt and Syria. A Sunni Muslim ruler of Kurdish origin, Saladin was an important figure of the Third Crusade and spearheaded the Muslim military effort against the Crusader states in the Levant. At the height of his power, the Ayyubid realm spanned Egypt, Syria, Upper Mesopotamia, the Hejaz, Yemen, and Nubia.",
  "Saladin was sent to Fatimid Egypt in 1164, alongside his uncle Shirkuh, a Kurdish mercenary commander in service of the Zengid dynasty, on the orders of Nur al-Din Zengi. With their original purpose being to help restore Shawar as the vizier to the teenage Fatimid caliph al-Adid, a power struggle ensued between Shirkuh and Shawar after the latter was reinstated. Saladin, meanwhile, climbed the ranks of the Fatimid government by virtue of his military successes against Crusader assaults and his personal closeness to al-Adid. After Shawar was assassinated and Shirkuh died in 1169, al-Adid appointed Saladin as vizier. During his tenure, Saladin, a Sunni Muslim, began to undermine the Fatimid establishment; following al-Adid's death in 1171, he abolished the Cairo-based Fatimid Caliphate which was an Isma'ili (a branch within Shi'a Islam) dynasty, and realigned Egypt with the Baghdad-based Sunni Abbasid Caliphate.",
  "In the following years, Saladin led forays against the Crusader states in Palestine, commissioned the successful conquest of Yemen, and staved off pro-Fatimid rebellions in Egypt. Not long after Nur ad-Din died in 1174, Saladin launched his conquest of Syria, peacefully entering Damascus at the request of its governor. By mid-1175, Saladin had conquered Hama and Homs, inviting the animosity of other Zengid lords, who were the official rulers of Syria's principalities; he subsequently defeated the Zengids at the Battle of the Horns of Hama in 1175 and was thereafter proclaimed the Sultan of Egypt and Syria by the Abbasid caliph al-Mustadi. Saladin launched further conquests in northern Syria and Upper Mesopotamia, escaping two attempts on his life by the Order of Assassins before returning to Egypt in 1177 to address local issues there. By 1182, Saladin had completed the conquest of Syria after capturing Aleppo but failed to take over the Zengid stronghold of Mosul.",
  "Under Saladin's command, the Ayyubid army defeated the Crusaders at the decisive Battle of Hattin in 1187, capturing Jerusalem and re-establishing Muslim military dominance in the Levant. Although the Crusaders' Kingdom of Jerusalem persisted until the late 13th century, the defeat in 1187 marked a turning point in the Christian military effort against Muslim powers in the region. Saladin died in Damascus in 1193, having given away much of his personal wealth to his subjects; he is buried in a mausoleum adjacent to the Umayyad Mosque. Alongside his significance to Muslim culture, Saladin is revered prominently in Kurdish, Turkic, Arab and even Western culture. He has frequently been described as the most famous Kurdish figure in history.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Saladin was born in Tikrit in present-day Iraq. His personal name was \"Yusuf\"; \"Salah ad-Din\" is a laqab, an honorific epithet, meaning \"Righteousness of the Faith\". His parents were of Kurdish Rawadiya ancestry, and had originated from the village of Ajdanakan near the city of Dvin in central Armenia. He was the son of a Kurdish mercenary Najm al-Din Ayyub. The Rawadiya tribe from which his family hailed was originally of Arab descent but later became Kurdicized.",
      "In 1132, the defeated army of Imad al-Din Zengi, Atabeg of Mosul, found their retreat blocked by the Tigris River opposite the fortress of Tikrit, where Saladin's father, Najm al-Din Ayyub served as the warden. Ayyub provided ferries for the army and gave them refuge in Tikrit. Mujahid al-Din Bihruz, a former Greek slave who had been appointed as the military governor of northern Mesopotamia for his service to the Seljuks, reprimanded Ayyub for giving Zengi refuge, and in 1137 banished Ayyub from Tikrit after his brother Asad al-Din Shirkuh killed a friend of Bihruz. According to Baha al-Din ibn Shaddad, his contemporary biographer, Saladin was born the same night his family left Tikrit. In 1139, Ayyub and his family moved to Mosul, where Imad al-Din Zengi acknowledged his debt and appointed Ayyub commander of his fortress in Baalbek. After the death of Zengi in 1146, his son, Nur al-Din Zengi, became the regent of Aleppo and later Damascus, and the leader of the Zengids.",
      "Saladin, who now lived in Damascus, was reportedly fond of the city, but information on his early childhood is scarce. About education, Saladin wrote, \"Children are brought up in the way in which their elders were brought up\". According to his biographers, Anne-Marie Eddé and al-Wahrani, Saladin was able to answer questions on Euclid, the Almagest, arithmetic, and law, but this was an academic ideal. It was his knowledge of the Qur'an and the \"sciences of religion\" that linked him to his contemporaries; several sources claim that during his studies, he was more interested in religious studies than joining the military. Another factor which may have affected his interest in religion was that, during the First Crusade, Jerusalem was taken by the Christians. In addition to Islam, Saladin knew the genealogies, biographies, and histories of the Arabs, as well as the bloodlines of Arabian horses. More significantly, he knew the Hamasah of Abu Tammam by heart. He spoke Kurdish and Arabic, and knew Turkish and Persian.",
    ] },
  { "title" = "Early expeditions", "paragraphs" = [
      "Saladin's military career began under the tutelage of his paternal uncle Shirkuh, a prominent military commander under Nur al-Din. In 1163, Shawar, the vizier to the Fatimid caliph al-Adid, who had been driven out of Egypt by his rival Dirgham, a member of the powerful Banu Ruzzaik tribe, asked for military backing from Nur al-Din. He complied and in 1164 sent Shirkuh to aid Shawar in his expedition against Dirgham. Saladin, at age 26, went along with them. After Shawar was successfully reinstated as vizier, he demanded that Shirkuh withdraw his army from Egypt for a sum of 30,000 gold dinars, but he refused, insisting it was Nur al-Din's will that he remain. Saladin's role in this expedition was minor, and it is known that he was ordered by Shirkuh to collect stores from Bilbais prior to its siege by a combined force of Crusaders and Shawar's troops.",
      "After the sacking of Bilbais, the Crusader–Egyptian force and Shirkuh's army engaged in the Battle of al-Babein on the desert border of the Nile, just west of Giza. Saladin played a major role, commanding the right wing of the Zengid army, while a force of Kurds commanded the left, and Shirkuh was stationed in the centre. Muslim sources at the time, however, put Saladin in the \"baggage of the centre\" with orders to lure the enemy into a trap by staging a feigned retreat. The Crusader force enjoyed early success against Shirkuh's troops, but the terrain was too steep and sandy for their horses, and commander Hugh of Caesarea was captured while attacking Saladin's unit. After scattered fighting in little valleys to the south of the main position, the Zengid central force returned to the offensive; Saladin joined in from the rear.",
      "The battle ended in a Zengid victory, and Saladin is credited with having helped Shirkuh in one of the \"most remarkable victories in recorded history\" according to Ibn al-Athir, although more of Shirkuh's men were killed and the battle is considered by most sources as not a total victory. Saladin and Shirkuh moved towards Alexandria where they were welcomed, given money and arms, and provided a base. Faced by a superior Crusader–Egyptian force attempting to besiege the city, Shirkuh split his army. He and the bulk of his force withdrew from Alexandria, while Saladin was left with the task of guarding the city, where in 1167 he was besieged. Saladin withheld the siege for three months despite the numerical inferiority, until Shirkuh, the Crusaders and Shawar reached a settlement after which Zengids and Crusaders left Egypt.",
    ] },
  { "title" = "In Egypt", "paragraphs" = [
      "In 1168, Amalric I of Jerusalem invaded Egypt for the third time. This time Crusaders reached all the way till Fustat, which was burnt by Shawar to not let its wealth falling in the Crusaders' hands, and besieged Cairo itself. Shawar was again forced to request Nur al-Din for assistance; upon the arrival of Shirkuh and Saladin in 1169 Amalric withdrew after receiving a large payment from the Fatimid treasury. Shawar was executed shortly afterwards by Shirkuh with al-Adid's approvement, and Shirkuh was appointed vizier, however he himself died later that year. Following his death, a number of candidates were considered for the role of vizier, most of whom were ethnic Kurds. Saladin and his close associates were wary of Turkish influence. On one occasion, Isa al-Hakkari, a Kurdish lieutenant of Saladin, urged a candidate for the viziership, Emir Qutb al-Din al-Hadhbani, to step aside by arguing that \"both you and Saladin are Kurds and you will not let the power pass into the hands of the Turks\". Nur al-Din chose a successor for Shirkuh, but al-Adid appointed Saladin to replace Shawar as vizier.",
      "The reasoning behind the Shi'a caliph al-Adid's selection of Saladin, a Sunni, varies. Ibn al-Athir claims that the caliph chose him after being told by his advisers that \"there is no one weaker or younger\" than Saladin, and \"not one of the emirs [commanders] obeyed him or served him\". According to this version, after some bargaining, he was eventually accepted by the majority of the emirs. Al-Adid's advisers were also suspected of promoting Saladin in an attempt to split the Syria-based Zengids. Al-Wahrani wrote that Saladin was selected because of the reputation of his family in their \"generosity and military prowess\". Imad al-Din al-Isfahani wrote that after the brief mourning period for Shirkuh, during which \"opinions differed\", the Zengid emirs decided upon Saladin and forced the caliph to \"invest him as vizier\". Although positions were complicated by rival Muslim leaders, the bulk of the Syrian commanders supported Saladin because of his role in the Egyptian expedition, in which he gained a record of military qualifications.",
      "Inaugurated as vizier on 26 March, Saladin repented \"wine-drinking and turned from frivolity to assume the dress of religion\", according to Arabic sources of the time. Having gained more power and independence than ever before in his career, he still faced the issue of ultimate loyalty between al-Adid and Nur al-Din. Later in the year, a group of Egyptian soldiers and emirs attempted to assassinate Saladin, but having already known of their intentions thanks to his intelligence chief Ali ibn Safyan, he had the chief conspirator, Naji, Mu'tamin al-Khilafa—the civilian controller of the Fatimid Palace—arrested and killed. The day after, 50,000 Black African soldiers from the regiments of the Fatimid army opposed to Saladin's rule, along with Egyptian emirs and commoners, staged a revolt. By 23 August, Saladin had decisively quelled the uprising, and never again had to face a military challenge from Cairo.",
    ] },
  { "title" = "Conquest of Syria", "paragraphs" = [
      "In the early summer of 1174, Nur al-Din was mustering an army, sending summons to Mosul, Diyar Bakr, and the Jazira in an apparent preparation of an attack against Saladin's Egypt. The Ayyubids held a council upon the revelation of these preparations to discuss the possible threat, and Saladin collected his own troops outside Cairo. On 15 May, Nur al-Din died after falling ill the previous week and his power was handed to his eleven-year-old son as-Salih Ismail al-Malik. His death left Saladin with political independence and in a letter to as-Salih, he promised to \"act as a sword\" against his enemies and referred to the death of his father as an \"earthquake shock\".",
      "In the wake of Nur al-Din's death, Saladin faced a difficult decision; he could move his army against the Crusaders from Egypt or wait until invited by as-Salih in Syria to come to his aid and launch a war from there. He could also take it upon himself to annex Syria before it could possibly fall into the hands of a rival, but he feared that attacking a land that formerly belonged to his master—forbidden in the Muslim principles in which he believed—could portray him as hypocritical, thus making him unsuitable for leading the war against the Crusaders. Saladin saw that in order to acquire Syria, he needed either an invitation from as-Salih or to warn him that potential anarchy could give rise to danger from the Crusaders.",
      "When as-Salih was removed to Aleppo in August, Gumushtigin, the emir of the city and a captain of Nur al-Din's veterans assumed guardianship over him. The emir prepared to unseat all his rivals in Syria and the Jazira, beginning with Damascus. In this emergency, the emir of Damascus appealed to Sayf al-Din Ghazi of Mosul (a cousin of as-Salih) for assistance against Aleppo, but he refused, forcing the Syrians to request the aid of Saladin, who complied. Saladin rode across the desert with 700 picked horsemen, passing through al-Karak then reaching Bosra. According to his own account, was joined by \"emirs, soldiers, and Bedouins—the emotions of their hearts to be seen on their faces.\" On 23 November, he arrived in Damascus amid general acclamation and rested at his father's old home there, until the gates of the Citadel of Damascus, whose commander Raihan initially refused to surrender, were opened to Saladin four days later, after a brief siege by his brother Tughtakin ibn Ayyub. He installed himself in the castle and received the praise of the inhabitants.",
    ] },
  { "title" = "Recognition and legacy", "paragraphs" = [
      "Saladin has become a prominent figure in Muslim, Arab, Turkish and Kurdish culture, and he has been described as the most famous Kurd in history. Historian ibn Munqidh mentioned him as the person who revived the reign of Rashidun Caliphs. The Turkish writer Mehmet Akif Ersoy called him the most beloved sultan of the Orient.",
      "In 1898, Wilhelm II, the German emperor, visited Saladin's tomb to pay his respects. The visit, coupled with anti-imperialist sentiments, encouraged the image in the Arab world of Saladin as a hero of the struggle against the West, building on the romantic one created by Walter Scott and other Europeans in the West at the time. Saladin's reputation had previously been largely forgotten in the Muslim world, eclipsed by more successful figures, such as Baybars of Egypt.",
      "Modern Arab states have sought to commemorate Saladin through various measures, often based on the image created of him in the 19th-century west. A governorate centered around Tikrit and Samarra in modern-day Iraq is named after him, as is Salahaddin University in Erbil, the largest city of Iraqi Kurdistan. A suburban community of Erbil, Masif Salahaddin, is also named after him.",
    ] },
]

[articles.ja]
text = "サラーフ・アッディーン（サラディン）（ユースフ・イブン・アイユーブ・イブン・シャーズィー、アラビア語: يوسف بن أيوب بن شاذي, Yūsuf ibn Ayyūb ibn Shādhī、クルド語：Selaheddînê Eyûbî、1137年または1138年 - 1193年3月4日）は、12世紀から13世紀にかけてエジプト、シリア、イエメンなどの地域を支配したスンナ派のイスラーム王朝であるアイユーブ朝の創始者である。現イラク北部のティクリート出身で、アルメニアのクルド人一族の出自である。エジプトとシリアを支配し、エルサレム王国を1187年に破り、さらに第3回十字軍を破ったことから、イスラム世界の英雄とされる。"
title = "サラーフッディーン"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B5%E3%83%A9%E3%83%BC%E3%83%95%E3%83%83%E3%83%87%E3%82%A3%E3%83%BC%E3%83%B3"
intro = [
  "サラーフ・アッディーン（サラディン）（ユースフ・イブン・アイユーブ・イブン・シャーズィー、アラビア語: يوسف بن أيوب بن شاذي, Yūsuf ibn Ayyūb ibn Shādhī、クルド語：Selaheddînê Eyûbî、1137年または1138年 - 1193年3月4日）は、12世紀から13世紀にかけてエジプト、シリア、イエメンなどの地域を支配したスンナ派のイスラーム王朝であるアイユーブ朝の創始者である。現イラク北部のティクリート出身で、アルメニアのクルド人一族の出自である。エジプトとシリアを支配し、エルサレム王国を1187年に破り、さらに第3回十字軍を破ったことから、イスラム世界の英雄とされる。",
]
sections = [
  { "title" = "名前", "paragraphs" = [
      "彼個人の名をユースフ（・イブン・アイユーブ）（アイユーブの息子ユースフの意。ユースフはヨセフの、アイユーブはヨブのアラビア語形。）。出生時の全名は يوسف بن أيوب بن شاذي بن مروان بن يعقوب الدُويني التكريتي：Yūsuf ibn Ayyūb ibn Shādhī ibn Marwān ibn Yaʿqūb al-Duwaynī al-Tikrītī であり、彼の父や祖父、曽祖父また先祖のラカブや種族の出身地が含まれている。個人を区別するためサラーフ＝アッディーン Ṣalāḥ al-Dīn という「信教（Dīn）の高潔（Ṣalāḥ）」（righteousness of the religion）を意味するラカブを名乗るようになり、さらに数々の武勲から称号を含んだ新たな名が組まれていった。",
      "肩書きなどを添えた名前は الملك الناصر أبو المظفر صلاح الدين والدنيا يوسف بن أيّوب：al-Malik al-Nāṣir Abū al-Muẓaffar Ṣalāḥ al-Dīn wa al-Dunyā Yūsuf ibn Ayyūbである。al-Malikは「支配者、王」、al-Nāṣir は「援助者、勝利をもたらす者」。Abū al-Muẓaffar は「勝利者の父」を意味する。",
      "同時代の十字軍側のラテン語資料などでは Salahadinus（サラハディヌス）または Saladinus（サラディヌス）などと称し、これを受けて欧米では慣習的に Saladin（サラディン）と呼ばれる。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "ヒジュラ暦532年（西暦では1137年または1138年）、イラク北部の町ティクリート（タクリート）に生まれ「ユースフ」と名付けられた。ほかに4人の兄弟がいたがユースフが何番目の子であったかは不明であり、母親についての情報もほとんど残されていない。",
      "父のナジムッディーン・アイユーブはセルジューク朝治下ティクリートのクルド人代官であったが、ユースフが生まれて間もない1138年頃、兄弟のアサドゥッディーン・シール・クーフがキリスト教徒の官吏を誤って殺害したため、一家もろともティクリート追放の憂き目にあった。アイユーブはかつてザンギー朝の創始者、ザンギーがバグダードでの戦に敗れモースルへ逃れる際に手助けしたことがあり、アイユーブとシール・クーフの兄弟はその時の恩義からザンギーの軍団長に迎えられ、さらにはバールベックに領地を与えられた。そのため、ユースフは少年時代をここで送ることになった。バールベックは穀物や果物を産する豊かな町で、後に晩年のサラーフ＝アッディーンに仕え伝記『サラーフ＝アッディーン伝』を著したイブン・シャッダード (Baha ad-Din ibn Shaddad) は、想像も込めて「ここで性格の良さが育まれた」と述べている。",
      "1146年にザンギーが手下のマムルーク（奴隷兵）に暗殺されると、ダマスクス総督でブーリー朝のアタベク・ムイーヌッディーン・ウナルは軍を派遣してアイユーブの守護するバールベックを包囲攻撃した。アイユーブはこれをよく耐えて、最後はバールベックを明け渡す代わりに、いくばくかの保障金の支払いとダマスクス近郊の村落のいくつかを交渉によって要求しこれの獲得に成功した。これによりアイユーブは名目上セルジューク家へ臣従し、ユースフはじめその家族は父とともにダマスクスへ移住する事となった。この時ユースフは8歳ほどであり、エジプトで権力を確立する30代前半までをダマスクスで過ごす事になる。",
    ] },
  { "title" = "サラーフ＝アッディーンの施政とその人となり", "paragraphs" = [
      "かつてエルサレムを占領した第1回十字軍は捕虜を皆殺しにし、また第3回十字軍を指揮したリチャード1世も身代金の未払いを理由に同様の虐殺を行った。しかし、サラーフ＝アッディーンは敵の捕虜を身代金の有無に関わらず全員助けている。彼は軍事の天才であるが、このような寛大な一面もあって、敵味方を問わずにその人格は愛され、現在まで英雄としてその名を残しているのである。捕虜を助けた事に関して、次のような逸話がある。サラーフ＝アッディーンが身代金を支払わない捕虜の扱いに困っていると、彼の弟（後に4代目スルタンとなったアル＝アーディル）が捕虜を少し自分に分け与えるよう進言した。サラーフ＝アッディーンは訳を訊ねるが弟は答えず、彼の言う通りに捕虜を与えてやった。すると、弟は自分の物だからと言って全て解放してやり、こうするのが良いのだと兄に言った。喜ぶ兵士たちの姿を見たサラーフ＝アッディーンは捕虜を殺さないことを決心したという。また、病床にあるリチャード1世に見舞いの品を贈る等、敵に対しても懐の深さを見せている。",
      "その寛容さは名声を高めたが、しばしば不利益となっても現れた。行軍の際に、途中で立ち寄った村の村人たちに軍事費の一部を分け与えていたため、彼の兵士の多くは軍事費を自腹で用意しなければならない程であったという。私財も常にそのように用いたため、サラーフ＝アッディーンの遺産は自身の葬儀代にもならなかった。また、ハッティンの戦いでティールに追い込んだ守将バリアンに対し、当初は武装解除を条件に脱出を許可していたが、書簡でエルサレムの指揮権を請われるとこれを認めて入城させ、エルサレム攻略戦での苦戦を招いている。",
      "上記のような寛容な逸話が多いが、無条件に甘い人物というわけではなく、中でも度々休戦協定を破って隊商を襲ったルノー・ド・シャティヨンに対する怒りは大きかった。ハッティンの戦いでルノーを捕らえた際、彼と配下の騎士団員を一人残らず処刑している。前述の弟の寛容さに関しても必ずしも同意ではなく、アッコンで捕えた聖職者を自分に無断で解放した際には罰を与えている。",
    ] },
  { "title" = "名称「サラーフ＝アッディーン」「サラディン」について", "paragraphs" = [
      "アラビア語では2語から成る称号を息継ぎ無しで読み、主格では صَلَاحُ الدِّينِ（Ṣalāḥu-d-dīn, サラーフ＝アッディーン）と発音する。口語では格母音脱落と補助母音再挿入が起こり صَلَاحَ الدِّينِ（Ṣalāḥa-d-dīn, サラーハッディーン）と発音されることが多い。",
      "原語ではサラーフ・アッ＝ディーンのように区切って読むことは通常しないが、ラテン文字転写は実際の発音とは関係無く分かち書きをし、同化が起こりad-dīn（アッ＝ディーン）と促音化するはずの定冠詞部分の発音変化を反映させずal-Dīnとすることが一般的である。",
      "そのためラテン文字転写ではṢalāḥ al-Dīnとなり、アラビア語における実際の発音との乖離が生じる。一方Ṣalāḥ ad-Dīnのように定冠詞部分の「al-」を発音同化後の「ad-」に置き換えた転写が用いられることもある。",
    ] },
  { "title" = "その他", "paragraphs" = [
      "シリアで流通している200シリア・ポンド紙幣には、1993年がサラーフ＝アッディーンの没後800年に当たることを記念してダマスカス市内に建てられたサラーフ＝アッディーンの騎馬像が描かれている。",
    ] },
  { "title" = "映像作品", "paragraphs" = [
      "2001年、シリア制作のラマダーン向け連続ドラマ。全30話。誕生前そして幼少期から聖地解放までを描く。宰相アル＝カーディー・アル＝ファーディルの執務室でサラーフ＝アッディーンが自らの思い出を語るという回想シーンをはさみながら物語が進められる形式。",
      "アル＝カーディー・アル＝ファーディル役は映画『キングダム・オブ・ヘブン』でサラディン（サラーフ＝アッディーン）、الظاهر بيبرس（アッ＝ザーヒル・バイバルス、2005年放映、シリア制作）で後代の人物でアイユーブ朝第7代スルターン ナジュムッディーン・アイユーブ（アル＝マリク・アッ＝サーリフ）を演じたシリア人俳優 غَسَّان مَسْعُود（Ghassan Massoud, ガッサーン・マスウード）。異なる作品でサラーフ＝アッディーン（サラディン）、彼の宰相、後代のスルターンアッ＝サーリフという3人のアイユーブ朝関係者を演じたこととなった。",
    ] },
]

[articles.ko]
text = "살라딘, 또는 살라흐 앗딘 유수프 이븐 아이유브(아랍어: صلاح الدين الأيوبي, 쿠르드어: سەڵاحەددینی ئەییووبی, 페르시아어: صلاح الدین ایوبی, 튀르키예어: Selahaddin Eyyubi, 1138년?~1193년 3월 4일)은 12세기경 티크리트(현재 이라크 북부) 출신의 쿠르드족 무슬림 장군이자 전사였으며 이집트, 시리아의 술탄이었다. 3차 십자군 원정에 맞서서 이슬람 세력을 승리로 이끌었다."
title = "살라딘"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EC%82%B4%EB%9D%BC%EB%94%98"
intro = [
  "살라딘, 또는 살라흐 앗딘 유수프 이븐 아이유브(아랍어: صلاح الدين الأيوبي, 쿠르드어: سەڵاحەددینی ئەییووبی, 페르시아어: صلاح الدین ایوبی, 튀르키예어: Selahaddin Eyyubi, 1138년?~1193년 3월 4일)은 12세기경 티크리트(현재 이라크 북부) 출신의 쿠르드족 무슬림 장군이자 전사였으며 이집트, 시리아의 술탄이었다. 3차 십자군 원정에 맞서서 이슬람 세력을 승리로 이끌었다. 전성기에 그는 이집트, 시리아, 예멘, 이라크, 메카, 헤자즈 등지를 아우르는 아이유브 왕조를 세웠다. 서양에서는 살라딘이라는 이름으로 유명하지만 그의 본명은 유수프(Yousuf)였다. 그는 그의 지도력과 군사적 역량으로 무슬림과 기독교계 모두에게 알려졌으며, 십자군과 맞서 전쟁을 치를 당시에 탐욕스럽고 무자비했던 십자군의 군주들에 비해 온건하고 약속을 잘 지키는 자비로운 군주로 덕망이 높았으며 그가 보인 기사도 정신과 자비심은 서방세계에 널리 전해져 수많은 전설과 기록으로 남았다. 살라딘이라는 그의 이름은 아랍어로 \"정의와 신념\"을 의미한다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "1137년 티크리트의 쿠르드 가문에서 태어난 살라딘은 다마스쿠스에서 학업을 마쳤다. 그의 아버지 나짐 앗딘 아이유브(Najm ad-Din Ayyub, ?~1173년)는 1139년에 티크리트에서 쫓겨나 삼촌 아사드 알딘 시르쿠(Asad al-Din Shirkuh)와 함께 모술로 갔다. 나짐 앗딘 아이유브는 나중에 이마드 앗딘 장기(Imad ad-Din Zengi)의 부하가 되었으며 이마드 앗딘 장기는 나짐 앗딘을 발베크(Baalbek) 요새 수비대장으로 임명했다. 다마스쿠스에 머무는 10년 동안 누르 앗딘의 법원에서 수니파의 교리를 배운 살라딘은 그의 삼촌인 시르쿠에게서 기초 군사 교육을 마쳤으며, 1160년대 이집트 파티마 왕조의 분파와의 전투끝에 승리하여 1169년 삼촌 시르쿠가 장관으로 이 지역에 대한 지배를 시작하였다. 예루살렘의 아모리 1세가 통치하는 예루살렘 왕국으로부터 이집트를 보호하는 역할을 수행한 살라딘은 이집트 왕가의 혼란 속에서 오래 버티지 못할 것이라는 예측을 깨고 점차 영향력을 키워갔다.",
      "시리아의 외인부대 지휘관이었던 살라딘은 이름뿐인 칼리프 알아디드가 죽자, 1171년 9월 이집트에 대한 실제적인 통치권을 행사하였다. 살라딘은 이집트의 경제를 재건하고 군대를 양성하는 한편, 그의 아버지의 조언에 따라 살라딘의 명목상 주인이었던 누르 앗딘과의 마찰을 피했다. 누르 앗딘이 죽기 전까지 살라딘은 가급적 군사행동을 피했지만 이내 십자군과의 대대적인 전쟁에 들어가게 되었다. 1174년 누르 앗딘이 사망하자 살라딘은 이집트의 술탄이 되었다. 그는 셀주크 투르크로부터 독립을 선포하였으며 아이유브 왕조를 세우고 이집트에 수니파 교단을 회복하였다. 그는 영토를 확장하고 파티마 왕조 지지세력을 소탕하였으며 홍해를 건너 예멘까지 광대한 영토를 지배하였다. 수니파 신도들은 그에게 '신의 친구'(Waliullah)라는 호칭을 붙였다.",
      "1170년과 1172년 살라딘은 누르 앗딘의 예루살렘 왕국 침공으로부터 퇴각하였다. 살라딘은 시리아에 대한 지배권을 얻게 되기 전까지 예루살렘 왕국이 이집트와 시리아 사이의 완충지대로 남아있기를 희망하였기 때문이다. 누르 앗딘 사후 그의 직위는 아직 소년이었던 살리흐 이스마엘 알말리크에게 계승되었지만 이 소년 역시 1181년 사망하였다. 누르 앗딘 사후 살라딘은 다마스쿠스로 행군하였으며 대중의 환영을 받았다. 그는 선왕을 존중하는 의미로 누르 앗딘의 미망인과 결혼하였다. 누르 앗딘이 통치한 다른 두 대도시 알레포와 모술은 그의 수중에 떨어지지 않았지만 살라딘은 이 도시들에 대한 그의 영향력을 계속 행사하였다. 살라딘은 1176년과 1186년 이들 도시에 대한 공성에 나섰지만 1176년 5월 22일 알레포 공성 당시 해시시를 먹는 자들(Hashshashins)이라는 정예 암살자 조직 아사신의 공격을 받고 공격을 철수하기도 하였다.",
    ] },
  { "title" = "평가", "paragraphs" = [
      "기독교도들과의 많은 전투에도 불구하고 살라딘은 유럽에 관대하고 예의바른 사람으로 알려졌으며, 14세기경 그를 칭송하는 많은 시들이 나타났다. 단테 또한 그를 미덕을 갖춘 이교도로 묘사한 바 있으며, 월터 스코트를 비롯한 많은 이들의 저작에서 훌륭한 사람으로 그려졌다. 살라딘은 특히 리처드 1세의 존경을 샀는데, 리처드 1세는 살라딘을 위대한 왕으로 평하며 의심할 여지 없이 이슬람 최고의 지도자라고 하였다. 살라딘과 리처드 1세는 많은 선물을 교환하며 지냈지만 직접 대면하지는 않았다.",
      "살라딘의 자비심을 보여주는 일화가 1191년 4월에 발생한 바 있다. 프랑크족 여인의 3달 된 아기가 유괴되어 노예시장에 팔리자 프랑크인들은 이 여인에게 살라딘에게 자비를 구할 것을 권하였고, 사연을 전해들은 살라딘은 사재를 모아 아기를 사서 여인에게 돌려주었다. 이 광경을 지켜본 사람들에 따르면 여인은 눈물을 쏟으며 크게 감사하였다고 한다.",
      "20세기 초 시리아가 프랑스의 위임통치 아래 들게 되자, 프랑스 점령군 사령관 앙리 구로(Henri Joseph Eugène Gouraud)가 다마스쿠스에 있는 살라딘의 영묘를 찾아 \"살라딘이여, 우리가 돌아왔다. 여기, 나의 존재가 초승달(이슬람)에 대한 십자가(기독교)의 승리를 위한 봉헌이 될 것이다.\"라고 선언한 일화가 있다.",
    ] },
  { "title" = "참고 문헌", "paragraphs" = [
      "Baha ad-Din, The Rare and Excellent History of Saladin, ed. D. S. Richards, Ashgate, 2002.",
      "Imad ad-Din al-Isfahani, Conquête de la Syrie et de la Palestine par Salâh ed-dîn, ed. Carlo Landberg, Brill, 1888.",
      "H. A. R. Gibb, The Life of Saladin: From the Works of Imad ad-Din and Baha ad-Din. Clarendon Press, 1973.",
    ] },
]

