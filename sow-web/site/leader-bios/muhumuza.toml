[articles.en]
text = "Muhumuza, also recorded as Muhumusa, led resistance in the highlands of Ndorwa and Kigezi, across what is now the Rwanda–Uganda border. As a medium of Nyabingi she drew on a spiritual tradition already known in local communities. She organized followers against the court of King Musinga and the expansion of European colonial rule."
title = "Muhumuza"
lang = "en"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, also recorded as Muhumusa, led resistance in the highlands of Ndorwa and Kigezi, across what is now the Rwanda–Uganda border. As a medium of Nyabingi she drew on a spiritual tradition already known in local communities. She organized followers against the court of King Musinga and the expansion of European colonial rule."]
sections = [{ title = "Resistance across the hills", paragraphs = ["Muhumuza invoked a claim to the Rwandan succession through a man she presented as her son. Historians disagree on how to identify her and on the extent of her connection to the royal family. German pressure drove her across the border into the Uganda Protectorate, where she continued organizing. British forces captured her in 1911, and she remained in confinement in Kampala until her death in 1945. Nyabingi resistance outlasted her capture, with other leaders mobilizing in the region. Colonial records describe these events from the officials’ perspective, while oral history and field research give a broader view of women’s roles and the movement’s local roots."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.es]
text = "Muhumuza, también registrada como Muhumusa, lideró la resistencia en las tierras altas de Ndorwa y Kigezi, a ambos lados de la actual frontera entre Ruanda y Uganda. Como médium de Nyabingi, recurrió a una tradición espiritual ya arraigada en las comunidades locales. Organizó a sus seguidores contra la corte del rey Musinga y la expansión del dominio colonial europeo."
title = "Muhumuza"
lang = "es"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, también registrada como Muhumusa, lideró la resistencia en las tierras altas de Ndorwa y Kigezi, a ambos lados de la actual frontera entre Ruanda y Uganda. Como médium de Nyabingi, recurrió a una tradición espiritual ya arraigada en las comunidades locales. Organizó a sus seguidores contra la corte del rey Musinga y la expansión del dominio colonial europeo."]
sections = [{ title = "Resistencia entre las colinas", paragraphs = ["Muhumuza invocó un derecho a la sucesión ruandesa a través de un hombre al que presentaba como su hijo. Los historiadores discrepan sobre su identidad y sobre el alcance de su vínculo con la familia real. La presión alemana la empujó al Protectorado de Uganda, donde siguió organizando la resistencia. Fuerzas británicas la capturaron en 1911 y quedó confinada en Kampala hasta su muerte en 1945. La resistencia de Nyabingi continuó tras su captura bajo otros liderazgos de la región. Los registros coloniales describen los hechos desde la perspectiva de los funcionarios. La historia oral y el trabajo de campo amplían lo que sabemos sobre el papel de las mujeres y las raíces locales del movimiento."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.fr]
text = "Muhumuza, aussi appelée Muhumusa, dirigea la résistance dans les hautes terres du Ndorwa et du Kigezi, de part et d’autre de l’actuelle frontière entre le Rwanda et l’Ouganda. Médium de Nyabingi, elle s’appuya sur une tradition spirituelle déjà implantée dans les communautés locales. Elle rallia des partisans contre la cour du roi Musinga et l’expansion de la domination coloniale européenne."
title = "Muhumuza"
lang = "fr"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, aussi appelée Muhumusa, dirigea la résistance dans les hautes terres du Ndorwa et du Kigezi, de part et d’autre de l’actuelle frontière entre le Rwanda et l’Ouganda. Médium de Nyabingi, elle s’appuya sur une tradition spirituelle déjà implantée dans les communautés locales. Elle rallia des partisans contre la cour du roi Musinga et l’expansion de la domination coloniale européenne."]
sections = [{ title = "Résister de part et d’autre des collines", paragraphs = ["Muhumuza invoqua un droit à la succession rwandaise pour un homme qu’elle présentait comme son fils. Les historiens divergent sur son identité et sur l’étendue de ses liens avec la famille royale. La pression allemande la poussa dans le protectorat de l’Ouganda, où elle poursuivit son action. Des forces britanniques la capturèrent en 1911, puis elle demeura confinée à Kampala jusqu’à sa mort en 1945. La résistance de Nyabingi se poursuivit après sa capture sous d’autres responsables de la région. Les archives coloniales livrent le point de vue des fonctionnaires. L’histoire orale et les enquêtes de terrain éclairent le rôle des femmes et les racines locales du mouvement."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.de]
text = "Muhumuza, auch als Muhumusa überliefert, führte Widerstand im Hochland von Ndorwa und Kigezi beiderseits der heutigen Grenze zwischen Ruanda und Uganda an. Als Medium von Nyabingi stützte sie sich auf eine geistliche Tradition, die in den Gemeinden bereits verwurzelt war. Sie organisierte Anhänger gegen den Hof König Musingas und gegen die Ausweitung der europäischen Kolonialherrschaft."
title = "Muhumuza"
lang = "de"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, auch als Muhumusa überliefert, führte Widerstand im Hochland von Ndorwa und Kigezi beiderseits der heutigen Grenze zwischen Ruanda und Uganda an. Als Medium von Nyabingi stützte sie sich auf eine geistliche Tradition, die in den Gemeinden bereits verwurzelt war. Sie organisierte Anhänger gegen den Hof König Musingas und gegen die Ausweitung der europäischen Kolonialherrschaft."]
sections = [{ title = "Widerstand im Hochland", paragraphs = ["Muhumuza erhob einen Anspruch auf die ruandische Thronfolge für einen Mann, den sie als ihren Sohn vorstellte. Ihre Identität und ihre Verbindung zum Königshaus werden in der Forschung unterschiedlich beurteilt. Der Druck der deutschen Kolonialmacht trieb sie in das Protektorat Uganda, wo sie den Widerstand weiter organisierte. Britische Truppen nahmen sie 1911 gefangen. Bis zu ihrem Tod 1945 blieb sie in Kampala festgesetzt. Der Widerstand der Nyabingi-Bewegung ging unter anderen Führungspersonen der Region weiter. Kolonialakten überliefern die Sicht der Beamten. Mündliche Überlieferung und Feldforschung eröffnen weitere Einblicke in die Rolle der Frauen und die Wurzeln der Bewegung vor Ort."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.it]
text = "Muhumuza, chiamata anche Muhumusa nelle fonti, guidò la resistenza negli altipiani di Ndorwa e Kigezi, ai due lati dell’attuale confine tra Ruanda e Uganda. Come medium di Nyabingi si richiamò a una tradizione spirituale già radicata nelle comunità locali. Organizzò i suoi seguaci contro la corte del re Musinga e l’espansione del dominio coloniale europeo."
title = "Muhumuza"
lang = "it"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, chiamata anche Muhumusa nelle fonti, guidò la resistenza negli altipiani di Ndorwa e Kigezi, ai due lati dell’attuale confine tra Ruanda e Uganda. Come medium di Nyabingi si richiamò a una tradizione spirituale già radicata nelle comunità locali. Organizzò i suoi seguaci contro la corte del re Musinga e l’espansione del dominio coloniale europeo."]
sections = [{ title = "Resistenza tra le colline", paragraphs = ["Muhumuza invocò un diritto alla successione ruandese per un uomo che presentava come suo figlio. Gli storici divergono sulla sua identità e sulla natura del suo legame con la famiglia reale. Le pressioni tedesche la spinsero nel Protettorato dell’Uganda, dove continuò a organizzare la resistenza. Le forze britanniche la catturarono nel 1911 e rimase confinata a Kampala fino alla morte nel 1945. La resistenza di Nyabingi proseguì dopo la sua cattura sotto altre figure della regione. Le fonti coloniali riflettono lo sguardo dei funzionari. La storia orale e la ricerca sul campo aiutano a ricostruire il ruolo delle donne e le radici locali del movimento."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.tr]
text = "Muhumusa adıyla da kayda geçen Muhumuza, bugünkü Ruanda-Uganda sınırının iki yanındaki Ndorwa ve Kigezi yüksek bölgelerinde direnişe önderlik etti. Nyabingi’nin medyumu olarak yöre halkı arasında kök salmış bir manevi geleneğe dayandı. Kral Musinga’nın sarayına ve Avrupa sömürge yönetiminin yayılmasına karşı yandaşlarını örgütledi."
title = "Muhumuza"
lang = "tr"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumusa adıyla da kayda geçen Muhumuza, bugünkü Ruanda-Uganda sınırının iki yanındaki Ndorwa ve Kigezi yüksek bölgelerinde direnişe önderlik etti. Nyabingi’nin medyumu olarak yöre halkı arasında kök salmış bir manevi geleneğe dayandı. Kral Musinga’nın sarayına ve Avrupa sömürge yönetiminin yayılmasına karşı yandaşlarını örgütledi."]
sections = [{ title = "Tepelerin iki yanında direniş", paragraphs = ["Muhumuza, oğlu olarak tanıttığı bir adam adına Ruanda tahtı üzerinde hak ileri sürdü. Tarihçiler onun kimliği ve kraliyet ailesiyle bağının niteliği konusunda farklı görüşlere sahiptir. Alman baskısı onu Uganda Protektorası’na geçmeye zorladı, ancak orada da örgütlenmeyi sürdürdü. Britanya kuvvetleri onu 1911’de yakaladı. 1945’te ölene kadar Kampala’da gözetim altında kaldı. Nyabingi direnişi onun yakalanmasından sonra bölgenin başka önderleriyle devam etti. Sömürge arşivleri olayları görevlilerin gözünden anlatır. Sözlü tarih ve saha çalışmaları ise kadınların rolü ile hareketin yerel köklerini anlamaya yardımcı olur."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.zh-CN]
text = "穆胡穆扎也见于拼作穆胡穆萨的记录。她在恩多尔瓦和基盖齐的高地组织抵抗，活动范围横跨今天的卢旺达与乌干达边境。她担任尼亚宾吉灵媒，借助当地社群早已熟悉的精神传统召集追随者。她所面对的压力来自穆辛加国王的宫廷，也来自不断向边境地区扩张的欧洲殖民权力。"
title = "穆胡穆扎"
lang = "zh-CN"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["穆胡穆扎也见于拼作穆胡穆萨的记录。她在恩多尔瓦和基盖齐的高地组织抵抗，活动范围横跨今天的卢旺达与乌干达边境。她担任尼亚宾吉灵媒，借助当地社群早已熟悉的精神传统召集追随者。她所面对的压力来自穆辛加国王的宫廷，也来自不断向边境地区扩张的欧洲殖民权力。"]
sections = [{ title = "群山之间的抵抗", paragraphs = ["穆胡穆扎的活动发生在卢旺达王位继承纷争与殖民势力扩张相互交织的时期。她曾为一名被她称作儿子的男子主张卢旺达的王位。研究者对她的确切身份以及她与王室之间的关系有不同看法。可追溯的组织活动表明，她在北部山区获得了当地人的支持。尼亚宾吉信仰在这片地区已有根基，灵媒为社群提供求助和沟通的渠道。穆胡穆扎把这种已有的联系带入了反抗宫廷压力与殖民统治的行动。随着德国殖民当局支持穆辛加巩固王位，她受到压力，转入英国控制的乌干达保护地。政治边界把这一带纳入了不同的殖民政权，当地社群的亲属和交往联系仍延伸到边界两侧。她在基盖齐一带继续动员。1911年英国军队袭击营地并将她抓获，随后她被拘禁在坎帕拉，直到1945年去世。她被捕后，尼亚宾吉抵抗并未结束，地区内其他领导者继续组织行动。历史学家可以把当时官员的报告与后来收集的口述历史放在一起阅读。官方文件记录了殖民当局怎样看待并压制这场运动。地方口述和田野调查则能帮助了解追随者的动机、社群之间的联系，以及女性如何参与组织和领导。尼亚宾吉传统的活动范围还涉及大湖地区其他地方，各地的实践随社会环境而变化。把她的个人经历放回这一背景，可以看到宗教身份怎样成为动员的途径，也可以辨别其事迹与后来的传说。现代研究有的强调王位继承之争，有的追溯各地居民反对外来统治的原因。对王室渊源的争议仍然存在，同时，多种资料都把穆胡穆扎视为当地抵抗的重要组织者。研究这段历史时，地名和人名在不同语种档案中的拼写往往有差异，因而需要借助事件发生的地点、年代和记录者的身份核对材料。她在边境两侧建立的联系也说明，当时的行政划分只能解释地方政治的一部分。"] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.ja]
text = "ムフムザは、現在のルワンダとウガンダの国境をまたぐンドルワとキゲジの高地で抵抗運動を率いた。記録によってはムフムサとも記される。ニャビンギの霊媒として、地域に根付いていた信仰をもとに支持者を集めた。彼女はムシンガ王の宮廷と、ヨーロッパ諸国による植民地支配の拡大に対抗した。"
title = "ムフムザ"
lang = "ja"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["ムフムザは、現在のルワンダとウガンダの国境をまたぐンドルワとキゲジの高地で抵抗運動を率いた。記録によってはムフムサとも記される。ニャビンギの霊媒として、地域に根付いていた信仰をもとに支持者を集めた。彼女はムシンガ王の宮廷と、ヨーロッパ諸国による植民地支配の拡大に対抗した。"]
sections = [{ title = "丘陵を越える抵抗", paragraphs = ["ムフムザが活動した時代には、ルワンダの王位継承争いと、ヨーロッパ諸国による境界の画定が重なっていた。彼女は自分の息子と紹介した男性のために、ルワンダ王位を継ぐ権利を主張した。彼女が誰であったか、王家とどのような関係にあったかについては、研究者の見解が分かれる。北部の山地で地元の支持を得たことは、残された記録からたどることができる。ニャビンギは国境の両側で知られていた信仰であり、ムフムザはその霊媒としての立場を人々の結集に生かした。ムシンガを支えたドイツ植民地当局から圧力を受けると、彼女は境界を越えてイギリスのウガンダ保護領へ移った。政治的な境界が引かれた後も、周辺の地域社会の往来や人間関係は続いた。ムフムザはキゲジで活動を続けたが、1911年にイギリス軍に捕らえられ、1945年に亡くなるまでカンパラに拘束された。ニャビンギに結びついた抵抗は彼女の拘束後も続き、別の指導者たちが各地で人々を組織した。植民地官僚の記録は、当局が何を警戒し、どのように取り締まったかを伝える。口承や現地調査からは、地域の人々の動機、集落どうしのつながり、女性たちの組織活動について、別の角度から知ることができる。ルワンダ王位をめぐる主張、植民地行政への抵抗、霊媒を中心とする信仰は、この地域で互いに関わり合っていた。ニャビンギの伝統は大湖地方の各地にあり、その実践は地域によって異なる。ムフムザの活動を考えるときにも、地名や人名が記録の言語によって異なる表記を取ることや、語りが誰によって残されたかに注意が必要である。彼女が当時どのような人々を結びつけたかは、王家をめぐる主張に加え、そうした地域社会の関係からも理解できる。"] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.ko]
text = "무후무자는 오늘날 르완다와 우간다 국경 양쪽에 걸친 은도르와와 키게지 고지대에서 저항을 이끌었다. 기록에 따라 무후무사로도 불린다. 그는 냐빙기의 영매로서 지역 공동체에 자리 잡은 신앙을 바탕으로 사람들을 모았다. 그가 조직한 추종자들은 무싱가 왕의 궁정과 유럽의 식민 지배 확대에 맞섰다."
title = "무후무자"
lang = "ko"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["무후무자는 오늘날 르완다와 우간다 국경 양쪽에 걸친 은도르와와 키게지 고지대에서 저항을 이끌었다. 기록에 따라 무후무사로도 불린다. 그는 냐빙기의 영매로서 지역 공동체에 자리 잡은 신앙을 바탕으로 사람들을 모았다. 그가 조직한 추종자들은 무싱가 왕의 궁정과 유럽의 식민 지배 확대에 맞섰다."]
sections = [{ title = "언덕을 넘은 저항", paragraphs = ["무후무자가 활동하던 때에는 르완다의 왕위 계승 분쟁과 유럽 열강의 식민지 경계 설정이 겹쳤다. 무후무자는 자신의 아들이라고 소개한 남자가 왕위를 이을 권리가 있다고 주장했다. 그가 누구였고 왕실과 어떤 관계였는지에 관해서는 역사학자들의 견해가 갈린다. 여러 기록을 통해 북부 산악 지대 주민들이 그를 지지했다는 점을 살펴볼 수 있다. 냐빙기 신앙은 오늘날의 국경 양쪽에서 알려져 있었다. 무후무자는 영매로서 사람들의 신뢰를 얻고 여러 공동체를 결집하는 데 그 관계를 활용했다. 무싱가를 지지하던 독일 식민 당국의 압박이 커지자 그는 국경을 넘어 영국이 지배하던 우간다 보호령으로 옮겨 갔다. 새로 그어진 행정 경계에도 인근 주민들의 친족 관계와 교류는 이어졌다. 무후무자는 키게지에서 계속 저항을 조직했지만 1911년 영국군에 붙잡혔다. 이후 캄팔라에 구금된 채 지내다가 1945년에 사망했다. 그가 체포된 뒤에도 냐빙기와 관련된 저항은 이어졌고, 다른 지도자들이 각지에서 사람들을 모았다. 식민지 문서는 관료들이 운동을 어떻게 인식하고 단속했는지 보여 준다. 구술사와 현지 조사는 참가자들의 동기, 공동체 사이의 교류, 여성들의 조직 활동을 살피는 자료가 된다. 왕위 계승 문제, 식민 통치에 대한 저항, 영매를 중심으로 한 신앙은 이 지역에서 서로 맞물렸다. 냐빙기 전통은 아프리카 대호수 지역의 여러 곳에 있었고 실천 방식은 지역마다 달랐다. 서로 다른 언어로 쓰인 문헌의 인명과 지명 표기를 대조하고 누가 어느 시기에 남긴 기록인지 구분하면, 무후무자가 활동한 환경을 더 구체적으로 살펴볼 수 있다."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.ar]
text = "قادت موهوموزا، التي يرد اسمها أيضًا بصيغة موهوموسا، المقاومة في مرتفعات ندوروا وكيغيزي على جانبي الحدود الحالية بين رواندا وأوغندا. وبصفتها وسيطة لروح نيابينغي استندت إلى تقليد روحي راسخ في المجتمعات المحلية. ونظمت أتباعها في مواجهة بلاط الملك موسينغا وتوسع الحكم الاستعماري الأوروبي."
title = "موهوموزا"
lang = "ar"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["قادت موهوموزا، التي يرد اسمها أيضًا بصيغة موهوموسا، المقاومة في مرتفعات ندوروا وكيغيزي على جانبي الحدود الحالية بين رواندا وأوغندا. وبصفتها وسيطة لروح نيابينغي استندت إلى تقليد روحي راسخ في المجتمعات المحلية. ونظمت أتباعها في مواجهة بلاط الملك موسينغا وتوسع الحكم الاستعماري الأوروبي."]
sections = [{ title = "المقاومة بين التلال", paragraphs = ["استندت موهوموزا إلى مطالبة بالعرش الرواندي لرجل كانت تقدمه على أنه ابنها. ويختلف المؤرخون في تحديد هويتها وطبيعة صلتها بالأسرة المالكة. دفعها الضغط الألماني إلى عبور الحدود نحو محمية أوغندا، حيث واصلت تنظيم المقاومة. قبضت عليها القوات البريطانية عام 1911، وظلت محتجزة في كمبالا حتى وفاتها عام 1945. واستمرت مقاومة نيابينغي بعد أسرها بقيادة شخصيات أخرى في المنطقة. تنقل السجلات الاستعمارية وجهة نظر المسؤولين، بينما يوضح التاريخ الشفهي والبحث الميداني دور النساء والجذور المحلية للحركة."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.ru]
text = "Мухумуза, также известная по источникам как Мухумуса, возглавила сопротивление на возвышенностях Ндорвы и Кигези по обе стороны современной границы Руанды и Уганды. Она была медиумом Ньябинги и опиралась на духовную традицию местных общин. Она организовала сторонников против двора короля Мусинги и расширения европейской колониальной власти."
title = "Мухумуза"
lang = "ru"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Мухумуза, также известная по источникам как Мухумуса, возглавила сопротивление на возвышенностях Ндорвы и Кигези по обе стороны современной границы Руанды и Уганды. Она была медиумом Ньябинги и опиралась на духовную традицию местных общин. Она организовала сторонников против двора короля Мусинги и расширения европейской колониальной власти."]
sections = [{ title = "Сопротивление среди холмов", paragraphs = ["Мухумуза отстаивала право на руандийский престол для человека, которого называла своим сыном. Историки расходятся в оценке её происхождения и связей с царской семьёй. Германское давление вынудило её перейти в протекторат Уганда, где она продолжила организовывать сопротивление. В 1911 году британские войска захватили её, и до смерти в 1945 году она оставалась в заключении в Кампале. Другие вожди региона продолжили сопротивление Ньябинги после её пленения. Колониальные документы передают взгляд чиновников. Устная история и полевые исследования помогают понять роль женщин и местные истоки движения."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.vi]
text = "Muhumuza, còn được ghi là Muhumusa, lãnh đạo phong trào kháng cự ở vùng cao Ndorwa và Kigezi, hai bên biên giới Rwanda và Uganda ngày nay. Với vai trò người đồng cốt của Nyabingi, bà dựa vào một truyền thống tâm linh đã bén rễ trong các cộng đồng địa phương. Bà tập hợp người ủng hộ để chống triều đình vua Musinga và sự bành trướng của chế độ thực dân châu Âu."
title = "Muhumuza"
lang = "vi"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, còn được ghi là Muhumusa, lãnh đạo phong trào kháng cự ở vùng cao Ndorwa và Kigezi, hai bên biên giới Rwanda và Uganda ngày nay. Với vai trò người đồng cốt của Nyabingi, bà dựa vào một truyền thống tâm linh đã bén rễ trong các cộng đồng địa phương. Bà tập hợp người ủng hộ để chống triều đình vua Musinga và sự bành trướng của chế độ thực dân châu Âu."]
sections = [{ title = "Kháng cự giữa những ngọn đồi", paragraphs = ["Muhumuza nêu quyền kế vị ở Rwanda cho một người đàn ông mà bà giới thiệu là con trai mình. Các nhà sử học có ý kiến khác nhau về danh tính và mối liên hệ của bà với hoàng gia. Sức ép của Đức buộc bà sang xứ bảo hộ Uganda, nơi bà tiếp tục tổ chức kháng cự. Quân Anh bắt bà năm 1911 và bà bị giam giữ ở Kampala cho đến khi qua đời năm 1945. Phong trào Nyabingi tiếp diễn dưới sự lãnh đạo của những người khác trong vùng sau khi bà bị bắt. Hồ sơ thuộc địa phản ánh góc nhìn của giới chức. Lịch sử truyền khẩu và nghiên cứu thực địa giúp làm rõ vai trò của phụ nữ và cội rễ địa phương của phong trào."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.id]
text = "Muhumuza, juga tercatat sebagai Muhumusa, memimpin perlawanan di dataran tinggi Ndorwa dan Kigezi, di kedua sisi perbatasan Rwanda dan Uganda saat ini. Sebagai perantara roh Nyabingi, ia bertumpu pada tradisi spiritual yang telah berakar di masyarakat setempat. Ia menghimpun pengikut untuk melawan istana Raja Musinga dan perluasan kekuasaan kolonial Eropa."
title = "Muhumuza"
lang = "id"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, juga tercatat sebagai Muhumusa, memimpin perlawanan di dataran tinggi Ndorwa dan Kigezi, di kedua sisi perbatasan Rwanda dan Uganda saat ini. Sebagai perantara roh Nyabingi, ia bertumpu pada tradisi spiritual yang telah berakar di masyarakat setempat. Ia menghimpun pengikut untuk melawan istana Raja Musinga dan perluasan kekuasaan kolonial Eropa."]
sections = [{ title = "Perlawanan di kedua sisi perbukitan", paragraphs = ["Muhumuza mengajukan hak atas takhta Rwanda bagi seorang pria yang ia perkenalkan sebagai putranya. Para sejarawan berbeda pendapat mengenai identitasnya dan sifat hubungannya dengan keluarga kerajaan. Tekanan Jerman mendorongnya menyeberang ke Protektorat Uganda, tempat ia terus mengorganisasi perlawanan. Pasukan Inggris menangkapnya pada 1911 dan ia ditahan di Kampala hingga meninggal pada 1945. Perlawanan Nyabingi berlanjut sesudah penangkapannya di bawah pemimpin lain di kawasan itu. Arsip kolonial menggambarkan peristiwa dari sudut pandang pejabat. Sejarah lisan dan penelitian lapangan membantu menerangkan peran perempuan dan akar lokal gerakan tersebut."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.fil]
text = "Pinamunuan ni Muhumuza, na naitala rin bilang Muhumusa, ang paglaban sa matataas na lupain ng Ndorwa at Kigezi sa magkabilang panig ng hangganan ngayon ng Rwanda at Uganda. Bilang midyum ng Nyabingi, umasa siya sa isang espirituwal na tradisyong nakaugat na sa mga pamayanan doon. Tinipon niya ang mga tagasunod laban sa korte ni Haring Musinga at sa paglawak ng pamamahalang kolonyal ng Europa."
title = "Muhumuza"
lang = "fil"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Pinamunuan ni Muhumuza, na naitala rin bilang Muhumusa, ang paglaban sa matataas na lupain ng Ndorwa at Kigezi sa magkabilang panig ng hangganan ngayon ng Rwanda at Uganda. Bilang midyum ng Nyabingi, umasa siya sa isang espirituwal na tradisyong nakaugat na sa mga pamayanan doon. Tinipon niya ang mga tagasunod laban sa korte ni Haring Musinga at sa paglawak ng pamamahalang kolonyal ng Europa."]
sections = [{ title = "Paglaban sa magkabilang panig ng kaburulan", paragraphs = ["Naghain si Muhumuza ng pag-angkin sa paghalili sa trono ng Rwanda para sa lalaking ipinakilala niyang anak. Magkakaiba ang pananaw ng mga historyador sa kanyang pagkakakilanlan at ugnayan sa maharlikang pamilya. Dahil sa presyon ng mga Aleman, tumawid siya sa Protektorado ng Uganda at ipinagpatuloy ang pag-oorganisa roon. Dinakip siya ng mga Briton noong 1911 at nanatili siyang nakakulong sa Kampala hanggang sa pagkamatay niya noong 1945. Nagpatuloy ang paglaban ng Nyabingi sa pamumuno ng ibang taga-rehiyon. Mula sa pananaw ng mga opisyal ang mga talang kolonyal. Nakatutulong ang kasaysayang pasalita at pag-aaral sa mga pamayanan upang maunawaan ang papel ng kababaihan at ang mga lokal na ugat ng kilusan."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]

[articles.pt-BR]
text = "Muhumuza, também registrada como Muhumusa, liderou a resistência nas terras altas de Ndorwa e Kigezi, dos dois lados da atual fronteira entre Ruanda e Uganda. Como médium de Nyabingi, apoiou-se em uma tradição espiritual já enraizada nas comunidades locais. Organizou seguidores contra a corte do rei Musinga e a expansão do domínio colonial europeu."
title = "Muhumuza"
lang = "pt-BR"
url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46"
shortArticle = true
intro = ["Muhumuza, também registrada como Muhumusa, liderou a resistência nas terras altas de Ndorwa e Kigezi, dos dois lados da atual fronteira entre Ruanda e Uganda. Como médium de Nyabingi, apoiou-se em uma tradição espiritual já enraizada nas comunidades locais. Organizou seguidores contra a corte do rei Musinga e a expansão do domínio colonial europeu."]
sections = [{ title = "Resistência entre as colinas", paragraphs = ["Muhumuza reivindicou a sucessão ruandesa para um homem que apresentava como seu filho. Historiadores divergem sobre sua identidade e sobre a natureza de seu vínculo com a família real. A pressão alemã a levou a cruzar a fronteira para o Protetorado de Uganda, onde continuou organizando a resistência. Forças britânicas a capturaram em 1911 e ela ficou confinada em Campala até morrer em 1945. A resistência de Nyabingi prosseguiu após sua captura com outras lideranças da região. Os registros coloniais retratam os acontecimentos da perspectiva dos funcionários. A história oral e a pesquisa de campo esclarecem o papel das mulheres e as raízes locais do movimento."] }]
sources = [{ title = "Richard Vokes, On Fertility & Misfortune, Ghosts of Kanungu", url = "https://www.cambridge.org/core/books/abs/ghosts-of-kanungu/on-fertility-misfortune/8AD566389F33E26932260BCE5EFFDF46" }, { title = "Murindwa Rutanga, Politics, Religion and Power in the Great Lakes Region, CODESRIA", url = "https://publication.codesria.org/index.php/pub/catalog/download/103/809/2376?inline=1" }, { title = "Jim Freedman, Ritual and History: The Case of Nyabingi", url = "https://www.persee.fr/doc/cea_0008-0055_1974_num_14_53_2668" }, { title = "Alison Des Forges, Defeat Is the Only Bad News, University of Wisconsin Press", url = "https://books.google.com/books?id=v0fo54LxVfoC" }, { title = "Feminine Identity in Anti-Colonial Struggles: The Legacy of Muhumuza of Nyabingi Movement in Kigezi, Makerere University", url = "https://makir.mak.ac.ug/items/53b8858f-5baa-4234-91da-325380bafccb/full" }]
