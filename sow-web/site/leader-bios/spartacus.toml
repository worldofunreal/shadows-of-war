[articles.tr]
text = "Spartaküs, MÖ 73’te Capua’da başlayan ayaklanmanın önderlerinden olan Trakyalı bir gladyatördü. Plutarkhos, kaçanların mutfak gereçleriyle kurtulup daha sonra arabalarda taşınan silahları ele geçirdiğini anlatır. Appianos’a göre yolda silahlandılar ve Vezüv’e sığındılar. Orada safları genişledi."
title = "Spartaküs"
lang = "tr"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116"
shortArticle = true
intro = ["Spartaküs, MÖ 73’te Capua’da başlayan ayaklanmanın önderlerinden olan Trakyalı bir gladyatördü. Plutarkhos, kaçanların mutfak gereçleriyle kurtulup daha sonra arabalarda taşınan silahları ele geçirdiğini anlatır. Appianos’a göre yolda silahlandılar ve Vezüv’e sığındılar. Orada safları genişledi."]
sections = [{ title = "Capua’dan Thurii’ye", paragraphs = ["Plutarkhos, Spartaküs’ü seçilen üç önderin başında gösterir. Appianos, Kriksus ve Oinomaos’un adını da verir. Kölelikten kaçanların ve bazı özgür tarım işçilerinin onlara katıldığını, ganimetin bölüşülmesinin yeni katılımları artırdığını aktarır. Onun anlatısında Spartaküs, Thurii’de değerli metal ticaretini sınırladı ve askerlerini silahlandırmak için demir ve pirinç satın aldı. Antik yazarlar kaçanların sayısı ve seferin ayrıntıları konusunda farklı bilgiler verir. Plutarkhos ve Appianos, Crassus karşısındaki MÖ 71 yenilgisini de anlatır."] }]
