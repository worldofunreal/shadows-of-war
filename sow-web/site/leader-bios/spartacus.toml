[articles.en]
text = "Spartacus was a Thracian gladiator who helped lead the revolt that broke out at Capua in 73 BCE. Plutarch describes fugitives using kitchen implements to escape and then seizing weapons in transit. Appian describes them arming themselves on the road and taking refuge on Vesuvius, where their ranks grew."
title = "Spartacus"
lang = "en"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116"
shortArticle = true
intro = ["Spartacus was a Thracian gladiator who helped lead the revolt that broke out at Capua in 73 BCE. Plutarch describes fugitives using kitchen implements to escape and then seizing weapons in transit. Appian describes them arming themselves on the road and taking refuge on Vesuvius, where their ranks grew."]
sections = [{ title = "From Capua to Thurii", paragraphs = ["Plutarch names Spartacus as the foremost of three elected leaders. Appian also names Crixus and Oenomaus, and says that fugitives from slavery and some free rural workers joined. He connects the revolt’s growth to the distribution of spoils. At Thurii, he recounts, Spartacus restricted commerce in precious metals while buying iron and brass for arms. The ancient authors differ on the number of escapees and on details of the campaign. Both Plutarch and Appian describe the defeat by Crassus in 71 BCE. Their narratives preserve different accounts of the rebels’ decisions, equipment and plans."] }]
sources = [{ title = "Appian, The Civil Wars, I.116–120", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116" }, { title = "Plutarch, Life of Crassus, 8–11", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Crassus%2A.html#8" }, { title = "Frontinus, Stratagems, I.5.20–22", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/Strategemata/1%2A.html" }]

[articles.es]
text = "Espartaco fue un gladiador tracio que encabezó la rebelión iniciada en Capua en el año 73 a. C. Plutarco cuenta que los fugitivos usaron utensilios de cocina para escapar y luego se apoderaron de armas que iban en carros. Apiano describe cómo se armaron en el camino y se refugiaron en el Vesubio, donde creció el grupo."
title = "Espartaco"
lang = "es"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116"
shortArticle = true
intro = ["Espartaco fue un gladiador tracio que encabezó la rebelión iniciada en Capua en el año 73 a. C. Plutarco cuenta que los fugitivos usaron utensilios de cocina para escapar y luego se apoderaron de armas que iban en carros. Apiano describe cómo se armaron en el camino y se refugiaron en el Vesubio, donde creció el grupo."]
sections = [{ title = "De Capua a Turios", paragraphs = ["Plutarco sitúa a Espartaco al frente de tres jefes elegidos. Apiano también nombra a Crixo y Enómao, y dice que se unieron personas huidas de la esclavitud y algunos trabajadores libres del campo. Atribuye parte del crecimiento al reparto del botín. En Turios, según su relato, Espartaco restringió el comercio de metales preciosos y compró hierro y latón para armar a sus fuerzas. Los autores antiguos discrepan sobre el número de fugitivos y varios detalles de la campaña. Tanto Plutarco como Apiano cuentan la derrota frente a Craso en el año 71 a. C."] }]
sources = [{ title = "Appian, The Civil Wars, I.116–120", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116" }, { title = "Plutarch, Life of Crassus, 8–11", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Crassus%2A.html#8" }, { title = "Frontinus, Stratagems, I.5.20–22", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/Strategemata/1%2A.html" }]

[articles.fr]
text = "Spartacus était un gladiateur thrace qui dirigea la révolte née à Capoue en 73 av. J.-C. Plutarque raconte que les fugitifs utilisèrent des ustensiles de cuisine pour s’évader et s’emparèrent ensuite d’armes transportées par des chariots. Appien les montre s’armant en chemin et se réfugiant au Vésuve, où leurs rangs grossirent."
title = "Spartacus"
lang = "fr"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116"
shortArticle = true
intro = ["Spartacus était un gladiateur thrace qui dirigea la révolte née à Capoue en 73 av. J.-C. Plutarque raconte que les fugitifs utilisèrent des ustensiles de cuisine pour s’évader et s’emparèrent ensuite d’armes transportées par des chariots. Appien les montre s’armant en chemin et se réfugiant au Vésuve, où leurs rangs grossirent."]
sections = [{ title = "De Capoue à Thurii", paragraphs = ["Plutarque présente Spartacus comme le premier de trois chefs élus. Appien cite aussi Crixus et Œnomaüs et rapporte que des esclaves en fuite et certains travailleurs ruraux libres rejoignirent la révolte. Il relie sa croissance au partage du butin. À Thurii, Spartacus aurait limité le commerce des métaux précieux tout en achetant du fer et du laiton pour armer ses forces. Les récits antiques diffèrent sur le nombre de fugitifs et sur des détails de la campagne. Plutarque et Appien relatent tous deux la défaite face à Crassus en 71 av. J.-C."] }]
sources = [{ title = "Appian, The Civil Wars, I.116–120", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116" }, { title = "Plutarch, Life of Crassus, 8–11", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Crassus%2A.html#8" }, { title = "Frontinus, Stratagems, I.5.20–22", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/Strategemata/1%2A.html" }]

[articles.de]
text = "Spartacus war ein thrakischer Gladiator und führte den Aufstand mit an, der 73 v. Chr. in Capua begann. Plutarch zufolge setzten die Flüchtenden Küchengeräte zur Flucht ein und erbeuteten unterwegs Waffen. Appian berichtet, dass sie sich auf dem Weg bewaffneten und auf dem Vesuv Zuflucht fanden, wo ihre Zahl wuchs."
title = "Spartacus"
lang = "de"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116"
shortArticle = true
intro = ["Spartacus war ein thrakischer Gladiator und führte den Aufstand mit an, der 73 v. Chr. in Capua begann. Plutarch zufolge setzten die Flüchtenden Küchengeräte zur Flucht ein und erbeuteten unterwegs Waffen. Appian berichtet, dass sie sich auf dem Weg bewaffneten und auf dem Vesuv Zuflucht fanden, wo ihre Zahl wuchs."]
sections = [{ title = "Von Capua nach Thurioi", paragraphs = ["Plutarch nennt Spartacus den bedeutendsten von drei gewählten Anführern. Appian nennt auch Crixus und Oenomaus. Ihm zufolge schlossen sich entflohene Versklavte und freie Landarbeiter an. Er verbindet den Zulauf mit der Verteilung der Beute. In Thurioi habe Spartacus den Handel mit Edelmetallen eingeschränkt und Eisen sowie Messing für Waffen gekauft. Die antiken Autoren widersprechen einander bei der Zahl der Geflohenen und bei Einzelheiten des Feldzugs. Sowohl Plutarch als auch Appian schildern die Niederlage gegen Crassus 71 v. Chr."] }]
sources = [{ title = "Appian, The Civil Wars, I.116–120", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116" }, { title = "Plutarch, Life of Crassus, 8–11", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Crassus%2A.html#8" }, { title = "Frontinus, Stratagems, I.5.20–22", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/Strategemata/1%2A.html" }]

[articles.it]
text = "Spartaco fu un gladiatore trace che guidò la rivolta iniziata a Capua nel 73 a.C. Plutarco racconta che i fuggitivi usarono utensili da cucina per evadere e poi si impadronirono di armi trasportate su carri. Appiano descrive come si armarono lungo la strada e trovarono rifugio sul Vesuvio, dove il gruppo crebbe."
title = "Spartaco"
lang = "it"
url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Appian/Civil_Wars/1%2A.html#116"
shortArticle = true
intro = ["Spartaco fu un gladiatore trace che guidò la rivolta iniziata a Capua nel 73 a.C. Plutarco racconta che i fuggitivi usarono utensili da cucina per evadere e poi si impadronirono di armi trasportate su carri. Appiano descrive come si armarono lungo la strada e trovarono rifugio sul Vesuvio, dove il gruppo crebbe."]
sections = [{ title = "Da Capua a Thurii", paragraphs = ["Plutarco presenta Spartaco come il principale dei tre capi eletti. Appiano nomina anche Crisso ed Enomao e racconta l’arrivo di schiavi fuggiti e di alcuni lavoratori rurali liberi. Collega la crescita del gruppo alla spartizione del bottino. A Thurii, secondo il suo racconto, Spartaco limitò il commercio di metalli preziosi e acquistò ferro e ottone per armare i suoi uomini. Gli autori antichi divergono sul numero dei fuggitivi e su alcuni dettagli della campagna. Plutarco e Appiano raccontano entrambi la sconfitta contro Crasso nel 71 a.C."] }]
