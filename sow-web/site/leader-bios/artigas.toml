[articles.en]
text = "José Gervasio Artigas Arnal was a soldier and statesman who is regarded as a national hero in Uruguay and the Father of the Nation."
title = "José Gervasio Artigas"
lang = "en"
url = "https://en.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas Arnal (Spanish pronunciation: [xoˈse xeɾˈβa.sjo aɾˈti.ɣas aɾˈnal]; June 19, 1764 – September 23, 1850) was a soldier and statesman who is regarded as a national hero in Uruguay and the Father of the Nation.",
  "Born in Montevideo, Artigas enlisted in the Spanish military in 1797 and fought the British in the Anglo-Spanish War. At the outbreak of the Spanish-American wars of independence, Artigas supported the Primera Junta in Buenos Aires against Spain. He defeated the Spanish royalists at Las Piedras and laid siege to Montevideo, but was forced to withdraw in the face of Portuguese intervention. Artigas subsequently broke with the centralist government of Buenos Aires and took over Montevideo in 1815. He then oversaw the creation of the Federal League, an alliance of six provinces under a federal style of government.",
  "In 1816, the United Kingdom of Portugal, Brazil and the Algarves invaded the Banda Oriental, eventually annexing it as a province. Artigas was driven into Paraguay, where he lived in exile until his death in 1850.",
]
sections = [
  { "title" = "Biography", "paragraphs" = [
      "Artigas was born in Montevideo on June 19, 1764. His grandparents were from Zaragoza, Buenos Aires and Tenerife (Canary Islands). His grandparents fought in the War of the Spanish Succession and moved to the Americas to escape from poverty, settling in Buenos Aires in 1716. Artigas was the son of Martín José Artigas and Francisca Antonia Arnal, who came from a wealthy family. His parents enrolled him in the Colegio de San Bernardino, to pursue religious studies, but Artigas refused to submit to the school's strict discipline. Before he left the school, he developed a strong friendship with Fernando Otorgues, who would work with him in later years. At the age of 12, he moved to the countryside and worked on his family's farms. His contact with the customs and perspectives of gauchos and Indians made a great impression on him. Once he had come of age, he distanced himself from his parents and became involved in cattle smuggling. This made him a wanted man among the owners of haciendas and with the government in Montevideo. A reward was put out for his death.",
      "Things changed with the opening of the Anglo-Spanish War, and the threat of a British invasion upon the viceroyalty. The viceroy Antonio de Olaguer y Feliú negotiated a pardon with his family, on the condition that he joined the Corps of Blandengues with a hundred men, to form a battalion. Thus, he began his military career in 1797, at the age of 33, with the rank of lieutenant. The attack finally came in 1806, when William Beresford invaded Buenos Aires, in the first British invasion of the River Plate. Although Artigas's unit was tasked with patrolling the frontier with Brazil, he requested to take part in the military expedition that Santiago de Liniers launched from Montevideo to drive the British out of Buenos Aires. His request was granted, and the British were defeated. After the recapture of Buenos Aires, he was tasked with returning to Montevideo and informing the governor Pascual Ruiz Huidobro of the result of the battle. A second British invasion was launched culminating in the Battle of Montevideo, which ended in the fall of Montevideo. Artigas was taken prisoner, but he managed to escape and took refuge in the countryside. He organized groups of gauchos and began a guerrilla war against the British. The British tried to capture Buenos Aires a second time. They were defeated by the local troops and returned Montevideo to Spanish control as part of the terms of capitulation. Artigas was promoted to captain in 1809.",
      "The ideas of the Age of Enlightenment and the outbreak of the Peninsular War (from 1807 to 1814) in Spain, along with the capture of King Ferdinand VII, generated political turbulence all across the Spanish Empire. The absence of the king from the throne (replaced by the French Joseph Bonaparte) and the new ideas of the Enlightenment sparked the Spanish-American wars of independence, between patriots (who wanted to establish republics or constitutional monarchies) and royalists (who wanted to keep an absolute monarchy).",
    ] },
  { "title" = "Ideals", "paragraphs" = [
      "Artiguism has two main sources: the works of American authors such as Thomas Paine (supporters of federalism) and the French authors of the Enlightenment as Jean-Jacques Rousseau. Some books Artigas read in his teens include Paine's Common Sense and Rousseau's The Social Contract. The first \"Caudillo\" or Founding Father of the La Plata territory seems to be inspired more in the British enlightenment than from the French.",
      "The ideology of Artigas is partially taken from U.S. legal texts. The American political liberalism exerted a strong influence on Artigas. Other Hispanic independence leaders, however, were more influenced by the French Revolution and the authors of France. Some historians such as Eugenio Petit Muñoz and Ariosto González, have shown that some paragraphs of the Artiguist documents were taken directly from \"The Independence of the Mainland Justified by Thomas Paine, Thirty Years Ago\" published by Paine in Philadelphia in 1811 and translated immediately into Spanish, and \"Concise History of the United States\" by John McCulloch. Artigas had both books.",
      "The first of the works cited contained a large appendix of documents with the United States Declaration of Independence, the Federal Constitution of 1787 and the State Constitutions of Massachusetts, New Jersey, Pennsylvania and Virginia.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Artigas has become a national hero in Uruguay. This is significant as, since independence, many Uruguayan figures have been heroes of either the Colorado or the Blanco party, while being reviled by the other side. As such, Artigas has been the namesake of numerous places, vessels, etc. throughout Uruguayan history, particularly during periods of peace and reunification between the parties.",
      "Artigas Department, the northernmost region of Uruguay (formed 1 October 1884 from Salto Department).",
      "General Artigas Bridge, which connects Paysandú, Uruguay and Colón, Argentina (completed 1975).",
    ] },
]

[articles.es]
text = "José Gervasio Artigas (Montevideo, Virreinato del Perú, 19 de junio de 1764 - Quinta Ybyray, Asunción del Paraguay, 23 de septiembre de 1850) fue un político, militar y estadista rioplatense que lideró la Revolución Oriental, actuó durante la Guerra de la Independencia de las Provincias Unidas del Río de la Plata y se destacó por ser el heraldo del federalismo en lo que hoy son Uruguay y Argentina.​​​Recibió los títulos de «Jefe de los Orientales»​ y «Protector de los Pueblos Libres». Por sus actuaciones, es recordado en ambas márgenes del Río de la Plata."
title = "José Gervasio Artigas"
lang = "es"
url = "https://es.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas (Montevideo, Virreinato del Perú, 19 de junio de 1764 - Quinta Ybyray, Asunción del Paraguay, 23 de septiembre de 1850) fue un político, militar y estadista rioplatense que lideró la Revolución Oriental, actuó durante la Guerra de la Independencia de las Provincias Unidas del Río de la Plata y se destacó por ser el heraldo del federalismo en lo que hoy son Uruguay y Argentina.​​​Recibió los títulos de «Jefe de los Orientales»​ y «Protector de los Pueblos Libres».",
  "Por sus actuaciones, es recordado en ambas márgenes del Río de la Plata. En Uruguay es el héroe nacional y el máximo prócer del proceso independentista, y se le considera el Padre de la Patria. En la Argentina ha habido un proceso de revisionismo sobre la figura de Artigas, a partir del cual se le reconoce también como prócer de la independencia nacional.​​",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "José Gervasio Artigas nació el 19 de junio de 1764 en Montevideo, que en ese entonces formaba parte del Virreinato del Perú, en el Imperio español.",
      "Fue hijo del militar Martín José Artigas Carrasco y de su esposa Francisca Antonia Pasqual. El matrimonio tuvo seis hijos, siendo José el tercero, según una partida que luce al folio 209 del libro primero de bautismos de la catedral de Montevideo.​ Su abuelo, Juan Antonio Artigas Ordovás (oriundo de la localidad aragonesa de La Puebla de Albortón) y su abuela Ignacia Xaviera Carrasco y Melo-Coutinho, habían sido de los primeros pobladores de la ciudad. Sus abuelos migraron de Zaragoza, Tenerife (en las Islas Canarias) y Buenos Aires. Formaba parte de una de las familias más acaudaladas de Montevideo: su padre era propietario de campos y fue el primer capitán de milicias, desempeñando el cargo de oficial real.",
      "Sus hermanos fueron Martina Antonia, José Nicolás, Manuel Francisco, Pedro Ángel y Cornelio Cipriano. Los dos últimos fallecieron antes de 1806.​",
    ] },
  { "title" = "Traslado de sus restos al Uruguay", "paragraphs" = [
      "En 1855 durante gestión del presidente Venancio Flores, los restos de José Artigas fueron repatriados desde el Paraguay.",
      "Ya en Montevideo se mantuvieron ocho meses en la Capitanía del Puerto y fueron retirados el 20 de noviembre de 1856 cuando se les dio sepultura en el Panteón Nacional del Cementerio Central con la solemnidad correspondiente a los servicios prestados a su país, luego de realizarse las exequias fúnebres en la Iglesia Matriz. Según Joaquín Requena fueron enterrados «bajo la sombra del Sagrado Estandarte del divino libertador del género humano» y en su lápida se leía la siguiente inscripción:",
      "En 1859, mientras se realizaban obras en el Cementerio Central, los restos fueron trasladados en forma temporal al sepulcro familiar del pariente de Artigas, el expresidente de la república Gabriel Pereira. El 24 de enero de 1864 los restos volvieron al Cementerio Central y fueron depositados en la Rotonda del Cementerio Central, cuya construcción había finalizado el año anterior.",
    ] },
  { "title" = "Perfil", "paragraphs" = [
      "José Artigas tuvo una actuación destacada en las Guerras de independencia hispanoamericanas y en el predominio de las ideas republicanas sobre las monárquicas. Luchó sucesivamente contra el Imperio español y el Reino Unido de Portugal, Brasil y Algarve y contra los unitarios de las Provincias Unidas del Río de la Plata, tanto de Buenos Aires como de Montevideo.",
      "Artigas era oriental, entendiéndose como tal al habitante de la Banda Oriental de las Provincias Unidas del Río de la Plata, que estaba compuesta por lo que actualmente es Uruguay y por parte del actual estado brasileño de Río Grande del Sur. De manera directa, sus luchas se orientaron a la conformación de la Liga Federal, organizada estrictamente sobre los principios de la república y del federalismo. A la Liga Federal se unieron, además de la Provincia Oriental, las provincias de Córdoba, Corrientes, Entre Ríos, Santa Fe y los pueblos de Misiones bajo el control de Andresito Guazurarí, todas ellas parte actual de la República Argentina, por entonces las Provincias Unidas del Río de la Plata.",
      "Su férrea defensa de la autonomía federal de las provincias contribuyó de manera indirecta a la independencia de España de los territorios que conformaron la Liga Federal. En 1828, al concluir la Guerra del Brasil, parte de la Provincia Oriental —el norte se mantuvo en poder brasileño— se transformó en un estado independiente del resto de las provincias argentinas surgiendo el Estado Oriental del Uruguay. Es decir que Artigas jamás consideró a la Banda Oriental como país independiente, ni nunca la llamó Uruguay.​",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Las raíces del ideario de José Artigas tienen dos fuentes principales. Artigas leyó en su adolescencia libros que provenían de Europa y Estados Unidos, como Sentido común de Thomas Paine y El contrato social de Rousseau, entre otros de autores de la Ilustración.",
      "Fue educado en una escuela católica de franciscanos, de la que se retiró a las estancias de su padre, a la que se ubicaba en las tierras que lindan la Villa de Casupá. En la primera etapa de su vida no fue influido por ideas revolucionarias. Su educación no fue muy ortodoxa aunque si demostró brillantez en su desempeño. Cuentan cronistas de la época, que en el tiempo de su Campamento de Purificación, en que contaba con tres o cuatro secretarios, les dictaba cartas simultáneamente a los cuatro, con sorprendente lucidez, en las que se ocupaba desde la organización administrativa y política, pasando por cartas diplomáticas y asuntos menores como restituciones de bienes a gente del pueblo, o fijar pensiones para viudas e hijos de sus combatientes caídos en acción. De su vinculación con la campaña adquirió experiencia para la revolución que luego llevó a cabo.",
      "En la opinión del investigador Carlos Maggi, lo que marcó a Artigas en su adolescencia fue su relación con los indígenas, negros y gauchos. Se mezclaron sus raíces, su avidez, lo que leyó y su contacto con la alta sociedad montevideana y con la parte marginada de la sociedad.[cita requerida]",
    ] },
]

[articles.fr]
text = "José Gervasio Artigas y Arnal, né le 19 juin 1764 à Montevideo (Uruguay) et mort le 23 septembre 1850 à Ibiray (Paraguay), est un militaire des Provinces-Unies du Río de la Plata qui participa à la guerre d'indépendance de l'Argentine et de l'Uruguay, il est d'ailleurs surnommé « El Libertador »."
title = "José Gervasio Artigas"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas y Arnal, né le 19 juin 1764 à Montevideo (Uruguay) et mort le 23 septembre 1850 à Ibiray (Paraguay), est un militaire des Provinces-Unies du Río de la Plata qui participa à la guerre d'indépendance de l'Argentine et de l'Uruguay, il est d'ailleurs surnommé « El Libertador ».",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "José Artigas naquit à Montevideo dans une riche famille de grands propriétaires terriens ; il était le petit-fils du chef d'une des sept familles fondatrices de Montevideo. À l'âge de 12 ans, il parcourait déjà à cheval les terres de sa famille et s'intéressait aux travaux du domaine. Vivant parmi les habitants locaux et particulièrement les gauchos et indigènes (sa première compagne fut une indigène), il devint un très bon cavalier et manieur d'armes à feu dont le nom était connu et respecté à travers toute la campagne locale. Il s'engagea aussi notoirement dans des affaires de contrebande agraire sur les frontières brésiliennes.",
      "À l'âge de 33 ans, alors qu'il recherchait l'amnistie réservée à ceux qui n'avaient pas commis d'actes violents, il intégra le régiment de Blandengues (aujourd'hui, la garde d'honneur) chargé de maintenir l'ordre rural et protéger la frontière avec le Brésil, où il monta vite en grade.",
      "En 1810, l'Espagne transféra les institutions de la vice-royauté du Río de la Plata à Montevideo puisque la révolution de mai forçait le vice-roi à abandonner Buenos Aires. Le 15 février 1811, il quitta le régiment de Blandengues et partit à Buenos Aires pour offrir ses services à la cause révolutionnaire. Les peuples des colonies espagnoles de l'Amérique entière commençaient les guerres d'indépendance et Artigas voulait mener cet idéal dans la bande Orientale. C'est donc au début du mois d'avril qu'il retourna dans son pays avec environ 180 soldats, mandaté par le gouvernement de Buenos Aires. Le 11 avril, il prononça la proclamation de Mercedes et devint le chef de la révolution le 18 mai lorsqu'il défit les forces espagnoles à la bataille de Las Piedras. Puis il commença le siège de Montevideo et fut officiellement nommé Premier chef des Orientaux (Primer Jefe de los Orientales).",
    ] },
  { "title" = "Idéal", "paragraphs" = [
      "On dit qu'il admirait les États-Unis d'Amérique et qu'il portait toujours sur lui une reproduction de la Constitution des États-Unis d'Amérique. Il voulait que le gouvernement des Provinces-Unies du Río de la Plata fût fondé sur la même idée de fédéralisme. C'est cet idéal que ne supportait pas le gouvernement central de Buenos Aires qui voulait un État centralisé comme les monarchies européennes, mais il réussit tout de même à avoir le soutien de nombreuses provinces. C'est pour cette raison que Buenos Aires et le Portugal voulaient sa mort.",
      "Diverses statues lui rendent hommage à Washington, DC, à Montevideo, un buste à Paris, ainsi que dans la ville de Québec.",
    ] },
]

[articles.de]
text = "José Gervasio Artigas (* 19. Juni 1764 in Montevideo, Vizekönigreich des Río de la Plata; † 23."
title = "José Gervasio Artigas"
lang = "de"
url = "https://de.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas (* 19. Juni 1764 in Montevideo, Vizekönigreich des Río de la Plata; † 23. September 1850 in Ibiray bei Asunción, Paraguay) war ein uruguayischer General und Politiker. Er ist in Uruguay ein Nationalheld und wird auch als „Vater der Unabhängigkeit Uruguays“ bezeichnet. Die Titel „Jefe de los Orientales“ (Führer der Östlichen – ein Alternativname für die Bewohner des heutigen Uruguay, der sich auf die Lage östlich des Río Uruguay bezieht) und „Protector de los Pueblos Libres“ (Beschützer der Freien Völker) erhielt er wegen seiner Verdienste um die Revolution im Vizekönigreich des Río de la Plata gegen die Kolonialherrschaft und die Bildung der Departamentos nach Vorbild der US-Bundesstaaten.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Artigas wurde in Montevideo als Sohn des Polizeioffiziers Martin José Artigas und seiner Frau Antonia Arnal Rodríguez geboren. Die Familie Artigas stammt aus Puebla de Albortón (Provinz Saragossa, Region Aragonien, in Nordspanien). Sein Großvater war einer der ersten Siedler Montevideos. José Gervasio erhielt die Grundschulausbildung im Franziskanerkloster von St. Bernardino, in dessen Kolleg er vermutlich 1774 eintrat. Mit zwölf Jahren ging er auf die familieneigenen Ländereien in die Banda Oriental (später synonym für Uruguay). Er bekam dort engen Kontakt zu den Gauchos und lernte das Reiten und den Umgang mit Waffen. Auch beteiligte er sich an illegalen Tätigkeiten wie dem Schmuggel an der Grenze zu Brasilien und dem Viehdiebstahl. Er lebte im Norden des Landes mit Frau und Sohn am Río Negro in engem Kontakt zu den Ureinwohnern, den Charrúas. Mit 33 Jahren nahm er 1797 eine Amnestie in Anspruch und trat in das Korps von Blandengues (Cuerpo de Blandengues) ein, eine Miliz des Vizekönigreichs des Río de la Plata, deren Aufgabe es war, die Grenze zu Brasilien zu schützen. Im Korps traf Artigas auf einen aus Montevideo stammenden Afrikaner, Joaquín Lenzina, der in portugiesische Gefangenschaft geraten war. Artigas kaufte ihn aus der Sklaverei frei. Lenzina, bekannt als „der schwarze Ansina“, begleitete ihn sein Leben lang als sein bester Freund, Kriegskamerad und Chronist. Um die Jahrhundertwende war Artigas als Adjutant Félix de Azaras auch mit der Problematik der Bodenverteilung befasst. Im Jahre 1803 erfolgte seine Ernennung zum Comandante general de la Campaña, dem Befehlshaber für das flache Land. In diesem Zusammenhang war er nun unter anderem mit der Schmuggelbekämpfung befasst.",
      "Artigas hatte wesentlichen Anteil an der Gründung der Stadt Batovy im Gebiet Misiones Orientales. Von 1806 bis 1807 beteiligte er sich am spanischen Widerstand gegen die britische Invasion am Rio de la Plata. Für seinen Einsatz zur Befreiung von Montevideo und Buenos Aires wurde er zum Kapitän der Miliz und wenig später zum Adjudantmajor ernannt. Bei einer weiteren Schlacht kam Artigas in englische Gefangenschaft und sollte nach England verschifft werden. Aufgrund einer Verwundung wurde davon Abstand genommen.",
      "Wegen Napoleons Eingriff in die spanische Innenpolitik mit der Abdankung König Karls IV. war die spanische Macht in den Kolonien geschwächt. Im Vizekönigreich des Río de la Plata kam es am 25. Mai 1809 zum ersten Aufstand in der Stadt Chuquisaca. Am 25. Mai 1810 wurde Vizekönig Baltasar de Cisneros in Buenos Aires abgesetzt. An seine Stelle trat ein gewählter Rat als Folge der Mairevolution. Die spanische Regierung verlegte ihren Sitz nach Montevideo. Artigas stand noch in spanischen Diensten und sollte einen Volksaufstand in der Banda Oriental niederschlagen. Die örtlichen Anführer bereiteten ihm eine Niederlage.",
    ] },
  { "title" = "Visionen", "paragraphs" = [
      "Artigas bewunderte die Vereinigten Staaten von Amerika und nahm sich die amerikanische Verfassung zum Vorbild. Er wollte die Provinzen am Rio de la Plata zu einem Bundesstaat zusammenführen. Die Regierung in Buenos Aires strebte einen Zentralstaat an. Sie spielte mit dem Gedanken, nach europäischem Vorbild einen Monarchen an die Spitze zu stellen. Das alles verstieß gegen die Grundüberzeugung von Artigas.",
    ] },
  { "title" = "Ehrung", "paragraphs" = [
      "Die sterblichen Überreste Artigas’ wurden 1856 sechs Jahre nach seinem Tod nach Montevideo überführt und im Panteón Nacional beigesetzt. Sein Grabstein wurde mit der Inschrift Artigas: fundador de la nacionalidad oriental versehen. Heute befindet sich im Herzen Montevideos auf der Plaza Independencia das Artigas-Mausoleum, über dem eine den Platz prägende Artigas-Reiter-Statue thront. Artigas wird heute in Uruguay als der Nationalheld des Landes verehrt. Das Land prägte viele Münzen mit seinem Porträt. Das Departamento Artigas trägt ebenso seinen Namen wie auch die gleichnamige Departamento-Hauptstadt. Standbilder von Artigas stehen in Montevideo, Santiago de Chile, Minnesota, Newark (New Jersey), New York und Washington, D.C. In vielen uruguayischen Städten existieren zudem nach ihm benannte Plätze. Eine ausgestorbene große Nagetierart, deren Fossilien in Uruguay gefunden wurden, erhielt zu Ehren von Artigas den Namen Josephoartigasia. Auch der ehemalige Hauptbahnhof Montevideos wurde nach ihm benannt: Montevideo Estación Central General Artigas. Auf dem Gipfel des Cerro Artigas wurde ein Denkmal für José Gervasio Artigas errichtet. Das ehemalige deutsche Trossschiff Freiburg wurde als General Artigas (ROU04) von der Marine von Uruguay übernommen.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "John Street: Artigas and the Emancipation of Uruguay, Cambridge University Press 1971, ISBN 0-521-06563-1.",
      "Manuel Lucena Salmoral: José Gervasio Artigas: gaucho y confederado. Anaya, Madrid 1988, ISBN 84-207-3447-0.",
      "Manfred Kossok in Biographien zur Weltgeschichte, VEB Deutscher Verlag der Wissenschaften, Berlin 1989, S. 49.",
    ] },
]

[articles.it]
text = "José Gervasio Artigas Arnal (Montevideo, 19 giugno 1764 – Asunción, 23 settembre 1850) è stato un militare, politico ed eroe nazionale uruguaiano. Agì durante la Guerra d'Indipendenza delle Province Unite del Río de la Plata e si distinse per essere il precursore del federalismo nel paese."
title = "José Gervasio Artigas"
lang = "it"
url = "https://it.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas Arnal (Montevideo, 19 giugno 1764 – Asunción, 23 settembre 1850) è stato un militare, politico ed eroe nazionale uruguaiano.",
  "Agì durante la Guerra d'Indipendenza delle Province Unite del Río de la Plata e si distinse per essere il precursore del federalismo nel paese. Ricevette il titolo di \"Jefe de los Orientales\" (Capo degli Orientali) e \"Protector de los Pueblos Libres” (Protettore dei popoli liberi). È stato fondamentale per la nascita dell'Uruguay, ma è considerato un eroe anche in Argentina.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "José Gervasio Artigas nacque a Montevideo il 19 giugno 1764, terzo di sei figli, da Martín José Artigas e Francisca Antonia Arnal, come riportato nel libro di battesimi della chiesa madre della parrocchia dell’Immacolata Concezione di Montevideo a pagina 209. I suoi fratelli erano: Martina Antonia, José Nicolás, Manuel Francisco, Pedro Ángel e Cornelio Cipriano. Gli ultimi due morirono prima del 1806.",
      "Suo padre era un proprietario terriero e primo capitano della Milizia, nonché funzionario del re. La sua famiglia era tra le più benestanti di Montevideo. I suoi nonni, Juan Antonio Artigas Ordobas e Ignacia Xaviera Carrasco, furono tra i primi coloni della città. Erano originari di Saragozza, Buenos Aires e Tenerife ed avevano combattuto nella Guerra di successione spagnola migrando, successivamente, nell’America spagnola per scappare dalla povertà.",
      "José ricevette la migliore istruzione possibile per l’epoca impartita dai Padri Francescani del convento di San Bernardino e crescendo trascorse la sua adolescenza occupandosi delle attività rurali nei possedimenti di suo padre, vicino al ruscello Carrasco, dove le autorità locali, poco più che nominali, erano incapaci di badare ai \"guachos\" (delinquenti), di contenere l’avanzata di gruppi indiani chuarras e di impedire lo scambio dei contrabbandieri portoghesi.",
    ] },
  { "title" = "Monumenti ad Artigas", "paragraphs" = [
      "Un monumento equestre che omaggia Artigas si erge nella Plaza Independencia della capitale uruguaiana Montevideo. La statua bronzea, su piedistallo in granito, alta 17 metri, è opera della scultore Angelo Zanelli che vinse il concorso bandito nel 1913 e fu inaugurata dieci anni più tardi.",
      "Anche in gran parte delle principali città argentine ci sono monumenti, strade o quartieri dedicati ad Artigas. Nel 1955 il governo argentino ha ordinato la costruzione di un monumento in Plaza República Oriental del Uruguay a Buenos Aires, nel famoso quartiere di Recoleta.",
      "In Paraguay, un importante viale di Asunción porta il suo nome e nel novembre del 2002 è stato inaugurato, anche, un monumento in Plaza Uruguaya.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(ES) Victor Arreguine, Historia del Uruguay, Montevideo, Imprenta y Litografía La Razon, 1892, ISBN 9781296097837.",
      "(ES) Eduardo Acevedo, José Artigas. Jefe de los orientales y protector de los pueblos libres, Montevideo, Atenas, 1950, ISBN 1334394733.",
      "(ES) Annua Zorrilla de San Martín, La epopeya de Artigas : historia de los tiempos heroicos de la República Oriental del Uruguay, Montevideo, Imprenta Nacional Colorada, 1930, ISBN 1332489141.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Artigas, José Gervasio, su Treccani.it – Enciclopedie on line, Istituto dell'Enciclopedia Italiana.",
      "Artigas, José Gervasio, in Dizionario di storia, Istituto dell'Enciclopedia Italiana, 2010.",
      "(EN) José Gervasio Artigas, su Enciclopedia Britannica, Encyclopædia Britannica, Inc.",
    ] },
]

[articles.pt]
text = "José Gervasio Artigas (Montevidéu, Virreinato do Peru, 19 de junho de 1764 – Quinta Ybyray, Assunção do Paraguai, 23 de setembro de 1850) foi um político, militar e estadista rioplatense que liderou a Revolução Oriental, atuou durante a Guerra da Independência das Províncias Unidas do Rio da Prata e se destacou por ser o arauto do federalismo no que hoje são Uruguai e Argentina. Recebeu os títulos de «Chefe dos Orientais» e «Protetor dos Povos Livres»."
title = "José Artigas"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Jos%C3%A9_Artigas"
intro = [
  "José Gervasio Artigas (Montevidéu, Virreinato do Peru, 19 de junho de 1764 – Quinta Ybyray, Assunção do Paraguai, 23 de setembro de 1850) foi um político, militar e estadista rioplatense que liderou a Revolução Oriental, atuou durante a Guerra da Independência das Províncias Unidas do Rio da Prata e se destacou por ser o arauto do federalismo no que hoje são Uruguai e Argentina. Recebeu os títulos de «Chefe dos Orientais» e «Protetor dos Povos Livres».",
  "Por suas atuações, é lembrado em ambas as margens do Rio da Prata. No Uruguai é o herói nacional e o máximo prócer do processo independentista, e é considerado o Pai da Pátria. Na Argentina houve um processo de revisionismo sobre a figura de Artigas, a partir do qual se lhe reconhece também como prócer da independência nacional.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "José Gervasio Artigas nasceu em 19 de junho de 1764 em Montevidéu, que na época fazia parte do Vice-Reino do Peru, no Império Espanhol.",
      "Foi filho do militar Martín José Artigas Carrasco e de sua esposa Francisca Antonia Pasqual. O casal teve seis filhos, sendo José o terceiro, segundo uma certidão que consta no folio 209 do primeiro livro de batismos da Catedral de Montevidéu. Seu avô, Juan Antonio Artigas Ordovás (natural da localidade aragonesa de La Puebla de Albortón) e sua avó Ignacia Xaviera Carrasco e Melo-Coutinho, foram dos primeiros povoadores da cidade. Seus avós migraram de Zaragoza, Tenerife (nas Ilhas Canárias) e Buenos Aires. Fazia parte de uma das famílias mais abastadas de Montevidéu: seu pai era proprietário de campos e foi o primeiro capitão de milícias, exercendo o cargo de oficial real.",
      "Seus irmãos foram Martina Antonia, José Nicolás, Manuel Francisco, Pedro Ángel e Cornelio Cipriano. Os dois últimos faleceram antes de 1806.",
    ] },
  { "title" = "Translado de seus restos ao Uruguai", "paragraphs" = [
      "Em 1855 durante a gestão do presidente Venancio Flores, os restos de José Artigas foram repatriados do Paraguai. Já em Montevidéu se mantiveram oito meses na Capitania do Porto e foram retirados em 20 de novembro de 1856 quando se lhes deu sepultura no Panteão Nacional do Cemitério Central com a solenidade correspondente aos serviços prestados a seu país, após se realizarem as exéquias fúnebres na Igreja Matriz. Segundo Joaquín Requena foram enterrados «sob a sombra do Sagrado Estandarte do divino libertador do gênero humano» e em sua lápide se lia a seguinte inscrição:Citação: «Artigas: fundador da nacionalidade oriental».",
      "Em 1859, enquanto se realizavam obras no Cemitério Central, os restos foram trasladados em forma temporária ao sepulcro familiar do parente de Artigas, o ex-presidente da república Gabriel Pereira. Em 24 de janeiro de 1864 os restos voltaram ao Cemitério Central e foram depositados na Rotunda do Cemitério Central, cuja construção havia finalizado no ano anterior.",
      "Em 1877 durante o governo de Lorenzo Latorre, a urna foi trocada por outra construída «em madeira de cedro folheada em jacarandá, com incrustações de prata, com seu correspondente pedestal».",
    ] },
  { "title" = "Perfil", "paragraphs" = [
      "José Artigas teve uma atuação destacada nas Guerras de independência hispano-americanas e no predomínio das ideias republicanas sobre as monárquicas. Lutou sucessivamente contra o Império Espanhol e o Reino Unido de Portugal, Brasil e Algarves e contra os unitários das Províncias Unidas do Rio da Prata, tanto de Buenos Aires como de Montevidéu.",
      "Artigas era oriental, entendendo-se como tal o habitante da Banda Oriental das Províncias Unidas do Rio da Prata, que estava composta pelo que atualmente é o Uruguai e por parte do atual estado brasileiro do Rio Grande do Sul. De maneira direta, suas lutas se orientaram à conformação da Liga Federal, organizada estritamente sobre os princípios da república e do federalismo. À Liga Federal se uniram, além da Província Oriental, as províncias de Córdoba, Corrientes, Entre Rios, Santa Fé e os povos de Missões sob o controle de Andresito Guazurarí, todas elas parte atual da República Argentina, por então as Províncias Unidas do Rio da Prata.",
      "Sua férrea defesa da autonomia federal das províncias contribuiu de maneira indireta à independência da Espanha dos territórios que conformaram a Liga Federal. Em 1828, ao concluir a Guerra do Brasil, parte da Província Oriental — o norte se manteve em poder brasileiro — se transformou num estado independente do resto das províncias argentinas surgindo o Estado Oriental do Uruguai. Ou seja, Artigas jamais considerou a Banda Oriental como país independente, nem nunca a chamou Uruguai.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "As raízes do ideário de José Artigas têm duas fontes principais. Artigas leu em sua adolescência livros que provinham da Europa e Estados Unidos, como Senso comum de Thomas Paine e O contrato social de Rousseau, entre outros de autores do Iluminismo.",
      "Foi educado numa escola católica de franciscanos, da qual se retirou para as estâncias de seu pai, que se localizava nas terras que ladeiam a Vila de Casupá. Na primeira etapa de sua vida não foi influenciado por ideias revolucionárias. Sua educação não foi muito ortodoxa embora tenha demonstrado brilhantismo em seu desempenho. Contam cronistas da época, que no tempo de seu Acampamento de Purificação, em que contava com três ou quatro secretários, ditava cartas simultaneamente aos quatro, com surpreendente lucidez, nas quais se ocupava desde a organização administrativa e política, passando por cartas diplomáticas e assuntos menores como restituições de bens a gente do povo, ou fixar pensões para viúvas e filhos de seus combatentes caídos em ação. De sua vinculação com a campanha adquiriu experiência para a revolução que depois levou a cabo.",
      "O ideário artiguista se compunha de ideias políticas, as quais se expressaram nas Instruções do ano XIII e na conformação da Liga Federal. Também tinha ideias socioeconômicas, que se expressaram no Regulamento de Terras, o Regulamento Provisorio da Província Oriental para o fomento de sua campanha e segurança de seus Fazendeiros e o Regulamento Provisorio de Tarifas Aduaneiras para as Províncias Confederadas da Banda Oriental do Paraná.",
    ] },
]

[articles.ko]
text = "호세 헤르바시오 아르티가스 아르날(스페인어: José Gervasio Artigas Arnal, 스페인어 발음: [xoˈse xeɾˈβa.sjo aɾˈti.ɣas aɾˈnal], 1764년 6월 19일~1850년 9월 23일)은 우루과이의 군인, 정치인으로 우루과이의 국가적 영웅이자 우루과이 건국의 아버지로 추대받는다. 몬테비데오에서 태어난 아르티가스는 1797년 스페인 군대에 입대하여 영국-스페인 전쟁 (1796년~1808년)에서 영국군과 싸웠다."
title = "호세 헤르바시오 아르티가스"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%ED%98%B8%EC%84%B8_%ED%97%A4%EB%A5%B4%EB%B0%94%EC%8B%9C%EC%98%A4_%EC%95%84%EB%A5%B4%ED%8B%B0%EA%B0%80%EC%8A%A4"
intro = [
  "호세 헤르바시오 아르티가스 아르날(스페인어: José Gervasio Artigas Arnal, 스페인어 발음: [xoˈse xeɾˈβa.sjo aɾˈti.ɣas aɾˈnal], 1764년 6월 19일~1850년 9월 23일)은 우루과이의 군인, 정치인으로 우루과이의 국가적 영웅이자 우루과이 건국의 아버지로 추대받는다.",
  "몬테비데오에서 태어난 아르티가스는 1797년 스페인 군대에 입대하여 영국-스페인 전쟁 (1796년~1808년)에서 영국군과 싸웠다. 스페인령 아메리카 독립 전쟁이 발발하자 아르티가스는 스페인에 맞서 부에노스아이레스의 제1차 정부를 지지했다. 그는 라스 피에드라스 전투에서 스페인 왕당파를 격파하고 몬테비데오를 포위했으나, 포르투갈의 개입에 직면하여 철수해야만 했다. 이후 아르티가스는 부에노스아이레스의 중앙집권 정부와 결별하고 1815년 몬테비데오를 점령했다. 그는 연방제 방식의 정부 아래 6개 주의 동맹인 연방 연합 창설을 주도했다.",
  "1816년, 포르투갈 브라질 알가르브 연합왕국이 반다 오리엔탈을 침공하여 결국 하나의 주로 합병했다. 아르티가스는 파라과이로 쫓겨났고, 그곳에서 1850년 사망할 때까지 망명 생활을 했다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "아르티가스는 1764년 6월 19일 몬테비데오에서 태어났다. 그의 조부모는 사라고사, 부에노스아이레스, 카나리아 제도의 테네리페섬 출신이었다. 그의 조부모는 스페인 왕위 계승 전쟁에서 싸웠으며 가난을 피해 아메리카로 이주하여 1716년 부에노스아이레스에 정착했다. 아르티가스는 마르틴 호세 아르티가스와 부유한 집안 출신인 프란시스카 안토니아 아르날의 아들이었다. 그의 부모는 그를 종교 공부를 시키기 위해 산 베르나르디노 학교에 입학시켰으나, 아르티가스는 학교의 엄격한 규율에 따르기를 거부했다. 학교를 떠나기 전, 그는 훗날 함께 일하게 될 페르난도 오토르게스와 깊은 우정을 쌓았다. 12세의 나이에 그는 시골로 이주하여 가족의 농장에서 일했다. 가우초와 인디언들의 관습과 시각을 접한 것은 그에게 큰 감명을 주었다. 성년이 된 후 그는 부모와 멀어지고 가축 밀수업에 관여하게 되었다. 이로 인해 그는 대농장주들과 몬테비데오 정부 사이에서 수배자가 되었고, 그의 목에는 현상금이 걸렸다.",
      "영국-스페인 전쟁 (1796년~1808년)이 시작되고 부왕령에 대한 영국의 침공 위협이 다가오면서 상황이 변했다. 부왕 안토니오 데 올라게르 이 펠리우는 그가 100명의 인원과 함께 블랑덴게스 군단에 입대하여 대대를 구성한다는 조건으로 그의 가족과 사면을 협상했다. 그리하여 그는 1797년 33세의 나이로 중위 계급을 달고 군 경력을 시작했다. 마침내 1806년 윌리엄 베레스포드가 제1차 리오데라플라타 영국 침공 당시 부에노스아이레스를 침공했다. 아르티가스의 부대는 브라질과의 국경을 순찰하는 임무를 맡고 있었으나, 그는 티아고 데 리니에르스가 부에노스아이레스에서 영국군을 몰아내기 위해 몬테비데오에서 발족한 군사 원정에 참여하기를 요청했다. 그의 요청은 승인되었고 영국군은 패배했다. 부에노스아이레스 탈환 후, 그는 몬테비데오로 돌아가 주지사 파스쿠알 루이스 우이도브로에게 전투 결과를 보고하는 임무를 맡았다. 이어진 제2차 영국 침공은 몬테비데오 전투로 절정에 달했으며, 몬테비데오의 함락으로 끝났다. 아르티가스는 포로가 되었으나 탈출에 성공하여 시골로 피신했다. 그는 가우초 그룹을 조직하여 영국군을 상대로 게릴라전을 시작했다. 영국군은 두 번째로 부에노스아이레스를 점령하려 시도했으나 현지 군대에 패배했고, 항복 조건에 따라 몬테비데오를 다시 스페인의 통제하에 돌려주었다. 아르티가스는 1809년 대위로 진급했다.",
      "스페인에서의 계몽시대 사상과 반도 전쟁(1807년~1814년)의 발발, 국왕 페르난도 7세의 생포는 스페인 제국 전역에 정치적 격변을 일으켰다. 왕의 부재(프랑스의 조제프 보나파르트가 대신함)와 새로운 계몽주의 사상은 애국파(공화국이나 입헌군주제 수립을 원함)와 왕당파(절대군주제 유지를 원함) 사이의 스페인령 아메리카 독립 전쟁을 촉발했다. 가우초들이 제대로 대우받지 못한다고 생각했던 아르티가스는 새로운 사상을 지지했다.",
    ] },
  { "title" = "이념", "paragraphs" = [
      "아르티가스주의(Artiguism)에는 두 가지 주요 원천이 있다. 토머스 페인(연방주의 지지자)과 같은 미국 작가들의 저작과 장자크 루소와 같은 계몽주의 시대 프랑스 작가들의 저작이다. 아르티가스가 십대 시절 읽은 책 중에는 페인의 상식과 루소의 사회계약론이 포함되어 있다. 라플라타 영토의 첫 번째 \"카우디요\" 또는 건국의 아버지는 프랑스보다는 영국의 계몽주의에서 더 많은 영감을 받은 것으로 보인다.",
      "아르티가스의 이념은 부분적으로 미국의 법률 문서에서 따온 것이다. 미국의 정치적 자유주의는 아르티가스에게 강한 영향을 미쳤다. 그러나 다른 히스패닉 독립 지도자들은 프랑스 혁명과 프랑스 작가들의 영향을 더 많이 받았다. 에우헤니오 페티 무뇨스와 아리오스토 곤살레스와 같은 일부 역사학자들은 아르티가스 문서의 일부 문단이 1811년 필라델피아에서 페인이 출판하고 즉시 스페인어로 번역된 \"30년 전 토머스 페인에 의해 정당화된 본토의 독립\"과 존 매컬록의 \"미국 약사\"에서 직접 가져온 것임을 보여주었다. 아르티가스는 두 책을 모두 가지고 있었다.",
      "인용된 저작 중 첫 번째 책에는 미국 독립선언, 1787년 연방 헌법 및 매사추세츠주 헌법, 뉴저지주 헌법, 펜실베이니아주 헌법, 버지니아주 헌법 등 주 헌법 문서들이 대규모 부록으로 포함되어 있었다.",
    ] },
  { "title" = "유산", "paragraphs" = [
      "아르티가스는 우루과이의 국가적 영웅이 되었다. 이는 독립 이후 많은 우루과이 인물들이 적색당이나 백색당 중 한쪽의 영웅이면서 다른 쪽으로부터는 비난을 받았던 것과 대조적이라 큰 의미가 있다. 따라서 아르티가스는 우루과이의 역사 전반에 걸쳐, 특히 각 정당 간의 평화와 재통합 시기에 수많은 장소, 선박 등의 이름이 되었다.",
      "호세 아르티가스의 동상은 워싱턴 D.C.의 컨스티튜션 애비뉴, 뉴욕 스프링 스트리트 공원의 6번가 살토의 아르티가스 광장, 베네수엘라 카라카스, 그리스 아테네, 멕시코시티, 뉴어크에, 에콰도르 키토, 미네소타주 몬테비디오 시내 중심가와 우루과이 푼타델에스테에 세워져 있다. 파라과이 아순시온의 우루과이 광장에도 아르티가스 동상이 있으며, 1926년 그를 기리기 위해 카예 세바스티안 가보토가 아르티가스 대로로 개칭되었다. 부에노스아이레스 레콜레타 지구의 리베르타도르 대로에는 우루과이 조각가 후안 호세 소리야 데 산 마르틴과 건축가 알레한드로 부스티요의 작품인 웅장한 우루과이 카우디요 기념비가 서 있다. 호세 헤르바시오 아르티가스의 흉상은 푸에르토리코 산후안의 루이스 무뇨스 리베라 공원에서도 볼 수 있다.",
    ] },
  { "title" = "더 읽어보기", "paragraphs" = [
      "Félix Luna, José Artigas: El caudillo revolucionario (José Artigas: The Revolutionary Leader). Buenos Aires: Planeta de Agostini, 2009.",
      "Tyson Reeder, \"'Sovereign Lords' and 'Dependent Administrators': Artigan Privateers, Atlantic Borderwaters, and State Building in the Early Nineteenth Century,\" Journal of American History, vol. 103, no. 2 (September 2016), pp. 323–346.",
    ] },
]

[articles.ru]
text = "Хосе́ Херва́сио Арти́гас (исп. José Gervasio Artigas) (19 июня 1764, Монтевидео — 23 сентября 1850, Парагвай) — ла-платский политический деятель, один из руководителей освободительного движения против испанского и португальского колониальных режимов в Южной Америке, национальный герой и отец-основатель уругвайского государства (Восточной Республики Уругвай)."
title = "Артигас, Хосе Хервасио"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%90%D1%80%D1%82%D0%B8%D0%B3%D0%B0%D1%81%2C_%D0%A5%D0%BE%D1%81%D0%B5_%D0%A5%D0%B5%D1%80%D0%B2%D0%B0%D1%81%D0%B8%D0%BE"
intro = [
  "Хосе́ Херва́сио Арти́гас (исп. José Gervasio Artigas) (19 июня 1764, Монтевидео — 23 сентября 1850, Парагвай) — ла-платский политический деятель, один из руководителей освободительного движения против испанского и португальского колониальных режимов в Южной Америке, национальный герой и отец-основатель уругвайского государства (Восточной Республики Уругвай).",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "Хосе Хервасио Артигас родился в 1764 году в Монтевидео — столице испанской колонии Восточная полоса (исп. Banda Oriental, Восточный Берег Рио-де-Ла-Платы). Уроженцем Монтевидео был и его отец, Мартин Хосе де Артигас (1733—1821). Его дед по мужской линии Хуан Антонио Артигас (1693—1775), уроженец Арагона, приехал в Южную Америку в 1716 году. Другие предки Артигаса были гуанчами — выходцами с острова Тенерифе, а может быть, и с других островов Канарского архипелага. В раннем детстве родители отдали Хосе в основанный монахами-францисканцами Колледж Сан-Бернардино, но ему не понравился строгий режим религиозного учебного заведения — и Артигас досрочно покинул его стены. Впрочем, несмотря на это, Артигас на всю жизнь сохранил глубокое уважение к Францисканскому ордену — одной из самых гуманных католических конгрегаций…",
      "В 1776 году, 12 лет от роду, Хосе Хервасио перебрался в сельскую местность и стал работать на фермах, принадлежавших родителям. Вскоре у городского мальчика завязалась дружба с лихими пастухами-гаучо. Артигас успешно овладел и метанием лассо, и работой с боевым ножом, а странствующие певцы-пайядоры научили его неплохо играть на гитаре… Европейские биографы Артигаса обычно подчёркивают, что получивший признание и самоутвердившийся среди гаучо Хосе Артигас по происхождению своему был «не гаучо»: он — «кровный испанец» (как писал, в частности, русский дипломат А. С. Ионин), они — испано-индейские метисы; он — горожанин из интеллигентной семьи, они же, гаучо, представляли собой этносоциальную группу американских номадов, «кочующих мясников»… Однако, уругвайская историография (новейшая — в особенности) подчёркивает, что Артигас был лидером Нации гаучо (Artigas era el lider de la Nación Gaucha) — и в этом есть свой резон. Как утверждает уругвайская историография, предками гаучо по мужской линии были гуанчи, переселившиеся в 1724—1730 годах в район Монтевидео. Часть гуанчей обосновалась в самом городе (где они и породнились с арагонцами Артигасами), большинство же включилось в процесс колонизации Ла-платской Пампы. К тому времени гуанчи уже забыли родной язык, но сохранили стойкое национальное самосознание. И в документах Рио-де-ла-Платы, относящихся к 1-й половине XVIII века, то и дело фигурируют Guanches и Guanchos. Этноним гаучо также не имел единой транскрипции — и в более поздней Ла-платской документации то и дело мелькают Gaucho, Gahuchos, Gaúchos, Gauchos — а также Huacho и Huachus. То есть фонетический переход был довольно-таки плавным…",
      "Итак, 12-летний Артигас попал не в чуждую ему, но родную по крови среду — и блестящим образом самореализовался в этой среде!",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Михайлов С. С. Артигас и его значение в истории Уругвая // Новая и новейшая история — 1965 — № 1.",
      "Хачатуров К. А. Уругвайский феномен. — М.: Международные отношения, 2004. — ISBN 5-7133-1198-8",
      "Acevedo E. Jose Artigas, jefe de los orientales y protector de los pueblos libres. — Montevideo, 1909—1910.",
    ] },
]

[articles.vi]
text = "José Gervasio Artigas Arnal (19 tháng 6 năm 1764-23 tháng 9 năm 1850) là anh hùng dân tộc của Uruguay, đôi khi được gọi là \"cha đẻ của nền độc lập Uruguay\"."
title = "José Gervasio Artigas"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas Arnal (19 tháng 6 năm 1764-23 tháng 9 năm 1850) là anh hùng dân tộc của Uruguay, đôi khi được gọi là \"cha đẻ của nền độc lập Uruguay\".",
]
sections = [
  { "title" = "Tiểu sử", "paragraphs" = [
      "Artigas sinh ra tại Montevideo trong một gia đình giàu có, ở tuổi 12, ông chuyển đến vùng nông thôn và làm việc tại trang trại của gia đình ông. Ở tuổi 33, ông lợi dụng lệnh ân xá cho những tội phạm, gia nhập đoàn Blandengues bảo vệ biên giới cùng với Brasil. Từ năm 1806-1807, ông tham chiến cùng người Tây Ban Nha chống quân xâm lược Anh ở Río de la Plata. Ông là một phần trong lực lượng của chỉ huy người Tây Ban Nha _Santiago de Liniers, bắt đầu từ Montevideo hành quân đẩy lùi quân Anh ra khỏi Buenos Aires.Một cuộc tấn công được quân đội Anh khởi xướng hòng đánh chiếm Montevideo và Artigas bị bắt. Nhưng sau đó ông chạy thoát và tập hợp cùng những người chăn bò ở Nam Mỹ, thực hiện chiến tranh du kích chống Anh thành công và nhượng cho Tây Ban Nha sự kiểm soát đối với Montevideo. Năm 1809, ông được thăng hàm đại úy.",
      "Năm 1810, Tây Ban Nha di chuyển trụ sở chính của Río de la Plata đến Montevideo. Sau Cách mạng thắng lợi, họ buộc phải từ bỏ Buenos Aires. Ngày 15 tháng 2 năm 1811, Artigas dẫn đoàn Blandengues đến Buenos Aires để cung cấp các dịch vụ quân sự của ông cho cuộc chiến giành độc lập thuộc Eastern Bank (ngày nay là Uruguay). Vào đầu tháng tư, ông trở về Eastern Bank cùng khoảng 180 nam giới được cung cấp bởi Chính quyền Buenos Aires và ngày 11 tháng tư, ông ban hành Tuyên ngôn Mercedes.",
      "Năm 1814, ông thành lập Liga de los Pueblos Libres (Hội của Người dân Tự do). Đến sau năm đó, ông giải phóng Montevideo khỏi sự kiểm soát của những đối thủ chính trị đến từ Buenos Aires.",
    ] },
  { "title" = "Danh ngôn", "paragraphs" = [
      "\"Thẩm quyền của tôi xuất phát từ bạn, và nó không còn hiện diện trước khi có chủ quyền của bạn\".",
    ] },
  { "title" = "Lý tưởng", "paragraphs" = [
      "Artigas ngưỡng mộ hợp chúng quốc Hoa Kỳ và luôn mang theo một bản sao của Hiến pháp Hoa Kỳ. Ông muốn các tỉnh hành chính của nước mình phân chia dựa trên ý tưởng tương tự như liên bang Mỹ. Những lý tưởng ấy đã chống lại những gì chính quyền Buenos Aires lúc đó mong muốn là một nhà nước tập trung, một số thậm chí hỗ trợ ý tưởng đặt một vị vua châu Âu phụ trách các vùng đất vừa được độc lập. Ông cũng là người ủng hộ nền dân chủ dựa trên liên minh và luôn phản đối sự quân chủ hóa. Suy nghĩ của Artigas còn bị ảnh hưởng bởi các giáo sĩ Công giáo, trong đó có thư ký của ông.",
    ] },
  { "title" = "Di sản và tưởng niệm", "paragraphs" = [
      "Artigas trở thành một anh hùng quốc gia tại Uruguay. Kể từ khi độc lập, nhiều nhân vật Uruguay đã được phong anh hùng. Cái tên Artigas đã được đặt cho nhiều nơi hay các con tàu,... trong suốt lịch sử Uruguay, đặc biệt trong giai đoạn hòa bình và thống nhất giữa các bên.",
      "Pháo đài Artigas, một bảo tàng quân sự trên đồi Montevideo (hoàn thành năm 1809, đổi tên năm 1882, rededicated 1916).",
      "Các hiệu kỳ Artigas bên ngoài tòa nhà chính phủ Uruguay và được sử dụng bởi tất cả các đơn vị lực lượng vũ trang.",
    ] },
]

[articles.id]
text = "José Gervasio Artigas Arnal (pelafalan dalam bahasa Spanyol: [xoˈse xeɾˈβa.sjo aɾˈti.ɣas aɾˈnal]; 19 Juni 1764 – 23 September 1850) adalah seorang negarawan sekaligus jenderal yang menjadi pahlawan nasional Uruguay."
title = "José Gervasio Artigas"
lang = "id"
url = "https://id.wikipedia.org/wiki/Jos%C3%A9_Gervasio_Artigas"
intro = [
  "José Gervasio Artigas Arnal (pelafalan dalam bahasa Spanyol: [xoˈse xeɾˈβa.sjo aɾˈti.ɣas aɾˈnal]; 19 Juni 1764 – 23 September 1850) adalah seorang negarawan sekaligus jenderal yang menjadi pahlawan nasional Uruguay.",
]
sections = [
  { "title" = "Biografi", "paragraphs" = [
      "Lahir di Montevideo, Artigas bergabung dengan militer Spanyol pada tahun 1797 dan ikut bertempur melawan Inggris dalam Perang Anglo-Spanyol. Saat Perang kemerdekaan Amerika Latin mulai pecah, Artigas memilih berpihak pada Primera Junta di Buenos Aires melawan kekuasaan Spanyol. Ia berhasil mengalahkan pasukan kerajaan Spanyol di Las Piedras dan mengepung Montevideo, meskipun akhirnya terpaksa mundur karena campur tangan Portugis. Setelah itu, ia memutuskan hubungan dengan pemerintahan pusat di Buenos Aires dan mengambil alih Montevideo pada tahun 1815. Dari sana, ia membentuk Liga Federal—aliansi enam provinsi yang mengusung sistem pemerintahan federal. Namun, pada tahun 1816, Britania Raya dari Portugal, Brasil, dan Algarves menyerbu wilayah Banda Oriental dan kemudian mencaploknya sebagai provinsi mereka. Artigas pun terpaksa melarikan diri ke Paraguay, di sana ia hidup dalam pengasingan hingga wafat pada tahun 1850. Jenazahnya dipindahkan ke Pemakaman Sentral Montevideo pada tahun 1855, dan akhirnya, pada tahun 1977, ia dimakamkan kembali secara kehormatan di Mausoleum Artigas.",
    ] },
  { "title" = "Warisan", "paragraphs" = [
      "Artigas telah menjadi pahlawan nasional di Uruguay. Hal ini menjadi penting sebab sejak Uruguay merdeka, banyak tokoh nasional di sana yang menjadi pahlawan untuk salah satu kubu antara Partai Colorado atau Partai Nasional yang saling membenci. Namun Artigas adalah pengecualian langka. Namanya justru sering dipakai untuk menamai berbagai tempat, kapal, dan macam-macam lainnya sepanjang sejarah Uruguay, terutama di masa-masa damai dan saat kedua partai mencoba berdamai dan bersatu lagi.",
      "Departemen Artigas yang beribukota di Artigas diambil dari namanya yang didirikan dua tahun setelah wafatnya Artigas. Hari kelahirannya yaitu 19 juni dirayakan sebagai hari nasional di Uruguay. Klub sepakbola Club Nacional de Football terinspirasi dari bendera Artigas. Di berbagai belahan dunia seperti New Delhi, Sofia dan Bukares menggunakan Artigas sebagai nama jalan.",
    ] },
]

