[articles.en]
text = "William the Conqueror, sometimes called William the Bastard, was the first Norman king of England, reigning from 1066 until his death. A descendant of Rollo, he was Duke of Normandy from 1035 onward."
title = "William the Conqueror"
lang = "en"
url = "https://en.wikipedia.org/wiki/William_the_Conqueror"
intro = [
  "William the Conqueror (c. 1028 – 9 September 1087), sometimes called William the Bastard, was the first Norman king of England (as William I), reigning from 1066 until his death. A descendant of Rollo, he was Duke of Normandy (as William II) from 1035 onward. By 1060, following a long struggle, his hold on Normandy was secure. In 1066, following the death of Edward the Confessor, William invaded England, leading a Franco-Norman army to victory over the Anglo-Saxon forces of Harold Godwinson at the Battle of Hastings. He suppressed subsequent English revolts in what has become known as the Norman Conquest. The rest of his life was marked by struggles to consolidate his hold over England and his continental lands, and by difficulties with his eldest son, Robert Curthose.",
  "William was the son of the unmarried Duke Robert I of Normandy and his mistress Herleva. His illegitimate status and youth caused some difficulties for him after he succeeded his father, as did the anarchy which plagued the first years of his rule. During his childhood and adolescence, members of the Norman aristocracy battled each other, both for control of the child duke and for their own ends. In 1047, William quashed a rebellion and began to establish his authority over the duchy, a process that was not complete until about 1060. His marriage in the 1050s to Matilda of Flanders provided him with a powerful ally in the neighbouring county of Flanders. By the time of his marriage, William was able to arrange the appointment of his supporters as bishops and abbots in the Norman church. His consolidation of power allowed him to expand his horizons, and he secured control of the neighbouring county of Maine by 1062.",
  "In the 1050s and early 1060s, William became a contender for the throne of England held by the childless Edward the Confessor, his first cousin once removed. There were other potential claimants, including the powerful English earl Harold Godwinson, whom Edward named as king on his deathbed in January 1066. Arguing that Edward had previously promised the throne to him and that Harold had sworn to support his claim, William built a large fleet and invaded England in September 1066. He decisively defeated and killed Harold at the Battle of Hastings on 14 October 1066. After further military efforts, William was crowned king on Christmas Day, 1066 in London. He made arrangements for the governance of England in early 1067 before returning to Normandy. Several unsuccessful rebellions followed, but William's hold on England was mostly secure by 1075, allowing him to spend the greater part of his reign in continental Europe.",
  "William's final years were marked by difficulties in his continental domains, troubles with his son, Robert, and threatened invasions of England by the Danes. In 1086, he ordered the compilation of the Domesday Book, a survey listing all of the land-holdings in England along with their pre-Conquest and current holders. He died in September 1087 while leading a campaign in northern France, and was buried in Caen. His reign in England was marked by the construction of castles, settling a new Norman nobility on the land, and a change in the composition of the English clergy. He did not try to integrate his domains into one empire but continued to administer each part separately. His lands were divided after his death: Normandy went to Robert, and England went to his second surviving son, William Rufus.",
]
sections = [
  { "title" = "Background", "paragraphs" = [
      "Norsemen first began raiding in what became Normandy in the late 8th century. Permanent Scandinavian settlement occurred before 911, when Rollo, one of the Viking leaders, and King Charles the Simple of France reached an agreement ceding the county of Rouen to Rollo. The lands around Rouen became the core of the later duchy of Normandy. Normandy may have been used as a base when Scandinavian attacks on England were renewed at the end of the 10th century, which would have worsened relations between England and Normandy. In an effort to improve matters, King Æthelred the Unready took Emma, sister of Richard II, Duke of Normandy, as his second wife in 1002.",
      "Danish raids on England continued, and Æthelred sought help from Richard, taking refuge in Normandy in 1013 when King Swein I of Denmark drove Æthelred and his family from England. Swein's death in 1014 allowed Æthelred to return home, but Swein's son Cnut contested Æthelred's return. Æthelred died unexpectedly in 1016, and Cnut became king of England. Æthelred and Emma's two sons, Edward and Alfred, went into exile in Normandy while their mother, Emma, became Cnut's second wife.",
      "After Cnut's death in 1035, the English throne fell to Harold Harefoot, his son by his first wife, while Harthacnut, his son by Emma, became king in Denmark. England remained unstable. Alfred returned to England in 1036 to visit his mother and perhaps to challenge Harold as king. One story implicates Earl Godwin of Wessex in Alfred's subsequent death, but others blame Harold. Emma went into exile in Flanders until Harthacnut became king following Harold's death in 1040, and his half-brother Edward followed Harthacnut to England; Edward was proclaimed king after Harthacnut's death in June 1042.",
    ] },
  { "title" = "Early life", "paragraphs" = [
      "William was born in 1027 or 1028 at Falaise, Duchy of Normandy, most likely towards the end of 1028. He was the only son of Robert I, son of Richard II. His mother, Herleva, was a daughter of Fulbert of Falaise, who may have been a tanner or embalmer. Herleva was possibly a member of the ducal household, but did not marry Robert. She later married Herluin de Conteville, with whom she had two sons – Odo of Bayeux and Count Robert of Mortain – and a daughter whose name is unknown. One of Herleva's brothers, Walter, became a supporter and protector of William during his minority. Robert I also had a daughter, Adelaide, by another mistress.",
      "Robert I succeeded his elder brother Richard III as duke on 6 August 1027. The brothers had been at odds over the succession, and Richard's death was sudden. Robert was accused by some writers of killing Richard, a plausible but now unprovable charge. Conditions in Normandy were unsettled, as noble families despoiled the Church and Alan III of Brittany waged war against the duchy, possibly in an attempt to take control. By 1031, Robert had gathered considerable support from noblemen, many of whom would become prominent during William's life. They included the duke's uncle Robert, the archbishop of Rouen, who had originally opposed the duke; Osbern, a nephew of Gunnor the wife of Richard I; and Gilbert of Brionne, a grandson of Richard I. After his accession, Robert continued Norman support for the English princes Edward and Alfred, who were still in exile in northern France.",
      "Robert may have been briefly betrothed to a daughter of King Cnut, but no marriage took place. It is unclear whether William would have been supplanted in the ducal succession if Robert had had a legitimate son. Earlier dukes had been illegitimate, and William's association with his father on ducal charters appears to indicate that William was considered Robert's most likely heir. In 1034 the duke decided to go on pilgrimage to Jerusalem. Although some of his supporters tried to dissuade him, he convened a council in January 1035 and had the assembled Norman magnates swear fealty to William as his heir before leaving for Jerusalem. He died in early July at Nicaea, on his way back to Normandy.",
    ] },
  { "title" = "Duke of Normandy", "paragraphs" = [
      "William faced several challenges on becoming duke, including his illegitimate birth and his youth: he was either seven or eight years old. He enjoyed the support of his great-uncle, Archbishop Robert, as well as King Henry I of France, enabling him to succeed to his father's duchy. The support given to the exiled English princes in their attempt to return to England in 1036 shows that the new duke's guardians were attempting to continue his father's policies, but Archbishop Robert's death in March 1037 removed one of William's main supporters, and Normandy quickly descended into chaos.",
      "The anarchy in the duchy lasted until 1047, and control of the young duke was one of the priorities of those contending for power. At first, Alan of Brittany had custody of the duke, but when Alan died in either late 1039 or October 1040, Gilbert of Brionne took charge of William. Gilbert was killed within months, and another guardian, Turchetil, was also killed around the time of Gilbert's death. Yet another guardian, Osbern, was slain in the early 1040s in William's chamber while the duke slept. It was said that Walter, William's maternal uncle, was occasionally forced to hide the young duke in the houses of peasants, although this story may be an embellishment by Orderic Vitalis. The historian Eleanor Searle speculates that William was raised with the three cousins who later became important in his career – William fitzOsbern, Roger de Beaumont, and Roger of Montgomery. Although many of the Norman nobles engaged in their own private wars and feuds during William's minority, the viscounts still acknowledged the ducal government, and the ecclesiastical hierarchy was supportive of William.",
      "King Henry continued to support the young duke, but in late 1046 opponents of William came together in a rebellion centred in lower Normandy, led by Guy of Burgundy with support from Nigel, Viscount of the Cotentin, and Ranulf, Viscount of the Bessin. According to stories that may have legendary elements, an attempt was made to seize William at Valognes, but he escaped under cover of darkness, seeking refuge with King Henry. In early 1047 Henry and William returned to Normandy and were victorious at the Battle of Val-ès-Dunes near Caen, although few details of the fighting are recorded. William of Poitiers claimed that the battle was won mainly through William's efforts, but earlier accounts claim that King Henry's men and leadership also played an important part. William assumed power in Normandy, and shortly after the battle promulgated the Truce of God throughout his duchy, in an effort to limit warfare and violence by restricting the days of the year on which fighting was permitted. Although the Battle of Val-ès-Dunes marked a turning point in William's control of the duchy, it was not the end of his struggle to gain the upper hand over the nobility. The period from 1047 to 1054 saw almost continuous warfare, with lesser crises continuing until 1060.",
    ] },
  { "title" = "English and continental concerns", "paragraphs" = [
      "In 1051, the childless King Edward of England appears to have chosen William as his successor. William was the grandson of Edward's maternal uncle, Richard II of Normandy.",
      "The Anglo-Saxon Chronicle, in the \"D\" version, states that William visited England in the later part of 1051, perhaps to secure confirmation of the succession, or perhaps to secure aid for his troubles in Normandy. The trip is unlikely given William's absorption in warfare with Anjou at the time. Whatever Edward's wishes, it was likely that any claim by William would be opposed by Godwin, Earl of Wessex, a member of the most powerful family in England. Edward had married Edith, Godwin's daughter, in 1043, and Godwin appears to have been one of the main supporters of Edward's claim to the throne. By 1050, however, relations between the king and the earl had soured, culminating in a crisis in 1051 that led to the exile of Godwin and his family from England. During this exile, Edward offered the throne to William. Godwin returned from exile in 1052 with armed forces, and a settlement was reached between the king and the earl, restoring the earl and his family to their lands and replacing Robert of Jumièges, a Norman whom Edward had named Archbishop of Canterbury, with Stigand, the Bishop of Winchester. No English source mentions a supposed embassy by Archbishop Robert to William conveying the promise of the succession, and the two Norman sources that mention it, William of Jumièges and William of Poitiers, are not precise in their chronology of when this visit took place.",
      "Count Herbert II of Maine died in 1062, and William, who had betrothed his eldest son Robert to Herbert's sister Margaret, claimed the county through his son. Local nobles resisted the claim, but William invaded and by 1064 had secured control of the area. William appointed a Norman to the bishopric of Le Mans in 1065. He also allowed his son Robert Curthose to do homage to the new Count of Anjou, Geoffrey the Bearded. William's western border was thus secured, but his border with Brittany remained insecure. In 1064, William invaded Brittany in a campaign that remains obscure in its details. Its effect, though, was to destabilise Brittany, forcing the duke, Conan II, to focus on internal problems rather than on expansion. Conan's death in 1066 further secured William's borders in Normandy. William also benefited from his campaign in Brittany by securing the support of some Breton nobles who went on to support the invasion of England in 1066.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The immediate consequence of William's death was a war between his sons Robert and William over control of England and Normandy. Even after the younger William's death in 1100 and the succession of his youngest brother Henry as king, Normandy and England remained contested between the brothers until Robert's capture by Henry at the Battle of Tinchebray in 1106. The difficulties over the succession led to a loss of authority in Normandy, with the aristocracy regaining much of the power they had lost to the elder William. His sons also lost much of their control over Maine, which revolted in 1089 and managed to remain mostly free of Norman influence thereafter.",
      "The impact on England of William's conquest was profound; changes in the Church, aristocracy, culture, and language of the country have persisted into modern times. The Conquest brought the kingdom into closer contact with France and forged ties that lasted throughout the Middle Ages. Another consequence of William's invasion was the sundering of the formerly close ties between England and Scandinavia. William's government blended elements of the English and Norman systems into a new one that laid the foundations of the later medieval English kingdom. How abrupt and far-reaching the changes were is still a matter of debate among historians, with some, such as Richard Southern, claiming that the Conquest was the single most radical change in European history between the Fall of Rome and the 20th century. Others, such as H. G. Richardson and G. O. Sayles, see the changes as much less radical. The historian Eleanor Searle describes William's invasion as \"a plan that no ruler but a Scandinavian would have considered\".",
      "William's reign has caused historical controversy since before his death. William of Poitiers wrote glowingly of William's reign and its benefits, but the obituary notice for William in the Anglo-Saxon Chronicle condemns William in harsh terms. During the reign of Queen Elizabeth I, Archbishop Matthew Parker saw the Conquest as having corrupted a purer English Church, which Parker attempted to restore. During the 17th and 18th centuries, some historians and lawyers saw William's reign as imposing a \"Norman yoke\" on the native Anglo-Saxons, an argument that continued during the 19th century with further elaborations along nationalistic lines. These controversies have led to William being seen by some historians either as one of the creators of England's greatness or as inflicting one of the greatest defeats in English history. Others have viewed him as an enemy of the English constitution, or alternatively as its creator.",
    ] },
]

[articles.es]
text = "Guillermo I de Inglaterra (Falaise, Normandía, 8 de noviembre de 1028-Ruan, 9 de septiembre de 1087), más conocido como Guillermo el Conquistador (en latín medieval: Willelmus Conquestor Rex​) y Guillermo el Bastardo​ (en latín medieval: Willelmus Nothus​), fue el primer rey de Inglaterra de origen normando (en latín medieval: Angliae Dux Normannorum​), con un reinado que se extendió desde 1066 hasta su muerte en 1087; fue el último monarca del llamado «año de los cuatro reyes», ya que en 1066 Inglaterra vio cuatro reyes en ese mismo año, iniciando con Eduardo el Confesor y terminando con el propio Guillermo cinco días antes del fin del año."
title = "Guillermo I de Inglaterra"
lang = "es"
url = "https://es.wikipedia.org/wiki/Guillermo_I_de_Inglaterra"
intro = [
  "Guillermo I de Inglaterra (Falaise, Normandía, 8 de noviembre de 1028-Ruan, 9 de septiembre de 1087), más conocido como Guillermo el Conquistador (en latín medieval: Willelmus Conquestor Rex​) y Guillermo el Bastardo​ (en latín medieval: Willelmus Nothus​), fue el primer rey de Inglaterra de origen normando (en latín medieval: Angliae Dux Normannorum​), con un reinado que se extendió desde 1066 hasta su muerte en 1087; fue el último monarca del llamado «año de los cuatro reyes», ya que en 1066 Inglaterra vio cuatro reyes en ese mismo año, iniciando con Eduardo el Confesor y terminando con el propio Guillermo cinco días antes del fin del año.",
]
sections = [
  { "title" = "Aspectos generales", "paragraphs" = [
      "Descendiente de vikingos, desde 1035 fue duque de Normandía con el nombre de Guillermo II. Tras una larga lucha por afianzar su poder, hacia 1060 su dominio sobre Normandía estaba consolidado y por ello comenzó a planear la conquista de Inglaterra, que inició en 1066. El resto de su vida estuvo marcado por incesantes luchas por el mantenimiento de sus posesiones, tanto en Inglaterra como en el norte de Francia, y por las dificultades y desencuentros con su hijo primogénito, Roberto Courteheuse.",
      "Guillermo era hijo de Roberto I, duque de Normandía, y de su concubina Arlette de Falaise. Su condición de hijo ilegítimo y su juventud le causaron numerosas dificultades cuando sucedió a su padre, así como la anarquía que se extendió por sus dominios en los primeros años de su ducado. Durante su infancia y adolescencia, los nobles normandos lucharon entre sí tanto para controlar al joven duque como para beneficio propio. En 1047 Guillermo sofocó una rebelión y comenzó a afianzar su poder sobre el ducado, un proceso que no culminó hasta 1060. En la década de 1050 contrajo matrimonio con Matilde de Flandes, con lo que consiguió un poderoso aliado en el vecino condado de Flandes. En esa misma época Guillermo situó a varios de sus partidarios como obispos y abades de la iglesia normanda. La consolidación del poder le permitió expandir sus horizontes y en 1062 se aseguró la provincia vecina de Maine.",
      "Desde la década de 1050 Guillermo era pretendiente al trono de Inglaterra, entonces en manos de su primo Eduardo el Confesor, que no tenía descendencia. Sin embargo, no era el único que codiciaba la Corona inglesa, pues tenía un poderoso rival, el conde anglosajón Haroldo Godwinson, el cual fue nombrado su sucesor por el propio rey Eduardo en su lecho de muerte en enero de 1066. Guillermo argumentó que el rey de Inglaterra le había prometido en el pasado que el trono sería suyo y que el propio Haroldo había jurado apoyarlo. Por ello, el duque normando puso en marcha la intervención militar y preparó una gran flota y un poderoso ejército que desembarcó en el sur de Inglaterra en septiembre de 1066 y derrotó a las fuerzas de Haroldo en la batalla de Hastings el 14 de octubre. Guillermo también venció al susesor de iure de Haroldo, Edgar Atheling, quien fue rey de Inglaterra de facto poco más de 70 días antes de rendirse a las fuerzas de Guillermo. Así, Guillermo forjó un camino directo al trono inglés y fue coronado rey de Inglaterra en Londres el día de Navidad de 1066.",
    ] },
  { "title" = "Contexto histórico", "paragraphs" = [
      "Los vikingos empezaron a atacar las costas de lo que más tarde sería Normandía en el siglo VIII. Su asentamiento definitivo no se produjo hasta principios del siglo X, cuando Rollón, un caudillo vikingo, llegó a un acuerdo con el rey de Francia Carlos el Simple tras la conquista del condado de Ruan por los guerreros escandinavos. Las tierras alrededor de Ruan fueron el núcleo del posterior ducado de Normandía.​ Estos territorios del norte de Francia fueron usados por los escandinavos para atacar Inglaterra a fines del siglo X, lo que empeoró las relaciones entre ambas regiones. En un intento por acercar posturas entre Inglaterra y Normandía,​ el rey inglés Etelredo II el Indeciso se casó con Emma de Normandía, hermana del duque Ricardo II de Normandía.​",
      "Sin embargo, los ataques de los vikingos a la isla británica no cesaron y Etelredo buscó refugio en Normandía en 1013, después de que el rey Svend I de Dinamarca lo expulsara de su reino. La muerte de este rey al año siguiente permitió el regreso de la familia real inglesa, pero el hijo del monarca danés, Canuto, se opuso a ello. Etelredo falleció en 1016 y Canuto se convirtió en rey de Inglaterra, por lo que los hijos de los antiguos monarcas ingleses, Eduardo y Alfredo, tuvieron que permanecer en el exilio en Normandía, mientras que su madre se convirtió en la segunda esposa de Canuto.​",
      "Al morir Canuto en 1035, le sucedió su hijo Haroldo I Pie de Liebre, fruto de su primer matrimonio, mientras que Canuto Hardeknut, hijo de Emma, llegó a ser rey de Dinamarca. La inestabilidad en Inglaterra obligó a Alfredo a trasladarse a la isla en 1036 para visitar a su madre y desafiar al rey Haroldo, pero solo consiguió acabar muerto en un asunto no aclarado en el que al parecer estuvo implicado el rey. Tras esto, Emma se exilió en Flandes y Hardeknut se convirtió en rey a la muerte de su hermano Haroldo en 1040. Su medio hermano Eduardo le sucedió como rey de Inglaterra tras su muerte en junio de 1042.​",
    ] },
  { "title" = "Primeros años", "paragraphs" = [
      "Guillermo nació hacia los años 1027 o 1028 en el castillo de Falaise, Normandía, más probablemente a finales de 1028.​​​ Era el único hijo de Roberto I, duque de Normandía, que a su vez era hijo del duque Ricardo II. Su madre, Arlette, era hija de Fulberto de Falaise, que era curtidor o embalsamador.​ Ella pertenecía probablemente al servicio doméstico de la casa ducal, pero nunca contrajo matrimonio con el duque, sino que lo hizo más tarde con Herluin de Conteville, con el que tuvo dos hijos —Odón, obispo de Bayeux y Roberto, conde de Mortain— y una hija, cuyo nombre no ha trascendido. Uno de los hermanos de Arlette, Gualterio, fue partidario y protector de Guillermo durante su minoría de edad.​ El duque Roberto I tuvo también una hija, Adelaida, con Arlette u otra concubina.​​",
      "El padre de Guillermo, Roberto, se convirtió en duque de Normandía el 6 de agosto de 1027 al suceder a su hermano mayor, Ricardo III, que era duque desde el año anterior.​ Ambos hermanos habían tenido disputas por la sucesión y la muerte de Ricardo fue muy repentina, por lo que algunos historiadores han acusado a Roberto de acabar con su vida, una afirmación plausible pero ahora imposible de demostrar.​ La situación del ducado era inestable, algunas familias se enriquecieron a expensas de la Iglesia en connivencia con el propio duque y Alano III de Bretaña declaró la guerra a los normandos. Hacia 1031 Roberto ya se había ganado el apoyo de la aristocracia, algunos de cuyos miembros serían importantes en el futuro de Guillermo: su tío abuelo Roberto el Danés, arzobispo de Ruan, Osbern, sobrino de Gunnora de Crepon -segunda esposa del duque Ricardo I- y el conde Gilberto de Brionne, nieto de Ricardo I.​ El duque Roberto I apoyó a los príncipes ingleses Alfredo y Eduardo, que estaban exiliados en el norte de Francia.​",
      "Hay indicios de que Roberto pudo estar prometido brevemente con la hija del rey Canuto de Inglaterra, pero no llegaron al altar. No está claro si Guillermo hubiera sido suplantado como heredero en el caso de que su padre hubiera tenido un hijo legítimo, pues algunos duques anteriores también habían sido hijos ilegítimos y la implicación plena de Guillermo en los asuntos de gobierno parecen indicar que era el heredero predilecto del duque. En 1034, Roberto I decidió emprender una peregrinación a Jerusalén. Algunos de sus allegados intentaron convencerlo de que no hiciera un viaje tan largo, pero el duque partió en enero de 1035, no sin antes haber conseguido que los hombres fuertes del ducado de Normandía juraran lealtad a Guillermo como su heredero.​ El duque Roberto murió a principios de julio de 1035 en Nicea, ciudad del Imperio bizantino, durante el viaje de regreso de Tierra Santa.​",
    ] },
  { "title" = "Duque de Normandía", "paragraphs" = [
      "Guillermo hubo de encarar numerosas dificultades tras la muerte de su padre, tanto por su corta edad —como mucho contaba diez años— como por su origen ilegítimo.​​ Contó con el apoyo del arzobispo Roberto, así como del rey Enrique I de Francia, lo que le permitió conservar el ducado de Normandía.​ La ayuda prestada a los príncipes ingleses exiliados en su intento por regresar a la isla en 1036 demostró que los hombres encargados de gobernar el ducado pretendían continuar con las políticas del fallecido Roberto I.​ Sin embargo, la muerte del arzobispo Roberto en 1037 privó a Guillermo de uno de sus principales sostenes y Normandía pronto cayó en el caos.​",
      "La anarquía en los dominios del joven Guillermo II duró hasta 1047​ y poseer la persona del duque fue una de las prioridades de todos los que lucharon por el poder. En principio, Alano de Bretaña recibió la custodia del duque, pero tras su muerte en 1039 o 1040, ocupó su lugar Gilberto de Brionne. Tanto este como su sucesor en el puesto de tutor y regente, Turchetil, fueron asesinados a los pocos meses.​ Otro de sus tutores, Osbern, fue asesinado en la habitación de Guillermo a comienzos de la década de 1040, mientras el joven dormía. En otras ocasiones, su tío Gualterio debía ocultarlo en casas de campesinos, aunque este episodio parece ser una licencia del cronista Orderico Vital, a propósito de embellecer su crónica.​ La historiadora Eleanor Searle cree que Guillermo creció junto a tres primos que serían más tarde importantes seguidores suyos: Guillermo FitzOsbern, Roger de Beaumont y Roger de Montgomery.​ Aunque muchos de los nobles normandos se enzarzaron en numerosas disputas particulares durante la minoría de edad de Guillermo, los vizcondes siguieron reconociendo el gobierno ducal y la jerarquía de la Iglesia también apoyaba al duque.​ El rey francés Enrique I tampoco le retiró su apoyo.​",
      "A fines de 1046 varios opositores a Guillermo II pusieron en marcha una rebelión en la Baja Normandía, rebelión liderada por su primo hermano Guido de Borgoña, conde de Brionne, y apoyada por Néel II de Saint-Sauveur, vizconde de Cotentin, y Ranulfo vizconde de Bessin. Según los relatos, que contienen muchos elementos legendarios, estos intentaron capturar a Guillermo en Valognes, pero el duque consiguió escapar en la oscuridad y encontró refugio en el rey Enrique.​ A comienzos de 1047, Guillermo y Enrique regresaron a Normandía y derrotaron a los señores normandos en la batalla de Val-ès-Dunes, librada cerca de Caen.​ Guillermo de Poitiers afirma que la actuación del duque fue decisiva para la victoria, pero otros relatos más recientes subrayan todo lo contrario, que fueron los hombres del rey francés los que decidieron la suerte de la lucha.​ Guillermo asumió el poder en el ducado de Normandía y muy poco después declaró la tregua de Dios en todos sus dominios, para intentar acabar con la ola de violencia.​ Aunque la batalla de Val-ès-Dunes marcó un punto de inflexión en el control de Guillermo sobre su ducado, no fue el final de su enfrentamiento para imponerse a parte de la nobleza normanda, pues entre 1047 y 1054 se produjeron más conflictos armados y hasta 1060 se sucedieron varias crisis de menor importancia.​",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "La consecuencia inmediata de la muerte de Guillermo fue una guerra entre sus hijos Roberto y Guillermo por el control de Inglaterra y Normandía.​ Incluso después de la muerte de Guillermo II en 1100 y la sucesión de su hermano Enrique como rey de Inglaterra, el control de ambos territorios fue motivo de disputa entre los hijos de Guillermo hasta la captura de Roberto por parte de Enrique en la batalla de Tinchebray en 1106. Estas dificultades en la sucesión llevaron a una pérdida de autoridad en Normandía que permitió que la aristocracia recuperara mucho del poder que le había arrebatado Guillermo el Conquistador. Además, sus hijos perdieron gran parte del control sobre Maine, una región que se rebeló en 1089 y logró liberarse de mucha de la influencia normanda.​",
      "El impacto de la conquista de Guillermo en Inglaterra fue grande, pues acarreó profundas alteraciones en la Iglesia, la aristocracia y el idioma del reino que persisten de alguna manera hasta la actualidad. La invasión forjó lazos entre Inglaterra y Francia que duraron toda la Edad Media. Otra consecuencia de la invasión fue la ruptura de la fuerte relación anterior entre Inglaterra y los reinos escandinavos. El gobierno de Guillermo aglutinó elementos de los sistemas inglés y normando y sentó las bases del posterior reino medieval inglés. Como de abruptos y duraderos fueron los cambios es tema que todavía debaten los historiadores, aunque algunos como Richard Southern están convencidos de que esta conquista fue el cambio más radical sufrido por un territorio europeo entre la caída del Imperio romano y el siglo XX. Otros estudiosos, como H. G. Richardson y G. O. Sayles, opinan que los cambios en Inglaterra no fueron tan profundos.​ La historiadora Eleanor Searle describe la invasión de Inglaterra por parte de Guillermo como «un plan que nadie, salvo un gobernante escandinavo, hubiera considerado».​",
      "El reinado de Guillermo ha sido motivo de controversia historiográfica desde el mismo momento de su muerte. El cronista Guillermo de Poitiers escribió elogiosamente sobre los beneficios del gobierno del normando, pero el obituario de Guillermo en la Crónica anglosajona condena sus acciones en términos muy duros.​ A lo largo de la historia varios políticos y líderes británicos han recurrido a Guillermo y los eventos de su reinado para ilustrar sucesos de la historia inglesa. En época de la reina Isabel I —siglo XVI—, el arzobispo Matthew Parker veía que la conquista había corrompido a una Iglesia inglesa muy pura que él mismo se empeñó en restaurar. En los siglos XVII y XVIII algunos historiadores y legisladores opinaban que Guillermo había impuesto un «yugo normando» a los anglosajones nativos de la isla, un argumento que perduró hasta el siglo XIX dentro del discurso del nacionalismo inglés. Estas controversias sobre su persona y acciones han llevado a que Guillermo I sea visto por unos como el creador de la grandeza de Inglaterra y por otros como el artífice de una de las mayores derrotas del pueblo inglés en toda su historia.​",
    ] },
]

[articles.fr]
text = "Guillaume le Conquérant (en anglais, William the Conqueror), appelé également Guillaume le Bâtard ou Guillaume de Normandie, né en 1027 ou 1028 à Falaise et mort le 9 septembre 1087 à Rouen, fut duc de Normandie, sous le nom de Guillaume II, de 1035 à sa mort, et roi d'Angleterre, sous le nom de Guillaume Ier, de 1066 à sa mort. Fils de Robert le Magnifique et de sa frilla, Arlette de Falaise (Herleva), Guillaume devient duc de Normandie vers l'âge de huit ans, à la mort de son père en 1035."
title = "Guillaume le Conquérant"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Guillaume_le_Conqu%C3%A9rant"
intro = [
  "Guillaume le Conquérant (en anglais, William the Conqueror), appelé également Guillaume le Bâtard ou Guillaume de Normandie, né en 1027 ou 1028 à Falaise et mort le 9 septembre 1087 à Rouen, fut duc de Normandie, sous le nom de Guillaume II, de 1035 à sa mort, et roi d'Angleterre, sous le nom de Guillaume Ier, de 1066 à sa mort.",
  "Fils de Robert le Magnifique et de sa frilla, Arlette de Falaise (Herleva), Guillaume devient duc de Normandie vers l'âge de huit ans, à la mort de son père en 1035. Après une période de forte instabilité, il parvient à reprendre la domination du duché à partir de la bataille de Val-ès-Dunes, en 1047. Il épouse Mathilde de Flandre vers 1050. Il fait de la Normandie un duché puissant, craint des rois de France Henri Ier (1031-1060) puis Philippe Ier (1060-1108).",
  "À la mort sans enfant du roi d'Angleterre Édouard le Confesseur, une crise de succession éclate et, après sa victoire à la bataille d'Hastings (1066), il s'empare de la couronne d'Angleterre. Cette conquête fait de lui l'un des plus puissants monarques de l'Europe occidentale et conduit à de très profonds changements dans la société anglaise, dont l'élite anglo-saxonne disparaît au profit des Normands.",
  "Dès lors, il passe la suite de son règne à se défendre face à ses nombreux ennemis, que ce soit en Angleterre (les rebelles anglo-saxons rassemblés derrière Edgar Ætheling, les Danois et les Écossais) ou sur le continent (le comte d'Anjou Foulques le Réchin, le comte de Flandre Robert Ier, et surtout le roi de France Philippe Ier). Il meurt à Rouen en 1087, après la mise à sac de Mantes, au cours d'une campagne de représailles dans le Vexin français contre le roi Philippe Ier. Il est inhumé à l'abbaye aux Hommes de Caen.",
]
sections = [
  { "title" = "Règne", "paragraphs" = [
      "Robert le Magnifique devient duc de Normandie le 6 août 1027, à la mort de son frère aîné, Richard III, âgé seulement de 20 ans. Ce dernier venait de succéder à leur père, Richard II, mort un an plus tôt. Cet épisode avait été l'occasion d'une rébellion de Robert, vite réprimée par l'armée ducale. La mort brutale et mystérieuse de Richard III profite à Robert, accusé plus tard par des écrivains comme Wace d'avoir fait empoisonner son frère. Richard laisse un jeune fils bâtard, Nicolas, écarté de la cour.",
      "Le duc Robert doit rapidement affronter des rébellions contre le pouvoir ducal : Guillaume Ier de Bellême est alors assiégé à Alençon, puis l'évêque Hugues de Bayeux chassé de son château d'Ivry-la-Bataille. Comte d'Évreux et archevêque de Rouen, Robert le Danois s'oppose au duc Robert (par ailleurs son neveu) qui, au début de son principat, enlève des terres aux abbayes et aux grandes églises, pour les distribuer à de jeunes nobles, tel Roger Ier de Montgommery, pour les récompenser à moindre frais.",
      "Le duc Robert part en 1028 mener le siège d'Évreux. Après avoir mis en défense la cité, l'archevêque Robert le Danois négocie auprès du roi de France, Robert le Pieux, son exil en France, d'où il lance l'anathème sur la Normandie. La sanction ecclésiastique fait sentir son effet : le duc rappelle l'archevêque et le rétablit dans ses charges comtales et archiépiscopales.",
    ] },
  { "title" = "Mort", "paragraphs" = [
      "Guillaume agonise quelques jours, en toute lucidité, au prieuré de Saint-Gervais, aux portes de la ville. Avant de mourir, le 9 septembre 1087, le duc-roi règle sa succession : il confie à son fils aîné, Robert Courteheuse, le duché de Normandie, tandis que son deuxième fils, Guillaume le Roux, reçoit la couronne d'Angleterre. Son troisième fils, Henri, reçoit de l'argent. Enfin, il demande que tous les prisonniers qui promettent de ne pas troubler l'ordre public soient relâchés, ce qui sera notamment le cas de son demi-frère Odon.",
      "Son corps est ensuite transporté par mer jusqu'à Caen, pour être inhumé en l'abbatiale Saint-Étienne. En contant la triste fin de Guillaume, le chroniqueur Orderic Vital explique que lors de l'inhumation, il fallut forcer son corps pour pouvoir l'introduire dans le sarcophage, si bien que la peau de bœuf dans laquelle il était enveloppé se déchira, faisant éclater son ventre qui exhala une insupportable odeur de putréfaction. Ce point semble en contradiction avec un paragraphe précédent où le moine évoque « les embaumeurs et les croque-morts » qui préparèrent le corps mais les techniques d'embaumement égyptiennes étaient perdues à cette époque et les moyens empiriques utilisés ne garantissaient pas la préservation des corps.",
      "Sa tombe est visitée plusieurs fois depuis son inhumation. En 1522, le mausolée est ouvert une première fois sur ordre papal. En 1562, pendant les guerres de religion, les protestants profanent son tombeau. Sa dépouille est exhumée, mise en pièces, et ses os dispersés ; seul son fémur gauche aurait été sauvé par le poète Charles Toustain de La Mazurie. La relique est placée dans un nouveau tombeau en 1642, qui est remplacé au XVIIIe siècle par un monument plus élaboré, lequel est détruit en 1793, pendant la Révolution française. Le coffret contenant le fémur est replacé sous une dalle de marbre blanc posée en 1801. L'épitaphe latine indique : « Hic sepultus est invictissimus Guillelmus conquestor, Normanniæ Dux et Angliæ Rex, hujusce domus conditor, qui obiit anno M . LXXXVII [millesimo octagesimo septimo] ».",
    ] },
  { "title" = "La Normandie et l'Angleterre sous Guillaume", "paragraphs" = [
      "La conquête de 1066 ne fonde pas un unique royaume anglo-normand. Normandie et Angleterre gardent leurs spécificités à travers leur administration ou leurs coutumes. En effet, ce sont deux couronnes, une ducale et une royale, détenues par un même titulaire, le duc de Normandie, dans le cadre d'une union personnelle.",
      "Durant le règne de Guillaume le Conquérant, « l'organisation de la société normande est féodale ». On retrouve en effet dans le duché les fiefs, les tenures paysannes, le service militaire et la justice confiée aux feudataires. Le gouvernement du duché diffère peu de celui des règnes précédents : la féodalité est tempérée par un pouvoir central fort, matérialisé par un duc traversant constamment ses terres, visitant les seigneurs et collectant l'argent des impôts. Il détient le monopole de frappe monétaire et est capable de collecter une part considérable de ses revenus en argent. L'administration s'appuie sur des officiers publics, les vicomtes.",
      "Les barons, laïques mais aussi ecclésiastiques, doivent fournir au duc un contingent militaire lorsqu'il en a besoin. En Normandie, on ne peut construire de châteaux que par autorisation du duc et ils peuvent lui être remis sur sa simple demande. Les guerres privées sont restreintes et les justices privées sont limitées par les cas réservés au duc et par le maintien d'une administration locale publique.",
    ] },
  { "title" = "Origines du surnom Guillaume le Bâtard", "paragraphs" = [
      "David Bates, ancien directeur de l'Institute of Research de Londres et auteur de plusieurs ouvrages sur les Normands et le duc-roi, explique que l'absence de mariage entre le duc Robert et Herlève a conduit les historiens, en particulier français, à donner à Guillaume ce surnom de « bâtard », mais qu'il a rarement été appelé ainsi de son vivant et jamais en Normandie. Dans la première moitié du XIe siècle, le droit canonique commence seulement à consolider sa position sur le mariage. Celui-ci ne sera imposé comme un sacrement qu'au début du XIIIe siècle (concile de Latran).",
      "Selon David Bates, l'origine de ce surnom vient d'Orderic Vital, moine historien du XIIe siècle, sur lequel on s'appuierait encore beaucoup trop aujourd'hui pour écrire l'histoire de Guillaume. Orderic Vital fait de la bâtardise de Guillaume le facteur explicatif de tous les désordres et révoltes qui ont lieu pendant son règne. Ce moine écrit à une époque où l'Église prône le mariage et condamne très sévèrement le concubinage, ce qui était encore très différent un siècle plus tôt.",
      "Pour Bates, il faut abandonner ce surnom de Guillaume le Bâtard. C'est une légende que les historiens du XIXe siècle, puis du XXe siècle auraient largement reprise, voire amplifiée, à quelques exceptions près comme Michel de Boüard.",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "Abbé Prévost, Histoire de Guillaume le Conquérant, duc de Normandie et roi d'Angleterre, Prault fils (1742).",
      "Guillaume le Conquérant, Alain Hervé, Jean-Claude Lattès, 1986 (prix Bayeux du récit historique)",
      "En 2013, Frédéric Compain réalise le documentaire-fiction Guillaume le Conquérant avec l'acteur Vincent Deniard dans le rôle de Guillaume.",
    ] },
]

[articles.it]
text = "Guglielmo il Conquistatore, conosciuto come Guglielmo I d'Inghilterra e Guglielmo II di Normandia (Falaise, 8 novembre 1028 – Rouen, 9 settembre 1087), è stato un condottiero normanno, duca di Normandia dal 1035 e re d'Inghilterra dal 1066 fino alla sua morte. Sebbene chiamato anche Guglielmo il Bastardo (in francese Guillaume le Bâtard) perché illegittimo o comunque nato da una unione non canonica non riconosciuta dalla Chiesa, era comunque chiamato \"il Conquistatore\" (in inglese \"the Conqueror\", in francese \"le Conquérant\") già prima del 1066, per le sue vittorie sui Bretoni e per la conquista del Maine."
title = "Guglielmo I d'Inghilterra"
lang = "it"
url = "https://it.wikipedia.org/wiki/Guglielmo_I_d%27Inghilterra"
intro = [
  "Guglielmo il Conquistatore, conosciuto come Guglielmo I d'Inghilterra e Guglielmo II di Normandia (Falaise, 8 novembre 1028 – Rouen, 9 settembre 1087), è stato un condottiero normanno, duca di Normandia dal 1035 e re d'Inghilterra dal 1066 fino alla sua morte.",
  "Sebbene chiamato anche Guglielmo il Bastardo (in francese Guillaume le Bâtard) perché illegittimo o comunque nato da una unione non canonica non riconosciuta dalla Chiesa, era comunque chiamato \"il Conquistatore\" (in inglese \"the Conqueror\", in francese \"le Conquérant\") già prima del 1066, per le sue vittorie sui Bretoni e per la conquista del Maine.",
  "Guglielmo ascese al trono d'Inghilterra dopo la vittoria nella battaglia di Hastings, con la quale cominciò la conquista normanna, sconfiggendo il re sassone Aroldo II. L'epopea della conquista e le ragioni della guerra sono rappresentate nel famoso Arazzo di Bayeux.",
  "Diede vita al primo censimento delle proprietà inglesi (il Domesday Book), che permetteva al re di avere conoscenza diretta di tutti i proprietari terrieri senza passare attraverso i loro feudatari, anzi convocandoli tutti, nel 1086 a Salisbury, dove li fece giurare che sarebbero stati fedeli al loro re contro ogni altro uomo. Guglielmo è considerato il fondatore del governo centrale in Inghilterra e uno dei primi costruttori della monarchia costituzionale.",
]
sections = [
  { "title" = "Origine", "paragraphs" = [
      "Secondo il monaco e cronista normanno Guglielmo di Jumièges, autore delle Historiæ Normannorum Scriptores Antiqui, Guglielmo era l'unico figlio del sesto signore della Normandia, il quarto a ottenere formalmente il titolo di Duca di Normandia, Roberto I il Magnifico e di Herleva di Falaise detta anche Arletta (1010 circa –1050 circa), di umili origini, figlia di Fulberto o Herberto, un cameriere del duca (Herleva Fulberti cubicularii ducis filia) e della moglie Duda o Duwa, come ci conferma la Chronica Albrici Monachi Trium Fontium, che potrebbe essere stata figlia del conciatore Fulberto, forse preparatore di salme.",
      "Roberto I il Magnifico, sempre secondo Guglielmo di Jumièges, era il figlio secondogenito del quarto signore della Normandia e il secondo a ottenere il titolo formale di Duca di Normandia, Riccardo II e di Giuditta di Bretagna che era sorella di Goffredo I di Bretagna, quindi era figlia del conte di Rennes e duca di Bretagna, Conan I il Torto e della moglie, Ermengarda d'Angiò (come ci viene confermato dal monaco Rodolfo il Glabro, uno dei maggiori cronisti d'età medievale), figlia del terzo Conte di Angiò, Goffredo I Grisegonelle e di Adele di Vermandois, figlia di Roberto di Vermandois, conte di Meaux e di Troyes.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Nacque a Falaise in Normandia, da un'unione more danico (ossia secondo l'uso vichingo, pagano, e considerata illegittima dalla Chiesa), nell'anno in cui suo padre, Roberto, conte di Hiesmois, si era ribellato al proprio fratello il duca di Normandia Riccardo III e aveva posto il campo a Falaise (la città capoluogo della sua contea); Roberto, sconfitto, si sottomise e fu concordata la pace.Riccardo III, poco dopo essere rientrato a Rouen, morì, avvelenato. Anche il monaco e cronista inglese Orderico Vitale ritiene che Riccardo sia stato avvelenato (Richardus III veneno, non plene biennio peracto, periit). Infine, secondo Wace, nel suo Roman de Rou, l'avvelenamento di Riccardo III fu opera di suo fratello, Roberto, la persona che più aveva da guadagnare dalla sua morte. Infatti Roberto divenne duca di Normandia, diseredando e spodestando del titolo ducale il nipote, Nicola, come confermano Guglielmo di Jumièges, Orderico Vitale e il cronista Robert di Torigny.",
      "Roberto, nel 1034, decise di fare un pellegrinaggio a Gerusalemme; prima di partire, non avendo eredi legittimi, volle risolvere il problema della sua successione per la quale scelse il figlio, allora di soli sei anni, Guglielmo, avuto da Herleva, sua concubina. Convocò un consiglio generale in cui tutti i nobili, anche i più riluttanti, dovettero accettare tale successione. Nell'occasione furono nominati per lui, nel caso in cui Roberto non fosse tornato dalla Terra Santa (anche se era considerato molto improbabile, in quanto Roberto godeva di ottima salute e aveva solo 25 anni), i quattro tutori del ducato:",
      "Gilberto, conte d'Eu e conte di Brionne, cugino di Roberto (nipote del duca Riccardo Senza Paura)",
    ] },
  { "title" = "Discendenza", "paragraphs" = [
      "Guglielmo sposò Matilde delle Fiandre (1032 - 1083), bisnipote di Ugo Capeto, dalla quale ebbe nove o dieci figli:",
      "Adeliza (o Adelida o Adelaide) (1055 - dopo il 1066), monaca, dopo essere stata promessa ad Harold Godwin(e)son o Aroldo, Conte di Wessex;",
      "Riccardo (ca. 1055 - ca. 1081), duca di Bernay in Normandia, morì andando a caccia, nel sud dell'Inghilterra, così come sarebbe accaduto a suo fratello, Guglielmo, circa vent'anni dopo;",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(EN) Chronicle of the Kings of England: From the Earliest Period to the Reign, of king William's children.",
      "Louis Halphen, La Francia dell'XI secolo, cap. XXIV, vol. II (L'espansione islamica e la nascita dell'Europa feudale) della Storia del Mondo Medievale, 1999, pp. 770–806.",
      "Caroline M. Riley, L'imperatore Enrico III, cap. VIII, vol. IV (La riforma della chiesa e la lotta fra papi e imperatori) della Storia del Mondo Medievale, 1999, pp. 193–236.",
    ] },
]

[articles.tr]
text = "I. William (İngilizce: William of Normandy, Fransızca: Guillaume de Normandie; 1028?"
title = "I. William"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._William"
intro = [
  "I. William (İngilizce: William of Normandy, Fransızca: Guillaume de Normandie; 1028? – 9 Eylül 1087), Fatih William (William the Conqueror ve Guillaume le Conquérant) ve Piç William (William the Bastard ve Guillaume le Bâtard) olarak bilinir. 1035-1087 yılları arasında Normandiya Dükü ve 1066-1087 yılları arasında İngiltere'nin ilk Norman kökenli kralı olarak görev yapmıştır.",
  "Rollo'nun soyundan gelen William, 1035'ten itibaren Normandiya düküydü. 1060 yılına kadar tahtını güvence altına almak için bir dizi mücadelede bulundu. 1066'da Günah Çıkartıcı Aziz Edward'ın ölümünün ardından İngiltere'yi işgal etti. Hastings Muharebesinde, Harold Godwinson'un emrindeki Anglo-Sakson kuvvetlerini yendi. Hayatının geri kalanına, İngiltere ve Avrupa anakarasındaki toprakları üzerindeki hakimiyetini sağlamlaştırma mücadeleleri ve en büyük oğlu Robert Curthose ile yaşadığı olaylar damgasını vurdu.",
  "William, evli olmayan Normandiya dükü I. Robert ve metresi Herleva'nın oğluydu. Gayrimeşru statüsü ve reşit olmaması, babasının yerine geçtikten sonra, yönetiminin ilk yıllarını kasıp kavuran kargaşa dönemi gibi, bazı zorluklara neden oldu. Çocukluğu ve ergenliği boyunca, Norman aristokrasisinin üyeleri, hem çocuk dükün kontrolü için hem de kendi çıkarları için birbirleriyle savaştı. 1047'de William bir isyanı bastırmayı başardı ve düklük üzerinde otoritesini kurmaya başladı fakat bu süreç 1060 yılına kadar sürdü. 1050'lerde Flandersli Matilda ile evlenmesi ona komşu Flandre Kontluğu'nda güçlü bir müttefik sağladı. William, evlendiğinde, destekçilerinin Norman kilisesinde piskopos ve başrahip olarak atanmasını sağlayabildi. Gücünü sağlamlaştırması, hedeflerini değiştirmesine izin verdi ve 1062'de komşu Maine Kontluğu'nun kontrolünü ele geçirdi.",
  "1050'lerde ve 1060'ların başında William, kuzeni ve çocukluk arkadaşı olan ve bir varisi bulunmayan İngiltere kralı Edward'ın tahtının varislerinden biriydi. Edward'ın Ocak 1066'da ölüm döşeğindeyken kral olarak adlandırdığı güçlü İngiliz kontu Harold Godwinson da dahil olmak üzere başka potansiyel varislerde vardı. Edward'ın daha önce kendisine tahtı söz verdiğini ve Harold'ın iddiasını desteklemek için yemin ettiğini savunan William, büyük bir filo kurdu ve Eylül 1066'da İngiltere'yi işgal etti. 14 Ekim 1066'da Hastings Muharebesi'nde Harold'un ordusunu kesin bir şekilde mağlup etti ve Harold'u öldürdü. İngiltere'deki otoritesini sağlamlaştırmak için yaptığı seferlerin ardından William, 1066 Noel Günü Londra'da kral olarak taç giydi. Normandiya'ya dönmeden önce 1067'nin başlarında İngiltere'nin yönetimi için düzenlemeler yaptı. Bunu birkaç başarısız isyan izledi, William'ın hakimiyeti 1075'e kadar İngiltere'de sağlamdı ve saltanatının büyük bir bölümünü kıta Avrupasında geçirmesine olanak sağladı.",
]
sections = [
  { "title" = "Arka plan", "paragraphs" = [
      "Vikingler ilk olarak VIII. yüzyılın sonlarında günümüzde Normandiya denen bölgeye saldırmaya başladı. 911 yılında Saint-Clair-sur-Epte Antlaşması'yla beraber Batı Frank kralı III. Charles, Rouen kontluğunu resmi olarak Viking lideri Rollo'ya verdi. Rouen çevresindeki topraklar, daha sonra Normandiya düklüğünün toprakları haline geldi. Normandiya, X. yüzyılın sonunda İngiltere'ye yönelik İskandinav saldırıları yeniden başladığında bir üs olarak kullanılmış olabilir, bu da İngiltere ile Normandiya arasındaki ilişkileri daha da kötüleştirmiş olabilir. Durumu düzeltmek için İngiliz kralı Tedariksiz Æthelred 1002'de Normandiya dükü II. Richard'ın kız kardeşi Emma'yla evlendi.",
      "İngiltere'ye Danimarka saldırıları devam etti ve Æthelred, Richard'dan yardım istedi. 1013'te Danimarka kralı Danimarkalı I. Sweyn, Æthelred ve ailesini İngiltere'den sürdüğünde Normandiya'ya sığındılar. Sweyn'in 1014'teki ölümü, Æthelred'in ülkesine dönmesine olanak sağladı, ancak Sweyn'in oğlu Knut, Æthelred'in dönüşüne karşı koydu. Æthelred 1016'da beklenmedik bir şekilde öldü ve Knut İngiltere kralı oldu. Æthelred ve Emma'nın iki oğlu Edward ve Alfred, Normandiya'ya sürgüne giderken anneleri Emma, Knut'un eşi oldu. Knut'un 1035'te ölümünden sonra İngiliz tahtı ilk karısından olan oğlu Harold'a geçerken, Emma'dan olan oğlu Hardeknud Danimarka'da kral oldu. Bu dönemde İngiltere'de istikrarsızlık vardı. Alfred, 1036'da annesini ziyaret etmek ve belki de Harold'a meydan okumak için İngiltere'ye döndü. Bir hikâye, Alfred'in buradaki ölümünde Wessexli Earl Godwin'i suçluyor ancak diğerleri Harold'ı suçluyor. Emma, 1040'ta Harold'ın ölümünün ardından Hardeknud kral olana kadar Flanders'a sürgüne gönderildi. Edward, Hardeknud'un Haziran 1042'de ölümünden sonra kral ilan edildi.",
    ] },
  { "title" = "İlk yılları", "paragraphs" = [
      "William, 1027 veya 1028'de, büyük olasılıkla 1028'in sonlarına doğru, Normandiya Dükalığı'nda Falaise'de doğdu. II. Richard'ın oğlu olan I. Robert'in tek oğluydu. Annesi Herleva, Falaiseli Fulbert'in kızıydı; tabakhaneci veya tahnitçi olabilir. Herleva muhtemelen dük ailesinin bir üyesiydi, ancak Robert ile hiç evlenmedi. Daha sonra Herluin de Conteville ile evlendi; iki oğlu ve adı bilinmeyen bir kızı oldu. Herleva'nın kardeşlerinden biri olan Walter, William'ın reşit olmadığı dönemde onun destekçisi ve koruyucusu oldu. I. Robert'in başka bir metresinden Adelaide adında bir kızı da vardı.",
      "Robert, 6 Ağustos 1027'de ağabeyi III. Richard'ın yerine dük oldu. Kardeşler, veraset konusunda anlaşmazlığa düşmüştü ve Richard'ın ölümü ani oldu. Robert, bazı yazarlar tarafından makul ama kanıtlanamayan bir suçlama olan Richard'ı öldürmekle suçlandı. Soylu aileler kiliseyi yağmaladığından ve Bretonyalı III. Alan, muhtemelen kontrolü ele geçirmek amacıyla düklüğe savaş açtığından, Normandiya'daki koşullar kötüydü. 1031'de Robert, çoğu William'ın saltanatı boyunca öne çıkacak olan soylulardan hatırı sayılır bir destek topladı. Bunlar arasında, başlangıçta düke karşı çıkan Rouen başpiskoposu dükün amcası Robert; I. Richard'ın karısı Gunnor'un yeğeni Osbern; ve I. Richard'ın torunu olan Brionnelu Gilbert vardı. Robert, tahta çıkışının ardından, hâlâ kuzey Fransa'da sürgünde olan İngiliz prensleri Edward ve Alfred'e Norman desteğini sürdürdü.",
      "Robert'ın Kral Knut'un bir kızıyla kısa bir süre nişanlanmış olabileceğine dair göstergeler var, ancak evlilik gerçekleşmedi. Robert'ın meşru bir oğlu olsaydı, William'ın düklük verasetinde yerini alıp almayacağı belli değildir. Daha önceki dükler gayri meşruydu ve William'ın babasıyla ilişkisi, William'ın Robert'ın en olası varisi olarak kabul edildiğini gösteriyor gibi görünüyor. 1034'te dük, Kudüs'e hacca gitmeye karar verdi. Bazı destekçileri onu yolculuğa çıkmaktan caydırmaya çalışsa da, Ocak 1035'te bir konsey topladı ve toplanan Norman eşrafına Kudüs'e gitmeden önce varisi olarak William'a sadakat yemini ettirdi. Robert, 1035 Temmuz ayı başlarında Normandiya'ya dönerken İznik'de öldü.",
    ] },
  { "title" = "Normandiya dükü", "paragraphs" = [
      "William, gayri meşru doğumu ve küçük yaşı da dahil olmak üzere dük olurken çeşitli zorluklarla karşılaştı: belgeler, o sırada ya yedi ya da sekiz yaşında olduğunu gösteriyor. Büyük amcası Başpiskopos Robert'ın yanı sıra Fransa kralı I. Henry'nin desteğini alarak babasının yerine geçmesi sağlandı. Sürgündeki İngiliz prenslerine 1036'da İngiltere'ye dönme girişimlerinde verilen destekle, yeni dükün koruyucularına babasının politikalarını sürdürmeye çalıştığını gösterdi. Başpiskopos Robert'ın Mart 1037'de ölümü William'a ana destekçilerinden birini kaybettirdi. Normandiya'daki koşullar hızla kaosa sürüklendi. Dükalıktaki kaos 1047 yılına kadar sürdü ve genç dükün kontrolü, iktidar için mücadele edenlerin önceliklerinden biri oldu. İlk başta, Dük'ün velayeti Bretonyalı Alan'a aitti, ancak Alan 1039'un sonlarında veya Ekim 1040'ta öldüğünde, Brionnelu Gilbert, William'ın sorumluluğunu üstlendi. Gilbert aylar içinde öldürüldü ve başka bir koruyucu olan Turchetil de Gilbert'in ölümü sırasında öldürüldü. Yine bir başka koruyucu Osbern, 1040'ların başında William'ın odasında dük uyurken öldürüldü. William'ın dayısı Walter'ın ara sıra genç dükü köylülerin evlerinde saklamak zorunda kaldığı söylendi, ancak bu hikâye Orderic Vitalis tarafından bir uydurma olabilir. Tarihçi Eleanor Searle, William'ın daha sonra kariyerinde önemli hale gelen üç kuzeniyle büyüdüğünü tahmin ediyor. Bunlar; William fitzOsbern, Roger de Beaumont ve Montgomeryli Roger'dır. Norman soylularının çoğu, William'ın reşit olmadığı sırada kendi özel savaşlarına ve kan davalarına girse de, vikontlar hala dükün gücünü kabul ediyor ve dini hiyerarşi William'ı destekliyordu.",
      "Kral Henry genç dükü desteklemeye devam etti, ancak 1046'nın sonlarında William'ın muhalifleri, Cotentin Vikontu Nigel ve Bessin Vikontu Ranulf'un desteğiyle Burgonyalı Guy liderliğindeki aşağı Normandiya merkezli bir isyanda bir araya geldi. Efsanevi unsurlar içerebilecek hikâyelere göre, Guy; William'ı Valognes'da yakalama girişiminde bulunuldu, ancak o, Kral Henry'ye sığınarak karanlıkta kaçtı. 1047'nin başlarında Henry ve William Normandiya'ya döndüler ve Caen yakınlarındaki Val-ès-Dunes Muharebesi'nde galip geldiler. Poitiersli William, savaşın esas olarak William'ın çabalarıyla kazanıldığını iddia etti, ancak daha önceki kayıtlar, Kral Henry'nin adamlarının ve liderliğinin de önemli bir rol oynadığını iddia ediyor. William, Normandiya'da iktidarı ele geçirdi ve savaştan kısa bir süre sonra, savaşa izin verilen dönemleri kısıtlayarak savaşı ve şiddeti sınırlamak amacıyla, dükalığı genelinde Truce of God ilan etti. Val-ès-Dunes Muharebesi, William'ın düklük üzerindeki kontrolünde bir dönüm noktası olsa da, soylulara karşı üstünlük sağlama mücadelesinin sonu değildi. 1047'den 1054'e kadar olan dönem, 1060'a kadar devam eden daha küçük krizlerle neredeyse sürekli savaş gördü.",
      "William'ın bir sonraki çabası, William'ın kuşattığı Brionne'deki kalesine çekilen Burgonyalı Guy'a karşıydı. Uzun bir çabadan sonra dük, Guy'ı 1050'de sürgüne göndermeyi başardı. Anjou Kontu Geoffrey Martel'in artan gücüne tavır almak için William, Kral Henry ile ona karşı bir sefere katıldı, Bu ikisi arasındaki bilinen son işbirliğidir. Bir Angevin kalesini ele geçirmek dışında çok şey başaramadılar. Geoffrey, özellikle 1051'de Maine Kontu IV. Hugh'un ölümünden sonra, nüfuzunu Maine kontluğuna doğru genişletmeye çalıştı. Maine'in kontrolünün merkezinde, Alençon ve Domfront'taki kalelerin yanı sıra Bellême'yi Maine ve Normandiya sınırında tutan Bellême ailesinin mülkleri vardı. Bellême'nin kontrolü Fransa kralındaydı, ancak Domfront, Geoffrey Martel'in derebeyliği altındaydı ve William, Alençon'un derebeyiydi. Toprakları oldukça stratejik bir şekilde üç farklı derebeyin arasında konumlanmış olan Bellême ailesi, her birini birbirine karşı kullanmayı ve fiilen bağımsızlığını sağlamayı başardı.",
    ] },
  { "title" = "İngiltere ve Kıta Avrupası'ndaki sorunlar", "paragraphs" = [
      "1051'de İngiltere'nin çocuksuz kralı Edward, halefi olarak William'ı seçmiş görünüyor. William, Edward'ın dayısı Normandiya dükü II. Richard'ın torunuydu.",
      "Anglo-Sakson Kroniği, \"D\" versiyonunda, William'ın 1051'in sonlarında İngiltere'yi ziyaret ettiğini, belki de halefiyetini doğrulamak için veya belki de William'ın Normandiya'daki sorunları için yardım sağlamaya çalıştığını belirtir. William'ın o sırada Anjou Dükü ile savaş halinde olduğu göz önüne alındığında, gezi pek olası değil. Edward'ın istekleri ne olursa olsun, William'ın herhangi bir iddiasına, İngiltere'nin en güçlü ailesinin bir üyesi olan Wessex Kontu Godwin'in karşı çıkması muhtemeldi. Edward, Godwin'in kızı Edith ile 1043'te evlenmişti ve Godwin, Edward'ın taht iddiasının ana destekçilerinden biri gibi görünüyor. Ancak 1050'ye gelindiğinde, kral ve kont arasındaki ilişkiler bozuldu ve 1051'de Godwin ve ailesinin İngiltere'den sürülmesine yol açan bir krizle sonuçlandı. Bu sürgün sırasında Edward tahtı William'a teklif etti. Godwin, 1052'de silahlı kuvvetlerle sürgünden döndü ve kral ile kont arasında bir anlaşmaya varıldı, kont ve ailesi topraklarına geri geldi ve Edward'ın Canterbury Başpiskoposu olarak adlandırdığı bir Norman olan Jumiègesli Robert'ı Winchester Piskoposu Stigand ile değiştirdi. Hiçbir İngiliz kaynağı, Başpiskopos Robert'ın William'a veraset vaadini ileten sözde bir büyükelçiliğinden bahsetmiyor ve bundan bahseden iki Norman kaynağı, Jumiègesli William ve Poitiersli William, bu ziyaretin ne zaman gerçekleştiğine dair kronolojilerinde kesin değiller.",
      "Maine Kontu II. Herbert 1062'de öldü ve en büyük oğlu Robert'ı Herbert'in kız kardeşi Margaret ile nişanlayan William, oğlu aracılığıyla kontluğu ele geçirdi. Yerel soylular buna direndi, ancak William bölgeyi işgal etti ve 1064'te bölgenin kontrolünü ele geçirdi. William, 1065'te Le Mans piskoposluğuna bir Norman atadı. Ayrıca oğlu Robert Curthose'un yeni Anjou Kontu Sakallı Geoffrey'e saygı göstermesine izin verdi. William'ın batı sınırı böylece güvence altına alındı, ancak Bretonya ile olan sınırı güvensiz kaldı. 1064'te William, detayları belirsiz kalan bir seferde Bretonya'yı işgal etti. Ancak etkisi, Bretonya'yı istikrarsızlaştırmak ve Dük II. Conan'ı iç sorunlara odaklanmaya zorlamak oldu. Conan'ın 1066'da ölümü, William'ın Normandiya'daki sınırlarını daha da güvence altına aldı. William, 1066'da İngiltere'nin işgalini desteklemeye devam eden bazı Breton soylularının desteğini alarak Bretonya'daki seferinden de yararlandı.",
    ] },
]

[articles.zh]
text = "威廉一世（诺曼语：Williame I；法語：Guillaume I；英語：William I；1028年—1087年9月9日），通常被称为征服者威廉（William the Conqueror），在之前通常被称为私生子威廉（William the Bastard），是第一位诺曼英格兰国王，他从1066年开始统治英格兰，直到1087年去世为止。他是维京掠夺者羅洛的后裔，从1035年起成为法國诺曼底公爵紀堯姆二世（Guillaume II）。威廉是终身未婚的诺曼底公爵罗贝尔一世和情妇埃尔蕾瓦之子。威廉经过长期的努力而确立自己的权力，到了1060年，他稳固在诺曼底的统治，1066年，威廉要求成为英格兰国王。他率领一支由诺曼人、布列塔尼人、佛兰芒人等民族組成的法蘭西聯軍入侵英格兰，在黑斯廷斯战役中战胜哈罗德二世的英国军队，随后镇压英国人的反抗，这就是诺曼人征服英格兰，他也得名“征服者威廉”。威廉的余生则是巩固在英格兰的统治，以及解决其长子罗贝尔二世给他带来的麻烦。 威廉一世将诺曼－法兰西文化带到英格兰，使法语成为英格兰上层阶级的语言，对此後的英格兰中世纪时期产生重大影响。諾曼征服改變了英格蘭的统治者、語言、社会和教会的上层等级以及教會改革等諸多方面，其详细情况和程度是學者長期爭論的議題。"
title = "征服者威廉"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%BE%81%E6%9C%8D%E8%80%85%E5%A8%81%E5%BB%89"
intro = [
  "威廉一世（诺曼语：Williame I；法語：Guillaume I；英語：William I；1028年—1087年9月9日），通常被称为征服者威廉（William the Conqueror），在之前通常被称为私生子威廉（William the Bastard），是第一位诺曼英格兰国王，他从1066年开始统治英格兰，直到1087年去世为止。他是维京掠夺者羅洛的后裔，从1035年起成为法國诺曼底公爵紀堯姆二世（Guillaume II）。威廉是终身未婚的诺曼底公爵罗贝尔一世和情妇埃尔蕾瓦之子。威廉经过长期的努力而确立自己的权力，到了1060年，他稳固在诺曼底的统治，1066年，威廉要求成为英格兰国王。他率领一支由诺曼人、布列塔尼人、佛兰芒人等民族組成的法蘭西聯軍入侵英格兰，在黑斯廷斯战役中战胜哈罗德二世的英国军队，随后镇压英国人的反抗，这就是诺曼人征服英格兰，他也得名“征服者威廉”。威廉的余生则是巩固在英格兰的统治，以及解决其长子罗贝尔二世给他带来的麻烦。",
  "威廉一世将诺曼－法兰西文化带到英格兰，使法语成为英格兰上层阶级的语言，对此後的英格兰中世纪时期产生重大影响。諾曼征服改變了英格蘭的统治者、語言、社会和教会的上层等级以及教會改革等諸多方面，其详细情况和程度是學者長期爭論的議題。",
]
sections = [
  { "title" = "背景", "paragraphs" = [
      "早在八世纪末，斯堪的纳维亚人就开始攻击后来被称为诺曼底的地方。911年，海盗首领羅洛同法王查理三世达成协议，法王将诺曼底公国规划给罗洛，斯堪的纳维亚人从此在诺曼底永久定居。鲁昂周围的土地成为后来的诺曼底公国的核心。十世纪末，斯堪的纳维亚人可能将诺曼底用做袭击英格兰的基地，致使英格兰和诺曼底的关系恶化。为了改善关系，英格兰国王决策无方者埃塞尔雷德在1002年娶了诺曼底公爵理查二世的妹妹爱玛为第二任妻子。",
      "丹麦人持续突袭英格兰，1013年，丹麦国王斯文一世迫使埃塞尔雷德和他的家人离开英格兰，埃塞尔雷德便向里夏尔寻求帮助，到诺曼底避难。斯文在翌年去世，埃塞尔雷德被允许回国，但斯文的儿子克努特对埃塞尔雷德的回国提出异议。埃塞尔雷德于1016年骤逝后，克努特成为英格兰国王。爱玛成为克努特第二任妻子，她和埃塞尔雷德的两个儿子爱德华和阿尔弗雷德流亡诺曼底。",
      "克努特在1035年去世，他和第一任妻子所生儿子野兔腿哈罗德继承英格兰王位，他和爱玛所生儿子哈德克努特则继承丹麦王位，成为丹麦国王克努特三世。英格兰仍不稳定。1036年，阿尔弗雷德返回英格兰探望母亲，可能向哈罗德的王权提出挑战。一则故事表明阿尔弗雷德日后之死系威塞克斯伯爵戈德温所为，但其他故事将此事归咎于哈罗德。此后爱玛流亡法兰德斯，直到哈德克努特在哈罗德1040年死后继任英格兰国王，哈德克努特同母异父的哥哥爱德华也跟随异母弟弟去了英格兰。爱德华在弟弟哈德克努特于1042年6月死后宣布成为国王。",
    ] },
  { "title" = "早年", "paragraphs" = [
      "威廉在1027年或1028年出生于诺曼底法莱斯，他的出生日期最可能接近1028年年末。他是诺曼底公爵罗贝尔一世的独子，也是诺曼底公爵里夏尔二世的孙子。他的母亲埃尔蕾瓦是法莱斯的富尔贝的女儿；富尔贝可能是名制革工人或尸体防腐者。她可能是公爵的一名家庭成员，但并未嫁给罗贝尔。与此相反，她后来嫁与孔特维尔的赫文，并和丈夫生有巴约的厄德和莫尔坦伯爵罗贝尔两子及一个名字未知的女儿。埃尔蕾瓦的一个兄弟瓦尔特为威廉未成年时期的一名支持者和保护者。罗贝尔还和另一个情妇有一个女儿阿德莱德。",
      "1027年8月6日，罗伯特一世接替哥哥理查三世成为公爵。两兄弟在继承问题上一直存在分歧，而理查德的死也很突然。一些史学家称罗伯特杀害了理查，这个指控看似合理，但现在却无法证实。诺曼底的局势动荡不安，贵族家庭洗劫了教堂，布列塔尼的阿兰三世可能是为了控制公爵领地而对公国发动战争。到1031年，罗伯特已经从贵族那里获得了相当多的支持，其中许多人在威廉的一生中都很杰出。他们包括公爵的叔叔罗伯特，鲁昂大主教，他最初反对公爵；奥斯本是理查一世妻子冈诺的侄子；以及理查德一世的孙子布里翁的吉尔伯特（Gilbert of Brionne）。罗伯特登基后，继续诺曼人对仍流亡在法国北部的英国王子爱德华和阿尔弗雷德的支持。",
      "尽管是非婚生子女，他的父亲仍指定他为诺曼底的继承人。这一身份影响了他的早期生涯。孩童时期，他的生命常受到来自亲属的威胁，他们认为自己拥有更合法的继承权。当威廉在沃德勒夷（Vaudreuil）的城堡要塞睡觉时，发生了一起针对他的刺杀，当时刺客错误的刺中了睡在威廉旁边的孩子。但其父亲罗贝尔一世去世后，他的继承人身份得到承认。威廉的敌人称他为“杂种威廉”，并嘲笑他为制革匠的后代，阿朗松周围居民把兽皮挂在城墙上以嘲笑他。",
    ] },
  { "title" = "诺曼底公爵", "paragraphs" = [
      "按照他的父亲的遗嘱，威廉在1035年7岁时即位成为诺曼底公爵。敌对的诺曼贵族阴谋篡夺威廉的地位，杀死了威廉的三位监护人，尽管不包括布列塔尼的阿兰三世，他是一位后来的监护人。然而威廉得到法王亨利一世的支持。他在15岁时被亨利封为骑士。到威廉19岁时他成功的处理了叛乱和入侵的威胁。1047年，由于亨利的援助，威廉在卡昂于瓦尔斯沙丘战役中击败了叛乱的诺曼贵族，得到了受罗马天主教会支持的“神圣休战”，最终巩固了诺曼底的统治。和教宗良九世的愿望相反，威廉于1053年在诺曼底厄镇（滨海塞纳省）的圣母小教堂娶佛兰德斯的玛蒂尔达为妻。当时威廉约24岁，玛蒂尔达22岁。威廉被认为是一个忠实而钟情的丈夫，他们的婚姻生育了四个儿子和六个女儿。为了忏悔这桩近亲婚姻（他们是远房表亲），威廉捐建了圣斯蒂芬教堂，玛蒂尔达捐建了圣三一修道院（女子修道院）。",
      "由于威廉的贵族联姻，诺曼底力量的加强使法王亨利一世感到威胁，他两次（1054年和1057年）试图入侵诺曼底，都没有成功。威廉已经是一个有魅力的领袖，在诺曼底内部吸引了强大的支持，包括他同母异父兄弟巴约的厄德和莫尔坦伯爵罗贝尔的忠诚，两人在他的一生中扮演了重要的角色。随后，亨利一世和若弗魯瓦二世于1060年去世，削弱了这两股竞争势力的权力中心，使得威廉受益。1062年威廉入侵並获得了曾是安茹封地的曼恩伯爵领地的控制权。",
      "忏悔者爱德华死后无嗣，威廉、强大的威塞克斯伯爵哈罗德·葛温森以及被称为哈罗德·哈德拉德的维京国王挪威的哈罗德三世三者之间激烈的争夺英国王位。透过自己的姑祖母愛瑪（埃塞烈德的妻子和爱德华的母亲），威廉拥有微弱的血统（威廉的爷爷理查二世与爱玛为兄妹，威廉的父亲罗贝尔一世与忏悔者爱德华为姑表兄弟，威廉即为忏悔者爱德华的姑表侄子。）来主张他的权利。威廉同时声称当他1052年在伦敦访问爱德华时，后者许诺给他王位。在丹麦人占领英格兰期间，爱德华流亡诺曼底，一生中许多时间在此度过。威廉援救了在蓬蒂厄伯爵领地遭遇海难的哈罗德，并且他们一起击败了布列塔尼公爵科南二世。在那种情况下，威廉册封哈罗德为骑士；无论如何，他也同时诱导哈罗德，透过一个隐藏的圣徒骸骨对自己宣誓效忠。",
    ] },
  { "title" = "英格兰统治时期", "paragraphs" = [
      "威廉一世即位后，为了镇压国内盎格鲁－撒克逊人的叛乱，威廉一世将英国的五分之一土地作为自己的领地，将手下的骑士封为男爵，分别派驻各地镇守，并在全国修建了很多城堡。伦敦塔和温莎城堡都是在那个时期修建的。",
      "威廉一世改變了英國歷史的走向，不論是商業、宗教或文化上，都由以往趨向斯堪的那維亞的風俗，變成了和西歐社會相承繼的局面。他引入了法语和法国的生活习惯，其中一些词汇和习俗对英国产生了很大的影响。同時，威廉一世亦改變了以往以農業為主的社會模式，引入歐洲的封建制度，如騎士取代了家奴的地位，農夫地位也降為農奴階級。为了掌握全国的人口和土地分配情况，威廉一世在1085年和1086年派人调查整个英格兰地区贵族和自耕农土地的实际情况及经济力量，颁布了被称为《末日审判书》的土地帐簿。根据《末日审判书》的调查结果，英格兰约有150万人口，其中90%以上是农民。",
      "为了镇压长子罗贝尔二世在诺曼底地区发动的反叛，威廉一世亲自返回法国，于该年七月在芒特落马受伤，两个月后在鲁昂的St. Gervais女修道院去世，他的第三个儿子威廉陪在他身旁，去世后被埋葬在诺曼底卡昂的圣埃蒂安修道院。他晚年身材发胖，下葬时人们试图将他塞进棺内的时候，他的尸体竟然胀裂了，使得整个教堂充满了一股难闻的气味。而当威廉运到墓地即将入土为安时，有一个人突然声称这块地皮是他的，并在众人面前要求主持公道。在付出了六十个先令后，威廉的遗体才得以入土下葬。",
    ] },
]

[articles.ja]
text = "ウィリアム征服王（英語：William the Counqueror（またの名をウィリアム庶子王（英語：William the Bastard）とも）、1028年11月8日 - 1087年9月9日）とは、初代ノルマン人イングランド王（在位：1066年12月25日 - 1087年9月9日）並びにノルマンディー公（在位：1035年7月3日 - 1087年9月9日）である。初代ノルマンディー公ロロの末裔として、ウィリアムはギヨーム2世としてノルマンディー公を1035年に継承し、長きにわたる抗争の末、ギヨームはノルマンディー支配を確実なものとした。1066年にはウェセックス家イングランド王エドワード懺悔王の死を受け、ギヨーム2世はイングランドに侵攻を開始。ヘイスティングズの戦いでイングランド王ハロルド・ゴドウィンソンを打ち破り、イングランド王国を手中に納めることに成功した。しかし晩年は、イングランド並びに大陸領での紛争や彼の長男ロベールとの不和に悩まされることとなった。 ギヨーム（以降、イングランド王即位以前のウィリアム征服王をギヨームと呼ぶこととする。）はノルマンディー公ロベール華麗公とアルレット・ド・ファレーズとの間に庶子として誕生した。ギヨームの非嫡出子という立場に加えて彼が幼くして公爵位を継承したことにより、ギヨームは多くの困難を抱えた上に、公爵就任後1年の間ノルマンディーは無政府状態に陥ることとなった。ギヨームが成人するまでの間、ノルマンディー諸侯はギヨーム公を手中に納めんとするとともに、各々の目的を果たすべくお互い争い続けた。1047年、ギヨーム公は反乱を鎮圧し、続けて公国全土に権威を広げんと試みたが、この試みは1060年代まで続けられることとなった。1050年代には、ギヨーム公はフランドル伯ボードゥアン5世の娘マティルダと結婚することで、フランドル伯国という強力な同盟者を得た。また、マティルダとの結婚以前にギヨームは自身の支持者をノルマンディーの教会の司教・司祭に任命できるほどにまで権威を回復していた。このように、ギヨームは徐々に権力を自身に集中させることに成功し、結果として公国領土の拡大に繋がり、1062年までには隣国のメーヌを制圧した。…"
title = "ウィリアム1世 (イングランド王)"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%A6%E3%82%A3%E3%83%AA%E3%82%A2%E3%83%A01%E4%B8%96_%28%E3%82%A4%E3%83%B3%E3%82%B0%E3%83%A9%E3%83%B3%E3%83%89%E7%8E%8B%29"
intro = [
  "ウィリアム征服王（英語：William the Counqueror（またの名をウィリアム庶子王（英語：William the Bastard）とも）、1028年11月8日 - 1087年9月9日）とは、初代ノルマン人イングランド王（在位：1066年12月25日 - 1087年9月9日）並びにノルマンディー公（在位：1035年7月3日 - 1087年9月9日）である。初代ノルマンディー公ロロの末裔として、ウィリアムはギヨーム2世としてノルマンディー公を1035年に継承し、長きにわたる抗争の末、ギヨームはノルマンディー支配を確実なものとした。1066年にはウェセックス家イングランド王エドワード懺悔王の死を受け、ギヨーム2世はイングランドに侵攻を開始。ヘイスティングズの戦いでイングランド王ハロルド・ゴドウィンソンを打ち破り、イングランド王国を手中に納めることに成功した。しかし晩年は、イングランド並びに大陸領での紛争や彼の長男ロベールとの不和に悩まされることとなった。",
  "ギヨーム（以降、イングランド王即位以前のウィリアム征服王をギヨームと呼ぶこととする。）はノルマンディー公ロベール華麗公とアルレット・ド・ファレーズとの間に庶子として誕生した。ギヨームの非嫡出子という立場に加えて彼が幼くして公爵位を継承したことにより、ギヨームは多くの困難を抱えた上に、公爵就任後1年の間ノルマンディーは無政府状態に陥ることとなった。ギヨームが成人するまでの間、ノルマンディー諸侯はギヨーム公を手中に納めんとするとともに、各々の目的を果たすべくお互い争い続けた。1047年、ギヨーム公は反乱を鎮圧し、続けて公国全土に権威を広げんと試みたが、この試みは1060年代まで続けられることとなった。1050年代には、ギヨーム公はフランドル伯ボードゥアン5世の娘マティルダと結婚することで、フランドル伯国という強力な同盟者を得た。また、マティルダとの結婚以前にギヨームは自身の支持者をノルマンディーの教会の司教・司祭に任命できるほどにまで権威を回復していた。このように、ギヨームは徐々に権力を自身に集中させることに成功し、結果として公国領土の拡大に繋がり、1062年までには隣国のメーヌを制圧した。",
  "1050年代から1060年代初頭にかけて、ギヨームはイングランド王位後継者の一人として名を挙げていた。当時のイングランド王エドワード懺悔王（ギヨームの従兄弟でもある）に子供がいなかったためである。しかし潜在的に後継者として目されていた有力諸侯はほかにもおり、その一人がハロルド・ゴドウィンソンであったが、エドワード懺悔王が臨終の際に彼を後継者として指名したため、ハロルドとギヨームの対立は明確なものとなった。ギヨームは「ハロルドはかつてギヨームのイングランド王位継承を承認し、国王就任後のギヨームに対する支援を約束していた」として自身の王位継承の正当性を主張し、艦隊を建造してイングランドへの侵攻、いわゆるノルマンコンクエストを計画した。結果、1066年9月14日の決戦でハロルド・ゴドウィンソン率いるイングランド軍を撃破しハロルド・ゴドウィンソン自身を討ち死にに追い込んだことで、ギヨームはイングランド征服を完遂した。1066年のクリスマスにギヨームとマティルダは戴冠式をロンドンのウエストミンスター寺院で挙行し、ウィリアム1世（ウィリアムはギヨームの英語読み）としてイングランド王に就任した。ウィリアム王はイングランドの統治に関わる手配を済ませ、1067年初頭にノルマンディーに帰国した。その後、イングランドでは反乱が乱発したが、ウィリアム王は1075年までにイングランド支配を安定化させ、その後の治世の大半の期間を大陸領での活動に費やすことが可能となった。",
  "ウィリアム王の治世末期は大陸領での問題や彼の息子ロベールとのいざこざ、そしてデーン人による侵略に悩まされた。1086年、ウィリアム王はドゥームズデイ・ブック（コンクエスト以前と以降のイングランドにおける土地保有者に関する調査）の編纂を命じた。1087年9月、ウィリアム王は北フランスに対する軍事遠征の最中に崩御し、カーンに埋葬された。イングランドにおけるウィリアム王の治世は、城塞群の建設・ノルマン諸侯のイングランド入植事業・イングランド人聖職者の組織構成の変更などで特色付けられている。ウィリアム王はイングランド・ノルマンディーを別々に統治する方向性で政策を進めた。ウィリアム王の死後、イングランドは次男ウィリアム・ノルマンディーは長男ロベールに継承された。",
]
sections = [
  { "title" = "背景", "paragraphs" = [
      "現在ノルマンディーと呼ばれている地域でノース人の襲撃が始まったのは8世紀後半であった。それに続いてスカンディナヴィア人による入植活動が始まり、911年には著名なヴァイキング首長ロロが西フランクの国王シャルル単純王の許可のもとで、ルーアン地域を獲得し定住を開始した。ルーアン近郊の地域はのちのノルマンディー公国の中核となった。その後、ヴァイキングによるイングランド襲撃活動が再活発化した10世紀ごろにはノルマンディーは彼らの活動の拠点となり、イングランドとノルマンディーの関係悪化につながった。両国間の関係改善を試みたイングランドの国王エゼルレッド無策王は、1002年に当時のノルマンディー公リシャール2世の妹エマを後妻として娶り、両国の間に婚姻関係を結んだ。",
      "デーン人による襲撃がその後も絶えず続き、遂にはデーン人の王であるスヴェン双叉髭王が直々にイングランド侵攻を開始したことで、エゼルレッド王はリシャール公に支援を求め、家族と共にノルマンディーに亡命することとなった。スヴェン王が1014年に亡くなったことで、エゼルレッド王はノルマンディーからイングランドへの帰還を果たしたが、スヴェンの息子クヌートがエゼルレッド王と対立することとなった。しかし1016年、エゼルレッド王が突然亡くなったことで、イングランド王位はクヌートの手に渡り、エゼルレッド王の息子：エドワード王子・アルフレッド王子はノルマンディーへの亡命を強いられ、エゼルレッド王の後妻エマはクヌート大王に嫁いだ。",
      "1035年にクヌート大王が亡くなると、イングランド王位は、亡きクヌート大王の一人目の王妃との間の息子であるハロルド兎足王に継承され、デンマーク王位はエマとの息子ハーデクヌーズに継承された。が、イングランドは非常に不安定な状況にあった。1036年にはアルフレッド王子がイングランドに舞い戻り母と再会するとともに、イングランド王位を巡り兎足王と対峙した。しかしアルフレッド王子はその後殺害された。この殺人の罪は当時の有力貴族ウェセックス伯ゴドウィンにあるという説や、兎足王の差し金であったという説が存在する。エマはその後フランドル伯国に落ち延び、1040年に兎足王が死んでハーデクヌーズがイングランド王位を継承するまで当地で亡命生活を続けた。そして1042年7月にハーデクヌーズが亡くなると、王位はエドワードに引き継がれた。",
    ] },
  { "title" = "若年期", "paragraphs" = [
      "1027年/1028年、ギヨームはファレーズで誕生した。ギヨームはロベール1世華麗公の唯一の息子で、かつロベール1世はリシャール2世の息子であった。ギヨームの母アルレット・ド・ファレーズはフュルベール・ド・ファレーズという名のかつて皮なめし工・もしくは防腐処理者であった者の娘であった。アルレットは公爵家の雇われ人であった可能性もあるが、ロベール1世とは結婚していなかった。アルレットはその後、エリュルアン・ド・コントヴィルと結婚し、彼らの間に2人の息子：オド・ロベール、そして氏名不詳の娘が後に誕生した。アルレットの兄弟の1人ゴーティエは、幼いギヨームを守った。ロベール1世には他の妾との間に娘アデライードもいた。",
      "ギヨームの父ロベール1世は彼の兄リシャール3世の後を継ぎ、1027年8月6日にノルマンディー公を継承した。ロベール・リシャール兄弟は公爵位の継承をめぐってかねてより対立しており、リシャール公の死は突然の出来事であった。歴史家の中にはロベールが兄リシャールを殺害したとして攻め立てる者もいたが、もっともらしい話ではあるものの今となっては証明するすべはない。当時のノルマンディー公国は、諸侯らが教会を略奪して回り、ブルターニュ公アラン3世が公国に侵攻するなど混乱した状態が広がっていた。1031年までに、ロベール1世は公国内の諸侯を取りまとめることに成功し、これらの諸侯の多くはギヨームの生涯において重要な役目を果たすこととなる。この中の1人、ルーアン大司教ロベール2世はギヨームが公爵位を継いだ後も、ノルマンディーにて亡命生活を続けていたウェセックス王族エドワード（のちのエドワード懺悔王）・アルフレッドに対する支援政策を継続した。",
      "父ロベールはかつて、クヌート大王の娘と一時的に婚約していた可能性も考えられているが、結局結婚することはなかった。もしロベールが嫡出子を儲けていた場合、ギヨームは公爵位を継承できていたかどうかは明らかではない。しかし、以前のノルマンディー公たちはみな非嫡出子であり、ギヨームが公国内での勅許状に父ロベール公と共に名を連ねていることから、最も有力なノルマンディー公位継承者として目されていた可能性は高い。1034年、ロベール公はエルサレムへの巡礼を取り決めた。彼の家臣の中には巡礼を取りやめるよう翻意を促したが、ロベール公は1035年1月に評議会を招集し、エルサレムに出発する前に、ノルマンディーの諸侯たちを集めて息子のギヨームに対して公爵位継承者としての忠誠を誓わせた。ロベール公はエルサレムからノルマンディーに帰国する道中で、同年7月にニカイアで亡くなった。",
    ] },
  { "title" = "ノルマンディー公", "paragraphs" = [
      "ギヨームは自身の非嫡出子としての出自や公爵位を幼くして継承したことを含み、ギヨームは公爵になる際に多くの困難を抱えていた。そんなギヨームは大叔父のルーアン大司教ロベール2世やフランス王アンリ1世の支援の下で父ロベールから公爵を継承できた。また、1036年にノルマンディー滞在中の亡命ウェセックス王族たちに対する支援政策からは新公爵の後見人たちがそれまでの政策の継続を試みたことがうかがえるが、1037年5月にギヨームの支援者の1人ルーアン大司教が亡くなったことで、ノルマンディーは一気に混乱へ突き進んだ。",
      "公国内の混乱は1047年まで続き、権力掌握を目論むノルマンディー諸侯たちは何よりも幼いギヨーム公を抱え込むべく奔走した。最初にギヨーム公を手中に納めたのはブルターニュ公アラン3世であったがアラン公自身が1039年後半/1040年9月に亡くなり、続いて父ロベール公の頃からの支援者でギヨームの後見人であったブリオンヌ伯ジルベールがギヨーム公を保護下に置いた。しかしその数か月後にジルベール伯は殺害され、もう一人の後見人Turchetilもまた、ジルベールと同時期に殺害された。また残された他の後見人オスベール・ド・クレポン（en:Osbern the Steward）に至っては、ギヨーム公の就寝中に公爵の寝室で殺害されたとされる。また、ギヨーム公の母方の叔父ゴーティエは時折幼きギヨーム公を農民の家に隠れさせる必要に迫られることもあったと伝わるが、この話は当時の年代記編者オルデリック・ヴィターリスの誇張を含むともされる。また、歴史家Eleanor Searleは、ギヨーム公はウィリアム・フィッツオズバーン・ロジャー・ド・ボーモント・ロジャー・ド・モンゴメリーの3人の従兄弟によって養育されたと推測している。多くのノルマンディー諸侯はギヨーム公が幼いことを理由に個人的な戦争や抗争に専念していたものの、先述の諸侯たちは依然として公爵による公国統治を支持し、教会勢力もギヨームを支持した。",
      "フランス王アンリ1世は幼きギヨーム公の支援を継続したが、1046年にはギー・ド・ブルゴーニュがコタンタン半島・ベッサンの領主たちの支援を得て下ノルマンディー地域で反乱を起こした。伝説的な要素を含む逸話によれば、ヴァローニュにて反乱軍はギヨーム公の身柄の拘束を試みたものの、ギヨーム公は夜陰に紛れて逃げ出し、フランス王のもとに身を寄せたと伝わる。1047年初期頃にアンリ1世・ギヨーム公はノルマンディーに進軍し、ヴァレ=デュヌの戦い（en:Battle of Val-ès-Dunes）で反乱軍を撃破したと伝わるが、戦闘の詳細については不明な点が多い。11世紀の司祭ギヨーム・ド・ポアティエによれば、この戦いは主にギヨーム公の活躍によってもたらされた勝利であると主張しているが、それ以前に記された文献にはフランス王の統率力並びにその戦士たちも重要な役割を果たしたと記されている。戦後、ギヨーム公は公国におけるノルマンディー公としての権力を掌握し、戦闘から間もなくして神の名の下での休戦を公国中に布告し、戦闘が許される日を制限することで戦役や暴力行為の制御を試みた。ヴァル=デュヌでの勝利がギヨーム公の公国制圧の転機とはなったものの、ノルマンディー諸侯を完全に掌握しきったわけではなかった。1047年以降1054年までの期間は依然として混乱が続き、それから1060年までは比較的小規模な混乱が続いた。",
    ] },
  { "title" = "イングランド・大陸領での紛争", "paragraphs" = [
      "1051年、後継者を設けていなかったイングランド王エドワード懺悔王がギヨーム公を王位継承者に任命した。ギヨームはエドワード王の母方の叔父ノルマンディー公リシャール2世の孫であったためである。。",
      "D版のアングロサクソン年代記には、王位継承を確固たるものにするため、もしくは公国での紛争に対する援助を得るため、ギヨーム公が1051年後半にイングランドを訪れたと記されている。ただ、この訪問は当時ギヨーム公がアンジュー伯との戦役に没頭していたことを考慮するとあまり現実的ではない。エドワード懺悔王が何を望んでいたにしろ、当時のイングランドで最も強力な影響力を保持していたアングロサクソン貴族ウェセックス伯ゴドウィンは、ギヨームの主張するいかなる主張に対して反発していた可能性が高い。エドワード王は1043年にゴドウィン伯の娘エディスと結婚しており、エドワードが王位を継承する際にはゴドウィンは彼の有力な支援者の1人となっていたのである。しかし、ゴドウィン伯とエドワード王との関係は悪化し、1051年にはゴドウィン一族はイングランドを離れアイルランドに亡命を強いられることとなった。そしてゴドウィン一族の亡命中に、エドワード王はギヨームに王位継承を約束したのであった。しかし1052年、現地兵を率いてゴドウィン伯はイングランドに帰還し、エドワード王はゴドウィン一族に対しかつての領土・爵位を保証し、またノルマン人聖職者ロバート・オブ・ジュミエージュのカンタベリー大司教からの廃位、並びにスティガンドの大司教座への任命を強いられた。英語文献には、ロバート大司教がギヨーム公へのイングランド王位継承の約定を伝える使節を率いたとの内容は記されておらず、一方のギヨーム・ド・ジュミエージュ・ギヨーム・ド・ポアティエの2人のノルマン人著述家が記した文献にはノルマンディー訪問についての内容が記されている。しかし、この訪問の日時は記されていない。",
      "1062年、メーヌ伯エルベール2世が亡くなると、息子ロベールをエルベール伯の妹マルグリッドと婚約させていたギヨームは、息子を通じてメーヌ伯領の継承権を主張した。メーヌの領主たちは反発したものの、1064年にギヨームは、軍を率いて侵攻しメーヌを支配下に置いた。ギヨームは1065年にはノルマン人をルマン司教に任じ、息子ロベールを新たなアンジューの領主ジョフロワ髭伯に臣下の礼を取ることを許可した。ギヨームはこれにより公国西部の国境を安定化させることに成功したが、ブルターニュ公国との国境はいまだ不安定なままであった。そして1064年、ギヨームはブルターニュに侵攻を開始したが、この侵攻についてはいまだ不明な点が多い。ただ、この侵攻によってブルターニュ公国内で混乱が広がったことは確実で、ブルターニュ公コナン2世は外征を行う余裕がなくなり、国内の安定化に追われることとなった。加えて1066年、コナン2世が亡くなったことでノルマンディーの国境はより安定したものとなった。また、ブルターニュ遠征によってギヨームは、1066年に敢行されることとなるノルマン・コンクエストにおいてブルターニュ諸侯の支援を得ることすらできた。",
    ] },
]

[articles.tl]
text = "Si Guillermo na Mananakop, Guillermong Kongkistador at Guillermo I ng Inglatera (bandang 1027 - 9 Setyembre 1087), kilala rin bilang William ang Mananakop o William I ng Inglatera, ay isang Hari ng Inglatera magmula 1066 hanggang 1087. Ipinanganak siya sa Falaise na nasa Normandy, Pransiya."
title = "Guillermo na Mananakop"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Guillermo_na_Mananakop"
intro = [
  "Si Guillermo na Mananakop, Guillermong Kongkistador at Guillermo I ng Inglatera (bandang 1027 - 9 Setyembre 1087), kilala rin bilang William ang Mananakop o William I ng Inglatera, ay isang Hari ng Inglatera magmula 1066 hanggang 1087. Ipinanganak siya sa Falaise na nasa Normandy, Pransiya. Naging Duke siya ng Normandy noong 1047 nang manalo siya sa isang labanan sa Caen. Noong 1050 o 1051, pinakasalan niya ang kanyang pinsang si Matilda ng Flanders. Naging Hari siya ng Inglatera pagkarang lusubin niya ang Inglatera at nagwagi sa Labanan sa Hastings noong 1066 laban kay Haring Harold II ng Inglatera. Ang mga Norman ang naging mga hari at poon (panginoon) ng mga Anglo-Sakson subalit nananatiling katulad ng dati ang mga pangkaraniwang mga tao. Pagkaraan niyang maging hari, pinasulat niya sa kanyang mga tagapaglingkod ang Aklat ng Domesday na nagtatala ng lahat ng mga lupain sa kanyang bagong kaharian, kung sino ang nagmamay-ari ng mga ito, at kung magkano ang halaga ng mga ito. Natapos noong 1086. Namatay si William habang nasa Rouen, Pransiya dahil sa mga sugat na natamo niya pagkaraang mahulog mula sa isang kabayo. Pinalitan siya bilang hari ng kanyang anak na si William II ng Inglatera (Guillermo II ng Inglatera).",
]
sections = [
  { "title" = "Tingnan din", "paragraphs" = [
      "Ang lathalaing ito na tungkol sa Tao, Inglatera at Pransiya ay isang usbong. Makatutulong ka sa Wikipedia sa pagpapalawig nito.",
    ] },
]

[articles.pt]
text = "Guilherme I (em normando antigo: Williame I; em inglês antigo: Willelm I; Falaise, c. 1028 – Ruão, 9 de setembro de 1087), geralmente chamado de Guilherme, o Conquistador, e algumas vezes de Guilherme, o Bastardo, foi o primeiro rei normando da Inglaterra, que governou de 1066 até a sua morte em 1087."
title = "Guilherme I de Inglaterra"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Guilherme_I_de_Inglaterra"
intro = [
  "Guilherme I (em normando antigo: Williame I; em inglês antigo: Willelm I; Falaise, c. 1028 – Ruão, 9 de setembro de 1087), geralmente chamado de Guilherme, o Conquistador, e algumas vezes de Guilherme, o Bastardo, foi o primeiro rei normando da Inglaterra, que governou de 1066 até a sua morte em 1087. Descendente de invasores vikings, ele era duque da Normandia desde 1035. Depois de uma longa luta para estabelecer seu poder em 1060, seu domínio sobre a região francesa tornou-se seguro, e deu início à conquista normanda da Inglaterra em 1066. O resto de sua vida foi marcado por lutas para consolidar seu domínio sobre a Inglaterra e suas terras continentais, e por dificuldades com seu filho mais velho.",
  "Era filho do solteiro Roberto I, o Magnífico, com sua amante Arlete. Sua posição como filho ilegítimo e sua juventude causaram-lhe algumas dificuldades depois que sucedeu a seu pai, assim como a anarquia que assolou os primeiros anos de seu governo. Durante sua infância e adolescência, membros da aristocracia normanda lutaram entre si, tanto para ter o controle do jovem duque quanto para seus próprios fins. Em 1047, Guilherme foi capaz de esmagar uma rebelião e começar a estabelecer sua autoridade sobre o ducado, um processo que não ficou completo até cerca de 1060. Seu casamento no início da década de 1050 com Matilde de Flandres forneceu-lhe um poderoso aliado no condado vizinho de Flandres. Na época de seu casamento, foi capaz de providenciar as nomeações de seus partidários como bispos e abades na igreja normanda. Sua consolidação no poder permitiu-lhe expandir seus horizontes, e em 1062 foi capaz de garantir o controle do condado vizinho do Maine.",
  "No final da década de 1050 e início da década de 1060, o duque se tornou um candidato ao trono da Inglaterra, então mantido por Eduardo, o Confessor, seu primo em primeiro grau e que não tinha descendentes. Havia outros potenciais pretendentes, incluindo o poderoso conde inglês Haroldo Godwinson, que foi nomeado o próximo rei por Eduardo em seu leito de morte em janeiro de 1066. Guilherme argumentou que o falecido rei tinha prometido anteriormente o trono a ele, e que Haroldo tinha jurado apoiar sua reivindicação. Construiu uma grande frota e invadiu a Inglaterra em setembro de 1066, decisivamente derrotando e matando Haroldo na Batalha de Hastings em 14 de outubro. Depois de mais alguns esforços militares, o duque normando foi coroado rei no Natal de 1066, em Londres. Fez arranjos para o seu governo na Inglaterra no início de 1067, antes de voltar à Normandia. Diversas rebeliões sem sucesso se seguiram, mas em 1075 seu domínio na Inglaterra estava praticamente consolidado, permitindo-lhe passar a maior parte do resto de seu reinado no continente.",
  "Os anos finais de Guilherme foram marcados por dificuldades em seus domínios continentais, problemas com seu primogênito, e ameaças de invasões da Inglaterra pelos danos. Em 1086 ordenou a compilação do Domesday Book, uma pesquisa que lista todos os proprietários de terras na Inglaterra, juntamente com suas herdades. Guilherme morreu em setembro de 1087 enquanto liderava uma campanha no norte da França, e foi sepultado em Caen. Seu reinado na Inglaterra foi marcado pela construção de castelos, o estabelecimento de uma nova nobreza normanda sobre as terras, e a mudança na composição do clero inglês. Ele não tentou integrar seus vários domínios em um império coeso, mas em vez disso continuou a administrar cada parte separadamente. As terras de Guilherme foram divididas após a sua morte: a Normandia foi para o seu filho mais velho, Roberto, e seu segundo filho sobrevivente, Guilherme, o Ruivo, recebeu a Inglaterra.",
]
sections = [
  { "title" = "Antecedentes", "paragraphs" = [
      "Os nórdicos inicialmente começaram a invadir o que se tornaria a Normandia no final do século VIII. Colônias escandinavas permanentes foram criadas antes de 911, quando Rolão (r. 911–927), um dos líderes vikings, e o rei Carlos, o Simples (r. 893–922) da França chegaram a um acordo no qual o último entregou o Condado de Ruão ao líder viking. As terras ao redor de Ruão tornaram-se posteriormente o núcleo do Ducado da Normandia. A região pode ter sido usada como uma base quando os ataques escandinavos na Inglaterra foram renovados no final do século X, o que teria piorado as relações entre a Inglaterra e a Normandia. Em um esforço para melhorar a situação, o rei inglês Etelredo, o Despreparado tomou Ema da Normandia, irmã do duque Ricardo II, como sua segunda esposa em 1002.",
      "Ataques dinamarqueses à Inglaterra continuaram, e Etelredo procurou a ajuda de Ricardo. Precisou refugiar-se na Normandia em 1013, quando o rei Sueno Barba Bifurcada expulsou-o junto de sua família da Inglaterra. O rei dos ingleses regressou quando Sueno morreu em 1014, mas seu filho, Canuto, o Grande (r. 1018–1035), contestou seu retorno. Etelredo morreu inesperadamente em 1016, e Canuto tornou-se o governante da Inglaterra. Os dois filhos de Etelredo e Ema, Eduardo (r. 1042–1066) e Alfredo Atelingo, foram para o exílio na Normandia, enquanto sua mãe tornar-se-ia a segunda mulher do rei dinamarquês.",
      "Após a morte de Canuto em 1035 o trono inglês voltou para Haroldo Pé de Lebre, seu filho com sua primeira esposa, enquanto Hardacanuto (r. 1035–1042), seu filho com Ema, tornar-se-ia rei da Dinamarca. A Inglaterra permaneceu instável. Alfredo voltou para o país em 1036 para visitar sua mãe e talvez desafiar Haroldo como rei. Uma história implica o conde Goduíno de Wessex na posterior morte de Alfredo, mas outros culparam Haroldo. Ema foi para o exílio no Flandres até Hardacanuto se tornar rei após a morte de Haroldo em 1040, e seu meio-irmão Eduardo seguiu Hardacanuto à Inglaterra; Eduardo foi proclamado rei após a morte de seu meio-irmão em junho de 1042.",
    ] },
  { "title" = "Início de vida", "paragraphs" = [
      "Guilherme nasceu em 1027 ou 1028 em Falaise, Normandia, mais provavelmente no final de 1028. Era o único filho de Roberto I, o Magnífico, filho de Ricardo II da Normandia. Sua mãe, Arlete (ou Herleva), era filha de Fulberto de Falaise; ele pode ter sido um curtidor ou embalsamador. Possivelmente ela era um membro da família ducal, mas não se casou com Roberto. Em vez disso, se casou com Herluino de Conteville, com quem teve dois filhos — Odo de Bayeux e Roberto, Conde de Mortain— e uma filha cujo nome é desconhecido. Um dos irmãos de Arlete, Gualtério, tornou-se um defensor e protetor de Guilherme durante sua infância. Roberto também teve uma filha, Adelaide da Normandia, com outra amante.",
      "Roberto tornou-se duque da Normandia em 6 de agosto de 1027, sucedendo seu irmão mais velho, Ricardo III, que só tinha conseguido o título no ano anterior. Roberto e seu irmão estavam em desacordo sobre a sucessão, e a morte de Ricardo foi repentina. O novo governante foi acusado por alguns escritores de matar seu irmão, o que era plausível, mas hoje considerado improvável. As condições na Normandia eram incertas, pois famílias nobres despojaram a Igreja e Alano III da Bretanha travou uma guerra contra o ducado, possivelmente em uma tentativa de controlá-lo. Em 1031, Roberto havia reunido considerável apoio de nobres, muitos dos quais se tornariam proeminentes durante a vida de Guilherme. Eles incluíam o tio de Roberto, o arcebispo Roberto de Ruão, que originalmente se opunha ao duque, Osberno, sobrinho de Gunora de Crépon, esposa do duque Ricardo I, o Destemido, e o conde Gilberto de Brionne, um neto de Ricardo I. Após a sua adesão, Roberto continuou o apoio normando aos príncipes ingleses Eduardo e Alfredo, que ainda estavam exilados no norte da França.",
      "Há indícios de que Roberto pode ter sido brevemente prometido em casamento à filha do rei Canuto, mas nenhum casamento ocorreu. Não está claro se Guilherme seria substituído na sucessão ducal se o seu pai tivesse um filho legítimo. Duques anteriores eram ilegítimos, e sua associação com seu pai nas cartas ducais parece indicar que foi considerado o mais provável herdeiro normando. Em 1034, o duque Roberto decidiu ir em peregrinação a Jerusalém. Embora alguns de seus partidários tentassem dissuadi-lo de empreender a viagem, Roberto convocou um conselho em janeiro de 1035 e teve os magnatas normandos reunidos jurando fidelidade ao seu filho ilegítimo como seu herdeiro antes de partir a Jerusalém. Ele morreu no início de julho em Niceia, em seu caminho de volta à Normandia.",
    ] },
  { "title" = "Duque da Normandia", "paragraphs" = [
      "Guilherme enfrentou vários desafios para se tornar duque, incluindo seu nascimento ilegítimo e sua juventude: as evidências indicam que ele tinha sete ou oito anos de idade na época. Ele contou com o apoio de seu tio-avô, o arcebispo Roberto, assim como o rei da França, Henrique I, habilitando-o para suceder ao ducado de seu pai. O apoio dado aos príncipes ingleses exilados em sua tentativa de voltar à Inglaterra em 1036 mostra que os guardiões do novo duque estavam tentando dar continuidade às políticas de seu pai, mas a morte do arcebispo de Ruão em março de 1037 removeu um dos principais partidários de Guilherme, e as condições na Normandia rapidamente caíram em caos.",
      "A anarquia no ducado durou até 1047, e o controle do jovem governante era uma das prioridades das pessoas que disputavam o poder. No início, Alano da Bretanha tinha a custódia do duque, mas quando ele morreu no final de 1039 ou outubro de 1040, Gilberto de Brionne se encarregou de Guilherme. Gilberto foi morto após alguns meses, e outro guardião, Turchetil, também foi morto na mesma época. Mais um guardião, Osberno, foi morto no início do ano de 1040 no quarto de Guilherme, enquanto o duque dormia. Dizia-se que Gualtério, seu tio materno, foi ocasionalmente forçado a esconder o jovem nas casas dos camponeses, embora esta história possa ser um embelezamento de Orderico Vital. A historiadora Eleanor Searle especula que Guilherme teria sido criado com os três primos que mais tarde se tornaram importantes em sua carreira — Guilherme FitzOsbern, Rogério de Beaumont, e Rogério de Montgomery. Embora muitos dos nobres normandos se envolvessem em suas próprias guerras e feudos durante a menoridade de Guilherme, os viscondes ainda reconheciam o governo ducal, e a hierarquia eclesiástica apoiava Guilherme.",
      "O rei Henrique continuou a apoiá-lo, mas no final de 1046 opositores de Guilherme se uniram em uma rebelião centrada na Baixa Normandia, liderada por Guido de Borgonha com o apoio de Nigel, Visconde do Cotentin, e Ranulfo, Visconde de Bessin. De acordo com as histórias que podem ter elementos lendários, foi feita uma tentativa de apreender Guilherme em Valognes, mas ele escapou protegido pela escuridão, buscando refúgio com o rei francês. No início de 1047, Henrique e Guilherme voltaram à Normandia e foram vitoriosos na Batalha de Val-ès-Dunes perto de Caen, embora poucos detalhes da luta real sejam registrados. Guilherme de Poitiers alegou que a batalha foi ganha, principalmente, por meio dos esforços do jovem duque, mas relatos anteriores afirmam que homens e a liderança do rei Henrique também desempenharam um papel importante. Guilherme assumiu o poder na Normandia, e logo após a batalha promulgou a Trégua de Deus em todo seu ducado, em um esforço para limitar a guerra e a violência, restringindo os dias do ano em que a luta era autorizada. Embora a Batalha de Val-ès-Dunes tenha marcado um ponto de virada em seu controle do ducado, não foi o fim de sua luta para ganhar vantagem sobre a nobreza. O período de 1047 e 1054 viu guerra quase contínua, com crises menores continuando até 1060.",
    ] },
  { "title" = "Preocupação inglesa e continental", "paragraphs" = [
      "Em 1051 o rei sem filhos Eduardo da Inglaterra parece ter escolhido Guilherme como seu sucessor ao trono inglês. O duque era neto do tio materno do rei, Ricardo II, o Bom. A Crônica Anglo-Saxônica, na versão \"D\", afirma que o governante normando visitou a Inglaterra no final de 1051, talvez para garantir a confirmação da sucessão, ou talvez Guilherme estava tentando conseguir ajuda para seus problemas na Normandia. A viagem é improvável dada a sua absorção na guerra com Anjou no momento. Quaisquer que fossem os desejos de Eduardo, era provável que qualquer reclamação de Guilherme seria contestada por Goduíno, o Conde de Wessex, um membro da família mais poderosa na Inglaterra. Eduardo havia se casado com Edite, filha de Goduíno, em 1043, e o conde de Wessex parece que foi um dos principais partidários da reivindicação do Confessor ao trono. Foi durante este exílio que Eduardo ofereceu o trono a Guilherme. Goduíno retornou do exílio em 1052 com as forças armadas, e um acordo foi alcançado entre o rei e o conde, restaurando-o junto com sua família às suas terras e substituindo Roberto de Jumièges, um normando a quem Eduardo tinha nomeado arcebispo da Cantuária, por Estigando, o bispo de Winchester. Nenhuma fonte inglesa menciona uma suposta embaixada do arcebispo Roberto ao duque da Normandia transmitindo a promessa de sucessão, e as duas fontes normandas que o mencionam, Guilherme de Jumièges e Guilherme de Poitiers, não são precisas em suas cronologias de quando essa visita ocorreu.",
      "O conde Herberto II do Maine morreu em 1062, e Guilherme, que havia prometido seu filho mais velho Roberto Curthose à sua irmã Margarida, reivindicou o condado através de seu filho. Nobres locais resistiram a reivindicação, mas o duque invadiu e em 1064 tinha o controle seguro da região. Guilherme nomeou um normando para o bispado de Le Mans em 1065. Também permitiu que seu filho Roberto Curthose fizesse homenagem ao novo conde de Anjou, Godofredo, o Barbudo. Sua fronteira ocidental foi, assim, garantida, mas sua divisa com a Bretanha manteve-se insegura. Em 1064 invadiu a Bretanha, em uma campanha que permanece obscura em seus detalhes. Seu efeito, porém, era desestabilizar a região, forçando o seu duque, Conan II, a se concentrar em problemas internos ao invés de expansão. A morte do duque em 1066 garantiu ainda mais as fronteiras de Guilherme na Normandia. Também se beneficiou de sua campanha na Bretanha, assegurando o apoio de alguns nobres bretões, que passaram a apoiar a invasão da Inglaterra em 1066.",
      "Na Inglaterra, o conde Goduíno morreu em 1053 e seus filhos estavam crescendo em poder: Haroldo sucedeu o condado de seu pai, e outro filho, Tostigo, tornou-se Conde de Nortúmbria. Posteriormente outros filhos também receberam condados: Girto como Conde da Ânglia Oriental em 1057 e Leofivino como Conde de Kent em algum momento entre 1055 e 1057. Algumas fontes afirmam que Haroldo tomou parte na campanha bretã de Guilherme em 1064 e que jurou defender a afirmação do duque ao trono inglês no final da campanha, mas não há relatórios de origem inglesa desta viagem, e não está claro se isso realmente ocorreu. Pode ter sido propaganda normanda concebida para desacreditar Haroldo, que tinha emergido como o principal candidato a suceder o rei Eduardo. Enquanto isso, outro concorrente ao trono tinha emergido — Eduardo, o Exilado, filho de Edmundo, Braço de Ferro e um neto de Etelredo II, voltou à Inglaterra em 1057 e, embora morreu pouco depois de seu retorno, trouxe consigo sua família, que incluía duas filhas, Margarida e Cristina, e um filho, Edgar, o Atelingo.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Uma consequência imediata após a morte do rei foi a guerra entre seus filhos Roberto e Guilherme, o Ruivo sobre o controle da Inglaterra e Normandia. Mesmo após a morte de Guilherme, o Ruivo em 1100 e a sucessão de seu irmão mais novo Henrique I como rei, a Normandia e Inglaterra permaneceram controvertidas entre os irmãos, até a captura de Roberto por Henrique na batalha de Tinchebray em 1106. As dificuldades na sucessão levaram a uma perda de autoridade no ducado francês, já que a aristocracia recuperou muito do poder que fora perdido para o Conquistador. Seus filhos também perderam muito de seu controle sobre o Maine, que se revoltou em 1089 e conseguiu manter-se na maior parte livre de influência normanda posteriormente.",
      "O impacto da conquista de Guilherme na Inglaterra foi profundo; mudanças na igreja, aristocracia, cultura e na língua do país têm persistido até os tempos modernos. A conquista trouxe ao reino um contato mais próximo com a França e forjou laços entre ambas as nações, que duraram toda a Idade Média. Outra consequência da invasão de Guilherme foi o rompimento dos laços anteriormente estreitos entre a Inglaterra e Escandinávia. Seu governo misturou elementos dos sistemas inglês e normando em um novo, que posteriormente lançou as bases do reino medieval inglês. Quão bruscas e quão grande alcance as mudanças tiveram ainda é uma questão de debate entre os historiadores, com alguns, como Richard Southern alegando que a conquista foi a mudança mais radical na história da Europa entre a queda de Roma e o século XX. Outros, como H. G. Richardson e G. O. Sayles, veem as mudanças trazidas pela conquista como muito menos radicais do que Southern sugere. A historiadora Eleanor Searle descreveu a invasão de Guilherme como \"um plano que nenhum governante, exceto um escandinavo, teria considerado\".",
      "Seu reinado causou polêmica histórica desde antes de sua morte. Guilherme de Poitiers escreveu elogiosamente sobre o reinado do Conquistador e seus benefícios, mas o obituário de Guilherme na Crônica Anglo-Saxônica o condena usando termos duros. Nos anos desde a conquista, políticos e outros líderes têm usado o monarca e os acontecimentos de seu reinado para ilustrar eventos políticos ao longo da história inglesa. Durante o reinado da rainha Isabel I de Inglaterra, o arcebispo Matthew Parker viu a conquista como tendo corrompido a pura Igreja Inglesa, que ele tentou restaurar. Durante os séculos XVII e XVIII alguns historiadores e juristas viram seu reinado impondo um \"jugo normando\" sobre os nativos anglo-saxões, um argumento que continuou durante o século XIX com elaborações adicionais ao longo de linhas nacionalistas. Estas várias controvérsias levaram o Conquistador a ser visto por alguns historiadores tanto como um dos criadores da grandeza da Inglaterra quanto por infligir uma das maiores derrotas na história do país. Outros têm visto Guilherme como um inimigo da constituição inglesa, ou, alternativamente, como seu criador.",
    ] },
]

