[articles.en]
text = "Gaius Julius Caesar was a Roman general, statesman, and author who was the dictator of the Roman Republic almost continuously from 49 BC until his assassination in 44 BC. A member of the First Triumvirate, he led the Roman armies through the Gallic Wars and defeated his political rival Pompey in Caesar's civil war."
title = "Julius Caesar"
lang = "en"
url = "https://en.wikipedia.org/wiki/Julius_Caesar"
intro = [
  "Gaius Julius Caesar (12 or 13 July 100 BC – 15 March 44 BC) was a Roman general, statesman, and author who was the dictator of the Roman Republic almost continuously from 49 BC until his assassination in 44 BC. A member of the First Triumvirate, he led the Roman armies through the Gallic Wars and defeated his political rival Pompey in Caesar's civil war. He consolidated power and was titled as dictator perpetuo in 44 BC, helping create the political conditions that led to the collapse of the Roman Republic and the emergence of the Roman Empire. For his role in these events, he is regarded as one of history's most influential figures.",
  "In 60 BC, Caesar, Crassus, and Pompey formed the First Triumvirate, an informal political alliance that dominated Roman politics for several years. Their attempts to amass political power were opposed by many in the Senate, including Cato the Younger with the private support of Cicero. Caesar rose to become one of the most powerful politicians in the Roman Republic through a string of military victories in the Gallic Wars, completed by 51 BC, which greatly expanded Roman territory. During this time, he invaded Britain and built a bridge across the Rhine. These achievements, along with the loyalty of his veteran army, threatened to eclipse the standing of Pompey. The alliance between Caesar and Pompey slowly broke down and, by 50 BC, Pompey had realigned himself with the Senate. With his command expiring and the Gallic Wars largely concluded, the Senate ordered Caesar to relinquish his military command and return to Rome. In early January 49 BC, Caesar openly defied the Senate by crossing the Rubicon and marching towards Rome at the head of an army. This act began Caesar's civil war, which he won, leaving him in a position of near-unchallenged power and influence in 45 BC.",
  "After assuming control of government and pardoning many of his enemies, Caesar carried out various reforms and public works. He created the Julian calendar to replace the republican lunisolar calendar, reduced the size of the grain dole, settled his veterans in new overseas colonies, greatly increased the size of the Senate, and extended citizenship to communities in Spain and what is now northern Italy. In early 44 BC, he was proclaimed \"dictator in perpetuity\". Fearful of his power, his domination of the state, and the possibility that he might make himself king, a group of senators led by Brutus and Cassius assassinated Caesar on the Ides of March (15 March) 44 BC. A new series of civil wars broke out and the constitutional government of the Republic was never fully restored. Caesar's great-nephew and adoptive heir Octavian, later known as Augustus, rose to sole power after defeating his opponents thirteen years later. Octavian then set about consolidating his power, transforming the Republic into the Roman Empire as its first emperor.",
  "Caesar was an accomplished author and commentator; much of his life is known through his own accounts of his military campaigns. Other contemporary sources include the letters and speeches of Cicero and the historical writings of Sallust. Later biographies of Caesar by Suetonius and Plutarch are also important sources. Caesar is considered by many historians to be one of the greatest military commanders in history. His cognomen subsequently became a synonym for emperor; the title Caesar was used throughout the Roman Empire, and gave rise to modern derivatives such as Kaiser and Tsar. He has frequently appeared in literary and artistic works.",
]
sections = [
  { "title" = "Early life and career", "paragraphs" = [
      "Gaius Julius Caesar was born into a patrician family, the gens Julia, on 12 or 13 July 100 BC. The family claimed to have immigrated to Rome from Alba Longa during the seventh century BC after the third king of Rome, Tullus Hostilius, took and destroyed their city. The family also claimed descent from Julus, the son of Aeneas and founder of Alba Longa. Given that Aeneas was a son of Venus, this made the clan divine. This genealogy had not yet taken its final form by the first century, but the clan's claimed descent from Venus was well established in public consciousness. There is no evidence that Caesar himself was born by Caesarian section; such operations entailed the death of the mother, but Caesar's mother lived for decades after his birth and no ancient sources record any difficulty with the birth.",
      "Despite their ancient pedigree, the Julii Caesares were not especially politically influential during the middle republic. The first person known to have had the cognomen Caesar was a praetor in 208 BC during the Second Punic War. The family's first consul was in 157 BC, though their political fortunes had recovered in the early first century, producing two consuls in 91 and 90 BC. Caesar's homonymous father was moderately successful politically. He married Aurelia, a member of the politically influential Aurelii Cottae, producing – along with Caesar – two daughters. Buoyed by his own marriage and the marriage of his sister to the extremely influential Gaius Marius, he also served on the Saturninian land commission in 103 BC and was elected praetor some time between 92 and 85 BC; he served as proconsular governor of Asia for two years, likely 91–90 BC.",
      "Caesar's father did not seek a consulship during the domination of Lucius Cornelius Cinna and instead chose retirement. During Cinna's dominance, Caesar was named as flamen Dialis (a priest of Jupiter) which led to his marriage to Cinna's daughter, Cornelia. The religious taboos of the priesthood would have forced Caesar to forgo a political career; the appointment – one of the highest non-political honours – indicates that there were few expectations of a major career for Caesar. In early 84 BC, Caesar's father died suddenly. After Sulla's victory in the civil war (82 BC), Cinna's acta were annulled. Sulla consequently ordered Caesar to abdicate and divorce Cinna's daughter. Caesar refused, implicitly questioning the legitimacy of Sulla's annulment. Sulla may have put Caesar on the proscription lists, though scholars are mixed. Caesar then went into hiding before his relatives and contacts among the Vestal Virgins were able to intercede on his behalf. They then reached a compromise where Caesar would resign his priesthood but keep his wife and chattels; Sulla's alleged remark he saw \"in [Caesar] many Mariuses\" is apocryphal.",
    ] },
  { "title" = "First consulship and the Gallic Wars", "paragraphs" = [
      "Caesar stood for the consulship of 59 BC along with two other candidates. His political position at the time was strong: he had supporters among the families which had supported Marius or Cinna; his connection with the Sullan aristocracy was good; his support of Pompey had won him support in turn. His support for reconciliation in continuing aftershocks of the civil war was popular in all parts of society. With the support of Crassus, who supported Caesar's joint ticket with one Lucius Lucceius, Caesar won. Lucceius, however, did not and the voters returned Marcus Calpurnius Bibulus instead, one of Caesar's long-standing personal and political enemies.",
      "After the elections, Caesar reconciled Pompey and Crassus, two political foes, in a three-way alliance misleadingly termed the \"First Triumvirate\" in modern times. Caesar was still at work in December of 60 BC attempting to find allies for his consulship and the alliance was finalised only some time around its start. Pompey and Crassus joined in pursuit of two respective goals: the ratification of Pompey's eastern settlement and the bailing out of tax farmers in Asia, many of whom were Crassus' clients. All three sought the extended patronage of land grants, with Pompey especially seeking the promised land grants for his veterans.",
      "Caesar's first act was to publish the minutes of the Senate and the assemblies, signalling the Senate's accountability to the public. He then brought in the Senate a bill – crafted to avoid objections to previous land reform proposals and any indications of radicalism – to purchase property from willing sellers to distribute to Pompey's veterans and the urban poor. It would be administered by a board of twenty (with Caesar excluded), and financed by Pompey's plunder and territorial gains. Referring it to the Senate in hope that it would take up the matter to show its beneficence for the people, there was little opposition and the obstructionism that occurred was largely unprincipled, firmly opposing it not on grounds of public interest but rather opposition to Caesar's political advancement. Unable to overcome Cato's filibustering, he moved the bill before the people and, at a public meeting, Caesar's co-consul Bibulus threatened a permanent veto for the entire year. This clearly violated the people's well-established legislative sovereignty and triggered a riot in which Bibulus' fasces were broken, symbolising popular rejection of his magistracy. The bill was then voted through. Bibulus attempted to induce the Senate to nullify it on grounds it was passed by violence and contrary to the auspices but the Senate refused.",
    ] },
  { "title" = "Civil war", "paragraphs" = [
      "From the period 52 to 49 BC, trust between Caesar and Pompey disintegrated. In 51 BC, the consul Marcellus proposed recalling Caesar, arguing that his provincia (here meaning \"task\") in Gaul – due to his victory against Vercingetorix in 52 – was complete; it evidently was incomplete as Caesar was that year fighting the Bellovaci and regardless the proposal was vetoed. That year, it seemed that the conservatives around Cato in the Senate would seek to enlist Pompey to force Caesar to return from Gaul without honours or a second consulship. Cato, Bibulus, and their allies, however, were successful in winning Pompey over to take a hard line against Caesar's continued command.",
      "As 50 BC progressed, fears of civil war grew; both Caesar and his opponents started building up troops in southern Gaul and northern Italy, respectively. In the autumn, Cicero and others sought disarmament by both Caesar and Pompey, and on 1 December 50 BC this was formally proposed in the Senate. It received overwhelming support – 370 to 22 – but was not passed when one of the consuls dissolved the meeting. That year, when a rumour came to Rome that Caesar was marching into Italy, both consuls instructed Pompey to defend Italy, a charge he accepted as a last resort. At the start of 49 BC, Caesar's renewed offer that he and Pompey disarm was read to the Senate and was rejected by the hardliners. A later compromise given privately to Pompey was also rejected at their insistence. On 7 January, his supportive tribunes were driven from Rome; the Senate then declared Caesar an enemy and it issued its senatus consultum ultimum.",
      "There is scholarly disagreement as to the specific reasons why Caesar marched on Rome. A very popular theory is that Caesar was forced to choose – when denied the immunity of his proconsular tenure – between prosecution, conviction, and exile, or civil war in defence of his position. Whether Caesar actually would have been prosecuted and convicted is debated. Some scholars believe the possibility of successful prosecution was extremely unlikely. Caesar's main objectives were to secure a second consulship – first mooted in 52 as colleague to Pompey's sole consulship – and a triumph. He feared that his opponents – then holding both consulships for 50 BC – would reject his candidacy or refuse to ratify an election he won. This also was the core of his war justification: that Pompey and his allies were planning, by force if necessary (indicated in the expulsion of the tribunes), to suppress the liberty of the Roman people to elect Caesar and honour his accomplishments.",
    ] },
  { "title" = "Dictatorship and assassination", "paragraphs" = [
      "Prior to Caesar's assumption of the title dictator perpetuo in February 44 BC, he had been appointed dictator some four times since his first dictatorship in 49 BC. After occupying Rome, he engineered this first appointment, largely to hold elections; after 11 days he resigned. The other dictatorships lasted for longer periods, up to a year, and by April 46 BC he was given a new dictatorship annually. The task he was assigned revived that of Sulla's dictatorship: rei publicae constituendae. These appointments, however, were not the source of legal power themselves; in the eyes of the literary sources, they were instead honours and titles which reflected Caesar's dominant position in the state, secured not by extraordinary magistracy or legal powers, but by personal status as victor over other Romans.",
      "Through the period after Pharsalus, the Senate showered Caesar with honours, including the title praefectus moribus (lit. 'prefect of morals') which historically was associated with the censorial power to revise the Senate rolls. He was also granted power over war and peace, usurping a power traditionally held by the comitia centuriata. These powers attached to Caesar personally. Similarly extraordinary were a number of symbolic honours which saw Caesar's portrait placed on coins in Rome – the first for a living Roman – with special rights to wear royal dress, sit atop a golden chair in the Senate, and have his statues erected in public temples. The Roman calendar month Quintilis, in which he was born, was renamed Julius (now July). These were symbols of divine monarchy and, later, objects of resentment.",
      "The decisions on the normal operation of the state – justice, legislation, administration, and public works – were concentrated into Caesar's person without regard for or even notice given to the traditional institutions of the republic. Caesar's domination over public affairs and his competitive instinct to preclude all others alienated the political class and led eventually to the conspiracy against his life.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The texts written by Caesar, an autobiography of the most important events of his public life, are the most complete primary source for the reconstruction of his biography. However, Caesar wrote those texts with his political career in mind. Julius Caesar is also considered one of the first historical figures to fold his message scrolls into a concertina form, which made them easier to read. The Roman emperor Augustus began a cult of personality of Caesar, which described Augustus as Caesar's political heir. The modern historiography is influenced by this tradition.",
      "Many rulers in history became interested in the historiography of Caesar. Napoleon III wrote the scholarly work Histoire de Jules César, which was not finished. The second volume listed previous rulers interested in the topic. Charles VIII ordered a monk to prepare a translation of the Gallic Wars in 1480. Charles V ordered a topographic study in France, to place the Gallic Wars in context; which created forty high-quality maps of the conflict. The contemporary Ottoman sultan Suleiman the Magnificent catalogued the surviving editions of the Commentaries, and translated them to Turkish language. The French kings Henry IV and Louis XIII translated the first two commentaries and the last two respectively; Louis XIV re-translated the first one afterwards.",
      "The remains of Caesar's altar are a pilgrimage site for visitors from across Italy and the world. Flowers and other items are left there daily and special commemorations take place on 15 March to commemorate Caesar's death.",
    ] },
]

[articles.es]
text = "Cayo o Gayo Julio César (en latín: Gaius Iulius Caesar;​ 12 o 13 de julio de 100 a. C.-15 de marzo de 44 a."
title = "Julio César"
lang = "es"
url = "https://es.wikipedia.org/wiki/Julio_C%C3%A9sar"
intro = [
  "Cayo o Gayo Julio César (en latín: Gaius Iulius Caesar;​ 12 o 13 de julio de 100 a. C.-15 de marzo de 44 a. C.) fue un político y militar romano del siglo I a. C., miembro de los patricios Julios Césares, que alcanzó las más altas magistraturas del Estado romano y dominó la política de la República tras vencer en la guerra civil que le enfrentó al sector más conservador del Senado. César desempeñó un papel fundamental en los acontecimientos que condujeron a la caída de la República romana y al surgimiento del Imperio romano, y como tal es una de las figuras principales de la Antigüedad clásica.",
  "Nacido en el seno de la gens Julia, una familia patricia de escasa fortuna, estuvo emparentado con algunos de los hombres más influyentes de su época, como su tío Cayo Mario, quien influiría de manera determinante en su carrera política. En 84 a. C., a los dieciséis años, el popular Lucio Cornelio Cinna lo nombró flamen Dialis, cargo religioso del que fue relevado por Sila, con quien tuvo conflictos a causa de su matrimonio con la hija de Cinna. Tras escapar de morir a manos de los sicarios del dictador Sila, fue perdonado gracias a la intercesión de los parientes de su madre. Trasladado a la provincia de Asia, combatió en Mitilene como legado de Marco Minucio Termo. Volvió a Roma a la muerte de Sila en 78 a. C., y ejerció por un tiempo la abogacía. En 73 a. C. sucedió a Cayo Aurelio Cota como pontífice, y pronto entró en relación con los cónsules Pompeyo y Craso, cuya amistad le permitiría lanzar su propia carrera política.​ En 70 a. C. César sirvió como cuestor en la provincia de la Hispania Ulterior y como edil curul en Roma. Durante el desempeño de esa magistratura ofreció unos espectáculos que fueron recordados durante mucho tiempo por el pueblo.",
  "En 63 a. C. fue elegido pretor urbano al obtener más votos que el resto de candidatos. Ese mismo año murió Quinto Cecilio Metelo Pío, pontifex maximus designado durante la dictadura de Sila, y, en las elecciones celebradas para sustituirle, venció César. Al término de su pretura sirvió como propretor en Hispania, donde capitaneó una breve campaña militar contra los lusitanos. En 59 a. C. fue elegido cónsul gracias al apoyo de sus dos aliados políticos, Pompeyo y Craso, los hombres con los que César formó el llamado Primer Triunvirato, una alianza política informal que dominó la política romana por varios años. Su colega durante el consulado, Marco Calpurnio Bíbulo, se retiró para así entorpecer la labor de César que, sin embargo, logró sacar adelante una serie de medidas legales, entre las que destaca una ley agraria que regulaba el reparto de tierras entre los soldados veteranos.",
  "Tras su consulado fue designado procónsul de las provincias de la Galia Transalpina, Iliria y la Galia Cisalpina, esta última tras la muerte de su gobernador, Céler. Su gobierno se caracterizó por una política muy agresiva con la que sometió a prácticamente la totalidad de los pueblos celtas en varias campañas. Este conflicto, conocido como la guerra de las Galias, finalizó cuando el general republicano venció en la batalla de Alesia a los últimos focos de oposición, encabezados por un jefe arverno llamado Vercingétorix. Sus conquistas extendieron el dominio romano sobre los territorios que hoy integran Francia, Bélgica, Países Bajos y parte de Alemania. Fue el primer general romano en penetrar en los inexplorados territorios de Britania y Germania.",
]
sections = [
  { "title" = "Familia", "paragraphs" = [
      "Julio César fue miembro de los Julios Césares, una familia patricia de la gens Julia que aparece por primera vez en los registros históricos a finales del siglo III a. C., durante la segunda guerra púnica.​ Sin embargo, no es hasta la República tardía, cuando se habían dividido en dos ramas —adscritas en tribus diferentes—,​ que los Julios Césares se sitúan entre las familias aristocráticas principales.​",
      "Su padre, homónimo suyo, fue un senador de rango pretorio que se apartó de la política tras un gobierno provincial en Asia.​ Su madre fue Aurelia, miembro de los Aurelios Cotas, una destacada familia de la nobleza plebeya.​ Varios miembros de esta familia alcanzaron el consulado a finales del siglo II a. C. y principios del siguiente, lo que supondría una notable ayuda para la progresión política del futuro dictador.​ Más decisiva sería la relación con Cayo Mario, quien contrajo matrimonio con Julia, la tía paterna de Julio César.​ Mario y sus seguidores (el partido mariano) dominaron la política romana a finales del siglo II a. C. y fue esta relación la que aprovechó Julio César en sus inicios políticos.​",
      "Además de su tía Julia, el cónsul del año 91 a. C., Sexto Julio César, pudo haber sido también hermano de su padre.​ Sus dos hermanas, de las que apenas se sabe nada, se casaron con acaudalados miembros de la aristocracia itálica:​ la mayor con un miembro de la gens Pedia;​ la menor con Marco Acio Balbo, emparentado con los Pompeyos.​ De otro matrimonio de la mayor de sus hermanas descendía Lucio Pinario Escarpo.​",
    ] },
  { "title" = "Nacimiento", "paragraphs" = [
      "Julio César nació en Roma​ el 12 o 13 de julio del año 100 a. C. Siguiendo las fuentes clásicas,​ la mayoría de estudiosos modernos coinciden en el año,​ excepto Theodor Mommsen (102 a. C.) y Jérôme Carcopino (101 a. C.), que se basaron en presupuestos de las leges annales.​ En cuanto al día, mientras unos autores sostienen el 13,​ otros prefieren el 12​ y aún otros no se decantan por ninguno.​ Las dudas proceden de una cita de Casio Dion en la que dice que Julio César nació el día 13, pero se cambió al 12 por una ley triunviral.​ Este cambio se debió a que el 13 de julio se celebraban unos juegos en honor de Apolo y, según un oráculo, ningún otro festival en honor a una divinidad podía tener lugar el mismo día.​ El resto de fuentes clásicas refieren el 12 de julio como fecha de nacimiento.​",
    ] },
  { "title" = "Primeros años", "paragraphs" = [
      "Julio César entra en la historia en el año 84 a. C., cuando Cinna lo escogió para ser flamen Dialis y lo casó con su hija Cornelia tras romper el compromiso previo del joven con Cosucia.​ Por entonces Cinna controlaba la República. Sin embargo, la guerra civil que siguió a la muerte de este terminó con el triunfo de Sila y la anulación de todo su programa.​ Julio César recibió la orden de divorciarse de Cornelia. Su negativa impulsó a Sila a proscribirlo y obligó a aquel a huir de Roma.​ Fue la intervención de sus parientes y el respaldo de las vírgenes vestales, lo que permitió que el joven César evitara el destino de otros proscritos, acordando que mantendría su matrimonio y renunciaría al sacerdocio.​ Según Suetonio y Plutarco, en aquella ocasión Sila dijo que había en el joven muchos Marios.​",
      "Al percatarse de que el perdón de Sila podía ser revocado en cualquier momento, César juzgó que lo más seguro era alejarse de Roma durante un tiempo y decidió viajar a Oriente para participar en la guerra contra Mitrídates VI del Ponto bajo las órdenes del propretor, Marco Minucio Termo. Durante el sitio de Mitilene en 81 a. C., se le ordenó ir a Bitinia para solicitar a Nicomedes IV la cesión de una pequeña flota con la que asaltar la ciudad rebelde. Al parecer, el rey asiático quedó tan deslumbrado con la belleza del joven mensajero romano que lo invitó a descansar en su habitación y a participar en un festín donde sirvió de copero real durante el banquete. La aventura de César en Asia llegó muy pronto a oídos de los ciudadanos de Roma. En la política romana, acusar a alguien de mantener relaciones homosexuales pasivas era una estrategia común,​ pues la homosexualidad pasiva, a diferencia de la activa, era considerada una práctica vergonzosa. Sus enemigos políticos proclamaron que se había prostituido con un rey bárbaro y le apodaron «la reina de Bitinia», causando así un gran daño a su reputación. Sin embargo, César siempre desmintió este hecho. El resto de la campaña le valió una mejor reputación, porque mostró una gran capacidad de mando y un arrojo y valor personal encomiables, por los que Minucio Termo, tras la toma de Mitilene, le concedería la corona cívica, la condecoración al valor más alta que se otorgaba en la República Romana.​",
      "Después de la muerte de Sila en el 78 a. C., César regresó a Roma e inició una carrera como abogado en el Foro romano, con la que se dio a conocer por su cuidada oratoria. Su primer caso fue dirigido contra Cneo Cornelio Dolabela, un protegido de Sila que en el año 81 a. C. había sido elegido cónsul y después, al año siguiente, procónsul en Macedonia, y donde al parecer había malversado los fondos del Estado. Dolabela, al enterarse del proceso en su contra, contrató para su defensa a uno de los más ilustres abogados de la época, Quinto Hortensio (llamado «El Bailarín» por su manera de moverse en los estrados), y al eminente Lucio Aurelio Cota —el propio tío de César, pero esto era normal—. A pesar de estos formidables enemigos, César mostró su calidad de orador, que, aunque no le sirvió para ganar la causa, sí le procuró la fama que buscaba.​",
    ] },
  { "title" = "Ascenso político", "paragraphs" = [
      "César fue elegido cuestor por los comicios en el 69 a. C., con treinta años de edad, como estipulaba el cursus honorum romano. En el sorteo subsiguiente, le correspondió un cargo en la provincia romana de Hispania Ulterior, situada en lo que es hoy día Portugal y el sur de España. Según cuenta una leyenda local, en el Templo de Hércules Gaditano (Herakleión) de la ciudad de Gades, situado en lo que actualmente es el Islote de Sancti Petri, Julio César tuvo un sueño que le predecía el dominio del mundo después de haber llorado ante el busto de Alejandro Magno por haber cumplido su edad sin haber alcanzado un éxito importante.​​ Allí, como cuestor, conoció a Lucio Cornelio Balbo el Mayor, el cual posteriormente se convirtió en consejero y amigo del futuro dictador y propretor de la Hispania Ulterior en el año 61 a. C. Gades proporcionó un gran apoyo a la flota romana en su campaña de Lusitania, donde Balbo ya era praefectus fabrum, esto es, una especie de jefe de ingenieros, perteneciente a la plana mayor de las legiones.",
      "De vuelta en Roma, César prosiguió su carrera como abogado hasta ser elegido edil curul en el año 65 a. C., el primer cargo del cursus honorum que se ejercía dentro de Roma. Las funciones de un edil pueden ser equiparadas, en cierto modo, a las de un moderno presidente de una junta municipal, e incluían la regulación de las construcciones, del tránsito, del comercio y otros aspectos de la vida diaria, entre otras las funciones de jefe de policía. Pero el cargo, el primer peldaño público para llegar a la magistratura suprema del consulado, podía ser también el último que se desempeñara, pues incluía la organización de los juegos en el Circo Máximo, lo que, debido a lo limitado del presupuesto público, exigía al edil la utilización de fondos personales. Esto fue especialmente verdad en el caso de César, que pretendía realizar unos juegos memorables para impulsar su carrera política. Y, de hecho, empleó todo su ingenio para conseguirlo, llegando a desviar el curso del Tíber e inundar el Circo para ofrecer una naumaquia (un combate entre barcos). Acabó el año con deudas del orden de varios cientos de talentos de oro.​",
      "Sin embargo, su éxito como edil fue una ayuda importante para que, después de la muerte de Quinto Cecilio Metelo Pío en el año 63 a. C., César fuera elegido Pontifex Maximus​ dignidad que dotaba al electo de enorme auctoritas y dignitas. El día de su elección había sospechas de un atentado contra él, lo que obligó a Julio César a decir a su madre:",
    ] },
]

[articles.fr]
text = "Jules César (en latin : Caius Iulius Caesar à sa naissance, Imperator Iulius Caesar Divus après sa mort), aussi simplement appelé César, est un conquérant, homme d'État et écrivain romain, né le 12 ou le 13 juillet 100 av. J.-C."
title = "Jules César"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Jules_C%C3%A9sar"
intro = [
  "Jules César (en latin : Caius Iulius Caesar à sa naissance, Imperator Iulius Caesar Divus après sa mort), aussi simplement appelé César, est un conquérant, homme d'État et écrivain romain, né le 12 ou le 13 juillet 100 av. J.-C. à Rome et mort assassiné le 15 mars 44 av. J.-C. (aux ides de mars) dans la même ville.",
  "Son parcours unique, au cœur du dernier siècle de la République romaine — bouleversée par les tensions sociales et les guerres civiles —, marque le monde romain. Ambitieux, il s'appuie sur le courant réformateur et démagogue (populares) pour favoriser son ascension politique. Stratège et tacticien, il repousse, à l'aide de ses armées, les frontières de la République romaine jusqu'au Rhin et à l'océan Atlantique lors de la guerre des Gaules. Il utilise ensuite ses légions pour s’emparer du pouvoir au cours de la guerre civile l’opposant à Pompée, son ancien allié, puis aux républicains.",
  "Acclamé comme un imperator favorisé des dieux, seul maître à Rome après une suite de victoires foudroyantes sur ses adversaires, il entreprend de réformer l’État et satisfait les revendications de la mouvance des populares. Pour ce faire, il concentre progressivement de nombreux pouvoirs exceptionnels, adossés à une politique de culte de la personnalité inédite reposant sur ses ascendances divines et sa fortune personnelle.",
  "Adoré du peuple, pour qui il fait montre de largesses frumentaires, économiques et foncières, il se fait nommer dictateur, d'abord pour dix ans avec des pouvoirs constitutionnels, puis à vie. Soupçonné de vouloir instaurer par ces mesures une nouvelle monarchie à Rome, il est assassiné peu après par une conspiration de sénateurs dirigée par Brutus et Cassius. Jules César est néanmoins divinisé.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "L'appellation Caius Julius Caesar « IV » est une convention des historiens modernes ; elle est liée à l'habitude, dans les familles patriciennes romaines (les gentes), de donner les mêmes prénom (praenomen), nom de gens (nomen) et surnom ou nom de famille (cognomen) aux descendants en ligne directe d'un même pater famillias, lesquels se trouvent donc avoir tous le même nom romain complet sur plusieurs générations d'héritiers, ce qui peut être source de confusion.",
      "Dans le cas de la suite des différents « Caius Julius Caesar », l'identité des numéros III (le père de Jules César), et II (son grand-père), ne fait pas de doute, ils sont notamment mentionnés par Suétone et Pline l'Ancien et cités dans les Fastes d'Antium. Pour Wilhelm Drumann le numéro I est son arrière-grand-père, qu'il identifie à un historien mentionné par Tite-Live, mais les indices sont ténus. On connaît un autre Caius Julius Caesar dans l'ascendance de Jules César : Caius Julius Caesar Strabo Vopiscus, peut-être son arrière-arrière-grand-oncle. Jules César est le fils de Caius Julius Caesar III et d’Aurelia Cotta, femme exemplaire et de grande vertu, selon Tacite et Plutarque, également d’origine patricienne puisque issue de la gens Aurelia (trois de ses frères furent consuls). L'essentiel de la recherche contemporaine s'accorde au XXIe siècle sur la naissance généralement rapportée par les sources antiques, qui la posent à la date du 12 juillet 100 av. J.-C..",
      "Jules César est issu d'une gens patricienne, les Jules ou Iules (Iulii), qui fait remonter ses origines aux temps les plus anciens de l'histoire de Rome. Les Iulii revendiquent des origines mythiques qui la font descendre de Vénus et de son fils Énée, dans une histoire dont la trame semblent déjà établie vers 200 av. J.-C. : le fils d’Énée et de Créuse, Ascagne — qui a gagné le nom de Iulus au combat — fonde et règne sur Albe la Longue, où se sont établies les familles rescapées de la Guerre de Troie ; lorsque Albe est détruite par le roi romain Tullus Hostilius, ce dernier transfère les familles « troyennes » à Rome où elles sont intégrées au cercle restreint des familles patriciennes. César évoque à plusieurs reprises ce lignage divin, notamment à l'occasion des funérailles de sa tante Julia Caesaris, veuve de Marius, et consacre un temple à Venus Genitrix sur le forum Julii.",
    ] },
  { "title" = "Jules César écrivain", "paragraphs" = [
      "Outre sa carrière politique et militaire, Jules César est un passionné de lettres, de grammaire, de rhétorique et de poésie, conformément à l'éducation lettrée particulièrement poussée qu'il a reçue. La plupart des indications proviennent de Suétone. La plupart de ses ouvrages ont été perdus comme la grande majorité de la littérature antique.",
      "Des divers écrits qu'il a composés, il ne reste ainsi que le corpus de ses Commentaires (Commentarii rerum gestarum) :",
      "De Bello Gallico, Commentaires sur la Guerre des Gaules, relatant la campagne de César en Gaule.",
    ] },
  { "title" = "Héritage de César", "paragraphs" = [
      "Jules César, devenu dictateur, doit adapter les institutions à l'extension de la puissance romaine qui résulte des conquêtes en Orient et en Gaule, et offrir des charges à ses partisans :",
      "augmentation du nombre de magistrats : les questeurs passent de 20 à 40, les préteurs de 8 à 16, les édiles sont désormais 6. Les consuls sont toujours deux, mais la nomination de consuls suffects en complément des deux consuls éponymes permet de disposer de plus de candidats pour les fonctions proconsulaires.",
      "César procède à la nomination directe de la moitié des magistrats, et recommande les candidats aux élections pour l'autre moitié.",
    ] },
  { "title" = "Étymologie du nom « César »", "paragraphs" = [
      "L'étymologie du cognomen « Caesar », porté durant plusieurs générations, demeure inconnue.",
      "Pline l'Ancien avance que le surnom de Caesar pourrait venir du fait qu'un de ses ancêtres soit né par césarienne (caesar, aris : enfant né par incision). Le grammairien Servius reprend cette explication mais affirme ailleurs que César lui-même est bien né ainsi. Cependant, les césariennes n'existent durant l'Antiquité que sur une femme morte ou sur le point de mourir et la mère de César, Aurelia Cotta, survit longtemps après la naissance de son fils illustre. Selon l'historien Jean-Paul Pundel, il n'existe aucun argument sérieux qui puisse accréditer la thèse de la naissance de Jules César par une césarienne.",
      "Une tradition populaire postule que c’est à la suite d’un exploit accompli pendant la première guerre punique par un représentant de la gens Julia, qui a vaincu au cours d’un combat un éléphant de l’armée carthaginoise, en lui tranchant les jarrets, qu’on l’aurait honoré du surnom de Caesor, « trancheur ». Puis le terme punique késar, « éléphant », donna caesar, et le sobriquet serait devenu héréditaire. La découverte de monnaies émises au début de la guerre civile, représentant un éléphant piétinant un serpent (ou un carnyx) au-dessus du nom « Caesar », semble étayer cette thèse. Cet ancêtre glorieux serait à placer aux environs de 250 av. J.-C. Mais le premier à porter ce cognomen dont l'histoire a gardé la trace est Sextus Julius Caesar qui a été préteur en 208 av. J.-C. et qui a eu un poste de commandement indéterminé à la bataille de Cannes en 216 av. J.-C..",
    ] },
]

[articles.it]
text = "Gaio Giulio Cesare (in latino Gaius Iulius Caesar, pronuncia restaurata o classica; AFI: [ˈɡäː.i.ʊs ˈjuː.li.ʊs ˈkɐ̯ɛ̯.sär]; nelle epigrafi C·IVLIVS·C·F·CAESAR e DIVVS IVLIVS; in greco antico Γάϊος Ἰούλιος Καῖσαρ?, Gáïos Iúlios Kaîsar; Roma, 13 luglio 100 a.C. – Roma, 15 marzo 44 a.C.) è stato un politico, militare, scrittore e oratore romano, considerato una delle figure più importanti e influenti della storia nonché uno dei migliori generali di tutti i tempi."
title = "Gaio Giulio Cesare"
lang = "it"
url = "https://it.wikipedia.org/wiki/Gaio_Giulio_Cesare"
intro = [
  "Gaio Giulio Cesare (in latino Gaius Iulius Caesar, pronuncia restaurata o classica; AFI: [ˈɡäː.i.ʊs ˈjuː.li.ʊs ˈkɐ̯ɛ̯.sär]; nelle epigrafi C·IVLIVS·C·F·CAESAR e DIVVS IVLIVS; in greco antico Γάϊος Ἰούλιος Καῖσαρ?, Gáïos Iúlios Kaîsar; Roma, 13 luglio 100 a.C. – Roma, 15 marzo 44 a.C.) è stato un politico, militare, scrittore e oratore romano, considerato una delle figure più importanti e influenti della storia nonché uno dei migliori generali di tutti i tempi.",
  "Ebbe un ruolo fondamentale nella transizione del sistema di governo dalla forma repubblicana a quella imperiale. Fu dictator di Roma alla fine del 49 a.C., nel 47 a.C., nel 46 a.C. con carica decennale e dal 44 a.C. come perpetuo, e per questo ritenuto da Gaio Svetonio Tranquillo il primo dei dodici Cesari, in seguito sinonimo di imperatore romano. Con la conquista della Gallia estese il dominio della Res Publica Romana fino al Mare del Nord e al Reno e portò gli eserciti romani a invadere per la prima volta la Britannia e la Germania, nonché a combattere in Spagna, Grecia, Egitto, Ponto (attuale Anatolia nord-orientale) e Africa.",
  "Il primo triumvirato, l'accordo privato per la spartizione del potere con Gneo Pompeo Magno e Marco Licinio Crasso Dive, segnò l'inizio della sua ascesa. In base all'accordo, Cesare sarebbe stato eletto console con l'appoggio politico di Pompeo e finanziario di Crasso; in cambio, una volta console, avrebbe ratificato i provvedimenti presi in Oriente da Pompeo, avrebbe concesso le terre ai suoi veterani, e avrebbe avviato delle riforme a favore del ceto equestre per Crasso. Con il rinnovo del triumvirato, a Lucca nel 56 a.C., fu riconfermato proconsole in Gallia Cisalpina (e Illirico settentrionale), Gallia Narbonense e Gallia Comata. Dopo la morte di Crasso, caduto contro i Parti (Carre, 53 a.C.), Cesare si scontrò con Pompeo e la fazione degli optimates per il controllo dello Stato. Nel 49 a.C., di ritorno dalla Gallia, guidò le sue legioni attraverso il Rubicone (sulla cui linea, nell'81 a.C., Lucio Cornelio Silla Fortunato aveva spostato il confine del pomerio della città) e scatenò una guerra civile (pronunciando le celebri parole «Alea iacta est»). Sconfisse Pompeo a Farsalo (48 a.C.) e successivamente gli altri optimates, tra cui Marco Porcio Catone poi detto Uticense, divenendo padrone indiscusso di Roma.",
  "Con l'assunzione della dittatura a vita diede inizio a un processo di radicale riforma della società e della politica romana, assicurandosi potere assoluto sulla Repubblica. Il suo operato provocò la reazione dei conservatori, finché un gruppo di senatori, capeggiati da Quinto Servilio Cepione Bruto, Gaio Cassio Longino e Decimo Giunio Bruto Albino, cospirò contro di lui, uccidendolo alle idi di marzo del 44 a.C. (15 marzo 44). Nel 42 a.C., appena due anni dopo il suo assassinio, il Senato lo deificò ufficialmente, elevandolo a divinità. L'eredità riformatrice e storica di Cesare fu quindi raccolta da Gaio Ottavio Turino, suo pronipote e figlio adottivo con il nome di Gaio Giulio Cesare Ottaviano.",
]
sections = [
  { "title" = "L'aspetto fisico", "paragraphs" = [
      "Una dettagliata descrizione dell'aspetto fisico di Cesare fu scritta all'interno del De vita Caesarum:",
    ] },
  { "title" = "Fonti e storiografia", "paragraphs" = [
      "Le principali fonti per la vita e il ruolo di Gaio Giulio Cesare sono rappresentate dalle biografie:",
      "Marco Tullio Cicerone (Orationes Philippicae, Orationes in Catilinam, Epistulae ad Atticum, Orationes: pro Marcello, pro Ligario, pro Deiotaro, De provinciis consularibus),",
      "Cesare stesso poi scrisse due opere storiografiche sulle proprie imprese, narrando di sé in terza persona: i Commentarii de bello gallico e i Commentarii de bello civili.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Cesare nacque il 13 luglio del 100 a.C. nella Suburra, un quartiere di Roma, da un'antica e nota famiglia patrizia, la gens Iulia, che, secondo il mito, annoverava tra gli antenati anche il primo e grande re romano, Romolo, e discendeva da Iulo (o Ascanio), figlio del principe troiano Enea, figlio a sua volta della dea Venere.",
      "Il ramo della gens Iulia che portava il cognomen \"Caesar\" discendeva, secondo il racconto di Plinio il Vecchio, da un uomo venuto alla luce in seguito a un parto cesareo (dal verbo latino 'tagliare', caedo, -ĕre, caesus sum, pron. 'kae-do, 'kae-sus sum). La Storia Augusta suggerisce invece altre tre possibili spiegazioni sull'origine del nome: che il primo Cesare avesse ucciso un elefante (caesai in berbero) in battaglia durante la prima guerra punica, che fosse nato con una folta capigliatura (dal latino caesaries), oppure con occhi di colore celeste particolarmente vivo (dal latino oculis caesiis).",
      "Nonostante le origini aristocratiche, la famiglia di Cesare non era ricca per gli standard della nobiltà romana, né particolarmente influente. Ciò rappresentò inizialmente un grande ostacolo alla sua carriera politica e militare, e Cesare dovette contrarre ingenti debiti per ottenere le sue prime cariche politiche. Inoltre, negli anni della giovinezza dello stesso Cesare, lo zio Gaio Mario si era attirato le antipatie della nobilitas repubblicana (anche se successivamente Cesare riuscì a riabilitarne il nome) e questo metteva anche lo stesso Cesare in cattiva luce agli occhi degli optimates.",
    ] },
  { "title" = "Cesare storico, scrittore, oratore", "paragraphs" = [
      "La sua opera di scrittore - racchiusa principalmente nei suoi commentari sulla guerra in Gallia (De bello Gallico) e sulla guerra civile contro Pompeo e il Senato (De bello civili) - pone Giulio Cesare tra i più grandi maestri di stile della prosa latina.",
      "Le narrazioni, apparentemente semplici e in stile diretto, sono di fatto un annuncio molto sofisticato del suo programma politico, in modo particolare per i lettori di media cultura e per la piccola aristocrazia sia d'Italia sia delle province.",
      "i commentari sulle campagne per sottomettere i Galli, fra il 58 e il 52 a.C. (Commentarii de bello Gallico). L'opera consta di sette libri, più un libro ottavo, composto probabilmente dal luogotenente di Cesare, Aulo Irzio, per completare il resoconto della campagna e coprire il lasso di tempo che separa la guerra di Gallia da quella civile: si tratta di un'opera dallo stile lineare ma piacevole, con interessanti riferimenti etnografici sulle popolazioni incontrate durante il viaggio. Cesare, per aumentare l'obiettività dell'opera, usa la terza persona, anche se si tratta chiaramente di un metodo per esaltare la sua figura personale e per metterla in rilievo nella narrazione e nelle vicende descritte. Le descrizioni sono comunque fredde e asettiche, prive di enfasi retorica e partecipazione emotiva: anche le scelte più terribili, come quelle di sterminare migliaia di persone, appaiono così non solo necessarie, ma addirittura prive di un'alternativa. Il De bello Gallico risulta così essere un'apologetica opera di propaganda della campagna di Gallia;",
    ] },
]

[articles.zh]
text = "盖乌斯·尤利乌斯·凯撒（拉丁語：Gaius Iulius Caesar；前100年7月12日或13日—前44年3月15日），羅馬共和國將軍、政治家與作家，自前49年至前44年幾乎持續擔任獨裁官，直至在龐貝劇場遇刺。他是前三头同盟成員之一，率領羅馬軍隊征服高盧，並在內戰中擊敗政治對手庞培。他隨後鞏固權力並於前44年自稱「終身獨裁官」，此舉加劇羅馬共和國晚期的危機，最終促成共和體制的崩潰與羅馬帝國的誕生。他被視為歷史上最具影響力的人物之一。 前60年，凱撒與克拉蘇、庞培組成前三头同盟，非正式地掌控羅馬政治。此聯盟遭到元老院中如小加图等人的反對，而西塞罗亦私下支持反對陣營。凱撒憑藉高盧戰爭中的一連串勝利，崛起為羅馬最強勢的政治人物之一，大幅擴張了羅馬領土。他還曾入侵不列顛並在萊茵河上架橋。這些成就以及他對老兵的掌控，使其地位逐漸凌駕於龐培之上。至前50年，龐培轉而與元老院結盟。當凱撒的軍事指揮權即將到期、戰事亦告一段落時，元老院命令他解除軍權返回羅馬。前49年初，凱撒公然違抗命令，率軍橫渡盧比孔河，進軍羅馬，從而引發內戰。他最終勝出，於前45年掌握近乎無可挑戰的權力。 凱撒在掌握政權並赦免許多敵人後，推行大規模改革與建設。他制定儒略曆以取代舊有曆法，削減糧食配給，將退伍軍人安置於海外殖民地，大幅擴充元老院人數，並將公民權擴展至西班牙與今日義大利北部的部分地區。前44年初，他被宣布為「終身獨裁官」。布魯圖斯與卡西乌斯等元老院議員因擔心凱撒權力過大、可能稱王，於前44年3月15日將其刺殺。此後爆發新的內戰，共和國的憲政體制再未真正恢復。凱撒的外甥孫兼養子屋大維（後稱奥古斯都）在擊敗對手後成為唯一統治者，最終建立帝制。 凱撒除擅長軍事與政治外，也是出色的作家與歷史記錄者，其軍事行動多由其親自撰寫記錄。後世史家對其生平的了解亦來自西塞罗的書信與演說，以及撒路斯提乌斯的史著；後世如苏埃托尼乌斯與普魯塔克的傳記亦是重要來源。多數歷史學者認為凱撒是史上最偉大的軍事統帥之一。他的「凱撒」之名後來成為皇帝的同義詞，在羅馬帝國廣泛使用，並衍生出如「Kaiser」與「Tsar」等稱號；同時，他也頻繁出現在各類文學與藝術作品之中。"
title = "尤利烏斯·凱撒"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%B0%A4%E5%88%A9%E7%83%8F%E6%96%AF%C2%B7%E5%87%B1%E6%92%92"
intro = [
  "盖乌斯·尤利乌斯·凯撒（拉丁語：Gaius Iulius Caesar；前100年7月12日或13日—前44年3月15日），羅馬共和國將軍、政治家與作家，自前49年至前44年幾乎持續擔任獨裁官，直至在龐貝劇場遇刺。他是前三头同盟成員之一，率領羅馬軍隊征服高盧，並在內戰中擊敗政治對手庞培。他隨後鞏固權力並於前44年自稱「終身獨裁官」，此舉加劇羅馬共和國晚期的危機，最終促成共和體制的崩潰與羅馬帝國的誕生。他被視為歷史上最具影響力的人物之一。",
  "前60年，凱撒與克拉蘇、庞培組成前三头同盟，非正式地掌控羅馬政治。此聯盟遭到元老院中如小加图等人的反對，而西塞罗亦私下支持反對陣營。凱撒憑藉高盧戰爭中的一連串勝利，崛起為羅馬最強勢的政治人物之一，大幅擴張了羅馬領土。他還曾入侵不列顛並在萊茵河上架橋。這些成就以及他對老兵的掌控，使其地位逐漸凌駕於龐培之上。至前50年，龐培轉而與元老院結盟。當凱撒的軍事指揮權即將到期、戰事亦告一段落時，元老院命令他解除軍權返回羅馬。前49年初，凱撒公然違抗命令，率軍橫渡盧比孔河，進軍羅馬，從而引發內戰。他最終勝出，於前45年掌握近乎無可挑戰的權力。",
  "凱撒在掌握政權並赦免許多敵人後，推行大規模改革與建設。他制定儒略曆以取代舊有曆法，削減糧食配給，將退伍軍人安置於海外殖民地，大幅擴充元老院人數，並將公民權擴展至西班牙與今日義大利北部的部分地區。前44年初，他被宣布為「終身獨裁官」。布魯圖斯與卡西乌斯等元老院議員因擔心凱撒權力過大、可能稱王，於前44年3月15日將其刺殺。此後爆發新的內戰，共和國的憲政體制再未真正恢復。凱撒的外甥孫兼養子屋大維（後稱奥古斯都）在擊敗對手後成為唯一統治者，最終建立帝制。",
  "凱撒除擅長軍事與政治外，也是出色的作家與歷史記錄者，其軍事行動多由其親自撰寫記錄。後世史家對其生平的了解亦來自西塞罗的書信與演說，以及撒路斯提乌斯的史著；後世如苏埃托尼乌斯與普魯塔克的傳記亦是重要來源。多數歷史學者認為凱撒是史上最偉大的軍事統帥之一。他的「凱撒」之名後來成為皇帝的同義詞，在羅馬帝國廣泛使用，並衍生出如「Kaiser」與「Tsar」等稱號；同時，他也頻繁出現在各類文學與藝術作品之中。",
]
sections = [
  { "title" = "家谱", "paragraphs" = [
      "凯撒為了營造自己的神格，为自己创造了一个神圣的家谱：根据传说，罗马城的創造者罗穆卢斯的祖先是特洛伊英雄安喀塞斯与女神维纳斯（希臘人的阿芙蘿黛蒂）生下的特洛伊王子埃涅阿斯。而埃涅阿斯之子阿斯卡尼又名Julus，凯撒利用词源学的相似，将其作为自己氏族Julius的祖先，并說自己是维纳斯的后裔。",
    ] },
  { "title" = "生平", "paragraphs" = [
      "凯撒早年的情况，特别是他接受教育的情况，由于缺少资料，一直不甚清楚。和那个时代任何一个年青的罗马贵族一样，直到7岁为止，凯撒一直受其母亲的影响。此外按照传统，在学习完字母和数字以及拉丁文、希臘文后，凯撒应当师从雄辯學教师，学习演讲辩论；此外，他还要学习哲学和法律等基础知识；最后，如同所有贵族子弟，接受军事技术方面的教育，包括阅读各种历史、攻城术和战术等方面的著作，参加各种各样军事体育训练。7岁时，凯撒被送进了专门培养贵族子弟的学校。15岁时按照罗马的习俗，凯撒开始穿成人的白长袍。",
      "公元前86年和前84年，元老院民众派领袖马略和秦纳先后去世，前者是凯撒的姑父，后者曾提名凯撒为朱庇特神祭司，而凯撒则由于亲缘等原因被视为马略的当然支持者。虽然凯撒一下失去两个保护人，但也同时获得从事某种职业并取得巨大成就的自由。前84年，凯撒娶秦纳之女科涅莉亚为妻。这桩婚姻不仅给他带来一个女儿——尤莉娅，而且还使其获得元老院民众派成员的支持。",
      "前82年，在内战中取胜，并遭到元老院精英派成员支持的独裁官苏拉要求凯撒和科涅莉亚离婚。但是，凯撒选择拒绝并谨慎离开罗马。在亲友的帮助下，凯撒躲过放逐和死亡的威胁。虽然后来苏拉屈服于对年青的凯撒之各种有利的强大压力而宽恕后者，但凯撒仍然认为远离罗马更为审慎。",
    ] },
  { "title" = "政治經歷", "paragraphs" = [
      "前74年，凯撒返回罗马，并很快继承了舅舅奥莱利乌斯·科塔的职位，成为祭司。前72年，他获得了第一个通过选举产生的低级职位——军事保民官——这是罗马官职体系中最低的一级。但由于缺乏资料，目前尚不清楚凯撒是否参与过对斯巴达克斯领导之奴隶起义。",
      "前70年，32岁的凯撒再次参与选举，并顺利当选前69年的财务官，这一职务是罗马官职体系中第一个正式官职，而且只有30岁以上的人才能参与竞选，任期一年，获胜者将自动获得元老院议员的资格。凯撒于前69年前往西班牙赴任，作为总督的副手，并主管这个行省的财政。",
      "在西班牙各城市巡回审理案件期间，一天，在海克力斯神庙中看到了亚历山大大帝的塑像，联想到亚历山大在自己这个年龄就已征服世界，而自己还无所作为，不禁感慨万千，随即便请求解除自己的职务，离开了西班牙。",
    ] },
  { "title" = "三头同盟和高卢战争", "paragraphs" = [
      "前60年（一说前59年），凯撒被百人隊會議选举为罗马共和国的执政官。凯撒因此成为了最高长官，但是贵族们害怕如果再出现一个与凯撒合作的同僚，凯撒就可以无所顾忌为所欲为。于是许多贵族为他的主要政治对手，元老院貴人派代表，加图的好友，马尔库斯·卡尔普尔尼乌斯·比布鲁斯捐款，使其也当选为执政官。对此加图曾坦言，在此情形下，贿选有利于国家。因此，凯撒特别地需要组建其政治同盟，而且他找到了其政治对手事先未曾料想到的合作伙伴。",
      "此时，庞培正在元老院争取安置他的退伍老兵的土地，却遭到失败；已经成为罗马最富有者的克拉苏，也正在为获得对抗帕提亚所需的军队控制权而犯愁；而执政官凯撒也正好需要庞培的声望和克拉苏的金钱。因此，凯撒成功地使两人言归于好（庞培和克拉苏在前70年那次共掌执政官之后结怨）。三人于前60年订立盟约，目的是使“这个国家的任何一项措施都不得违反他们三人之一的意愿”（苏维托尼乌斯语）。历史学家将这个联盟称为“前三头同盟”。为了巩固这一政治联盟，五十歲的庞培还娶了凯撒年仅14岁的独女茱莉娅。",
      "三人结盟后，势力大增。在毕布路斯宣布有不祥征兆欲终止会议的时候，凯撒竟粗暴地动用武力，将这位同僚赶了出去，而在次日的元老院会议上，竟然无人敢对此提出批评或议论，而此前尚不及此严重的事件都会有法令通过。毕布路斯如此失望，以至于作为执政官的第一项政令，便是退出所有政治活动。从此这位凯撒的政敌，只能躲在家中通过信使，向元老院或公民大会发出不祥征兆，直到任期结束。就这样，凯撒大权独揽，“毕布路斯和凯撒执政之年”成了“儒略和凯撒执政之年”。",
    ] },
  { "title" = "影响和评价", "paragraphs" = [
      "儒略曆七月原名「Quintilis」，後改「Julius」。古羅馬曆只有10個月，這是第五月，原名是「第五」的意思，因為凱撒是這月出生的，經元老院一致通過，將此月改為凱撒的名字「儒略」。",
      "凯撒是羅馬帝國的奠基者，故被一些歷史學家視為羅馬帝國的無冕之皇，有凯撒大帝之稱。甚至有歷史學家將其視為羅馬帝國的第一位皇帝，以其就任終身獨裁官的日子為羅馬帝國的誕生日。影響所及，有羅馬君主以其名字「凯撒」作為皇帝稱號；其後之德意志帝國及俄羅斯帝國君主亦以「凯撒」作為皇帝稱號。",
    ] },
  { "title" = "战后", "paragraphs" = [
      "回到羅馬的凯撒推動各項改革，包括給予北義大利和西西里島人民羅馬公民權、請專家製作儒略曆、建立和平廣場等。在前45年，龐培的兩個兒子逃到西班牙發動叛亂，凯撒再次遠征西班牙，於蒙達戰役中擊敗叛軍，龐培長子勞斯陣亡，次子流亡西西里。凯撒回國之後，於前44年宣布成為終身獨裁官。",
    ] },
]

[articles.ja]
text = "ガイウス・ユリウス・カエサル（ラテン語: Gaius Iulius Caesar、Juliusとも、紀元前100年 - 紀元前44年3月15日）は、共和政ローマ末期の政務官であり、文筆家。 古代ローマで最大の野心家と言われ、マルクス・リキニウス・クラッスス及びグナエウス・ポンペイウスとの第一回三頭政治と内戦を経て、永久独裁官（ディクタトル・ペルペトゥオ）となった。しかし、その直後暗殺され、カエサルの時代は終焉を迎える。 「カエサル」の名は、帝政初期にローマ皇帝が帯びる称号の一つ、帝政後期には副帝の称号となった（テトラルキア参照）。ドイツ語のKaiser（カイザー）やロシア語のцарь（ツァーリ）など、皇帝を表す言葉の語源でもある。 「賽は投げられた」(alea jacta est)、「来た、見た、勝った」(veni, vidi, vici) 、「ブルートゥス、お前もか」(et tu, Brute?) などの特徴的な引用句でも知られる。また彼が布告し彼の名が冠された暦（ユリウス暦）は、紀元前45年から1582年まで1600年間以上に渡り欧州のほぼ全域で使用され続けた。 従来カエサルはポプラレス（民衆派）とされてきたが、当時の政治状況を簡単に二分することはできないため、「カエサル派」とすべきだとする意見がある。"
title = "ガイウス・ユリウス・カエサル"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%AC%E3%82%A4%E3%82%A6%E3%82%B9%E3%83%BB%E3%83%A6%E3%83%AA%E3%82%A6%E3%82%B9%E3%83%BB%E3%82%AB%E3%82%A8%E3%82%B5%E3%83%AB"
intro = [
  "ガイウス・ユリウス・カエサル（ラテン語: Gaius Iulius Caesar、Juliusとも、紀元前100年 - 紀元前44年3月15日）は、共和政ローマ末期の政務官であり、文筆家。",
  "古代ローマで最大の野心家と言われ、マルクス・リキニウス・クラッスス及びグナエウス・ポンペイウスとの第一回三頭政治と内戦を経て、永久独裁官（ディクタトル・ペルペトゥオ）となった。しかし、その直後暗殺され、カエサルの時代は終焉を迎える。",
  "「カエサル」の名は、帝政初期にローマ皇帝が帯びる称号の一つ、帝政後期には副帝の称号となった（テトラルキア参照）。ドイツ語のKaiser（カイザー）やロシア語のцарь（ツァーリ）など、皇帝を表す言葉の語源でもある。",
  "「賽は投げられた」(alea jacta est)、「来た、見た、勝った」(veni, vidi, vici) 、「ブルートゥス、お前もか」(et tu, Brute?) などの特徴的な引用句でも知られる。また彼が布告し彼の名が冠された暦（ユリウス暦）は、紀元前45年から1582年まで1600年間以上に渡り欧州のほぼ全域で使用され続けた。",
]
sections = [
  { "title" = "出自", "paragraphs" = [
      "ユリウス氏族は、王政ローマ時代、ロームルスが隠れたときに動揺する民衆をプロクルス・ユリウスが説得したという伝説があり、ホラティウス三兄弟の決闘でアルバ・ロンガに勝った後、セルウィリウス氏族やクィンクティウス氏族らと共に移住してきたアルバの元指導者層で、パトリキ（貴族）に列せられたという。",
      "氏族は古い系譜を有するパトリキではあったが、カエサル家は2つの家系に分かれ、カエサルの直系の先祖に執政官経験者はいない。当時力を付けてきていたガイウス・マリウスと結ぶことによってその地位の向上を計ったとみられる。カエサルは自身の叔母でマリウスの妻でもあったユリア (ガイウス・マリウスの妻)の追悼演説で「ユリウス氏族はアエネアスの息子アスカニウスに由来し、したがって女神ウェヌスの子孫であり、また、カエサルの母方はアンクス・マルキウス（王政ローマ第4代の王）に連なる家柄である」と述べている。（氏族の先祖であるガイウス・ユッルスの頃は、コグノーメンをIullusと表記していたが、『アエネーイス』でアスカニウスの別名ユールスが有名になるにつれ、Iulusと表記されるようになった。）",
      "大プリニウスの『博物誌』 によれば、母を犠牲にした子は幸運の持ち主で、スキピオ・アフリカヌスがそうであったが、初代カエサルは母の子宮を切った（caeso）ためにその名で呼ばれ、同じ理由でカエソ（というプラエノーメン）もそう呼ばれたとしている（ラテン語で「切る」という意味のcaedere（受動完了分詞 caesus）に由来か）。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "父は同名のガイウス・ユリウス・カエサル（Gaius Iulius Caesar）で、ガイウス・マリウスは父ガイウスの義弟に当たる。父ガイウスはプラエトルを務めた後、アシア属州の属州総督を務めた。母はルキウス・アウレリウス・コッタの娘アウレリア・コッタで、祖先に幾人もの執政官を輩出した名家の出身であった。また、カエサルには幼少の頃から家庭教師としてマルクス・アントニウス・グニポが付けられたが、グニポはガリア系の人物であった。",
      "なお、誕生月日も幾つかの説がある。カエサルの神格化を決議した後にカエサルの誕生日を祝う記念日を『ルディ・アポッリナレス』（7月6日から13日まで）の最終日に当たる7月13日を避けて7月12日に設置したと伝わっているため、7月13日をカエサルの誕生日とする説が有力であるが、7月12日とする説もある。",
      "幼少期のカエサルについては、プルタルコス『英雄伝』やスエトニウス『ローマ皇帝伝』などの文献に言及が無く、はっきりしない。ローマ国内は政治的に不安定で、ユグルタ戦争、キンブリ・テウトニ戦争の英雄ガイウス・マリウスと、そのライバルであったルキウス・コルネリウス・スッラが対立しており、カエサルは叔母ユリアがマリウスに嫁いでいたことからマリウス派であった。ただ、それはよく民衆派と呼ばれる政党的なものというよりは、マリウスを中心とした緩い個人的なつながりと考えられる。紀元前91年の同盟市戦争では、同盟国がローマ市民権を求めて蜂起し、ルキウス・カエサルがユリウス法を提案し、イタリア半島ポー川以南の全自由民に市民権を与えることで決着したが、彼らをどのトリブス（選挙区）に登録するかで揉め、一部の抵抗も続いていた。",
    ] },
  { "title" = "事績", "paragraphs" = [
      "約8年に及ぶ戦いの末ガリアを征服してブリタニアへも進出した事でローマに多大な利益をもたらし、同時に自身も絶大な名声と富を獲得してポンペイウスに匹敵する存在となった。また、この過程で40万から100万のガリア人を殺害し、多数の奴隷を得たとされる。その後4年に及ぶポンペイウスとの内乱も制してローマにおける事実上の単独支配者となり、2度の凱旋式を含む様々な栄誉に服した。さらに暗殺直前には3年以上の予定でダキアとパルティアへの遠征も計画されていた",
      "執政官一期目に制定した農地法やカルタゴやコリントスをはじめとした各地への8万人規模とされた入植計画を推進するなどしてグラックス兄弟以来の問題に取り組んだが、これらの多くは存命中に実現する事はなかった。また、国家財政を圧迫していた穀物の無料配給対象者を32万から15万にまで削減している。元老院の定数を600から900に、公職者も法務官の数を8から16にするなどして増加させる一方で属州総督の権限を制限するため任期を1年から2年までとした。",
      "猥雑な都市となっていたローマ市再編を進め、その一環としてマルクス・テレンティウス・ウァッロを長とする公共図書館建設も計画したが暗殺により実現しなかった。ポンプティヌス沼地(英語版)の灌漑等による耕作地拡大も構想したが、これらが完遂されたのは遥か後の19世紀から20世紀にかけてであった。属州民に市民権を積極的に付与し、計画だけで終わった入植計画等も含め属州のローマ化が進む契機を作り、執政官一期目で成立させた属州での訴訟に関するユリウス法は元首政期においても属州統治の基礎となった。また、エジプトの太陽暦を基に制定したユリウス暦は今日の人々が送る生活にまで大きな影響を与えている。",
    ] },
  { "title" = "人物像", "paragraphs" = [
      "カエサルが元老院議員として初めて表舞台に出た頃の評価は、「借金王」や「ハゲの女たらし」と言ったものであった。事実、借金は天文学的でとてつもない金額であった。紀元前61年春に、プロプラエトルとしてヒスパニアへ赴く前、カエサルが高飛びすると恐れて出発を妨げたため、カエサルは、最大の債権者クラッススに泣きつき、債務保証をしてもらい、ようやく任地に出発できた。",
      "また、カエサル自身が総督として赴任したヒスパニアで現地の部族より金を無心したり、ガリアで現地部族が奉納している神殿や聖域にあった宝飾物を強奪したり、金目当てで街を破壊して回ったりということもあった。また、ローマでもカピトリヌスの神殿に奉納していた金塊を盗み、同重量の金メッキをした銅を戻したり、内戦中は護民官の制止を振り切って神殿の財貨を強奪したとした と伝わっている。",
      "カエサルは、背が高く引き締まった体をしていたが、当時の美男子の条件である「細身、女と見紛うほどの優男」には当てはまらなかった、また、頭髪が薄いことを政敵から攻撃されたため、はげた部分を隠すのに苦労していた。このため、内戦を終結させた業績を認められたことにより、いつ、どこでも月桂冠を被る特権を与えられたときは、大変喜んだという。なお、当時のカエサルが前髪の薄さを隠すためにしていた髪型は、シーザーカット（カエサルカット）と呼ばれており、ヨーロッパでは古くから典型的な男性の髪型の一種となっている。また、てんかんの症状があったとも伝わっている。",
    ] },
]

[articles.ru]
text = "Гай Ю́лий Це́зарь (аутентичное произношение близко к Ка́йсар; лат. Gaius Iulius Caesar [ˈgaːjʊs ˈjuːliʊs ˈkae̯sar]; не ранее 12 июля 100 до н."
title = "Гай Юлий Цезарь"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%93%D0%B0%D0%B9_%D0%AE%D0%BB%D0%B8%D0%B9_%D0%A6%D0%B5%D0%B7%D0%B0%D1%80%D1%8C"
intro = [
  "Гай Ю́лий Це́зарь (аутентичное произношение близко к Ка́йсар; лат. Gaius Iulius Caesar [ˈgaːjʊs ˈjuːliʊs ˈkae̯sar]; не ранее 12 июля 100 до н. э. и не позднее 13 июля 100 до н. э.[…], Рим, Римская республика — 15 марта 44 до н. э., Театр Помпея, Римская республика) — древнеримский государственный и политический деятель, полководец, писатель. Консул 59, 48, 46, 45 и 44 гг. до н. э., диктатор 49, 48–47 и 46–44 гг. до н. э., великий понтифик с 63 г. до н. э.",
  "Происходивший из древней патрицианской семьи, Цезарь последовательно добивался всех ординарных римских должностей (cursus honorum) и сделал себе имя на борьбе с консервативными сенаторами (оптиматами). В 60 г. до н. э. организовал первый триумвират с двумя влиятельными политиками — Гнеем Помпеем Великим и Марком Лицинием Крассом. С 58 г. до н. э. более восьми лет провёл на территории современных Швейцарии, Франции, Бельгии, Германии и Великобритании в Галльской войне, присоединив к Римской республике огромную территорию от Атлантического океана до Рейна и снискав славу талантливого полководца. В начале 49 г. до н. э. начал гражданскую войну из-за непримиримых разногласий с сенаторами по вопросам о деталях своего возвращения в Рим и о гарантиях судебной неприкосновенности за должностные преступления (подкупы на выборах, взятки должностным лицам, нарушение договоров, насильственные действия и другие нарушения). За четыре года сторонники сената, сгруппировавшиеся вокруг Помпея, были разбиты Цезарем в Италии, Испании (дважды), Греции и Африке, также им были разбиты войска правителей Египта и Понта.",
  "Придерживался «политики милосердия», но в то же время казнил ряд своих ключевых оппонентов. Добившись полной победы над противниками, сконцентрировал в своих руках власть консула и чрезвычайные полномочия диктатора (в конце концов — в виде пожизненной должности), провёл ряд реформ во всех сферах жизни общества. При жизни Цезаря началось его обожествление, почётный титул полководца-победителя «император» стал частью его имени, однако он отказывался от власти древних римских царей. После убийства Цезаря группой сенаторов во главе с Марком Юнием Брутом внучатый племянник Цезаря Гай Октавий принял его имя и получил большую часть наследства по завещанию, став впоследствии первым императором.",
  "К Цезарю по-разному относились при жизни, и эта традиция сохранилась в Римской империи: его имя всячески обелялось сторонниками правителей, а оппозиционеры восхваляли его жертв и заговорщиков. Очень популярной была личность Цезаря в Средние века и Новое время. Помимо политической и военной деятельности, Цезарь известен и как литератор. Из-за простоты и ясности стиля, его сочинения считаются классикой древнеримской литературы и используются при обучении латыни. К имени Юлия Цезаря восходят титулы кайзер и царь, название седьмого месяца года во многих языках мира — июль.",
]
sections = [
  { "title" = "Происхождение и детство", "paragraphs" = [
      "Гай Юлий Цезарь родился в древней патрицианской семье Юлиев. В V–IV вв. до н. э. Юлии играли значительную роль в жизни Рима. Из представителей семейства вышли, в частности, один диктатор, один магистр конницы (заместитель диктатора) и один член коллегии децемвиров, разработавших законы Десяти таблиц — первоначальный вариант знаменитых законов Двенадцати таблиц. Подобно большинству семейств с древней историей, Юлии имели общий миф о своём происхождении. Они возводили свой род к богине Венере через Энея. Мифическая версия происхождения Юлиев была хорошо известна уже к 200 г. до н. э., и Катон Старший записал версию об этимологии родового имени Юлиев. По его мнению, первый носитель этого имени Юл получил прозвище от греческого слова «ἴουλος» (пушок, первые волосы на щеках и подбородке).",
      "Почти все Юлии в V–IV вв. до н. э. носили когномен Юл, который, вероятно, был изначально единственным в их семействе. Ветвь Юлиев Цезарей наверняка происходила от Юлиев Юлов, хотя связующие звенья между ними неизвестны. Первым известным Цезарем был претор 208 г. до н. э., упомянутый Титом Ливием. Этимология когномена «Caesar» достоверно неизвестна и была забыта уже в римскую эпоху. Элий Спартиан, один из авторов жизнеописаний Августов, записал четыре версии, бытовавшие к IV в. н. э.:",
      "«…самые учёные и образованные люди считают, что тот первый, кто был так наречён, получил это имя от названия слона (который на языке мавров называется цезай), убитого им в битве; [или] потому, что родился от мёртвой матери и был вырезан из её чрева; или потому, что он вышел из лона родительницы уже с длинными волосами; или потому, что он имел такие блестящие серо-голубые глаза, каких не бывает у людей».",
    ] },
  { "title" = "Начало политической карьеры", "paragraphs" = [
      "В середине 80-х гг. до н. э. Цинна выдвинул Цезаря на почётную должность фламина Юпитера. Этот жрец был связан множеством сакральных ограничений, серьёзно ограничивавших возможности занятия магистратур. Для вступления в должность ему требовалось сначала жениться старинным обрядом confarreatio на девушке из патрицианской семьи, и Цинна предложил Гаю свою дочь Корнелию. Молодой Юлий согласился, хотя ему пришлось расторгнуть помолвку с Коссуцией. Однако вступление Цезаря в должность ставится под сомнение. По мнению Лили Росс Тейлор, великий понтифик Квинт Муций Сцевола (противник Мария и Цинны) отказался проводить церемонию инаугурации Гая. Эрнст Бэдиан, впрочем, полагает, что Цезарь всё же был введён в должность. Как правило, назначение Цезаря рассматривается в историографии как непреодолимое препятствие на пути его дальнейшей политической карьеры. Впрочем, существует и противоположная точка зрения: занятие столь почётной должности было хорошей возможностью укрепить авторитет древнего рода для этой ветви Цезарей, далеко не все представители которого добивались высшей магистратуры консула.",
      "Вскоре после свадьбы с Корнелией Цинну убили взбунтовавшиеся солдаты, а в следующем году началась гражданская война, в которой Цезарь, вероятно, не участвовал. С установлением диктатуры Луция Корнелия Суллы и началом проскрипций жизнь Цезаря оказалась в опасности: диктатор не щадил политических оппонентов и личных врагов, а Гай оказался племянником Гая Мария и зятем Цинны. Сулла потребовал от Цезаря развестись с женой, что не было уникальным случаем доказательства лояльности, однако тот отказался это сделать. В конце концов, Сулла внёс имя Цезаря в проскрипционный список, и он был вынужден покинуть Рим. Источники сообщают, будто Цезарь долго скрывался, раздавая взятки разыскивавшим его сулланцам, но эти рассказы малоправдоподобны. Влиятельные родственники Гая в Риме тем временем сумели добиться помилования для Цезаря. Дополнительным обстоятельством, смягчившим диктатора, стало происхождение Цезаря из сословия патрициев, представителей которого консерватор Сулла ни разу не казнил.",
      "Вскоре Цезарь покинул Италию и примкнул к свите Марка Минуция Терма, наместника провинции Азия. Имя Цезаря было хорошо известно в этой провинции: около десяти лет назад её наместником был его отец. Гай стал одним из контуберналов Терма — детей сенаторов и молодых всадников, обучавшихся военному делу и провинциальному управлению под надзором действующего магистрата. Сначала Терм поручил молодому патрицию переговоры с царём Вифинии Никомедом IV. Цезарь сумел убедить царя передать в распоряжение Терма часть своего флота, чтобы наместник смог захватить город Митилены на Лесбосе, не признававший итогов Первой Митридатовой войны и сопротивлявшийся римлянам. Пребывание Гая у вифинского царя впоследствии стало источником множества слухов об их сексуальной связи (см. раздел «Семья. Личная жизнь»). После успешного выполнения этого поручения Терм направил войска против Митилен, и вскоре римляне взяли город. После битвы Цезарь был удостоен гражданской короны (лат. corona civica) — почётной военной награды, которая полагалась за спасение жизни римского гражданина. После взятия Митилен кампания на Лесбосе завершилась. Вскоре Терм сложил полномочия, и Цезарь отправился в Киликию к её наместнику Публию Сервилию Ватии, организовывавшему военную кампанию против пиратов. Однако когда в 78 г. до н. э. из Италии пришли известия о смерти Суллы, Цезарь немедленно вернулся в Рим.",
    ] },
  { "title" = "Претура. Создание первого триумвирата (62—60 гг. до н. э.)", "paragraphs" = [
      "Едва вступив в должность претора 1 января 62 г. до н. э., Цезарь воспользовался правом законодательной инициативы магистрата и предложил народному собранию передать полномочия по восстановлению храма Юпитера Капитолийского от Квинта Лутация Катула Гнею Помпею. Катул занимался восстановлением этого храма около 15 лет и почти завершил работу, но в случае принятия этого предложения в посвятительной надписи на фронтоне этого важнейшего святилища Рима было бы упомянуто имя Помпея, а не Катула, влиятельного оппонента Цезаря. Гай также обвинил Катула в хищении государственных средств и потребовал отчитаться о расходах. После протеста сенаторов претор отозвал свой законопроект.",
      "Когда 3 января трибун Квинт Цецилий Метелл Непот предложил отозвать Помпея в Рим для разгрома отрядов Катилины, Гай поддержал это предложение, хотя войска заговорщиков уже были окружены и обречены на поражение. По-видимому, Непот — шурин Гнея — надеялся своим предложением дать возможность Помпею прибыть в Италию, не распуская свои войска. После спровоцированной Непотом массовой драки на форуме решительно настроенный сенат принял чрезвычайный закон об отстранении Непота и Цезаря от должностей, однако через несколько дней Гая восстановили.",
      "Осенью на суде над участником заговора Катилины Луцием Веттием обвиняемый заявил судье, что располагает доказательством причастности Цезаря к заговору — его письмом к Катилине. Кроме того, на допросе в сенате свидетель Квинт Курий заявил, что слышал лично от Катилины об участии Цезаря в подготовке мятежа. Впрочем, Цицерон по просьбе Гая засвидетельствовал, что он сообщил консулу всё, что знал о заговоре, и тем самым лишил Курия награды за информацию и опроверг его показания. Против первого обвинителя Цезарь действовал весьма решительно, арестовав и Веттия (он не явился на очередное заседание и не представил доказательства вины претора), и судью Новия Нигера (он принял донос на старшего магистрата).",
    ] },
  { "title" = "Консульство (59 г. до н. э.)", "paragraphs" = [
      "В самом начале консульства Гай приказал ежедневно обнародовать протоколы заседаний сената и народного собрания: по-видимому, это было сделано для того, чтобы граждане могли отслеживать действия политиков. В первые дни января Гай огласил в сенате и свой проект аграрного закона. Вероятно, такая поспешность была вызвана желанием провести новое постановление до конца месяца, пока Цезарь был главным из двух консулов. Между первым оглашением законопроекта и голосованием по нему, по римским законам, должно было пройти три нундины (лат. nundinae — базарные дни), — по разным версиям, 17 дней или 24 дня, в течение которых с проектом постановления могли ознакомиться все римляне. Законопроект Гая был весьма умеренным. Прежде всего, не планировалось проводить конфискации у крупных землевладельцев (незанятой земли в Италии оставалось немного), а участки должны были выкупаться только у тех, кто желал продать землю. Деньги на это мероприятие Цезарь намеревался получить от налогов с территорий, присоединённых Помпеем. Для предотвращения спекуляций семьи, получившие землю, не могли продавать её в течение 20 лет. Воспользоваться законом Цезаря могли не только ветераны Помпея, но и городская беднота (пролетариат). Для контроля за разделами земли создавалась комиссия из двадцати человек, в которую вошли, в частности, Помпей и Красс. Первыми сенаторами, к которым обратился Гай при обсуждении данного вопроса, стали как раз Помпей и Красс. Поддержка предложения этими уважаемыми и влиятельными политиками предопределила благожелательное отношение большинства остальных сенаторов к законопроекту. Впрочем, сторонники Катона решительно возражали против инициативы Цезаря, а второй консул Бибул указывал, что организация голосования незаконна из-за неблагоприятных небесных знамений. Перед голосованием…",
      "Потребности в земле для нуждающихся были очень велики, а крупные землевладельцы неохотно продавали участки государству. Для удовлетворения спроса на землю Цезарь предложил ввести в оборот большой участок в Кампании, остававшийся в государственной собственности. Приоритет в распределении земли на этом участке был отдан многодетным семьям с тремя и более детьми, которых оказалось более 20 тыс. Катон попытался сорвать принятие нового закона очередной обструкцией, но был решительно остановлен консулом:",
      "«Цезарь приказал прямо с ораторского возвышения отвести его [Катона] в тюрьму, но и тут Катон не пал духом, не умолк, — напротив, по дороге в тюрьму он продолжал говорить о новом законе, призывая римлян обуздать тех, кто вершит дела государства подобным образом».",
    ] },
]

[articles.vi]
text = "Gaius Julius Caesar viết theo người La Mã là Gaivs Ivlivs Caesar (tiếng Latinh: [ˈɡaːiʊs ˈjuːliʊs ˈkae̯sar]; 12 tháng 7 năm 100 TCN – 15 tháng 3 năm 44 TCN) là một vị tướng và chính khách người La Mã. Là thành viên của Chế độ tam hùng lần thứ nhất, Caesar đã lãnh đạo quân đội La Mã trong cuộc Chiến tranh xứ Gallia trước khi đánh bại Pompey trong một cuộc nội chiến và cai trị Cộng hòa La Mã với tư cách là nhà độc tài từ năm 49 TCN cho đến khi bị ám sát vào năm 44 TCN."
title = "Julius Caesar"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Julius_Caesar"
intro = [
  "Gaius Julius Caesar viết theo người La Mã là Gaivs Ivlivs Caesar (tiếng Latinh: [ˈɡaːiʊs ˈjuːliʊs ˈkae̯sar]; 12 tháng 7 năm 100 TCN – 15 tháng 3 năm 44 TCN) là một vị tướng và chính khách người La Mã. Là thành viên của Chế độ tam hùng lần thứ nhất, Caesar đã lãnh đạo quân đội La Mã trong cuộc Chiến tranh xứ Gallia trước khi đánh bại Pompey trong một cuộc nội chiến và cai trị Cộng hòa La Mã với tư cách là nhà độc tài từ năm 49 TCN cho đến khi bị ám sát vào năm 44 TCN. Ông đóng vai trò quan trọng trong các sự kiện dẫn đến sự sụp đổ của Cộng hòa La Mã và sự trỗi dậy của Đế chế La Mã.",
  "Vào năm 60 TCN, Caesar, Crassus và Pompey đã cùng nhau thành lập Chế độ tam hùng lần thứ nhất, một liên minh chi phối nền chính trị La Mã trong vài năm. Những nỗ lực nhằm tích lũy quyền lực của họ với tư cách là người thuộc phe Đại chúng (Populare) đã bị những người theo phe Quý tộc (Optimate) phản đối trong Viện nguyên lão La Mã, trong đó có cả Cato Trẻ với sự hỗ trợ thường xuyên của Cicero. Caesar đã vươn lên trở thành một trong những chính trị gia quyền lực nhất tại Cộng hòa La Mã thông qua một chuỗi các chiến thắng quân sự tại cuộc Chiến tranh xứ Gallia, hoàn thành vào năm 51 TCN, mở rộng đáng kể lãnh thổ La Mã. Trong khoảng thời gian này, ông vừa xâm lược nước Anh vừa xây dựng một cây cầu bắc qua sông Rhine. Những thành công này và với sự hỗ trợ từ đội quân thiện chiến của mình đã đe dọa làm lu mờ vị thế của Pompey, người đã hậu thuẫn với Viện Nguyên lão sau cái chết của Crassus vào năm 53 TCN. Sau khi Chiến tranh xứ Gallia kết thúc, Viện Nguyên lão ra lệnh cho Caesar từ chức chỉ huy quân sự và trở về Rome. Vào năm 49 TCN, Caesar công khai thách thức Viện Nguyên lão bằng việc vượt sông Rubicon và tiến về Rome với tư cách người dẫn đầu một đội quân. Điều này dẫn đến cuộc nội chiến Caesar, mà ông đã giành chiến thắng, mang lại cho ông một vị trí có quyền lực và ảnh hưởng gần như tuyệt đối vào năm 45 TCN.",
  "Sau khi nắm quyền kiểm soát chính phủ, Caesar bắt đầu thực hiện một chương trình cải cách xã hội và chính phủ, bao gồm cả việc tạo ra lịch Julius. Ông đã trao quyền công dân cho nhiều cư dân sống ở các vùng xa xôi của Cộng hòa La Mã. Ông khởi xướng cải cách ruộng đất và hỗ trợ các cựu binh. Ông tập trung hóa bộ máy quan chức của nền Cộng hòa và được xưng tụng là \"nhà độc tài trọn đời\" (dictator perpetuo). Những cải cách theo chủ nghĩa dân túy và độc tài của ông đã khiến giới tinh hoa tức giận, những người bắt đầu âm mưu chống lại ông. Vào ngày 15 tháng 3 năm 44 TCN, Caesar bị ám sát bởi một nhóm thượng nghị sĩ nổi loạn do Brutus và Cassius cầm đầu, những người này đã đâm chết ông. Một loạt các cuộc nội chiến mới nổ ra và chính phủ hợp hiến của nước Cộng hòa không bao giờ được khôi phục hoàn toàn. Cháu trai và là người thừa kế của Caesar Octavian, sau này được gọi là Augustus, đã lên nắm quyền sau khi đánh bại các đối thủ của mình trong cuộc nội chiến cuối cùng của Cộng hòa La Mã. Octavian củng cố quyền lực của bản thân, và kỷ nguyên của Đế chế La Mã bắt đầu.",
  "Caesar là một nhà văn và nhà sử học cũng như là một chính khách tài ba; phần lớn cuộc đời ông được biết đến từ những lời kể của chính ông về các chiến dịch quân sự của mình. Những nguồn khác bao gồm các bức thư và bài phát biểu của Cicero, các tác phẩm lịch sử của Sallust. Các tác phẩm tiểu sử sau này về Caesar của Suetonius và Plutarch cũng đều là những nguồn quan trọng. Caesar được nhiều sử gia coi là một trong những nhà chỉ huy quân sự vĩ đại nhất trong lịch sử. Tên của ông sau đó được xem như đồng nghĩa với từ \"Hoàng đế\"; tước hiệu \"Caesar\" đã được sử dụng trong suốt thời kỳ Đế chế La Mã, gián tiếp hình thành nên nhiều biệt hiệu hiện đại như Kaiser và Sa hoàng. Ông thường xuyên xuất hiện trong những tác phẩm văn học và nghệ thuật, đồng thời quan điểm chính trị của ông, được gọi là Chủ nghĩa Caesar, đã truyền cảm hứng cho các chính trị gia hiện đại.",
]
sections = [
  { "title" = "Cuộc đời", "paragraphs" = [
      "Caesar sinh trong một gia đình quý tộc thuộc thị tộc Julia, tự xưng là hậu duệ của Iulus, con của hoàng tử Aeneas thành Troia và thần tình yêu Venus. Về cái tên Ceasar, sử gia Pliny Già giải thích tên Ceasar có lẽ bắt đầu từ một tổ tiên nào đó của Ceasar đã được sinh mổ (mổ César, từ nguyên caesus hay caedere có nghĩa là cắt hay mổ trong tiếng La Tinh), nhưng trong suốt một thời gian dài tới tận thế kỷ 12 người ta vẫn hay hiểu lầm rằng Caesar được sinh mổ; nhưng không đúng Ceasar không phải người đầu tiên mang tên này và là vì vào lúc bấy giờ, người ta chỉ thực hiện các ca sinh mổ trên cơ thể phụ nữ đã chết, trong khi mẹ của Caesar sống rất lâu sau khi ông ra đời. Còn bộ sử Historia Augusta thì chép ba cách giải thích: có thể Ceasar có một vầng trán cao với nhiều tóc (tiếng La Tinh: caesaries), hoặc có thể ông có mắt xám sáng (oculis caesiis), hoặc là ông giết được voi (caesai trong tiếng Moor) trên chiến trận.",
      "Dù cho có một nguồn gốc và địa vị hoàn hảo, dòng tộc Julii-Caesares không giàu có lắm so với mức bình thường của các gia đình quý tộc La Mã khác. Không thành viên nào trong gia đình Caesar làm được điều gì nổi bật vào thời gian này, mặc dù thế hệ cha của Caesar đã phục hồi phần nào sự thịnh vượng của gia tộc. Cha của Caesar, cũng được gọi là Gaius Julius Caesar, đã làm tới chức thống đốc Asia thuộc La Mã, có lẽ bởi vì sự ảnh hưởng của Gaius Marius, anh hùng chiến tranh và một nhà chính trị nổi bật lúc bấy giờ, người đã cưới chị của cha Caesar, Julia. Mẹ của Caesar, Aurelia Cotta, là con gái của một gia đình có uy thế đã có rất nhiều người làm tới chức quan Chấp chính tối cao. Cả gia đình ông sống trong một căn nhà khiêm tốn tại vùng Subura, một khu vực nghèo lân cận La Mã, nơi mà Marcus Antonius Gnipho, một nhà hùng biện đồng thời là một nhà văn phạm đến từ xứ Gaule, được mướn làm thầy dạy học cho Caesar. Ngoài Caesar, gia đình ông còn có hai con gái đều được gọi là Julia. Vài điều ít ỏi này được ghi nhận là tuổi thơ của Caesar. Bản tiểu sử về Caesar của Suetonius và Plutarch bắt đầu vào tuổi thiếu niên của Caesar. Những điều trước đó đã không tìm thấy một sự ghi chép nào.",
      "Caesar trưởng thành trong thời kỳ hỗn loạn của La Mã. Cuộc chiến tranh Đồng Minh giữa La Mã và các đồng minh của họ (91 – 88 TCN) nổi lên vì sự tranh cãi về quyền của công dân La Mã. Khi mà vua Mithridates VI xứ Pontos đe dọa các tỉnh phương đông của La Mã; thì ở trong nội bộ, La Mã bị chia rẽ thành hai phe: Phe Quý tộc (Optimate), phe mà muốn giữ quyền hành thống trị cho các quý tộc, và phe Đại chúng (Populare), phe muốn ngay lập tức sự chia sẻ quyền lực rộng rãi hơn thông qua quyền bầu cử trực tiếp.",
    ] },
  { "title" = "Sự nghiệp văn chương", "paragraphs" = [
      "Caesar rất thường viết các tác phẩm văn học quân sự. Ông xem nó như là một cách để tăng sự ủng hộ của dân chúng thành La Mã dành cho ông. Và dường như cách nghĩ này của ông đã đúng. Danh tiếng lẫy lừng, nhờ đó Caesar thường không viết rõ những sai lầm mà ông gây ra trong cuộc chinh phạt man rợ Gaule. Dù là một thiên tài quân sự, như Caesar, cũng như nhiều danh tướng xuất sắc khác, luôn phải do dự trước vết nhơ của chiến tranh.",
      "Commentarii de Bello Civili (Hồi ký về cuộc nội chiến - kết thúc ở cái chết của Pompey)",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Với sự nghiệp quân sự rất thành công, Julius Caesar trở thành một trong những vị Đại Danh tướng (Great Captains) lịch sử, cùng với Alexandros Đại đế, Hannibal, Gustav II Adolf, Karl XII, Friedrich II Đại Đế và Napoléon. Mặc dù ông không bách chiến bách thắng, ông cũng đã từng thất bại lớn trong nhiều trận đánh, như trận Gergovia (trong cuộc chinh phạt xứ Gaule), Trận Dyrrhachium (trong cuộc Nội chiến), thế nhưng khả năng, mưu lược tài tình của ông vẫn ngời sáng qua sự xây đắp thành lũy bao vây ở Alesia trong cuộc chiến xứ Gaule, chiến thắng đội quân đông đảo hơn rất nhiều của Pompey ở Pharsalus, và sự tận diệt đội quân của vua Pharnaces xứ Pontos trong trận đánh tại Zela. Vua Friedrich II Đại đế đam mê đọc những Hồi ký của Caesar, Hoàng đế Napoléon cũng đọc đi đọc lại những tác phẩm của vị kiệt tướng La Mã này. Bộ trưởng Tài chính Hoa Kỳ Alexander Hamilton ca ngợi ông là \"nhân vật kiệt xuất nhất xưa nay\". Còn nhà lý luận quân sự Đức vĩ đại Carl von Clausewitz có viết:",
      "Một phần do ông đến với các vấn đề quân sự quá trễ trong đường đời, một phần do bản chất ông, ông không giỏi chiến lược và chiến thuật bằng hai danh tướng cổ đại Alexandros Đại đế và Hannibal, nhưng ông cũng có đủ những tài năng khác của hai danh nhân này để trở thành một lãnh đạo quân sự vĩ đại. Không những thế, ông thậm chí còn hơn cả hai người này và có lẽ bất kỳ một vị tướng soái nào trong lịch sử trong việc truyền cảm ba quân xung phong một khi tình thế không có lợi. Và ông cũng là vị Đại Danh tướng duy nhất tự dạy binh cách cho mình.",
      "Ông có thể gặt hái chiến thắng dưới bất kỳ địa hình, thời tiết nào, có thể phần lớn là nhờ vào tính kỷ luật cao của binh lính ông, khả năng điều khiển tuyệt vời, và sự trung thành của các chiến binh dành cho ông. Kỵ binh và bộ binh của ông là tinh nhuệ nhất (của Cộng hòa La Mã thời đó), và ông sử dụng rất nhiều các thiết bị chiến tranh của La Mã như máy bắn đá, máy bắn tên và nhiều mặt khác nữa, điều mà khiến cho lực lượng của ông trở nên cực kỳ thiện chiến, kỷ luật và di chuyển rất nhanh (một vài tài liệu chép rằng lực lượng của Caesar có thể di chuyển tới hơn 40 dặm trong vòng một ngày). Lực lượng của ông ước có khoảng hơn 4 vạn Bộ binh và rất nhiều Kỵ binh, cùng với một số đơn vị chuyên dụng khác như là các máy móc chiến tranh, phu phục vụ. Sự linh động của Caesar là một yếu tố quan trọng khiến cho tên tuổi của ông trở thành bất hủ, cũng giống như Alexandros Đại đế và Friedrich II Đại đế.",
    ] },
  { "title" = "Gia đình", "paragraphs" = [
      "Mẹ: Aurelia Cotta (120 TCN - 84 TCN), con gái của quan chấp chính Lucius Aurelius Cotta.",
      "Caesar không cưới nhiều vợ một lúc, ông chỉ có một vợ vào một thời điểm, thứ tự này biểu thị thứ tự trước sau không phải thứ tự chánh lẽ:",
      "Cornelia Cinna nhỏ (97 TCN - 69 TCN), con gái của quan chấp chính Lucius Cornelius Cinna, kết hôn năm 84 TCN. Là người vợ được yêu quý nhất của Julius, cuộc hôn nhân của họ diễn ra vô cùng hạnh phúc cho đến khi bà qua đời sau khi sinh con.",
    ] },
]

[articles.tl]
text = "Si Imperador Gaius Julius Caesar Divus (CAIVS IVLIVS CAESAR o GAIVS IVLIVS CAESAR sa Klasikong Latin) (Hulyo 12, ca. 100 BCE–Marso 15, 44 BCE) ay isang Romanong politiko, heneral, at dakilang manunulat ng prosang Latin."
title = "Julio Cesar"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Julio_Cesar"
intro = [
  "Si Imperador Gaius Julius Caesar Divus (CAIVS IVLIVS CAESAR o GAIVS IVLIVS CAESAR sa Klasikong Latin) (Hulyo 12, ca. 100 BCE–Marso 15, 44 BCE) ay isang Romanong politiko, heneral, at dakilang manunulat ng prosang Latin. Susi siya sa pagbagsak ng Republikang Romano tungo sa pag-usbong ng Imperyong Romano. Ipinalawak ng kaniyang pagsakop ng Gallia ang daigdig Romano hanggang sa Dagat Atlantiko at nagbigay-daan ito sa pagpapakilala ng mga impluwensiyang Romano sa ang ngayon ay Pransiya, kung saan ang mga bunga nito ay kapuna-puna. Nagdulot din ito sa pagkalipol ng mga wikang Seltiko sa Gallia. Noong 55 BCE inilunsad ng Caesar ang kauna-unahang paglusob ng mga Romano sa Britanya.",
  "Nakipaglaban at nanalo ang Caesar sa isang digmaang sibil na nag-iwan sa kaniya bilang tunay at kaisa-isang puno ng daigdig Romano. Nagsimula siya ng malawakang pagbabago ng lipunan at pamahalaang Romano. Iprinoklama siyang panghabambuhay na diktador, at lubos niyang isinentralisa, o isinaisa, ang humihina at nagwawatak-watak nang pamahalaan ng Republika. Nakipagsabwatan ang kaibigan ng Caesar na si Marcus Brutus upang patayin siya nang pataksil sa pag-asang mailigtas ang Republika. Siya ay pinatay sa loob ng senado ng kaniyang kaibígan na si Brutus, pagpatay nang pataksil noong Ides of March ay nagsiklab ng panibagong digmaang sibil sa pagitan ng Caesarians—Octavianus, Mark Antony (Marcus Antonius), at Marcus Lepidus—at ng mga Republikano—Brutus, Cassius, at Cicero, kasáma ng mga iba. Nagtapos ang alitang ito sa pagtagumpay ng Caesarians sa Labanan sa Fílippoi, at sa pormal na pagtatatag ng Ikalawang Triumviratus nang sa pamamagitan ay kinontrol nina Octavianus, Antonius, at Lepidus ang Roma. Napatubog na naman ang Roma sa isa pang digmaang sibil dahil sa tensiyon sa pagitan nina Octavianus at Antonius na nauwi sa pagkatalo ng pangalawa sa Labanan sa Actium at ang pag-iwan kay Octavianus bílang tunay at kaisa-isang pinuno ng daigdig Romano.",
  "Nagdulot ang panahong ito ng mga digmaang sibil sa pagpalit-anyo ng Roma mula Republika patungong Imperyo kung saan ang pamangkin ng Caesar sa tuhod at inampon niyang anak na si Octavian ang naging unang Emperor nito sa pangalang Caesar Augustus. Ang mga namúnò sa mga unang panahon ng Imperyong Romano ay ang kaniyang angkan na tinawag na Dinastiyang Hulio-Claudian.",
  "Kilalá nang detalyado ang mga kilusang militar ng Caesar mula sa kaniyang sariling sinulat na Commentarii (Mga Pagpupuna) at maraming bahagi ng kaniyang búhay ay itinalâ ng mga mananalaysay tulad nina Suetonius, Ploútarchos, at Dio Cassius.",
]
sections = [
  { "title" = "Unang bahagi ng buhay", "paragraphs" = [
      "Si Caesar ay isinilang sa isang pamilyang patrician, ang gens ay Julia, na nag-aangkin ng kaangkanan mula kay Iulus, anak ng maalamat na prinsipeng Troyang si Aineias, sinasabi ring anak daw ni Venus. Ang cognomeng \"Caesar\" ay nagmula, according to Pliny the Elder, sa isang ninuno na isinilang sa paraan ng caesarean section (mula sa pandiwang Latin na \"gupitin\", caedere, caes-). Ang Historia Augusta ay nagbibigay ng tatlong alternatibong paliwanag: na ang kauna-unahang Caesar ay may sobrang makapal na buhok (Latin caesaries); na mayroon siyang makislap na abung mata (Latin oculis caesiis); o na siya ay napatay ng isang elepante (caesai in Moorish) sa isang labanán . Si Caesar ay nag-issue ng mga barya na may imahen ng mga elepante, na maaaring nagsasabi na gusto niya ang hulíng interpretasyon na ito ng kaniyang pangalan.",
    ] },
]

[articles.pt]
text = "Caio Júlio César (em latim: Caius ou Gaius Iulius Caesar ou IMP•C•IVLIVS•CÆSAR•DIVVS; 13 de julho de 100 a.C. – 15 de março de 44 a.C.) foi um patrício, líder militar e político romano."
title = "Júlio César"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/J%C3%BAlio_C%C3%A9sar"
intro = [
  "Caio Júlio César (em latim: Caius ou Gaius Iulius Caesar ou IMP•C•IVLIVS•CÆSAR•DIVVS; 13 de julho de 100 a.C. – 15 de março de 44 a.C.) foi um patrício, líder militar e político romano. Desempenhou um papel crítico na transformação da República Romana no Império Romano. Muito da historiografia das campanhas militares de César foi escrita por ele próprio ou por fontes contemporâneas dele, a maioria, cartas e discursos de Cícero e manuscritos de Salústio. Sua biografia foi posteriormente mais bem escrita pelos historiadores Suetônio e Plutarco. César é considerado por muitos acadêmicos como um dos maiores comandantes militares da história.",
  "Nascido em uma família patrícia de pequena influência, César foi galgando seu lugar na vida pública romana. Em 60 a.C., ele e os políticos Crasso e Pompeu formaram uma aliança (o Primeiro Triunvirato) que acabou dominando a política romana por anos. Suas tentativas de manter-se no poder através de táticas populistas enfrentavam resistência das classes aristocráticas conservadoras do senado romano, liderados por homens como Catão e Cícero. César conquistou boa reputação militar e dinheiro durante as Guerras Gálicas (58–50 a.C.), expandindo os domínios romanos para o norte até o Canal da Mancha, anexando a Gália (atual França), e no leste até o Reno (dentro da atual Alemanha). Ele também se tornou o primeiro general romano a lançar uma incursão militar na Britânia.",
  "Suas conquistas deram-lhe enorme poderio militar e respeito, o que acabou ameaçando a posição do seu companheiro político, e agora rival, Pompeu Magno. Este último havia mudado de lado, após a morte de Crasso em 53 a.C., e agora apoiava a ala conservadora do senado. Com a guerra na Gália encerrada, os senadores em Roma exigiram que César dispensasse seu exército e retornasse à capital. Recusou-se a obedecer e em 49 a.C. cruzou o rio Rubicão com suas legiões, entrando armado na Itália (em violação da lei romana que impedia um general de marchar em Roma). Isso precipitou uma violenta guerra civil, que terminou com uma vitória de César, com ele assumindo poder total na República.",
  "Em 49 a.C., César assumiu o comando em Roma como um ditador absoluto. Ele iniciou então uma série de reformas sociais e políticas, incluindo a criação do calendário juliano. Continuou a centralizar o poder e a burocracia da República pelos anos seguintes, dando a si mesmo grande autoridade. Porém, a ferida da guerra civil ainda estava aberta e a oposição política em Roma começou a conspirar para derrubá-lo do poder. As conspirações culminaram nos Idos de Março em 44 a.C. com o assassinato de César por um grupo de senadores aristocratas liderados por Marco Júnio Bruto. Sua morte precipitaria uma nova guerra civil pelos espólios do poder e assim o governo constitucional republicano nunca foi totalmente restaurado. O seu sobrinho-neto, Caio Otaviano, foi feito seu herdeiro em testamento. Em 27 a.C., o jovem passaria para a história como Augusto, o primeiro imperador romano, adotando o título de César e reivindicando para si o seu legado político.",
]
sections = [
  { "title" = "Infância e carreira inicial", "paragraphs" = [
      "Júlio César nasceu em uma família patrícia, a gente Júlia, que afirmava ser descendente de Ascânio, filho do legendário troiano Eneias, que por sua vez era, segundo a mitologia romana, filho da deusa Vênus. O seu cognome \"César\" se originou, de acordo com Plínio, o Velho, com um ancestral seu nascido de cesariana (palavra do latim que quer dizer \"cortar\", caedere, caes). A História Augusta sugere três razões para o seu nome: a primeira é que César nasceu com muito cabelo (em latim caesaries); que tinha olhos cinza bem claro (em latim: oculis caesiis); ou que matou um elefante (caesai) em batalha. O próprio César mandou fabricar moedas com retrato de elefantes, sugerindo que favorecia esta interpretação do seu nome.",
      "Apesar de pertencer a uma família tradicional da aristocracia romana, os Júlios Césares (Julii Caesares) não eram muito influentes politicamente em Roma, apesar de que, no século anterior, membros desta família conseguiram altos cargos na República. O pai de César, também chamado Caio Júlio César, governou a província da Ásia, e sua tia Júlia era casada com o general Caio Mário, uma das figuras políticas mais importantes em Roma naquela época. Sua mãe, Aurélia Cota, era membro influente na família. Pouco é sabido sobre a infância de César.",
      "Em 85 a.C., o pai de César morreu subitamente. Assim, aos 16 anos, tornou-se o chefe da família. Ao mesmo tempo, eclodiu uma guerra civil entre o seu tio, Caio Mário, e o seu rival, o general Sula. Ambos os lados realizaram expurgos, quando puderam, dos partidários do seu adversário, incluindo nas famílias deles. Enquanto Mário e seu aliado, Lúcio Cornélio Cina, estavam no controle da cidade, César foi nomeado como o novo alto-sacerdote de Júpiter, e então casou-se com a filha de Cina, Cornélia. Após a vitória final de Sula, as conexões de César com o regime de Mário fizeram dele um alvo do novo governo: foi despojado de sua herança, do dote de sua esposa e do seu sacerdócio, mas se recusou a se divorciar de Cornélia e foi forçado a fugir e se esconder. A ameaça contra ele minguou depois que uma investigação na família de sua mãe mostrou que alguns deles apoiaram Sula e eram vestais. Sula desistiu de perseguir César, mas afirmou que viu muito de Mário nele.",
    ] },
  { "title" = "Cônsul e campanhas militares", "paragraphs" = [
      "Em 60 a.C., César tentou se candidatar para as eleições para cônsul no ano seguinte, junto com outros dois candidatos. A eleição foi sórdida – até Catão, com sua reputação de incorruptibilidade, teria partido para subornos para tentar favorecer os oponentes de César. Ainda assim venceu, junto com o conservador Marco Calpúrnio Bíbulo. César já estava em dívida política com Crasso, mas também se aproximou de Pompeu. Pompeu e Crasso já não se entendiam bem como antes, então César tentou reconciliá-los. Os três tinham dinheiro e influência política suficiente para controlar a vida pública da nação. Esta aliança informal, que ficou conhecida como Primeiro Triunvirato (\"governo de três\"), foi consolidada pelo casamento entre Pompeu e a filha de César, Júlia. César também se casou novamente, com Calpúrnia Pisão, filha do poderoso senador Lúcio Calpúrnio Pisão Cesonino.",
      "César então propôs uma redistribuição de terras públicas, pela força se necessário, para beneficiar os mais pobres. Pompeu e Crasso apoiaram a proposta, tornando público o triunvirato. Pompeu encheu as ruas de tropas, com o objetivo de intimidar os inimigos dos triúnviros. Bíbulo declarou que os presságios eram desfavoráveis e tentou anular a nova lei, mas foi afastado do senado por homens armados a mando de César e forçado a aposentar-se. Bíbulo não foi o único que sofreu com a repressão. Qualquer um que mostrasse oposição às ideias do Triunvirato (especialmente as de César) era preso.",
      "Quando César foi eleito para cônsul, a aristocracia tentou limitar seu poder futuro, especialmente para evitar que tivesse comando militar. Porém, com a ajuda de aliados, César foi nomeado governador da Gália Cisalpina (norte da Itália) e Ilírico (sudeste da Europa), com a Gália Transalpina (sul da França) sendo adicionada mais tarde, dando-lhe comando de quatro legiões completas. Seu mandato de governador seria de cinco anos e, com o cargo, teria imunidade processual. Quando seu consulado terminou, César fugiu para suas províncias para evitar ser processado por irregularidades cometidas em seu mandato.",
    ] },
  { "title" = "Governo", "paragraphs" = [
      "Enquanto ainda estava em uma campanha na Hispânia, o senado concedera diversas honras a César. Ele preferiu não se vingar dos inimigos, preferindo perdoar a maioria deles. Por parte da população comum não havia uma forte oposição. Grandes jogos e celebrações aconteceram em abril para celebrar sua vitória em Munda. Plutarco escreveu que muitos romanos acreditavam que aquela celebração foi de mau gosto, pois foi uma vitória contra outros romanos, no meio de uma guerra civil. Quando César retornou à Itália, em 45 a.C., protocolou oficialmente seu testamento, nomeando seu sobrinho-neto Caio Otávio (ou Otaviano, mas que viria a ser conhecido como Augusto César) como seu principal herdeiro, deixando-lhe diversas propriedades e vastas quantidades de dinheiro. César escreveu também que caso Otávio morresse antes dele, Décimo Júnio Bruto Albino seria o seu próximo herdeiro. No testamento também deixou presentes e dinheiro para os cidadãos de Roma.",
      "Durante o começo da sua carreira, César testemunhou o quão disfuncional e caótica a República Romana se tornara. A máquina republicana havia quebrado sob o peso do imperialismo, perda de poder das autoridades centrais na capital, com as províncias se tornando praticamente principados independentes sob controle total dos governadores e ainda com o exército profundamente polarizado e sendo usado para fins políticos. Com o governo central enfraquecido, a corrupção política havia saído do controle e o status quo era mantido por uma aristocracia corrupta que não via necessidade de mudar um sistema que perpetuava suas riquezas.",
      "Entre a travessia do rio Rubicão em 49 a.C. e o seu assassinato em 44 a.C., César estabeleceu uma nova constituição, que deveria alcançar três objetivos. Primeiro, queria suprimir toda a resistência armada fora nas províncias e assim trazer a ordem de volta ao país. Segundo, queria construir um governo forte em Roma. Terceiro e finalmente, queria unir o império em uma única unidade coesa. Este primeiro objetivo foi conquistado quando César derrotou Pompeu e seus partidários no senado. As outras duas metas, para consegui-las, assumiu que precisaria de poder absoluto e que este fosse incontestável, então aumentou sua própria autoridade em detrimento de outras instituições políticas. Por fim, anunciou dezenas de medidas reformistas para reerguer o país, que foram desde a alteração do calendário até a redistribuição de terras.",
    ] },
  { "title" = "Vida pessoal", "paragraphs" = [
      "O historiador Suetônio descreve Júlio César como \"alto em estatura com uma pele clara, membros bem torneados, um rosto cheio e olhos negros penetrantes.\" (em latim: excelsa statura, colore candido, teretibus membris, ore paulo pleniore, nigris vegetisque oculis.) Uma fala de uma peça de William Shakespeare teria dito que César era surdo de um ouvido. Nenhuma fonte antiga relata isso. Shakespeare pode ter se baseado na passagem metafórica de Plutarco que não se refere à surdez, tendo mais a ver com um hábito de Alexandre da Macedônia. Ao cobrir sua orelha, Alexandre indicava que havia desviado sua atenção da acusação para poder ouvir a defesa.",
      "Com base em Plutarco, acredita-se que César sofria de epilepsia. Historiadores modernos se dividem neste assunto, com alguns afirmando que sofria de malária. Muitos especialistas em medicina acreditam que em vez de epilepsia provavelmente teria apenas enxaquecas muito fortes. Outros afirmavam que os surtos de epilepsia eram causados por uma infecção parasitária no cérebro por cestoda.",
      "César teve quatro episódios documentados de ataques epiléticos. Pode ter tido uma 'crise de ausência' na sua juventude. Os primeiros casos de epilepsia foram relatados pelo historiador Suetônio, que nasceu depois da morte de César. Alguns historiadores afirmam que César poderia ter na verdade hipoglicemia, que também pode causar ataques epiléticos. Em 2003, o psiquiatra Harbour F. Hodder publicou o que denominou como a teoria do \"Complexo de César\", argumentando que o general romano sofria de epilepsia do lobo temporal e os sintomas debilitantes da condição eram um dos fatores de César ignorar sua segurança pessoal nos dias que antecederam sua morte.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Os textos escritos de César, uma autobiografia dos eventos mais importantes de sua vida, são as mais completas fontes primárias para a reconstrução da sua biografia. Contudo, César escreveu sua história pensando em sua carreira política, então os historiadores tiveram muito trabalho para filtrar os exageros e parcialidades contidas nela. O imperador Augusto começou o culto à personalidade a César, descrevendo-se como seu herdeiro. A historiografia moderna é influenciada pelas tradições de Augusto, como por exemplo a ascensão de César sendo considerada o ponto determinante para o nascimento do Império Romano. Ainda assim, os historiadores também têm que filtrar muitos dos contos de Augusto.",
      "Muitos governantes ao longo da história se tornaram interessados na historiografia de César. Napoleão III escreveu um inacabado trabalho acadêmico chamado \"História de Júlio César\" (em francês: Histoire de Jules César). Carlos VIII ordenou que um monge preparasse uma tradução dos Comentários da Guerra Gálica em 1480. Carlos I de Espanha ordenou um estudo topográfico na França, para dar contexto ao livro escrito por César sobre a conquista do país. O sultão otomano Solimão, o Magnífico catalogou as edições sobreviventes dos Comentários, e então os traduziu para o turco. Henrique IV e Luís XIII traduziram os primeiros Comentários, enquanto Luís XIV os retraduziu mais tarde.",
      "Júlio César é visto como o principal exemplo do Cesarismo, uma forma política de governo com um líder carismático e forte que governa baseado no culto à personalidade, cuja racionalidade é governar pela força, estabelecendo uma violenta ordem social, sendo envolvido no regime de proeminência militar no governo. Outras pessoas na história, como o imperador francês Napoleão Bonaparte e o ditador italiano Benito Mussolini, foram definidos como 'cesaristas'. Bonaparte não se focou apenas na carreira militar de César, mas também na sua relação com as massas, que se tornou um precedente do populismo. A palavra \"cesarismo\" é usada também em um sentido pejorativo contra líderes autocráticos.",
    ] },
]

