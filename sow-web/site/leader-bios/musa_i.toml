[articles.en]
text = "Mansa Musa was the ninth Mansa of the Mali Empire, which reached its territorial peak during his reign. Musa's reign is often regarded as the zenith of Mali's power and prestige, although he features less in Mandinka oral traditions than his predecessors."
title = "Mansa Musa"
lang = "en"
url = "https://en.wikipedia.org/wiki/Mansa_Musa"
intro = [
  "Mansa Musa (c. 1280 – c. 1337) was the ninth Mansa of the Mali Empire, which reached its territorial peak during his reign. Musa's reign is often regarded as the zenith of Mali's power and prestige, although he features less in Mandinka oral traditions than his predecessors.",
  "Musa was exceptionally wealthy, to an extent that contemporaries described him as inconceivably rich; Time magazine reported: \"There's really no way to put an accurate number on his wealth.\" They cite Ferrum College history professor Richard Smith, who said Mali was likely the largest gold producer in the world at the time, but \"contemporary sources describe the king's riches in terms that are impossible for the time.\"",
  "It is known from local manuscripts and travellers' accounts that Mansa Musa's wealth came principally from the Mali Empire's control and taxing of the trade in salt from northern regions and especially from gold panned and mined in Bambuk and Bure to the south. Over a very long period Mali had amassed a large reserve of gold. Mali is also believed to have been involved in the trade in many goods such as ivory, slaves, spices, silks, and ceramics. However, presently little is known about the extent or mechanics of these trades. It is estimated that two thirds of the gold circulating in the Medieval Mediterranean came from West Africa and this accounts for almost half of the Old World's gold supply.",
  "Archeological investigations near the town of Tadmekka shows Malians invented their own process of refining gold by using melted glass and removing impurities. While gold was abundant, copper was incredibly scarce and prized in Sub-Saharan Africa and \"was exchanged for gold at rates that would be considered unfair by present-day standards.\" At the time of Musa's ascension to the throne, Mali consisted largely of the territory of the former Ghana Empire, which had become a vassal of Mali. The Mali Empire comprised land that is now part of Guinea, Senegal, Mauritania, the Gambia, and the modern state of Mali which would be an area of 1,300,000 km2.",
]
sections = [
  { "title" = "Name and titles", "paragraphs" = [
      "Mansa Musa's personal name was Musa (Arabic: موسى, romanized: Mūsá), the name of Moses in Islam. Mansa, 'ruler' or 'king' in Mandé, was the title of the ruler of the Mali Empire.",
      "In oral tradition and the Timbuktu Chronicles, Musa is further known as Kanku Musa. In Mandé tradition, it was common for one's name to be prefixed by his mother's name, so the name Kanku Musa means \"Musa, son of Kanku\", although it is unclear whether the genealogy implied is literal. Al-Yafii gave Musa's name as Musa ibn Abi Bakr ibn Abi al-Aswad (Arabic: موسى بن أبي بكر بن أبي الأسود, romanized: Mūsā ibn Abī Bakr ibn Abī al-Aswad), and Ibn Hajar gave Musa's name as Musa ibn Abi Bakr Salim al-Takruri (Arabic: موسى بن أبي بكر سالم التكروري, romanized: Mūsā ibn Abī Bakr Salim al-Takruri).",
      "Musa is often given the title Hajji in oral tradition because he made the hajj. In the Songhai language, rulers of Mali such as Musa were known as the Mali-koi, koi being a title that conveyed authority over a region: in other words, the \"ruler of Mali\".",
    ] },
  { "title" = "Lineage", "paragraphs" = [
      "According to Djibril Tamsir Niane, Musa's father was named Faga Leye and his mother may have been named Kanku. Faga Leye was the son of Abu Bakr, a brother of Sunjata, the first mansa of the Mali Empire. Ibn Khaldun does not mention Faga Leye, referring to Musa as Musa ibn Abu Bakr. This can be interpreted as either \"Musa son of Abu Bakr\" or \"Musa descendant of Abu Bakr.\" It is implausible that Abu Bakr was Musa's father, due to the amount of time between Sunjata's reign and Musa's.",
      "Ibn Battuta, who visited Mali during the reign of Musa's brother Sulayman, said that Musa's grandfather was named Sariq Jata. Sariq Jata may be another name for Sunjata, who was actually Musa's great-uncle. This, along with Ibn Khaldun's use of the name 'Musa ibn Abu Bakr' prompted historian Francois-Xavier Fauvelle to propose that Musa was in fact the son of Abu Bakr I, a grandson of Sunjata through his daughter. Later attempts to erase this possibly illegitimate succession through the female line led to the confusion in the sources over Musa's parentage. Hostility towards Musa's branch of the Keita dynasty would also explain his relative absence from or scathing treatment by oral histories.",
    ] },
  { "title" = "Early life and accession to power", "paragraphs" = [
      "The date of Musa's birth is unknown, but he appears to have been a young man in 1324. The Tarikh al-fattash claims that Musa accidentally killed Kanku at some point prior to his hajj.",
      "Musa ascended to power in the early 1300s under unclear circumstances. According to Musa's own account, his predecessor as Mansa of Mali, presumably Muhammad ibn Qu, launched two expeditions to explore the Atlantic Ocean (200 ships for the first exploratory mission and 2,000 ships for the second). The Mansa led the second expedition himself and appointed Musa as his deputy to rule the empire until he returned. When he did not return, Musa was crowned as mansa himself, marking a transfer of the line of succession from the descendants of Sunjata to the descendants of his brother Abu Bakr. Some modern historians have cast doubt on Musa's version of events, suggesting he may have deposed his predecessor and devised the story about the voyage to explain how he took power. Nonetheless, the possibility of such a voyage has been taken seriously by several historians.",
    ] },
  { "title" = "Early reign", "paragraphs" = [
      "Musa was a young man when he became Mansa, possibly in his early twenties. Given the grandeur of his subsequent hajj, Musa likely spent much of his early reign preparing for it. Among these preparations would likely have been raids to capture and enslave people from neighboring lands, as Musa's entourage would include many thousands of slaves; the historian Michael Gomez estimates that Mali may have captured over 6,000 slaves per year for this purpose. Perhaps because of this, Musa's early reign was spent in continuous military conflict with neighboring non-Muslim societies. In 1324, while in Cairo, Musa said that he had conquered 24 cities and their surrounding districts.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Musa's reign is commonly regarded as Mali's golden age, but this perception may be the result of his reign being the best recorded by Arabic sources, rather than him necessarily being the wealthiest and most powerful mansa of Mali. The territory of the Mali Empire was at its height during the reigns of Musa and his brother Sulayman, and covered the Sudan-Sahel region of West Africa.",
      "Musa is less renowned in Mandé oral tradition as performed by the jeliw. He is criticized for being unfaithful to tradition, and some of the jeliw regard Musa as having wasted Mali's wealth. However, some aspects of Musa appear to have been incorporated into a figure in Mandé oral tradition known as Fajigi, which translates as \"father of hope\". Fajigi is remembered as having traveled to Mecca to retrieve ceremonial objects known as boliw, which feature in Mandé traditional religion. As Fajigi, Musa is sometimes conflated with a figure in oral tradition named Fakoli, who is best known as Sunjata's top general. The figure of Fajigi combines both Islam and traditional beliefs.",
      "The name \"Musa\" has become virtually synonymous with pilgrimage in Mandé tradition, such that other figures who are remembered as going on a pilgrimage, such as Fakoli, are also called Musa.",
    ] },
]

