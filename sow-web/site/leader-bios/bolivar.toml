[articles.en]
text = "Simón José Antonio de la Santísima Trinidad Bolívar Palacios Ponte y Blanco was a Venezuelan military officer and statesman who led what are currently the countries of Bolivia, Colombia, Ecuador, Panama, Peru, and Venezuela to independence from the Spanish Empire. He is known colloquially as El Libertador, \"the Liberator\", of America."
title = "Simón Bolívar"
lang = "en"
url = "https://en.wikipedia.org/wiki/Sim%C3%B3n_Bol%C3%ADvar"
intro = [
  "Simón José Antonio de la Santísima Trinidad Bolívar Palacios Ponte y Blanco (24 July 1783 – 17 December 1830) was a Venezuelan military officer and statesman who led what are currently the countries of Bolivia, Colombia, Ecuador, Panama, Peru, and Venezuela to independence from the Spanish Empire. He is known colloquially as El Libertador, \"the Liberator\", of America.",
  "Bolívar was born in Caracas in the Captaincy General of Venezuela into a wealthy family of South American-born Spaniards (criollo) but lost both parents as a child. He was educated abroad and lived in Spain, as was common for men of upper-class families in his day. While living in Madrid from 1800 to 1802, he was introduced to Enlightenment philosophy and married María Teresa Rodríguez del Toro y Alaysa, who died in Venezuela from yellow fever in 1803. From 1803 to 1805, Bolívar embarked on a Grand Tour that ended in Rome, where he swore to end Spanish rule in the Americas. In 1807, Bolívar returned to Venezuela and promoted Venezuelan independence to other wealthy creoles. When Napoleon's Peninsular War weakened Spanish authority, Bolívar became a zealous combatant and politician in the Spanish American wars of independence.",
  "Bolívar began his military career in 1810 as a militia officer in the Venezuelan War of Independence, fighting Royalist forces for the first and second Venezuelan republics and the United Provinces of New Granada. After Spanish forces subdued New Granada in 1815, Bolívar was forced into exile on Jamaica. In Haiti, Bolívar met and befriended Haitian revolutionary leader Alexandre Pétion. After promising to abolish slavery in Spanish America, Bolívar received military support from Pétion and returned to Venezuela. He established a third republic in 1817, and crossed the Andes to liberate New Granada in 1819. Bolívar and his allies defeated the Spanish in New Granada in 1819, Venezuela and Panama in 1821, Ecuador in 1822, Peru in 1824, and Bolivia in 1825. Venezuela, New Granada, Ecuador, and Panama were merged into the Republic of Colombia (Gran Colombia), with Bolívar as president there and in Peru and Bolivia.",
  "In his final years, Bolívar became increasingly disillusioned with the South American republics. He was successively removed from his offices until he resigned the presidency of Colombia and died of tuberculosis in 1830. His legacy is diverse and far-reaching within Latin America and beyond. He is regarded as a hero and national and cultural icon throughout Latin America. The nations of Bolivia and Venezuela (as the Bolivarian Republic of Venezuela) are named after him, and he has been memorialized all over the world in the form of public art or street names and in very popular culture.",
]
sections = [
  { "title" = "Early life and family", "paragraphs" = [
      "Simón Bolívar was born on 24 July 1783 in Caracas, capital of the Captaincy General of Venezuela, the fourth and youngest child of Juan Vicente Bolívar y Ponte and María de la Concepción Palacios y Blanco. He was baptized as Simón José Antonio de la Santísima Trinidad Bolívar y Palacios on 30 July. The first of Bolívar's family to have emigrated to the Americas was a similarly named minor Spanish governmental official named Simón de Bolívar, who had been a notary in Spain's Basque Country, and who had later arrived in Venezuela in the 1580s. The earlier Simón de Bolívar's descendants had served in the colonial bureaucracy and had married into various wealthy Caracas families over the years. By the time Simón Bolívar was born, the Bolívar family was one of the wealthiest and most prestigious criollo (creole) families in the Spanish Americas.",
      "Simón Bolívar's childhood was described by British historian John Lynch as \"at once privileged and deprived\". Juan Vicente died of tuberculosis on 19 January 1786, leaving María de la Concepción Palacios and her father, Feliciano Palacios y Sojo, as legal guardians over the Bolívar children's inheritances. Those children – María Antonia (born 1777), Juana (born 1779), Juan Vicente (born 1781), and Simón – were raised separately from each other and their mother, and, following colonial custom, by African house slaves; Simón was raised by a slave named Hipólita whom he viewed as both a motherly and fatherly figure. On 6 July 1792, María de la Concepción also died of tuberculosis. Believing that his family would inherit the Bolívars' wealth, Feliciano Palacios arranged marriages for María Antonia and Juana and, before dying on 5 December 1793, assigned custody of Juan Vicente and Simón to his sons, Juan Félix Palacios and Carlos Palacios y Blanco, respectively. Bolívar came to loathe Carlos Palacios, who had no interest in the boy other than his inheritance.",
      "As a child, Bolívar was notoriously unruly and neglected his studies. Before his mother died, he spent two years under the tutelage of the Venezuelan lawyer Miguel José Sanz at the direction of the Real Audiencia of Caracas, the Spanish court of appeals in Caracas. In 1793, Carlos enrolled Bolívar at a rudimentary primary school run by Venezuelan educator Simón Rodríguez. In June 1795, Bolívar fled his uncle's custody for the house of his sister María Antonia and her husband. The couple sought formal recognition of his change of residence, but the Real Audiencia decided the matter in favor of Palacios, who sent Simón to live with Rodríguez.",
    ] },
  { "title" = "Political and military career", "paragraphs" = [
      "By April 1806, Bolívar had returned to Paris and desired passage to Venezuela, where Venezuelan revolutionary Francisco de Miranda had just attempted an invasion with American volunteers. Britain's command of the sea after the 1805 Battle of Trafalgar obliged Bolívar to board an American ship in Hamburg in October 1806. Bolívar arrived in Charleston, South Carolina, in January 1807, and from there traveled to Washington, D.C., Philadelphia, New York City, and Boston. Bolívar then returned to Philadelphia and sailed for Venezuela, where he arrived in June 1807. He began to meet with other creole elites to discuss independence from Spain. Finding himself to be far more radical than the rest of Caracas high society, however, Bolívar occupied himself with a property dispute with a neighbor, Antonio Nicolás Briceño.",
      "In 1807–08, Napoleon invaded the Iberian peninsula and replaced the rulers of Spain with his brother, Joseph. This news arrived in Venezuela in July 1808. Napoleonic rule was rejected and Venezuelan creoles, though still loyal to Ferdinand VII of Spain, sought to form their own local government in place of the existing Spanish government. On 24 November 1808, a group of creoles presented a petition demanding an independent government to Juan de Casas, the Captain-General of Venezuela, and were arrested. Bolívar, though he did not sign the petition and thus was not arrested, was warned to cease hosting or attending seditious meetings. In May 1809, Casas was replaced by Vicente Emparán and his staff, which included Fernando Rodríguez del Toro. The creoles also resisted Emparán's government, despite his friendlier disposition towards them.",
      "By February 1810, French victories in Spain prompted the dissolution of the anti-French Spanish government in favor of a five-man regency council for Ferdinand VII. This news, and two delegates that included Carlos de Montúfar, arrived in Venezuela on 17 April 1810. Two days later, the creoles succeeded in deposing and then expelling Emparán, and created the Supreme Junta of Caracas, independent from the Spanish regency but not Ferdinand VII. Absent from Caracas for the coup, Bolívar and his brother returned to the city and offered their services to the Supreme Junta as diplomats. In May 1810, Juan Vicente was sent to the United States to buy weapons, while Simón secured a place in a diplomatic mission to Britain with the lawyer Luis López Méndez and Andrés Bello by paying for the mission. The trio boarded a British ship in June 1810 and arrived at Portsmouth on 10 July 1810.",
    ] },
  { "title" = "Death and burial", "paragraphs" = [
      "Determined to go into exile, Bolívar, who had given away or lost his fortune over his career, sold most of his remaining possessions and departed from Bogotá on 8 May 1830. He traveled down the Magdalena to Cartagena, where he arrived by the end of June to wait for a ship to take him to England. On 1 July, Bolívar was informed that Sucre had been assassinated near Pasto while en route to Quito, and wrote to Flores to ask him to avenge Sucre. In September, Urdaneta installed a conservative government in Bogotá and asked Bolívar to return, but he refused. With his health deteriorating and no ship forthcoming, Bolívar was moved by his staff to Barranquilla in October and then, at the invitation of a Spanish landowner in the area, to the Quinta de San Pedro Alejandrino near Santa Marta. There, on 17 December 1830, at the age of 47, Bolívar died of tuberculosis.",
      "Bolívar's body, dressed in a borrowed shirt, was interred in the Catedral Basílica de Santa Marta on 20 December 1830. In 1842, Páez secured the repatriation of Bolívar's remains, which were paraded through Caracas and then laid to rest in the cathedral in December together with his wife and parents; Bolívar's heart remained in Santa Marta. His remains were moved again in October 1876 into the National Pantheon of Venezuela in Caracas, created that year by President Antonio Guzmán Blanco.",
      "Bolívar's death has been the subject of conspiracy theories advanced by the United Socialist Party of Venezuela. In January 2008, President Hugo Chávez set up a commission to investigate his claim that Bolívar had been poisoned by \"New Granada traitors\". The commission exhumed Bolívar's remains on 16 July 2010. The results, made public on 26 July 2011, were inconclusive; vice president Elías Jaua announced that the commission could not prove Chávez's claim. Chávez continued to claim that Bolívar had been assassinated via arsenic poisoning, citing a paper by infectious disease specialist Paul Auwaerter. Following Chávez's remarks, Auwaerter stated that the arsenic likely came from medicines Bolívar had ingested to treat his illnesses.",
    ] },
  { "title" = "Personal beliefs", "paragraphs" = [
      "Bolívar's personal beliefs were scattered, rife with changing perspectives, as his campaign evolved. His politics were primarily motivated by the intellectual output of the French Revolution, and he himself aligned with republicanism, shaping it into a singular powerful executive authoritarianism, motivated by fear of racial division and royalist infiltration, the structure of which he derived from Classical and Enlightenment philosophy; among his favorite authors were Thomas Hobbes, Baruch Spinoza, the Baron d'Holbach, David Hume, Montesquieu, and especially Jean-Jacques Rousseau. The tutelage of Simón Rodríguez, a student of Rousseau, has been traditionally seen as foundational for Bolívar's beliefs. Also important to Bolívar's intellectual development were his stays in Paris from 1804 to 1806 and in London in 1810. The extent of Bolívar's religiosity is debated; while Bolívar resented the social capital of the Catholic Church and its Royalist leanings during the wars of independence, he sought to co-opt its social capital for the benefit of the republics he established rather than dismember the Church.",
      "Bolívar's political and personal beliefs evolved in writing throughout his life, visible through a series of manifestos and congressional addresses written between 1812 and 1819. These would be named the Jamaica Letter, Cartagena Manifesto, and Angostura Address. The Jamaica Letter was said to be a \"blueprint of Bolívar's political thought\" while the Cartagena Manifesto as \"one of the great documents of Latin American history\". Throughout his political career, Bolívar concerned himself with the construction of revolutionary republics in Latin America and the region's place in the Atlantic world. Through the 1820s, Bolívar became increasingly disillusioned and authoritarian until, in 1830, he declared to Flores, \"all who have served the Revolution have plowed the sea.\"",
      "Bolívar also sought British aid against the Spanish Empire to secure Latin American independence. By the 1820s, his goal was to create a federation of Latin American revolutionary republics, each governed by a strong mutual executive like the United states of America, and a constitution modeled largely on the British constitution. Inspired by Montesquieu, Bolívar believed that a government should conform to the needs and character of its region and inhabitants; in the Cartagena Manifesto, Bolívar stated that federalism as practiced in the United States was the \"perfect\" government but was unworkable in Spanish America, because he believed Spanish imperialism had left Spanish Americans unprepared for federalism; \"as long as we do not have the political virtues that distinguish our brothers of the north, a democratic system… can only bring us ruin.\" Bolívar sought to prepare Colombia in particular for a more liberal democracy via free, public education. At the Angostura Address, he argues for the abolition of slavery and a concession to pardo, mixed race and black rights. He envisioned a racially united Latin America to drive out the Spaniards and create a free South America with a common people.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Bolívar has had an immense legacy, becoming the essential personality of Latin America. The currencies of Venezuela and Bolivia—the bolívar and boliviano respectively—are named after Bolívar. In the English-speaking world, Bolívar is known as Latin America's George Washington. He has been memorialized across the world in literature, public monuments, and historiography, and paid tribute to in the names of towns, cities, provinces, ships, and people.",
      "The Quinta near Santa Marta has been preserved as a museum to Bolívar and the house in which he was born was opened as a museum and archive of his papers on 5 July 1921. In 1978, UNESCO created the International Simón Bolívar Prize \"to reward an activity of outstanding merit in accordance with the ideals of Simón Bolívar\". In 1997, the Archive of the Liberator Simón Bolívar was inscribed by UNESCO in the Memory of the World International Register and in the Regional Register for Latin America and the Caribbean in 2011.",
      "Initial historical evaluations of Bolívar were at first negative, consisting of criticism of his conduct of the war, execution of Piar, betrayal of Miranda, and authoritarianism. These and other criticisms endure in studies of Bolívar. Beginning in 1842, popular opinion about Bolívar in Venezuela became overwhelmingly positive and eventually became what has been described by scholars as the \"cult of Bolívar\", led by succeeding heads of the Venezuelan state. In 1998, President Hugo Chávez, who had made extensive use of Bolívar's image for government projects and initiatives, changed the official name of Venezuela to the Bolivarian Republic of Venezuela.",
    ] },
]

[articles.ja]
text = "シモン・ボリバル（Simón Bolívar [siˈmom boˈliβaɾ] ( 音声ファイル)）、全名シモン・ホセ・アントニオ・デ・ラ・サンティシマ・トリニダード・ボリバル・ポンテ・イ・パラシオス・ブランコ（Simón José Antonio de la Santísima Trinidad Bolívar Ponte y Palacios Blanco、1783年7月24日 - 1830年12月17日）は、南米大陸のアンデス5か国をスペインから独立に導き、統一したコロンビア共和国を打ちたてようとした革命家、軍人、政治家、思想家である。 ベネズエラのカラカスに南米大陸屈指の名家の男子として生まれたが、早いうちに妻を亡くしたことがきっかけとなって、その後の生涯をラテンアメリカの人々の解放と統一に捧げた。このため、ラテンアメリカでは「解放者」 (El Libertador) とも呼ばれる。"
title = "シモン・ボリバル"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B7%E3%83%A2%E3%83%B3%E3%83%BB%E3%83%9C%E3%83%AA%E3%83%90%E3%83%AB"
intro = [
  "シモン・ボリバル（Simón Bolívar [siˈmom boˈliβaɾ] ( 音声ファイル)）、全名シモン・ホセ・アントニオ・デ・ラ・サンティシマ・トリニダード・ボリバル・ポンテ・イ・パラシオス・ブランコ（Simón José Antonio de la Santísima Trinidad Bolívar Ponte y Palacios Blanco、1783年7月24日 - 1830年12月17日）は、南米大陸のアンデス5か国をスペインから独立に導き、統一したコロンビア共和国を打ちたてようとした革命家、軍人、政治家、思想家である。",
  "ベネズエラのカラカスに南米大陸屈指の名家の男子として生まれたが、早いうちに妻を亡くしたことがきっかけとなって、その後の生涯をラテンアメリカの人々の解放と統一に捧げた。このため、ラテンアメリカでは「解放者」 (El Libertador) とも呼ばれる。",
]
sections = [
  { "title" = "幼少期・青年期", "paragraphs" = [
      "ボリバルは1783年、現在のベネズエラ、カラカスのクリオーリョの名家に生まれた。ボリバル家は、16世紀にビスカヤからベネズエラに移住したバスク人の家系である。幼くして両親を亡くした が、アメリカ大陸有数の資産家ボリバル家の男子としてさまざまな家庭教師を付けられた。このときの教師の1人シモン・ロドリゲスの考えがボリバルに大きな影響を与えている。さらに教育を受けるため、1799年にスペインで任官していたおじを頼ってヨーロッパに渡り、修学のためヨーロッパを旅行している。ドイツ人の自然学者アレクサンダー・フォン・フンボルトに南米独立にかける思いを語って一笑に付されるなどの屈辱的な経験もあったが、遊学中にスペインでマリア (María Teresa Rodríguez del Toro y Alaysa) と知り合うと、1802年に現地で結婚し、彼女を連れてベネスエラに帰国した。しかし翌1803年、熱帯の気候に耐えられなかったマリアは黄熱病でその生涯を閉じ、以降ボリバルは深い喪失感を抱いて生涯再婚することはなかった。1804年に傷心のままヨーロッパに戻り、しばらくはナポレオンに仕えたが、このころの南アメリカでのスペインからの独立の機運を機に、祖国ベネズエラの独立を志すようになったといわれている。",
    ] },
  { "title" = "独立戦争", "paragraphs" = [
      "1806年にベネズエラ出身の元スペイン軍人フランシスコ・デ・ミランダがベネズエラ解放のための戦争を始めると、ボリバルはこれに興味を抱き、1807年にベネズエラに帰国した。南アメリカは1,400万人の人口を擁し、ヨーロッパ人と現地人の混血が進んでいた。",
      "その後、1808年にナポレオンがスペインに侵入して兄のジョゼフ・ボナパルトをスペイン王ホセ1世として擁立した際、ボリバルは反王政派（愛国連盟）に加わった。1810年4月19日、カラカスは植民地の自治を実行するための議会を設置。ボリバルはイギリスに革命の支持を取り付けるために派遣された。イギリスでの活動目的は、スペイン植民地独立運動の説明と万が一の場合の武器などの支援を受けられるように働きかけることであった。資産以外に何の後ろ盾もなかったボリバルのイングランド説得は不成功に終わったが、ボリバルはイギリスの政治制度から多くを学び、後年世界で最も優れた政治体制は君主制を除いてイギリスのものだと語っている。",
      "ボリバルは1811年にベネズエラに帰国、3月に開かれた制憲会議で演説を行った。同年7月に、制憲会議がベネズエラの独立を宣言。ボリバルはベネズエラ国軍に入隊した。ボリバルはプエルト・カベロの要塞の守備をしていたが、将校の裏切りにより要塞がスペイン軍の手に渡ってしまった。さらに同年起こったカラカス地震による被害は大きく、1812年7月、カラカスは再びスペイン軍に占領されてしまう。これを重く見たミランダはスペインと休戦（事実上の降伏）したが、ボリバルは徹底抗戦を誓って裏切り者のミランダをスペイン軍に引き渡し、12月にはヌエバ・グラナダ連合州（1810年 - 1816年）が支配していた現コロンビアのカリブ海沿岸の都市カルタヘナに向った。",
    ] },
  { "title" = "ペルー解放と独立戦争の終結", "paragraphs" = [
      "1822年、ボリバルはエクアドル方面の攻略を本格化させる。ボリバルの率いる部隊が山間部からエクアドルに侵入し、ボリバルの部下であったベネズエラ人のアントニオ・ホセ・デ・スクレが太平洋側からエクアドルに進んだ。スクレの部隊は 1822年5月24日にピチンチャの戦いで勝利を収め、翌日にはキトに入城を果たした。ボリバルもキトに合流し、ここにエクアドルの解放を果たした。また、ここで「永遠の愛人」となるマヌエラ・サエンスと出会うことになった。",
      "このころ、アルゼンチンのホセ・デ・サン・マルティン将軍は、チリの独立指導者ベルナルド・オイヒンスや、スコットランドの元英王立海軍軍人トマス・コクランらの力を借りて、アルゼンチンのメンドーサからアンデス山脈越えをもってチリを解放し、そこから海路ペルーまで進み、初代ペルー護国官となって南から解放戦争を進めていた。しかし、このペルー共和国の支配権は海岸部に限定され、アルト・ペルー（現ボリビア）に拠点を置くスペイン軍とペルー副王のラセルナは抵抗を続けてサン・マルティンを翻弄し、ペルー第一共和国の崩壊が迫っていた。",
      "このため、サン・マルティンは大コロンビア軍に支援を求めようとした。ボリバルはこの思わぬもう一人の解放者に出くわしたことを喜び、解放されたグアヤキルで1822年7月26日にグアヤキル会談を行った。会談の内容は資料が残っておらず詳細は不明であるが、グアヤキル地方の帰属問題とペルーのスペインからの独立の仕方であったといわれている。ボリバルが共和制を望んだのとは対照的に、サン・マルティンはヨーロッパから王を導入して立憲君主制を導入することを望んでいたが、ナポレオンの戴冠によりフランス革命が大失敗したと考えていたボリバルにとって、これは到底受け入れることのできない条件だった。結局、ボリバル軍に加わりたいというサン・マルティンの申し出もボリバルが断ると、サン・マルティンはアルゼンチンに帰国してしまった。この会談ののち、サン・マルティンが軍を率いることは二度となく、1824年にはヨーロッパへと移住してしまった。このため、山岳部に勢力を張るスペイン軍との対決は、以後ボリバルの手にゆだねられることとなった。",
    ] },
  { "title" = "独立後", "paragraphs" = [
      "南アメリカ大陸のすべてのスペイン領が独立したことで独立戦争が終結すると、ボリバルは1824年末、南アメリカ大陸の新独立国家群に独立保全のための協議を行うよう提案した。1826年にこの会議は実現の運びとなり、南北両アメリカ大陸の結節点となる大コロンビア共和国のパナマ市において6月22日から7月15日までパナマ議会が開催された。会議の参加国は大コロンビア、ペルー、中央アメリカ連邦、メキシコの4か国だった。オブザーバーとしてイギリスとオランダが参加したが、アメリカ合衆国は招かれたものの会議に間に合わず結局欠席となった。南アメリカ南部のチリ、アルゼンチン、ブラジルはボリバルの影響力拡大を懸念して参加せず、孤立していたパラグアイにはそもそも招待状が送られなかった。この会議においては参加各国の相互防衛条約が締結され、また市民権の相互承認や域内戦争の禁止、奴隷貿易の禁止などが可決された が、この条約は大コロンビアの議会しか批准せず、ボリバルの構想した相互防衛の枠組みは成立しなかった。",
      "成立した大コロンビアであったが、ペルーやボリビアの解放戦争の戦費負担などで国内経済は疲弊しており、また国内の3地域（ベネズエラ、ヌエバ・グラナダ、キト）の対立は激しく、特にベネズエラとヌエバ・グラナダ間の対立は先鋭化するばかりだった。ベネズエラ地域の実力者であるホセ・アントニオ・パエスと議会との対立は1824年以降先鋭化し、これをおさめるためにボリバルがパエスに融和的な態度を示すと、ヌエバ・グラナダを基盤とするサンタンデールが不満を募らせていった。ボリバルが独立戦争時の経験などから中央集権を求め、カトリック教会を重視し、大統領については終身制が望ましいと考えていたのに対し、サンタンデルは地方分権の連邦制を求め、信教の自由を保障し、大統領は任期制の上再任不可が望ましいとしていたため、路線対立によって対立はさらに深まった。ボリバル派は「追従派」、サンタンデル派は「自由派」と呼ばれるようになり、党派対立は深まるばかりだった。1827年、大コロンビアのベネズエラとヌエバ・グラナダの間で内乱が起きると、鎮圧のためボリバルは1827年1月28日にペルー大統領を辞任し、リマを去った。ボリバルは、あくまで大コロンビア、ラテンアメリカ連合の維持を理想とした。1828年4月にはオカーニャにて大コロンビア国民会議（憲法制定会議）を招集した。この時ボリバルは自派である追従派の多数派工作を行っていたのだが、いざ会議が始まると自由派が多数を占めるようになり、ボリバルのもくろみは外れてしまった。このためボリバルは8月にサンタンデルを解任し、憲法を停止して、独裁権を手中に収める。しかし、翌月には解任されたサンタンデル派によってボリバル暗殺計画が立てられ、ボリバルは大統領宮殿から危機一髪で逃げ出すこととなった。このためボリバルはサンタンデルを国外追放処分としたが、自身の健康状態の悪化などにより事態は流動的になり始めた。",
      "1829年には、ペルー大統領となったアグスティン・ガマーラが現在のエクアドルにあたる地域の領有を要求し、ペルー軍がグアヤキルに侵入した（グラン・コロンビア＝ペルー戦争）。これはスクレによって撃破されたが、もはやボリバルの権威の低下は誰の目にも明らかだった。さらにボリバル配下の将軍ホセ・マリア・コルドバが反乱を起こす。これもまた鎮圧されたが、1829年の秋には、ベネズエラでホセ・アントニオ・パエスが大コロンビアから分離独立を宣言し、1830年に入るとまずベネズエラが正式に完全分離独立を宣言、続いてキトとグアヤキルがエクアドルとして独立した。",
    ] },
]

[articles.ko]
text = "시몬 호세 안토니오 데라산티시마 트리니다드 볼리바르 팔라시오스 블란코(스페인어: Simón José Antonio de la Santísima Trinidad Bolívar Palacios Blanco, 1783년 7월 24일 ~ 1830년 12월 17일)는 베네수엘라 출신의 독립운동가이자 군인, 그란콜롬비아의 초대 대통령이다. 산 마르틴과 함께 라틴 아메리카의 해방자(리베르타도레스, Libertadores)이자 국부로 추앙받고 있다."
title = "시몬 볼리바르"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EC%8B%9C%EB%AA%AC_%EB%B3%BC%EB%A6%AC%EB%B0%94%EB%A5%B4"
intro = [
  "시몬 호세 안토니오 데라산티시마 트리니다드 볼리바르 팔라시오스 블란코(스페인어: Simón José Antonio de la Santísima Trinidad Bolívar Palacios Blanco, 1783년 7월 24일 ~ 1830년 12월 17일)는 베네수엘라 출신의 독립운동가이자 군인, 그란콜롬비아의 초대 대통령이다. 산 마르틴과 함께 라틴 아메리카의 해방자(리베르타도레스, Libertadores)이자 국부로 추앙받고 있다.",
  "무장투쟁을 통하여 식민지였던 파나마, 에콰도르, 콜롬비아, 베네수엘라, 페루, 볼리비아를 스페인으로부터 독립시킨 라틴 아메리카 독립사의 대표적인 인물이자 상징적인 인물이다. 중남미 역사의 근현대사를 논함에 있어서 볼리바르를 빼놓고 이야기 할 수 없다는 평가가 있다. 볼리비아는 볼리바르의 업적을 기리기 위해서 국가명을 그의 이름에서 따왔고 그의 초상화는 화폐속에 등장하며 다수의 국가에서 국제공항, 대학등에 그의 이름을 사용하고 있다.",
  "오랜 식민지배로 인해 정치적으로 미성숙한 남아메리카에는 엘리트 주의 통치방식이 필요하다는 입장을 표방하였기 때문에 독재자라는 평가가 있기는 했지만, 사익을 위해 권력을 남용하지 않았으며 독재와 군국주의를 싫어했고 권력형 비리를 통한 축재나 부정부패를 멀리하였다. 스페인으로부터 독립한 후 미국을 모델로한 남아메리카의 통일국가 건설을 추진했으나 뜻을 이루지는 못한채 정계은퇴후 말년을 조용히 보냈다.",
]
sections = [
  { "title" = "어린 시절", "paragraphs" = [
      "시몬 볼리바르는 1783년에 스페인령 베네수엘라의 수도인 카라카스에서 후안 비센테 볼리바르(Juan Vicente de Bolívar y Ponte)와 마리아 콘셉시온(Maria de la Concepción de Palacios y Blanco) 사이에서 2남 2녀 중 막내로 출생하였다. 그의 집안은 바스크 태생의 에스파냐 출신 가문으로, 5대조 할아버지 돈 시몬은 베네수엘라 총독의 비서로 근무하였다. 그래서 그의 아버지는 자신의 둘째 아들에게 시몬 볼리바르라는 이름을 붙여주었고 로마 가톨릭 사제에게 유아세례를 받도록 했다.",
      "어머니는 건강이 좋지 않은데다가, 남편이 사망한 뒤 건강이 더 악화되어 아이들을 돌보지 못했다. 그래서 시몬은 흑인 여종인 이폴리타의 보살핌을 받으면서 살아야 했는데, 이러한 성장환경은 볼리바르로 하여금 노예제도에 대해서 비판적인 사고를 갖게 하였다. 1792년 어머니가 사망한 뒤, 고아가 된 이들 남매는 넉넉한 유산을 물려받았지만 친척들의 보살핌을 받아야 했다. 당시 볼리바르는 외할아버지댁에서 살다가 외삼촌 카를로스 팔라시오스의 집에서 살았지만, 부모의 보살핌을 받지 못하는 환경과 엄격한 성격의 외삼촌과의 갈등은 볼리바르의 정서를 불안하게 하여 반항아가 되게 하였다.",
      "열두살때 외삼촌 집에서 나온 후, 결혼한 큰 누나 마리아 안토니아와 같이 살면서 시몬 볼리바르가 살던 시대에는 진보적 가치였던 정치적 자유주의의 신봉자인 시몬 로드리게스(Simón Rodríguez, 1769년~1854년)의 지도를 받았다. 당시 로드리게스는 장 자크 루소와 몽테스키외의 사상을 심어주면서 볼리바르에게 자유주의 사상을 심어주었다. 당시 남아메리카에서는 남아메리카 식민지에서 태어난 백인들인 크리오요(Criollo)들을 비롯한 여러 인종들이 에스파냐의 식민통치에 대해서 불만을 품고 있었다.",
    ] },
  { "title" = "독립운동", "paragraphs" = [
      "고향에 돌아온 볼리바르는 1809년 안드레스 베요, 런던 빈민가에서 빈한한 삶을 살던 독립운동가 프란시스코 데 미란다(1750년~1816년)가 합류한 독립운동을 이끌어 1811년 베네수엘라를 베네수엘라 공화국이라는 국체를 가진 국가로 해방시킨다. 하지만, 독립운동은 독립에 반대하여 반란을 일으킨 왕당파의 카라카스 점령으로 실패하였고, 볼리바르는 검거를 피해 네덜란드령 퀴라소에서 망명 생활을 해야 했다. 당시 망명에 필요한 서류와 여권은 볼리바르의 도움을 받은 적이 있는 에스파냐 사람 이투르베가 마련해주었다.",
      "하지만 에스파냐의 손길이 미치자 콜롬비아의 항구도시 카르타헤나로 피신하는데, 이때 카르타헤나 선언으로 베네수엘라와 콜롬비아의 독립을 선언하였으며, 베네수엘라에 군대를 이끌고 들어가 독립전쟁을 지도하였다. 당시 시몬 볼리바르의 군대에는 에스파냐의 학정에 반감을 갖고 있던 청년들이 많았기 때문에 전쟁은 연전연승하였고, 결국 1814년 8월 4일 카라카스에 입성하였다. 당시 베네수엘라 공화국에서 볼리바르에게 해방자라는 이름을 줄 정도로 그는 큰 영광과 존경을 받았다. 하지만 영광도 잠시, 에스파냐군은 카라카스를 다시 침공하는데 볼리바르의 부대는 전쟁에서 계속 지게 된다. 당시 복수심에 불탄 볼리바르는 포로들을 모두 총살하였다고 한다.",
      "독립의회에서는 사병들이 경험이 부족한 신병들이었고 무기도 열악했다고 판단하여 그에게 책임을 묻지 않았으나, 결국 전쟁에 패하여 아이티 공화국으로 망명하여야했다. 당시 아이티 대통령 알렉산드르 페숑(프랑스어: Alexandre Sabès Pétion, 1770년~1848년)은 남아메리카 독립시 흑인 노예를 해방시킨다는 조건으로 4개 대대 약 1200명의 군대를 지원했으나, 훈련을 받지 못한 오합지졸 부대로는 잘 훈련된 사병과 최신형 대포를 가진 에스파냐군을 이길 수는 없는 일이었다. 1816년, 1817년 전쟁에서도 패배한 볼리바르는 대평원지대의 군벌인 호세 안토니오 파에스(Jose Antonio Paez)의 지원을 받아 게릴라 전술로 에스파냐군과 전쟁을 벌여 1818년 2월 12일 승리하였다. 하지만 에스파냐군의 재공격으로 그해 3월 26일 볼리바르는 베네수엘라에서의 전쟁을 당분간 포기해야했다.",
    ] },
  { "title" = "말년과 사망", "paragraphs" = [
      "1826년 파나마에서 개최된 연맹회의에서 시몬 볼리바르는 연방제 형식을 갖춘 남미대륙의 통일국가 건설을 호소했다. 남미가 분열될 경우에 미국 등에 의해 경제적으로나 정치적으로 종속될 위험성이 크다는 것이 시몬의 판단이었다. 미국은 '먼로 독트린'(1823년)을 통해 유럽의 간섭을 차단하고 중남미 대륙의 패권을 거머쥐겠다는 의지를 표방한 바가 있다. 신생 독립국인 남미 국가들로서는 매우 경계해야할 점이었다. 이런 점들이 수용되며 조약이 체결되고 긍정적인 결과가 도출되는듯 했으나 곧 시몬의 구상은 무산되었다.",
      "거대한 대륙의 특성상 각 지역간 소통의 문제, 정치적 이해관계 충돌, 지역 군벌들의 욕심, 미국과 영국의 남미대륙 분열정책 등이 발목을 붙잡고 있었다. 볼리바르는 \"우리는 혁명을 위해서 몸 바치는 동안 배울 시간이 없었다\" 고 하며 절규하였고, 남미 대륙의 미래에 대해서 '유혈충돌과 무질서'가 난무할 것이라고 예견했다. 불행히도 볼리바르의 예상은 적중하여 남미 정국은 혼란속에 빠져들어갔다. 볼리바르는 오랜 독립투쟁에 지쳐 있었고 건강도 나빠져가던 중 볼리바르에 대한 암살 미수 사건이 벌어졌다. 정적들과 볼리바르의 흑인 노예 해방 정책에 반감을 가진 지주들의 반발의 결과물이었다. 그러나 볼리바르는 사건 주모자에 대해 국외추방 및 관련자 석방이라는 비교적 관대한 처벌을 내렸다.",
      "1829년과 1830년 베네수엘라 및 에콰도르가 각각 분리독립하면서 그가 만든 그란콜롬비아도 와해되어가자 1830년 4월 27일 종신 대통령직과 후계자 지명권을 그란콜롬비아 의회에 반납했으며 거액의 연금 지불 제안도 거절하였다. 볼리바르가 1830년 5월 8일, 그란콜롬비아 대통령직에서 물러나는 의미로 콜롬비아 보고타를 떠날 때 사람들은 발코니에서 그의 머리에 오물을 쏟아 부었다. 보고타를 떠난 이후 그는 호아킨 미에르가 제공한 별장에서 조용히 지냈다.",
    ] },
]

[articles.ru]
text = "Симо́н Хосе́ Анто́нио де ла Санти́сима Тринида́д Боли́вар де ла Консепсьо́н-и-По́нте Пала́сиос-и-Бла́нко (исп. Simón José Antonio de la Santísima Trinidad Bolívar de la Concepción y Ponte Palacios y Blanco; при жизни С."
title = "Боливар, Симон"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%91%D0%BE%D0%BB%D0%B8%D0%B2%D0%B0%D1%80%2C_%D0%A1%D0%B8%D0%BC%D0%BE%D0%BD"
intro = [
  "Симо́н Хосе́ Анто́нио де ла Санти́сима Тринида́д Боли́вар де ла Консепсьо́н-и-По́нте Пала́сиос-и-Бла́нко (исп. Simón José Antonio de la Santísima Trinidad Bolívar de la Concepción y Ponte Palacios y Blanco; при жизни С. Боливара его фамилия писалась как исп. Bolivar); 24 июля 1783, Каракас, генерал-капитанство Венесуэла — 17 декабря 1830, Кинта-де-Сан-Педро-Алехандрино, Санта-Марта, Великая Колумбия) — латиноамериканский государственный, политический и военный деятель, наиболее влиятельный и известный из руководителей войны за независимость испанских колоний в Америке. Национальный герой Венесуэлы. Генерал.",
  "Освободил от испанского господства Венесуэлу, Новую Гранаду (совр. Колумбия и Панама), Королевскую аудиенсию Кито (современный Эквадор), в 1819—1830 гг. президент Великой Колумбии, созданной на территории этих стран. В 1824 году освободил Перу и стал во главе образованной на территории Верхнего Перу Республики Боливия (1825), названной в его честь. Национальным конгрессом Венесуэлы провозглашён (1813) Освободителем (исп. El Libertador).",
]
sections = [
  { "title" = "Ранние годы", "paragraphs" = [
      "Симон Боливар родился 24 июля 1783 года в знатной креольской семье Хуана Винсенте Боливара (1726—1786), по национальности баска. Род Боливаров происходил из городка Ла-Пуэбла-де-Боливар в Бискайе, в Испании, находившегося тогда в округе Маркина, а после переезда в колонию семья приняла активнейшее участие в общественной жизни Венесуэлы. Мальчик рано лишился родителей. На воспитание и формирование мировоззрения Боливара большое влияние оказал его учитель и старший друг — видный просветитель Симон Родригес. В 1799 году родственники Симона решили отправить его в Испанию, в Мадрид, подальше от беспокойного Каракаса. Там Симон Боливар изучал право, затем отправился в путешествие по Италии, Швейцарии, Германии, Англии и Франции. Живя в Париже, Боливар некоторое время посещал Политехническую и Высшую нормальную школы столицы Франции. В 1805 году Боливар посетил Соединённые Штаты Америки и здесь продумал свой план освобождения Южной Америки от испанского владычества.",
    ] },
  { "title" = "Венесуэльская республика", "paragraphs" = [
      "Боливар принял активное участие в свержении испанского господства в Венесуэле (19 апреля 1810 года) и провозглашении её независимой республикой (5 июля 1811 года). В том же году Боливар был послан революционной хунтой (народным собранием) в Лондон искать поддержки у британского правительства. Последнее, однако, предпочло сохранять нейтралитет. Боливар оставил в Лондоне агента Луи Лопеса Мендеса для заключения соглашения от имени Венесуэлы о займе и вербовке солдат и вернулся обратно с транспортом оружия.",
      "Вскоре испанский генерал Монтеверде обратился за содействием к обитателям венесуэльских степей (льяносов) — воинственным, имевшим полукочевой уклад льянерос (пастухи-всадники). Во главе иррегулярных формирований льянерос был поставлен астуриец Хосе Томас Бовес, по прозвищу Бовес-Крикун. Война приняла чрезвычайно жестокий характер.",
      "После разгрома армии Боливара испанскими войсками он в 1812 году обосновался в Новой Гранаде (ныне Колумбия), где написал «Манифест из Картахены», а в начале 1813 года вернулся на родину и продолжил войну. 15 июня 1813 года в городе Трухильо в ходе своей «Восхитительной кампании» он издал «Декрет о войне на смерть», который грозил смертью всем рождённым в Испании, за исключением тех, кто активно содействовал независимости Южной Америки.",
    ] },
  { "title" = "Образование Великой Колумбии", "paragraphs" = [
      "Осознав наконец необходимость освобождения рабов и решения других социальных проблем, Боливар убедил президента Гаити А. Петиона оказать повстанцам военную помощь и в декабре 1816 года высадился на побережье Венесуэлы. Отмена рабства (1816) и изданный в 1817 году декрет о наделении солдат освободительной армии землёй позволили ему расширить социальную базу. На сторону Симона Боливара перешли отряды льянерос, у которых после смерти Бовеса (1814) появился новый лидер — Хосе Антонио Паэс, сам коренной льянеро.",
      "После неудачной попытки собрать вокруг себя всех предводителей революции, чтобы действовать по общему плану, Боливар при помощи голландского негоцианта Бриона в мае 1817 года овладел Ангостурой и поднял против Испании всю Гвиану. Затем Боливар приказал арестовать своих бывших сподвижников Пиара и Марино (первый был казнён 16 октября 1817 года). В феврале 1818 года благодаря прибытию из Великобритании опытных солдат-наёмников ему удалось сформировать новую армию. Вслед за успешными действиями в Венесуэле его войска освободили Новую Гранаду (в 1819). В декабре 1819 года он был избран президентом провозглашённой Национальным конгрессом в Ангостуре (ныне Сьюдад-Боливар) республики Колумбии (в историю вошло как Великая Колумбия), куда вошли Венесуэла и Новая Гранада. В 1822 году колумбийцы изгнали испанские силы из провинции Кито (ныне Эквадор), которая присоединилась к Великой Колумбии.",
    ] },
  { "title" = "Освобождение Южной Америки", "paragraphs" = [
      "24 июня 1821 года близ поселения Карабобо в Венесуэле добровольческая армия Симона Боливара нанесла сокрушительное поражение испанскому королевскому войску. В июле 1822 года Боливар встретился в Гуаякиле с Хосе де Сан-Мартином, армия которого уже освободила часть Перу, но не сумел договориться с ним о совместных действиях. После отставки Сан-Мартина (20 сентября 1822 года) он в 1823 году направил в Перу колумбийские части и в 1824 году (6 августа при Хунине и 9 декабря на равнине Аякучо) были разгромлены последние испанские силы на американском континенте. Венесуэла, провозгласившая независимость в 1811 году, была полностью освобождена от колониалистов только к 1824 году. Боливар, в феврале 1824 года ставший диктатором Перу, возглавил и созданную в 1825 году на территории Верхнего Перу республику Боливию, названную так в его честь.",
      "С 1822 года верной подругой и неразлучной спутницей жизни Боливара, несмотря на все превратности его судьбы, была уроженка города Кито креолка Мануэла Саэнс.",
    ] },
]

