[articles.en]
text = "Solomon, also called Jedidiah, was a king of the Kingdom of Israel. The successor of his father David, he is described as the penultimate ruler of all Twelve Tribes of Israel under a united Israel and Judah."
title = "Solomon"
lang = "en"
url = "https://en.wikipedia.org/wiki/Solomon"
intro = [
  "Solomon () (Hebrew: שְׁלֹמֹה, romanized: šəlōmō), also called Jedidiah (Hebrew: יְדִידְיָה, romanized: yəḏîḏĭyā), was a king of the Kingdom of Israel. The successor of his father David, he is described as the penultimate ruler of all Twelve Tribes of Israel under a united Israel and Judah. His reign is hypothesized to have lasted from c. 970–931 BCE. According to the biblical narrative, his reign brought commercial prosperity through alliances and trade, but his accumulation of wealth, horses, and foreign wives, many of whom introduced idolatry, led to divine punishment. After Solomon's death, his son Rehoboam’s harsh policies led the northern Israelites to reject the Davidic line and follow Jeroboam, splitting the kingdom into Israel in the north and Judah in the south, according to the Hebrew Bible.",
  "Considered a Jewish prophet, Solomon is portrayed as wealthy, wise, powerful, and a dedicated follower of Yahweh (God), as attested by the eponymous Solomon's Temple. He is also traditionally regarded as the author of the biblical books of Proverbs, Ecclesiastes, and Song of Songs. He is also the subject of many later references and legends, most notably in the Testament of Solomon, part of biblical apocrypha from the 1st century CE.",
  "The historicity of Solomon is the subject of significant debate. While current scholarship generally allows for the possibility of a historical Solomon, the details of his reign over Israel and Judah are contested; the biblical portrayal of his apparent empire's opulence is considered highly likely to be an anachronistic exaggeration.",
  "Solomon is also revered in Christianity and Islam. In the New Testament, he is portrayed as a teacher of wisdom, compared to Jesus, and invoked rhetorically to illustrate God's generosity. In the Quran, he is considered to be a major Islamic prophet. During the Hellenistic period, Solomon also came to be known as a magician and an exorcist, with amulets and discovered seals invoking his name.",
]
sections = [
  { "title" = "Biblical account", "paragraphs" = [
      "The life of Solomon is primarily described in 2 Samuel, 1 Kings and 2 Chronicles. His two names are traditionally taken to mean \"peaceful\" and \"friend of God\", both considered \"predictive of the character of his reign\". A 2023 textbook described three possibilities for the etymology of Solomon’s name: “compensation or a substitute,” “the ruler of peace,” or based on the deified evening star Shalim.",
      "The conventional dates of Solomon's reign are derived from biblical chronology and are set from about 970 to 931 BCE. Regarding the Davidic dynasty, to which King Solomon belongs, its chronology can be checked against datable Babylonian and Assyrian records at a few points, and these correspondences have allowed archaeologists to date its kings in a modern framework. According to the most widely used chronology, based on that by the Old Testament professor Edwin R. Thiele, the death of Solomon and the division of his kingdom would have occurred in the fall of 931 BCE.",
      "Solomon was born in Jerusalem, the second-born child of David and his wife Bathsheba (widow of Uriah the Hittite). The first child (unnamed in that account), a son conceived adulterously during Uriah's lifetime, had died seven days after birth. The Hebrew Bible suggests that this was a judgment from God. Solomon had three named full brothers born to Bathsheba: Nathan, Shammua, and Shobab, besides six known older half-brothers born of as many mothers.",
    ] },
  { "title" = "Apocryphal or deuterocanonical texts", "paragraphs" = [
      "Rabbinical tradition attributes the Book of Wisdom (included within the Septuagint and recognized as part of a biblical canon by the Catholic Church, Eastern Orthodox Church, Oriental Orthodox Churches, and Church of the East) to Solomon, although this book was probably written in the 2nd century BCE. In this work, Solomon is portrayed as an astronomer. Other books of wisdom poetry such as the Odes of Solomon and the Psalms of Solomon also bear his name. The Jewish historian Eupolemus, who wrote about 157 BCE, included copies of apocryphal letters exchanged between Solomon and the kings of Egypt and Tyre.",
      "The Gnostic Apocalypse of Adam, which may date to the 1st or 2nd century, refers to a legend in which Solomon sends out an army of demons to seek a virgin who had fled from him, perhaps the earliest surviving mention of the later common tale that Solomon controlled demons and made them his slaves. This tradition of Solomon's control over demons appears fully elaborated in the early pseudoepigraphical work called the Testament of Solomon with its elaborate and grotesque demonology.",
    ] },
  { "title" = "Historicity", "paragraphs" = [
      "As with most biblical personages in the middle era of Israelite society, the historicity of Solomon is hotly debated. Current consensus states that regardless of whether or not a man named Solomon truly reigned as king over the Judean hills in the tenth century BCE, the biblical description of his apparent empire's lavishness is almost surely an anachronistic exaggeration.",
      "As for Solomon himself, scholars on both the maximalist and minimalist sides of the spectrum of biblical archeology generally agree that he probably existed. However, a historically accurate picture of the Davidic king is difficult to construct. According to some archaeologists, Solomon could have only been the monarch or chieftain of Judah, and that the northern kingdom was a separate development. Such positions have been criticized by other archaeologists and scholars, who argue that a united monarchy did exist in the 10th century BCE, while agreeing that the biblical account contains exaggerations.",
      "Historical evidence of King Solomon other than the biblical accounts has been so minimal that some scholars have understood the period of his reign as a 'Dark Age' (Muhly 1998). The first-century Romano-Jewish scholar Josephus in Against Apion, citing Tyrian court records and Menander, gives a specific year during which King Hiram I of Tyre sent materials to Solomon for the construction of the Temple. However, no material evidence indisputably of Solomon's reign has been found. Yigael Yadin's excavations at Hazor, Megiddo, Beit Shean and Gezer uncovered structures that he and others have argued date from Solomon's reign, but others, such as Israel Finkelstein and Neil Silberman, argue that they should be dated to the Omride period, more than a century after Solomon.",
    ] },
  { "title" = "Religious views", "paragraphs" = [
      "King Solomon sinned by acquiring many foreign wives and horses because he thought he knew the reason for the biblical prohibition and thought it did not apply to him. When King Solomon married Pharaoh's daughter, a sandbank formed which eventually formed the \"great nation of Rome\"—the nation that destroyed Herod's Temple. Solomon gradually lost more and more prestige until he became like a commoner. Some say he regained his status while others say he did not. In the end, however, he is regarded as a righteous king and is especially praised for his diligence in building the Temple.",
      "Adin Steinsaltz reads Solomon's wisdom as realpolitik. His geopolitical success possible only by paying lip service to idolatrous practices without actually believing in them. This set a terrible example for his subjects. Solomon assumed incorrectly that ordinary people would be as wise as himself and keep idolatry at arm's length.",
      "King Josiah was also said to have had the Ark of the Covenant, Aaron's rod, vial of manna and the anointing oil placed within a hidden chamber which had been built by Solomon.",
    ] },
]

[articles.zh]
text = "所罗门或譯撒罗满（希伯来语：שְׁלֹמֹה，公元前990年—前931年），阿拉伯语称为苏莱曼（سليمان）。根据《希伯來聖經》记载，是以色列王國第三位國王，大卫家族第二位国王。在《古兰经》，则视之为先知。据《希伯來聖經》记载，所罗门王是大衛王与拔示巴的儿子。 据圣经记载，所罗门王是耶路撒冷第一聖殿的建造者，并有超人的智慧，大量的财富和无上的权力。但最后由于所罗门王晚年的罪过导致在他的儿子罗波安执政时期王国发生了分裂。所罗门王还是后世许多文献和传说的主角。"
title = "所羅門"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E6%89%80%E7%BE%85%E9%96%80"
intro = [
  "所罗门或譯撒罗满（希伯来语：שְׁלֹמֹה，公元前990年—前931年），阿拉伯语称为苏莱曼（سليمان）。根据《希伯來聖經》记载，是以色列王國第三位國王，大卫家族第二位国王。在《古兰经》，则视之为先知。据《希伯來聖經》记载，所罗门王是大衛王与拔示巴的儿子。",
  "据圣经记载，所罗门王是耶路撒冷第一聖殿的建造者，并有超人的智慧，大量的财富和无上的权力。但最后由于所罗门王晚年的罪过导致在他的儿子罗波安执政时期王国发生了分裂。所罗门王还是后世许多文献和传说的主角。",
]
sections = [
  { "title" = "圣经生平", "paragraphs" = [
      "当所罗门王的父亲大卫王公元前970年去世之后，他成为了新的国王。根据圣经《列王纪》的记载，“大卫王年纪老迈，虽用被遮盖，仍不觉暖。”（列王紀上1:1），“所以臣仆对他说：「不如为我主我王寻找一个处女，使他伺候王，奉养王，睡在王的怀中，好叫我主我王得暖。」于是在以色列全境寻找美貌的童女，寻得书念的一个童女亚比煞，就带到王那里”（列王紀上1:2）。",
      "当大卫王仍然在世的时候，他的第四个儿子，亚多尼雅就展开行动宣告他是新的国王。在他的兄弟暗嫩和押沙龙去世之后，他自己觉得他应该被立为王位的继承者。但大卫在很早之前，以耶和华之名为证，表明要将王位传给所罗门。由于亚多尼雅的计谋被当时的先知约拿单识破，并告知所罗门的母亲拔示巴，請她去告知大卫關於亚多尼雅的阴谋，并提醒大卫他之前的誓言。大卫当即将王位传给了所罗门。亚多尼雅得知消息后逃到祭坛，去抓住祭坛的角，让所罗门不要杀他。所罗门表示：“他若作忠义的人，连一根头发也不至落在地上；他若行恶，必要死亡。”（列王纪上 1:52 和合本）",
      "为了实现大卫王对所罗门的临终遗言，所罗门将大卫的将军约押杀死了，因为约押在和平时期曾谋杀了押尼珥和亚玛撒。大卫王的大祭司亚比亚他被所罗门王放逐远方，因为他曾支持所罗门王的竞争者亚多尼雅。亚比亚他是世袭的大祭司，他的前任是以利，以利是一位非常重要的先知。示每被限制只能在耶路撒冷城内活动，但在三年之后，当他前往迦特去取回一些逃走的仆人时被杀死了。这也许是因为他在大卫的儿子押沙龙反叛大卫的时候曾诅咒过大卫的缘故。",
    ] },
  { "title" = "贡献", "paragraphs" = [
      "所罗门被描述为将自己沉浸在奢华与东方王朝的华美，他的政权蒸蒸日上。他与推罗国王希蘭结盟，后者在许多事情上给予他支援。在去世前，大卫王为耶路撒冷圣殿的建设聚集原材料，以永久放置约柜。所罗门被描述为建设的完成者，他的建筑帮手很多，包括希蘭，以及从他而来的原材料。",
      "在圣殿完成前，所罗门被描述为在耶路撒冷建设了许多其他的重要建筑，在长达13年之久中，他在奥菲尔处积极建设王宫（在耶路撒冷中心的一个小丘）。所罗门也为城市供水建设了许多重要工程，以及为保护城市的米罗。然而，在发掘耶路撒冷城的时候，这一时期的建筑遗迹没有多少被发现出来，圣殿与所罗门王宮也没有被发现。然而，一些很重要的，但是极具政治敏感性的地区没有被详细发掘，包括圣殿山，即传说中圣殿的地址。",
      "所罗门被描述为在以色列别的地方建城，建设了；以旬迦别口岸，将达莫建设成为通商口岸即军事要点。所罗门还被描述为拥有1,400战车及12,000骑兵。虽然所罗门以旬迦别口岸的地点已知，但没有什么遗迹被发现。在所罗门增建或重建的城市中得到了许多考古发现，如夏瑣、米吉多，並基色 （Gezer）—《列王记上》9:15，这里都有很多古代遗迹，包括精湛的六房门，方石堆宫殿，以及建筑外水槽结构等，前者是考古学家认为是所罗门的马厩所在。",
    ] },
  { "title" = "名字的意思", "paragraphs" = [
      "所羅門 / 謝洛莫（Solomon / Shlomo，שְׁלֹmֹה）： 這是他最廣為人知的名字，由他的母親拔示巴所取。其字根源自希伯來語的「沙洛姆」（Shalom，שָׁלוֹם），意思是「和平」、「平安」或「完整」。 [1, 2, 3, 4, 5]",
      "耶底底亞（Jedidiah，יְדִידְיָה）： 這是所羅門出生後，上帝藉由先知拿單為他賜下的名字，意思是「耶和華所愛的」。這代表上帝對大衛與拔示巴這段關係的赦免與賜福。 [1, 2, 3]",
      "蘇萊曼 / 素萊曼（Suleiman / Sulayman，سليمان）：阿拉伯語形式。在伊斯蘭教的《古蘭經》中，所羅門被尊稱為先知蘇萊曼，擁有指揮風、與動物對話及統御精靈（Jinn）的強大能力。",
    ] },
  { "title" = "对后世的影响", "paragraphs" = [
      "他作箴言三千句，诗歌一千零五首。“我把以下一切事都记在心上，要寻出这一切事的底蕴：原来义人、智者和他们所做的事，都在上帝手中。世人并不知道他们之前的一切爱恨。”（《传道书》9:1）传道者说：“虚空的虚空，虚空的虚空，凡事都是虚空。”（《传道书》1:2）。在《次正經》中之《智慧篇》，相信為後世作家偽托所羅門王所著。",
    ] },
  { "title" = "其他", "paragraphs" = [
      "所罗门统治的传统时期约在公元前970年到931年。他们的衍生来自圣经编年史，主要来自书中的古代编年史，从《创世纪》到《列王记》下，并根据古代人对宇宙起源、耶路撒冷沦陷，圣殿在公元前586年被毁。关于所罗门王所在的大卫朝中，这个编年史可以通过巴比伦和亚述历史中的一些记录，这些数据可以帮助考古学家用现代科技手段来定位当时的王朝。根据爱德文·R·蒂勒最常用的编年史，所罗门之死和王国分裂发生在公元前931年。蒂勒并没有直言所罗门统治的起始日期，而是根据《列王记》上，他统治了40年，因此根据蒂勒系统这与公元前970年相符。",
      "根据以色列·福肯斯坦和尼尔·石博曼所著的《圣经出土：古以色列和原始神圣经文考古学新解》，在大卫王与所罗门王时期，耶路撒冷的居民人数只有少于几百人，这对于从幼发拉底河一直延伸到以拉施的帝国来说这个根本不足。根据《圣经出土》考古学证据显示，所罗门王国时期的以色列不过是个小城邦，所以所罗门每年收贡666他連得黄金根本不可能。虽然福肯斯坦和石博曼都承认大卫与所罗门都是公元前10世纪时真實存在的国王，他们也认为对于以色列王国最早的独立记录大约是在公元前890年，犹大王国则是在公元前750年。他们认为出于宗教歧视，《圣经》的作者故意贬低多神论宗教，以至于将他们记录在犹大一神论黄金时期之后，以供奉耶和华。一些圣经极简主义者，如托马斯·L·汤普森继续辩驳道耶路撒冷只能在7世纪中叶才可能成为一个国家的都城。同样地，福肯斯坦也其他人认为所罗门圣殿的规模不可能。",
      "这些观点被威廉·G·德芙、哈该·魏普特、安德烈·利马与阿芒·本托驳斥。利马在他的《古以色列：从亚伯拉罕到罗马摧毁圣殿》中认为圣经传统中的所罗门基本上是可信的。肯尼斯·凯彻也认为所罗门控制着一个相对富有的「迷你帝国」，而不是小的城邦，而他連得黄金也不是很多钱。凯彻计算了通过30年，一个相似大小的国家可以累积500吨黄金，这对于其他例子，如亚历山大从苏萨得到的1180吨黄金来说还算小的。类似凯彻，其他人认为所罗门圣殿规模是合理的，结构也符合当时时期的建筑风格。威廉·G·德芙认为“我们现在拥有青铜时期和铁器时期的类似建筑以对比《圣经》中“所罗门时期圣殿”的每一个细节特色。",
    ] },
  { "title" = "所罗门与宗教", "paragraphs" = [
      "所罗门王因为纳妾过多而犯罪，虽然他知道圣经并不允许这样，但是他认为这对自己不适用。当所罗门王娶了埃及法老的女儿，后来他娶了许多外族女子，使所罗门渐渐失去他的智慧，有人说他重拾了他的地位，有的说他没有。但最后，他被认为是个正义的国王，特别是他對建设圣殿所做出的努力。",
      "《福音书》中有关耶稣的两份族谱中，只有马太提到了所罗门，但是路加则没有。一些评论家认为这就是问题之所在，另一些则不同意。因为路加使用的是玛利亚的族谱，而马太使用的是约瑟的，但是达勒·布克认为这是前所未有的，“特别在族谱中没有女性出现”。其他人则认为族谱中一个使用了皇室线索，另一个使用了普通线索，一个使用了法律线索，另一个使用了物理线索，或者说，约瑟是领养的。",
      "西班牙国王費利佩二世致力于效法所罗门王。大卫王与所罗门王的雕塑立在埃斯科里亚尔費利佩王宫门口的左右。所罗门被绘在埃斯科里亚尔图书馆中心的壁画上。費利佩认为他的父亲查理五世与军事领袖大卫王类似，自己则更像思维逻辑性的所罗门。不但如此，埃斯科里亚尔建筑风格的灵感来自于所罗门圣殿。",
    ] },
]

[articles.ar]
text = "سُلَيْمَان (بالعبرية: שְׁלֹמֹה؛ تلفظ: شلومو، بالآرامية: ܫܠܡܐ)، هو أحد ملوك مملكة إسرائيل الموحدة حسب الوارد في سفر الملوك الأول وسفر أخبار الأيام الأول وحسب التلمود، هو أحد الأنبياء الثمانية والأربعين وابن داود وثالث ملوك مملكة إسرائيل الموحدة قبل انقسامها إلى مملكة إسرائيل الشمالية وهي المملكة التي بقي يحكمها قبائل إسرائيل الاثنا عشر ومملكة يهوذا في الجنوب والتي حكمها أبناء سبط يهوذا وهي القبيلة الوحيدة الباقية من القبائل الإثنا عشر حسب كتابات اليهود. يعتقد أنه عاش في الفترة ما بين 990 ق.م حتى 931 ق.م وتوفى عن عمر 52 واشتهر -وفق العقيدة اليهودية- بحكمته وثرائه وملكه الكبير وعدد من الذنوب التي بموجبها عاقب يهوه بني إسرائيل بتقسيم مملكتهم."
title = "سليمان"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%B3%D9%84%D9%8A%D9%85%D8%A7%D9%86"
intro = [
  "سُلَيْمَان (بالعبرية: שְׁלֹמֹה؛ تلفظ: شلومو، بالآرامية: ܫܠܡܐ)، هو أحد ملوك مملكة إسرائيل الموحدة حسب الوارد في سفر الملوك الأول وسفر أخبار الأيام الأول وحسب التلمود، هو أحد الأنبياء الثمانية والأربعين وابن داود وثالث ملوك مملكة إسرائيل الموحدة قبل انقسامها إلى مملكة إسرائيل الشمالية وهي المملكة التي بقي يحكمها قبائل إسرائيل الاثنا عشر ومملكة يهوذا في الجنوب والتي حكمها أبناء سبط يهوذا وهي القبيلة الوحيدة الباقية من القبائل الإثنا عشر حسب كتابات اليهود. يعتقد أنه عاش في الفترة ما بين 990 ق.م حتى 931 ق.م وتوفى عن عمر 52 واشتهر -وفق العقيدة اليهودية- بحكمته وثرائه وملكه الكبير وعدد من الذنوب التي بموجبها عاقب يهوه بني إسرائيل بتقسيم مملكتهم. ارتبط اسم سليمان بعدد من القصص المذكورة في العهد القديم مثل لقاءه مع ملكة سبأ التي ذكرت في القرآن كذلك وقصة قضاء سليمان بين المرأتين المتخاصمتين على رضيع، ويعتقد حسب التراث اليهودي أنه أول من بنى الهيكل وقصته مع ملك الجن أشماداي (العبرية: אשמדאי).",
  "هو أحد أنبياء الإسلام حسب ما ورد في القرآن في سورة سبأ وص والنمل وسورة البقرة والأنعام وسورة الأنبياء مع اختلافات في جوانب القصة العبرية وتأكيد للحكمة والثراء والمُلك الذي لم يؤت أحد مثله. وحسب القرآن، فإن سليمان تعلم «منطق» الطير والحيوانات والحشرات و التحكم في الرياح و كان يمتلك جن وعفاريت مُسخرين لخدمته وطاعته .",
  "وجود سليمان من الناحية التاريخية وبالصورة التي صورها كتبة التناخ والكتب الدينية الأخرى محل خلاف بين علماء الآثار والأنثروبولجيا فلا يوجد له ولا لهيكله أي أثر في فلسطين كما لا يأتي أي ذكر له في حوليات الحضارات المفترض أنها جاورته في مصر القديمة وآشور وفينيقيا أو تلك التي يعتقد أنها اتصلت به في اليمن القديم.",
]
sections = [
  { "title" = "في التراث اليهودي والمسيحي", "paragraphs" = [
      "ورد في سفر الملوك الأول أن داود عندما كبر في السن لم يعد باستطاعته الشعور بالدفء فعرض عليه مستشاريه تزويجه من فتاة صغيرة وجميلة لعلها تدفئ داود في شيخوخته ووجدوا فتاة اسمها «أبيشج الشونمية» لتقوم بهذا الغرض. وكان لداود عدد من الأبناء حينها هم أدونيا وأبشالوم وأمنون وشفطيا ويثرعام وكيلاب وأعلن أدونيا نفسه ملكاً على إسرائيل خلال شيخوخة أبيه، لكنه ما حز في نفس النبي ناثان الذي كان مستشاراً لداود، فهرع ناثان إلى أم سليمان مخبراً إياها بفعلة أدونيا وحثها على الذهاب إلى داود وذلك لسببان، أن يهوه أراد من سليمان أن يبني الهيكل عقب وفاة داود والسبب الثاني هو وعد داود لزوجته أو أمته حقيقة كما ورد في السفر بتسليم سليمان الملك رغم أن أدونيا هو أكبر أبناء الملك داود الأحياء إلا إنه كان مدللا ومغرورا ولم يلق قبولا من الكهنة والأنبياء.",
      "فلما سمع أدونيا صوت الأبواق والمزامير تفرق جمعه عنه وهرب أدونيا وتمسك بقرون المذبح خوفا من سليمان مطالباً إياه بالحلف ألا يقتله بالسيف فقال سليمان:",
      "فأنزلوه من المذبح وسجد أمام سليمان الذي عفى عنه وردّه إلى بيته. ولما استوى الملك لسليمان عقب وفاة داود توجه أدونيا إلى أم سليمان مطالباً إياها بالتوسط عنده ليزوجه «أبيشج الشونمية» إلا أن الطلب قوبل بالرفض وأرسل سليمان قائد جيشه المدعو بنياهو بن يهوياداع لقتله وبذلك تخلص سليمان من أخاه وكل تهديد ضد ملكه.",
    ] },
  { "title" = "في الدين الإسلامي", "paragraphs" = [
      "وهو سليمان بن داود بن أيشا بن عوبيد بن عابر بن سلمون بن نخشون بن عميناداب بن إرم بن حصرون بن فارص بن يهوذا بن يعقوب بن إسحاق بن إبراهيم الربيع، نبي الله ابن نبي الله.",
      "جاء في بعض الآثار أنه دخل دمشق. قال ابن ماكولا: فارص بالصاد المهملة، وذكر نسبه قريباً مما ذكره ابن عساكر.",
      "سليمان هو أحد أنبياء الله في الإسلام وقد ذكر ملكه القرآن ونسب إليه جيشا من الوحش والطير والجن والبشر وصفات أخرى مثل قدرته على فهم منطق جميع الكائنات بما فيها النمل",
    ] },
  { "title" = "الأبحاث الآثارية والحفريات", "paragraphs" = [
      "مصر التي كانت تمر بفترة انتقالية سماها علماء المصريات بالفترة الانتقالية الثالثة خلال حكم الأسرة المصرية السادسة والعشرين، وردت عنها آثار عن علاقات بالآشوريين في هذه الفترة وتحالفات بين عدد من الممالك مع مصر ضدهم ولا إشارة لسليمان وإسرائيل على الإطلاق، ويعتقد عدد من الناقدين أن قصة ملكة سبأ قد تكون تلفيقا من كتبة التوراة لإيجاد شاهد أجنبي على ثروة سليمان وحكمته. ولكن يستدل آخرون، أنه في حين كانت مملكة إسرائيل محاطة بحضارات وممالك قوية ولم تغزها فذلك إنما يدل على قوة جند سليمان آنذاك.",
    ] },
]

