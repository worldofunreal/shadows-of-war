  "在前44年，尤利烏斯·凱撒遭到刺殺後，克麗奧佩脫拉與馬克·安東尼一同對付凱撒的合法繼承人屋大維（奥古斯都），並與安東尼生了亞歷山大·赫利俄斯、克麗奧佩脫拉·塞勒涅二世這對雙胞胎，以及托勒密·費拉德爾甫斯。在與屋大維軍的亞克興海戰失利後，馬克·安東尼自己結束生命，克麗奧佩脫拉隨後也跟著自殺。根據傳統上認為，克麗奧佩脫拉是在前30年8月12日以毒蛇「aspis」咬自己而身亡。而克麗奧佩脫拉的兒子，同時也是法老的托勒密·凱撒里昂在母親自殺前夕，因屋大維的命令而被殺，托勒密王國因此被併吞，成為羅馬的埃及行省。她的死亡代表托勒密王國終結，也代表希臘化時期結束，東地中海羅馬時代的開始。",
  "直至今日，克麗奧佩脫拉依舊是西方文明中一個知名的人物，她的形象仍存於無數的藝術作品之中，她的故事在許多文學、戲劇、電影中上演。在大多數的描繪中，克麗奧佩脫拉充滿知性、美貌和性感，並且成功征服當時西方世界最有權勢的男人，故在中文世界有“埃及艷后”之称。在今日文藝或電影上，她被認為是為了保護國家免受羅馬併吞，而色誘凱撒大帝及他的手下馬克·安東尼。",
]
sections = [
  { "title" = "身世", "paragraphs" = [
      "關於克麗奧佩脫拉七世母親的身份不清楚，但一般上認為是克麗奧佩脫拉五世，她是托勒密十二世的姊妹或表親，同時也是他的妻子。因為克麗奧佩脫拉七世曾說過她的外祖父是托勒密十世，因此假如克麗奧佩脫拉五世不是生母的話，那克麗奧佩脫拉七世的母親可能就是托勒密十世和貝勒尼三世某個不知名的女兒",
    ] },
  { "title" = "早年", "paragraphs" = [
      "托勒密王國因為中央集權政府衰弱以及逐漸腐敗等因素，失去了昔蘭尼和賽普勒斯，讓托勒密政權國勢弱至谷底。公元前58年，當托勒密十二世携小克麗奧佩脫拉七世前往羅馬求援時，留守的王后克麗奧佩脫拉六世聯合朝臣奪取了政權，並立其19歲女兒貝勒尼基四世為共治女王，但翌（前57）年突逝，死因不明，使貝勒尼基四世成為唯一的統治者。托勒密十二世私將其女貝勒尼基四世派赴羅馬的使節刺殺後遷往希臘，公元前55年在羅馬將領奧盧斯·加比尼烏斯幫助下，攻下亞歷山卓並重登王位。而貝勒尼基四世遭到逮捕後被斬首，據傳她的頭在父王托勒密十二世的旨意下以呈盤送到宮廷展示。此時年僅14歲的克麗奧佩脫拉七世被立為共同執政者，輔佐她的父親，儘管她的權力可能受到嚴格限制。",
      "前51年3月托勒密十二世逝世，在遺囑中他立18歲的克麗奧佩脫拉七世和她12歲同父異母的弟弟托勒密十三世統治王國。但克麗奧佩脫拉七世她一點都不想與弟弟分享權力，在她統治一開始，官方文件上只有她的名字，所發行的錢幣上也僅有她一人的肖像，這違反托勒密王朝傳統，因傳統上女性統治者需附屬於男性共治者之下。",
      "在前50年時，克麗奧佩脫拉七世跟留在埃及的前羅馬軍隊加比尼亞人（Gabiniani）發生衝突，這支軍隊當初是羅馬奧盧斯·加比尼烏斯要離開埃及時，為了保衛托勒密十二世政權所留下的士兵。這場衝突也是克麗奧佩脫拉七世隨後失去權位的主要原因之一，她因此被迫接受弟弟托勒密十三世登基，並與弟弟結婚一同共治埃及。她們在前三年的統治時間內相當顛簸，經濟危機、饑荒、尼羅河缺堤氾濫和政治衝突等等來考驗這對姐弟。",
    ] },
  { "title" = "與尤利烏斯·凱撒", "paragraphs" = [
      "當克麗奧佩脫拉流亡在外時，龐培捲入羅馬內戰中。在前48年秋季，龐培在凱撒軍的追擊下來到了亞歷山卓外海，尋求庇護。年僅15歲的托勒密十三世還很年輕，此事主要由財政大臣波提紐斯處理。前48年9月28日，龐培覺得事情有異。托勒密迎接的場面既不隆重，還有點肅殺，岸上滿是士兵，加上托勒密還派出艦隊像是監視龐培般。龐培自知無法逃脫，只得乘著對方安排的一艘小船，準備要登上埃及的海岸。然而迎接他的托勒密軍官在龐培一上岸，就殺了龐培並砍下他的頭，動手的軍官中還有龐培的老部下。龐培的妻子和孩子在海上看到這件慘案，連忙揚帆逃走，這天剛好也是龐培58歲生日。",
      "托勒密十三世認為龐培之死可以討凱撒歡心，可以成為羅馬忠貞的盟友，或許還可以減輕王國欠羅馬的債務，然而這事後來被證明是大大失算。兩天後，凱撒來到埃及，托勒密派人奉上龐培的頭顱，但這使凱撒相當憤怒，對於龐培之死垂淚不已。雖然龐培是凱撒政治上的勁敵，但也是他獨生女茱莉亞的丈夫，更曾是羅馬的執政官，身為羅馬人且已是羅馬實際掌權者的凱撒無法容忍本國的要人為異國人擅自殺害。",
      "當凱撒來到埃及後，這位羅馬最有權勢男人自然成為托勒密十三世和克麗奧佩脫拉七世王位爭奪問題上，最有力的仲裁者。因此，克麗奧佩脫拉期望可以趁著凱撒對托勒密十三世氣頭上時，來獲得有利地位。於是她暗自偷偷潛入宮殿內與凱撒會面，傳說當時克麗奧佩脫拉把自己伸直，用毯子捲起來包覆其中，命人抬著進入王宮，這時克麗奧佩脫拉年僅21歲，凱撒52歲。經過一番交談後，凱撒對克麗奧佩脫拉的膽識和機智大為傾心，再加上美色的誘惑更是讓他難以自拔，於是凱撒放棄原本佔領埃及的計畫，還決定要讓克麗奧佩脫拉登上王位，再度與托勒密十三世共治。而克麗奧佩脫拉之後便成為凱撒的情人。",
    ] },
  { "title" = "和馬克·安東尼", "paragraphs" = [
      "在前41年，馬克·安東尼在凱撒身亡後的權力真空中獲得一席之地，並成為後三頭同盟之一，他招喚克麗奧佩脫拉前來塔爾索與他會面，回答一些關於對他忠誠的問題，克麗奧佩脫拉在那裡華麗地登場，並以迷人的風采和談吐擄獲安東尼的心，安東尼於是花了前41年到前40年間的冬天在亞歷山卓陪她。",
      "為了確保她自己和凱撒里昂的政治地位安全，克麗奧佩脫拉唆使安東尼下令殺了她的妹妹阿爾西諾伊四世，她妹妹此時正避居於羅馬控制下以弗所的阿耳忒彌斯神廟中，阿爾西諾伊便在神廟的階梯上被殺，這大大震驚羅馬人，因神廟有神聖的庇護權。克麗奧佩脫拉也處決了她的賽普勒斯將軍塞拉皮翁，因他曾經支持卡西烏斯來與她對抗。然而，當安東尼因戰事離開埃及後，她們倆的戀情逐漸轉淡。安東尼為了和屋大維重修和好，娶了屋大維的姐姐小屋大薇為妻。",
      "在前40年12月25日，克麗奧佩脫拉為安東尼生下一對雙胞胎亞歷山大·赫利俄斯和克麗奧佩脫拉·塞勒涅二世。幾年後，當安東尼在前往東方對付安息王國途中，他來到亞歷山卓與克麗奧佩脫拉續前緣，克麗奧佩脫拉也為安東尼提供戰爭所需要的資金和補給。隨著安東尼和屋大維的關係惡化，讓安東尼冷冷對待小屋大薇，自己也不返回羅馬的宅第。安東尼在對安息王國的戰爭失利後回到亞歷山卓，可能以埃及式婚禮與克麗奧佩脫拉結婚。前36年之後還與克麗奧佩脫拉生下小兒子托勒密·費拉德爾甫斯，並在亞歷山卓置家。",
    ] },
  { "title" = "自殺", "paragraphs" = [
      "在古代文獻中，尤其是羅馬人所記載的，大多認為克麗奧佩脫拉是誘使毒蛇咬傷自己，而毒發身亡。但其中最早的文獻是斯特拉波所著，他是與克麗奧佩脫拉同時期的人物，很可能曾經去過亞歷山卓。他說當時流傳兩個有關克麗奧佩脫拉的自殺版本，其中一個是她服用毒藥自殺，另一個即是用毒蛇「Asp」咬傷自己。但在數十年以後的許多羅馬詩人，卻提到她是由兩條毒蛇所咬傷。而150年後的歷史學家弗洛魯斯，以及60年後的維勒尤斯提到只有一條毒蛇。其它一些作者則質疑他們的歷史記載，並說克麗奧佩脫拉很可能是被屋大維所殺。",
      "普魯塔克寫作的年代在這件事的130年以後。他描述屋大維在安東尼死後俘虜了克麗奧佩脫拉，並把她囚禁於她在艾西斯神廟的陵墓中，還命令自己的自由民以巴弗提監視克麗奧佩脫拉，防止她有尋短的行為。畢竟屋大維有意讓她活著回羅馬，為自己的凱旋式添加光彩。然而，克麗奧佩脫拉已心有死意，也清楚屋大維的企圖。她在以巴弗提沒有察覺下結束自己的生命。普魯塔克說，當屋大維匆忙趕到時，克麗奧佩脫拉已於床上逝世。她的侍女艾拉斯（Iras）死於她腳旁，而另一位侍女卡爾萌也搖搖欲墜，並在整理克麗奧佩脫拉的頭冠後隨即死去。普魯塔克接著描述毒蛇是藏在無花果籃子中，由鄉民帶進來給她的。克麗奧佩脫拉讓毒蛇在自己手臂咬一口。普魯塔克同時也記載其他說法，如毒蛇是藏在瓶子中，克麗奧佩脫拉藉著一根紡錘去撥弄激怒牠，再讓毒蛇咬自己手臂。還有一說克麗奧佩脫拉是服用藏在空心的束髮針中的毒葯自殺的。普魯塔克也透露，沒人知道克麗奧佩脫拉真正的死法。然而，普魯塔克說屋大維回到羅馬的凱旋式中，克麗奧佩脫拉的雕像被塑造出毒蛇藏繞的樣子。",
      "英國文豪威廉·莎士比亞最後為這段悲劇描繪出一個場景，克麗奧佩脫拉抓著毒蛇，讓牠在胸部咬一口，在莎士比亞之前，大眾認為克麗奧佩脫拉被咬的地方僅有手臂。一说佩看出行宫窗户，可见尼罗河口，埃及海军战败，罗马海军战胜正登陆埃及，佩手伸进平常养的宠物蛇笼，自裁被毒蛇咬逝即自尽。",
    ] },
]

[articles.ja]
text = "クレオパトラ7世フィロパトル（ギリシア語: Κλεοπάτρα Ζ' Φιλοπάτωρ、ラテン語: Cleopatra VII Philopator、紀元前69年 - 紀元前30年8月12日）は、古代エジプトプトレマイオス朝ファラオ（女王）。 一般的に「クレオパトラ」と言えば彼女を指すことが多く、プトレマイオス朝の最後の女王で、ガイウス・ユリウス・カエサルやマルクス・アントニウスらとのロマンスで知られる。4人の子供を妊娠・出産した。有名なのはカエサルとの子、カエサリオンである。王朝自体がアレクサンドロス3世の部下プトレマイオス1世による支配から始まったため、クレオパトラもギリシャ系である。 「クレオパトラ」は、古代ギリシア語クレオパトロス（父の栄光）の女性形である。「絶世の美女」として知られ、世界三大美人の一人である。ただし、クレオパトラの肖像は治世当時、アントニウスが発行したとされている硬貨に横顔が残されているのみであり、この評価は後世の作り話だとの説がある（#人物節を参照）が、妹のアルシノエ4世の復元図から姉のクレオパトラも美しかったとする説もある。 なお、アレクサンドリアを襲った365年のクレタ地震のため、当時の史料は残っておらず、プルタルコスやスエトニウスら後世の歴史家による記録に負うが、その正確性には疑問が残る。"
title = "クレオパトラ7世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AC%E3%82%AA%E3%83%91%E3%83%88%E3%83%A97%E4%B8%96"
intro = [
  "クレオパトラ7世フィロパトル（ギリシア語: Κλεοπάτρα Ζ' Φιλοπάτωρ、ラテン語: Cleopatra VII Philopator、紀元前69年 - 紀元前30年8月12日）は、古代エジプトプトレマイオス朝ファラオ（女王）。",
  "一般的に「クレオパトラ」と言えば彼女を指すことが多く、プトレマイオス朝の最後の女王で、ガイウス・ユリウス・カエサルやマルクス・アントニウスらとのロマンスで知られる。4人の子供を妊娠・出産した。有名なのはカエサルとの子、カエサリオンである。王朝自体がアレクサンドロス3世の部下プトレマイオス1世による支配から始まったため、クレオパトラもギリシャ系である。",
  "「クレオパトラ」は、古代ギリシア語クレオパトロス（父の栄光）の女性形である。「絶世の美女」として知られ、世界三大美人の一人である。ただし、クレオパトラの肖像は治世当時、アントニウスが発行したとされている硬貨に横顔が残されているのみであり、この評価は後世の作り話だとの説がある（#人物節を参照）が、妹のアルシノエ4世の復元図から姉のクレオパトラも美しかったとする説もある。",
  "なお、アレクサンドリアを襲った365年のクレタ地震のため、当時の史料は残っておらず、プルタルコスやスエトニウスら後世の歴史家による記録に負うが、その正確性には疑問が残る。",
]
sections = [
  { "title" = "出自", "paragraphs" = [
      "父は紀元前80年 - 紀元前58年および紀元前55年 - 紀元前51年のファラオであるプトレマイオス12世（アウレテス）。プトレマイオス朝末期の王家の系図に不備があるため、母は特定できていないが、クレオパトラ5世、クレオパトラ6世、あるいは氏名不詳の女性の説がある。",
      "クレオパトラ6世は紀元前58年にプトレマイオス12世がエジプトから追放された後にエジプトを統治した人物であるが、5世と同一人物とする説と5世の長女とする説がある。ストラボンはプトレマイオス12世の娘をベレニケ4世、クレオパトラ7世、アルシノエ4世としており、前説の場合これと一致する。後説はポルピュリオスの記述によるもので、この場合プトレマイオス12世の追放に関連したため系図から抹消されたと考えられる。",
      "他の人物として、歴史家ヴェルナー・フスは、紀元前69年頃にプトレマイオス12世はクレオパトラ5世と離婚してメンフィスの有力な家系の女性と結婚しており、この女性がクレオパトラ7世の母としている。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "共和政ローマはエジプト産の穀物を必要としており、セレウコス朝シリアの攻撃を受けたプトレマイオス6世がローマに助けを求めて以降、プトレマイオス朝はその影響下に入っていた。エジプトは当時有数の小麦生産地であり、その販売をプトレマイオス朝が独占していた。後のアウグストゥス時代には、毎年ローマ市の4ヶ月分を賄っていたという。更にはパピルス、ガラス、織物生産地でもあった。これらのことから、プトレマイオス朝は当時世界でも最も裕福であったと推測する学者もいる。",
      "プトレマイオス11世は、紀元前80年にルキウス・コルネリウス・スッラによって玉座に上ったものの同年中に民衆に殺害され、11世の従兄弟でクレオパトラの父であるプトレマイオス12世がローマに無断で即位した。12世は地位の安定のためグナエウス・ポンペイウスを頼ったが、直接介入を渋られたため、紀元前60年に三頭政治が始まると、その一角であるカエサルを買収し、やっと正式に王位が認められた。しかしこの買収にかかった費用を増税でまかなったため、紀元前58年に反乱が起こり、ポンペイウスを頼ってローマ市へ亡命した。このとき一人の娘を伴ったとされ、その場合クレオパトラである可能性を主張する近年の研究者がいる（アテネで発見された石碑に刻まれた\"Liviaの王女\"についての文面があり、それが若きクレオパトラである可能性を主張するもの）。",
      "アレクサンドリアではクレオパトラ6世やその死後ベレニケ4世が摂政の座についたが、紀元前57年、ローマで12世の復位計画が立てられた。これをポンペイウス派が行う陰謀もあったものの頓挫し、結局紀元前55年、シリア属州担当プロコンスル（前執政官）アウルス・ガビニウスと共にアレクサンドリアに舞い戻った12世は、ベレニケ4世を処刑し復位した。しかしながら、亡命中の生活費と政界工作費で莫大な借金を背負うことになった。この戦いに参加した、若きマルクス・アントニウスはベレニケ4世の夫であるアルケラウスの戦死の際に、王に相応しい葬いをしたとして評価された。この時期に、クレオパトラとアントニウスは出会っているという説もある。",
    ] },
  { "title" = "人物", "paragraphs" = [
      "歴史家プルタルコスは『対比列伝』において、オクタウィアヌスの姉でアントニウスの妻のオクタウィアが、その両者の関係修復に尽力し、夫が不在の家を守りつつ、更に子弟の教育にも力を入れるのに対して、クレオパトラは徹頭徹尾、エジプトと自己の保身と愛のため、カエサル、ポンペイウス、アントニウスと駆け引きを繰り広げる自己中心的な人物として描いており、ゲーオア・ブランデスは彼女を、「女の中の女、典型的イヴ」と評している。",
      "フランスの哲学者ブレーズ・パスカルは、クレオパトラがその美貌と色香でカエサルやアントニウスを翻弄したとして、「クレオパトラの鼻がもう少し低かったら、歴史が変わっていた」と評した。",
      "後世の多くの人から世界で最も美しい女性であったと認識され、「絶世の美女」として美女の代名詞になっている人物である。そのため、「実は美人ではなかった」という見解がたびたび研究者によって発表されている。2007年にも、イギリスのBBCニュースで話題になった。",
    ] },
  { "title" = "登場作品", "paragraphs" = [
      "クレオパトラ - 虫プロダクションが1970年に製作した劇場用長編アニメーション映画。クレオパトラの声は中山千夏が演じた。コミカライズ版（[原案・監修]手塚治虫、[漫画]坂口尚）もある。『COM増刊号』（虫プロ商事）誌上（1970年）で発表、2019年『クレオパトラ : 完全版』のタイトルで復刻。ISBN 978-4-8354-5646-1。",
      "砂漠の女王 - 星野之宣による漫画で連作短編『妖女伝説』の中で、1979年から1988年にかけて10年にわたり書き継がれた作品。クレオパトラが「バア転生の秘法」を用いて、古代パレスチナの王女サロメ、パルミラ帝国の女王ゼノビアといった砂漠の女王として転生を繰り返し、数奇な運命をたどってゆく。",
      "クレオパトラだぞ - 藤子・F・不二雄（当時の名義は藤子不二雄）によるSF短編漫画。小学館。1980年、ビックコミック特別編集ビッグゴールド No.6に初出掲載。転生により生前のクレオパトラの夢を見る青年の物語。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "大西陸子「<論説>アクティウムの海戦再考」『史林』第60巻第5号、史学研究会、1977年、690-720頁、doi:10.14989/shirin_60_690、2022年3月28日閲覧。",
      "三戸祥子「クレオパトラ，不滅の美と誇り」『広島文教女子大学紀要』第29巻、広島文教女子大学 : 広島文教女子大学短期大学部、1994年12月、77-93頁、CRID 1390294252778161408、doi:10.51095/kiyo.29.02、ISSN 0919-181X、NAID 120005762553、2023年10月10日閲覧。",
      "物應忠『クレオパトラと共和政ローマ』（兵庫教育大学 修士論文論文）2006年。https://hdl.handle.net/10132/1577。2022年6月3日閲覧。",
    ] },
]

[articles.vi]
text = "Cleopatra VII Thea Philopator (tiếng Hy Lạp Koine: Κλεοπάτρα Θεά Φιλοπάτωρ; 70/69 TCN – 10 tháng 8 năm 30 TCN) là nhà cai trị thực sự cuối cùng của Vương triều Ptolemaios thuộc Ai Cập, mặc dù trên danh nghĩa thì vị pharaon cuối cùng là người con trai Caesarion của bà. Là một thành viên của nhà Ptolemaios, Cleopatra thuộc dòng dõi của Ptolemaios I Soter, một vị tướng gốc Macedonia Hy Lạp, đồng thời là chiến hữu thân cận của Alexandros Đại đế."
title = "Cleopatra VII"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Cleopatra_VII"
intro = [
  "Cleopatra VII Thea Philopator (tiếng Hy Lạp Koine: Κλεοπάτρα Θεά Φιλοπάτωρ; 70/69 TCN – 10 tháng 8 năm 30 TCN) là nhà cai trị thực sự cuối cùng của Vương triều Ptolemaios thuộc Ai Cập, mặc dù trên danh nghĩa thì vị pharaon cuối cùng là người con trai Caesarion của bà. Là một thành viên của nhà Ptolemaios, Cleopatra thuộc dòng dõi của Ptolemaios I Soter, một vị tướng gốc Macedonia Hy Lạp, đồng thời là chiến hữu thân cận của Alexandros Đại đế. Sau khi Cleopatra qua đời, Ai Cập bị sáp nhập vào Đế quốc La Mã, đặt dấu chấm hết cho Thời kỳ Hy Lạp hóa kéo dài từ triều đại của Alexandros Đại đế (336–323 TCN). Tiếng mẹ đẻ của Cleopatra là tiếng Hy Lạp Koine và bà cũng là nhà cai trị đầu tiên của nhà Ptolemaios học và sử dụng tiếng Ai Cập.",
  "Vào năm 58 TCN, Cleopatra có thể đã theo cha mình là Ptolemaios XII rời Ai Cập và sống lưu vong tại Roma. Trước đó, một cuộc nổi loạn trong nước đã khiến Ptolemaios XII bị lật đổ, và con gái lớn của ông, Berenice IV, được đưa lên ngôi. Năm 55 TCN, với sự hỗ trợ quân sự từ La Mã, Ptolemaios XII quay về Ai Cập, giết Berenice và đoạt lại ngôi vua. Sau khi Ptolemaios XII qua đời vào năm 51 TCN, Cleopatra cùng em trai là Ptolemaios XIII được lập làm đồng trị vì. Tuy nhiên, mâu thuẫn giữa hai người nhanh chóng dẫn đến nội chiến. Sau thất bại trong trận Pharsalus (48 TCN) ở Hy Lạp trước kình địch Julius Caesar (Quan chấp chính và độc tài La Mã), chính khách La Mã Pompey đã bỏ chạy tới Ai Cập. Dù từng là đồng minh của Pompey, Ptolemaios XIII lại nghe theo lời cố vấn Potheinos, ra lệnh ám sát Pompey ngay trước khi Caesar đến Alexandria. Sau khi đặt chân tới Ai Cập, Caesar đã chiếm giữ thành Alexandria và đứng ra làm trung gian hòa giải hai chị em Cleopatra và Ptolemaios XIII. Tuy nhiên, Potheinos cho rằng Caesar đang nghiêng về phía Cleopatra, nên đã dẫn quân bản bộ bao vây Caesar và Cleopatra trong cung điện hoàng gia. Cuộc vây hãm kết thúc vào đầu năm 47 TCN khi viện binh của Caesar đến hỗ trợ. Trong trận sông Nil sau đó, Ptolemaios XIII tử trận, còn em gái là Arsinoe IV bị lưu đày sang Ephesus vì có liên quan. Caesar sau đó lập Cleopatra cùng em trai Ptolemaios XIV làm đồng cai trị Ai Cập. Tuy nhiên, ông vẫn giữ mối quan hệ tình cảm bí mật với Cleopatra và họ có với nhau một người con trai, Caesarion. Từ năm 46 đến năm 44 TCN, Cleopatra đến Roma và sống tại khu biệt thự của Caesar với tư cách nữ vương chư hầu. Sau khi Caesar bị ám sát và Ptolemaios XIV qua đời (do Cleopatra âm mưu sát hại) vào năm 44 TCN, bà đưa con trai mình, Caesarion, lên ngôi đồng cai trị, củng cố quyền…",
  "Trong cuộc nội chiến của những người Giải phóng vào năm 43–42 TCN, Cleopatra đứng về phía chế độ Tam hùng lần thứ hai được Octavianus, Marcus Antonius và Marcus Aemilius Lepidus thiết lập nên. Sau cuộc gặp mặt tại Tarsos vào năm 41 TCN, bà đã có mối quan hệ tình ái với Antonius. Ông đã sử dụng quyền lực của mình để hành quyết Arsinoe IV theo lời yêu cầu của Cleopatra và ngày càng phải trông cậy vào hỗ trợ của Cleopatra về cả mặt tài chính và quân sự trong cuộc xâm lược vào đế quốc Parthia và vương quốc Armenia của mình. Tại lễ ban tặng của Alexandria, những người con của Cleopatra với Antonius được chính thức tuyên bố rằng là sẽ được phong tặng những vùng đất khác nhau nằm dưới thẩm quyền của Antonius. Sự kiện này, cùng với đám cưới của Antonius với Cleopatra và việc ly dị Octavia Minor, chị gái của Octavianus, đã dẫn đến cuộc chiến tranh cuối cùng của Cộng hòa La Mã. Sau khi tiến hành một cuộc chiến tranh tuyên truyền, Octavianus đã buộc các đồng minh của Antonius trong Viện nguyên lão La Mã phải bỏ trốn khỏi Roma vào năm 32 TCN và đã khai chiến với Cleopatra. Sau khi đánh bại hạm đội liên hợp của Antonius và Cleopatra trong trận Actium vào năm 31 TCN, quân đội của Octavianus đã xâm lược Ai Cập vào năm 30 TCN, đánh bại Antonius khiến ông phải tự sát. Khi Cleopatra biết được rằng Octavianus đã lên kế hoạch để đưa bà tới Roma với mục đích là cho cuộc diễu binh mừng chiến thắng, bà đã uống thuốc độc tự tử (mặc dù vậy người ta vẫn thường hay tin rằng bà đã bị cắn bởi một con rắn mào).",
  "Đến ngày nay, Cleopatra là một hình tượng nổi tiếng trong văn hóa phương Tây. Danh tiếng của bà được truyền tải dưới hình thức nhiều câu chuyện được sân khấu hóa, là đề tài của những tác phẩm hội họa, sân khấu, kịch và âm nhạc. Câu chuyện về bà được miêu tả trong nhiều tác phẩm như vở kịch Antony và Cleopatra của William Shakespeare; Caesar và Cleopatra của George Bernard Shaw; vở Opera Cléopâtre của Jules Massenet và bộ phim điện ảnh Cleopatra (1963).",
]
sections = [
  { "title" = "Tên gọi", "paragraphs" = [
      "Tên gọi Cleopatra có nguồn gốc từ tên gọi trong tiếng Hy Lạp là Kleopatra (tiếng Hy Lạp: Κλεοπάτρα), có nghĩa là \"Vinh quang của người cha\" ở dạng dành cho nữ giới. Nó được bắt nguồn từ kleos (tiếng Hy Lạp: κλέος), \"vinh quang\", kết hợp cùng với pater (tiếng Hy Lạp: πατήρ), \"tổ tiên\", sử dụng sở hữu cách patros (tiếng Hy Lạp: πατρός). Dạng dành cho nam giới sẽ được viết là Kleopatros (tiếng Hy Lạp: Κλεόπατρος) hoặc Patroklos (tiếng Hy Lạp: Πάτροκλος). Cleopatra là tên người em gái của Alexandros Đại đế, cũng như là tên của Cleopatra Alcyone, vợ của Meleager trong Thần thoại Hy Lạp. Thông qua cuộc hôn nhân của Ptolemaios V Epiphanes với Cleopatra I Syra (một công chúa Seleukos), tên gọi này đã được nhà Ptolemaios chấp nhận. Cleopatra đã thông qua tước hiệu Thea Philopatora (tiếng Hy Lạp: Θεά Φιλοπάτωρα) có nghĩa là \"Vị Nữ thần yêu thương cha của Ngài\".",
    ] },
  { "title" = "Tiểu sử", "paragraphs" = [
      "Các vị pharaon của nhà Ptolemaios đã được vị Tư tế tối cao của Ptah trao vương miện tại Memphis, Ai Cập, nhưng họ lại cư ngụ tại thành phố Alexandria với phần đông cư dân là người Hy Lạp và là một thành phố đa văn hóa, thành phố này được Alexandros Đại đế của Macedonia thành lập. Họ nói tiếng Hy Lạp và cai trị Ai Cập như là các vị vua Hy Lạp thời kỳ Hy Lạp hóa. Họ khước từ việc học ngôn ngữ bản địa của người Ai Cập. Trái lại, Cleopatra lại có thể nói được nhiều ngôn ngữ khác nhau khi trưởng thành và người cai trị đầu tiên của nhà Ptolemaios học tiếng Ai Cập. Bà còn có thể nói được tiếng Ethiopia, Trogodyte, Hebrew (hoặc tiếng Aram), Ả Rập, một thứ tiếng Syria (có thể là Syriac), Media, Parthia và Latin, mặc dù vậy những người La Mã cùng thời với bà sẽ lại thích nói chuyện với bà bằng tiếng Hy Lạp mẹ đẻ của bà hơn. Ngoài tiếng Hy Lạp, Ai Cập và Latin, những ngôn ngữ trên phản ánh khao khát của Cleopatra trong việc khôi phục lại những vùng đất ở Bắc Phi và Tây Á vốn đã từng thuộc về đế chế Ptolemaios.",
      "Người La Mã đã bắt đầu can thiệp vào Ai Cập từ trước khi triều đại của Cleopatra VII bắt đầu. Khi Ptolemaios IX Lathyros qua đời vào cuối năm 81 TCN, ông được kế vị bởi người con gái Berenice III của mình. Tuy nhiên, với việc phe đối lập trong triều đình hoàng gia chống lại ý tưởng về một vị Nữ vương trị vì duy nhất, Berenice III đã chấp nhận đồng trị vì và kết hôn với người anh họ và cũng là con ghẻ của bà, Ptolemaios XI Alexander II, sự dàn xếp này đã được nhà độc tài La Mã Sulla thực hiện. Việc tiến hành các cuộc hôn nhân giữa anh chị em ruột mang tính loạn luân này của nhà Ptolemaios đã được mở đầu bởi Ptolemaios II với người chị gái Arsinoe II của ông. Mặc dù là một tập tục lâu đời của hoàng gia Ai Cập, nó lại bị những người Hy Lạp đương thời coi là ghê tởm. Tuy nhiên, vào triều đại của Cleopatra VII, nó được coi là một sự dàn xếp thông thường đối với các vị vua Ptolemaios. Ptolemaios XI đã sát hại người vợ-mẹ kế của mình chỉ một thời gian ngắn sau đám cưới của họ vào năm 80 TCN, nhưng chính bản thân vị vua này đã bị hành quyết một cách công khai ngay sau đó trong một cuộc bạo loạn vốn là hậu quả của vụ ám sát. Ptolemaios XI và thậm chí có lẽ là Ptolemaios IX hoặc Ptolemaios X Alexander I, đã đem Nhà Ptolemaios làm vật thế chấp cho các khoản vay của Roma, vì vậy người La Mã có đủ cơ sở pháp lý để tiếp quản Ai Cập, chư hầu của họ. Tuy vậy, thay vào đó người La Mã đã chọn cách phân chia vương quốc Ptolemaios giữa những người con hoang của Ptolemaios IX, họ đã trao Cyprus cho Ptolemaios của Cyprus và Ai Cập cho Ptolemaios XII.",
      "Cleopatra VII được sinh ra vào đầu năm 69 TCN, là con gái của pharaon Ptolemaios XII Auletes và một người mẹ không rõ danh tính, mà nhiều nguồn tài liệu cho là Cleopatra VI Tryphaena (cũng còn được biết đến như là Cleopatra V Tryphaena). Tên của Cleopatra V (hoặc VI) Tryphaena không còn xuất hiện trong các văn kiện chính thức chỉ một vài tháng sau khi Cleopatra VII được sinh ra vào năm 69 TCN. Ba người con sau của Ptolemaios XII đều được sinh ra trong hoàn cảnh người vợ của ông vắng mặt. Cleopatra có hai người chị em gái, Berenice IV và Arsinoe IV cũng như hai người em trai, Ptolemaios XIII và Ptolemaios XIV. Vị gia sư thời thơ ấu của bà là Philostratos, nhờ có ông mà bà đã học được nghệ thuật diễn thuyết và triết học Hy Lạp. Theo Duane W. Roller và Joann Fletcher thì trong giai đoạn niên thiếu của mình, Cleopatra có lẽ đã học tập tại Musaeum, bao gồm cả thư viện Alexandria.",
    ] },
  { "title" = "Vương quốc của Cleopatra và vai trò là một quân chủ", "paragraphs" = [
      "Tiếp nối truyền thống của các vị vua Macedonia, Cleopatra đã cai trị Ai Cập và các vùng lãnh thổ khác, như Cyprus, với tư cách là một quân chủ chuyên chế và giữ vai trò như là nhà lập pháp duy nhất của vương quốc. Bà còn là người đứng đầu về tôn giáo trong vương quốc của mình, chủ trì toàn bộ các nghi lễ tôn giáo dành cho những vị thần của cả Ai Cập và Hy Lạp. Bà đã giám sát quá trình xây dựng những ngôi đền khác nhau dành cho các vị thần Ai Cập và Hy Lạp, một giáo đường cho người Do Thái ở Ai Cập và thậm chí đã xây dựng Caesareum của Alexandria dành cho giáo phái thờ cúng thuộc về người bảo trợ và người tình của bà, Julius Caesar. Cleopatra đã trực tiếp tham gia vào các công việc nhà nước trong lãnh thổ của bà, giải quyết các cuộc khủng hoảng, như là nạn đói, bằng việc ra lệnh phân phát lương thực trong các kho thóc của hoàng gia cho những người dân đang đói khát trong một thời kỳ hạn hán vào đầu triều đại của bà. Mặc dù nền kinh tế chỉ huy mà bà đã quản lý lại mang tính lý tưởng nhiều hơn là thực tế, chính quyền đã cố gắng áp đặt việc kiểm soát giá cả, thuế quan và sự độc quyền của nhà nước đối với các loại hàng hóa nhất định, ấn định tỉ giá hối đoái cho các loại ngoại tệ cũng như những luật lệ cứng rắn ép buộc người nông dân không được rời khỏi làng của họ trong mùa gieo trồng và thu hoạch. Những khó khăn hiện rõ về tài chính đã dẫn đến việc Cleopatra phải làm giảm giá trị tiền xu, vốn bao gồm tiền bạc và đồng nhưng lại không có tiền xu bằng vàng giống như của một số vị tiên vương Ptolemaios của bà.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Sau khi bà tự sát, ba người con của bà là Cleopatra Selene II, Alexandros Helios và Ptolemaios Philadelphos được đưa tới Roma cùng với chị gái của Octavianus là Octavia, một người vợ cũ của cha họ, với vai trò là giám hộ. Cleopatra Selene II và Alexandros Helios có mặt trong lễ khải hoàn La Mã của Octavianus vào năm 29 TCN. Không rõ số phận của Alexandros Helios và Ptolemaios Philadelphos sau thời điểm đó ra sao. Về phần Cleopatra Selene II, Octavia đã sắp xếp đám cưới giữa bà và Juba II, con trai của Juba I, vua của vương quốc Numidia ở Bắc Phi đã bị Caesar biến thành một tỉnh La Mã năm 49 TCN do ông ủng hộ kẻ thù của Caesar là Pompey. Sau khi đám cưới được tổ chức năm 25 TCN, hoàng đế Augustus đã bổ nhiệm Juba II cùng Cleopatra Selene làm nhà cai trị Mauretania. Tại đây, họ đã định đô tại thành phố Iol của Carthage năm xưa và đổi tên nó thành Caesarea Mauretaniae (Cherchell, Algérie ngày nay). Cleopatra Selene II đã chiêu mộ nhiều học giả, nghệ sĩ và cố vấn viên từ triều đình của mẹ bà ở Alexandria đến phục vụ bà tại Caesarea, một thành phố nay đã thấm nhuần nền văn hóa Hy Lạp hóa của Hy Lạp. Ngoài ra bà đã đặt tên con trai mình là Ptolemaios của Mauretania nhằm tôn vinh di sản triều đại Ptolemaios của họ.",
      "Cleopatra Selene II mất vào khoảng năm 5 TCN, và khi Juba II mất vào năm 23/24 CN, ngai vị đã được kế thừa bởi con trai ông là Ptolemaios. Tuy nhiên, Ptolemaios có lẽ đã bị xử tử bởi hoàng đế La Mã Caligula năm 40, lấy cớ rằng Ptolemaios đã phạm thượng khi tự cho đúc tiền dành cho riêng mình một cách bất hợp pháp và sử dụng regalia (những thứ chỉ vua chúa dùng) dành riêng cho hoàng đế La Mã. Ptolemaios của Mauretania là vị vua được biết đến cuối cùng của triều đại Ptolemaios, mặc dù nữ vương Zenobia của Đế quốc Palmyra tồn tại ngắn ngủi trong thời kỳ khủng hoảng thế kỷ thứ 3 có tuyên bố là hậu duệ của Cleopatra. Sự thờ phụng Cleopatra vẫn tồn tại đến muộn nhất là vào năm 373 khi một người chép lại cuốn sách về thần Isis người Ai Cập có tên là Petesenufe có giải thích rằng rằng ông đã \"phủ vàng lên hình tượng của Cleopatra\".",
      "Tuy có đến tận 50 bộ sử La Mã cổ đại nhắc đến Cleopatra nhưng chúng chỉ bao gồm những ghi chép ngắn gọn về trận Actium, việc bà tự tử hay những thông tin mang tính tuyên truyền của Augustus về những khuyết điểm của bà. Tác phẩm Cuộc đời của Antonius viết bởi Plutarchus trong thế kỷ thứ 1 tuy không phải là một cuốn tiểu sử về Cleopatra, nhưng lại chứa đựng những ghi chép kỹ lưỡng nhất về cuộc đời của bà. Plutarchus tuy sống sau Cleopatra một thế kỷ, nhưng đã dựa vào nguồn tư liệu chính như Philotas của Amphissa, một người có quyền ra vào cung điện Ptolemaios, hay từ một nhà vật lý học tư của Cleopatra hay từ Quintus Dellius, một người bạn tâm tình của cả Antonius và Cleopatra. Tác phẩm của Plutarchus bao gồm cả quan điểm về bà của Augustus (vốn là tiêu chuẩn thời bấy giờ) cũng như những nguồn không bị tiêu chuẩn đó ràng buộc, chẳng hạn như theo lời kể của các nhân chứng. Sử gia người La Mã gốc Do Thái Josephus sống vào thế kỷ 1 đã cung cấp những thông tin có giá trị về cuộc đời của Cleopatra thông qua mối quan hệ ngoại giao của bà với Herod Vĩ đại. Tuy nhiên, tác phẩm này lại chủ yếu dựa vào hồi ký của Herod và những thông tin có khuynh hướng thiên vị của Nikolaos xứ Damascus, người từng là thủ hộ cho con cái của Cleopatra trước khi chuyển đến Judea để làm cố vấn và một người ghi chép biên niên sử dưới trướng của Herod. Tác phẩm Lịch sử La Mã được hoàn thành vào đầu thế kỷ thứ 3 bởi Cassius Dio tuy không bao hàm được một cách hoàn toàn sự phức tạp của thế giới Hy Lạp hóa thời hậu kỳ nhưng vẫn cung cấp những ghi chép liền mạch về thời kỳ mà Cleopatra cai trị.",
    ] },
]

[articles.id]
text = "Kleopatra VII Filopator (bahasa Yunani: Κλεοπᾰ́τρᾱ Φιλοπάτωρ, Kleopátrā Filopátōr; lahir 69 SM – meninggal 10 atau 12 Agustus 30 SM) adalah penguasa aktif terakhir Kerajaan Wangsa Ptolemaios di tanah Mesir. Kleopatra juga seorang diplomat, laksamana, administrator, poliglot, dan pujangga ilmu pengobatan."
title = "Kleopatra"
lang = "id"
url = "https://id.wikipedia.org/wiki/Kleopatra"
intro = [
  "Kleopatra VII Filopator (bahasa Yunani: Κλεοπᾰ́τρᾱ Φιλοπάτωρ, Kleopátrā Filopátōr; lahir 69 SM – meninggal 10 atau 12 Agustus 30 SM) adalah penguasa aktif terakhir Kerajaan Wangsa Ptolemaios di tanah Mesir. Kleopatra juga seorang diplomat, laksamana, administrator, poliglot, dan pujangga ilmu pengobatan. Selaku putri wangsa Ptolemaios, Kleopatra adalah keturunan dari pendiri wangsanya, Ptolemaios I Soter, salah seorang mantan senapati Yunani Makedonia sekaligus pengiring Aleksander Agung. Sepeninggal Kleopatra, Mesir dijadikan salah satu provinsi Kekaisaran Romawi. Perubahan status Mesir ini menandai akhir dari Zaman Helenistik yang bermula pada masa pemerintahan Aleksander Agung (336–323 SM). Bahasa ibunya adalah bahasa Yunani Koine, dan ia adalah penguasa pertama dari wangsa Ptolemaios yang mempelajari bahasa Mesir.",
  "Pada tahun 58 SM, Kleopatra diduga tinggal bersama ayahnya, Ptolemaios XII, yang hidup dalam pembuangan di Roma setelah digulingkan dari takhta melalui pemberontakan oleh Berenike IV, putri sulung Ptolemaios XII. Berenike IV dieksekusi mati pada tahun 55 SM setelah Ptolemaios XII kembali ke Mesir dengan membawa bala tentara Romawi untuk mengembalikan kekuasaannya. Sepeninggal Ptolemaios XII pada tahun 51 SM, Kleopatra dan adiknya laki-lakinya, Ptolemaios XIII, naik takhta menjadi penguasa bersama. Di kemudian hari, timbul perseteruan di antara keduanya, sampai-sampai meletuskan perang saudara. Saat itu juga sedang meletus Perang Saudara Yulius Kaisar di Romawi antara Pompeyus dan Yulius Kaisar. Setelah Pompeyus kalah dalam Pertempuran Farsalos, negarawan Romawi itu melarikan diri ke Mesir, yang berstatus negara gundal Republik Romawi. Ptolemaios XIII menyuruh orang membunuh Pompeyus pada saat Yulius Kaisar menduduki kota Aleksandria dalam rangka mengejar buronan Romawi itu. Selaku Konsul Republik Romawi, Yulius Kaisar berusaha mendamaikan Ptolemaios XIII dengan Kleopatra, tetapi Poteinos, penasihat utama Ptolemaios XIII, menilai syarat-syarat perdamaian yang ditetapkan Yulius Kaisar lebih menguntungkan pihak Kleopatra, sehingga bala tentara Ptolemaios XIII (di kemudian hari dikuasai oleh adik perempuan Kleopatra, Arsinoe IV) dikerahkan untuk mengepung Yulius Kaisar dan Kleopatra di istana Aleksandria. Aksi pengepungan ini berakhir setelah tiba bala bantuan dari Pergamon dan Yudea pada permulaan tahun 47 SM. Ptolemaios XIII akhirnya gugur dalam Pertempuran Sungai Nil, dan Arsinoe IV dihukum menjalani pembuangan di Efesus. Kleopatra dan adik laki-lakinya, Ptolemaios XIV, dinobatkan menjadi penguasa bersama atas tanah Mesir oleh Yulius Kaisar, yang kala itu telah terpilih…",
  "Dalam Perang Saudara Liberator (43–42 SM), Kleopatra berpihak pada Triumviratus II (persekutuan triwira kali kedua) yang dibentuk oleh Oktavianus, Markus Antonius dan Markus Emilius Lepidus. Setelah bertemu di Tarsos pada tahun 41 SM, Kleopatra dan Markus Antonius menjalin hubungan asmara yang membuahkan tiga orang putra-putri, yakni pasangan kembar Aleksandros Helios dan Kleopatra Selene II, serta Ptolemaios Filadelfos. Markus Antonius memanfaatkan kewenangannya selaku salah seorang triwira untuk mengeksekusi mati Arsinoe IV atas permintaan Kleopatra. Markus Antonius kian bergantung pada Kleopatra sebagai sumber dana maupun bala bantuan semasa menginvasi Kekaisaran Partia dan Kerajaan Armenia. Pada 34 SM, putra-putri Kleopatra dan Markus Antonius dipermaklumkan sebagai penguasa atas sejumlah wilayah Romawi yang sebelumnya berada di bawah kewenangan Markus Antonius. Tindakan ini dikenal dengan nama Donasi Aleksandria. Peristiwa ini, ditambah pula dengan tindakan Markus Antonius menikahi Kleopatra setelah menceraikan Oktavia, kakak Oktavianus, menyulut perang terakhir Republik Romawi. Setelah melakukan perang propaganda, Oktavianus memaksa sekutu-sekutu Markus Antonius yang duduk di dalam Senat Romawi untuk menyingkir dari Roma pada tahun 32 SM, dan mengumumkan perang terhadap Kleopatra. Armada tempur Markus Antonius dan Kleopatra dikalahkan dalam Pertempuran Aktion pada tahun 31 SM, oleh panglima kubu Oktavianus, Markus Vipsanius Agripa. Bala tentara Oktavianus menginvasi Mesir pada tahun 30 SM, dan berhasil mengalahkan bala tentara Markus Antonius, yang akhirnya bunuh diri. Ketika mengetahui bahwa Oktavianus berniat memboyongnya ke Roma untuk dipertontonkan dalam pawai kemenangannya, Kleopatra pun memutuskan untuk bunuh diri dengan menggunakan racun. Menurut keyakinan…",
  "Nama besar Kleopatra terabadikan dalam bentuk karya-karya seni rupa, baik yang kuno maupun modern, dan kejadian-kejadian yang pernah ia alami semasa hidup diabadikan dalam karya-karya sastra maupun media lainnya. Hal-ihwal pribadinya dijabarkan dalam karya-karya tulis historiografi Romawi dan puisi-puisi Latin. Pada umumnya puisi-puisi Latin ini menimbulkan kesan yang kurang baik mengenai dirinya, dan kesan semacam inilah yang di kemudian hari disiarkan oleh karya-karya sastra Abad Pertengahan dan Abad Renaisans. Di bidang seni rupa Abad Kuno, sosok Kleopatra dimunculkan pada kepingan-kepingan uang logam keluaran Romawi dan Kerajaan Wangsa Ptolemaios, arca-arca, patung-patung dada, relief-relief, karya-karya seni ukir kaca, karya-karya seni ukir kameo dan lukisan-lukisan. Sosoknya juga ditampilkan dalam karya-karya seni budaya Abad Renaisans dan karya-karya seni budaya berlanggam Barok, yang meliputi karya-karya seni pahat, seni lukis, seni puisi, serta seni pementasan seperti sandiwara Antonius dan Kleopatra (1608) karya William Shakespeare, dan opera Giulio Cesare in Egitto (1724) gubahan Georg Friedrich Händel. Pada Zaman Modern, sosok Kleopatra muncul dalam karya-karya seni rupa terapan maupun seni rupa murni, karya-karya seni pertunjukan satire burlesque, film-film produksi Hollywood semisal Cleopatra (1963), dan gambar-gambar merek sejumlah barang dagangan, semenjak Kleopatra menjadi ikon budaya pop Egiptomania pada Era Victoria di Britania.",
]
sections = [
  { "title" = "Etimologi", "paragraphs" = [
      "Nama Kleopatra (aksara Yunani: Κλεοπάτρα) berasal dari nama Yunani Kuno yang berarti \"muruah ayahanda\". Nama ini dibentuk dari gabungan kata kléos (aksara Yunani: κλέος) yang berarti \"muruah\" atau \"kehormatan\", dan kata patḗr (aksara Yunani: πατήρ) yang berarti \"ayah\". Bentuk maskulin dari nama ini dapat berupa Kleopatros (aksara Yunani: Κλεόπατρος) atau Patroklos (aksara Yunani: Πάτροκλος). Kleopatra juga merupakan nama adik perempuan Aleksander Agung (Kleopatra dari Makedonia), dan nama istri Meleagros (Kleopatra Alkione) dalam mitologi Yunani. Nama ini mulai dipakai di kalangan wangsa Ptolemaios setelah Ptolemaios V Epifanes menikahi Kleopatra I Sira, seorang putri wangsa Seleukos. Kleopatra menyandang gelar Tea Filopatora (aksara Yunani: Θεά Φιλοπάτωρα) yang berarti \"dewi pengasih ayahanda.\"",
    ] },
  { "title" = "Riwayat hidup", "paragraphs" = [
      "Firaun-firaun dari wangsa Ptolemaios dinobatkan oleh Imam Besar Ptah di kota Memfis, tetapi bermastautin di Aleksandria, kota multibudaya bercorak Yunani yang didirikan oleh Aleksander Agung, tokoh termasyhur asal Makedonia. Firaun-firaun wangsa Ptolemaios bertutur dalam bahasa Yunani, dan memerintah Mesir selayaknya kepala-kepala monarki Yunani Helenistik, bahkan menolak mempelajari bahasa asli Mesir. Kleopatra justru berbeda; ia sudah mampu bertutur dalam beberapa macam bahasa saat mencapai usia dewasa, dan menjadi penguasa pertama dari wangsa Ptolemaios yang belajar bahasa Mesir. Ia juga mampu bertutur dalam bahasa Etiopia, bahasa Trogodit, bahasa Ibrani (atau bahasa Aram), bahasa Arab, bahasa Suriah (mungkin bahasa Suryani), bahasa Media, bahasa Partia, dan bahasa Latin, meskipun orang-orang Romawi sezamannya lebih suka bercakap-cakap dengannya dalam bahasa Yunani Koine, bahasa ibunya. Bahasa-bahasa yang dikuasai Kleopatra selain bahasa Yunani, bahasa Mesir, dan bahasa Latin, mencerminkan hasratnya untuk menguasai kembali daerah-daerah di Afrika Utara dan Asia Barat yang pernah menjadi bagian dari wilayah Kerajaan Wangsa Ptolemaios.",
      "Campur tangan Romawi dalam urusan pemerintahan Mesir sudah berlangsung lama sebelum masa pemerintahan Kleopatra. Ptolemaios IX Latiros mangkat pada penghujung tahun 81 SM, dan digantikan oleh putrinya, Berenike III. Penentangan yang muncul di lingkungan istana terhadap gagasan penobatan seorang perempuan menjadi kepala monarki tanpa pendamping membuat Berenike III terpaksa bersedia untuk menikah dan memerintah bersama-sama dengan saudara sepupu sekaligus anak tirinya, Ptolemaios XI Aleksandros II, sesuai dengan arahan Diktator Republik Romawi, Sula. Tak seberapa lama selepas menikah pada tahun 80 SM, Ptolemaios XI menyuruh orang membunuh Berenike III, tetapi ia sendiri akhirnya tewas dihakimi massa dalam kerusuhan yang dipicu oleh peristiwa pembunuhan Berenike III. Ptolemaios XI, dan mungkin pamannya, Ptolemaios IX, atau mungkin pula ayahnya, Ptolemaios X Aleksandros I, menjadikan Kerajaan Wangsa Ptolemaios sebagai jaminan pinjaman dana dari Republik Romawi, sehingga pemerintah Republik Romawi memiliki landasan hukum untuk mengambil alih pemerintahan Mesir, yang sudah berstatus negara gundalnya, ketika Ptolemaios XI mangkat dibunuh. Meskipun demikian, pemerintah Republik Romawi justru memutuskan untuk memecah wilayah Kerajaan Wangsa Ptolemaios, dan membagi-bagikannya kepada anak-anak Ptolemaios IX di luar pernikahan. Siprus diserahkan kepada Ptolemaios dari Siprus, sementara Mesir diserahkan kepada Ptolemaios XII Auletes.",
      "Kleopatra VII lahir pada awal tahun 69 SM sebagai putri pasangan Firaun Ptolemaios XII Auletes dan seorang perempuan yang tidak diketahui namanya. Mungkin saja ibu Kleopatra adalah permaisuri Ptolemaios XII, Kleopatra VI Trifaina (juga dikenal sebagai Kleopatra V Trifaina), yakni ibu dari kakak Kleopatra, Berenike IV Epifaneia. Nama Kleopatra Trifaina tidak lagi disebut-sebut dalam catatan-catatan resmi kerajaan beberapa bulan setelah kelahiran Kleopatra pada tahun 69 SM. Tiga anak Ptolemaios XII yang paling kecil, yakni Arsinoe IV, Ptolemaios XIII Teos Filopator, dan Ptolemaios XIV, lahir sepeninggal permaisurinya. Guru pribadi Kleopatra semasa kecil adalah Filostratos, yang mengajarinya seni berpidato dan ilmu filsafat Yunani. Sewaktu remaja, Kleopatra agaknya menuntut ilmu di Mouseion, lembaga ilmu pengetahuan dan seni budaya Helenistik di Aleksandria yang juga mencakup Perpustakaan besar kota itu.",
    ] },
  { "title" = "Peranan selaku kepala monarki", "paragraphs" = [
      "Sebagaimana lazimnya para penguasa Makedonia Abad Kuno, Kleopatra memerintah Mesir beserta tanah-tanah jajahannya semisal Siprus selaku seorang kepala monarki yang berkuasa mutlak, dan mengemban kewenangan selaku satu-satunya pembuat undang-undang di kerajaannya. Ia adalah kepala pemuka agama di wilayah kekuasaannya, yang memimpin upacara-upacara pemujaan dewa-dewi Mesir maupun Yunani. Ia menyelenggarakan kegiatan pembangunan berbagai macam kuil pemujaan dewa-dewi Mesir dan Yunani, sebuah sinagoge bagi umat Yahudi di Mesir, dan bahkan membangun gedung Kaisareion Aleksandria, tempat orang memuja Yulius Kaisar, pelindung sekaligus kekasihnya. Kleopatra secara langsung menangani urusan-urusan administratif di wilayah kekuasaannya. Ia menanggulangi kegentingan seperti bencana kelaparan dengan memerintahkan lumbung-lumbung kerajaan membagi-bagikan bahan pangan kepada rakyat yang kelaparan dilanda musim kemarau pada permulaan masa pemerintahannya. Meskipun sistem ekonomi terpimpin yang ia terapkan hanya tinggal cita-cita besar yang tak banyak terwujud, pemerintahannya telah berupaya memberlakukan pengendalian harga, pengenaan bea, dan monopoli negara atas barang-barang tertentu, mematok nilai tukar yang tetap terhadap mata uang asing, serta menegakkan aturan hukum ketat yang mewajibkan para petani untuk bermukim di desa masing-masing selama musim tanam dan musim panen. Gejolak keuangan yang tampak jelas di depan mata mendorong Kleopatra menurunkan nilai uang logam keluaran masa pemerintahannya, yang terdiri atas uang perak dan uang perunggu tetapi tanpa uang emas seperti yang dahulu kala pernah diterbitkan oleh beberapa penguasa dari wangsa Ptolemaios.",
    ] },
  { "title" = "Tinggalan sejarah", "paragraphs" = [
      "Sesudah Kleopatra bunuh diri, ketiga putra-putrinya yang masih hidup, yakni Kleopatra Selene II, Aleksandros Helios, dan Ptolemaios Filadelfos, diberangkatkan ke Roma bersama dengan kakak Oktavianus, yakni Oktavia Muda, mantan istri ayah mereka, yang telah ditunjuk menjadi wali mereka. Kleopatra Selene II dan Aleksandros Helios hadir dalam pawai kemenangan Oktavanus pada tahun 29 SM. Aleksandros Helios dan Ptolemaios Filadelfos tidak lagi terdengar kabar beritanya selepas pawai kemenangan itu. Oktavia menjodohkan Kleopatra Selene II dengan Yuba II, putra Raja Yuba I, penguasa Kerajaan Numidia di Afrika Utara yang telah dijadikan salah satu provinsi Romawi pada tahun 46 SM oleh Yulius Kaisar, lantaran dukungan yang diberikan Yuba I kepada Pompeyus. Setelah Yuba II dan Kleopatra Selene II menikah pada tahun 25 SM, Kaisar Agustus mengangkat mereka menjadi pasangan penguasa baru Mauretania. Mereka membangun kembali Yol, kota tua bangsa Kartago, menjadi ibu kota Kerajaan Mauretania dengan nama baru Kaisarea (bahasa Latin: Caesarea Mauretaniae, sekarang Cherchell, Aljazair). Kleopatra Selene II mendatangkan banyak cerdik pandai, seniman, dan penasihat dari istana mendiang ibunya di Aleksandria, untuk mengabdi padanya di Kaisarea, yang mulai diresapi budaya Yunani Helenistik semenjak masa pemerintahannya. Ia juga memberi nama Ptolemaios dari Mauretania kepada putranya untuk menghormati nama besar wangsa Ptolemaios, leluhur mereka.",
      "Kleopatra Selene II mangkat sekitar tahun 5 SM, dan setelah Yuba II menyusul pada tahun 23 atau 24 M, putra mereka yang bernama Ptolemaios, naik takhta menjadi Raja Mauretania berikutnya. Meskipun demikian, Ptolemaios akhirnya dieksekusi mati atas perintah Kaisar Kaligula pada tahun 40 M, mungkin atas dakwaan mencetak uang sendiri dan mempergunakan lambang-lambang kebesaran yang dikhususkan bagi Kaisar Romawi secara tidak sah. Ptolemaios dari Mauretania adalah kepala monarki terakhir yang diketahui berasal dari nasab raja-raja wangsa Ptolemaios, sekalipun Ratu Zenobia, penguasa Kekaisaran Palmira, negara yang berdaulat selama jangka waktu singkat dalam kurun waktu berlangsungnya Krisis Abad Ketiga, juga mengaku sebagai keturunan Kleopatra. Penyembahan terhadap Kleopatra masih bertahan sampai selambat-lambatnya tahun 373 M, yakni tahun ketika Petesenufe, seorang juru tulis Mesir yang mengerjakan Kitab Isis, mengungkapkan bahwa ia \"menyaluti arca Kleopatra dengan emas.\"",
      "Meskipun kehidupan Kleopatra diriwayatkan dalam hampir lima puluh karya tulis historiografi Romawi dari Abad Kuno, sebagian besar riwayat-riwayat ini hanya berupa keterangan ringkas tentang Pertempuran Aktion, tindakan bunuh diri yang dilakukannya, dan warta propaganda dari masa pemerintahan Kaisar Agustus yang menjelek-jelekkan dirinya. Meskipun bukan biografi Kleopatra, Riwayat Antonius yang disusun oleh Ploutarkos pada abad pertama tarikh Masehi merupakan karya tulis peninggalan Abad Kuno yang memuat keterangan paling lengkap mengenai kehidupan Kleopatra. Ploutarkos, yang hidup seabad sesudah Kleopatra, mendasarkan karya tulisnya pada sumber-sumber primer, misalnya keterangan dari Filotas dari Amfisa, yang diizinkan memasuki istana Kerajaan Wangsa Ptolemaios, keterangan dari tabib pribadi Kleopatra yang bernama Olimpos, dan keterangan dari Kuintus Delius, salah seorang sahabat dekat Markus Antonius dan Kleopatra. Karya tulis Ploutarkos merangkumi keterangan-keterangan mengenai pribadi Kleopatra dari sudut pandang Kaisar Agustus—yang menjadi keterangan baku pada masa hidupnya—maupun keterangan-keterangan dari sumber-sumber lain, misalnya laporan-laporan saksi mata. Sejarawan Romawi keturunan Yahudi, Flavius Yosefus, yang menyusun karya-karya tulisnya pada abad pertama tarikh Masehi, menyajikan keterangan berharga mengenai kehidupan Kleopatra yang diperoleh melalui hubungan diplomatik antara Kleopatra dan Herodes Agung. Meskipun demikian, keterangan Flavius Yosefus mengenai Kleopatra terlalu bertumpu pada memoar Herodes dan keterangan bias Nikolaos dari Damaskus, guru pribadi putra-putri Kleopatra di Aleksandria sebelum pindah ke Yudea dan mengabdi pada Herodes sebagai penasihat sekaligus panitera. Sejarah Romawi (bahasa Yunani: Ῥωμαϊκὴ Ἱστορία, Romaike Historia…",
    ] },
]

[articles.tl]
text = "Si Cleopatra VII Filopator o Cleopatra VII (Griyego: Κλεοπάτρα θεά φιλοπάτωρ) (Disyembre 70 BK o Enero 69 BK–Agosto 12, 30 BK) ang huling paraon-reyna ng Sinaunang Ehipto. Namuno siya sa Ehipto mula 51 BK hanggang 30 BK."
title = "Cleopatra VII ng Ehipto"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Cleopatra_VII_ng_Ehipto"
intro = [
  "Si Cleopatra VII Filopator o Cleopatra VII (Griyego: Κλεοπάτρα θεά φιλοπάτωρ) (Disyembre 70 BK o Enero 69 BK–Agosto 12, 30 BK) ang huling paraon-reyna ng Sinaunang Ehipto. Namuno siya sa Ehipto mula 51 BK hanggang 30 BK. Siya rin ang huling miyembro ng dinastiya o pamilyang Ptolemy na nagmula sa Masedonya, na namuno sa Ehipto sa loob ng 300 mga taon. Dahil dito, siya rin ang huling Griyegong namuno sa Ehipto. Si Ptolemy XII Auletes ang kanyang ama. Pagkalipas ng ilang taon, nakasama niya sa paghahari ang kaniyang anak kay Julius Caesar na si Ptolemy XV Caesarion.",
]
sections = [
  { "title" = "Talambuhay", "paragraphs" = [
      "Sa pagkamatay ng kanyang ama noong 51 BK, naging kasama siyang pinuno ng Ehipto ng kanyang kapatid na lalaking si Ptolemy XIII, na naging asawa niya rin, ayon sa kaugaliang Ehipsiyo. Naganap ito noong 18 taong gulang na siya. Noong 49 BK, pinatalsik ng mga tagapag-alaga ni Ptolemy XIII si Cleopatra mula sa kanyang kapangyarihan. Nang makilala ni Cleopatra si Julius Caesar noong nasa Ehipto ito habang tinutugis ang kalabang si Pompey, ibinalik ni Julius Caesar sa kanyang trono at pamumuno ng Ehipto. Pagkamatay ni Ptolemy XIII, nagpakasal naman si Cleopatra sa isa pa niyang nakababatang kapatid na lalaking si Ptolemy XIV. Subalit nagpunta si Cleopatra sa Roma sa piling ni Julius Caesar. Nagkaroon siya ng anak na lalaki kay Caesar.",
      "Noong sumakabilang buhay si Julius Caesar, nagbalik si Cleopatra sa Ehipto. Umibig siya kay Marcus Antonius, isang Romanong heneral. Nagkaroon si Cleopatra ng kambal na mga anak kay Marcus Antonius. Nang mamatay si Marcus Antonius, nagpakamatay si Cleopatra noong 30 BK.",
    ] },
  { "title" = "Pinagmulan ng pangalan", "paragraphs" = [
      "Ang pangalang \"Cleopatra\" ay hango sa Griyegong salitang ang ibig sabihin ay \"luwalhati ng ama\". Ang kaniyang buong pangalan ay Cleopatra Thea Filopator na may pakahulugang \"ang Diyosa Cleopatra, Minamahal ng Kaniyang Ama\".",
    ] },
  { "title" = "Kaugnayan sa kasalukuyan", "paragraphs" = [
      "Sa kasalukuyan, marahil isa na siya sa pinakatanyag sa lahat ng namuno sa makalumang Ehipto; at kinilala rin sa pangalang \"Cleopatra\". Nakalimutan na ang lahat ng kaniyang mga sinundan. Sa katunayan, hindi namunong mag-isa si Cleopatra. Kapinuno, o kasama niyang namuno ang kaniyang ama, kapatid na lalaki, kapatid na asawa rin, at anak. Gayumpaman, sa lahat ng mga pagkakataong ito, ang mga kapinuno niya ay hari lamang sa pangalan dahil si Cleopatra ang may tunay na kapangyarihan.",
    ] },
]

[articles.pt]
text = "Cleópatra VII Filopátor (em grego clássico: Κλεοπᾰ́τρᾱ Φιλοπάτωρ; romaniz.: Kleopátrā Philopátōr; Alexandria, 69 a.C. – Alexandria, 10 ou 12 de agosto de 30 a.C.) foi a última governante ativa do Reino Ptolemaico do Egito."
title = "Cleópatra"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Cle%C3%B3patra"
intro = [
  "Cleópatra VII Filopátor (em grego clássico: Κλεοπᾰ́τρᾱ Φιλοπάτωρ; romaniz.: Kleopátrā Philopátōr; Alexandria, 69 a.C. – Alexandria, 10 ou 12 de agosto de 30 a.C.) foi a última governante ativa do Reino Ptolemaico do Egito. Como membro da dinastia ptolemaica, foi descendente de Ptolemeu I Sóter, um general greco-macedônio e companheiro de Alexandre, o Grande. Sua língua materna era o grego koiné, e ela é a única governante de sua dinastia conhecida por ter aprendido a língua egípcia. Após sua morte, o Egito passou a ser uma província do Império Romano, marcando o fim do Período helenístico, que começou com o reinado de Alexandre (r. 336–323 a.C.).",
  "É possível que tenha acompanhado seu pai Ptolemeu XII em 58 a.C. durante seu exílio em Roma, depois que uma revolta no Egito permitiu que a filha mais velha de Ptolemeu XII, Berenice IV, reivindicasse o trono. Esta última foi morta em 55 a.C., quando o faraó retornou ao país com assistência militar romana. Quando morreu em 51 a.C., Ptolemeu XII foi sucedido por Cleópatra e seu irmão mais novo, Ptolemeu XIII, como governantes conjuntos, mas um desentendimento entre ambos levou ao início de uma guerra civil. Depois de perder a Batalha de Farsalos na Grécia contra seu rival Júlio César durante a Segunda Guerra Civil, o estadista romano Pompeu fugiu para o Egito, um estado cliente. Ptolemeu XIII ordenou a emboscada e morte de Pompeu enquanto César ocupava Alexandria em busca dele. César, um cônsul da República Romana, tentou reconciliar Ptolemeu XIII com sua irmã. Potino, o conselheiro-chefe do faraó, considerou os termos do cônsul favoráveis à rainha, e assim suas forças, que eventualmente caíram sob o controle de sua irmã mais nova, Arsínoe IV, cercaram César e Cleópatra. O cerco foi levantado por reforços no início de 47 a.C. e Ptolemeu XIII morreu pouco depois na Batalha do Nilo. Arsínoe IV foi exilada em Éfeso, e César, agora ditador eleito, declarou Cleópatra e seu irmão mais novo Ptolemeu XIV como governantes conjuntos. O ditador manteve um caso com a rainha, que gerou um filho, Cesarião. Ela viajou para Roma como rainha cliente em 46 e 44 a.C., ficando numa vila local. Após os assassinatos de César e Ptolemeu XIV (este por ordem da própria Cleópatra) em 44 a.C., esta tentou fazer de Cesarião o herdeiro do ditador.",
  "Na Terceira Guerra Civil entre 43 e 42 a.C., ficou ao lado do Segundo Triunvirato, formado por Otaviano, Marco Antônio e Lépido. Após um encontro em Tarso, em 41 a.C., a rainha teve um caso com Antônio. Ele realizou a execução de Arsínoe a pedido dela e tornou-se cada vez mais dependente de Cleópatra para financiamento e ajuda militar durante suas invasões ao Império Parta e ao Reino da Armênia. As Doações de Alexandria declararam seus filhos Alexandre Hélio, Cleópatra Selene II e Ptolemeu Filadelfo, governantes de vários territórios antigos, sob sua autoridade triunviral. Esse evento, seu casamento e o divórcio de Marco Antônio da irmã de Otaviano, Otávia, a Jovem, levaram à Última Guerra Civil da República Romana. Otaviano se engajou numa guerra de propaganda, forçou os aliados de Antônio no Senado a fugirem de Roma em 32 a.C. e declarou guerra contra Cleópatra. Depois de derrotar a frota naval da ambos na Batalha de Áccio em 31 a.C., as forças de Otaviano invadiram o Egito em 30 a.C. e derrotaram Antônio, o levando ao suicídio. Quando soube que o invasor romano planejava levá-la à sua procissão triunfal, cometeu suicídio por envenenamento, ao contrário da crença popular de que foi mordida por uma víbora.",
  "Seu legado sobrevive em numerosas obras de arte, tanto antigas quanto modernas. A historiografia romana e a poesia latina produziram uma visão predominantemente polêmica e negativa da rainha que permeou as posteriores literaturas medieval e renascentista. Nas artes visuais, representações antigas de Cleópatra incluem a moeda romana e ptolemaica, estátuas, bustos, relevos, vidros e esculturas de camafeus e pinturas. Foi tema de muitas obras na arte renascentista e barroca, incluindo esculturas, pinturas, poesia, dramas teatrais, como Antônio e Cleópatra, de William Shakespeare, e óperas como Giulio Cesare in Egitto, de Georg Friedrich Händel. Nos tempos modernos, tem aparecido nas artes aplicadas e belas artes, na sátira burlesca, em produções cinematográficas e em imagens de marcas para produtos comerciais, tornando-se um ícone popular da egitomania desde o século XIX.",
]
sections = [
  { "title" = "Etimologia", "paragraphs" = [
      "O nome Cleópatra é originário do grego antigo Kleopatra (em grego: Κλεοπάτρα), que significa \"glória de seu pai\" na forma feminina. É derivado de kleos (em grego: κλέος), \"glória\", combinado com pater (em grego: πατήρ), \"antepassados\", usando a forma genitiva patros (em grego: πατρός). A forma masculina teria sido escrita como Kleopatros (em grego: Κλεόπατρος) ou Patroklos (em grego: Πάτροκλος). Cleópatra era o nome da irmã de Alexandre, o Grande, bem como Cleópatra Alcíone, esposa de Meleagro na mitologia grega. O nome entrou na dinastia ptolemaica pelo casamento de Ptolemeu V Epifânio e Cleópatra I Sira (uma princesa selêucida). Seu título adotivo, Tea Filópator (em grego: Θεά Φιλοπάτωρα), significa \"deusa que ama seu pai\".",
    ] },
  { "title" = "Contexto histórico", "paragraphs" = [
      "Os faraós ptolemaicos eram coroados pelo sumo sacerdote de Ptá em Mênfis, mas residiam na cidade multicultural e em grande parte grega de Alexandria, fundada por Alexandre, o Grande da Macedônia. Eles falavam grego e governavam o Egito como monarcas helenísticos, recusando-se a aprender a língua nativa. Em contraste, Cleópatra dominava vários idiomas na idade adulta e foi a primeira governante de sua dinastia a aprender a língua egípcia. Plutarco sugere que ela também falava etíope, troglodita, hebraico (ou aramaico), árabe, a língua síria (talvez siríaca), meda, parta e latim, embora seus contemporâneos romanos preferissem falar com ela em grego koiné nativo. Afora o grego, egípcio e latim, essas línguas refletiam seu desejo de restaurar os territórios do norte da África e da Ásia Ocidental que pertenciam ao Reino Ptolemaico.",
      "O intervencionismo romano no Egito é anterior ao seu reinado. Quando Ptolemeu IX Látiro morreu no final de 81 a.C., foi sucedido por sua filha Berenice III. No entanto, com a crescente oposição na corte real contra a ideia de uma única monarca reinante, Berenice III aceitou o domínio conjunto e o casamento com seu primo e enteado Ptolemeu XI Alexandre II, um arranjo feito pelo ditador romano Sula. Ptolemeu XI matou sua esposa logo após o casamento em 80 a.C., mas foi linchado logo depois no tumulto resultante do assassinato. Ptolemeu XI, e talvez seu tio Ptolemeu IX ou pai Ptolemeu X Alexandre I, legaram o Reino Ptolemaico a Roma como garantia para empréstimos, de modo que os romanos tivessem bases legais para assumir o Egito, seu estado cliente, após o assassinato de Ptolemeu XI. Os romanos preferiram dividir o reino entre os filhos ilegítimos de Ptolemeu IX, concedendo o Chipre a Ptolemeu do Chipre e o Egito a Ptolemeu XII Auleta.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Cleópatra Filópator nasceu no início de 69 a.C. como a filha do faraó Ptolemeu XII e uma mãe desconhecida, presumivelmente Cleópatra VI Trifena (também conhecida como Cleópatra V Trifena), a mãe de sua irmã mais velha, Berenice IV. Cleópatra Trifena desapareceu dos registros oficiais alguns meses após o nascimento de sua filha em 69 a.C. Os três filhos mais novos de Ptolemeu XII, a irmã de Cleópatra, Arsínoe IV, e os irmãos Ptolemeu XIII Téo Filópator e Ptolemeu XIV, nasceram na ausência de sua esposa. Seu tutor de infância foi Filóstrato, com quem aprendeu as artes gregas da oratória e filosofia. Presume-se que durante sua infância estudou no Museu e na Biblioteca de Alexandria.",
      "Em 65 a.C., o censor romano Marco Crasso defendia perante o Senado que Roma deveria anexar o Egito ptolemaico, mas seu projeto de lei e o projeto similar do tribuno Servílio Rulo foram rejeitados dois anos mais tarde. Ptolemeu XII respondeu à ameaça de uma possível anexação oferecendo remunerações e presentes luxuosos a poderosos estadistas romanos, como Pompeu durante sua campanha contra Mitrídates VI do Ponto e, eventualmente, Júlio César depois que este se tornou cônsul romano em 59 a.C. No entanto, o comportamento devasso do faraó o levou à falência, e ele foi forçado a adquirir empréstimos do banqueiro Caio Rabírio Póstumo.",
      "Em 58 a.C., os romanos anexaram o Chipre e, sob acusações de pirataria, levaram Ptolemeu do Chipre, irmão de Ptolemeu XII, a cometer suicídio em vez de se submeter ao exílio em Pafos. O faraó ficou publicamente em silêncio sobre a morte de seu irmão, uma decisão que, juntamente com a cessão do território ptolemaico tradicional aos romanos, prejudicou sua credibilidade entre os cidadãos já enfurecidos por suas políticas econômicas. Ptolemeu XII foi então exilado do Egito à força, viajando primeiro para Rodes, depois para Atenas e, finalmente, à vila do triúnviro Pompeu, nas Colinas Albanas, perto de Palestrina, Itália. O faraó deposto passou quase um ano nos arredores de Roma, aparentemente acompanhado por sua filha Cleópatra, então com cerca de 11 anos. Berenice IV enviou uma embaixada a Roma para defender seu governo e se opor à reintegração de seu pai. Ptolemeu XII mandou assassinos matarem os líderes da embaixada, um incidente que foi encoberto por seus poderosos apoiadores romanos. Quando o Senado Romano negou a Ptolemeu XII a oferta de uma escolta armada e as provisões para um retorno ao Egito, ele decidiu deixar Roma no final de 57 a.C. e residir no Templo de Ártemis em Éfeso.",
    ] },
  { "title" = "Papel como monarca", "paragraphs" = [
      "Seguindo a tradição dos governantes da Macedônia, Cleópatra governou o Egito e outros territórios como Chipre como um monarca absoluto, servindo como o único legislador de seu reino. Era a principal autoridade religiosa, presidindo cerimônias dedicadas às divindades das religiões politeístas egípcia e grega. Ela supervisionou a construção de vários templos para os deuses de ambas as religiões, uma sinagoga para os judeus e até construiu o Cesareu de Alexandria, dedicado ao culto de seu patrono e amante Júlio César. Ela estava diretamente envolvida nos assuntos administrativos de seu domínio, enfrentando crises como a fome, ordenando que os celeiros reais distribuíssem comida à população faminta durante uma seca no início de seu reinado. Embora a economia de comando que ela administrava fosse mais ideal do que real, o governo tentou impor controles de preços, tarifas e monopólios estatais para certos bens, taxas de câmbio fixas para moedas estrangeiras e leis rígidas que obrigavam os camponeses a permanecer em suas aldeias durante as épocas de plantio e colheita. Aparentes problemas financeiros a levaram a desvalorizar sua cunhagem, que incluía moedas de prata e bronze, mas nenhuma de ouro como as de alguns de seus distantes predecessores ptolemaicos.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Após o suicídio, seus três filhos sobreviventes, Cleópatra Selene II, Alexandre Hélio e Ptolemeu Filadelfo, foram enviados para Roma com a irmã do imperador romano, Otávia Júlia, ex-esposa de Antônio, como guardiã. Cleópatra Selene II e Alexandre Hélio estavam presentes no triunfo romano de Otaviano em 29 a.C. O destino de ambos é desconhecido depois disso. Otávia organizou o noivado de Cleópatra Selene II com Juba II, filho de Juba I, cujo reino norte-africano da Numídia havia sido transformado em uma província romana em 46 a.C. por Júlio César, devido ao apoio de Juba I a Pompeu. O imperador Augusto nomeou Juba II e Cleópatra Selene II, após o casamento deles em 25 a.C., como os novos governantes da Mauritânia, onde transformaram a antiga cidade cartaginesa de Iol em sua nova capital, renomeada Cesareia na Mauritânia (atual Cherchell, Argélia). A filha da rainha importou muitos estudiosos, artistas e conselheiros importantes da corte real de sua mãe em Alexandria para servi-la em Cesareia, agora permeada pela cultura grega helenística. Também nomeou seu filho Ptolemeu da Mauritânia, em homenagem à sua herança dinástica ptolemaica.",
      "Cleópatra Selene II morreu por volta de 5 a.C., e quando Juba II morreu em 23/24 d.C., foi sucedido por seu filho Ptolemeu. No entanto, este foi finalmente executado pelo imperador Calígula em 40 d.C., talvez sob o pretexto de que Ptolemeu cunhou ilegalmente sua própria moeda real e utilizou regalias reservadas ao imperador romano. Ptolemeu da Mauritânia foi o último monarca conhecido da dinastia ptolemaica, embora a rainha Zenóbia do Império de Palmira, em sua curta vida durante a crise do terceiro século, tenha reivindicado descendência de Cleópatra. Um culto dedicado à rainha ainda existia em 373 d.C. quando Petesenufe, um escriba egípcio do livro de Ísis, explicou que ele \"sobrepôs a imagem de Cleópatra com ouro.\"",
      "Embora quase 50 obras antigas da historiografia romana mencionem Cleópatra, estas geralmente incluem apenas relatos sucintos da Batalha de Áccio, seu suicídio e a propaganda augustana sobre suas falhas pessoais. Apesar de não ser uma biografia sua, Vida de Antônio, escrita por Plutarco no século I d.C., fornece o relato mais completo da vida da rainha. Plutarco viveu um século depois de Cleópatra, mas contou com fontes primárias, como Filotas de Anfissa, que teve acesso ao palácio real ptolemaico; Olimpo, o médico pessoal dela; e Quinto Délio, confidente pessoal de Cleópatra e Marco Antônio. A obra de Plutarco incluía tanto a visão augustana — que se tornou canônica em seu período — como também fontes fora desta tradição, como relatos de testemunhas oculares. O historiador judeu romano Flávio Josefo, escrevendo no século I d.C., fornece informações valiosas sobre a vida dela através da relação diplomática com Herodes, o Grande. Contudo, esta obra baseia-se em grande parte nas memórias de Herodes e no relato tendencioso de Nicolau de Damasco, tutor dos filhos de Cleópatra em Alexandria antes de ter se mudado à Judeia para servir como conselheiro e cronista na corte do rei. A História Romana publicada pelo oficial e historiador Dião Cássio no início do século III, apesar de não compreender totalmente as complexidades do mundo helenístico tardio, ainda fornece uma história contínua da época do reinado de Cleópatra.",
    ] },
]

