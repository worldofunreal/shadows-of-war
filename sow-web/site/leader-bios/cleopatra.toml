[articles.en]
text = "Cleopatra VII Thea Philopator was Queen of the Ptolemaic Kingdom of Egypt from 51 to 30 BC, and the last active Hellenistic pharaoh. A member of the Ptolemaic dynasty, she was a descendant of its founder, Ptolemy I Soter, a Macedonian Greek general and companion of Alexander the Great."
title = "Cleopatra"
lang = "en"
url = "https://en.wikipedia.org/wiki/Cleopatra"
intro = [
  "Cleopatra VII Thea Philopator (Koine Greek: Κλεοπάτρα Θεά Φιλοπάτωρ, lit. 'Cleopatra father-loving goddess'; 70/69 BC – 10 or 12 August 30 BC) was Queen of the Ptolemaic Kingdom of Egypt from 51 to 30 BC, and the last active Hellenistic pharaoh. A member of the Ptolemaic dynasty, she was a descendant of its founder, Ptolemy I Soter, a Macedonian Greek general and companion of Alexander the Great. Cleopatra's first language was Koine Greek, and she is the only Ptolemaic ruler known to have learned the Egyptian language, among several others. After her death, Egypt became a province of the Roman Empire, marking the end of the Hellenistic period, which had begun with the death of Alexander in 323 BC.",
  "Born in Alexandria, Cleopatra was the daughter of Ptolemy XII Auletes, who named her his heir before his death in 51 BC. Cleopatra began her reign alongside her brother Ptolemy XIII, but a falling-out between them led to a civil war. Roman statesman Pompey, their father's former ally, fled to Egypt after losing the 48 BC Battle of Pharsalus against his rival Julius Caesar, the Roman dictator, in Caesar's civil war. Ptolemy XIII had Pompey ambushed and killed before Caesar arrived and occupied Alexandria. Caesar then attempted to reconcile the rival Ptolemaic siblings, but Ptolemy XIII's forces besieged Cleopatra and Caesar at the palace. Shortly after reinforcements lifted the siege, Ptolemy XIII died in the Battle of the Nile. Caesar declared Cleopatra and her brother Ptolemy XIV joint rulers, and maintained a private affair with Cleopatra which produced a son, Caesarion. Cleopatra traveled to Rome as a client queen in 46 and 44 BC, where she stayed at Caesar's villa. After Caesar's assassination, followed shortly afterwards by the sudden death of Ptolemy XIV (possibly murdered on Cleopatra's order), she named Caesarion co-ruler as Ptolemy XV.",
  "In the Liberators' civil war of 43–42 BC, Cleopatra sided with the Roman Second Triumvirate formed by Caesar's heir Octavian, Mark Antony, and Marcus Aemilius Lepidus. After their meeting at Tarsos in 41 BC, Cleopatra and Antony had an affair which produced three children. Antony became increasingly reliant on Cleopatra for both funding and military aid during his invasions of the Parthian Empire and the Kingdom of Armenia. The Donations of Alexandria declared their children rulers over various territories under Antony's authority. Octavian portrayed this event as an act of treason, forced Antony's allies in the Roman Senate to flee Rome in 32 BC, and declared war on Cleopatra. After defeating Antony and Cleopatra's naval fleet at the 31 BC Battle of Actium, Octavian's forces invaded Egypt in 30 BC and defeated Antony, who committed suicide. After his death, Cleopatra reportedly killed herself, probably by poisoning, to avoid being publicly displayed by Octavian in a Roman triumphal procession.",
  "Cleopatra's legacy survives in ancient and modern works of art. Roman historiography and Latin poetry produced a generally critical view of the queen that pervaded later Medieval and Renaissance literature. In the visual arts, her ancient depictions include Roman busts, paintings, sculptures, cameo carvings and glass, Ptolemaic and Roman coinage, and reliefs. In Renaissance and Baroque art, she was the subject of many works including operas, paintings, poetry, sculptures, and theatrical dramas. She has become a pop culture icon of Egyptomania since the Victorian era, and in modern times has appeared in the applied and fine arts, burlesque satire, Hollywood films, and brand images for commercial products.",
]
sections = [
  { "title" = "Etymology", "paragraphs" = [
      "The Latinized form Cleopatra comes from the Ancient Greek Kleopátra (Κλεοπάτρα), meaning 'glory of her father', from κλέος (kléos, 'glory') and πατήρ (patḗr, 'father'). The masculine form would have been written either as Kleópatros (Κλεόπατρος) or Pátroklos (Πάτροκλος). Cleopatra was the name of the sister of Alexander the Great and the wife of Meleager in Greek mythology. Through the marriage of Ptolemy V Epiphanes and Cleopatra I Syra (a Seleucid princess), the name entered the Ptolemaic dynasty. Cleopatra's adopted title Theā́ Philopátōra (Θεᾱ́ Φιλοπάτωρα) means 'goddess who loves her father'.",
    ] },
  { "title" = "Background", "paragraphs" = [
      "Ptolemaic pharaohs were crowned by the Egyptian high priest of Ptah at Memphis, but resided in the multicultural and largely Greek city of Alexandria, established by Alexander the Great. They governed Egypt as Hellenistic Greek monarchs and refused to learn the native Egyptian language. In contrast, Cleopatra was the first Ptolemaic ruler known to have learned it and could speak multiple languages by adulthood. Plutarch implies that she also spoke Ethiopian, the language of the \"Troglodytes\", Hebrew (or Aramaic), Arabic, the \"Syrian language\" (perhaps Syriac), Median, and Parthian, and she could apparently also speak Latin; her Roman contemporaries would have preferred to speak with her in her native Koine Greek. Aside from Greek, Egyptian, and Latin, these languages reflected Cleopatra's desire to restore North African and West Asian territories that once belonged to the Ptolemaic Kingdom.",
      "Roman interventionism in Egypt predated the reign of Cleopatra. When her grandfather Ptolemy IX Lathyros died in late 81 BC, he was succeeded by his daughter Berenice III. Some courtiers opposed the new queen as a sole reigning female monarch, so the Roman dictator Sulla arranged her marriage to her stepson, Ptolemy XI Alexander II. Ptolemy XI had his wife killed shortly after their marriage in 80 BC, and a mob lynched him soon after. Ptolemy XI willed the Ptolemaic Kingdom to Rome as collateral for loans, giving the Romans legal grounds to take over Egypt, their client state, after his assassination. The Romans chose instead to divide the Ptolemaic realm among the illegitimate sons of Ptolemy IX, bestowing Egypt on Ptolemy XII Auletes and Cyprus on Ptolemy of Cyprus.",
    ] },
  { "title" = "Biography", "paragraphs" = [
      "Cleopatra VII was born in early 69 BC to Pharaoh Ptolemy XII and an uncertain mother, presumably Ptolemy XII's wife Cleopatra V Tryphaena (who may have been the same person as Cleopatra VI Tryphaena), the mother of Cleopatra's older sister, Berenice IV Epiphaneia. Cleopatra Tryphaena disappears from official records a few months after Cleopatra's birth in 69 BC. The three younger children of Ptolemy XII, Cleopatra's sister Arsinoe IV and brothers Ptolemy XIII Theos Philopator and Ptolemy XIV Philopator, were born in the absence of his wife. Cleopatra's childhood tutor was Philostratos, from whom she learned the Greek arts of oration and philosophy. During her youth Cleopatra presumably studied at the Musaeum, including the Library of Alexandria.",
      "In 65 BC the Roman censor Marcus Licinius Crassus argued that Rome should annex Ptolemaic Egypt, but the Roman Senate rejected his proposed bill and the similar bill of tribune Servilius Rullus in 63 BC. Ptolemy XII responded to the threat of annexation by offering remuneration and lavish gifts to powerful Roman statesmen, such as Pompey during his campaign against Mithridates VI of Pontus and Julius Caesar after he became Roman consul in 59 BC. Ptolemy XII's profligate behavior bankrupted him, and he was forced to acquire loans from the Roman banker Gaius Rabirius Postumus.",
      "In 58 BC the Romans annexed Cyprus and on accusations of piracy drove Ptolemy of Cyprus, Ptolemy XII's brother, to commit suicide instead of enduring exile to Paphos. Ptolemy XII remained publicly silent on his brother's death, damaging his credibility among subjects already enraged by his economic policies. He was then exiled from Egypt, traveling first to Rhodes, then Athens, and finally the villa of triumvir Pompey in the Alban Hills, near Praeneste, Italy.",
    ] },
  { "title" = "Cleopatra's kingdom and role as a monarch", "paragraphs" = [
      "Following the tradition of Macedonian rulers, Cleopatra ruled Egypt and other territories such as Cyprus as an absolute monarch, serving as the sole lawgiver of her kingdom. She was the chief religious authority in her realm, presiding over religious ceremonies dedicated to the deities of both the Egyptian and Greek polytheistic faiths. She oversaw the construction of various temples to Egyptian and Greek gods, a synagogue for the Jews in Egypt, and even built the Caesareum of Alexandria, dedicated to the cult worship of her patron and lover Julius Caesar.",
      "Cleopatra was directly involved in her domain's administrative affairs, tackling crises such as famine by ordering royal granaries to distribute food to the starving populace during a drought at the beginning of her reign. A study suggested that volcanic eruptions caused the unfavourable climate and that this contributed to Cleopatra's demise; others expressed skepticism about this hypothesis. Although the command economy that she managed was more of an ideal than a reality, the government attempted to impose price controls, tariffs, and state monopolies for certain goods, fixed exchange rates for foreign currencies, and mandated peasant farmers to stay in their villages during planting and harvesting seasons. Apparent financial troubles led Cleopatra to debase her coinage, which included silver and bronze currencies but no gold coins like those of some of her distant Ptolemaic predecessors.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "After her suicide, Cleopatra's three surviving children, Cleopatra Selene II, Alexander Helios, and Ptolemy Philadelphus, were sent to Rome under the guardianship of Octavian's sister Octavia, a former wife of their father. Cleopatra Selene II and Alexander Helios were present in Octavian's Roman triumph in 29 BC. The fates of Alexander Helios and Ptolemy Philadelphus are unknown after this point. Octavia arranged the betrothal of Cleopatra Selene II to Juba II, son of the Roman client king Juba I of Numidia.",
      "After the wedding of Juba II and Cleopatra Selene II in 25 BC, Emperor Augustus installed them as the new rulers of Mauretania; they made the old Carthaginian city of Iol their capital, renamed Caesarea Mauretaniae (modern Cherchell, Algeria). Cleopatra Selene II imported scholars, artists, and advisers from her mother's royal court in Alexandria to serve her in Caesarea, now permeated in Hellenistic Greek culture. She also named her son Ptolemy in honor of their Ptolemaic dynastic heritage.",
      "Cleopatra Selene II died c. 5 BC, and when Juba II died in 23/24 AD his son Ptolemy succeeded him. The Roman emperor Caligula had Ptolemy executed in 40 AD, perhaps under the pretense that Ptolemy had unlawfully minted his own royal coinage and utilized regalia reserved for the Roman emperor. Ptolemy of Mauretania was the last known monarch of the Ptolemaic dynasty, although the short-reigning 3rd-century Palmyran empress Zenobia claimed descent from Cleopatra. A cult dedicated to Cleopatra still existed as late as 373 AD when Petesenufe, an Egyptian scribe of the book of Isis, explained that he \"overlaid the figure of Cleopatra with gold.\"",
    ] },
]

[articles.es]
text = "Cleopatra VII Thea Filopátor (en griego antiguo: Κλεοπᾰ́τρᾱ Φιλοπάτωρ, romanizado: Kleopátrā Philopátōr;​ 69 a. C.-10 o 12 de agosto de 30 a."
title = "Cleopatra"
lang = "es"
url = "https://es.wikipedia.org/wiki/Cleopatra"
intro = [
  "Cleopatra VII Thea Filopátor (en griego antiguo: Κλεοπᾰ́τρᾱ Φιλοπάτωρ, romanizado: Kleopátrā Philopátōr;​ 69 a. C.-10 o 12 de agosto de 30 a. C.),​ conocida como Cleopatra, fue la última gobernante de la dinastía ptolemaica del Antiguo Egipto, aunque nominalmente la sucedió como faraón su hijo Cesarión.​ También fue diplomática, comandante naval, lingüista​ y escritora de tratados médicos.​ Era descendiente de Ptolomeo I Sóter, fundador de la dinastía ptolemaica, un general grecomacedonio​ de Alejandro Magno. Tras su muerte, Egipto se convirtió en provincia del Imperio romano, lo que marcó el final del período helenístico que se había iniciado con el reinado de Alejandro (336-323 a. C.).​ Aunque su lengua materna era la koiné griega, fue la primera soberana ptolemaica en aprender el idioma egipcio.​En 58 a. C. presuntamente acompañó a su padre, Ptolomeo XII, durante su exilio en Roma tras una revuelta en Egipto (para entonces un Estado cliente de Roma), lo que permitió que su hermana mayor, Berenice IV, reclamara el trono de Ptolomeo. Berenice murió en batalla en 55 a. C., cuando su padre volvió a Egipto con ayuda militar romana. Cuando Ptolomeo murió en 51 a. C., Cleopatra y su hermano menor, Ptolomeo XIII, accedieron al trono como corregentes, pero la ruptura entre ambos desató una guerra civil.",
  "Tras la derrota sufrida por el estadista romano Pompeyo el Grande en 48 a. C. en la batalla de Farsalia por parte de su rival Julio César durante la segunda guerra civil romana, Pompeyo huyó a Egipto, ya que había sido aliado político del padre de Ptolomeo XIII y Cleopatra, pero a sugerencia de los eunucos de la corte, Ptolomeo XIII ordenó emboscar y asesinar a Pompeyo mientras César ocupaba Alejandría en persecución de su enemigo. Como cónsul de la República romana, César trató de reconciliar a Ptolomeo XIII con su hermana Cleopatra, pero Potino el Eunuco, consejero principal del monarca egipcio, creía que los términos que proponía el cónsul beneficiaban a Cleopatra, por lo que sus fuerzas sitiaron a César y Cleopatra en Alejandría. El asedio se levantó gracias a la llegada de aliados de César a comienzos de 47 a. C. y Ptolomeo XIII murió poco después en la batalla del Nilo. Arsínoe IV, media hermana de Cleopatra que había liderado el asedio, se exilió en Éfeso. César, ya elegido dictador, declaró a Cleopatra y a su hermano menor Ptolomeo XIV cogobernantes de Egipto. Sin embargo, el general romano inició una relación sentimental privada con Cleopatra de la que nació Cesarión. Cleopatra viajó a Roma en los años 46 y 44 a. C. como reina vasalla y se alojó en la villa de César. Cuando este fue asesinado en 44 a. C., Cleopatra intentó que su hijo fuera designado heredero, pero no pudo debido al ascenso al poder de Octavio (posteriormente conocido como Augusto, quien sería el primer emperador de Roma en 27 a. C.). Entonces, Cleopatra ordenó asesinar a su hermano Ptolomeo XIV y elevó a su hijo Cesarión como corregente de Egipto, con el nombre de Ptolomeo XV.",
  "Durante la tercera guerra civil de la República romana (43-42 a. C.), Cleopatra se alió con el Segundo Triunvirato, formado por Octavio (sobrino nieto y heredero de César), Marco Antonio y Lépido. Tras su encuentro en Tarso en 41 a. C., la gobernante egipcia inició una relación con Marco Antonio de la que nacieron tres hijos: Alejandro Helios, Cleopatra Selene II y Ptolomeo Filadelfo. Antonio usó su autoridad como triunviro para ejecutar a Arsínoe IV, cumpliendo el deseo de Cleopatra, y se apoyó cada vez más en la reina egipcia tanto para obtener financiación como ayuda militar durante sus invasiones del imperio parto y del Reino de Armenia. En las Donaciones de Alejandría, los hijos de Cleopatra con Marco Antonio fueron nombrados gobernantes sobre varios territorios bajo la autoridad de Antonio. Este hecho, unido al matrimonio de Marco Antonio con Cleopatra después de su divorcio de Octavia la Menor, hermana de Octavio, desató la cuarta guerra civil de la República romana. Después de iniciar una guerra de propaganda, Octavio forzó a huir a los aliados de Antonio en el senado romano y le declaró la guerra a Cleopatra en 32 a. C. La flota de guerra de Marco Antonio y Cleopatra fue derrotada por la de Octavio, bajo el mando de su general Agripa, en la batalla de Accio en 31 a. C., tras lo cual las tropas romanas de Octavio invadieron Egipto en 30 a. C. y derrotaron a las de Antonio, tras lo cual éste se suicidó. Cuando Cleopatra se enteró de que Octavio pretendía llevarla a Roma para exhibirla durante su procesión de triunfo, también se suicidó tomando veneno, si bien popularmente se cree que lo hizo dejándose morder por un áspid.",
  "El legado de Cleopatra permanece en numerosas obras de arte, tanto antiguas como modernas y numerosas dramatizaciones de su vida en la literatura y otros medios. Varias obras de la historiografía romana y la poesía latina retratan a la reina de Egipto, generalmente brindando una perspectiva negativa y polémica de su semblanza, perspectiva que pervivió en la literatura medieval y renacentista. Las artes visuales de la antigüedad representaron a Cleopatra en monedas romanas y ptolemaicas, esculturas, bustos, relieves, vasijas de cristal, camafeos y pinturas. Fue tema de muchas obras del arte renacentista y barroco, como esculturas, pinturas, poemas y obras de teatro como Antonio y Cleopatra (1608), de William Shakespeare, y óperas como Julio César en Egipto (1724), de Händel. En tiempos recientes, ha aparecido tanto en bellas artes como en artes aplicadas, en sátiras burlescas, en películas de Hollywood como Cleopatra (1963) interpretada por Elizabeth Taylor, o como imagen de marcas comerciales, por lo que desde el siglo XIX es un icono pop de la «egiptomanía».",
]
sections = [
  { "title" = "Etimología", "paragraphs" = [
      "La forma latina de Cleopatra proviene del griego antiguo Kleopátrā (en griego: Κλεοπᾰ́τρᾱ), que significa «gloria de su padre» en la forma femenina.​ Este se deriva de kléos (κλέος) ‘gloria’ y patḗr (πᾰτήρ) ‘padre’, utilizando el genitivo patros (πατρός).​ La forma masculina se habría escrito como Kleópatros (Κλεόπᾰτρος) o Pátroklos (Πάτροκλος).​",
      "Cleopatra era el nombre de la hermana de Alejandro Magno, así como el de Cleopatra Alcíon, esposa de Meleagro en la mitología griega.​ A través del matrimonio de Ptolomeo V Epífanes y Cleopatra I Sira (una princesa seléucida), el nombre se introdujo en la dinastía ptolemaica.​​ El título adoptado por Cleopatra Theā́ Philopátōra (Θεᾱ́ Φιλοπάτωρα) significa «diosa que ama a su padre».​​​",
      "En cuanto a la acentuación, la bibliografía en español utiliza las formas Filopator, Filópator y Filopátor, optándose a lo largo de este artículo por la última, de acuerdo con la transcripción al español de los nombres propios griegos en Galiano (1969, p. 81).",
    ] },
  { "title" = "Biografía", "paragraphs" = [
      "Los faraones ptolemaicos eran coronados por el sumo sacerdote de Ptah en Menfis (Egipto), pero residían en Alejandría, ciudad multicultural y mayoritariamente griega, establecida por Alejandro Magno de Macedonia.​​​​ Hablaban griego y gobernaban Egipto como monarcas griegos helenísticos, negándose a aprender el idioma egipcio nativo.​​​​ Por el contrario, Cleopatra hablaba varios idiomas antes de alcanzar la edad adulta y fue la primera gobernante ptolemaica en aprender el idioma egipcio.​​​​​ Según Plutarco, también hablaba etíope, troglodita, hebreo (o arameo), árabe, sirio (tal vez siríaco), medo, parto y latín, aunque sus contemporáneos romanos quizás preferiesen hablar con ella en su griego koiné nativo.​​​​ Su conocimiento de todos estos idiomas también reflejaba su deseo de restaurar los territorios del norte de África y Asia occidental que una vez pertenecieron al Reino ptolemaico.​",
      "El intervencionismo romano en Egipto precedió al reinado de Cleopatra.​​​ Cuando Ptolomeo IX Látiro murió a finales de 81 a. C., lo sucedió su hija Berenice III.​​ Sin embargo, con la oposición en la corte real a la idea de una monarca femenina única reinante, Berenice III aceptó casarse y gobernar conjuntamente con su primo e hijastro Ptolomeo XI Alejandro II, arreglo impuesto por el dictador romano Sila.​​ Ptolomeo XI hizo matar a su esposa poco después de su matrimonio en 80 a. C., pero fue linchado en los disturbios resultantes en Alejandría al conocerse la noticia del asesinato.​​​ Ptolomeo XI, y tal vez su tío Ptolomeo IX o su padre Ptolomeo X Alejandro I, dispusieron el Reino Ptolemaico a Roma como garantía real de préstamos, de modo que los romanos tenían bases legales para apoderarse de Egipto, su Estado cliente,​ después del asesinato de Ptolomeo XI.​​​ En lugar de eso, los romanos prefirieron dividir el reino ptolemaico entre los hijos ilegítimos de Ptolomeo IX, otorgando Chipre a Ptolomeo de Chipre y Egipto a Ptolomeo XII Auletes.​​",
      "Cleopatra nació a principios del año 69 a. C. de la unión del faraón reinante Ptolomeo XII y una madre sobre la que no hay certeza,​ posiblemente la esposa de Ptolomeo XII Cleopatra VI Trifena (también conocida como Cleopatra V),​​​​​ madre de la hermana mayor de Cleopatra, Berenice IV Epifena.​​​​ Cleopatra Trifena desaparece de los registros oficiales unos meses después del nacimiento de Cleopatra en 69 a. C.​​ Los tres hijos menores de Ptolomeo XII (la hermana de Cleopatra, Arsínoe IV; y los hermanos Ptolomeo XIII Teos Filopátor y Ptolomeo XIV)​​​ nacieron en ausencia de su esposa.​​ El tutor de infancia de Cleopatra fue Filóstrato, de quien aprendió las artes de la oratoria y la filosofía griega.​ Durante su juventud, presumiblemente estudió en el Museion (que incluía la Biblioteca de Alejandría).​​",
    ] },
  { "title" = "Reinado y papel como monarca", "paragraphs" = [
      "Siguiendo la tradición de los gobernantes macedonios, Cleopatra gobernó Egipto y otros territorios como Chipre como un monarca absoluto, ejerciendo como única legisladora de su reino.​ También fue su principal autoridad religiosa, presidiendo ceremonias dedicadas a las deidades de las religiones politeístas tanto egipcia como griega.​ Supervisó la construcción de varios templos para los dioses egipcios y griegos,​ una sinagoga para los judíos de Egipto, e incluso construyó el Cesáreo de Alejandría, dedicado a la celebración del culto imperial de su patrono y amante Julio César.​​",
      "Participaba directamente en los asuntos administrativos de su dominio,​ abordando crisis como una hambruna ordenando a los graneros reales que distribuyeran alimentos a la población hambrienta durante una sequía al comienzo de su reinado.​ Aunque la economía centralizada que ella administraba era más un ideal que una realidad,​ su gobierno intentó imponer controles de precios, aranceles y monopolio estatal para ciertos bienes, tipos de cambio fijos para las divisas extranjeras y leyes rígidas que obligaban a los campesinos a permanecer en sus aldeas durante las temporadas de siembra y cosecha.​​​",
      "Aparentemente algunos problemas financieros llevaron a Cleopatra a devaluar su moneda, que consistía en monedas de plata y bronce, pero no monedas de oro como las de algunos de sus lejanos predecesores ptolemaicos.​",
    ] },
  { "title" = "Linaje", "paragraphs" = [
      "Cleopatra perteneció a la dinastía grecomacedonia de los ptolomeos,​​​​ sus orígenes europeos se remontan al norte de Grecia.​ A través de su padre, Ptolomeo XII Auletes, era descendiente de dos destacados somatophylakes de Alejandro el Grande de Macedonia: el general Ptolomeo I Sóter, fundador del reino ptolemaico de Egipto y Seleuco I Nicátor, el fundador grecomacedonio del Imperio seléucida de Asia Occidental.​​​​ Mientras que la rama paterna de Cleopatra puede seguirse a través de su padre, no se conoce con seguridad la identidad de su madre.​​​​ Presumiblemente era hija de Cleopatra VI Trifena (también conocida como Cleopatra V Trifena),​ la prima-esposa​ o la hermana-esposa de Ptolomeo XII.​​​​",
      "Cleopatra I Sira fue el único miembro de la dinastía ptolemaica que con toda certeza introdujo alguna ascendencia no griega, pues era descendiente de Apama I, la esposa persa sogdiana de Seleuco I.​​​ Por lo general se cree que los ptolomeos no se mezclaron con los egipcios nativos.​​​ Michael Grant afirma que solo hay una amante egipcia conocida de un Ptolomeo y no se sabe de ninguna esposa, argumentando además que Cleopatra probablemente no tenía ningún ancestro egipcio y que «se describió a sí misma como griega».​​ Stacy Schiff escribe que Cleopatra era grecomacedonia con una cierta ascendencia persa, argumentando que era raro que los ptolomeos tuvieran una amante egipcia.​​ El arqueólogo estadounidense Duane W. Roller cree que Cleopatra podría haber sido la hija de una mujer mitad grecomacedonia, mitad egipcia, perteneciente a una familia de sacerdotes consagrados a Ptah (una hipótesis generalmente no aceptada por la comunidad académica estudiosa de Cleopatra),​ pero sostiene que cualquiera que fuera la ascendencia de Cleopatra, ella apreciaba más su estirpe ptolemaica griega.​​ El historiador británico Ernle Bradford escribió que Cleopatra no desafió a Roma como egipcia, «sino como una griega culta».​",
      "Por parte de la propaganda romana contraria a ella, nunca se lanzó una acusación de que fuera hija ilegítima.​​​ Estrabón fue el único historiador antiguo que afirmó que los hijos de Ptolomeo XII nacidos después de Berenice IV, incluida Cleopatra, eran ilegítimos.​​​ Cleopatra V (o VI) fue expulsada de la corte de Ptolomeo XII a finales de 69 a. C., pocos meses después del nacimiento de Cleopatra, mientras que los tres hijos menores de Ptolomeo XII nacieron en ausencia de su esposa.​",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Los tres hijos que le sobrevivieron, Cleopatra Selene II, Alejandro Helios y Ptolomeo Filadelfo, fueron enviados a Roma con la hermana de Octavio, Octavia la Menor, exesposa de su padre, como su tutora.​​ Cleopatra Selene II y Alejandro Helios estuvieron presentes en el triunfo de Octavio en 29 a. C.​​ Se desconoce el destino de Alejandro Helios y Ptolomeo Filadelfo después de esta fecha.​​ Octavia organizó el esponsal de Cleopatra Selene II con Juba II, hijo de Juba I, cuyo reino norteafricano de Numidia había sido convertido por Julio César en provincia romana en el año 46 a. C. por el apoyo de Juba I a Pompeyo.​​​ El emperador Augusto nombró a Juba II y Cleopatra Selene II, después de su boda en el año 25 a. C., como los nuevos gobernantes de Mauritania, donde transformaron la antigua ciudad cartaginesa de Iol en su nueva capital, rebautizada como Caesarea Mauretaniae (hoy Cherchell, Argelia).​​ Cleopatra Selene II trajo muchos eruditos, artistas y consejeros importantes de la corte real de su madre en Alejandría para servirla en Cesarea, ahora imbuida de la cultura griega helenística.​ También bautizó a su hijo Ptolomeo de Mauritania, en honor a su herencia dinástica ptolemaica.​​",
      "Cleopatra Selene II murió alrededor del año 5 a. C., y cuando Juba II murió en el año 23/24 d. C. fue sucedido por su hijo Ptolomeo.​​ Sin embargo, Ptolomeo fue finalmente ejecutado por el emperador romano Calígula en el año 40 d. C., tal vez bajo el pretexto de que Ptolomeo había acuñado ilegalmente su propia moneda real y había utilizado iura regalia reservada al emperador romano.​​ Ptolomeo de Mauritania fue el último monarca conocido de la dinastía ptolemaica, aunque la reina Zenobia, del efímero Imperio de Palmira durante la crisis del siglo III, reclamaría su descendencia de Cleopatra.​​",
      "Aunque casi 50 obras antiguas de la historiografía romana hacen referencia a Cleopatra, por lo general solo incluyen breves relatos de la batalla de Accio, su suicidio y la propaganda augustal sobre sus defectos personales.​ A pesar de no ser una biografía de Cleopatra, la Vida de Antonio escrita por Plutarco en el siglo I d. C. como parte de su Vidas paralelas proporciona la narración más completa que se conserva de la vida de Cleopatra.​​​ Plutarco vivió un siglo después de la reina egipcia, pero se basó en fuentes primarias, como Filotas de Anfisa, que tenía acceso al palacio real de Ptolomeo, Olimpo, el médico personal de Cleopatra o Quinto Delio, un confidente cercano a Marco Antonio y Cleopatra.​ El trabajo de Plutarco incluye tanto la visión augustal de Cleopatra —que se convirtió en canon en su época— como fuentes ajenas a esta tradición, como los informes de testigos presenciales.​​",
    ] },
]

[articles.fr]
text = "Cléopâtre VII Philopator (en grec ancien Κλεοπάτρα Θεά Φιλοπάτωρ / Kleopátra Theá Philopátōr, « Cléopâtre la déesse qui aime son père », puis Θεά Νεωτέρα Φιλόπατρις / Theá Neōtéra Philópatris, « Déesse nouvelle qui aime sa patrie ») ou simplement Cléopâtre, née vers 69 av. J.-C."
title = "Cléopâtre VII"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Cl%C3%A9op%C3%A2tre_VII"
intro = [
  "Cléopâtre VII Philopator (en grec ancien Κλεοπάτρα Θεά Φιλοπάτωρ / Kleopátra Theá Philopátōr, « Cléopâtre la déesse qui aime son père », puis Θεά Νεωτέρα Φιλόπατρις / Theá Neōtéra Philópatris, « Déesse nouvelle qui aime sa patrie ») ou simplement Cléopâtre, née vers 69 av. J.-C. à Alexandrie (Égypte) et morte dans la même ville le 12 août 30 av. J.-C., est une reine d'Égypte antique de la dynastie lagide.",
  "Elle règne sur l'Égypte entre 51 et 30 av. J.-C. avec ses frères-époux Ptolémée XIII et Ptolémée XIV puis aux côtés du général romain Marc Antoine. Elle est célèbre pour avoir été la compagne de Jules César puis de Marc Antoine avec lesquels elle a eu plusieurs enfants. Partie prenante dans la guerre civile opposant Marc Antoine à Octave, elle est vaincue à la bataille d'Actium en 31 av. J.-C. Sa défaite permet aux Romains de mener à bien la conquête de l'Égypte, événement qui marque la fin de l'Égypte pharaonique et de l'époque hellénistique.",
  "Cléopâtre est un personnage dont la légende s'est emparée de son vivant même. Sa mort tragique n'a fait qu'ajouter au romanesque qui l'entoure et peut, pour cette raison, nuire à une approche objective de celle qui a été l'une des femmes les plus célèbres de l'Antiquité.",
]
sections = [
  { "title" = "Origines et personnalité", "paragraphs" = [
      "Les principaux auteurs antiques (Plutarque, Suétone et Appien) n'évoquent Cléopâtre que pour sa place dans l'histoire romaine. Nous avons donc peu d'informations sur son séjour à Rome — au lendemain de l'assassinat de César — ou à Alexandrie — durant l'absence d'Antoine, entre 40 et 37 avant l’ère commune. De plus, ces auteurs, inspirés par son vainqueur, l'empereur Auguste et son entourage, la montrent comme l'adversaire malfaisant de Rome et le mauvais génie d'Antoine. On observe par ailleurs que César ne fait aucune mention de sa liaison avec elle dans les Commentaires sur la guerre civile.",
      "Le jugement que porte sur elle Flavius Josèphe au Ier siècle est révélateur : « Elle fit d'Antoine l'ennemi de sa patrie par la corruption de ses charmes amoureux. » La légende noire propagée par la propagande augustéenne est relayée par les poètes (Horace, Properce, Lucain) et les historiens romains (Tite-Live, Dion Cassius, Eutrope), pour lesquels Cléopâtre incarne plusieurs dangers : reine, elle remet en cause les valeurs de la République romaine ; femme de caractère et séductrice, elle met en danger la virilité et la virtus romaine ; ambitieuse, elle menace la liberté ; étrangère d'origine grecque et aux mœurs orientales, elle incarne débauche et luxure. Elle est ainsi à l'opposé des « vertus romaines » comme la pudicitia. Face à l'enthousiasme qu'elle a suscité chez les dramaturges, romanciers et les cinéastes occidentaux, les historiens restent circonspects.",
      "Cléopâtre est née au cours de l'hiver 69/68 avant notre ère ou entre décembre 70 et début janvier 69, probablement à Alexandrie. Elle appartient à la dynastie d'origine macédonienne des Lagides, laquelle règne sur l'Égypte depuis la fin du IVe siècle av. J.-C. Cette dynastie a été fondée par Ptolémée Ier, l'un des généraux d'Alexandre le Grand, qui s'empare de l'Égypte à la mort du conquérant.",
    ] },
  { "title" = "Règne", "paragraphs" = [
      "Fin 52 à début 51 avant notre ère, Cléopâtre VII, alors âgée d'environ dix-huit ans, est associée au pouvoir de son père Ptolémée XII. Quelques mois après, le testament du roi Ptolémée XII, mort en 51, désigne comme successeurs Cléopâtre et un frère cadet de celle-ci, Ptolémée XIII, d'une dizaine d'années environ, à qui elle est nominalement mariée car selon la coutume ptolémaïque, elle ne peut régner seule. Rien ne prouve que Cléopâtre ait voulu exercer la totalité du pouvoir à l'époque, en tout cas les titulatures de cette période lui accordent toujours la seconde place. Ces trois premières années de règne sont difficiles du fait des difficultés économiques : disette des années 50/48, crues insuffisantes du Nil et lutte politique entre l'eunuque Pothin et le général Achillas qui cherchent à opposer le frère et la sœur.",
      "À l'automne 49, les relations se dégradent totalement entre les deux souverains. Les causes de cette rupture sont ignorées, mais à partir de cette date, le nom de la reine figure dans les textes officiels avant celui de Ptolémée XIII. En fait, c'est une véritable guerre qui éclate entre les deux monarques puisqu'à l'été 48, ils se font face à Péluse. Alors que le jeune roi vient d'atteindre sa majorité, Pothin et ses amis accusent la reine de complot contre son frère et provoquent un soulèvement des Alexandrins, si bien que Cléopâtre doit fuir en Syrie puis à Ashkelon, au sud de la Judée, où elle se constitue une armée de mercenaires recrutée parmi les tribus arabes.",
      "C'est alors qu'intervient la puissance romaine. En effet, Pompée, vaincu par Jules César à la bataille de Pharsale à l'été 48 avant notre ère, tente de trouver refuge en Égypte. Pompée a en effet été le protecteur de Ptolémée XII, le père de Cléopâtre et de Ptolémée XIII dont il se considère comme le tuteur. Ptolémée XIII et Cléopâtre auraient d'ailleurs aidé Pompée par l'envoi d'une flotte de soixante navires. Mais le jeune roi Ptolémée XIII et ses conseillers jugent sa cause perdue et pensent s'attirer les bonnes grâces du vainqueur en faisant assassiner Pompée à peine a-t-il posé le pied sur le sol égyptien, près de Péluse, le 28 septembre 48 av. J.-C., sous les yeux de son entourage.",
    ] },
  { "title" = "Œuvre politique", "paragraphs" = [
      "Bien que l'appellation d'« Égyptienne » soit héritée de la propagande augustéenne, Cléopâtre s'est efforcée de renouer avec les traditions séculaires de l'Égypte pharaonique et de s'accommoder avec son peuple. Elle est en effet la seule souveraine qui ait tenté véritablement de rallier les gens de la chôra (la « province » par opposition à la capitale), sachant qu'elle reste peu populaire à Alexandrie, surtout depuis le passage de Jules César. Les indigènes ne se sont guère révoltés durant son règne alors que le royaume connaît une grave crise d'approvisionnement en 42 avant notre ère et que les taxes royales restent toujours aussi élevées, comme en témoignent les importants revenus versés à Marc Antoine.",
      "Elle assume des rituels pharaoniques que ses prédécesseurs ont négligés. Elle adopte notamment le rituel traditionnel pour la naissance de Ptolémée-Césarion-Horus, fils de César-Amon et de Cléopâtre-Isis. Elle s'appuie par ailleurs sur les indigènes égyptiens pour assurer les droits de Césarion à la succession. Elle est aussi la seule de sa dynastie à parler l'égyptien. Elle protège en outre la population juive pour qui le règne de Cléopâtre s'avère une période propice. De nombreux témoignages montrent l'attitude favorable de Cléopâtre envers les Juifs. Vers 30 avant notre ère, elle confirme par exemple un édit remontant à Ptolémée II Philadelphe qui accorde des privilèges à certaines synagogues.",
      "La royauté semble pour elle moins un patrimoine que l'on dilapide qu'une « patrie » que l'on dirige ; ce simple fait la distingue des derniers souverains de la dynastie lagide emportés dans d'inextricables querelles dynastiques et en butte à de nombreuses révoltes.",
    ] },
  { "title" = "Titulature pharaonique", "paragraphs" = [
      "Tous les noms de sa titulature proviennent de la représentation de la naissance de Ptolémée XV sur le temple d'Hermonthis au sud de Thèbes. Les noms d'Horus sont suivis par des cartouches la désignant sous l'épithète de Philopator (« Qui aime son père »).",
    ] },
  { "title" = "Représentations et postérité", "paragraphs" = [
      "Les représentations de Cléopâtre appartiennent à deux traditions distinctes, grecque ou égyptienne. Les images grecques nous montrent la reine vêtue du chiton et de l'himation et coiffée du bandeau plat (diadéma, bandeau dit royal mais présent sur des effigies non royales) des souverains hellénistiques. Les traits du visage se veulent réalistes : visage ovale, pommettes hautes, nez busqué imposant ; cheveux coiffés en chignon et chevelure entortillée en « côtes de melon » (tête en marbre du Vatican, tête en marbre de Berlin). À l'inverse, l'iconographie égyptienne n'est pas du tout réaliste : il s'agit de faire apparaître Cléopâtre comme une souveraine pharaonique traditionnelle, notamment sur les bas-reliefs des temples de Dendérah, Coptos et Hermonthis. L'égyptologue Sally-Ann Ashton a identifié six statues ou fragments de statues qui pourraient représenter Cléopâtre en reine égyptienne. La plus célèbre est conservée au musée de l'Ermitage à Saint-Pétersbourg. Cette sculpture en basalte figure Cléopâtre, coiffée d'une lourde perruque, sous les traits de son ancêtre, Arsinoé II divinisée, dont elle reprend le motif de la double corne d'abondance. Mais les trois cobras qui se dressent au-dessus de son front pourraient être une caractéristique de la dernière reine lagide.",
      "Les monnaies de Cléopâtre appartiennent à l'iconographie grecque. Dix-neuf types monétaires différents ont été publiés. Ils ont été frappés à Alexandrie, Chypre, Cyrène et dans divers ateliers du Proche-Orient actuel (Ascalon, Chalcis du Liban, Damas, Tripoli, Dora, Orthosia). Ces monnaies sont datées de l'ère royale d'Alexandrie qui débute en 52/51 avant notre ère pour Cléopâtre, ou bien de l'ère dite de la Théa néôtéra (« Déesse nouvelle »), une épithète divine prise en 36. Parfois, les deux ères apparaissent conjointement. L'une des innovations majeures du monnayage de Cléopâtre est aussi d'avoir, pour la première fois, fait apparaître la valeur fiduciaire de la monnaie, au revers des pièces de bronzes. Il s'agit, par cette mesure très habile, d'enrayer l'inflation du bronze par rapport à l'argent.",
      "Cléopâtre a été le sujet de nombreux tableaux et dessins, réalisés notamment par Reginald Arthur, Augustin Hirschvogel, Guido Cagnacci, Johann Liss, John William Waterhouse et Jean-André Rixens.",
    ] },
]

[articles.de]
text = "Kleopatra VII. Thea Philopator (altgriechisch Κλεοπάτρα Θεά Φιλοπάτωρ Kleopátra Theá Philopátōr; * 69 v."
title = "Kleopatra VII."
lang = "de"
url = "https://de.wikipedia.org/wiki/Kleopatra_VII."
intro = [
  "Kleopatra VII. Thea Philopator (altgriechisch Κλεοπάτρα Θεά Φιλοπάτωρ Kleopátra Theá Philopátōr; * 69 v. Chr. in Alexandria; † 12. August 30 v. Chr. ebenda) herrschte als letzter Pharao der makedonisch-griechischen Dynastie der Ptolemäer von 51 v. Chr. bis 30 v. Chr. über Ägypten. In den ersten vier Jahren regierte sie zunächst gemeinsam mit ihrem Bruder Ptolemaios XIII., der 47 v. Chr. im Alter von 14 Jahren starb, später mit anderen männlichen Mitregenten, da unter der Garantie Roms gesetzliche Regelungen eine Doppelbesetzung des Thrones vorsahen.",
  "Kleopatra wollte ihr Reich konsolidieren und ausbauen, konnte dieses Ziel aber gegen die Großmacht Rom nicht durchsetzen. Zwar gewann sie die beiden mächtigsten Römer ihrer Zeit, zuerst Gaius Iulius Caesar und nach dessen Ermordung Marcus Antonius, zu Geliebten und konnte mit deren Hilfe für einige Zeit die Machtstellung des Ptolemäerreichs deutlich verbessern; Antonius’ Niederlage gegen den späteren Kaiser Augustus bedeutete jedoch das Ende ihrer Herrschaft. Kleopatra und Antonius begingen Suizid und Ägypten wurde zur römischen Provinz.",
  "Erzählungen und Weiterführungen reduzierten Königin Kleopatra oft auf ihre besagte Schönheit und unterstellten ihr eine hohe Verführungskunst, ohne zu erwähnen, wie erfolgreich und strategisch sie in ihrer Regierung war. Das Liebesdrama von Antonius und Kleopatra, das Verhältnis der ägyptischen Königin zu Caesar sowie die mysteriösen Umstände ihres Todes beflügeln die Fantasie der Menschen seit der Antike und inspirierten zahlreiche bedeutende Schriftsteller, Komponisten, Maler und seit dem 20. Jahrhundert auch Filmproduzenten. Als literarisches Hauptwerk zu diesem Thema gilt die Tragödie Antonius und Cleopatra (um 1606/07) von William Shakespeare.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Durch ihren Vater Ptolemaios XII. Neos Dionysos († 51 v. Chr.) entstammte Kleopatra VII. in gerader Linie altmakedonischem Adel; ihr Vorfahre Ptolemaios I. war ein Offizier Alexanders des Großen gewesen. Ihr Geburtsjahr – 69 v. Chr. – wird abgeleitet aus der Angabe Plutarchs, dass sie im Alter von 39 Jahren starb. Sie war eines von fünf Kindern Ptolemaios’ XII. Dessen ältestes Kind war Berenike IV., die von 58 bis 55 v. Chr. als Ptolemäerkönigin regierte. Dann folgte Kleopatra und als dritte Tochter Arsinoë IV., die etwa zwischen 68 und 65 v. Chr. zur Welt kam. Die letzten Kinder waren die späteren Ehemänner und Mitregenten Kleopatras, Ptolemaios XIII. und Ptolemaios XIV., die 61 und 59 v. Chr. geboren wurden.",
      "Die Mutter Kleopatras VII. wird von den Quellen nicht erwähnt. Nach neueren Forschungen dürfte die Gattin Ptolemaios’ XII., Kleopatra VI. Tryphaina, ausscheiden. Da sie erst 69 v. Chr. verstoßen wurde, könnte sie zwar die Mutter Kleopatras VII. gewesen sein, aber nach Strabon war nur die älteste der drei Töchter von Ptolemaios XII. (also Berenike IV.) ein Kind aus einer legitimen Beziehung. Daher dürften Kleopatra und ihre jüngeren Geschwister einer zweiten Ehe ihres Vaters entstammen, für die es allerdings keine Zeugnisse gibt und die von den Griechen als illegitim betrachtet worden wäre. Als zweite Gattin des Neos Dionysos wird eine vornehme Ägypterin vermutet, möglicherweise eine Angehörige der Hohepriesterfamilie aus Memphis. Dann wäre auch verständlich, dass Kleopatra VII. laut einer Behauptung Plutarchs im Gegensatz zu den früheren Ptolemäern die ägyptische Sprache beherrschte. In diesem Fall wäre sie also von makedonischer und ägyptischer Herkunft gewesen.",
      "Über Kleopatras Jugendjahre liegen nur wenige Angaben vor. Sie wurde in Alexandria geboren und dürfte eine gute Erziehung genossen haben. Hierfür sprechen die Neigungen ihres Vaters, der trotz vieler Untugenden sehr an Kultur und Musik interessiert war. Er holte Wissenschaftler und Philosophen an seinen Hof und diskutierte mit ihnen. Daher wird er auch für eine standesgemäße Ausbildung seiner Kinder gesorgt haben. Plutarch berichtet, dass Kleopatra außer Ägyptisch auch Äthiopisch, die Sprache der Troglodyten, Hebräisch, Arabisch, Syrisch, Medisch, Parthisch und weitere Sprachen beherrscht habe. Ihre Muttersprache war wie die der gesamten ptolemäischen Führungsschicht Griechisch.",
    ] },
  { "title" = "Aussehen und bildliche Darstellungen", "paragraphs" = [
      "Antike Autoren äußern sich nur vage zu Kleopatras Aussehen. Nach Cassius Dio sei sie so schön gewesen, dass sie den ärgsten Frauenfeind in ihre Netze ziehen konnte. Allerdings ist die betörende Schönheit Kleopatras ein spätes Motiv, das erstmals in Lukans Pharsalia in Erscheinung tritt. Zunächst war die Mutmaßung verbreiteter, sie verführe die Männer mithilfe von aphrodisierenden Drogen oder Zauberei, wie es beispielsweise Flavius Josephus darstellt. Plutarch bemüht sich um eine realitätsnähere Erklärung und stellt fest, dass ihre Schönheit nicht unvergleichlich gewesen sei, vielmehr habe sie durch gebildete, anziehende Konversation und feines Benehmen großen Eindruck auf Männer gemacht.",
      "Auf ägyptischen Darstellungen, etwa auf Tempelreliefs, wird Kleopatra traditionell schematisch ohne individuelle Züge abgebildet. Nur Bildnisse hellenistischen Stils liefern daher Hinweise auf ihr Aussehen. Dafür kommen vor allem Münzen in Betracht. Es gibt zwei unterschiedliche, zeitweise parallel emittierte Porträttypen, die nach den Orten ihrer Prägung als „alexandrinische“ und „syrisch-römische“ Münzen bezeichnet werden.",
      "Während Kleopatras gesamter Regierung (51 bis 30 v. Chr.) wurde der „alexandrinische“ Typ geprägt, nicht nur in Alexandria, sondern etwa auch in Askalon oder Damaskus. Die Königin wird jung, etwa 20 Jahre alt, abgebildet. In Profilansicht ist Kleopatra mit einem breiten königlichen Diadem im Haar dargestellt. Sie trägt eine Melonenfrisur mit großem Haarknoten sowie Ohrlocken und hat große Augen, einen vollen Mund über einem niedrigen runden Kinn. Die in einer leicht überhängenden Spitze endende Nase setzt sich mit scharfem Knick von der glatten Stirn ab. Die physiognomischen Details greifen als wiedererkennbare Zeichen die Münzbildnisse ihres Vaters Ptolemaios XII. auf, in deren Nachfolge sie sich präsentiert. Auf den Emissionen der Jahre 38 und 37 v. Chr. aus Askalon werden die Züge Kleopatras schärfer und ausgemagert gezeichnet.",
    ] },
  { "title" = "Wirkung", "paragraphs" = [
      "Wie bei vielen antiken Personen existieren keinerlei Primärquellen mehr wie etwa Briefe Kleopatras, die eine Erhellung ihrer Persönlichkeit aus erster Hand erlauben würden. Mit Ausnahme der kurzen Erwähnungen im Alexandrinischen Krieg sind alle erhaltenen antiken Quellen Kleopatra gegenüber äußerst negativ eingestellt – nicht zuletzt infolge der Propaganda Octavians. Die wichtigsten Informationen zum Leben Kleopatras enthalten Plutarchs Biographien über Antonius und Caesar sowie die Bücher 42–51 der Römischen Geschichte des kaiserzeitlichen Historikers Cassius Dio. Plutarch setzt sein Leben des Antonius zu jenem des Demetrios I. Poliorketes in „Parallele“ und betrachtet diese beiden Feldherrn als negative moralische Beispiele, während er in den meisten anderen Parallelbiographien jeweils eines Römers und eines Griechen ihm ethisch vorbildlicher erscheinende Männer darstellt. Sein anschaulich geschriebenes Werk über Antonius, in dem er auch persönliche Quellen wie Berichte seines Großvaters und Urgroßvaters sowie für Kleopatras Tod den Bericht ihres Leibarztes Olympos verwendet, enthält viele im Kern wohl oft zuverlässige Anekdoten und schildert Kleopatra als große Verführerin. Cassius Dio, dessen Bericht über die späte Republik wohl letztlich auf den römischen Historiker Titus Livius zurückgeht, lässt es wie Plutarch oft an historischer Genauigkeit fehlen. Wie Antonius’ Biograph ist Cassius Dio ein Moralist, zeichnet ein sentimentales Melodrama von Kleopatras letzten Monaten und glaubt der Tradition, dass sie Antonius verriet. Besonders für militärische Details sind die Angaben des Kriegshistorikers Appian (Bürgerkriege, Bücher 2–5, bis 35 v. Chr. reichend) wichtig, der auch augustus-kritische Quellen wie Gaius Asinius Pollio verwendet zu haben scheint. Antonius’ Sturz…",
      "Caesar berichtet in seinen Aufzeichnungen (Ende des dritten Bandes der Bürgerkriege) ausführlich über seine militärischen Aktivitäten gegen die ägyptische Armee, schweigt sich aber über sein Verhältnis mit der Königin völlig aus. Gleiches gilt auch für die unter Caesars Namen überlieferte, aber nicht von ihm stammende Fortsetzung (Alexandrinischer Krieg). An zeitgenössischen Quellen sind sonst nur spezielle Details über Kleopatras Romaufenthalt in einigen Briefen Ciceros erhalten. Asinius Pollios umfangreiches Werk ist verloren, ebenso die ausführliche Darstellung des Livius in ihren über das erste Jahrhundert v. Chr. berichtenden Teilen; von diesen existieren nur sehr kurze Zusammenfassungen mit erkennbar kleopatrafeindlicher Tendenz. Auch von den umfassenden Werken des Erziehers von Kleopatras Kindern, Nikolaos von Damaskus, der später Vertrauter des Herodes und Augustus wurde, sind nur geringe Exzerpte erhalten, doch wurden viele seiner Angaben über das gespannte Verhältnis der ägyptischen Königin zu Herodes in den Jüdischen Altertümern des Flavius Josephus verwendet. Dieser jüdische Historiker stellt Kleopatra äußerst ungünstig dar.",
      "Die römisch-patriotisch eingestellten augusteischen Dichter Vergil, Horaz und Properz verherrlichten in poetischen Darstellungen den Sieg Octavians in der Schlacht bei Actium, durch den sie die angebliche Bedrohung ihrer Heimat durch die ägyptische Königin abgewendet sahen. Die dichterisch eindrucksvollen Werke dieser Poeten sind aber historisch irreführend. Lucan, ein Zeitgenosse Neros, bringt im zehnten Buch seines Epos Pharsalia Informationen über Caesars Verhältnis mit Kleopatra in Alexandria. Gegen das Paar war er sehr feindlich eingestellt.",
    ] },
  { "title" = "Dokumentarfilme", "paragraphs" = [
      "Kleopatra – Macht und Eros. (= Frauen, die Geschichte machten. Folge 4). 44 Min. Regie: Christian Twente, Michael Löseke. Deutschland 2013 (Online in der ZDF Mediathek. Video verfügbar bis 30. November 2033).",
      "Kleopatra – Macht, Intrigen, Luxus. 50 Min. Regie: Lucie Ridout, Tom Brisley. USA 2020.",
      "Kleopatra – Das geheime Grab. 4 Folgen. Regie: Anne-Fleur Delaistre, Julien Balestier. Frankreich 2023.",
    ] },
]

[articles.it]
text = "Cleopatra Tèa Filopàtore (in greco antico Κλεοπάτρα Θεὰ Φιλοπάτωρ?; in egizio: ḳliw-pꜣ-drꜣ, qliu-pa-dra; in latino Clĕŏpătra Thĕa Philopătōr; 70/69 a.C. – Alessandria d'Egitto, 12 agosto 30 a.C.), chiamata nella storiografia moderna Cleopatra VII o semplicemente Cleopatra, è stata una regina egizia appartenente al periodo tolemaico, regnante dal 52 a.C."
title = "Cleopatra"
lang = "it"
url = "https://it.wikipedia.org/wiki/Cleopatra"
intro = [
  "Cleopatra Tèa Filopàtore (in greco antico Κλεοπάτρα Θεὰ Φιλοπάτωρ?; in egizio: ḳliw-pꜣ-drꜣ, qliu-pa-dra; in latino Clĕŏpătra Thĕa Philopătōr; 70/69 a.C. – Alessandria d'Egitto, 12 agosto 30 a.C.), chiamata nella storiografia moderna Cleopatra VII o semplicemente Cleopatra, è stata una regina egizia appartenente al periodo tolemaico, regnante dal 52 a.C. alla sua morte.",
  "Fu l'ultima sovrana della dinastia tolemaica a regnare in Egitto e anche l'ultima di tutta l'età ellenistica, la cui fine si fa coincidere proprio con la sua morte. Donna forte e indipendente, portò avanti una politica espansiva e accentratrice, nonostante il continuo avanzare dell'egemonia della Repubblica romana nel mar Mediterraneo; Cleopatra riuscì, infatti, a relazionarsi efficacemente con Roma, grazie anche al rapporto personale che instaurò con due importanti generali romani, Giulio Cesare e Marco Antonio, ed ebbe un ruolo centrale nell'ultima guerra civile repubblicana (44-31 a.C.), che portò alla nascita dell'Impero romano per iniziativa di Ottaviano Augusto.",
  "Dopo una breve co-reggenza con il padre Tolomeo XII Aulete tra il 52 e il 51 a.C., alla morte di questi Cleopatra salì al trono insieme al fratello minore, Tolomeo XIII; successivamente, a seguito della guerra civile alessandrina (48-47 a.C.), regnò congiuntamente all'altro fratello, Tolomeo XIV, fino alla morte di questi nel 44 a.C., e infine con il figlio maggiore, Tolomeo XV Cesare. Non detenne quindi mai nominalmente il potere da sola, ma in realtà fu sempre lei a comandare sul proprio regno.",
  "È inoltre con tutta probabilità tra le più famose personalità dell'antico Egitto e della storia universale: fin dai tempi antichi, infatti, la sua figura è stata al centro di racconti e ricostruzioni storiche più o meno fantasiose, che l'hanno portata a sopravvivere nell'immaginario comune fino all'epoca contemporanea.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Cleopatra era figlia del faraone Tolomeo XII Aulete e di una donna sconosciuta. Alcuni storici considerano Cleopatra figlia dell'omonima Cleopatra V Trifena, sorella e unica moglie conosciuta di Tolomeo XII, ma lo storico antico Strabone dice indirettamente che era una figlia illegittima. Un'altra teoria indica come madre di Cleopatra una donna di origini egizie, probabilmente membro della famiglia del gran sacerdote di Ptah, con ascendenze sia egizie sia macedoni, visto il legame di Cleopatra con la cultura locale, non comune tra i Tolomei. Sempre secondo la testimonianza di Strabone, Tolomeo XII ebbe solamente una figlia legittima, Berenice IV (da Cleopatra VI), due figlie illegittime (Cleopatra e Arsinoe IV) e due figli illegittimi (Tolomeo XIII e Tolomeo XIV).",
      "Cleopatra apparteneva all'antica famiglia dei Tolomei (o Lagidi) ed era quindi discendente del diadoco Tolomeo I Sotere, fondatore della dinastia e amico d'infanzia di Alessandro Magno; discendeva, inoltre, attraverso l'antenata Cleopatra I, che aveva sposato Tolomeo V Epifane, anche da Seleuco I Nicatore, un altro diadoco, potendo così vantare nobili origini greco-macedoni. Era imparentata con Tolomeo di Cipro e Cleopatra Berenice, fratellastri del padre, ma anche con Tolomeo IX, suo nonno, e, grazie a matrimoni dinastici, con molti membri della dinastia seleucide.",
      "Cleopatra nacque tra la fine del 70 e il 69 a.C. (sicuramente prima del 14 gennaio 69 a.C. e probabilmente durante o dopo il mese di dicembre del 70 a.C.), nel 12º anno di regno del padre, e nel periodo seguente, dal 68 a.C. al 59 a.C., vennero al mondo da diverse madri ignote la sorella Arsinoe IV e i fratelli Tolomeo XIII e Tolomeo XIV. Da piccola Cleopatra studiò nella Biblioteca e nel Museo di Alessandria, e sappiamo che il suo tutore fu Filostrato, che l'avviò alla filosofia, alla retorica e all'oratoria; la sua educazione fu molto vasta e coprì anche i campi della medicina, della fisica e della farmacologia. Sappiamo inoltre che Cleopatra, da regina, era in grado di parlare, nonché probabilmente leggere e scrivere, nelle lingue di «Etiopi, Trogloditi, Ebrei, Arabi, Siri, Medi, Parti e molti altri», come ci dice Plutarco; tra questi altri idiomi c'erano sicuramente il greco antico, l'egizio e il latino e probabilmente altre lingue nord-africane.",
    ] },
  { "title" = "Titolatura", "paragraphs" = [
      "Secondo la titolatura reale egizia, Cleopatra ebbe diversi nomi, ma, poiché era una donna, non le furono concessi tutti:",
      "nome Horo: wr(t) nb(t) nfrw ꜣḫ(t)-sḥ (wer(et), neb(et) neferu, akh(et) seh), \"la grande, posseditrice di perfezione e splendida del tempio\";",
      "nome Horo 2: wrt twt n it.s (weret, tut en it.es), \"la grande e l'immagine stessa di suo padre\";",
    ] },
  { "title" = "Monetazione", "paragraphs" = [
      "La serie egizia di monete emesse da Cleopatra è pressoché continua per tutto il suo regno, con soli pochi anni mancanti nei ritrovamenti; oltre alle monete egizie, però, ne sono state ritrovate anche di provenienti da molte altre zecche dei suoi vasti domini: Antiochia, Ascalona, Berito, Calcide di Siria, Cipro, Damasco, Ortosia, Patrai e dalle città fenice di Tolemaide e Tripoli. Le condizioni economiche sfavorevoli si ripercossero però sull'emissione monetaria: nessuna moneta d'oro, infatti, è conosciuta (comunque monete di questo metallo non erano più in circolazione dal regno di Tolomeo V), quelle d'argento presentano una lega corrotta al 40% e fu invece riattivata la produzione, dormiente dal regno di Tolomeo IX, di quelle di bronzo nella zecca di Alessandria. Contemporaneamente, la regina riformò la monetazione bronzea introducendo tre nuovi tipi di monete; sembra che in questo frangente avesse anche scritto un trattato su pesi e misure, ma questo probabilmente le fu solo attribuito.",
      "Cleopatra fu la prima donna della dinastia a emettere monete per proprio conto e Cesare, probabilmente seguendo il suo esempio, fu il primo romano vivente ad apparire su delle monete; fu inoltre la prima monarca straniera raffigurata su monete romane. Dopo l'unione con Antonio, quindi negli ultimi anni del suo regno, la monetazione di Cleopatra si caratterizzò per la commistione tra caratteristiche greche e latine, sia per quanto riguarda le unità di misura, sia per la lingua, le rappresentazioni e le iscrizioni utilizzate.",
      "Il ritratto della regina sulle monete è l'unica rappresentazione visuale certa di Cleopatra nell'ambito greco-romano, con una sequenza che copre tutto l'arco temporale del suo regno. Tuttavia, molte di queste rappresentazioni facciali presentano – come era già avvenuto per le effigi monetarie di altre regine egizie, quali Hatshepsut, Nefertiti e Arsinoe II – caratteri mascolini, simili a quelli già visti con Tolomeo XII, probabilmente come tentativo di far riconoscere il proprio dominio in quanto donna.",
    ] },
  { "title" = "Fonti e storiografia", "paragraphs" = [
      "Numerose sono le fonti della letteratura latina e greca imperiale che hanno trasmesso informazioni sulla complessa figura di Cleopatra, prodotte da una cinquantina di autori; nessuno si è però concentrato sull'intera vita della regina, ma quasi solo su episodi come la battaglia di Azio e il suo suicidio o sulla sua personalità controversa. Le fonti a lei contemporanee che sono giunte fino a noi sono il De bello Alexandrino, opera anonima attribuita ad Aulo Irzio, in cui però la regina è appena menzionata, e gli scritti di Cicerone, che si soffermano sulla figura di Cleopatra in modo decisamente negativo. Le raccolte più complete di informazioni vengono da pochi autori romani filo-augustei, i quali presentarono la regina egizia come una donna lussuriosa e avida, probabilmente a causa della cultura maschilista romana, senza poter tuttavia negare la sua intelligenza: Plutarco fu il più antico in ordine temporale e le sue informazioni si basarono su fonti contemporanee a Cleopatra non sopravvissute nei secoli successivi, come i membri della corte egizia Filota di Amfissa e Olimpo, il romano Quinto Dellio e il suo stesso bisnonno Nicarco; Cassio Dione, nella sua Storia romana, descrisse gli eventi del mondo romano al tempo della regina, ma non fu in grado di cogliere la complessità della situazione del mondo ellenistico al tempo della sua fine; terza fonte importante è Flavio Giuseppe, contemporaneo di Plutarco, il quale fu il primo ad apprezzare Cleopatra come sovrana impegnata e capace e il cui interesse storiografico riguardò la relazione tra il regno egizio e il mondo della Giudea, basando la propria ricostruzione storica sulle memorie di Erode il Grande e sul lavoro di Nicola di Damasco; i poeti di età augustea, come Virgilio, Properzio, Ovidio e Orazio, mostrarono una…",
      "La visione romana su Cleopatra è racchiusa nella breve biografia, l'unica giuntaci dal mondo antico esplicitamente su di lei, contenuta nel De viris illustribus urbis Romae, anonimo del IV secolo:",
      "Non sono giunte a noi opere integrali egizie o ellenistiche, più vicine alla prospettiva della regina, anche se abbiamo riferimenti di carattere numismatico e papirologico, oltre a frammenti dell'opera storica di Socrate di Rodi e della Lybika di Giuba II di Mauretania, marito di Cleopatra Selene. In Egitto la figura di Cleopatra resistette comunque al passare degli anni e un culto a lei dedicato è attestato fino al 373 d.C., nel tempio di Iside a File. Siamo in possesso, inoltre, di un papiro del 33 a.C., ritrovato nei drappeggi di una mummia, su cui è presente una parola scritta a mano da Cleopatra stessa (γινέσθωι, ginésthoi, \"che accada\"), controfirma utilizzata per evitare la contraffazione di documenti reali; questo reperto è un esempio quasi unico di autografo reale dall'antichità, poiché ne possediamo solamente altri due, uno di Tolomeo X e uno di Teodosio II. Infine, un'opera letteraria sulla cosmetica, citata da Galeno, Aezio di Amida e Paolo di Egina, fu scritta da una certa Cleopatra; tuttavia il nome Cleopatra non era infrequente nel mondo ellenistico e quella all'ultima sovrana tolemaica è quasi certamente un'attribuzione tardo-antica, dichiarata infatti solamente da Aezio e Giovanni Tzetzes, ma non da Galeno.",
    ] },
]

[articles.zh]
text = "克麗奧佩脫拉七世（希臘語：Κλεοπάτρα Θεά Φιλοπάτωρ；拉丁語：Cleopatra VII Philopator；前69年—前30年8月12日），又译克娄帕特拉七世、克里奥帕特拉七世、克莱奥巴特拉七世、克利奥巴特拉七世、克利歐佩特拉七世、克麗奧佩特拉七世、克婁奧巴特七世，是希臘化時代埃及托勒密王國末代女王。 克麗奧佩脫拉七世是托勒密十二世之女，身為托勒密王室成員之一，她身上流著希臘馬其頓人的血統，在亞歷山大大帝逝世後，亞歷山大的將領托勒密一世獲取埃及並建立這個王朝，因此托勒密一世是克麗奧佩脫拉七世的先祖。托勒密王國深受希臘化文明影響，儘管同時使用希臘式國王巴西琉斯頭銜和古埃及法老頭銜，但幾乎多數托勒密王室成員都說希臘語，並拒絕學習當地的埃及語言，這也是作為官廷語言的希臘語和本土埃及語一直並存於政府文件上的原因之一，如羅塞塔石碑。相反地，克麗奧佩脫拉是王室成員中第一個學會埃及語的，還接受古埃及信仰和神靈。她的守護女神是艾西斯，在她統治期間，克麗奧佩脫拉被認為是這位聰慧女神的在世化身。 起初克麗奧佩脫拉與他的父親托勒密十二世一同在位治理國家，之後根據古埃及的傳統，她與亲弟弟托勒密十三世結婚並共治，但克麗奧佩脫拉遭到放逐。 她為了鞏固並奪回失去的權位，她與尤利烏斯·凱撒結盟並成為其情婦，並與凱撒生了一個男孩托勒密十五世，重攬埃及的統治大權。 在前44年，尤利烏斯·凱撒遭到刺殺後，克麗奧佩脫拉與馬克·安東尼一同對付凱撒的合法繼承人屋大維（奥古斯都），並與安東尼生了亞歷山大·赫利俄斯、克麗奧佩脫拉·塞勒涅二世這對雙胞胎，以及托勒密·費拉德爾甫斯。在與屋大維軍的亞克興海戰失利後，馬克·安東尼自己結束生命，克麗奧佩脫拉隨後也跟著自殺。根據傳統上認為，克麗奧佩脫拉是在前30年8月12日以毒蛇「aspis」咬自己而身亡。而克麗奧佩脫拉的兒子，同時也是法老的托勒密·凱撒里昂在母親自殺前夕，因屋大維的命令而被殺，托勒密王國因此被併吞，成為羅馬的埃及行省。她的死亡代表托勒密王國終結，也代表希臘化時期結束，東地中海羅馬時代的開始。 直至今日，克麗奧佩脫拉依舊是西方文明中一個知名的人物，她的形象仍存於無數的藝術作品之中，她的故事在許多文學、戲劇、電影中上演。在大多數的描繪中，克麗奧佩脫拉充滿知性、美貌和性感，並且成功征服當時西方世界最有權勢的男人，故在中文世界有“埃及艷后”之称。在今日文藝或電影上，她被認為是為了保護國家免受羅馬併吞，而色誘凱撒大帝及他的手下馬克·安東尼。"
title = "克娄巴特拉七世"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%85%8B%E5%A8%84%E5%B7%B4%E7%89%B9%E6%8B%89%E4%B8%83%E4%B8%96"
intro = [
  "克麗奧佩脫拉七世（希臘語：Κλεοπάτρα Θεά Φιλοπάτωρ；拉丁語：Cleopatra VII Philopator；前69年—前30年8月12日），又译克娄帕特拉七世、克里奥帕特拉七世、克莱奥巴特拉七世、克利奥巴特拉七世、克利歐佩特拉七世、克麗奧佩特拉七世、克婁奧巴特七世，是希臘化時代埃及托勒密王國末代女王。",
