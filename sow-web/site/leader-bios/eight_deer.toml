[articles.en]
text = "Eight Deer Jaguar Claw, or Eight Deer for brevity, was a powerful Mixtec ruler in 11th-century Oaxaca referred to in the 15th-century deerskin manuscript Codex Zouche-Nuttall, and other Mixtec manuscripts. His surname is alternatively translated Tiger-Claw and Ocelot-Claw."
title = "Eight Deer Jaguar Claw"
lang = "en"
url = "https://en.wikipedia.org/wiki/Eight_Deer_Jaguar_Claw"
intro = [
  "Eight Deer Jaguar Claw (Mixtec: Iya Nacuaa Teyusi Ñaña), or Eight Deer for brevity, (5 October 1063 - 1115) was a powerful Mixtec ruler in 11th-century Oaxaca referred to in the 15th-century deerskin manuscript Codex Zouche-Nuttall, and other Mixtec manuscripts. His surname is alternatively translated Tiger-Claw and Ocelot-Claw.",
]
sections = [
  { "title" = "Biography", "paragraphs" = [
      "Born on the Mixtec Calendar date from which he got his name, Eight Deer was the son of the high priest of Tilantongo ♂ Five Alligator Sun Rain and ♀ Eleven Water Bird Jewel. Two of his brothers, Twelve Earthquake Bloody Jaguar and Nine Flower Copal Ball with Arrow, were his faithful war companions.",
      "He also had a half-sister, Six Lizard Jade Fan. First the fiancée and lover of Eight Deer himself, she was ultimately married to Eight Deer's archenemy Eleven Wind Bloody Jaguar, the king of the city Xipe's Bundle, also known as Red and White Bundle. The lords of Xipe's Bundle had rights to the throne of Tilantongo and were therefore the most important rivals to Eight Deer's power.",
      "♂ Eight Deer is remembered for his military expansion. The Codex Zouche-Nuttall counts 94 cities conquered during his reign. Almost always pictured wearing a jaguar helmet, he supported the powerful Toltec ruler of Cholula, ♂ Four Jaguar Face of the Night, in his attempts at expansionism, and was thus awarded a turquoise nose ornament, a symbol of Toltec royal authority. Maarten Jansen identifies Four Jaguar with Ce Acatl Topiltzin.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Eight Deer was the only Mixtec king to unite kingdoms of the three Mixtec areas: Tilantongo in the Mixteca Alta area, Teozacoalco of the Mixteca Baja area, and Tututepec of the coastal Mixteca area.",
      "His reputation as a great ruler has given him a legendary status among the Mixtecs; some aspects of his life story as told in the pictographic codices seem to merge with myth. Furthermore, actual knowledge of his life is hindered by the lack of complete understanding of the Mixtec codices, and although the study of the codices has advanced much over the past 20 years, it is still difficult to achieve a definitive interpretation of their narrative. The narrative, as it is currently understood, is a tragic story of a man who achieves greatness but falls victim to his own hunger for power. The above biography of Eight Deer is based on the codex's interpretation by Mixtec specialist John Pohl.",
    ] },
  { "title" = "Family", "paragraphs" = [
      "Eight Deer married firstly, in 1103, his niece Thirteen Serpent Flowered Serpent, daughter of Eleven Wind Bloody Jaguar (1027-1099), king of Red and White Bundle, and his first wife Six Lizard Jade Fan (1047-1090), who was also Eight Deer's half-sister and lover. The couple had the following children:",
      "♂ Four Dog Coyote Hunter (1110-c.1150), the official first-born of Eight Deer, actually his second-born. Inherited the realm of Teozacoalco.",
      "♀ Ten Flower Rain Spiderweb, (born 1110), married, in 1124, Four Wind Fire Serpent, her father's killer. Through this marriage, she legitimised Four Wind's occupation of Eight Deer's coastal realm of Tututepec.",
    ] },
]

[articles.it]
text = "Otto Cervo «Artiglio di Giaguaro» (Tilantongo, 1063 - 1115) è stato un sovrano mixteco, signore di Tilantongo, Teozacoalco, Tututepec e di molti altri centri della Mixteca, nell'attuale stato messicano di Oaxaca. È il protagonista più importante dei codici pittografici della regione mixteca, che ne raccontano la biografia in forma drammatizzata."
title = "Otto Cervo «Artiglio di Giaguaro»"
lang = "it"
url = "https://it.wikipedia.org/wiki/Otto_Cervo_%C2%ABArtiglio_di_Giaguaro%C2%BB"
intro = [
  "Otto Cervo «Artiglio di Giaguaro» (Tilantongo, 1063 - 1115) è stato un sovrano mixteco, signore di Tilantongo, Teozacoalco, Tututepec e di molti altri centri della Mixteca, nell'attuale stato messicano di Oaxaca.",
  "È il protagonista più importante dei codici pittografici della regione mixteca, che ne raccontano la biografia in forma drammatizzata. Attraverso le conquiste e le alleanze matrimoniali che promosse giunse a unificare politicamente numerose signorie mixteche del periodo postclassico. Tra le imprese a lui attribuite figurano la fondazione del regno costiero di Tututepec, l'alleanza con il sovrano tolteco Quattro Giaguaro e la presa del potere a Tilantongo.",
  "«Otto Cervo» è il nome calendariale, derivato dal giorno di nascita, mentre «Artiglio di Giaguaro» è un nome personale che lo studioso Alexandre Guida Navarro collega alle sue imprese militari. La combinazione di un nome calendariale e di un nome personale è un modello onomastico che Maarten Jansen e Gabina Aurora Pérez Jiménez illustrano proprio con l'esempio di questo sovrano. Nella letteratura specialistica il suo nome in lingua mixteca è reso come Iya Nacuaa «Teyusi Ñaña ». Nelle fonti in spagnolo e in inglese il nome personale è reso anche come «Garra de Tigre» o «Tiger Claw».",
]
sections = [
  { "title" = "Fonti", "paragraphs" = [
      "Secondo la Library of Congress, la vita di Otto Cervo è rappresentata in tutti i codici mixtechi preispanici conosciuti. Le fonti principali sono i codici seguenti.",
      "Il Codice Zouche-Nuttall (detto anche Codex Tonindeye), conservato al British Museum, contiene due narrazioni: un lato riporta la storia di importanti centri della regione mixteca, mentre l'altro, letto a partire dall'estremità opposta, registra la genealogia, i matrimoni e le imprese politiche e militari di Otto Cervo. Il manoscritto, composto da 47 fogli di pelle di cervo dipinta, proviene dal regno di Teozacoalco (Chiyo Cahnu) ed è datato dal museo tra il 1200 e il 1521. Secondo John Pohl la biografia di Otto Cervo occupa le pagine 42–84 del rovescio. Il codice ricomparve nel 1859 in un monastero domenicano di Firenze e fu donato al British Museum nel 1917. Fu pubblicato per la prima volta in facsimile da Zelia Nuttall nel 1902.",
      "Il Codice Colombino-Becker I (detto anche Codex Iya Nacuaa) era in epoca preispanica un unico documento, che si divise in frammenti nella prima metà del XVI secolo. Fu Alfonso Caso a dimostrare che i due manoscritti sono frammenti di uno stesso codice, poi riuniti nel 1996 in un'edizione intitolata Códice Alfonso Caso. Il Colombino è conservato nella Biblioteca Nacional de Antropología e Historia di Città del Messico, il Becker I nel Museo di Etnologia di Vienna. Jansen e Pérez Jiménez ritengono che il codice provenga probabilmente da Tututepec e hanno proposto di chiamarlo Iya Nacuaa dal nome del suo protagonista. Il codice narra, accanto a quella di Otto Cervo, anche la biografia del signore Quattro Vento. Il Colombino fu utilizzato nel 1717 in una controversia territoriale tra Tututepec e Sola.",
    ] },
  { "title" = "Cronologia", "paragraphs" = [
      "I codici datano gli eventi con i nomi degli anni e dei giorni del calendario mixteco: la nascita di Otto Cervo, ad esempio, cade nell'anno 12 Canna, corrispondente al 1063. Nella ricostruzione di Alfonso Caso, riportata da Miguel León-Portilla, Otto Cervo visse invece nella prima metà dell'XI secolo. In quella cronologia, ad esempio, la cerimonia in cui il sovrano ricevette il titolo di tecuhtli è datata al 1045, anno 7 Casa. La cronologia di Caso è stata successivamente rivista da Emily Rabin. Gli studi più recenti collocano la vita di Otto Cervo tra il 1063 e il 1115 e datano la stessa cerimonia al 1097, anch'esso anno 7 Casa. Il catalogo online del British Museum indica invece come data di nascita il 21 giugno 1064.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Otto Cervo nacque a Tilantongo (Ñuu Tnoo), negli altopiani della Mixteca. Era il primogenito della signora Undici Acqua, seconda moglie del signore Cinque Coccodrillo, sommo sacerdote di Tilantongo. Secondo Arthur Joyce e Marc Levine, i suoi genitori non avevano legami genealogici con le famiglie regnanti né di Tilantongo né di Tututepec. Il fratellastro Dodici Movimento «Giaguaro Sanguinante» lo affiancò nelle campagne militari. Nella lettura di Caso riportata da León-Portilla, le sue prime conquiste risalgono a quando aveva dodici anni. Secondo il Codice Zouche-Nuttall, Otto Cervo si recò al santuario della signora Nove Erba a Chalcatongo, dove ricevette oggetti rituali tra cui un fardello sacro, un bastone di selce, un pesce d'oro e uno scudo a forma di teschio.",
      "A diciotto anni Otto Cervo lasciò Tilantongo per la costa del Pacifico con l'intento di fondarvi un regno. La fondazione di Tututepec (Yucu Dzaa) è datata al 1083 da Marc Levine e al 1084 da Manuel Hermann Lejarazu. Tre codici mixtechi descrivono la fondazione della città come parte della storia eroica di Otto Cervo, che vi unì i tradizionali riti di fondazione mixtechi a un'alleanza con un gruppo degli altopiani legato ai Tolteco-Chichimechi. Levine osserva che i codici presentano la fondazione come un singolo evento, mentre la migrazione mixteca verso la costa fu un processo lungo e complesso. Le ricerche archeologiche indicano che il sito era quasi disabitato nel Postclassico antico e che la città del Postclassico tardo fu fondata come nuovo centro politico.",
      "Dopo la fondazione di Tututepec, Otto Cervo intraprese un'ampia espansione lungo la costa, che si protrasse per diversi anni. I codici Colombino e Zouche-Nuttall raffigurano 26 o 27 località conquistate, molte delle quali non sono ancora state identificate. Tra quelle identificate vi è la «Collina dell'Iguana», l'attuale San Andrés Huaxpaltepec, conquistata nell'anno 6 Selce (1096). Secondo Hermann Lejarazu, queste conquiste posero le basi dell'impero di Tututepec, che esisteva ancora all'arrivo degli Spagnoli nel XVI secolo. Al suo apogeo, nel Postclassico tardo, Tututepec raggiunse un'estensione di 21,85 km² e fu la capitale di un impero di circa 25 000 km².",
    ] },
  { "title" = "Storiografia", "paragraphs" = [
      "In una recensione del 2011 Maarten Jansen ha descritto Otto Cervo come l'individuo più importante della storia mixteca. La studiosa Nancy Troike ha letto la sua vita come una tragedia shakespeariana. Jansen considera i codici mixtechi che ne narrano la storia esempi di storiografia mesoamericana precoloniale. Secondo Hermann Lejarazu, a differenza delle narrazioni del Messico centrale giunte attraverso cronisti di epoca coloniale, i codici mixtechi preispanici non passarono per tali filtri e le loro narrazioni si formarono prima della conquista spagnola. Nel 1910 Abraham Castellanos propose una lettura poetica e mistica del Codice Iya Nacuaa nell'opera El Rey Iukano y los Hombres del Oriente.",
    ] },
]

[articles.de]
text = "Acht-Hirsch-Jaguarkralle (mixtekisch: Iya Nacuaa Teyusi Ñaña; spanisch Ocho Venado; * 1063 in Tilantongo; † 1115 ebenda) war der bedeutendste Fürst der Mixteken."
title = "Acht-Hirsch-Jaguarkralle"
lang = "de"
url = "https://de.wikipedia.org/wiki/Acht-Hirsch-Jaguarkralle"
intro = [
  "Acht-Hirsch-Jaguarkralle (mixtekisch: Iya Nacuaa Teyusi Ñaña; spanisch Ocho Venado; * 1063 in Tilantongo; † 1115 ebenda) war der bedeutendste Fürst der Mixteken.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Der Name Acht-Hirsch gibt gleichzeitig sein Geburtsjahr an. Er war ein nachgeborener Sohn seines Vaters, des Herrschers in Tilantongo 5-Krokodil-Regensonne, mit einer Nebenfrau. Als solcher hatte er ursprünglich wenig Aussichten auf den Thron. Er war jedoch als Krieger sehr erfolgreich. Zahlreiche Eroberungen führte er zunächst gemeinsam mit seinem Bruder 12-Bewegung-Jaguarblut durch. Nachdem dieser von Dritten ermordet worden war, wurde Acht-Hirsch zum Alleinherrscher. Er schaltete zahlreiche mixtekische Kleinfürsten und Konkurrenten effizient, meist durch Gefangennahme und Opferung, aus und vermählte sich mit deren Witwen oder Töchtern. Er war der erste, wenn nicht sogar der einzige Fürst, dem es gelang, alle drei mixtekischen Städtebünde im Hochland, im Tiefland und an der Küste unter der Hauptstadt Tilantongo zu vereinigen. Verwandte von unterworfenen und geopferten Adligen verbündeten sich schließlich, nahmen Acht-Hirsch gefangen und opferten ihn. Obwohl er einige Nachkommen als Thronprätendenten hinterließ, zerfiel das von ihm aufgebaute mixtekische Großreich nach seinem Tod schnell wieder in lokale Fürstentümer und Städtebünde.",
      "Die herausragende Geschichte von Acht-Hirsch und sein Lebensweg, insbesondere seine kriegerischen Unternehmungen und Erfolge, aber auch seine dynastische Verflechtung wurden im Codex Nuttall niedergeschrieben. Weitere Codices, wie der Codex Colombino (Mexiko), der Codex Becker I (Wien), der Codex Vindobonensis (Wien), der Codex Bodley (Oxford) und der Codex Selden (Oxford), erwähnen ihn wenigstens.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Wolfgang Gockel: Mexiko. Das zentrale Hochland und Yucatán. Von den Stätten der Maya und Azteken zu barocken Kirchen und Konventen. DuMont, Köln 1998, S. 68–70 (Online).",
      "Viola König: Schrift im Alten Mexiko. Jahrbuch des Übersee-Museums VI, Bremen 1997, S. 143–144.",
      "John M. D. Pohl: The Legend of Lord Eight Deer: An Epic of Ancient Mexico. New York 2002, ISBN 0-19-514019-2 (eingeschränkt online [PDF; 14,8 MB]).",
    ] },
]

[articles.ru]
text = "Ия Накуаа Тейуси Няня (мишт. Iya Nacuaa Teyusi Ñaña; 1063 — 1115) — правитель миштеков в 1079–1115 годах, военачальник."
title = "Восьмой Олень Коготь Ягуара"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%92%D0%BE%D1%81%D1%8C%D0%BC%D0%BE%D0%B9_%D0%9E%D0%BB%D0%B5%D0%BD%D1%8C_%D0%9A%D0%BE%D0%B3%D0%BE%D1%82%D1%8C_%D0%AF%D0%B3%D1%83%D0%B0%D1%80%D0%B0"
intro = [
  "Ия Накуаа Тейуси Няня (мишт. Iya Nacuaa Teyusi Ñaña; 1063 — 1115) — правитель миштеков в 1079–1115 годах, военачальник. Пытался создать централизованное миштекское государство. Имя переводится как «Восьмой Олень», титул — как «Коготь Ягуара», также есть варианты перевода «Коготь Тигра» и «Коготь Оцелота».",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "Родился в 1063 году в городе Тилантонго. Отец — жрец и вождь Пятый Крокодил Солнечный Дождь, мать — Одиннадцатая Вода Драгоценность Птицы, принцесса из Текамачалько. В 1079 году унаследовал власть после смерти отца; тогда же совершил первый удачный поход, присоединив к подконтрольным землям «страну поросших травой холмов». В дальнейшем заручился поддержкой миштеко-тольтекского владетеля по имени «Четвертый Ягуар» из Чолулы, а также снискал благосклонность влиятельного миштекского жречества, которому обещал расширение храмового строительства и придание культовым церемониям большего размаха.",
      "В 1099–1101 годах провёл успешную военно-дипломатическую кампанию против другого претендента на общемиштекское господство — города-государства «Узел Шипе-Тотека» (также известен как «Красно-Белый Узел», точная терминология не выработана), расположенного на теуантепекском побережье Тихого океана. Ия Накуаа вмешался в династическую ссору после смерти правителя города — «Одиннадцатого Ветра». В результате три сына и племянник умершего владыки были принесены в жертву богам, а на их сестре по имени Тринадцатая Змея Ия Накуаа женился, став законным владетелем государства «Узел Шипе-Тотека».",
      "Следующим и самым мощным конкурентом Ия Накуаа в борьбе за общемиштекское доминирование стала воинственная правительница города-государства «Дымная Гора», которую кодексы именуют Змеиной Накидкой или правительницей по имени Шестая Обезьяна. Ия Накуаа победил её в 1111 году. В общей сложности Ия Накуаа хитростью и ловкой политикой сумел покорить 94 миштекских города-государства. Он убивал их правителей вместе с сыновьями и женился на их вдовах и дочерях. Его власть была распространена на горные, низменные и прибрежные области миштеков.",
    ] },
  { "title" = "Источники", "paragraphs" = [
      "Wolfgang Gockel: Mexiko. Das zentrale Hochland und Yucatán. Von den Stätten der Maya und Azteken zu barocken Kirchen und Konventen. DuMont, Кельн 1998, S. 68-70",
      "Byland, Bruce E.; Pohl, John M.D. (1994). In The Realm of Eight Deer: The Archaeology of the Mixtec Codices. Norman: University of Oklahoma Press. ISBN 0-8061-2612-4. OCLC 30892609.",
      "Jansen, Maarten (1998). \"Monte Albán y Zaachila en los codices mixtecos\". In Maarten E.R.G.N. Jansen; Peter C. Kröfges; Michel R. Oudijk (eds.). In The Shadow of Monte Albán: Politics and Historiography in Postclassic Oaxaca, Mexico (in Spanish). Leiden, Netherlands: Research School CNWS (Leiden University School of Asian, African and Amerindian Studies). ISBN 90-5789-006-2. OCLC 40511286.",
    ] },
]

[articles.id]
text = "Delapan Rusa Cakar Jaguar (bahasa Mixtek: Iya Nacuaa Teyusi Ñaña ) adalah pemimpin kuat Mikstec pada abad ke-11. John Pohl telah mencatat kematiannya tahun 1115 karena dikorbankan."
title = "Delapan Rusa Cakar Jaguar"
lang = "id"
url = "https://id.wikipedia.org/wiki/Delapan_Rusa_Cakar_Jaguar"
intro = [
  "Delapan Rusa Cakar Jaguar (bahasa Mixtek: Iya Nacuaa Teyusi Ñaña ) adalah pemimpin kuat Mikstec pada abad ke-11. John Pohl telah mencatat kematiannya tahun 1115 karena dikorbankan. Reputasinya sebagai pemimpin besar memberinya status legendaris di antara Mikstec. Ia adalah anak dari imam tinggi Tilantongo.",
]
sections = [
