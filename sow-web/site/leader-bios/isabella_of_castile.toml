[articles.id]
text = "Isabel I dari Kastila (bahasa Spanyol: Isabel I de Castilla; bahasa Inggris: Isabelle; 22 April 1451 – 26 November 1504), juga dikenal sebagai Isabel sang Katolik (Isabel la Católica), adalah Ratu Kastila dan Leon. Melalui pernikahan, dia adalah Permaisuri Aragon sebagai istri dari Fernando II pada 19 Oktober 1469."
title = "Isabel dari Kastila"
lang = "id"
url = "https://id.wikipedia.org/wiki/Isabel_dari_Kastila"
intro = [
  "Isabel I dari Kastila (bahasa Spanyol: Isabel I de Castilla; bahasa Inggris: Isabelle; 22 April 1451 – 26 November 1504), juga dikenal sebagai Isabel sang Katolik (Isabel la Católica), adalah Ratu Kastila dan Leon. Melalui pernikahan, dia adalah Permaisuri Aragon sebagai istri dari Fernando II pada 19 Oktober 1469. Pernikahan mereka menjadi dasar penyatuan politik Spanyol di bawah kepemimpinan cucu mereka Carlos I atau Karl V, Raja Kastila dan Aragon dan Kaisar Romawi Suci, serta mengawali masa keemasan Spanyol.",
  "Di ranah politik, Isabel membuktikan dirinya sebagai pemimpin yang cakap. Setelah mengawali masa-masa sulit di awal pemerintahan, Isabel berhasil menekan tingkat kejahatan dan menghapuskan warisan utang-utang dari masa pemerintahan kakak tirinya.",
  "Paus Aleksander VI memberikan gelar \"Penguasa Katolik\" (Spanyol: los Reyes Católicos) kepada Fernando dan Isabel lantaran dipandang telah melindungi agama Katolik di kerajaan mereka, seperti diselesaikannya reconquista dengan mengalahkan Sultan Granada Muhammad XII (Sultan Boabdil) dan pengusiran umat Muslim dan Yahudi dari Spanyol (lihat Inkuisisi Spanyol). Isabel juga dikenal akan dukungannya terhadap Kristoforus Kolumbus dalam upaya menemukan dunia baru. Kebijakan Isabel terkait reconquista dan dukungannya akan penjelajahan samudera menjadi salah satu hal yang mengubah geopolitik dunia, pergeseran batas wilayah dunia Kristen dan Islam, dan pemantik awal bagi bangsa Eropa melakukan penjelajahan samudera dan kolonialisme pada masa setelahnya, membuat Isabel menjadi salah satu tokoh paling berpengaruh di dunia.",
]
sections = [
  { "title" = "Awal kehidupan", "paragraphs" = [
      "Isabel lahir di Madrigal de las Altas Torres, Ávila pada 22 April 1451 dari Juan II, Raja Kastila dengan permaisuri keduanya, Isabel, putri João, putra João I, Raja Portugal. Isabel berada di urutan kedua sebagai pewaris takhta saat kelahirannya setelah Enrique (Henry dalam ejaan Inggris), putra Juan II dengan permaisuri pertamanya, Maria. Enrique berusia 26 tahun saat itu, tetapi belum mempunyai anak. Pada 17 November 1453, Permaisuri Isabel melahirkan seorang putra, Alfonso, membuat kedudukan Isabel sebagai pewaris takhta turun di urutan ketiga. Saat Juan II mangkat pada 1454, saudara tiri Isabel naik takhta sebagai Enrique IV. Isabel dan Alfonso kini berada dalam pemeliharaan raja yang baru. Bersama ibunya dan Alfonso, Isabel dipindahkan ke Arévalo.",
      "Masa ini adalah masa sulit dalam kehidupan Isabel. Mereka hidup di kastil mereka dalam keadaan miskin dan kekurangan uang. Meskipun mendiang Juan II mewasiatkan agar Isabel bersama ibunya dan Alfonso diberi penghidupan yang layak, nyatanya Enrique tidak mengindahkan wasiat ayahnya dan menempatkan mereka ke dalam kehidupan yang ketat. Meski hidup dalam keadaan kekurangan, Isabel diajarkan untuk tetap melakukan kebajikan dan menanamkan rasa hormat yang mendalam terhadap agama.",
      "Saat istri Enrique, Permaisuri Joan, hendak melahirkan, Isabel dan Alfonso dipanggil ke istana (Segovia) atas perintah langsung dari Raja dan untuk menyelesaikan pendidikan mereka. Alfonso ditempatkan dalam pengawasan seorang guru, sedangkan Isabel menjadi bagian dari rumah tangga Permaisuri.",
    ] },
  { "title" = "Pernikahan", "paragraphs" = [
      "Pernikahan Isabel bukanlah suatu pertanyaan yang baru. Saat berusia enam tahun, Isabel sudah dijodohkan dengan Fernando (Ferdinand dalam ejaan Inggris), putra dari Joan II, Raja Aragon (keluarganya merupakan keluarga cabang dari Wangsa Trastámara). Pernikahan ini diharapkan dapat membuat hubungan pertemanan kedua kerajaan lestari. Namun perjanjian ini tidak berlangsung lama.",
      "Paman Fernando, Alfonso V, mangkat pada 1458. Semua wilayah Alfonso di Spanyol, begitu juga kepulauan Sisilia dan Sardinia, jatuh ke tangan saudaranya, Joan II. Kedudukan Joan II menjadi lebih kuat dari sebelumnya, membuatnya tidak merasa membutuhkan perlindungan dari persekutuannya dengan Enrique. Ini membuat Enrique membutuhkan sekutu baru dan dia menjalin persekutuan dengan Carlos (Charles dalam ejaan Inggris), putra Joan II yang lain. Carlos menjalin persekutuan rahasia dengan Enrique dan hendak melanjutkannya dengan menikahi Isabel, tetapi kemudian Joan II memenjarakannya atas dakwaan berusaha melakukan pemberontakan. Carlos meninggal pada tahun 1461.",
      "Pada 1465, Enrique berusaha menikahkan Isabel dengan Alfonso V, Raja Portugal, yang merupakan saudara dari istri Enrique. Namun dalam hal ini, Isabel menolak untuk memberi persetujuan.",
    ] },
  { "title" = "Perang dengan Portugal", "paragraphs" = [
      "Setelah mangkatnya Enrique IV, Isabel naik takhta sebagai Ratu Kastila dan León pada 1474 dan suaminya menjadi raja jure uxoris dengan gelar Fernando V pada 1475. Setelah mangkatnya Raja Juan II pada 1479, barulah Fernando naik takhta di kerajaan asalnya sebagai Raja Aragon dengan gelar Fernando II dan Isabel menjadi Permaisuri Aragon.",
      "Masa kekuasaan Isabel langsung diawali dengan berbagai kesulitan, seperti menghadapi gerakan pemberontakan. Diego Pacheco, Marqués Villena bersama para pendukungnya menetapkan Juana, putri mendiang Enrique IV sebagai ratu yang sah. Segera setelah mengeluarkan pernyataan sikap tersebut, Uskup Agung Toledo yang merupakan pendukung lama Isabel berbalik mendukung Diego yang masih merupakan kerabat dekatnya. Uskup Agung dan Diego berencana menikahkan Juana dengan pamannya, Alfonso V, Raja Portugal, dan menyerang Kastila guna merebut takhta untuk mereka.",
      "Pada Mei 1475, Alfonso dan pasukannya melewati perbatasan Spanyol dan maju hingga Plasencia dan menikahi Juana. Perang panjang dan berdarah untuk memperebutkan takhta Kastila dimulai dan berlangsung hingga sekitar satu tahun sampai tanggal 1 Maret 1476 ketika terjadi Perang Toro, perang yang kedua pihaknya menyatakan sebagai pemenang dan merayakan kemenangan tersebut: pasukan Alfonso berhasil dikalahkan oleh pasukan sayap kiri Kastila yang dipimpin oleh Adipati Alba dan Kardinal Mendoza, sedangkan pasukan yang dipimpin Pangeran João (kelak menjadi João II, Raja Portugal) mengalahkan pasukan sayap kanan Kastila dan tetap menguasai medan laga.",
    ] },
  { "title" = "Pembaruan", "paragraphs" = [
      "Saat Isabel naik takhta pada tahun 1474, Kastila berada dalam keputusasaan. Sudah diketahui bahwa Enrique termasuk raja yang boros dan tidak banyak mengupayakan penegakan hukum di kerajaan. Dikatakan oleh salah seorang Kastila bahwa pada saat itu pembunuhan, pemerkosaan, dan perampokan terjadi tanpa dikenai hukuman. Karena masalah ini, Isabel berusaha untuk memperbarui kerajaannya. Para sejarawan di masanya memandang Isabel lebih cenderung pada keadilan daripada belas kasih, juga dikenal lebih keras dan tanpa ampun dibandingkan suaminya, Fernando.",
      "Pembaruan besar pertama yang dilakukan Isabel adalah pembentukan pasukan keamanan pada 1476, yakni La Santa Hermandad (Persaudaraan Suci). Saat itu bukan kali pertama Kastila menyaksikan Hermandad, tetapi pertama kalinya lembaga ini dikelola oleh pihak istana. Pada masa abad pertengahan akhir, Hermandad digambarkan sebagai sekelompok lelaki, atas kesadaran pribadi, yang bersama-sama berpatroli di jalan dan pedesaan untuk menghukum para penjahat sesuai hukum. Sebelum 1476, persaudaraan ini sering ditekan oleh penguasa. Sebelum 1476, lembaga kehakiman di sebagian besar negara lebih berada di bawah kendali anggota pembangkang dari bangsawan daripada dalam kendali pejabat istana. Untuk menyelesaikan permasalahan, pada pertemuan dewan 1476, pimpinan Hermandad dimapankan untuk Kastila, Leon, dan Asturias. Pasukan keamanan dibentuk dari orang-orang lokal yang bertujuan untuk mengatur hukuman atas kejahatan yang terjadi di kerajaan. Pada 1477, Isabel mengunjungi Extremadura dan Andalusia untuk mengenalkan pasukan keamanan ini.",
      "Guna menjaga pembaruannya diatur dalam hukum, Isabel menunjuk dua pejabat guna mengembalikan kedamaian di Galisia pada 1481. Wilayah ini sudah menjadi sasaran bangsawan tiran sejak masa ayah Isabel, Juan II. Mereka berhasil mengusir lebih dari 1.500 perampok dari Galisia.",
    ] },
]

[articles.pt]
text = "Isabel I (Madrigal de las Altas Torres, 22 de abril de 1451 – Medina del Campo, 26 de novembro de 1504), apelidada de \"Isabel, a Católica\", foi a Rainha de Castela e Leão de 1474 até sua morte, além de Rainha Consorte de Aragão a partir de 1479 e Imperatriz titular do Império Bizantino de 1502 até sua morte. Era filha do rei João II e sua esposa Isabel de Portugal."
title = "Isabel I de Castela"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Isabel_I_de_Castela"
intro = [
  "Isabel I (Madrigal de las Altas Torres, 22 de abril de 1451 – Medina del Campo, 26 de novembro de 1504), apelidada de \"Isabel, a Católica\", foi a Rainha de Castela e Leão de 1474 até sua morte, além de Rainha Consorte de Aragão a partir de 1479 e Imperatriz titular do Império Bizantino de 1502 até sua morte. Era filha do rei João II e sua esposa Isabel de Portugal.",
  "Casou-se com o seu primo em segundo-grau, o príncipe Fernando de Aragão e, devido ao seu parentesco próximo, tiveram de pedir permissão ao Papa. No entanto, com a ajuda de Rodrigo Bórgia, o papa Sisto IV acabou por aceitar o casamento, uma vez que considerava a união conveniente para os interesses da Igreja. Isabel e o seu marido Fernando criaram as bases para a unificação política da Espanha através do seu neto, Carlos I, que se tornaria imperador do Sacro Império Romano.",
  "Depois de uma luta para reclamar o seu direito ao trono, Isabel reorganizou o sistema de governo e da administração, centralizando competências ostentadas anteriormente pelos nobres; reformou o sistema de segurança dos cidadãos de tal forma que a taxa de criminalidade desceu drasticamente e levou a cabo uma reforma económica para reduzir a dívida que o reino tinha herdado do seu meio-irmão e predecessor no trono, Henrique IV. As suas reformas e as que realizou com o marido, tiveram grande influência mesmo fora das fronteiras dos seus reinos. Juntamente com o seu marido, Isabel participou na guerra de Granada através da qual conseguiram reconquistar terras muçulmanas, expulsando-os assim da Península Ibérica. Posteriormente decretaram também a expulsão dos judeus da região através do Decreto de Alhambra. Por estas medidas, tanto Isabel como o seu marido foram reconhecidos pela Santa Sé como \"defensores ou protectores da fé\", recebendo o título de Reis Católicos.",
  "Contudo, Isabel foi recordada sobretudo pelo apoio incondicional que deu a Cristóvão Colombo na sua busca pelas Índias Ocidentais, uma missão que o levaria a descobrir a América. Este acontecimento levou posteriormente às descobertas e ao surgimento do Império Espanhol.",
]
sections = [
  { "title" = "Primeiros Anos", "paragraphs" = [
      "Isabel de Castela, filha de João II de Castela e da sua segunda esposa, Isabel de Portugal, nasceu em Madrigal de las Altas Torres, na província de Ávila, no dia 22 de abril de 1451, numa Quinta-Feira Santa, no palácio que hoje em dia é ocupado pelo Mosteiro de Nossa Senhora da Graça. O lugar e a data de nascimento foram discutidos historicamente, uma vez que quando nasceu, ninguém suspeitava da importância histórica que teria a menina no futuro. Madrigal era na altura uma pequena vila movimentada onde a sua mãe, Isabel de Avis, residia ocasionalmente. Foi da sua mãe que recebeu o nome Isabel que, na altura, ainda não era muito usado em Espanha.",
      "Dois anos depois, em Tordesilhas, nasceu o seu irmão Afonso. Anteriormente, fruto do matrimónio entre João II de Castela e Maria de Aragão, e por tanto irmão paterno de Isabel, tinha nascido Henrique, que ocuparia o trono em 1454 e seria conhecido como Henrique IV, o Impotente.",
      "Após a morte do seu pai em 1454, Isabel retirou-se com a sua mãe e irmão Afonso para a vila de Arévalo, onde assistiria aos ataques de loucura da sua mãe, Isabel. Esta foi uma época de dificuldades, inclusivamente económicas, pois embora o seu pai tivesse deixado disposições importantes no testamento a favor da sua mãe, o rei Henrique IV não as cumpre reiteradamente. Nesta adversidade, Isabel fortaleceu-se com leituras católicas e livros religiosos. A sua amizade com Santa Beatriz de Silva também a ajudou. Mais tarde, já rainha, Isabel ajudou-a a fundar a Ordem da Imaculada Conceição e ofereceu-lhe os palácios de Galiana na cidade de Toledo. Outras personagens importantes, neste momento e em geral durante a sua vida, foram Gutierre de Cárdenas, e a sua esposa Teresa Enríquez y Gonzalo Chacón.",
    ] },
  { "title" = "Acordos matrimoniais", "paragraphs" = [
      "Desde os três anos de idade Isabel esteve comprometida com Fernando, filho do rei João II de Aragão.",
      "No entanto, Henrique IV acabou com este acordo seis anos depois para comprometer a irmã com Carlos, príncipe de Viana. O casamento não chegou a realizar-se devido à oposição férrea de João II de Aragão. Também foram inúteis as tentativas de Henrique IV de casá-la com o rei Afonso V de Portugal, primo em segundo-grau de Isabel e quase vinte anos mais velho do que ela. Em 1464, conseguiu reuni-los no Mosteiro de Guadalupe, mas Isabel recusou-o devido à diferença de idades entre ambos.",
      "Mais tarde, quando tinha dezesseis anos, Isabel ficou comprometida de Pedro Girón, Mestre de Calatrava e irmão de dom Juan Pacheco. Diz-se que Isabel rogou aos céus para que não se realizasse o seu casamento com este varão de quarenta e três anos. Dom Pedro morreu de apendicite durante a viagem para se encontrar com a sua prometida.",
    ] },
  { "title" = "Isabel, Rainha de Castela", "paragraphs" = [
      "Isabel ascendeu ao trono depois de vencer a Guerra de Sucessão Castelhana, ocorrida entre 1475 a 1479, enfrentando os partidários da sua sobrinha Joana. No entanto, após a vitória fez-se justiça, mas também se ofereceu o perdão real a todos aqueles que o pediram. Foi então que se construiu o Mosteiro de São João dos Reis.",
      "Isabel proclama-se rainha de Castela no dia 13 de dezembro de 1474 em Segóvia, usando como base o Tratado dos Touros de Guisando. Da Fortaleza de Segóvia dirigiu-se para a Igreja de São Miguel, junto à praça maior. Depois de jurar por Deus, pela Cruz e pelos Evangelhos que seria obediente aos mandamentos da Santa Igreja, os presentes juram-lhe lealdade. De seguida entrou no templo segurando o escudo de Castela e abraçada às suas dobras.",
      "A partir desse momento, impôs-se a tarefa de garantir a segurança nas estradas e nas aldeias, dado que os anos de guerra tinham favorecido actos de pilhagem e delinquência. Para isso, criou-se a Santa Irmandade que foi eficaz e um bom instrumento de justiça.",
    ] },
  { "title" = "Morte", "paragraphs" = [
      "Isabel encontrava-se em Medina del Campo quando adoeceu de cancro do útero, doença que a mataria. A rainha mandou que se rezassem missas pela sua saúde que se transformaram em missas pela sua alma quando teve a certeza de que o seu fim se aproximava. Consciente, pediu a extrema unção e o Santíssimo Sacramento.",
      "Faleceu pouco antes do meio-dia de 26 de novembro de 1504, no Palácio Real de Medina del Campo.",
      "Inicialmente foi enterrada no mosteiro de São Francisco de Alhambra no dia 18 de dezembro de 1504, numa sepultura simples como era seu desejo. Pouco depois os seus restos mortais, juntamente com os do seu esposo Fernando, o Católico, foram transladados para a Capela Real de Granada. A sua filha Joana I e o marido dela, Filipe I de Castela, também estão lá enterrados. Também foi neste local que se enterrou o seu neto Miguel, filho do rei Manuel I de Portugal que faleceu pouco antes de completar dois anos de idade, e a mãe dele, a infanta Isabel, filha mais velha dos Reis Católicos.",
    ] },
]

