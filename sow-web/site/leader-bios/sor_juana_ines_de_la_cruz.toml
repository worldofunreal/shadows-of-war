[articles.pt-BR]
text = "Sor Juana Inés de la Cruz foi escritora e religiosa jerônima na Nova Espanha do século XVII. As fontes divergem entre 1648 e 1651 como ano de nascimento. Viveu no convento de San Jerónimo, na Cidade do México, onde escreveu poemas e peças como El divino Narciso. Em 1690 escreveu uma crítica a um sermão do jesuíta português António Vieira. Manuel Fernández de Santa Cruz, bispo de Puebla, publicou o texto com o título Carta atenagórica e se dirigiu à autora sob o nome de Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "pt-BR"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz foi escritora e religiosa jerônima na Nova Espanha do século XVII. As fontes divergem entre 1648 e 1651 como ano de nascimento. Viveu no convento de San Jerónimo, na Cidade do México, onde escreveu poemas e peças como El divino Narciso. Em 1690 escreveu uma crítica a um sermão do jesuíta português António Vieira. Manuel Fernández de Santa Cruz, bispo de Puebla, publicou o texto com o título Carta atenagórica e se dirigiu à autora sob o nome de Sor Filotea de la Cruz."]
sections = [{ title = "A cozinha como lugar de estudo", paragraphs = ["Na resposta datada de 1º de março de 1691, ela defendeu seus estudos e o acesso das mulheres ao conhecimento. Relatou que observava o comportamento diferente dos ovos no óleo quente e na calda de açúcar. O exemplo da cozinha sustenta seu argumento sobre o que as mulheres podiam aprender com a experiência cotidiana. Ela morreu na Cidade do México em 1695, durante uma epidemia."] }]
