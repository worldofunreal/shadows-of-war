[articles.zh-CN]
text = "胡安娜·伊内斯·德拉克鲁斯修女是十七世纪新西班牙的作家，也是圣哲罗姆修会的修女。关于她的出生年份，文献中有一六四八年和一六五一年两种说法。她在墨西哥城的圣赫罗尼莫修道院生活和写作，留下诗歌和戏剧，其中有宗教剧《神圣的纳西索斯》。一六九〇年，她写了一篇文章，评论葡萄牙耶稣会士安东尼奥·维埃拉关于基督之爱的讲道。普埃布拉主教曼努埃尔·费尔南德斯·德圣克鲁斯让这篇文章以《雅典娜书简》为题印行。主教还以菲洛特娅修女的名字写信给她，劝她调整学习和写作的方向。这两份文件的作者身份和文字内容可以从当时的印本和后来的整理本中追查。"
title = "胡安娜·伊内斯·德拉克鲁斯修女"
lang = "zh-CN"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["胡安娜·伊内斯·德拉克鲁斯修女是十七世纪新西班牙的作家，也是圣哲罗姆修会的修女。关于她的出生年份，文献中有一六四八年和一六五一年两种说法。她在墨西哥城的圣赫罗尼莫修道院生活和写作，留下诗歌和戏剧，其中有宗教剧《神圣的纳西索斯》。一六九〇年，她写了一篇文章，评论葡萄牙耶稣会士安东尼奥·维埃拉关于基督之爱的讲道。普埃布拉主教曼努埃尔·费尔南德斯·德圣克鲁斯让这篇文章以《雅典娜书简》为题印行。主教还以菲洛特娅修女的名字写信给她，劝她调整学习和写作的方向。这两份文件的作者身份和文字内容可以从当时的印本和后来的整理本中追查。"]
sections = [{ title = "在厨房里学习", paragraphs = ["胡安娜在一六九一年三月一日写成答复。她回顾自己怎样读书，以及在日常生活中怎样获得知识，并为女性求学的机会辩护。她举了厨房里的例子，谈到鸡蛋遇到热油和糖浆时会有不同变化。她还用带有幽默意味的设想问，如果亚里士多德自己也做过饭，会不会有更多东西可写。这个例子来自她为自己的求知经历作辩护的书信，其中还谈到，当手边没有书可以读的时候，她仍然能从所见事物中提出问题。厨房只是书信里的一个场景，却让读者知道她怎样把寻常劳动中的现象当成思考材料。围绕维埃拉讲道的争论也没有停在主教与修女之间。墨西哥国立自治大学出版的研究整理了其他作者为双方写下的文字，其中既有维护讲道的作品，也有为胡安娜辩护的文章，手稿后来保存在秘鲁国家图书馆。胡安娜于一六九五年在墨西哥城的一场流行病期间去世。她对菲洛特娅的答复仍让后人读到她如何把亲身经验、阅读和神学辩论放进同一篇作品，也留下她对女性能否参与这种讨论的明确立场。书信的日期和原文可与主教此前印行的评论对照阅读。她在书信中还讨论了受过教育的年长女性怎样帮助年轻女性学习。"] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.ja]
text = "ソル・フアナ・イネス・デ・ラ・クルスは十七世紀のヌエバ・エスパーニャで活動した作家であり、聖ヒエロニムス会の修道女であった。生年には一六四八年と一六五一年の二つの説がある。メキシコ市のサン・ヘロニモ修道院に住み、詩や戯曲を書いた。宗教劇『神なるナルキッソス』もその一つである。一六九〇年には、ポルトガルのイエズス会士アントニオ・ヴィエイラがキリストの愛について述べた説教を取り上げ、批評を書いた。プエブラ司教マヌエル・フェルナンデス・デ・サンタ・クルスは、その批評を『アテナゴラス書簡』として刊行した。司教はソル・フィロテア・デ・ラ・クルスという修道女の名を使い、彼女の学問と著述について忠告を送った。"
title = "ソル・フアナ・イネス・デ・ラ・クルス"
lang = "ja"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["ソル・フアナ・イネス・デ・ラ・クルスは十七世紀のヌエバ・エスパーニャで活動した作家であり、聖ヒエロニムス会の修道女であった。生年には一六四八年と一六五一年の二つの説がある。メキシコ市のサン・ヘロニモ修道院に住み、詩や戯曲を書いた。宗教劇『神なるナルキッソス』もその一つである。一六九〇年には、ポルトガルのイエズス会士アントニオ・ヴィエイラがキリストの愛について述べた説教を取り上げ、批評を書いた。プエブラ司教マヌエル・フェルナンデス・デ・サンタ・クルスは、その批評を『アテナゴラス書簡』として刊行した。司教はソル・フィロテア・デ・ラ・クルスという修道女の名を使い、彼女の学問と著述について忠告を送った。"]
sections = [{ title = "学びの場としての台所", paragraphs = ["フアナは一六九一年三月一日付の返書で、自分がどのように学んできたかを振り返り、女性が学問に接する機会を擁護した。その中で、卵が熱い油と砂糖のシロップとでは違う変化を見せることに触れている。さらに、もしアリストテレスが自ら料理をしていたら、もっと多くのことを書いたはずだとユーモアを交えて述べた。台所の一例は、書物が手元にないときにも目の前の物事から問いを立てられるという彼女の学び方を示している。返書には読書の経験と、日々の作業から得た観察がともに書かれている。説教をめぐっては別の人々も文章を書いた。メキシコ国立自治大学が刊行した研究には、ヴィエイラの説教を擁護する文書と、フアナへの批判に反論する文書が収められている。フアナは一六九五年、流行病のさなかにメキシコ市で亡くなった。修道院から送った返書は、女性が学問や神学の議論に参加できるかをめぐる彼女自身の考えを伝えている。学んだ年長の女性が若い女性を教えることにも言及した。"] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.ko]
text = "소르 후아나 이네스 데 라 크루스는 17세기 누에바에스파냐의 작가이자 성 히에로니무스 수도회의 수녀였다. 출생 연도는 자료에 따라 1648년 또는 1651년으로 기록된다. 멕시코시티의 산헤로니모 수도원에서 생활하며 시와 희곡을 썼다. 종교극 《신성한 나르키소스》가 그중 하나다. 1690년에는 포르투갈 예수회 사제 안토니우 비에이라가 그리스도의 사랑에 대해 한 설교를 비판하는 글을 썼다. 푸에블라 주교 마누엘 페르난데스 데 산타 크루스는 그 글을 《아테나고라스 서한》이라는 제목으로 출판했다. 주교는 소르 필로테아 데 라 크루스라는 수녀 이름을 빌려 후아나에게 편지를 보내고, 공부와 저술의 방향을 바꾸라고 권했다."
title = "소르 후아나 이네스 데 라 크루스"
lang = "ko"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["소르 후아나 이네스 데 라 크루스는 17세기 누에바에스파냐의 작가이자 성 히에로니무스 수도회의 수녀였다. 출생 연도는 자료에 따라 1648년 또는 1651년으로 기록된다. 멕시코시티의 산헤로니모 수도원에서 생활하며 시와 희곡을 썼다. 종교극 《신성한 나르키소스》가 그중 하나다. 1690년에는 포르투갈 예수회 사제 안토니우 비에이라가 그리스도의 사랑에 대해 한 설교를 비판하는 글을 썼다. 푸에블라 주교 마누엘 페르난데스 데 산타 크루스는 그 글을 《아테나고라스 서한》이라는 제목으로 출판했다. 주교는 소르 필로테아 데 라 크루스라는 수녀 이름을 빌려 후아나에게 편지를 보내고, 공부와 저술의 방향을 바꾸라고 권했다."]
sections = [{ title = "공부하는 장소로서의 부엌", paragraphs = ["후아나는 1691년 3월 1일 자 답장에서 자신이 어떻게 공부해 왔는지 돌아보고 여성에게도 배울 기회가 있어야 한다고 주장했다. 달걀이 뜨거운 기름과 설탕 시럽에서 서로 다르게 변하는 현상을 예로 들었다. 아리스토텔레스도 직접 요리를 했다면 더 많은 글을 썼을 것이라는 재치 있는 말도 덧붙였다. 부엌에서 얻은 관찰을 통해, 책이 손에 없을 때에도 일상에서 질문을 찾고 지식을 얻을 수 있다는 생각을 드러냈다. 비에이라의 설교를 둘러싼 논쟁에는 다른 저자들도 참여했다. 멕시코 국립자치대학교가 출간한 연구에는 설교를 옹호하는 글과 후아나를 비판한 이에게 반박하는 글이 함께 실려 있다. 후아나는 1695년 전염병이 돌던 멕시코시티에서 세상을 떠났다. 수도원에서 쓴 그 답장은 독서와 일상 관찰을 한데 엮은 그의 글쓰기뿐 아니라, 여성의 학습과 신학 논의 참여에 대한 입장도 전한다."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.ar]
text = "كانت خوانا إينيس دي لا كروث كاتبة وراهبة من رهبنة القديس جيروم في إسبانيا الجديدة في القرن السابع عشر. وتختلف المصادر في سنة مولدها بين 1648 و1651. عاشت في دير سان خيرونيمو في مدينة مكسيكو وكتبت فيه الشعر والمسرح، ومن أعمالها «إل ديفينو نارسيسو». وفي سنة 1690 كتبت نقدا لموعظة اليسوعي البرتغالي أنطونيو فييرا. نشر أسقف بويبلا مانويل فرنانديث دي سانتا كروث النص بعنوان «كارتا أتيناغوريكا» وخاطب الكاتبة باسم الأخت فيلوتيا دي لا كروث."
title = "الأخت خوانا إينيس دي لا كروث"
lang = "ar"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["كانت خوانا إينيس دي لا كروث كاتبة وراهبة من رهبنة القديس جيروم في إسبانيا الجديدة في القرن السابع عشر. وتختلف المصادر في سنة مولدها بين 1648 و1651. عاشت في دير سان خيرونيمو في مدينة مكسيكو وكتبت فيه الشعر والمسرح، ومن أعمالها «إل ديفينو نارسيسو». وفي سنة 1690 كتبت نقدا لموعظة اليسوعي البرتغالي أنطونيو فييرا. نشر أسقف بويبلا مانويل فرنانديث دي سانتا كروث النص بعنوان «كارتا أتيناغوريكا» وخاطب الكاتبة باسم الأخت فيلوتيا دي لا كروث."]
sections = [{ title = "المطبخ مجالا للدراسة", paragraphs = ["في جوابها المؤرخ في الأول من مارس سنة 1691 دافعت عن دراستها وحق النساء في الوصول إلى المعرفة. ووصفت كيف لاحظت أن البيض يتصرف على نحو مختلف عند طهيه في الزيت الحار وعند طهيه في شراب السكر. واتخذت من المطبخ مثالا على ما يمكن للمرأة أن تتعلمه من تجارب حياتها اليومية. وتوفيت في مدينة مكسيكو أثناء وباء سنة 1695."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.ru]
text = "Сор Хуана Инес де ла Крус была писательницей и монахиней ордена святого Иеронима в Новой Испании XVII века. Источники называют две возможные даты её рождения, 1648 и 1651 годы. В монастыре Сан-Херонимо в Мехико она писала стихи и пьесы, в том числе «Божественного Нарцисса». В 1690 году она написала разбор проповеди португальского иезуита Антониу Виейры. Епископ Пуэблы Мануэль Фернандес де Санта-Крус напечатал текст под названием «Афинагорическое письмо» и обратился к автору под именем сестры Филотеи де ла Крус."
title = "Сор Хуана Инес де ла Крус"
lang = "ru"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Сор Хуана Инес де ла Крус была писательницей и монахиней ордена святого Иеронима в Новой Испании XVII века. Источники называют две возможные даты её рождения, 1648 и 1651 годы. В монастыре Сан-Херонимо в Мехико она писала стихи и пьесы, в том числе «Божественного Нарцисса». В 1690 году она написала разбор проповеди португальского иезуита Антониу Виейры. Епископ Пуэблы Мануэль Фернандес де Санта-Крус напечатал текст под названием «Афинагорическое письмо» и обратился к автору под именем сестры Филотеи де ла Крус."]
sections = [{ title = "Кухня как место для учёбы", paragraphs = ["В ответе от 1 марта 1691 года Хуана отстаивала своё право учиться и доступ женщин к знаниям. Она описала, как при готовке яйца по-разному ведут себя в горячем масле и сахарном сиропе. Этот пример показывал, что повседневные занятия тоже давали женщинам материал для размышлений. Она умерла в Мехико в 1695 году во время эпидемии."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.vi]
text = "Sor Juana Inés de la Cruz là nhà văn và nữ tu dòng Thánh Giêrônimô ở Tân Tây Ban Nha thế kỷ XVII. Các nguồn đưa ra hai năm sinh là 1648 và 1651. Bà sống tại tu viện San Jerónimo ở Thành phố México, nơi bà viết thơ và kịch, trong đó có El divino Narciso. Năm 1690 bà viết bài phê bình một bài giảng của tu sĩ Dòng Tên người Bồ Đào Nha António Vieira. Giám mục Puebla, Manuel Fernández de Santa Cruz, cho in bài viết dưới tên Carta atenagórica và gửi lời răn tới tác giả với bút danh Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "vi"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz là nhà văn và nữ tu dòng Thánh Giêrônimô ở Tân Tây Ban Nha thế kỷ XVII. Các nguồn đưa ra hai năm sinh là 1648 và 1651. Bà sống tại tu viện San Jerónimo ở Thành phố México, nơi bà viết thơ và kịch, trong đó có El divino Narciso. Năm 1690 bà viết bài phê bình một bài giảng của tu sĩ Dòng Tên người Bồ Đào Nha António Vieira. Giám mục Puebla, Manuel Fernández de Santa Cruz, cho in bài viết dưới tên Carta atenagórica và gửi lời răn tới tác giả với bút danh Sor Filotea de la Cruz."]
sections = [{ title = "Nhà bếp cũng là nơi học", paragraphs = ["Trong thư trả lời đề ngày 1 tháng 3 năm 1691, bà bảo vệ việc học của mình và quyền tiếp cận tri thức của phụ nữ. Bà kể đã quan sát thấy trứng biến đổi khác nhau trong dầu nóng và nước đường. Ví dụ ấy giúp bà trình bày cách phụ nữ có thể học hỏi từ kinh nghiệm thường ngày. Bà qua đời tại Thành phố México trong một trận dịch năm 1695."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.id]
text = "Sor Juana Inés de la Cruz adalah penulis dan biarawati Ordo Santo Hieronimus di Spanyol Baru pada abad ketujuh belas. Sumber-sumber menyebut 1648 dan 1651 sebagai kemungkinan tahun kelahirannya. Ia tinggal di biara San Jerónimo di Kota Meksiko, tempat ia menulis puisi dan drama seperti El divino Narciso. Pada 1690 ia menulis kritik atas khotbah Yesuit Portugis António Vieira. Uskup Puebla, Manuel Fernández de Santa Cruz, menerbitkannya sebagai Carta atenagórica dan menyurati penulis dengan nama Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "id"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz adalah penulis dan biarawati Ordo Santo Hieronimus di Spanyol Baru pada abad ketujuh belas. Sumber-sumber menyebut 1648 dan 1651 sebagai kemungkinan tahun kelahirannya. Ia tinggal di biara San Jerónimo di Kota Meksiko, tempat ia menulis puisi dan drama seperti El divino Narciso. Pada 1690 ia menulis kritik atas khotbah Yesuit Portugis António Vieira. Uskup Puebla, Manuel Fernández de Santa Cruz, menerbitkannya sebagai Carta atenagórica dan menyurati penulis dengan nama Sor Filotea de la Cruz."]
sections = [{ title = "Dapur sebagai tempat belajar", paragraphs = ["Dalam jawaban bertanggal 1 Maret 1691, ia membela kegiatan belajarnya dan akses perempuan terhadap pengetahuan. Ia menjelaskan bahwa telur berubah dengan cara berbeda di dalam minyak panas dan sirup gula. Contoh dari dapur itu memperlihatkan pengetahuan yang bisa diperoleh perempuan dari pengalaman sehari-hari. Ia meninggal di Kota Meksiko pada 1695 ketika terjadi wabah."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.fil]
text = "Si Sor Juana Inés de la Cruz ay manunulat at madreng Heronimita sa Bagong Espanya noong ikalabimpitong siglo. May mga sangguniang nagsasabing 1648 siya ipinanganak at mayroon ding nagsasabing 1651. Nanirahan siya sa kumbento ng San Jerónimo sa Lungsod ng Mexico, kung saan sumulat siya ng mga tula at dulang tulad ng El divino Narciso. Noong 1690, pinuna niya ang isang sermon ng Heswitang Portuges na si António Vieira. Inilathala iyon ng obispo ng Puebla na si Manuel Fernández de Santa Cruz bilang Carta atenagórica at sumulat siya sa may-akda gamit ang pangalang Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "fil"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Si Sor Juana Inés de la Cruz ay manunulat at madreng Heronimita sa Bagong Espanya noong ikalabimpitong siglo. May mga sangguniang nagsasabing 1648 siya ipinanganak at mayroon ding nagsasabing 1651. Nanirahan siya sa kumbento ng San Jerónimo sa Lungsod ng Mexico, kung saan sumulat siya ng mga tula at dulang tulad ng El divino Narciso. Noong 1690, pinuna niya ang isang sermon ng Heswitang Portuges na si António Vieira. Inilathala iyon ng obispo ng Puebla na si Manuel Fernández de Santa Cruz bilang Carta atenagórica at sumulat siya sa may-akda gamit ang pangalang Sor Filotea de la Cruz."]
sections = [{ title = "Ang kusina bilang lugar ng pag-aaral", paragraphs = ["Sa tugon niyang may petsang Marso 1, 1691, ipinagtanggol niya ang sarili niyang pag-aaral at ang pagkakataong matuto ng kababaihan. Ikinuwento niya kung paano nag-iiba ang kilos ng itlog sa mainit na mantika at sa arnibal. Ginamit niya ang halimbawang iyon upang ipakita kung ano ang maaaring matutuhan sa araw-araw na karanasan. Namatay siya sa Lungsod ng Mexico noong 1695 sa panahon ng epidemya."] }]
