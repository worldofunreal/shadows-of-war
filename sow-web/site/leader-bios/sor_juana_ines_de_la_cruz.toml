[articles.en]
text = "Sor Juana Inés de la Cruz was a writer and Hieronymite nun in seventeenth-century New Spain. Her birth year is disputed, with 1648 and 1651 both found in the sources. She lived at the convent of San Jerónimo in Mexico City, where she wrote poetry and plays, including El divino Narciso. In 1690 she wrote a critique of a sermon by the Portuguese Jesuit António Vieira. The bishop of Puebla, Manuel Fernández de Santa Cruz, published it as the Carta atenagórica and addressed her under the name Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "en"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz was a writer and Hieronymite nun in seventeenth-century New Spain. Her birth year is disputed, with 1648 and 1651 both found in the sources. She lived at the convent of San Jerónimo in Mexico City, where she wrote poetry and plays, including El divino Narciso. In 1690 she wrote a critique of a sermon by the Portuguese Jesuit António Vieira. The bishop of Puebla, Manuel Fernández de Santa Cruz, published it as the Carta atenagórica and addressed her under the name Sor Filotea de la Cruz."]
sections = [{ title = "The kitchen as a place of study", paragraphs = ["On 1 March 1691 she dated her Respuesta a Sor Filotea, defending her study and women’s access to learning. In it she describes observing how eggs behaved differently in hot oil and syrup. The example supports a broader argument about the knowledge a woman could gain from ordinary experience. She died in Mexico City in 1695 during an epidemic."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.es]
text = "Sor Juana Inés de la Cruz fue escritora y religiosa jerónima de la Nueva España del siglo XVII. Las fuentes discrepan entre 1648 y 1651 como año de nacimiento. Vivió en el convento de San Jerónimo de la Ciudad de México, donde escribió poesía y obras de teatro como El divino Narciso. En 1690 redactó una crítica a un sermón del jesuita portugués António Vieira. Manuel Fernández de Santa Cruz, obispo de Puebla, la publicó con el título de Carta atenagórica y se dirigió a la autora bajo el nombre de Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "es"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz fue escritora y religiosa jerónima de la Nueva España del siglo XVII. Las fuentes discrepan entre 1648 y 1651 como año de nacimiento. Vivió en el convento de San Jerónimo de la Ciudad de México, donde escribió poesía y obras de teatro como El divino Narciso. En 1690 redactó una crítica a un sermón del jesuita portugués António Vieira. Manuel Fernández de Santa Cruz, obispo de Puebla, la publicó con el título de Carta atenagórica y se dirigió a la autora bajo el nombre de Sor Filotea de la Cruz."]
sections = [{ title = "La cocina como lugar de estudio", paragraphs = ["El 1 de marzo de 1691 fechó su Respuesta a Sor Filotea, en la que defendió su dedicación al estudio y el acceso de las mujeres al conocimiento. Entre otros ejemplos, explicó cómo observaba el comportamiento distinto de los huevos en aceite caliente y en almíbar. Con ese ejemplo defendía el valor de la observación cotidiana para quien tenía restringido el acceso a la enseñanza. Murió en la Ciudad de México durante una epidemia en 1695."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.fr]
text = "Sor Juana Inés de la Cruz fut écrivaine et religieuse hiéronymite dans la Nouvelle-Espagne du XVIIe siècle. Les sources divergent sur son année de naissance, 1648 ou 1651. Au couvent de San Jerónimo, à Mexico, elle écrivit de la poésie et du théâtre, dont El divino Narciso. En 1690 elle rédigea une critique d’un sermon du jésuite portugais António Vieira. Manuel Fernández de Santa Cruz, évêque de Puebla, la publia sous le titre de Carta atenagórica et s’adressa à l’autrice sous le nom de Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "fr"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz fut écrivaine et religieuse hiéronymite dans la Nouvelle-Espagne du XVIIe siècle. Les sources divergent sur son année de naissance, 1648 ou 1651. Au couvent de San Jerónimo, à Mexico, elle écrivit de la poésie et du théâtre, dont El divino Narciso. En 1690 elle rédigea une critique d’un sermon du jésuite portugais António Vieira. Manuel Fernández de Santa Cruz, évêque de Puebla, la publia sous le titre de Carta atenagórica et s’adressa à l’autrice sous le nom de Sor Filotea de la Cruz."]
sections = [{ title = "La cuisine comme lieu d’étude", paragraphs = ["Dans sa réponse datée du 1er mars 1691, elle défendit sa pratique de l’étude et l’accès des femmes au savoir. Elle y décrit les différences qu’elle observait en cuisant des œufs dans l’huile chaude ou dans le sirop. Cet exemple s’inscrit dans un raisonnement sur les connaissances que les femmes pouvaient tirer de leurs occupations ordinaires. Elle mourut à Mexico en 1695, au cours d’une épidémie."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.de]
text = "Sor Juana Inés de la Cruz war Schriftstellerin und Hieronymitennonne im Neuspanien des 17. Jahrhunderts. Als Geburtsjahr nennen die Quellen sowohl 1648 als auch 1651. Im Kloster San Jerónimo in Mexiko-Stadt schrieb sie Gedichte und Theaterstücke, darunter El divino Narciso. 1690 verfasste sie eine Kritik an einer Predigt des portugiesischen Jesuiten António Vieira. Der Bischof von Puebla, Manuel Fernández de Santa Cruz, veröffentlichte sie unter dem Titel Carta atenagórica und wandte sich unter dem Namen Sor Filotea de la Cruz an die Autorin."
title = "Sor Juana Inés de la Cruz"
lang = "de"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz war Schriftstellerin und Hieronymitennonne im Neuspanien des 17. Jahrhunderts. Als Geburtsjahr nennen die Quellen sowohl 1648 als auch 1651. Im Kloster San Jerónimo in Mexiko-Stadt schrieb sie Gedichte und Theaterstücke, darunter El divino Narciso. 1690 verfasste sie eine Kritik an einer Predigt des portugiesischen Jesuiten António Vieira. Der Bischof von Puebla, Manuel Fernández de Santa Cruz, veröffentlichte sie unter dem Titel Carta atenagórica und wandte sich unter dem Namen Sor Filotea de la Cruz an die Autorin."]
sections = [{ title = "Die Küche als Ort des Lernens", paragraphs = ["In ihrer auf den 1. März 1691 datierten Antwort verteidigte sie ihr eigenes Studium und den Zugang von Frauen zu Bildung. So beschrieb sie, wie sich Eier in heißem Öl anders verhielten als in Zuckersirup. Sie machte die Beobachtung in der Küche zum Beispiel dafür, wie Frauen im Alltag Erkenntnisse gewinnen konnten. Sie starb 1695 während einer Epidemie in Mexiko-Stadt."] }]
sources = [{ title = "Sor Juana Inés de la Cruz, Respuesta a Sor Filotea (1691), UNAM", url = "https://librosoa.unam.mx/handle/123456789/575" }, { title = "Sor Juana Inés de la Cruz, Carta atenagórica (1690), Biblioteca Virtual Miguel de Cervantes and BNE", url = "https://www.cervantesvirtual.com/portales/simon_bolivar/obra/carta-athenagorica-de-la-madre-iuana-ynes-de-la-cruz--0/" }, { title = "Instituto Nacional de Bellas Artes y Literatura, Sor Juana Inés de la Cruz", url = "https://inba.gob.mx/prensa/13314/se-cumplen-371-anos-del-nacimiento-de-sor-juana-ines-de-la-cruz-receptora-de-dones-de-virtud-extraordinarios" }, { title = "Biblioteca Nacional de España, Juana Inés de la Cruz, Sor", url = "https://www.bne.es/es/autores/juana-ines-cruz-sor" }, { title = "José Antonio Rodríguez Garrido, La Carta atenagórica de sor Juana: Textos inéditos de una polémica, UNAM", url = "https://libros.iib.unam.mx/index.php/li/catalog/book/181" }]

[articles.it]
text = "Sor Juana Inés de la Cruz fu scrittrice e religiosa geronimita nella Nuova Spagna del Seicento. Le fonti indicano due possibili anni di nascita, il 1648 e il 1651. Visse nel convento di San Jerónimo a Città del Messico, dove scrisse poesie e opere teatrali come El divino Narciso. Nel 1690 scrisse una critica a un sermone del gesuita portoghese António Vieira. Il vescovo di Puebla, Manuel Fernández de Santa Cruz, la pubblicò con il titolo Carta atenagórica e si rivolse all’autrice usando il nome di Sor Filotea de la Cruz."
title = "Sor Juana Inés de la Cruz"
lang = "it"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz fu scrittrice e religiosa geronimita nella Nuova Spagna del Seicento. Le fonti indicano due possibili anni di nascita, il 1648 e il 1651. Visse nel convento di San Jerónimo a Città del Messico, dove scrisse poesie e opere teatrali come El divino Narciso. Nel 1690 scrisse una critica a un sermone del gesuita portoghese António Vieira. Il vescovo di Puebla, Manuel Fernández de Santa Cruz, la pubblicò con il titolo Carta atenagórica e si rivolse all’autrice usando il nome di Sor Filotea de la Cruz."]
sections = [{ title = "La cucina come luogo di studio", paragraphs = ["Nella sua risposta datata 1º marzo 1691 difese la propria attività di studio e l’accesso delle donne al sapere. Tra gli esempi descrisse il diverso comportamento delle uova nell’olio caldo e nello sciroppo. L’osservazione in cucina le servì per ragionare su ciò che le donne potevano imparare dall’esperienza quotidiana. Morì a Città del Messico nel 1695 durante un’epidemia."] }]
