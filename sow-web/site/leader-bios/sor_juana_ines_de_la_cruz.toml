[articles.tr]
text = "Sor Juana Inés de la Cruz, on yedinci yüzyılda Yeni İspanya’da yaşayan bir yazar ve Aziz Hieronymus tarikatına bağlı bir rahibeydi. Kaynaklar doğum yılı için 1648 ve 1651 tarihlerini verir. Meksiko’daki San Jerónimo Manastırı’nda şiirler ve El divino Narciso gibi oyunlar yazdı. 1690’da Portekizli Cizvit António Vieira’nın bir vaazını eleştiren bir metin kaleme aldı. Puebla piskoposu Manuel Fernández de Santa Cruz metni Carta atenagórica adıyla yayımladı ve yazara Sor Filotea de la Cruz adıyla hitap etti."
title = "Sor Juana Inés de la Cruz"
lang = "tr"
url = "https://librosoa.unam.mx/handle/123456789/575"
shortArticle = true
intro = ["Sor Juana Inés de la Cruz, on yedinci yüzyılda Yeni İspanya’da yaşayan bir yazar ve Aziz Hieronymus tarikatına bağlı bir rahibeydi. Kaynaklar doğum yılı için 1648 ve 1651 tarihlerini verir. Meksiko’daki San Jerónimo Manastırı’nda şiirler ve El divino Narciso gibi oyunlar yazdı. 1690’da Portekizli Cizvit António Vieira’nın bir vaazını eleştiren bir metin kaleme aldı. Puebla piskoposu Manuel Fernández de Santa Cruz metni Carta atenagórica adıyla yayımladı ve yazara Sor Filotea de la Cruz adıyla hitap etti."]
sections = [{ title = "Bir çalışma alanı olarak mutfak", paragraphs = ["Juana, 1 Mart 1691 tarihli yanıtında çalışmalarını ve kadınların bilgiye erişimini savundu. Yumurtaların kızgın yağda ve şurupta farklı davrandığını gözlemlediğini anlattı. Mutfaktan verdiği örnek, kadınların gündelik deneyimlerinden nasıl bilgi edinebileceğine ilişkin düşüncesini somutlaştırır. 1695 yılında Meksiko’da bir salgın sırasında öldü."] }]
