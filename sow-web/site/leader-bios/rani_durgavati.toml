[articles.en]
text = "Durgavati, popularly known as Rani Durgavati, was the regent queen of Gondwana during the infancy of her son Vir Narayan, from 1550 to 1564. She married Dalpat Shah, a son of the Gond King Sangram Shah."
title = "Rani Durgavati"
lang = "en"
url = "https://en.wikipedia.org/wiki/Rani_Durgavati"
intro = [
  "Durgavati (Bundeli: दुर्गावती) (5 October 1524 – 24 June 1564), popularly known as Rani Durgavati, was the regent queen of Gondwana during the infancy of her son Vir Narayan, from 1550 to 1564. She married Dalpat Shah, a son of the Gond King Sangram Shah. She is mainly remembered for her courage and sacrifice against the Mughal invasion of Gondwana.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "According to a horoscope, Durgavati was born on 5 October 1524. She had a sister named Kamlawati.",
      "In popular culture and the Gond folklore, Durgavati has often been portrayed as a Gond tribal queen. However, she was a chandel by birth, and married into the Raj Gond family. Her father was a Chandel king, who ruled a principality comprising Rath and Mahoba. Akbarnama, by the Mughal chronicler Abul Fazl, names Durgavati's father as Salbahan or Salbhan (Shalivahan); however, some later accounts name the king as Keerat Singh. These accounts seem to have confused Durgavati's father with Keerat Singh, who was another Chandel king and the ruler of Kalinjar. Modern historians generally consider these two as different people: Keerat Singh was belonged to the main Chandel line, while Durgavati's father Shalivahan belonged to a cadet branch.",
      "According to folklore, Durgavati's father invited prince Dalpat (or Dalpati) Shah of Garha Katanga to his kingdom for a hunting expedition. Durgavati met Dalpat Shah at the Mania Devi temple in Mahoba, and the two fell in love. Sometime later, her father organized her svayamvara, a Hindu ritual by which brides select a husband from a group of men invited to the event. The various legends differ on how Durgavati and Dalpat Shah got married:",
    ] },
  { "title" = "Early struggles as a regent", "paragraphs" = [
      "Dalpat Shah died in 1550 CE when his successor Crown Prince Vir Narayan was merely 5 years old. His wife, Durgavati rose to take the reins of the Gondwana kingdom as regent during the new king's minority. Diwan Adhar Kayastha and Minister Man Thakur helped the Queen in looking after the administration successfully and effectively. Queen Durgavati promoted peace, trade, and good will throughout her realm.",
      "Rani Durgavati moved her capital from Singorgarh fort to Chauragarh fort. It was a fort of strategic importance situated on the Satpura hill range.",
      "After the death of Sher Shah Suri, Shuja Khan captured Malwa and was succeeded by his son Baz Bahadur in 1556. After ascending to the throne, Baz invaded Rani Durgavati's Gondwana but the invasion was repulsed with heavy losses for the former earning the latter a lot of prestige.",
    ] },
  { "title" = "Mughal Invasion", "paragraphs" = [
      "In 1562, Akbar vanquished the Malwa ruler Baz Bahadur and conquered Malwa, making it a Mughal dominion. Consequently, the state boundary of the Rani touched the Mughal Empire. Rani's contemporary was a Mughal general, Khwaja Abdul Majid Asaf Khan who defeated Ramchandra Singh, the raja of Rewa. He desired the Queen Durgavati and the wealth of Gondwana. He led the Mughal invasion of the Rani's realm after gaining permission from emperor Akbar.",
      "When the Rani heard about the invasions by Asaf Khan she decided to defend her kingdom with all her might although her Diwan, Beohar Adhar Simha (Adhar Kayastha) warned about the strength of the invading Mughal forces. The Rani maintained her motto that it was better to die respectfully than to live a disgraceful life.",
      "To fight a defensive battle, she went to Narrai, situated between a hilly range on one side and two rivers Gaur and Narmada on the other side. It was an unequal battle with trained soldiers and modern weapons like muskets and cannons in multitude on the invading Mughal side and a few untrained soldiers with older weapons on the side of Rani Durgavati. Her Faujdar, Arjun Das was killed in the battle. The Rani then decided to lead the defense herself. As the enemy entered the valley, the soldiers of the Rani attacked them. Both sides lost some men but the Rani's army suffered heavier casualties.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The Madan Mahal Fort in Jabalpur is famous for its association with the Queen Durgavati and her son, the Crown Prince Vir Narayan.",
      "In 1983, the government of Madhya Pradesh renamed the university of Jabalpur as Rani Durgavati Vishwavidyalaya in her memory.",
      "The Government of India issued a postal stamp commemorating her death, on 24 June 1988.",
    ] },
]

[articles.es]
text = "Durgavati maravi (a veces escrito Rani Durgavati, en hindú reina Durgavati; 5 de octubre de 1524 – 24 de junio de 1564) fue una reina de Gondwana de 1550 hasta 1564. Miembro de la dinastía Chandel, es famosa en la historia india por su defensa frente a los mogoles."
title = "Durgavati"
lang = "es"
url = "https://es.wikipedia.org/wiki/Durgavati"
intro = [
  "Durgavati maravi (a veces escrito Rani Durgavati, en hindú reina Durgavati; 5 de octubre de 1524 – 24 de junio de 1564) fue una reina de Gondwana de 1550 hasta 1564. Miembro de la dinastía Chandel, es famosa en la historia india por su defensa frente a los mogoles. Fue una mecenas de las artes, encargando las esculturas de los templos de Khajuraho y Kalinjar.",
]
sections = [
  { "title" = "Vida", "paragraphs" = [
      "En 1542, se casó con Dalpat Shah, el hijo mayor del rey Sangram Shah de Gond con el objetivo de asegurar la alianza entre las dinastías Chandel y Gond.",
      "Dio a luz un hijo en 1545, que fue llamado Vir Narayan. Dalpat Shah murió en 1550 y Durgavati tomó las riendas del reino Gond. El diwan o Primer ministro Beohar Adhar Simha y el ministro Thakur fueron importantes ayudas para la rani Durgavati. Durgavati trasladó la capital a Chauragarh, un fuerte de importancia estratégica en la cordillera Satpura, desde Singaurgarh.",
      "Tras la muerte de Sher Shah, Sujat Khan capturó Malwa y fue sucedido por su hijo Baz Bahadur en 1556. Después de ascender al trono, este atacó a Rani Durgavati que rechazó la invasión y le infligió duras pérdidas.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "En el año 1983, el Gobierno de Madhya Pradesh rebautizó la Universidad de Jabalpur como Rani Durgavati Vishwavidyalaya en su honor.",
      "El gobierno de India emitió un sello postal en conmemoración de su muerte el 24 de junio de 1988.",
      "El tren entre la bifurcación de Jabalpur y Jammutawi se llama Expreso Durgavati (11449/11450) también en recuerdo de la reina.",
    ] },
]

