[articles.fil]
text = "Si Sibylla ay anak nina Amalric ng Jerusalem at Agnes ng Courtenay. Bago siya naging reyna, pinangasiwaan niya ang Jaffa at Ascalon bilang kondesa. Sa isang kasulatang inilabas niya noong 1177, nagkaloob siya ng mga tore, hardin at kita sa Ascalon kay Konde Rodrigo at sa mga kasapi ng orden nito. Si Baldwin V, na naging hari, ang anak niya sa una niyang asawa na si William ng Montferrat. Nang mamatay ang anak niya noong 1186, inangkin ni Sibylla ang korona ng Jerusalem sa sarili niyang karapatan at ginawang hari ang ikalawa niyang asawang si Guy ng Lusignan."
title = "Sibylla ng Jerusalem"
lang = "fil"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Si Sibylla ay anak nina Amalric ng Jerusalem at Agnes ng Courtenay. Bago siya naging reyna, pinangasiwaan niya ang Jaffa at Ascalon bilang kondesa. Sa isang kasulatang inilabas niya noong 1177, nagkaloob siya ng mga tore, hardin at kita sa Ascalon kay Konde Rodrigo at sa mga kasapi ng orden nito. Si Baldwin V, na naging hari, ang anak niya sa una niyang asawa na si William ng Montferrat. Nang mamatay ang anak niya noong 1186, inangkin ni Sibylla ang korona ng Jerusalem sa sarili niyang karapatan at ginawang hari ang ikalawa niyang asawang si Guy ng Lusignan."]
sections = [{ title = "Pagpili ng katuwang sa paghahari", paragraphs = ["Magkakaiba ang mga kronika kung hiningi muna ng mga tagasuporta niya na talikuran niya ang kasal. Nakatala sa isang kasulatan ng Oktubre 1186 ang pahintulot niya sa pagkakaloob ng mga lupain kay Joscelin ng Courtenay. Noong 1187, tinalo ni Saladin ang hukbo ng kaharian sa Hattin, binihag si Guy at sinakop ang Jerusalem. Nang mapalaya si Guy, sinamahan siya ni Sibylla sa pagkubkob sa Acre, kung saan siya namatay noong 1190. Namana ng kapatid niya sa ama na si Isabella ang karapatan sa korona na dating taglay ni Guy sa pamamagitan ni Sibylla."] }]
