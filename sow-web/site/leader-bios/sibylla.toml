[articles.de]
text = "Sibylla war die Tochter Amalrichs von Jerusalem und der Agnes von Courtenay. Vor ihrer Thronbesteigung war sie Gräfin von Jaffa und Askalon. In einer Urkunde von 1177 überließ sie Graf Rodrigo und den Brüdern seines Ordens Türme, einen Garten und Einkünfte in Askalon. Ihr Sohn aus der Ehe mit Wilhelm von Montferrat wurde als Balduin V. König. Nach seinem Tod 1186 erhob Sibylla aus eigenem Recht Anspruch auf die Krone von Jerusalem und machte ihren zweiten Ehemann Guido von Lusignan zum König an ihrer Seite."
title = "Sibylla von Jerusalem"
lang = "de"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibylla war die Tochter Amalrichs von Jerusalem und der Agnes von Courtenay. Vor ihrer Thronbesteigung war sie Gräfin von Jaffa und Askalon. In einer Urkunde von 1177 überließ sie Graf Rodrigo und den Brüdern seines Ordens Türme, einen Garten und Einkünfte in Askalon. Ihr Sohn aus der Ehe mit Wilhelm von Montferrat wurde als Balduin V. König. Nach seinem Tod 1186 erhob Sibylla aus eigenem Recht Anspruch auf die Krone von Jerusalem und machte ihren zweiten Ehemann Guido von Lusignan zum König an ihrer Seite."]
sections = [{ title = "Die Wahl eines Mitregenten", paragraphs = ["Die Chroniken widersprechen einander in der Frage, ob ihre Anhänger zunächst die Auflösung der Ehe verlangten. Eine Urkunde vom Oktober 1186 hält Sibyllas Einwilligung zur Übertragung von Besitz an Joscelin von Courtenay fest. 1187 besiegte Saladin das Heer des Königreichs bei Hattin, nahm Guido gefangen und eroberte Jerusalem. Nach Guidos Freilassung traf Sibylla ihn bei der Belagerung von Akkon wieder, wo sie 1190 starb. Ihre Halbschwester Isabella erbte den Anspruch, den Guido durch Sibylla besessen hatte."] }]
