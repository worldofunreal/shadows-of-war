[articles.it]
text = "Sibilla era figlia di Amalrico di Gerusalemme e di Agnese di Courtenay. Prima di diventare regina resse la contea di Giaffa e Ascalona. Un atto da lei emanato nel 1177 registra la concessione di torri, un giardino e rendite ad Ascalona al conte Rodrigo e ai confratelli del suo ordine. Dal primo marito, Guglielmo di Monferrato, ebbe il futuro Baldovino V. Quando questi morì nel 1186, Sibilla rivendicò la corona di Gerusalemme per diritto proprio e fece re al suo fianco il secondo marito, Guido di Lusignano."
title = "Sibilla di Gerusalemme"
lang = "it"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibilla era figlia di Amalrico di Gerusalemme e di Agnese di Courtenay. Prima di diventare regina resse la contea di Giaffa e Ascalona. Un atto da lei emanato nel 1177 registra la concessione di torri, un giardino e rendite ad Ascalona al conte Rodrigo e ai confratelli del suo ordine. Dal primo marito, Guglielmo di Monferrato, ebbe il futuro Baldovino V. Quando questi morì nel 1186, Sibilla rivendicò la corona di Gerusalemme per diritto proprio e fece re al suo fianco il secondo marito, Guido di Lusignano."]
sections = [{ title = "La scelta di un coreggente", paragraphs = ["Le cronache divergono sulla richiesta dei sostenitori di rinunciare prima a quel matrimonio. Una carta dell’ottobre 1186 attesta il consenso di Sibilla alla concessione di terre a Joscelin di Courtenay. Nel 1187 Saladino sconfisse l’esercito del regno a Hattin, catturò Guido e prese Gerusalemme. Dopo la liberazione di Guido, Sibilla lo raggiunse durante l’assedio di Acri, dove morì nel 1190. La sorellastra Isabella ereditò il diritto alla corona che Guido aveva esercitato grazie a Sibilla."] }]
