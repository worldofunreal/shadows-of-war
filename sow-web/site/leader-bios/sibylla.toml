[articles.pt-BR]
text = "Sibila era filha de Amalrico de Jerusalém e Inês de Courtenay. Antes de se tornar rainha, governou o condado de Jafa e Ascalão. Uma carta que ela emitiu em 1177 registra a concessão de torres, um jardim e receitas em Ascalão ao conde Rodrigo e aos irmãos de sua ordem religiosa. Seu primeiro marido, Guilherme de Monferrato, foi o pai de Balduíno V. Quando seu filho morreu em 1186, Sibila reivindicou a coroa de Jerusalém por direito próprio e fez do segundo marido, Guido de Lusignan, rei ao seu lado."
title = "Sibila de Jerusalém"
lang = "pt-BR"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibila era filha de Amalrico de Jerusalém e Inês de Courtenay. Antes de se tornar rainha, governou o condado de Jafa e Ascalão. Uma carta que ela emitiu em 1177 registra a concessão de torres, um jardim e receitas em Ascalão ao conde Rodrigo e aos irmãos de sua ordem religiosa. Seu primeiro marido, Guilherme de Monferrato, foi o pai de Balduíno V. Quando seu filho morreu em 1186, Sibila reivindicou a coroa de Jerusalém por direito próprio e fez do segundo marido, Guido de Lusignan, rei ao seu lado."]
sections = [{ title = "A escolha de um corregente", paragraphs = ["As crônicas divergem sobre se seus partidários exigiram primeiro que ela renunciasse ao casamento. Uma carta de outubro de 1186 registra o consentimento de Sibila à concessão de terras a Joscelino de Courtenay. Em 1187, Saladino derrotou o exército do reino em Hattin, capturou Guido e tomou Jerusalém. Depois que Guido foi libertado, Sibila se reuniu a ele durante o cerco de Acre, onde morreu em 1190. Sua meia-irmã Isabel herdou o direito à coroa que Guido havia exercido por meio de Sibila."] }]
