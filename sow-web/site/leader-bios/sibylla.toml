[articles.tr]
text = "Sibylla, Kudüs Kralı Amalrik ile Agnes de Courtenay’nin kızıydı. Kraliçe olmadan önce Yafa ve Aşkelon kontluğunu yönetti. 1177 tarihli kendi belgesinde Kont Rodrigo’ya ve onun tarikatındaki kardeşlerine Aşkelon’da kuleler, bir bahçe ve gelirler verdi. İlk eşi Montferratlı William’dan doğan oğlu daha sonra V. Baudouin adıyla kral oldu. Oğlu 1186’da ölünce Sibylla kendi miras hakkıyla Kudüs tacını istedi ve ikinci eşi Guy de Lusignan’ı yanında kral yaptı."
title = "Kudüs Kraliçesi Sibylla"
lang = "tr"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibylla, Kudüs Kralı Amalrik ile Agnes de Courtenay’nin kızıydı. Kraliçe olmadan önce Yafa ve Aşkelon kontluğunu yönetti. 1177 tarihli kendi belgesinde Kont Rodrigo’ya ve onun tarikatındaki kardeşlerine Aşkelon’da kuleler, bir bahçe ve gelirler verdi. İlk eşi Montferratlı William’dan doğan oğlu daha sonra V. Baudouin adıyla kral oldu. Oğlu 1186’da ölünce Sibylla kendi miras hakkıyla Kudüs tacını istedi ve ikinci eşi Guy de Lusignan’ı yanında kral yaptı."]
sections = [{ title = "Ortak hükümdarın seçimi", paragraphs = ["Destekçilerinin önce evliliğinden vazgeçmesini isteyip istemediği konusunda kronikler farklı anlatımlar sunar. Ekim 1186 tarihli bir belge, Joscelin de Courtenay’e mülk verilmesinde Sibylla’nın onayını kaydeder. 1187’de Selahaddin krallığın ordusunu Hıttin’de yendi, Guy’ı esir aldı ve Kudüs’ü ele geçirdi. Guy serbest kalınca Sibylla ona Akka kuşatmasında katıldı ve 1190’da orada öldü. Üvey kız kardeşi Isabella, Guy’ın Sibylla üzerinden sahip olduğu taht hakkını devraldı."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.zh-CN]
text = "西比拉是耶路撒冷国王阿马尔里克与库尔特奈的阿格妮丝的女儿。登基以前，她曾是雅法和阿斯卡隆女伯爵。她的第一任丈夫蒙费拉的威廉去世后，她仍以女伯爵的名义发布文书。她在一一七七年签发的文书将阿斯卡隆的一些城墙塔楼、花园和收入授给罗德里戈伯爵和他的修会成员。文书列出款项在一年中分四次支付的日期，并提到以她的印玺和见证人来确认赠与。她与威廉的儿子后来成为鲍德温五世。儿子在一一八六年去世后，她凭自己的继承权争取耶路撒冷王位，同父异母的妹妹伊莎贝拉也有继承资格。西比拉取得王冠，并选择自己的第二任丈夫吕西尼昂的居伊作为共同统治者。不同的编年史对于支持她的贵族是否先要求她解除与居伊的婚姻，说法并不一致。"
title = "耶路撒冷的西比拉"
lang = "zh-CN"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["西比拉是耶路撒冷国王阿马尔里克与库尔特奈的阿格妮丝的女儿。登基以前，她曾是雅法和阿斯卡隆女伯爵。她的第一任丈夫蒙费拉的威廉去世后，她仍以女伯爵的名义发布文书。她在一一七七年签发的文书将阿斯卡隆的一些城墙塔楼、花园和收入授给罗德里戈伯爵和他的修会成员。文书列出款项在一年中分四次支付的日期，并提到以她的印玺和见证人来确认赠与。她与威廉的儿子后来成为鲍德温五世。儿子在一一八六年去世后，她凭自己的继承权争取耶路撒冷王位，同父异母的妹妹伊莎贝拉也有继承资格。西比拉取得王冠，并选择自己的第二任丈夫吕西尼昂的居伊作为共同统治者。不同的编年史对于支持她的贵族是否先要求她解除与居伊的婚姻，说法并不一致。"]
sections = [{ title = "选择共同统治者", paragraphs = ["这场加冕的具体过程需要与其他档案相互印证。与加冕同年十月，居伊在阿卡颁布一份文书，将托龙等地产授予总管库尔特奈的若斯兰。文书明确记载，这份赠与经过西比拉同意，并列出授地附带的条件，包括城堡归属有变时如何处置。如果若斯兰失去托龙和新堡，接手城堡的人还要按见证人确认的数额偿还他修筑工事的开支。这份文书列有牧首和军事修会首领等见证人。它显示了西比拉在位时参与王室授地的一个具体实例。次年，萨拉丁在哈丁战役击败耶路撒冷王国的军队，俘虏居伊，并于同年攻取耶路撒冷。居伊获释后，西比拉在阿卡围城期间与他会合，并于一一九〇年去世。她去世后，王位继承权转到她的妹妹伊莎贝拉身上，居伊此前行使王权所依据的是与西比拉的婚姻。现存文书见证了西比拉身份的变化。从她自己签发的伯爵领授地文书，到王室确认她同意给予若斯兰土地的特许状，都记录了她以不同身份处理地产和收入的活动。关于她在加冕当天采取了哪些步骤，各记述的分歧也提醒读者把能够核实的授地决定与仪式的传说分开。"] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.ja]
text = "シビーユはエルサレム王アモーリーとアニェス・ド・クルトネーの娘である。即位前にはヤッファとアスカロンの伯領を治めた。最初の夫ギヨーム・ド・モンフェラートの死後、彼女自身が出した一一七七年の文書には、アスカロンの城壁の塔や庭園、収入をロドリゴ伯とその修道会の兄弟たちに授けたことが記されている。この文書は支払いを年に四度に分けることを定め、証人と彼女の印章によって寄進を確認している。ギヨームとの間に生まれた息子は後にボードゥアン五世となった。息子が一一八六年に亡くなると、シビーユは自らの継承権によってエルサレムの王冠を求めた。異母妹イザベルにも継承権があり、王国内で支持が分かれた。シビーユは王位を得て、二番目の夫ギー・ド・リュジニャンを共同統治者に選んだ。彼女の支持者が先に婚姻の解消を求めたかについては、年代記の伝える内容が一致していない。"
title = "エルサレムのシビーユ"
lang = "ja"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["シビーユはエルサレム王アモーリーとアニェス・ド・クルトネーの娘である。即位前にはヤッファとアスカロンの伯領を治めた。最初の夫ギヨーム・ド・モンフェラートの死後、彼女自身が出した一一七七年の文書には、アスカロンの城壁の塔や庭園、収入をロドリゴ伯とその修道会の兄弟たちに授けたことが記されている。この文書は支払いを年に四度に分けることを定め、証人と彼女の印章によって寄進を確認している。ギヨームとの間に生まれた息子は後にボードゥアン五世となった。息子が一一八六年に亡くなると、シビーユは自らの継承権によってエルサレムの王冠を求めた。異母妹イザベルにも継承権があり、王国内で支持が分かれた。シビーユは王位を得て、二番目の夫ギー・ド・リュジニャンを共同統治者に選んだ。彼女の支持者が先に婚姻の解消を求めたかについては、年代記の伝える内容が一致していない。"]
sections = [{ title = "共同統治者の選択", paragraphs = ["同年十月にアッコンで作成された勅書は、王となったギーがジョスラン・ド・クルトネーにトロンなどの所領を与えたことを伝える。勅書にはシビーユの同意が明記され、城の帰属が変わった場合の取り決めも含まれている。戴冠式をめぐる物語とは別に、この文書からは、彼女が王位を得た後に王室の所領の処分に関わった具体的な一例が分かる。一一八七年、サラディンはハッティンで王国軍を破ってギーを捕らえ、同年にエルサレムも占領した。ギーの解放後、シビーユはアッコン包囲戦で彼と合流し、一一九〇年に現地で死去した。死後は異母妹イザベルが王冠への権利を継いだ。ギーが王権を行使した根拠はシビーユとの婚姻だった。伯領時代の寄進状と即位後の勅書を読み合わせることで、短い治世の前後にシビーユが土地、収入、王位継承にどのような立場で関わったかが見えてくる。"] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.ko]
text = "시빌라는 예루살렘 국왕 아모리와 아녜스 드 쿠르트네의 딸이다. 왕위를 얻기 전에는 야파와 아스칼론의 백작령을 다스렸다. 첫 남편 몬페라토의 굴리엘모가 죽은 뒤에도 백작으로서 문서를 발행했다. 1177년 문서에는 아스칼론의 탑과 정원, 수입을 로드리고 백작과 그의 수도회 구성원에게 준 일이 기록되어 있다. 문서는 연간 수입을 네 차례에 나누어 지급하도록 정하고 시빌라의 인장과 증인으로 증여를 확인했다. 굴리엘모와의 사이에서 낳은 아들은 훗날 보두앵 5세가 되었다. 아들이 1186년에 죽자 시빌라는 자신의 상속권을 근거로 예루살렘의 왕위를 요구했다. 이복동생 이사벨도 왕위 계승권이 있어 귀족들의 지지는 갈렸다. 시빌라는 왕관을 쓰고 두 번째 남편 기 드 뤼지냥을 공동 통치자로 삼았다. 지지자들이 앞서 혼인을 끝내라고 요구했는지는 연대기마다 다르게 전한다."
title = "예루살렘의 시빌라"
lang = "ko"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["시빌라는 예루살렘 국왕 아모리와 아녜스 드 쿠르트네의 딸이다. 왕위를 얻기 전에는 야파와 아스칼론의 백작령을 다스렸다. 첫 남편 몬페라토의 굴리엘모가 죽은 뒤에도 백작으로서 문서를 발행했다. 1177년 문서에는 아스칼론의 탑과 정원, 수입을 로드리고 백작과 그의 수도회 구성원에게 준 일이 기록되어 있다. 문서는 연간 수입을 네 차례에 나누어 지급하도록 정하고 시빌라의 인장과 증인으로 증여를 확인했다. 굴리엘모와의 사이에서 낳은 아들은 훗날 보두앵 5세가 되었다. 아들이 1186년에 죽자 시빌라는 자신의 상속권을 근거로 예루살렘의 왕위를 요구했다. 이복동생 이사벨도 왕위 계승권이 있어 귀족들의 지지는 갈렸다. 시빌라는 왕관을 쓰고 두 번째 남편 기 드 뤼지냥을 공동 통치자로 삼았다. 지지자들이 앞서 혼인을 끝내라고 요구했는지는 연대기마다 다르게 전한다."]
sections = [{ title = "공동 통치자의 선택", paragraphs = ["그해 10월 아크레에서 작성된 왕실 문서에는 기가 조슬랭 드 쿠르트네에게 토롱 등 여러 영지를 준 사실이 나온다. 문서는 시빌라가 증여에 동의했다고 명시하고, 성의 소유가 바뀌면 어떤 조건을 적용하는지도 기록했다. 대관식에 관한 이야기와 별개로, 이는 시빌라가 왕위에 오른 뒤 왕실의 영지 처분에 관여했음을 보여 주는 구체적인 기록이다. 1187년 살라딘은 하틴에서 왕국군을 격파하고 기를 사로잡았으며, 같은 해 예루살렘을 점령했다. 기가 풀려난 뒤 시빌라는 아크레 포위전에서 그와 합류했고, 1190년에 그곳에서 죽었다. 그녀가 죽자 이복동생 이사벨이 왕위 계승권을 물려받았다. 기가 왕권을 행사할 수 있었던 근거는 시빌라와의 혼인이었다. 백작령에서 발급한 증여장과 즉위 후의 왕실 문서를 함께 읽으면 시빌라가 서로 다른 지위에서 토지와 수입을 어떻게 다뤘는지 확인할 수 있다."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.ar]
text = "كانت سيبيلا ابنة أمالريك ملك القدس وأغنيس من كورتيناي. وقبل أن تصبح ملكة تولت كونتية يافا وعسقلان. وتوثق وثيقة أصدرتها سنة 1177 منحها أبراجا وبستانا وإيرادات في عسقلان للكونت رودريغو وإخوان طائفته الدينية. وأنجبت من زوجها الأول وليام من مونفيرات ابنا صار الملك بلدوين الخامس. وبعد وفاته سنة 1186 طالبت سيبيلا بتاج القدس بحقها الوراثي، وجعلت زوجها الثاني غي دي لوزينيان ملكا إلى جانبها."
title = "سيبيلا ملكة القدس"
lang = "ar"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["كانت سيبيلا ابنة أمالريك ملك القدس وأغنيس من كورتيناي. وقبل أن تصبح ملكة تولت كونتية يافا وعسقلان. وتوثق وثيقة أصدرتها سنة 1177 منحها أبراجا وبستانا وإيرادات في عسقلان للكونت رودريغو وإخوان طائفته الدينية. وأنجبت من زوجها الأول وليام من مونفيرات ابنا صار الملك بلدوين الخامس. وبعد وفاته سنة 1186 طالبت سيبيلا بتاج القدس بحقها الوراثي، وجعلت زوجها الثاني غي دي لوزينيان ملكا إلى جانبها."]
sections = [{ title = "اختيار شريك في الحكم", paragraphs = ["تختلف الروايات بشأن ما إذا كان أنصارها قد طالبوها أولا بإنهاء زواجها. وتسجل وثيقة من أكتوبر 1186 موافقتها على منح أملاك لجوسلين من كورتيناي. وفي 1187 هزم صلاح الدين جيش المملكة في حطين، وأسر غي واستولى على القدس. وبعد إطلاق سراح غي انضمت إليه سيبيلا في حصار عكا، حيث توفيت سنة 1190. وورثت أختها غير الشقيقة إيزابيلا الحق في التاج الذي مارسه غي عن طريق سيبيلا. وتساعد الوثائق الباقية على تتبع دورها قبل تولي العرش وبعده."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.ru]
text = "Сибилла была дочерью Амальрика Иерусалимского и Агнессы де Куртене. До вступления на престол она владела графством Яффы и Аскалона. В грамоте от 1177 года записано, что она пожаловала графу Родриго и братьям его ордена башни, сад и доходы в Аскалоне. От первого мужа, Вильгельма Монферратского, она родила будущего короля Балдуина V. После смерти сына в 1186 году Сибилла предъявила наследственное право на иерусалимскую корону и сделала второго мужа, Ги де Лузиньяна, королём рядом с собой."
title = "Сибилла Иерусалимская"
lang = "ru"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Сибилла была дочерью Амальрика Иерусалимского и Агнессы де Куртене. До вступления на престол она владела графством Яффы и Аскалона. В грамоте от 1177 года записано, что она пожаловала графу Родриго и братьям его ордена башни, сад и доходы в Аскалоне. От первого мужа, Вильгельма Монферратского, она родила будущего короля Балдуина V. После смерти сына в 1186 году Сибилла предъявила наследственное право на иерусалимскую корону и сделала второго мужа, Ги де Лузиньяна, королём рядом с собой."]
sections = [{ title = "Выбор соправителя", paragraphs = ["Хроники расходятся в том, требовали ли её сторонники предварительно расторгнуть этот брак. Грамота от октября 1186 года отмечает согласие Сибиллы на пожалование владений Жослену де Куртене. В 1187 году Саладин разбил войско королевства при Хаттине, взял Ги в плен и захватил Иерусалим. После освобождения Ги Сибилла присоединилась к нему при осаде Акры, где умерла в 1190 году. Её единокровная сестра Изабелла унаследовала право на корону, которым Ги обладал через Сибиллу."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.vi]
text = "Sibylla là con gái của Amalric xứ Jerusalem và Agnes xứ Courtenay. Trước khi lên ngôi nữ vương, bà nắm giữ bá quốc Jaffa và Ascalon. Văn thư do bà ban hành năm 1177 ghi việc bà cấp tháp, vườn và nguồn thu ở Ascalon cho bá tước Rodrigo và các thành viên dòng tu của ông. Bà có một con trai với người chồng đầu, William xứ Montferrat, sau này là vua Baldwin V. Khi con trai qua đời năm 1186, Sibylla đòi vương miện Jerusalem theo quyền kế vị của mình và đưa người chồng thứ hai, Guy xứ Lusignan, lên ngôi vua bên cạnh bà."
title = "Sibylla của Jerusalem"
lang = "vi"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibylla là con gái của Amalric xứ Jerusalem và Agnes xứ Courtenay. Trước khi lên ngôi nữ vương, bà nắm giữ bá quốc Jaffa và Ascalon. Văn thư do bà ban hành năm 1177 ghi việc bà cấp tháp, vườn và nguồn thu ở Ascalon cho bá tước Rodrigo và các thành viên dòng tu của ông. Bà có một con trai với người chồng đầu, William xứ Montferrat, sau này là vua Baldwin V. Khi con trai qua đời năm 1186, Sibylla đòi vương miện Jerusalem theo quyền kế vị của mình và đưa người chồng thứ hai, Guy xứ Lusignan, lên ngôi vua bên cạnh bà."]
sections = [{ title = "Chọn người cùng trị vì", paragraphs = ["Các biên niên sử kể khác nhau về việc những người ủng hộ có yêu cầu bà từ bỏ cuộc hôn nhân trước lễ đăng quang hay không. Một văn thư tháng 10 năm 1186 ghi việc bà đồng ý cấp đất cho Joscelin xứ Courtenay. Năm 1187, Saladin đánh bại quân đội vương quốc tại Hattin, bắt Guy rồi chiếm Jerusalem. Sau khi Guy được thả, Sibylla cùng ông tham gia cuộc vây hãm Acre. Bà qua đời tại đó năm 1190. Người em cùng cha khác mẹ Isabella thừa hưởng quyền với vương miện mà Guy từng có qua Sibylla."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.id]
text = "Sibylla adalah putri Amalric dari Yerusalem dan Agnes dari Courtenay. Sebelum menjadi ratu, ia memegang wilayah Jaffa dan Ascalon. Piagam yang dikeluarkannya pada 1177 mencatat pemberian menara, kebun, dan pendapatan di Ascalon kepada Count Rodrigo dan anggota ordo keagamaannya. Putranya dengan William dari Montferrat kelak menjadi Raja Baldwin V. Saat putranya wafat pada 1186, Sibylla menuntut mahkota Yerusalem dengan hak warisnya sendiri dan menjadikan suami keduanya, Guy dari Lusignan, raja yang memerintah bersamanya."
title = "Sibylla dari Yerusalem"
lang = "id"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibylla adalah putri Amalric dari Yerusalem dan Agnes dari Courtenay. Sebelum menjadi ratu, ia memegang wilayah Jaffa dan Ascalon. Piagam yang dikeluarkannya pada 1177 mencatat pemberian menara, kebun, dan pendapatan di Ascalon kepada Count Rodrigo dan anggota ordo keagamaannya. Putranya dengan William dari Montferrat kelak menjadi Raja Baldwin V. Saat putranya wafat pada 1186, Sibylla menuntut mahkota Yerusalem dengan hak warisnya sendiri dan menjadikan suami keduanya, Guy dari Lusignan, raja yang memerintah bersamanya."]
sections = [{ title = "Memilih rekan penguasa", paragraphs = ["Berbagai kronik tidak sepakat mengenai apakah para pendukungnya semula menuntut agar ia meninggalkan perkawinannya. Piagam dari Oktober 1186 mencatat persetujuannya atas pemberian tanah kepada Joscelin dari Courtenay. Pada 1187, Salahuddin mengalahkan pasukan kerajaan di Hattin, menangkap Guy, dan merebut Yerusalem. Setelah Guy dibebaskan, Sibylla bergabung dengannya di pengepungan Acre, tempat ia wafat pada 1190. Saudari tirinya, Isabella, mewarisi hak atas takhta yang sebelumnya diperoleh Guy melalui Sibylla."] }]
