[articles.en]
text = "Sibylla was the daughter of Amalric of Jerusalem and Agnes of Courtenay. Before becoming queen, she held the county of Jaffa and Ascalon. A charter she issued in 1177 records her grant of towers, a garden and revenue at Ascalon to Count Roderic and his religious brethren. She had a son, the future Baldwin V, with William of Montferrat. When Baldwin V died in 1186, Sibylla claimed the crown of Jerusalem in her own right and made her second husband, Guy of Lusignan, king alongside her."
title = "Sibylla of Jerusalem"
lang = "en"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibylla was the daughter of Amalric of Jerusalem and Agnes of Courtenay. Before becoming queen, she held the county of Jaffa and Ascalon. A charter she issued in 1177 records her grant of towers, a garden and revenue at Ascalon to Count Roderic and his religious brethren. She had a son, the future Baldwin V, with William of Montferrat. When Baldwin V died in 1186, Sibylla claimed the crown of Jerusalem in her own right and made her second husband, Guy of Lusignan, king alongside her."]
sections = [{ title = "The choice of a co-ruler", paragraphs = ["The chronicles differ on whether her supporters first required her to give up her marriage. An October 1186 charter granting estates to Joscelin of Courtenay records Sibylla’s consent. In 1187 Saladin defeated the kingdom’s army at Hattin, captured Guy and took Jerusalem. After his release, Sibylla joined him at the siege of Acre, where she died in 1190. Her half-sister Isabella inherited the claim that Guy had held through Sibylla."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.es]
text = "Sibila fue hija de Amalarico de Jerusalén e Inés de Courtenay. Antes de ser reina gobernó el condado de Jaffa y Ascalón. En 1177 emitió una carta por la que concedía torres, un jardín y rentas en Ascalón al conde Rodrigo y a los hermanos de su orden religiosa. Su primer esposo, Guillermo de Montferrato, fue el padre del futuro Balduino V. Cuando su hijo murió en 1186, Sibila reclamó la corona de Jerusalén por derecho propio e hizo rey a su segundo esposo, Guido de Lusignan."
title = "Sibila de Jerusalén"
lang = "es"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibila fue hija de Amalarico de Jerusalén e Inés de Courtenay. Antes de ser reina gobernó el condado de Jaffa y Ascalón. En 1177 emitió una carta por la que concedía torres, un jardín y rentas en Ascalón al conde Rodrigo y a los hermanos de su orden religiosa. Su primer esposo, Guillermo de Montferrato, fue el padre del futuro Balduino V. Cuando su hijo murió en 1186, Sibila reclamó la corona de Jerusalén por derecho propio e hizo rey a su segundo esposo, Guido de Lusignan."]
sections = [{ title = "La elección de un corregente", paragraphs = ["Las crónicas discrepan sobre si sus partidarios le exigieron primero renunciar a ese matrimonio. Una carta de octubre de 1186 deja constancia del consentimiento de Sibila a la concesión de propiedades a Joscelino de Courtenay. En 1187 Saladino derrotó al ejército del reino en los Cuernos de Hattin, capturó a Guido y tomó Jerusalén. Tras la liberación de Guido, Sibila se reunió con él durante el asedio de Acre, donde murió en 1190. Su media hermana Isabel heredó el derecho a la corona que Guido había ejercido a través de Sibila."] }]
sources = [{ title = "Columbia University Epistolae, Sibylla’s grant at Ascalon (1177)", url = "https://epistolae.ctl.columbia.edu/letter/25227.html" }, { title = "Columbia University Epistolae, royal grant to Joscelin (1186)", url = "https://epistolae.ctl.columbia.edu/letter/25236.html" }, { title = "Helen J. Nicholson, Sybil, Queen of Jerusalem, 1186–1190", url = "https://www.routledge.com/Sybil-Queen-of-Jerusalem-1186-1190/Nicholson/p/book/9781032234663" }, { title = "Bernard Hamilton, Women in the Crusader States: The Queens of Jerusalem (1100–1190)", url = "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/E7198BD7B384CC7E2380A46B3F14CFF1/S0143045900000375a.pdf/women-in-the-crusader-states-the-queens-of-jerusalem-1100-1190.pdf" }]

[articles.fr]
text = "Sibylle était la fille d’Amaury de Jérusalem et d’Agnès de Courtenay. Avant de devenir reine, elle détenait le comté de Jaffa et d’Ascalon. Dans une charte de 1177, elle accorda au comte Rodrigue et aux frères de son ordre des tours, un jardin et des revenus à Ascalon. Elle eut du comte Guillaume de Montferrat un fils, le futur Baudouin V. À la mort de ce dernier en 1186, Sibylle revendiqua la couronne de Jérusalem en son nom et fit de son second époux, Guy de Lusignan, un roi à ses côtés."
title = "Sibylle de Jérusalem"
lang = "fr"
url = "https://epistolae.ctl.columbia.edu/letter/25227.html"
shortArticle = true
intro = ["Sibylle était la fille d’Amaury de Jérusalem et d’Agnès de Courtenay. Avant de devenir reine, elle détenait le comté de Jaffa et d’Ascalon. Dans une charte de 1177, elle accorda au comte Rodrigue et aux frères de son ordre des tours, un jardin et des revenus à Ascalon. Elle eut du comte Guillaume de Montferrat un fils, le futur Baudouin V. À la mort de ce dernier en 1186, Sibylle revendiqua la couronne de Jérusalem en son nom et fit de son second époux, Guy de Lusignan, un roi à ses côtés."]
sections = [{ title = "Le choix d’un corégent", paragraphs = ["Les chroniques divergent sur l’exigence éventuelle de ses partisans qu’elle renonce d’abord à ce mariage. Une charte d’octobre 1186 consigne son consentement à l’octroi de terres à Josselin de Courtenay. En 1187, Saladin battit l’armée du royaume à Hattin, captura Guy et prit Jérusalem. Après la libération de Guy, Sibylle le rejoignit au siège d’Acre, où elle mourut en 1190. Sa demi-sœur Isabelle hérita du droit à la couronne que Guy tenait de Sibylle."] }]
