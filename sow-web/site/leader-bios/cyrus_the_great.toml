[articles.en]
text = "Cyrus II of Persia, commonly known as Cyrus the Great, was the founder of the Achaemenid Empire. Hailing from Persis, he brought the Achaemenid dynasty to power by defeating the Median Empire and embracing all of the previous civilized states of the ancient Near East, expanding vastly across most of West Asia and much of Central Asia to create what would soon become the largest empire in history at the time."
title = "Cyrus the Great"
lang = "en"
url = "https://en.wikipedia.org/wiki/Cyrus_the_Great"
intro = [
  "Cyrus II of Persia (c. 600 – 530 BC), commonly known as Cyrus the Great, was the founder of the Achaemenid Empire. Hailing from Persis, he brought the Achaemenid dynasty to power by defeating the Median Empire and embracing all of the previous civilized states of the ancient Near East, expanding vastly across most of West Asia and much of Central Asia to create what would soon become the largest empire in history at the time. The Achaemenid Empire's greatest territorial extent was achieved under Darius the Great, whose rule stretched from Southeast Europe and Northeast Africa in the west to the Indus Valley in the east.",
  "After absorbing the Median Empire, Cyrus conquered Lydia and eventually the Neo-Babylonian Empire, granting him control of Anatolia and the Fertile Crescent, respectively. He also led a major expedition into Central Asia, where his army brought \"into subjection every nation without exception\" before he allegedly died in battle with the Massagetae, a nomadic Eastern Iranian people, along the Syr Darya in December 530 BC. However, according to Xenophon of Athens, Cyrus did not die fighting and had instead returned to the capital city of Pasargadae. He was succeeded by his son Cambyses II, whose campaigns led to the conquests of Egypt, Nubia, and Cyrenaica during his short reign.",
  "To the Greeks, he was known as Cyrus the Elder and was particularly renowned among contemporary scholars because of his habitual policy of tolerance for peoples' customs and religions in the lands that he conquered. Similarly, he is exalted in Judaism for his role in freeing the Jewish people from the Babylonian captivity by issuing the Edict of Restoration following the Persian conquest of Babylon. This event is described in the Hebrew Bible as the return to Zion, whereby displaced Jews were repatriated to what had been the Kingdom of Judah, thus enabling the resurgence of Jewish sovereignty in the Land of Israel. Cyrus also facilitated Jewish aspirations for a new Temple in Jerusalem in the Achaemenid Empire's province of Yehud, where the original Solomon's Temple had once stood before being destroyed during the Babylonian siege of Jerusalem. His efforts resulted in the completion of the Second Temple, which marked the beginning of the Second Temple period and Second Temple Judaism. According to the Book of Isaiah, he was anointed by Yahweh and explicitly designated \"messiah\" for this task; Cyrus is the only non-Jewish figure to be revered in this capacity.",
  "In addition to his influence on traditions in both the East and the West, Cyrus is recognized for his achievements in politics and military strategy. He was influential in developing the system of a central administration at his capital city to govern the Achaemenid Empire's satraps, who worked for the profit of both rulers and subjects. His realm's prestige in the ancient world would gradually reach as far west as Athens, where upper-class Greeks adopted aspects of the culture of the ruling Persian class as their own. Likewise, Cyrus's reign played a crucial role in defining the history of Iran for well over a millennium, as future Persian empires often viewed the Achaemenid era with deference and as the ideal example to emulate. His dynasty was also instrumental in allowing Zoroastrianism to develop and spread as far east as China. To this end, he remains a cult figure in modern Iran, with his Pasargadae tomb serving as a spot of reverence for millions of the country's citizens.",
]
sections = [
  { "title" = "Etymology", "paragraphs" = [
      "The name Cyrus is a Latinized form derived from the Greek-language name Κῦρος (Kỹros), which itself was derived from the Old Persian name Kūruš. The name and its meaning have been recorded within ancient inscriptions in different languages. The ancient Greek historians Ctesias and Plutarch stated that Cyrus was named from the Sun (Kuros), a concept which has been interpreted as meaning \"like the Sun\" (Khurvash) by noting its relation to the Persian noun for Sun, khor, while using -vash as a suffix of likeness. Karl Hoffmann has suggested a translation based on the meaning of an Indo-European root \"to humiliate\", and accordingly, the name \"Cyrus\" means \"humiliator of the enemy in verbal contest\". Another possible Iranian derivation would mean \"the young one, child\", similar to Kurdish kur (\"son, little boy\") or Ossetian i-gur-un (\"to be born\") and kur (young bull). In the Persian language and especially in Iran, Cyrus's name is spelled as کوروش (Kūroš, [kuːˈɾoʃ]). In the Bible, he is referred to in the Hebrew language as Koresh (כורש). Some pieces of evidence suggest that Cyrus is Kay Khosrow, a legendary Persian king of the Kayanian dynasty and a character in Shahnameh, a Persian epic.",
      "Some scholars, however, believe that neither Cyrus nor Cambyses were Iranian names, proposing that Cyrus was Elamite in origin and that the name meant \"he who bestows care\" in the extinct Elamite language. One reason is that, while Elamite names may end in -uš, no Elamite texts spell the name this way – only Kuraš. Meanwhile, Old Persian did not allow names to end in -aš, so it would make sense for Persian speakers to change an original Kuraš into the more grammatically correct form Kuruš. Elamite scribes, on the other hand, would not have had a reason to change an original Kuraš into Kuruš, since both forms were acceptable. Therefore, Kuraš probably represents the original form. Another scholarly opinion is that Kuruš was a name of Indo-Aryan origin, in honour of the Indo-Aryan Kuru and Kamboja mercenaries from eastern Afghanistan and northwest India that helped in the conquest of the Middle East.",
    ] },
  { "title" = "Dynastic history", "paragraphs" = [
      "The Persian domination and kingdom in the Iranian plateau started as an extension of the Achaemenid dynasty, who expanded their earlier dominion possibly from the 9th century BC onward. The eponymous founder of the dynasty was Achaemenes (from Old Persian Haxāmaniš). Achaemenids are \"descendants of Achaemenes\", as Darius the Great, the ninth king of the dynasty, traced his ancestry to him, declaring \"for this reason, we are called Achaemenids\". Achaemenes built the state of Parsumash in the southwest of Iran and was succeeded by Teispes, who took the title \"King of Anshan\" after seizing the city Anshan and enlarging his kingdom further to include Pars proper. Ancient documents mention that Teispes had a son called Cyrus I, who also succeeded his father as \"king of Anshan\". Cyrus I had a full brother whose name is recorded as Ariaramnes.",
      "In 600 BC, Cyrus I was succeeded by his son, Cambyses I, who reigned until 559 BC. Cyrus II \"the Great\" was a son of Cambyses I, who had named his son after his father, Cyrus I. There are several inscriptions of Cyrus the Great and later kings that refer to Cambyses I as the \"great king\" and \"king of Anshan\". Among these are some passages in the Cyrus cylinder where Cyrus calls himself \"son of Cambyses, great king, king of Anshan\". Another inscription (from CM's) mentions Cambyses I as a \"mighty king\" and \"an Achaemenian\", which according to the bulk of scholarly opinion was engraved under Darius and considered as a later forgery by Darius. However, Cambyses II's maternal grandfather Pharnaspes is named by historian Herodotus as \"an Achaemenian\". Xenophon's account in his Cyropædia names Cambyses's wife as Mandane and mentions Cambyses as king of Iran (ancient Persia). These agree with Cyrus's own inscriptions, as Anshan and Parsa were different names for the same land. These also agree with other non-Iranian accounts, except on one point from Herodotus which states that Cambyses was not a king but a \"Persian of good family\". However, in some other passages, Herodotus's account is wrong also on the name of the son of Chishpish, which he mentions as Cambyses but according to modern scholars, should be Cyrus I.",
      "The traditional view based on archaeological research and the genealogy given in the Behistun inscription and by Herodotus holds that Cyrus the Great was an Achaemenid. However, M. Waters has suggested that Cyrus is unrelated to the Achaemenids or Darius the Great, and that his family was of Teispid and Anshanite origin instead of Achaemenid.",
    ] },
  { "title" = "Early and personal life", "paragraphs" = [
      "Cyrus was born to Cambyses I, King of Anshan, and Mandane, daughter of Astyages, King of Media, during the period of 600–599 BC.",
      "By his own account, generally believed now to be accurate, Cyrus was preceded as king by his father Cambyses I, grandfather Cyrus I, and great-grandfather Teispes. Cyrus married Cassandane who was an Achaemenian and the daughter of Pharnaspes. Cassandane bore him two sons, Cambyses II and Bardiya along with three daughters, Atossa, Artystone, and Roxane. Cyrus and Cassandane were known to love each other very much – Cassandane said that she found it more bitter to leave Cyrus than to depart her life. After her death, Cyrus insisted on public mourning throughout the kingdom. The Nabonidus Chronicle states that Babylonia mourned Cassandane for six days (identified as 21–26 March 538 BC). After his father's death, Cyrus inherited the Persian throne at Pasargadae, which was a vassal of Astyages. The Greek historian Strabo has said that Cyrus was originally named Agradates by his step-parents. It is possible that, when reuniting with his original family, following the naming customs, Cyrus's father, Cambyses I, named him Cyrus after his grandfather, who was Cyrus I. There is also an account by Strabo that claimed Agradates adopted the name Cyrus after the Cyrus river near Pasargadae.",
      "Herodotus gave a mythological account of Cyrus's early life. In this account, Astyages had two prophetic dreams in which a flood, and then a series of fruit-bearing vines, emerged from his daughter Mandane's pelvis, and covered the entire kingdom. These were interpreted by his advisers as a foretelling that his grandson would one day rebel and supplant him as king. Astyages summoned Mandane, at the time pregnant with Cyrus, back to Ecbatana to have the child killed. His general Harpagus delegated the task to Mithradates, one of the shepherds of Astyages, who raised the child and passed off his stillborn son to Harpagus as the dead infant Cyrus.",
    ] },
  { "title" = "Rise to power", "paragraphs" = [
      "Cyrus the Great succeeded to the throne in 559 BC following his father's death; however, Cyrus was not yet an independent ruler. Like his predecessors, Cyrus had to recognize Median overlordship. Astyages, last king of the Median Empire and Cyrus's grandfather, may have ruled over the majority of the Ancient Near East, from the Lydian frontier in the west to the lands of the Parthians and Persians in the east.",
      "According to the Nabonidus Chronicle, Astyages launched an attack against Cyrus, \"king of Ansan\". According to the historian Herodotus, it is known that Astyages placed Harpagus in command of the Median army to conquer Cyrus. However, Harpagus contacted Cyrus and encouraged his revolt against Media, before eventually defecting along with several of the nobility and a portion of the army. This mutiny is confirmed by the Nabonidus Chronicle. The Chronicle suggests that the hostilities lasted for at least three years (553–550 BC), and the final battle resulted in the capture of Ecbatana. This was described in the paragraph that preceded the entry for Nabonidus's year 7, which detailed Cyrus's victory and the capture of his grandfather. According to the historians Herodotus and Ctesias, Cyrus spared the life of Astyages and married his daughter, Amytis. This marriage pacified several vassals, including the Bactrians, Parthians, and Saka. Cyrus also subdued and incorporated Sogdia into the empire during his military campaigns of 546–539 BC.",
      "With Astyages out of power, all of his vassals (including many of Cyrus's relatives) were now under his command. His father's cousin Arsames, who had been the king of the city-state of Parsa under the Medes, therefore would have had to give up his throne. However, this transfer of power within the family seems to have been smooth, and it is likely that Arsames was still the nominal governor of Parsa under Cyrus's authority—more a Prince or a Grand Duke than a King. His son, Hystaspes, who was also Cyrus's second cousin, was then made satrap of Parthia and Phrygia. Cyrus the Great thus united the twin Achaemenid kingdoms of Parsa and Anshan into Persia proper. Arsames lived to see his grandson become Darius the Great, Shahanshah of Persia, after the deaths of both of Cyrus's sons. Cyrus's conquest of Media was merely the start of his wars.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "British historian Charles Freeman suggests that \"In scope and extent his achievements [Cyrus] ranked far above that of the Macedonian king, Alexander, who was to demolish the [Achaemenid] empire in the 320s but fail to provide any stable alternative.\" Cyrus has been a personal hero to many people, including Thomas Jefferson, Mohammad Reza Pahlavi, and David Ben-Gurion.",
      "The achievements of Cyrus the Great throughout antiquity are reflected in the way he is remembered today. His own nation, the Iranians, have regarded him as \"The Father\", the very title that had been used during the time of Cyrus himself, by the many nations that he conquered, as according to Xenophon: Cyrus's standard, described as a golden eagle mounted upon a \"lofty shaft\", remained the official banner of the Achaemenids.",
      "And those who were subject to him, he treated with esteem and regard, as if they were his own children, while his subjects themselves respected Cyrus as their \"Father\" ... What other man but 'Cyrus', after having overturned an empire, ever died with the title of \"The Father\" from the people whom he had brought under his power? For it is plain fact that this is a name for one that bestows, rather than for one that takes away!",
    ] },
]

[articles.fr]
text = "Cyrus II (vieux perse : Kūruš), dit Cyrus le Grand, est un roi perse, régnant d'environ 559 à 530 av. J.-C."
title = "Cyrus le Grand"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Cyrus_le_Grand"
intro = [
  "Cyrus II (vieux perse : Kūruš), dit Cyrus le Grand, est un roi perse, régnant d'environ 559 à 530 av. J.-C. Il est le fondateur de l'Empire perse achéménide.",
  "Son règne est marqué par des conquêtes d'une ampleur sans précédent : après avoir soumis les Mèdes, il a placé sous sa domination le royaume de Lydie et les cités grecques d'Ionie, puis l'Empire néo-babylonien (comprenant alors la Mésopotamie, la Syrie, les cités phéniciennes et la Judée). Il trouva la mort au cours d'une campagne militaire contre les Massagètes. Son règne marque un tournant dans l'histoire du monde antique, puisqu'il signe la fin de l'ère des grands royaumes mésopotamiens et une nouvelle étape dans la construction d'empires multinationaux, son empire lui survivant deux siècles.",
  "Cyrus est rapidement devenu une figure majeure dans le monde antique. Les Grecs le connaissent comme un grand conquérant et un modèle de roi sage, magnanime envers les vaincus. La Bible hébraïque l'a également érigé en modèle, lui attribuant la décision de laisser les Juifs retourner en Judée pour reconstruire le temple de Jérusalem. De ce fait, son souvenir s'est préservé par ces deux canaux dans la tradition européenne. En Iran, il est considéré comme une figure fondatrice de premier ordre dans l'histoire nationale.",
]
sections = [
  { "title" = "Origines", "paragraphs" = [
      "Le contexte politique et culturel dans lequel naît Cyrus reste mal connu. Le sud-ouest iranien est en plein bouleversement à la fin du VIIe siècle av. J.-C. et au début du VIe siècle av. J.-C. Selon ce que rapporte le cylindre de Cyrus, il descend de la lignée des rois d'Anshan (ou Anzan), mot qui désigne un pays et une ville situés dans le Fars (l'actuel site de Tell e-Malyan) à une cinquantaine de kilomètres au nord-ouest de Persépolis. Selon Hérodote, Cyrus est né dans une famille du clan Achéménide, lui-même partie de la tribu perse des Pasargades, dont il serait la lignée la plus éminente. L'archéologie indique que les élites du Fars de cette période sont dans un milieu culturel mixte, mêlant des éléments Iraniens, arrivés dans la région quelques siècles plus tôt, aux populations locales ayant un ancrage très ancien dans la région, les Élamites, et c'est de ce mélange que seraient nés les Perses amenés à constituer l'empire achéménide. La place de l'élément élamite dans les origines de l'empire a donc été réévaluée par la recherche récente. Anshan est d'ailleurs une ancienne capitale élamite, prospère au IIe millénaire av. J.-C. Les trouvailles archéologiques et artistiques, ainsi que des tablettes datées approximativement de cette période provenant de Suse, située plus loin vers l'ouest, confirment que le paysage culturel de la région à cette période est « élamo-perse », tout en étant marqué par l'influence de la Mésopotamie voisine, les Assyriens ayant conduit plusieurs expéditions à Suse et en pays élamite, et les Babyloniens ayant été à plusieurs reprises alliés de rois élamites contre ces mêmes Assyriens. La puissance de l'Élam ayant périclité sous les coups assyriens, le sud-ouest iranien s'est divisé en plusieurs royaumes, dirigés par des sortes de «…",
      "Selon Hérodote, la principale puissance au nord de la Perse est celle des Mèdes, un autre peuple d'origine iranienne établi dans la région de l'actuelle Hamadan. C'est effectivement là que les sources mésopotamiennes et archéologiques situent diverses entités politiques, unifiées quand les Mèdes sont avec les Babyloniens les vainqueurs de l'empire assyrien. En revanche, elles ne confirment pas l'image d'un empire puissant et structuré évoquée par Hérodote.",
      "Concernant la naissance de Cyrus, les auteurs grecs lui donnent bien pour père Cambyse, et pour mère Mandane, fille du roi mède Astyage. Les récits de sa naissance et de son enfance, rapportés principalement par Hérodote (voir plus bas), relèvent de la légende et ne sont pas jugés fiables pour reconstituer l'histoire des origines de Cyrus. Selon P. Briant, « les différentes versions (de l'histoire) se sont construites sur une trame moyen-orientale très ancienne, bricolée au gré de l'inspiration des conteurs populaires et des objectifs de la propagande politique. » De plus ces récits n'accordent pas d'importance à la situation des Perses avant la naissance de ce roi, le présentant comme un fondateur.",
    ] },
  { "title" = "Constitution de l'Empire perse", "paragraphs" = [
      "Le premier fait militaire connu du règne de Cyrus est sa victoire contre les Mèdes dirigés par le roi Astyage, documentée par des sources babyloniennes, le Songe de Nabonide et la Chronique de Nabonide, et par Hérodote. Elle se déroule autour de 550 av. J.-C.. Les sources babyloniennes et grecques ne s'accordent pas sur la responsabilité du conflit. Si Hérodote présente la marche contre Ecbatane du fait de Cyrus, la Chronique de Nabonide indique qu'Astyage « mobilise son armée et marche contre Cyrus, roi d'Anshan, en vue de la conquête ».",
      "Selon le récit d'Hérodote, Astyage aurait placé Harpage à la tête de l'armée mède de manière très imprudente : ce dernier n'aspirant qu'à se venger de ce souverain qui lui avait fait dévorer son propre fils, exhorte l'armée à se retourner contre Astyage lors de la première bataille, qui voit une victoire des armées perses. Mais contrairement à ce que prétend Hérodote (I, 130), cette bataille ne suffit pas à emporter sa décision. Selon Ctésias (cité par Diodore, IX, 23), Astyage renvoie alors ses officiers, en nomme de nouveaux et prend lui-même en main la conduite de la guerre. Nicolas de Damas et Polyen (VII, 6-9) évoquent des combats violents en Perse et en particulier près de Pasargades. Cyrus finit par retourner la situation et remporte la victoire. Il se lance alors dans la conquête de la Médie, et Ecbatane finit par tomber. Il reçoit ensuite les hommages des peuples soumis aux Mèdes, notamment les Bactriens.",
      "Les sources babyloniennes font de Cyrus un instrument de la volonté des dieux de Babylone, Marduk et Sîn : le roi babylonien Nabonide se voit ordonner par le premier de reconstruire le temple du second à Harran, mais il ne peut pas tant que les Mèdes occupent la région. Marduk suscite alors contre le roi mède son vassal Cyrus. Selon le Songe de Nabonide, une inscription figurant sur un cylindre de ce roi mis au jour à Sippar : « Cyrus, le roi d'Anshan, son second en rang, dispersa les nombreuses hordes mèdes avec sa petite armée. Il captura Astyage, le roi des Mèdes, et l'emporta captif dans son pays. (Tels furent) les mots du grand seigneur Marduk, et de Sîn, la lumière du Ciel et du Monde souterrain, dont les commandements ne peuvent être changés. » Cela pourrait indiquer que Nabonide a soutenu Cyrus contre Astyage. Selon la Chronique de Nabonide, rédigée après la conquête de Babylone par Cyrus, Astyage est capturé par ses propres troupes et livré au Perse.",
    ] },
  { "title" = "Pasargades", "paragraphs" = [
      "À la suite de ses conquêtes, Cyrus avait mis la main sur les résidences royales des vaincus, ce qui lui permettait de disposer de palais à Ecbatane, Bactres, Sardes, Suse et Babylone. Pour ce qui concerne le pays perse, comme vu précédemment rien n'indique que les premiers rois perses aient fait des constructions à Anshan et donc qu'ils y aient résidé. Donc, après avoir résidé on ne sait où au début de son règne lorsqu'il était en Perse, Cyrus fait construire une résidence royale à Pasargades (vieux perse Batrakataš), dans l'actuel Fars, une quarantaine de kilomètres au nord-est de Persépolis. Selon ce que rapporte bien plus tard Strabon, ce choix est dû au fait que c'est là qu'il a vaincu les Mèdes et donc posé les premiers jalons de son empire. La date de la décision de construction du site est débattue : l'archéologue allemand Ernst Herzfeld a pu proposer une datation haute dès les années 559-550 (donc avant même la victoire sur les Mèdes), mais l'aspect ionien de certains édifices plaide plutôt pour un début des travaux après la conquête de la Lydie et de l'Asie mineure, donc après 546. Pour David Stronach, qui a fouillé le site au début des années 1960, le gros des constructions se déroule entre 546 et la mort de Cyrus en 530. Il est probable que les travaux aient continué par la suite, jusqu'au début du règne de Darius Ier, qui est sans doute à l'origine des inscriptions en vieux perse cunéiforme au nom de Cyrus qui se retrouvent sur plusieurs monuments du site, car c'est sous son règne à lui qu'est mise au point cette écriture.",
      "Ce vaste site comprend plusieurs monuments. Le groupe central comprend plusieurs portes monumentales et palais (Palais P et S) organisés autour de jardins, qui en font les archétypes des constructions palatiales achéménides, dont les exemples les plus illustres sont construits par la suite à Persépolis et Suse ; une tour (Zendan-i Sulaiman) pourrait servir de lieu de cérémonies de couronnement. Le tombeau de Cyrus est isolé, environ 700 mètres au sud-ouest. Des constructions manifestement postérieures au règne de Cyrus se trouvent au nord-est (Tall-i Takht) et un kilomètre au nord-ouest (« enceinte sacrée »). Les 300 hectares que couvrait le site n'ont pas tous été bâtis dans l'Antiquité, mais certaines constructions monumentales restent à dégager. Il ne faut pas envisager une ville très peuplée, même si elle ne peut être réduite à une capitale-campement comme cela a pu être proposé. Après la mort de Cyrus le site reste occupé et utilisé par le pouvoir malgré la construction des nouvelles deux capitales, puisqu'on sait par des tablettes de Suse qu'on y trouve un trésor, et que le tombeau de Cyrus et la tour servent sans doute lors de cérémonies officielles.",
    ] },
  { "title" = "Cyrus et les Judéens", "paragraphs" = [
      "Dans la Bible, le Livre d'Esdras (1:1-4, décret en hébreu ; 3:6) indique que YHWH, le Dieu unique des Judéens, inspire à Cyrus un décret proclamant l'autorisation de reconstruire le Temple de Jérusalem, en utilisant les trésors qui avait été dérobés par Nabuchodonosor II lors de la destruction du sanctuaire. Un autre décret du même Cyrus (cette fois-ci en araméen, la langue officielle de la chancellerie perse), redécouvert au temps de son successeur Darius Ier est de la même teneur (6:2-12).",
      "Sans forcément remettre en question l'existence d'un tel décret, des doutes ont été soulevés quant à l'authenticité de ceux qui sont reproduits dans la Bible. Si certains les prennent pour véridiques, la majorité des spécialistes les considèrent comme des faux. Ainsi L. Grabbe a relevé plusieurs points problématiques. D'abord, les proclamations sont en accord avec la théologie judéenne, il évoque « Israël » alors que les documents authentiques émis par le pouvoir perse parlent de « Juïfs » et de « Juda ». Ensuite, la langue araméenne employée dans plusieurs des textes et leur formulaire présentent des traits qui plaident en faveur d'une rédaction postérieure à la période perse. Du reste, il n'est pas dans les habitudes du pouvoir perse de soutenir les cultes locaux, a fortiori pour des sommes aussi importantes que celles évoquées dans la Bible, et il juge peu probable que Cyrus se soit occupé personnellement de cette affaire concernant en fin de compte une petite communauté. De ce fait, selon lui il faut envisager la possibilité que certains de ces documents soient des faux (notamment le décret de Cyrus en hébreu qui présente le plus d'incohérences), même s'il préfère envisager qu'il s'agisse de réécritures postérieures à partir d'originaux effectivement émis par l'administration perse, dont le sens originel a pu être modifié. Et du reste s'il y a bien eu des retours d'exilés en Judée par la suite, il est généralement estimé que cela n'a concerné qu'un nombre limité de personnes, contrairement à l'image d'un retour massif qui se trouve dans la Bible.",
      "En tout cas il n'y a pas lieu de surinterpréter le choix de permettre le retour à Juda des Judéens exilés en Babylonie en le considérant comme une faveur exceptionnelle, au contraire il est courant à cette période qu'un conquérant autorise le retour de personnes et de divinités déportées par un de ses prédécesseurs, a fortiori si celui-ci est un roi d'un pays qu'il a vaincu. Ainsi la Chronique de Nabonide comme le cylindre de Cyrus indiquent que ce roi permet après sa conquête de Babylone à divers temples mésopotamiens de reprendre leur culte, ce qui se fait notamment grâce à la restitution de leurs statues divines qui avaient été capturées auparavant par les Babyloniens. C'est par exemple le cas d'Assur, ancienne capitale et ville sainte assyrienne, où le culte du grand dieu local (également appelé Assur) semble restauré vers la même période.",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "Cyrus est un roi qui a inspiré beaucoup de discours positifs à son égard, dès son vivant et peu après sa mort, et cette image a été reprise par la suite.",
      "Le clergé babylonien semble avoir bien accueilli la prise de pouvoir de Cyrus. Il a en tout cas créé une littérature de propagande légitimant le renversement de Nabonide, présenté comme l'archétype du mauvais roi, et faisant en contraste de Cyrus l'élu du grand dieu babylonien Marduk. Cela se retrouve avant tout dans deux textes cunéiformes mis au point en Babylonie, le Cylindre de Cyrus et le Pamphlet contre Nabonide.",
      "Depuis les récits d'Hérodote, la figure de Cyrus a fasciné plusieurs auteurs grecs qui ont retenu l'image du conquérant mais aussi celle d'un souverain magnanime et juste. La Cyropédie de Xénophon le présente comme un souverain modèle à l'éducation parfaite, qui croise d'autres personnages remarquables tels que les amants maudits Abradate et Panthée. Platon dans ses Lois (3-694DA-D) témoigne également d'une admiration envers le roi perse. Lorsqu'Alexandre le Grand se rend à Pasargades en 330 et 324, il témoigne de son respect au tombeau de Cyrus.",
    ] },
]

[articles.de]
text = "Kyros II. (altpersisch Kūruš, neupersisch کوروش بزرگ Kurosch-e bozorg, ‚Kurosch der Große‘, babylonisch Kuraš, elamisch Kuraš, aramäisch Kureš, hebräisch כורש Koreš, altgriechisch Κῦρος Kŷros, lateinisch Cyrus; * um 590 bis 580 v."
title = "Kyros II."
lang = "de"
url = "https://de.wikipedia.org/wiki/Kyros_II."
intro = [
  "Kyros II. (altpersisch Kūruš, neupersisch کوروش بزرگ Kurosch-e bozorg, ‚Kurosch der Große‘, babylonisch Kuraš, elamisch Kuraš, aramäisch Kureš, hebräisch כורש Koreš, altgriechisch Κῦρος Kŷros, lateinisch Cyrus; * um 590 bis 580 v. Chr.; † August 530 v. Chr.), oft auch Kyros der Große genannt, Sohn des Kambyses I., regierte Persien von etwa 559 bis 530 v. Chr. als sechster König der Achämeniden-Dynastie und ernannte seinen ältesten Sohn Kambyses II. zum Nachfolger.",
  "Kyros weitete durch seine Expansionspolitik die Grenzen des ehemals kleinen altpersischen Reichs deutlich aus, das unter seinen Nachfolgern von Indien über Iran, Babylon, Kleinasien bis Ägypten reichte und bis 330 v. Chr. bestand, ehe es von Alexander dem Großen erobert wurde.",
  "Archäologische Kampagnen und inzwischen verbesserte Übertragungen einer Reihe von Keilschrifttexten führten zu neuen Erkenntnissen, die das bisherige Bild des historischen Kyros verfeinern konnten. Schon bald nach seinem Tod wurde der Perserkönig von seinem Volk als idealer König legendenhaft verklärt. Die Griechen übernahmen diese positive Sichtweise. Sie wurde durch seine Darstellung in der Bibel als religiös toleranter Regent verstärkt und beherrscht bis heute seine Beurteilung. Seine Person gilt heute noch als das Vorzeigebild eines Königs und Herrschers.",
]
sections = [
  { "title" = "Historische Quellen", "paragraphs" = [
      "Die erhaltenen Berichte der antiken Historiker gehen insbesondere über die Herkunft und frühen Jahre des Kyros wegen der schon sehr früh aufgekommenen, widersprüchlichen Legenden weit auseinander. Die höchste Glaubwürdigkeit schreibt man den zeitgenössischen Keilschrifttexten zu, anhand derer Wissenschaftler die Aussagen der griechischen Historiker teilweise überprüfen können.",
      "Kyros II. ist der erste Herrscher des Achämenidenreichs, der durch Inschriften und Baudenkmäler als Herrscherpersönlichkeit greifbar ist. Als Primärquellen für Kyros II. gelten archäologische Zeugnisse und drei Inschriften, die von Kyros II. selbst verfasst oder in seinem Auftrag angefertigt wurden. Die Inschriften sind in neu-babylonischer Keilschrift abgefasst. Der Kyros-Zylinder wurde in Babylon gefunden; eine Inschrift stammt von Uruk (Kyros A) und die dritte von Ur (Kyros B). Ob die drei Inschriften aus Pasargadae, CMa, CMb, CMc und drei weitere Fragmente (Zendan-Inschrift und CM-Fragmente) Kyros II. zugewiesen werden können, konnte noch nicht eindeutig beantwortet werden. Bedeutend ist ferner die sogenannte Nabonid-Chronik, benannt nach dem von Kyros besiegten Nabonid, die in ihrem lesbaren Teil über die letzten Jahre des selbstständigen Babylonien und seine Eroberung durch Kyros berichtet.",
      "Von den antiken griechischen Autoren ist Herodot rund einhundert Jahre nach Kyros der Historiker, der die früheste Darstellung überliefert, die auch vollständig erhalten ist. Deshalb ist er die griechische Hauptquelle über das Leben des Kyros. Schon er kannte verschiedene Legenden über den Perserkönig, so zum Beispiel sowohl über seine Jugendjahre als auch seine Todesumstände. Deshalb wählte er unter den ihm vorliegenden Fassungen die ihm „am wahrscheinlichsten“ erscheinende Variante aus.",
    ] },
  { "title" = "Name", "paragraphs" = [
      "Die Herkunft und Deutung des Namens ist nach wie vor umstritten. Wouter F. M. Henkelman postuliert eine elamische Herkunft und übersetzt ihn mit „verliehene Sorgfalt“, „beschützt“ oder auch „Vermittler des Glücks“. Sprachwissenschaftler wie beispielsweise Karl Hoffmann und Rüdiger Schmitt übersetzen den Namen mit „Gnädiger Herrscher über die Feinde/Herrscher mit dem gnädigen Urteil über die Feinde“. Eine Ableitung aus der vedischen Sprache unter Verwendung von „Ku, ru-“ auf „junger Mann oder Kind“ wird ebenfalls erwogen.",
      "Die antiken Historiker Ktesias von Knidos und Plutarch übersetzten den Namen Kyros mit „Sonne“ (Kur-u). Zusätzlich erfolgte der Versuch, eine Erweiterung auf „wie die Sonne“ vorzunehmen, da ein Bezug zur indoeuropäischen Wortwurzel „khor“ und dem Suffix „-vash“ hergestellt wurde. Diese Übersetzung wird aber zwischenzeitlich von der modernen Forschung abgelehnt.",
    ] },
  { "title" = "Herkunft", "paragraphs" = [
      "Herodots Angaben zur Abstammungslinie des Kyros werden durch die inschriftlichen Ausführungen des Kyros-Zylinders väterlicherseits bestätigt. Demnach war der Perserkönig ein Sohn des Kambyses I. und Enkel des Kyros I. Die Mutter von Kyros war laut Herodot Mandane, die Tochter des Astyages, unter dessen Oberherrschaft Kyros’ Vater Kambyses I. als „König von Anschan“ (wie sich und seine Vorfahren in den 30er Jahren des 6. Jahrhunderts v. Chr. Kyros der Große nannte). Astyages war zu diesem Zeitpunkt als maßgeblicher Heerführer mit dem medischen Herrschertitel versehen. Ktesias bestritt die Ausführungen Herodots und nannte eine andere Genealogie der Eltern des Perserkönigs, der demnach kein Königssohn, sondern der Sohn eines Räubers und einer Ziegenhirtin gewesen sei. Herodots Bericht erzählt, dass Astyages, durch einen Traum gewarnt, eine Gefahr im kleinen Kyros erkannte und ihn deshalb töten lassen wollte, der Säugling jedoch stattdessen ohne Wissen des Herrschers von einem im fernen Gebirge wohnenden Hirten, dessen Frau ein totes Kind gebar, das heimlich gegen Kyros ausgetauscht worden sein soll, großgezogen und so errettet wurde. All diese Versionen verbinden volkstümliche Themen mit uralten mesopotamischen Überlieferungen wie zum Beispiel mit derjenigen von Sargon von Akkad. Dabei variieren sie je nach Inspiration der Volkserzähler und politischen Zielen. Ihnen gemeinsam ist die Ansiedelung der Ursprünge von Kyros II. im Kontext der Beziehungen zwischen den mächtigen Medern und ihren persischen Vasallen.",
      "Der Zylinder-Inschrift, der Nabonid-Chronik und einem weiteren Keilschrifttext kann entnommen werden, dass Kyros um 559 v. Chr. als regionales Mitglied der medischen Konföderation seinem Vater Kambyses I. als König von Anschan folgte.",
      "Die Genealogie von Kyros II. und sein verwandtschaftliches Verhältnis zu Dareios I. werden bis heute diskutiert. Sie konzentriert sich auf die drei Inschriften aus Pasargadae, in denen Kyros II. als Achämenide bezeichnet wird. Die zeitliche Festlegung und die Zuweisung an den Auftraggeber der Inschriften spielen dabei die zentrale Rolle. Die Inschrift CMa wurde in der Empfangshalle (Palast S) und am Tor R gefunden, die zum ältesten Teil der Palastanlage von Pasargadae gehören. Bei der Inschrift CMc stehen die von den Griechen erfundenen Stilmerkmale in der dargestellten Kleidung der Königsfigur im Mittelpunkt, deren zeitliche Festlegung eine eindeutige Zuweisung ermöglichen könnten. Bei der dritten Inschrift, CMb, hofft man immer noch, bei zukünftigen Grabungen in Pasargadae Fragmente zu finden, um den Text wieder ganz herstellen zu können. Durch den Fundort im Palast P, der erst nach dem Tod von Kyros II. fertig gestellt wurde, und einem Fragment mit einem Teil des Namens von Dareios I. könnte diese Inschrift noch am ehesten Dareios I. zugewiesen werden. Aber da der Text unsicher ist, ist auch hier der Auftraggeber der Inschrift offen. Ebenso ungewiss ist der Ausgang der wissenschaftlichen Diskussion, ob Kyros II. als Teispide oder als Achämenide bezeichnet werden kann.",
    ] },
  { "title" = "Sturz des Astyages", "paragraphs" = [
      "Die Auseinandersetzungen zwischen Kyros und Astyages werden in zwei Keilschrifttexten beschrieben. Babylon kannte weder die Bezeichnung Medien noch den Königsnamen Astyages und verwendete, wie auch zum Beispiel im Sippar-Zylinder, die babylonischen Begriffe „König Ištumegu aus Umman-Manda“ („Irgendwo-da-Land“). Der Gott Marduk erzählte Nabonid in einem Traum, dass Ištumegu von dem militärisch viel schwächeren Kyros geschlagen, gefangen und in sein Königreich Anschan verschleppt wurde. Der Text über den Krieg gegen Astyages in der Nabonid-Chronik ist infolge Beschädigung schwer lesbar, doch konnten folgende ergänzenden Nachrichten übersetzt werden: Das medische Heer rebellierte gegen Astyages und lieferte ihn an Kyros aus, der daraufhin in die Mederhauptstadt Agamtanu (Ekbatana) einzog und die Reichtümer der Stadt nach Anschan schaffen ließ. Dazu passt einigermaßen der Bericht des Herodot, dass ein Höfling namens Harpagos, der einst Astyages’ Befehl der Tötung des kleinen Kyros nicht ausgeführt haben und dafür mit der Ermordung seines eigenen Sohnes bestraft worden sein soll, zu Kyros überging, so dass der Mederkönig seine Armee persönlich in die nächste Schlacht führte, aber unterlag und gefangen genommen wurde. Die Darstellung Herodots dürfte richtigerweise bestätigen, dass Kyros einen mächtigen Helfer in Astyages’ Militärstab hatte. Ob dieser aber Harpagos hieß, muss offenbleiben.",
      "Der Sturz des Astyages fand nach Angaben der Nabonid-Chronik 550 v. Chr. in Nabonids sechstem Regierungsjahr statt. In den Inschriften des Sippar-Zylinders wird in Nabonids drittem Regierungsjahr das „Erwachen des Kyros“ geschildert, der mit einem Heer gegen Astyages zog. Der scheinbar zeitliche Widerspruch zeigt, dass der Mederfeldzug des Kyros nachträglich vermerkt und in das dritte Regierungsjahr des Babylonierkönigs verlegt wurde, um eine zeitliche Überschneidung mit dem Tayma-Aufenthalt zu vermeiden, der im sonstigen Bericht des Sippar-Zylinders keine besondere Erwähnung findet.",
      "Den Hintergrund zeigt die Tendenzschrift des Kyrosorakels, das als nachträgliche Prophezeiung (vaticinium ex eventu) erst später erstellt wurde. Nabonid äußerte Besorgnis über die Belagerung Harrans durch die Meder, welche damit einen sofortigen Wiederaufbau des Tempels Ehulhul 555 v. Chr. unmöglich machten. Der Mondgott Sin prophezeite dem Babylonierkönig als Antwort, „dass die Meder, ihr Land und ihre Könige sowie alle Verbündeten bald durch die Hand eines anderen Königs vernichtet werden“. Das Jahr der Verheißung verlegte Nabonid auf 553 v. Chr. in sein drittes Regierungsjahr, um einen rechtzeitigen Baubeginn vorzutäuschen. Die dem Babylonierkönig feindlich gesinnte Marduk-Priesterschaft hatte in ihren Schmähschriften den „Zorn Sins“ als Grund genannt, der zur „göttlichen Ausweisung Nabonids nach Tayma“ führte, mit der Sin das Versagen des Babylonierkönigs hinsichtlich der heiligen Pflichten bestrafen wollte.",
    ] },
]

[articles.it]
text = "Ciro II di Persia, noto come Ciro il Grande (in persiano antico Kūruš, AFI: [ˈkuːruʃ]; Anshan, 590 a.C. – Iassarte, 530 a.C.), è stato imperatore persiano e discendente di Ciro I di Persia, membro di quella stirpe dei Teispidi che da qualche tempo controllava la Perside."
title = "Ciro II di Persia"
lang = "it"
url = "https://it.wikipedia.org/wiki/Ciro_II_di_Persia"
intro = [
  "Ciro II di Persia, noto come Ciro il Grande (in persiano antico Kūruš, AFI: [ˈkuːruʃ]; Anshan, 590 a.C. – Iassarte, 530 a.C.), è stato imperatore persiano e discendente di Ciro I di Persia, membro di quella stirpe dei Teispidi che da qualche tempo controllava la Perside.",
  "Noto come il fondatore dell'impero persiano, Ciro succedette a suo padre Cambise I, liberò i Persiani dal dominio dei Medi con una guerra e fu l'erede naturale delle grandi monarchie mediorientali. Non è però del tutto certa la sua discendenza da Achemene: Dario, secondo Winckler, imparentato con Ciro il Grande, durante il suo regno avrebbe comandato di falsificare tutte le iscrizioni di Pasargade per sancire il suo legame con il capostipite della dinastia achemenide.",
  "Ciro II unificò sotto il suo regno le varie tribù iraniche, quindi conquistò Babilonia nel 539 a.C. senza combattere, ma con un'abile politica di propaganda; approfittò della particolare strategia politica del sovrano babilonese Nabonedo che al culto del dio Marduk preferì quello del dio lunare Sin (cosa mal vista dal popolo). Ciro II pensò di proclamarsi figlio di Marduk, così fece cacciare dal popolo il sovrano mesopotamico e fu accolto come salvatore. Nel 538 a.C. emise anche un editto che consentiva agli Ebrei deportati a Babilonia non solo di fare ritorno in patria, ma di ricostruire il tempio di Gerusalemme. Per questo motivo, è l'unico re non ebreo descritto come \"messia\" (משיח) dalla Bibbia.",
  "Conquistò anche alcune regioni ai confini nordorientali della Persia, si assicurò il controllo della Siria e dell'area fenicio-palestinese estendendo i confini del suo regno, che mantenne integro attraverso una politica avveduta, fondata nel conferire libertà ai popoli sottomessi e nel rispetto delle loro usanze. Morì nel 530 a.C. combattendo contro i massageti guidati dalla regina Tomiri e fu sepolto nella sua ormai celebre tomba a Pasargade (non lontano da Persepoli); il suo successore fu il figlio Cambise II.",
]
sections = [
  { "title" = "La giovinezza", "paragraphs" = [
      "Sua madre fu Mandane, figlia di Astiage, il quale avrebbe poi tentato di uccidere Ciro stesso in quanto informato da una visione che suo nipote gli avrebbe usurpato il trono. Affidato Astiage questo incarico al fidato Arpago, questi non volle incaricarsene e lo delegò con l'inganno al bovaro Metradate, che, informato dell'identità del neonato, si rifiutò di ucciderlo, portandolo prima a casa propria e sostituendolo con il figlio morto partorito poco prima da sua moglie. Ciò fatto, Arpago mandò delle guardie affinché verificassero l'infanticidio fosse stato portato a termine, mentre Ciro fu allevato da Metradate. Dato che a causa di un gioco Ciro, nominato capo dei giovani del villaggio, si era messo in contrasto con il figlio di Artembare, dignitario persiano, venne condotto di fronte al re Astiage, che però osservò delle somiglianze tra la propria fisionomia e quella del fanciullo. Astiage, comprendendo che l'omicidio di suo nipote non era stato compiuto per via del racconto di Metradate, convocò Arpago, ma affermò che non avrebbe ucciso il ragazzo. Subito dopo, si fece mandare il figlio di Arpago, lo uccise e ne fece mangiare di nascosto le carni al padre durante un banchetto: solo mani, testa e piedi furono sepolti. Considerato che formalmente Ciro era già stato re, Astiage, mal consigliato dai Magi inviò Ciro dai suoi genitori naturali, immaginando non costituisse più per lui un potenziale pericolo: dato che la moglie del pastore si chiamava Kyno i genitori di Ciro sparsero la voce che loro figlio, abbandonato, fosse stato allevato da una cagna.",
    ] },
  { "title" = "I primi anni di regno", "paragraphs" = [
      "Nel 559, alla morte di Cambise I, Ciro diventò Gran Re, nonostante fosse ancora un vassallo dei Medi. Ciro era re di Anšan, ove si conservavano le antiche tradizioni militari che i Medi andavano perdendo. Appena salito al trono, Ciro cercò di rafforzare il potere della sua famiglia sulle altre tribù persiane e per fare ciò si appoggiò al nuovo re di Babilonia, Nabonedo, che aveva intenzione di espandere a est il suo impero e abbattere i Medi. Con il passare del tempo, Nabonedo riuscì ad alimentare la rivolta di Ciro contro i Medi. Infatti ora che la lotta fra le tribù persiane si era quasi spenta, Ciro proiettava la sua ombra sui Medi di Astiage, che non potevano più contare su un esercito forte. In più tutte le popolazioni locali non erano solidamente legate al re dei re di Media, che aveva grandi difficoltà a governare l'impero. Astiage, figlio di Ciassare non godeva del carisma paterno e neppure della sua visione diplomatica. Il vecchio re dei Medi, infatti, era stato promotore, da quanto si legge nel testo di Erodoto, di un sistema di \"bilanciamento di poteri\" ante litteram tra le potenze regionali, allo scopo di mantenere lo status quo e impedire la rinascita di una potenza egemone quale l'Assiria che era stata appena abbattuta (614 a.C. - 609 a.C.). Tale politica assegnava, in pratica, delle \"aree d'influenza\" alle seguenti potenze: Media (espansione verso l'India e il Pamir), l'Egitto (espansione verso la Nubia e la Libia), Babilonia (espansione verso l'Arabia), Sparta (espansione verso la Grecia e i Balcani), la Lidia (espansione verso il Caucaso e la Crimea). Ciro, appoggiandosi ora a una, ora all'altra potenza regionale, riuscì a sottometterle tutte, una alla volta.",
      "La ribellione tanto sobillata da Nabonedo alla fine avvenne. La fonte storica principale è il testo in accadico di Sippar, noto come \"cronaca di Nabonide\". Mentre Nabonedo invadeva i territori dei Medi che i Babilonesi reclamavano da tempo, in Siria e nel Kurdistan (regione settentrionale dell'odierno Iraq, comprendente la regione storica dell'Assiria), Ciro, salito al trono persiano nel 559 a.C., maltollerando la sudditanza al regno dei Medi, insorse nel luglio del 553 a.C. mentre il grosso dell'esercito dei Medi - stando alle fonti babilonesi elencate nel cilindro di Abū Ḥabbah di Nabonide stavano assediando la città babilonese di Harran. Astiage, forse sottovalutando il pericolo rappresentato da Ciro, marciò a tappe forzate verso Susa, capitale dell'Elam con una minima parte dell'esercito, avendo lasciato il grosso delle truppe ad affrontare i babilonesi. Ciro si scontrò con i Medi sei mesi dopo l'insurrezione, quindi a gennaio del 552 a.C. vincendo presso la città di Hyrba, una località tuttora sconosciuta al confine tra Media e Ansan, nell'attuale regione del Kuzistan iraniano, forse nei pressi di Nehavend o forse Javarsian (in quest'area, tra l'altro, si combatté anche la decisiva battaglia che vedrà gli Arabi sottomettere i Sasanidi nel 642 d.C.). La Battaglia di Hyrba fu la prima di tre vittorie che Ciro riportò sui Medi e fu decisa dal fatto che le truppe persiane erano superiori di numero rispetto alle truppe dei Medi. Il secondo scontro avvenne alla \"Collina di Pasargade\", nella primavera del 552 a.C. e fu una nuova sconfitta per i Medi, nonostante questa volta fossero in superiorità numerica. Anche la Battaglia della Collina di Pasargade fu una sconfitta decisiva per i Medi. La località dello scontro non è stata finora identificata, sebbene i testi accadici…",
    ] },
  { "title" = "Le conquiste di Ciro", "paragraphs" = [
      "Con la conquista della Media, Ciro assumeva il titolo di \"re dei re\" e poteva avanzare rivendicazioni territoriali in tutto il Medio Oriente. Voltate così le spalle a Nabonedo, Ciro si rese conto che per la sopravvivenza economica dell'Impero Persiano era necessario il possesso di terre quali la Mesopotamia, la Siria, la Cappadocia, nonché un accesso al mare.",
      "Dopo che Ciro sottomise i Medi nella primavera del 550 a.C., il re della Lidia, Creso, imparentato con il deposto re dei Medi, propugnò una campagna comune contro Ciro da parte delle nazioni dell'alleanza creata in precedenza dal re medo Ciassare.",
      "Ciro, ben conscio di non potere vincere contemporaneamente contro tutti gli avversari, promise all'Egitto la restituzione della terra di Israele e a Babilonia la restituzione dell'Assiria (attuale Iraq settentrionale). Ritiratisi Egitto e Babilonia dalla coalizione, rimaneva unicamente la Lidia cui si era unito un forte contingente spartano. Sparta aveva armato una flotta che non venne inviata solamente perché, nel frattempo, Ciro aveva preso la capitale dei Lidi, Sardi, come narra Erodoto, aggirandola tramite un sentiero nascosto nella vegetazione. Come risposta, Ciro penetrò in Alta Mesopotamia (l'Alta Mesopotamia era un territorio controllato dai Lidi, mentre la Bassa Mesopotamia era un territorio soggetto a Babilonia) e, approfittando dell'impossibilità di intervenire da parte dei Babilonesi, sottomise la Cilicia, la Cappadocia (che fu la prima regione del Regno di Lidia a essere invasa) e l'Armenia. Lo scontro con i Lidi avvenne nel settembre del 547 a.C., con la battaglia di Pteria, una roccaforte persiana sita presso il fiume Halys, confine naturale tra Media e Lidia. Lo scontro si risolse in uno stallo. In seguito al combattimento, Creso preferì ritirarsi e chiudersi a Sardi, capitale della Lidia, per raccogliere le forze. Il re dei re non diede tuttavia tregua al nemico: Ciro marciò su Sardi e la espugnò, dopo sedici giorni di assedio (ottobre 547 a.C.). Nella primavera del 546 tutte le roccaforti della Lidia e le città greche sul Mar Egeo capitolarono. Il re persiano fece della Lidia due satrapie (Sardis e Daskvilion) e Creso, dopo essere scampato alla pira fatta innalzare da Ciro grazie a una fortuita tempesta che fece spegnere il fuoco, divenne consigliere dello stesso Ciro e poi del figlio Cambise.",
    ] },
  { "title" = "Diritti umani", "paragraphs" = [
      "Ciro diede fine alla cattività babilonese e permise agli Ebrei di fare ritorno nella loro patria. Per la Bibbia (per esempio Isaia 45, 1-7) Ciro il Grande fu nientemeno che \"l'unto del Signore”, cioè il “consacrato”, secondo il quale è lui il prescelto dal Signore per compiere una missione quanto mai difficile e importante: liberare il popolo di Israele, permettendogli così di tornare in patria e di ricostruire il Tempio di Gerusalemme, distrutto nel 586 avanti Cristo, pochi anni dopo la nascita dell'imperatore persiano.",
      "Ciro è anche riconosciuto per i suoi successi in materia di diritti umani, politica e strategia militare, così come per la sua influenza sulle civiltà sia orientali che occidentali.",
      "Ciro ha svolto un ruolo cruciale nella definizione dell'identità nazionale dell'Iran moderno. Rimane una figura di culto tra gli iraniani e la sua tomba che funge da luogo di venerazione per milioni di persone.",
    ] },
]

[articles.zh]
text = "居鲁士二世（古波斯語：𐎤𐎢𐎽𐎢𐏁，羅馬化：Kūruš；古希臘語：Κύρος；英語：Cyrus II of Persia,Cyrus the Great語言代码 eng 已升格为代码 en；约前600年或前576年—前530年），史稱居鲁士大帝，《聖經》译古列，現代中文譯本改譯塞魯士，波斯帝国開國君主、阿契美尼德王朝首任王中之王（前559年—前529年在位），在其治下帝国不仅囊括了古代近东的所有文明国家，还包括了大部分西亚及部分中亚地区。他的帝国从西边的赫勒斯滂到东边的印度河，是空前龐大的帝国。他的称号的全称为「大帝、波斯国王、安善国王、米底国王、巴比伦国王、苏美尔和阿卡德国王，四方之王」。他还通过居魯士圓柱宣布了可能是历史上第一份重要的人权宣言（大约在公元前539年到530年之间）。 居鲁士大帝在位的时间大约在29到31年间。他首先征服了米底王国，然后是呂底亞王国，紧接着是新巴比倫王國。大约在征服巴比伦前后，他领导了一次到中亚的远征，在远征中摧枯拉朽，“毫无例外的征服了每一个国家”。居鲁士大帝没有机会進入埃及，因为他在公元前530年12月死在了沿锡尔河侵略马萨格泰人的战役中。他的儿子冈比西斯二世继承了王位，更在他短暂的统治期间征服了埃及、努比亚和昔兰尼加。"
title = "居鲁士二世"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E5%B1%85%E9%B2%81%E5%A3%AB%E4%BA%8C%E4%B8%96"
intro = [
  "居鲁士二世（古波斯語：𐎤𐎢𐎽𐎢𐏁，羅馬化：Kūruš；古希臘語：Κύρος；英語：Cyrus II of Persia,Cyrus the Great語言代码 eng 已升格为代码 en；约前600年或前576年—前530年），史稱居鲁士大帝，《聖經》译古列，現代中文譯本改譯塞魯士，波斯帝国開國君主、阿契美尼德王朝首任王中之王（前559年—前529年在位），在其治下帝国不仅囊括了古代近东的所有文明国家，还包括了大部分西亚及部分中亚地区。他的帝国从西边的赫勒斯滂到东边的印度河，是空前龐大的帝国。他的称号的全称为「大帝、波斯国王、安善国王、米底国王、巴比伦国王、苏美尔和阿卡德国王，四方之王」。他还通过居魯士圓柱宣布了可能是历史上第一份重要的人权宣言（大约在公元前539年到530年之间）。",
  "居鲁士大帝在位的时间大约在29到31年间。他首先征服了米底王国，然后是呂底亞王国，紧接着是新巴比倫王國。大约在征服巴比伦前后，他领导了一次到中亚的远征，在远征中摧枯拉朽，“毫无例外的征服了每一个国家”。居鲁士大帝没有机会進入埃及，因为他在公元前530年12月死在了沿锡尔河侵略马萨格泰人的战役中。他的儿子冈比西斯二世继承了王位，更在他短暂的统治期间征服了埃及、努比亚和昔兰尼加。",
]
sections = [
  { "title" = "生平", "paragraphs" = [
      "居鲁士二世為波斯部落领袖冈比西斯一世之子，其祖父为居鲁士一世。他们部族世代据有埃兰东部和帕尔萨（今法尔斯）之一部，其首领被称安善王。公元前558年领导波斯部落联盟，定都帕赛波里斯，当时波斯还只是米底（瑪代）王國的一个附庸。",
      "前546年征服吕底亚和小亚细亚的各希腊城邦。公元前545年至前539年，相继征服德兰吉亚那、马尔吉安那、花剌子模、粟特、巴克特利亚、阿里亚、格多路西亚、萨塔吉底亚、阿拉科西亚、犍陀罗等地；斯基泰人亦告臣服。",
      "居鲁士大帝締造亘古未有的大帝国，巴比伦也成为他的行宫之一，他接受尊号为「巴比伦之王，蘇美爾與阿卡德之王」（四方之王）。由於他採取十分寬容政策對待那些被他征服的國家，與之前的迦勒底王國的高壓統治正好形成對比，因此在波斯帝國統治期間，西亞都得以保持和平狀態，文化藝術得以興盛。希臘史家色诺芬为他写有一部《居鲁士传》。",
    ] },
  { "title" = "死亡", "paragraphs" = [
      "居魯士於前522年去世，其死亡有多種說法，一說是居鲁士出征中亚的游牧部落马萨革泰人，以計謀殺死其首領斯帕爾迦披西斯王子；不料其母托米麗絲在悲憤之餘，拒絕投降波斯，領軍繼續反抗以為其子報仇，把波斯軍隊殺得死傷慘重，甚至居魯士本人也在這一場戰爭中陣亡。马萨格泰女王找到居鲁士的尸体之後，割下他的头颅，放进盛满血的革囊。她以此实践自己的誓言，让居鲁士“饱饮鲜血”。",
    ] },
  { "title" = "聖經中的居魯士", "paragraphs" = [
      "《聖經》中提到，居鲁士二世（按照不同聖經翻譯版本中稱他為古列、塞魯士）下令修复巴比伦、亚述、埃兰以及犹太人的神庙，准许被历代巴比伦国王强行迁至美索不达米亚的人民重返各自的国家。「释放巴比伦囚虏」一事，這件事情卻是應驗了早就記在犹太人所擁有的《聖經》中的預言，在聖經以賽亞書中被稱為公義。由於《聖經》的緣故，居鲁士二世的形象在古代东西方的文学和历史著作中留下了不可磨灭的痕迹。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "Dandamaev, M. A. A political history of the Achaemenid empire. Leiden: Brill. 1989: 373. ISBN 90-04-09172-6.",
      "Schmitt, Rüdiger. Achaemenid dynasty. Encyclopaedia Iranica vol. 3. London: Routledge. 1983. （原始内容存档于2015-12-03）.",
    ] },
  { "title" = "延伸阅读", "paragraphs" = [
      "Amelie Kuhrt: Ancient Near Eastern History: The Case of Cyrus the Great of Persia. In: Hugh Godfrey Maturin Williamson: Understanding the History of Ancient Israel. Oxford University Press 2007, ISBN 978-0-19-726401-0, pp. 107–128",
      "Bickermann, Elias J. The Edict of Cyrus in Ezra 1. JournaI of Biblical Literature. September 1946, 65 (3): 249–275. doi:10.2307/3262665.",
      "Dougherty, Raymond Philip. Nabonidus and Belshazzar: A Study of the Closing Events of the Neo-Babylonian Empire. New Haven: Yale University Press. 1929.",
    ] },
  { "title" = "外部链接", "paragraphs" = [
      "Cyrus Cylinder （页面存档备份，存于互联网档案馆） Full Babylonian text of the Cyrus Cylinder as it was known in 2001; translation; brief introduction",
      "Xenophon, Cyropaedia: the education of Cyrus, translated by Henry Graham Dakyns and revised by F.M. Stawell, Project Gutenberg （页面存档备份，存于互联网档案馆）.",
    ] },
]

[articles.ja]
text = "キュロス2世（古代ペルシア語: 𐎤𐎢𐎽𐎢𐏁 Kūruš クールシュ、紀元前600/576年 - 紀元前529年）は、アケメネス朝ペルシア帝国の初代王（紀元前559年 - 紀元前529年）。エジプトを除く全ての古代オリエント諸国を滅ぼして空前の大帝国を建てた。現代のイランにおいてもキュロス大王をイランの建国者とする動きがある。"
title = "キュロス2世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%AD%E3%83%A5%E3%83%AD%E3%82%B92%E4%B8%96"
intro = [
  "キュロス2世（古代ペルシア語: 𐎤𐎢𐎽𐎢𐏁 Kūruš クールシュ、紀元前600/576年 - 紀元前529年）は、アケメネス朝ペルシア帝国の初代王（紀元前559年 - 紀元前529年）。エジプトを除く全ての古代オリエント諸国を滅ぼして空前の大帝国を建てた。現代のイランにおいてもキュロス大王をイランの建国者とする動きがある。",
]
sections = [
  { "title" = "名前", "paragraphs" = [
      "古代ペルシア語名はクールシュ（古代ペルシア語: 𐎤𐎢𐎽𐎢𐏁 Kūruš）、ペルシア語名はクーロシュ（ペルシア語: کوروش Kūroš）、古代ギリシア語名はキューロス（古代ギリシア語: Κῦρος Kûros）、ヘブライ語名はコレシュ（ヘブライ語: כורש Kóreš）。同名の王子小キュロスと区別して大キュロス、キュロス大王、同名のアンシャン王キュロス1世と区別してキュロス2世と呼ばれる。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "古代ギリシアの歴史家ヘロドトスの記録によれば、キュロスはアンシャン王（ペルシア王）である父カンビュセス1世と母マンダネ（メディア王アステュアゲスの娘）の間に、王子として生まれた。当時のアンシャンはメディアに従属する小王国にすぎなかった。アンシャンはエラムの故地でもあり、エラム語やエラムの諸制度を引き継いでいたものの、エラム自体は衰退して西部のスーサ周辺のみを領有するようになっていた。紀元前559年にキュロスは即位し、アンシャンの第7代王となった。",
      "紀元前552年にメディアに反乱を起こした（Persian Revolt、Battle of Hyrba）。紀元前550年にメディア王に恨みを抱いていたメディアの将軍ハルパゴスの裏切りもあり（Battle of the Persian Border）、メディアの首都エクバタナを攻略してメディア王アステュアゲスを打倒し、宗主国メディアを滅ぼした。この時をもって、統一王朝としてのアケメネス朝が始まったとされる。キュロスはエクバタナを制圧するとメディア領土全域の制圧に乗り出し、支配した。",
      "次に不死身の1万人（不死隊）と呼ばれた軍団を率いて小アジア西部のリュディアに攻め込んだ。紀元前547年秋のプテリアの戦いでは引き分けたが、同年10月のテュンブラの戦いではリュディア王クロイソスを破り、続いて首都サルディス攻囲戦でリュディアを征服した。ヘロドトスによればその時キュロスはクロイソスを火刑に処そうとしたが、クロイソスがアポッローンに嘆願すると突如雨が降って火を消したため、キュロスはクロイソスの命を助けた。その後、クロイソスはキュロスに参謀的な役割で仕えた。この後、さらにハルパゴスに命じてカリア、リュキア、イオニアのギリシア人ポリスといった小アジア西端のエーゲ海沿岸地方を恭順させた。紀元前546年にはペルシア（パールサ）地方に新首都パサルガダエの建設を始めた。",
    ] },
  { "title" = "統治", "paragraphs" = [
      "キュロスの帝国はその当時としては空前絶後の大きさのものであり、それまでの古代オリエントの4大国であったメディア・リュディア・新バビロニア・エジプトのうち、エジプトを除く3ヶ国を併呑したうえエラムやフェニキアといった独立勢力や東方の地域までを含むものであった。こうした広大で多様な地域を統治するため、キュロスは帝国を20の州に分け、各州ごとにサトラップ（太守）をおいて統治させた。このサトラップ制は、それまでメディア王国において用いられていた制度をそのまま利用したものである。キュロスは宗教に関しては寛容な姿勢を保ち、これはアケメネス朝の統治期を通じ守られた。ペルシア帝国の公用語の1つにアンシャン時代からのエラム語があり、これはその滅亡まで変わらなかった。",
    ] },
  { "title" = "後世の評価", "paragraphs" = [
      "ユダヤ人をバビロン捕囚から解放したことで、聖書や哲学者クセノポンの著作（『キュロスの教育』）において高く評価され、キュロスは理想的な君主として東西洋問わずイメージ付けされるようになった。近代に入ると、パフラヴィー朝の皇帝モハンマド・レザー・パフラヴィーはイラン人の民族意識を高揚させる政策を取り、キュロスはペルシア帝国の建国者として賞揚された。キュロスの円筒印章が「世界史上最古の人権宣言」としてさかんに喧伝された。1971年にはキュロスのアケメネス朝建国2500年を記念するという名目でペルセポリスで盛大なイラン建国2500年祭典を開催し、パサルガダエのキュロス大王陵にて皇帝の演説が行われた。またこの時にイラン暦の紀元がキュロス即位時（紀元前559年）に変更されてイラン皇帝暦と名を変え、ヒジュラ暦に代わって国家の公式な暦となった。なお、この暦が正式に施行されたのは翌1976年（皇帝暦2535年）であった。しかしわずか3年後の1979年にイラン革命が起こり、パフラヴィー朝帝政の崩壊に伴ってイラン皇帝暦も廃止された。",
      "近年ではイラン民族主義の高揚に伴い、キュロス大王の人気や知名度がイラン人の間で高まるようになり、キュロスが新バビロニア軍を撃ち破って古代オリエントを統一したイラン暦の8月7日（グレゴリオ暦10月29日）をイラン民族主義の記念日（キュロス大王の日）にしょうとする動きが盛んになっている。イスラーム神権政治を掲げるイラン当局はこうした動きを警戒している。",
    ] },
  { "title" = "考古資料", "paragraphs" = [
      "「パンチャタントラ」「アラビアンナイト」と並ぶ、西アジアまたはインド起源とされる枠物語『シンドバードの書』の中世ギリシア語訳。枠物語に登場する王の名がキューロスである。1080年に東ローマ帝国のアンドレオプロス（ギリシア語: Μιχᾱήλ Ανδρεόπουλος Mikhāḗl Andreopoulos）によってシリア語版からギリシア語に翻訳された。",
      "大英博物館にはキュロスの円筒印章が所蔵されている。これによれば、キュロスは、紀元前6世紀半ばにメディア、リュディア、新バビロニアを滅ぼし、メソポタミアを統一した。この円筒印章には諸民族を解放し、弾圧や圧政を廃し、寛容な支配を推し進めた様が描かれており、人類初の人権宣言とも称される。",
      "新バビロニアの最後の王であるナボニドゥスの治世を扱っている『ナボニドゥス年代誌』にはエラムの滅亡やバビロン占領後のキュロスの行動が記されている。この他、同時期のものであるナボニドゥスの円筒形碑文においてもキュロスの治世が賞賛された文が記載されており、キュロスの円筒印章を含むこの3つの史料はプロパガンダ的なものであると考えられている。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "Dandamaev, M. A. (1989). A political history of the Achaemenid empire. Leiden: Brill. p. 373. ISBN 90-04-09172-6",
    ] },
]

[articles.ru]
text = "Кир II Вели́кий (др.-перс. 𐎤𐎢𐎽𐎢𐏁 Ку́руш или Ку́раш) — персидский царь из династии Ахеменидов, правивший в 559—530 годах до н."
title = "Кир II Великий"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9A%D0%B8%D1%80_II_%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%B8%D0%B9"
intro = [
  "Кир II Вели́кий (др.-перс. 𐎤𐎢𐎽𐎢𐏁 Ку́руш или Ку́раш) — персидский царь из династии Ахеменидов, правивший в 559—530 годах до н. э., основатель Ахеменидской державы.",
]
sections = [
  { "title" = "Происхождение Кира", "paragraphs" = [
      "Биография Кира известна в основном из «Истории» Геродота. Некоторая информация о Кире также имеется у древнегреческого историка Ктесия, жившего при персидском дворе в V веке до н. э., и в книгах Ветхого Завета. Истории, рассказанные Диноном, Диодором Сицилийским, Страбоном и Юстином, восходят к сообщениям Геродота и Ктесия. Оригинальные источники малочисленны. Кроме цилиндра, где перечислен список побед Кира, его милостивых поступков, а также предков, сохранились лишь короткие надписи в Уре, Уруке и Пасаргадах, а также несколько частных вавилонских документов, которые помогают вести хронологию событий.",
      "Кир был сыном Камбиса I из династии Ахеменидов, основанной легендарным Ахеменом, ведущего клана в персидском племени пасаргадов. Ещё Набонид титуловал Кира царём Аншана, то есть одной из областей на юго-востоке Элама, это же делали и вавилонские жрецы, составлявшие так называемую хронику Набонида и Кира. В своём воззвании к вавилонянам сам Кир называл «царями Аншана» своих предков: «Я — Кир… сын Камбиса, великого царя, царя города Аншана, внук Кира, великого царя, царя города Аншана, потомок Теиспа, великого царя, царя города Аншана».",
      "Точный год рождения Кира неизвестен, считается, что он появился на свет от 600 до 590 года до н. э., наиболее вероятно в 593 году до н. э. О его детстве и юности известно только из легенд, которые часто противоречат друг другу. Греческий историк Ксенофонт также пишет о том, что уже в V веке до н. э. о жизни Кира Великого рассказывали по-разному.",
    ] },
  { "title" = "Восстание против Мидии", "paragraphs" = [
      "Если верить Геродоту, утверждавшему, что правление Кира продлилось 29 лет, в 559 году до н. э. (другие греческие писатели также относят вступление Кира на престол к началу первого года 55-й олимпиады, то есть к 560/559 году до н. э.) Кир стал вождём персидских оседлых племён, среди которых главенствующую роль играли пасаргады, к которому принадлежал правящий род Ахеменидов. Кроме них, в союз входили также марафии и маспии. Все они находились в зависимости от мидийского царя. Центр тогдашнего Персидского государства располагался вокруг города Пасаргады, интенсивное строительство которого относится как раз к начальному периоду правления Кира и который стал первой столицей Персидского государства. Жившие в городах и степях Персии куртии, марды, сагартии и некоторые другие кочевые племена, а также оседлые племена кармании, панфиалеи и деруши были покорены Киром позднее, по-видимому, уже после войны с Мидией.",
      "Геродот, по своему обыкновению, довольно наивно передаёт историю подчинения персидских племён Киру. По его словам Кир созвал всех знатных персов и сказал: «Персы! Всю жизнь вы подчинялись мидийцу Астиагу. Прошу вас два дня быть послушными мне персу». Персы согласились. В первый день Кир приказал им явиться с серпами и топорами и заставил без отдыха корчевать кустарники. К концу работы они едва держались на ногах от усталости. На второй день Кир усадил всех за стол, и до вечера длился пир. В конце Кир сказал: «Персы! Кто хочет жить, как вчера, пусть и дальше подчиняется мидийцам. А кто решит жить как сегодня, пусть готовится к бою. Ведь мы ничуть не хуже мидийцев, а как воины ещё смелее и сильнее. Завоюем же свою свободу!» Так персы обрели вождя и были рады избавлению от мидийского ига.",
      "В 553 году до н. э., согласно надписи Набонида (3-й год правления Набонида), Кир выступил против мидийского царя Астиага. Геродот и Ктесий называют войну персов с мидянами восстанием, успех которого (особенно по Геродоту) в значительной мере был обусловлен существованием в Мидии партии, недовольной Астиагом, и изменой. Согласно Геродоту, причиной войны между двумя этими царствами послужил заговор знатного мидийца Гарпага, которому, как уже говорилось выше, Астиаг нанёс жестокую обиду. Он сумел привлечь на свою сторону многих знатных мидийцев, недовольных суровым правлением Астиага, а затем подговорил Кира поднять восстание.",
    ] },
  { "title" = "Завоевания Кира II в Малой Азии", "paragraphs" = [
      "В 547 году до н. э. на сторону Кира добровольно перешла Киликия и предоставила ему военную помощь. За это Кир никогда не посылал в неё сатрапов, а оставил у власти местных правителей, которые должны были платить ему дань и в случае необходимости выставлять войско.",
      "Таким образом, Кир вплотную подошёл к границам Лидийского царства — одного из самых могущественных государств Ближнего Востока, также претендовавшего на гегемонию в Малой Азии. Согласно Геродоту, инициатива войны принадлежала лидийскому царю Крёзу. В 547 году до н. э. лидийцы вторглись в Каппадокию, находившуюся ранее под властью мидийцев и после победы персов над последними отошедшую в зону их влияния. Туда же направился Кир, по пути пополняя свою армию из представителей тех народов, по территории которых он проходил. Были отправлены послы в города Ионии и Эолиды с призывом отложиться от Крёза и выступить на стороне Кира. Однако малоазийские греки предпочли занять выжидательную позицию.",
      "У города Птерия, на восточной стороне реки Галис, произошла кровопролитная битва, но она закончилась безрезультатно, и ни одна из сторон не рискнула вступить в новый бой. Крёз отступил в свою столицу — Сарды — и решил основательнее подготовиться к войне и попытаться получить более эффективную помощь от своих союзников: Египта, Спарты и Вавилона. Однако Кир, который знал о действиях и намерениях своего противника, решил застигнуть его врасплох и стремительно двинулся к Сардам. Жители Сард вовсе не ожидали такого нападения и узнали о нём, лишь когда персидские войска появились у стен города. Крёз вывел свою армию, состоящую из конников, вооружённых копьями, на равнину перед Сардами. Кир по совету своего полководца, мидийца Гарпага, поставил всех следовавших в обозе верблюдов впереди войска, посадив предварительно на них лучников (военная хитрость, к которой впоследствии прибегали и многие другие полководцы). Кони в лидийском войске, почуяв незнакомый запах верблюдов и увидев их, обратились в бегство. Однако лидийские всадники соскочили с коней и стали сражаться пешими, но под напором войск Кира вынуждены были отступить в Сарды и запереться в акрополе.",
    ] },
  { "title" = "Подчинение Вавилонии", "paragraphs" = [
      "Весной 539 года до н. э. персидская армия двинулась в поход на Вавилон. В этот критический момент Угбару, наместник области Гутиум (вавилонская провинция к востоку от среднего течения Тигра), изменил царю Набониду и перешёл на сторону Кира. По словам Геродота, при переправе через Гинд (современная Дияла) одна из священных белых лошадей утонула в нём. Кир в гневе приказал наказать реку. В течение лета персидское войско прорыло 360 каналов и отвело воду из реки. Вероятно, Кира задержали гидравлические сооружения Навуходоносора, приведённые в действие и залившие водой всё пространство от Описа и Сиппара к югу, отрезав таким образом Вавилон от вражеской армии. То, что Геродот представляет как самодурство, продиктованное гневом, в действительности было вполне обдуманным мероприятием с целью снова спустить воду с затопленной местности и сделать её проходимой для войска. Только после этого Кир продолжил поход.",
      "Вавилонское войско стало лагерем у города Опис, прикрывая переправы через Тигр. Но Кир в 20-х числах сентября неожиданно обошёл Мидийскую стену с запада. Посланный Киром корпус Угбару осадил Вавилон, в котором находился сильный гарнизон во главе с сыном Набонида Валтасаром. Сам же Кир ударил по армии Набонида, стоящей у Описа, с тыла. В сражении у Описа, происшедшем в самом конце сентября, вавилонская армия потерпела жесточайшее поражение и бежала. Набонид с немногими приближёнными хотел отступить к Вавилону, но путь туда был отрезан войсками Угбару, и Набонид укрылся в Борсиппе.",
      "10 октября был захвачен без боя Сиппар, а 12 октября, согласно вавилонским источникам, Угбару вступил в Вавилон (согласно Геродоту, Кир велел отвести реку и вступил в город по её руслу, в то время как жители справляли какой-то праздник, но современная событиям Вавилонская хроника ничего об этом не говорит, и поэтому многие историки считают сообщение Геродота недостоверным).",
    ] },
  { "title" = "Память о Кире", "paragraphs" = [
      "Образ Кира оставил глубокий след в древневосточной и античной литературе. В короткий срок вождь небольшого, мало кому известного племени основал могущественную империю, распростёршуюся от Инда и Яксарта (Сырдарьи) до Эгейского моря и пределов Египта. Кир был великим воином и государственным деятелем, не только отличался большим политическим умом и дипломатической дальновидностью, но пользовался удачей, которая отдала в его руки Мидию и Вавилонию, раздираемые внутренними распрями и видевшие в нём не столько чуждого завоевателя, сколько освободителя.",
      "Его общепризнанная гуманность, коренившаяся как в личном характере, так и в характере исповедуемой им религии, окружила его личность ореолом человека, принёсшего в историю Передней Азии светлый период между ассирийскими зверствами и позднейшим персидским деспотизмом. Он явился желанным для народов и ушёл, обновив Азию и начав новый период её истории. В памяти персов он остался как «отец народа», в то время как в древнегреческой и библейской традиции он почитался как образ мудрого и справедливого правителя. Вот высказывание Диодора Сицилийского о нём, которое только подтверждает слова Геродота и Ксенофонта:",
      "«Царь Мидии Кир, сын Камбиза и Манданы, дочери Астиага, был выдающимся среди людей своего времени в мужестве, мудрости и других добродетелях, ибо его отец воспитал его на царский манер и сделал его ревностным подражателем высшим достижениям. И было ясно, что он сотворит великие дела, так как не по годам проявлял своё превосходство. Кир, как нам говорят, был не только мужественным человеком на войне, но он был также внимательный и гуманный в обращении к своим подданным. И именно по этой причине персы называли его Отцом».",
    ] },
]

[articles.vi]
text = "Cyrus II của Ba Tư, thường biết đến là Cyrus Đại đế, hay Kyros Đại đế (tiếng Ba Tư cổ: 𐎤𐎢𐎽𐎢𐏁, phát âm ngữ chi Iran: [kʰuːruʃ], Kūruš, Ba Tư: کوروش بزرگ, Kūrosh-e-Bozorg) (Khoảng 600 TCN hoặc là 576 TCN – tháng 12 năm 530 TCN), cũng viết là Cyrus II Đại đế, hoặc Cyrus của Ba Tư, là vị Hoàng đế khai quốc của Đế quốc Ba Tư dưới Triều đại nhà Achaemenes. Là một vị vua vĩ đại, sau cuộc chinh phạt Đế quốc Tân Babylon, ông xưng làm \"Vua của các vị vua\"."
title = "Cyrus Đại đế"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Cyrus_%C4%90%E1%BA%A1i_%C4%91%E1%BA%BF"
intro = [
  "Cyrus II của Ba Tư, thường biết đến là Cyrus Đại đế, hay Kyros Đại đế (tiếng Ba Tư cổ: 𐎤𐎢𐎽𐎢𐏁, phát âm ngữ chi Iran: [kʰuːruʃ], Kūruš, Ba Tư: کوروش بزرگ, Kūrosh-e-Bozorg) (Khoảng 600 TCN hoặc là 576 TCN – tháng 12 năm 530 TCN), cũng viết là Cyrus II Đại đế, hoặc Cyrus của Ba Tư, là vị Hoàng đế khai quốc của Đế quốc Ba Tư dưới Triều đại nhà Achaemenes. Là một vị vua vĩ đại, sau cuộc chinh phạt Đế quốc Tân Babylon, ông xưng làm \"Vua của các vị vua\". Nhiều nguồn tin cho rằng ông là một tín đồ Hỏa giáo, trong khi những nguồn khác không rõ việc ông có thật sự theo Hỏa giáo hay không.",
  "Dưới triều đại ông, Đế quốc Ba Tư chiếm được tất cả những nền văn minh trước đây của vùng Cận Đông cổ đại, bành trướng đáng kể và cuối cùng đã chinh phạt phần lớn vùng Tây Nam Á và nhiều phần đất của vùng Trung Á, thậm chí những phần đất của châu Âu và vùng Kavkaz. Từ bờ biển Địa Trung Hải và biển Hellespont ở phía Tây cho tới sông Ấn ở phía Đông, Cyrus đã gây dựng nên một đế quốc rộng lớn nhất mà trước đây, không có đế quốc nào bì kịp trên thế giới. Đôi khi ông được so sánh với vua Kay Khosrow trong huyền sử Ba Tư.",
  "Triều đại của ông kéo dài khoảng 30 năm. Thoạt đầu, ông khởi lập Đế quốc qua cuộc chinh phạt Đế quốc Media, sau đó chinh phạt người Saka (theo Ctesias), Đế quốc Lydia và cuối cùng, ông chinh phạt Đế quốc Tân Babylon. Có lẽ là trước hoặc là sau khi Đế quốc Babylon sụp đổ, ông tiến hành một cuộc chinh phạt miền Trung Á, và kết quả của những cuộc chinh phạt này là ông đã buộc \"tất cả mọi dân tộc phải thần phục, mà không hề có ngoại lệ\" – theo Herodotos. Cyrus hy sinh tại Trung Á khi giao chiến với một bộ tộc Scythia (theo Herodotos và Ctesias), hoặc qua đời bình yên tại Ba Tư theo Xenophon, vào khoảng tháng 12 năm 530 TCN. Con ông là Cambyses II lên nối ngôi, theo sử cũ ngoài Cyropaedia của Xenophon, ông vua này tiến hành chinh phạt Ai Cập.",
  "Tuy là một nhà chinh phạt hùng cường, ông tôn trọng truyền thống văn hóa và tôn giáo của những vùng đất mà ông chiếm lĩnh. Người ta nói rằng, trong lịch sử nhân loại, Cyrus đã đưa Đế quốc Achaemenes trở thành một mẫu mực về việc thiết lập một bộ máy hành chính trung ương và một chính phủ làm việc vì lợi ích và hạnh phúc của trăm họ. Các chính sách dựng nước của ông đã được các vua kế tiếp của Vương triều Achaemenes – xa hơn nữa là các đế quốc Hy Lạp và La Mã cổ noi theo. Trên thực tế, bộ máy hành chính thông qua các quân Tổng trấn và nguyên tắc quan trọng của việc thành lập chính phủ tại kinh thành Pasargadae, đều là những công trạng của ông. Bên ngoài quốc gia của chính ông Đế quốc Ba Tư, Cyrus còn để lại một di sản bền vững đối với tôn giáo của người Do Thái thông qua Sắc lệnh Khôi phục của ông; vì những chính sách công minh của ông tại thành Babylon, ông được gọi là Người được xức dầu thánh của Chúa Trời trong Kinh Tanakh của người Do Thái.",
]
sections = [
  { "title" = "Tên gọi", "paragraphs" = [
      "Trong các sách tiếng Anh, ông được gọi là Cyrus Đại đế (Cyrus the Great), mà hầu hết sách Việt Nam cũng biết tên này. Tên gọi Cyrus là Latin hóa từ tên Hy Lạp Κυρσς, gốc từ tên Ba Tư là Kourosh, hoặc Kûruš hay Khûrvaš, có nghĩa là \"giống như vầng mặt trời\": Từ khûr nghĩa \"Mặt Trời\" và -vaš là \"hậu tố\" (suffix) của \"tính chất giống\".",
      "Ở nước Iran, vị hoàng đế này thường thường được gọi là Kourosh-e Bozorg, hay Kūrošé Bozorg và/hoặc Kūrošé Kabīr - đều nghĩa là \"Cyrus Đại đế\". Trong Kinh Thánh Hebrew, ông được biết đến đơn giản là Koresh mà trong các bản dịch Kitô giáo tiếng Anh là Cyrus, tiếng Việt là Xiru/Siru hoặc Kyrô. Ông còn được nhắc đến trong kinh Qur'an của Hồi giáo với tước hiệu \"Dhul-Qarnayn\".",
    ] },
  { "title" = "Triều đại", "paragraphs" = [
      "Từ thế kỉ thứ 9 TCN, Vương triều Achaemenes lên trị vì Vương quốc Ba Tư ở cao nguyên Iran. Vua Achaemenes (Haxāmaniš) là người sáng lập ra Vương triều này. Vương triều còn có tên là \"Hakhamanishian\" nghĩa là \"con cháu của Hakhamanish (Achaemenes)\" theo như Hoàng đế Darius Đại đế – vị vua thứ 9 của Vương triều này – tuyên bố về lai lịch của mình: \"vì lý do này mà bất cứ một ai trong chúng ta cũng có tên là Hakhamanishian.\" Vua Achaemenes xây dựng nhà nước Parsumash ở tây nam của Iran và truyền ngôi cho con là vua Teispes; vua Teispes đã lấy hiệu là \"Vua xứ Anshan\" sau khi chiếm được thành phố Anšān và mở rộng vương quốc của mình hơn nữa bao gồm cả Pars. Các tài liệu cổ đề cập rằng ông có một người con là Cyrus I đã kế vị ngôi \"Vua xứ Ansan\" từ vua cha. Vua Cyrus I có một người anh em khác được ghi nhận là vua Ariyaramma làm vua ở Ba Tư.",
      "Vào khoảng năm 600 TCN, Cyrus I qua đời và con là Cambyses I lên nối ngôi, cai trị tới năm 559 TCN ở Anshan, trong khi Ariyaramma được con là Arshama kế vị ở Ba Tư. Vua Cyrus II (Đại đế) là con trai của vua Cambyses I – người đã đặt tên con mình theo tên vua cha Cyrus I.",
      "Trong trụ của Cyrus II, bản thân ông cũng thừa nhận là con cháu của các vị vua trên. Vua Arshama là ông nội của Darius Đại đế trong khi Cambyses I là cha của Cyrus II. Mẹ ông, Mandane của Media, là con gái của vua Media là Astyages.",
    ] },
  { "title" = "Tuổi trẻ", "paragraphs" = [
      "Chúng ta biết rất ít nói về tuổi trẻ của Cyrus, vì phần lớn tư liệu về thời này đã bị mất. Có lẽ ông sinh vào khoảng 600-599 TCN hay 576–575 TCN. Nhà sử học Herodotos có viết về huyền thoại về sự ra đời của Cyrus, như sau: trong khoảng thời gian Cyrus chào đời, vua Astyages đã được báo mộng rằng cháu ngoại mình – đứa bé Cyrus – sẽ chiếm đoạt ngai vàng. Tỉnh giấc, vua Astyages hạ lệnh cho bắt giết đứa bé. Tuy nhiên, một viên tướng Media đã không giết Cyrus, mà giao đứa bé cho một người chăn cừu. Khi Hoàng tử Cyrus lên 10 tuổi, việc này mới bị vua Astyages phát giác, nhưng vì có đức tính tốt nên ông được về ở với mẹ trong sự đày ải.",
    ] },
  { "title" = "Khởi nghĩa thắng lợi chống Mada", "paragraphs" = [
      "Vào năm 559 TCN, vua Cambyses I qua đời. Vua Cyrus II kế ngôi ở Anshan với cương vị là vua chư hầu của Media. Ông đóng đô ở Pasargadae ở tỉnh Pars, là trung tâm của bộc lạc Pasargadae, nơi Vương triều Achaemenes dấy lên năm xưa. Trong các năm 554 TCN và 550 TCN, vua Cyrus II phát động khởi nghĩa chống triều đình Media, và lời tiên tri trong giấc mộng của vua Astyages đã trở thành hiện thực - khi vua Cyrus Đại Đế ca khúc khải hoàn tiến vào kinh đô Media là Ecbatana (Hamadan ngày nay) và lật đổ Vương triều Media. Ông trở thành vị vua mới của người Media. Ông thống nhất tộc người Ba Tư với người Media, và Đế quốc Achaemenes được kiến lập. Do đối xử tàn nhẫn đối với dân tộc Ba Tư, Đế quốc Media đã sụp đổ và lại chịu sự thống trị của Đế quốc Ba Tư. Sau thời vua Cyrus Đại Đế, họ có làm loạn nhưng đều thất bại. Về phần mình, sau chiến thắng, nhà vua giữ cựu vương Astyages trong Triều đình Ba Tư, mà không làm tổn hại gì đến ông ta.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Cyrus Đại đế là một nhà chinh phạt tài ba, một quân nhân tuyệt vời, và là người sáng lập một đế quốc rộng lớn chưa từng thấy. Sau này, các tác gia Cicero và Scipio Africanus đã thể hiện sự hâm mộ đối với những chiến công hiển hách của ông. Tuy nhiên, với Trụ Cyrus và một loạt văn bản của người Do Thái, cộng thêm những bài viết của Xenophon, ông được ca tụng như một người giải phóng hơn là một ông hoàng chinh phạt. Nhà vua được đề cập đến 22 lần trong kinh Cựu Ước, nơi ông được tôn vinh vô điều kiện. Việc đề cập này bắt đầu sau khi ông giải phóng người Do Thái khỏi Babylon và cho hơn 40.000 người Do Thái trở về quê hương.",
      "Cho đến ngày nay, nhiều người cho rằng ông vĩ đại hơn cả vua Alexandros Đại đế, xét về những thành tựu của ông. Trên thực tế, bản thân thiên tài quân sự xứ Macedonia này cũng vô cùng mến mộ và thán phục Hoàng đế Cyrus Đại Đế - vị vua vĩ đại đã thống nhất hai dân tộc Media và Ba Tư: ngay từ khi còn trẻ, vua Alexandros Đại Đế đã đọc tác phẩm \"Cyropaedia\" của nhà sử học Xenophon, trong đó thể hiện chí khí hào hùng của ông khi đánh trận và khi trị quốc, đồng thời thể hiện tài năng làm vua và nhà lập pháp của ông. Từ đó vua Alexandros Đại Đế ngưỡng mộ ông, và trong chuyến viếng thăm đến cố đô Pasargadae, vị vua xứ Macedonia đã tỏ lòng hết sức kính trọng ông, qua việc truyền lệnh cho Aristobulus trang hoàng cái phòng bên trong lăng tẩm của ông.",
      "Trụ của Cyrus, một trong những hiến chương đầu tiên về nhân quyền. Bảo tàng Anh Quốc.",
    ] },
]

[articles.id]
text = "Koresh II (atau Koresy II; bahasa Persia Kuno: 𐎤𐎢𐎽𐎢𐏁 Kūruš; bahasa Persia Modern: کورش Kūroš atau Kores (TB2)), dikenal dengan Koresh Agung atau Kores Agung, adalah Raja Diraja (Kaisar) Iran yang berkuasa sampai tahun 530 SM. Pandangan tradisional menyatakan bahwa dia adalah seorang anggota Dinasti Akhemeniyah, sehingga kekaisarannya disebut Kekaisaran Akhemeniyah."
title = "Koresh Agung"
lang = "id"
url = "https://id.wikipedia.org/wiki/Koresh_Agung"
intro = [
  "Koresh II (atau Koresy II; bahasa Persia Kuno: 𐎤𐎢𐎽𐎢𐏁 Kūruš; bahasa Persia Modern: کورش Kūroš atau Kores (TB2)), dikenal dengan Koresh Agung atau Kores Agung, adalah Raja Diraja (Kaisar) Iran yang berkuasa sampai tahun 530 SM. Pandangan tradisional menyatakan bahwa dia adalah seorang anggota Dinasti Akhemeniyah, sehingga kekaisarannya disebut Kekaisaran Akhemeniyah. Sebelum menjadi Raja Diraja Iran, Koresy adalah raja daerah Persia, sebuah kawasan di Iran selatan, sehingga negaranya juga disebut Kekaisaran Persia oleh bangsa non-Iran.",
  "Pada masa kekuasaannya, dia menyatukan berbagai peradaban di Timur Dekat Kuno, termasuk menaklukkan Media, Lydia, dan Babilonia. Kekaisarannya membentang dari Laut Tengah di barat sampai Sungai Indus di timur. Koresy terkemuka, baik atas perannya sebagai negarawan maupun prajurit. Atas infrastruktur politik yang dia ciptakan, Kekaisaran Akhemeniyah bertahan lama setelah kematiannya.",
  "Koresy Agung menghormati adat istiadat dan agama di tanah yang dia taklukkan, menjadi percontohan yang berhasil untuk administrasi terpusat dan pembangunan pemerintahan yang bekerja untuk keuntungan rakyatnya. Koresy juga terkenal karena capaiannya dalam hak asasi manusia, politik, dan strategi militer, serta pengaruhnya terhadap peradaban Timur dan Barat.",
  "Koresy juga disebut dalam Tanakh (kitab suci Yahudi) dan Alkitab (kitab suci Kristen) terkait titahnya untuk mengembalikan orang-orang buangan, termasuk bangsa Yahudi, kembali ke tanah air mereka masing-masing, serta mengizinkan bangsa Yahudi membangun kembali Bait Suci di Yerusalem. Titah itu ditulis antara lain dalam Silinder/Tabung Koresy, yang ditulis tahun 539 SM dan saat ini disimpan di British Museum, London. Sebagian ulama Muslim modern berpendapat bahwa sosok Dzulqarnain yang disebut dalam Al-Qur'an (kitab suci Islam) adalah Koresy.",
]
sections = [
  { "title" = "Nama", "paragraphs" = [
      "Nama Koresy merupakan ejaan dari Tanakh (kitab suci Yahudi) (bahasa Ibrani: כורש‎). Nama dalam bahasa Yunani adalah Κῦρος, Kỹros. Namanya dalam bahasa Persia Kuno adalah Kūruš, sedangkan dalam bahasa Persia, khususnya di Iran, namanya dieja کوروش (Kūroš; [kuːˈɾoʃ]).",
      "Nama Koresy dan makna yang terkandung di dalamnya telah dicatat dalam prasasti kuno dalam berbagai bahasa. Sejarawan Yunani kuno Ktesias dan Plutarkhos menyatakan bahwa nama Koresy diambil dari Kuros, Matahari, sebuah konsep yang telah ditafsirkan sebagai \"seperti Matahari\" (Khurvasy) dengan mencatat hubungannya dengan kata benda Persia untuk matahari, khor, diimbuhi akhiran - vash yang bermakna \"serupa\" atau \"seperti\". Sejarawan Jerman Karl Hoffmann berpendapat bahwa nama itu berdasarkan dari terjemahan akar kata \"menghinakan\" dalam bahasa Indo-Eropa, bermakna \"penghinaan terhadap musuh dalam pertarungan verbal.\"",
      "Beberapa sarjana, di sisi lain, percaya bahwa baik Koresy maupun Kambisus bukanlah nama Iran, menyatakan bahwa Koresy berasal dari bahasa Elam yang bermakna \"Dia yang melimpahkan perhatian.\"",
    ] },
  { "title" = "Latar belakang", "paragraphs" = [
      "Ayah Koresy adalah Kambisus I, Raja Persia yang berkuasa pada 580–559 SM. Ibunya adalah Mandana, putri dari Astyages, Raja Media yang berkuasa pada 564–550 SM. Kambisus I merupakan raja bawahan dari Astyages.",
      "Pandangan tradisional berdasarkan penelitian arkeologi dan silsilah yang diberikan dalam Prasasti Behistun dan oleh sejarawan Yunani Herodotos menyatakan bahwa Koresy adalah anggota dari Dinasti Akhemeniyah, sehingga kekaisarannya disebut Kekaisaran Akhemeniyah oleh sejarawan modern. Nama Akhemeniyah sendiri diambil dari nama leluhur dinasti ini, Akhaimenes, yang membangun negara Parsua di barat daya Iran. Dia kemudian digantikan putranya, Teispes, yang menyandang gelar \"Raja Ansyan\" setelah menaklukkan kota Ansyan dan meluaskan kerajaannya hingga mencakup kawasan Pars (seputar Iran selatan). Berkas kuno menyebutkan bahwa Teispes memiliki putra bernama Koresy I yang mewarisinya sebagai Raja Ansyan. Koresy I memiliki putra, Kambisus I, yang mewarisi takhtanya. Kambisus I adalah ayah Koresy Agung.",
      "Pendapat lain menyebutkan bahwa sebenarnya Koresy tidak berdarah Akhemeniyah dan keterkaitan antara dirinya dan Dinasti Akhemeniyah merupakan buatan Darius Agung, Raja Diraja Iran yang naik takhta sekitar delapan tahun setelah mangkatnya Koresy. Dalam Tabung Koresy, garis silsilah para Raja Ansyan adalah Teispes — Koresy I — Kambisus I — Koresy II. Tidak ada keterangan bahwa Akhaimenes adalah ayah Teispes sebagaimana yang tertuang dalam Prasasti Behistun. Dugaan rekaan yang dibuat Darius ini ditengarai untuk membuat kesan bahwa Darius memiliki keterkaitan keluarga dengan Koresy yang notabene merupakan salah satu penguasa paling berpengaruh dan dihormati sepanjang sejarah.",
    ] },
  { "title" = "Kebangkitan dan kampanye militer", "paragraphs" = [
      "Koresy naik takhta pada tahun 559 SM setelah kematian ayahnya. Namun Koresy belum menjadi penguasa berdaulat. Seperti para pendahulunya, Koresy harus mengakui kekuasaan Media atasnya. Astyages, raja Media dan kakek Koresy, mungkin telah menguasai sebagian besar Timur Dekat Kuno, dari perbatasan Lydia di barat hingga Parthia dan Persia di timur.",
      "Menurut Tawarikh Nabonidus, Astyages melancarkan serangan terhadap Koresy. Menurut sejarawan Herodotos, diketahui bahwa Astyages menempatkan Harpagus sebagai komandan pasukan Media untuk menaklukkan Koresy. Namun Harpagus justru beralih pihak pada Koresy bersama beberapa bangsawan dan sebagian pasukan. Pemberontakan ini dikonfirmasi oleh Tawarikh Nabonidus yang menjelaskan mengenai peperangan di antara pihak Koresy dan Astyages selama tiga tahun (553–550 SM) sebelum akhirnya Ekbatana jatuh ke pihak Koresy. Koresy mengampuni nyawa Astyages dan menikahi putrinya, Amitis. Pernikahan ini menenangkan beberapa pengikut, termasuk Baktria, Parthia, dan Saka. Herodotos mencatat bahwa Koresy juga menaklukkan dan memasukkan Sogdia ke dalam wilayah kekuasaannya selama kampanye militernya pada 546–539 SM.",
      "Dengan kemenangan Koresy, semua pengikut Astyages (banyak yang masih berkerabat dengan Koresy) sekarang di bawah komandonya. Oleh karena itu, pamannya, Arsyama, yang pernah menjadi raja negara-kota Parsa di bawah Media, harus menyerahkan takhtanya. Namun, pengalihan kekuasaan dalam keluarga ini tampaknya berjalan mulus, dan tampaknya Arsyama masih menjadi penguasa nominal Parsa di bawah Koresy — lebih merupakan pangeran atau adipati agung daripada raja. Putra Arsyama, Histaspa, kemudian dijadikan satrap (gubernur) di Parthia dan Frigia. Koresy dengan demikian menyatukan kerajaan kembar Akhemeniyah Parsa dan Ansyan ke dalam Persia. Arsyama hidup untuk melihat cucunya menjadi Darius Agung, Raja Diraja Persia, setelah kematian kedua putra Koresy. Penaklukan Koresy atas Media hanyalah awal dari perangnya.",
    ] },
  { "title" = "Akhir hayat", "paragraphs" = [
      "Aksara paku dari Babilon memberi bukti bahwa Koresy mati sekitar Desember 530 SM, yaitu dari tulisan terakhir mengenai pemerintahannya, (lempengan dari Borsippa tertanggal 12 Agustus 530 SM) dan referensi pertama mengenai pemerintahan putranya, Kambisus II (lempengan dari Babilon tertanggal 31 Agustus 530 SM) yang menggantikannya sebagai raja.",
      "Terdapat rincian yang berbeda-beda mengenai kematian Koresy. Herodotos, yang memberikan rincian terpanjang kedua, menerangkan bahwa Koresy meninggal dalam pertempuran sengit dengan Massagetae, suku dari gurun selatan Khwarezm dan Kyzyl Kum di bagian paling selatan dari wilayah Stepa Eurasia (masuk wilayah negara Kazakhstan dan Uzbekistan pada masa modern), mengikuti saran Kroisos untuk menyerang mereka di wilayah mereka sendiri. Massagetae terkait dengan bangsa Skithia dalam pakaian dan cara hidup mereka; mereka bertarung dengan menunggang kuda dan berjalan kaki. Untuk menaklukkan mereka, Koresy pertama-tama mengirimkan tawaran pernikahan kepada penguasa mereka, Ratu Tomyris, sebuah lamaran yang ditolaknya.",
      "Koresy kemudian memulai upayanya untuk merebut wilayah Massagetae dengan paksa (sekitar 529 SM), dimulai dengan membangun jembatan dan perahu perang yang menjulang tinggi di sepanjang sisi sungai Oxus, atau Amu Darya, yang memisahkan mereka. Tomyris menantangnya untuk bertemu pasukannya dalam peperangan yang terhormat, mengundangnya ke suatu tempat di negaranya satu hari perjalanan dari sungai. Koresy menerima tawarannya, tetapi, mengetahui bahwa Massagetae tidak terbiasa dengan minuman anggur dan efeknya yang memabukkan, dia mendirikan dan kemudian meninggalkan kemah dengan membawa banyak anggur, membawa serta prajurit terbaiknya dan meninggalkan yang paling tidak mampu.",
    ] },
  { "title" = "Warisan", "paragraphs" = [
      "Koresy terkemuka, baik atas perannya sebagai negarawan maupun prajurit. Atas infrastruktur politik yang dia ciptakan, Kekaisaran Akhemeniyah bertahan lama setelah kematiannya. Sejarawan Inggris Charles Freeman menyatakan bahwa \"Dalam lingkup dan tingkat pencapaiannya (Koresy) berada jauh di atas pencapaian raja Makedonia, Aleksander, yang akan menghancurkan kerajaan (Akhemeniyah) pada tahun 320-an, tetapi gagal memberikan alternatif yang stabil.\" Koresy telah menjadi pahlawan pribadi bagi banyak orang, termasuk Thomas Jefferson (Presiden Amerika Serikat ke-3), Mohammad Reza Pahlavi (Raja Diraja Iran terakhir), dan David Ben-Gurion (Perdana Menteri Israel pertama).",
      "Prestasi Koresy Agung sepanjang zaman kuno tecermin dalam caranya dikenang hari ini. Bangsanya sendiri, Iran, telah menganggapnya sebagai \"Sang Ayah,\" gelar yang telah digunakan selama masa Koresy sendiri, oleh banyak negara yang ia taklukkan, sebagaimana penuturan Xenophon. Bangsa Babilonia sendiri menyebut Koresy dengan \"Sang Pembebas.\"",
      "Kebangkitan Persia di bawah pemerintahan Koresy memiliki dampak yang sangat besar dalam perjalanan sejarah dunia. Agama, filsafat, dan sastra Iran, semuanya memainkan peran besar dalam peristiwa dunia untuk milenium berikutnya. Persia juga memberikan pengaruh yang sangat besar di Timur Tengah selama Zaman Kejayaan Islam, dan sangat berperan dalam pertumbuhan dan perluasan Islam. Banyak dari dinasti Iran setelah Kekaisaran Akhemeniyah dan raja-raja mereka memandang diri mereka sebagai pewaris Koresy Agung dan mengklaim untuk melanjutkan garis yang dimulai oleh Koresy. Aleksander Agung sendiri tergila-gila dan mengagumi Koresy Agung. Sejak usia dini dia membaca Cyropaedia karya Xenophon, yang di sana menggambarkan kepahlawanan Koresy dalam pertempuran dan pemerintahan dan kemampuannya sebagai raja dan legislator. Selama kunjungannya ke Pasargadae, Aleksander memerintahkan Aristobulus untuk mendekorasi interior ruang kuburan makam Koresy.",
    ] },
]

[articles.pt]
text = "Ciro II (em persa antigo: 𐎤𐎢𐎽𐎢𐏁; romaniz.: Kūruš), mais conhecido como Ciro, o Grande e também chamado de Ciro, o Presbítero, pelos gregos, foi o primeiro Rei dos reis e fundador do Império Aquemênida, que reinou entre 559 e 530 a.C., ano em que morreu em batalha com os masságetas. Pertencente à dinastia dos Aquemênidas, foi sucedido pelo filho, Cambises II."
title = "Ciro II"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Ciro_II"
intro = [
  "Ciro II (em persa antigo: 𐎤𐎢𐎽𐎢𐏁; romaniz.: Kūruš), mais conhecido como Ciro, o Grande e também chamado de Ciro, o Presbítero, pelos gregos, foi o primeiro Rei dos reis e fundador do Império Aquemênida, que reinou entre 559 e 530 a.C., ano em que morreu em batalha com os masságetas. Pertencente à dinastia dos Aquemênidas, foi sucedido pelo filho, Cambises II.",
  "Ciro, o Grande foi um estadista e conquistador que expandiu seu império, conquistando enormes porções de território no Antigo Oriente Próximo, no Sudoeste Asiático e na Ásia Central. Ele anexou os impérios de Medos, Lídia e da Neobabilônia aos seus domínios. Ciro acabou criando o maior império que o mundo já tinha visto até aquele ponto, indo do Mar Mediterrâneo e do Helesponto até o Rio Indo. Ciro o Grande respeitava os costumes e religiões dos povos conquistados, com seu império se tornando um modelo de administração e centralização governamental, que levou a um período de prosperidade. Ele também é reconhecido por suas conquistas em direitos humanos, política e estratégia militar, bem como por sua influência nas civilizações oriental e ocidental.",
  "Ciro é visto como uma figura de culto entre os iranianos modernos, com sua tumba servindo como um local de reverência para milhões de pessoas.",
]
sections = [
  { "title" = "História", "paragraphs" = [
      "Na primeira fase da trajetória política de Ciro II ele foi um príncipe persa, filho do rei Cambises e neto de Ciro I. O reinado de Ciro II provavelmente começou em 559 a.C., quando ele sucedeu Cambises como rei da Pérsia, então subjugada pelos medos. Em 550 a.C. Ciro II derrotou o rei Astiages, do povo medo, e passou a expandir o seu reinado subjugando eles.",
      "Em seu nascimento, segundo Heródoto, consta que o rei medo Astíages, seu avô, teve um sonho em que uma videira crescia das costas de sua filha Mandane, mãe de Ciro, lançando gavinhas que envolviam toda a Ásia. Sacerdotes lhe advertiram que a videira era seu neto Ciro, e que ele tomaria o lugar do velho reino da Média no mundo. Então o rei medo mandou seu mordomo que o matasse nas montanhas. O mordomo, chamado Hárpago, se comoveu com a beleza da criança e o entregou aos cuidados de um pastor. Ao descobrir a traição, Astíages esquartejou o filho de Hárpago, e o serviu em um jantar para o mordomo, que apenas soube o que estava comendo quando levaram a última travessa à mesa: a cabeça de seu filho.",
      "Ciro finalmente se tornaria rei dos persas, até então um povo tributário dos medos. Então uma rebelião liderada por Hárpago derrotou Astíages, que foi levado a Ciro para julgamento. O rei persa poupou a vida de seu avô, mas marchou para a capital da Média, Ecbátana, e tomou o controle do vasto território medo. Assim que tomou o controle político de toda a região do atual Irã, conquistou a Lídia e os territórios a leste da Pérsia até o Turquestão, na Ásia Central. Conquistou a Babilônia em 539 a.C. Segundo o relato bíblico em Isaías 45, Ciro teria recebido uma mensagem de Deus que o ordenava a enviar de volta à Judeia todos os judeus cativos naquela cidade e que o próprio iria ajudá-lo. O autor de famosa declaração que em 537 a.C. autorizava os judeus a regressar à Judeia, pondo fim ao período do Cativeiro Babilônico. Em uma noite de 5/6 de outubro de 539 a.C., acampou em volta de Babilônia com seu exército. Enquanto os babilônicos festejavam, engenhosamente Ciro desviava as águas do Rio Eufrates para um lago artificial. Eles puderam atravessar o rio com a água na altura da cintura e entraram sem lutar, visto que os portões estavam abertos.",
    ] },
  { "title" = "História dinástica", "paragraphs" = [
      "Após a morte de seu pai (Cambises I), em 559 a.C., Ciro tornou-se rei de Ansã. No entanto, seu reino não era independente, posto que, como seus predecessores, Ciro teve de reconhecer sua sujeição ao Reino Medo. Durante o reinado de Astíages, o Império Medo possivelmente governou a maioria dos povos do Antigo Oriente, desde a fronteira da Lídia, ao oeste, até a Pártia e Pérsia, ao leste.",
      "Na versão de Heródoto, Hárpago, buscando vingança, convenceu Ciro a incitar a sublevação dos persas contra seus senhores feudais, os medos. Porém, provavelmente, Harpago e Ciro rebelaram-se devido às suas insatisfações acerca da política ministrada por Astíages. O início da revolta se deu em 549 a.C. e, desde então, com a ajuda de Hárpago, Ciro liderou seu exército contra os medos, até a conquista de Ecbátana, em 549 a.C., dominando, efetivamente, o império medo.",
      "Apesar de ter aceitado a coroa da Média, em 546 a.C., oficialmente assumiu o título de \"Rei da Pérsia\". Arsames, que era o governante da Pérsia sob os medos, teve, portanto, de abrir mão de seu trono. Seu filho, Histaspes, primo de segundo grau de Ciro, foi nomeado sátrapa de Pártia e Frígia. Arsames viveria para ver seu neto tornar-se Dario I, xá da Pérsia, após a morte dos filhos de Ciro.",
    ] },
  { "title" = "Ciro II em Heródoto", "paragraphs" = [
      "Heródoto narra a ascensão e a queda da dinastia mérmnada de reis lídios, concluindo esta narrativa com a derrota do rei meérmnada Creso para o persa Ciro II, e a posterior reviravolta da fortuna de Creso, que dribla a morte e se torna conselheiro de Ciro II, ao exemplo do que Sólon houvera no passado sido para ele. A partir deste ponto na narrativa de Histórias (livro I), Ciro II passa a ser biografado.",
      "A história de Heródoto sobre Ciro II narra a sua ascensão ao poder traçando a sua genealogia ligada a corte meda por ascendência de Mandane filha de Astíages, rei medo. Astíages recebeu em sonhos presságios de sua ruína, que em vão se esforçou para desviar o seu destino dela ao tramar o assassinato de seu neto, filho de Mandane, o príncipe Ciro, que neste reconhecimento em um sonho do rei passa a ser narrado como uma personagem predestinada a um futuro grandioso. Na narrativa de Heródoto a fortuna preserva a vida de Ciro em dois episódios: ao cortesão Hárpago ludibriar o rei e não assassinar o príncipe ainda um bebê, conforme havia sido a ele confiada a cruel missão, retransmitindo a missão ao boieiro real, Mitradates; e após o boieiro real, aconselhado pela esposa, desistir de assassinar o príncipe bebê e mascarar a verdade a Hárpago de que ele não cumpriu a missão a ele confiada ao vestir um bebê natimorto com as roupas do bebê Ciro.",
      "Com dez anos de idade, o jovem Ciro, criado como \"filho do boieiro\" por Mitradates e sua esposa Cino, revela predisposição a liderar os demais jovens e ao ser visto pelo rei, acaba por ter de si reconhecida a sua ascendência real. Astíages pune Hárpago o fazendo comer o seu próprio filho assado, sem que este soubesse do ato atroz. Hárpago, portanto, assume o caráter de personagem ressentida contra o rei. Após este episódio Astiages declina de se precaver contra o presságio e envia o seu neto para a Pérsia, onde ele encontra os seus progenitores e é recondicionado para a linhagem sucessória da dinastia.",
