[articles.ru]
text = "В арамейской надписи на стеле из Тель-Дана, датируемой IX веком до н. э., встречается выражение, которое обычно читают как «дом Давида». Базальтовый памятник прославляет победы арамейского правителя и упоминает царства Израиля и Иудеи. Надпись свидетельствует о династии, которую связывали с именем Давида. Масштаб его государства и достоверность отдельных эпизодов библейского повествования остаются открытыми вопросами. Во Второй книге Самуила его власть над Израилем связывается с договором со старейшинами в Хевроне. «Добыча Секелага» опирается на эпизод из Первой книги Самуила, 30:21–25. Часть людей Давида осталась охранять припасы, пока остальные сражались. Когда возник спор о разделе добычи, Давид постановил, что обеим группам полагаются равные доли. Этот рассказ послужил литературным источником способности. При первом захвате каждой готового вражеского города 200 золота делятся поровну между Давидом и его живыми союзниками. Так игра передаёт идею общего вознаграждения за разные роли."
title = "Царь Давид"
lang = "ru"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
intro = ["В арамейской надписи на стеле из Тель-Дана, датируемой IX веком до н. э., встречается выражение, которое обычно читают как «дом Давида». Базальтовый памятник прославляет победы арамейского правителя и упоминает царства Израиля и Иудеи. Надпись свидетельствует о династии, которую связывали с именем Давида. Масштаб его государства и достоверность отдельных эпизодов библейского повествования остаются открытыми вопросами. Во Второй книге Самуила его власть над Израилем связывается с договором со старейшинами в Хевроне."]
