[articles.de]
text = "Die aramäische Stele von Tel Dan aus dem 9. Jahrhundert v. Chr. enthält eine Wendung, die gewöhnlich als „Haus Davids“ gelesen wird. Das Basaltdenkmal erinnert an Siege eines aramäischen Herrschers und erwähnt die Königreiche Israel und Juda. Die Inschrift belegt eine Dynastie, die mit dem Namen David verbunden war. Die Größe seines Reichs und die Historizität späterer biblischer Episoden bleiben offen. Das Zweite Buch Samuel erzählt, David habe die Herrschaft über Israel durch einen Bund mit den Ältesten in Hebron erlangt. Beute von Ziklag geht auf das Erste Buch Samuel, 30,21–25, zurück. In der Erzählung bewacht ein Teil von Davids Gefolge das Gepäck, während die anderen kämpfen. Als ein Streit über die Beute entsteht, gibt David beiden Gruppen den gleichen Anteil. Die Episode dient als literarische Vorlage für die Fähigkeit. Wenn David eine fertige Feindstadt zum ersten Mal erobert, werden 200 Gold zu gleichen Teilen zwischen ihm und seinen noch lebenden Verbündeten aufgeteilt. Die Regel greift die gemeinsame Belohnung für unterschiedliche Beiträge auf."
title = "König David"
lang = "de"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
intro = ["Die aramäische Stele von Tel Dan aus dem 9. Jahrhundert v. Chr. enthält eine Wendung, die gewöhnlich als „Haus Davids“ gelesen wird. Das Basaltdenkmal erinnert an Siege eines aramäischen Herrschers und erwähnt die Königreiche Israel und Juda. Die Inschrift belegt eine Dynastie, die mit dem Namen David verbunden war. Die Größe seines Reichs und die Historizität späterer biblischer Episoden bleiben offen. Das Zweite Buch Samuel erzählt, David habe die Herrschaft über Israel durch einen Bund mit den Ältesten in Hebron erlangt."]
