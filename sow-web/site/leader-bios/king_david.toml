[articles.pt-BR]
text = "A estela aramaica de Tel Dan, do século IX a.C., contém uma expressão geralmente lida como “Casa de Davi”. O monumento de basalto celebra vitórias de um governante arameu e faz referência aos reinos de Israel e Judá. A inscrição oferece evidência de uma dinastia associada ao nome de Davi. A extensão de seu reino e a historicidade dos episódios bíblicos permanecem questões distintas. No Segundo Livro de Samuel, Davi assume o governo de Israel após firmar um pacto com os anciãos em Hebrom. Espólios de Ziclague se inspira no Primeiro Livro de Samuel, 30:21–25. Na narrativa, parte do grupo fica para guardar a bagagem enquanto os demais combatem. Quando surge uma disputa pelo espólio, Davi determina que os dois grupos recebam partes iguais. Esse episódio é a fonte literária da habilidade. Na primeira captura de cada cidade inimiga concluída, Davi e seus aliados vivos dividem igualmente 200 de ouro. A regra leva à partida a ideia de compartilhar a recompensa entre quem desempenhou papéis diferentes."
title = "Rei Davi"
lang = "pt-BR"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
