[articles.fr]
text = "La stèle araméenne de Tel Dan, datée du IXe siècle av. J.-C., contient une expression généralement lue comme « maison de David ». Ce monument de basalte commémore les victoires d’un souverain araméen et fait référence aux royaumes d’Israël et de Juda. L’inscription atteste une dynastie associée au nom de David. Elle laisse ouvertes l’étendue de son royaume et l’historicité des épisodes bibliques. Le Deuxième Livre de Samuel présente son accession à la royauté sur Israël comme le résultat d’une alliance avec les anciens à Hébron. Le Butin de Tsiklag s’inspire du Premier Livre de Samuel, 30,21–25. Dans le récit, une partie de la troupe reste auprès des bagages pendant que les autres combattent. Face à une dispute sur le partage, David accorde une part égale aux deux groupes. Cet épisode est la source littéraire de la capacité. La première fois que David capture chaque ville ennemie achevée, 200 pièces d’or sont partagées à parts égales entre lui et ses alliés encore en vie. La règle transpose le partage de la récompense entre des personnes qui ont tenu des rôles différents."
title = "Roi David"
lang = "fr"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
