[articles.fil]
text = "Sa Aramaikong inskripsiyon ng Tel Dan mula sa ikasiyam na siglo BK, may pariralang karaniwang binabasa bilang “Sambahayan ni David”. Ginugunita ng bantayog na basalt ang mga tagumpay ng isang haring Arameo at binabanggit ang mga kaharian ng Israel at Juda. Katibayan ito ng isang dinastiyang iniugnay sa pangalan ni David. Hiwalay na mga usapin ang lawak ng kaniyang kaharian at ang pagiging makasaysayan ng mga pangyayari sa Bibliya. Sa Ikalawang Aklat ni Samuel, nakipagtipan siya sa mga matatanda sa Hebron upang mamuno sa Israel. Hango ang Yaman ng Ziklag sa Unang Aklat ni Samuel 30:21–25. Sa salaysay, may mga naiwang nagbantay ng mga dala-dalahan habang nakipaglaban ang iba. Nang pagtalunan ang paghahati ng nasamsam, ipinasiya ni David na pareho ang bahagi ng dalawang pangkat. Ang salaysay ang pinagkunang pampanitikan ng kakayahan. Sa unang pagsakop ni David sa bawat tapos na lungsod ng kaaway, pantay na hinahati ang 200 ginto sa kaniya at sa mga kakamping buhay pa. Inilalapat nito sa laro ang pagbabahagi ng gantimpala sa mga gumanap ng magkakaibang tungkulin."
title = "Haring David"
lang = "fil"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
