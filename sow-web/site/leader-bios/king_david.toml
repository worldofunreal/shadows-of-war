[articles.es]
text = "La estela aramea de Tel Dan, del siglo IX a. C., contiene una expresión que suele leerse como «Casa de David». El monumento de basalto conmemora victorias de un rey arameo y menciona a las casas gobernantes de Israel y Judá. La referencia ofrece evidencia de que una dinastía estaba asociada con el nombre de David. Por sí sola, la estela deja abiertas preguntas como la extensión de su reino y la historicidad de los episodios bíblicos. En el Segundo Libro de Samuel, su autoridad sobre Israel se establece mediante un pacto con los ancianos en Hebrón. Este relato conserva una tradición sobre la legitimidad de su gobierno. Botín de Siclag toma su idea del Primer Libro de Samuel, 30:21–25. En el relato, parte del grupo se queda custodiando el equipaje mientras el resto combate. Ante la disputa por el reparto, David concede a ambos grupos la misma parte. El episodio sirve como fuente literaria de la habilidad. La primera vez que David captura cada ciudad enemiga terminada, se reparten 200 de oro por igual entre él y sus aliados vivos. La regla lleva a la partida el principio de compartir la recompensa con quienes cumplieron papeles distintos."
title = "Rey David"
lang = "es"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
intro = ["La estela aramea de Tel Dan, del siglo IX a. C., contiene una expresión que suele leerse como «Casa de David». El monumento de basalto conmemora victorias de un rey arameo y menciona a las casas gobernantes de Israel y Judá. La referencia ofrece evidencia de que una dinastía estaba asociada con el nombre de David. Por sí sola, la estela deja abiertas preguntas como la extensión de su reino y la historicidad de los episodios bíblicos. En el Segundo Libro de Samuel, su autoridad sobre Israel se establece mediante un pacto con los ancianos en Hebrón. Este relato conserva una tradición sobre la legitimidad de su gobierno."]
