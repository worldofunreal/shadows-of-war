[articles.en]
text = "King David is named in the Aramaic Tel Dan Stele through the phrase commonly read as “House of David,” a dynasty attested in an inscription from the ninth century BCE. That evidence supports the existence of a Davidic ruling house, but it cannot confirm the scale of David’s realm or every episode in later biblical accounts. The Hebrew Bible presents David’s rule as emerging through a political pact with Israel’s elders at Hebron. The literary seed for Spoils of Ziklag is 1 Samuel 30:21–25. In that account David insists that men who stayed with the baggage receive a share alongside those who fought. The game represents that distribution by splitting 200 gold equally between David and his living allies on the first capture of each completed enemy city. The biblical account is the narrative source for the design, not archaeological confirmation of the episode."
title = "King David"
lang = "en"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
