[articles.ko]
text = "텔단에서 발견된 현무암 비석에는 기원전 9세기의 아람어 비문이 새겨져 있다. 아람 왕의 승리를 기념하는 이 글에는 이스라엘과 유다의 왕이 등장한다. 그중 한 구절은 일반적으로 ‘다윗의 집’으로 해석된다. 이 이름은 다윗과 관련된 왕조가 성서 밖의 기록에도 등장한다는 증거다. 비문이 다루는 전쟁은 그 왕조의 이름이 유래한 인물보다 뒤의 시기에 일어났다. 비문을 통해 당시 주변 왕국이 사용한 왕조의 이름을 알 수 있지만 다윗이 다스렸던 나라의 크기나 성서의 각 사건에는 별도의 증거가 필요하다. 사무엘하 5장은 이스라엘의 장로들이 헤브론에서 다윗과 언약을 맺고 그를 왕으로 세웠다고 전한다. 이 이야기는 왕의 권위가 장로들의 인정과 합의를 통해 세워졌다는 전승을 담고 있다. ‘시글락의 전리품’은 사무엘상 30장 21~25절에서 착안했다. 이 이야기에서는 다윗과 함께 나선 사람들 가운데 일부가 뒤에 남아 짐을 지키고, 나머지는 계속 나아가 전투에 참여한다. 두 무리가 다시 만났을 때 싸우러 간 사람들에게만 전리품을 주자는 의견이 나온다. 다윗은 짐을 지킨 사람들에게도 전투에 나간 사람과 같은 몫을 주도록 한다. 이 대목에서 다윗은 서로 다른 역할을 한 사람들의 몫을 결정하는 인물로 그려진다. 그 사건을 설명하는 자료는 성서의 이야기이며 텔단 비문은 왕조 이름에 대한 별개의 증거다. 게임에서는 다윗이 완성된 적 도시를 처음 점령할 때마다 자신과 살아 있는 동맹들이 금 200을 똑같이 나눠 갖는다. 분배하는 금의 총량은 일정하고, 그 순간 살아 있는 동맹의 수에 따라 각자 받는 몫이 달라진다. 도시의 상태와 첫 점령 여부로 언제 공동 보상이 발생하는지 확인할 수 있다."
title = "다윗 왕"
lang = "ko"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
