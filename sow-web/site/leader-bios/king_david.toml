[articles.tr]
text = "MÖ dokuzuncu yüzyıla tarihlenen Aramice Tel Dan Steli’nde genellikle “Davut Hanedanı” olarak okunan bir ifade vardır. Bazalt anıt, bir Arami hükümdarının zaferlerini anar ve İsrail ile Yahuda krallıklarına değinir. Yazıt, Davut adıyla anılan bir hanedanın varlığına kanıt sunar. Davut’un ülkesinin sınırları ve kutsal metinlerde anlatılan olayların tarihsel niteliği açık sorulardır. İkinci Samuel kitabına göre Davut, Hebron’da İsrail’in ileri gelenleriyle bir antlaşma yaparak hükümdar oldu. Ziklag Ganimeti, Birinci Samuel kitabının 30:21–25 ayetlerindeki anlatıdan esinlenir. Anlatıda grubun bir bölümü yükleri korumak için geride kalır, diğerleri savaşa gider. Ganimet konusunda anlaşmazlık çıkınca Davut iki gruba eşit pay verilmesini ister. Bu bölüm yeteneğin edebî kaynağıdır. Davut, tamamlanmış her düşman şehrini ilk kez ele geçirdiğinde, 200 altın kendisiyle hayattaki müttefikleri arasında eşit bölüşülür. Oyun kuralı, farklı görevleri üstlenenlerin ortak ödülden pay alması fikrini kullanır."
title = "Kral Davut"
lang = "tr"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
