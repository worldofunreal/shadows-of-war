[articles.zh-CN]
text = "泰勒丹出土的一块玄武岩石碑残片上刻有公元前九世纪的亚兰语铭文。第一块残片于1993年从泰勒丹的一段古墙中出土，次年找到的另外两块残片后来与其关联起来。铭文纪念一位亚兰君主的战功，并提到当时以色列和犹大的君主。其中一个词组通常被释读为「大卫家」。这为研究以大卫命名的王室提供了经文以外的依据。石碑记载的是立碑者所处年代的战争，与它所提到的王室早期历史之间还有一段时间。史家可以依据铭文判断一个王室名称当时已在使用，而大卫本人统治时的疆域、军力和具体事迹仍需要其他证据。《撒母耳记下》第五章说，以色列长老在希伯仑与大卫立约，拥立他为王。这一叙事把君主的地位与各群体对他的承认联系起来，保存了后世理解大卫王权的一种传统。考古材料与经文各有成书背景，分别有助于考察王室称谓和有关大卫的叙事。 「洗革拉的战利品」以《撒母耳记上》三十章二十一至二十五节为灵感。故事写道，队伍中有人留在后方看守行装，其余的人继续前行并参加战斗。众人重新会合后，有人主张把战利品留给出战的人，引起关于怎样分配的争议。故事中的大卫主张看守行装的人也应领取相同的一份。行军中的职责不同，但按他定下的分配方式，留守的人同样得到回报。叙事以队伍内部如何处理战果为重点，也表现了大卫怎样裁决这一争议。泰勒丹石碑能说明大卫家的名称见于另一国君主留下的铭文，关于这场争议的情节则来自经文。在游戏中，大卫首次占领每一座已完工的敌方城市时，自己和仍在场上的盟友平分二百金币。每个合资格的玩家得到相同的一份，参与分配的人数决定各自实际取得的金币。触发条件以夺取一座已经完工的城市为准，帮助玩家判断这笔共同奖励何时发生。这里的城市与金币来自游戏规则，分配的原则则来自洗革拉故事。"
title = "大卫王"
lang = "zh-CN"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
