[articles.it]
text = "La stele aramaica di Tel Dan, datata al IX secolo a.C., contiene un’espressione generalmente interpretata come «casa di Davide». Il monumento in basalto celebra le vittorie di un sovrano arameo e fa riferimento ai regni di Israele e di Giuda. L’iscrizione attesta una dinastia associata al nome di Davide. Restano aperte le domande sull’estensione del suo regno e sulla storicità degli episodi biblici. Il Secondo libro di Samuele presenta il suo governo su Israele come il risultato di un patto con gli anziani a Ebron. Bottino di Ziklag si ispira al Primo libro di Samuele, 30,21–25. Nel racconto, una parte del gruppo rimane a custodire i bagagli mentre gli altri combattono. Quando nasce una disputa sulla spartizione, Davide assegna la stessa quota a entrambi i gruppi. L’episodio è la fonte letteraria dell’abilità. La prima volta che Davide conquista ciascuna città nemica completa, 200 oro vengono divisi in parti uguali fra lui e gli alleati ancora in vita. La regola traduce nel gioco la condivisione della ricompensa tra chi ha svolto compiti diversi."
title = "Re Davide"
lang = "it"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
