[articles.ar]
text = "تحمل مسلة تل دان الآرامية، المؤرخة إلى القرن التاسع قبل الميلاد، عبارة تُقرأ عادةً «بيت داود». ويخلد هذا النصب البازلتي انتصارات حاكم آرامي ويشير إلى مملكتي إسرائيل ويهوذا. وتقدم العبارة دليلاً على سلالة حاكمة ارتبطت باسم داود. أما مساحة مملكته وتاريخية تفاصيل الروايات الكتابية فتبقيان مسألتين مفتوحتين. ويصور سفر صموئيل الثاني توليه الحكم على إسرائيل بوصفه ثمرة عهد مع الشيوخ في حبرون. تستلهم قدرة «غنائم صقلغ» رواية سفر صموئيل الأول، الإصحاح 30، الآيات 21–25. يبقى بعض رجال داود لحراسة الأمتعة بينما يذهب الباقون للقتال. وعندما ينشب خلاف على القسمة، يقرر داود إعطاء الفريقين نصيباً متساوياً. وهذه القصة هي المصدر الأدبي للقدرة. عندما يحتل داود كل مدينة عدو مكتملة للمرة الأولى، تُقسَّم 200 قطعة ذهبية بالتساوي بينه وبين حلفائه الأحياء. هكذا تتحول فكرة تقاسم المكافأة بين أصحاب الأدوار المختلفة إلى قاعدة في اللعبة."
title = "الملك داود"
lang = "ar"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
