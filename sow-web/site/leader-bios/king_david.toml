[articles.vi]
text = "Bia đá Tel Dan khắc tiếng Aram vào thế kỷ IX TCN có một cụm từ thường được đọc là “nhà David”. Tấm bia bazan kỷ niệm chiến thắng của một vị vua Aram và nhắc đến các vương quốc Israel và Judah. Dòng chữ là bằng chứng về một vương triều gắn với tên David. Phạm vi vương quốc của ông và tính xác thực của từng tình tiết trong Kinh Thánh vẫn là những câu hỏi riêng. Sách Samuel thứ hai kể rằng David lập giao ước với các trưởng lão tại Hebron để trở thành vua của Israel. Chiến lợi phẩm Ziklag lấy ý tưởng từ sách Samuel thứ nhất, 30:21–25. Trong câu chuyện, một số người ở lại giữ hành lý trong khi những người khác tham chiến. Khi có tranh cãi về chiến lợi phẩm, David quyết định hai nhóm được chia phần bằng nhau. Câu chuyện là nguồn văn học của kỹ năng. Lần đầu chiếm mỗi thành phố địch đã hoàn tất, David và các đồng minh còn sống chia đều 200 vàng. Quy tắc thể hiện việc chia phần thưởng cho những người đảm nhiệm các vai trò khác nhau."
title = "Vua David"
lang = "vi"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
shortArticle = true
intro = ["Bia đá Tel Dan khắc tiếng Aram vào thế kỷ IX TCN có một cụm từ thường được đọc là “nhà David”. Tấm bia bazan kỷ niệm chiến thắng của một vị vua Aram và nhắc đến các vương quốc Israel và Judah. Dòng chữ là bằng chứng về một vương triều gắn với tên David. Phạm vi vương quốc của ông và tính xác thực của từng tình tiết trong Kinh Thánh vẫn là những câu hỏi riêng. Sách Samuel thứ hai kể rằng David lập giao ước với các trưởng lão tại Hebron để trở thành vua của Israel."]
sections = [{ title = "Chia chiến lợi phẩm", paragraphs = ["Chiến lợi phẩm Ziklag lấy ý tưởng từ sách Samuel thứ nhất, 30:21–25. Trong câu chuyện, một số người ở lại giữ hành lý trong khi những người khác tham chiến. Khi có tranh cãi về chiến lợi phẩm, David quyết định hai nhóm được chia phần bằng nhau. Câu chuyện là nguồn văn học của kỹ năng. Lần đầu chiếm mỗi thành phố địch đã hoàn tất, David và các đồng minh còn sống chia đều 200 vàng. Quy tắc thể hiện việc chia phần thưởng cho những người đảm nhiệm các vai trò khác nhau."] }]
sources = [{ title = "Tel Dan Stele, The Jewish Museum", url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/" }, { title = "II Samuel 5:1–3, Sefaria", url = "https://www.sefaria.org/II_Samuel.5.1-3" }, { title = "1 Samuel 30:21–25, Bible Gateway", url = "https://www.biblegateway.com/passage/?search=1%20Samuel%2030%3A21-25&version=NIV" }]

[articles.id]
text = "Prasasti Tel Dan yang berbahasa Aram berasal dari abad kesembilan SM dan memuat ungkapan yang lazim dibaca sebagai “wangsa Daud”. Monumen basal itu memperingati kemenangan seorang penguasa Aram dan menyebut kerajaan Israel dan Yehuda. Tulisan tersebut menjadi bukti adanya dinasti yang dikaitkan dengan nama Daud. Luas kerajaan Daud dan kesejarahan setiap peristiwa dalam Alkitab tetap merupakan pertanyaan tersendiri. Kitab Dua Samuel menggambarkan Daud memperoleh kekuasaan atas Israel melalui perjanjian dengan para tetua di Hebron. Rampasan Ziklag mengambil gagasannya dari Kitab Satu Samuel 30:21–25. Dalam kisah itu, sebagian orang tinggal untuk menjaga barang bawaan sementara yang lain maju bertempur. Ketika pembagian rampasan diperdebatkan, Daud menetapkan bagian yang sama bagi kedua kelompok. Kisah itu menjadi sumber sastra bagi kemampuan tersebut. Pada perebutan pertama setiap kota musuh yang sudah selesai dibangun, Daud dan sekutunya yang masih hidup membagi rata 200 emas. Aturan ini mengadaptasi gagasan berbagi imbalan di antara orang-orang yang menjalankan tugas berbeda."
title = "Raja Daud"
lang = "id"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
