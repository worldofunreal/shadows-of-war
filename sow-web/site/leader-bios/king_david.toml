[articles.ja]
text = "テル・ダンで発掘された玄武岩の石碑には、紀元前九世紀のアラム語の碑文が刻まれている。アラムの王の戦勝を伝える碑文はイスラエルとユダの王に言及し、その一節は一般に「ダビデの家」と読まれる。この名称は、ダビデと結び付いた王朝が聖書の外の資料にも現れることを示す。石碑が伝える戦いと、王朝の名の由来になった人物の生涯との間には時間の隔たりがある。碑文からはダビデの王国の大きさや、後世に語られた個々の出来事までは確かめられない。『サムエル記下』の第五章では、ダビデがヘブロンでイスラエルの長老と契約を結び、王として迎えられたと語られる。これは、王の立場が長老との合意によって成立したとする伝承である。石碑は王朝名を知るための証拠であり、聖書の記述は王の権威をどう語り継いだかを示す。 「ツィクラグの戦利品」は『サムエル記上』三十章二十一節から二十五節の物語に着想を得ている。そこでは、ダビデの一行の一部が荷物のそばに残り、残りの者が戦いに向かう。合流した後、戦闘に出た者だけが戦利品を受け取るべきだという声が上がる。ダビデは、荷物を守った者にも戦った者と同じ取り分を与えるように決める。この箇所では、役割の異なる人々の間で利益をどう分けるかが争点になっている。ダビデは分配を裁定する人物として描かれる。この出来事は石碑に記録されておらず、ゲームの能力は聖書に伝わる分配の考え方を取り入れている。プレイ中、完成済みの敵都市を初めて占領するたびに、金200がダビデと生存中の同盟者に等分される。分配される総額は一定で、その場で生き残っている同盟者の数に応じて一人当たりの額が決まる。都市の占領を条件とすることで、分配が起きる時点を試合中に確認できる。"
title = "ダビデ王"
lang = "ja"
url = "https://thejewishmuseum.org/exhibitions/tel-dan-stele/"
