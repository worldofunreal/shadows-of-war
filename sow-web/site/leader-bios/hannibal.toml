[articles.en]
text = "Hannibal was a Carthaginian general and statesman who commanded the forces of Carthage in their battle against the Roman Republic during the Second Punic War. Hannibal lived during a period of great tension in the Mediterranean Basin, triggered by the emergence of the Roman Republic as a great power with its defeat of Carthage in the First Punic War."
title = "Hannibal"
lang = "en"
url = "https://en.wikipedia.org/wiki/Hannibal"
intro = [
  "Hannibal (; Punic: 𐤇𐤍𐤁𐤏𐤋; 247 – between 183 and 181 BC) was a Carthaginian general and statesman who commanded the forces of Carthage in their battle against the Roman Republic during the Second Punic War. Hannibal lived during a period of great tension in the Mediterranean Basin, triggered by the emergence of the Roman Republic as a great power with its defeat of Carthage in the First Punic War. Revanchism prevailed in Carthage, symbolized by the pledge that Hannibal made to his father to \"never be a friend of Rome\".",
  "In 218 BC Hannibal attacked Saguntum (modern Sagunto, Spain), an ally of Rome in Hispania, and this attack sparked the Second Punic War. Hannibal invaded Italy by crossing the Alps with North African war elephants. In his first few years in Italy, as the leader of a Carthaginian and partially Celtic army, he won a succession of victories at the battles of Ticinus, Trebia, Lake Trasimene, and Cannae, inflicting heavy losses on the Romans. Hannibal was distinguished for his ability to determine both his and his opponent's respective strengths and weaknesses and to plan battles accordingly. His well-planned strategies allowed him to conquer and ally with several Italian cities that were previously allied to Rome. Hannibal occupied most of southern Italy for 15 years. The Romans, led by Fabius Maximus, avoided directly engaging him, instead waging a war of attrition (the Fabian strategy). Carthaginian defeats in Hispania prevented Hannibal from being reinforced, and he was unable to win a decisive victory. A counter-invasion of North Africa, led by the Roman general Scipio Africanus, forced him to return to Carthage. Hannibal was defeated at the Battle of Zama, ending the war in a Roman victory.",
  "After the war, Hannibal successfully ran for the office of sufet. He enacted political and financial reforms to enable the payment of the war indemnity imposed by Rome. Those reforms were unpopular with members of the Carthaginian aristocracy and in Rome, and he fled into voluntary exile. During this time, he lived at the Seleucid court, where he acted as military advisor to Antiochus III the Great in his war against Rome. Antiochus met defeat at the Battle of Magnesia and was forced to accept Rome's terms, and Hannibal fled again, making a stop in the Kingdom of Armenia. His flight ended in the court of Bithynia. He was betrayed to the Romans and, poisoning himself, died by suicide.",
  "Hannibal is considered one of the greatest military tacticians and generals of western antiquity, alongside Alexander the Great, Julius Caesar, Scipio Africanus, and Pyrrhus. According to Plutarch, Scipio asked Hannibal \"who the greatest general was\", to which Hannibal replied \"either Alexander or Pyrrhus, then myself\".",
]
sections = [
  { "title" = "Name", "paragraphs" = [
      "Hannibal was a common Semitic Phoenician-Carthaginian personal name. It is recorded in Carthaginian sources as ḥnbʿl (Punic: 𐤇𐤍𐤁𐤏𐤋). It is a combination of the common Phoenician masculine given name Hanno with the Northwest Semitic Canaanite deity Baal Hammon (lit. 'lord') a major god of the Carthaginian's ancestral homeland of Phoenicia in Western Asia. Its precise vocalization remains a matter of debate. Suggested readings include Ḥannobaʿal, Ḥannibaʿl, or Ḥannibaʿal, meaning \"Baʿal/The lord is gracious\", \"Baʿal Has Been Gracious\", or \"The Grace of Baʿal\".",
      "Greek historians rendered the name as Anníbas (Ἀννίβας). The Phoenicians and Carthaginians, like many West Asian Semitic peoples, did not use hereditary surnames but were typically distinguished from others bearing the same name using patronymics or epithets. Although he is by far the most famous Hannibal, when further clarification is necessary he is usually referred to as \"Hannibal, son of Hamilcar\"; \"Hannibal the Barcid\", to his father, Hamilcar Barca; or very frequently, \"Hannibal Barca\". Barca (Punic: 𐤁𐤓𐤒, brq) is a Semitic cognomen meaning \"lightning\" or \"thunderbolt\", a surname acquired by Hamilcar on account of the swiftness and ferocity of his attacks. Barca is cognate with similar names for lightning found among the Israelites, Assyrians, Babylonians, Arameans, Arabs, Amorites, Moabites, Edomites and other fellow Asiatic Semitic peoples.",
      "Although they did not inherit the surname from their father, Hamilcar's progeny are collectively known as the Barcids. Modern historians occasionally refer to Hannibal's brothers as Hasdrubal Barca and Mago Barca to distinguish them from the multitudes of other Carthaginians named Hasdrubal and Mago, but this practice is ahistorical and is rarely applied to Hannibal.",
    ] },
  { "title" = "Background and early career", "paragraphs" = [
      "Hannibal was one of the sons of Carthaginian general and statesman Hamilcar Barca and an unknown mother. He was most likely born in Carthage, one of many Mediterranean regions colonised by the Canaanites from their homeland in Phoenicia. He had several sisters whose names are unknown and two brothers, Hasdrubal and Mago. His brothers-in-law were Hasdrubal the Fair and the Numidian king Naravas. He was still a child when his sisters married, and his brothers-in-law were close associates during his father's struggles in the Mercenary War and the Punic conquest of the Iberian Peninsula.",
      "After Carthage's defeat in the First Punic War, Hamilcar set out to improve his family's and Carthage's fortunes. With that in mind and supported by Gades, Hamilcar began the subjugation of the tribes of the Iberian Peninsula. Carthage was in such a poor state at the time that it lacked a navy able to transport his army; instead, Hamilcar had to march his forces across Numidia towards the Pillars of Hercules and then cross the Strait of Gibraltar.",
      "According to Polybius, Hannibal much later said that when he came upon his father and begged to go with him, Hamilcar agreed and demanded that Hannibal swear that he would never be a friend of Rome as long as he lived. There is even an account of him at a very young age (9 years old) begging his father to take him to an overseas war. In the story, Hamilcar brought him to a sacrificial chamber. Hamilcar held Hannibal over the fire roaring in the chamber and made him swear that he would never be a friend of Rome. Other sources report that Hannibal told his father, \"I swear so soon as age will permit...I will use fire and steel to arrest the destiny of Rome.\" According to the tradition, Hannibal's oath took place in Peñíscola.",
    ] },
  { "title" = "Second Punic War in Italy (218–204 BC)", "paragraphs" = [
      "A campaign to Italy was originally planned by Hasdrubal, who was stationed in the Iberian Peninsula for eight years until 221 BC. Soon, the Romans became aware of an alliance between Carthage and the Celts of the Po Valley in northern Italy. When Hannibal arrived in the Po Valley, roughly 10,000 Celtic tribesmen joined his army. The Celts were amassing forces to invade farther south in Italy, presumably with Carthaginian backing. Therefore, the Romans pre-emptively invaded the Po region in 225 BC. By 220 BC the Romans had annexed the area as Cisalpine Gaul. Hasdrubal was assassinated around the same time (221 BC), bringing Hannibal to the fore.",
      "Hannibal departed Cartagena, Spain (New Carthage) in late spring of 218 BC. He fought his way through the northern tribes to the foothills of the Pyrenees, subduing the tribes through clever mountain tactics and stubborn fighting. He left a detachment of 20,000 troops to garrison the conquered region. At the Pyrenees, he released 11,000 Iberian troops who showed reluctance to leave their homeland. Hannibal reportedly entered Gaul with 40,000 foot soldiers and 12,000 horsemen.",
      "Hannibal recognized that he still needed to cross the Pyrenees, the Alps, and many large rivers. Additionally, he would have to contend with opposition from the Gauls, whose territory he passed through. Starting in the spring of 218 BC, he crossed the Pyrenees, and by conciliating the Gaulish chiefs along his passage before the Romans could take any measures to bar his advance, he was able to reach the Rhône by September. Hannibal's army numbered 38,000 infantry, 8,000 cavalry, and 38 elephants, almost none of which would survive the harsh conditions of the Alps.",
    ] },
  { "title" = "Conclusion of the Second Punic War (203–201 BC)", "paragraphs" = [
      "In 203 BC, after nearly 15 years of fighting in Italy and with the military fortunes of Carthage rapidly declining, Hannibal was recalled to Carthage to direct the defense of his native country against a Roman invasion under Scipio Africanus. After leaving a record of his expedition engraved in Punic and Greek upon bronze tablets in the Temple of Juno Lacinia at Crotona, he sailed back to Africa. His arrival immediately restored the predominance of the war party, which placed him in command of a combined force of African levies and his mercenaries from Italy. In 202 BC Hannibal met Scipio in a fruitless peace conference.",
      "Despite mutual admiration, negotiations floundered due to Roman allegations of \"Punic Faith,\" referring to the breach of protocols that ended the First Punic War by the Carthaginian attack on Saguntum and an attack on a stranded Roman fleet. Scipio and Carthage had worked out a peace plan, which was approved by Rome. The terms of the treaty were quite modest, but the war had been long for the Romans. Carthage could keep its African territory but would lose its overseas empire. Numidia was to be independent. Also, Carthage was to reduce its fleet and pay a war indemnity. Carthage then made a terrible blunder. Its long-suffering citizens had captured a stranded Roman fleet in the Gulf of Tunis and stripped it of supplies, an action that aggravated the faltering negotiations. Fortified by both Hannibal and the supplies, the Carthaginians rebuffed the treaty and Roman protests.",
      "Unlike most battles of the Second Punic War, at Zama the Romans were superior in cavalry and the Carthaginians had the edge in infantry. This Roman cavalry superiority was due to the betrayal of King Masinissa of Numidia, who had earlier assisted Carthage in Iberia but changed sides in 206 BC with the promise of land, and due to his personal conflicts with Syphax, a Carthaginian ally. Although the ageing Hannibal was suffering from mental exhaustion and deteriorating health after years of campaigning in Italy, the Carthaginians still had the advantage in numbers and were boosted by 80 war elephants.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Hannibal caused great distress to many in Roman society. He became such a figure of terror that whenever disaster threatened, Romans would exclaim \"Hannibal ad portas\" (\"Hannibal is at the gates!\") to emphasize the gravity of the emergency, a phrase still used in modern languages.",
      "His legacy was recorded by his Greek tutor, Sosylus of Lacedaemon. The works of Roman writers such as Livy (64 or 59 BC – AD 12 or 17), Frontinus (c. AD 40–103), and Juvenal (1st–2nd century AD) show a grudging admiration for Hannibal. The Romans even built statues of him in the streets of Rome to advertise their defeat of such a worthy adversary. It is plausible to suggest that Hannibal engendered the greatest fear Rome had towards an enemy. Nevertheless, the Romans grimly refused to admit the possibility of defeat and rejected all overtures for peace; they even refused to accept the ransom of prisoners after the Battle of Cannae.",
      "During the war there are no reports of revolutions among the Roman citizens, no factions within the Senate desiring peace, no pro-Carthaginian Roman turncoats, and no coups. Throughout the war, Roman aristocrats ferociously competed with each other for positions of command to fight against Rome's most dangerous enemy. Hannibal's military genius was not enough to really disturb the Roman political process and the collective political and military capacity of the Roman people. As Lazenby states,",
    ] },
]

[articles.es]
text = "Aníbal Barca (en fenicio: 𐤇𐤍𐤁𐤏𐤋, Hanni-baʾal, «quien goza del favor de Baal»​​​ y 𐤁𐤓𐤒, Barqa, «rayo»;​ 247-183 a. C.) fue un general y estadista cartaginés."
title = "Aníbal"
lang = "es"
url = "https://es.wikipedia.org/wiki/An%C3%ADbal"
intro = [
  "Aníbal Barca (en fenicio: 𐤇𐤍𐤁𐤏𐤋, Hanni-baʾal, «quien goza del favor de Baal»​​​ y 𐤁𐤓𐤒, Barqa, «rayo»;​ 247-183 a. C.) fue un general y estadista cartaginés. El historiador militar Theodore Ayrault Dodge le llamó «padre de la estrategia».​ Fue admirado incluso por sus enemigos —Cornelio Nepote le bautizó como «el más grande de los generales»—;​ de hecho, su mayor enemigo, Roma, adaptó ciertos elementos de sus tácticas militares a su propio acervo estratégico. Su legado militar le confirió una sólida reputación en el mundo moderno y ha sido considerado como un gran estratega por Arthur Wellesley, militar y I duque de Wellington. Su vida ha sido objeto de muchas películas y documentales. Según todos estos comentarios de los historiadores, Aníbal era un excelente estratega como varios otros personajes: Alejandro Magno, Julio César o Napoleón Bonaparte.",
  "Su vida transcurrió en el conflictivo período en el que República romana estableció su supremacía en la cuenca mediterránea, en perjuicio de otras potencias como la propia República cartaginesa, Macedonia, Siracusa y el Imperio seléucida. Fue el general más activo de la segunda guerra púnica, en la que llevó a cabo una de las hazañas militares más audaces de la Antigüedad: Aníbal y su ejército, en el que se incluían treinta y ocho elefantes de guerra, partieron de Hispania y atravesaron los Pirineos y los Alpes con el objetivo de conquistar el norte de Italia, esta aventura le costó la pérdida de su ojo derecho. Allí derrotó a los romanos en grandes batallas campales como la del río Trebia, la del lago Trasimeno o la de Cannas, que aún se estudia en academias militares en la actualidad. A pesar de su brillante movimiento, Aníbal no llegó a entrar en Roma. Existen diversas opiniones entre los historiadores que van desde carencias materiales de Aníbal en máquinas de asedio a consideraciones políticas que defienden que la intención de Aníbal no era tomar Roma, sino obligarla a rendirse.​ No obstante, Aníbal logró mantener un ejército en Italia durante más de una década, recibiendo escasos refuerzos. Tras la invasión de África por parte de Escipión el Africano, el Senado púnico lo llamó de vuelta a Cartago, donde fue finalmente derrotado por Escipión en la batalla de Zama.",
  "Acabada la guerra contra Roma, entró en la vida pública cartaginesa. Se enfrentó a la oligarquía dirigente, que lo acusó ante los romanos de estar en tratos con el seléucida Antíoco III el Grande, por lo que hubo de exiliarse en el año 195 a. C. Pasó al servicio de este último monarca, a cuyas órdenes se enfrentó de nuevo a la República romana en la batalla del Eurimedonte, donde fue derrotado. Una vez más huido, se refugió en la corte de Prusias I, rey de Bitinia. Los romanos exigieron al bitinio que entregara al cartaginés, a lo que el rey accedió. Sin embargo, antes de ser capturado, Aníbal prefirió suicidarse.",
]
sections = [
  { "title" = "Antecedentes históricos", "paragraphs" = [
      "A mediados del siglo III a. C., la ciudad de Cartago, donde nació Aníbal,​ estaba fuertemente influida por la cultura helenística derivada de los vestigios del Imperio de Alejandro Magno.​ Cartago ocupaba por entonces un lugar importante en los intercambios comerciales de la cuenca mediterránea, y en los emporios de Sicilia, Cerdeña y en las costas de Iberia y de África del Norte. La ciudad disponía igualmente una importante flota de guerra que protegía sus rutas marítimas, que transportaban el oro procedente del Golfo de Guinea y el estaño procedente de las costas británicas.",
      "La otra potencia mediterránea de la época era Roma, con la que Cartago entró en guerra durante veinte años en un conflicto conocido como la primera guerra púnica,​ la primera guerra de gran envergadura de la que Roma salió victoriosa. Este enfrentamiento entre la República de Roma y Cartago estuvo provocado por un conflicto secundario en Siracusa, y se desarrolló por tierra y mar, en tres fases: combates en Sicilia (264-256 a. C.), combates en África (256-250 a. C.) y de nuevo en Sicilia (250-241 a. C.). Durante esta última fase, y sobre todo tras la guerra, nació la fama de Amílcar Barca, padre de Aníbal, que dirigía la guerra contra Roma desde el año 247 a. C. Tras la gran derrota naval en las islas Egadas, al noroeste de Sicilia, los cartagineses se vieron obligados a firmar el Tratado de Lutacio en la primavera de 241 a. C. con el cónsul Cayo Lutacio Cátulo.​ Entre los términos impuestos a Cartago por este tratado se hallaban la cesión de los territorios de Sicilia y las islas menores entre esta y la costa africana, así como onerosas compensaciones de guerra.​",
      "A finales de la primera guerra púnica, a pesar de las precauciones adoptadas por Amílcar Barca, Cartago halló problemas a la hora de dispersar a sus regimientos armados de mercenarios, que no tardaron en asediar la ciudad y provocar un conflicto de la envergadura de una guerra civil.​ Este episodio histórico es conocido como la guerra de los Mercenarios. Amílcar consiguió reprimir esta rebelión después de tres años, tras vencer a los rebeldes en el río Bagradas y de nuevo, con un gran derramamiento de sangre, en el desfiladero de la Sierra​ en el 237 a. C. Por su parte, Roma había aprovechado la falta de oposición para tomar Cerdeña, anteriormente en manos de los cartagineses.​ Tras la protesta de Cartago por esta acción, que suponía una violación de los términos del tratado de paz recientemente alcanzado, Roma le declara la guerra, pero se ofrece a anularla si se le entrega no solo Cerdeña, sino también Córcega y más compensaciones económicas. Los púnicos, impotentes, tienen que ceder, y ambas islas se convierten en el 238 a. C. en nuevas posesiones romanas. Para compensar esta pérdida, Amílcar marchó a Iberia, donde se apoderó de vastos territorios al sudeste del país. Durante una década, Amílcar dirigió la conquista del sur de Iberia, apoyado militar y logísticamente por su yerno Asdrúbal.​ Esta conquista restablecía la situación económica de Cartago, gracias a la explotación de las minas de plata y estaño.",
    ] },
  { "title" = "Ascensión", "paragraphs" = [
      "Aníbal Barca nació probablemente en Cartago en el año 247 a. C. Era el hijo mayor del general Amílcar Barca. Aunque «Barca» no era un apellido, sino un apelativo (de barqä, \"rayo\" en lengua púnica), fue adoptado como tal por sus hijos.​ Los historiadores designan a la familia de Amílcar con el nombre de Bárcidas, a fin de evitar la confusión con otras familias cartaginesas con los mismos nombres (Aníbal, Asdrúbal, Amílcar, Magón, etc.).",
      "Sobre la educación de Aníbal es poco lo recogido por los autores grecorromanos. Se sabe que aprendió de un preceptor espartano, llamado Sosilos, las letras griegas,​ la historia de Alejandro Magno y el arte de la guerra. Así adquirió el modo de razonamiento y de acción que los griegos llamaban «métis», fundado en la inteligencia y la astucia.",
      "Después de haber incrementado su territorio, Amílcar enriqueció a su familia, y por extensión a Cartago.​ Al perseguir dicho objetivo, Amílcar se apoyó en la ciudad fenicia de Gadir (actual Cádiz, España), próxima al estrecho de Gibraltar, y comenzó a someter a las tribus íberas. En aquel momento, Cartago se hallaba en tal estado de empobrecimiento que su marina era incapaz de transportar al ejército a Hispania. Amílcar se vio, pues, obligado a hacerlo marchar hacia las Columnas de Hércules a pie, para cruzar allí en barco el estrecho de Gibraltar, entre lo que actualmente serían Marruecos y España.",
    ] },
  { "title" = "Segunda guerra púnica", "paragraphs" = [
      "Después de que los cartagineses asediaran​ y destruyeran​ Sagunto, los romanos decidieron contraatacar en dos frentes: África del Norte e Hispania, partiendo desde Sicilia, isla que les sirvió de base de operaciones. No obstante, Aníbal trastocó los planes de los romanos con una estrategia inesperada: quería llevar la guerra al corazón de Italia, marchando rápidamente a través de Hispania y del sur de la Galia.​ Consciente de que su flota era muy inferior a la de los romanos, Aníbal decidió no atacar por mar, sino que eligió una ruta terrestre mucho más dura y larga pero más interesante tácticamente, pues le permitió reclutar a muchos soldados mercenarios o aliados procedentes de los pueblos celtas dispuestos a combatir a los romanos.​ Antes de su partida, Aníbal distribuyó hábilmente sus efectivos y envió a África del Norte varios contingentes de íberos, mientras que ordenó a los soldados libio-fenicios que garantizaran la seguridad de las posesiones de Cartago en Hispania.​",
      "Los oretanos levantados en armas contra los cartagineses, acuerdan la paz entregando la mano de la princesa de Cástulo, Himilce, que acaba casando con Aníbal, trasladándose ésta a Cartagena y permaneciendo allí durante las campañas de su marido volviendo luego a Cástulo después de que la ciudad pasase al bando romano, murió allí con el hijo de ambos, supuestamente de una epidemia de peste.",
      "Aníbal no partió de Cartagena hasta finales de la primavera del 218 a. C.​​ El general puso en marcha al ejército y envió representantes para negociar su paso a través de los Pirineos y trabar alianzas con los pueblos que se asentaban a lo largo de su trayecto. Según Tito Livio, Aníbal atravesó el Ebro con 90 000 infantes y 12 000 caballeros,​ y dejó un destacamento de 10 000 infantes y 1000 caballeros para que defendieran Hispania,​ a los que se sumaron 11 000 iberos que se mostraron reticentes a abandonar su territorio.​ Tras su paso por los Pirineos, disponía de 70 000 infantes y 10 000 caballeros. Según otras fuentes, Aníbal llegó a la Galia a la cabeza de 40 000 infantes y 12 000 caballeros.​ Es complicado establecer la aproximación de sus efectivos reales. Ciertas estimaciones creen que encabezaba una fuerza de 80 000 hombres. A su llegada a Italia, parece que estaba a la cabeza, según las fuentes, de entre 20 000​ y 50 000​ infantes y de entre 6000​ y 9000​ jinetes. Por otro lado, en varias ocasiones, o como mínimo, al principio de la guerra, Cartago envió refuerzos a Aníbal. Además, a su ejército se sumaron muchos soldados procedentes de tribus. Cerca de 40 000 galos se unieron al ejército cartaginés durante la guerra.​",
    ] },
  { "title" = "Después de Zama", "paragraphs" = [
      "Obligado a firmar un tratado de paz con Roma en 201 a. C.,​ que privaba a Cartago de su antiguo imperio, Aníbal, que entonces contaba con cuarenta y seis años de edad, decidió entrar a formar parte de la vida política cartaginesa dirigiendo el partido democrático.",
      "La ciudad estaba dividida en dos importantes corrientes ideológicas. Primero, el partido democrático, que estaba dirigido por los Bárcidas, y comprometido a continuar con las conquistas en África a expensas de los númidas. El segundo movimiento político estaba basado en la oligarquía conservadora y en la búsqueda de una prosperidad económica basada en el comercio, los impuestos portuarios, y los tributos impuestos a las ciudades subordinadas a Cartago, y agrupado en torno a Hannón el Grande. Elegido sufete en el 196 a. C.,​ Aníbal restauró la autoridad y el poder del Estado, representando así una amenaza para los oligarcas,​ que le acusaron de haber traicionado a su país al no tomar Roma cuando tuvo oportunidad.",
      "Aníbal tomó una medida que lo alejó irremediablemente de los oligarcas. El viejo general legisló que la indemnización impuesta a Cartago por Roma tras la guerra no debía proceder del tesoro, sino de los oligarcas a través de impuestos extraordinarios.​ Los oligarcas no intervinieron directamente contra el sufete sino que, siete años después de la derrota de Zama, realizaron un llamamiento a los romanos​ que, alarmados por la nueva prosperidad de Cartago, exigieron la entrega de Aníbal con el pretexto de una relación epistolar de este último con Antíoco III.​ Aníbal decidió voluntariamente exiliarse​ en el 195 a. C.​",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Con los cartagineses desapareció sin duda el mayor enemigo al que la República romana se había enfrentado.​ Por tanto, el balance personal de Aníbal se traduce en un fracaso. El Mediterráneo occidental se convirtió en un «lago romano» del que Cartago quedaba apartada, mientras que Roma extendió sus dominios por el mundo griego y por Asia.",
      "Pero, al mismo tiempo, y ahí reside la paradoja de su balance, Aníbal trató de romper —a través de sus discursos acerca de la libertad de las ciudades— las alianzas de Roma con las ciudades griegas. De este modo, el general forzó a la República a legitimar sus acciones y a comportarse como una gran potencia imperialista. Por ello, Aníbal ha permanecido en el corazón de la historia griega y romana.",
      "Mucho tiempo después de su muerte, el nombre de Aníbal continuó representando el fantasma de una amenaza perpetua sobre la República de Roma. Se ha escrito que enseñó a los romanos, que se proclamaban fieros descendientes de Marte, el significado del miedo.[cita requerida] Durante generaciones, las matronas romanas continuaron relatando a sus hijos cuentos terroríficos acerca del general cuando se portaban mal. Aníbal simbolizaba de tal manera el miedo que, fuera cual fuera el desastre al que se enfrentaran, era común ver a los senadores romanos gritando Hannibal ad portas (¡Aníbal está a nuestras puertas!) a fin de expresar su ansiedad. Ad Portas (locución latina), evolucionó hasta transformarse en una conocida frase expresada en el momento en que un cliente cruzaba una puerta o cuando alguien tenía que enfrentarse a un desastre.​ Tales expresiones proceden del impacto psicológico que tuvo la presencia de Aníbal sobre la cultura romana en Italia.",
    ] },
]

[articles.fr]
text = "Hannibal Barca (en phénicien : 𐤇𐤍𐤁𐤏𐤋, Hanni-ba'al est un nom théophore signifiant « qui a la faveur de Baal » et Barca, « foudre »), généralement appelé Annibal ou Hannibal, né en 247 av. J.-C."
title = "Hannibal Barca"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Hannibal_Barca"
intro = [
  "Hannibal Barca (en phénicien : 𐤇𐤍𐤁𐤏𐤋, Hanni-ba'al est un nom théophore signifiant « qui a la faveur de Baal » et Barca, « foudre »), généralement appelé Annibal ou Hannibal, né en 247 av. J.-C. à Carthage (au nord-est de l'actuelle Tunis en Tunisie) et mort entre 183 et 181 av. J.-C. en Bithynie (près de l'actuelle Bursa en Turquie), est un général et homme politique carthaginois, considéré comme l'un des plus grands tacticiens militaires de l'Histoire.",
  "Fils d'Hamilcar Barca, le meilleur stratège carthaginois de la première guerre punique, il grandit durant une période de tension dans le bassin méditerranéen, alors que Rome commence à imposer sa puissance en Méditerranée occidentale : après la prise de la Sicile et de la Sardaigne, conséquence de la première guerre punique, les Romains envoient des troupes en Illyrie et poursuivent la colonisation de l'Italie du Nord. Élevé, selon la tradition historiographique latine, dans la haine de Rome, Hannibal est, selon ses ennemis, à l'origine de la deuxième guerre punique que les Anciens appelaient d'ailleurs « guerre d'Hannibal ».",
  "À la fin de l'année 218 av. J.-C., il quitte l'Espagne avec son armée et traverse les Pyrénées, puis, par une aventureuse traversée des Alpes, gagne le Nord de l'Italie et inflige aux Romains une série de défaites écrasantes à La Trébie, au lac Trasimène et à Cannes. Pourtant, il ne parvient pas à prendre Rome. Selon certains historiens, Hannibal ne possède alors pas le matériel nécessaire à l'attaque et au siège de la ville. Pour John Francis Lazenby, ce ne serait pas le manque d'équipements, mais celui de ravitaillement et son ambition politique qui empêchent Hannibal d'attaquer la cité. Selon une autre explication, il espère neutraliser Rome sans combat par la défection des cités italiennes et de Syracuse et l'alliance de Philippe V de Macédoine. Cependant, la stratégie prudente de Fabius le Temporisateur empêche Hannibal de détruire les légions romaines et de s'assurer une emprise solide sur les cités d'Italie. Les renforts amenés d'Espagne par ses frères Hasdrubal Barca puis Magon ne peuvent le rejoindre tandis que le jeune chef romain Scipion attaque ses bases ibériques. Hannibal réussit à maintenir son armée en Italie durant plus d'une décennie sans parvenir à imposer ses conditions aux Romains. Enfin, une armée romaine conduite par Scipion débarque en Afrique punique et force Hannibal à retourner à Carthage où il est finalement défait à la bataille de Zama en 202 av. J.-C.",
  "La guerre terminée, Hannibal se consacre au relèvement de Carthage, réduite à ses possessions africaines, et distribue des terres à ses vétérans. Rome, craignant un retour en force de la puissance carthaginoise, oblige le Sénat de Carthage à l'exiler. Il devient conseiller militaire des rois Antiochos III de Syrie puis Prusias de Bithynie mais un nouvel ultimatum romain le contraint au suicide.",
]
sections = [
  { "title" = "Contexte historique", "paragraphs" = [
      "Au milieu du IIIe siècle av. J.-C., la ville de Carthage, où naît Hannibal, est fortement imprégnée de la culture hellénistique issue des vestiges de l'empire d'Alexandre le Grand. Carthage occupe alors une place prépondérante dans les échanges commerciaux du bassin méditerranéen et possède notamment des comptoirs en Sicile, en Sardaigne, sur les côtes de l'Hispanie et en Afrique du Nord. Elle dispose également d'une importante flotte de guerre qui assure la sécurité des routes maritimes empruntées par ses marchands : vers Alexandrie au sud de la Méditerranée, vers l'Espagne à l'ouest, où se trouvent les mines d'argent propres à régler le tribut exigé par Rome après la première guerre punique.",
      "L'autre puissance méditerranéenne de cette époque est Rome, avec laquelle Carthage entre en conflit pendant une vingtaine d'années lors de la première guerre punique (« punique » est un adjectif dérivé de « phénicien » utilisé pour désigner les Carthaginois), première guerre d'envergure dont Rome sort victorieuse. Cet affrontement entre la République romaine et Carthage est provoqué par un conflit secondaire à Syracuse. Il est marqué par trois phases sur des terrains d'opérations terrestres et maritimes : en Sicile (264 av. J.-C.-256 av. J.-C.), en Afrique (256 av. J.-C.-250 av. J.-C.) et à nouveau en Sicile (250 av. J.-C.-241 av. J.-C.). C'est lors de cette dernière phase, puis surtout après la guerre, que Hamilcar Barca, père d'Hannibal, qui dirige la guerre contre Rome depuis 247 av. J.-C., se fait connaître. Après une défaite navale aux îles Égades au nord-ouest de la Sicile, il doit, au printemps 241 av. J.-C., signer un traité avec le consul romain Caius Lutatius Catulus. Cet accord impose à Carthage de quitter la Sicile mais lui permet de conserver sa flotte.",
      "Au lendemain de la première guerre punique, malgré les précautions prises par Hamilcar Barca, Carthage rencontre des difficultés pour disperser ses troupes de mercenaires, qui ne tardent pas à assiéger la ville. Cet épisode est connu comme la guerre des Mercenaires. Hamilcar parvient à réprimer cette révolte dans le sang au défilé de la Scie en 237 av. J.-C. Rome, n'ayant plus d'opposition, s'empare de la Sardaigne qui appartient aux Carthaginois. Pour compenser cette perte, Hamilcar passe en Hispanie où il s'empare d'un vaste territoire au sud-est du pays. Pendant une dizaine d'années, Hamilcar mène la conquête du Sud de l'Hispanie, assisté de son gendre Hasdrubal. Cette conquête rétablit la situation financière de Carthage grâce à l'exploitation des mines d'argent et d'étain.",
    ] },
  { "title" = "Ascension", "paragraphs" = [
      "Hannibal Barca est le fils aîné du général Hamilcar Barca. Barca n'est pas un nom de famille mais il est néanmoins porté par son fils. Les historiens désignent la famille de Hamilcar sous le nom de Barcides afin d'éviter la confusion avec d'autres familles carthaginoises où les mêmes noms (Hannibal, Hasdrubal, Hamilcar, Magon, etc.) sont fréquemment portés.",
      "Il n'existe que peu de sources à propos de l'éducation d'Hannibal. On sait toutefois qu'il apprend d'un précepteur spartiate, nommé Sosylos, les lettres grecques, l'histoire d'Alexandre le Grand et l'art de la guerre. Il acquiert ainsi ce mode de raisonnement et d'action que les Grecs nomment « mètis » et qui se fonde sur l'intelligence et la ruse.",
      "Après avoir agrandi son territoire, Hamilcar enrichit sa famille et, par la même occasion, Carthage elle-même. Poursuivant ce but, Hamilcar, s'appuyant sur la cité de Gadès (Hispanie) près du détroit de Gibraltar, commence à assujettir les tribus ibères. Carthage, à ce moment, est dans un tel état d'appauvrissement que sa marine est incapable de transporter son armée en Hispanie. Hamilcar est donc obligé de la faire marcher vers les colonnes d'Hercule puis de la faire traverser en bac le détroit de Gibraltar, entre le Maroc et l'Espagne. L'historien romain Tite-Live déclare que quand Hannibal va voir son père et le prie de l'autoriser à l'accompagner, celui-ci accepte sous réserve qu'Hannibal jure, qu'aussi longtemps qu'il vivrait, il ne serait jamais un ami de Rome.",
    ] },
  { "title" = "Deuxième guerre punique", "paragraphs" = [
      "Après que les Carthaginois eurent encerclé et détruit Sagonte, les Romains décident de contre-attaquer sur deux fronts en Afrique du Nord et en Hispanie, à partir de la Sicile qui doit leur servir de base opérationnelle. Cependant, Hannibal met en place une stratégie pour le moins inattendue : il veut porter la guerre au cœur de l'Italie par une marche rapide à travers l'Hispanie et le Sud de la Gaule. Sachant que sa flotte est largement inférieure à celle des Romains, il ne les attaque pas par la mer : il choisit un trajet terrestre beaucoup plus long mais plus intéressant car il lui permet de recruter en chemin bon nombre de mercenaires ou de s'allier aux peuples celtes désireux d'en découdre avec les Romains. Avant son départ, il joue habilement avec ses effectifs et envoie en Afrique du Nord des contingents d'Ibères tandis que des Libyens viennent assurer la sécurité des possessions de Carthage en Hispanie.",
      "Jusqu'à la fin du printemps 218 av. J.-C., période à laquelle il quitte Carthagène, Hannibal met sur pied une grande armée et envoie des représentants négocier son passage à travers les Pyrénées et nouer des alliances le long de son trajet. Selon Tite-Live, Hannibal, encouragé dans ses ambitions par un rêve prémonitoire, traverse l'Èbre avec 90 000 fantassins et 12 000 cavaliers. Il laisse un détachement de 10 000 fantassins et 1 000 cavaliers pour défendre l'Hispanie ainsi que 11 000 Ibères qui se montrent réticents à quitter leur territoire. Il disposerait donc de 70 000 fantassins et 10 000 cavaliers après le passage des Pyrénées. Selon d'autres sources, il parvient en Gaule à la tête de quelque 40 000 fantassins et 12 000 cavaliers. Il est toutefois difficile d'évaluer ses effectifs réels. Certaines estimations vont jusqu'à 80 000 hommes. À son arrivée en Italie, il semble diriger, selon les sources, entre 20 000 et 50 000 fantassins et entre 6 000 et 9 000 cavaliers. D'autre part, à plusieurs reprises, Carthage envoie des renforts à Hannibal, du moins, au début de la guerre. De plus, plusieurs peuplades se rallient, même provisoirement, à Hannibal. Ainsi, 40 000 Gaulois s'ajoutent à l'armée carthaginoise.",
      "Par ailleurs, Hannibal possède quelques éléphants de guerre dont le rôle est important dans les armées de l'époque et que les Romains connaissent déjà pour en avoir rencontré en se battant contre les troupes de Pyrrhus Ier. En réalité la plupart des 27 éléphants d'Hannibal, un nombre assez faible si on le compare à celui d'autres armées de l'époque hellénistique, meurent dans la traversée des Alpes ou dans l'humidité des marais étrusques. Cornélius Népos rapporte (Hannibal, IV, 2-3) que lors du passage des Apennins, en route pour l'Étrurie, Hannibal contracte une grave maladie à l'œil droit, altérant définitivement sa vision avec celui-ci. Le seul éléphant survivant serait utilisé comme monture par Hannibal pour ne pas entrer au contact de l'eau. Hannibal souffrirait en fait d'une ophtalmie qui le rend borgne.",
    ] },
  { "title" = "Après Zama", "paragraphs" = [
      "Obligé de signer le traité de paix avec Rome en 201 av. J.-C. qui prive Carthage de son ancien empire, Hannibal alors âgé de 46 ans décide de prendre part à la vie politique carthaginoise en dirigeant le parti démocrate.",
      "La cité est en effet divisée en deux grandes tendances. D'abord, le groupe démocrate, qui est principalement dirigé par les Barcides, est très attaché à un ancrage foncier en Afrique, et donc à des conquêtes de terres aux dépens des Numides. Le deuxième mouvement est une oligarchie conservatrice regroupée autour de Hannon le Grand dont la prospérité repose sur le commerce, les taxes portuaires et les tributs imposés aux cités soumises. Élu suffète en 196 av. J.-C., Hannibal restaure l'autorité et le pouvoir de cette fonction devenue insignifiante et représente alors une menace pour les oligarques. Il réduit le pouvoir des « juges », jusque-là nommés à vie et qui ne seront plus élus que pour une année non renouvelable. Il accroît la population de Carthage et on lui attribue la construction d'un nouveau quartier au sud de Byrsa, peut-être pour y installer ses vétérans.",
      "C'est alors qu'il prend une mesure qui lui aliène définitivement l'oligarchie. Hannibal décide en effet que l'indemnité de guerre annuelle que Carthage doit à Rome soit directement versée au trésor plutôt que d'être collectée par les oligarques au travers de taxes extraordinaires. Ceux-ci ne prennent pas le risque d'intervenir directement contre le suffète mais, près de sept ans après la victoire de Zama, font directement appel aux Romains qui, alarmés par la prospérité retrouvée de Carthage, exigent la reddition d'Hannibal. Le prétexte est une relation épistolaire entre Hannibal et Antiochos III évoquée par le clan conservateur. Alertés, les Romains envoient une ambassade afin de vérifier si l'information est exacte. Hannibal choisit alors volontairement l'exil en 195 av. J.-C..",
    ] },
  { "title" = "Héritage", "paragraphs" = [
      "Avec le Carthaginois disparaît sans aucun doute la plus grande menace que la République romaine ait affrontée. Longtemps après sa mort, le nom d'Hannibal continue de perpétuer symboliquement le spectre d'une menace sur la République romaine. On écrit qu'il décrit les Romains, qui se proclament les fiers descendants de Mars, comme des représentants de l'effroi. Pendant des générations, les matrones romaines continuent à raconter à leurs enfants des contes effrayants quand ils se comportent mal. Hannibal symbolise tellement l'horreur que, quel que soit le désastre qui survient, les sénateurs romains hurlent Hannibal ad portas (Hannibal est à nos portes !) afin d'exprimer leur anxiété. Cette locution latine célèbre évolue plus tard en une expression qui est encore couramment utilisée quand un client franchit une porte ou quand quelqu'un doit faire face à une calamité. De telles expressions prouvent l'impact psychologique qu'a eu la présence d'Hannibal en Italie sur la culture romaine.",
      "Dans ce contexte, une admiration (forcée) est évidente dans les écrits des historiens romains Tite-Live et Juvénal. D'autre part, les Romains vont jusqu'à ériger des statues du général carthaginois dans les rues même de Rome afin de figurer leur défaite en face d'un tel adversaire. Il est plausible de penser qu'Hannibal est à l'origine de la plus grande peur que Rome ait jamais éprouvée face à l'un de ses ennemis. Néanmoins, durant la deuxième guerre punique, les Romains se refusent à la défaite et rejettent toutes les initiatives de paix, y compris la libération contre rançon de prisonniers après la bataille de Cannes. Par ailleurs, il n'existe aucun texte relatant une quelconque révolution parmi les citoyens romains, aucune faction au sein du Sénat souhaitant la paix, aucune trahison romaine à l'avantage des Carthaginois, aucun coup d'État et aucune instauration de dictature pendant cette période. Au contraire, les aristocrates romains restent en compétition afin d'assumer des postes de commandement pour combattre le plus dangereux ennemi de Rome. Le génie militaire d'Hannibal n'est donc jamais suffisant pour perturber réellement l'organisation politique et militaire des Romains. Comme en fait état Lazenby :",
      "« Il existe également quantité de textes en faveur de leur maturité politique et du respect des formes constitutionnelles basés sur le fait que la machinerie gouvernementale complexe continua à fonctionner même en plein désastre. Il y a peu d'États de l'Antiquité dans lesquels un général ayant perdu une bataille comme Cannes aurait osé se maintenir, encore moins aurait continué à être traité avec respect en tant que chef d'État. »",
    ] },
]

[articles.it]
text = "Annibale Barca (in punico 𐤇𐤍𐤁𐤏𐤋𐤟𐤁𐤓𐤒, Ḥnb'l Brq; in latino Hannĭbăl o Annĭbăl Barca; in greco antico Ἁννίβας Βάρκας?, Hanníbas Bárkas; Cartagine, 247 a.C. – Libyssa, 183-181 a.C.) è stato un militare e politico cartaginese, famoso per le sue vittorie durante la seconda guerra punica e definito dallo storico Theodor Mommsen \"il più grande generale dell'antichità\"."
title = "Annibale"
lang = "it"
url = "https://it.wikipedia.org/wiki/Annibale"
intro = [
  "Annibale Barca (in punico 𐤇𐤍𐤁𐤏𐤋𐤟𐤁𐤓𐤒, Ḥnb'l Brq; in latino Hannĭbăl o Annĭbăl Barca; in greco antico Ἁννίβας Βάρκας?, Hanníbas Bárkas; Cartagine, 247 a.C. – Libyssa, 183-181 a.C.) è stato un militare e politico cartaginese, famoso per le sue vittorie durante la seconda guerra punica e definito dallo storico Theodor Mommsen \"il più grande generale dell'antichità\".",
  "Figlio del comandante Amilcare Barca e fratello maggiore di Asdrubale e Magone Barca, Annibale, sin da piccolo profondamente nemico di Roma e deciso a combatterla, concepì ed eseguì un audace piano di guerra per invadere l'Italia. Marciando dalla Spagna, attraverso i Pirenei e le Alpi, scese nella penisola, dove sconfisse le legioni romane in quattro battaglie principali: battaglia del Ticino (218 a.C.), battaglia della Trebbia (218 a.C.), battaglia del lago Trasimeno (217 a.C.), battaglia di Canne (216 a.C.) e in altri scontri minori.",
  "Dopo la battaglia di Canne i Romani evitarono altri scontri diretti e gradualmente riconquistarono i territori del Sud Italia di cui avevano perso il controllo. La seconda guerra punica terminò con l'attacco romano a Cartagine, che costrinse Annibale al ritorno in Africa nel 203 a.C., dove fu definitivamente sconfitto nella battaglia di Zama, nel 202 a.C. Dopo la fine della guerra Annibale guidò Cartagine per alcuni anni, ma fu costretto all'esilio dai Romani e nel 195 a.C. trovò rifugio dal re seleucide Antioco III in Siria, dove continuò a propugnare la guerra contro Roma. Dopo la sconfitta di Antioco III si trasferì presso il re Prusia I, in Bitinia. Quando i Romani chiesero a Prusia la sua consegna, Annibale preferì suicidarsi: era il 183 a.C.",
  "Dotato di grandi capacità tattiche e strategiche, avveduto e sagace, Annibale, dopo le impressionanti vittorie iniziali, continuò a battersi tenacemente in Italia per oltre quindici anni con il suo piccolo esercito di veterani isolato in territorio nemico, cercando fino all'ultimo di contrastare il predominio di Roma. Per le straordinarie qualità dimostrate durante la sua carriera militare, Annibale è considerato uno dei più grandi generali e strateghi della storia. Polibio, suo contemporaneo, lo paragonava al suo grande rivale Publio Cornelio Scipione Africano; altri lo hanno accostato ad Alessandro Magno, Giulio Cesare e Napoleone.",
]
sections = [
  { "title" = "Fonti e storiografia", "paragraphs" = [
      "Le principali fonti per la vita e il ruolo di Annibale sono rappresentate dalla biografia di Cornelio Nepote (De viris illustribus), oltre a Polibio (Storie), Tito Livio (Ab Urbe condita libri), Appiano di Alessandria (Historia romana), Cassio Dione Cocceiano (Historia romana), Velleio Patercolo (Historiae Romanae ad M. Vinicium consulem libri duo), e le biografie di Plutarco su Fabio Massimo e Claudio Marcello.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "חניבעל, Dono [o Grazia] di Baal) era il figlio maggiore del condottiero cartaginese protagonista della prima guerra punica Amilcare, nella quale s'era guadagnato l'appellativo di \"Barca\" (dal fenicio Barak, \"fulmine\"). Nacque nel 247 a.C. e i suoi fratelli minori erano Asdrubale Barca e Magone Barca. Barca non è un nome di famiglia, ma il soprannome dato ad Amilcare e trasmesso ai figli, mentre il termine Barcidi è stato introdotto dagli storici a posteriori per evitare confusione di nomi. L'educazione di Annibale fu di stampo ellenistico, e fu seguita da pedagoghi greci, tra i quali Sosilo, che avrebbe narrato le imprese annibaliche in libri andati perduti. Modelli di Annibale, sin dai primi anni, furono Alessandro Magno, Lisandro (per l'arte militare) ed Ercole. Passò i primi anni a Cartagine, dove, oltre ai valori greci, fu forse istruito in materia di economia e di agronomia (presumibilmente tale competenza derivò dalla lettura dell'opera di Magone).",
      "Il padre Amilcare, dopo la sconfitta di Cartagine nella prima guerra punica e dopo avere domato la rivolta dei mercenari e dei sudditi libici, era determinato, in contrasto con i propositi conservatori del partito aristocratico di Cartagine, a sviluppare un importante programma di espansione e rafforzamento della città in funzione anti-romana. Secondo la tradizione storiografica antica egli avrebbe contato in prospettiva, per la lotta contro Roma, sul supporto dei suoi tre figli maschi, \"i tre leoncini\" allevati \"per la rovina di Roma\". Amilcare riuscì a convincere il \"Senato\" cartaginese a dargli un esercito per conquistare l'Iberia che alcune fonti indicano come un dominio cartaginese perduto.",
      "Cartagine fornì solo una forza relativamente ristretta e Amilcare accompagnato dal figlio Annibale, che allora aveva nove anni, intraprese nel 237 la marcia lungo le costa del Nord Africa fino alle Colonne d'Ercole. Gli altri due figli, Asdrubale e Magone, restarono a Cartagine. Negli anni della sua permanenza in Spagna, Annibale, pur essendo giovanissimo, si trasformò in un soldato. Acquisì quella straordinaria tempra fisica che avrebbe conservato fino a oltre cinquant'anni: a cinquantadue fu infatti in grado di percorrere a cavallo, in sole quattordici ore, i duecento chilometri che separavano Cartagine dal punto di imbarco da cui sarebbe partito, esule, per l'Oriente. In questo momento si colloca il celebre episodio del giuramento di Annibale bambino. Secondo la tradizione storiografica iniziata da Polibio e perpetuata da altri storici antichi, prima della partenza per la Spagna, Amilcare avrebbe fatto giurare solennemente al figlio che egli non sarebbe mai stato amico di Roma; l'evento, messo in dubbio dagli storici moderni, è divenuto esemplare per rappresentare simbolicamente il sentimento di odio eterno di Annibale verso Roma che rimase effettivamente l'elemento dominante della vita del condottiero cartaginese.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Annìbale, su Treccani.it – Enciclopedie on line, Istituto dell'Enciclopedia Italiana.",
      "Vincenzo Costanzi, ANNIBALE Barca, in Enciclopedia Italiana, Istituto dell'Enciclopedia Italiana, 1929.",
      "(EN) William Culican e Patrick Hunt, Hannibal, su Enciclopedia Britannica, Encyclopædia Britannica, Inc.",
    ] },
]

[articles.tr]
text = "Hannibal veya Annibal (Pönce: 𐤇𐤍𐤁𐤏𐤋𐤟𐤁𐤓𐤒;) MÖ 247 – MÖ 183/181 yılları arasında yaşamış Sâmî ırkından gelen Kartacalı politikacı ve general. Tüm zamanların en büyük askerî dehalarından biri olarak kabul edilen Hannibal, Scipio ve Philopoemen ile birlikte çağının üç büyük generalinden biriydi."
title = "Hannibal"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Hannibal"
intro = [
  "Hannibal veya Annibal (Pönce: 𐤇𐤍𐤁𐤏𐤋𐤟𐤁𐤓𐤒;) MÖ 247 – MÖ 183/181 yılları arasında yaşamış Sâmî ırkından gelen Kartacalı politikacı ve general. Tüm zamanların en büyük askerî dehalarından biri olarak kabul edilen Hannibal, Scipio ve Philopoemen ile birlikte çağının üç büyük generalinden biriydi. Scipio onu şimdiye kadar yaşamış en büyük generallerden biri olarak kabul eder, Epir kralı Pirus'u ikinci sıraya yerleştirir, kendisini de üçüncü olarak kabul eder. Aynı sıralama Hannibal'a sorulduğunda o, Büyük İskender'in en büyük general olduğunu söyler. İkinci olarak Pirus'u gösterir, kendisini de üçüncü sıraya koyar. Askerî tarihçi Theodore Ayrault Dodge Hannibal'ı \"Stratejinin Babası\" olarak nitelendirir ve en büyük düşmanı olan Roma'nın bile onu yine kendi taktikleriyle alt ettiğini belirtir.",
  "Roma'nın en büyük düşmanı olarak II. Pön Savaşı'ndaki başarılarıyla tanınmıştır. Filleri içeren ordusuyla İber Yarımadası, Pireneler ve Alpler'den kuzey İtalya'ya girmiş ve Romalıları birkaç önemli savaşta yenmiştir.",
]
sections = [
  { "title" = "Adının kökeni", "paragraphs" = [
      "Hannibal, Kartaca'da yaygın bir kişisel addı. Kartaca kaynaklarında ḥnbʿl olarak kaydedilmiştir. Bu, bilinen Kartaca erkek adı Hanno ile Kuzeybatı Semitik Kenanlı tanrı Baal'ın (\"lord\") bir kombinasyonudur. Kesin seslendirmesi tartışma konusu olmaya devam ediyor. Önerilen okumalar arasında Ḥannobaʿal, Ḥannibaʿl veya Ḥannibaʿal yer alır. Yunan tarihçileri adı Anníbas (Ἀννίβας) olarak yorumlarlar.",
      "Kartacalılar kalıtsal soyadlarını kullanmazlardı, ancak tipik olarak aynı adı taşıyanlar diğerlerinden soyadı veya lakaplar kullanılarak ayırt edilirdi. Barca \"şimşek\" veya \"yıldırım\" anlamına gelen bir Semitik isimdir, Hamilcar'ın saldırılarının çabukluğu ve vahşiliği nedeniyle edindiği bir soyadıdır.",
    ] },
  { "title" = "Yaşamı", "paragraphs" = [
      "MÖ 247'de Kartaca'da dünyaya geldi. Birinci Pön Savaşı'nın ünlü kahramanı Kartacalı komutan Hamilcar Barca'ın oğludur. Bugünkü kuzey Tunus'ta doğdu. Birkaç kız kardeşi ve iki erkek kardeşi vardı. Küçük yaşlarda babası ile savaşlara katılmaya başladı. Babasının isteğiyle, Roma'ya karşı her zaman kin duyacağına dair ant içti. Kısa bir süre sonra babasının ölümünü müteakiben, eniştesi ve kardeşinin yardımıyla asker oldu.",
      "Birinci Pön Savaşı'nda Kartaca'nın yenilgisinden sonra Hamilcar, ailesinin ve Kartaca'nın şanını düzeltmek için yola çıktı. Bunu göz önünde bulunduran ve Gades tarafından desteklenen Hamilcar, İber Yarımadası'ndaki kabilelere boyun eğdirmeye başladı. O zamanlar Kartaca o kadar kötü bir durumdaydı ki, ordusunu taşıyabilecek bir donanmadan yoksundu; bunun yerine, Hamilcar kuvvetlerini Numidia boyunca Herkül Sütunları'na doğru ilerletmek ve ardından Cebelitarık Boğazı'nı geçmek zorunda kaldı.",
      "Polybius'a göre Hannibal, babasının yanına gelerek onunla gitmek için yalvardı, Hamilcar oğluna yaşadığı sürece asla Roma'nın bir arkadaşı olmayacağına yemin etmesini söylediği vakit gelmesine izin vereceğini söyledi. Hatta çok genç yaşta (9 yaşında) babasına onu denizaşırı bir savaşa götürmesi için yalvaran bir tarihi kaydı bile vardır.",
    ] },
  { "title" = "Miras", "paragraphs" = [
      "Hannibal, Roma toplumunda birçok kişiyi büyük sıkıntıya soktu. Öyle bir figür haline geldi ki, ne zaman bir felaket meydana gelse, Romalı senatörler korkularını veya endişelerini ifade etmek için \"Hannibal ad portas\" (\"Hannibal kapıda!\") diye haykırıyorlardı.",
      "Hannibal hakkında tarihçilerin elindeki kaynakların çoğu Romalılara aittir. Onu Roma'nın karşılaştığı en büyük düşman olarak görüyorlardı. Livius, bize Hannibal'in son derece acımasız olduğu fikrini veriyor. Cicero bile Roma ve onun iki büyük düşmanından söz ederken, \"onurlu\" Pyrrhus ve \"zalim\" Hannibal derdi.",
    ] },
  { "title" = "Etkileri", "paragraphs" = [
      "Hannibal Barca'nın savaş stratejilerinden bazıları (Atatürk tarafından) Türk Kurtuluş Savaşı'nda da Yunan kuvvetlerine karşı başarıyla kullanılmıştır. Savaş tarihçisi Theodore Ayrault Dodge, ona \"askerî stratejinin babası\" unvanını vermiştir; çünkü en büyük düşmanı olan Roma bile onun savaş taktiklerini kullanmıştır. Hannibal'ın yaşamı ve savaşları birçok belgesel, oyun ve filme konu olmuştur. Öldüğü yerde günümüzde faaliyet gösteren bir okula adı verilmiştir.",
    ] },
]

[articles.ar]
text = "حَنبَعل بنْ حَملقار برقا (بالبونيقية: 𐤇𐤍𐤁𐤏𐤋 𐤁𐤓𐤒، «حنبعل برقا») الشهير بـ حنا بعل أو هانيبال أو هاني بعل (247 ق.م - 182 ق.م) قائد عسكري قرطاجي ينتمي إلى عائلة برقا البونيقية، ويُنسب إليه اختراع العديد من التكتيكات الحربية في المعارك لا زالت معتمدة حتى اليوم. ويقول الجنرال الأمريكي نورمان شوارزكوف: «تعلمت الكثير من حنبعل، حيث طبقت تكتيكاته في التخطيط لحملتي في عاصفة الصحراء»."
title = "حنبعل"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%AD%D9%86%D8%A8%D8%B9%D9%84"
intro = [
  "حَنبَعل بنْ حَملقار برقا (بالبونيقية: 𐤇𐤍𐤁𐤏𐤋 𐤁𐤓𐤒، «حنبعل برقا») الشهير بـ حنا بعل أو هانيبال أو هاني بعل (247 ق.م - 182 ق.م) قائد عسكري قرطاجي ينتمي إلى عائلة برقا البونيقية، ويُنسب إليه اختراع العديد من التكتيكات الحربية في المعارك لا زالت معتمدة حتى اليوم. ويقول الجنرال الأمريكي نورمان شوارزكوف: «تعلمت الكثير من حنبعل، حيث طبقت تكتيكاته في التخطيط لحملتي في عاصفة الصحراء».",
  "بلغ حنبعل أقصى الحدود المستحيلة لكي يهزم روما ويصبح مادة للأساطير حيث احتل معظم إيطاليا وحاصر روما 15 عامًا. قاد حنبعل جيوش قرطاج في الحرب البونيقية الثانية واجتاز جبال الألب حتى وصل إلى حوض نهر إلبه بإيطاليا متفوقًا على الإمبراطورية الرومانية.",
  "تبرز عبقرية التخطيط الذي قام به حنبعل في عدة محطات، لعل أبرزها عبوره الانتحاري لجبال الألب، وأيضًا معركة كاناي، التي كلّف فيها الخيّالة بمواجهة الخيّالة الرّومانيّين، مع توجيه الأمر للمشاة بالتقهقر ثمّ تطويق المشاة الرّومانيّين، فأصبح الجيش الرّوماني محاصرًا بالجيش القرطاجيّ من كلّ الجهات، في حين تمكّن الخيّالة من الفتك بالخيّالة الرّومانيّين الذين لاذوا بالفرار، وبذلك انتصر الجيش القرطاجي.",
  "كان أبوه حملقار برقا قائداً للقرطاجيين في الحرب البونيقية الأولى، وكان أخواه صدربعل وماجو من أعظم قادة القرطاجيين، وكان شقيقًا لزوجة القائد صدربعل العادل، وصف المؤرخون حنبعل بأنه أسوأ كوابيس روما وبكاسر هيبتها وصوّره الرومان على أنه وحش يهوى القتل وسفك الدماء. حتى أنهم عندما يخشون وقوع كارثة في جميع المجالات يقولون: (اللاتينية: Hannibal ad portas) وتعني «حنبعل على أبوابنا».",
]
sections = [
  { "title" = "الأصل", "paragraphs" = [
      "يعود أصل حنبعل إلى عائلة من برقة، يُعتقد أنها تعود إلى مدينة قورينا (Cyrene) الواقعة في شرق ليبيا. وتشير بعض الروايات إلى أن الأسرة لم تكن من الأسر المؤسسة لقرطاج، بل كانت من أصول وافدة استقرت لاحقًا في المدينة، وبرزت داخل طبقتها السياسية والعسكرية. وتوضح المصادر أن عائلة حنبعل كانت ذات نفوذ، لكنها لم تكن من بين العائلات الحاكمة في بدايات قرطاج. وورد أن العائلة قدمت من قورينا واستقرت في قرطاج، وهو ما يرجّح أن أصل حنبعل من ليبيا، رغم نشأته وتكوينه القرطاجي. كما ذكرت بعض الدراسات أن انتشار هذه العائلة امتد منذ وقت مبكر إلى مناطق شمال إفريقيا، بما في ذلك مناطق من تونس، وهو ما يعزّز نسبه الإقليمي للمنطقة الليبية.",
    ] },
  { "title" = "نشأته", "paragraphs" = [
      "كان حنبعل واحدًا من أبناء الزعيم القرطاجي أميلكار برقا أو خاملكقرت بالبونيقية (خا ملك وتعني «أخ ملك المدينة أو القرية (قرت)» وبرقا تعني الصاعقة). كان لا يزال طفلاً عندما شارك أباه وصدربعل العادل والملك النوميدي نارافاس زوجيّ شقيقتيه في الحرب ضد المرتزقة وفي الغزو القرطاجي لأيبيريا.",
      "بعد هزيمة قرطاج في الحرب البونيقية الأولى، تفرّغ أميلكار لرعاية أسرته وتنمية ثروات الإمبراطورية. مدعوماً من قادس، بدأ أميلكار في إخضاع قبائل شبه الجزيرة الإيبيرية. كانت قرطاج في ذلك الوقت دولة فقيرة لدرجة أنها لم تتمكن من نقل قواتها عبر البحر إلى شبه الجزيرة الإيبيرية؛ بدلاً من ذلك، قاد أميلكار جيشه نحو أعمدة هرقل ونقلها عبر مضيق جبل طارق. توسّل حنبعل إلى والده للذهاب معه، وعندئذ، طلب منه والده أن يقسم بأنه لن يكون صديقًا لروما، طالما كان على قيد الحياة.",
      "... وأثناء غزو هسبانيا، لقي والده مصرعه في المعركة، وخلفه زوج شقيقة حنبعل صدربعل العادل في قيادته للجيش، وخدم معه حنبعل كضابط تحت قيادته.",
    ] },
  { "title" = "الحرب الحنبعلية", "paragraphs" = [
      "-كانت هيئة أركان جيشه تتكون من: ماجو برقة، وماهربعل قائد سلاح الفرسان البونيقي، الذي تقلد هذه القيادة منذ عهد والد حنبعل أميلكار برقه، ويكن له حنبعل حبا فائقا، وهيرت، وسينهالوس المصري كبير الأطباء، والاغريقيين سوسيلوس، ووسلينوس، وبوح الهندي منجم الحملة، والاسبرطي سوسيليوس الذي علم حنبعل اليونانية.",
      "-في سنة 214 ق.م قرر حنبعل التقدم بجيشه بعد أن ترك شقيقه صدربعل على رأس ولاية قرطاجنة بهسبانيا التي كانت تابعة لامبراطورية قرطاج.",
      "-وقد قرر حنبعل الإسراع في بدء حملته البرية، بعد أن وصلته أنباء من جواسيسه بأن الرومان يستعدون لتطبيق خطة بنقل الحرب إلى أفريقيا في عقر دار قرطاج.",
    ] },
  { "title" = "تدمير قرطاج", "paragraphs" = [
      "انتهت هذه الملحمة البطولية ملحمة الدفاع عن قرطاج. وإذا كانت هذه الحرب أسفرت عن وفاة مدينة، فقد أكدت أن الإنسان أقوى من القهر، وأن إرادته لا تردع بسهولة. ولقد تأثر لهذه المأساة حتى بعض المؤرخين الأوروبيين، يقول وارمنغتون: ألقي سكيبيو أميليانوس نظرة على المدينة التي ازدهرت أكثر من سبعمائة سنة منذ انشائها، والتي حكمت مناطق كثيرة، جزرا وبحارا، وكانت ثرية في السلاح والأساطيل والفيلة والمال، مثل الامبراطوريات العظمى، بل والتي فاقتها في الإقدام والشجاعة الفائقة. فبالرغم من أنها جردت من كافة أسلحتها وسفنها، فقد صمدت أمام حصار شديد، ومجاعة دامت ثلاث سنوات، ووصلت إلى نهايتها بالتدمير الكلي.",
      "ويروي المؤرخ اليوناني بوليبيوس الذي رافق القائد الروماني في عملية التدمير، فيقول: أن سكيبيو أميليانوس بكي تأثرا بما آل له عدوه، فاستعرض أمامه الحقيقة المتمثلة في أن الأفراد والأمم والامبراطوريات نهايتها محتومة، وكذلك نصيب مدينة طروادة العظيمة، ونهاية الامبراطوريات الأشورية، والميدية، والفارسية، والتدمير الأخير لامبراطورية مقدونية الكبيرة. تمعن في هذا كله ثم ردد بقصد أو بدون قصد، كلمات هكتور في الإلياذة هوميروس: (سيأتي اليوم الذي تسقط فيه طروادة المقدسة، وكذلك الملك بريام وجميع رجاله المسلحين معه)، وعندما سأل المؤرخ بوليبيوس، سكيبيو، ماذا تقصد بهذا؟، التفت إليه القائد الروماني وقال بتأثر: هذه لحظة عظيمة يا بوليبيوس.. إن الخوف يتملكني من أن نفس المصير سيكون لوطني في يوم من الأيام.",
    ] },
]

[articles.vi]
text = "Hannibal, con trai của Hamilcar Barca (sinh năm 247 trước Công nguyên – mất 183 trước Công nguyên), là một tướng lĩnh và nhà chỉ huy quân sự người Carthage. Cha ông là Hamilcar Barca chỉ huy quân Carthage trong chiến tranh Punic lần I cùng với hai người em trai của ông là Mago, Hasdrubal và một người anh rể khác của ông cũng có tên là Hasdrubal."
title = "Hannibal"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Hannibal"
intro = [
  "Hannibal, con trai của Hamilcar Barca (sinh năm 247 trước Công nguyên – mất 183 trước Công nguyên), là một tướng lĩnh và nhà chỉ huy quân sự người Carthage. Cha ông là Hamilcar Barca chỉ huy quân Carthage trong chiến tranh Punic lần I cùng với hai người em trai của ông là Mago, Hasdrubal và một người anh rể khác của ông cũng có tên là Hasdrubal.",
]
sections = [
  { "title" = "Tên gọi", "paragraphs" = [
      "Chữ \"Hannibal\" có nghĩa là \"niềm vui của thần Baal\" (vị thần chủ của người Carthage), còn dòng họ \"Barca\" của ông có nghĩa là \"tia chớp\". Chữ Barca còn có thể được viết là \"Barak\" hay \"Barcas\".",
      "Hannibal còn là một tên riêng phổ biến của người Phoenicia - Carthage thuộc ngữ hệ Semit. Nó được ghi lại trong các nguồn của Carthage là ḥnbʿl (tiếng Punic: 𐤇𐤍𐤁𐤏𐤋). Nó là sự kết hợp của tên riêng nam phổ biến của người Phoenicia là Hanno với vị thần Canaan thuộc ngữ hệ Semit Tây Bắc Baal Hammon (nghĩa đen là \"chúa tể\"), một vị thần quan trọng của quê hương tổ tiên của người Carthage ở Phoenicia thuộc Tây Á. Cách phát âm chính xác của nó vẫn còn là vấn đề tranh luận. Các cách đọc khác được đề xuất bao gồm Ḥannobaʿal, Ḥannibaʿl, hoặc Ḥannibaʿal, có nghĩa là \"Baʿal/Chúa tể nhân từ\", \"Baʿal đã nhân từ\", hoặc \"Ân điển của Baʿal\".",
    ] },
  { "title" = "Xuất thân", "paragraphs" = [
      "Hannibal sống trong suốt thời kỳ rối loạn tại Địa Trung Hải, khi nền Cộng hòa La Mã thiết lập quyền lực tối cao với các nước lớn như Carthage, Vương quốc Macedonia, Syracuse và Vương quốc Seleukos. Hannibal là tướng lĩnh nổi tiếng nhất người Carthage. Thành tựu nổi bật nhất của ông là khi nổ ra chiến tranh Punic lần hai, Hannibal đã dẫn một đội quân, gồm voi chiến, từ Iberia qua 2 dãy núi Pyrenees và Alps vào phía Bắc Ý.",
      "Trong suốt cuộc xâm chiếm Ý của mình, Hannibal đã đánh tan tác quân La Mã trong hàng loạt cuộc chiến, trong đó bao gồm những trận chiến tại Trebia, Trasimene và Cannae. Sau trận Cannae, rất nhiều đồng minh của nước Cộng hòa La Mã đã gia nhập với Hannibal khi ông hứa sẽ cho họ độc lập và một chính quyền tự trị. Theo một số nhà sử học, Hannibal thiếu các khí tài vây hãm cần thiết để có thể tấn công thành trì kiên cố La Mã, nhưng theo J. F. Lazenby chỉ ra thì đó không phải là sự thiếu các loại vũ khí công thành cần thiết mà là do sự thiếu hụt nguồn tiếp tế và ý định chính trị (political agenda). Ông duy trì một đạo quân tại Ý trong hơn một thập kỷ sau đó và không bao giờ thua một trận đánh lớn nhưng cũng không thể ép người La Mã chấp nhận các điều khoản cho hòa bình. Một cuộc xâm lược phản công vào Tây Ban Nha và sau đó là Châu Phi của quân La Mã buộc Hannibal phải trở lại Carthage, nơi mà ông đã bị đánh bại trong trận chiến Zama.",
      "Sau cuộc chiến, ông đã trở thành một quan chấp chính thành công ở Carthage. Ông đã cho ban hành những cải tổ về chính trị và kinh tế để phục hồi Carthage sau khi trả các bồi thường chiến tranh cho Cộng hòa La Mã. Những cải cách của ông bị tầng lớp thượng lưu Carthage chống đối. Bị những thành viên của Viện Nguyên Lão La Mã vốn sợ hãi tài năng quân sự của Hannibal nghi ngờ, ông đã bị La Mã ép đi đày. Trong thời gian bị đi đày, ông sống tại cung điện của Vương quốc Seleukos, nơi mà ông đã trở thành cố vấn quân sự cho vua Antiokhos III trong cuộc chiến chống lại La Mã. Sau khi Antiokhos III thất bại và bị ép chấp nhận các điều khoản của người La Mã, Hannibal tới dừng chân ở Armenia, nơi ông làm việc như một nhà quy hoạch cho việc lập thủ đô mới. Hannibal sống tại cung điện của Bithynia, nơi lẽ ra ông đã có thể giành được chiến thắng thủy chiến vang dội bằng chiến tranh sinh học, nhưng ông bị phản bội và bị đem nộp cho những người La Mã. Để bảo toàn danh dự, Hannibal đã uống thuốc độc tự sát.",
    ] },
  { "title" = "Bối cảnh và sự khởi đầu binh nghiệp", "paragraphs" = [
      "Hannibal là một trong những người con của Hamilcar Barca một nhà lãnh đạo người Carthage. Ông có một vài chị gái và 2 em trai là Hasdrubal Barca và Mago Barca. Những người anh rể của ông là Hasdrubal Ngay thẳng và vua Naravas xứ Numibia. Ông là một đứa trẻ khi hai chị gái lập gia đình và được các anh rể nuôi nấng trong khi cha ông chiến đấu trong cuộc chiến tranh lính đánh thuê và cuộc chiến tranh Punic chinh phục Iberia. Trong tên hiệu của Hamilcar Barca, các sử gia cho là tên họ của gia đình Hamilcar là Barca. Tuy nhiên, có cuộc tranh luận để xem tên riêng Barca (có nghĩa là \"tia sét\") đã được áp dụng cho riêng Hamilcar hay là cho cha truyền con nối. Nếu vậy, Hannibal và các em đều được gọi là 'Barca'.",
      "Sau thất bại của người Carthage trong cuộc chiến tranh Punic lần thứ nhất, Hamilcar đã ra đi để tìm kiếm vận may cho gia đình và người Carthage. Với tài trí và sự trợ giúp của Gades, Hamilcar bắt đầu cuộc chinh phục những bộ tộc ở bán đảo Iberia. Carthage lúc này đã trở thành một thành bang nghèo khó đến mức hạm đội của họ không thể vận chuyển quân đội của ông tới Iberia. Thay vào đó, Hamilcar đã phải hành quân vòng qua khu vực \"Những cây cột của Hercules\" và được chở qua eo biển Gibraltar.",
      "Cha của Hannibal đã tham gia vào cuộc chinh phục xứ Tây Ban Nha. Ông đã hi sinh trong một trận đánh. Anh rể của Hannibal là Hadrusbal nắm quyền chỉ huy quân đội với sự phục vụ của Hannibal như là một tướng lĩnh dưới quyền. Hasdrubal theo đuổi một chính sách của Carthage là củng cố mối quan tâm đối với Iberia, thậm chí ký kết một hiệp ước với Rome mà qua đó Carthage sẽ không mở rộng phía bắc sông Ebro trong khi người La Mã cũng không được mở rộng về phía nam. Hasdrubal cũng theo đuổi chính sách củng cố quyền lực của người Carthage thông qua mối quan hệ với các bộ tộc. Như một phần của chính sách, Hasdrubal bố trí cho Hannibal kết hôn với một công chúa Iberia tên là Imilce.",
    ] },
  { "title" = "Cuộc chiến tranh Punic lần II ở Ý (218-203 TCN)", "paragraphs" = [
      "Cuộc hành trình đã được lên kế hoạch từ đầu bởi anh rể của Hannibal, Hasdrubal. Hasdrubal trở thành chỉ huy người Carthage tại Iberia vào năm 229 TCN, duy trì trong suốt 8 năm cho tới năm 221 TCN. Người La Mã đã nhận thấy được liên minh giữa người Carthage và người Celt ở thung lũng sông Po, miền bắc Ý là nhằm chuẩn bị lực lượng cho việc xâm lược Ý. Dẫu vậy người La Mã ưu tiên xâm chiếm vùng đồng bằng sông Po năm 225 TCN. Tới năm 220 TCN, người La Mã chiếm thêm khu vực Gallia Cisalpina. Hasdrubal đã bị ám sát vào cùng thời điểm này (221 TCN) và việc này đã đưa Hannibal lên nắm quyền.",
      "Hannibal đã qua các vùng lãnh thổ được mệnh danh là Carthage mới vào cuối mùa xuân của năm 218 TCN. Ông đã chiến đấu với các bộ tộc ở phía Bắc trên đường đi tới Pyrenees, bằng các chiến thuật tập kích bất ngờ và thông minh xuyên qua vùng nói non. Ông đã để lại 11.000 quân để chinh phục những vùng đất mới. Tại Pyrenees, ông cũng đã cho 11.000 lính Iberia ở lại, những người tỏ ra không muốn rời xa quê hương của mình. Theo các sử gia Hannibal đã tới Gaul cùng với 40.000 lính bộ và 12.000 kỵ binh.",
      "Hannibal nhận ra rằng ông cần phải vượt qua Pyrenees, dãy Alps, và nhiều con sông đáng kể. Ngoài ra còn phải chiến đấu chống lại sự chống đối của người Gaul, những người chủ của những vùng đất mà ông vượt qua. Bắt đầu vào mùa xuân năm 218 TCN, ông dễ dàng đánh bại những bộ tộc phía bắc trên đường tới dãy Pyrenees, và thu phục được những thủ lĩnh người Gaul cùng đi và đến sông Rhône trước khi người La Mã có những biện pháp để ngăn chặn bước tiến của ông. Đến sông Rhône vào tháng 12, quân số của Hannibal còn lại 38.000 bộ binh, 8.000 kỵ binh và 37 voi chiến. Sau khi vượt qua những bộ lạc ngăn chặn, Hannibal đã tránh một lực lượng La Mã ngăn chặn vừa hành quân từ Địa Trung Hải bằng cách di chuyển qua thung lũng sông Rhône.",
    ] },
]

[articles.id]
text = "Hannibal (bahasa Punik: 𐤇𐤍𐤁𐤏𐤋, translit. Ḥannībaʿl; 247 – antara 183 hingga 181 SM), atau Hannibal Barca, adalah seorang pemimpin militer di Perang Punisia Kedua dan seorang politikus, kelak dia juga bekerja di profesi yang lain, dia disebut-sebut sebagai salah satu dari pemimpin perang terhebat sepanjang sejarah."
title = "Hannibal"
lang = "id"
url = "https://id.wikipedia.org/wiki/Hannibal"
intro = [
  "Hannibal (bahasa Punik: 𐤇𐤍𐤁𐤏𐤋, translit. Ḥannībaʿl; 247 – antara 183 hingga 181 SM), atau Hannibal Barca, adalah seorang pemimpin militer di Perang Punisia Kedua dan seorang politikus, kelak dia juga bekerja di profesi yang lain, dia disebut-sebut sebagai salah satu dari pemimpin perang terhebat sepanjang sejarah. Dia hidup saat waktu tegang di Mediterania, ketika Romawi (lalu republik Romawi) membangun kekuatannya melewati kekuatan besar lain seperti Kartago, Makedonia, Sirakusa, dan Seleukia. Dia adalah salah satu pemimpin Kartago yang paling terkenal. Pencapaiannya yang paling besar adalah ketika meletusnya Perang Punic, ketika dia membawa pasukan yang mengandung gajah perang dari Iberia melewati Pegunungan Pirenia dan Alpen sampai bagian utara Italia.",
  "Selama invasinya di Italia, dia mengalahkan prajurit Romawi di beberapa pertempuran, termasuk yang di Sungai Trebia, Trasimene dan Cannae. Sesudah Cannae, kota terbesar di Itali yaitu Capua mengikuti Hannibal melalui penyebrangan dari Roma. Hannibal kekurangan perlengkapan yang dibutuhkan untuk menembus kota Roma yang sangat dipertahankan. Dia membangun prajurit di Italia lebih dari satu dekade sesudah itu, tidak pernah lupa kewajiban utamanya, tetapi tidak pernah bisa menekan perang sampai menghasilkan kepastian. Selama periode itu, prajurit Romawi kembali berkumpul. Invasi balasan dari Romawi di Afrika Utara memaksa dia untuk kembali ke Kartago, di mana dia dikalahkan di pertempuran Zama. Kekalahan itu memaksa Senat Kartago untuk mengirim dia ke pengasingan. Selama pengasingan ini, dia tinggal di Istana Seleukia, di mana dia bertindak sebagai penasihat militer Antiokhos III saat perangnya melawan Romawi. Karena kekalahannya di pertarunganmaritim, Hannibal melarikan diri lagi, kali ini ke Istana Bithynian.Ketika Romawi meminta dia menyerah, dia lebih memilih melakukan bunuh diri daripada setuju untuk menyerah.",
  "Hannibal juga disebut sebagai salah satu jenderal terbesar sepanjang sejarah. Ahli sejarah militer, Theodore Ayrault Dodge bahkan menyebut Hannibal sebagai “Bapak dari strategi”, karena musuh terbesarnya yaitu Romawi, mengadopsi beberapa taktik militer Hannibal di dalam taktik mereka sendiri.Pujian ini menyebabkan dia mendapat reputasi yang kuat di dunia masa kini dan dia juga dikenal sebagai “pemberi strategi” oleh orang-orang seperti Napoleon Bonaparte dan Bangsawan dari Wellington. Kisah hidupnya juga menjadi dasar dari beberapa film dan dokumentasi.",
]
sections = [
  { "title" = "Latar belakang", "paragraphs" = [
      "Hannibal adalah salah satu putra jenderal dan negarawan Kartago Hamilcar Barca dan ibu yang tidak diketahui. Ia kemungkinan besar lahir di Kartago, salah satu dari banyak region Mediterania yang dikuasai oleh orang Kanaan dari tanah air mereka di Fenisia. Ia memiliki beberapa saudari yang namanya tidak diketahui dan dua saudara, Hasdrubal dan Mago. Ipar laki-lakinya adalah Hasdrubal yang Adil dan Naravas, raja Numidia. Ia masih anak-anak ketika saudari-saudarinya menikah, dan kedua ipar laki-lakinya merupakan rekan ayahnya selama Perang Tentara Bayaran dan penaklukan Semenanjung Iberia.",
      "Setelah kekalahan Kartago dalam Perang Punisia Pertama, Hamilcar berniat untuk memperbaiki kekayaan Kartago dan kelaurganya. Dengan pikiran tersebut dan didukung oleh Gades, Hamilcar memulai penaklukan suku-suku Semenanjung Iberia. Kartago dalam kondisi yang tidak baik pada saat itu sampai kekurangan angkatan laut yang dapat membawa pasukannya; Hamilcar harus membawa pasukannya melewati Numidia menuju Pilar-Pilar Herkules lalu menyeberangi Selat Gibraltar.",
      "Menurut Polibios, jauh di kemudian hari, Hannibal menyatakan bahwa ketika ia datang kepada ayahnya dan memohon untuk ikut pergi bersamanya, Hamilcar setuju dan menuntut Hannibal bersumpah tidak akan berteman dengan Roma selama hidupnya. Bahkan terdapat catatan mengenai dirinya saat masih sangat muda (umur 9 tahun) memohon kepada ayahnya untuk membawanya ke perang di luar negeri. Dalam cerita tersebut, Hamilcar membawanya ke sebuah ruangan pengorbanan. Hamilcar memegangnya di atas api yang berkobar di ruangan tersebut dan menbuatnya bersumpah tidak akan berteman dengan Roma. Sumber lain melaporkan bahwa Hannibal memberitahu ayahnya, \"Aku bersumpah secepat setelah usia memungkinkan...aku akan menggunakan api dan baja untuk menangkap takdir Roma.\"",
    ] },
]

[articles.pt]
text = "Aníbal​ (em púnico 𐤇𐤍𐤁𐤏𐤋, grego clássico Ἀννίβας, em latim Hannibal; Cartago, 247 a.C. – Libissa, c."
title = "Aníbal"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/An%C3%ADbal"
intro = [
  "Aníbal​ (em púnico 𐤇𐤍𐤁𐤏𐤋, grego clássico Ἀννίβας, em latim Hannibal; Cartago, 247 a.C. – Libissa, c. 183–181 a.C.) foi um general e estadista da civilização cartaginesa. É considerado um dos maiores estrategistas militares da história.",
  "A vida de Aníbal decorreu no conflituoso período em que Roma estabelecia a sua supremacia na bacia mediterrânica, superando outras potências (a própria República Cartaginesa, Macedônia, Siracusa e Império Selêucida). Foi o general mais ativo da Segunda Guerra Púnica, em que executou um dos mais audazes feitos militares da Antiguidade: Aníbal e seu exército, no qual se incluíam trinta e oito elefantes de guerra, partiram da Hispânia e atravessaram os Pirenéus e os Alpes com o objetivo de conquistar o norte da Itália. Ali derrotou os romanos em grandes batalhas campais como a do rio Trébia, a do lago Trasimeno e a de Canas, que ainda são estudadas em academias militares na atualidade. Apesar de sua brilhante campanha, Aníbal não chegou a invadir Roma. As razões para tal dividem opiniões entre os historiadores, e vão desde falta de materiais para o cerco até considerações políticas que defendem que a intenção de Aníbal não era tomar Roma, mas obrigá-la a render-se. Não obstante, Aníbal conseguiu manter seu exército na Itália por mais de uma década, recebendo escassos reforços. Após a invasão da África por parte de Cipião, o senado cartaginês o chamou de volta a Cartago, onde foi finalmente derrotado por Cipião na Batalha de Zama.",
  "Finda a guerra contra Roma, entrou na vida pública cartaginesa. Enfrentou a oligarquia dirigente que o acusou de estar mancomunado com o selêucida Antíoco III, pelo que teve que se exilar no ano de 190 a.C. Passou ao serviço deste último monarca, cujas ordens o levaram de novo ao confronto com a República Romana na Batalha de Magnésia, em que foi derrotado. Uma vez mais exilado, se refugiou na corte de Prúsias I, rei da Bitínia. Os romanos exigiram dos bitínios que entregassem o cartaginês, ao que o rei concordou. Contudo, antes de ser capturado, Aníbal preferiu o suicídio.",
  "O historiador militar Theodore Ayrault Dodge o chamou de \"pai da estratégia\". Foi admirado inclusive por seus inimigos — Cornélio Nepos o batizou como \"o maior dos generais\". Mesmo seu maior inimigo, Roma, adaptou certos elementos de suas táticas militares a seu próprio acervo estratégico. Seu legado militar lhe conferiu uma sólida reputação no mundo moderno e foi considerado como um grande estrategista militar por grandes militares como Napoleão ou Arthur Wellesley, o duque de Wellington. Sua vida foi objeto de muitos livros, filmes e documentários.",
]
sections = [
  { "title" = "Nome", "paragraphs" = [
      "A forma portuguesa do nome é derivada do Latim. Historiadores gregos grafavam o nome como Anníbas Bárkas (Ἀννίβας Βάρκας).",
      "Aníbal era seu prenome. O nome de Aníbal foi registrado em fontes cartaginesas como ḤNBʻL (em púnico: 𐤇𐤍𐤁𐤏𐤋). Sua vocalização exata continua em discussão. Leituras sugeridas incluem Ḥannibaʻl ou Ḥannibaʻal, significando \"benção de Baʻal\", \"Ba'al é gracioso\", ou \"Ba'al tem sido gracioso\"; ou Ḥannobaʻal, com o mesmo significado.",
      "Barca (𐤁𐤓𐤒, brq) era o sobrenome de sua família aristocrática, significando \"brilhante\" ou \"raio\".",
    ] },
  { "title" = "Antecedentes históricos", "paragraphs" = [
      "Em meados do século III a.C., a cidade de Cartago, onde nasceu Aníbal, estava fortemente influenciada pela cultura helenística oriunda dos vestígios do império de Alexandre Magno.[carece de fontes]? Cartago ocupava então um lugar importante nas trocas comerciais da bacia mediterrânea e em particular nos empórios da Sicília, Sardenha e nas costas da Ibéria e da África do Norte. A cidade dispunha igualmente de uma importante frota de guerra para proteção de suas rotas marítimas e transporte do ouro, procedente do golfo da Guiné, e do estanho, procedente das costas britânicas.",
      "A outra potência mediterrânea da época era Roma, com a qual Cartago entrou em guerra durante vinte anos em um conflito conhecido como a Primeira Guerra Púnica, a primeira guerra de grande envergadura em que Roma saiu vitoriosa. Este enfrentamento entre a República Romana e Cartago foi provocado por um conflito secundário em Siracusa, e se desenrolou por terra e mar em três fases: combates na Sicília (264-256 a.C.), combates na África (256-250 a.C.) e de novo na Sicília (250-241 a.C.). Durante esta última fase, nasceu a fama de Amílcar Barca que conduziu a guerra contra Roma desde o ano 247 a.C.. Com a grande derrota naval nas ilhas Égadas, ao noroeste da Sicília, os cartagineses se viram obrigados a firmar o Tratado de Lutácio na primavera de 241 a.C. com o cônsul Caio Lutácio Cátulo. Entre os termos impostos a Cartago por este tratado, se encontravam a cessão dos territórios da Sicília e das ilhas menores entre ela e a costa africana, assim como onerosas compensações de guerra.",
      "Finda a Primeira Guerra Púnica, apesar das precauções adotadas por Amílcar Barca, Cartago encontrou problemas na hora de dispersar seus regimentos armados de mercenários, que não tardaram em assaltar a cidade e provocar um conflito da envergadura de uma guerra civil. Este episódio histórico é conhecido como a Guerra dos Mercenários. Amílcar conseguiu reprimir esta rebelião depois de três anos, após vencer os rebeldes no rio Bagradas e de novo, com um grande derramamento de sangue, na Batalha do Desfiladeiro da Serra no ano de 237 a.C.. Da sua parte, Roma havia aproveitado a falta de resistência para tomar a Sardenha, anteriormente em mãos dos cartagineses. Após Cartago protestar por essa manobra, que supunha uma violação do tratado de paz recentemente firmado, Roma declarou guerra, mas propôs anulá-la se entregassem não somente a Sardenha, mas também a Córsega e mais compensações econômicas. Impotentes, os cartagineses tiveram que ceder e em 238 a.C. ambas as ilhas se converteram em possessões romanas. Para compensar este revés, Amílcar marchou à Ibéria, onde se apoderou de vastos territórios no sudeste do país. Durante uma década, Amílcar dirigiu a conquista do sul da Ibéria, apoiado militar e logisticamente por seu genro Asdrúbal. Esta conquista restabeleceu a situação econômica de Cartago, graças à exploração das minas de prata e estanho.",
    ] },
  { "title" = "Ascensão", "paragraphs" = [
      "Aníbal Barca nasceu provavelmente em Cartago no ano de 247 a.C.. Era o filho mais velho do general Amílcar Barca e de sua mulher ibérica. Os autores greco-romanos registraram pouco sobre a educação de Aníbal. É sabido que aprendeu as letras gregas, a história de Alexandre Magno e a arte da guerra com um preceptor espartano, chamado Sosilos. Desta maneira, adquiriu o modo de raciocínio e de ação que os gregos chamavam Métis, fundados na inteligência e a astúcia.",
      "Depois de haver expandido seu território, Amílcar enriqueceu sua família e, por extensão, Cartago. Para alcançar esse objetivo, Amílcar se baseou na cidade de Gadir (atual Cádis, Espanha), próxima ao estreito de Gibraltar, e começou a submeter as tribos ibéricas. Naquele momento, Cartago se encontrava em tal estado de empobrecimento que sua marinha era incapaz de transportar o exército à Hispânia. Logo, Amílcar foi obrigado a fazer seu exército marchar até as Colunas de Hércules, para cruzar ali em barco o estreito de Gibraltar, entre o que atualmente seriam Marrocos e Espanha.",
      "O historiador romano Tito Lívio menciona que quando Aníbal foi ver o seu pai e lhe rogou que lhe permitisse acompanhá-lo, este aceitou com a condição de que jurasse que durante toda sua existência nunca seria amigo de Roma. Outros historiadores referem que Aníbal declarou a seu pai:",
    ] },
  { "title" = "Segunda Guerra Púnica na Itália (218 a 203 a.C.)", "paragraphs" = [
      "Após o cerco e destruição de Sagunto pelos cartagineses, Roma decidiu atacar em duas frentes: Norte da África e Hispânia. Partiram da Sicília, ilha que serviu como base de operações. Contudo, Aníbal subverteu os planos dos romanos com uma estratégia inesperada: levar a guerra ao coração da península Itálica, marchando rapidamente atravessando a Hispânia e o sul da Gália.",
      "Ciente de que sua frota marítima era muito inferior à dos romanos, Aníbal decidiu não atacar pelo mar, escolhendo uma rota terrestre muito mais dura e mais longa mas mais interessante taticamente, já que lhe permitiu recrutar muitos soldados mercenários ou aliados provenientes dos povos celtas dispostos a combater os romanos. Antes de sua partida, Aníbal distribuiu habilmente seus efetivos e enviou ao Norte da África vários contingentes ibéricos, enquanto que ordenou que os soldados líbios-fenícios garantissem a segurança das possessões de Cartago na Hispânia.",
      "O general pôs em marcha o exército e enviou representantes para negociar sua passagem através dos Pireneus e costurar alianças com os povos presentes ao largo de sua rota. De acordo com Tito Lívio, Aníbal atravessou o rio Ebro com 90 000 soldados e 12 000 cavaleiros, e deixou um destacamento de 10 000 soldados e 1 000 cavaleiros para que defendessem a Hispânia, aos quais se somaram 11 000 ibéricos que se mostraram reticentes a abandonar seu território. Após sua passagem pelos Pirenéus, dispunha de 70 000 soldados e 10 000 cavaleiros. Conforme outras fontes, Aníbal chegou à Gália conduzindo 40 000 soldados e 12 000 cavaleiros. É difícil estabelecer um número aproximando de seu efetivo real. Algumas estimativas creem que liderava uma força de 80 000 homens. Quando de sua chegada à Itália, aparentemente liderava, segundo as fontes, entre 20 000 e 50 000 soldados e entre 6 000 e 9 000 cavaleiros. Por outro lado, em várias ocasiões (ou pelo menos no início da guerra), Cartago enviou reforços a Aníbal. A seu exército também se somaram muitos combatentes procedentes de tribos. Por volta de 40 000 galeses se juntaram ao exército cartaginês durante a guerra.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Com os cartagineses, desapareceu o maior inimigo que a República Romana enfrentou. Portanto, o equilíbrio pessoal de Aníbal se traduz em um fracasso. O Mediterrâneo ocidental tornou-se um \"lago romano\" do qual Cartago foi apartada, enquanto Roma estendeu seus domínios pelo mundo grego e pela Ásia.",
      "Mas, ao mesmo tempo (e aqui reside o paradoxo de seu equilíbrio), Aníbal tentou romper (com seus discursos sobre a liberdade das cidades) as alianças de Roma com as cidades gregas. Desta forma, o general obrigou a república a legitimar suas ações e a se comportar como uma grande potência imperialista. Por essa razão, Aníbal permaneceu no coração da história grega e romana.",
      "Muito tempo depois de sua morte, o nome de Aníbal continuou a representar um fantasma de uma ameaça perpétua à República Romana. Foi escrito que ensinou aos romanos o significado de medo a estes que se proclamavam descendentes de Marte.[carece de fontes]?",
    ] },
]

