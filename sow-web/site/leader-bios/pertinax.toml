[articles.ru]
text = "Публий Гельвий Пертинакс происходил из семьи вольноотпущенника и сделал карьеру на военной и административной службе. По данным историка Энтони Бёрли, в 185 году он стал наместником римской Британии и подавил там мятеж римских солдат. Затем он занимал должности в других провинциях и в 192 году стал префектом Рима. После убийства Коммода в конце того же года Пертинакс стал императором. Он правил около трёх месяцев и в 193 году был убит преторианцами. Античные авторы связывают его короткое правление с попытками восстановить дисциплину и ограничить расходы. Кассий Дион описывает продажу вещей Коммода с торгов, которая заодно выставила напоказ вкусы прежнего императора. К анекдотам «Истории Августов» следует относиться осторожно. «Казна бережливости» развивает идею использования излишка. Пока Пертинакс не участвует в активной сухопутной атаке между игроками, каждые 1 000 солдат, которые были бы потеряны при производстве из-за лимита войск, приносят 1 золота."
title = "Пертинакс"
lang = "ru"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
shortArticle = true
intro = ["Публий Гельвий Пертинакс происходил из семьи вольноотпущенника и сделал карьеру на военной и административной службе. По данным историка Энтони Бёрли, в 185 году он стал наместником римской Британии и подавил там мятеж римских солдат. Затем он занимал должности в других провинциях и в 192 году стал префектом Рима. После убийства Коммода в конце того же года Пертинакс стал императором. Он правил около трёх месяцев и в 193 году был убит преторианцами."]
sections = [{ title = "Дисциплина и бережливость", paragraphs = ["Античные авторы связывают его короткое правление с попытками восстановить дисциплину и ограничить расходы. Кассий Дион описывает продажу вещей Коммода с торгов, которая заодно выставила напоказ вкусы прежнего императора. К анекдотам «Истории Августов» следует относиться осторожно. «Казна бережливости» развивает идею использования излишка. Пока Пертинакс не участвует в активной сухопутной атаке между игроками, каждые 1 000 солдат, которые были бы потеряны при производстве из-за лимита войск, приносят 1 золота."] }]
sources = [{ title = "“Helvius Pertinax,” Oxford Classical Dictionary, Anthony R. Birley", url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307" }, { title = "Anthony R. Birley, “The Frontier Zone in Britain,” Brill", url = "https://brill.com/display/book/edcoll/9789047430391/Bej.9789004160446.i-589_024.pdf" }, { title = "Historia Augusta, Life of Pertinax 7–8, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Historia_Augusta/Pertinax*.html" }, { title = "Cassius Dio, Roman History, Book 74, University of Chicago", url = "https://penelope.uchicago.edu/thayer/e/roman/texts/cassius_dio/74%2A.html" }]

[articles.vi]
text = "Publius Helvius Pertinax xuất thân từ một gia đình nô lệ đã được giải phóng và thăng tiến qua các chức vụ quân sự và hành chính. Theo sử gia Anthony R. Birley, ông được bổ nhiệm cai trị tỉnh Britannia của La Mã từ năm 185 và dẹp một cuộc binh biến của quân La Mã tại đó. Ông từng giữ chức ở các tỉnh khác và làm quan cai quản thành Rome năm 192. Sau khi Commodus bị sát hại cuối năm ấy, Pertinax trở thành hoàng đế. Ông trị vì khoảng ba tháng trước khi bị các thành viên Cận vệ Pháp quan giết năm 193. Các tác giả cổ gắn triều đại ngắn ngủi của ông với nỗ lực khôi phục kỷ luật và hạn chế chi tiêu. Cassius Dio kể việc đem tài sản của Commodus ra đấu giá, đồng thời công khai sở thích của vị tiền nhiệm. Những giai thoại trong Historia Augusta cần được đọc thận trọng. Ngân khố tiết kiệm lấy ý tưởng từ việc thu giá trị từ nguồn lực dư thừa. Khi Pertinax không tham gia một cuộc tấn công bộ đang diễn ra giữa người chơi, mỗi 1.000 quân sản xuất vốn sẽ bị lãng phí vì chạm giới hạn đem lại 1 vàng."
title = "Pertinax"
lang = "vi"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
