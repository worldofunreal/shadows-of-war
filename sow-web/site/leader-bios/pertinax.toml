text = "プブリウス・ヘルウィウス・ペルティナクスは解放奴隷の家に生まれ、軍務と行政を通じて昇進した。歴史家アンソニー・バーリーによると、185年にローマ領ブリタンニアの総督となり、現地のローマ兵の反乱を鎮めた。これはローマ軍内部の事件で、総督が軍団を統率する難しさを示している。その後、アフリカ属州の総督を務め、192年にはローマ市の長官となり、二度目の執政官にも就任した。軍務と属州行政を経て、帝国の首都で要職を担った。同年末にコンモドゥスが殺害されると皇帝となった。在位はおよそ三か月で、193年に近衛兵に殺害された。属州での軍務とローマでの短い在位は別の時期の出来事であり、バーリーの研究はその間に務めた役職もたどっている。 古代の著述家は、ペルティナクスが軍の規律を立て直し、支出を抑えようとしたと伝える。カッシウス・ディオはコンモドゥスの所有品が競売にかけられ、奢侈品や競技に関わる品々を通じて先帝の好みが公になったと記す。ディオの説明では、競売は収入を得る機会であると同時に、前の治世が残した品を人々に示す機会でもあった。『ローマ皇帝群像』にも逸話が残るが、成立時期や記述の性質を考えて読む必要がある。ゲームの「緊縮の国庫」は、活用されない資源から価値を得るという発想を使っている。他プレイヤーへの陸上攻撃も他プレイヤーからの陸上攻撃も進行していない間、兵数上限のために受け取れない生産兵に対し、千人につき金一の割合で収入を得る。対象は上限を超えて余る生産分である。中立地への進軍中にも条件を満たしうるが、対プレイヤーの陸上攻撃が始まると換算は止まる。兵数に余裕があるときは生産がその空きを埋めるため、国庫に入る額は戦況と兵数の両方で変わる。"
title = "ペルティナクス"
lang = "ja"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
