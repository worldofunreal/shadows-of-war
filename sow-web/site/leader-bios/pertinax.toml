[articles.fr]
text = "Publius Helvius Pertinax était issu d’une famille d’affranchis et s’éleva par le service militaire et administratif. D’après l’historien Anthony R. Birley, il gouverna la province romaine de Bretagne à partir de 185 et y réprima une mutinerie de soldats romains. Il exerça d’autres fonctions provinciales et devint préfet de Rome en 192. Après l’assassinat de Commode à la fin de cette année, Pertinax devint empereur. Son règne dura environ trois mois et s’acheva lorsqu’il fut tué par des membres de la garde prétorienne en 193. Les auteurs anciens associent son bref règne à des tentatives de rétablir la discipline et de contenir les dépenses. Dion Cassius relate la vente aux enchères de biens de Commode, qui exposa aussi publiquement les goûts de son prédécesseur. Les anecdotes de l’Histoire Auguste appellent à la prudence. Trésor d’austérité reprend l’idée de tirer parti de ressources inutilisées. Tant qu’aucune attaque terrestre active entre joueurs n’implique Pertinax, chaque tranche de 1 000 soldats qui serait perdue à cause du plafond de troupes rapporte 1 pièce d’or."
title = "Pertinax"
lang = "fr"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
