[articles.it]
text = "Publio Elvio Pertinace proveniva da una famiglia di liberti e fece carriera nel servizio militare e nell’amministrazione. Secondo lo storico Anthony R. Birley, dal 185 governò la provincia romana della Britannia, dove represse un ammutinamento di soldati romani. Ricoprì altri incarichi provinciali e nel 192 divenne prefetto di Roma. Dopo l’assassinio di Commodo alla fine dell’anno, Pertinace divenne imperatore. Il suo regno durò circa tre mesi e si concluse quando membri della guardia pretoriana lo uccisero nel 193. Gli autori antichi associano il suo breve regno ai tentativi di ristabilire la disciplina e contenere le spese. Cassio Dione descrive la vendita all’asta di beni di Commodo, che espose in pubblico anche i gusti del predecessore. Gli aneddoti della Historia Augusta vanno letti con cautela. Tesoro di austerità riprende l’idea di ricavare valore da risorse inutilizzate. Finché Pertinace è estraneo agli attacchi terrestri attivi tra giocatori, ogni 1.000 truppe prodotte che andrebbero perdute per il limite di truppe fruttano 1 oro."
title = "Pertinace"
lang = "it"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
