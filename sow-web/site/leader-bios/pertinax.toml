[articles.ko]
text = "푸블리우스 헬비우스 페르티낙스는 해방노예 가문에서 태어나 군무와 행정 업무를 거치며 지위가 높아졌다. 역사학자 앤서니 벌리에 따르면 185년 로마령 브리타니아의 총독으로 부임해 로마 병사들의 반란을 진압했다. 이 사건은 로마군 내부의 충돌이었다. 페르티낙스는 이후 다른 속주에서 관직을 맡았고 192년에 로마시 장관이 됐다. 그해 말 코모두스가 살해된 뒤 황제가 됐다. 통치는 약 석 달 동안 이어졌으며 193년 근위대 병사들에게 살해되면서 끝났다. 벌리의 연구는 브리타니아 총독 시절과 황제 재위 사이에 그가 맡은 관직을 보여 준다. 고대 저술가들은 그의 짧은 재위를 군기를 회복하고 지출을 억제하려는 시도와 연결한다. 카시우스 디오는 코모두스가 모은 물건을 경매에 내놓았다고 기록했다. 사치품이나 경기와 관련된 물건을 내놓자 전임 황제의 취향도 공개됐다. 디오의 서술에서 이 경매는 수입을 얻고 이전 통치의 흔적을 공개하는 일이었다. 『히스토리아 아우구스타』에 실린 일화는 집필 시기와 성격을 고려해서 읽어야 한다. 게임의 ‘긴축의 국고’는 사용하지 못하는 생산분에서 가치를 얻는 발상에서 출발한다. 자신이 다른 플레이어를 공격하거나 다른 플레이어가 자신을 공격하는 진행 중 육상 전투가 없을 때, 병력 상한 때문에 받을 수 없는 생산 병력 1,000명당 금 1을 얻는다. 계산에는 남는 생산분이 들어가며 이미 배치한 병력은 그대로다. 병력에 여유가 있으면 생산분은 그 빈자리를 먼저 채운다. 중립지를 공격하는 동안에도 조건을 충족할 수 있지만 플레이어 간 육상 공격이 시작되면 환산이 멈춘다."
title = "페르티낙스"
lang = "ko"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
