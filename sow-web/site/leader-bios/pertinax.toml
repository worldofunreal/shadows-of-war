[articles.de]
text = "Publius Helvius Pertinax stammte aus einer Freigelassenenfamilie und stieg durch Militär- und Verwaltungsdienst auf. Nach dem Historiker Anthony R. Birley wurde er 185 Statthalter der römischen Provinz Britannien, wo er eine Meuterei römischer Soldaten niederschlug. Er bekleidete weitere Provinzämter und wurde 192 Stadtpräfekt von Rom. Nach der Ermordung des Commodus am Ende dieses Jahres wurde Pertinax Kaiser. Er regierte etwa drei Monate, bis ihn 193 Angehörige der Prätorianergarde töteten. Antike Autoren verbinden seine kurze Herrschaft mit dem Versuch, Disziplin herzustellen und Ausgaben zu begrenzen. Cassius Dio schildert die Versteigerung von Gegenständen des Commodus, die auch die Vorlieben des Vorgängers öffentlich vor Augen führte. Die Anekdoten der Historia Augusta sind mit Vorsicht zu lesen. Schatz der Sparsamkeit greift den Gedanken auf, ungenutzten Ertrag zu verwerten. Solange kein aktiver Landangriff zwischen Spielern Pertinax betrifft, bringen je 1.000 produzierte Truppen, die wegen des Truppenlimits verfallen würden, 1 Gold."
title = "Pertinax"
lang = "de"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
