text = "نشأ بوبليوس هلفيوس برتيناكس في أسرة من المعتَقين، وترقى في الخدمة العسكرية والإدارية. وبحسب المؤرخ أنتوني بيرلي، تولى حكم بريطانيا الرومانية عام 185 وقمع فيها تمرداً لجنود رومانيين. وتولى مناصب أخرى في الأقاليم، ثم أصبح حاكم مدينة روما عام 192. وبعد اغتيال كومودوس في نهاية ذلك العام أصبح برتيناكس إمبراطوراً. دام حكمه نحو ثلاثة أشهر وانتهى بمقتله على يد أفراد من الحرس البريتوري عام 193. تربط المصادر القديمة عهده القصير بمحاولات استعادة الانضباط وضبط الإنفاق. ويروي كاسيوس ديو كيف عُرضت مقتنيات كومودوس في المزاد، فكشفت أيضاً أذواق سلفه على الملأ. وتستدعي حكايات «التاريخ الأوغسطي» الحذر. وتستمد قدرة «خزانة التقشف» فكرتها من الانتفاع بالموارد الفائضة. عند غياب هجوم بري نشط بين اللاعبين يشارك فيه برتيناكس، يمنح كل 1000 جندي من الإنتاج الذي كان سيضيع بسبب سقف القوات قطعة ذهبية واحدة."
title = "برتيناكس"
lang = "ar"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
