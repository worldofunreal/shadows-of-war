[articles.id]
text = "Publius Helvius Pertinax berasal dari keluarga bekas budak yang telah dimerdekakan. Ia meniti karier dalam dinas militer dan pemerintahan. Menurut sejarawan Anthony R. Birley, pada 185 ia mulai memerintah provinsi Britannia dan menumpas pemberontakan tentara Romawi di sana. Ia memegang jabatan di provinsi lain dan menjadi prefek kota Roma pada 192. Setelah Commodus dibunuh pada akhir tahun itu, Pertinax menjadi kaisar. Ia memerintah sekitar tiga bulan sebelum dibunuh oleh anggota Garda Praetoria pada 193. Para penulis kuno mengaitkan masa pemerintahannya dengan upaya menegakkan disiplin dan membatasi pengeluaran. Cassius Dio menceritakan pelelangan barang milik Commodus yang sekaligus memperlihatkan selera pendahulunya kepada publik. Anekdot dalam Historia Augusta perlu dibaca dengan hati-hati. Perbendaharaan Hemat mengambil gagasan untuk memperoleh nilai dari produksi yang tidak terpakai. Selama Pertinax tidak terlibat dalam serangan darat aktif antarpemain, setiap 1.000 pasukan produksi yang akan terbuang karena batas pasukan menghasilkan 1 emas."
title = "Pertinax"
lang = "id"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
