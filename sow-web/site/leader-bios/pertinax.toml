[articles.pt-BR]
text = "Públio Hélvio Pertinax vinha de uma família de libertos e fez carreira no serviço militar e administrativo. Segundo o historiador Anthony R. Birley, em 185 passou a governar a província romana da Britânia, onde reprimiu um motim de soldados romanos. Exerceu cargos em outras províncias e tornou-se prefeito de Roma em 192. Após o assassinato de Cômodo no fim daquele ano, Pertinax tornou-se imperador. Seu governo durou cerca de três meses e terminou com seu assassinato por integrantes da guarda pretoriana em 193. Autores antigos associam seu breve governo a tentativas de restaurar a disciplina e conter os gastos. Dião Cássio relata o leilão dos bens de Cômodo, que também expôs ao público os gostos do antecessor. As anedotas da História Augusta exigem cautela. Tesouro da austeridade leva ao jogo a ideia de extrair valor da produção excedente. Enquanto nenhum ataque terrestre ativo entre jogadores envolver Pertinax, cada 1.000 tropas produzidas que seriam desperdiçadas por causa do limite rendem 1 de ouro."
title = "Pertinax"
lang = "pt-BR"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
shortArticle = true
