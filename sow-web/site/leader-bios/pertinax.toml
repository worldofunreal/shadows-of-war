[articles.en]
text = "Publius Helvius Pertinax rose from a freedman’s family through military and administrative service. The Oxford Classical Dictionary records that he governed Britain from 185 and suppressed a major legionary mutiny there. He later served as governor in several provinces and as prefect of Rome before becoming emperor after Commodus was killed at the end of 192. His reign lasted only about three months. Pertinax’s effort to restore military discipline alienated soldiers and contributed to the conditions around his eventual murder by the Praetorian Guard in 193. The sources describe a governor confronting mutinous troops within Rome’s own army, not an external invasion. Ancient accounts also describe fiscal restraint and the sale of possessions inherited from Commodus. Treasury of Austerity turns that fiscal theme into an economy choice: when no active player-versus-player land attack involves Pertinax, production that would be wasted at the troop cap earns gold instead. The conversion of surplus production is a game mechanism, not a historical policy of converting soldiers into money. The Historia Augusta is a problematic ancient source and its anecdotes require caution."
title = "Pertinax"
lang = "en"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
