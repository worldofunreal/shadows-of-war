[articles.fil]
text = "Nagmula si Publius Helvius Pertinax sa pamilya ng isang dating alipin na pinalaya. Umangat siya sa pamamagitan ng paglilingkod sa hukbo at sa pamahalaan. Ayon sa historyador na si Anthony R. Birley, pinamahalaan niya ang lalawigang Romano ng Britannia mula 185 at sinupil ang pag-aaklas ng mga kawal Romano roon. Humawak siya ng mga tungkulin sa ibang lalawigan at naging prepekto ng Roma noong 192. Nang paslangin si Commodus sa katapusan ng taong iyon, naging emperador si Pertinax. Tumagal nang halos tatlong buwan ang kaniyang pamumuno bago siya pinatay ng mga kasapi ng Guwardiyang Pretoryano noong 193. Iniuugnay ng mga sinaunang manunulat ang maikling pamumuno niya sa pagpapanumbalik ng disiplina at pagpigil sa gastos. Isinalaysay ni Cassius Dio ang pagbebenta sa subasta ng mga gamit ni Commodus, na naglantad din sa mga kinahihiligan ng naunang emperador. Kailangang basahing maingat ang mga anekdota sa Historia Augusta. Hango ang Kabang Matipid sa pagkuha ng halaga mula sa sobrang produksyon. Habang walang aktibong pag-atake sa lupa sa pagitan ng mga manlalaro na kinasasangkutan ni Pertinax, bawat 1,000 kawal na masasayang dahil sa limitasyon ng hukbo ay magbibigay ng 1 ginto."
title = "Pertinax"
lang = "fil"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
