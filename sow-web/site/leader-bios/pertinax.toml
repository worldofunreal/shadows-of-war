[articles.tr]
text = "Publius Helvius Pertinax azat edilmiş bir ailenin çocuğuydu ve askerlik ile idari hizmette yükseldi. Tarihçi Anthony R. Birley’ye göre 185’te Roma’nın Britanya eyaletini yönetmeye başladı ve orada Roma askerlerinin bir isyanını bastırdı. Başka eyalet görevlerinde bulundu ve 192’de Roma şehir prefekti oldu. Commodus yıl sonunda öldürülünce Pertinax imparator oldu. Yaklaşık üç ay süren saltanatı, 193’te Praetorian Muhafızları tarafından öldürülmesiyle sona erdi. Antik yazarlar kısa saltanatını disiplini yeniden kurma ve harcamaları kısma çabalarıyla ilişkilendirir. Cassius Dio, Commodus’un eşyalarının açık artırmaya çıkarıldığını ve önceki imparatorun zevklerinin böylece halka gösterildiğini anlatır. Historia Augusta’nın anekdotları dikkatle okunmalıdır. Tasarruf Hazinesi, kullanılamayan üretimden değer elde etme fikrini oyuna taşır. Pertinax’ın oyunculara karşı veya oyuncuların ona karşı etkin kara saldırısı yokken, asker sınırı yüzünden boşa gidecek her 1.000 askerlik üretim 1 altın kazandırır."
title = "Pertinax"
lang = "tr"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
