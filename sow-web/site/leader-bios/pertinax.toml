intro = ["普布利乌斯·赫尔维乌斯·佩蒂纳克斯出身于获释奴隶家庭，经由军事和行政职务晋升。历史学家安东尼·伯利记载，他在185年出任罗马不列颠行省总督，曾在那里平息罗马士兵的哗变。这次冲突发生在罗马军队内部，可以从军队与总督之间的关系来理解。此后，他曾主管意大利的公共赡养事务，也担任过阿非利加行省总督。192年他成为罗马城长官，并第二次担任执政官。他的经历包括边疆军务、行省治理和首都的行政工作。在担任皇帝之前，他已在帝国不同地区负责军队及民政事务。192年底，皇帝康茂德遇刺身亡，佩蒂纳克斯继任。他执政约三个月，于193年被禁卫军成员杀害。在如此短的统治期间，古代作者格外关注新皇帝怎样处理军纪和前朝遗留下来的财物。伯利对官职的梳理有助于把不列颠任内的哗变与多年后发生在罗马的刺杀分开。"]
sections = [{ title = "军纪与节制开支", paragraphs = ["古代文献把佩蒂纳克斯的短暂统治与整顿军纪和节制开支联系在一起。卡西乌斯·狄奥记载，康茂德收藏的物品被公开拍卖，其中包括与前任皇帝的奢侈生活和竞技活动有关的器物。按狄奥的理解，这场拍卖也让公众看到康茂德的个人爱好。变卖物品既能带来收入，也公开展示了新皇帝处理前朝财物的方式。《奥古斯塔史》还保存了一些有关佩蒂纳克斯的轶事。这些故事成书较晚，研究其动机时需要结合其他材料。游戏中的「节俭国库」从旧物可以重新产生价值这一点得到灵感，把原本会因上限而损失的部队产出换成金币。如果佩蒂纳克斯没有正在对其他玩家发起陆上攻击，也没有玩家正在从陆上攻击他，因兵力上限而无法入账的产出就按每一千人对应一金币的比例计入国库。换算的对象是本来会浪费的产出，地图上已有的部队仍然照常行动。玩家仍可向中立地扩张，但与其他玩家进行中的陆战会暂停这项换算。收入取决于实际溢出的产量和战斗状态。"] }]
sources = [{ title = "“Helvius Pertinax,” Oxford Classical Dictionary, Anthony R. Birley", url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307" }, { title = "Anthony R. Birley, “The Frontier Zone in Britain,” Brill", url = "https://brill.com/display/book/edcoll/9789047430391/Bej.9789004160446.i-589_024.pdf" }, { title = "Historia Augusta, Life of Pertinax 7–8, University of Chicago", url = "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Historia_Augusta/Pertinax*.html" }, { title = "Cassius Dio, Roman History, Book 74, University of Chicago", url = "https://penelope.uchicago.edu/thayer/e/roman/texts/cassius_dio/74%2A.html" }]

