[articles.es]
text = "Publio Helvio Pertinax procedía de una familia de libertos y ascendió mediante el servicio militar y administrativo. Según el historiador Anthony R. Birley, en 185 pasó a gobernar la provincia romana de Britania, donde sofocó un motín de tropas romanas. Ejerció otros cargos provinciales y fue prefecto de Roma en 192. Tras el asesinato de Cómodo a finales de ese año, Pertinax se convirtió en emperador. Su gobierno duró unos tres meses y terminó con su asesinato a manos de miembros de la guardia pretoriana en 193. Los autores antiguos asocian su breve mandato con intentos de restablecer la disciplina y contener el gasto. Casio Dion describe la subasta de bienes de Cómodo, que también expuso públicamente los gustos de su antecesor. La Historia Augusta aporta anécdotas que requieren cautela. Tesoro de austeridad toma la idea de recuperar valor de recursos ociosos. Mientras ningún ataque terrestre activo entre jugadores involucre a Pertinax, cada 1.000 tropas de producción que se perderían por alcanzar el límite aportan 1 de oro. La regla se aplica al excedente de producción."
title = "Pertinax"
lang = "es"
url = "https://academic.oup.com/edited-volume/61673/chapter-abstract/548948307"
shortArticle = true
