[articles.en]
text = "Hatshepsut ruled Egypt in the fifteenth century BCE during the Eighteenth Dynasty. She first acted as regent for the young Thutmose III, her nephew and stepson, and then assumed the title and powers of a pharaoh while he remained co-ruler. She commissioned major works including her terraced memorial temple at Deir el-Bahari. Its southern middle portico preserves reliefs of a royal expedition to Punt. The reliefs show the Egyptian delegation meeting people from Punt, goods being brought to the ships, and the expedition's presentation in the royal and religious setting of the temple."
title = "Hatshepsut"
lang = "en"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatshepsut ruled Egypt in the fifteenth century BCE during the Eighteenth Dynasty. She first acted as regent for the young Thutmose III, her nephew and stepson, and then assumed the title and powers of a pharaoh while he remained co-ruler. She commissioned major works including her terraced memorial temple at Deir el-Bahari. Its southern middle portico preserves reliefs of a royal expedition to Punt. The reliefs show the Egyptian delegation meeting people from Punt, goods being brought to the ships, and the expedition's presentation in the royal and religious setting of the temple."]
sections = [{ title = "The expedition to Punt", paragraphs = ["The Polish-Egyptian archaeological team identifies myrrh trees among the plants shown in the cargo. The Egyptian Museum in Cairo preserves original fragments of the scene, and the exact location of Punt remains debated. Gardens of Punt takes its inspiration from bringing living trees by ship. In the game, a merchant's arrival at a foreign port raises the lowest-level eligible farm within 12 tiles of its departure port by one level, to a maximum of level 4. The benefit can occur once per departure port and the upgraded farm flashes on the map. The farm stands for the cultivation made possible by importing plants."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.es]
text = "Hatshepsut gobernó Egipto en el siglo XV a. C., durante la dinastía XVIII. Primero fue regente del joven Tutmosis III, su sobrino e hijastro. Luego asumió el título y las atribuciones de faraón mientras él siguió como corregente. Encargó obras como su templo con terrazas en Deir el-Bahari. Los relieves de su pórtico central sur muestran la expedición que envió a Punt, el encuentro de la delegación egipcia con sus habitantes y la carga de mercancías. En el templo, las escenas sitúan el viaje en un contexto real y religioso."
title = "Hatshepsut"
lang = "es"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatshepsut gobernó Egipto en el siglo XV a. C., durante la dinastía XVIII. Primero fue regente del joven Tutmosis III, su sobrino e hijastro. Luego asumió el título y las atribuciones de faraón mientras él siguió como corregente. Encargó obras como su templo con terrazas en Deir el-Bahari. Los relieves de su pórtico central sur muestran la expedición que envió a Punt, el encuentro de la delegación egipcia con sus habitantes y la carga de mercancías. En el templo, las escenas sitúan el viaje en un contexto real y religioso."]
sections = [{ title = "La expedición a Punt", paragraphs = ["El equipo arqueológico polaco-egipcio identifica árboles de mirra entre las plantas representadas en la carga. El Museo Egipcio de El Cairo conserva fragmentos originales. La ubicación exacta de Punt sigue en discusión. Jardines de Punt toma como inspiración el traslado de árboles vivos en barco. Cuando un mercante completa una ruta a un puerto extranjero, sube un nivel la granja propia terminada de menor nivel a 12 casillas o menos del puerto de salida, hasta nivel 4. Ocurre una vez por puerto de salida y la granja mejorada destella en el mapa."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.fr]
text = "Hatchepsout gouverna l’Égypte au XVe siècle av. J.-C., sous la XVIIIe dynastie. Elle fut d’abord régente du jeune Thoutmôsis III, son neveu et beau-fils. Elle prit ensuite le titre et les pouvoirs du pharaon tandis qu’il demeura corégent. Elle commanda notamment son temple en terrasses à Deir el-Bahari. Les reliefs du portique médian sud montrent l’expédition qu’elle envoya à Pount, la rencontre de la délégation égyptienne avec ses habitants et le chargement des marchandises. Le temple présente le voyage dans un cadre royal et religieux."
title = "Hatchepsout"
lang = "fr"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatchepsout gouverna l’Égypte au XVe siècle av. J.-C., sous la XVIIIe dynastie. Elle fut d’abord régente du jeune Thoutmôsis III, son neveu et beau-fils. Elle prit ensuite le titre et les pouvoirs du pharaon tandis qu’il demeura corégent. Elle commanda notamment son temple en terrasses à Deir el-Bahari. Les reliefs du portique médian sud montrent l’expédition qu’elle envoya à Pount, la rencontre de la délégation égyptienne avec ses habitants et le chargement des marchandises. Le temple présente le voyage dans un cadre royal et religieux."]
sections = [{ title = "L’expédition au pays de Pount", paragraphs = ["L’équipe archéologique polono-égyptienne identifie des arbres à myrrhe parmi les plantes représentées dans la cargaison. Le Musée égyptien du Caire conserve des fragments originaux. La localisation exacte de Pount reste débattue. Jardins de Pount s’inspire du transport d’arbres vivants par bateau. Quand un navire marchand termine une route vers un port étranger, la ferme achevée de plus bas niveau à 12 cases ou moins de son port de départ gagne un niveau, jusqu’au niveau 4. L’effet survient une fois par port de départ et la ferme améliorée s’illumine sur la carte."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.de]
text = "Hatschepsut regierte Ägypten im 15. Jahrhundert v. Chr. während der 18. Dynastie. Zunächst war sie Regentin für ihren jungen Neffen und Stiefsohn Thutmosis III. Dann übernahm sie Titel und Befugnisse eines Pharaos, während er Mitregent blieb. Zu ihren Bauten gehört der Terrassentempel in Deir el-Bahari. Die Reliefs der südlichen mittleren Halle zeigen die Fahrt, die sie nach Punt entsandte, die Begegnung der ägyptischen Delegation mit den Bewohnern und das Verladen von Waren. Der Tempel stellt das Unternehmen in einen königlichen und religiösen Zusammenhang."
title = "Hatschepsut"
lang = "de"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatschepsut regierte Ägypten im 15. Jahrhundert v. Chr. während der 18. Dynastie. Zunächst war sie Regentin für ihren jungen Neffen und Stiefsohn Thutmosis III. Dann übernahm sie Titel und Befugnisse eines Pharaos, während er Mitregent blieb. Zu ihren Bauten gehört der Terrassentempel in Deir el-Bahari. Die Reliefs der südlichen mittleren Halle zeigen die Fahrt, die sie nach Punt entsandte, die Begegnung der ägyptischen Delegation mit den Bewohnern und das Verladen von Waren. Der Tempel stellt das Unternehmen in einen königlichen und religiösen Zusammenhang."]
sections = [{ title = "Die Fahrt nach Punt", paragraphs = ["Das polnisch-ägyptische Grabungsteam erkennt Myrrhenbäume unter den dargestellten Pflanzen. Das Ägyptische Museum in Kairo bewahrt Originalfragmente. Die genaue Lage von Punt ist weiterhin umstritten. Gärten von Punt greift den Transport lebender Bäume auf. Erreicht ein Handelsschiff einen fremden Hafen, steigt der eigene fertige Bauernhof mit der niedrigsten Stufe im Umkreis von 12 Feldern um den Abfahrtshafen um eine Stufe, höchstens bis Stufe 4. Das geschieht einmal pro Abfahrtshafen. Der Bauernhof leuchtet auf der Karte auf."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.it]
text = "Hatshepsut governò l’Egitto nel XV secolo a.C., durante la XVIII dinastia. Fu prima reggente per il giovane Thutmosi III, suo nipote e figliastro. Assunse poi il titolo e i poteri di faraone mentre lui rimase coreggente. Fra le opere che commissionò c’è il tempio a terrazze di Deir el-Bahari. I rilievi del portico mediano meridionale mostrano la spedizione da lei inviata a Punt, l’incontro della delegazione egizia con gli abitanti e il carico delle merci. Il tempio presenta il viaggio in un contesto regale e religioso."
title = "Hatshepsut"
lang = "it"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatshepsut governò l’Egitto nel XV secolo a.C., durante la XVIII dinastia. Fu prima reggente per il giovane Thutmosi III, suo nipote e figliastro. Assunse poi il titolo e i poteri di faraone mentre lui rimase coreggente. Fra le opere che commissionò c’è il tempio a terrazze di Deir el-Bahari. I rilievi del portico mediano meridionale mostrano la spedizione da lei inviata a Punt, l’incontro della delegazione egizia con gli abitanti e il carico delle merci. Il tempio presenta il viaggio in un contesto regale e religioso."]
sections = [{ title = "La spedizione a Punt", paragraphs = ["La missione archeologica polacco-egiziana identifica alberi di mirra fra le piante rappresentate nel carico. Il Museo Egizio del Cairo conserva frammenti originali. La posizione esatta di Punt è ancora discussa. Giardini di Punt si ispira al trasporto via mare di alberi vivi. Quando una nave mercantile completa una rotta verso un porto straniero, la fattoria completa di livello più basso entro 12 caselle dal porto di partenza sale di un livello, fino al livello 4. L’effetto scatta una volta per porto di partenza e la fattoria migliorata si illumina sulla mappa."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.tr]
text = "Hatşepsut, MÖ on beşinci yüzyılda On Sekizinci Hanedan döneminde Mısır’ı yönetti. Önce genç yeğeni ve üvey oğlu III. Thutmose adına naiplik yaptı. Daha sonra firavun unvanını ve yetkilerini üstlendi, Thutmose ise ortak hükümdar olarak kaldı. Deyrülbahri’deki teraslı anıt tapınağı onun yaptırdığı eserler arasındadır. Güneydeki orta revakın kabartmaları Punt’a gönderdiği seferi, Mısır heyetinin yerel halkla buluşmasını ve malların gemilere yüklenmesini gösterir. Tapınak seferi kraliyet ve din bağlamında sunar."
title = "Hatşepsut"
lang = "tr"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatşepsut, MÖ on beşinci yüzyılda On Sekizinci Hanedan döneminde Mısır’ı yönetti. Önce genç yeğeni ve üvey oğlu III. Thutmose adına naiplik yaptı. Daha sonra firavun unvanını ve yetkilerini üstlendi, Thutmose ise ortak hükümdar olarak kaldı. Deyrülbahri’deki teraslı anıt tapınağı onun yaptırdığı eserler arasındadır. Güneydeki orta revakın kabartmaları Punt’a gönderdiği seferi, Mısır heyetinin yerel halkla buluşmasını ve malların gemilere yüklenmesini gösterir. Tapınak seferi kraliyet ve din bağlamında sunar."]
sections = [{ title = "Punt seferi", paragraphs = ["Polonya-Mısır arkeoloji ekibi yükte gösterilen bitkiler arasında mür ağaçları olduğunu belirtir. Kahire’deki Mısır Müzesi özgün parçaları korur. Punt’un kesin konumu tartışmalıdır. Punt Bahçeleri, canlı ağaçların gemiyle taşınmasından esinlenir. Ticaret gemin yabancı limana ulaştığında kalkış limanının 12 kare yakınındaki en düşük seviyeli tamamlanmış çiftliğin bir seviye yükselir. Üst sınır 4. seviyedir. Etki kalkış limanı başına bir kez işler ve çiftlik haritada parlar."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.zh-CN]
text = "哈特谢普苏特在公元前十五世纪、第十八王朝时期统治埃及。她先为年幼的图特摩斯三世摄政。图特摩斯三世是她的侄子和继子，后来在她采用法老称号并行使王权时继续担任共同统治者。哈特谢普苏特主持了多项建设，其中包括代尔巴哈里的阶梯式纪念神庙。神庙中层南侧柱廊的浮雕记录了她派往蓬特的远征。画面展示埃及代表团与蓬特居民会面、物品被运上船只，以及远征在神庙中的宗教意义。浮雕把一次远行和王权、祭祀联系在一起。考察柱廊的考古团队指出，铭文还把这次远征与阿蒙神的神谕联系起来。图像和文字共同解释了王室为什么要把一场贸易航行刻在祭祀建筑上。考古保护团队记录了柱廊中原有的浮雕、残片和修复情况，开罗的埃及博物馆则保存了部分原件。这些材料提供了研究远征如何被宫廷纪念的依据。"
title = "哈特谢普苏特"
lang = "zh-CN"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["哈特谢普苏特在公元前十五世纪、第十八王朝时期统治埃及。她先为年幼的图特摩斯三世摄政。图特摩斯三世是她的侄子和继子，后来在她采用法老称号并行使王权时继续担任共同统治者。哈特谢普苏特主持了多项建设，其中包括代尔巴哈里的阶梯式纪念神庙。神庙中层南侧柱廊的浮雕记录了她派往蓬特的远征。画面展示埃及代表团与蓬特居民会面、物品被运上船只，以及远征在神庙中的宗教意义。浮雕把一次远行和王权、祭祀联系在一起。考察柱廊的考古团队指出，铭文还把这次远征与阿蒙神的神谕联系起来。图像和文字共同解释了王室为什么要把一场贸易航行刻在祭祀建筑上。考古保护团队记录了柱廊中原有的浮雕、残片和修复情况，开罗的埃及博物馆则保存了部分原件。这些材料提供了研究远征如何被宫廷纪念的依据。"]
sections = [{ title = "前往蓬特的远征", paragraphs = ["波兰与埃及的考古团队在浮雕的货物中辨认出没药树。画面还描绘了象牙等物品。开罗埃及博物馆的藏品说明提到，浮雕中的蓬特统治者和他的妻子出现在迎接使团的场景中。随行人员和货物也被刻入画面。蓬特的准确位置至今仍有争论，研究者会将浮雕中的植物和地理线索放在一起考察。运输活树意味着远征可以带回能够栽种的材料，这与运回已经制成的商品不同。游戏中的「蓬特花园」用商船的到达表现这类远征带来的种植收益。当己方商船完成通往外国港口的航线时，系统在出发港周围十二格内寻找己方已经完工、还可以升级的农场。其中等级最低的一座提升一级，最高达到四级。若没有符合条件的农场，便不会发生升级。每个出发港最多成功触发一次。升级后的农场会在地图上闪光，界面也会提示能力已经发动。游戏以农场升级表示跨海获取植物后带来的收益，具体等级、航线条件与距离由游戏规则决定。真实的浮雕则提供了这项设计的历史出发点。"] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.ja]
text = "ハトシェプストは紀元前十五世紀、エジプト第十八王朝を治めた。最初は幼いトトメス三世の摂政を務めた。トトメス三世は彼女のおいであり継子でもあった。彼女がファラオの称号と権限を得たあとも、トトメス三世は共同統治者として残った。ハトシェプストが造営を命じた建物には、デイル・エル・バハリの段状の葬祭殿がある。中段南側の柱廊の浮彫には、彼女が派遣したプント遠征が描かれた。そこにはエジプトの使節が現地の人々に会う場面や、物品を船に積む場面がある。遠征は神殿のなかで王権や祭祀と結び付けて記念された。柱廊を調査した研究者は、アメン神の神託と遠征を結び付ける碑文にも注目している。浮彫の絵と碑文の両方から、この航海が神殿でどのように語られたかを知ることができる。"
title = "ハトシェプスト"
lang = "ja"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["ハトシェプストは紀元前十五世紀、エジプト第十八王朝を治めた。最初は幼いトトメス三世の摂政を務めた。トトメス三世は彼女のおいであり継子でもあった。彼女がファラオの称号と権限を得たあとも、トトメス三世は共同統治者として残った。ハトシェプストが造営を命じた建物には、デイル・エル・バハリの段状の葬祭殿がある。中段南側の柱廊の浮彫には、彼女が派遣したプント遠征が描かれた。そこにはエジプトの使節が現地の人々に会う場面や、物品を船に積む場面がある。遠征は神殿のなかで王権や祭祀と結び付けて記念された。柱廊を調査した研究者は、アメン神の神託と遠征を結び付ける碑文にも注目している。浮彫の絵と碑文の両方から、この航海が神殿でどのように語られたかを知ることができる。"]
sections = [{ title = "プント遠征", paragraphs = ["ポーランドとエジプトの考古調査隊は、描かれた植物のなかに没薬の木を確認している。浮彫の一部の原物はカイロのエジプト博物館にあり、プントの正確な位置については議論が続く。カイロの博物館は、現地の統治者とその妻が使節を迎える場面も紹介している。船に積まれた物品だけでなく、使節と現地の人々との対面も遠征の記録に残された。生きた木を運んだ場面は、完成した品物に加えて、植えることのできる植物も船で運んだことを示す。ゲームの「プントの庭園」はそこから着想を得た。商船が外国の港への航路を完了すると、出発港から十二マス以内の自軍の完成済み農場のうち、まだ上限に達していない最低レベルの一つが一段階上がる。上限はレベル四で、効果が発動するのは出発港ごとに一回である。条件を満たす農場がなければ、効果は発動しない。農場の場所がマップで光り、通知が出るので、どの施設が強化されたか分かる。ゲームでの農場は、航海で持ち帰った植物を育てることを表す。"] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.ko]
text = "하트셉수트는 기원전 15세기 이집트 제18왕조를 다스렸다. 처음에는 어린 조카이자 의붓아들인 투트모세 3세를 대신해 섭정했다. 이후 파라오의 칭호와 권한을 얻었고 투트모세 3세는 공동 통치자로 남았다. 그녀가 지시한 건축물 가운데 데이르 엘바흐리의 계단식 장제전이 있다. 가운데 층 남쪽 주랑의 부조에는 그녀가 푼트로 보낸 원정대가 현지 사람들을 만나고 물건을 배에 싣는 모습이 남아 있다. 신전에서 이 원정은 왕권과 종교 의례의 맥락에서 기념되었다. 조사단은 원정과 아문 신의 신탁을 연결하는 비문도 소개한다."
title = "하트셉수트"
lang = "ko"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["하트셉수트는 기원전 15세기 이집트 제18왕조를 다스렸다. 처음에는 어린 조카이자 의붓아들인 투트모세 3세를 대신해 섭정했다. 이후 파라오의 칭호와 권한을 얻었고 투트모세 3세는 공동 통치자로 남았다. 그녀가 지시한 건축물 가운데 데이르 엘바흐리의 계단식 장제전이 있다. 가운데 층 남쪽 주랑의 부조에는 그녀가 푼트로 보낸 원정대가 현지 사람들을 만나고 물건을 배에 싣는 모습이 남아 있다. 신전에서 이 원정은 왕권과 종교 의례의 맥락에서 기념되었다. 조사단은 원정과 아문 신의 신탁을 연결하는 비문도 소개한다."]
sections = [{ title = "푼트 원정", paragraphs = ["폴란드와 이집트의 공동 조사단은 화물에 그려진 식물 중 몰약나무를 확인했다. 카이로 이집트 박물관은 부조의 원본 조각 일부를 보존하고 있다. 푼트의 정확한 위치에는 여전히 논쟁이 있다. 살아 있는 나무를 실은 장면은 원정에서 사용하기 위해 가공한 물건뿐 아니라 재배할 수 있는 식물도 가져왔음을 보여 준다. 게임의 ‘푼트의 정원’은 배로 식물을 운반한 일에서 착안했다. 내 상선이 외국 항구로 가는 항로를 완료하면, 출발 항구에서 12칸 안에 있는 내 완성된 농장 중 상한에 도달하지 않은 가장 낮은 레벨의 농장이 한 단계 오른다. 최대 레벨은 4이고 출발 항구마다 한 번 발동한다. 조건을 갖춘 농장이 없다면 효과가 일어나지 않는다. 효과가 발생하면 지도의 농장 위치가 빛나고 안내가 표시된다. 게임에서의 농장 강화는 먼 곳에서 가져온 식물을 키우는 일을 표현한다."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.ar]
text = "حكمت حتشبسوت مصر في القرن الخامس عشر قبل الميلاد خلال الأسرة الثامنة عشرة. بدأت وصية على تحتمس الثالث، ابن أخيها وربيبها الصغير، ثم تولت لقب الفرعون وسلطاته فيما بقي شريكاً في الحكم. وأمرت بأعمال كبرى منها معبدها المدرج في الدير البحري. وتصور نقوش الرواق الأوسط الجنوبي بعثتها إلى بونت، ولقاء الوفد المصري بسكانها، وتحميل البضائع على السفن. ويعرض المعبد الرحلة في سياق ملكي وديني."
title = "حتشبسوت"
lang = "ar"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["حكمت حتشبسوت مصر في القرن الخامس عشر قبل الميلاد خلال الأسرة الثامنة عشرة. بدأت وصية على تحتمس الثالث، ابن أخيها وربيبها الصغير، ثم تولت لقب الفرعون وسلطاته فيما بقي شريكاً في الحكم. وأمرت بأعمال كبرى منها معبدها المدرج في الدير البحري. وتصور نقوش الرواق الأوسط الجنوبي بعثتها إلى بونت، ولقاء الوفد المصري بسكانها، وتحميل البضائع على السفن. ويعرض المعبد الرحلة في سياق ملكي وديني."]
sections = [{ title = "البعثة إلى بونت", paragraphs = ["يحدد فريق الآثار البولندي المصري أشجار المر ضمن النباتات الظاهرة في الحمولة. ويحفظ المتحف المصري في القاهرة أجزاء أصلية من النقوش. ولا يزال الموقع الدقيق لبونت موضع نقاش. وتستلهم «حدائق بونت» نقل أشجار حية بحراً. عندما تكمل سفينتك التجارية مساراً إلى ميناء أجنبي، ترتفع مزرعتك المكتملة الأقل مستوى ضمن 12 خانة من ميناء الانطلاق مستوى واحداً، حتى المستوى 4. يحدث الأثر مرة لكل ميناء انطلاق، وتضيء المزرعة على الخريطة."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.ru]
text = "Хатшепсут правила Египтом в XV веке до н. э. во времена XVIII династии. Сначала она была регентом при юном племяннике и пасынке Тутмосе III. Затем она приняла титул и полномочия фараона, а Тутмос остался соправителем. Среди сооружений по её заказу был террасный храм в Дейр-эль-Бахри. Рельефы южного портика средней террасы показывают посланную ею экспедицию в Пунт, встречу египетской делегации с местными жителями и погрузку товаров. Храм представляет поход в царском и религиозном контексте."
title = "Хатшепсут"
lang = "ru"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Хатшепсут правила Египтом в XV веке до н. э. во времена XVIII династии. Сначала она была регентом при юном племяннике и пасынке Тутмосе III. Затем она приняла титул и полномочия фараона, а Тутмос остался соправителем. Среди сооружений по её заказу был террасный храм в Дейр-эль-Бахри. Рельефы южного портика средней террасы показывают посланную ею экспедицию в Пунт, встречу египетской делегации с местными жителями и погрузку товаров. Храм представляет поход в царском и религиозном контексте."]
sections = [{ title = "Экспедиция в Пунт", paragraphs = ["Польско-египетская археологическая экспедиция определяет среди растений на рельефах мирровые деревья. Подлинные фрагменты хранятся в Египетском музее в Каире. Точное местонахождение Пунта остаётся предметом споров. «Сады Пунта» вдохновлены перевозкой живых деревьев на кораблях. Когда ваш торговый корабль прибывает в чужой порт, ваша готовая ферма наименьшего уровня в радиусе 12 клеток от порта отправления получает один уровень, до четвёртого. Эффект срабатывает один раз на порт отправления, а ферма вспыхивает на карте."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.vi]
text = "Hatshepsut cai trị Ai Cập vào thế kỷ XV TCN, dưới Vương triều thứ Mười tám. Ban đầu bà nhiếp chính cho cháu trai kiêm con riêng của chồng là Thutmose III. Sau đó bà nắm danh hiệu và quyền lực của pharaon trong khi ông tiếp tục đồng trị vì. Công trình bà cho xây gồm đền tưởng niệm bậc thềm ở Deir el-Bahari. Phù điêu ở hành lang giữa phía nam mô tả đoàn bà phái đến Punt, cuộc gặp của sứ đoàn Ai Cập với người địa phương và cảnh chất hàng lên tàu. Ngôi đền đặt chuyến đi trong bối cảnh vương quyền và nghi lễ."
title = "Hatshepsut"
lang = "vi"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatshepsut cai trị Ai Cập vào thế kỷ XV TCN, dưới Vương triều thứ Mười tám. Ban đầu bà nhiếp chính cho cháu trai kiêm con riêng của chồng là Thutmose III. Sau đó bà nắm danh hiệu và quyền lực của pharaon trong khi ông tiếp tục đồng trị vì. Công trình bà cho xây gồm đền tưởng niệm bậc thềm ở Deir el-Bahari. Phù điêu ở hành lang giữa phía nam mô tả đoàn bà phái đến Punt, cuộc gặp của sứ đoàn Ai Cập với người địa phương và cảnh chất hàng lên tàu. Ngôi đền đặt chuyến đi trong bối cảnh vương quyền và nghi lễ."]
sections = [{ title = "Chuyến đi đến Punt", paragraphs = ["Đoàn khảo cổ Ba Lan–Ai Cập nhận diện cây một dược trong số thực vật được khắc trên phù điêu. Bảo tàng Ai Cập ở Cairo lưu giữ một số mảnh gốc. Vị trí chính xác của Punt vẫn còn tranh luận. Vườn Punt lấy cảm hứng từ việc chở cây sống bằng tàu. Khi tàu buôn của bạn hoàn thành tuyến tới cảng nước ngoài, trang trại đã hoàn tất có cấp thấp nhất của bạn trong phạm vi 12 ô quanh cảng xuất phát tăng một cấp, tối đa cấp 4. Hiệu ứng xảy ra một lần mỗi cảng xuất phát và trang trại lóe sáng trên bản đồ."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.id]
text = "Hatshepsut memerintah Mesir pada abad kelima belas SM, pada masa Dinasti Kedelapan Belas. Awalnya ia menjadi wali bagi Thutmose III, keponakan sekaligus anak tirinya yang masih muda. Kemudian ia mengambil gelar dan kewenangan firaun, sementara Thutmose tetap menjadi penguasa bersama. Salah satu bangunan yang ia perintahkan adalah kuil peringatan bertingkat di Deir el-Bahari. Relief di serambi tengah bagian selatan menggambarkan ekspedisi yang dikirimnya ke Punt, pertemuan utusan Mesir dengan penduduk setempat, dan pemuatan barang ke kapal. Kuil itu menempatkan ekspedisi dalam konteks kerajaan dan keagamaan."
title = "Hatshepsut"
lang = "id"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatshepsut memerintah Mesir pada abad kelima belas SM, pada masa Dinasti Kedelapan Belas. Awalnya ia menjadi wali bagi Thutmose III, keponakan sekaligus anak tirinya yang masih muda. Kemudian ia mengambil gelar dan kewenangan firaun, sementara Thutmose tetap menjadi penguasa bersama. Salah satu bangunan yang ia perintahkan adalah kuil peringatan bertingkat di Deir el-Bahari. Relief di serambi tengah bagian selatan menggambarkan ekspedisi yang dikirimnya ke Punt, pertemuan utusan Mesir dengan penduduk setempat, dan pemuatan barang ke kapal. Kuil itu menempatkan ekspedisi dalam konteks kerajaan dan keagamaan."]
sections = [{ title = "Ekspedisi ke Punt", paragraphs = ["Tim arkeologi Polandia–Mesir mengenali pohon mur di antara tumbuhan yang digambarkan sebagai muatan. Museum Mesir di Kairo menyimpan beberapa bagian asli relief. Lokasi persis Punt masih diperdebatkan. Kebun Punt terinspirasi oleh pengangkutan pohon hidup lewat laut. Saat kapal dagangmu menyelesaikan rute ke pelabuhan asing, pertanian rampung milikmu dengan tingkat terendah dalam jarak 12 petak dari pelabuhan keberangkatan naik satu tingkat, hingga tingkat 4. Efek berlaku sekali per pelabuhan keberangkatan dan pertanian berkilat di peta."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.fil]
text = "Namuno si Hatshepsut sa Ehipto noong ika-15 siglo BK, sa Ikalabingwalong Dinastiya. Una siyang naging rehente para sa batang si Thutmose III, na pamangkin at anak sa asawa niya. Kinalaunan ay inangkin niya ang titulo at kapangyarihan ng paraon habang nanatiling kasamang pinuno si Thutmose. Kabilang sa mga ipinagawa niya ang templong may mga terasa sa Deir el-Bahari. Makikita sa mga ukit ng timog na gitnang portiko ang paglalakbay sa Punt, ang pakikipagtagpo ng mga sugo sa mga naninirahan doon, at ang pagkarga ng mga kalakal. Iniuugnay ng templo ang paglalakbay sa hari at sa ritwal."
title = "Hatshepsut"
lang = "fil"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Namuno si Hatshepsut sa Ehipto noong ika-15 siglo BK, sa Ikalabingwalong Dinastiya. Una siyang naging rehente para sa batang si Thutmose III, na pamangkin at anak sa asawa niya. Kinalaunan ay inangkin niya ang titulo at kapangyarihan ng paraon habang nanatiling kasamang pinuno si Thutmose. Kabilang sa mga ipinagawa niya ang templong may mga terasa sa Deir el-Bahari. Makikita sa mga ukit ng timog na gitnang portiko ang paglalakbay sa Punt, ang pakikipagtagpo ng mga sugo sa mga naninirahan doon, at ang pagkarga ng mga kalakal. Iniuugnay ng templo ang paglalakbay sa hari at sa ritwal."]
sections = [{ title = "Ang paglalakbay sa Punt", paragraphs = ["Nakilala ng pangkat ng arkeologong Polako at Ehipsiyo ang mga puno ng mira sa mga larawang ukit ng kargamento. Nasa Museo ng Ehipto sa Cairo ang ilang orihinal na bahagi. Pinagtatalunan pa ang eksaktong lokasyon ng Punt. Hango ang Mga Hardin ng Punt sa pagdadala ng buhay na puno sa barko. Kapag natapos ang ruta ng iyong barkong pangkalakalan sa dayuhang daungan, tataas ng isang antas ang sarili mong tapos na sakahang may pinakamababang antas sa loob ng 12 tile ng pinanggalingang daungan, hanggang antas 4. Isang beses ito bawat pinanggalingang daungan at kikinang ang sakahan sa mapa."] }]
sources = [{ title = "The Metropolitan Museum of Art, Hatshepsut: From Queen to Pharaoh", url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh" }, { title = "Polish-Egyptian Archaeological and Conservation Expedition, Portico of Punt", url = "https://www.templeofhatshepsut.uw.edu.pl/en/middle_portico_south_portico_of_punt.html" }, { title = "Egyptian Museum Cairo, Four Fragments of Queen Hatshepsut’s Expedition to the Land of Punt", url = "https://egyptianmuseumcairo.eg/artefacts/four-fragments-of-queen-hatshepsuts-expedition-to-the-land-of-punt/" }]

[articles.pt-BR]
text = "Hatshepsut governou o Egito no século XV a.C., durante a XVIII dinastia. Primeiro foi regente do jovem Tutmés III, seu sobrinho e enteado. Depois assumiu o título e os poderes de faraó enquanto ele permaneceu como corregente. Entre as obras que encomendou está seu templo em terraços em Deir el-Bahari. Os relevos do pórtico central sul mostram a expedição enviada a Punt, o encontro da delegação egípcia com os habitantes e o embarque das mercadorias. O templo apresenta a viagem em um contexto real e religioso."
title = "Hatshepsut"
lang = "pt-BR"
url = "https://www.metmuseum.org/met-publications/hatshepsut-from-queen-to-pharaoh"
shortArticle = true
intro = ["Hatshepsut governou o Egito no século XV a.C., durante a XVIII dinastia. Primeiro foi regente do jovem Tutmés III, seu sobrinho e enteado. Depois assumiu o título e os poderes de faraó enquanto ele permaneceu como corregente. Entre as obras que encomendou está seu templo em terraços em Deir el-Bahari. Os relevos do pórtico central sul mostram a expedição enviada a Punt, o encontro da delegação egípcia com os habitantes e o embarque das mercadorias. O templo apresenta a viagem em um contexto real e religioso."]
sections = [{ title = "A expedição a Punt", paragraphs = ["A equipe arqueológica polonesa-egípcia identifica árvores de mirra entre as plantas mostradas na carga. O Museu Egípcio do Cairo conserva fragmentos originais. A localização exata de Punt ainda é debatida. Jardins de Punt se inspira no transporte de árvores vivas por navio. Quando um mercante completa uma rota até um porto estrangeiro, a fazenda própria concluída de menor nível a até 12 casas do porto de partida sobe um nível, até o nível 4. O efeito ocorre uma vez por porto de partida e a fazenda melhorada pisca no mapa."] }]
