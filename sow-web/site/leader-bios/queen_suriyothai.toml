[articles.en]
text = "Suriyothai was queen of Ayutthaya in the reign of Maha Chakkraphat. She is remembered in accounts of the invasion by the forces of the Burmese king Tabinshwehti, dated to 1548 in the chronology used by the Ayutthaya provincial account. In the royal chronicle tradition, the queen joined the army on elephant-back. When the king was in danger, she rode between him and the opposing commander and was fatally wounded. That account places her in the fighting and gives her a decision with consequences for the king and his army."
title = "Suriyothai"
lang = "en"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai was queen of Ayutthaya in the reign of Maha Chakkraphat. She is remembered in accounts of the invasion by the forces of the Burmese king Tabinshwehti, dated to 1548 in the chronology used by the Ayutthaya provincial account. In the royal chronicle tradition, the queen joined the army on elephant-back. When the king was in danger, she rode between him and the opposing commander and was fatally wounded. That account places her in the fighting and gives her a decision with consequences for the king and his army."]
sections = [{ title = "The elephant intercession", paragraphs = ["Historian Sunait Chutintaranond compares Thai and Burmese accounts of elephant combat. The traditions record the campaign differently, and the later Ayutthaya narratives provide details that are difficult to confirm independently. The province commemorates the queen at Si Suriyothai Pagoda, and a modern monument at Thung Makham Yong also preserves the story. Ayutthaya Escort adapts the act of interposing oneself to protect an ally. When a land army would take the center of an active allied city, Suriyothai spends 1,500 reserve troops to halt that attempt and remove up to 1,500 troops from that army. She can intervene once per allied city. The unit counts and city-center trigger are game rules."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.es]
text = "Suriyothai fue reina de Ayutthaya durante el reinado de Maha Chakkraphat. Se la recuerda en los relatos de la invasión de las fuerzas del rey birmano Tabinshwehti, que la cronología usada por la provincia de Ayutthaya sitúa en 1548. Según la tradición de las crónicas reales, la reina se incorporó al ejército montada en un elefante. Cuando el rey quedó en peligro, se interpuso entre él y el comandante enemigo y recibió una herida mortal. El relato le atribuye una decisión en el campo de batalla que afectó al rey y a su ejército."
title = "Suriyothai"
lang = "es"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai fue reina de Ayutthaya durante el reinado de Maha Chakkraphat. Se la recuerda en los relatos de la invasión de las fuerzas del rey birmano Tabinshwehti, que la cronología usada por la provincia de Ayutthaya sitúa en 1548. Según la tradición de las crónicas reales, la reina se incorporó al ejército montada en un elefante. Cuando el rey quedó en peligro, se interpuso entre él y el comandante enemigo y recibió una herida mortal. El relato le atribuye una decisión en el campo de batalla que afectó al rey y a su ejército."]
sections = [{ title = "La intervención a lomos de un elefante", paragraphs = ["El historiador Sunait Chutintaranond compara los relatos tailandeses y birmanos del combate en elefante. Las tradiciones difieren en cómo registran la campaña y varios detalles de las crónicas tardías de Ayutthaya son difíciles de confirmar por otras vías. La provincia recuerda a la reina en la pagoda Si Suriyothai y en un monumento moderno en Thung Makham Yong. Escolta de Ayutthaya adapta su intervención para proteger a un aliado. Si un ataque terrestre está por tomar el centro de una ciudad aliada operativa, Suriyothai gasta 1.500 tropas de reserva, frena ese intento y elimina hasta 1.500 atacantes. Puede intervenir una vez por ciudad aliada."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.fr]
text = "Suriyothai était reine d’Ayutthaya sous le règne de Maha Chakkraphat. Les récits de l’invasion par les forces du roi birman Tabinshwehti lui donnent un rôle dans une campagne que la province d’Ayutthaya date de 1548. Dans la tradition des chroniques royales, la reine rejoignit l’armée à dos d’éléphant. Quand le roi se trouva en danger, elle s’interposa entre lui et le commandant ennemi et fut mortellement blessée. Le récit lui attribue une décision prise sur le champ de bataille qui eut des conséquences pour le roi et son armée."
title = "Suriyothai"
lang = "fr"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai était reine d’Ayutthaya sous le règne de Maha Chakkraphat. Les récits de l’invasion par les forces du roi birman Tabinshwehti lui donnent un rôle dans une campagne que la province d’Ayutthaya date de 1548. Dans la tradition des chroniques royales, la reine rejoignit l’armée à dos d’éléphant. Quand le roi se trouva en danger, elle s’interposa entre lui et le commandant ennemi et fut mortellement blessée. Le récit lui attribue une décision prise sur le champ de bataille qui eut des conséquences pour le roi et son armée."]
sections = [{ title = "L’intervention à dos d’éléphant", paragraphs = ["L’historien Sunait Chutintaranond compare les récits thaïs et birmans du combat à dos d’éléphant. Les traditions diffèrent et plusieurs détails des chroniques tardives d’Ayutthaya restent difficiles à confirmer. La pagode Si Suriyothai et le monument moderne de Thung Makham Yong entretiennent sa mémoire. Escorte d’Ayutthaya adapte le geste de s’interposer pour protéger un allié. Si une armée terrestre va prendre le centre d’une ville alliée active, Suriyothai engage 1 500 soldats de réserve pour arrêter la tentative et éliminer jusqu’à 1 500 attaquants. Elle intervient une fois par ville alliée."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.de]
text = "Suriyothai war Königin von Ayutthaya unter Maha Chakkraphat. Die Überlieferung verbindet sie mit dem Einmarsch des birmanischen Königs Tabinshwehti, den die Provinz Ayutthaya auf 1548 datiert. Nach den Königschroniken schloss sie sich dem Heer auf einem Elefanten an. Als der König in Gefahr geriet, stellte sie sich zwischen ihn und den gegnerischen Befehlshaber und wurde tödlich verwundet. Die Erzählung schreibt ihr eine Entscheidung auf dem Schlachtfeld zu, die den König und sein Heer betraf."
title = "Suriyothai"
lang = "de"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai war Königin von Ayutthaya unter Maha Chakkraphat. Die Überlieferung verbindet sie mit dem Einmarsch des birmanischen Königs Tabinshwehti, den die Provinz Ayutthaya auf 1548 datiert. Nach den Königschroniken schloss sie sich dem Heer auf einem Elefanten an. Als der König in Gefahr geriet, stellte sie sich zwischen ihn und den gegnerischen Befehlshaber und wurde tödlich verwundet. Die Erzählung schreibt ihr eine Entscheidung auf dem Schlachtfeld zu, die den König und sein Heer betraf."]
sections = [{ title = "Das Eingreifen auf dem Elefanten", paragraphs = ["Der Historiker Sunait Chutintaranond vergleicht thailändische und birmanische Berichte über den Kampf auf Elefanten. Die Überlieferungen unterscheiden sich, und manche Einzelheiten der späteren Chroniken Ayutthayas sind schwer unabhängig zu bestätigen. Die Pagode Si Suriyothai und ein jüngeres Denkmal in Thung Makham Yong erinnern an die Königin. Geleit von Ayutthaya greift ihr Eingreifen zum Schutz eines Verbündeten auf. Will ein Landheer das Zentrum einer aktiven verbündeten Stadt einnehmen, setzt sie 1.500 Reservetruppen ein, stoppt den Versuch und schaltet bis zu 1.500 Angreifer aus. Das geht einmal pro verbündeter Stadt."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.it]
text = "Suriyothai fu regina di Ayutthaya durante il regno di Maha Chakkraphat. È ricordata nei racconti dell’invasione delle forze del re birmano Tabinshwehti, datata al 1548 nella cronologia usata dalla provincia di Ayutthaya. Secondo la tradizione delle cronache reali, si unì all’esercito a dorso d’elefante. Quando il re fu in pericolo, si frappose tra lui e il comandante avversario e fu ferita a morte. Il racconto le attribuisce una decisione presa sul campo che ebbe conseguenze per il re e per il suo esercito."
title = "Suriyothai"
lang = "it"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai fu regina di Ayutthaya durante il regno di Maha Chakkraphat. È ricordata nei racconti dell’invasione delle forze del re birmano Tabinshwehti, datata al 1548 nella cronologia usata dalla provincia di Ayutthaya. Secondo la tradizione delle cronache reali, si unì all’esercito a dorso d’elefante. Quando il re fu in pericolo, si frappose tra lui e il comandante avversario e fu ferita a morte. Il racconto le attribuisce una decisione presa sul campo che ebbe conseguenze per il re e per il suo esercito."]
sections = [{ title = "L’intervento a dorso d’elefante", paragraphs = ["Lo storico Sunait Chutintaranond confronta i racconti thailandesi e birmani del combattimento sugli elefanti. Le tradizioni differiscono e vari dettagli delle cronache tarde di Ayutthaya sono difficili da confermare. La pagoda Si Suriyothai e un monumento moderno a Thung Makham Yong ricordano la regina. Scorta di Ayutthaya riprende il gesto di interporsi per un alleato. Quando un esercito terrestre sta per prendere il centro di una città alleata attiva, Suriyothai impiega 1.500 truppe di riserva, ferma il tentativo ed elimina fino a 1.500 attaccanti. Può intervenire una volta per città alleata."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.tr]
text = "Suriyothai, Maha Chakkraphat döneminde Ayutthaya kraliçesiydi. Ayutthaya eyaletinin 1548’e tarihlediği, Burma kralı Tabinshwehti’nin ordusunun istilasıyla ilgili anlatılarda anılır. Kraliyet kroniklerinin aktardığına göre bir filin sırtında orduya katıldı. Kral tehlikeye düşünce onunla düşman komutanının arasına girdi ve ölümcül biçimde yaralandı. Anlatı, kraliçenin savaş alanında kralı ve ordusunu etkileyen bir karar aldığını aktarır."
title = "Suriyothai"
lang = "tr"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai, Maha Chakkraphat döneminde Ayutthaya kraliçesiydi. Ayutthaya eyaletinin 1548’e tarihlediği, Burma kralı Tabinshwehti’nin ordusunun istilasıyla ilgili anlatılarda anılır. Kraliyet kroniklerinin aktardığına göre bir filin sırtında orduya katıldı. Kral tehlikeye düşünce onunla düşman komutanının arasına girdi ve ölümcül biçimde yaralandı. Anlatı, kraliçenin savaş alanında kralı ve ordusunu etkileyen bir karar aldığını aktarır."]
sections = [{ title = "Fil sırtında müdahale", paragraphs = ["Tarihçi Sunait Chutintaranond, fil üzerinde savaşla ilgili Tay ve Burma anlatılarını karşılaştırır. Gelenekler seferi farklı biçimlerde kaydeder ve geç Ayutthaya kroniklerindeki bazı ayrıntıları bağımsız olarak doğrulamak zordur. Si Suriyothai Pagodası ve Thung Makham Yong’daki modern anıt kraliçeyi anıyor. Ayutthaya Muhafızları, bir müttefiki korumak için araya girme hareketini oyuna uyarlar. Kara ordusu etkin bir müttefik şehrinin merkezini almak üzereyken Suriyothai 1.500 yedek asker harcayarak girişimi durdurur ve en fazla 1.500 saldırganı saf dışı bırakır. Her müttefik şehri için bir kez müdahale edebilir."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.zh-CN]
text = "苏里育泰是阿瑜陀耶国王摩诃查克拉帕特在位时的王后。关于缅甸国王莽瑞体军队进攻阿瑜陀耶的叙事提到了她。阿瑜陀耶府采用的年表把这次进攻放在1548年。省方叙述提到入侵军队经过三塔关，随后向阿瑜陀耶推进。按照阿瑜陀耶王家编年史流传下来的故事，王后乘战象跟随军队出战。国王面临危险时，她催动自己的战象来到国王与敌方指挥官之间，在交锋中受了致命伤。这个故事记住了她在战场上采取行动的决定，也把这次决定和当时在战场上的其他人联系起来。关于作战经过的细节则主要保存在阿瑜陀耶一方较晚的叙事中。编年史能够说明后来的作者怎样记述王后，却很难单凭这些记载还原她参与战斗的每个动作。"
title = "苏里育泰"
lang = "zh-CN"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["苏里育泰是阿瑜陀耶国王摩诃查克拉帕特在位时的王后。关于缅甸国王莽瑞体军队进攻阿瑜陀耶的叙事提到了她。阿瑜陀耶府采用的年表把这次进攻放在1548年。省方叙述提到入侵军队经过三塔关，随后向阿瑜陀耶推进。按照阿瑜陀耶王家编年史流传下来的故事，王后乘战象跟随军队出战。国王面临危险时，她催动自己的战象来到国王与敌方指挥官之间，在交锋中受了致命伤。这个故事记住了她在战场上采取行动的决定，也把这次决定和当时在战场上的其他人联系起来。关于作战经过的细节则主要保存在阿瑜陀耶一方较晚的叙事中。编年史能够说明后来的作者怎样记述王后，却很难单凭这些记载还原她参与战斗的每个动作。"]
sections = [{ title = "骑战象挡在国王身前", paragraphs = ["历史学者苏奈特·楚廷塔拉农比较了泰缅双方关于战象交锋的记载。两种传统叙述这场战事的方式有所不同，许多细节无法用另一方的记载独立确认。阿瑜陀耶的苏里育泰佛塔以她命名，通马坎永的纪念碑也让她的故事在地方流传。地方研究把纪念碑的兴建与今天的公共纪念区分开来，它记录了后人如何纪念王后。纪念碑由诗丽吉王后倡议，于1992年建成，现代研究还把它放在通马坎永作为阿瑜陀耶北部泛滥平原的地方史中考察。游戏中的「阿瑜陀耶护卫」以主动挡在盟友身前的举动为灵感。当敌方陆军本来可以夺取一座运作中的盟友城市的中心时，苏里育泰会消耗一千五百名己方预备兵，挡下这一次进攻，并从进攻部队中消灭至多一千五百人。每座盟友城市只能受到一次这样的保护。抵挡的是这一次夺取中心的行动，敌军如有剩余部队仍可以继续进攻。成功发动时，盟友城市的中心会在地图上闪光，参与者也会收到界面提示。预备兵不足时，能力不会发动。城市中心、预备兵和损失的数目都是游戏规则，用于表现以自己的兵力承担保护盟友的代价。"] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.ja]
text = "スリヨータイは、マハー・チャクラパットの治世のアユタヤの王妃だった。ビルマの王タビンシュエーティーの軍が攻め込んだ際の物語に登場する。アユタヤ県が用いる年代では、この侵攻は1548年の出来事である。王朝年代記の伝承によると、王妃は戦象に乗って軍に加わった。王が危険にさらされると、自分の象を王と敵の指揮官の間に進め、戦いのなかで致命傷を負った。伝承で注目されるのは、王妃が戦場で自ら判断して行動したことだ。この一連の細かい動きは、主に後の時代にまとめられたアユタヤ側の記述を通じて伝わっている。"
title = "スリヨータイ"
lang = "ja"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["スリヨータイは、マハー・チャクラパットの治世のアユタヤの王妃だった。ビルマの王タビンシュエーティーの軍が攻め込んだ際の物語に登場する。アユタヤ県が用いる年代では、この侵攻は1548年の出来事である。王朝年代記の伝承によると、王妃は戦象に乗って軍に加わった。王が危険にさらされると、自分の象を王と敵の指揮官の間に進め、戦いのなかで致命傷を負った。伝承で注目されるのは、王妃が戦場で自ら判断して行動したことだ。この一連の細かい動きは、主に後の時代にまとめられたアユタヤ側の記述を通じて伝わっている。"]
sections = [{ title = "戦象に乗って王の前へ", paragraphs = ["歴史家スナイット・チュティンタラーノンは、戦象の戦いを描くタイ側とビルマ側の記録を比較している。両者の語り方は異なり、後世の記録が伝える場面を別の資料で確かめることには限界がある。アユタヤのシー・スリヨータイ仏塔やトゥン・マカーム・ヨンの近代の記念碑は、この王妃の名と物語を伝えてきた。1992年に建てられた記念碑は、地域で王妃の行動がどのように語り継がれてきたかを示す。近年の研究は、記念碑とともに、都市の北側に広がる氾濫原としてのこの土地にも注目している。ゲームの「アユタヤの護衛」は、味方を守るために間に入ったという行動に着想を得ている。敵の陸軍が稼働中の同盟都市の中心を取ろうとすると、スリヨータイは予備兵を千五百使い、その試みを止め、敵兵を最大千五百減らす。介入できるのは同盟都市ごとに一回である。残った敵軍は後でまた攻められる。発動すると都市の中心が光り、関係するプレイヤーに通知が出る。予備兵が足りなければ発動しない。都市の中心や兵数は、味方の防御を自分の兵で支えるためのゲーム内の条件である。"] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.ko]
text = "수리요타이는 마하 차크라팟이 다스리던 아유타야의 왕비였다. 아유타야 주가 사용하는 연대에서 1548년에 일어난 일로 보는 버마 왕 타빈슈웨티의 침공 이야기에서 기억된다. 왕실 연대기의 전승에 따르면 왕비는 코끼리를 타고 군대에 합류했다. 왕이 위험해지자 자신의 코끼리를 왕과 적장 사이로 몰았고, 전투에서 치명상을 입었다. 이 이야기는 왕비가 전장에서 내린 결정이 왕과 군대에 영향을 주었다고 전한다. 전투의 세부 묘사는 후대에 정리된 아유타야 기록을 통해 주로 전해진다."
title = "수리요타이"
lang = "ko"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["수리요타이는 마하 차크라팟이 다스리던 아유타야의 왕비였다. 아유타야 주가 사용하는 연대에서 1548년에 일어난 일로 보는 버마 왕 타빈슈웨티의 침공 이야기에서 기억된다. 왕실 연대기의 전승에 따르면 왕비는 코끼리를 타고 군대에 합류했다. 왕이 위험해지자 자신의 코끼리를 왕과 적장 사이로 몰았고, 전투에서 치명상을 입었다. 이 이야기는 왕비가 전장에서 내린 결정이 왕과 군대에 영향을 주었다고 전한다. 전투의 세부 묘사는 후대에 정리된 아유타야 기록을 통해 주로 전해진다."]
sections = [{ title = "전투 코끼리를 타고 가로막다", paragraphs = ["역사학자 수나잇 추틴타라논은 코끼리 전투를 다룬 태국과 버마의 기록을 비교했다. 전쟁을 전하는 방식은 서로 다르고, 후대 연대기에 나오는 장면을 독립적으로 확인하기는 어렵다. 아유타야의 시 수리요타이 불탑과 퉁 마캄 용의 현대 기념물에는 왕비를 기억하는 전통이 이어진다. 퉁 마캄 용에 기념물이 건립된 때는 1992년이다. 이 장소에 관한 연구는 기념물과 함께 도시 북쪽의 범람원에도 주목했다. 게임의 ‘아유타야 호위대’는 동맹을 지키기 위해 앞을 가로막은 행동에 착안했다. 적의 육군이 가동 중인 동맹 도시의 중심을 차지하려 할 때 수리요타이는 자신의 예비군 1,500명을 써서 그 시도를 막고, 공격 병력을 최대 1,500명 제거한다. 동맹 도시마다 한 번 개입할 수 있으며, 적군은 살아남은 병력으로 다시 공격할 수 있다. 예비군이 부족하면 발동하지 않는다. 발동하면 도시 중심이 지도에서 빛나고 관계된 플레이어에게 안내가 표시된다."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.ar]
text = "كانت سوريوتاي ملكة أيوتايا في عهد مها تشاكرافات. وتظهر في روايات غزو قوات الملك البورمي تابينشويهتي، الذي تؤرخه مقاطعة أيوتايا بسنة 1548. وتروي تقاليد السجلات الملكية أنها انضمت إلى الجيش على ظهر فيل. وحين تعرض الملك للخطر، تقدمت بفيلها بينه وبين قائد العدو، فأصيبت إصابة قاتلة. وتنسب إليها الرواية قراراً اتخذته في الميدان وكانت له عواقب على الملك وجيشه."
title = "سوريوتاي"
lang = "ar"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["كانت سوريوتاي ملكة أيوتايا في عهد مها تشاكرافات. وتظهر في روايات غزو قوات الملك البورمي تابينشويهتي، الذي تؤرخه مقاطعة أيوتايا بسنة 1548. وتروي تقاليد السجلات الملكية أنها انضمت إلى الجيش على ظهر فيل. وحين تعرض الملك للخطر، تقدمت بفيلها بينه وبين قائد العدو، فأصيبت إصابة قاتلة. وتنسب إليها الرواية قراراً اتخذته في الميدان وكانت له عواقب على الملك وجيشه."]
sections = [{ title = "التدخل على ظهر الفيل", paragraphs = ["يقارن المؤرخ سونايت تشوتينتارانوند بين الروايات التايلاندية والبورمية للقتال على الفيلة. وتختلف الروايات في وصف الحملة ويصعب التحقق من بعض تفاصيل السجلات المتأخرة. وتحفظ باغودا سي سوريوتاي والنصب الحديث في ثونغ ماخام يونغ ذكرى الملكة. وتستلهم قدرة «حرس أيوتايا» تدخلها لحماية حليف. حين يوشك جيش بري معادٍ على أخذ مركز مدينة حليفة عاملة، تنفق سوريوتاي 1500 جندي احتياط لصد المحاولة والقضاء على ما يصل إلى 1500 مهاجم. ويمكنها التدخل مرة لكل مدينة حليفة."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.ru]
text = "Сурийотхай была королевой Аюттхаи при Маха Чаккрапхате. Её помнят в связи с вторжением войск бирманского короля Табиншвехти, которое в хронологии провинции Аюттхая датировано 1548 годом. Согласно традиции королевских хроник, она присоединилась к войску верхом на слоне. Когда королю угрожала опасность, она встала между ним и вражеским командующим и была смертельно ранена. Предание приписывает ей решение, принятое на поле боя и повлиявшее на короля и его войско."
title = "Сурийотхай"
lang = "ru"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Сурийотхай была королевой Аюттхаи при Маха Чаккрапхате. Её помнят в связи с вторжением войск бирманского короля Табиншвехти, которое в хронологии провинции Аюттхая датировано 1548 годом. Согласно традиции королевских хроник, она присоединилась к войску верхом на слоне. Когда королю угрожала опасность, она встала между ним и вражеским командующим и была смертельно ранена. Предание приписывает ей решение, принятое на поле боя и повлиявшее на короля и его войско."]
sections = [{ title = "Вмешательство на боевом слоне", paragraphs = ["Историк Сунат Чутинтараннон сравнивает тайские и бирманские рассказы о боях на слонах. Традиции описывают поход по-разному, и ряд деталей поздних хроник трудно подтвердить независимо. Пагода Си Сурийотхай и современный памятник в Тхунг Макхам Йонге сохраняют память о королеве. «Эскорт Аюттхаи» передаёт её решение заслонить союзника. Когда сухопутная армия готова взять центр действующего союзного города, Сурийотхай расходует 1 500 резервных солдат, срывает попытку и уничтожает до 1 500 нападающих. Она может вмешаться один раз на союзный город."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.vi]
text = "Suriyothai là vương hậu Ayutthaya dưới triều Maha Chakkraphat. Bà được nhắc đến trong các câu chuyện về cuộc xâm lược của quân vua Miến Điện Tabinshwehti, được niên biểu của tỉnh Ayutthaya ghi vào năm 1548. Theo truyền thống biên niên sử hoàng gia, bà cưỡi voi theo quân ra trận. Khi nhà vua gặp nguy hiểm, bà thúc voi vào giữa ông và chỉ huy đối phương rồi bị thương chí mạng. Câu chuyện ghi lại quyết định của bà trên chiến trường và tác động của nó đối với nhà vua và quân đội."
title = "Suriyothai"
lang = "vi"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai là vương hậu Ayutthaya dưới triều Maha Chakkraphat. Bà được nhắc đến trong các câu chuyện về cuộc xâm lược của quân vua Miến Điện Tabinshwehti, được niên biểu của tỉnh Ayutthaya ghi vào năm 1548. Theo truyền thống biên niên sử hoàng gia, bà cưỡi voi theo quân ra trận. Khi nhà vua gặp nguy hiểm, bà thúc voi vào giữa ông và chỉ huy đối phương rồi bị thương chí mạng. Câu chuyện ghi lại quyết định của bà trên chiến trường và tác động của nó đối với nhà vua và quân đội."]
sections = [{ title = "Can thiệp trên lưng voi", paragraphs = ["Sử gia Sunait Chutintaranond đối chiếu các ghi chép của Thái Lan và Miến Điện về chiến đấu trên voi. Các truyền thống kể khác nhau và nhiều chi tiết trong biên niên sử Ayutthaya đời sau khó được kiểm chứng độc lập. Tháp Si Suriyothai và tượng đài hiện đại ở Thung Makham Yong tưởng niệm bà. Hộ vệ Ayutthaya lấy ý tưởng từ việc đứng ra che chắn đồng minh. Khi bộ binh địch sắp chiếm trung tâm thành phố đồng minh đang hoạt động, Suriyothai dùng 1.500 quân dự bị để chặn lần chiếm đó và loại tối đa 1.500 quân địch. Bà can thiệp một lần mỗi thành phố đồng minh."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.id]
text = "Suriyothai adalah ratu Ayutthaya pada masa Maha Chakkraphat. Ia dikenang dalam kisah invasi pasukan raja Burma Tabinshwehti yang diberi tanggal 1548 dalam kronologi Provinsi Ayutthaya. Menurut tradisi kronik kerajaan, sang ratu ikut berperang dengan menunggang gajah. Saat raja terancam, ia memacu gajahnya ke antara raja dan komandan musuh dan terluka parah hingga tewas. Kisah itu mencatat keputusannya di medan perang dan dampaknya bagi raja dan pasukannya."
title = "Suriyothai"
lang = "id"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai adalah ratu Ayutthaya pada masa Maha Chakkraphat. Ia dikenang dalam kisah invasi pasukan raja Burma Tabinshwehti yang diberi tanggal 1548 dalam kronologi Provinsi Ayutthaya. Menurut tradisi kronik kerajaan, sang ratu ikut berperang dengan menunggang gajah. Saat raja terancam, ia memacu gajahnya ke antara raja dan komandan musuh dan terluka parah hingga tewas. Kisah itu mencatat keputusannya di medan perang dan dampaknya bagi raja dan pasukannya."]
sections = [{ title = "Mengadang dengan gajah perang", paragraphs = ["Sejarawan Sunait Chutintaranond membandingkan catatan Thai dan Burma tentang pertarungan di atas gajah. Keduanya menceritakan kampanye secara berbeda, dan beberapa rincian kronik Ayutthaya yang lebih muda sulit dipastikan secara independen. Pagoda Si Suriyothai dan monumen modern di Thung Makham Yong mengenang sang ratu. Pengawal Ayutthaya mengadaptasi tindakannya melindungi sekutu. Ketika pasukan darat musuh akan mengambil pusat kota aktif milik sekutu, Suriyothai menggunakan 1.500 pasukan cadangan untuk menggagalkan upaya itu dan menewaskan hingga 1.500 penyerang. Ia bisa turun tangan sekali per kota sekutu."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.fil]
text = "Si Suriyothai ay reyna ng Ayutthaya sa paghahari ni Maha Chakkraphat. Naaalala siya sa mga salaysay tungkol sa pagsalakay ng hukbo ng haring Burmese na si Tabinshwehti, na inilalagay sa 1548 ng kronolohiya ng lalawigan ng Ayutthaya. Ayon sa tradisyon ng mga kronikang maharlika, sumama ang reyna sa hukbo sakay ng elepante. Nang malagay sa panganib ang hari, pumagitna siya sa hari at sa kumander ng kaaway at nasugatan nang ikinamatay niya. Iniuugnay ng salaysay ang pasiya niya sa labanan sa sinapit ng hari at ng hukbo."
title = "Suriyothai"
lang = "fil"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Si Suriyothai ay reyna ng Ayutthaya sa paghahari ni Maha Chakkraphat. Naaalala siya sa mga salaysay tungkol sa pagsalakay ng hukbo ng haring Burmese na si Tabinshwehti, na inilalagay sa 1548 ng kronolohiya ng lalawigan ng Ayutthaya. Ayon sa tradisyon ng mga kronikang maharlika, sumama ang reyna sa hukbo sakay ng elepante. Nang malagay sa panganib ang hari, pumagitna siya sa hari at sa kumander ng kaaway at nasugatan nang ikinamatay niya. Iniuugnay ng salaysay ang pasiya niya sa labanan sa sinapit ng hari at ng hukbo."]
sections = [{ title = "Pagharang sakay ng elepante", paragraphs = ["Inihahambing ng historyador na si Sunait Chutintaranond ang mga salaysay na Thai at Burmese tungkol sa labanan sakay ng elepante. Magkaiba ang kanilang pagsasalaysay at mahirap tiyakin ang ilang detalye mula sa mga huling kronika ng Ayutthaya. Inaalala ang reyna sa pagodang Si Suriyothai at sa makabagong bantayog sa Thung Makham Yong. Hango ang Bantay ng Ayutthaya sa pagharang upang protektahan ang kakampi. Kapag kukunin na ng hukbong panlupa ang sentro ng aktibong lungsod ng kakampi, gagamit si Suriyothai ng 1,500 reserbang kawal upang pigilan iyon at alisin ang hanggang 1,500 umaatake. Maaari siyang mamagitan nang isang beses bawat lungsod ng kakampi."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]

[articles.pt-BR]
text = "Suriyothai foi rainha de Ayutthaya no reinado de Maha Chakkraphat. É lembrada nos relatos da invasão das tropas do rei birmanês Tabinshwehti, datada de 1548 na cronologia usada pela província de Ayutthaya. Na tradição das crônicas reais, a rainha juntou-se ao exército montada num elefante. Quando o rei ficou em perigo, ela se colocou entre ele e o comandante inimigo e recebeu um ferimento mortal. O relato atribui a ela uma decisão tomada no campo de batalha com consequências para o rei e seu exército."
title = "Suriyothai"
lang = "pt-BR"
url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/"
shortArticle = true
intro = ["Suriyothai foi rainha de Ayutthaya no reinado de Maha Chakkraphat. É lembrada nos relatos da invasão das tropas do rei birmanês Tabinshwehti, datada de 1548 na cronologia usada pela província de Ayutthaya. Na tradição das crônicas reais, a rainha juntou-se ao exército montada num elefante. Quando o rei ficou em perigo, ela se colocou entre ele e o comandante inimigo e recebeu um ferimento mortal. O relato atribui a ela uma decisão tomada no campo de batalha com consequências para o rei e seu exército."]
sections = [{ title = "A intervenção sobre um elefante", paragraphs = ["O historiador Sunait Chutintaranond compara relatos tailandeses e birmaneses sobre combates em elefantes. As tradições descrevem a campanha de maneiras diferentes, e vários detalhes das crônicas tardias são difíceis de confirmar. O pagode Si Suriyothai e o monumento moderno de Thung Makham Yong preservam sua memória. Escolta de Ayutthaya adapta o gesto de se colocar à frente para proteger um aliado. Quando um exército terrestre está prestes a tomar o centro de uma cidade aliada ativa, Suriyothai gasta 1.500 tropas de reserva, impede a tentativa e elimina até 1.500 atacantes. Ela pode intervir uma vez por cidade aliada."] }]
sources = [{ title = "Sunait Chutintaranond, The Rite of the Elephant Duel in Thai-Burmese Military History, Manusya", url = "https://digital.car.chula.ac.th/manusya/vol7/iss2/4/" }, { title = "Supakan Nanrum and Natthaya Ketsomboon, Thung Makham Yong: History and the Monument of Suriyothai", url = "https://so04.tci-thaijo.org/index.php/JMA/article/view/285061" }, { title = "Ayutthaya Province, Si Suriyothai Pagoda", url = "https://go.ayutthaya.go.th/tourist-attraction/si-suriyothai-pagoda/" }]
