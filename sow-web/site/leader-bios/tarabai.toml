[articles.en]
text = "Tarabai (1675–1761) assumed the government of the Marathas after Rajaram died in 1700, ruling as regent for their young son Shivaji. She coordinated commanders and defended Maratha strongholds against the forces of the Mughal emperor Aurangzeb. Historian Richard M. Eaton describes her decision to send forces north into Mughal territory even as Maratha forts came under siege. The Satara Gazetteer describes how she assigned oversight of the forts to Parashuram Trimbak. After Aurangzeb's death in 1707, the return of the rival claimant Shahu opened a struggle within the Maratha ruling house."
title = "Tarabai"
lang = "en"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) assumed the government of the Marathas after Rajaram died in 1700, ruling as regent for their young son Shivaji. She coordinated commanders and defended Maratha strongholds against the forces of the Mughal emperor Aurangzeb. Historian Richard M. Eaton describes her decision to send forces north into Mughal territory even as Maratha forts came under siege. The Satara Gazetteer describes how she assigned oversight of the forts to Parashuram Trimbak. After Aurangzeb's death in 1707, the return of the rival claimant Shahu opened a struggle within the Maratha ruling house."]
sections = [{ title = "Regency and raids into Mughal territory", paragraphs = ["Maratha armies pushed into areas including Khandesh, Malwa, and Gujarat and exacted a levy called chauth, conventionally a quarter of assessed revenue. Its collection put military pressure and revenue-raising to work together. Chauth Counterraid adapts that policy to a single capture. Taking a completed tower from a rival with an active land attack against Tarabai transfers a quarter of that rival's available gold to her, up to 250, once per tower. The fortification marks the counterraid in the game. The historical levy was assessed on revenue in contested regions."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.es]
text = "Tarabai (1675–1761) asumió el gobierno maratha tras la muerte de Rajaram en 1700, como regente de su hijo Shivaji. Coordinó a los mandos y defendió las fortalezas marathas frente al emperador mogol Aurangzeb. El historiador Richard M. Eaton describe cómo envió fuerzas al norte, a territorio mogol, mientras sus propios fuertes sufrían asedios. El registro histórico de Satara recoge que encomendó la supervisión de los fuertes a Parashuram Trimbak. Tras la muerte de Aurangzeb en 1707, el regreso de Shahu como aspirante al trono abrió una disputa dentro de la casa gobernante maratha."
title = "Tarabai"
lang = "es"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) asumió el gobierno maratha tras la muerte de Rajaram en 1700, como regente de su hijo Shivaji. Coordinó a los mandos y defendió las fortalezas marathas frente al emperador mogol Aurangzeb. El historiador Richard M. Eaton describe cómo envió fuerzas al norte, a territorio mogol, mientras sus propios fuertes sufrían asedios. El registro histórico de Satara recoge que encomendó la supervisión de los fuertes a Parashuram Trimbak. Tras la muerte de Aurangzeb en 1707, el regreso de Shahu como aspirante al trono abrió una disputa dentro de la casa gobernante maratha."]
sections = [{ title = "Regencia e incursiones en territorio mogol", paragraphs = ["Los ejércitos marathas avanzaron por zonas como Khandesh, Malwa y Gujarat y exigieron un tributo llamado chauth, por lo general una cuarta parte de los ingresos tasados. Su cobro combinaba presión militar y recaudación. Chauth de contraataque adapta ese principio a una captura. Si Tarabai toma una torre terminada de un rival que la está atacando por tierra, recibe el 25% del oro disponible del rival, hasta 250 y una vez por torre. La fortificación señala el contraataque en el mapa. El chauth histórico se calculaba sobre los ingresos de territorios en disputa."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.fr]
text = "Tarabai (1675–1761) prit la tête du gouvernement marathe à la mort de Rajaram en 1700, comme régente de leur jeune fils Shivaji. Elle coordonna les commandants et défendit les places fortes face à l’empereur moghol Aurangzeb. L’historien Richard M. Eaton décrit sa décision d’envoyer des forces au nord en territoire moghol alors que les forts marathes étaient assiégés. Le répertoire historique de Satara rapporte qu’elle confia la surveillance des forts à Parashuram Trimbak. Après la mort d’Aurangzeb en 1707, le retour du prétendant Shahu ouvrit une lutte au sein de la maison marathe."
title = "Tarabai"
lang = "fr"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) prit la tête du gouvernement marathe à la mort de Rajaram en 1700, comme régente de leur jeune fils Shivaji. Elle coordonna les commandants et défendit les places fortes face à l’empereur moghol Aurangzeb. L’historien Richard M. Eaton décrit sa décision d’envoyer des forces au nord en territoire moghol alors que les forts marathes étaient assiégés. Le répertoire historique de Satara rapporte qu’elle confia la surveillance des forts à Parashuram Trimbak. Après la mort d’Aurangzeb en 1707, le retour du prétendant Shahu ouvrit une lutte au sein de la maison marathe."]
sections = [{ title = "Régence et incursions en territoire moghol", paragraphs = ["Les armées marathes avancèrent notamment au Khandesh, au Malwa et au Gujarat et réclamèrent le chauth, un prélèvement généralement fixé au quart des recettes évaluées. Cette collecte associait pression militaire et fiscalité. Chauth de contre-attaque applique ce principe à une capture. Lorsque Tarabai prend une tour achevée à un rival qui l’attaque par voie terrestre, elle prélève 25% de son or disponible, jusqu’à 250, une fois par tour. La fortification indique le lieu de la contre-attaque. Le prélèvement historique portait sur les recettes de régions disputées."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.de]
text = "Tarabai (1675–1761) übernahm nach Rajarams Tod im Jahr 1700 die Regierung der Marathen als Regentin für ihren jungen Sohn Shivaji. Sie koordinierte die Befehlshaber und verteidigte Festungen gegen den Mogulkaiser Aurangzeb. Der Historiker Richard M. Eaton beschreibt, wie sie Truppen nach Norden ins Mogulgebiet entsandte, während Marathenfestungen belagert wurden. Das historische Ortsverzeichnis von Satara berichtet, dass sie Parashuram Trimbak die Aufsicht über die Forts übertrug. Nach Aurangzebs Tod 1707 löste die Rückkehr des Thronanwärters Shahu einen Streit im Herrscherhaus aus."
title = "Tarabai"
lang = "de"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) übernahm nach Rajarams Tod im Jahr 1700 die Regierung der Marathen als Regentin für ihren jungen Sohn Shivaji. Sie koordinierte die Befehlshaber und verteidigte Festungen gegen den Mogulkaiser Aurangzeb. Der Historiker Richard M. Eaton beschreibt, wie sie Truppen nach Norden ins Mogulgebiet entsandte, während Marathenfestungen belagert wurden. Das historische Ortsverzeichnis von Satara berichtet, dass sie Parashuram Trimbak die Aufsicht über die Forts übertrug. Nach Aurangzebs Tod 1707 löste die Rückkehr des Thronanwärters Shahu einen Streit im Herrscherhaus aus."]
sections = [{ title = "Regentschaft und Vorstöße ins Mogulreich", paragraphs = ["Die Marathen rückten unter anderem nach Khandesh, Malwa und Gujarat vor und erhoben Chauth, üblicherweise ein Viertel der veranschlagten Einnahmen. Die Abgabe verband militärischen Druck mit der Beschaffung von Einnahmen. Chauth im Gegenangriff setzt diese Idee im Spiel bei einer Eroberung um. Nimmt Tarabai den fertigen Turm eines Rivalen ein, der sie gerade an Land angreift, erhält sie ein Viertel seines verfügbaren Goldes, höchstens 250 und einmal pro Turm. Der Turm markiert den Gegenangriff. Die historische Abgabe wurde auf Einnahmen aus umkämpften Gebieten berechnet."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.it]
text = "Tarabai (1675–1761) assunse il governo dei maratha dopo la morte di Rajaram nel 1700, come reggente del giovane figlio Shivaji. Coordinò i comandanti e difese le fortezze maratha dalle forze dell’imperatore moghul Aurangzeb. Lo storico Richard M. Eaton descrive la decisione di inviare truppe a nord in territorio moghul mentre i suoi forti erano sotto assedio. Il repertorio storico di Satara ricorda che affidò a Parashuram Trimbak la supervisione dei forti. Dopo la morte di Aurangzeb nel 1707, il ritorno del pretendente Shahu aprì un conflitto nella casa regnante maratha."
title = "Tarabai"
lang = "it"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) assunse il governo dei maratha dopo la morte di Rajaram nel 1700, come reggente del giovane figlio Shivaji. Coordinò i comandanti e difese le fortezze maratha dalle forze dell’imperatore moghul Aurangzeb. Lo storico Richard M. Eaton descrive la decisione di inviare truppe a nord in territorio moghul mentre i suoi forti erano sotto assedio. Il repertorio storico di Satara ricorda che affidò a Parashuram Trimbak la supervisione dei forti. Dopo la morte di Aurangzeb nel 1707, il ritorno del pretendente Shahu aprì un conflitto nella casa regnante maratha."]
sections = [{ title = "Reggenza e incursioni in territorio moghul", paragraphs = ["Gli eserciti maratha avanzarono in aree tra cui Khandesh, Malwa e Gujarat ed esigevano il chauth, in genere un quarto delle entrate stimate. Il tributo univa pressione militare e raccolta fiscale. Chauth di contrattacco adatta il principio a una conquista. Quando Tarabai prende una torre completa di un rivale che la sta attaccando via terra, riceve il 25% del suo oro disponibile, fino a 250, una volta per torre. La fortificazione indica dove è avvenuto il contrattacco. Il tributo storico si calcolava sulle entrate delle regioni contese."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.tr]
text = "Tarabai (1675–1761), Rajaram 1700’de ölünce küçük oğlu Şivaji adına naip olarak Maratha yönetimini üstlendi. Komutanları koordine etti ve Maratha kalelerini Babür İmparatoru Evrengzib’e karşı savundu. Tarihçi Richard M. Eaton, kendi kaleleri kuşatma altındayken Tarabai’nin kuzeye, Babür topraklarına kuvvet gönderdiğini anlatır. Satara’nın tarih kaydı, kalelerin gözetimini Paraşuram Trimbak’a verdiğini belirtir. Evrengzib’in 1707’de ölümünden sonra taht iddiacısı Şahu’nun dönüşü hanedan içinde mücadele başlattı."
title = "Tarabai"
lang = "tr"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761), Rajaram 1700’de ölünce küçük oğlu Şivaji adına naip olarak Maratha yönetimini üstlendi. Komutanları koordine etti ve Maratha kalelerini Babür İmparatoru Evrengzib’e karşı savundu. Tarihçi Richard M. Eaton, kendi kaleleri kuşatma altındayken Tarabai’nin kuzeye, Babür topraklarına kuvvet gönderdiğini anlatır. Satara’nın tarih kaydı, kalelerin gözetimini Paraşuram Trimbak’a verdiğini belirtir. Evrengzib’in 1707’de ölümünden sonra taht iddiacısı Şahu’nun dönüşü hanedan içinde mücadele başlattı."]
sections = [{ title = "Naiplik ve Babür topraklarına seferler", paragraphs = ["Maratha orduları Handeş, Malva ve Gucerat gibi bölgelere ilerledi ve genellikle hesaplanan gelirin dörtte biri olan chauth vergisini talep etti. Bu vergi askerî baskıyı gelir toplamayla birleştiriyordu. Karşı Akın Vergisi bu fikri oyunda bir fethe uyarlar. Tarabai, kendisine karadan saldıran bir rakibin tamamlanmış kulesini alınca rakibin mevcut altınının yüzde 25’ini, en fazla 250 altın olmak üzere alır. Bu etki kule başına bir kez işler. Tarihsel vergi, çekişmeli bölgelerin gelirleri üzerinden hesaplanıyordu."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.zh-CN]
text = "塔拉拜（1675—1761）在拉贾拉姆于1700年去世后接掌马拉塔政权，以年幼儿子希瓦吉的名义摄政。她协调将领，组织各地防守，抵抗莫卧儿皇帝奥朗则布派来的军队。萨塔拉地方史记载，她把监督堡垒的职责交给帕拉舒拉姆·特里姆巴克。历史学家理查德·伊顿指出，即使马拉塔的主要堡垒遭到围攻，塔拉拜仍然派兵向北深入莫卧儿领地。她同时推进防守与远征，使莫卧儿军队在围攻堡垒时还必须应付其他地区的威胁。1707年奥朗则布去世后，王位竞争者沙胡回到马拉塔，统治家族内部开始争夺权力。地方志记载，塔拉拜于1705年移居潘哈拉，并让拉姆钱德拉潘特分担政务。摄政时期的战事和后来的继承冲突是她政治生涯中的两个阶段。地方史与现代历史研究对这段时期的记述各有侧重，既包括堡垒的指挥安排，也包括远征的范围和向地方征收收入的办法。"
title = "塔拉拜"
lang = "zh-CN"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["塔拉拜（1675—1761）在拉贾拉姆于1700年去世后接掌马拉塔政权，以年幼儿子希瓦吉的名义摄政。她协调将领，组织各地防守，抵抗莫卧儿皇帝奥朗则布派来的军队。萨塔拉地方史记载，她把监督堡垒的职责交给帕拉舒拉姆·特里姆巴克。历史学家理查德·伊顿指出，即使马拉塔的主要堡垒遭到围攻，塔拉拜仍然派兵向北深入莫卧儿领地。她同时推进防守与远征，使莫卧儿军队在围攻堡垒时还必须应付其他地区的威胁。1707年奥朗则布去世后，王位竞争者沙胡回到马拉塔，统治家族内部开始争夺权力。地方志记载，塔拉拜于1705年移居潘哈拉，并让拉姆钱德拉潘特分担政务。摄政时期的战事和后来的继承冲突是她政治生涯中的两个阶段。地方史与现代历史研究对这段时期的记述各有侧重，既包括堡垒的指挥安排，也包括远征的范围和向地方征收收入的办法。"]
sections = [{ title = "摄政与深入莫卧儿领地的行动", paragraphs = ["马拉塔军队进入坎德什、马尔瓦和古吉拉特等地区，并在那里征收称为查乌特的款项。这个名称指四分之一，通常以当地评定收入的四分之一为计算依据。军队对地方施加的压力为征收创造了条件，而征得的收入又能维持军事与行政活动。这项征收在更早的马拉塔行动中已经出现，塔拉拜的战时政府继续在莫卧儿辖区采用它。游戏中的「反袭征收」把这种同时防守和进攻的情况缩小为一场攻守相连的遭遇。只有在对手正在对塔拉拜发动陆上攻击时，夺取该对手已完工的防御塔才能触发。塔拉拜收到对手现有金币的四分之一，最多二百五十金币。金币从被征收的一方转移给塔拉拜，每座防御塔最多成功征收一次。如果对手结束攻击，征收条件也随之消失。成功触发时，地图会标记被夺取的防御塔，并向双方显示通知。历史上的征收以地方收入为基础，游戏以即时转移金币和夺取防御塔表现军事压力与收入之间的关系。"] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.ja]
text = "ターラーバーイー（1675～1761年）は、1700年にラージャーラームが亡くなると、幼い息子シヴァージーの摂政としてマラーターの政権を引き継いだ。指揮官たちをまとめ、ムガル皇帝アウラングゼーブの軍に対して各地の要塞を守った。サーターラーの地方史には、パラシュラーム・トリンバクに要塞の監督を任せたことが記されている。歴史家リチャード・イートンによると、彼女は自軍の主要な砦が包囲されるなかでも、北方のムガル領へ部隊を送った。要塞の防衛と遠征を並行して進め、ムガル側に別の地域でも対応を迫ったのである。1707年にアウラングゼーブが死ぬと、王位を求めるシャーフーが戻り、マラーターの王家では継承をめぐる争いが始まった。地方史では、彼女は1705年にパンハーラーへ移り、ラームチャンドラパントに政務を分担させたとされる。"
title = "ターラーバーイー"
lang = "ja"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["ターラーバーイー（1675～1761年）は、1700年にラージャーラームが亡くなると、幼い息子シヴァージーの摂政としてマラーターの政権を引き継いだ。指揮官たちをまとめ、ムガル皇帝アウラングゼーブの軍に対して各地の要塞を守った。サーターラーの地方史には、パラシュラーム・トリンバクに要塞の監督を任せたことが記されている。歴史家リチャード・イートンによると、彼女は自軍の主要な砦が包囲されるなかでも、北方のムガル領へ部隊を送った。要塞の防衛と遠征を並行して進め、ムガル側に別の地域でも対応を迫ったのである。1707年にアウラングゼーブが死ぬと、王位を求めるシャーフーが戻り、マラーターの王家では継承をめぐる争いが始まった。地方史では、彼女は1705年にパンハーラーへ移り、ラームチャンドラパントに政務を分担させたとされる。"]
sections = [{ title = "摂政とムガル領への進攻", paragraphs = ["マラーター軍はカーンデーシュ、マールワー、グジャラートなどに進出し、チャウトと呼ばれる税を要求した。通常は査定した歳入の四分の一を指し、軍事的な圧力と徴収が結び付いていた。こうした徴収はターラーバーイー以前にも行われ、彼女の政権もムガル領で続けた。ゲームの「反撃のチャウト」は、守りながら相手の領地に攻め込む状況を一つの拠点の奪取として表す。ターラーバーイーに対する陸上攻撃が進行中の敵から完成済みの塔を奪うと、その相手が持つ金の四分の一を受け取る。上限は二百五十で、同じ塔で徴収が成功するのは一回だけである。相手が攻撃をやめれば条件を満たさない。効果が発動すると、奪った塔の場所が光り、双方に通知が届く。史料でいうチャウトは地域の歳入を対象とし、金の移動と塔の占領はその関係を示すためのゲーム上の設定である。"] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.ko]
text = "타라바이(1675~1761)는 1700년 라자람이 죽은 뒤 어린 아들 시바지를 대신해 마라타의 섭정이 됐다. 타라바이는 지휘관들을 조율하고 무굴 황제 아우랑제브의 군대에 맞서 요새들을 방어했다. 사타라 지방지는 그녀가 파라슈람 트림바크에게 요새의 감독을 맡겼다고 전한다. 역사학자 리처드 이튼은 마라타의 주요 요새가 포위되는 중에도 타라바이가 북쪽의 무굴 영토로 병력을 보냈다고 설명한다. 방어와 원정을 함께 이어 간 결과 무굴군은 요새에 병력을 쓰면서 다른 지역의 위협에도 대응해야 했다. 1707년 아우랑제브가 죽은 뒤 왕위 주장자 샤후가 돌아오면서 마라타 왕실 내부에서 계승권 분쟁이 시작됐다."
title = "타라바이"
lang = "ko"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["타라바이(1675~1761)는 1700년 라자람이 죽은 뒤 어린 아들 시바지를 대신해 마라타의 섭정이 됐다. 타라바이는 지휘관들을 조율하고 무굴 황제 아우랑제브의 군대에 맞서 요새들을 방어했다. 사타라 지방지는 그녀가 파라슈람 트림바크에게 요새의 감독을 맡겼다고 전한다. 역사학자 리처드 이튼은 마라타의 주요 요새가 포위되는 중에도 타라바이가 북쪽의 무굴 영토로 병력을 보냈다고 설명한다. 방어와 원정을 함께 이어 간 결과 무굴군은 요새에 병력을 쓰면서 다른 지역의 위협에도 대응해야 했다. 1707년 아우랑제브가 죽은 뒤 왕위 주장자 샤후가 돌아오면서 마라타 왕실 내부에서 계승권 분쟁이 시작됐다."]
sections = [{ title = "섭정과 무굴 영토 원정", paragraphs = ["마라타군은 칸데시, 말와, 구자라트 등으로 진출해 차우트라는 부담금을 요구했다. 보통 산정된 수입의 4분의 1을 뜻했고 군사적 압박과 세입 확보가 함께 이루어졌다. 이런 징수는 타라바이 이전에도 있었으며 그녀의 정부도 무굴 영역에서 이어 갔다. 게임의 ‘반격의 차우트’는 방어 중에도 상대 영토를 공격한 상황을 탑 점령으로 표현한다. 타라바이를 향한 육상 공격이 진행 중인 적의 완성된 탑을 점령하면 상대가 보유한 금의 4분의 1을 최대 250까지 가져온다. 같은 탑에서 징수에 성공하는 것은 한 번이다. 상대의 공격이 끝나면 발동 조건도 사라진다. 발동하면 빼앗은 탑의 위치가 지도에서 빛나고 양측에 알림이 표시된다. 역사 속 차우트는 분쟁 지역의 수입에 매긴 징수였으며, 게임의 탑과 금 이전은 그 관계를 표현한다."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.ar]
text = "تولت تاراباي (1675–1761) حكم المراثا بعد وفاة راجارام عام 1700، بصفتها وصية على ابنها الصغير شيفاجي. ونسقت عمل القادة ودافعت عن الحصون في مواجهة جيوش الإمبراطور المغولي أورنك زيب. ويصف المؤرخ ريتشارد إيتون إرسالها قوات إلى أراضي المغول شمالاً بينما كانت حصون المراثا تحت الحصار. ويذكر السجل التاريخي لساتارا أنها عهدت بالإشراف على الحصون إلى باراشورام تريمباك. وبعد وفاة أورنك زيب عام 1707، أدت عودة شاهو المطالب بالعرش إلى نزاع داخل الأسرة الحاكمة."
title = "تاراباي"
lang = "ar"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["تولت تاراباي (1675–1761) حكم المراثا بعد وفاة راجارام عام 1700، بصفتها وصية على ابنها الصغير شيفاجي. ونسقت عمل القادة ودافعت عن الحصون في مواجهة جيوش الإمبراطور المغولي أورنك زيب. ويصف المؤرخ ريتشارد إيتون إرسالها قوات إلى أراضي المغول شمالاً بينما كانت حصون المراثا تحت الحصار. ويذكر السجل التاريخي لساتارا أنها عهدت بالإشراف على الحصون إلى باراشورام تريمباك. وبعد وفاة أورنك زيب عام 1707، أدت عودة شاهو المطالب بالعرش إلى نزاع داخل الأسرة الحاكمة."]
sections = [{ title = "الوصاية والتوغل في أراضي المغول", paragraphs = ["توغلت جيوش المراثا في مناطق منها خانديش ومالوا وغوجارات وطالبت بجباية اسمها تشاوث، تعادل عادةً ربع الإيرادات المقدرة. وجمعت الجباية بين الضغط العسكري وتحصيل الإيراد. وتطبق «جباية الهجوم المضاد» هذه الفكرة على استيلاء واحد. عندما تأخذ تاراباي برجاً مكتملاً من خصم يهاجمها براً، تحصل على 25% من ذهبه المتاح، بحد أقصى 250 ومرة واحدة لكل برج. ويظهر البرج موضع الهجوم المضاد. وكانت الجباية التاريخية تُحسب على إيرادات المناطق المتنازع عليها."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.ru]
text = "Тарабай (1675–1761) возглавила правительство маратхов после смерти Раджарама в 1700 году и стала регентом при малолетнем сыне Шиваджи. Она координировала военачальников и обороняла крепости от войск могольского императора Аурангзеба. Историк Ричард Итон описывает, как она отправляла силы на север во владения Моголов, пока её собственные крепости были в осаде. Исторический справочник Сатары сообщает, что она поручила надзор за крепостями Парашураму Тримбаку. После смерти Аурангзеба в 1707 году возвращение претендента Шаху вызвало борьбу в правящем доме маратхов."
title = "Тарабай"
lang = "ru"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Тарабай (1675–1761) возглавила правительство маратхов после смерти Раджарама в 1700 году и стала регентом при малолетнем сыне Шиваджи. Она координировала военачальников и обороняла крепости от войск могольского императора Аурангзеба. Историк Ричард Итон описывает, как она отправляла силы на север во владения Моголов, пока её собственные крепости были в осаде. Исторический справочник Сатары сообщает, что она поручила надзор за крепостями Парашураму Тримбаку. После смерти Аурангзеба в 1707 году возвращение претендента Шаху вызвало борьбу в правящем доме маратхов."]
sections = [{ title = "Регентство и походы во владения Моголов", paragraphs = ["Войска маратхов продвинулись в Кхандеш, Малву и Гуджарат и взимали сбор чаут, обычно четверть расчётных доходов. Сбор сочетал военное давление и пополнение казны. «Чаут контрудара» переносит эту идею на захват башни. Если Тарабай берёт готовую башню соперника, который атакует её по суше, она получает четверть его доступного золота, до 250 и один раз на башню. Укрепление отмечает место контрудара. Исторический чаут рассчитывался на основе доходов спорных областей."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.vi]
text = "Tarabai (1675–1761) nắm chính quyền Maratha sau khi Rajaram qua đời năm 1700, làm nhiếp chính cho con trai nhỏ Shivaji. Bà điều phối các chỉ huy và bảo vệ pháo đài trước quân của hoàng đế Mughal Aurangzeb. Sử gia Richard M. Eaton mô tả việc bà đưa quân lên phía bắc vào đất Mughal trong khi các pháo đài Maratha bị vây. Địa chí Satara ghi bà giao việc giám sát các pháo đài cho Parashuram Trimbak. Sau khi Aurangzeb mất năm 1707, người tranh ngôi Shahu trở về và cuộc xung đột trong hoàng tộc Maratha bắt đầu."
title = "Tarabai"
lang = "vi"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) nắm chính quyền Maratha sau khi Rajaram qua đời năm 1700, làm nhiếp chính cho con trai nhỏ Shivaji. Bà điều phối các chỉ huy và bảo vệ pháo đài trước quân của hoàng đế Mughal Aurangzeb. Sử gia Richard M. Eaton mô tả việc bà đưa quân lên phía bắc vào đất Mughal trong khi các pháo đài Maratha bị vây. Địa chí Satara ghi bà giao việc giám sát các pháo đài cho Parashuram Trimbak. Sau khi Aurangzeb mất năm 1707, người tranh ngôi Shahu trở về và cuộc xung đột trong hoàng tộc Maratha bắt đầu."]
sections = [{ title = "Nhiếp chính và tiến quân vào đất Mughal", paragraphs = ["Quân Maratha tiến vào những vùng như Khandesh, Malwa và Gujarat và đòi khoản thu gọi là chauth, thường bằng một phần tư nguồn thu được định giá. Khoản thu gắn sức ép quân sự với việc huy động tài chính. Chauth phản kích đưa ý tưởng ấy vào một lần chiếm tháp. Khi Tarabai chiếm tháp đã hoàn tất của đối thủ đang tấn công bà trên bộ, bà nhận một phần tư số vàng họ đang có, tối đa 250, một lần mỗi tháp. Tháp đánh dấu vị trí phản kích. Chauth trong lịch sử được tính theo nguồn thu của vùng tranh chấp."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.id]
text = "Tarabai (1675–1761) mengambil alih pemerintahan Maratha setelah Rajaram wafat pada 1700, sebagai wali bagi putra mereka yang masih muda, Shivaji. Ia mengoordinasikan para panglima dan mempertahankan benteng dari pasukan kaisar Mughal Aurangzeb. Sejarawan Richard M. Eaton menjelaskan bahwa ia mengirim pasukan ke utara, ke wilayah Mughal, ketika benteng Maratha sendiri dikepung. Catatan sejarah Satara menyebut bahwa ia menyerahkan pengawasan benteng kepada Parashuram Trimbak. Setelah Aurangzeb wafat pada 1707, kembalinya penuntut takhta Shahu memicu perebutan di dalam keluarga penguasa."
title = "Tarabai"
lang = "id"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) mengambil alih pemerintahan Maratha setelah Rajaram wafat pada 1700, sebagai wali bagi putra mereka yang masih muda, Shivaji. Ia mengoordinasikan para panglima dan mempertahankan benteng dari pasukan kaisar Mughal Aurangzeb. Sejarawan Richard M. Eaton menjelaskan bahwa ia mengirim pasukan ke utara, ke wilayah Mughal, ketika benteng Maratha sendiri dikepung. Catatan sejarah Satara menyebut bahwa ia menyerahkan pengawasan benteng kepada Parashuram Trimbak. Setelah Aurangzeb wafat pada 1707, kembalinya penuntut takhta Shahu memicu perebutan di dalam keluarga penguasa."]
sections = [{ title = "Perwalian dan serbuan ke wilayah Mughal", paragraphs = ["Pasukan Maratha memasuki kawasan seperti Khandesh, Malwa, dan Gujarat dan menuntut pungutan bernama chauth, biasanya seperempat dari pendapatan yang ditaksir. Pungutan itu menggabungkan tekanan militer dan pengumpulan pendapatan. Chauth Serangan Balik mengadaptasi gagasan ini melalui perebutan menara. Saat Tarabai merebut menara rampung milik lawan yang sedang menyerangnya di darat, seperempat emas lawan berpindah kepadanya, hingga 250 dan sekali per menara. Menara menandai lokasi serangan balik. Pungutan dalam sejarah dihitung dari pendapatan kawasan yang diperebutkan."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.fil]
text = "Pinamunuan ni Tarabai (1675–1761) ang pamahalaang Maratha pagkamatay ni Rajaram noong 1700, bilang rehente ng kanilang batang anak na si Shivaji. Pinag-ugnay niya ang mga kumander at ipinagtanggol ang mga tanggulan laban sa hukbo ng emperador na Mughal na si Aurangzeb. Ayon sa historyador na si Richard M. Eaton, nagpadala siya ng mga kawal pahilaga sa lupain ng Mughal habang kinukubkob ang mga tanggulang Maratha. Itinala sa kasaysayan ng Satara na itinalaga niya si Parashuram Trimbak na mangasiwa sa mga tanggulan. Pagkamatay ni Aurangzeb noong 1707, nagbalik si Shahu bilang naghahabol sa trono at nagkaroon ng tunggalian sa naghaharing angkan."
title = "Tarabai"
lang = "fil"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Pinamunuan ni Tarabai (1675–1761) ang pamahalaang Maratha pagkamatay ni Rajaram noong 1700, bilang rehente ng kanilang batang anak na si Shivaji. Pinag-ugnay niya ang mga kumander at ipinagtanggol ang mga tanggulan laban sa hukbo ng emperador na Mughal na si Aurangzeb. Ayon sa historyador na si Richard M. Eaton, nagpadala siya ng mga kawal pahilaga sa lupain ng Mughal habang kinukubkob ang mga tanggulang Maratha. Itinala sa kasaysayan ng Satara na itinalaga niya si Parashuram Trimbak na mangasiwa sa mga tanggulan. Pagkamatay ni Aurangzeb noong 1707, nagbalik si Shahu bilang naghahabol sa trono at nagkaroon ng tunggalian sa naghaharing angkan."]
sections = [{ title = "Pamamahala bilang rehente at pagsalakay sa lupain ng Mughal", paragraphs = ["Sumulong ang hukbong Maratha sa Khandesh, Malwa, Gujarat at ibang lugar at naningil ng chauth, karaniwang isang-kapat ng tinatayang kita. Pinagsama nito ang panggigipit ng hukbo at paniningil. Inilalapat ng Chauth ng Pagsagupa ang prinsipyong ito sa pag-agaw ng tore. Kapag inagaw ni Tarabai ang tapos na tore ng kalabang umaatake sa kaniya sa lupa, makukuha niya ang isang-kapat ng ginto nito, hanggang 250 at isang beses bawat tore. Ang tore ang palatandaan ng ganting pagsalakay. Sa kasaysayan, batay ang chauth sa kita ng pinag-aagawang lugar."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]

[articles.pt-BR]
text = "Tarabai (1675–1761) assumiu o governo marata após a morte de Rajaram em 1700, como regente de seu filho pequeno Shivaji. Ela coordenou comandantes e defendeu fortalezas diante das tropas do imperador mogol Aurangzeb. O historiador Richard M. Eaton descreve o envio de forças para o norte, em território mogol, enquanto fortalezas maratas estavam sitiadas. O registro histórico de Satara relata que ela entregou a supervisão dos fortes a Parashuram Trimbak. Após a morte de Aurangzeb em 1707, a volta do pretendente Shahu abriu uma disputa na casa governante marata."
title = "Tarabai"
lang = "pt-BR"
url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A"
shortArticle = true
intro = ["Tarabai (1675–1761) assumiu o governo marata após a morte de Rajaram em 1700, como regente de seu filho pequeno Shivaji. Ela coordenou comandantes e defendeu fortalezas diante das tropas do imperador mogol Aurangzeb. O historiador Richard M. Eaton descreve o envio de forças para o norte, em território mogol, enquanto fortalezas maratas estavam sitiadas. O registro histórico de Satara relata que ela entregou a supervisão dos fortes a Parashuram Trimbak. Após a morte de Aurangzeb em 1707, a volta do pretendente Shahu abriu uma disputa na casa governante marata."]
sections = [{ title = "Regência e incursões em território mogol", paragraphs = ["Os exércitos maratas avançaram por Khandesh, Malwa, Gujarat e outras áreas e exigiram o chauth, tributo que em geral equivalia a um quarto da receita estimada. A cobrança unia pressão militar e arrecadação. Chauth de contra-ataque adapta a ideia a uma captura. Quando Tarabai toma uma torre concluída de um rival que a ataca por terra, recebe um quarto do ouro disponível dele, até 250 e uma vez por torre. A fortificação marca o contra-ataque. O tributo histórico incidia sobre receitas de regiões disputadas."] }]
sources = [{ title = "Richard M. Eaton, Tarabai (1675–1761): the rise of Brahmins in politics, Cambridge University Press", url = "https://www.cambridge.org/core/books/abs/social-history-of-the-deccan-13001761/tarabai-16751761-the-rise-of-brahmins-in-politics/047C683C223579529A84EC66D9A68F5A" }, { title = "Richard M. Eaton, India in the Persianate Age, 1000–1765", url = "https://zenodo.org/record/5119357/files/Eaton%202019.pdf" }, { title = "Satara District Gazetteer, Tarabai's Regency", url = "https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/SATARA/his_muslim_rule.html" }]
