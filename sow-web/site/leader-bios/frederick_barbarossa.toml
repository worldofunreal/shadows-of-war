[articles.en]
text = "Frederick Barbarossa, also known as Frederick I, was the Holy Roman Emperor from 1155 until his death in 1190. He was elected King of Germany in Frankfurt on 4 March 1152 and crowned in Aachen on 9 March 1152."
title = "Frederick Barbarossa"
lang = "en"
url = "https://en.wikipedia.org/wiki/Frederick_Barbarossa"
intro = [
  "Frederick Barbarossa (December 1122 – 10 June 1190), also known as Frederick I (German: Friedrich; Italian: Federico), was the Holy Roman Emperor from 1155 until his death in 1190. He was elected King of Germany in Frankfurt on 4 March 1152 and crowned in Aachen on 9 March 1152. He was crowned King of Italy on 24 April 1155 in Pavia and emperor by Pope Adrian IV on 18 June 1155 in Rome. Two years later, the term sacrum (\"holy\") first appeared in a document in connection with his empire. He was later formally crowned King of Burgundy, at Arles on 30 June 1178. His nickname of Barbarossa (meaning \"Red Beard\" in Italian) \"was first used by the Florentines only in 1298 to differentiate the emperor from his grandson, Frederick II ... and was never employed in medieval Germany\" (the colour red was \"also associated in the Middle Ages with malice and a hot temper\"; in reality, Frederick's hair was \"blond\", although his beard was described by a contemporary as \"reddish\"). In German, he was known as Kaiser Rotbart, which in English means \"Emperor Redbeard\". The prevalence of the Italian nickname, even in later German usage, reflects the centrality of the Italian campaigns under his reign, and \"remains to this day one of the [most] powerful historical monikers.\"",
  "Frederick was by inheritance Duke of Swabia (1147–1152, as Frederick III) before his imperial election in 1152. He was the son of Duke Frederick II of the Hohenstaufen dynasty and Judith, daughter of Henry IX, Duke of Bavaria, from the rival House of Welf. Frederick, therefore, descended from the two leading families in Germany, making him an acceptable choice for the Empire's prince-electors. Frederick joined the Third Crusade and opted to travel overland to the Holy Land. In 1190, Frederick drowned attempting to cross the Saleph River, leading to most of his army abandoning the Crusade before reaching Acre.",
  "Historians consider him among the Holy Roman Empire's greatest medieval emperors. He combined qualities that made him appear almost superhuman to his contemporaries: his longevity, his ambition, his extraordinary skills at organization, his battlefield acumen, and his political perspicacity. His contributions to Central European society and culture include the re-establishment of the Corpus Juris Civilis, or the Roman rule of law, which counterbalanced the papal power that had dominated the German states since the conclusion of the Investiture controversy. Due to his popularity and fame, in the 19th and early 20th centuries, he was used as a political symbol by many movements and regimes: the Risorgimento, the Wilhelmine government in Germany (especially under Emperor Wilhelm I), and the Nazi movement (Operation Barbarossa, Barbarossa decree) resulting in mixed legacies.",
]
sections = [
  { "title" = "Biography", "paragraphs" = [
      "Frederick was born to Duke Frederick II of Swabia and Judith of Bavaria in mid-December 1122. While his birthplace is not definitely known, it was likely Hagenau, then in the Duchy of Swabia of the Holy Roman Empire and today in France. His mother was from the Welf family, and his father was from the Hohenstaufen family, the two most powerful families in the empire. The Hohenstaufens were often called Ghibellines, which derives from the Italianized name for Waiblingen castle, the family seat in Swabia; the Welfs, in a similar Italianization, were called Guelfs. Frederick was also a descendant of the Salian dynasty through his paternal grandmother Agnes as she was the daughter of Emperor Henry IV and Bertha of Savoy. He also had ties to the Ottonian dynasty through his mother Judith as she hailed from Emperor Otto II and his wife Theophanu. Therefore, Frederick carried on the bloodline of Emperor Otto the Great and his wives, Eadgyth and Adelaide. He learned to ride, hunt and use weapons at an early age, but could neither read nor write, and was also unable to speak the Latin language until later in life. He took part in several Hoftage during the reign of his uncle, King Conrad III, which were a form of informal and irregular assembly popular among the empire's nobles. One took place in 1141 in Strasbourg, another in 1142 in Konstanz, 1143 in Ulm, 1144 in Würzburg and 1145 in Worms.",
      "In early 1147, Frederick decided to join the Second Crusade after his uncle, Conrad III of Germany, had taken the crusader vow in public on 28 December 1146. Frederick's father, Duke Frederick II, strongly objected to this and according to Otto of Freising, the duke berated his brother for permitting his son to go. The elder Frederick, who was dying, expected his son to look after his widow and younger half-brother once he had passed on, not risk his life by going on a crusade. Perhaps in preparation for the crusade, Frederick married Adelaide of Vohburg sometime before March 1147. His father died on 4 or 6 April and Frederick succeeded him as the Duke of Swabia. The German crusader army departed from Regensburg seven weeks later.",
      "In August 1147, while crossing the Byzantine Empire, an ill crusader stopped in a monastery outside Adrianople to recuperate. There he was robbed and killed. Conrad ordered Frederick to avenge him. The duke of Swabia razed the monastery, captured and executed the robbers and demanded they return the stolen money. The intervention of the Byzantine general Prosuch prevented further escalation. A few weeks later, on 8 September, Frederick and Welf VI were among the few German crusaders who survived when a flash flood destroyed the main camp. They had decided to encamp on a hill a ways away from the main army. The remains of the army reached Constantinople the following day.",
    ] },
  { "title" = "Frederick and the Justinian code", "paragraphs" = [
      "The increase in wealth of the trading cities of northern Italy led to a revival in the study of the Justinian Code, a Latin legal system that had become extinct centuries earlier. Legal scholars renewed its application. It is speculated that Pope Gregory VII personally encouraged the Justinian rule of law and had a copy of it. The historian Norman Cantor described Corpus Juris Civilis (Justinian Body of Civil Law) as \"the greatest legal code ever devised\". It envisaged the law of the state as a reflection of natural moral law, the principle of rationality in the universe. By the time Frederick assumed the throne, this legal system was well established on both sides of the Alps. He was the first to use the availability of the new professional class of lawyers. The Civil Law allowed Frederick to use these lawyers to administer his kingdom in a logical and consistent manner. It also provided a framework to legitimize his claim to the right to rule both Germany and northern Italy. In the old days of Henry IV and Henry V, the claim of divine right of kings had been severely undermined by the Investiture controversy. The Church had won that argument in the common man's mind. There was no divine right for the German king to also control the church by naming both bishops and popes. The institution of the Justinian code was used, perhaps unscrupulously, by Frederick to lay claim to divine powers.",
      "In Germany, Frederick was a political realist, taking what he could and leaving the rest. In Italy, he tended to be a romantic reactionary, reveling in the antiquarian spirit of the age, exemplified by a revival of classical studies and Roman law. It was through the use of the restored Justinian code that Frederick came to view himself as a new Roman emperor. Roman law gave a rational purpose for the existence of Frederick and his imperial ambitions. It was a counterweight to the claims of the Church to have authority because of divine revelation. The Church was opposed to Frederick for ideological reasons, not the least of which was the humanist nature found in the revival of the old Roman legal system. When Pepin the Short sought to become king of the Franks in the 8th century, the church needed military protection, so Pepin found it convenient to make an ally of the pope. Frederick, however, desired to put the pope aside and claim the crown of old Rome simply because he was in the likeness of the great emperors of old, who tended to have a domineering role over the church, Caesaropapism. Pope Adrian IV was naturally opposed to this view and undertook a vigorous propaganda campaign designed to diminish Frederick and his ambition. To a large extent, this was successful.",
    ] },
  { "title" = "Economic policy", "paragraphs" = [
      "Frederick did little to encourage economic development in Germany prior to the autumn of 1165. In that year he visited the lower Rhineland, the most economically advanced region in Germany. He had already travelled to northern Italy, the most economically advanced region in the Empire, three times. From 1165 on, Frederick pursued economic policies to encourage growth and trade. There is no question that his reign was a period of major economic growth in Germany, but it is impossible now to determine how much of that growth was owed to Frederick's policies.",
      "The number of mints in Germany increased ninefold in the reign of Frederick and his son Henry, from about two dozen mints at the start of his reign to 215 mints in 1197 and from a mere two royal mints to 28. Frederick himself established at least twelve royal mints, including those of Aachen, Donauwörth, Ulm, Hagenau, Duisburg, Kaiserswerth, Frankfurt, Gelnhausen and Dortmund. He also granted privileges exempting the merchants of Aachen, Gelnhausen, Hagenau, Monza, Rome, Pisa and Venice from all tolls within the Empire.",
    ] },
  { "title" = "Cultural depictions", "paragraphs" = [
      "Otto of Freising, Frederick's uncle, wrote an account of his reign entitled Gesta Friderici I imperatoris (Deeds of the Emperor Frederick), which is considered to be an accurate history of the king. Otto's other major work, the Chronica sive Historia de duabus civitatibus (Chronicle or History of the Two Cities) had been an exposition of the Civitas Dei (The City of God) of Augustine of Hippo, full of Augustinian negativity concerning the nature of the world and history. His work on Frederick is of opposite tone, being an optimistic portrayal of the glorious potentials of imperial authority. Otto died after finishing the first two books, leaving the last two to Rahewin, his provost. Rahewin's text is in places heavily dependent on classical precedent, although it \"was 'typical of medieval writers' to embellish their texts with choice quotations from earlier authors\". For example, Rahewin's physical description of Frederick reproduces word-for-word (except for details of hair and beard) a description of another monarch, Theodoric II written nearly eight hundred years earlier by Sidonius Apollinaris:",
      "His character is such that not even those envious of his power can belittle its praise. His person is well-proportioned. He is shorter than very tall men, but taller and more noble than men of medium height. His hair is golden, curling a little above his forehead ... His eyes are sharp and piercing, his beard reddish [barba subrufa], his lips delicate ... His whole face is bright and cheerful. His teeth are even and snow-white in color ... Modesty rather than anger causes him to blush frequently. His shoulders are rather broad, and he is strongly built",
      "In the opinion of Norman Cantor, Frederick's charisma led to a fantastic juggling act that, over a quarter of a century, restored the imperial authority in the German states. His formidable enemies defeated him on almost every side, yet in the end he emerged triumphant. When Frederick came to the throne, the prospects for the revival of German imperial power were extremely thin. The great German princes had increased their power and land holdings. The king had been left with only the traditional family domains and a vestige of power over the bishops and abbeys. The backwash of the Investiture controversy had left the German states in continuous turmoil. Rival states were in perpetual war. These conditions allowed Frederick to be both warrior and occasional peace-maker, both to his advantage.",
    ] },
]

[articles.es]
text = "Federico I de Hohenstaufen (Friedrich I, en alemán, llamado Barbarroja por el color de su barba; Barbarossa, en italiano, Rotbart, en alemán; cerca de Ravensburg, 1122-Río Saleph, 10 de junio de 1190) fue desde 1147 duque de Suabia con el nombre de Federico III, desde 1152 rey de los Romanos y a partir de 1155 emperador del Sacro Imperio Romano Germánico. El reinado de Barbarroja representó el apogeo del Sacro Imperio Romano Germánico, el primero que le dio ese nombre."
title = "Federico I Barbarroja"
lang = "es"
url = "https://es.wikipedia.org/wiki/Federico_I_Barbarroja"
intro = [
  "Federico I de Hohenstaufen (Friedrich I, en alemán, llamado Barbarroja por el color de su barba; Barbarossa, en italiano, Rotbart, en alemán; cerca de Ravensburg, 1122-Río Saleph, 10 de junio de 1190) fue desde 1147 duque de Suabia con el nombre de Federico III, desde 1152 rey de los Romanos y a partir de 1155 emperador del Sacro Imperio Romano Germánico.",
  "El reinado de Barbarroja representó el apogeo del Sacro Imperio Romano Germánico, el primero que le dio ese nombre. Fue responsable de afianzar el poder imperial tanto dentro de Alemania como en el norte de Italia, cuyas ciudades-estado se habían hecho independientes de facto. También fue quien introdujo un cuerpo legislativo unificado, acudiendo de nuevo al derecho romano.",
  "Sin embargo, la fama y el significado moderno de Federico Barbarroja está unido al nacionalismo alemán del siglo XIX. Barbarroja fue un referente para los nacionalistas alemanes que pretendían reunificar el país bajo un poder fuerte, como el del emperador. De hecho, la familia real prusiana pretendía legitimarse como soberanos de una Alemania unida por su relación con Barbarroja. Mientras Federico I era Rotbart o Barbarrossa, Guillermo I era Weißbart o Barbablanca.",
]
sections = [
  { "title" = "Nacimiento", "paragraphs" = [
      "El lugar de nacimiento de Barbarroja no se conoce con certeza. Su madre, Judith de Baviera, de la Casa de los Güelfos, dio a luz, según la única prueba documental, a su primer hijo en un castillo cerca de Altdorf, donde en la actualidad está la ciudad de Weingarten. Debido a que en la época era habitual que la madre diera a luz a los hijos en su patria, es probable que Federico naciera en la tierra de su madre. Sin embargo, no es seguro que este primer hijo fuera en efecto Barbarroja, debido a la elevada mortalidad infantil de la época.",
    ] },
  { "title" = "Vida", "paragraphs" = [
      "Como hijo del Hohenstaufen Federico II, el Tuerto, duque de Suabia, y de la güelfa Judith de Baviera, hija del duque Enrique el Negro de Baviera y Wulfhilda de Sajonia, Federico era heredero de las dos familias nobles enemigas que dominaban el Sacro Imperio en la época. Tras la muerte de su padre en 1147, se convirtió en su sucesor como duque de Suabia con el nombre de Federico III. Barbarroja continuó la política de su padre, concentrándose en los asuntos internos del ducado, mientras que su tío Conrado III se dedicaba a mantener y aumentar su poder como rey. Durante las discusiones sobre derechos entre Conrado y los Güelfos, parece ser que Federico mantuvo una posición neutral o incluso que intervino para proteger a los güelfos de Conrado.",
      "Tras la súbita muerte de Conrado III el 15 de febrero de 1152 en Bamberg, Barbarroja fue elegido rey de Romanos el 4 de marzo de 1152 en Fráncfort del Meno​ y coronado el 9 de marzo en la capilla del palacio real de Aquisgrán, que corresponde al actual edificio de la catedral, por el arzobispo de Colonia Arnoldo II de Wied.​",
      "Esta inusitada rapidez solo se explica si se tiene en cuenta que Conrado III lo había planeado todo con anterioridad, en preparación a su viaje a Roma para ser coronado emperador. Pero los preparativos habían sido hechos para su propio hijo y no para Barbarroja, un procedimiento que era habitual para asegurar la continuidad dinástica debido al peligro que representaba un viaje largo. Según un testimonio escrito de Otón de Freising que ha llegado a nuestros días, Conrado cambió de opinión y finalmente decidió, poniendo el bien común por encima de los derechos dinásticos, proponer para la elección a rey a su sobrino Federico en vez de su propio hijo. Parece ser que temía que una regencia de su hijo de 8 años, visto el conflicto existente con Enrique el León, no trajese la deseada paz. Es dudoso que las explicaciones de Otón de Freising sean ciertas: Freising escribió su relato sobre las circunstancias de la elección cinco años después de la coronación de Barbarroja, cuando este ya estaba firmemente asentado en el trono. Es más probable que Federico de Suabia supiera reunir los apoyos de los diferentes —y a menudo enemistados— partidos a base de diplomacia. Hay informes de diversas reuniones entre Federico y los grandes del reino durante el tiempo en que el trono permaneció vacante, y es posible que durante esas conversaciones prometiera cargos y tierras y ganara votos para su causa. Entre otros, su primo Güelfo VI consiguió, tras la entronización de Barbarroja, un ducado y el título de diversos señoríos en Italia (Spoleto, Toscana y las islas Cerdeña y Córcega). Enrique el León logró Baviera un poco más tarde, en 1156, como pago por su voto. Baviera, que había sido ambicionada por Enrique durante largo tiempo, había sido arrebatada a la casa de Bamberg en la Dieta de…",
    ] },
  { "title" = "Programa imperial y pensamiento", "paragraphs" = [
      "La fuente más importante para la comprensión del pensamiento de Barbarroja y su visión del Imperio en los primeros años de reinado se encuentran en el Gesta Friderici del obispo Otón de Freising. En el texto, el motivo de la defensa contra una decadencia del Imperio (sobre todo en vista de la práctica pérdida de autoridad sobre la Italia del norte) y la reconciliación entre Imperio y Papado toman un carácter central. Federico es presentado en la Gesta como el que trae la paz y la curación tras la Querella de las Investiduras. Un tercer motivo será la fidelidad de los Hohenstaufen con los Salios, por lo que, al contrario que los príncipes enemigos de los salios, fueron premiados con la corona real e imperial.",
      "De la candidatura al trono de Federico se infiere la intención de basarse en la teoría de las dos espadas, reviviendo los privilegios de la Iglesia y el honor del Imperio (honor imperii). Sin embargo, con esta formulación retoma un texto de Justiniano I, que ya había empleado Conrado III. Barbarroja también fue el primer emperador medieval que retomó el Corpus iuris civilis del Imperio romano para reclamar sus derechos sobre el norte de Italia, pero con poco éxito. De la insistencia de Barbarroja en recuperar sus derechos señoriales sobre el norte de Italia se infiere su intención política inicial de mantener una buena relación entre Imperio (Imperium) e Iglesia (Sacerdotium): Barbarroja esperaba, con ayuda del papa, recuperar para el Imperio más fácilmente los territorios Italianos que de facto se habían hecho autónomos.",
      "La primera expresión del equilibrio de intereses entre Imperio e Iglesia fue el Tratado de Constanza. Pero ya en el Tratado de Benevento se introdujo la idea de dos reinos, terrenal y espiritual, con los mismos derechos. Con él, Barbarroja veía a la ciudad de Roma como grupo de poder terrenal, así como, en compensación, el papa veía a los reyes sicilianos como un poder protector alternativo. Barbarroja consideró más y más al pueblo romano y el reconocimiento por estos como una justificación de su cetro imperial, con lo que entraba en conflicto con el papado, que solo reconocía la coronación por el papa. También se puede entender como respuesta a las crecientes tensiones con el papado la creación del término sacrum imperium en la cancillería de los Hohenstaufen en 1157.",
    ] },
  { "title" = "Descendencia", "paragraphs" = [
      "Beatriz (* hacia 1162; † antes de comienzos de 1174), enterrada en el monasterio de Lorch. Comprometida con el rey Guillermo II de Sicilia, falleció antes de que pudiera realizarse la boda.",
      "Federico (* 16 de julio de 1164 en Pavía; † 28 de noviembre de 1170), 1167 duque de Suabia como Federico V de Suabia, enterrado en el monasterio de Lorch.",
      "Enrique VI (* 1165; † 1197), rey de Alemania y emperador, rey de Sicilia, ∞ Constanza I de Sicilia (* 1154; † 1198), hija del rey Rogelio II de Sicilia.",
    ] },
]

[articles.fr]
text = "Frédéric Ier de Hohenstaufen est un empereur du Saint-Empire romain germanique de 1155 à sa mort. Il est surnommé Frédéric Barberousse en raison de son éblouissante barbe rousse (en allemand : Friedrich Barbarossa, en latin : Fridericus Ahenobarbus)."
title = "Frédéric Barberousse"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Fr%C3%A9d%C3%A9ric_Barberousse"
intro = [
  "Frédéric Ier de Hohenstaufen est un empereur du Saint-Empire romain germanique de 1155 à sa mort. Il est surnommé Frédéric Barberousse en raison de son éblouissante barbe rousse (en allemand : Friedrich Barbarossa, en latin : Fridericus Ahenobarbus).",
  "Il est né en 1122 et mort le 10 juin 1190. Proclamé empereur en 1155, il possède également les titres de roi de Germanie, roi d'Italie, roi de Bourgogne et comte palatin de Bourgogne, après avoir été un temps duc de Souabe et d'Alsace.",
  "Deuxième membre de la maison de Hohenstaufen à accéder à la dignité impériale, il est également, par sa mère, un Welf. C'est sous son règne que, pour la première fois, le terme de sacrum (« saint ») est employé pour qualifier l'Empire romain germanique.",
  "Il reste célèbre pour son conflit face aux communes d'Italie du Nord et ruine la ville de Milan en 1162.",
]
sections = [
  { "title" = "Généalogie et famille", "paragraphs" = [
      "Frédéric Ier Barberousse est né en 1122, probablement au château impérial de Haguenau. D'après la seule source contemporaine, la Welfe Judith de Bavière a donné naissance à son premier enfant dans un château près d'Altdorf. Comme il était courant à cette époque pour la mère de donner naissance à son enfant dans son pays d'origine, il est probable que Frédéric soit né sur les terres de sa mère. Toutefois, on ignore si Frédéric était effectivement ce premier enfant, car la mortalité infantile était élevée à l'époque[réf. nécessaire].",
      "Frédéric, fils du Hohenstaufen Frédéric II le Borgne, duc de Souabe et d'Alsace, et de Judith, fille de Henri le Noir de Bavière, descend des deux lignées concurrentes dominant le Saint-Empire à cette époque. À 25 ans, à la mort de son père en 1147, il lui succède comme duc de Souabe et d'Alsace sous le nom de Frédéric III. Il semble avoir poursuivi les efforts de son père pour accroître l'influence de la maison de Hohenstaufen, tandis que son oncle, Conrad III, roi d'Allemagne, s'employait à renforcer le pouvoir royal. Frédéric adopta, semble-t-il, une position neutre lors des démêlés juridiques entre Conrad et les Welfes, et même empêcha une procédure de Conrad contre les Welfes[réf. nécessaire].",
      "Le 2 mars 1147, alors qu'il n'était que duc de Souabe, Frédéric épouse Adèle ou Adélaïde de Vohbourg, la fille du margrave Diepold III de Cham-Vohbourg (de) et héritière du pays d'Eger. Ce mariage sans enfant sera annulé en mars 1153 à Constance, ce qui n'empêcha pas Frédéric de donner le pays d'Eger à son cousin Frédéric de Rothenbourg[réf. nécessaire].",
    ] },
  { "title" = "Frédéric, empereur", "paragraphs" = [
      "À la mort subite de Conrad III le 15 février 1152 à Bamberg, il a 30 ans. Frédéric, duc de Souabe, est alors élu à la dignité de roi des Romains dès le 4 mars 1152 à Francfort-sur-le-Main et couronné le 9 mars 1152 par l'archevêque de Cologne Arnold II von Wied (de) dans la chapelle palatine d'Aix-la-Chapelle[réf. nécessaire].",
      "Conrad III avait déjà planifié sa succession avant son voyage de couronnement à Rome. Il l'avait prévu dans la perspective de l'élection et du couronnement de son propre fils ; il était habituel de régler les problèmes dynastiques avant de partir pour un long voyage qui comportait toujours des risques.",
      "D'après la tradition et le témoignage écrit d'Othon de Freising, Conrad décida ensuite, dans l'intérêt de l'empire, de passer outre aux règles de succession dynastiques et de favoriser l'élection de son neveu à la place de son fils, prénommé également Frédéric, et qui n'avait alors que six ans. Il aurait prétendument craint qu'un épisode de régence ne permette pas d'obtenir la paix désirée dans le contexte du conflit avec Henri le Lion. La recherche historique n'a pu éclaircir ce point, le témoignage d'Othon de Freising sur les circonstances de l'élection étant postérieur de cinq ans à l'évènement, alors que Frédéric était déjà établi. Il est plus vraisemblable que le duc de Souabe sut établir, par sa diplomatie extrêmement habile, un équilibre des intérêts entre les factions rivales qui garantit de façon satisfaisante le rang et la réputation de chacun des princes et lui assura leur soutien lors de l'élection[réf. nécessaire].",
    ] },
  { "title" = "Politique italienne de Frédéric", "paragraphs" = [
      "La première expédition en Italie (1154-1155), au cours de laquelle il fut couronné roi d'Italie à Pavie en 1155 dans la basilique San Michele Maggiore, n'avait pas seulement pour objectif de ceindre la couronne impériale mais poursuivait également le dessein, comme les cinq expéditions suivantes, d'assurer la domination impériale sans partage sur les terres d'empire, en particulier sur les cités de Lombardie[réf. nécessaire].",
      "L'objectif se résume par l'expression des légistes, honor imperii (de), qui signifie, de façon simplifiée, le pouvoir suzerain de l'empereur. Le concept de sacrum imperium (empire saint) fut développé corollairement par la chancellerie impériale[réf. nécessaire].",
      "Avant chaque expédition, Frédéric devait au préalable rassembler ses alliés. Il s'attacha donc à améliorer ses relations avec les Babenberg (à qui il avait repris la Bavière) en tentant, sans succès, de rétablir leur parent par alliance, Vladislav II sur le trône de Bohême en été 1157[réf. nécessaire].",
    ] },
  { "title" = "Retour en Allemagne et reprise en main", "paragraphs" = [
      "En Allemagne, le désastre de 1167 eu pour conséquences que Barberousse récupéra de très nombreux territoires des princes morts durant l'épidémie, en particulier les fiefs de la maison ducale welfe en Haute-Souabe après qu'Henri le Lion eut failli à verser les sommes promises à son oncle Welf. Il se constitua ainsi une ceinture territoriale Hohenstaufen et royale entre la Bavière welfe et les territoires Zähringer autour de Freibourg. Barberousse avait depuis 1156 déjà accru son influence dans la région mosello-rhénane et dans les parties adjacentes de la Hesse, à travers la remise du palatinat rhénan, y compris la franchise sur de nombreux héritages saliens, à son demi-frère Conrad, la mise à l'écart des archevêchés de Trèves et Mayence comme l'activation habile des territoires royaux dans la région. Il avait également créé une terre d'empire dans le Wetterau autour de Gelnhausen et Friedberg. Une autre avancée de la politique impériale fut l'extension forcée de la liberté d'or à l'évêché de Wurtzbourg en 1168, ce qui permit de le doter de la dignité ducale, sans pour autant transformer le territoire en duché. L'évêque de Wurtzbourg obtenait naguère son titre du duc de Franconie.",
    ] },
]

[articles.de]
text = "Friedrich I., genannt Barbarossa (italienisch für „Rotbart“) (* um 1122; † 10. Juni 1190 im Fluss Saleph nahe Seleucia, Kleinarmenien), aus dem Adelsgeschlecht der Staufer, war von 1147 bis 1152 als Friedrich III."
title = "Friedrich I. (HRR)"
lang = "de"
url = "https://de.wikipedia.org/wiki/Friedrich_I._%28HRR%29"
intro = [
  "Friedrich I., genannt Barbarossa (italienisch für „Rotbart“) (* um 1122; † 10. Juni 1190 im Fluss Saleph nahe Seleucia, Kleinarmenien), aus dem Adelsgeschlecht der Staufer, war von 1147 bis 1152 als Friedrich III. Herzog von Schwaben, von 1152 bis 1190 römisch-deutscher König und von 1155 bis 1190 Kaiser des römisch-deutschen Reiches.",
  "Barbarossas Wahl war die Folge eines Interessenausgleichs mehrerer Fürsten. Die wohl bedeutendste Rolle spielte dabei sein Vetter Heinrich der Löwe, der als Folge der Absprachen eine königgleiche Stellung in Norddeutschland aufbauen konnte. Seine langjährige Förderung durch den König missachtete jedoch das Gleichgewicht hocharistokratischer Familienverbände und ließ Heinrich schließlich zum Störfaktor für die übrigen Reichsfürsten werden.",
  "Barbarossas Herrschaft war zudem vom Doppelkonflikt mit dem lombardischen Städtebund und dem Papsttum geprägt. In einer Gesellschaft, in der Ehre (honor) den sozialen Rang bestimmte, führten Ehrverletzungen und der daraus resultierende Zwang zur Rache zu jahrzehntelangen Konflikten. In den Auseinandersetzungen zwischen den oberitalienischen Städten versuchte Barbarossa eine Vermittlerrolle einzunehmen. Er scheiterte jedoch, zog sich den Vorwurf der Parteilichkeit zu und konnte die traditionellen Herrscheraufgaben der Friedens- und Rechtswahrung nicht ausüben. Die Weigerung einiger Städte, sich dem kaiserlichen Gericht zu stellen, musste angesichts des Konzepts der „Ehre des Reiches“ (honor imperii), aber auch zur Bestätigung des kaiserlichen Herrschaftsanspruchs gesühnt werden. Nachdem Tortona und Mailand zerstört worden waren, beabsichtigte Barbarossa, die Königsherrschaft im Regnum Italicum grundsätzlich neu zu ordnen. Alte Hoheitsrechte des Reiches wurden wieder beansprucht oder neu definiert und schriftlich fixiert. Alle Gerichtshoheit und Amtsgewalt sollte vom Reich ausgehen. Die Einsetzung kaiserlicher Verwalter und die umfassende finanzielle Nutzung der dem Kaiser zugesprochenen Regalien trafen jedoch auf den Widerstand der Städte. Sie hatten Regalien und Jurisdiktionsrechte längst schon gewohnheitsrechtlich wahrgenommen.",
  "Anders als noch in salischer Zeit führten der Konflikt mit dem Papst und die Exkommunikation des Kaisers nicht zur Entstehung einer größeren Oppositionsbewegung im nördlichen Reichsteil. Erst nach der Niederlage des kaiserlichen Heeres in der Schlacht von Legnano 1176 wurde das jahrzehntelange Schisma im Frieden von Venedig und der Konflikt mit den Kommunen im Konstanzer Frieden 1183 beendet. Heinrich der Löwe hatte sich geweigert, dem Kaiser 1176 im Kampf gegen die lombardischen Städte beizustehen; auf Bestreben der Fürsten wurde er gestürzt und musste ins Exil gehen.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Friedrich entstammte dem adligen Geschlecht der Staufer. Dieser Name ist jedoch eine Begriffsfindung der Historiker aus dem 15. Jahrhundert. Die Ahnen väterlicherseits waren unbedeutend und wurden nicht überliefert. Abstammung und Herkunft der Familie sind bis heute ungeklärt. Der Familie gelang es durch konsequente Nutzung von Klostervogteien, kluge Inanspruchnahme der Ministerialität und enge Zusammenarbeit mit Klerus und Volk der Bistümer Würzburg, Worms und Speyer, ihre Herrschaftsposition vor Antritt des Königtums auszubauen. Für das Anwachsen der staufischen Macht waren auch zahlreiche Eheschließungen vorteilhaft. Über Barbarossas Urgroßvater Friedrich von Büren ist lediglich bekannt, dass er eine Frau namens Hildegard geheiratet hat. Jüngst wurde vermutet, dass der Schlettstädter Besitz nicht Hildegard, sondern Friedrich selbst gehört habe und die Staufer damit ein elsässisches Geschlecht gewesen seien. Erst um 1100 habe sich mit Herzog Friedrich I. der Ausgriff ins ostschwäbische Remstal vollzogen.",
      "Weit wichtiger war für die Staufer ihre prestigeträchtige Verwandtschaft mütterlicherseits mit den Saliern. Die Großmutter Friedrich Barbarossas war Agnes, eine Tochter des salischen Herrschers Heinrich IV. Barbarossa verstand sich als Nachkomme des ersten Salierkaisers Konrad II., auf den er sich in Urkunden mehrfach als seinen Vorfahren bezog. Der Aufstieg der Staufer vollzog sich in den Konflikten Heinrichs IV. mit den Fürsten aus Sachsen und Schwaben. Als Reaktion auf die Erhebung des Schwabenherzogs Rudolf von Rheinfelden zum Gegenkönig Heinrichs IV. erhielt Friedrich I. vom König 1079 das Herzogtum Schwaben und wurde mit dessen Tochter Agnes vermählt. Als Schwiegersohn war Friedrich eine wichtige Stütze für den salischen Kaiser gegen die geistlichen und weltlichen Vertreter der gregorianischen Reform. 1105 bekam sein fünfzehnjähriger Sohn Friedrich II., der Vater von Barbarossa, das Herzogtum. Nach dem Sturz des Kaisers durch seinen Sohn Heinrich V. übernahmen 1116 die beiden Brüder Konrad und Friedrich II. die Stellvertreterschaft im nördlichen Reichsteil. Konrad wurde Herzog von Ostfranken. Barbarossas Vater Friedrich II. war in der Verteidigung der salischen Interessen und dem weiteren Ausbau seiner staufischen Hausmacht so erfolgreich, dass über ihn laut Otto von Freising erzählt wurde, er habe am Schwanz seines Pferdes stets eine Burg hinter sich hergezogen.",
      "Um 1122 wurde Barbarossa als Sohn Friedrichs II. und der Welfin Judith geboren. Sein Geburtsort war vielleicht Hagenau. Er erlernte das Reiten, Jagen und den Umgang mit Waffen. Barbarossa konnte weder lesen noch schreiben und war auch der lateinischen Sprache nicht mächtig. Die Kandidatur seines Vaters Friedrich II. als Nachfolger des kinderlos verstorbenen salischen Herrschers Heinrich V. blieb 1125 erfolglos, da er die libera electio (freie Wahl) der Fürsten nicht akzeptierte. Gewählt wurde stattdessen der Sachsenherzog Lothar III. Nach dem Tod Lothars wurde am 7. März 1138 Konrad in Koblenz von einer kleinen Fürstengruppe unter der Leitung des Erzbischofs Albero von Trier zum König gewählt. Friedrich Barbarossa nahm 1141 in Straßburg, 1142 in Konstanz, 1143 in Ulm, 1144 in Würzburg und 1145 in Worms an Hoftagen seines königlichen Onkels Konrad teil. Auch in den Folgejahren hielt er sich regelmäßig am Königshof auf. Um 1147 heiratete er Adela, die Tochter des nordbayerischen Markgrafen Diepold III. von Vohburg. Wenige Wochen vor dem Tod seines Vaters wurde Barbarossa zu Weihnachten 1146 in einer königlichen Urkunde als „der jüngere Herzog“ bezeichnet. Von 1147 bis 1149 nahm er am Kreuzzug seines königlichen Onkels Konrad teil. Das Unternehmen schlug fehl, der König erkrankte an der Malaria. Zur Jahreswende 1151/52 traf Konrad Vorbereitungen für die Königswahl seines Sohnes Friedrich von Rothenburg, starb jedoch schon am 15. Februar 1152.",
    ] },
  { "title" = "Das Barbarossa-Bild der Nachwelt", "paragraphs" = [
      "In der historiographischen Überlieferung vollzog sich ein Wandel der Leitbilder und Normen. Neben traditionellen christlichen Normvorstellungen (clementia, misericordia, humilitas) trat in der stauferfreundlichen Geschichtsschreibung das sich im 12. Jahrhundert ausbildende ritterliche Herrscherideal stärker hervor. In den Kämpfen Barbarossas mit den italienischen Städten werden die heldenhafte Tapferkeit und die überlegene Kampfkraft des Herrschers als ritterlicher Held demonstriert. Die gegnerischen italienischen Städte werden als hochmütig (superbia) beurteilt und als Gegenpart zu dem im göttlichen Auftrag kämpfenden Herrscher Barbarossa porträtiert. Die Städte scheinen sich als Gegner des Kaisers gegen die gottgewollte Ordnung zu erheben und Barbarossa ist der „Vollzieher“ der göttlichen Rache. Auf der Gegenseite wird Barbarossa in der italienischen Stadtgeschichtsschreibung der Treulosigkeit, Bestechlichkeit und Parteilichkeit bezichtigt. Für den italienischen Rhetor Boncompagno da Signa war Barbarossas ruhmloser Tod die verdiente Strafe Gottes für die Kriege gegen die italienischen Städte. Die Grausamkeit der Kriege führte aber auch dazu, dass erstmals der aus dem antiken Rom stammende Begriff furor teutonicus (teutonische Wut) nach fast völliger Vergessenheit wieder in der Geschichtsschreibung auftauchte.",
      "Die Chronik des Bischofs Otto von Freising gilt als Höhepunkt mittelalterlicher Weltchronistik. Der Freisinger Bischof gehörte bis zu seinem Tod nicht zu den engsten Vertrauten des Königs. Otto erhoffte sich durch sein Geschichtswerk über „die Taten Friedrichs“ (Gesta Frederici) königliche Unterstützung für die Freisinger Kirche. Mit Barbarossas Herrschaft sah Otto eine neue Zeit anbrechen. Nach Ottos Tod 1158 führte sein Freisinger Kapellan, Notar und Privatsekretär Rahewin das Werk fort und schloss es vor Ende Juli 1160 ab.",
      "Neben den Auseinandersetzungen mit den italienischen Städten prägte der Konflikt zwischen Kaiser und Papst das Bild Barbarossas in der Historiographie. Das Papstschisma wurde bei dem in den 1180er Jahren entstandenen panegyrischen Heldengedicht Ligurinus weitgehend ausgeblendet. Sein Autor Gunter stand offenbar in enger Beziehung zur kaiserlichen Familie und konzipierte sein Werk für den staufischen Herrscherhof. Ebenfalls schilderte der Dichter des Carmen de gestis Frederici I. imperatoris in Lombardia das Verhältnis von Kaiser und Papst als harmonisch und verheimlichte das Schisma.",
    ] },
  { "title" = "Quellen", "paragraphs" = [
      "MGH, Diplomata regum et imperatorum Germaniae, Bd. X/1–5, Friderici I. Diplomata. Bearbeitet von Heinrich Appelt, Hannover 1975–1990.",
      "Otto von Freising und Rahewin, Gesta Frederici seu rectius Cronica (= Ausgewählte Quellen zur deutschen Geschichte des Mittelalters, Freiherr vom Stein-Gedächtnisausgabe.) Bd. 17. Übersetzt von Adolf Schmidt, herausgegeben von Franz-Josef Schmale. Wissenschaftliche Buchgesellschaft, Darmstadt 1965.",
      "Das Geschichtswerk des Otto Morena und seine Fortsetzer über die Taten Friedrichs I. in der Lombardei (= MGH Scriptores rerum Germanicarum, Nova Series. Bd. 7). Herausgegeben von Ferdinand Güterbrock. Berlin 1930, ND 1964.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Knut Görich: Die Staufer. Herrscher und Reich. 4., durchgesehene und aktualisierte Auflage. Beck, München 2019, ISBN 978-3-406-73805-0.",
      "Werner Hechberger, Florian Schuller (Hrsg.): Staufer & Welfen. Zwei rivalisierende Dynastien im Hochmittelalter. Pustet, Regensburg 2009, ISBN 978-3-7917-2168-2 (Rezension).",
      "Hagen Keller: Zwischen regionaler Begrenzung und universalem Horizont. Deutschland im Imperium der Salier und Staufer 1024 bis 1250 (= Propyläen-Geschichte Deutschlands. Bd. 2). Propyläen-Verlag, Berlin 1986, ISBN 3-549-05812-8.",
    ] },
]

[articles.it]
text = "Federico I Hohenstaufen, meglio noto come Federico Barbarossa (1122 – Saleph, 10 giugno 1190), è stato imperatore dei Romani, re dei Romani e re d'Italia. Prima dell'elezione imperiale, Federico era per eredità duca di Svevia (1147-1152, con il nome di Federico III)."
title = "Federico Barbarossa"
lang = "it"
url = "https://it.wikipedia.org/wiki/Federico_Barbarossa"
intro = [
  "Federico I Hohenstaufen, meglio noto come Federico Barbarossa (1122 – Saleph, 10 giugno 1190), è stato imperatore dei Romani, re dei Romani e re d'Italia.",
  "Prima dell'elezione imperiale, Federico era per eredità duca di Svevia (1147-1152, con il nome di Federico III). Era figlio del duca Federico II (detto \"il Guercio\"), della dinastia degli Hohenstaufen, e di Giuditta, figlia del duca di Baviera Enrico IX, del casato rivale dei Welfen. Federico, quindi, discendeva da due delle più importanti famiglie in Germania, rendendolo una scelta accettabile per i principi elettori dell'Impero. In effetti, questa visione riflette soprattutto il punto di vista di Ottone di Frisinga, il più importante biografo medievale di Federico, il quale sosteneva appunto che lo scontro tra Staufen e Welfen aveva \"spesso disturbato la pace dello Stato\" e che l'elezione di Federico faceva ben sperare in una pacificazione, estremamente necessaria per un Paese, la Germania, prostrata dalla lotta per le investiture.",
  "Tale ricostruzione, che serviva sostanzialmente a giustificare la notevole esclusione alla successione del figlio di Corrado III, Federico IV di Svevia, trovò eco in particolare nella Germania ottocentesca: nel 1866, Giorgio V, re di Hannover della casa di Welfen, prese le parti dell'Impero austriaco contro il Regno di Prussia. La contrapposizione tra Welfen e Staufen rappresentava più una proiezione dei moderni che non un dato storico. Ad esempio, Federico aveva rapporti personali più stretti con i parenti Welfen del lato materno.",
  "Fu eletto re di Germania a Francoforte il 4 marzo 1152 e poi incoronato re dei Romani il 9 marzo ad Aquisgrana. Succedette allo zio paterno Corrado III. Federico ottenne la successione cedendo il ducato di Baviera al cugino Enrico il Leone, che si era visto sottratto il ducato da Corrado, così stabilizzando la propria posizione in Germania. Il 19 aprile 1155 fu incoronato re d'Italia nella basilica di San Michele a Pavia, richiamando le incoronazioni al medesimo titolo dei re longobardi e di altri, come Berengario. Il 18 giugno dello stesso anno papa Adriano IV lo incoronò Imperatore nella basilica di San Pietro in Vaticano a Roma.",
]
sections = [
  { "title" = "Fonti", "paragraphs" = [
      "Il più importante biografo di Federico Barbarossa fu Ottone di Frisinga (1112-1158), il quale scrisse le Gesta Friderici Imperatoris. Ottone era zio di Federico, in quanto fratellastro più giovane di Federico II di Svevia, padre del Barbarossa. Essendo il quinto figlio del margravio d'Austria Leopoldo III di Babenberg e di Agnese di Waiblingen (in precedenza moglie di Federico I di Svevia), Ottone era fin dalla nascita destinato alla carriera ecclesiastica. Studiò a Parigi per poi entrare nei Cistercensi. Quando Corrado III di Svevia, altro fratellastro di Ottone, fu eletto re di Germania, Ottone fu nominato vescovo di Frisinga, proprio nel periodo in cui più era acceso il confronto tra gli Staufer e i Babenberg, da un lato, e i Welfen, dall'altro. A questo periodo risale il capolavoro di Ottone, la Chronica de duabus civitatibus, un storia del mondo dalla creazione al 1146, dai toni assai pessimisti. Nell'opera si evoca lo scontro tra papa Gregorio VII e l'imperatore Enrico IV, che avrebbe aperto una fase di crisi nei rapporti tra Impero e Papato, una settima epoca della storia umana che, secondo l'autore, precedeva l'avvento dell'Anticristo. Barbarossa fece richiesta del testo allo zio e ne ottenne una copia verso la fine di marzo del 1157.",
      "Ad assisterlo nella redazione della Chronica era stato il suo cappellano e segretario Radevico (Rahewin; 1120-1170/1177), cui Ottone aveva dettato il testo. Ottone accompagnò l'invio della Chronica (consegnata da Radevico) con una lettera per Rainaldo di Dassel, cancelliere dell'Imperatore, pregandolo di tradurre dal latino al tedesco l'opera perché Federico potesse intenderla, raccomandando di non leggergli le parti in cui lo storico potesse apparire critico nei confronti dei suoi \"predecessori e antenati\" e invitando a distinguere ciò che era destinato alle orecchie dell'imperatore e ciò che invece andava riservato agli occhi dei suoi dotti chierici.",
      "Già in quei giorni Ottone meditava di scrivere una biografia del Barbarossa, tanto da invitarlo, con l'aiuto dei segretari dell'Imperatore, a mandargli un elenco succinto delle sue maggiori imprese, in modo da poterle usare come base per una biografia. Ottone, probabilmente ispirandosi all'etimologia del nome Federico, si propose di ritrarre il Barbarossa come \"guardiano della pace\", tema che poi in effetti userà nel prologo al libro I delle Gesta.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Le Gesta di Ottone di Frisinga iscrivono Federico nel presunto atavico conflitto tra Hohenstaufen (Staufer) e Welfen, che avrebbe caratterizzato prima e poi la storia della Germania medievale. Un altro elemento che sta al fondo del discorso di Ottone è l'interpretazione della nobiltà tedesca dell'epoca come strutturata per linee patrilineari (\"discendenza agnatica\"). Queste dinastie per linea maschile sono tradizionalmente identificate da specifiche località (in questo caso tutte nell'odierno Baden-Württemberg), come Waiblingen, nei pressi di Stoccarda, con il castello di Hohenstaufen, o Altdorf (l'odierna Weingarten), terra legata ai Welfen (Ottone li chiama \"i Welfen di Altdorf\"), una famiglia, peraltro, identificata, caso unico, da un progenitore eponimo, Welf (Guelfo).",
      "In realtà, i legami con la famiglia materna erano ai tempi almeno altrettanto importanti. Nel 1160, per esempio, Federico prese le parti dello zio materno, Guelfo VI, e del cugino, Guelfo VII, contro il cugino dal lato paterno, il duca di Svevia Federico IV. In un certo senso, i lignaggi erano considerati importanti più dagli eruditi che non dai nobili stessi, i quali formavano alleanze in base a considerazioni più squisitamente politiche e secondo le convenienze del momento. Così, mentre Ottone di Frisinga cerca di caratterizzare il nipote Federico come uno Staufer, questi non pensò mai di presentarsi in questi termini nei suoi privilegi reali. In particolare, i dotti della cancelleria imperiale solo in un'occasione fanno riferimento a Federico I di Svevia, senza neppure menzionare che fosse il nonno del Barbarossa; al contrario, essi fanno esplicito riferimento al rapporto di parentela con Enrico IV di Franconia, padre di Agnese di Waiblingen: quest'ultima era madre di Corrado III di Svevia e di Federico il Guercio, rispettivamente zio e padre di Barbarossa (Agnese, un anno dopo la morte del marito, sposerà Leopoldo III di Babenberg, da cui avrà diversi figli, tra cui lo stesso Ottone di Frisinga).",
      "A distanziare ulteriormente il Barbarossa dal lignaggio Staufer sta la considerazione del fatto che le fonti coeve attribuiscono occasionalmente il cognome toponimico Stauf al nonno di Federico (Federico I), al padre (Federico II) e al cugino (Federico IV), ma non all'imperatore Corrado III, né a Barbarossa stesso o al fratellastro di questi, Corrado. Questa denominazione prese piede, in modo alquanto esitante, solo nel XIII secolo: un cronista, intorno al 1215, parlò degli \"imperatori di Stauf\", mentre Federico II, l'imperatore, fu il primo membro del casato a riferirsi alla domus Stoffensis ('casa degli Staufer') e comunque in un passaggio isolato. All'epoca di Barbarossa, ci si riferiva alla famiglia piuttosto con il nome Waiblingen (da cui poi derivò la parola \"ghibellino\").",
    ] },
  { "title" = "Leggende", "paragraphs" = [
      "Federico I di Svevia è il protagonista di molte leggende ed era tenuto in grande onore dalle popolazioni germaniche sue contemporanee, che diffusero la leggenda per cui Federico non fosse realmente morto ma che si fosse nascosto ai suoi nemici per tornare più forte di prima.",
      "Una versione più mitologica della sua morte è basata sull'ipotesi che fosse in possesso della leggendaria Lancia del Destino. Secondo il mito chiunque possedesse la lancia era imbattibile, ma se il portatore ne fosse stato privato, avrebbe perduto la vita di lì a poco. Federico morì guadando un fiume e, in quel momento, alcuni fantasiosi resoconti dicono che la lancia cadde dalle sue mani.",
      "Un'altra leggenda è quella dell'eroe dormiente, come le più antiche leggende britannico-celtiche di re Artù e Bran il Benedetto. Tale leggenda vuole che egli non fosse morto, ma addormentato con i suoi cavalieri in una caverna nelle montagne di Kyffhäuser in Turingia e che quando i corvi avrebbero cessato di volare intorno alla cima, si sarebbe destato e portato la Germania alla sua antica grandezza. Secondo la leggenda, la sua barba rossa sarebbe cresciuta attraverso il desco al quale sedeva. I suoi occhi sarebbero mezzi chiusi nel dormiveglia, ma di quando in quando avrebbe alzato la sua mano e avrebbe inviato un fanciullo all'esterno per vedere se i corvi avessero smesso di volare.",
    ] },
  { "title" = "Matrimoni e discendenti", "paragraphs" = [
      "Prima del 2 marzo 1147, Federico sposò Adelaide di Vohburg (1122-1190), figlia del margravio di Vohburg, Diepoldo III (m. 1146) e della sua prima moglie, Adelaide di Polonia. Da questo matrimonio non nacquero figli e fu annullato, nel marzo del 1153, da un concilio tenutosi a Costanza.",
      "Il giorno di Pentecoste, il 17 giugno 1156, Federico I Barbarossa sposò a Würzburg Beatrice di Borgogna (1145-1184), figlia unica ed erede del conte di Borgogna Rinaldo III e di Agata di Lorena, figlia di Simone I di Lorena. Federico I governò in prima persona la contea e, nel 1177, si fece incoronare re di Arles.",
      "Federico V di Hohenstaufen (16 luglio 1164-† 28 novembre 1168/1169), duca di Svevia dal 1167.",
    ] },
]

[articles.tr]
text = "I. Friedrich (Almanca: Friedrich I; İtalyanca: Federico II) veya Friedrich Barbarossa (1122 – 10 Haziran 1190), 12."
title = "I. Friedrich (Kutsal Roma imparatoru)"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._Friedrich_%28Kutsal_Roma_imparatoru%29"
intro = [
  "I. Friedrich (Almanca: Friedrich I; İtalyanca: Federico II) veya Friedrich Barbarossa (1122 – 10 Haziran 1190), 12. yüzyılda yaşamış Alman kralı ve Kutsal Roma Cermen imparatoru. Almanya Kralı olarak 4 Mart 1152 tarihinde Frankfurt'ta seçildi ve 9 Mart 1152 tarihinde Aachen'da taç giydi. Pavia'da 24 Nisan 1155'te İtalya Kralı ve 18 Haziran 1155'te Roma'da Papa IV. Adrian tarafından imparator olarak taçlandırıldı. İki yıl sonra, Latince: sacrum (\"kutsal\") terimi ilk kez onun imparatorluğuyla bağlantılı bir belgede yer aldı. Daha sonra 30 Haziran 1178'de Arles'de Burgonya Kralı olarak resmen taç giydi. Yönetmeye çalıştığı kuzey İtalya şehirleri tarafından Barbarossa olarak adlandırıldı: Barbarossa İtalyancada \"kızıl sakal\" anlamına gelir; Almanca: Kaiser Rotbart olarak bilinirdi ve bu da İngilizcede \"İmparator Kızıl Sakal\" anlamına gelir. Daha sonraki Almanca kullanımda bile İtalyanca lakabın yaygınlığı, İtalya seferlerinin onun kariyeri için önemini yansıtmaktadır.",
  "Friedrich, 1152'de imparator seçilmeden önce miras yoluyla Swabia Dükü (1147-1152, Frederick III olarak) idi. Hohenstaufen hanedanından Dük II. Frederick ile rakip Welf Hanedanından Bavyera Dükü Henry IX'un kızı Judith'in oğluydu. Dolayısıyla Friedrich, Almanya'nın önde gelen iki ailesinin soyundan geliyordu ve bu da onu İmparatorluğun prens seçicileri için kabul edilebilir bir seçenek haline getiriyordu. Friedrich, Üçüncü Haçlı Seferi'ne katıldı ve Kutsal Topraklara karadan gitmeyi tercih etti. Friedrich, 1190 yılında Saleph Nehri'ni geçmeye çalışırken boğuldu ve ordusunun çoğu Akka'ya ulaşamadan Haçlı Seferi'ni terk etti.",
  "Tarihçiler onu Kutsal Roma İmparatorluğu'nun en büyük Orta Çağ imparatorları arasında saymaktadır. Çağdaşlarına neredeyse insanüstü görünmesini sağlayan nitelikleri bir araya getirmiştir: uzun ömrü, hırsı, olağanüstü organizasyon becerisi, savaş alanındaki zekası ve siyasi feraseti. Orta Avrupa toplumuna ve kültürüne yaptığı katkılar arasında Corpus Juris Civilis'in ya da Roma hukukunun yeniden tesis edilmesi de yer alır; bu sayede, Yatırım tartışmalarının sona ermesinden bu yana Alman devletlerine hakim olan papalık gücü dengelenmiştir. Popülerliği ve kötü şöhreti nedeniyle 19. yüzyılda ve 20. yüzyılın başlarında birçok hareket ve rejim tarafından siyasi bir sembol olarak kullanıldı: Risorgimento, Almanya'daki Wilhelmine hükümeti (özellikle İmparator I. Wilhelm döneminde) ve Nazi hareketi hem altın hem de karanlık efsanelere yol açtı. Modern araştırmacılar, Friedrich'in mirasını araştırırken, efsaneleri ortaya çıkarmaya ve gerçek tarihsel figürü yeniden inşa etmeye çalışmaktadır; bu çabalar hem bir kişi olarak imparatora hem de onunla ilişkili sosyal gelişmelere yeni bakış açıları getirmektedir.",
]
sections = [
  { "title" = "İlk yılları", "paragraphs" = [
      "Friedrich 1122 yılında doğdu. 1147 yılında Svabya dükü oldu ve hemen sonrasında amcası Alman kral III. Konrad tarafından başlatılan İkinci Haçlı seferinde ilk seyahatini Doğu'ya yaptı. Svabya dükü II. Friedrich (1090-6 Nisan 1147) ile Welf hanedanından Bavyera dükü IX. Heinrich'in kızı Judith'in oğluydu. 1147'de babası ölünce Svabya dükü, 4 Mart 1152'de amcası İmparator III. Konrad ölünce Almanya kralı oldu. 18 Haziran 1155'te de Kutsal Roma Cermen İmparatoru ilan edildi.",
    ] },
  { "title" = "İtalya Seferleri", "paragraphs" = [
      "Friedrich ilk önce Papa III. Eugenius'la çatışmaya girdi. Ancak papayı Konstanz Anlaşması'nı imzalamak zorunda bıraktı (1153). Eugenius'un ölümü üzerine yerine geçen yeni Papa IV. Hadrianus, ona Kutsal Roma Cermen İmparatoru tacını giydirdi (1155). Alman prensleri Sicilya kralı II. Rugerro'nun ardılı I. Guglielmo'nun döneminde (1154-1166) ağır bir bunalıma giren Sicilya'yı kurtarmak için hazırlanan Friedrich'e yardım etmeyi reddettiler. Guglielmo, ülkesindeki iç çatışmayı sona erdirdikten sonra Papa IV. Hadrianus'a Benevento Konkardosu'nu imzalamaya mecbur etti (1156). Bu konkardoyla Papalığın gücü Sicilya'da zayıfladı.",
      "Friedrich ülkesindeki iç sorunların bir kısmını çözdükten sonra 1158'de İtalya'ya akın düzenledi. İtalyan kentlerini kendisine bağladı. Friedrich'in bu uygulamaları, İtalyan devletlerle olduğu gibi Papalık'la da arasını açtı. Papalık 1159'da Kardinal Rolando'yu Papa III. Alexander adıyla seçti. Ancak Alexander'ı tanımayan Friedrich kendisinin desteklediği Kardinal Ottaviano'yu Papa IV. Victor adıyla anti papa seçti (1160).",
      "Sicilya kralı I. Guglielmo'nun da desteklediği Roma'daki Papa Alexander 1160'ta Friedrich'i aforoz etti. Avrupa'daki büyük devletlerin çoğunluğu hatta Bizans İmparatoru I. Manuil bile Papa Alexander'ı destekliyordu. Papa Alexander, Fransa'ya giderek Kral VII. Louis'i kendisini desteklemesi için ikna etti. Buna karşılık Friedrich Fransa kralını kendisini desteklemesi için ikna etmeye çalıştı ancak sonuç alamadı. Bizans imparatoru I. Manuil Fransa'yla ittifak kurarak Papayı tanımaya hazırlanırken Friedrich 1162'de Milano'yu yerle bir etti.",
    ] },
  { "title" = "Son dönemi", "paragraphs" = [
      "Bu arada İmparatorlukta da gelişmeler yaşanıyordu. Friedrich'ten sonra en güçlü prens Saksonya dükü olan kuzeni Aslan Henrinch'ti. Friedrich, Heinrich ile Avusturya markgrafı olan Heinrich Jasomirgott arasındaki düşmanlığı giderdi Aslan Heinrich'e Bavyera'yı verdi. Heinrich Jasomirgott ise markgraflıktan düklüğe terfi etti.",
      "1157 ve 1172'de Lehistan'a karşı sefer düzenleyen Friedrich Lehistan düklerini tekrar imparatorluğa bağladı. Ancak Aslan Heinrich birkaç kez ülkede barışı bozunca Friedrich Heinrich'in elinde bulunan Lübeck'e girdi ve onu tüm ünvanlarından azletti (1180). İngiliz kraliyet ailesinin soyundan gelen Mathilde ile evli olan Heinrich İngiltere'ye kaçarak İngiltere kralı II. Henry'e sığındı.",
    ] },
  { "title" = "Üçüncü Haçlı seferi ve ölümü", "paragraphs" = [
      "1188'de I. Friedrich Mainz Diet'inde Kudüs'e Haçlı olarak gitmek için and içti. 27 Mart 1188'de yeni bir Haçlı seferine katılacağını ve bu sefere katılacak Alman haçlılara komuta edeceğini halka ilan etti. Büyük bir Alman haçlı ordusu toplandı. 1188'de Nürnberg'e gelen Bizans elçileri Balkanlarda Bizans arazilerinde geçiş için organizasyon planları üzerinde uyuşma sağlandı.",
      "İmparator ve üçüncü oğlu Svabya Dükü IV. Friedrich komutasındaki Alman Haçlı ordusu 11 Mayıs 1189'da Ratisbon'dan törenle ayrıldı. Bu ordu toplanan en büyük Haçlı ordusu konumundaydı ve iyi silahlı ve çok iyi disiplinli idi. Ordu Macaristan üzerinden, Bizanslılar elindeki Balkanlardan, Konstantinopolis'e doğru yürüyüşe geçti. Bu orduya 2.000 askerle Macaristan kralı III. Bela'nın en genç kardeşi Geza da katıldı. Alman Haçlı ordusu Bizans arazilerinden yeniden organize edilmiş şekilde merhale merhale geçişe başladı. Haçlı ordusu Balkanlardan geçişi sırasında daha önce Friedrich ile Bizanslılar arasında yapılan anlaşmaya genellikle uydular. Yine de Haçlılar disiplinsizlik örnekleri gösterdiler. Filibe (o zamanki Philippopolis şimdiki Plovdiv) şehrini işgal ettiler ve bu şehri tekrar Bizans eline geçirmek için gönderilen 3.000 kişilik Bizans ordusunu yenik düşürdüler. Ayrıca Adrianopolis (Edirne) şehrini yaktılar.",
      "Bizanslıların 1176 Miryokefalon Muharebesi mağlubiyetinden sonra, ancak 1185'te Bizanslılar ve Anadolu Selçuklu Devleti Sultanı II. Kılıç Arslan arasında imzalanan barış ve ittifak antlaşması ile Anadolu'da durum dengelenmişti. Bizanslılar Alman Haçlı ordusunun topraklarında bulunmasından hoşnutsuzdular ama Alman ordusunun büyüklüğü karşısında direniş gösteremediler. Friedrich ve Alman ordusu 1189 sonbaharında Konstantinopolis'e gelir gelmez bir an önce Boğaz'dan karşıya taşındı. Bazı kaynaklar Bizans imparatoru II. İsaakios'un Eyyubiler Mısır Sultanı Selahaddin Eyyubi ile Selahaddin'in Bizans topraklarına hücum etmeme garantisine karşılık Bizanslıların Haçlı ordusunu zayıflatmak için ellerinden geleni yapacağı hakkında gizli bir antlaşma yaptığını bildirirler.",
    ] },
]

[articles.zh]
text = "腓特烈一世（又譯弗里德里希，德語：Friedrich I；1122年—1190年6月10日），又称红胡子腓特烈（義大利語：Federico Barbarossa），是1155年至1190年間的神聖羅馬皇帝。他於1152年3月4日在法蘭克福當選為羅馬人的國王，並於同年3月9日在亚琛加冕。 1155年4月24日，他在帕維亞加冕為意大利國王，並於同年6月18日在罗马由教宗亞德四世加冕為皇帝。後來，他於1178年6月30日在阿尔勒正式加冕為勃艮地國王。"
title = "腓特烈一世 (神圣罗马帝国)"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E8%85%93%E7%89%B9%E7%83%88%E4%B8%80%E4%B8%96_%28%E7%A5%9E%E5%9C%A3%E7%BD%97%E9%A9%AC%E5%B8%9D%E5%9B%BD%29"
intro = [
  "腓特烈一世（又譯弗里德里希，德語：Friedrich I；1122年—1190年6月10日），又称红胡子腓特烈（義大利語：Federico Barbarossa），是1155年至1190年間的神聖羅馬皇帝。他於1152年3月4日在法蘭克福當選為羅馬人的國王，並於同年3月9日在亚琛加冕。 1155年4月24日，他在帕維亞加冕為意大利國王，並於同年6月18日在罗马由教宗亞德四世加冕為皇帝。後來，他於1178年6月30日在阿尔勒正式加冕為勃艮地國王。",
]
sections = [
  { "title" = "国内政策", "paragraphs" = [
      "腓特烈一世像所有有才干的皇帝一样，试图在德意志境内驾驭桀骜不驯的诸侯。他在1158年颁布采邑法令，要求所有接受采邑者为皇帝服兵役。他的另一个重大举措是把大的诸侯领地分割成多块，因此在1156年将奥地利从巴伐利亚公国分出来，使之成为独立公国。腓特烈一世企图把王室直辖的领地连成一片，并仰赖家臣进行统治。通过迎娶勃艮第女伯爵贝亚特丽丝，他成为勃艮第-普法爾茨伯爵。",
    ] },
  { "title" = "入侵意大利", "paragraphs" = [
      "腓特烈一世对意大利的强烈兴趣使意大利事务成为他生命中最主要的部分，也是其绰号的由来（在義大利語中，紅鬍子的譯音為巴巴羅薩，意思是這位入侵者在義大利殘殺無辜，讓義大利人的血染紅他的鬍子，由此可見意大利人與腓特烈之間的血海深仇）。",
      "为征服伦巴第诸城市，使这些富饶地区成为帝国的税收来源，腓特烈一世长期执行侵略意大利的政策。他对意大利进行过5次军事入侵（1154年、1158年、1163年、1166年和1174年）。为巩固帝国在意大利统治，恢复德意志各公国的秩序。1153年与教宗恩仁三世达成《康士坦斯协议》，承诺保护教宗国，并帮助教宗夺取罗马的控制权。取得教宗的支持后，腓特烈一世对意大利进行六次远征并于1155年拿下罗马。1158年第二次占领米兰，并在意大利北部地区建立政权。然而这一举动导致他与教宗历山三世的长期斗争，西西里和教宗国組成伦巴第同盟，复叛的米兰还绑架了他的皇后貝亞特麗絲迫使她倒骑驴出城以为羞辱。1162年，腓特烈一世再征服米兰，并毁了其城防和教堂。",
      "1167年腓特烈一世在图斯库卢姆之战中大败联军，攻入罗马，驱逐教宗历山三世，由对立教宗巴斯加三世给勃艮第女伯爵贝亚特丽丝加冕为皇后。然而一场瘟疫席卷他的军队，导致他不得不班师回朝，途中还在苏萨遭遇了袭击，他扮作马夫丢下贝亚特丽丝逃跑了，贝亚特丽丝被俘直到次年获释。",
    ] },
  { "title" = "与亨利的斗争", "paragraphs" = [
      "虽然腓特烈一世和他的帝国威名赫赫，但在业已形成诸侯割据的德意志，他的中央集权政策仍然受到强有力的挑战。他的主要敌人和竞争对手是他的表弟也是曾经的好友萨克森公爵狮子亨利，亨利並在1156年兼领了巴伐利亚。1174年，由于狮子亨利拒绝参加对意大利的军事行动，腓特烈一世向亨利进攻并将之打败。亨利的大部分土地都被剥夺，只保住了不伦瑞克和吕讷堡（成为了后来的不伦瑞克-吕讷堡公国）。但腓特烈一世并未将狮子亨利被没收的领地划入王室领地，而是将它们分给了其他公爵。从此这就在德意志成为一种惯例，即被没收的公爵领地只能短期为皇帝所拥有。",
    ] },
  { "title" = "十字军东征和去世", "paragraphs" = [
      "1189年，腓特烈一世在与教宗和解后，与英格兰国王理查一世和法兰西国王腓力二世一起领导了第三次十字军东征。然而，他最終未能到达圣地。在帶領德軍東征的途中，68歲的老皇帝在騎馬渡過薩列法河（Saleph，即中世紀拉丁語中對格克蘇河的稱謂）時，墮河溺亡，但關於腓特烈一世的死，後世也有不同的說法，馬基維利在其著作《佛羅倫薩史》提出：紅鬍子是因為在薩列法河中洗澡，受涼患病而亡；而據《安斯伯特》記載 皇帝不顧眾人的勸告，選擇游過河，被水流捲走；另外根據同時代的阿拉伯史學家伊本·艾西爾的說法，腓特烈一世下到河裡洗澡，結果淹死在水還不到他腰部的地方。",
      "腓特烈一世死後，其兒子腓特烈六世率領的德意志殘軍，以及Géza大公率領的匈牙利軍，試圖將腓特烈一世大帝的遺體葬在耶路撒冷，他們並嘗試以醋保存腓特烈一世大帝的遺體，但最終失敗，結果腓特烈一世的肉最後被葬在安條克的聖彼得教堂，骨頭被葬在泰尔的聖十字主教座堂；而心臟則安葬在塔爾蘇斯的聖保羅堂。",
    ] },
]

[articles.ja]
text = "フリードリヒ1世（Friedrich I., 1122年 - 1190年6月10日）は、ホーエンシュタウフェン朝第2代ローマ王（ドイツ王、在位：1152年 - 1190年）、イタリア王フェデリーコ1世（戴冠：1155年4月24日）、また同王朝初代となる神聖ローマ皇帝（戴冠：1155年6月18日）。ブルグント国王としても正式に戴冠（1178年6月30日）。先代国王コンラート3世の甥でザーリアー朝の皇帝ハインリヒ4世の曾孫にもあたる。父はシュヴァーベン大公フリードリヒ2世（独眼公）、母はバイエルン公ハインリヒ9世の娘ユーディト。衰退しかかっていた帝権回復を目指して戦った勇猛な皇帝であり後世で英雄とされた。"
title = "フリードリヒ1世 (神聖ローマ皇帝)"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%83%95%E3%83%AA%E3%83%BC%E3%83%89%E3%83%AA%E3%83%921%E4%B8%96_%28%E7%A5%9E%E8%81%96%E3%83%AD%E3%83%BC%E3%83%9E%E7%9A%87%E5%B8%9D%29"
intro = [
  "フリードリヒ1世（Friedrich I., 1122年 - 1190年6月10日）は、ホーエンシュタウフェン朝第2代ローマ王（ドイツ王、在位：1152年 - 1190年）、イタリア王フェデリーコ1世（戴冠：1155年4月24日）、また同王朝初代となる神聖ローマ皇帝（戴冠：1155年6月18日）。ブルグント国王としても正式に戴冠（1178年6月30日）。先代国王コンラート3世の甥でザーリアー朝の皇帝ハインリヒ4世の曾孫にもあたる。父はシュヴァーベン大公フリードリヒ2世（独眼公）、母はバイエルン公ハインリヒ9世の娘ユーディト。衰退しかかっていた帝権回復を目指して戦った勇猛な皇帝であり後世で英雄とされた。",
]
sections = [
  { "title" = "生涯", "paragraphs" = [
      "1147年の父の死によりシュヴァーベン大公位を継承、1152年に叔父のコンラート3世に後継者に指名され、ローマ王に即位する。シュヴァーベンは従弟でコンラート3世の次男フリードリヒ4世に与えたが、1167年に彼が亡くなると息子のフリードリヒ5世に継承させた。",
      "即位後は帝国の混乱を収拾するために、本国たるアルプス以北の諸侯に対しては特権を与えて協調をはかった。帝国の宿敵で従弟でもあるヴェルフ家のバイエルン公兼ザクセン公ハインリヒ獅子公には司教叙任権を授与し、さらに1156年にはバイエルン公位を与えるなどして和解し、これを収めることに成功した。また、1156年までバイエルン公であったバーベンベルク家のハインリヒ・ヤゾミルゴットに対しては、バイエルンからオストマルク（オーストリア辺境伯領）を切り離してオーストリア公領に昇格させ、これを与えることで、バーベンベルク家との融和も実現させた。1154年10月にイタリア遠征を行ない、翌1155年6月18日に聖ペテロ教会で教皇ハドリアヌス4世から戴冠される。",
      "しかし、その後はイタリア政策に力を注ぎ、そのために政策をめぐって教皇と1157年から対立、以後フリードリヒ1世は5回にわたるイタリア遠征を行なうこととなり、本国の統治に力を注げなくなる。1159年に教皇ハドリアヌス4世は死去したが、その後継を巡って、反皇帝派が推すアレクサンデル3世と親皇帝派が推す対立教皇ウィクトル4世の両者が立ち、18年間にわたる教会分裂が起こった。このため1160年に教皇アレクサンデル3世から破門された。1162年には自身に敵対するミラノに侵攻して同地を破壊、ミラノは皇帝が任命したポデスタ（独裁官）により支配されることとなった。1168年から北イタリアの諸都市がフリードリヒ1世のイタリア政策に不満をもってロンバルディア同盟を結成すると、フリードリヒ1世はこれに危機感を覚えて1174年に再びイタリア遠征を実施するが、ハインリヒ獅子公からは援軍を拒否され、1176年にはレニャーノの戦いで大敗するという有様であった。同年10月にはアナーニで教皇と交渉し、アレクサンデル3世を正式な教皇として承認すること、マティルデの領土の返還などフリードリヒは譲歩を余儀なくされた。そして1177年のヴェネツィアの和約により都市同盟側と6年間の休戦が実現し、18年間にわたる教会分裂も終結した。その後、都市同盟側の内部対立もあり、1183年に、フリードリヒ1世は都市同盟と「コンスタンツの和約」を締結し、フリードリヒは都市同盟を承認する代わりに同盟側に皇帝の諸権利を認めさせ、イタリアでの問題に一応の決着をつけた。ちなみに愛称であるバルバロッサは赤髭を表すイタリア語であり、この皇帝がイタリアに注力した事を示すものである。",
    ] },
  { "title" = "伝説", "paragraphs" = [
      "中世の民間信仰では、帝国が再び彼を必要とする時まで赤髭王は生き続けているとされている。トリフェルス城内で、キーフホイザーで、ウンタースベルクで、と諸説あるが、帝国が危機に陥ると、カラスがその上を飛び回って知らせ、彼は永い眠りから覚めて起ち上がり国にふたたび栄華と平和をもたらすのだと言われている。フリードリヒ・リュッケルトはこの伝説を詩「バルバロッサ」（Barbarossa）で表現した。グリム兄弟編『ドイツ伝説集』には、これと他のバルバロッサ伝説、計8篇（23, 28,296,297,445,494,558,573）が収録されている。",
    ] },
]

[articles.ko]
text = "프리드리히 1세(독일어: Friedrich I, 1122년 ~ 1190년 6월 10일)는 호엔슈타우펜 왕가 출신의 신성 로마 제국의 황제이다(재위 1152년 ~ 1190년). 신성 로마 황제들 중 유능한 황제로 불리며, 후세에는 영웅으로까지 불리었다."
title = "프리드리히 1세 (신성 로마 황제)"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%ED%94%84%EB%A6%AC%EB%93%9C%EB%A6%AC%ED%9E%88_1%EC%84%B8_%28%EC%8B%A0%EC%84%B1_%EB%A1%9C%EB%A7%88_%ED%99%A9%EC%A0%9C%29"
intro = [
  "프리드리히 1세(독일어: Friedrich I, 1122년 ~ 1190년 6월 10일)는 호엔슈타우펜 왕가 출신의 신성 로마 제국의 황제이다(재위 1152년 ~ 1190년). 신성 로마 황제들 중 유능한 황제로 불리며, 후세에는 영웅으로까지 불리었다. 그의 이명인 바르바로사(이탈리아어: Barbarossa, 독일어: Rotbart)는 붉은 수염을 의미한다.",
  "프리드리히는 1152년 3월 4일 프랑크푸르트에서 독일의 왕으로 선출되었으며 5월 9일 아헨에서 즉위하고, 1154년 파비아에서 이탈리아의 왕으로 즉위했고, 마침내 1155년 6월 18일 신성 로마 황제로 즉위했다. 그는 1178년 6월 30일 아를에서 부르군트의 왕으로 즉위했다. 그의 왕 선출 이전, 그는 슈바벤공의 계승자로 호엔슈타우펜가 당주 프리드리히 애꾸공(Friedrich der Einäugige)의 아들이었다. 그의 어머니는 라이벌인 벨펜가의 하인리히 흑공(Heinrich der Schwarze)의 딸 유디트 벨프(Judith Welf)였고, 이로 인해 프리드리히는 독일을 이끄는 두 집안의 계승자가 되어서 황제로 선출될 수 있었다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "프리드리히는 1122년에 태어났다. 1147년 그는 슈바벤 공작이 되었고, 직후 그의 삼촌이자 독일왕 콘라트 3세와 함께 제2차 십자군으로 첫 번째 동방여행을 떠났다. 원정은 재앙으로 끝났으나, 프리드리히는 유명해져 왕의 신뢰를 얻었다. 1152년 2월 콘라트가 죽었을 때 프리드리히와 밤베르크 대주교만이 왕의 임종을 함께하였다. 둘은 콘라트가 프리드리히를 가리키며 죽었기 때문에 이후 콘라트의 6살 된 아들 대신 프리드리히를 지명했고, 프리드리히가 왕위를 계승해야 한다고 주장했다. 프리드리히는 왕관을 간절히 원했고, 3월 4일 왕국의 선제후들은 그를 다음 독일 왕으로 선출했다. 그는 아헨에서 며칠 뒤에 대관식을 거행했다.",
      "신성 로마 제국을 샤를마뉴와 오토 1세 때의 위치로 되돌리려는 열망을 실현시키기 위해, 새 왕은 독일내에서의 회복이 이탈리아내 제국 권리의 보강보다 선행되어야 한다고 봤다. 평화를 위해서, 그는 귀족의 수많은 양보를 얻어냈다. 해외에서 프리드리히는 스벤 3세와 발데마르 1세의 덴마크 내전에 개입했고, 비잔티움 제국 황제 마누엘 1세 콤네누스와 교섭을 시작했다. 이즈음에 왕은 아이를 못낳은, 먼 친척관계인 아델하이트 폰 포부르크와의 이혼 허가를 교황에게 승인받았다. 그는 콘스탄티노폴리스에서 신부를 얻고자 했으나 헛수고였다. 그의 통치기에 프리드리히는 그의 왕위 선출을 교황 에우제니오 3세에게 통보했지만, 교황의 허락을 구하기는 거부했다.",
      "1153년 3월, 프리드리히는 대관식에서 돌아오는 중에 교황 에우제니오의 승인이 없이 시칠리아왕 루지에로 2세 등의 교회의 적과 평화조약을 맺지 않고, 교황권을 지키겠다고 약속했다.",
    ] },
  { "title" = "사망", "paragraphs" = [
      "1190년 6월 10일 프리드리히는 소아시아 남동쪽 킬리키아의 살레프강에서 수영하던중 67세의 나이로 죽었다. 정확한 상황은 알려지지 않았다. 연대기 저자 알리 이븐 알 아시르에 따르면 그의 갑옷 무게 때문에 엉덩이 깊이의 물에 빠졌다고 한다. 그날의 갑옷은 가능한 한 가볍도록 디자인되었기 때문에 건강한 사람이 엉덩이 깊이의 물에 빠질 만큼 무겁지 않았다. 하지만 일부 리인액터와 역사가들은 프리드리히의 늙은 나이를 감안하면 갑옷의 무게는 물에서 빠져나오기를 더욱 힘들게 했을 것이라고 논한다.",
      "프리드리히의 죽음은 그의 군대를 혼란에 빠트렸다. 리더가 없이 공황에 빠져 투르크군에게 전방면에서 공격당하여, 독일군은 도망가거나 살해당했다. 원래 군사들의 극히 일부인 5000명만이 아크레에 도착했다. 바르바로사의 아들 슈바벤공 프리드리히 6세가 잔여군을 모아 황제를 예루살렘에 묻고자 하였으나, 식초로 절여 보존하고자 하는 시도가 실패하여, 살은 안티오키아의 성 베드로 성당에, 뼈는 티레 대성당에, 심장과 내장은 타르수스에 묻었다.",
      "프리드리히의 때 아닌 죽음은 십자군을 라이벌 관계이자 프랑스의 필리프 2세와 잉글랜드의 리처드 1세의 지휘아래 있게 했고, 결국 분리되었다. 사자심왕 리처드는 동으로 계속 진군하여 살라딘과 싸워 복잡한 결과를 낳고, 예루살렘의 함락이라는 십자군의 주 목적은 성취하지 못하고 끝냈다.",
    ] },
  { "title" = "전설", "paragraphs" = [
      "프리드리히는 브리튼의 아더왕과 은총왕 브란처럼 산중휴거 전설을 포함해, 수많은 전설의 주제가 되었다. 전설에서는 그는 죽지 않았고 튀링엔의 키프호이저 산성(Kyffhäuserdenkmal mit Kaiser Barbarossa, 99706 Kyffhäuserland), 또는 바이에른의 운더베르크산의 동굴에 그의 기사들과 함께 잠자고 있고, 갈까마귀가 산 주위에 날기를 멈출 때 그는 일어나서 독일을 고대의 영광으로 돌릴 것이라고 한다. 그 이야기에 따르면, 그의 붉은 수염은 그가 앉은 탁자를 뚫고 자랐다고 한다. 그의 눈은 자는 동안 반쯤 감겨 있지만 지금, 그는 계속하여 손을 들고 소년을 보내 갈까마귀가 날기를 멈췄는지 보라고 한다. 비슷한 이야기로 시칠리아에서 프리드리히 2세의 전설이 있다. 키프하우저산 정상에서는 프리드리히를 기념한다. 1941년 독일의 소련침공 때 코드명은 바르바로사 작전이었다.",
    ] },
]

[articles.ar]
text = "كان فريدرش روتبارت (الألمانية: Friedrich I Rotbart) (1122 -10 يونيو 1190)، والمعروف أيضًا بفريدرش الأول (الإيطالية: Federico I)، الإمبراطور الروماني المقدس من عام 1155 وحتى وفاته بعد 35 عامًا. انتُخب ملكًا لألمانيا في فرانكفورت في الرابع من مارس 1152 وتُوج في آخن في التاسع من مارس 1152."
title = "فريدرش الأول بربروسا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D9%81%D8%B1%D9%8A%D8%AF%D8%B1%D8%B4_%D8%A7%D9%84%D8%A3%D9%88%D9%84_%D8%A8%D8%B1%D8%A8%D8%B1%D9%88%D8%B3%D8%A7"
intro = [
  "كان فريدرش روتبارت (الألمانية: Friedrich I Rotbart) (1122 -10 يونيو 1190)، والمعروف أيضًا بفريدرش الأول (الإيطالية: Federico I)، الإمبراطور الروماني المقدس من عام 1155 وحتى وفاته بعد 35 عامًا. انتُخب ملكًا لألمانيا في فرانكفورت في الرابع من مارس 1152 وتُوج في آخن في التاسع من مارس 1152. تُوج ملكًا لإيطاليا في 24 أبريل 1155 في بافيا وإمبراطورًا على يد البابا أدريان الرابع في 18 يونيو 1155 في روما. بعد سنتين، ظهر مصطلح ساكروم («مقدس») للمرة الأولى في مستند له صلة بإمبراطوريته. تُوج لاحقًا بصورة رسميةٍ ملكًا لبرغونة في آرل في 30 يونيو 1178. سمته المدن الإيطالية الشمالية التي حاول احتلالها بارباروسا، وبارباروسا يعني «ذي اللحية الحمراء» بالإيطالية، أما بالألمانية فكان يُعرف بالقيصر روتبارت، والذي يعني «الإمبراطور أحمر اللحية» بالإنجليزية. يعكس انتشار اللقب الإيطالي، حتى في الاستخدام الألماني اللاحق، مركزية الحملات الإيطالية في مسيرته.",
  "قبل انتخابه الإمبراطوري، كان فريدرش قد ورث دوقية شوابيا (1147 -1152، تحت اسم فريدرش الثالث). كان ابن الدوق فريدرش الثاني من أسرة هوهنشتاوفن، وجوديث، ابنة هاينريش التاسع دوق بافاريا، من أسرة فلف المنافسة. بالتالي، انحدر فريدرش من العائلتين القائدتين في ألمانيا، ما جعله خيارًا مقبولًا لدى الأمراء الناخبين في الإمبراطورية.",
  "يعتبره المؤرخون من أعظم أباطرة الإمبراطورية الرومانية المقدسة القروسطين. حوى صفاتٍ جعلته يبدو إنسانًا خارقًا تقريبًا في أعيُن أقرانه: طول عمره، وطموحه، ومهاراته الاستثنائية في التنظيم، وألمعيته في ساحة المعركة وحصافته. تضم مساهماته في مجتمع وسط أوروبا وثقافته إعادة إرساء قانون جستنيان، أو سيادة القانون الروماني، ما كافأ سلطة البابا التي كانت مهيمنة على الولايات الألمانية منذ انتهاء نزاع التنصيب.",
]
sections = [
  { "title" = "سيرته", "paragraphs" = [
      "وُلد فريدرش في منتصف ديسمبر من عام 1122 في هاغويناو، لفريدرش الثاني دوق شوابيا وجوديث البافاريّة. تعلم ركوب الخيل والصيد واستخدام الأسلحة، لكن لم يتعلم القراءة ولا الكتابة، وكان عاجزًا أيضًا عن النطق باللغة اللاتينية. في وقت لاحق، لعب دورًا في هوفتاج في عهد عمه، الملك كونراد الثالث في عام 1141 في ستراسبورغ، وفي 1142 في كونستانس، وفي 1143 في أولم، وفي 1144 في فورتسبورغ وفي 1145 في فورمس.",
      "في بداية عام 1147، انضم فريدرش إلى الحملة الصليبية الثانية. كان عمه، كونراد الثالث، قد أقسم قسم الصليبيين على الملأ في 28 ديسمبر 1146. عارض أبو فريدرش مشاركة ابنه في الحملة الصليبية بشدة. وفقًا لأوتو فون فرايزنغ، فقد وبّخ الدوق أخاه، كونراد الثالث، لسماحه لابنه بالذهاب. كان فريدرش الأكبر، الذي كان يحتضر، يتوقع من ابنه أن يرعى أرملته وأخاه الأصغر غير الشقيق.",
      "ربما أثناء التحضير لحملته الصليبية، تزوج فريدرش من أدلهيد ابنة مرغريف ديبولد الثالث فون فوبورغ في وقت ما قبل مارس 1147. توفي والده في الرابع أو السادس من أبريل وخلفه فريدرش في دوقية شوابيا. غادر الجيش الصليبي الألماني من ريغنسبورغ بعد سبعة أسابيع.",
    ] },
]

[articles.vi]
text = "Friedrich I Barbarossa (1122 – 10 tháng 6 năm 1190) là Hoàng đế của Đế quốc La Mã Thần thánh từ năm 1155 cho đến khi băng hà. Ông được bầu làm vua nước Đức tại Frankfurt vào ngày 4 tháng 3 năm 1152 và lên ngôi tại Aachen ngày 9 tháng 3, lên ngôi vua nước Ý tại Pavia năm 1154, và cuối cùng được Giáo hoàng Ađrianô IV phong làm Hoàng đế La Mã vào ngày 18 tháng 6 năm 1155."
title = "Friedrich I của Thánh chế La Mã"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Friedrich_I_c%E1%BB%A7a_Th%C3%A1nh_ch%E1%BA%BF_La_M%C3%A3"
intro = [
  "Friedrich I Barbarossa (1122 – 10 tháng 6 năm 1190) là Hoàng đế của Đế quốc La Mã Thần thánh từ năm 1155 cho đến khi băng hà. Ông được bầu làm vua nước Đức tại Frankfurt vào ngày 4 tháng 3 năm 1152 và lên ngôi tại Aachen ngày 9 tháng 3, lên ngôi vua nước Ý tại Pavia năm 1154, và cuối cùng được Giáo hoàng Ađrianô IV phong làm Hoàng đế La Mã vào ngày 18 tháng 6 năm 1155. Hai năm sau, tên gọi \"thần thánh\" (sacrum) mới xuất hiện lần đầu tiên trong một văn bản liên quan tới đế quốc của ông. Về sau, ông lên ngôi vua xứ Bourgogne tại Arles ngày 30 tháng 6 năm 1178. Người ta gọi ông là Barbarossa (có nguồn gốc từ tiếng Ý nghĩa là \"râu đỏ\", từ các thành phố miền bắc Ý nơi ông cố gắng áp đặt nền của cai trị của mình), do ông có bộ râu màu đỏ và dài. Trong tiếng Đức, ông được gọi là Kaiser Rotbart, với ý nghĩa tương tự.",
  "Trước khi lên ngôi, ông lãnh quyền thừa kế Công quốc Schwaben (1147 – 1152, với danh hiệu Friedrich II). Ông là con trai của Friedrich II, Quận công xứ Schwaben, thuộc dòng dõi nhà Hohenstaufen. Mẹ ông là Quận chúa Judith xứ Bayern, con gái của Quận công Heinrich IX xứ Bayern, thuộc nhà Welfen đối nghịch, và như vậy ông xuất thân từ hai gia đình thế lực nhất nước Đức, khiến cho ông trở thành lựa chọn khả dĩ với các vị Tuyển hầu tước Đức. Do chế độ phong kiến phân quyền nên vương quyền tại Đức rất mềm mỏng và trong thời gian trị vì của mình, Barbarossa chú trọng đến tình hình Ý. Năm 1154, ông phát động một chiến dịch quân sự ở Ý và phục ngôi cho Giáo hoàng Êugêniô III. Sau khi trở về Đức, ông thực hiện chính sách xoa dịu nhằm loại trừ các đối thủ tiềm ẩn của mình. Sau đó, ông chinh chiến tại Ý bốn lần nữa và thu được những kết quả lẫn lộn. Trở về Đức sau thất bại của chiến dịch Ý lần thứ năm vào năm 1177, ông trả đũa em họ mình là Heinrich Sư tử, một lãnh chúa có thế lực đã không hỗ trợ ông trong các cuộc chiến ở Ý, bằng việc tước đoạt các lãnh địa của ông này. Song vị hoàng đế không thể thống nhất nước Đức thành một quốc gia tập quyền như Anh.",
  "Ngoài ra, ông cũng giành thắng lợi trong một số chiến dịch quân sự ở Böhmen, Ba Lan, Hungary. Năm 1189, vị hoàng đế cùng các vua Anh và Pháp tiến hành cuộc thập tự chinh thứ ba nhằm giành lại vùng Đất Thánh từ tay người Hồi giáo. Sau khi kéo quân qua lãnh thổ Hy Lạp với sự cho phép của Hoàng đế Đông La Mã với sự cho phép, ông tiến vào Tiểu Á và đập tan quân Thổ Seljuk trong một trận đánh lớn ở Konja. Nhưng rồi, ông bị chết đuối khi vượt sông Salelph ở miền Nam Thổ Nhĩ Kỳ ngày nay. Friedrich được đánh giá là vị hoàng đế vĩ đại nhất của triều Hohenstaufen, một lãnh đạo chính trị sắc sảo và thực dụng và là một nhà cai trị có tài, đồng thời là một viên tướng thao lược. Ông được thần dân mến mộ đến mức mà trong vòng nhiều năm sau khi ông băng hà, những người nông dân không tin là ông đã mất, mà đang ngủ trong hang động trên một ngọn núi ở Đức, với dũng sĩ hầu cận xung quanh ông. Về sau, truyền thuyết về Barbarossa đã trở nên gắn bó với chủ nghĩa dân tộc Đức vào thế kỷ 19.",
]
sections = [
  { "title" = "Thời trẻ", "paragraphs" = [
      "Friedrich chào đời năm 1122, năm 1147 ông trở thành Quận công xứ Schwaben, rồi chỉ một thời gian ngắn sau, tháp tùng chú của mình là vua Konrad III của Đức, tiến hành cuộc Thập tự chinh thứ hai. Cuộc thập tự chinh thất bại thảm hại, nhưng Friedrich lại nổi bật lên, và giành được sự tin tưởng tuyệt đối từ người chú của mình. Khi vua Konrad qua đời vào tháng 2 năm 1152, chỉ có Friedrich và Giám mục Bamberg có mặt tại giường bệnh của ông, và chứng thực rằng Konrad trao vương hiệu lại cho Friedrich, để nối nghiệp mình. Friedrich Barbarossa theo đuổi ngai vàng một cách đầy nhiệt tình, và tới ngày 4 tháng 3, các Tuyển hầu tước bầu ông làm Vua La Mã Đức. Ông lên ngôi tại Aachen vài ngày sau, khi đó ông 28 tuổi. Khi đó, có sự phân biệt giữa việc được chọn lên làm \"vua người La Mã\", nhưng lên ngôi tại Đức, và với việc đăng quang tại Rôma, và chính thức nhận đế hiệu. Ông nhận vương miện Hoàng đế Đế quốc La Mã thần thánh từ Giáo hoàng, tại Rôma ngày 18 tháng 6 năm 1155. Friedrich I là người nhà Hohenstaufen theo phía cha, và là người nhà Welf theo phía mẹ, tức là hai dòng họ hùng mạnh nhất nước Đức khi đó.",
      "Lúc đó vương quyền rất yếu, vua không có thực quyền. Nhà vua được các công vương bầu lên, nhưng chỉ cai quản lãnh địa riêng của mình, và không thực sự có quyền gì trên các phần khác của vương quốc. Vương miện hoàng đế được truyền từ dòng họ này sang dòng họ khác, để ngăn ngừa một dòng họ nào chiếm lấy làm của riêng mình. Khi Friedrich I Hohenstaufen lên ngôi vua năm 1152, vương quyền thực tế đã vô chủ trong 25 năm, và ở một chừng mực nào đó là hơn 80 năm. Tài lực khi đó tập trung chủ yếu ở các thành phố giàu có miền bắc Ý, nơi chừng nào theo danh nghĩa vẫn thuộc về hoàng đế Đức Dòng dõi Salia chấm dứt khi vua Heinrich V từ trần năm 1125. Các thân vương Đức không chịu trao vương miện cho cháu vua là quận công Schwaben, vì sợ rằng ông này sẽ tập trung vương quyền của Heinrich V. Thay vào đó, họ chọn Lothiar (1125 - 1137), ông này vướng vào vòng tranh chấp với nhà Hohenstaufen, và thông gia với nhà Welf. Một người của nhà Hohenstaufen giành được ngai vàng là Konrad III (1137 - 1152), và khi Friedrich Barbarossa kế nhiệm chú mình, ông có cơ hội tốt để chấm dứt sự xung khắc giữa hai nhà, vì ông xuất thân từ cả hai nhà. Nhưng quận công Welf xứ Sachsen là Heinrich Sư tử không hài lòng. Ông tiếp tục coi dòng vua Hohenstaufen là địch thủ. Barbarossa có các lãnh địa Schwaben và Franken, có cá tính mạnh mẽ, nhưng cũng chỉ có thế, để xây dựng nên đế quốc của mình.",
      "Nước Đức mà Friedrich muốn thống nhất khi đó là một tập hợp chắp vá gồm hơn 1.600 tiểu quốc, mỗi tiểu quốc cai trị bởi một ông hoàng. Một vài tiểu quốc như Bayern và Sachsen tương đối lớn, đa phần còn lại nhỏ đến mức khó mà chỉ ra được trên bản đồ. Danh vị dành cho vua Đức khi đó là \"Caesar\", \"Augustus\" và \"hoàng đế người La Mã\". Lúc Friedrich đăng quang, các danh tước đó chỉ còn là hư danh Friedrich là một người thực tế, ông đối tiếp các vương hầu Đức trên cơ sở hai bên cùng có lợi. Không giống như Henry II của Anh, Friedrich không tìm cách chấm dứt chế độ phong kiến Trung Cổ, mà tìm cách hồi phục nó, nhưng điều này vượt quá khả năng của ông. Những phe phái lớn nhất trong cuộc nội chiến tranh giành ảnh hưởng tại Đức là Giáo hoàng, Hoàng đế, phe Ghibellini - tức nhà Hohenstaufen, và phe Guelfo - tức nhà Welf. Không phe nào trong số đó nổi trội hẳn lên được.",
    ] },
  { "title" = "Trỗi dậy", "paragraphs" = [
      "Mong muốn khôi phục Đế quốc trở lại kỷ nguyên hoàng kim dưới thời các đại đế Karl và Otto I, vị tân hoàng đế nhận rõ rằng tái lập trật tự tại Đức là điều kiện tiên quyết để thiết lập vương quyền trên đất Ý. Bằng cách ra các chỉ dụ hòa bình, ông ban cho giới quý tộc nhiều nhân nhượng rộng rãi. Đối ngoại, Friedrich I can thiệp vào cuộc nội chiến tại Đan Mạch và bắt đầu đàm phán với Hoàng đế Đông La Mã là Manuel I Comnenus. Có lẽ cũng thời gian này, ông được phép của Giáo hoàng hủy bỏ cuộc hôn nhân của ông với Adelheid xứ Vohburg, với lý do họ hàng gần (ông tổ 5 đời của ông là anh trai của bà tổ 5 đời của Adelheid). Ông tiếp đó cố gắng tiến hành một cuộc hôn nhân với triều đình Constantinopolis, nhưng không thành công. Khi lên ngôi, ông báo tin cho Giáo hoàng Êugêniô III, nhưng sao lãng không yêu cầu Giáo hoàng chuẩn y. Tháng 3 năm 1153, Friedrich ký kết hiệp ước với Giáo hoàng, theo đó để đổi lại việc chấp thuận để ông lên ngôi, ông hứa sẽ bảo vệ Giáo hoàng, không chấp thuận hòa ước với vua Roger II xứ Sicilia hay các đối thủ khác của Giáo hội mà không có sự chấp thuận của Giáo hoàng, và giúp Giáo hoàng duy trì kiểm soát kinh thành Rôma.",
    ] },
  { "title" = "Cai trị và chiến tranh ở Ý", "paragraphs" = [
      "Friedrich Barbarossa tiến hành sáu cuộc chinh phạt vào Ý. Cuộc chinh phạt đầu tiên, ông được trao vương miện Hoàng đế Đế quốc La Mã thần thánh tại Rôma bởi Giáo hoàng Ađrianô IV, sau việc quân đội Hoàng gia đàn áp lực lượng nổi dậy công xã, theo chủ nghĩa cộng hòa, lãnh đạo bởi Arnold của Brescia. Trong chiến dịch năm 1155 tại Rôma, Friedrich nhanh chóng liên minh với Giáo hoàng Ađrianô IV để giành lại thành phố. Lực lượng chống đối chủ yếu theo Arnold của Brescia, ông này vốn theo học với nhà thần học Peter Abelard. Arnold bị bắt, bị treo cổ với tội phản nghịch và bạo loạn.",
      "Friedrich Barbarossa rời nước Ý vào mùa thu năm 1155 để chuẩn bị cho một cuộc viễn chinh mới và còn gay go hơn nữa.",
      "Tình hình hỗn loạn lúc đó lan tràn tại Đức, đặc biệt là tại xứ Bayern, nhưng hòa bình đã được vãn hồi bởi các hoạt động mạnh mẽ, nhưng có tính xoa dịu của Friedrich. Đất quận công Bayern được chuyển từ tay bá tước Áo là Heinrich II Jasomirgott, cho người bà con đáng gờm của Friedrich là Heinrich Sư tử, quận công xứ Sachsen, thuộc nhà Guelph, cha ông này vốn kiểm soát cả hai vùng. Heinrich II Jasomirgott được phong làm quận công Áo, để bù lại việc mất Bayern. Với chính sách thỏa hiệp với các lực lượng chính của các thân vương Đức và chấm dứt nội chiến trong vương quốc, Friedrich ve vãn Henry của Áo bằng cách ban cho Henry chỉ dụ Privilegium Minus, phong Henry từ bá tước thành quận công Áo, việc chưa từng xảy ra. Đây được xem là cột mốc quan trọng, đánh dấu việc tách Áo khỏi Bayern, mở đầu cho việc thành lập nước Áo độc lập. Đây cũng là một sự nhân nhượng lớn từ phía Friedrich, vì ông hiểu rằng ông phải hòa giải với Heinrich Sư tử, thậm chí phải chia sẻ quyền lực nếu cần. Ông không thể ra mặt đối đầu với Heinrich ngay được. Ngày 9 tháng 6 năm 1156 tại Würzburg, Friedrich cưới Béatrice I, quận chúa Bourgogne, con gái và là người thừa kế của bá tước Renaud III xứ Bourgogne, và như vậy thêm vào lãnh địa của mình vùng đất rộng lớn Bourgogne.",
    ] },
  { "title" = "Những năm cuối đời", "paragraphs" = [
      "Năm 1174, vua Friedrich Barbarossa tiến hành cuộc viễn chinh Ý lần thứ năm, nhưng bị Liên minh Lombard (Societas Lombardiæ et Romandiolæ et Marchiæ), giờ có thêm Venezia, Sicilia và Constantinopolis, theo phe Giáo hoàng chống lại. Các thành phố miền bắc Ý đã trở nên hết sức thịnh vượng nhờ thương mại, và đại diện cho một bước ngoặt trong bước chuyển từ trật tự phong kiến Trung Cổ. Khi Friedrich Barbarossa bị liên minh các thành phố bắc Ý đánh bại, cả châu Âu bị sốc vì không tưởng tượng được việc đó có thể xảy ra.",
      "Cùng việc Heinrich Sư tử từ chối đưa viện quân vào Ý, cuộc viễn chinh thất bại thảm hại. Friedrich Barbarossa có thể hành binh vượt miền bắc Ý, chiếm Rôma, và đưa Giáo hoàng đối lập Pascalê III lên ngôi, nhưng người Lombard nổi dậy ở sau lưng ông, trong khi bệnh dịch làm quân đội của ông bị suy yếu nghiêm trọng. Friedrich tiếp đó bị đánh bại trong trận Legnano gần Milano ngày 29 tháng 5 năm 1176. Ông bị thương, và có lúc người ta tưởng là ông đã chết. Trận chiến này là bước ngoặt trong cuộc đấu tranh giành quyền làm chủ đế quốc của ông. Ông không có lựa chọn nào khác ngoài việc phải thương lượng với Giáo hoàng Alexanđê III và Liên minh Lombard. Theo hòa ước Anagni 1176, Friedrich công nhận Alexanđê III là Giáo hoàng, và với hiệp ước Venezia 1177, Friedrich và Giáo hoàng Alexanđê III chính thức hòa giải. Friedrich phải chịu khuất phục trước Giáo hoàng tại Venezia. Ông công nhận quyền lực của Giáo hoàng tại Quốc gia Giáo hoàng (tức Rôma và vùng phụ cận), đổi lại Giáo hoàng Alexanđê III thừa nhận quyền chủ tể của Hoàng đế với Giáo hội Đế quốc. Cũng theo hòa ước Venezia, hòa bình được thiết lập với Liên minh Lombard từ tháng 8 năm 1178. Tiếp đó, hòa bình vĩnh viễn được thiết lập với hòa ước Constance, Friedrich thừa nhận quyền của các thành phố này được tự bầu thị trưởng thành phố. Như vậy Friedrich giành lại quyền cai trị trên danh nghĩa trên đất Ý, đó là cách chủ yếu mà ông áp đặt sức ép lên Giáo hoàng",
      "Friedrich Barbarossa không tha thứ cho Heinrich Sư tử vì việc không đưa quân đến hỗ trợ cho ông trong chiến dịch năm 1174. Tới năm 1180, Heinrich đã thành công trong việc thiết lập một công quốc hùng mạnh và liên tục, gồm Sachsen, Bayern và nhiều lãnh thổ rộng lớn ở miền đông và bắc Đức. Lợi dụng sự thù địch của nhiều công vương Đức với Heinrich, Friedrich Barbarossa xử vắng mặt Heinrich trong một phiên tòa chủ tọa gồm nhiều giám mục và công vương Đức năm 1180, tuyên bố rằng luật đế quốc có hiệu lực hơn luật cổ truyền Đức, xử phạt Heinrich bằng cách tước bỏ đất đai của ông này, và đặt ông này ra ngoài vòng pháp luật.",
    ] },
]

[articles.id]
text = "Friedrich I (1122 – 10 Juni 1190), juga dikenal sebagai Friedrich Barbarossa, merupakan seorang Kaisar Romawi Suci dari tahun 1155 sampai kematiannya. Ia terpilih sebagai Raja Jerman di Frankfurt pada tanggal 4 Maret 1152 dan dimahkotai di Aachen pada tanggal 9 Maret 1152."
title = "Friedrich I, Kaisar Romawi Suci"
lang = "id"
url = "https://id.wikipedia.org/wiki/Friedrich_I%2C_Kaisar_Romawi_Suci"
intro = [
  "Friedrich I (1122 – 10 Juni 1190), juga dikenal sebagai Friedrich Barbarossa, merupakan seorang Kaisar Romawi Suci dari tahun 1155 sampai kematiannya. Ia terpilih sebagai Raja Jerman di Frankfurt pada tanggal 4 Maret 1152 dan dimahkotai di Aachen pada tanggal 9 Maret 1152. Ia menjadi Raja Italia pada tahun 1155 dan dimahkotai sebagai Raja Romawi oleh Paus Adrianus IV pada tanggal 18 Juni 1155. Dua tahun kemudian, istilah sacrum (\"suci\") pertama kali muncul di dalam dokumen yang berhubungan dengan Kekaisarannya. Ia kemudian secara resmi dimahkotai sebagai Raja Borgogne, di Arles pada tanggal 30 Juni 1178. Ia mendapat julukan Barbarossa dari kota-kota Italia utara yang ingin dikuasainya: Barbarossa berarti \"berjenggot merah\" di dalam Bahasa Italia; di Jerman, ia dikenal sebagai (Bahasa Jerman: Kaiser Rotbart), yang memiliki arti yang serupa.",
  "Sebelum pemilihan kekaisaran, Friedrich adalah ahli waris gelar Adipati Swabia (1147–1152, sebagai Friedrich III). Ia adalah putra Adipati Friedrich II dari Wangsa Hohenstaufen dan Judith, putri Heinrich IX dari Bayern, dari saingannya, Wangsa Guelf. Oleh karena itu, Friedrich adalah keturunan dari dua keluarga terkemuka di Jerman, yang membuatnya terpilih sebagai Raja-pemilih Kekaisaran.",
  "Para sejarawan menganggapnya sebagai salah satu Kaisar Romawi Suci terhebat dari abad pertengahan. Ia menggabungkan kualitas-kualitas yang membuatnya hampir seperti manusia super di jamannya: panjang umurnya, ambisinya, keterampilannya yang luar biasa di dalam organisasi, ketangkasannya di medan perang serta politiknya yang bagus. Dari sumbangan-sumbangannya untuk masyarakat Eropa Tengah dan budaya termasuk membentuk kembali Corpus Juris Civilis, atau hukum pemerintahan Romawi, yang mengimbangi kuasa kepausan yang mendominasi negara Jerman sejak penyimpulan Kontroversi Penobatan.",
]
sections = [
  { "title" = "Tahun-tahun awal", "paragraphs" = [
      "Friedrich lahir pada tahun 1122. Pada tahun 1147 ia menjadi Adipati wilayah Jerman selatan, Swabia (Herzog von Schwaben), dan tak lama setelah itu, ia melakukan perjalanan pertamanya ke Timur, yang ditemani oleh pamandanya, raja Jerman Konrad III, pada Perang Salib Kedua. Ekspedisi tersebut menjadi sebuah bencana, tetapi Friedrich dapat membedakan dirinya dan memenangkan kepercayaan raja sepenuhnya. Ketika Konrad meninggal pada bulan Februari 1152, hanya Friedrich dan uskup-raja Bamberg yang menjadi saksi kematiannya. Keduanya menegaskan setelah itu bahwa Konrad menyerahkan lambang kerajaan untuk Friedrich dan menunjukkan bahwa ia memilih Friedrich daripada putra Konrad yang hanya berusia enam tahun, calon Friedrich IV dari Swabia, menggantikannya sebagai raja. Friedrich dengan penuh semangat mengejar mahkota dan di Frankfurt pada tanggal 4 Maret 1152 Raja-pemilih kerajaan menunjuknya sebagai raja Jerman yang berikutnya. Ia dimahkotai sebagai Raja Romawi di Aachen beberapa hari kemudian, pada tanggal 9 Maret 1152. Ayahanda Friedrich berasal dari Wangsa Hohenstaufen, dan ibundanya dari Wangsa Guelf, dua wangsa yang paling berkuasa di Jerman. Wangsa Hohenstaufen sering disebut Ghibellin, yang diambil dari Italianisasi kastil Waiblingen, kedudukan keluarga di Swabia; Wangsa Welf, di dalam Italianisasi disebut Wangsa Guelf.",
      "Pemerintahan Heinrich IV dan Heinrich V membuat status kekaisaran Jerman berantakan, wewenangnya sangat berkurang di bawah Kontroversi Penobatan. Selama seperempat abad setelah kematian Heinrich V pada tahun 1125, monarki Jerman sebagian besar hanya gelar nominal tanpa kekuasaan apapun. Raja dipilih oleh para pangeran, tidak diberi sumber di luar wilayah mereka, dan ia dicegah untuk bertindak dengan wewenang yang sesungguhnya. Gelar kerajaan selanjutnya diteruskan dari satu keluarga ke yang lainnya untuk menghalangi perkembangan kepentingan wangsa di mahkota Jerman. Ketika Friedrich I dari Hohenstaufen terpilih seagai raja pada tahun 1152, kekuasaan raja telah ditunda secara efektif selama lebih dari dua puluh lima tahun, dan untuk maju ke tingkat yang cukup lebih dari delapan puluh tahun. Satu-satunya tuntutan nyata atas kekayaan di kota-kota Italia utara, yang masih berada di dalam kendali raja Jerman. Garis Salier punah dengan kematian Heinrich V pada tahun 1125. Pangeran-pangeran Jerman menolak untuk memberkan mahkota kepada keponakannya, adipati Swabia, yang khawatir ia akan mencoba untuk mendapatkan kembali kekuasaan kekaisaran yang dipegang oleh Heinrich V. Sebaliknya mereka memilih Lothar III (1125–1137), yang terlihat di dalam sengketa yang berlangsung lama dengan Wangsa Hohenstaufen, dan yang menikah ke dalam Wangsa Guelf. Salah satu dari anggota Wangsa Hohenstaufen naik takhta sebagai Konrad III dari Jerman (1137–1152). Ketika Friedrich Barbarossa menggantikan pamandanya pada tahun 1152, tampaknya terdapat prospek yang sangat baik untuk mengakhiri permusuhan, karena ia juga berasal dari Guelf dari pihak ibundanya. Adipati Sachsen Welf, Heinrich der Löwe, tidak begitu senang, tetapi tetap menjadi musuh bebuyutan monarki Hohenstaufen. Barbarossa memiliki…",
      "Jerman yang ingin disatukan oleh Friedrich adalah sebuah tambal sulam yang masing-masing lebih dari 1600 negara, yang memiliki pangerannya sendiri-sendiri. Beberapa dari wilayah tersebut besar seperti Bayern dan Sachsen. Banyak yang terlalu kecil untuk ditunjukkan di dalam peta. Gelar-gelar yang diberikan kepada raja Jerman adalah \"Caesar\", \"Augustus\", dan \"Kaisar Romawi\". Pada saat Friedrich akan mengambil gelar-gelar tersebut, mereka tidak lebih dari sebuah slogan propaganda dengan sedikit makna lainnya. Friedrich adalah seorang pragmatis yang berurusan dengan pangeran-pangeran dengan mencari kepentingan bersama. Tidak seperti Henry II dari Inggris, Friedrich tidak berusaha mengakhiri feodalisme abad pertengahan, melainkan mencoba untuk megembalikannya, meskipun berada di luar kemampuannya. Para pemain besar di dalam perang sipil Jerman yang menjadi Paus, Kaisar, Ghibellin dan Guelf, tetapi tidak ada satupun yang muncul sebagai pemenangnya.",
    ] },
  { "title" = "Mulai berkuasa", "paragraphs" = [
      "Bersemangat untuk mengembalikan Kekaisaran ke posisi yang ditempati oleh Charlemagne dan Otto I, Kaisar Romawi Suci, raja yang baru menyaksikan dengan jelas bahwa pemulihan ketertiban di Jerman adalah awal yang diperlukan untuk menegakkan hak kekaisaran di Italia. Mengeluarkan perintah umum untuk perdamaian, ia membuat konsesi mewah untuk para bangsawan. Di luar negeri, Friedrich campur tangan di dalam perang saudara Denmark di antara Svend III Grathe dan Valdemar I dari Denmark dan memulai beberapa negosiasi dengan Kaisar Romawi Timur, Manouel I Komnenos. Mungkin pada sekitar saat itu raja memperoleh persetujuan kepausan untuk membatalkan pernikahannya yang tidak membuahkan keturunan dengan Adela dari Vohburg, dengan alasan pertalian darah (kakek moyangnya adalah saudara nenek moyang Adela, yang menjadikan mereka sepupu keempat, setelah dihapus). Ia kemudian gagal berupaya untuk mendapatkan calon mempelai dari istana Konstantinopel. Pada kenaikan takhtanya, Friedrich telah membicarakan kabar-kabar pemilihannya kepada Paus Eugenius III, tetapi mengabaikan untuk meminta konfirmasi kepausan. Pada bulan Maret 1153, Friedrich menyimpulkan perjanjian Constance dengan Paus, di mana ia berjanji, sebagai imbalan atas penobatannya, untuk membela kepausan, untuk tidak berdamai dengan raja Ruggeru II dari Sisilia atau musuh-musuh Gereja lainnya tanpa persetujuan dari Eugenius, dan untuk membantu Eugenius mendapatkan kembali wewenang kota Roma.",
    ] },
  { "title" = "Kampanye Italia pertama: 1154–55", "paragraphs" = [
      "Frederick melakukan enam ekspedisi ke Italia. Yang pertama, dimulai pada awal bulan Oktober 1154, rencananya adalah untuk meluncurkan kampanye melawan Bangsa Norman di bawah Raja Gugghiermu I dari Sisilia. Ia berjalan ke bawah dan segera menemui perlawanan terhadap wewenangnya. Mendapat penyerahan Milan, ia berhasil mengepung Tortona pada awal tahun 1155, dan meratakannya ke tanah. Ia pindah ke Pavia, di mana ia menerima Mahkota besi Lombardia dan gelar Raja Italia. Bergerak melalui Bologna dan Toskana, ia segera mendekati kota Roma. Di sana, Paus Adrianus IV berjuang dengan pasukan komune kota republik yang dipimpin oleh Arnaldus, murid Petrus Abelardus. Sebagai tanda dari iktikad baiknya, Friedrich membubarkan para duta besar dari Senat Romawi yang dipulihkan, dan pasukan kerajaan menekan kaum republik. Arnaldus ditangkap dan dihukum gantung atas pengkhianatan dan pemberontakannya. Meskipun ajaran ortodoks mengenai teologi, Arnaldus tidak dihukum karena tuduhan bidah.",
      "Begitu Friedrich mendekati gerbang Roma, Paus maju untuk bertemu dengannya. Di tenda kerajaan raja menerimanya, dan setelah mencium kaki paus, Friedrich diharapkan untuk menerima ciuman tradisional perdamaian. Namun Friedrich menolak untuk memegang sanggurdi Paus ketika memimpinnya ke tenda, sehingga Adrianus menolak untuk memberinya ciuman sampai protokol ini dipenuhi. Friedrich ragu-ragu dan Adrianus IV mengundurkan diri; setelah seharian bernegosiasi, Friedrich setuju untuk melakukan ritual yang diperlukan, yang dilaporkan bergumam, \"Pro Petro, non Adriano -- Untuk Petrus, bukan Adrianus.\" Roma masih gempar atas nasib Arnaldus dari Brescia, sehingga tidak berbaris melalui jalan-jalan Roma, Friedrich an Adrianus mundur ke Vatikan.",
      "Keesokan harinya, tanggal 18 Juni 1155, Adrianus IV memahkotai Friedrich I Kaisar Romawi Suci di Basilika Santo Petrus, di tengah-tengah aklamasi tentara Jerman. Bangsa Romawi memulai kerusuhan, dan Friedrich menghabiskan hari pemahkotaannya dengan meredakan pemberontakan, yang mengakibatkan lebih dari 1,000 orang Romaw tewas serta ratusan lainnya menderita luka-luka. Keesokan harinya, Friedrich, Adrianus, dan pasukan Jerman melakukan perjalanan ke Tivoli. Dari sana, kombinasi musim panas Italia yan tidak sehat dan efek ketidakhadirannya selama setahun di Jerman membuatnya terpaksa menunda kampanyenya yang direncanakan melawan bangsa Norman Sisilia. Dalam perjalanan mereka ke utara, mereka menyerang Spoleto dan menemui beberapa duta besar Manouel I Komnenus, yang membanjiri Friedrich dengan hadiah-hadiah yang mahal. Di Verona, Friedrich menyatakan kemarahannya dengan pemberontak Milan sebelum akhirnya kembali ke Jerman.",
    ] },
  { "title" = "Kampanye Italia yang kedua, ketiga dan keempat: 1158–1174", "paragraphs" = [
      "Mundurnya Friedrich pada tahun 1155 memaksa Paus Adrianus IV berdamai dengan Raja Gugghiermu I dari Sisilia, dan menjaminnya wilayah-wilayah yang dianggap Friedrich sebagai miliknya. Hal ini merugikan Friedrich, dan ia lebih tidak senang lagi ketika Legatus kepausan memilih untuk menafsirkan sepucuk surat dari Adrianus kepada Friedrich dengan cara yang menyiratkan bahwa mahkota kekaisaran adalah hadiah dari Paus dan bahwa sebenarnya kekaisaran itu sendiri adalah sebuah perdikan dari Kepausan. Muak dengan Paus, dan masih ingin menghancurkan bangsa Normandi selatan Italia, pada bulan Juni 1158, Friedrich berangkat ke ekspedisi Italia yang kedua, yang ditemani oleh Heinrich der Löwe dan tentara Sachsennya. Ekspedisi ini mengakibatkan peberontakan dan penangkapan Milan, Parlemen Roncaglia yang menyaksikan pembentukan pejabat-pejabat kekaisaran dan reformasi gerejawi di kota-kota Italia utara, dan awal perjuangan panjang dengan Paus Aleksander III.",
      "Kematian Paus Adrianus IV pada tahun 1159 menyebabkan pemilihan kedua saingan paus, Aleksander III dan Antipaus Vittore IV, dan keduanya mencari dukungan Friedrich. Friedrich yang sibuk dengan Pengepungan Crema, tampaknya tidak mendukung Aleksander III, dan setelah menjarah Crema meminta agar Aleksander muncul di hadapan kaisar di Pavia dan menerima dekrit kekaisaran. Aleksander menolaknya, dan Friedrich mengakui Vittore IV sebagai paus yang sah pada tahun 1160. Sebagai balasannya, Aleksander III mengekskomunikasikan baik Friedrich I dan Vittore IV. Friedrich berusaha untuk mengadakan rapat dewan bersama dengan Raja Louis VII dari Prancis pada tahun 1162 untuk memutuskan masalah siapa yang harus menjadi paus. Louis mendekati tempat pertemuan tersebut, tetapi ketika ia menyadari bahwa Friedrich telah menumpuk suara untuk Aleksander, Louis memutuskan untuk tidak menghadiri rapat tersebut. Akibatnya, masalah ini tidak terselesaikan pada waktu itu.",
      "Hasil perjuangan politik dengan Paus Aleksander adalah aliansi yang dibentuk di antara negara Norman Sisilia dan Paus Aleksander III melawan Friedrich. Sementara itu, Friedrich harus berurusan dengan pemberontakan lainnya di Milan, di mana kota itu menyerah pada tanggal 6 Maret 1162; banyak yang dihancurkan tiga minggu kemudian atas perintah kaisar. Nasib Milan menyebabkan Brescia, Piacenza, dan banyak kota-kota di Italia lainnya menyerah. Kembali ke Jerman menjelang akhir tahun 1162, Friedrich mencegah eskalasi konflik di antara Heinrich der Löwe dari Sachsen dan sejumlah pangeran tetangga yang mulai lelah atas kekuasaan dan pengaruh Friedrich serta wilayah-wilayah yang dimenangkannya. Ia juga menghukum berat beberapa warga Mainz atas pemberontakan mereka melawan Uskup Agung Arnaldus. Di kunjungan Friedrich yang ketiga pada tahun 1163, rencana-rencananya untuk menaklukkan Sisilia dirusak oleh pembentukan liga yang kuat terhadap dirinya, yang dibawa bersama oposisi pajak kekaisaran.",
    ] },
]

[articles.tl]
text = "Si Frederick I Barbarossa (Federico I Barbarroja; 1122 – 10 Hunyo 1190) ay ang Alemang Emperador ng Banal na Imperyong Romano. Nahalal siya bilang Hari ng Alemanya sa Frankfurt noon 4 Marso 1152 at kinoronahan sa Aachen noong 9 Marso 1152."
title = "Federico I, Emperador ng Banal na Imperyong Romano"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Federico_I%2C_Emperador_ng_Banal_na_Imperyong_Romano"
intro = [
  "Si Frederick I Barbarossa (Federico I Barbarroja; 1122 – 10 Hunyo 1190) ay ang Alemang Emperador ng Banal na Imperyong Romano. Nahalal siya bilang Hari ng Alemanya sa Frankfurt noon 4 Marso 1152 at kinoronahan sa Aachen noong 9 Marso 1152. Siya ay naging Hari ng Alemanya noong 1155 at kinoronahan ni Papa Adriano IV bilang Emperador ng Roma noong 18 Hunyo 1155. Pagkalipas ng dalawang mga taon, ang katagang sacrum (nangangahulugang \"banal\") ay unang lumitaw sa isang kasulatan na may kaugnayan sa kaniyang Imperyo. Pormal din siyang kinoronahan bilang Hari ng Burgundiya sa Arles noong 30 Hunyo 1178. Nakuha niya ang pangalang Barbarossa (Barbarroja) mula sa mga hilagang lungsod ng Italya na tinangka niyang pamunuan. Ang \"Barbarossa\" ay nangangahulugang \"pulang balbas\" sa Italyano, na isang tanda ng pagkatakot at paggalang. Sa Aleman, nakikilala siya bilang Kaiser Rotbart, na ganoon din ang kahulugan.",
  "Bago siya mahalal bilang hari, siya ang Duke ng Swabia dahil sa pagkakamana mula 1147 hanggang 1152, bilang Frederick III. Siya ang anak na lalaki ni Duke Frederick II ng dinastiyang Hohenstaufen. Ang kaniyang ina ay si Judith, anak na babae ni Henry IX, Duke ng Bavaria, mula sa katunggaling Kabahayan ng Welf. Samakatuwid, si Frederick Barbarossa ay nagmula sa dalawang nangungunang mga mag-anak ng Alemanya, na nakagawa sa kaniya upang maing isang katanggap-tanggap na napili para sa mga prinsipe-elektor ng Imperyo.",
]
sections = [
  { "title" = "Mga sanggunian", "paragraphs" = [
      "Ang lathalaing ito na tungkol sa Talambuhay, Alemanya at Kasaysayan ay isang usbong. Makatutulong ka sa Wikipedia sa pagpapalawig nito.",
    ] },
]

[articles.pt]
text = "Frederico I (dezembro de 1122 – 10 de junho de 1190), também conhecido como Frederico Barbarossa (ou \"Barba Ruiva\"), foi o Imperador Romano-Germânico de 1155 até sua morte, em 1190. Ele foi eleito Rei da Alemanha em Frankfurt em 4 de março de 1152 e coroado em Aachen cinco dias depois."
title = "Frederico I do Sacro Império Romano-Germânico"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Frederico_I_do_Sacro_Imp%C3%A9rio_Romano-Germ%C3%A2nico"
intro = [
  "Frederico I (dezembro de 1122 – 10 de junho de 1190), também conhecido como Frederico Barbarossa (ou \"Barba Ruiva\"), foi o Imperador Romano-Germânico de 1155 até sua morte, em 1190. Ele foi eleito Rei da Alemanha em Frankfurt em 4 de março de 1152 e coroado em Aachen cinco dias depois. Ele se tornou o Rei da Itália em 1155 e foi formalmente coroado como o monarca supremo do Império Romano-Germânico pelo Papa Adriano IV em 18 de junho de 1155. Dois anos mais tarde, o termo sacrum (\"sagrado\", ou \"sacro\") foi utilizado pela primeira vez para se referir ao império. Ele foi também coroado Rei da Borgonha, na cidade de Arles, em 30 de junho de 1178. Frederico recebeu o nome de Barbarossa das cidades italianas que tentou governar: Barbarossa significa \"Barba Ruiva\" em italiano; em alemão ele era conhecido como Kaiser Rotbart (\"Imperador Barba Ruiva\").",
  "Antes da sua eleição para imperador, Frederico havia herdado o comando do Ducado da Suábia (1147–1152, como Frederico III). Ele era o filho do Duque Frederico II da Dinastia de Hohenstaufen e da duquesa Judite, filha de Henrique IX da Baviera, da rival Casa de Welf. Frederico I assim descendia das duas mais poderosas famílias nobres da Alemanha, fazendo dele a escolha mais óbvia para ser apontado como imperador pelos príncipes-eleitores.",
  "Muitos historiadores o consideram como o maior imperador medieval do Sacro Império Romano-Germânico. Ele combinava qualidades que quase o tornavam um super-humano para os seus contemporâneos: sua longevidade, sua ambição, suas habilidades organizacionais, sua capacidade no campo de batalha e sua perspicácia política. Entre suas contribuições para a sociedade e cultura da Europa Central, estava o restabelecimento do Corpus Juris Civilis, ou o estado de direito Romano, no império, o que contrabalanceou o poder papal que dominava as nações alemãs desde a conclusão das Controvérsia das Investiduras.",
]
sections = [
  { "title" = "Vida e reinado", "paragraphs" = [
      "Frederico nasceu em meados de dezembro de 1122. Em 1147 ele se tornou duque da região de Suábia (Herzog von Schwaben) no sul da Alemanha, e logo depois fez sua primeira viagem para o leste, acompanhado pelo seu tio, o rei germânico Conrado III, na Segunda Cruzada. A expedição se provou um desastre, mas Frederico conseguiu se distinguir e ganhou a confiança do rei. Quando Conrado morreu, em fevereiro de 1152, apenas Frederico e o príncipe-bispo de Bamberg estavam no seu leito de morte. Ambos afirmaram posteriormente que Conrado, em controle total de suas capacidades mentais, deu a insígnia real para Frederico e o indicou para sucede-lo como rei, em detrimento do seu próprio filho de seis anos, o futuro duque Frederico IV da Suábia. Frederico rapidamente começou a se mover para garantir sua coroa e em Frankfurt, a 4 de março de 1152, ele foi formalmente apontado como rei germânico pelos príncipes eleitores do reino. Frederico foi então coroado Rei dos Romanos em Aachen em 9 de março de 1152. Seu pai era membro da família Hohenstaufen e sua mãe era da família Welf, consideradas as duas mais poderosas casas da Alemanha. Os Hohenstaufens eram conhecidos como Gibelinos, que é derivado do nome italianizado do castelo de Waiblingen, com seu assento em Suábia; os Welfs, em uma italianização similar, eram chamados de Guelfos.",
      "Os reinados de Henrique IV e Henrique V deixaram o Império Romano-Germânico em um estado lamentável, com o poder minguando sob o peso da Questão das Investiduras. Por um quarto de século após a morte de Henrique V em 1125, a monarquia alemã era mais um título nominal, sem nenhum poder real. O rei era escolhido pelos príncipes, mas este não recebia qualquer apoio fora do seu próprio ducado e ele era impedido de realizar qualquer autoridade real ou exercer uma posição de liderança concreta no reino. O título real era então passado de uma família para outra para impedir qualquer interesse dinástico na coroa alemã. Quando Frederico I de Hohenstaufen foi escolhido para ser rei em 1152, o poder real estava suspenso em efetivo por mais de vinte e cinco anos e estava em declínio havia mais de oitenta anos. A única fonte de riquezas abundante disponível para conquista eram as prósperas cidades do norte da Itália, que estavam ainda em controle nominal do rei alemão (sendo, na prática, completamente independentes). A linhagem saliana havia perecido com a morte do rei Henrique V em 1125. Os príncipes alemães se recusavam a dar a coroa ao seu sobrinho, o duque da Suábia, por medo de que ele pudesse tentar restabelecer o poder imperial. Ao invés disso, escolheram Lotário III (1125–1137) para governar, mas este se viu engolido numa grande disputa contra os Hohenstaufens, que havia se casado com um Welfs. Um dos Hohenstaufens acabou conquistando o trono alemão e se coroou Conrado III da Germânia (1137–1152). Quando Frederico Barbarossa sucedeu seu tio, em 1152, parecia haver excelentes perspectivas para acabar com as disputas, já que ele era um Welf por parte de mãe. O Duque da Saxônia, um Welf, Henrique, o Leão, não seria apaziguado tão facilmente, contudo, permanecendo um implacável…",
      "A Alemanha que Frederico tentava unificar era na verdade uma miscelânea de mais de 1 600 estados individuais, cada um governado por seu próprio príncipe. Alguns destes, como na Baviera e na Saxônia, eram bem grandes, mas a maioria eram pequenos feudos, sendo apenas pontos no mapa. Os títulos dados ao rei germânico era \"César\", \"Augusto\" e \"Imperador dos Romanos\". Quando Frederico assumiu todos estes títulos, eles eram nada mais do que peças de propaganda com pouco significado real. Frederico era um líder pragmático que lidou com os diversos príncipes alemães baseado em interesses comuns. Ao contrário do rei Henrique II da Inglaterra, Frederico não tentou acabar com o sistema feudal, sendo que na verdade ele tentou restaura-lo, apesar disso estar além de suas habilidades. Os grandes nomes da guerra civil na Germânia eram o Papa, o imperador, os Gibelinos e os Guelfos, mas, na prática, nenhum destes acabou emergindo como vitorioso.",
    ] },
  { "title" = "Lenda", "paragraphs" = [
      "Frederico é o tema de muitas lendas, assim como outras figuras lendárias da Idade Média, como Artur ou Brân, o Abençoado. As lendas dizem que ele não morreu, mas está apenas dormindo com seus cavaleiros em uma caverna nas montanhas Kyffhäuser em Turíngia ou em Untersberg na Baviera, e quando os corvos deixarem de voar ao redor da montanha ele levantará e restaurará a Alemanha a sua antiga glória. De acordo com essa história, sua barba ruiva cresceu através da mesa na qual ele se senta. Seus olhos estão meio abertos enquanto dorme, mas agora e sempre ele ergue suas mãos e manda um garoto para ver se os corvos já pararam de voar. Para ganhar apoio no nascimento do Império Alemão no século XIX, foi construído o Monumento de Kyffhäuser, onde foi declarado que o imperador Guilherme I da Alemanha era a reencarnação de Frederico; sua dedicação de 1896 aconteceu no dia 18 de junho, o mesmo dia da coroação de Frederico Barbarossa.",
      "Na Europa medieval, se tornou muito comum nas fábulas alemãs exagerar os feitos dos seus líderes antigos como, por exemplo, Frederico Barbarossa e Frederico II, se tornando a personificação do ideal \"bom rei\".",
      "O tio de Barbarossa, Otto, bispo de Frisinga, escreveu a sua biografia intitulada Os Feitos de Frederick Barbarosa, o que é considerado um relato histórico bem preciso da vida do imperador. O outro grande trabalho de Otto, As Duas Cidades, foi uma exposição dos trabalhos de Agostinho de Hipona de título similar. Contudo, o trabalho de Agostinho contrastava com o de Oto em tom, que retratava o período do reinado de Frederico como uma era gloriosa da autoridade imperial.",
    ] },
  { "title" = "Frederico e o código Justiniano", "paragraphs" = [
      "As cidades do norte da Itália foram ficando cada vez mais ricas devido ao comércio, o que levou ao retorno da discussão a respeito da reintrodução do Código Justiniano, um sistema judicial latino que foi extinto alguns séculos antes. Estudiosos legais renovaram sua aplicação. Especula-se que o Papa Gregório VII pessoalmente encorajou o estado de direito justiniano e mandou fazer uma cópia do código. O historiador Norman Cantor descreveu o Código Justiniano como \"o maior código legal já criado\". Ele prevê a lei do Estado como um reflexo da lei moral natural natural (como era visto pelos homens no sistema justiniano), o princípio de racionalidade no universo. No período em que Frederico ascendeu ao trono, este sistema legal já estava bem estabelecido em ambos os lados dos Alpes. Ele foi o primeiro a utilizar a disponibilidade da nova classe de advogados. A lei civil permitiu que Frederico usasse esses advogados para administrar seu reino de uma maneira lógica e consistente. Também forneceu uma a estrutura para legitimar sua reivindicação para governar a Alemanha e o norte da Itália. Nos tempos antigos de Henrique V e Henrique VI, a reivindicação do direito divino dos reis havia sido severamente minado pela Questão das Investiduras. A Igreja Católica venceu a discussão na cabeça dos homens comuns. Não havia direito divino para o rei alemão também controlar a igreja ao nomear os bispos e os papas. A instituição do Código Justiniano foi usada, talvez sem escrúpulos, por Frederico para abrir caminho para sua alegação ao poder divino.",
      "Na Alemanha, Frederico era um político pragmático, pegando o que podia e deixando o resto. Na Itália, ele tendeu a ser um romântico reacionário, revelando no antiquário espírito da época, exemplificado no ressurgimento dos estudos clássicos e da lei romana. Foi através do uso da restauração do código justiniano que Frederico começou a se ver como o novo Imperador Romano. A lei romana dava um propósito racional para a existência de Frederico e suas ambições imperiais. Era um contrapeso as reivindicações da Igreja de ter toda a autoridade por terem a \"revelação divina\". A Igreja se opunha a Frederico por razões ideológicas, não o menor dos quais foi a natureza humanista encontrada no renascimento do antigo sistema legal romano. Quando Pepino, o Breve buscou se tornar o rei dos francos no século VIII, a Igreja precisava de proteção militar, então Pepino achou conveniente se aliar ao papado. Frederico, contudo, desejava não dar atenção ao papa e reivindicou a velha coroa romana pois ele se espelhava nos grandes imperadores da era pré-cristã. O Papa Adriano IV naturalmente se opunha a esta visão e fez uma grande propaganda para barrar as ambições imperiais de Barbarossa. Em última análise, ele foi bem-sucedido nisso.",
    ] },
  { "title" = "Líder carismático", "paragraphs" = [
      "Historiadores comparam Frederico a Henrique II da Inglaterra. Ambos eram considerados como os grandes e carismáticos líderes do seu tempo. Ambos possuíam uma combinação rara de qualidades que os destacavam entre os seus contemporâneos: longevidade, grande ambição, habilidades organizacionais e destreza no campo de batalha. Ambos eram considerados bonitos e muito corteses, sem parecer afeminado ou afetado. Ambos chegaram ao poder no começo da vida adulta. Ambos aprendiam rápido, sem serem considerados intelectuais impraticáveis, sendo bastante pragmáticos. Ambos se viram no controle de novas instituições legais que foram usadas criativamente para governar. Tanto Henrique quanto Frederico eram vistos como suficiente e formalmente devotos aos ensinamentos da Igreja Católica, sem serem movidos pelo extremo da espiritualidade visto nos grandes santos do século XII. Em fazer decisões finais, cada um baseada apenas em seu julgamento, e ambos estavam interessados em conquistar o máximo de poderes que pudessem.",
      "Nesta visão de Frederico, seu tio, Otto de Frisinga, escreveu sobre o reinado do sobrinho no livro Gesta Friderici I imperatoris (\"Feitos do Imperador Frederico\"). Otto morreu antes de terminar seus dois livros, deixando-os com Rahewin, seu prefeito. O texto está em lugares fortemente dependente de precedente clássico. Por exemplo, a descrição física que Rahewin faz de Frederico reproduz, palavra por palavra (exceto pela barba e cabelo) a descrição de outro monarca escrito oitocentos anos antes por Sidônio Apolinário:",
      "Seu caráter é tal que nem mesmo aqueles invejosos de seu poder podem menosprezar seu louvor. Sua pessoa é bem proporcional. Ele é quase um homem alto, mas maior e mais nobre do que o homem normal. Seu cabelo dourado, ondulado um pouco acima de sua testa […] Seus olhos são afiados e penetrantes, sua barba ruiva [barba subrufa], seus delicados lábios […] Sua face é brilhante e alegre. Seus dentes são perfeitos e brancos em cor […] Modéstia e não raiva o deixava vermelho frequentemente. Seus ombros são largos e seu corpo é musculoso […]",
