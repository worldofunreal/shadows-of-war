[articles.en]
text = "Sargon founded the dynasty of Akkad in late third-millennium BCE Mesopotamia. His royal inscriptions recount the defeat of Lugalzagesi of Uruk and the destruction of the walls of cities including Uruk and Ur. The accounts were written to celebrate victory. Some survive in copies made by scribes long after his reign. The inscriptions also describe people of Akkad taking up governorships in conquered lands. Archival records help historians see how the new royal administration worked alongside practices that continued locally."
title = "Sargon of Akkad"
lang = "en"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon founded the dynasty of Akkad in late third-millennium BCE Mesopotamia. His royal inscriptions recount the defeat of Lugalzagesi of Uruk and the destruction of the walls of cities including Uruk and Ur. The accounts were written to celebrate victory. Some survive in copies made by scribes long after his reign. The inscriptions also describe people of Akkad taking up governorships in conquered lands. Archival records help historians see how the new royal administration worked alongside practices that continued locally."]
sections = [{ title = "Governing the conquered cities", paragraphs = ["The king based his power at Akkad, whose precise location has not been established. One inscription depicts the city as a center to which ships from Dilmun, Magan and Meluhha could sail. It also claims that thousands of men ate daily in the king’s presence. Such claims express the reach and resources the ruler wanted to project. His sons Rimush and Manishtushu carried on the dynasty, while the order and dates of several of Sargon’s campaigns remain uncertain."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.es]
text = "Sargón fundó la dinastía de Acad en la Mesopotamia de finales del tercer milenio a. C. Sus inscripciones regias relatan la derrota de Lugalzagesi de Uruk y la demolición de las murallas de ciudades como Uruk y Ur. Los textos celebran las victorias, y algunos se conocen por copias que escribas realizaron mucho después de su reinado. Las inscripciones también mencionan a gentes de Acad que ocuparon cargos de gobierno en los territorios conquistados. Los documentos administrativos permiten estudiar qué prácticas locales continuaron bajo el nuevo poder."
title = "Sargón de Acad"
lang = "es"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargón fundó la dinastía de Acad en la Mesopotamia de finales del tercer milenio a. C. Sus inscripciones regias relatan la derrota de Lugalzagesi de Uruk y la demolición de las murallas de ciudades como Uruk y Ur. Los textos celebran las victorias, y algunos se conocen por copias que escribas realizaron mucho después de su reinado. Las inscripciones también mencionan a gentes de Acad que ocuparon cargos de gobierno en los territorios conquistados. Los documentos administrativos permiten estudiar qué prácticas locales continuaron bajo el nuevo poder."]
sections = [{ title = "El gobierno de las ciudades conquistadas", paragraphs = ["Sargón estableció su centro de poder en Acad, cuya ubicación exacta sigue sin confirmarse. Una inscripción presenta a la ciudad como destino de barcos procedentes de Dilmun, Magán y Meluhha. También afirma que miles de hombres comían a diario ante el rey. Estas afirmaciones muestran la capacidad de movilizar recursos que el soberano quería proyectar. Sus hijos Rimush y Manishtushu continuaron la dinastía. El orden y las fechas de varias de las campañas de Sargón siguen siendo inciertos."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.fr]
text = "Sargon fonda la dynastie d’Akkad en Mésopotamie vers la fin du troisième millénaire av. J.-C. Ses inscriptions royales célèbrent la défaite de Lugalzagesi d’Uruk et la démolition des remparts de villes comme Uruk et Ur. Certaines ne sont connues que par des copies réalisées longtemps après son règne. Les inscriptions mentionnent aussi des gens d’Akkad nommés à des postes de gouverneur dans les territoires conquis. Les archives administratives permettent de suivre les pratiques locales qui subsistèrent sous le nouveau pouvoir."
title = "Sargon d’Akkad"
lang = "fr"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon fonda la dynastie d’Akkad en Mésopotamie vers la fin du troisième millénaire av. J.-C. Ses inscriptions royales célèbrent la défaite de Lugalzagesi d’Uruk et la démolition des remparts de villes comme Uruk et Ur. Certaines ne sont connues que par des copies réalisées longtemps après son règne. Les inscriptions mentionnent aussi des gens d’Akkad nommés à des postes de gouverneur dans les territoires conquis. Les archives administratives permettent de suivre les pratiques locales qui subsistèrent sous le nouveau pouvoir."]
sections = [{ title = "Gouverner les villes conquises", paragraphs = ["Le siège de son pouvoir était Akkad, dont le site exact reste inconnu. Une inscription présente la ville comme la destination de navires de Dilmun, de Magan et de Meluhha. Elle affirme aussi que des milliers d’hommes prenaient chaque jour leur repas en présence du roi. Ces affirmations traduisent la puissance et les ressources que le souverain souhaitait afficher. Ses fils Rimush et Manishtushu poursuivirent la dynastie. La chronologie de plusieurs de ses campagnes reste incertaine."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.de]
text = "Sargon gründete im späten dritten Jahrtausend v. Chr. in Mesopotamien die Dynastie von Akkad. Seine Königsinschriften berichten von der Niederlage Lugalzagesis von Uruk und dem Abriss der Mauern von Städten wie Uruk und Ur. Die Texte dienten der Verherrlichung der Siege. Einige sind nur durch Abschriften aus späterer Zeit erhalten. Auch erwähnen die Inschriften Leute aus Akkad, die in eroberten Gebieten Statthalterämter übernahmen. Aus Verwaltungsurkunden lässt sich erkennen, welche örtlichen Praktiken unter der neuen Herrschaft weiterbestanden."
title = "Sargon von Akkad"
lang = "de"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon gründete im späten dritten Jahrtausend v. Chr. in Mesopotamien die Dynastie von Akkad. Seine Königsinschriften berichten von der Niederlage Lugalzagesis von Uruk und dem Abriss der Mauern von Städten wie Uruk und Ur. Die Texte dienten der Verherrlichung der Siege. Einige sind nur durch Abschriften aus späterer Zeit erhalten. Auch erwähnen die Inschriften Leute aus Akkad, die in eroberten Gebieten Statthalterämter übernahmen. Aus Verwaltungsurkunden lässt sich erkennen, welche örtlichen Praktiken unter der neuen Herrschaft weiterbestanden."]
sections = [{ title = "Die Verwaltung der eroberten Städte", paragraphs = ["Das Zentrum von Sargons Macht war Akkad, dessen genaue Lage nicht geklärt ist. Eine Inschrift nennt Schiffe aus Dilmun, Magan und Meluhha, die die Stadt erreichten. Sie behauptet auch, dass täglich Tausende Männer in Gegenwart des Königs aßen. Darin zeigt sich, welche Reichweite und Versorgungskraft der Herrscher für sich beanspruchte. Seine Söhne Rimuš und Maništušu führten die Dynastie fort. Reihenfolge und Daten mehrerer Feldzüge bleiben unsicher."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.it]
text = "Sargon fondò la dinastia di Akkad nella Mesopotamia del tardo terzo millennio a.C. Le iscrizioni regie celebrano la sconfitta di Lugalzagesi di Uruk e l’abbattimento delle mura di città come Uruk e Ur. Alcuni testi sono noti da copie realizzate da scribi molto dopo il suo regno. Le iscrizioni menzionano anche persone di Akkad insediate come governatori nelle terre conquistate. I documenti amministrativi aiutano a ricostruire quali pratiche locali continuarono sotto il nuovo potere."
title = "Sargon di Akkad"
lang = "it"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon fondò la dinastia di Akkad nella Mesopotamia del tardo terzo millennio a.C. Le iscrizioni regie celebrano la sconfitta di Lugalzagesi di Uruk e l’abbattimento delle mura di città come Uruk e Ur. Alcuni testi sono noti da copie realizzate da scribi molto dopo il suo regno. Le iscrizioni menzionano anche persone di Akkad insediate come governatori nelle terre conquistate. I documenti amministrativi aiutano a ricostruire quali pratiche locali continuarono sotto il nuovo potere."]
sections = [{ title = "Governare le città conquistate", paragraphs = ["Il centro del regno era Akkad, la cui posizione precisa rimane sconosciuta. Un’iscrizione presenta la città come meta di navi provenienti da Dilmun, Magan e Meluhha. Afferma inoltre che migliaia di uomini mangiavano ogni giorno alla presenza del re. Queste affermazioni illustrano le risorse e il potere che il sovrano intendeva mostrare. I figli Rimush e Manishtushu continuarono la dinastia. L’ordine e le date di varie campagne di Sargon restano incerti."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.tr]
text = "Sargon, MÖ üçüncü binyılın sonlarına doğru Mezopotamya’da Akad hanedanını kurdu. Kraliyet yazıtları, Uruklu Lugalzagesi’nin yenilgisini ve Uruk ile Ur gibi kentlerin surlarının yıkılmasını anlatır. Zaferleri yücelten bu metinlerin bir bölümü sonraki çağların kâtiplerinin kopyalarından bilinir. Yazıtlarda fethedilen topraklarda valilik görevleri üstlenen Akadlılardan da söz edilir. Yönetim belgeleri, yeni iktidar altında yerel uygulamaların hangilerinin sürdüğünü anlamamıza yardım eder."
title = "Akadlı Sargon"
lang = "tr"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon, MÖ üçüncü binyılın sonlarına doğru Mezopotamya’da Akad hanedanını kurdu. Kraliyet yazıtları, Uruklu Lugalzagesi’nin yenilgisini ve Uruk ile Ur gibi kentlerin surlarının yıkılmasını anlatır. Zaferleri yücelten bu metinlerin bir bölümü sonraki çağların kâtiplerinin kopyalarından bilinir. Yazıtlarda fethedilen topraklarda valilik görevleri üstlenen Akadlılardan da söz edilir. Yönetim belgeleri, yeni iktidar altında yerel uygulamaların hangilerinin sürdüğünü anlamamıza yardım eder."]
sections = [{ title = "Ele geçirilen şehirlerin yönetimi", paragraphs = ["Sargon’un iktidar merkezi Akad’ın kesin konumu belirlenememiştir. Bir yazıt, Dilmun, Magan ve Meluhha’dan gelen gemilerin kente ulaştığını söyler. Aynı metin, kralın huzurunda her gün binlerce adamın yemek yediğini öne sürer. Bu iddialar hükümdarın göstermek istediği güç ve kaynakları yansıtır. Oğulları Rimuş ve Maniştuşu hanedanı sürdürdü. Sargon’un bazı seferlerinin sırası ve tarihleri belirsizdir."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.zh-CN]
text = "萨尔贡在公元前三千纪末期的美索不达米亚建立了阿卡德王朝。以他名义留下的王室铭文叙述了击败乌鲁克国王卢加尔扎吉西的经过，还称阿卡德军队拆毁了乌鲁克和乌尔等城的城墙。铭文将俘获卢加尔扎吉西与恩利尔的神庙联系起来，表现王权怎样为胜利赋予宗教意义。这些叙述由王室用来纪念胜利，有些篇章通过比萨尔贡更晚的抄本流传。铭文也提到来自阿卡德的人在征服地区担任治理职务。学者将这些宣示与地方行政记录对照，研究原来的城邦被纳入王国后，地方治理究竟发生了哪些变化。新的官员进入地方行政体系，一些既有制度和日常事务仍然延续。各项变化的程度需要结合不同城市留下的文书判断。例如，阿达卜的档案记有地方官员前往阿卡德的活动，使都城和地方的联系有迹可循。"
title = "阿卡德的萨尔贡"
lang = "zh-CN"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["萨尔贡在公元前三千纪末期的美索不达米亚建立了阿卡德王朝。以他名义留下的王室铭文叙述了击败乌鲁克国王卢加尔扎吉西的经过，还称阿卡德军队拆毁了乌鲁克和乌尔等城的城墙。铭文将俘获卢加尔扎吉西与恩利尔的神庙联系起来，表现王权怎样为胜利赋予宗教意义。这些叙述由王室用来纪念胜利，有些篇章通过比萨尔贡更晚的抄本流传。铭文也提到来自阿卡德的人在征服地区担任治理职务。学者将这些宣示与地方行政记录对照，研究原来的城邦被纳入王国后，地方治理究竟发生了哪些变化。新的官员进入地方行政体系，一些既有制度和日常事务仍然延续。各项变化的程度需要结合不同城市留下的文书判断。例如，阿达卜的档案记有地方官员前往阿卡德的活动，使都城和地方的联系有迹可循。"]
sections = [{ title = "治理征服的城市", paragraphs = ["萨尔贡以阿卡德作为权力中心，但这座城的确切遗址仍未确认。研究者曾根据文献推测它位于底格里斯河沿岸，不同考证提出的位置有所区别，因此地图上的点只能代表大致区域。另有铭文称，来自迪尔蒙、马干和美鲁哈的船只停靠在阿卡德。这份文字还宣称每天有数千人在国王面前用餐。这样的叙述表现了王室想要展示的供给能力、远程联系和权力规模，不能直接当作独立核实的人员清单。当地档案则有助于了解中央与地方之间的往来，以及阿卡德语进入官方管理的过程。王室铭文、地方文件和后来的王表各自回答不同的问题。铭文保存了战胜者希望留下的叙述，行政资料记下了日常管理，王表则从后来时代的视角排列君主和王朝。萨尔贡之后，他的儿子里穆什和马尼什图苏延续了王朝。即使几场重要胜仗有铭文可考，也很难给所有征战排出一个确切的时间顺序。关于国王早年生活的故事同样需要与他在位时的记载分开读。阿卡德治理征服地的方式，只有把不同种类的证据放在一起才能逐步重建。"] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ja]
text = "サルゴンは紀元前三千年紀の後半にメソポタミアでアッカド王朝を開いた。彼の名で刻まれた王碑文には、ウルクのルガルザゲシを破り、ウルクやウルなどの都市の城壁を取り壊したと記されている。捕らえたルガルザゲシをエンリルの神殿の門まで連れていったという叙述もあり、勝利が宗教的な権威と結びつけられたことが分かる。これらの文章は王の勝利を記念するためのもので、後世の書記が写した形で伝わるものもある。碑文には、征服地でアッカドの人々が統治を任されたことも記される。地方に残る行政文書を合わせて読むと、都市が王国に組み込まれても従来の実務が一部続いたことが見えてくる。新しい王権が各都市にどのように関与したかは、都市ごとの資料から確かめる必要がある。アダブの文書には、地方の統治者がアッカドへ出向いた記録もある。"
title = "アッカドのサルゴン"
lang = "ja"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["サルゴンは紀元前三千年紀の後半にメソポタミアでアッカド王朝を開いた。彼の名で刻まれた王碑文には、ウルクのルガルザゲシを破り、ウルクやウルなどの都市の城壁を取り壊したと記されている。捕らえたルガルザゲシをエンリルの神殿の門まで連れていったという叙述もあり、勝利が宗教的な権威と結びつけられたことが分かる。これらの文章は王の勝利を記念するためのもので、後世の書記が写した形で伝わるものもある。碑文には、征服地でアッカドの人々が統治を任されたことも記される。地方に残る行政文書を合わせて読むと、都市が王国に組み込まれても従来の実務が一部続いたことが見えてくる。新しい王権が各都市にどのように関与したかは、都市ごとの資料から確かめる必要がある。アダブの文書には、地方の統治者がアッカドへ出向いた記録もある。"]
sections = [{ title = "征服した都市を治める", paragraphs = ["権力の中心となったアッカドの正確な所在地は分かっていない。ティグリス川周辺の複数の候補地が文献から提案されてきた。一つの碑文はディルムン、マガン、メルッハから来た船がアッカドの波止場に着いたと伝える。同じ碑文は毎日何千人もの人が王の前で食事をしたとも述べる。この数字は、王室が人員や食料を集める力をどのように示したかったかを知る手がかりである。王の文章と地方の行政文書は、同じ支配を異なる視点から伝えている。前者は勝利や王の権威を強調し、後者は日常の行政の仕組みや現地の慣行について教えてくれる。息子のリムシュとマニシュトゥシュが王朝を継いだが、サルゴン自身の遠征の順序や年代には定まらない点がある。戦勝碑文は重要な史料だが、出来事を年代順に並べた記録ではない。後代の王名表や各地の記録を照らし合わせて初めて、征服の時期や統治の広がりを検討できる。"] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ko]
text = "사르곤은 기원전 3000년대 후반 메소포타미아에 아카드 왕조를 세웠다. 그의 이름으로 새긴 왕실 비문은 우루크의 루갈자게시를 물리치고 우루크와 우르 같은 도시의 성벽을 허물었다고 기록한다. 루갈자게시를 사로잡아 엔릴 신전의 문으로 끌고 갔다는 기록도 있다. 이 글들은 왕의 승리를 기념하려고 만들어졌으며, 일부는 후대의 서기관들이 만든 필사본으로 전해진다. 비문은 아카드 출신 인물들이 정복지에서 통치자의 직책을 맡았다고도 말한다. 지방에 남아 있는 행정 문서와 함께 보면 도시가 왕국에 편입된 뒤에도 기존의 일상 행정이 일부 이어졌음을 알 수 있다."
title = "아카드의 사르곤"
lang = "ko"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["사르곤은 기원전 3000년대 후반 메소포타미아에 아카드 왕조를 세웠다. 그의 이름으로 새긴 왕실 비문은 우루크의 루갈자게시를 물리치고 우루크와 우르 같은 도시의 성벽을 허물었다고 기록한다. 루갈자게시를 사로잡아 엔릴 신전의 문으로 끌고 갔다는 기록도 있다. 이 글들은 왕의 승리를 기념하려고 만들어졌으며, 일부는 후대의 서기관들이 만든 필사본으로 전해진다. 비문은 아카드 출신 인물들이 정복지에서 통치자의 직책을 맡았다고도 말한다. 지방에 남아 있는 행정 문서와 함께 보면 도시가 왕국에 편입된 뒤에도 기존의 일상 행정이 일부 이어졌음을 알 수 있다."]
sections = [{ title = "정복한 도시를 다스리다", paragraphs = ["권력의 중심지였던 아카드의 정확한 위치는 밝혀지지 않았다. 학자들은 문헌을 근거로 티그리스강 주변에서 여러 후보지를 제시해 왔다. 한 비문은 딜문과 마간, 멜루하의 배가 아카드 부두에 닿았다고 전한다. 같은 비문에는 매일 수천 명이 왕 앞에서 식사했다는 주장도 나온다. 이 수치는 왕실이 얼마나 많은 사람과 물자를 모을 수 있는지 드러내려 한 표현으로 읽을 수 있다. 지역 행정 자료는 왕실의 주장과 다른 시각에서 제국을 보여 준다. 예를 들어 정복 뒤에도 지역의 관행이 남아 있는 한편, 중앙과 지방의 행정 관계는 달라졌다. 사르곤의 아들 리무시와 마니슈투슈는 왕조를 이어 갔다. 사르곤의 승리를 전하는 비문이 남아 있어도 여러 원정의 순서와 정확한 날짜는 아직 논쟁의 대상이다. 왕실 문헌과 지방 기록, 후대의 왕 목록을 비교해야 정복과 통치가 어떻게 진행됐는지 살필 수 있다."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ar]
text = "أسس سرجون سلالة أكد في بلاد الرافدين في أواخر الألفية الثالثة قبل الميلاد. وتروي نقوشه الملكية هزيمة لوغال زاغيزي ملك أوروك وهدم أسوار مدن مثل أوروك وأور. وتمجد النصوص انتصاراته، ويعرف بعضها من نسخ نقلها كتبة بعد عهده بمدة طويلة. وتذكر النقوش أيضا أشخاصا من أكد تولوا مناصب حكام في الأراضي المفتوحة. وتساعد الوثائق الإدارية على معرفة الممارسات المحلية التي استمرت في ظل الحكم الجديد."
title = "سرجون الأكدي"
lang = "ar"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["أسس سرجون سلالة أكد في بلاد الرافدين في أواخر الألفية الثالثة قبل الميلاد. وتروي نقوشه الملكية هزيمة لوغال زاغيزي ملك أوروك وهدم أسوار مدن مثل أوروك وأور. وتمجد النصوص انتصاراته، ويعرف بعضها من نسخ نقلها كتبة بعد عهده بمدة طويلة. وتذكر النقوش أيضا أشخاصا من أكد تولوا مناصب حكام في الأراضي المفتوحة. وتساعد الوثائق الإدارية على معرفة الممارسات المحلية التي استمرت في ظل الحكم الجديد."]
sections = [{ title = "حكم المدن المفتوحة", paragraphs = ["اتخذ سرجون أكد مركزا لسلطته، ولم يتحدد موقع المدينة بدقة. ويذكر أحد النقوش وصول سفن من دلمون ومجان وملوخا إليها. ويدعي أيضا أن آلاف الرجال كانوا يأكلون يوميا في حضرة الملك. وتعكس هذه الأقوال ما أراد الحاكم إظهاره من اتساع نفوذه وقدرته على حشد الموارد. وواصل ابناه ريموش ومانيشتوشو حكم السلالة. ولا يزال ترتيب عدد من حملاته وتواريخها غير مؤكدين."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ru]
text = "Саргон основал династию Аккада в Месопотамии в конце третьего тысячелетия до н. э. Царские надписи повествуют о поражении Лугальзагеси из Урука и сносе стен таких городов, как Урук и Ур. Эти тексты прославляли победы, и некоторые известны по спискам, сделанным писцами намного позже. Надписи также упоминают выходцев из Аккада, получивших должности наместников в завоёванных землях. Хозяйственные документы показывают, какие местные порядки сохранились при новой власти."
title = "Саргон Аккадский"
lang = "ru"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Саргон основал династию Аккада в Месопотамии в конце третьего тысячелетия до н. э. Царские надписи повествуют о поражении Лугальзагеси из Урука и сносе стен таких городов, как Урук и Ур. Эти тексты прославляли победы, и некоторые известны по спискам, сделанным писцами намного позже. Надписи также упоминают выходцев из Аккада, получивших должности наместников в завоёванных землях. Хозяйственные документы показывают, какие местные порядки сохранились при новой власти."]
sections = [{ title = "Управление покорёнными городами", paragraphs = ["Столицей Саргона был Аккад, точное местоположение которого остаётся неизвестным. Одна надпись говорит о кораблях из Дильмуна, Магана и Мелуххи, прибывавших в город. Там же утверждается, что тысячи людей ежедневно ели в присутствии царя. Эти заявления передают представление о ресурсах и власти, которое правитель стремился внушить. Его сыновья Римуш и Маништушу продолжили династию. Порядок и даты нескольких походов Саргона остаются неясными."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.vi]
text = "Sargon lập vương triều Akkad ở Lưỡng Hà vào cuối thiên niên kỷ thứ ba TCN. Các bia ký hoàng gia kể về chiến thắng trước Lugalzagesi xứ Uruk và việc phá thành lũy của những thành phố như Uruk và Ur. Văn bản dùng để ca ngợi chiến thắng, một số còn lại qua bản sao của những người chép sử nhiều đời sau. Bia ký cũng nhắc tới người Akkad được đưa vào các chức vụ cai quản ở vùng bị chinh phục. Hồ sơ hành chính cho thấy một số tập quán địa phương vẫn tồn tại dưới chính quyền mới."
title = "Sargon xứ Akkad"
lang = "vi"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon lập vương triều Akkad ở Lưỡng Hà vào cuối thiên niên kỷ thứ ba TCN. Các bia ký hoàng gia kể về chiến thắng trước Lugalzagesi xứ Uruk và việc phá thành lũy của những thành phố như Uruk và Ur. Văn bản dùng để ca ngợi chiến thắng, một số còn lại qua bản sao của những người chép sử nhiều đời sau. Bia ký cũng nhắc tới người Akkad được đưa vào các chức vụ cai quản ở vùng bị chinh phục. Hồ sơ hành chính cho thấy một số tập quán địa phương vẫn tồn tại dưới chính quyền mới."]
sections = [{ title = "Cai quản các thành phố bị chinh phục", paragraphs = ["Trung tâm quyền lực của ông là Akkad, thành phố chưa xác định được vị trí chính xác. Một bia ký kể rằng tàu từ Dilmun, Magan và Meluhha đến thành phố. Văn bản còn tuyên bố hàng nghìn người ăn mỗi ngày trước mặt vua. Những tuyên bố đó thể hiện quyền lực và nguồn lực mà nhà vua muốn phô bày. Hai con trai Rimush và Manishtushu tiếp nối vương triều. Trình tự và niên đại của nhiều chiến dịch của Sargon vẫn chưa chắc chắn."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.id]
text = "Sargon mendirikan dinasti Akkad di Mesopotamia pada akhir milenium ketiga SM. Prasasti kerajaan menceritakan kekalahan Lugalzagesi dari Uruk dan pembongkaran tembok beberapa kota, termasuk Uruk dan Ur. Teks-teks itu merayakan kemenangan. Sebagian bertahan melalui salinan yang dibuat para juru tulis lama setelah pemerintahannya. Prasasti juga menyebut orang-orang dari Akkad yang menduduki jabatan gubernur di wilayah taklukan. Dokumen administratif membantu menjelaskan praktik lokal yang tetap berjalan di bawah pemerintahan baru."
title = "Sargon dari Akkad"
lang = "id"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargon mendirikan dinasti Akkad di Mesopotamia pada akhir milenium ketiga SM. Prasasti kerajaan menceritakan kekalahan Lugalzagesi dari Uruk dan pembongkaran tembok beberapa kota, termasuk Uruk dan Ur. Teks-teks itu merayakan kemenangan. Sebagian bertahan melalui salinan yang dibuat para juru tulis lama setelah pemerintahannya. Prasasti juga menyebut orang-orang dari Akkad yang menduduki jabatan gubernur di wilayah taklukan. Dokumen administratif membantu menjelaskan praktik lokal yang tetap berjalan di bawah pemerintahan baru."]
sections = [{ title = "Memerintah kota-kota taklukan", paragraphs = ["Pusat kekuasaan Sargon berada di Akkad, yang lokasi pastinya belum diketahui. Sebuah prasasti menyebut kapal dari Dilmun, Magan, dan Meluhha berlabuh di kota itu. Prasasti tersebut juga menyatakan bahwa ribuan orang makan setiap hari di hadapan raja. Pernyataan ini menggambarkan jangkauan dan sumber daya yang hendak ditampilkan sang penguasa. Putranya, Rimush dan Manishtushu, melanjutkan dinasti. Urutan dan tanggal beberapa ekspedisi Sargon masih belum pasti."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.fil]
text = "Itinatag ni Sargon ang dinastiya ng Akkad sa Mesopotamia sa bandang dulo ng ikatlong milenyo BCE. Isinalaysay sa mga inskripsiyon ng hari ang pagkatalo ni Lugalzagesi ng Uruk at ang paggiba sa mga pader ng ilang lungsod, kabilang ang Uruk at Ur. Ginawa ang mga teksto upang ipagdiwang ang mga tagumpay. Ang ilan ay kilala sa mga kopyang ginawa ng mga eskriba pagkaraan ng paghahari niya. Binabanggit din sa mga inskripsiyon ang mga taga-Akkad na naging gobernador sa mga nasakop na lupain. Ipinapakita ng mga tala ng pamahalaan kung aling kaugaliang lokal ang nagpatuloy."
title = "Sargon ng Akkad"
lang = "fil"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Itinatag ni Sargon ang dinastiya ng Akkad sa Mesopotamia sa bandang dulo ng ikatlong milenyo BCE. Isinalaysay sa mga inskripsiyon ng hari ang pagkatalo ni Lugalzagesi ng Uruk at ang paggiba sa mga pader ng ilang lungsod, kabilang ang Uruk at Ur. Ginawa ang mga teksto upang ipagdiwang ang mga tagumpay. Ang ilan ay kilala sa mga kopyang ginawa ng mga eskriba pagkaraan ng paghahari niya. Binabanggit din sa mga inskripsiyon ang mga taga-Akkad na naging gobernador sa mga nasakop na lupain. Ipinapakita ng mga tala ng pamahalaan kung aling kaugaliang lokal ang nagpatuloy."]
sections = [{ title = "Pamamahala sa mga nasakop na lungsod", paragraphs = ["Ang sentro ng kaniyang kapangyarihan ay Akkad, na hindi pa natitiyak ang eksaktong lokasyon. Sa isang inskripsiyon, sinasabing dumaong sa lungsod ang mga barko mula sa Dilmun, Magan at Meluhha. Sinasabi rin nitong libo-libong tao ang kumakain araw-araw sa harap ng hari. Ipinahihiwatig ng mga pahayag kung gaano kalawak ang kapangyarihan at yaman na nais niyang ipakita. Ipinagpatuloy nina Rimush at Manishtushu, ang kaniyang mga anak, ang dinastiya. Hindi tiyak ang petsa at pagkakasunod ng ilang kampanya ni Sargon."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.pt-BR]
text = "Sargão fundou a dinastia de Acádia na Mesopotâmia no fim do terceiro milênio a.C. Suas inscrições reais narram a derrota de Lugalzagesi de Uruk e a derrubada das muralhas de cidades como Uruk e Ur. Os textos celebram as vitórias, e alguns são conhecidos por cópias feitas por escribas muito depois do reinado. As inscrições também mencionam pessoas de Acádia que ocuparam cargos de governo nos territórios conquistados. Os arquivos administrativos ajudam a entender quais práticas locais continuaram sob o novo poder."
title = "Sargão da Acádia"
lang = "pt-BR"
url = "https://cdli.earth/inscriptions/2227268"
shortArticle = true
intro = ["Sargão fundou a dinastia de Acádia na Mesopotâmia no fim do terceiro milênio a.C. Suas inscrições reais narram a derrota de Lugalzagesi de Uruk e a derrubada das muralhas de cidades como Uruk e Ur. Os textos celebram as vitórias, e alguns são conhecidos por cópias feitas por escribas muito depois do reinado. As inscrições também mencionam pessoas de Acádia que ocuparam cargos de governo nos territórios conquistados. Os arquivos administrativos ajudam a entender quais práticas locais continuaram sob o novo poder."]
sections = [{ title = "O governo das cidades conquistadas", paragraphs = ["O centro do poder era a cidade de Acádia, cuja localização exata ainda é incerta. Uma inscrição a apresenta como destino de navios de Dilmun, Magan e Meluhha. Também afirma que milhares de homens comiam todos os dias na presença do rei. As afirmações mostram o alcance e os recursos que o soberano desejava projetar. Seus filhos Rimush e Manishtushu deram continuidade à dinastia. A ordem e as datas de várias campanhas ainda são incertas."] }]
sources = [{ title = "Cuneiform Digital Library Initiative, royal inscriptions of Sargon, RIME 2.01.01", url = "https://cdli.earth/inscriptions/2227268" }, { title = "Ingo Schrakamp, The Kingdom of Akkad: A View from Within, Oxford University Press", url = "https://academic.oup.com/book/37433/chapter-abstract/331534882" }, { title = "Walther Sallaberger and Ingo Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]
