[articles.en]
text = "Gudit, also called Yodit, is remembered in Ethiopian tradition as a queen who turned against Aksum. The History of the Patriarchs of Alexandria recounts a tenth-century appeal from an unnamed Ethiopian ruler to George of Nubia. It says that a queen of the Bani al-Hamwiyah took captives, burned towns and drove the ruler from place to place. The original letter is lost. The account survives within the church history, which links the crisis to an appeal for the appointment of a new metropolitan bishop."
title = "Gudit"
lang = "en"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Gudit, also called Yodit, is remembered in Ethiopian tradition as a queen who turned against Aksum. The History of the Patriarchs of Alexandria recounts a tenth-century appeal from an unnamed Ethiopian ruler to George of Nubia. It says that a queen of the Bani al-Hamwiyah took captives, burned towns and drove the ruler from place to place. The original letter is lost. The account survives within the church history, which links the crisis to an appeal for the appointment of a new metropolitan bishop."]
sections = [{ title = "The queen in the chronicles", paragraphs = ["The geographer Ibn Hawqal also reports a queen ruling in Ethiopia around this period. Neither account gives her the name Gudit. Historians debate whether they refer to the same woman and how she relates to the later Ethiopian traditions. Those traditions differ about her origins, religion and reign. The accounts document a challenge to royal authority by a queen. Their surviving details leave her identity and her part in the end of Aksum open."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.es]
text = "La tradición etíope recuerda a Gudit, también llamada Yodit, como una reina que se alzó contra Aksum. La Historia de los patriarcas de Alejandría recoge un mensaje del siglo X de un gobernante etíope cuyo nombre no indica, dirigido a Jorge de Nubia. Relata que una reina de los Bani al-Hamwiyah tomó prisioneros, incendió poblaciones y obligó al gobernante a huir de un lugar a otro. La carta original se perdió. Su contenido se conoce por la crónica eclesiástica, que relaciona la crisis con la petición de un nuevo obispo metropolitano."
title = "Gudit"
lang = "es"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["La tradición etíope recuerda a Gudit, también llamada Yodit, como una reina que se alzó contra Aksum. La Historia de los patriarcas de Alejandría recoge un mensaje del siglo X de un gobernante etíope cuyo nombre no indica, dirigido a Jorge de Nubia. Relata que una reina de los Bani al-Hamwiyah tomó prisioneros, incendió poblaciones y obligó al gobernante a huir de un lugar a otro. La carta original se perdió. Su contenido se conoce por la crónica eclesiástica, que relaciona la crisis con la petición de un nuevo obispo metropolitano."]
sections = [{ title = "La reina en las crónicas", paragraphs = ["El geógrafo Ibn Hawqal también menciona a una reina que gobernaba en Etiopía por esas fechas. Ninguno de los dos testimonios la llama Gudit. Los historiadores debaten si se refieren a la misma mujer y cómo se relaciona con las tradiciones etíopes posteriores. Estas discrepan sobre su origen, su religión y su reinado. Los testimonios permiten reconocer el desafío de una reina al poder del gobernante. Su identidad y su papel en el fin de Aksum siguen abiertos."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.fr]
text = "La tradition éthiopienne se souvient de Gudit, aussi appelée Yodit, comme d’une reine qui se souleva contre Aksoum. L’Histoire des patriarches d’Alexandrie rapporte un appel adressé au Xe siècle à Georges de Nubie par un souverain éthiopien anonyme. Une reine des Bani al-Hamwiyah aurait fait des prisonniers, incendié des villes et chassé le souverain de lieu en lieu. La lettre originale est perdue. La chronique ecclésiastique en transmet le contenu et rattache la crise à une demande de nomination d’un nouveau métropolite."
title = "Gudit"
lang = "fr"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["La tradition éthiopienne se souvient de Gudit, aussi appelée Yodit, comme d’une reine qui se souleva contre Aksoum. L’Histoire des patriarches d’Alexandrie rapporte un appel adressé au Xe siècle à Georges de Nubie par un souverain éthiopien anonyme. Une reine des Bani al-Hamwiyah aurait fait des prisonniers, incendié des villes et chassé le souverain de lieu en lieu. La lettre originale est perdue. La chronique ecclésiastique en transmet le contenu et rattache la crise à une demande de nomination d’un nouveau métropolite."]
sections = [{ title = "La reine dans les chroniques", paragraphs = ["Le géographe Ibn Hawqal mentionne lui aussi une reine qui régnait en Éthiopie à cette époque. Aucun des deux témoignages ne l’appelle Gudit. Les historiens discutent de l’identification de ces deux femmes et du lien avec les traditions éthiopiennes plus tardives. Ces traditions divergent sur son origine, sa religion et son règne. Les textes attestent qu’une reine a contesté le pouvoir du souverain. Son identité et sa part dans la fin d’Aksoum restent incertaines."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.de]
text = "Die äthiopische Überlieferung erinnert an Gudit, auch Yodit genannt, als eine Königin, die sich gegen Aksum erhob. Die Geschichte der Patriarchen von Alexandria berichtet von einer Bitte aus dem zehnten Jahrhundert, die ein namentlich nicht genannter äthiopischer Herrscher an Georg von Nubien richtete. Eine Königin der Bani al-Hamwiyah soll Gefangene gemacht, Städte verbrannt und den Herrscher von Ort zu Ort getrieben haben. Der ursprüngliche Brief ist verloren. Sein Inhalt ist in der Kirchenchronik überliefert, die die Krise mit der Bitte um einen neuen Metropoliten verbindet."
title = "Gudit"
lang = "de"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Die äthiopische Überlieferung erinnert an Gudit, auch Yodit genannt, als eine Königin, die sich gegen Aksum erhob. Die Geschichte der Patriarchen von Alexandria berichtet von einer Bitte aus dem zehnten Jahrhundert, die ein namentlich nicht genannter äthiopischer Herrscher an Georg von Nubien richtete. Eine Königin der Bani al-Hamwiyah soll Gefangene gemacht, Städte verbrannt und den Herrscher von Ort zu Ort getrieben haben. Der ursprüngliche Brief ist verloren. Sein Inhalt ist in der Kirchenchronik überliefert, die die Krise mit der Bitte um einen neuen Metropoliten verbindet."]
sections = [{ title = "Die Königin in den Chroniken", paragraphs = ["Auch der Geograf Ibn Hawqal erwähnt für diese Zeit eine in Äthiopien herrschende Königin. In keinem der beiden Zeugnisse heißt sie Gudit. Die Forschung diskutiert, ob es sich um dieselbe Frau handelt und wie sie mit der späteren äthiopischen Überlieferung zusammenhängt. Diese Überlieferungen widersprechen sich hinsichtlich ihrer Herkunft, Religion und Herrschaft. Die Berichte zeigen, dass eine Königin die Herrschaft herausforderte. Ihre Identität und ihre Rolle beim Ende Aksums bleiben offen."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.it]
text = "La tradizione etiope ricorda Gudit, detta anche Yodit, come una regina che si ribellò contro Axum. La Storia dei patriarchi di Alessandria riporta un appello del X secolo rivolto a Giorgio di Nubia da un sovrano etiope di cui non indica il nome. Racconta che una regina dei Bani al-Hamwiyah fece prigionieri, incendiò città e costrinse il sovrano a fuggire da un luogo all’altro. La lettera originale è perduta. La cronaca ecclesiastica ne conserva il contenuto e collega la crisi alla richiesta di un nuovo vescovo metropolita."
title = "Gudit"
lang = "it"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["La tradizione etiope ricorda Gudit, detta anche Yodit, come una regina che si ribellò contro Axum. La Storia dei patriarchi di Alessandria riporta un appello del X secolo rivolto a Giorgio di Nubia da un sovrano etiope di cui non indica il nome. Racconta che una regina dei Bani al-Hamwiyah fece prigionieri, incendiò città e costrinse il sovrano a fuggire da un luogo all’altro. La lettera originale è perduta. La cronaca ecclesiastica ne conserva il contenuto e collega la crisi alla richiesta di un nuovo vescovo metropolita."]
sections = [{ title = "La regina nelle cronache", paragraphs = ["Anche il geografo Ibn Hawqal riferisce che una regina governava in Etiopia in quell’epoca. Nessuno dei due testi la chiama Gudit. Gli storici discutono se riguardino la stessa persona e quale rapporto abbia con le tradizioni etiopi più tarde, che divergono su origini, religione e regno. Le testimonianze documentano la sfida di una regina all’autorità del sovrano. La sua identità e il suo ruolo nella fine di Axum rimangono incerti."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.tr]
text = "Etiyopya geleneğinde Gudit, diğer adıyla Yodit, Aksum’a karşı ayaklanan bir kraliçe olarak anılır. İskenderiye Patrikleri Tarihi, adı verilmeyen bir Etiyopya hükümdarının onuncu yüzyılda Nübye hükümdarı Georgios’a gönderdiği yardım çağrısını anlatır. Bani el-Hamviyye’nin kraliçesinin esir aldığını, kentleri yaktığını ve hükümdarı bir yerden diğerine kaçmaya zorladığını kaydeder. Mektubun aslı kayıptır. İçeriğini aktaran kilise kroniği krizi yeni bir metropolit atanması talebiyle ilişkilendirir."
title = "Gudit"
lang = "tr"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Etiyopya geleneğinde Gudit, diğer adıyla Yodit, Aksum’a karşı ayaklanan bir kraliçe olarak anılır. İskenderiye Patrikleri Tarihi, adı verilmeyen bir Etiyopya hükümdarının onuncu yüzyılda Nübye hükümdarı Georgios’a gönderdiği yardım çağrısını anlatır. Bani el-Hamviyye’nin kraliçesinin esir aldığını, kentleri yaktığını ve hükümdarı bir yerden diğerine kaçmaya zorladığını kaydeder. Mektubun aslı kayıptır. İçeriğini aktaran kilise kroniği krizi yeni bir metropolit atanması talebiyle ilişkilendirir."]
sections = [{ title = "Kroniklerdeki kraliçe", paragraphs = ["Coğrafyacı İbn Havkal da o sıralarda Etiyopya’da hüküm süren bir kraliçeden söz eder. İki kaynakta da kraliçenin adı Gudit olarak geçmez. Tarihçiler iki anlatının aynı kişiden söz edip etmediğini ve sonraki Etiyopya gelenekleriyle ilişkisini tartışır. Bu gelenekler kökeni, inancı ve hükümdarlığı konusunda farklı şeyler söyler. Metinler bir kraliçenin hükümdarın otoritesine meydan okuduğunu gösterir. Kimliği ve Aksum’un sonundaki rolü belirsizdir."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.zh-CN]
text = "在埃塞俄比亚的传统故事中，古迪特又叫约迪特，是一位反抗阿克苏姆的女王。十世纪的一段记载出现在《亚历山大牧首史》中。书中说，一位没有留下名字的埃塞俄比亚统治者写信给努比亚的乔治王，请他帮忙。牧首史称，一位巴尼·哈姆维亚的女王起兵反抗，俘虏居民，焚毁城市，迫使这位统治者辗转逃亡。这封信的原件没有保存下来，后人是从教会史的叙述中读到信的内容。书中把动乱与埃塞俄比亚请求新任都主教联系起来。故事发生在菲洛塞奥斯任亚历山大牧首期间。按这部史书的说法，乔治将请求转达给牧首，牧首随后选派了一名叫但以理的修士担任都主教。这些细节也反映了埃塞俄比亚王廷、努比亚王廷和埃及的教会之间怎样联系。"
title = "古迪特"
lang = "zh-CN"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["在埃塞俄比亚的传统故事中，古迪特又叫约迪特，是一位反抗阿克苏姆的女王。十世纪的一段记载出现在《亚历山大牧首史》中。书中说，一位没有留下名字的埃塞俄比亚统治者写信给努比亚的乔治王，请他帮忙。牧首史称，一位巴尼·哈姆维亚的女王起兵反抗，俘虏居民，焚毁城市，迫使这位统治者辗转逃亡。这封信的原件没有保存下来，后人是从教会史的叙述中读到信的内容。书中把动乱与埃塞俄比亚请求新任都主教联系起来。故事发生在菲洛塞奥斯任亚历山大牧首期间。按这部史书的说法，乔治将请求转达给牧首，牧首随后选派了一名叫但以理的修士担任都主教。这些细节也反映了埃塞俄比亚王廷、努比亚王廷和埃及的教会之间怎样联系。"]
sections = [{ title = "史书中的女王", paragraphs = ["阿拉伯语地理学家伊本·豪卡勒在大致同一时期也提到一位在埃塞俄比亚掌权的女王。两份记述都没有把所指的人称作古迪特。学者因此需要分别处理几个问题：牧首史中的女王和地理著作里的女王是否为同一人，她们又是否就是后世故事中的古迪特。对于女王的出身、信仰以及统治经过，埃塞俄比亚的传统讲法并不一致。部分故事把阿克苏姆的毁坏归于她，并为她安排了具体的家世和宗教身份。较早的记述只能帮助重建十世纪王权遇到挑战的情形，难以核实后来的传说。至于一场战事如何与阿克苏姆长期的衰落相连，还要考察其他资料。对信件的研究也指出，牧首史转述的是一位请求援助的统治者的立场，它关心的既有战争也有教会职位。相比之下，伊本·豪卡勒的记述属于地理著作，对当地王权的观察出现在不同的叙述背景中。把这些材料分开看，可以辨认它们共同保留的线索，也能看出后来故事中哪些细节仍然无法核实。古迪特在阿克苏姆终结过程中的作用和她的确切身份，至今仍有讨论的余地。两项早期材料都没有交代她的出身。"] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.ja]
text = "エチオピアの伝承では、グディトはヨディトとも呼ばれ、アクスムに反旗を翻した女王として記憶されている。『アレクサンドリア総主教史』には、名の記されていないエチオピアの統治者が、十世紀にヌビア王ゲオルギオスへ助けを求めた話がある。バニー・アルハムウィーヤの女王が住民を捕らえ、町に火を放ち、統治者を各地へ追いやったという。手紙の原本は残っておらず、内容は教会史の叙述を通じて伝わる。この史書は、危機と新しい府主教の任命を求めたことを結びつけている。アレクサンドリアの総主教がフィロテオスだった時期の話として記されている。ゲオルギオスが要請を取り次ぎ、総主教がダニエルという修道士を府主教に任じて派遣したとされる。"
title = "グディト"
lang = "ja"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["エチオピアの伝承では、グディトはヨディトとも呼ばれ、アクスムに反旗を翻した女王として記憶されている。『アレクサンドリア総主教史』には、名の記されていないエチオピアの統治者が、十世紀にヌビア王ゲオルギオスへ助けを求めた話がある。バニー・アルハムウィーヤの女王が住民を捕らえ、町に火を放ち、統治者を各地へ追いやったという。手紙の原本は残っておらず、内容は教会史の叙述を通じて伝わる。この史書は、危機と新しい府主教の任命を求めたことを結びつけている。アレクサンドリアの総主教がフィロテオスだった時期の話として記されている。ゲオルギオスが要請を取り次ぎ、総主教がダニエルという修道士を府主教に任じて派遣したとされる。"]
sections = [{ title = "年代記に登場する女王", paragraphs = ["地理学者イブン・ハウカルも、ほぼ同じ時期にエチオピアを治めた女王について記している。どちらの記録も、その女王をグディトとは呼んでいない。教会史の女王と地理書の女王が同じ人物かどうか、その人物を後世の伝承のグディトと結びつけられるかどうかは、研究上の別々の問いである。伝承では女王の出自、信仰、統治について異なる話が残る。アクスムの破壊を女王に帰す物語にも、彼女の家系や信仰を説明する後世の要素が含まれている。教会史からは、助けを求めた統治者の立場や、府主教の任命をめぐってヌビアとアレクサンドリアが果たした役割を読み取れる。地理書の短い記述は、それとは別の文脈で女王の支配を伝えている。古い二つの記録は女王が王権に挑んだ時代を考える手がかりになるが、アクスムの終焉における彼女の役割や、伝承に登場する人物との同一性には議論が残っている。残る二つの史料から女王の家系や信仰を確定することもできない。後世の伝承を読む際には、成立した時期にも注意が必要である。"] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.ko]
text = "에티오피아 전승에서 구디트는 요디트라고도 불리며 악숨에 맞서 일어난 여왕으로 기억된다. 《알렉산드리아 총대주교사》에는 이름을 밝히지 않은 에티오피아 통치자가 10세기에 누비아의 게오르기오스 왕에게 도움을 요청한 이야기가 있다. 이 기록은 바니 알함위야의 여왕이 사람들을 포로로 잡고 도시를 불태우고 통치자를 여러 곳으로 쫓았다고 전한다. 원래의 편지는 남아 있지 않으며 그 내용은 교회사의 서술을 통해 전해진다. 교회사는 이 위기를 새 관구장 주교의 임명을 요청한 일과 연결한다. 이 일은 필로테오스가 알렉산드리아 총대주교로 있던 시기에 일어났다고 기록돼 있다. 게오르기오스가 요청을 전달하자 총대주교는 다니엘이라는 수도사를 관구장 주교로 보내 주었다고 한다."
title = "구디트"
lang = "ko"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["에티오피아 전승에서 구디트는 요디트라고도 불리며 악숨에 맞서 일어난 여왕으로 기억된다. 《알렉산드리아 총대주교사》에는 이름을 밝히지 않은 에티오피아 통치자가 10세기에 누비아의 게오르기오스 왕에게 도움을 요청한 이야기가 있다. 이 기록은 바니 알함위야의 여왕이 사람들을 포로로 잡고 도시를 불태우고 통치자를 여러 곳으로 쫓았다고 전한다. 원래의 편지는 남아 있지 않으며 그 내용은 교회사의 서술을 통해 전해진다. 교회사는 이 위기를 새 관구장 주교의 임명을 요청한 일과 연결한다. 이 일은 필로테오스가 알렉산드리아 총대주교로 있던 시기에 일어났다고 기록돼 있다. 게오르기오스가 요청을 전달하자 총대주교는 다니엘이라는 수도사를 관구장 주교로 보내 주었다고 한다."]
sections = [{ title = "연대기 속 여왕", paragraphs = ["지리학자 이븐 하우칼도 비슷한 시기에 에티오피아를 다스린 여왕을 언급했다. 두 자료 모두 그 여왕을 구디트라는 이름으로 부르지는 않는다. 두 자료의 여왕이 같은 사람인지, 그 사람이 후대 에티오피아 전승의 구디트인지에 대해서는 학자들의 의견이 갈린다. 전승마다 여왕의 출신과 종교, 통치에 관한 설명이 다르다. 악숨의 파괴를 그녀에게 돌리는 이야기에는 혈통이나 신앙을 설명하려는 요소도 들어 있다. 교회사는 도움을 요청한 통치자의 관점에서 군사적 위기와 교회 문제를 함께 다룬다. 지리학자의 기록은 다른 맥락에서 여왕이 통치했다는 사실을 전한다. 이 자료들은 한 여왕이 당시 왕권에 도전한 상황을 살피는 단서가 되지만, 후대 전승의 인물과 동일한지, 악숨의 종말에 정확히 어떤 역할을 했는지는 확실하지 않다."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.ar]
text = "تذكر التقاليد الإثيوبية غوديت، المعروفة أيضا باسم يوديت، بوصفها ملكة ثارت على أكسوم. يروي تاريخ بطاركة الإسكندرية أن حاكما إثيوبيا لم يسمه وجه نداء إلى جورج ملك النوبة في القرن العاشر. ويذكر أن ملكة بني الحموية أخذت أسرى وأحرقت مدنا وأجبرت الحاكم على التنقل هربا منها. لم تبق الرسالة الأصلية، وإنما حفظ السجل الكنسي مضمونها وربط الأزمة بطلب تعيين مطران جديد."
title = "غوديت"
lang = "ar"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["تذكر التقاليد الإثيوبية غوديت، المعروفة أيضا باسم يوديت، بوصفها ملكة ثارت على أكسوم. يروي تاريخ بطاركة الإسكندرية أن حاكما إثيوبيا لم يسمه وجه نداء إلى جورج ملك النوبة في القرن العاشر. ويذكر أن ملكة بني الحموية أخذت أسرى وأحرقت مدنا وأجبرت الحاكم على التنقل هربا منها. لم تبق الرسالة الأصلية، وإنما حفظ السجل الكنسي مضمونها وربط الأزمة بطلب تعيين مطران جديد."]
sections = [{ title = "الملكة في السجلات", paragraphs = ["ويذكر الجغرافي ابن حوقل أيضا ملكة حكمت في إثيوبيا في تلك الفترة. ولا يسميها أي من النصين غوديت. ويناقش المؤرخون ما إذا كان النصان يتحدثان عن المرأة نفسها وما علاقتها بالتقاليد الإثيوبية المتأخرة، التي تختلف في نسبها ودينها وحكمها. وتشهد الروايات على تحدي ملكة لسلطة الحاكم، بينما تبقى هويتها ودورها في نهاية أكسوم غير محسومين. ويروي السجل أن ملك النوبة نقل طلب تعيين المطران إلى بطريرك الإسكندرية."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.ru]
text = "Эфиопское предание помнит Гудит, или Йодит, как царицу, восставшую против Аксума. В «Истории александрийских патриархов» пересказывается обращение неназванного эфиопского правителя к Георгию Нубийскому в X веке. Согласно этому сообщению, царица Бану аль-Хамвийя брала пленников, сжигала города и заставляла правителя бежать с места на место. Само письмо утрачено. Его содержание известно из церковной хроники, связывающей бедствие с просьбой назначить нового митрополита."
title = "Гудит"
lang = "ru"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Эфиопское предание помнит Гудит, или Йодит, как царицу, восставшую против Аксума. В «Истории александрийских патриархов» пересказывается обращение неназванного эфиопского правителя к Георгию Нубийскому в X веке. Согласно этому сообщению, царица Бану аль-Хамвийя брала пленников, сжигала города и заставляла правителя бежать с места на место. Само письмо утрачено. Его содержание известно из церковной хроники, связывающей бедствие с просьбой назначить нового митрополита."]
sections = [{ title = "Царица в хрониках", paragraphs = ["Географ Ибн Хаукаль тоже упоминает царицу, правившую в Эфиопии примерно в это время. Ни один из этих текстов не называет её Гудит. Историки обсуждают, говорится ли в них об одной женщине и как она связана с более поздними эфиопскими преданиями. Они расходятся относительно её происхождения, веры и правления. Свидетельства говорят о вызове, который царица бросила власти правителя, но её личность и её роль в конце Аксума остаются неясными."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.vi]
text = "Truyền thống Ethiopia nhớ đến Gudit, còn gọi là Yodit, như một nữ vương nổi dậy chống Aksum. Lịch sử các thượng phụ Alexandria kể về lời cầu viện vào thế kỷ X của một nhà cai trị Ethiopia không được nêu tên gửi cho George xứ Nubia. Sử sách kể một nữ vương của người Bani al-Hamwiyah đã bắt tù binh, đốt các thành phố và buộc nhà cai trị phải chạy từ nơi này sang nơi khác. Bản gốc bức thư đã thất lạc. Nội dung được lưu qua sử sách giáo hội, gắn cuộc khủng hoảng với yêu cầu bổ nhiệm một vị tổng giám mục mới."
title = "Gudit"
lang = "vi"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Truyền thống Ethiopia nhớ đến Gudit, còn gọi là Yodit, như một nữ vương nổi dậy chống Aksum. Lịch sử các thượng phụ Alexandria kể về lời cầu viện vào thế kỷ X của một nhà cai trị Ethiopia không được nêu tên gửi cho George xứ Nubia. Sử sách kể một nữ vương của người Bani al-Hamwiyah đã bắt tù binh, đốt các thành phố và buộc nhà cai trị phải chạy từ nơi này sang nơi khác. Bản gốc bức thư đã thất lạc. Nội dung được lưu qua sử sách giáo hội, gắn cuộc khủng hoảng với yêu cầu bổ nhiệm một vị tổng giám mục mới."]
sections = [{ title = "Nữ vương trong biên niên sử", paragraphs = ["Nhà địa lý Ibn Hawqal cũng nói đến một nữ vương cai trị ở Ethiopia vào thời ấy. Cả hai nguồn đều không gọi bà là Gudit. Các sử gia tranh luận liệu họ có nói về cùng một người và người ấy liên hệ thế nào với truyền thống Ethiopia về sau. Những truyền thống này khác nhau về nguồn gốc, tôn giáo và triều đại của bà. Các ghi chép cho thấy một nữ vương đã thách thức quyền lực của nhà cai trị, nhưng danh tính và vai trò của bà trong sự suy tàn của Aksum vẫn còn bỏ ngỏ."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.id]
text = "Dalam tradisi Etiopia, Gudit atau Yodit dikenang sebagai ratu yang memberontak terhadap Aksum. Sejarah Para Patriark Aleksandria mencatat permohonan pada abad kesepuluh dari seorang penguasa Etiopia yang tidak disebut namanya kepada George dari Nubia. Menurut kisah itu, seorang ratu Bani al-Hamwiyah mengambil tawanan, membakar kota-kota, dan memaksa sang penguasa berpindah dari satu tempat ke tempat lain. Surat aslinya telah hilang. Kronik gereja melestarikan isinya dan mengaitkan krisis dengan permohonan pengangkatan uskup metropolitan baru."
title = "Gudit"
lang = "id"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Dalam tradisi Etiopia, Gudit atau Yodit dikenang sebagai ratu yang memberontak terhadap Aksum. Sejarah Para Patriark Aleksandria mencatat permohonan pada abad kesepuluh dari seorang penguasa Etiopia yang tidak disebut namanya kepada George dari Nubia. Menurut kisah itu, seorang ratu Bani al-Hamwiyah mengambil tawanan, membakar kota-kota, dan memaksa sang penguasa berpindah dari satu tempat ke tempat lain. Surat aslinya telah hilang. Kronik gereja melestarikan isinya dan mengaitkan krisis dengan permohonan pengangkatan uskup metropolitan baru."]
sections = [{ title = "Sang ratu dalam kronik", paragraphs = ["Ahli geografi Ibn Hawqal juga menyebut seorang ratu yang berkuasa di Etiopia sekitar masa itu. Kedua catatan tidak menyebutnya Gudit. Para sejarawan memperdebatkan apakah kedua catatan merujuk pada orang yang sama dan bagaimana ia berhubungan dengan tradisi Etiopia yang muncul kemudian. Tradisi tersebut berbeda mengenai asal-usul, agama, dan masa pemerintahannya. Catatan itu menunjukkan tantangan seorang ratu terhadap kekuasaan penguasa, sementara jati dirinya dan perannya dalam berakhirnya Aksum masih belum pasti."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.fil]
text = "Sa tradisyon ng Ethiopia, si Gudit o Yodit ay isang reynang naghimagsik laban sa Aksum. Isinalaysay sa Kasaysayan ng mga Patriyarka ng Alexandria ang isang pakiusap noong ikasampung siglo mula sa isang di-pinangalanang pinuno ng Ethiopia kay George ng Nubia. Ayon dito, isang reyna ng Bani al-Hamwiyah ang kumuha ng mga bihag, nagsunog ng mga lungsod at nagtaboy sa pinuno mula sa isang lugar patungo sa iba. Nawala ang orihinal na liham. Napanatili ang nilalaman sa kronika ng simbahan, na iniugnay ang krisis sa kahilingang magtalaga ng bagong obispong metropolitano."
title = "Gudit"
lang = "fil"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
shortArticle = true
intro = ["Sa tradisyon ng Ethiopia, si Gudit o Yodit ay isang reynang naghimagsik laban sa Aksum. Isinalaysay sa Kasaysayan ng mga Patriyarka ng Alexandria ang isang pakiusap noong ikasampung siglo mula sa isang di-pinangalanang pinuno ng Ethiopia kay George ng Nubia. Ayon dito, isang reyna ng Bani al-Hamwiyah ang kumuha ng mga bihag, nagsunog ng mga lungsod at nagtaboy sa pinuno mula sa isang lugar patungo sa iba. Nawala ang orihinal na liham. Napanatili ang nilalaman sa kronika ng simbahan, na iniugnay ang krisis sa kahilingang magtalaga ng bagong obispong metropolitano."]
sections = [{ title = "Ang reyna sa mga kronika", paragraphs = ["Binanggit din ng heograpong si Ibn Hawqal ang isang reynang namuno sa Ethiopia sa panahong iyon. Walang tumawag sa kaniya na Gudit sa dalawang tala. Pinagtatalunan ng mga historyador kung iisang babae ang tinutukoy at kung paano siya nauugnay sa mga tradisyon ng Ethiopia na naisulat kalaunan. Magkakaiba ang mga tradisyong iyon tungkol sa pinagmulan, relihiyon at paghahari niya. Naitala ang paghamon ng isang reyna sa kapangyarihan ng pinuno, ngunit hindi tiyak ang pagkakakilanlan niya o ang papel niya sa katapusan ng Aksum."] }]
sources = [{ title = "Benjamin Hendrickx, The Letter of an Ethiopian King to King George II of Nubia, with a translation of the relevant passage", url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf" }, { title = "Knud Tage Andersen, The Queen of the Habasha in Ethiopian history, tradition and chronology", url = "https://doi.org/10.1017/S0041977X00006443" }, { title = "Raita Steyn, Gudit, a Jewish queen of Aksum?", url = "https://doi.org/10.25159/2663-6573/6003" }, { title = "Dictionary of African Christian Biography, Gudit", url = "https://dacb.org/stories/ethiopia/gudit/" }]

[articles.pt-BR]
text = "Na tradição etíope, Gudit, também chamada Yodit, é lembrada como a rainha que se voltou contra Axum. A História dos Patriarcas de Alexandria relata um pedido de ajuda do século X feito por um governante etíope anônimo a Jorge da Núbia. Segundo o relato, uma rainha dos Bani al-Hamwiyah fez prisioneiros, incendiou cidades e obrigou o governante a fugir de um lugar a outro. A carta original se perdeu. Seu conteúdo sobrevive na crônica eclesiástica, que liga a crise ao pedido de nomeação de um novo bispo metropolitano."
title = "Gudit"
lang = "pt-BR"
url = "https://www.pharosjot.com/uploads/7/1/6/3/7163688/article_11_vol_99_2018_-hendrickx_uj.pdf"
