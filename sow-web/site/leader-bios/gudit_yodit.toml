intro = ["Na tradição etíope, Gudit, também chamada Yodit, é lembrada como a rainha que se voltou contra Axum. A História dos Patriarcas de Alexandria relata um pedido de ajuda do século X feito por um governante etíope anônimo a Jorge da Núbia. Segundo o relato, uma rainha dos Bani al-Hamwiyah fez prisioneiros, incendiou cidades e obrigou o governante a fugir de um lugar a outro. A carta original se perdeu. Seu conteúdo sobrevive na crônica eclesiástica, que liga a crise ao pedido de nomeação de um novo bispo metropolitano."]
sections = [{ title = "A rainha nas crônicas", paragraphs = ["O geógrafo Ibn Hawqal também menciona uma rainha que governava na Etiópia naquela época. Nenhum dos dois relatos dá a ela o nome de Gudit. Os historiadores debatem se os relatos tratam da mesma mulher e como ela se relaciona com as tradições etíopes posteriores. Essas tradições divergem sobre sua origem, religião e reinado. Os relatos registram o desafio de uma rainha ao poder do governante, mas sua identidade e seu papel no fim de Axum permanecem em aberto."] }]
