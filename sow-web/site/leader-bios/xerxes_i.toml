[articles.en]
text = "Xerxes I was a Persian ruler who reigned as the fourth King of Kings of the Achaemenid Empire, reigning from 486 BC until his assassination in 465 BC. He was the son of Darius the Great and Atossa."
title = "Xerxes I"
lang = "en"
url = "https://en.wikipedia.org/wiki/Xerxes_I"
intro = [
  "Xerxes I ( ZURK-seez; commonly known as Xerxes the Great; c. 518 BC – 465 BC) was a Persian ruler who reigned as the fourth King of Kings of the Achaemenid Empire, reigning from 486 BC until his assassination in 465 BC. He was the son of Darius the Great and Atossa.",
  "In Western history, Xerxes is best known for his invasion of Greece in 480 BC, which ended in Persian conquest. Xerxes was made successor by Darius over his elder brother Artobarzan and inherited a large, multi-ethnic empire upon his father's death. He consolidated power by crushing revolts in Egypt and Babylon, and renewed his father's campaign to subjugate Greece and punish Athens and its allies for their interference in the Ionian Revolt. In 480 BC, Xerxes led a large army and crossed the Hellespont into Europe. He achieved victories at Thermopylae and Artemisium before capturing and razing Athens. His forces gained control of mainland Greece north of the Isthmus of Corinth until their defeat at the Battle of Salamis. Fearing that the Greeks might trap him in Europe, Xerxes retreated with the greater part of his army back to Asia, leaving behind Mardonius to continue his campaign. Mardonius was defeated at Plataea the following year, ending the Persian invasion.",
  "After returning to Persia, Xerxes dedicated himself to large construction projects, many of which had been left unfinished by his father. He oversaw the completion of the Gate of All Nations, the Apadana and the Tachara at Persepolis, and continued the construction of the Palace of Darius at Susa. He also maintained the Royal Road built by his father. In 465 BC, Xerxes and his heir Darius were assassinated by Artabanus, the commander of the royal bodyguard. He was succeeded by his third son, who took the throne as Artaxerxes I.",
]
sections = [
  { "title" = "Etymology", "paragraphs" = [
      "Xérxēs (Ξέρξης) is the Greek and Latin (Xerxes, Xerses) transliteration of the Old Iranian Xšaya-ṛšā (\"ruling over heroes\"), which can be seen by the first part xšaya, meaning \"ruling\", and the second ṛšā, meaning \"hero, man\". The name of Xerxes was known in Akkadian as Ḫi-ši-ʾ-ar-šá and in Aramaic as ḥšyʾrš. Xerxes would become a popular name among the rulers of the Achaemenid Empire.",
    ] },
  { "title" = "Early life", "paragraphs" = [
      "Xerxes's father was Darius the Great (r. 522–486 BC), the monarch of the Achaemenid Empire, albeit not a member of the family of Cyrus the Great, the founder of the empire. Xerxes's mother was Atossa, a daughter of Cyrus. Darius and Atossa married in 522 BC, and Xerxes was born around 518 BC.",
      "According to the Greek dialogue First Alcibiades, which describes typical upbringing and education of Persian princes, they were raised by eunuchs. Starting at the age of seven, they learned how to ride and hunt; after reaching the age of fourteen, they were each taught by four teachers from aristocratic backgrounds, who taught them how to be \"wise, just, prudent, and brave\". Persian princes also learned the basics of the Zoroastrian religion, and were taught to be truthful, to be courageous, and to have self-restraint. The dialogue further added that \"fear, for a Persian, is the equivalent of slavery.\" At the age of 16 or 17, they began their mandatory 10 years of national service, which included practicing archery and javelin, competing for prizes, and hunting. Afterwards, they served in the military for around 25 years, after which they were elevated to the status of elders and advisers to the king. Families in this time, including Xerxes', would intermarry.",
      "This account of education among the Persian elite is supported by Xenophon's description of the 5th-century BC Achaemenid prince Cyrus the Younger, with whom he was well-acquainted. Stoneman suggests that this was the type of upbringing and education that Xerxes experienced. It is unknown if Xerxes ever learned to read or write, with the Persians favoring oral history over written literature. Stoneman suggests that Xerxes's upbringing and education was possibly not much different from that of the later Iranian kings, such as Abbas the Great, king of the Safavid Empire in the 17th-century AD. Starting from 498 BC, Xerxes resided in the royal palace of Babylon.",
    ] },
  { "title" = "Consolidation of power", "paragraphs" = [
      "At the time of Xerxes's accession, trouble was brewing in some of his domains. A revolt occurred in Egypt, which seemed dangerous enough for Xerxes to personally lead the army to restore order (which also gave him the opportunity to begin his reign with a military campaign). Xerxes suppressed the revolt in January 484 BC and appointed his full-brother Achaemenes as satrap of Egypt, replacing the previous satrap Pherendates, who was reportedly killed during the revolt. The suppression of the Egyptian revolt expended the army, which had been mobilized by Darius over the previous three years. Xerxes, therefore, had to raise another army for his expedition into Greece, which took another four years. There was also unrest in Babylon, which revolted at least twice against Xerxes during his reign. The first revolt broke out in June or July of 484 BC and was led by a rebel of the name Bel-shimanni. Bel-shimmani's revolt was short-lived; Babylonian documents written during his reign only account for a period of two weeks.",
      "Two years later, Babylon produced another rebel leader, Shamash-eriba. Beginning in the summer of 482 BC, Shamash-eriba seized Babylon itself and other nearby cities, such as Borsippa and Dilbat, and was only defeated in March 481 BC after a lengthy siege of Babylon. The precise cause of the unrest in Babylon is uncertain. It may have been due to tax increases. Prior to these revolts, Babylon had occupied a special position within the Achaemenid Empire; the Achaemenid kings had held the titles of \"King of Babylon\" and \"King of the Lands\", implying that they perceived Babylonia as a somewhat separate entity within their empire, united with their own kingdom in a personal union. After the revolts, however, Xerxes dropped \"King of Babylon\" from his titulature and divided the previously large Babylonian satrapy (accounting for most of the Neo-Babylonian Empire's territory) into smaller sub-units.",
      "Based on texts written by classical authors, it is often assumed that Xerxes enacted a brutal vengeance on Babylon following the two revolts. According to ancient writers, Xerxes destroyed Babylon's fortifications and damaged the temples in the city. The Esagila was allegedly subject to great damage, and Xerxes allegedly carried the statue of Marduk away from the city, possibly bringing it to Iran and melting it down (classical authors hold that the statue was made entirely of gold, which would have made melting it down possible). Modern historian Amélie Kuhrt considers it unlikely that Xerxes destroyed the temples, but believes that the story of him doing so may derive from an anti-Persian sentiment among the Babylonians. It is doubtful if the statue was removed from Babylon at all and some have even suggested that Xerxes did remove a statue from the city, but that this was the golden statue of a man rather than the statue of the god Marduk. Though mentions of it are lacking considerably compared to earlier periods, contemporary documents suggest that the Babylonian New Year's Festival continued in some form during the Achaemenid period. Because the change in rulership from the Babylonians themselves to the Persians and due to the replacement of the city's elite families by Xerxes following its revolt, it is possible that the festival's traditional rituals and events had changed considerably.",
    ] },
  { "title" = "Campaigns", "paragraphs" = [
      "Darius died while in the process of preparing a second army to invade the Greek mainland, leaving to his son the task of punishing the Athenians, Naxians, and Eretrians for their interference in the Ionian Revolt, the burning of Sardis, and their victory over the Persians at Marathon. Xerxes initially wanted to avoid a major war with Greece, but was convinced otherwise by his father's generals headed by his cousin Mardonius, who accused him of timidity. From 483 BC, Xerxes prepared his expedition: The Xerxes Canal was dug through the isthmus of the peninsula of Mount Athos, provisions were stored in the stations on the road through Thrace, and two pontoon bridges later known as Xerxes's Pontoon Bridges were built across the Hellespont. Soldiers of many nationalities served in the armies of Xerxes from all over his multi-ethnic massive sized empire and beyond, including the Armenians, Medes, Sakas, Elamites, Assyrians, Phoenicians, Babylonians, Egyptians, Thracians, Paeonians, Achaean Greeks, Ionian Greeks, Aegean Greeks, Aeolian Greeks, Greeks from Pontus, Colchians, Sindhis and many more.",
      "According to the Greek historian Herodotus, Xerxes's first attempt to bridge the Hellespont ended in failure when a storm destroyed the flax and papyrus cables of the bridges. In retaliation, Xerxes ordered the Hellespont (the strait itself) whipped three hundred times, and had fetters thrown into the water. Xerxes's second attempt to bridge the Hellespont was successful. The Carthaginian invasion of Sicily deprived Greece of the support of the powerful monarchs of Syracuse and Agrigentum; ancient sources assume Xerxes was responsible, modern scholarship is skeptical. Many smaller Greek states, moreover, took the side of the Persians, especially Thessaly, Thebes and Argos. Xerxes was victorious during the initial battles.",
      "Xerxes set out in the spring of 480 BC from Sardis with a fleet and army which Herodotus estimated was roughly one million strong along with 10,000 elite warriors named the Immortals. More recent estimates place the Persian force at around 60,000 combatants.",
    ] },
  { "title" = "Death and succession", "paragraphs" = [
      "In August 465 BC, likely between 4 and 8 August, Artabanus, the commander of the royal bodyguard and the most powerful official in the Persian court, assassinated Xerxes with the help of a eunuch, Aspamitres. Although the Hyrcanian Artabanus bore the same name as the famed uncle of Xerxes, his rise to prominence was due to his popularity in religious quarters of the court and harem intrigues. He put his seven sons in key positions and had a plan to dethrone the Achaemenids.",
      "Greek historians give differing accounts of events. According to Ctesias (in Persica 20), Artabanus then accused the Crown Prince Darius, Xerxes's eldest son, of the murder and persuaded another of Xerxes's sons, Artaxerxes, to avenge the patricide by killing Darius. But according to Aristotle (in Politics 5.1311b), Artabanus killed Darius first and then killed Xerxes. After Artaxerxes discovered the murder, he killed Artabanus and his sons. Participating in these intrigues was the general Megabyzus, whose decision to switch sides probably saved the Achaemenids from losing their control of the Persian throne.",
    ] },
]

[articles.es]
text = "Jerjes I (en antiguo persa: 𐎧𐏁𐎹𐎠𐎼𐏁𐎠, romanizado: Xšaya-ṛšā,​​​ lit. 'gobernador de héroes'; circa 519-465 a."
title = "Jerjes I"
lang = "es"
url = "https://es.wikipedia.org/wiki/Jerjes_I"
intro = [
  "Jerjes I (en antiguo persa: 𐎧𐏁𐎹𐎠𐎼𐏁𐎠, romanizado: Xšaya-ṛšā,​​​ lit. 'gobernador de héroes'; circa 519-465 a. C.), también conocido como Jerjes el Grande,​ fue el cuarto Gran Rey y Rey de Reyes del Imperio aqueménida (486-465 a. C.), hijo de Darío I y de Atosa, hija de Ciro II el Grande. Su nombre Jerjes (también escrito Xerxes) es una transliteración de la forma griega (Ξέρξης, romanizado: \"Xérxēs\") de su nombre persa.​",
  "En la historia occidental, se recuerda a Jerjes principalmente por su invasión a Grecia en el 480 a. C., que concluyó en una derrota persa. Jerjes fue designado sucesor por Darío por encima de su hermano mayor Artobazan y heredó un vasto imperio multiétnico tras la muerte de su padre. Consolidó su poder aplastando revueltas en Egipto y Babilonia, y renovó la campaña de su padre para subyugar Grecia y castigar a Atenas y sus aliados por su interferencia en la revuelta jónica. En 480 a. C., Jerjes comandó personalmente un gran ejército y cruzó el Helesponto hacia Europa. Logró victorias en las Termópilas y en Artemisio, antes de capturar y arrasar Atenas. Sus ejércitos lograron el control de la Grecia continental al norte del istmo de Corinto hasta su derrota en la batalla de Salamina. Temiendo que los griegos lo dejaran atrapado en Europa, Jerjes se retiró junto con la mayor parte de su ejército de vuelta a Asia, dejando a Mardonio para que continuara la campaña. Mardonio fue derrotado en Platea al año siguiente, lo que puso fin de manera efectiva a la invasión persa.",
  "Tras retornar a Persia, Jerjes se dedicó a proyectos de construcción a gran escala, muchos de los cuales habían sido dejados inconclusos por su padre. Supervisó la terminación de la Puerta de todas las Naciones, la Apadana y el Tachara en Persépolis, y continuó la construcción del Palacio de Darío en Susa. Mantuvo asimismo el Camino Real construido por su padre. En 465 a. C., Jerjes y su heredero Darío fueron asesinados por Artabano, comandante de la guardia real. Fue sucedido en el trono por su tercer hijo, que adoptó el nombre de Artajerjes I.",
  "Académicos de la Biblia lo suelen identificar con Asuero,​ personaje del libro de Ester, el cual varios eruditos consideran como un romance histórico. No hay un consenso claro, sin embargo, con respecto a qué evento histórico dio base a la historia.​​​​",
]
sections = [
  { "title" = "Las revueltas de Egipto y Babilonia", "paragraphs" = [
      "Jerjes fue designado sucesor de Darío I por delante de todos sus hermanos, mayores que él, y que nacieron antes que Darío ascendiera al trono. Tras ser coronado en octubre de 486 a. C., se enfrentó victoriosamente a una rebelión en el Egipto sometido, que comenzó en ese mismo año. Dejó a su hermano Aquemenes como sátrapa de esa región, sobre la cual ejerció un control represivo.",
      "Sus predecesores, especialmente su padre, no fueron muy afortunados en sus intentos de conciliar las antiguas civilizaciones sometidas con el gobierno persa. Esta fue probablemente la razón por la cual Jerjes abolió definitivamente el reino de Babilonia en 484 a. C., cuando también se llevó la estatua dorada de Bel (Marduk o Merodac, cuyas manos debían tocar el legítimo rey de Babilonia el primer día de cada año) y mató a los sacerdotes que trataban de impedírselo.​",
      "Por lo tanto, no aparece con el título de Rey de Babilonia en los textos babilónicos que datan de su reinado, pero sí con el de Rey de Persia y Media, o simplemente Rey de naciones (equivalente a Rey del mundo). Este proceder desencadenó dos rebeliones, en 484 a. C. y en 479 a. C., que fueron sofocadas enérgicamente.",
    ] },
  { "title" = "La segunda guerra médica", "paragraphs" = [
      "Una vez sofocadas todas las revueltas, y alentado por su primo Mardonio,​ trató de vengar la derrota sufrida por su padre, Darío I, en la batalla de Maratón, durante la primera guerra médica (490 a. C.). Darío no había podido castigar a los atenienses por su intromisión en la revuelta jónica en Asia Menor, por lo que Jerjes planificó la operación de castigo y conquista con sumo cuidado (483 a. C.).",
      "Ya que una flota persa había naufragado en el año 492 a. C. al pie del monte Athos, mandó excavar el Canal de Jerjes a través del istmo que comunicaba la Península Calcídica, donde está el monte Athos, con el continente europeo;​ se almacenaron provisiones en escalas a lo largo de la ruta que recorría Tracia y se erigieron dos puentes que atravesaban el Helesponto.",
      "Jerjes concluyó una alianza con Cartago, lo cual privó a los griegos helénicos del apoyo de los griegos sicilianos de Agrigento y Siracusa, a la vez que consiguió ganar para la causa persa a varios Estados griegos, como Tesalia, Macedonia, Tebas y Argos. Los persas lograron reunir para la ocasión una gran flota (la mayoría de las naves procedían de sus vasallos fenicios y chipriotas) y un poderoso ejército. En relación con el número de efectivos, se puede mencionar lo siguiente extraído del libro VII de Heródoto:",
    ] },
  { "title" = "Últimos años", "paragraphs" = [
      "De los últimos años del reinado de Jerjes poco se sabe. Se conoce que envió a sátrapas a intentar la circunnavegación de África, pero la victoria de los griegos en la segunda guerra médica supuso la paulatina inmersión del Imperio aqueménida en un estado de apatía, de la cual no volvería a despertar. El mismo rey se vio involucrado en varias intrigas palaciegas, dependiendo en exceso de sus cortesanos y eunucos.",
      "Después de los errores militares cometidos en Grecia, volvió a Persia. Allí supervisó la finalización de muchos proyectos iniciados por su padre en Susa y Persépolis, como la Puerta de las Naciones y la Sala de las cien columnas, en Persépolis, que son las estructuras más grandes e impactantes del palacio. También la conclusión de la Apadana del palacio de Darío, y el Tesoro, ambos empezados por Darío, y su propio palacio, que alcanzó el doble de tamaño del de su padre. Su gusto arquitectónico era similar al de Darío, aunque a una escala todavía más gigantesca.​",
      "Dejó varias inscripciones: en Van (Turquía), en el monte Elvend (cerca de Ecbatana) y en Persépolis. En todos esos textos simplemente recogió las palabras de su padre.",
    ] },
  { "title" = "En la Biblia", "paragraphs" = [
      "En el libro bíblico de Ester, se menciona a Jerjes bajo la forma hebraica del nombre Asuero —Aḥashverosh (Assoueros en griego, אֲחַשְׁוֵרוֹשׁ en hebreo)—.​ Según este relato, Asuero repudió a su reina consorte Vasti, debido a que ella se negó a obedecer su orden de presentarse en un banquete. En su reemplazo, Asuero escogió como esposa a Ester, cuyo origen judío desconocía. Un ministro del rey, Hamán, el agagueo, enemistado con un judío de nombre Mardoqueo (tutor de Ester), convenció al rey Asuero de eliminar al pueblo judío. Una vez publicado el decreto, la reina Ester, aconsejada por Mardoqueo, dejó al descubierto la trama de Hamán y se expidió un nuevo decreto, dando al pueblo judío el derecho a defenderse de sus atacantes, lo que estos hicieron. En conmemoración de tal hecho, se introdujo la fiesta de Purim. Si bien Flavio Josefo, en su obra Antigüedades de los Judíos, considera verídica a esta narración, no hay evidencia de que Ester o Vasti fueran consortes de Jerjes u otro soberano aqueménida; el historiador griego Heródoto, por su parte, escribió que la reina consorte de Jerjes era Amestris, la hija de Ótanes.​​",
      "Asuero es también el nombre de un rey de Persia en el Libro de Esdras,​ a quien también se le identifica con Jerjes I,​ si bien se han propuesto otros nombres.[cita requerida] Según este libro, Jerjes recibió quejas de los samaritanos contra los habitantes de Judá en el contexto de las enemistades existentes entre ambos grupos.​",
    ] },
]

[articles.tr]
text = "I. Serhas (/ˈzɜːrksiːz/ ZURK-seez; genellikle Büyük Serhas olarak bilinir; MÖ 518 – MÖ 465) MÖ 486'dan MÖ 465'te suikasta uğrayana kadar Ahameniş İmparatorluğu'nun dördüncü Kralların kralı olarak görev yapan bir Pers hükümdarıdır."
title = "I. Serhas"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._Serhas"
intro = [
  "I. Serhas (/ˈzɜːrksiːz/ ZURK-seez; genellikle Büyük Serhas olarak bilinir; MÖ 518 – MÖ 465) MÖ 486'dan MÖ 465'te suikasta uğrayana kadar Ahameniş İmparatorluğu'nun dördüncü Kralların kralı olarak görev yapan bir Pers hükümdarıdır. I. Darius ve II. Kiros'un kızı Atossa'nın oğludur.",
  "Batı tarihinde Serhas, en çok MÖ 480'de Perslerin yenilgisiyle sonuçlanan Yunanistan'ı işgaliyle tanınır. Serhas, ağabeyi Artobazan'ın yerine Darius tarafından halef olarak atanmış ve babasının ölümünden sonra büyük, çok etnikli bir imparatorluğu miras almıştır. Mısır ve Babil'deki isyanları bastırarak gücünü pekiştirmiş ve babasının Yunanistan'ı boyunduruk altına alma ve Atina ile müttefiklerini İyonya Ayaklanması'na müdahalelerinden dolayı cezalandırma seferini yenilemiştir. MÖ 480'de Serhas büyük bir orduya liderlik ederek Hellespont'ı geçip Avrupa'ya girmiştir. Atina'yı ele geçirip yerle bir etmeden önce Thermopylae ve Artemision'da zaferler kazanmıştır. Kuvvetleri, Salamis Muharebesi'ndeki yenilgilerine kadar Korint Kıstağı'nın kuzeyindeki anakara Yunanistan'ın kontrolünü ele geçirmiştir. Yunanların onu Avrupa'da tuzağa düşürebileceğinden korkan Serhas, ordusunun büyük bir kısmıyla Asya'ya geri çekilmiş ve Mardonios'u seferine devam etmesi için geride bırakmıştır. Mardonios ertesi yıl Plataea'da yenilgiye uğradı ve Pers istilası sona erdi.",
  "Persia'ya döndükten sonra Serhas, babasının yarım bıraktığı birçok büyük inşaat projesine kendini adadı. Persepolis'teki Tüm Milletlerin Kapısı, Apadana ve Taçara'nın tamamlanmasını denetledi ve Susa'daki Darius Sarayı'nın inşasına devam etti. Ayrıca babasının inşa ettiği Kral Yolu'nun bakımını da üstlendi. MÖ 465'te Serhas ve varisi Darius, kraliyet muhafızlarının komutanı Erdevân tarafından suikaste uğradı. Yerine üçüncü oğlu I. Artaserhas geçti.",
]
sections = [
  { "title" = "Etimoloji", "paragraphs" = [
      "Xérxēs (Ξέρξης), Eski İran dilindeki Xšaya-ṛšā (\"kahramanlar üzerinde hüküm süren\") kelimesinin Yunanca ve Latince (Xerxes, Xerses) transliterasyonudur; bu, ilk kısım olan xšaya'nın \"hüküm süren\" ve ikinci kısım olan ṛšā'nın \"kahraman, adam\" anlamına gelmesinden anlaşılabilir. Serhas adı Akadca Ḫi-ši-ʾ-ar-šá ve Aramice'de ḥšyʾrš olarak bilinirdi. Serhas ismi daha sonra Ahameniş İmparatorluğu'nun hükümdarları arasında popüler hale gelmiştir.",
    ] },
  { "title" = "Erken yaşamı", "paragraphs" = [
      "Serhas'ın babası, Pers İmparatorluğu'nun mevcut hükümdarı olan ve imparatorluğun kurucusu Büyük Kiros'un hanedanına mensup olmayan I. Darius'tu (MÖ 522-486). Serhas'ın annesi ise Kiros'un kızı Atossa'ydı. Darius ve Atossa, MÖ 522 yılında evlendi ve MÖ 518 yılında oğulları Serhas dünyaya geldi.",
      "Pers prenslerinin yaygın ve süregelen yetiştirilme ve eğitim safhalarını açıklayan Grek diyaloğu I. Alkibiades'e göre, prenslerin hadımlar tarafından büyütüldüğü belirtilir. Buna göre yedi yaşından başlayarak ata binmeyi ve avlanmayı öğrenirlerdi. On dört yaşına geldiklerinde ise aristokrat kökenli dört öğretmen tarafından bilge, adil, ihtiyatlı ve cesur gibi karakteristiklere sahip olmayı öğrenirlerdi. Bunun yanında prenslere, Zerdüştlük inancının temelleri ve dürüstlük, cesurluk ve öz disiplin sahibi olmaları öğretilirdi. Mahut diyalog, \"korku duygusunun, bir Pers için kölelikten farksız\" olduğunu da belirtir. Ardından 16-17 yaşlarında zorunlu on yıllık ulusal hizmetlere başlarlar, bu süre boyunca okçuluk ve cirit atma pratiği yapar, ödüller için yarışır ve avlanılırdı. Müteakiben, yaklaşık 25 yıl boyunca askeri hizmet vermelerinin ardından yaşlılar ve kralın danışmanları pozisyonuna yükseltilirlerdi.",
      "Pers soylularına haiz bu eğitim sistemi, Genç Kiros'un yakın çevresinden olan ve onunla ilgili yazılar kaleme almış Ksenofon tarafından da desteklenir. Tarihçi Stoneman, Serhas'ın de bu tür bir eğitim süreci geçirdiğini öne sürer. Persler sözlü edebiyatı yazılı olana tercih ederlerdi, bu sebeple Serhas'ın okuma yazma öğrenip öğrenmediğine dair kesin bir bilgi bulunmamaktadır. Stoneman, Serhas'ın aldığı eğitimin, 17. yüzyıl Safavi İmparatorluğu'nun büyük hükümdarı Şah Abbas gibi kendisinden sonra gelen İran krallarınınkinden pek farklı olmadığını söylemektedir. Kserkes, MÖ 498 yılından itibaren Babil'deki kraliyet sarayında ikamet etmiştir.",
    ] },
  { "title" = "Tahtını sağlamlaştırması", "paragraphs" = [
      "Serhas'ın tahta çıkışı sırasında, bazı bölgelerinde sorunlar baş göstermiştir. Mısır'da bir isyan çıkmıştı ve bu isyan, Serhas'ın düzeni sağlamak için orduyu bizzat yönetmesini gerektirecek kadar tehlikeli görünüyordu (bu da ona hükümdarlığına askeri bir seferle başlama fırsatı verdi). Serhas, isyanı Ocak 484 MÖ'de bastırdı ve isyan sırasında öldürüldüğü bildirilen önceki satrap Pherendates'in yerine öz kardeşi Ahameniş'i Mısır satrapı olarak atadı. Mısır isyanının bastırılması, Darius tarafından önceki üç yılda seferber edilen orduyu tüketti. Bu nedenle Serhas, Yunanistan'a yapacağı sefer için başka bir ordu kurmak zorunda kaldı ve bu sefer dört yıl daha sürdü. Ayrıca, hükümdarlığı sırasında en az iki kez Serhas'a karşı ayaklanan Babil'de de huzursuzluk vardı. İlk isyan MÖ 484 yılının Haziran veya Temmuz aylarında patlak verdi ve Bel-shimanni adında bir isyancı tarafından yönetildi. Bel-shimanni'nin isyanı kısa sürdü; onun hükümdarlığı sırasında yazılan Babil belgeleri yalnızca iki haftalık bir dönemi kapsar.",
      "İki yıl sonra Babil'de Şamaş-eriba adında başka bir isyancı lider ortaya çıktı. MÖ 482 yazında başlayan Şamaş-eriba, Babil'in kendisini ve Borsippa ve Dilbat gibi yakındaki diğer şehirleri ele geçirmişti ancak Babil'in uzun süren kuşatmasının ardından MÖ 481 Mart'ında yenilgiye uğramıştır. Babil'deki huzursuzluğun kesin nedeni belirsizdir. Vergi artışlarından kaynaklanmış olabilir. Bu isyanlardan önce Babil, Ahameniş İmparatorluğu içinde özel bir konuma sahipti; Ahameniş kralları \" Babil Kralı \" ve \" Toprakların Kralı \" unvanlarını taşıyorlardı, bu da Babil'i imparatorlukları içinde, kendi krallıklarıyla kişisel bir birlik içinde birleşmiş, biraz ayrı bir varlık olarak algıladıklarını ima ediyordu. Ancak isyanlardan sonra Serhas, unvanından \"Babil Kralı\"nı çıkardı ve daha önce büyük olan Babil satraplığını (Yeni Babil İmparatorluğu'nun topraklarının çoğunu oluşturan) daha küçük alt birimlere böldü.",
      "Klasik yazarların yazdığı metinlere dayanarak, Serhas'ın iki isyandan sonra Babil'e acımasız bir intikam aldığı sıklıkla varsayılır. Antik yazarlara göre, Serhas Babil'in surlarını yıkmış ve şehirdeki tapınaklara zarar vermiştir. Esagila'nın büyük hasara uğradığı ve Serhas'ın Marduk Heykeli'ni şehirden uzaklaştırdığı, muhtemelen İran'a götürüp erittiği (klasik yazarlar heykelin tamamen altından yapıldığını ve bu nedenle eritilmesinin mümkün olduğunu savunmaktadır). Modern tarihçi Amélie Kuhrt, Serhas'ın tapınakları yıktığının olası olmadığını, ancak bunu yaptığına dair hikâyenin Babilliler arasında Pers karşıtı bir duygudan kaynaklanabileceğine inanmaktadır. Heykelin Babil'den götürülüp götürülmediği şüphelidir ve bazıları Serhas'ın şehirden bir heykel götürdüğünü, ancak bunun tanrı Marduk'un heykeli yerine bir adamın altın heykeli olduğunu bile öne sürmüştür. Daha önceki dönemlere kıyasla bahsi oldukça az olsa da, dönemin belgeleri Babil Yeni Yıl Festivali'nin Ahameniş döneminde bir şekilde devam ettiğini göstermektedir. Babillilerin kendilerinden Perslere yönetim değişikliği ve şehrin isyanından sonra Serhas'ın şehrin seçkin ailelerinin yerini alması nedeniyle, festivalin geleneksel ritüelleri ve etkinliklerinin önemli ölçüde değişmiş olması mümkündür.",
    ] },
  { "title" = "Seferleri", "paragraphs" = [
      "Darius, Yunan anakarasına saldırmak için ikinci bir ordu hazırlama sürecindeyken öldü ve oğluna Atinalıları, Nakşalıları ve Eretrialıları İyonya Ayaklanması'na müdahaleleri, Sardis'in yakılması ve Maraton'da Perslere karşı kazandıkları zafer nedeniyle cezalandırma görevini bıraktı. Serhas başlangıçta Yunanistan ile büyük bir savaştan kaçınmak istedi, ancak kuzeni Mardonius'un önderliğindeki babasının generalleri tarafından aksi yönde ikna edildi; Mardonius onu korkaklıkla suçladı. MÖ 483'ten itibaren Serhas seferini hazırladı: Aynoroz yarımadasının kıstağından Serhas Kanalı kazıldı, Trakya'dan geçen yol üzerindeki istasyonlarda erzak depolandı ve daha sonra Serhas Ponton Köprüleri olarak bilinen iki duba köprüsü Hellespont'a inşa edildi. Serhas'ın ordularında, çok etnikli devasa imparatorluğunun her yerinden ve ötesinden, Medler, Sakalar, Elamlılar, Asurlular, Fenikeliler, Babilliler, Mısırlılar, Yahudiler, Araplar, Makedonlar, Trakyalılar, Payonyalılar, Aka Yunanları, İyon Yunanları, Ege Yunanları, Aiolis Yunanları, Pontus Yunanlıları, Kolhisyalılar, Sindhiler ve daha birçok milletten asker görev yaptı.",
      "Yunan tarihçi Herodot'a göre, Serhas'ın Çanakkale Boğazı'nı geçme girişiminin ilki, fırtınanın köprülerin keten ve papirüs halatlarını tahrip etmesiyle başarısızlıkla sonuçlandı. Buna karşılık Serhas, Çanakkale Boğazı'nı (boğazın kendisini) üç yüz kez kırbaçlattı ve suya Bacak kelepçeleri attırdı. Serhas'ın Çanakkale Boğazı'nı geçme girişiminin ikincisi başarılı oldu. Kartaca'nın Sicilya'yı işgali, Yunanistan'ı Siraküza ve Agrigento'nun güçlü hükümdarlarının desteğinden mahrum bıraktı; antik kaynaklar Serhas'in sorumlu olduğunu varsayarken, modern araştırmalar şüphecidir. Ayrıca, birçok küçük Yunan devleti, özellikle Tesalya, Teb ve Argos, Perslerin tarafını tuttu. Serhas ilk savaşlarda zafer kazandı.",
      "Serhas MÖ 480 yılının baharında yola çıktı. Sardis'ten, Herodot'un yaklaşık bir milyon kişi olduğunu tahmin ettiği bir filo ve ordu ile birlikte Ölümsüzler olarak adlandırılan 10.000 seçkin savaşçıyla birlikte geldiler. Daha yeni tahminler Pers kuvvetini yaklaşık 60.000 savaşçı olarak göstermektedir.",
    ] },
]

[articles.ko]
text = "크세르크세스 1세 또는 크세르크세스 대제(그리스어: Ξέρξης, 페르시아어: خشایارشا, 기원전 519년경 ~ 기원전 465년)은 페르시아 제국 아케메네스 왕조의 황제로 기원전 486년부터 기원전 465년까지 페르시아를 통치했다. \"크세르크세스\"라는 이름은 고대 페르시아의 왕위를 그리스식으로 표현한 것으로 그 뜻은 '영웅들의 지배자'라는 뜻이다."
title = "크세르크세스 1세"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%ED%81%AC%EC%84%B8%EB%A5%B4%ED%81%AC%EC%84%B8%EC%8A%A4_1%EC%84%B8"
intro = [
  "크세르크세스 1세 또는 크세르크세스 대제(그리스어: Ξέρξης, 페르시아어: خشایارشا, 기원전 519년경 ~ 기원전 465년)은 페르시아 제국 아케메네스 왕조의 황제로 기원전 486년부터 기원전 465년까지 페르시아를 통치했다.",
  "\"크세르크세스\"라는 이름은 고대 페르시아의 왕위를 그리스식으로 표현한 것으로 그 뜻은 '영웅들의 지배자'라는 뜻이다. 개역개정 성경에서는 아하수에로라 한다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "기원전 486년 10월 다리우스 1세가 죽자 뒤를 이어 즉위한 그는 곧바로 이집트에서 2년간 끌어오던 반란의 진압에 나섰다. 무자비하게 이집트의 반란을 진압하고 자신의 동생을 이집트 총독에 임명하고 혹독하게 다스렸다. 선왕의 다리우스의 유화책에 비해 그는 훨씬 더 강경한 정책으로 제국을 다스렸는데 특히 바빌로니아에서 일어난 반란을 진압할 때는 신전을 파괴하고 바빌로니아 왕의 상징으로 간주되는 황금 신상인 마르둑을 파괴했는데 이것은 그가 바빌로니아의 왕의 지위를 거부하는 것을 의미한다. 그는 자신의 칭호를 \"페르시아와 메디아의 왕\"으로만 표현하고 이집트와 바빌로니아의 왕을 빼기도 했다.",
      "영토 내의 반란을 진압하고 평정을 되찾자 그는 선왕이 끝내 이루지 못한 그리스 정벌을 준비한다. 그는 다리우스가 생전에 마라톤 전투에서 그리스에게 패한 것을 복수하기 위한 전쟁 준비에 들어갔다. 기원전 484년부터 481년까지 그는 3년에 걸쳐 철저하게 전쟁을 준비했는데 모든 영토로부터 병력을 징발하고 해군 수송 선단을 만들었다. 헤로도토스에 따르면 이때의 전쟁 준비를 일찍이 볼 수 없었던 대규모의 것이었다고 하며, 헤로도토스는 이때 동원된 병력을 무려 500만에 달하는 것으로 기록했다. 그러나 역사학자들은 이를 지나치게 과장된 숫자라고 주장하며, 당시 동원된 병력의 수를 그리스군보다 오히려 적은 15,000명 정도로 추산하고 있다.",
      "기원전 480년 크세르크세스는 친히 대군을 이끌고 그리스를 침공했다. 헤로도토스의 기록에는 병력이 약 170만 명이라고 되어있지만 현대의 연구자들은 약 30만 명 정도라고 본다. 다르다넬스 해협을 건넌 육군은 트라키아와 마케도니아 왕국을 지나 남하하기 시작했고 테르모필레의 협곡에서 최초로 그리스 병사들과 전투가 벌어졌다. 이것이 스파르타의 정예병 300명·노예병 7000명과의 테르모필레 전투였다. 이 전투에서 승리한 크세르크세스는 아티카와 아테네까지 거침없이 정복했으나 테미스토클레스가 이끄는 그리스 해군에게 살라미스 해전에서 패했고 크세르크세스는 페르시아의 수사까지 후퇴했다. 이듬해 플라타이아 전투에서도 페르시아군은 그리스 연합군에 패하여 철수하게 되었고 페르시아 전쟁은 기원전 478년에 끝났다.",
    ] },
  { "title" = "성경에 언급된 크세르크세스", "paragraphs" = [
      "학자들은 구약성서의 에스더에 나오는 아하수에로스(히브리어: אֲחַשְׁוֵרוֹשׁ) 대왕이 바로 이 크세르크세스 1세라는 데 대체로 의견이 모이고 있다. 그러나 일부 유대인 학자들은 이 이론을 지지하지 않는다.",
    ] },
]

[articles.ru]
text = "Ксеркс I (др.-перс. 𐎧𐏁𐎹𐎠𐎼𐏁𐎠 Xšayār̥šā [xaʃajaruʃa] — «Царь героев» или «Герой среди царей», 518 — Август 465 до н."
title = "Ксеркс I"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9A%D1%81%D0%B5%D1%80%D0%BA%D1%81_I"
intro = [
  "Ксеркс I (др.-перс. 𐎧𐏁𐎹𐎠𐎼𐏁𐎠 Xšayār̥šā [xaʃajaruʃa] — «Царь героев» или «Герой среди царей», 518 — Август 465 до н. э.), широко известный как Ксеркс Великий — четвёртый шахиншах Ахеменидской державы, правивший с 486 по 465 год до н. э. Сын Дария I и Атоссы, дочери Кира II.",
]
sections = [
  { "title" = "Характеристика Ксеркса I", "paragraphs" = [
      "Вступил на престол в ноябре/декабре 486 года до н. э. в возрасте около 36 лет. По мнению греков (и римлян), Ксеркс был вял, недалёк, бесхарактерен, легко подчинялся чужому влиянию, но отличался самоуверенностью и тщеславием. Вот характеристика, данная ему Юстином:",
      "«Самого же Ксеркса всегда видели первым в бегстве, последним в сражении; он был робок в опасности и хвастлив, когда ему ничто не угрожало; он, пока не испытал превратностей войны, был так самоуверен, как будто был владыкой над самой природой: он срывал горы и выравнивал овраги, некоторые моря перекрывал мостами, на других в целях судоходства устраивал протоки, сокращавшие путь».",
      "Восточные источники изображают совершенно другую личность. Они изображают Ксеркса мудрым государственным деятелем и опытным воином. Сам Ксеркс в надписи, найденной около Персеполя (впрочем, по существу, являющейся лишь копией надписи Дария I), заявляет, что он мудр и деятелен, друг правде и враг беззаконию, защищает слабого от притеснений сильного, но и сильного оберегает от несправедливости со стороны слабого, умеет владеть своими чувствами и не принимает поспешных решений, наказывает и вознаграждает каждого в соответствии с его проступками и заслугами. Он также говорит о своих высоких физических качествах воина; по крайней мере эта часть его апологии не находится в противоречии с сообщением Геродота о том, что Ксеркс, когда он стал царём, был высоким, статным, красивым человеком в расцвете лет.",
    ] },
  { "title" = "Начало правления. Покорение восставших народов", "paragraphs" = [
      "В январе 484 года до н. э. Ксерксу удалось подавить возглавляемое Псамметихом IV восстание в Египте, которое началось ещё при жизни его отца. Египет подвергся безжалостной расправе, имущество многих храмов было конфисковано. Взамен Ферендата, по-видимому, погибшего во время восстания, Ксеркс назначил сатрапом Египта своего брата Ахемена. Согласно Геродоту, Египет подвергся ещё большему игу, чем раньше.",
      "С этих пор участие коренных жителей в управлении страны ещё более ограничивается — их допускают только на низшие должности; и Ксеркс, и последующие персидские цари не удостаивают вниманием египетских богов. Правда, в хаммаматских каменоломнях начертано иероглифами имя Ксеркса, но материал этот царь добывал не для египетских храмов, а для своих построек в Персии, доставляя его по морю. В отличие от своих предшественников, Ксеркс и последующие за ним цари не считали нужным принимать фараоновские титулы — до нас дошли только написанные иероглифами в картушах их персидские имена.",
      "Затем пришлось усмирять Вавилон, снова решившийся на восстание. Ктесий сообщает, что это восстание вспыхнуло в начале царствования и было вызвано кощунственным открытием гробницы некоего Белитана (Элиан говорит, что это была гробница Бэла), а затем усмирено Мегабизом, зятем Ксеркса и отцом Зопира. Страбон, Арриан, Диодор говорят также о святотатствах Ксеркса в вавилонских храмах, причём Арриан датирует их временем после возвращения Ксеркса из Греции.",
    ] },
  { "title" = "Поход в Грецию", "paragraphs" = [
      "К концу 80-х годов ситуация в Персии стабилизировалась, и Ксеркс стал энергично готовиться к новому походу против Греции. В течение нескольких лет велись работы по сооружению канала (длиной 12 стадий, более 2 км) через перешеек на Халкидике, чтобы избежать обхода Афонского мыса, где погиб флот Мардония. Также был построен мост и через реку Стримон. На строительство согнали многочисленных работников из Азии и прилегающего побережья. Вдоль берегов Фракии создали продовольственные склады, через Геллеспонт переброшены два понтонных моста длиной по 7 стадиев (около 1300 м) каждый.",
      "Велась и дипломатическая подготовка к походу; послы и агенты Ксеркса были направлены в различные государства Балканской Греции и даже в Карфаген, которому следовало военными действиями отвлечь греков Сицилии от участия в войне с Персией.",
      "К подготовке похода Ксеркс привлёк находившихся при его дворце видных греческих беглецов. Аргос и Фессалия изъявили покорность Персии. Во многих греческих городах, не исключая и Афины, имелись сильные проперсидские группировки. Жители Крита отказались помогать эллинам, а жители Керкиры заняли выжидательную позицию.",
    ] },
  { "title" = "Продолжение военных действий на территории персов", "paragraphs" = [
      "По преданию, Фемистокл предложил сразу же после Саламинского боя направить флот к Геллеспонту, чтобы уничтожить построенные там Ксерксом мосты и, таким образом, отрезать персам путь к отступлению. Этот план был отвергнут, однако вскоре греческий флот начал операции против островов Кикладского архипелага, сотрудничавших с персами. К командующему греческим флотом явились тайные послы от жителей острова Самос, ещё оставшихся под контролем персов, с призывом поддержать готовящееся восстание ионийских греков. Самосцы освободили 500 афинских пленных, увезённых персами.",
      "В августе 479 года до н. э. греческий флот подошёл к мысу Микале невдалеке от Милета. Греки высадились на берег и часть их стала продвигаться вглубь страны. Командовавший персидским 15-тысячным корпусом Тигран напал на половину греческой армии, оставшуюся на берегу, но потерпел поражение и сам погиб в этом сражении. Ионяне — самосцы и милетяне, находившиеся в рядах персов, активно помогали своим соплеменникам. Победив на суше, греки уничтожили стоявший поблизости персидский флот; все корабли были сожжены, после того как добычу предварительно вынесли на берег. По преданию битва при Микале произошла в тот же день когда греки разбили персов при Платеях. Битва при Микале, хотя и была не столь грандиозной, как предшествовавшие ей, но она освободила Эгейское море для действий греческого флота. В общегреческий союз были приняты Самос, Хиос, Лесбос и некоторые другие острова, жители которых принесли клятву верности общему делу.",
      "После победы при Микале греческий флот направился к Геллеспонту. Оказалось, что построенные по приказу Ксеркса мосты уже разрушены самими персами. Спартанцы отправились домой, а афиняне и союзные греки Малой Азии, под командованием Ксантиппа осадили город Сест, где укрепились персы. Весной 478 года до н. э. Сест был захвачен греками, а руководивший его обороной персидский сатрап Артаикт предан казни. После афиняне тоже отплыли домой.",
    ] },
]

[articles.vi]
text = "Khsayarsha/Xerxes I của Ba Tư (trong tiếng Ba Tư: Khashayarsha (خشایارشا) ‎)) là một vị vua Ba Tư (trị vì:485-465 TCN), thuộc nhà Achaemenid. Xérxēs (Ξέρξης) là dạng từ tiếng Hy Lạp của tên niên hiệu Xšayāršā, trong tiếng Ba Tư cổ có nghĩa là vua của các anh hùng\"."
title = "Xerxes I"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Xerxes_I"
intro = [
  "Khsayarsha/Xerxes I của Ba Tư (trong tiếng Ba Tư: Khashayarsha (خشایارشا) ‎)) là một vị vua Ba Tư (trị vì:485-465 TCN), thuộc nhà Achaemenid. Xérxēs (Ξέρξης) là dạng từ tiếng Hy Lạp của tên niên hiệu Xšayāršā, trong tiếng Ba Tư cổ có nghĩa là vua của các anh hùng\". Xerxes cũng được biết đến như Xerxes Đại đế.",
]
sections = [
  { "title" = "Sự nghiệp chính trị", "paragraphs" = [
      "Xerxes là con của Darius Đại đế và Atossa, con gái của Cyrus Đại đế. Sau lễ đăng quang của ông vào tháng 10 năm 485 TCN, ông đã đàn áp cuộc khởi nghĩa ở Ai Cập và Babylon nổ ra trước đó và chỉ định em trai ông, Achaemenes là tỉnh trưởng (satrap) của Ai Cập (tiếng Ba Tư cổ: khshathrapavan). Năm 484 TCN, ông lấy từ Babylon bức tượng vàng của Bel (Marduk, Merodach), hai tay của bức tượng mà mọi vị vua hợp pháp của Babylon phải cầm lấy vào ngày thứ nhất trong mỗi năm, và ông đã giết chết vị thầy tế cố ngăn ông lại. Cho nên Xerxes không mang hiệu vua của người Babylon trong triều đại ông, nhưng mang danh hiệu Vua Ba Tư và Media hay đơn giản vua của các quốc gia (nghĩa bóng là của cả thế giới). Hành động này của Xerxes dẫn đến 2 cuộc nổi loạn, có thể trong 484 TCN và 479 TCN.",
      "Mùa xuân năm 480 TCN:Sau khi được chuẩn bị chu đáo, quân đội Ba Tư đổ bộ lên lãnh thổ Hy Lạp. Họ chiến thắng trong trận chiến tại Thermopylae, Artemisium và Athenia.",
      "Mùa thu năm 480 TCN:Sau thất bại thảm hại tại Salamis, Xerxes cho rút quân về nước. Đạo quân của tướng Mardonius - anh rể Xerxes vẫn đóng trên đất Hy Lạp.",
    ] },
  { "title" = "Xem thêm", "paragraphs" = [
      "Serse, an opera by George Frideric Handel with a similar libretto to that set by Cavalli.",
    ] },
  { "title" = "Tham khảo", "paragraphs" = [
      "Herodotus, The Persian War. Translated by George Rawlinson, Introduction by Francis R.B. Godolphin (1942 edition)",
      "A.T. Olmstead, 1948. History of the Persian Empire (University of Chicago Press) pp. 214ff.",
      "Farrokh, Kaveh (2007). Shadows in the Desert: Ancient Persia at War. Osprey Publishing. ISBN 1846031087.",
    ] },
]

[articles.id]
text = "Ahasyweros I atau Xerxes I (bahasa Persia Kuno: 𐎧𐏁𐎹𐎠𐎼𐏁𐎠 Xšaya-ṛšā, bahasa Persia: [خشایارشا] Galat: {{Lang}}: text has italic markup (bantuan) Ḫšayāršā, bahasa Ibrani: אֲחַשְׁוֵרוֹשׁ, Modern ʼAḥašvērōš Tiberias ʼĂḥašwērôš), adalah Raja Diraja (Kaisar) Iran dan Firaun Mesir dari Dinasti Akhemeniyah, berkuasa pada 486 sampai 465 SM. Xerxes adalah putra dari Darius I dari Persia dan Atosa, putri Koresy Agung."
title = "Ahasyweros I dari Persia"
lang = "id"
url = "https://id.wikipedia.org/wiki/Ahasyweros_I_dari_Persia"
intro = [
  "Ahasyweros I atau Xerxes I (bahasa Persia Kuno: 𐎧𐏁𐎹𐎠𐎼𐏁𐎠 Xšaya-ṛšā, bahasa Persia: [خشایارشا] Galat: {{Lang}}: text has italic markup (bantuan) Ḫšayāršā, bahasa Ibrani: אֲחַשְׁוֵרוֹשׁ, Modern ʼAḥašvērōš Tiberias ʼĂḥašwērôš), adalah Raja Diraja (Kaisar) Iran dan Firaun Mesir dari Dinasti Akhemeniyah, berkuasa pada 486 sampai 465 SM. Xerxes adalah putra dari Darius I dari Persia dan Atosa, putri Koresy Agung.",
  "Xerxes I terkenal dalam sejarah Barat karena invasinya ke Yunani pada 480 SM. Pasukannya untuk sementara menguasai daratan Yunani di utara Tanah Genting Korintus sampai kekalahan di Salamis dan Plataea setahun kemudian dan mengakhiri pendudukan. Namun, Xerxes berhasil menumpas pemberontakan di Mesir dan Babil. Xerxes juga mengawasi penyelesaian berbagai proyek konstruksi di Susan dan Parsa.",
]
sections = [
  { "title" = "Nama", "paragraphs" = [
      "Nama Xerxes diturunkan dari namanya dalam bahasa Iran kuno, Xšaya-ṛšā (penguasa atas para pahlawan), yang tersusun dari xšaya \"berkuasa\" dan ṛšā \"pahlawan, manusia\". Nama Xerxes dalam bahasa Akkadia adalah Ḫi-ši-ʾ-ar-šá dan dalam bahasa Aram adalah ḥšyʾrš. Xerxes kemudian menjadi nama yang populer digunakan oleh penguasa Dinasti Akhemeniyah pada masa-masa setelahnya.",
      "Ahasyweros berasal dari ejaan resmi yang digunakan Alkitab (kitab suci Kristen) Bahasa Indonesia Terjemahan Baru, terjemahan dari bahasa Ibrani אֲחַשְׁוֵרוֹשׁ ʼĂḥašwērôš. Dipercaya bentuk nama ini juga turunan dari namanya dalam bahasa Iran kuno Xšaya-ṛšā, diturunkan ke dalam bahasa Babilonia Aḥšiyaršu, kemudian menjadi Akšiwaršu, diturunkan dalam bahasa Ibrani menjadi Ăḥašwêrôš.",
    ] },
  { "title" = "Penulisan sejarah", "paragraphs" = [
      "Sebagian besar citra buruk Xerxes disebabkan oleh propaganda raja Makedonia Aleksander Agung (berkuasa 336–323 SM). Sejarawan modern Richard Stoneman menganggap penggambaran Xerxes lebih bernuansa tragis dalam karya sejarawan Yunani kontemporer Herodotos. Namun, banyak sejarawan modern setuju bahwa Herodotos mencatat informasi palsu. Pierre Briant mendakwanya menyajikan penggambaran stereotip dan bias dari Persia. Banyak tablet tanah liat era Akhemeniyah dan laporan lain yang ditulis dalam bahasa Elam, Akkadia, Mesir, dan Aram sering bertentangan dengan laporan penulis klasik Yunani dan Latin, yaitu Ktesias, Plutarkhos, dan Yustinus Frontinus.",
    ] },
  { "title" = "Awal kehidupan", "paragraphs" = [
      "Ayah Xerxes adalah Darius Agung, Raja Diraja Iran yang berkuasa pada 522 SM – 486 SM. Ibu Xerxes adalah Atosa, putri Koresy Agung, Raja Diraja Iran pertama dari kalangan bangsa Persia, berkuasa pada 550 SM – 530 SM. Darius dan Atosa menikah pada 522 SM dan Xerxes lahir sekitar tahun 518 SM.",
      "Catatan dialog antara Sokrates dan Alkibiades menggambarkan pendidikan dan pengajaran khas pangeran Persia. Mereka dibesarkan oleh para kasim. Saat mencapai usia 7 tahun, mereka belajar berkuda dan berburu; pada usia 14, mereka diajar oleh empat guru keturunan bangsawan, yang mengajari mereka bagaimana menjadi \"bijaksana, adil, berhati-hati, dan berani.\" Pangeran Persia juga diajari tentang dasar-dasar agama Zoroastrian, untuk jujur, menahan diri, dan berani. Dialog lebih lanjut menambahkan bahwa \"ketakutan, bagi orang Persia, sama dengan perbudakan.\" Pada usia 16 atau 17 tahun, mereka memulai \"dinas nasional\" mereka selama 10 tahun, termasuk berlatih memanah dan lembing, bersaing memperebutkan hadiah, dan berburu. Setelah itu mereka bertugas di militer selama sekitar 25 tahun dan kemudian diangkat ke status penatua dan penasihat kaisar.",
      "Catatan tentang pendidikan di kalangan elit Persia ini didukung oleh penggambaran dari Xenophon tentang pangeran Akhemeniyah abad ke-5 SM, Koresy Muda, yang sangat dikenalnya dengan baik. Stoneman berpendapat bahwa ini adalah jenis asuhan dan pendidikan yang diberikan pada Xerxes. Tidak diketahui apakah Xerxes pernah belajar membaca atau menulis, lantaran bangsa Persia lebih menyukai sejarah lisan daripada sastra tertulis. Stoneman berpendapat bahwa pengasuhan dan pendidikan Xerxes mungkin tidak jauh berbeda dengan para raja diraja Iran di kemudian hari, seperti Abbas Agung, Raja Diraja Iran dari Dinasti Safawi yang berkuasa pada abad ke-17 M. Mulai dari 498 SM, Xerxes tinggal di istana kerajaan Babil.",
    ] },
  { "title" = "Menggalang kekuatan", "paragraphs" = [
      "Setelah penobatan Xerxes, masalah muncul di beberapa wilayahnya. Sebuah pemberontakan terjadi di Mesir, tampak cukup berbahaya bagi Xerxes untuk secara pribadi memimpin pasukan, tapi juga memberinya kesempatan untuk memulai pemerintahan dengan kampanye militer. Xerxes menekan pemberontakan pada Januari 484 SM, dan mengangkat saudara kandungnya Haxamanisy (Akhaemenes) sebagai satrap (gubernur) Mesir, menggantikan Farnadata (Pherendates) yang dilaporkan tewas selama pemberontakan. Memadamkan pemberontakan Mesir menghabiskan tentara yang telah dihimpun Darius selama tiga tahun sebelumnya. Oleh karena itu, Xerxes harus membentuk pasukan lain untuk ekspedisinya ke Yunani, dan ini memakan waktu empat tahun. Di Babil, setidaknya terjadi dua kali pemberontakan melawan Xerxes. Pemberontakan pertama pecah pada bulan Juni atau Juli 484 SM dan dipimpin oleh seorang pemberontak bernama Bel-syimanni. Pemberontakan Bel-syimmani berumur pendek, yakni sekitar dua pekan sebagaimana tertulis dalam berkas Babilonia.",
      "Dua tahun kemudian, muncul kembali pemberontakan di Babil, kali ini dipimpin Syamasy-eriba. Dimulai pada musim panas 482 SM, Syamasy-eriba merebut Babil itu sendiri dan kota-kota terdekat lainnya, seperti Borsippa dan Dilbat, dan baru dikalahkan pada Maret 481 SM setelah pengepungan panjang Babil. Penyebab pasti kerusuhan di Babil tidak pasti, tetapi kemungkinan masalah kenaikan pajak. Sebelum pemberontakan ini, Babil memiliki kedudukan khusus dalam Kekaisaran Akhemeniyah. Salah satu gelar resmi dari para Raja Diraja Akhemeniyah adalah \"Raja Babil\", memandang Babilonia sebagai negara terpisah dari Iran, hanya saja dipimpin orang yang sama. Xerxes kemudian gelarnya sebagai Raja Babil, sebagai bentuk penyatuan Babilonia dengan Kekaisaran Iran secara entitas kenegaraan. Dia kemudian membagi Babilonia yang sebelumnya berupa kesatrapan (provinsi) besar, menjadi beberapa sub-unit yang lebih kecil.",
      "Dari naskah para penulis klasik, Xerxes sering dipandang melakukan pembalasan brutal terhadap Babil setelah dua pemberontakan. Menurut penulis kuno, Xerxes menghancurkan benteng Babil dan merusak kuil-kuil di kota. Esagila (kuil Dewa Marduk) diduga mengalami kerusakan besar dan Xerxes diduga membawa patung Marduk dari kota, mungkin membawanya ke Iran dan mencairkannya (penulis klasik berpendapat bahwa patung itu seluruhnya terbuat dari emas sehingga memungkinkan untuk dicairkan). Sejarawan modern Amélie Kuhrt menganggap tidak mungkin Xerxes menghancurkan kuil-kuil dan percaya bahwa kisah tentang hal tersebut mungkin berasal dari sentimen anti-Persia di antara orang Babilonia. Diragukan apakah patung itu dipindahkan dari Babil sama sekali dan beberapa bahkan menyarankan bahwa Xerxes memang memindahkan sebuah patung dari kota, tetapi ini adalah patung emas seorang pria dan bukan patung Dewa Marduk. Meskipun penyebutannya sangat kurang dibandingkan dengan periode sebelumnya, berkas kontemporer menunjukkan bahwa Perayaan Tahun Baru Babilonia berlanjut dalam beberapa bentuk selama masa Akhemeniyah. Lantaran perubahan pemerintahan dari Babilonia sendiri ke Persia dan karena penggantian keluarga elit kota oleh Xerxes setelah pemberontakan, ada kemungkinan bahwa ritual dan acara perayaan tradisional telah banyak berubah.",
    ] },
]

