[articles.en]
text = "Richard I, known as Richard the Lionheart or Richard Cœur de Lion because of his reputation as a great military leader and warrior, was King of England from 1189 until his death in 1199. He also ruled as Duke of Normandy, Aquitaine, and Gascony; Lord of Cyprus; Count of Poitiers, Anjou, Maine, and Nantes; and was overlord of Brittany at various times during the same period."
title = "Richard I of England"
lang = "en"
url = "https://en.wikipedia.org/wiki/Richard_I_of_England"
intro = [
  "Richard I (8 September 1157 – 6 April 1199), known as Richard the Lionheart or Richard Cœur de Lion (Old Norman French: Quor de Lion) because of his reputation as a great military leader and warrior, was King of England from 1189 until his death in 1199. He also ruled as Duke of Normandy, Aquitaine, and Gascony; Lord of Cyprus; Count of Poitiers, Anjou, Maine, and Nantes; and was overlord of Brittany at various times during the same period. He was the third of five sons of Henry II of England and Eleanor of Aquitaine and was therefore not expected to become king, but his two elder brothers predeceased their father.",
  "By the age of 16, Richard had taken command of his own army, putting down rebellions in Poitou against his father. Richard was an important Christian commander during the Third Crusade, leading the campaign after the departure of Philip II of France. Despite achieving several victories against his Muslim counterpart, Saladin, he was ultimately forced to end his campaign without retaking Jerusalem.",
  "Richard probably spoke both French and Occitan, and based on the testimony of Roger of Howden, most likely understood Middle English. He was born in England, where he spent his childhood; before becoming Duke of Aquitaine, however, he lived most of his adult life in the Duchy of Aquitaine, in the southwest of France. Following his accession to the crown of England, he spent very little time, perhaps as little as six months, in England. Most of his reign was spent on Crusade, in captivity, or actively defending the French portions of the Angevin Empire. Though regarded as a model king and a paragon of chivalry during the four centuries after his death and viewed as a pious and chivalrous hero by his subjects, he was later perceived by historians as a ruler who treated the kingdom of England merely as a source of revenue for his armies rather than a land entrusted to his stewardship. This \"Little England\" view of Richard has come under increasing scrutiny from modern scholars who regard it as anachronistic and point out his wider continental responsibilities as a ruler. Richard I is an enduring iconic figure both in England and in France.",
]
sections = [
  { "title" = "Early life and accession in Aquitaine", "paragraphs" = [
      "Richard was born on 8 September 1157, probably at Beaumont Palace, in Oxford, England, son of King Henry II of England and Eleanor of Aquitaine. He was the younger brother of William, Henry the Young King, and Matilda; William died before Richard's birth. As a younger son of Henry II, Richard was not expected to ascend the throne. Four more children were born to King Henry and Queen Eleanor: Geoffrey, Eleanor, Joan, and John. Richard also had two half-sisters from his mother's first marriage to Louis VII of France: Marie and Alix.",
      "Richard is often depicted as his mother's favourite son. His father's Angevin-Norman lineage made Richard the great-great-grandson of William the Conqueror. Contemporary historian Ralph de Diceto traced his family tree through Matilda of Scotland to the Anglo-Saxon kings of England, including Alfred the Great. From there, legend linked them to Noah and Woden. According to Angevin family tradition, their ancestry even contained 'infernal blood': they claimed descent from the fairy, or female demon, Melusine.",
      "While his father visited his lands from Scotland to France, Richard probably spent his childhood in England. His first recorded visit to the European continent was in May 1165, when his mother took him to Normandy. His wet nurse was Hodierna of St Albans, to whom he gave a generous pension after he became king. Little is known about Richard's education. Although he was born in Oxford and brought up in England up to his eighth year, it is not known to what extent he used or understood English; he was an educated man who composed poetry and wrote in Limousin (lenga d'òc) and also in French.",
    ] },
  { "title" = "King and crusader", "paragraphs" = [
      "Richard I was officially invested as Duke of Normandy on 20 July 1189 and crowned king in Westminster Abbey on 3 September 1189. Tradition barred all Jews and women from the investiture, but some Jewish leaders arrived to present gifts to the new king. According to Ralph of Diceto, Richard's courtiers stripped and flogged the Jews, then flung them out of court.",
      "When a rumour spread that Richard had ordered all Jews to be killed, the people of London attacked the Jewish population. Many Jewish homes were destroyed by arsonists, and several Jews were forcibly converted. Some sought sanctuary in the Tower of London, and others managed to escape. Among those killed was Jacob of Orléans, a respected Jewish scholar. Roger of Howden, in his Gesta Regis Ricardi, claimed that the jealous and bigoted citizens started the rioting, and that Richard punished the perpetrators, allowing a forcibly converted Jew to return to his native religion. Baldwin of Forde, Archbishop of Canterbury, reacted by remarking, \"If the King is not God's man, he had better be the devil's\".",
      "Offended that he was not being obeyed, and aware that the attacks could destabilise his realm on the eve of his departure on crusade, Richard ordered the execution of those responsible for the most heinous murders and persecutions, including rioters who had accidentally burned down Christian homes. He distributed a royal writ demanding that the Jews be left alone. The edict saw minimal enforcement, however, and the following March further antisemitic violence occurred, including a massacre at York.",
    ] },
  { "title" = "Life after the Third Crusade", "paragraphs" = [
      "Bad weather forced Richard's ship to put in at Corfu, in the lands of Byzantine Emperor Isaac II Angelos, who objected to Richard's annexation of Cyprus, formerly Byzantine territory. Disguised as a Knight Templar, Richard sailed from Corfu with four attendants, but his ship was wrecked near Aquileia, forcing Richard and his party into taking a dangerous land route through central Europe. On his way to the territory of his brother-in-law Henry the Lion, Richard was captured shortly before Christmas 1192 near Vienna by Leopold of Austria, who accused Richard of arranging the murder of his cousin Conrad of Montferrat. Moreover, Richard had personally offended Leopold by casting down his standard from the walls of Acre.",
      "Leopold kept Richard prisoner at Dürnstein Castle under the care of Leopold's ministerialis Hadmar of Kuenring. This mishap was soon known in England, but the regents were for some weeks uncertain of his whereabouts. While in prison, Richard wrote the musical piece Ja nus hons pris or Ja nuls om pres (\"No man who is imprisoned\"), which is addressed to his half-sister Marie. He wrote the song, in French and Occitan versions, to express his feelings of abandonment by his people and his sister. The detention of a crusader was contrary to public law, and on these grounds Pope Celestine III excommunicated Leopold.",
      "On 28 March 1193, Richard was brought to Speyer and handed over to Holy Roman Emperor Henry VI, who imprisoned him in Trifels Castle. The Emperor was aggrieved by the support the Plantagenets had given to the family of Henry the Lion and by Richard's recognition of Tancred in Sicily. Henry VI needed money to raise an army and assert his rights over southern Italy and continued to hold Richard for ransom. Nevertheless, to Richard's irritation, Pope Celestine hesitated to excommunicate Henry VI, as he had Duke Leopold, for the continued wrongful imprisonment of Richard. He famously refused to show deference to the Emperor and declared to him, \"I am born of a rank which recognises no superior but God\". The King was at first shown a certain measure of respect, but later, at the prompting of Philip of Dreux, Bishop of Beauvais and Philip of France's cousin, the conditions of Richard's captivity worsened, and he was kept in chains, \"so heavy\", Richard declared, \"that a horse or ass would have struggled to move under them\".",
    ] },
  { "title" = "Character", "paragraphs" = [
      "Contemporaries considered Richard as both a king and a knight famed for personal martial prowess; this was, apparently, the first such instance of this combination. He was known as a valiant, competent military leader and individual fighter who was courageous and generous. At the same time, he was considered prone to the sins of lust, pride, greed and, above all, excessive cruelty. Ralph of Coggeshall, summarising Richard's career, deplores that the King was one of \"the immense cohort of sinners\". He was criticised by clergy chroniclers for having taxed the clergy both for the Crusade and for his ransom, whereas the church and the clergy were usually exempt from taxes.",
      "Richard was a patron and a protector of the trouvères and troubadours of his entourage; he was also a poet himself. He was interested in writing and music, and two poems are attributed to him. The first one is a sirventes in Old French, Dalfin je us voill desrenier, and the second one is a lament that he wrote during his imprisonment at Dürnstein Castle, Ja nus hons pris, with a version in Old Occitan and a version in Old French.",
      "In the historiography of the second half of the 20th century, much interest was shown in Richard's sexuality, in particular whether there was evidence of homosexuality. The topic had not been raised by Victorian or Edwardian historians, a fact denounced as a \"conspiracy of silence\" by John Harvey (1948). The argument primarily drew on accounts of Richard's behaviour, as well as of his confessions and penitences, and of his childless marriage. Richard did have at least one illegitimate child, Philip of Cognac, and there are reports on his sexual relations with local women during his campaigns. Historians remain divided on the question of Richard's sexuality. Harvey argued in favour of his homosexuality but has been disputed by other historians, most notably John Gillingham (1994), who argues that Richard was probably heterosexual. Flori (1999) again argued in favour of Richard's homosexuality, based on Richard's two public confessions and penitences (in 1191 and 1195) which, according to Flori, \"must have\" referred to the sin of sodomy. But Flori concedes that contemporary accounts of Richard taking women by force exist, concluding that he probably had sexual relations with both men and women. Flori and Gillingham nevertheless agree that accounts of bed-sharing do not support the suggestion that Richard had a sexual relationship with King Philip II, as other modern authors had suggested.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The second Great Seal of Richard I (1198) shows him bearing a shield depicting three lions passant-guardant. This is the first instance of the appearance of this blazon, which later became established as the Royal Arms of England. It is likely, therefore, that Richard introduced this heraldic design. In his earlier Great Seal of 1189, he had used either one lion rampant or two lions rampants combatants, arms which he may have adopted from his father.",
      "Richard is also credited with having originated the English crest of a lion statant (now statant-guardant). The coat of three lions continues to represent England on several coins of the pound sterling, forms the basis of several emblems of English national sports teams (such as the England national football team, and the team's \"Three Lions\" anthem), and endures as one of the most recognisable national symbols of England.",
      "Around the middle of the 13th century, various legends developed that, after Richard's capture, his minstrel Blondel travelled Europe from castle to castle, loudly singing a song known only to the two of them (they had composed it together). Eventually, he came to the place where Richard was being held, and Richard heard the song and answered with the appropriate refrain, thus revealing where the King was incarcerated.",
    ] },
]

[articles.tr]
text = "I. Richard veya Aslan Yürekli Richard (İngilizce: Richard the Lionheart, Fransızca: Richard Coeur de Lion; 8 Eylül 1157 - 6 Nisan 1199), İngiltere Krallığı'nın 1189-1199 tarihleri arasındaki kralıdır."
title = "I. Richard"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._Richard"
intro = [
  "I. Richard veya Aslan Yürekli Richard (İngilizce: Richard the Lionheart, Fransızca: Richard Coeur de Lion; 8 Eylül 1157 - 6 Nisan 1199), İngiltere Krallığı'nın 1189-1199 tarihleri arasındaki kralıdır. İngiltere Krallığı'nı 1154 ve 1485 yılları arasında yöneten Fransız asıllı Plantagenet Hanedanı'na mensup olan I. Richard, İngiltere Krallığı'nın tamamını ve Fransa'nın yarısını kapsayan bir bölgeye egemen olan Angevin İmparatorluğu'nun da hükümdarıydı.",
  "Konuşma dili olarak Fransızca ile yetişkin hayatının çoğunu geçirdiği Akitanya Düklüğü'nde konuşulan Oksitanca konuşmaktaydı. Aslen Normandiya Fransızı olan I. Richard'ın İngilizceyi ne kadar iyi konuştuğu tam olarak bilinmemektedir. İngiltere'de doğup büyümüş olmasına rağmen on senelik hükümdarlığının yaklaşık altı ayını İngiltere'de geçirmiştir. Konuşması kısa ve tavırları sert olduğu için gününde kendisine Oksitanca Oc e No (Türkçe: Evet ve Hayır) lakabı verilmişti.",
  "Richard'a Aslan Yürekli unvanı, üstün cesaretine ve komuta kabiliyetine binaen verilmiştir. Henüz 16 yaşındayken, komutası altındaki birliklerle, babası II. Henry'ye karşı ayaklanan asileri bastırmayı başarmıştır. Üçüncü Haçlı Seferi'ne bizzat katılmış ve Fransa Kralı II. Philip'in seferden ayrılmasını takiben komutayı elden bırakmayıp Selahaddin Eyyubi ve Müslüman güçlerine karşı önemli zaferler elde etmiştir. Birçok önemli başarı elde etmesine rağmen Kudüs'ü ele geçirememiştir. Robin Hood hikâyelerinde önemli bir karakter olarak yer almıştır.",
]
sections = [
  { "title" = "Doğumu ve soyu", "paragraphs" = [
      "8 Eylül 1157 tarihinde İngiltere'nin Oxford kentindeki Beaumont Sarayı'nda doğdu. İngiltere Kralı II. Henry ve Akitanya Düşesi olan Eleanor'un beş meşru oğlundan üçüncüsüydü. O zamanki İngiliz kraliyet hanedanının diğer üyeleri gibi Norman asıllıydı.",
      "Richard, kral olmadan önceki çocukluk döneminde İngiltere'de yaşadı. Fakat yetişkin olduktan sonra hayatını, modern Fransa'nın güneybatısında olan, Akitanya Düklüğü arazilerinde geçirmiştir. Kral olduktan sonra İngiltere'de 6 aydan fazla kalmadığı belgelenmiştir. Hayatının uzun döneminde III. Haçlı Seferi için yolda ve Kutsal Topraklarda, oradan dönerken Avusturya'da tutuklu olarak veya Fransa'da kendine ait arazileri savunmak için askeri seferlerde geçirmiştir. Hükümdarı olduğu ülkeleri üzerinde krallık yapıp hüküm sürüp idare ettiği arazi saymaktaydı ve bu arazileri üzerinde vergiler toplayarak kendinin komuta ettiği askerî güce finansman sağlayan kaynaklar olarak gördüğü belirtilmektedir. Buna rağmen tebası olan halk tarafından gayet derin dini inancı olan bir hükümdar olarak görülmekteydi. İngiltere kralları arasında sonradan tarihlerde bir lakap ile (Arslan Yürekli olarak) anılan ve yalnız bir krallık numarası (I.) ile bilinmeyen tek kraldır.",
      "İngiltere Krallığı tahta çıkma yasasına göre, tahta çıkacak kral çocuğunun ölen kralın en büyük meşru yaşayan erkek çocuğu olması gerektiği için Richard, babası II. Henry'nin üçüncü oğlu olması nedeniyle gençliğinin önemli kısmında İngiltere Krallık tahtına çıkmayı beklemiyordu. Ama büyük ağabeyi olan Genç Henry önce 1183'te babası II. Henry'ye isyan etmiş ve isyanı bastırılma hazırlıkları yapılmakta iken bir ateşli hastalıktan ölmüştü. İkinci ağabeyi Geoffrey ise 1186'da Paris'te yapılan bir atlı şövalyeler turnuvası sırasında bir kaza eseri öldü. Fransa kralı II. Philippe, İngiltere tahtına hak iddia etmekteydi ve bu hakkını almak için girişimlerde bulundu. II. Philippe son girişiminde Richard'ı kızı Alice ile evlendirmeye ve bundan sonra onu varisi olarak kabul etmeye hazır olduğunu açıkladı. Bunun üzerine Richard, Fransa Kralı'na biat etti. Bu konu için yapılmakta olan müzakerelere II. Henry hasta olarak iştirak etti ve bir kesin sonuca varılmadan II. Henry 6 Temmuz 1189'da öldü. Richard babasının tek meşru varisi olduğu için İngiltere kralı oldu.",
    ] },
  { "title" = "Üçüncü Haçlı Seferi", "paragraphs" = [
      "1187 yılında Selahaddin Eyyubi'nin Kudüs'ü Haçlılardan geri aldığı haberi Avrupa'ya ulaşınca, Richard, Fransa kralı II. Philippe ile birlikte Üçüncü Haçlı seferine çıkmaya karar verdi. 1190 yazında Hristiyanlığın kutsal topraklarına doğru yola çıkan Richard önce Sicilya'yı işgal etti. Sonra Sicilya'dan ayrılarak 6 Mayıs 1191'de yol üzerindeki Kıbrıs'ı ele geçirdi. 7 Eylül 1191'de Arsuf Muharebesi'nde Selahaddin Eyyubi'nin ordularını yenmeyi başardı. Arsuf önemli bir zaferdi. Müslüman ordusu ciddi kayıplara rağmen yok edilmedi, ama bozuldu; bu Müslümanlar tarafından utanç verici kabul edildi ve Haçlıların moralini artırdı. Kasım 1191'de Yafa'nın düşüşünü takiben, Haçlı ordusu iç kısımdan Kudüs'e doğru ilerledi. Ordu daha sonra Kudüs'ten sadece 20 km uzaklıktaki Beit Nuba'ya yürüdü. Kudüs'teki Müslümanların morali o kadar düşüktü ki, Haçlıların gelişi muhtemelen şehrin hızla düşmesine neden olacaktı. Ancak, hava kötüleşti şiddetli yağmur ve dolu fırtınaları Haçlı ordusunu zor durumda bıraktı. Kuşatma sürerken Kudüs Kralı Montefferatlı Konrad, Tire'de 28 Nisan 1192 tarihinde keşiş kılığına girmiş iki haşhaşi tarafından suikast ile öldürüldü. Konrad'ın muhafızları suikastçilerden birini öldürüp diğerini sağ yakaladı. Yakalanan Haşhaşi suikastın arkasında İngiltere Kralı Richard'ın olduğunu söyledi. Richard'ın suikast ile bağlantısı kesin olarak bilinmiyor. Kudüs kuşatıldığı halde alınamadı. Haziran 1192 yılında Kudüs tekrar kuşatmaya alındı ama bu sefer Richard ve Fransa kralı Philippe arasında ayrılıklar baş gösterdi Richard hem Philip'in hem de kardeşi John'un kendisine karşı komplo kurmaya çalıştığını düşünüyordu. 2 Eylül 1192'de Selahaddin'le bir anlaşma imzaladı. 9 Ekimde İngiltere'ye dönmeye karar verdi. Kötü hava koşulları gemisini Bizans egemenliğindeki Korfu'ya…",
    ] },
  { "title" = "Son yılları", "paragraphs" = [
      "Aslan Yürekli Richard yaşamının geri kalan bölümünü Normandiya'da geçirdi. Şato Gaillard denilen bir şato inşa ettirdi. Birlikte Haçlı Seferi'ne çıktığı II. Philippe ile savaşa girişti. Limousin bölgesindeki küçük ve savunması zayıf bir kale olan Châlus-Chabrol Kalesini kuşattı. Kuşatma sırasında 26 Mart 1199'da çaylak bir okçu tarafından omzundan vuruldu. Yaranın kangren olması sonucu 6 Nisan 1199 tarihinde annesinin kollarında öldü. Ölümünden önce çaylak okçuyu bağışladı. Birçok İngiliz tarihçisi tarafından \"karıncanın aslanı öldürmesi\" olarak yorumlanır. Richard'ın ölümünden sonra Oksitan paralı asker komutanı Mercadier, onun vasiyetine uygun olmayan şekilde Richard'ı yaralayan genç askerin derisini canlı canlı yüzdürdükten sonra asarak öldürmüştür. 41 yaşında ölen Richard'ın bedeni Fransa'nın dört bir yanına dağıtılmış, iç organları okla yaralandığı Chalus Şatosu'na, kalbi Rouen'e ve bedeninin geri kalanı da Fontevraud'a gömülmüştür.",
    ] },
  { "title" = "Etkileri", "paragraphs" = [
      "10 yılı aşkın hükümdarlığı boyunca İngiltere topraklarında geçirdiği toplam süre altı aydan daha azdır. Hükümdarlığının son beş yılının tamamını ülke dışında geçirdi. Çok az İngilizce bilmekteydi ancak buna rağmen İngilizler tarafından sevilen ve hatırlanan bir liderdir. Yokluğunda kardeşi John hüküm sürdü ve onun haksız yönetimi esnasında bir halk efsanesi olarak Robin Hood doğdu.",
    ] },
]

[articles.ar]
text = "ريتشارد الأول (8 سبتمبر 1157 - 6 أبريل 1199) ملك إنجلترا منذ 6 يوليو 1189 وحتى وفاته. كما حكم كدوق لنورماندي (باسم ريتشارد الرابع) ودوق أقطانية وغاسكونية وسيد قبرص وكونت أنجو ومين ونانت وسيد عموم بريتاني على فترات أثناء عهده(1)."
title = "ريتشارد الأول ملك إنجلترا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%B1%D9%8A%D8%AA%D8%B4%D8%A7%D8%B1%D8%AF_%D8%A7%D9%84%D8%A3%D9%88%D9%84_%D9%85%D9%84%D9%83_%D8%A5%D9%86%D8%AC%D9%84%D8%AA%D8%B1%D8%A7"
intro = [
  "ريتشارد الأول (8 سبتمبر 1157 - 6 أبريل 1199) ملك إنجلترا منذ 6 يوليو 1189 وحتى وفاته. كما حكم كدوق لنورماندي (باسم ريتشارد الرابع) ودوق أقطانية وغاسكونية وسيد قبرص وكونت أنجو ومين ونانت وسيد عموم بريتاني على فترات أثناء عهده(1). وقد عُرف بلقب ريتشارد قلب الأسد، حتى قبل تتويجه بفضل سمعته كقائد عسكري ومحارب عظيم. وسمّاه المؤرخون المسلمون ملك الانكتار.",
  "في عمر السادسة عشرة، قاد ريتشارد جيشه، وأخضع التمردات على عرش أبيه هنري الثاني ملك إنجلترا في بواتو. كما كان ريتشارد القائد الرئيس خلال الحملة الصليبية الثالثة، بعد أن رحل فيليب الثاني ملك فرنسا، وحقق انتصارات معقولة على منافسه المسلم صلاح الدين الأيوبي، بالرغم من عدم استطاعته الاستيلاء على القدس.",
  "تحدث ريتشارد لهجة (Langues d'oïl) وهي لهجة غالو رومانسية، إضافة إلى القسطانية وهي لغة أيضًا رومانسية كانت منتشرة في جنوب فرنسا والمناطق القريبة منها. لم يُمض ريتشارد وقتًا طويلاً من حياته في مملكة إنجلترا، حيث عاش في دوقية أقطانية في جنوب غرب فرنسا، مفضلاً جعلها حائط صد لحماية مملكته. كان أتباعه يعتبرونه بطلاً تقيًا. كما أنه من الملوك القلائل في إنجلترا، الذي غلب لقب شهرته (ريتشارد قلب الأسد) على لقب ترتيبه (ريتشارد الأول)، كما يعتبر من أيقونات إنجلترا وفرنسا.",
]
sections = [
  { "title" = "نشأته واعتلاء عرش أقطانية", "paragraphs" = [
      "ولد ريتشارد في 8 سبتمبر 1157، من المحتمل في قصر بومونت، في أكسفورد بمملكة إنجلترا، وهو الشقيق الأصغر لويليام التاسع كونت بواتييه وهنري الملك الشاب وماتيلدا دوقة ساكسونيا. ولكونه الابن الشرعي الثالث للملك هنري الثاني ملك إنجلترا، لم يكن متوقعًا أن يعتلي العرش. كما كان شقيقًا أكبر لجيوفري الثاني دوق بريتاني وإليانور ملكة قشتالة وجوان ملكة صقلية وجون ملك إنجلترا الذي خلفه على عرش إنجلترا. أيضًا كان أخًا غير شقيق أصغر لماري كونتيسة شامبانيا وأليكس كونتيسة بلوا. توفي ويليام أكبر أبناء هنري الثاني وإليانور آكيتيان عام 1156، قبل مولد ريتشارد. غالبًا ما كان ريتشارد يوصف بأنه الابن المفضل لأمه إليانور آكيتيان. والده هنري نورماني-إنجوي ينحدر من نسل ويليام الفاتح. وقد نسب المؤرخ المعاصر لتلك الفترة رالف الديسيتوي عائلته إلى ماتيلدا ملكة إسكتلندا والملوك الأنجلوساكسونيين لإنجلترا ولألفريد العظيم، حتى نوح ووودن. ووفقًا للأسطورة الأنجوية، فإنه تجري في عروقهم دماء شيطانية.",
      "على الأرجح أنه في الوقت الذي كان أبوه يتنقل بين أراضيه من إسكتلندا إلى فرنسا، كان ريتشارد يقضي طفولته في إنجلترا. ويرجع تاريخ أول وثيقة توثق زيارته للقارة الأوربية إلى مايو 1165 م، عندما صحبته أمه إلى نورماندي. رضع ريتشارد من امرأة تدعى هوديرنا، التي منحها معاشًا كريمًا عندما أصبح ملكًا. ولا يعرف الكثير عن تعليمه. ورغم أنه ولد في أوكسفورد وتربى في إنجلترا إلى عمر الثامنة، إلا أنه من غير المعلوم إلى أي مدى استخدم أو فهم الإنجليزية. بينما من المعروف أنه كتب الشعر باللهجة الليموزية إحدى لهجات القسطانية، كما كتب بالفرنسية. تكهن عدد من المؤلفين أن ريتشارد لم يكن يعرف الإنجليزية، إلا أن الأدلة المتاحة للمؤرخين لم تكن قاطعة في هذا الشأن. ولا توجد كتابات معاصرة لتلك الفترة تذكر أن ريتشارد كان يجهل اللغة. وبالتأكيد، أثناء أسر ريتشارد استخدم شقيقه جون الإنجليزية في تعاملاته مع الأجانب لإنهاء سلطة مستشار ريتشارد ويليام لونغشامب النورماني. وفي إحدى التهم التي وجهها هيو نونات أسقف كوفنتري ضد لونغشامب، أنه لا يتحدث الإنجليزية. وهذا يدل على أنه بحلول نهاية القرن الثاني عشر، أصبح واجبًا على من في السلطة في إنجلترا، أن يكون على دراية باللغة الإنجليزية.",
      "يقال أن ريتشارد كان جذابًا للغاية، وقد كان شعره بين الأحمر والأشقر، كما كانت عينيه براقة مع بشرة شاحبة. ويرجح أن طوله كان أعلى من المتوسط، فوفقًا لكليفورد بروير، فقد كان طوله نحو 192 سم، غير أنه لا دليل على تحديد طوله على وجه الدقة. ومنذ صغر سنه، أظهر ريتشارد قدرات سياسية وعسكرية، بدت ملحوظة وواضحة عندما قاتل النبلاء المتمردين في أراضيه. وقد تُوّج أخاه الأكبر هنري ملكًا على إنجلترا بالمشاركة مع أبيه في حياة أبيه.",
    ] },
  { "title" = "ريتشارد ملكًا والحملة الصليبية", "paragraphs" = [
      "أعلن ريتشارد رسمياً دوق نورماندي في العشرين من يوليو عام 1189 ثم توّج ملكاً في دير وستمنستر في الثالث من سبتمبر من نفس العام. منع ريتشارد جميع اليهود والنساء من حضور مراسم التتويج. على الرغم من ذلك، حضر بعض قادة اليهود مقدمين له الهدايا. وفقاً للمؤرخ رالف ديكيتو، قام أتباع ريتشارد بضرب وجلد اليهود وتجريدهم مما بحوزتهم ومن ثم طردهم إلى الخارج.",
      "انتشرت شائعة بأن ريتشارد قد أمر بقتل جميع اليهود. فقام سكان لندن بارتكاب مجزرة بحقهم. تعرض الكثير منهم للضرب حتى الموت، وللسرقة، كما حرق بعضهم أحياء. هدمت العديد من منازلهم، وتعرض بعضهم للتعميد قسراً. اتخذ بعضهم من برج لندن ملاذاً، بينما فرّ الآخرون للحفاظ على حياتهم. ادّعى البعض أن مرتكبي هذه الجرائم كانوا مجرد مواطنين غيورين ومتعصبين، وأن الملك ريتشارد قام بمعاقبتهم. كما قام بالسماح لليهود الذين أجبروا على ترك دينهم بالعودة إلى اليهودية. يشار إلى أن مشاركة ريتشارد في الجرائم ضد اليهود لم يثبت قط.",
      "شعر ريتشارد بأن هذه الاعتداءات قد تزعزع من استقرار مملكته قبيل رحيله للمشاركة في الحملة الصليبية الثالثة. لذلك أمر ريتشارد بإعدام المسؤولين عن أفظع جرائم القتل والاضطهاد. من ضمنهم من أحرق بعض منازل المسيحيين عن طريق الخطأ. وأصدر مرسوماً ملكياً يطالب بترك اليهود بشأنهم وعدم الاعتداء عليهم. على الرغم من ذلك، استمرت الاعتداءات في شهر مارس مثل مجزرة يورك التي وقعت في 16 مارس 1190 والتي تعتبر واحدة من أبشع المجازر وأشرسها.",
    ] },
  { "title" = "الإرث", "paragraphs" = [
      "تقلبت سمعة ريتشارد عبر الزمن «بعنف». الصورة المعاصرة لريتشارد هي صورة الملك الفارس. عرف بكونه قائد عسكري ومقاتل باسل وكريم. إلا أن سمعته تضررت على مر العصور، وحددت النظرة الشعبية لريتشارد. فقد ترك بصمة لا تمحى على الخيال حتى وقتنا الحاضر، بسبب مآثره العسكرية. انعكس ذلك على تعليق المؤرخ ستيفين رونسيمان على ريتشارد الأول: «كان ولدًا عاقًا وزوجا سيئا وملكا سيئا، إلا أنه كان جندي باسل ورائع.» كما كتب عنه المؤرخون المسلمون خلال فترة الحروب الصليبية «لم نواجه قط خصمًا أكثر جرأة وبراعة منه.»",
      "رغم ذلك، كانت هناك صور سلبية عن ريتشارد. خلال حياته، تعرض لانتقادات من قبل المؤرخين لجمعه الضرائب من رجال الدين سواء للحملة الصليبية أو لفديته، في الوقت الذي كانت تُعفى فيه الكنيسة ورجال الدين عادةً من الضرائب. شهد العصر الفكتوري انقسام حول ريتشارد، فقد أعجب به الكثيرون على اعتبار أنه بطل صليبي ورجل الله، وشيدوا له تمثالاً بطوليًا أمام برلمان المملكة المتحدة؛ وعلى الجانب الآخر، يصفه المؤرخ ستابس بأنه «ولد عاق، وزوج سيئ، وحاكم أناني، ورجل خبيث.» وعلى الرغم من مولده في أكسفورد، فلم يتحدث الإنجليزية. وخلال عهده الذي دام عشر سنوات، لم يمكث في إنجلترا لمدة تزيد عن ستة أشهر، وغاب عنها تمامًا في الخمس سنوات الأخيرة.",
      "لم يكن لريتشارد ورثة شرعيين، فقط لديه ابن غير شرعي هو فيليب الكونجاكي. لذا، خلفه شقيقه جون ملك إنجلترا. ومع ذلك، رفضت أراضيه الفرنسية خلافة جون له، وفضلت ابن أخيه آرثر الأول دوق بريتاني ابن شقيقه الراحل جيوفري. كان عدم وجود وريث مباشر لريتشارد الخطوة الأولى تجاه حل الإمبراطورية الأنجوية. ورغم أن ملوك إنجلترا ضغطوا للمطالبة بأراضيه في القارة، إلا أنهم لم يتمكنوا أبدًا من حكمها مرة أخرى.",
    ] },
  { "title" = "هوامش", "paragraphs" = [
      "3 تناولت العديد من المؤلَّفات موضوع العلاقة بين ريتشارد وصلاح الدين الأيوبي وقيل أنها كانت علاقة تنمّ عن احترام متبادل، فقد كان ريتشارد يعتبر صلاح الدين فارسًا شهمًا يجمع صفات الشهامة والنبالة التي يُبجّلها الفرسان الأوروبيّون، وقد أرسل صلاح الدين طبيبه الخاص إلى ريتشارد عندما كان الأخير مريضًا وأرسل له حملًا من الفاكهة. وعندما فقد ريتشارد جواده في إحدى المعارك أرسل له صلاح الدين حصانًا (أو اثنين) عربيًّا مُطهَّمًا.",
    ] },
]

