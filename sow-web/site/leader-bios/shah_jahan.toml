      "Asher, Catherine Ella Blanshard (2003). The New Cambridge History of India, Vol I:4 – Architecture of Mughal India (Hardback) (Edisi First published 1992, reprinted 2001,2003). Cambridge: Cambridge University Press. hlm. 368. ISBN 0-521-26728-5.",
      "Bernier, Francois, Travels in the Mogal Empire (1656–68), revised by V.A. Smith, Archibald Constable, Oxford 1934.",
    ] },
