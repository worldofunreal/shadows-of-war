[articles.en]
text = "Shah Jahan I, also called Shah Jahan the Magnificent, was the fifth Mughal Emperor from 1628 until his deposition in 1658. His reign marked the zenith of Mughal architectural and cultural achievements."
title = "Shah Jahan"
lang = "en"
url = "https://en.wikipedia.org/wiki/Shah_Jahan"
intro = [
  "Shah Jahan I (Shahab-ud-Din Muhammad Khurram; 5 January 1592 – 22 January 1666), also called Shah Jahan the Magnificent, was the fifth Mughal Emperor from 1628 until his deposition in 1658. His reign marked the zenith of Mughal architectural and cultural achievements.",
  "The third son of Jahangir (r. 1605–1627), Shah Jahan participated in the military campaigns against the Sisodia Rajputs of Mewar and the rebel Lodi nobles of the Deccan. After Jahangir's death in October 1627, Shah Jahan defeated his youngest brother Shahryar Mirza and crowned himself emperor in the Agra Fort. In addition to Shahryar, Shah Jahan executed most of his rival claimants to the throne. He commissioned many monuments, including the Red Fort, Shah Jahan Mosque and the famous Taj Mahal, where his favorite consort Mumtaz Mahal is entombed. In foreign affairs, Shah Jahan presided over the aggressive campaigns against the Deccan sultanates, the conflicts with the Portuguese, and the wars with the Safavids. He also suppressed several local rebellions and dealt with the devastating Deccan famine of 1630–1632.",
  "In September 1657, the ailing Shah Jahan appointed his eldest son Dara Shikoh as his successor. This led to the Mughal war of succession (1658–1659) between his three sons, with Aurangzeb (r. 1658–1707) emerging victorious and becoming the sixth emperor, and executing all of his surviving brothers, including the Crown Prince Dara Shikoh. After Shah Jahan recovered from his illness in July 1658, Aurangzeb had him imprisoned inside the Agra Fort from July 1658 until his death in January 1666. He was laid to rest next to his wife in the Taj Mahal. His reign is known for abandoning the liberal policies initiated by his grandfather Akbar. During Shah Jahan's time, Islamic revivalist movements like the Naqshbandi began to shape Mughal policies.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "He was born on 5 January 1592 in Lahore, present-day Pakistan, as the ninth child and third son of Prince Salim (later known as 'Jahangir' upon his accession) and his chief consort, Jagat Gosain. The name Khurram (Persian: خرم, lit. 'joyous') was chosen for the young prince by his grandfather, Emperor Akbar, with whom the young prince shared a close relationship. Jahangir stated that Akbar was very fond of Khurram and had often told him, \"There is no comparison between him and your other sons. I consider him my true son.\"",
      "When Khurram was born, Akbar, considering him to be auspicious, insisted the prince be raised in his household rather than Salim's and was thus entrusted to the care of Ruqaiya Sultan Begum. Ruqaiya assumed the primary responsibility for raising Khurram and is noted to have raised Khurram affectionately. Jahangir noted in his memoirs that Ruqaiya had loved his son, Khurram, \"a thousand times more than if he had been her own [son].\"",
      "However, after the death of his grandfather Akbar in 1605, he returned to the care of his mother, Jagat Gosain whom he cared for and loved immensely. Although separated from her at birth, he had become devoted to her and had her addressed as Hazrat in court chronicles. On the death of Jagat Gosain in Akbarabad on 8 April 1619, he is recorded to be inconsolable by Jahangir and mourned for 21 days. For these three weeks of the mourning period, he attended no public meetings and subsisted on simple vegetarian meals. His consort Mumtaz Mahal personally supervised the distribution of food to the poor during this period. She led the recitation of the Quran every morning, and gave her husband many lessons on the substance of life and death, and begged him not to grieve.",
    ] },
  { "title" = "Marriages", "paragraphs" = [
      "In 1607, Khurram became engaged to Arjumand Banu Begum (1593–1631), who is also known as Mumtaz Mahal (Persian lit. ' The Exalted One of the Palace'). They were about 14 and 15 when they were engaged, and five years later, they married. The young girl belonged to an illustrious Persian noble family that included Abu'l-Hasan Asaf Khan, who had been serving Mughal emperors since the reign of Akbar. The family's patriarch was Mirza Ghiyas Beg, who was also known by his title I'timād-ud-Daulah or \"Pillar of the State\". He had been Jahangir's finance minister, and his son, Asaf Khan – Arjumand Banu's father – played an important role in the Mughal court, eventually serving as Chief Minister. Her aunt Mehr-un-Nissa later became the Empress Nur Jahan, chief consort of Emperor Jahangir.",
      "The prince would have to wait five years before he was married in 1612 (1021 AH), on a date selected by the court astrologers as most conducive to ensuring a happy marriage. This was an unusually long engagement for the time. However, Shah Jahan first married a Persian princess (name not known) entitled Kandahari Begum, the daughter of a great-grandson of the great Shah Ismail I of Persia, with whom he had a daughter, his first child.",
      "In 1612, aged 20, Khurram married Mumtaz Mahal, on a date chosen by court astrologers. The marriage was a happy one, and Khurram remained devoted to her. They had fourteen children, out of whom seven survived into adulthood.",
    ] },
  { "title" = "Early military campaigns", "paragraphs" = [
      "Prince Khurram showed extraordinary military talent. The first occasion for Khurram to test his military prowess was during the Mughal campaign against the Rajput state of Mewar, which had been a hostile force to the Mughals since Akbar's reign.",
      "After a year of a harsh war of attrition, Rana Amar Singh I surrendered conditionally to the Mughal forces and became a vassal state of the Mughal Empire as a result of Mughal expedition of Mewar. In 1615, Khurram presented Kunwar Karan Singh, Amar Singh's heir, to Jahangir. Khurram was sent to pay homage to his mother and stepmothers and was later awarded by Jahangir. The same year, his mansab was increased from 12000/6000 to 15000/7000, to equal that of his brother Parvez's and was further increased to 20000/10000 in 1616.",
      "In 1616, on Khurram's departure to Deccan, Jahangir awarded him the title Shah Sultan Khurram.",
    ] },
  { "title" = "Rebel prince", "paragraphs" = [
      "Inheritance in the Mughal Empire was not always determined through primogeniture, but also by princely sons competing to achieve military successes and consolidating their power at court. This often led to rebellions and wars of succession (takht ya takhta). As a result, a complex political climate surrounded the Mughal court in Shah Jahan's formative years. In 1611 his father married Nur Jahan, the widowed daughter of a Persian noble. She rapidly became an important member of Jahangir's court and, together with her brother Asaf Khan, wielded considerable influence. Arjumand was Asaf Khan's daughter, and her marriage to Khurram consolidated Nur Jahan and Asaf Khan's positions in court.",
      "Court intrigues, however, including Nur Jahan's decision to have her daughter from her first marriage wed Prince Khurram's youngest brother Shahzada Shahryar, and her support for his claim to the throne led to much internal division. Prince Khurram resented the influence Nur Jahan held over his father and was angered at having to play second fiddle to her favourite Shahryar, his half-brother and her son-in-law. When the Persians besieged Kandahar, Nur Jahan was at the helm of the affairs. She ordered Prince Khurram to march to Kandahar, but he refused. As a result of Prince Khurram's refusal to obey Nur Jahan's orders, Kandahar was lost to the Persians after a forty-five-day siege. Prince Khurram feared that in his absence, Nur Jahan would attempt to poison his father against him and convince Jahangir to name Shahryar the heir in his place. This fear brought Prince Khurram to rebel against his father rather than fight against the Persians.",
      "In 1622, Prince Khurram raised an army and marched against his father. He was defeated at Bilochpur in March 1623. Later he took refuge in Udaipur Mewar with Maharana Karan Singh II. He was first lodged in Delwada Ki Haveli and subsequently shifted to Jagmandir Palace on his request. Prince Khurram exchanged his turban with the Maharana and that turban is still preserved in Pratap Museum, Udaipur (R V Somani 1976). It is believed that the mosaic work of Jagmandir inspired him to use mosaic work in the Taj Mahal of Agra. In November 1623, he found safe asylum in Bengal Subah after he was driven from Agra and the Deccan. He advanced through Midnapur and Burdwan. At Akbarnagar, he defeated and killed the then Subahdar of Bengal, Ibrahim Khan Fath-i-Jang, on 20 April 1624. He entered Dhaka and \"all the elephants, horses, and 4,000,000 rupees in specie belonging to the Government were delivered to him\". After a short stay he then moved to Patna. His rebellion did not succeed in the end, as his attempt was foiled by Jahangir 's trusted general, Mahabat Khan. He was forced to submit unconditionally after he was defeated near Allahabad. Although the prince was forgiven for his errors in 1626, tensions between Nur Jahan and her stepson continued to grow beneath the surface.",
    ] },
  { "title" = "Illness and death", "paragraphs" = [
      "When Shah Jahan became ill in 1658, Dara Shikoh (Mumtaz Mahal's eldest son) assumed the role of regent in his father's stead, which swiftly incurred the animosity of his brothers. Upon learning of his assumption of the regency, his younger brothers, Shuja, Viceroy of Bengal, and Murad Baksh, Viceroy of Gujarat, declared their independence and marched upon Agra in order to claim their riches. Aurangzeb, the third son, gathered a well-trained army and became its chief commander. He faced Dara's army near Agra and defeated him during the Battle of Samugarh. Although Shah Jahan fully recovered from his illness, Aurangzeb declared him incompetent to rule and put him under house arrest in Agra Fort.",
      "Jahanara Begum Sahib, Mumtaz Mahal's eldest surviving daughter, voluntarily shared his 8-year confinement and nursed him in his dotage. In January 1666, Shah Jahan fell ill. Confined to bed, he became progressively weaker until, on 22 January, he commended the ladies of the imperial court, particularly his consort of later years Akbarabadi Mahal, to the care of Jahanara. After reciting the Kal'ma (Laa ilaaha ill allah) and verses from the Quran, Shah Jahan died, aged 74.",
      "Shah Jahan's chaplain Sayyid Muhammad Qanauji and Kazi Qurban of Agra came to the fort, moved his body to a nearby hall, washed it, enshrouded it, and put it in a coffin of sandalwood.",
    ] },
]

[articles.tr]
text = "Şah Cihan veya Ebû'l Muzaffer Şehâbeddin Muhammed Sâhib-kıran (Farsça: شاه جهان‎, 5 Ocak 1592 - 22 Ocak 1666), eşi Mümtaz Mahal uğruna Tac Mahal'i yaptırmasıyla tanınan ve Hindistan'da kurulmuş olan Babür İmparatorluğu'nu 1627-1658 yılları arasında yönetmiş olan beşinci Babür hükümdardır."
title = "Şah Cihan"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/%C5%9Eah_Cihan"
intro = [
  "Şah Cihan veya Ebû'l Muzaffer Şehâbeddin Muhammed Sâhib-kıran (Farsça: شاه جهان‎, 5 Ocak 1592 - 22 Ocak 1666), eşi Mümtaz Mahal uğruna Tac Mahal'i yaptırmasıyla tanınan ve Hindistan'da kurulmuş olan Babür İmparatorluğu'nu 1627-1658 yılları arasında yönetmiş olan beşinci Babür hükümdardır.",
]
sections = [
  { "title" = "Yaşam öyküsü", "paragraphs" = [
      "Doğum adı Hürrem olan Şah Cihan atası ve hanedanın kurucusu Babür Şah tarafından Timur'un, anne tarafından ise Cuci Han kanalı ile Cengiz Han'ın torunudur. Yıllarca mirasçılarından olduğu Timur İmparatorluğu'nu yeniden kurmaya çalışmış, Maveraünnehir'e defalarca seferler düzenlemiştir. Büyük atası Timur'un hayallerinin kenti Semerkant'ı üç kez geri almış, ancak kaybetmiştir. Hindistan'a sefer düzenlemiş, selefleri tarafından ise Hindistan'ın çoğu ele geçirilmiştir.",
    ] },
  { "title" = "Eşi Mümtaz Mahal ve anıt mezar Tac Mahal", "paragraphs" = [
      "Şah Cihan daha ziyade efsanevi aşkı ile tanınır. Eşi Ercüment Banu'nun babası, hem krallığın en soylularından biri hem de Şah Cihan'ın üvey annesi Nur Cihan'ın kardeşi idi. Mümtaz Mahal aslında Şah Cihan'ın üçüncü ama en sevdiği eşidir. Mümtaz Mahal on dördüncü kızları Gauhara Begüm'ü doğururken 1631 yılında ölmüştür. Bunun üzerine Şah Cihan, Agra kentinde Tac Mahal adlı efsanevi anıt mezarı yaptırmıştır. Mimari eserlerde atalarının tercih ettiği sarı kum taşı yerine Şah Cihan, tutkulu bir şekilde beyaz mermer kullanmıştır. 1632'de inşasına başlanan eser, 20 yıl sonra 1652'de tamamlanmıştır. Bu eşsiz yapıyı meydana getirenler; Mimar Sinan'ın öğrencilerinden, İsa Mehmet Çelebi ve ona yardım etmek üzere Agra'ya davet edilmiş Semerkantlı Mehmet Şerif'tir. Kubbenin yapımından sorumlu kişi yine Mimar Sinan'ın talebelerinden İsmail Çelebi'dir. Duvarlardaki mermere oyularak yazılanlar İstanbul'dan hattat Settar Efendi'nin hüneridir.",
    ] },
  { "title" = "Kültür ve sanata desteği", "paragraphs" = [
      "Şah Cihan atalarından kalan birçok sıkıntı ile yüz yüze kalmış, iç isyanlar ve hanedanlıktaki çekişmelerle mücadele etmiştir. Ancak Babür ve Timurlu kültürü açısından tartışmasız bir altın çağın yaşanmasını sağlamıştır. Döneminde birçok şair ve minyatür sanatçısına destek vermiş, Hint minyatür sanatının da Babür ekolünün inşaasını sağlamıştır. Ancak hiç kuşkusuz en büyük desteği, tutkunu olduğu mimari çalışmalara vermiştir. Ülkenin bir başından bir başına kaleler, türbeler, saraylar, camiler ve medreseler yaptırmıştır. Şahcihanabad yani bugünkü Delhi kenti de bu hükümdar tarafından kurulmuştur.",
    ] },
  { "title" = "Son dönemi", "paragraphs" = [
      "Ancak hanedan içindeki iktidar mücadelesi, onun hayattayken tahttan indirilmesine neden olmuştur. Tac Mahal'in tamamlanmasından çok kısa bir zaman sonra, akli dengesini kaybettiği gerekçesi ile oğlu Alemgir tarafından tahttan indirilerek Agra Kalesi'nde oda hapsine mahkûm edilmiştir. Rivayete göre kalan günlerini burada, küçük bir camdan Tac Mahal'i izleyerek geçirmiştir.",
      "Ölümünün ardından oğlu Evrengzib tarafından Tac Mahal'e, hayatının aşkı Mümtaz Mahal'in yanına defnedilmiştir.",
    ] },
]

[articles.zh]
text = "沙贾汉一世（烏爾都語：شاه جهان，印地語：शाह जहाँ，波斯語：شاه جهان；1592年1月5日—1666年1月22日），或譯沙賈汗、沙迦罕，第5任蒙兀兒皇帝（1628年—1658年在位）。“沙贾汉”在波斯语中的意思是世界统治者。沙贾汉在位期间，为他最喜愛的妻子已故皇后姬蔓·芭奴修筑了举世闻名的泰姬陵；後於晚年遭到軟禁。"
title = "沙贾汉"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E6%B2%99%E8%B4%BE%E6%B1%89"
intro = [
  "沙贾汉一世（烏爾都語：شاه جهان，印地語：शाह जहाँ，波斯語：شاه جهان；1592年1月5日—1666年1月22日），或譯沙賈汗、沙迦罕，第5任蒙兀兒皇帝（1628年—1658年在位）。“沙贾汉”在波斯语中的意思是世界统治者。沙贾汉在位期间，为他最喜愛的妻子已故皇后姬蔓·芭奴修筑了举世闻名的泰姬陵；後於晚年遭到軟禁。",
]
sections = [
  { "title" = "获得权力", "paragraphs" = [
      "沙贾汉是阿克巴大帝的孫子，莫卧儿帝国的皇帝贾汉吉尔的兒子。沙贾汉原名胡拉姆（Khurram，波斯語意思為「喜悅的」），母亲是印度教部族拉其普特人的公主佳噶忒·葛西妮。1622年，在胡拉姆还是王子的时候，他起兵反对他父亲的统治，但他的这场叛乱很快被镇压下去，胡拉姆得到了父親贾汉吉尔的宽恕并返回自己的领地，但是他的两个儿子，达拉·希科和奥朗则布，被送到贾汉吉尔的宫廷中作為人質。",
      "1627年贾汉吉尔去世，胡拉姆和他的兄弟沙赫里亞爾·米爾扎為了爭奪莫卧儿帝国的王位，兄弟之間爆發了戰爭，其中胡拉姆得到了岳父波斯貴族阿塞夫汗的支持，他的兄弟则得到了贾汉吉尔的遗孀努尔·贾汉的支持，最后胡拉姆获胜，登上王座并于1628年2月4日改名沙贾汉。",
    ] },
  { "title" = "成就", "paragraphs" = [
      "在沙贾汉的父亲贾汉吉尔统治的末年，莫卧儿帝国帝国开始面对一系列挑战，沙贾汉成功地应对了这些挑战并稳定了局势。他镇压了发生在艾哈迈德讷格尔的一个穆斯林叛乱，在孟加拉击退了葡萄牙人，在西部，吞并了拉吉普特人的王国巴格拉纳和本德尔肯德，在德干高原，占领了比贾布尔和戈爾康達；在西北，将自己的势力越过了开伯尔山口。但沙贾汉的穷兵黩武吸乾了帝国的财力——在他的统治下，莫卧儿帝国变成了一个巨大的戰爭机器，军事贵族和军队的数量扩大了几乎四倍，这样的急剧擴張增加了农民的负担。尽管如此，在沙贾汉统治期间，莫卧儿帝国仍在财源不足的情况下再次扩张。",
      "沙贾汉的统治所带来的另外一个好处则是促进了一些大的商业和手工业中心的出现，比如拉合尔、德里、阿格拉和亞美達巴德。这些城市和港口以及其他遥远的地方通过水陆交通紧密相连。沙贾汉自己则将首都从阿格拉迁往新建的沙賈汗納巴德（即旧德里）。在沙贾汉的统治期间，莫卧儿帝国的艺术和建筑成就到达顶峰。他为他所鍾愛的妻子慕塔芝·瑪哈在阿格拉修建了著名的泰姬陵，在德里修建了红堡，在拉合尔堡修建了著名的沙利马尔花园。",
    ] },
  { "title" = "统治的结束", "paragraphs" = [
      "沙贾汉1657年得了重病，他的几个儿子开始夺权。二儿子沙舒賈，宣布自己为孟加拉的皇帝，奥朗则布也开始挑战自己的父亲和皇太子兼皇兄達拉·希科。沙贾汉后来病愈，给与達拉·希科充分支持，并成功打败了在孟加拉称帝的沙舒賈。但最终，奥朗则布还是击败了達拉·希科。達拉·希科原打算重整旗鼓，再战奥朗则布，其手下却背叛了他将他交给奥朗则布。奥朗则布以异教徒的罪名将他的兄弟砍头，把首级送给了沙贾汉。奥朗则布甚至杀死了最小的弟弟穆拉德·巴克什，尽管他在奥朗则布和達拉·希科的战争中间支持奥朗则布。",
      "奥朗则布获取权力之后，沙贾汉被软禁在阿格拉堡的一间能够看到泰姬陵的房间里。在被拘禁的5年里，沙贾汉只有大女儿嘉罕娜拉·貝居姆的陪伴。相传沙贾汉曾经口渴想喝水，奥朗则布让他饮用墨水。",
    ] },
  { "title" = "外部链接", "paragraphs" = [
      "A Handbook to Agra and the Taj - Sikandra, Fatehpur-Sikri and the Neighbourhood by E. B. Havel (Project Gutenberg) （页面存档备份，存于互联网档案馆）",
      "Indian & Mughal History Discussions （页面存档备份，存于互联网档案馆） at History Forum （页面存档备份，存于互联网档案馆）",
    ] },
]

[articles.ar]
text = "السُّلطَانُ الأَعظَم والخَاقَانُ المُكرَّم شَاهِنشَاهِ السَّلْطَنَةِ الْهِنْدِيَّةِ والمَغُولِيَّةِ أَبُو الْمُظَفَّرِ صَاحِبقِرَان شِهَابُ الدِّينِ خُرَّم مُحمَّد شَاهجِهَان پَادِشَاه غَازِي بن مُحمَّد جِهَانكِير بن مُحمَّد أكبر الگوركاني (بالفارسية: السُّلطَانُ الأَعظَم والخَاقَانُ المُكرَّم شَاهِنشَاهِ السَّلْطَنَةِ الْهِنْدِيَّةِ والمُغَلِيَّةِ أَبُو الْمُظَفَّرِ صَاحِبقِرَان شِهَاب‌ُ الدِّینِ خُرَّم مُحمَّد شَاهجِهَان پَادِشَاه غَازِي بن مُحمَّد جِهَانكِير بن مُحمَّد أكبر گورکاني، وبالأردية: السُّلطَانُ الأَعظَم والخَاقَانُ المُكرَّم شَہِنشَاہ السَّلْطَنَةِ الْهِنْدِيَّةِ والمُغَلِيَّةِ أَبُو الْمُظَفَّرِ صَاحِبقِرَان شِہَابُ الدِّينِ خُرَّم مُحمَّد شَاہجِہَاں پَادِشَاه غَازِي بن مُحمَّد جِهَانكِير بن مُحمَّد أكبر گورکاني) (21 ربيع الأوَّل 1000هـ - 17 رجب 1076هـ المُوافق فيه 5 كانون الثاني (يناير) 1592م - 22 كانون الثاني (يناير) 1666م) المعروف اختصارًا بِـ«شاهجهان» أو «شاه جهان» أو «شاه جهان أعظم»، هو خامس سلاطين مغول الهند، وقد حكم بلاد آبائه من سنة 1037هـ المُوافقة لِسنة 1628م إلى سنة 1068هـ المُوافقة لِسنة 1658م. لقَّبه والده بِـ«شاهجهان» أي «ملك العالم» بِالفارسيَّة، وذلك…"
title = "شهاب الدين شاهجهان"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%B4%D9%87%D8%A7%D8%A8_%D8%A7%D9%84%D8%AF%D9%8A%D9%86_%D8%B4%D8%A7%D9%87%D8%AC%D9%87%D8%A7%D9%86"
intro = [
  "السُّلطَانُ الأَعظَم والخَاقَانُ المُكرَّم شَاهِنشَاهِ السَّلْطَنَةِ الْهِنْدِيَّةِ والمَغُولِيَّةِ أَبُو الْمُظَفَّرِ صَاحِبقِرَان شِهَابُ الدِّينِ خُرَّم مُحمَّد شَاهجِهَان پَادِشَاه غَازِي بن مُحمَّد جِهَانكِير بن مُحمَّد أكبر الگوركاني (بالفارسية: السُّلطَانُ الأَعظَم والخَاقَانُ المُكرَّم شَاهِنشَاهِ السَّلْطَنَةِ الْهِنْدِيَّةِ والمُغَلِيَّةِ أَبُو الْمُظَفَّرِ صَاحِبقِرَان شِهَاب‌ُ الدِّینِ خُرَّم مُحمَّد شَاهجِهَان پَادِشَاه غَازِي بن مُحمَّد جِهَانكِير بن مُحمَّد أكبر گورکاني، وبالأردية: السُّلطَانُ الأَعظَم والخَاقَانُ المُكرَّم شَہِنشَاہ السَّلْطَنَةِ الْهِنْدِيَّةِ والمُغَلِيَّةِ أَبُو الْمُظَفَّرِ صَاحِبقِرَان شِہَابُ الدِّينِ خُرَّم مُحمَّد شَاہجِہَاں پَادِشَاه غَازِي بن مُحمَّد جِهَانكِير بن مُحمَّد أكبر گورکاني) (21 ربيع الأوَّل 1000هـ - 17 رجب 1076هـ المُوافق فيه 5 كانون الثاني (يناير) 1592م - 22 كانون الثاني (يناير) 1666م) المعروف اختصارًا بِـ«شاهجهان» أو «شاه جهان» أو «شاه جهان أعظم»، هو خامس سلاطين مغول الهند، وقد حكم بلاد آبائه من سنة 1037هـ المُوافقة لِسنة 1628م إلى سنة 1068هـ المُوافقة لِسنة 1658م. لقَّبه والده بِـ«شاهجهان» أي «ملك العالم» بِالفارسيَّة، وذلك لقاء كفاءته العسكريَّة وحملاته الناجحة التي قام بها على بلاد الدكن، وسمح لهُ أن يكون الرّجُل الوحيد الذي يجلس في حضرته. لكن رُغم ذلك، شابت علاقة شاهجهان بِوالده جهانكير بضعة شوائب خِلال السنوات الأخيرة من عهد الأخير، وذلك بِفعل تدخُّل زوجة أبيه نورجهان في الحياة السياسيَّة، وعملها على إقصاء شاهجهان عن ولاية العهد وتنصيب أخيه الضعيف شهريار بدلًا منه، لكنَّ ذلك لم يُجدِ نفعًا، إذ تمكَّن شاهجهان من اعتلاء عرش المغول بُعيد وفاة أبيه، وأزاح شقيقه ومن نافسه من أعضاء البيت التيموري، بِدعمٍ من الساسة والجيش، وعفا عن كُل من ائتمر ضدَّه.",
  "واجه شاهجهان بعض المصاعب والاضطرابات في بداية عهده، لكنَّهُ تمكَّن من تذليل أغلبها، وشرع يُمكِّن دعائم دولة آبائه، فأبطل الكثير من البدع التي أدخلها جدُّه جلال الدين أكبر واستمرَّ بعضها خلال عهد والده جهانكير، وأثارت سخط المُجتمع الإسلامي في الهند، كما أجرى الكثير من الإصلاحات الإداريَّة، وشجَّع العُلُوم والآداب والفُنُون، ومكَّن رابطة رعيَّته بِالإسلام، فازدهرت دولته وبلغت شأنًا عظيمًا من الرُقي والتقدُّم، حتَّى عُدَّ عهده العصر الذهبي لِسلطنة مغول الهند. وكان شاهجهان مُتدينًا مُتمسكًا بِالعقيدة والشعيرة السُنيَّة، فانعكس ذلك سلبًا على علاقته مع الصفويين، في حين انعكس إيجابًا على علاقته مع العُثمانيين، كما اشتهر بالحزم الشديد مع رجاله وعُمَّاله على الأمصار، وبِسهره على مصالح رعيَّته وحرصه على تحقيق العدل وإنزال العقاب بِمن يُلحقُ الضُرَّ بهم.",
  "من أبرز الأُمُور التي اشتهر بها شاهجهان في وسط العامَّة: شغفه وهيامه الكبيرين بِزوجته أرجمند بانو بيگم، التي لقَّبها «مُمتاز محل»، وحُبُّه الكبير لِلعمارة، بحيثُ شاد روائع مُعماريَّة عديدة، أصبح بعضها من أبرز المعالم المعماريَّة الإسلاميَّة في العالم، ومن الرُمُوز التاريخيَّة والثقافيَّة لِلهند، ومنها على سبيل المثال: الحصن الأحمر والمسجد الجامع لِمدينة تھتة وضريح تاج محل، الذي بُني خصيصًا لتُدفن فيه مُمتاز محل التي تُوفيت وهي بعدُ شابَّة. وفي أواخر عهده، أُصيب شاهجهان بِمرضٍ أقعده، فعجز عن مُباشرة الحُكم بِنفسه، فتصارع أبناؤه على العرش، وكانت الغلبة في نهاية المطاف لِأورنكزيب، الذي كان أقدرهم دون مُنازع، فحجر على والده في قلعة آغرة وأحاطه بِمظاهر التكريم، وبقي شاهجهان مريضًا في حجره إلى أن أدركه الموت يوم 17 رجب 1076هـ المُوافق فيه 22 كانون الثاني (يناير) 1666م، فنُقل جُثمانه ودُفن في تاج محل إلى جانب زوجته.",
]
sections = [
  { "title" = "حياته قبل السلطنة", "paragraphs" = [
      "وُلد هذا السُلطان يوم 21 ربيع الأوَّل 1000هـ المُوافق فيه 5 كانون الثاني (يناير) 1592م في مدينة لاهور، من أُمٍّ هندوسيَّة -كأم أبيه- هي «جگت گوسين»، المشهورة بِـ«بلقيس مكاني». وهو ثالث أبناء جهانكير وأقدرهم جميعًا، فاتصف بِرجاحة العقل والذكاء وقُوَّة العزيمة، حتَّى كان جدُّه جلال الدين أكبر شديد الاعتزاز به كثير الحدب عليه، وهو من سمَّاه «خُرَّم مُحمَّد» أي «مُحمَّد البهيج» أو «مُحمَّد المسرور»، لِشدَّة سُرُوره به، وكانت علاقتهما حميمة ووطيدة طيلة حياة أكبر. ومن الروايات المُتناقلة عن مولد شاهجهان، أنَّ عرَّافًا أخبر رُقيَّة سُلطان بیگم، زوجة أكبر الأولى، التي لم تُرزق بأولاد، أنَّ زوجها السُلطان سيُرزقُ بِحفيدٍ عمَّا قريب، وأنَّ هذا الحفيدَ سيكون من أعاظم السلاطين. وهكذا، ما أن وُلد خُرَّم مُحمَّد حتَّى قرَّر السُلطان أكبر أخذه وتربيته تحت جناح زوجته رُقيَّة، فأمر بِذلك ما أن بلغ الوليد ستَّة أيَّامٍ فقط، وهدف من وراء ذلك أن يُحقِّق رغبة زوجته بِتربية طفلٍ يرقى لِيُصبح سُلطان البلاد. نشأ خُرَّم مُحمَّد في كنف رُقيَّة سُلطان، فأغدقت عليه حنانًا ومحبَّةً كبيرتين، حتَّى أنَّ جهانكير، والد خُرَّم، ذكر في كتاب سيرته «تُزك جهانكيري»، أنَّ رُقيَّة سُلطان لو كان لها ولد، لفاق حُبَّها لِخُرَّم حُبَّها لِولدها بِألف مرَّة.",
      "مكث خُرَّم مُحمَّد في بلاط جدِّه أكبر إلى أن تُوفي جدُّهُ سنة 1014هـ المُوافقة لِسنة 1605م، وكان خُرَّم حينذاك قد شارف على السنة الرابعة عشر من عُمره، فسُمح له بأن يعود إلى بلاط أبيه جهانكير، ففعل ذلك وعاد إلى أحضان والدته. ويُروى أيضًا أنَّ خُرَّم لازم أكبر خلال مرضه ولم يُفارقه أبدًا، وقبع بجانبه عندما دخل في سكرات الموت إلى أن أسلم روحَه، رُغم ما شكَّلهُ ذلك من خطرٍ على الشاهزاده اليافع، إذ كان مُحاطًا بالخُصُوم السياسيين لِأبيه جهانكير، والذين ما كانوا لِيتردّدوا في إلحاق الأذى به أو قتله. وحاول جهانكير وزوجته جگت گوسين عبثًا أن يُقنعا خُرَّم بِالعودة إلى بلاط أبيه خوفًا عليه من الضرر، لكنَّهُ رفض قائلًا أنَّ واجبه الشرعي والأخلاقي يُلزمه بِالبقاء بِجانب جدِّه المُحتضر مهما شكَّل ذلك من خطرٍ عليه. اتُّخذت هذه الحادثة لِلدلالة على شجاعة وإقدام شاهجهان مُنذُ صغره، وهُما صفتان لازمتاه طيلة حياته.",
      "تلقَّى خُرَّم تعليمه على يد مجموعةٍ من العُلماء والأُدباء والفنَّانين الذين عيَّنهم جدُّه أكبر لِتأديبه وتثقيفه، فحفظ القُرآن ودرس العُلُوم العسكريَّة والفُنُون القتاليَّة والآداب الفارسيَّة والمُوسيقى الهندُستانيَّة. وقد عُرف دون سائر أولياء العهد والشواهزادات السابقين بِعُزُوفه، في الغالب، عن مُقاربة الخمر، مع مُجانبته اللهو والعبث. وكفلت لهُ صفاته العالية هذه ثقة أبيه فيه دون أخويه: خسرو، الذي عمد إلى عُقُوقه له مُنذُ صغره، وپرويز الذي لازمته العلل وضعف الإدراك مُنذُ ولادته، وكان كلاهما يُدمن الخمر، فقضيا به في حياة أبيهما.",
    ] },
  { "title" = "تربُّع شاهجهان على عرش المغول", "paragraphs" = [
      "تُوفي السُلطان جهانكير يوم 17 صفر 1037هـ المُوافقة لِسنة 28 تشرين الأوَّل (أكتوبر) 1627م، أثناء عودته من كشمير بعد أن قضى بها وقتًا للاستجمام والاستشفاء. ولم يكن قد استقرَّ الأمر على من يخلفه، وقد ترك ولدين راحا يتنازعان المُلك هُما شهريار الذي تُؤيِّده نورجهان لِأنَّهُ زوج ابنتها، وشاهجهان الذي يُسانده الجيش ومُعظم الأُمراء، وعلى رأسهم آصف خان، أخو نورجهان ووالد أرجمند بانو بيگم (مُمتاز محل)، زوجة شاهجهان. وكان هُناك عددٌ من آل تيمور الأقل أهميَّة وشُهرة تطلَّعوا إلى اعتلاء العرش، مثل داور بخش بن خسرو، وابني دانيال بن أكبر، طهمورث وهوشنگ.",
      "كان شاهجهان في الدكن عند وفاة والده، فأبلغهُ آصف خان بِذلك وطلب منه الحُضُور إلى آغرة على وجه السُرعة لِيعتلي العرش، وعمل في الوقت نفسه على تأمين منصب السلطنة له من واقع تعيين داور بخش، حفيد السُلطان الراحل، بعد أن أخرجه من سجنه، لِيتقي بِهذا الإجراء ما قد يحدث من اضطرابٍ لِلأُمُور في المدينة، وحتَّى يُتاح له إخراج أبناء شاهجهان من القصر خشيةً على حياتهم، بعد أن أرسلهم والدهم إلى دار السلطنة لِيكونوا رهائن كما أُسلف. لم ترضَ نورجهان بما ذهب إليه أخوها آصف خان، فنادت بِختنها شهريار سُلطانًا في لاهور، قصبة الپُنجاب، وظاهر شهريار على هذا الأمر أحد أولاد عمِّه دانيال، فما كان من آصف خان إلَّا أن أسرع بِقُوَّاته إلى المدينة المذكورة واقتحمها، وقبض على شهريار وألقى به في الحبس بعد أن سمل عينيه. وتناهى خبر ذلك كُلِّه إلى شاهجهان، ولمَّا يبرح الدكن بعدُ، فكتب في التَّو إلى حميه آصف خان يُحرِّضه على القضاء على مُنافسيه جميعًا، فنفَّذ ذلك، ولم تُكتب النجاة من مذبحة آصف خان تلك إلَّا لِداور بخش الذي فرَّ إلى فارس واحتمى بِالصفويين، وبقي هُناك حتَّى أواخر حياته. وهكذا عندما وصل شاهجهان إلى آغرة كان كافَّة المُنافسين لهُ قد أُزيحوا عن الساحة السياسيَّة.",
      "بُويع شاهجهان بِعرش آبائه وأجداده يوم الاثنين 8 جُمادى الآخرة 1037هـ المُوافق فيه 14 شُباط (فبراير) 1628م، وتسمَّى باسم «أبو المُظفَّر صاحبقران شهاب الدين مُحمَّد شاهجهان»، وخُطب بِاسمه على المنابر في جميع أنحاء الهند وضُربت السكَّة بِاسمه. وكان أوَّل عملٍ اتخذه شاهجهان أنَّهُ عيَّن آصف خان صدرًا أعظمَ، ولقَّبهُ بِـ«يمين الدولة»، وأطلق يده في تسيير الشُؤون العامَّة. أمَّا السُلطانة نورجهان فقد انسحبت في صمتٍ بعد هذه الصدمات العنيفة، واعتزلت الحياة العامَّة، وعاشت وحدها مع ابنتها أرملة شهريار ما تبقَّى من عُمرها. وعلى الرُغم من مكايدها، فقد تناسى لها شاهجهان كُلَّ ما كان لها معهُ من عداء، وبرَّ بها بقيَّة أيَّامها، فأكرمها وعاملها بِاحترامٍ وتجلَّة، ورتَّب لها راتبًا سنويًّا، إلى أن أدركها الموت بِلاهور سنة 1055هـ المُوافقة لِسنة 1645م، فنُقل جُثمانها ووُوريت الثرى إلى جانب زوجها جهانكير بِبُستان دلكشاه بِظاهر قصبة الپُنجاب.",
    ] },
  { "title" = "الاضطرابات في بداية عهد شاهجهان", "paragraphs" = [
      "كانت أولى المُشكلات التي واجهت السُلطان الجديد هي الثورة التي قام بها الراجا ججهار سينگه الهندوسي (الهندية: जुझारसिंह बुन्देला) في بُندلخند. وججهار هذا هو ابن «برمَن سينگه ديڤا بانديلا» (الهندية: वीर सिंह जूदेव)، المُسمَّى في المصادر المغوليَّة «نَرْسِنكه دَيْو»، الذي أوعز إليه السُلطان جهانكير بِقتل أبي الفضل بن مُبارك، أحب خُلصاء أكبر إلى نفسه، كونه - بحسب قول جهانكير - كان يُقحمُ أفكارًا مُشوَّهة عن الإسلام في رأس السُلطان الأسبق. ولمَّا أتمَّ برمَن سينگه مُهمَّته بِنجاح، كافأه السُلطان بِأن منحهُ امتيازاتٍ كثيرةً جمع من خلالها ثرواتٍ طائلة، وتُوفي قبل وفاة جهانكير بِبضعة أشهُر، فخلفه ابنه ججهار سينگه، وراح بعد اعتلاء شاهجهان العرش يُوطِّد أقدامه في إقطاعاته ويزيد من قُوَّته بِشراء الأسلحة والذخائر، ويُحصِّن قلاعه، ويضطهد السُكَّان ويتعسَّف في جمع الضرائب، وعندما علم شاهجهان بِأعماله أمر بِإجراء تحقيقٍ في ذلك ما أزعج الأمير الهندوسي فراح يستعد لِلحرب وإعلان استقلاله عن الحُكُومة المغوليَّة المركزيَّة.",
      "لم يتَّخذ شاهجهان في بادئ الأمر أي إجراء بِحقِّ ججهار سينگه بِسبب دوره في صدِّ الغارات عن المناطق الحُدُوديَّة، ولكن عندما تغيَّر الوضع، بعد أن حقَّق مهابت خان الأمن والاستقرار في هذه المناطق؛ نهض لِقمع ثورته، فأرسل مهابت خان إلى بُندلخند من أجل ذلك ودعَّمه بِتعزيزاتٍ من الشرق بِقيادة عبد الله خان، ومن الجنوب بِقيادة خانجهان، فبلغ عدد القُوَّات المغوليَّة سبعة وعشرين ألفًا من الفُرسان وستَّة آلاف من المُشاة،",
      "وعندما أحاطت هذه القُوَّات بِالأمير العاصي، سارع بإلقاء السلاح والاستسلام وطلب الأمان، وكان ذلك في شهر ذي القعدة من سنة 1037هـ المُوافق فيه شهر حَزِيران (يونيو) 1628م، فصفح عنه شاهجهان وأبقاه في حُكم بُندلخند على أن يعود الأمر كما كان عليه، أي يحكم البلاد بِاسم المغول، على أنَّهُ انتزع منه بعض البلاد وألحقها بِالسلطنة بِشكلٍ مُباشر.",
    ] },
  { "title" = "التوسُّعات والفُتُوحات", "paragraphs" = [
      "تاق شاهجهان إلى أن يُتمَّ الفُتُوح التي بدأها أبوه وجدُّه من قبل ببلاد الدكن، والتي شارك هو بِنفسه في بعضٍ منها خلال عهد جهانكير. وشدَّ من عزيمته لِلمضيّ في هذا الأمر حرصه البالغ على منع انتشار المذهب الشيعي في بلاده. فمن المعروف أنَّ سلاطين الدكن كانوا شيعةً يتعاونون مع الصفويين في إيران ويُرحبون بِعُلمائهم في دُولهم، ويعملون على نشر مذهبهم والترويج له، بحيثُ أصبحت بلادهم مثابةً لِمُناوءة أهل السُنَّة والجماعة في الهند وإثارة الفتنة بين السُكَّان. كانت هذه إحدى الأسباب التي دفعت سلاطين المغول على الدوام كي يُحاولوا ضمَّ كامل بلاد الدكن إلى سلطنتهم، ولهذا ركَّز أكبر جُهُوده الحربيَّة في المُدَّة بين سنتَيْ 1600م و1605م لِغزو هذا الإقليم، وقد استطاع أن يضُمَّ إليه بلاد خاندش وشطرًا كبيرًا من أراضي الدولة النظامشاهيَّة، وكان يطمح بعد هذا أن يضم إليه كامل بلاد الهند، ولكنَّهُ مات قبل أن يستطيع تحقيق حُلمه. وقد نهج جهانكير نهج أبيه واتبع سياسته، ولكنَّهُ وجد في ملك عنبر الحبشي عدوًّا صلبًا قويًّا، ولِهذا لم تُلاقِ سياسته في الدكن أي نجاح. فلمَّا آل الأمر إلى شاهجهان، اندفع بِحماسٍ كبيرٍ لِإتمام مقاصد أبيه وجدِّه، ففي حين كانت العوامل السياسيَّة هي وحدها التي تُحرِّك أكبر وجهانكير، أضاف إليها شاهجهان حماسته المذهبيَّة وتمسُّكه الشديد بِالعقيدة والشعيرة السُنيَّة. والحقيقة أنَّ ما ساعد شاهجهان على النجاح العسكري في الدكن أنَّهُ كان خبيرًا بِأحوال تلك البلاد صغيرها وكبيرها من واقع مُكْثه فيها خلال سلطنة والده، كما أنَّ ملك عنبر كان قد تُوفي ولم يظهر بعده أي قائدٍ أو حاكمٍ قديرٍ يُمكن له أن يتصدَّى لِلمغول. أضف إلى ذلك فإنَّ المجاعة القائمة أضعفت تلك البلاد وأنهكتها، فكانت تلك الفترة المُناسبة لِلانقضاض عليها.",
      "ومن الجدير بِالذِكر أنَّهُ كان من أثر خُرُوج شاهجهان ومهابت خان على السُلطان جهانكير، وما تبع ذلك من أحداث، أن ضعُف سُلطان الدولة المغوليَّة في الدكن، فانتهز حُكَّام الدولتين العادلشاهيَّة والقُطبشاهيَّة هذه الفُرصة وخلعوا عنهم الولاء لِلسُلطان المغولي وتوسَّعوا على حساب الدولة النظامشاهيَّة التي بقيت على ولائها الاسمي لِلسُلطان. وخِلال تلك الفترة، استبدَّ بِشُؤون الحُكم في الدولة النظامشاهيَّة قائدٌ مراثي يُدعى «شاهجي»، حتَّى صار سلاطين هذه الدولة يُنصَّبون وَفْق هواه، وكان دائم الإغارة عن القُرى والبلدات في منطقة پونة، وظاهره في استبداده وأفعاله هذه حُكَّام الدولة العادلشاهيَّة، فراحوا يمدُّونه بِالمال والرجال. كانت هذه الأفعال الحُجَّة التي احتاجها شاهجهان لِمُهاجمة الدكن، فأرسل بدايةً إلى أصحاب الدولتين العادلشاهيَّة والقُطُبشاهيَّة أن يعدلوا عن دفع الخراج لِشاهجي العاصي ويعترفوا بِسُلطانه هو، فلم يستجيبوا له، فما كان من السُلطان إلَّا أن خرج بِنفسه على رأس جيشٍ كثيفٍ ويمَّم وجهه جنوبًا. زحف المغول ناحية الدولة النظامشاهيَّة، فتقهقر شاهجي أمامهم، وفرَّ ناجيًا بِحياته واحتمى بِصاحب مدينة «جُنّر»، ثُمَّ أكمل هربه جنوبًا مُحتميًا بِالسُلطان العادلشاهي في بيجافور. وتابع المغول تقدُّمهم حتَّى وصلوا مدينة «دولت آباد»، عاصمة الدولة النظامشاهيَّة، فضربوا الحصار عليها حتَّى سقطت في أيديهم، ووقع سُلطانها حُسين بن بُرهان، الذي لم يكن لهُ من الأمر شيءٌ، في أسرهم. وتابع المغول زحفهم فسيطروا على القسم الشمالي بأكمله من الدولة النظامشاهيَّة، وتوقفوا لِبعض الوقت بِسبب شدَّة موجة القحط والجفاف والوباء، فكان من نتيجة هذا أن تمكَّن شاهجي من الاحتفاظ بِبعض البلاد الداخلة ضمن مُثلَّث ناشك وپونة وأحمد نگر. وعلى الرُغم من عدم تقدُّمهم أكثر من هذا، فقد أدَّى ظُهُور شاهجهان بِالدكن في قُوَّاته الكثيفة إلى أن بادر السُلطان القُطبشاهي عبد الله بن مُحمَّد بِإعلان طاعته لِلمغول من جديد، وأرسل إلى شاهجهان يتعهَّد بِمنع سب الخُلفاء الراشدين الثلاثة: أبي بكر وعُمر وعُثمان، في جميع البلاد الخاضعة…",
      "خدم ججهار سينگه الدولة المغوليَّة مُدَّة خمس سنواتٍ بِإخلاصٍ، وساعد السُلطان شاهجهان في الاستيلاء على دولت آباد وإخضاع الدولة النظامشاهيَّة. ولكن في سنة 1044هـ المُوافقة لِسنة 1634م، حاول الاستيلاء على خوندنة لِيُعوِّض ما خسره من أراضٍ أمام المغول في سنة 1038هـ المُوافقة لِسنة 1629م، كما أُسلف، فحذَّره شاهجهان من فعلته ومن مُعاودته العصيان، لكنَّهُ لم يستجب وحاصر «شوراغار» في سنة 1045هـ المُوافقة لِسنة 1635م، وقتل حاكمها الراجا، فطلب ابنه من السُلطان الأخذ بِثأر والده، فما كان من السُلطان إلَّا أن أمر ججهار سينگه بِإعادة خوندنة إلى ابن الراجا القتيل بِالإضافة إلى قسمٍ من أملاكه، ودفع الجزية للِمغول، عقابًا له على ما اقترفت يداه. رفض ججهار سينگه مطالب السُلطان، واستدعى قُوَّاته، التي كانت تخدم مع الجيش المغولي في الدكن، الأمر الذي أغضب شاهجهان ودفعهُ إلى تكليف ابنه الشاهزاده أورنكزيب بِقمع ثورة هذا العاصي.",
    ] },
]

[articles.ko]
text = "샤 자한(우르두어: شاه ‌جہاں, 페르시아어: شاه جهان; 샤 제한과 같이 전사되기도 한다; 1592년 1월 5일~1666년 1월 22일)은 1628년부터 1658년까지 인도아대륙을 다스린 무굴 제국의 황제이며, ‘샤 자한’이란 페르시아어로 ‘세계의 왕’이라는 의미이다. 그는 바부르, 후마윤, 악바르, 자한기르의 뒤를 이은 5번째 무굴 황제이다."
title = "샤 자한"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EC%83%A4_%EC%9E%90%ED%95%9C"
intro = [
  "샤 자한(우르두어: شاه ‌جہاں, 페르시아어: شاه جهان; 샤 제한과 같이 전사되기도 한다; 1592년 1월 5일~1666년 1월 22일)은 1628년부터 1658년까지 인도아대륙을 다스린 무굴 제국의 황제이며, ‘샤 자한’이란 페르시아어로 ‘세계의 왕’이라는 의미이다. 그는 바부르, 후마윤, 악바르, 자한기르의 뒤를 이은 5번째 무굴 황제이다.",
  "샤 자한은 어린 나이에도 불구하고 자한기르가 죽은 뒤 무굴 황제가 될 사람으로 점찍어졌다. 그의 아버지가 죽은 1627년, 샤 자한은 권좌에 올랐다. 샤 자한은 위대한 무굴인 중 한명으로, 그의 치세는 무굴 제국의 또는 인도 문명의 가장 빛나는 시대 중 하나로 여겨진다. 악바르가 그러하였듯, 샤 자한 역시 제국의 영토를 넓히는데 너무 빠져들었다. 1658년, 샤 자한이 병에 걸리자 그의 아들 아우랑제브는 샤 자한을 아그라 성에 죽을때까지 감금했다. 샤 자한이 죽기 직전인 1666년, 그는 지구 상에서 가장 영향력 강한 사람이었고, 무굴 제국은 3,000,000 km2에 달하는 영토를 지배했으며, 그의 수도는 세계에서 가장 크고 번영했으며, 아름다운 건축물들을 많이 가지고 있었다.",
  "그의 치세는 또한 무굴 건축의 황금 시대로 여겨진다. 샤한샤 샤 자한은 아주 훌륭한 건축물들을 많이 세웠다. 그 중 가장 유명한 것은 샤 자한이 그의 아내 뭄타즈 마할을 위해 아그라에 세운 전설적인 영묘, 타지 마할이다. 진주 모스크와 같은 아그라의 건축물들, 붉은 성, 자마 모스크와 같은 델리의 건축물들, 라호르의 모스크들과 라호르성, 타타의 모스크 등 역시 샤 자한이 세운 것들이다. 그 유명한 타흐테타우스, 즉, 공작새 옥좌는 현재 가치로 수백만 달러에 달하는데, 이 역시 샤 자한의 치세에 만들어진 것이다. 그는 또한 지금은 구 델리라 불리는 샤자한나바드를 만들어 새 수도로 삼았다. 샤 자한의 치세에 지어진 건축물 중에는 붉은 성의 디와니앰과 디와니하스도 있다. 델리의 궁성은 동방에서 가장 아름다운 것으로 여겨진다. 샤자한은 또한 건축과 예술에 대한 심미안도 가지고 있었으며, 그가 좋아했던 여름 거주지인 카쉬미르에 777개의 정원을 주문하기도 했다. 놀랍게도 이 정원들 중 몇몇은 아직도 남아있고, 매년 수 많은 관광객들을 유혹한다. 그러나 사치로 인한 세금의 증가는 나라를 어지럽히기도 했다.",
]
sections = [
  { "title" = "샤자하나바드", "paragraphs" = [
      "붉은 성(델리 성)과 성이 위치한 샤자하나바드는 샤자한 황제가 조성한 것이다. 성의 기본 도안은 기존의 성 양식을 통합하여 보강하도록 설계되었다. 성곽형태의 궁전은 중요한 도시적 면모를 띠며 인도의 중세 시기를 잘 드러내고 있다. 전체적인 면모와 당시 상황을 고려하면 무굴 제국의 활동과 창조성에 대해서도 찾아볼 수 있다. 붉은 성(델리 성)을 짓도록 한 무굴 황제 샤 자한은 아그라 성에서 천도하여 당대의 번영을 뽐내길 원하였다. 그는 천도를 하면서 방대한 건물 계획과 능력을 자축하였다. 시의 동쪽 외곽에 있으며 붉은 성이라는 이름은 성의 거대한 벽이 붉은 빛을 띠고 있어서이다. 전체 벽은 2.5 km에 달하며 높이는 차이가 나지만 대개 16~33 m이다. 야무나 강변에 서있는 성은 벽의 대부분이 연못으로 둘러싸여 있어 해자 형태를 띤다. 건축은 1638년 시작되었으며 1648년 완공되었다.",
    ] },
  { "title" = "타지마할", "paragraphs" = [
      "샤 자한은 세 번째 왕비 뭄타즈 마할을 가장 총애했는데 뭄타즈 마할이 1631년에 죽자 황제는 그녀를 추모하고자 무덤을 하나 제작하였는데 그것이 타지마할이다. 1631년에 공사를 시작하여 22년뒤인 1653년에 완성이 되었다. 완성된 직후 샤 자한은 군사를 동원하여 건설에 참여한 모든 노동자들의 손목을 잘랐다는 전설이 있으나 증거는 없다.",
    ] },
]

[articles.vi]
text = "Mirza Shahab-ud-Din Baig Muhammad Khan Khurram (5 tháng 1 năm 1592 – 22 tháng 1 năm 1666), còn được gọi là Shah Jahan I (phát âm tiếng Ba Tư: [ʃɑːh d͡ʒahɑːn]; n.đ. 'Vua của Thế giới'), là Hoàng đế Mogul thứ 5, trị vì từ năm 1628 đến năm 1658."
title = "Shah Jahan"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Shah_Jahan"
intro = [
  "Mirza Shahab-ud-Din Baig Muhammad Khan Khurram (5 tháng 1 năm 1592 – 22 tháng 1 năm 1666), còn được gọi là Shah Jahan I (phát âm tiếng Ba Tư: [ʃɑːh d͡ʒahɑːn]; n.đ. 'Vua của Thế giới'), là Hoàng đế Mogul thứ 5, trị vì từ năm 1628 đến năm 1658. Dưới thời ông trị vì, Đế chế Mogul đã đạt đến đỉnh cao trong thành tựu kiến trúc và văn hóa.",
  "Ông là con trai thứ 3 của Hoàng đế Jahangir (1605–1627), Shah Jahan tham gia vào các chiến dịch quân sự chống lại Rajput xứ Mewar và các Lodi của Deccan. Sau cái chết của Hoàng đế Jahangir vào tháng 10 năm 1627, Shah Jahan đánh bại em út Shahryar Mirza và tự phong làm hoàng đế tại Pháo đài Agra. Ngoài Shahryar, Shah Jahan còn xử tử hầu hết những người tranh giành ngai vàng với mình. Ông đã xây dựng nhiều công trình, bao gồm Pháo đài Đỏ, Nhà thờ Hồi giáo Shah Jahan và Taj Mahal, nơi chôn cất người vợ mà ông yêu quý nhất là Mumtaz Mahal. Về đối ngoại, Shah Jahan chủ trì các chiến dịch xâm lược chống lại các Hồi quốc Deccan, các cuộc xung đột với người Bồ Đào Nha và các cuộc chiến tranh với người Safavid. Ông cũng đàn áp một số cuộc nổi dậy ở địa phương và giải quyết nạn đói Deccan năm 1630–1632 tàn khóc.",
  "Vào tháng 9 năm 1657, Shah Jahan lâm bệnh nên đã bổ nhiệm con trai cả của mình là Dara Shikoh làm người kế vị. Hành động này đã dẫn đến một cuộc khủng hoảng kế vị giữa 3 người con trai của ông, từ đó con trai thứ 3 của Shah Jahan là Aurangzeb (1658–1707) nổi lên và dành chiến thắng, trở thành hoàng đế thứ 6 của Đế chế Mogul, ông ta đã xử tử tất cả những người anh em còn sống của mình, bao gồm cả Thái tử Dara Shikoh. Sau khi Shah Jahan khỏi bệnh vào tháng 7 năm 1658, Aurangzeb đã giam giữ cha mình tại Pháo đài Agra từ tháng 7 năm 1658 cho đến khi ông qua đời vào tháng 1 năm 1666. Ông được an nghỉ bên cạnh vợ mình ở Taj Mahal. Triều đại của ông được biết đến là đã loại bỏ các chính sách tự do do Akbar Đại đế khởi xướng. Trong thời Shah Jahan, các phong trào phục hưng Hồi giáo như Naqshbandi bắt đầu định hình các chính sách của Molgu.",
]
sections = [
  { "title" = "Xuất thân và cuộc sống đầu đời", "paragraphs" = [
      "Shah Jahan sinh ngày 5 tháng 1 năm 1592 tại Lahore, Pakistan ngày nay, là con thứ 9 và con trai thứ 3 của Hoàng tử Salim (sau này được gọi là 'Jahangir' khi lên ngôi) với vợ ông, Jagat Gosain. Cái tên Khurram (tiếng Ba Tư: خرم, có nghĩa là 'vui vẻ') được ông nội của ông là Hoàng đế Akbar, chọn cho Shah Jahan, và hai ông cháu rất thân thiết với nhau. Jahangir nói rằng Akbar rất thích Khurram và thường nói với ông ấy rằng \"Không có gì có thể so sánh nó với những đứa con trai khác của ông. Ta coi nó là con trai thực sự của mình.\"",
      "Khi Khurram được sinh ra, Akbar coi cậu là người tốt lành và nhất quyết yêu cầu vương tôn phải được nuôi dưỡng trong gia đình của ông chứ không phải của Salim và do đó được giao cho Ruqaiya Sultan Begum chăm sóc. Ruqaiya đảm nhận trách nhiệm chính trong việc nuôi dạy Khurram và được cho là đã nuôi dạy Khurram một cách đầy tình cảm. Jahangir lưu ý trong hồi ký của mình rằng Ruqaiya đã yêu con trai mình, Khurram, \"nhiều hơn một nghìn lần so với việc cậu ấy là [con trai] của chính cô ấy.\"",
      "Tuy nhiên, sau cái chết của ông nội Akbar vào năm 1605, ông trở về với sự chăm sóc của mẹ mình là Jagat Gosain, người mà ông vô cùng quan tâm và yêu thương. Mặc dù bị chia cắt từ khi mới sinh ra, ông vẫn hết lòng vì bà và gọi bà là Hazrat trong biên niên sử triều đình. Sau cái chết của Jagat Gosain ở Akbarabad vào ngày 8 tháng 4 năm 1619, Jahangir ghi nhận hoàng tử trẻ không thể nguôi ngoai nỗi buồn và để tang trong 21 ngày. Trong 3 tuần để tang, ông không tham dự vào các cuộc họp công cộng và chỉ ăn chay đơn giản. Phối ngẫu của ông là Mumtaz Mahal đã đích thân giám sát việc phân phát thực phẩm cho người nghèo trong thời kỳ này. Cô dẫn đầu việc đọc Kinh Qur'an mỗi sáng và tâm sự với chồng nhiều bài học về bản chất của sự sống và cái chết và cầu xin ông hãy mau vượt qua sự đau buồn.",
    ] },
  { "title" = "Hôn nhân", "paragraphs" = [
      "Năm 1607, Khurram đính hôn với Arjumand Banu Begum (1593–1631), còn được gọi là Mumtaz Mahal (tiếng Ba Tư có nghĩa là \"người được chọn của Cung điện\"). Họ đính hôn vào khoảng năm họ 14 và 15 tuổi và 5 năm sau họ kết hôn. Cô gái trẻ thuộc một gia đình quý tộc Ba Tư lừng lẫy đã phục vụ các hoàng đế Mogul kể từ triều đại Akbar. Tộc trưởng của gia đình là Mirza Ghiyas Beg, người còn được biết đến với danh hiệu I'timād-ud-Daulah hay \"Trụ cột của Nhà nước\". Ông từng là bộ trưởng tài chính của Jahangir và con trai ông, Asaf Khan - cha của Arjumand Banu - đóng một vai trò quan trọng trong triều đình Mogul, cuối cùng giữ chức Tể tướng. Dì của bà là Mehr-un-Nissa sau này trở thành Hoàng hậu Nur Jahan, vợ chính của Hoàng đế Jahangir.",
      "Hoàng tử sẽ phải đợi 5 năm trước khi kết hôn vào năm 1612 (1021 AH), vào ngày được các nhà chiêm tinh của triều đình chọn là có lợi nhất để đảm bảo một cuộc hôn nhân hạnh phúc. Đây là một cuộc đính hôn kéo dài bất thường vào thời điểm đó. Tuy nhiên, Shah Jahan lần đầu kết hôn với Công chúa Kandahari Begum, con gái của chắt trai của Shah Ismail I của Ba Tư, và có với nhau một cô con gái và cũng là đứa con lớn nhất của ông.",
      "Năm 1612, ở tuổi 20, Khurram kết hôn với Mumtaz Mahal, vào một ngày do các nhà chiêm tinh của triều đình chọn. Cuộc hôn nhân hạnh phúc và họ có 14 người con, trong đó có 7 người sống sót đến tuổi trưởng thành.",
    ] },
  { "title" = "Các chiến dịch quân sự ban đầu", "paragraphs" = [
      "Hoàng tử Khurram thể hiện tài năng quân sự phi thường. Cơ hội đầu tiên để Khurram kiểm tra tài năng quân sự của mình là trong chiến dịch Mogul chống lại Nhà nước Rajput của Mewar, vốn là thế lực thù địch với đế chế Mogul kể từ triều đại của Akbar Đại đế.",
      "Sau 1 năm chiến tranh tiêu hao đầy khắc nghiệt, Rana Amar Singh I đầu hàng có điều kiện trước quân đội Mogul và trở thành một nước chư hầu của Đế quốc Mogul. Năm 1615, Khurram giới thiệu Kunwar Karan Singh, người thừa kế của Amar Singh cho Jahangir. Khurram được cử đến để tỏ lòng kính trọng với mẹ và mẹ kế của mình và sau đó được Jahangir ban thưởng. Cùng năm đó, mansab của ông tăng từ 12000/6000 lên 15000/7000, ngang bằng với anh trai ông là Parvez và tiếp tục tăng lên 20000/10000 vào năm 1616.",
      "Năm 1616, khi Khurram khởi hành tới Deccan, Jahangir đã trao cho ông danh hiệu Shah Sultan Khurram.",
    ] },
  { "title" = "Gia quyến", "paragraphs" = [
      "Kandahari Begum (1593 - ?), còn được gọi là Kandahari Mahal (nghĩa là Phu nhân đến từ Kandahar), xuất thân công chúa của triều đại Safavid khi ấy đang cai trị Ba Tư, cháu gái của Sultan Hosayn Mirza. Kết hôn năm 1610 tại Agra, sinh một con gái rồi qua đời tại đây.",
      "Mumtaz Mahal (1593 - 1631), là người vợ được sủng ái nhất của ông, con gái của Abu'l-Hasan Asaf Khan, cháu gái của Hoàng hậu Nur Jahan. Kết hôn năm 1612, qua đời do biến chứng khi sinh đứa con thứ 14. Lăng mộ của bà, tức Taj Mahal là một trong những Kỳ quan thế giới.",
      "Akbarabadi Mahal (? - 1678), sinh ra tại Akbarabad, con gái Shahnawaz Khan Mirza Iraj. Kết hôn năm 1617, sinh được một con trai.",
    ] },
]

[articles.id]
text = "Syah Jehan (5 Januari 1592 – 2 Januari 1666) adalah seorang raja ke-5 dari Kekaisaran Mughal di India yang memerintah antara tahun 1627-1658 M. Atas perintahnya dibangunlah mausoleoum Taj Mahal yang merupakan salah satu dari tujuh keajaiban dunia di Agra demi mengenang permaisurinya yang bernama Arjumand Banu Begum atau Mumtaz Mahal."
title = "Syah Jehan"
lang = "id"
url = "https://id.wikipedia.org/wiki/Syah_Jehan"
intro = [
  "Syah Jehan (5 Januari 1592 – 2 Januari 1666) adalah seorang raja ke-5 dari Kekaisaran Mughal di India yang memerintah antara tahun 1627-1658 M. Atas perintahnya dibangunlah mausoleoum Taj Mahal yang merupakan salah satu dari tujuh keajaiban dunia di Agra demi mengenang permaisurinya yang bernama Arjumand Banu Begum atau Mumtaz Mahal.",
]
sections = [
  { "title" = "Pemerintahan", "paragraphs" = [
      "Nama kecil Shah Jehan adalah Khurram.Shah Jahan (1628-1658) tampil menggantikan Jahangir. Bibit-bibit disintegrasi mulai tumbuh pada pemerintahannya. Hal ini sekaligus menjadi ujian terhadap politik toleransi Mughal. Dalam masa pemerintahannya terjadi dua kali pemberontakan. Tahun pertama masa pemerintahannya, Raja Jujhar Singh Bundela berupaya memberontak dan mengacau keamanan, tetapi berhasil dipadamkan. Raja Jujhar Singh Bundela kemudian diusir. Pemberontakan yang paling hebat datang dari Afghan oleh Pir Lodi atau Khan Jahan, seorang gubernur dari provinsi bagian Selatan. Pemberontakan ini cukup menyulitkan. Namun pada tahun 1631 pemberontakan ini pun dipatahkan dan Khan Jahan dihukum mati.",
    ] },
  { "title" = "Keluarga", "paragraphs" = [
      "Nawab Mahd-i-'Aliya Malika-i-Jahan Mumtaz Mahal Begum Sahibalahir sebagai Arjumand Banu Begum, putri Nawab Abu'l Hasan Asaf Khan Bahadur dan Diwanji Begum. Ia merupakan keponakan Nur Jahan.",
      "Kandahari Begum Sahibaputri Sultan Muzaffar Husain Mirza, buyut Ismail I, pendiri Dinasti Safawi.",
      "Akrabadi Mahal Sahibalahir sebagai Izz-un-Nissa Begum, putri Mirza Iraj (Shahnawaz Khan), cucu Bairam Khan. Ia juga dikenal sebagai Sirhindi Begum.",
    ] },
  { "title" = "Referensi", "paragraphs" = [
