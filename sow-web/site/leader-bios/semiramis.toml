[articles.en]
text = "Semiramis was the legendary Lydian-Babylonian wife of Onnes and of Ninus, who succeeded the latter on the throne of Assyria, according to Movses Khorenatsi. Legends narrated by Diodorus Siculus, who drew primarily from the works of Ctesias of Cnidus, describe her and her relationships to Onnes and King Ninus."
title = "Semiramis"
lang = "en"
url = "https://en.wikipedia.org/wiki/Semiramis"
intro = [
  "Semiramis () was the legendary Lydian-Babylonian wife of Onnes and of Ninus, who succeeded the latter on the throne of Assyria, according to Movses Khorenatsi. Legends narrated by Diodorus Siculus, who drew primarily from the works of Ctesias of Cnidus, describe her and her relationships to Onnes and King Ninus.",
  "Armenians and the Assyrians of Iraq, northeast Syria, southeast Turkey, and northwest Iran still use Shamiram and its derivative Samira as a given name for girls.",
  "The real and historical Shammuramat, the original Akkadian form of the name, was the Assyrian wife of Shamshi-Adad V (ruled 824–811 BC). She ruled the Neo-Assyrian Empire as its regent for five years, before her son Adad-nirari III came of age and took the reins of power. She ruled at a time of political uncertainty, which may partly explain why Assyrians may have accepted the rule of a woman when it was not allowed by their cultural tradition. She conquered much of the Middle East and the Levant and stabilized and strengthened the empire after a destructive civil war. It has been speculated that being a woman who ruled successfully may have made the Assyrians regard her with particular reverence and that her achievements may have been retold over the generations until she was gradually turned into a legendary figure.",
  "The name of Semiramis came to be applied to various monuments in Western Asia and Anatolia whose origins had been forgotten or unknown, even the Behistun Inscription of Darius. Herodotus ascribes to her the artificial banks that confined the Euphrates. He knew her name because it was inscribed on a gate of Babylon. Various places in Mesopotamia, Media, Persia, the Levant, Anatolia, the Arabian Peninsula, and the Caucasus received names recalling Semiramis.",
]
sections = [
  { "title" = "Historical figure", "paragraphs" = [
      "While the achievements of Semiramis are clearly in the realm of mythical Persian, Armenian, and Greek historiography, the historical Shammuramat certainly existed. After her husband's death, she might have served as regent for her son, Adad-nirari III. Thus, during that time Shammuramat could have been in control of the vast Neo-Assyrian Empire (911–605 BC), which stretched from the Caucasus Mountains in the north to the Arabian Peninsula in the south, and from western Iran in the east to Cyprus in the west.",
      "In the city of Aššur on the Tigris, she had an obelisk built and inscribed that read, \"Stele of Shammuramat, queen of Shamshi-Adad, King of the Universe, King of Assyria, Mother of Adad Nirari, King of the Universe, King of Assyria, Daughter-in-Law of Shalmaneser, King of the Four Regions of the World.\"",
    ] },
  { "title" = "Legend according to Diodorus Siculus", "paragraphs" = [
      "According to Diodorus, a first century BC Greek historian, Semiramis was of noble parents, the daughter of the fish-goddess Derketo of Ascalon and of a mortal. He related that Derketo abandoned her at birth and drowned herself. Doves fed the child until she was one year old. Then the doves, who had started pecking off bits from the cheeses to feed her, caught the attention of some keepers. These found the baby, and brought her to Simmas, the royal shepherd, who adopted her as his own, and gave her the name Semiramis, which according to Diodorus is a slight alteration of the Syrian word for dove. Semiramis married Onnes or Menones, a general under King Ninus, and she became an advisor to the king. Her advice led him to great successes. At the Siege of Bactra, she personally led a party of soldiers to seize a key defensive point, leading to the capture of the city.",
      "Ninus was so struck that he fell in love with her. He tried to compel Onnes to give her to him as a wife, first offering his own daughter Sonanê in return and eventually threatening to put out his eyes as punishment. Out of fear of the king, and out of doomed passion for his wife, Onnes \"fell into a kind of frenzy and madness\" and hanged himself. Ninus then married Semiramis.",
      "Diodorus relates that after their marriage, Semiramis and Ninus had a son named Ninyas. After King Ninus conquered Asia, including the Bactrians, Ninus was fatally wounded by an arrow. Semiramis disguised herself as her son so the army would follow her instructions, thinking they came from their new ruler. Diodorus writes that her reign lasted for 42 years and that she conquered much of Asia and achieved many feats. She restored ancient Babylon and protected it with a high brick wall that completely surrounded the city. She built several palaces in Persia, including Ecbatana.",
    ] },
  { "title" = "Other ancient traditions", "paragraphs" = [
      "Legends describing Semiramis have been recorded by approximately 80 ancient writers including Plutarch, Eusebius, Polyaenus, Valerius Maximus, Orosius, and Justinus. She was associated with Ishtar and Astarte since the time before Diodorus. The association of the fish and dove is found at Hierapolis Bambyce (Mabbog, now Manbij), the great temple that according to one legend, was founded by Semiramis, where her statue was shown with a golden dove on her head.",
      "The name of Semiramis came to be applied to various monuments in Western Asia and Anatolia, the origins of which ancient writers sometimes asserted had been forgotten or unknown. Various places in Assyria and throughout Mesopotamia as a whole, Media, Persia, the Levant, Anatolia, the Arabian Peninsula, and the Caucasus bore the name of Semiramis in slightly changed forms, even some named during the Middle Ages. She is credited with founding the city of Van in Turkey in order to have a summer residence and that city may be found referred to as Shamiramagerd (city of Semiramis).",
      "Herodotus, an ancient Greek writer, geographer, and historian living from c. 484 to 425 BC, ascribes to Semiramis the artificial banks that confined the Euphrates and knows her name as borne by a gate of Babylon. Strabo, a Greek geographer, philosopher, and historian who lived in Asia Minor during 64 or 63 BC to 24 AD, credits her with building earthworks and other structures \"throughout almost the whole continent\". Nearly every stupendous work of antiquity by the Euphrates or in Iran seems to have been ascribed to Semiramis, even the Behistun Inscription of Darius.",
    ] },
  { "title" = "In later traditions", "paragraphs" = [
      "Although negative portrayals did exist, generally, Semiramis was viewed positively before the rise of Christianity. During the Middle Ages, she became associated with promiscuity and lustfulness. One story claimed that she had an incestuous relationship with her son, justified it by passing a law to legitimize parent-child marriages, and invented the chastity belt to deter any romantic rivals before he eventually killed her. This seems to have appeared first in the reign of Augustus in the Universal History of Pompeius Trogus, which survives only in the later epitome of Justin; the circulation of the story was likely popularized in the fifth century by Orosius in his universal history, Seven Books of History Against the Pagans, which has been described as an \"anti-pagan polemic\".",
      "The sixth-century historian John Malalas has an account of Semiramis, mixing her with Rhea wife of Kronos; in this version, she is both the wife and mother of Ninus.",
      "In the Divine Comedy (Inferno V), Dante places Semiramis among the souls of the lustful in the Second Circle of Hell. She appears in Petrarch's Triumph of Love (canto III, verse 76). She is one of three women exemplifying \"evil love\", the other two being Byblis and Myrrha.",
    ] },
]

[articles.de]
text = "Der Name Semiramis, von antiken griechischen Historikern geprägt, bezieht sich auf eine altorientalische Heldin oder Königin. Die Semiramis der griechischen Quellen dürfte mit der assyrischen Königin Šammuramat nur den Namen gemein haben."
title = "Semiramis"
lang = "de"
url = "https://de.wikipedia.org/wiki/Semiramis"
intro = [
  "Der Name Semiramis, von antiken griechischen Historikern geprägt, bezieht sich auf eine altorientalische Heldin oder Königin. Die Semiramis der griechischen Quellen dürfte mit der assyrischen Königin Šammuramat nur den Namen gemein haben.",
]
sections = [
  { "title" = "Graeco-Römische Quellen", "paragraphs" = [
      "Nach Herodot (Historien I,184) war sie eine der zwei Königinnen, die ganz Asien regierten – die andere war Nitokris fünf Generationen nach ihr. Nach Herodot waren die Tore von Babylon nach Semiramis, Ninos und Bêlos benannt.",
      "Die Hauptquelle über Semiramis war die „Persische Geschichte“ (Persika) des Ktesias von Knidos, der als Arzt längere Zeit am persischen Hof lebte. Das Werk selbst ist nicht erhalten, lediglich die Auszüge des Photios und Entlehnungen späterer Autoren, vor allem von Diodor von Sizilien, haben sich erhalten.",
      "Bei Diodor (Bibliothḗkē historikḗ 2, 4-20) wird Semiramis als Tochter der Göttin Derketo von Askalon beschrieben. Die missgünstige Göttin Aphrodite ließ Derketo in wilder Liebe einem schönen syrischen Jüngling verfallen, der zum Opfern an ihren Teich kam. Nach der Geburt einer Tochter verfiel Derketo einer schweren postnatalen Depression, tötete den Kindsvater, setzte die Tochter an einem steinigen und öden Ort aus und stürzte sich in den Teich, wo sie sich in ein Wesen verwandelte, dessen untere Hälfte ein Fisch war. Daher war den Syrern der Fisch heilig, und sie aßen ihn nicht. Tauben, die heiligen Tiere der Aphrodite (und der Anat), bedeckten das halbgöttliche Kind mit ihren Flügeln, um es zu wärmen, und brachten ihm im Kropf Milch und später Käse. Hirten, verwundert, dass Tauben ihren Käse stehlen, folgten den Vögeln und fanden so das schöne Kind. Sie brachten es zu Simmas, dem kinderlosen Oberhirten des Königs, der dem Kind wegen der Tauben den Namen Semiramis gab und es aufzog. Die Syrer verehrten deswegen die Tauben als göttlich.",
    ] },
  { "title" = "Assyrische Quellen", "paragraphs" = [
      "Der Name „Šammuramat“ ist aus den assyrisch-babylonischen Königslisten bekannt. Šammuramat (810–782 v. Chr.) war die Frau von Šamši-Adad V. (823–810). Ob sie für ihren minderjährigen Sohn Adad-nīrārī III. (791-782) regiert hat, sei dahingestellt – diese Annahme basiert auf einer Inschrift der Stele von Saba’a, in der vom 5. Jahr des Adad-nirari III. die Rede ist, doch das muss nicht unweigerlich das 5. Lebensjahr bedeuten, ebenso kann es das 5. Regierungsjahr sein.",
    ] },
  { "title" = "Jüdische Tradition", "paragraphs" = [
      "In der rabbinischen Tradition ist Semiramis die Frau Nimrods und erhielt ihren Namen, weil sie im Donner geboren war. Sie ist eine der vier Frauen, die die Welt beherrschten, zusammen mit Isebel und Atalja in Israel und Waschti in Persien. Nach jüdischen Legenden war sie die Frau des Nebukadnezar (605-562).",
    ] },
  { "title" = "Nachantike Tradition", "paragraphs" = [
      "Gemäß der Trierer Geschichtsschreibung soll Semiramis ihrem Stiefsohn Trebeta nachgestellt haben, sodass dieser nach Europa floh. Dort soll er an der Mosel die Stadt Trier gegründet haben.",
    ] },
  { "title" = "Deutung", "paragraphs" = [
      "Auf François Lenormant geht die These zurück, Semiramis sei mit Ištar identisch. George Rawlinson und ihm folgend, Gilmore und Smith (1887) wollen Semiramis mit der assyrischen Königin Šammuramat verbinden. Sayce versucht den Namen Semiramis auf eine lydische Quelle zurückzuführen und nimmt an, dass ein ursprünglich syrischer Mythos aus Hierapolis in persischer Zeit nach Babylon übertragen wurde. Nagel versucht Semiramis, nicht sehr überzeugend, auf persische und skythische Quellen zurückzuführen, und sieht eines ihrer Vorbilder in Atossa, der Tochter von Ariaspes.",
      "Weinfeld leitet den Namen Semiramis von smm rmm oder šamīm ramīm, Hoher Himmel (Excelsis) ab und sieht sie als einen Aspekt von Atiratu (Aschera), verschmolzen den historischen Figuren von Zakutu, der aramäischen Mutter Asarhaddons und Šammuramat, der Mutter Adad-nīrārī III. Er verweist auf Ähnlichkeiten mit der in persischer Zeit verfassten Geschichte des Propheten Jona, dessen Name Taube bedeutet, der von einem Fisch verschlungen wird und in Ninive wirkt.",
    ] },
]

[articles.tr]
text = "Semiramis (/səˈmɪrəmɪs, sɪ-, sɛ-/; Süryanice: ܫܲܡܝܼܪܵܡ Šammīrām, Ermenice: Շամիրամ Šamiram, Yunanca: Σεμίραμις, Arapça: سميراميس Samīrāmīs) efsanevi Lidyalı - Babilli Onnes ve Ninus'un karısıydı ve Horenli Musa'ya göre Asur tahtına Ninus'un yerine geçmiştir. Esas olarak Ktesias'ın eserlerinden esinlenen Diodoros'un anlattığı efsaneler onu ve onun Onnes ve Kral Ninus ile olan ilişkilerini anlatır."
title = "Semiramis"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Semiramis"
intro = [
  "Semiramis (/səˈmɪrəmɪs, sɪ-, sɛ-/; Süryanice: ܫܲܡܝܼܪܵܡ Šammīrām, Ermenice: Շամիրամ Šamiram, Yunanca: Σεμίραμις, Arapça: سميراميس Samīrāmīs) efsanevi Lidyalı - Babilli Onnes ve Ninus'un karısıydı ve Horenli Musa'ya göre Asur tahtına Ninus'un yerine geçmiştir. Esas olarak Ktesias'ın eserlerinden esinlenen Diodoros'un anlattığı efsaneler onu ve onun Onnes ve Kral Ninus ile olan ilişkilerini anlatır.",
  "Ermeniler ve Irak, kuzeydoğu Suriye, güneydoğu Türkiye ve kuzeybatı İran'daki Süryaniler hala kız çocuklarına Şamiram ismini vermektedirler.",
  "Asıl ve tarihi Sammuramat, ismin orijinal Akadca biçimi olup, MÖ 824-811 yılları arasında hüküm süren V. Şamşi-Adad'ın Asurlu karısıydı. Oğlu III. Adad-nirari reşit olup iktidarı ele alana kadar beş yıl boyunca Yeni Asur İmparatorluğu'nu naip olarak yönetmiştir. Siyasi belirsizliklerin olduğu bir dönemde ülkeyi yönetti ve bu durum, Asurluların kültürel geleneklerinde izin verilmeyen bir kadının yönetimini neden kabul etmiş olabileceklerini kısmen açıklayabilir. Ortadoğu ve Levant'ın büyük bir bölümünü fethetmiş ve yıkıcı bir iç savaşın ardından imparatorluğu istikrara kavuşturup güçlendirmiştir. Başarılı bir şekilde hüküm süren bir kadın olmasının Asurlular'ın ona özel bir saygı duymasına neden olmuş olabileceği ve başarılarının nesiller boyunca anlatılarak giderek efsanevi bir figüre dönüşmüş olabileceği tahmin edilmektedir.",
  "Semiramis ismi, Darius'un Behistun Yazıtı'da dahil olmak üzere kökenleri unutulmuş veya bilinmeyen Batı Asya ve Anadolu'daki çeşitli anıtlara uygulanmıştır. Herodot, Fırat'ı sınırlayan yapay kıyıları ona atfeder. Adını biliyordu çünkü Babil'in bir kapısına yazılmıştı. Mezopotamya, Medler, İran, Levant, Anadolu, Arap Yarımadası ve Kafkasya'nın çeşitli yerleri Semiramis'i anımsatan isimler mevcuttur.",
]
sections = [
  { "title" = "Tarihi figür", "paragraphs" = [
      "Semiramis'in başarıları açıkça efsanevi Pers, Ermeni ve Yunan tarih yazımının alanına girse de, tarihi Sammuramat kesinlikle var olmuştur. Kocasının ölümünden sonra oğlu III. Adad-nirari'nin naibi olarak görev yapmış olabilir. Böylece, o dönemde Sammuramat, kuzeyde Kafkas Dağları'ndan güneyde Arap Yarımadası'na, doğuda Batı İran'dan batıda Kıbrıs'a kadar uzanan geniş Yeni Asur İmparatorluğu'nun (MÖ 911-605) kontrolünü elinde tutuyor olabilirdi.",
      "Dicle kıyısındaki Aššur kentinde bir dikilitaş yaptırdı ve üzerine \"Şamşi-Adad'ın kraliçesi, Evrenin Kralı, Asur Kralı, Adad Nirari'nin annesi, Evrenin Kralı, Asur Kralı, Şalmaneser'in gelini, Dünyanın Dört Bölgesinin Kralı, Şammuramat'ın dikilitaşı\" yazılmıştır.",
    ] },
  { "title" = "Diodoros Siculus'a göre efsane", "paragraphs" = [
      "MÖ 1. yüzyılda yaşamış Yunan tarihçi Diodoros'a göre Semiramis, soylu ebeveynlerden, Askalonlu balık tanrıçası Derketo'nun kızı ile bir ölümlünün kızıydı. Derketo'nun kendisini doğumda terk ettiğini ve boğularak öldüğünü anlatmıştır. Güvercinler, kraliyet çobanı Simmas onu bulana kadar çocuğu beslemişlerdir. Semiramis, Kral Ninus'un generallerinden Onnes veya Menones ile evlenmiş ve kralın danışmanı olmuştur. Nasihatleri onu büyük başarılara götürmüştür. Baktra Kuşatması'nda, bizzat bir grup askerin liderliğini yaparak önemli bir savunma noktasını ele geçirerek şehrin düşmesini sağlamıştır.",
      "Ninus o kadar etkilenmişti ki, ona aşık olmuştur. Önce kendi kızı Sonanê'yi, Onnes'e vermeyi teklif ederek, olmadı, ceza olarak gözlerini çıkarmakla tehdit ederek Semiramis'i kendine eş olarak almak için generali zorlamıştır. Karısına duyduğu çaresiz tutkudan, ve Kral'ın korkusundan, Onnes \"bir tür çılgınlığa ve deliliğe kapılmış\" halde kendini asmıştır. Ninus, böylece daha sonra Semiramis ile evlenmiştir.",
      "Diodoros, Semiramis ile Ninus'un evlendikten sonra Ninyas adında bir oğullarının olduğunu anlatır. Kral Ninus, Baktriyalılar da dahil olmak üzere Asya'yı fethettikten sonra bir okla ölümcül şekilde yaralanmıştır. Semiramis, ordunun kendi talimatlarını yerine getirmesini sağlamak için oğlunun kılığına girmiş; ordu, talimatların yeni hükümdarlarından geldiğini sanıyordu. Diodoros, onun 42 yıl saltanat sürdüğünü, Asya'nın büyük bölümünü fethettiğini ve birçok başarıya imza attığını yazmaktadır. Antik Babil'i restore etmiş ve şehri tamamen çevreleyen yüksek bir tuğla duvarla koruma altına almıştır. İran'da Ekbatan da dahil olmak üzere birçok saray inşa etmiştir.",
    ] },
  { "title" = "Diğer eski gelenekler", "paragraphs" = [
      "Aralarında Plutarkhos, Eusebios, Polyaenus, Valerius Maximus, Orosius ve Justinus'un da bulunduğu yaklaşık 80 antik yazar tarafından Semiramis'i anlatan efsaneler kaydedilmiştir. Diodoros'tan önceki zamanlardan beri İştar ve Astarte ile ilişkilendirilmiştir. Balık ve güvercin ilişkisi, bir efsaneye göre Semiramis tarafından kurulan büyük tapınak olan Hierapolis Bambyce'de (Mabbog, şimdiki adıyla Manbij) bulunmaktadır; burada heykeli başında altın bir güvercinle gösterilmiştir.",
      "Semiramis ismi, Batı Asya ve Anadolu'daki çeşitli anıtlara uygulanmaya başlanmış; antik yazarlar bu anıtların kökenlerinin bazen unutulduğunu veya bilinmediğini ileri sürmüşlerdir. Asur'un çeşitli yerleri ve Mezopotamya'nın tamamı, Medya, Pers, Levant, Anadolu, Arap Yarımadası ve Kafkaslar, Semiramis ismini biraz değişmiş biçimlerde taşıyordu, hatta bazıları Orta Çağ'da isimlendirilmişti. Türkiye'de yazlık ikametgâh olarak kullanılmak üzere Van şehrini kurduğu kabul edilir ve bu şehir Shamiramagerd (Semiramis şehri) olarak anılır.",
      "y. 484-425 yılları arasında yaşamış olan antik Yunan yazar, coğrafyacı ve tarihçi Herodotos, Fırat'ı sınırlayan yapay kıyıları Semiramis'e atfeder ve isminin Babil'in bir kapısında yazdığını söyler. MÖ 64 veya 63 ile MS 24 yılları arasında Küçük Asya'da yaşamış olan Yunan coğrafyacı, filozof ve tarihçi Strabon, ona \"neredeyse tüm kıtada\" toprak işleri ve diğer yapılar inşa ettiğini söylemiştir. Fırat kıyısındaki veya İran'daki antik çağın neredeyse her muhteşem eseri, hatta Darius'un Behistun Yazıtı bile, Semiramis'e atfedilmiş gibi görünmektedir.",
    ] },
  { "title" = "Daha sonraki geleneklerde", "paragraphs" = [
      "Olumsuz tasvirler mevcut olsa da, genel olarak Semiramis, Hristiyanlığın yükselişinden önce olumlu olarak görülüyordu. Orta Çağ'da ise fuhuş ve şehvetle ilişkilendirilmeye başlanmıştır. Bir hikâyede, oğluyla ensest bir ilişki yaşadığı, bunu ebeveyn-çocuk evliliklerini meşrulaştıran bir yasa çıkardığı ve sonunda onu öldürmeden önce romantik rakiplerini caydırmak için Bekâret kemerini icat ettiği iddia ediliyordu. Bu, ilk olarak Augustus'un saltanatında Pompeius Trogus'un Evrensel Tarihi'nde ortaya çıkmış gibi görünüyor; bu tarih yalnızca Justinius'un daha sonraki özetinde günümüze ulaşmıştır; hikâyenin dolaşımı muhtemelen beşinci yüzyılda Orosius'un Paganlara Karşı Yedi Tarih Kitabı adlı evrensel tarihiyle popüler hale getirilmiştir; bu kitap \"pagan karşıtı polemik\" olarak tanımlanmıştır.",
      "Dante, İlahi Komedya'da (Cehennem V) Semiramis'i Cehennemin İkinci Çemberi'ndeki şehvet düşkünlerinin ruhları arasına yerleştirir. Petrarca'nın Aşkın Zaferi'nde (III. kanto, 76. mısra) yer alır. \"Kötü aşk\"ı örnekleyen üç kadından birisidir, diğer ikisi Byblis ve Myrrha'dır. Floransalı yazar Giovanni Boccaccio'nun 1361-1362 yıllarında yazdığı tarihi ve mitolojik kadınların biyografilerinden oluşan De Mulieribus Claris adlı eserde yer almaktadır. Batı edebiyatında yalnızca kadınların biyografilerine ayrılmış ilk koleksiyon olması bakımından dikkat çekicidir. Semiramis, askeri ve siyasi başarılarından dolayı her zaman hayranlık uyandırmıştır.",
      "Geç Orta Çağ ve Rönesans'ta itibarı kısmen yeniden canlanmıştır. Christine de Pisan'ın 1405'te tamamlanan Kadınlar Şehri Kitabı'na dahil edildi ve on dördüncü yüzyıldan itibaren kadınlar için Dokuz Değerli listesinde sıklıkla yer almıştır.",
    ] },
]

[articles.zh]
text = "在古希腊神话中，塞弥拉弥斯（Semiramis，希臘語：Σεμίραμις）或沙米拉姆（Shamiram，亞美尼亞語：Շամիրամ）是尼诺斯（Ninus）国王的传奇王后，成功地接替了他的亚述王位。 她的传说主要源自西西里的狄奧多羅斯、查士丁和尼多斯人克特西亚斯关于她与尼诺斯国王的关系及她亚述女王神话的描述，但在亚述国王名单中并未得到证实。 在西亚和小亚细亚很多已被遗忘或不知出处的古迹上，都用到了塞弥拉弥斯这个名字。古幼发拉底河或伊朗的每一项巨大工程最终似乎都归结到她，甚至是大流士的贝希斯敦铭文。希罗多德曾认定是她兴建了幼发拉底河围堤，并且知道她的名字作为巴比伦大门的界标。然而，希罗多德也强调，巴比伦空中花园是在塞彌拉彌斯结束统治之后很长一段时间后建成的，而不是在她统治期间内。 塞彌拉彌斯的名字流传在亚述各地和整个美索不达米亚、米底亞、波斯、黎凡特（Levant）、小亚细亚、阿拉伯半岛和高加索，只是稍有变化，甚至在中世纪，凡城的旧名就叫“沙米拉玛克尔特”（亚美尼亚语意思是塞彌拉彌斯建造）。 历史上真实人物-薩穆-拉瑪特（Shammuramat，阿卡德语和阿拉姆语名字），是公元前九世纪亚述国萨姆什-阿达德五世（公元前824年-公元前811年在位）的王后，亚述女王和新亚述帝国的统治者，摄政四年直到她的儿子阿达德-尼拉里三世成年。 现今伊拉克本土亚述人、叙利亚东北、土耳其东南及伊朗西北地区仍将“塞弥拉弥斯”用作女孩的名字。"
title = "沙米拉姆"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E6%B2%99%E7%B1%B3%E6%8B%89%E5%A7%86"
intro = [
  "在古希腊神话中，塞弥拉弥斯（Semiramis，希臘語：Σεμίραμις）或沙米拉姆（Shamiram，亞美尼亞語：Շամիրամ）是尼诺斯（Ninus）国王的传奇王后，成功地接替了他的亚述王位。",
  "在西亚和小亚细亚很多已被遗忘或不知出处的古迹上，都用到了塞弥拉弥斯这个名字。古幼发拉底河或伊朗的每一项巨大工程最终似乎都归结到她，甚至是大流士的贝希斯敦铭文。希罗多德曾认定是她兴建了幼发拉底河围堤，并且知道她的名字作为巴比伦大门的界标。然而，希罗多德也强调，巴比伦空中花园是在塞彌拉彌斯结束统治之后很长一段时间后建成的，而不是在她统治期间内。",
  "塞彌拉彌斯的名字流传在亚述各地和整个美索不达米亚、米底亞、波斯、黎凡特（Levant）、小亚细亚、阿拉伯半岛和高加索，只是稍有变化，甚至在中世纪，凡城的旧名就叫“沙米拉玛克尔特”（亚美尼亚语意思是塞彌拉彌斯建造）。",
  "历史上真实人物-薩穆-拉瑪特（Shammuramat，阿卡德语和阿拉姆语名字），是公元前九世纪亚述国萨姆什-阿达德五世（公元前824年-公元前811年在位）的王后，亚述女王和新亚述帝国的统治者，摄政四年直到她的儿子阿达德-尼拉里三世成年。",
]
sections = [
  { "title" = "狄奥多罗斯·西库路斯的传记", "paragraphs" = [
      "传说她是女神德爾克托（Derketo）的女儿。女神在叙利亚的亞實基倫（Ascalon）受到崇拜，传说她住在这座城附近的湖里。得耳刻托是位有女人脸，鱼形身的女神。爱与美之神阿佛洛狄忒使她疯狂地爱上了叙利亚青年坎斯特洛斯。得耳刻托为他生了一个女儿，由于感到羞愧，所以孩子一出生得耳刻托就把她遗弃了，同时也抛弃了丈夫，自己躲到湖底。结果一群鸽子奇迹般地喂养了这个女婴，它们从邻居牧人家里窃取乳汁喂养她，后来又偷来奶油或奶酪喂她。牧人最终发现了这个容貌出众的女孩，把她带到头人那里，头人给她起名为塞弥拉弥斯（叙利亚语意思是“鸽子养大的”）。",
      "塞弥拉弥斯那时还是个小姑娘，尼诺斯国王的谋士翁涅斯（Onnes）前来查看羊群，在牧人的头人家里看见了她，一下子就被她那如花似玉的容貌所迷住，于是把她带回尼涅威赫同她结婚。",
      "那时尼诺斯国王统治着巴比伦，他召集军队征战大夏。虽然初战受挫，但尼诺斯国王后来还是以绝对优势的军队征服了这个国家，只有巴克特拉（Bactra）还继续顽抗。塞弥拉弥斯的丈夫翁涅斯也随军参战，他非常想念妻子，就派人把她接到前线来。来到后，她注意到围攻正对着平原，这是久攻不下的主要原因。而进攻者和保卫者都忽视了城堡。于是她率领一队人马爬过的峭崖，从侧翼包抄了守城之敌，正在负隅顽抗的士兵都被这突然出现的军队吓昏了，好投降。尼诺斯国王对塞弥拉弥斯足智多谋和英勇顽强的精神佩服的五体投地，不久又被她的美丽所倾倒，这一切促使他要娶塞弥拉弥斯。他向翁涅斯建议。翁涅斯一口回绝，于是国王威胁要挖掉他的眼睛。在绝望中，翁涅斯自缢身亡。",
    ] },
  { "title" = "其他来源", "paragraphs" = [
      "她也被认为是贞操带的发明者。史学家阿米安·马塞林（Ammianus Marcellinus）相信，她第一个将男人阉割为太监：“塞彌拉彌斯，是第一个阉割年青男青年的古代女王”（Lib. XIV）。",
    ] },
  { "title" = "亚美尼亚的传说", "paragraphs" = [
      "亚美尼亚传说描绘她是一个败家者和妓女。这些事实是通过部分观察她在大地上的诞生及消失来解释的。据说，塞弥拉弥斯是鱼女神阿塔耳伽提斯（Atargatis）的女儿，她自己则与伊丝塔或阿斯塔尔塔的鸽子存在着关系。",
      "在亚美尼亚流传最广的，是有关塞弥拉弥斯和亚美尼亚国王-美男子阿拉的传说。20世纪，诗人那依瑞·扎里安（Nairi Zarian）重述的《美男子阿拉与沙米拉姆》的故事，被认为是亚美尼亚文学戏剧的杰作。",
      "据传说，塞弥拉弥斯爱慕美男子-亚美尼亚国王阿拉·格赫齐克（Ara Gekhetsik），希望他能成为自己的后夫，但遭到拒绝。她恼羞成怒，召集亚述军队，决定发动战争来征服亚美尼亚。",
    ] },
  { "title" = "历史人物", "paragraphs" = [
      "与塞彌拉彌斯在希腊历史神话中的功绩一样清晰，历史上的亚述女王薩穆-拉瑪特，亚述国王沙姆什·阿达德五世（Shamshi-Adad V）的妻子，是肯定存在的。在她丈夫去世后，从公元前810年-公元前806年间曾担任过她儿子-阿达德尼拉里三世（Adad-nirari III）的摄政王。",
      "据乔治·洛克斯（Georges Roux）推测，后来的希腊和印度-波斯语系人（波斯人与米底人）风格的塞弥拉弥斯神话，就是源于她曾对他们发动的征战及女人统治这样一个帝国的新奇事。有些学者认同可能存在多位名字叫塞彌拉彌斯的人物。",
    ] },
  { "title" = "希斯录的女神论", "paragraphs" = [
      "为了支持他的说法，希斯录谈到塞彌拉彌斯所提出的鸽子传说。他参考了教会安特-奈西亚教父（Ante-Nicene Fathers）著作中的论断：这些故事始于塞弥拉弥斯发明的宣传及流言，为的是让她的臣民认可她的天堂女王地位并将她的孩子视为神灵。",
      "他认为，所有宗教的对偶神，例如伊希斯/奥西里斯，阿佛罗狄忒/丘比特等，都是塞彌拉彌斯和坦木兹故事的翻版，并认为此后也被应用到天主教的玛丽亚/耶稣身上，尽管基督教并不认同玛丽亚是圣父、圣子和圣灵之外的另一位特殊的神。根据希斯录书中的观点，塞彌拉彌斯后来发展成为了圣母玛利亚。根据希斯录书中的论点。他认为罗马天主教其实属于异教。",
      "作者及阴谋论理论家大卫·艾克（David Icke）在他编写的《最大的秘密》一书中，也采用了希斯录有关塞彌拉彌斯的论点，声称塞弥拉弥斯在爬虫类外星人秘密控制人类的阴谋中起了关键的作用。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "本条目包含来自公有领域出版物的文本: Chisholm, Hugh (编). Encyclopædia Britannica (第11版). London: Cambridge University Press. 1911.",
    ] },
]

[articles.ja]
text = "セミラミス（Semiramis、アラム語: Shamiramシャミーラム）は、紀元前800年頃のアッシリアの伝説上の女王。モデルは紀元前9世紀アッシリアの王シャムシ・アダド5世の王妃でその子アダド・ニラリ3世の摂政を務めたサンムラマートで、ギリシャに渡ってセミラミスとなった。"
title = "セミラミス"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%BB%E3%83%9F%E3%83%A9%E3%83%9F%E3%82%B9"
intro = [
  "セミラミス（Semiramis、アラム語: Shamiramシャミーラム）は、紀元前800年頃のアッシリアの伝説上の女王。モデルは紀元前9世紀アッシリアの王シャムシ・アダド5世の王妃でその子アダド・ニラリ3世の摂政を務めたサンムラマートで、ギリシャに渡ってセミラミスとなった。",
]
sections = [
  { "title" = "概要", "paragraphs" = [
      "世界の七不思議の一つ「バビロンの空中庭園」を造らせたといわれる。シリアの魚の女神アシュケロンのデルケトー（別名アタルタギス）と、とあるシリア人との間にできた娘であるとされ（デルケトーと交わったのは河の神カユストロスという説もある）、幼くして捨てられ、鳩によって育てられた。「セミラミス」はアッシリア語で「鳩」を意味する。",
      "成長した後、ニネヴェの都を築いたアッシリア王ニヌスに寵愛され、息子ニニュアス（Ninyas）を産んだ。また「ニヌス王はセミラミスに毒殺された」という伝説が残っており、これは伝説に残っている最古の毒殺事件といわれている。こうしたセミラミスにまつわる伝説は、ヨーロッパでは演劇やオペラの題材として好んで取り上げられることになる。",
      "しかし最後はニニュアスによって謀殺されたとも、神託により息子の謀反を知って彼に王位を譲り、鳩となって昇天したとも伝えられる。62歳没、在位は42年間に及んだという。15世紀初頭のサルッツォ侯爵トンマーゾ3世による著作『遍歴の騎士』では「九人の女傑」の一人に数えられる。",
    ] },
  { "title" = "『歴史叢書』の記述", "paragraphs" = [
      "彼女の母デルケトーは、あるときアフロディーテの怒りを買ったため女神の若い信者に情愛を抱く呪いを掛けられる。若い信者と関係を持ったことを恥じたデルケトーはその信者を殺し、シリアで生んだ赤子を岩砂漠に放置してアシュケロン(都市)の近くの湖に身を投げたのだった(この後、デルケトーは人面魚の女神となりシリアで崇拝される)。",
      "岩砂漠に捨てられた赤子は、多くの鳩が体を温めたり、ミルクやチーズを運んできたりしたため生きながらえることが出来た。ある日、人々はチーズがあまりに齧り取られていることを不審に思って、周囲を探したところ美しい赤子を発見した。彼女は王室の羊飼いのシンマスに引き渡され、シンマスには子がいなかったので彼女を娘のように世話して「セミラミス(シリア語で鳩の意)」という名を与えた。彼女が成長した頃、アッシリア王室の裁判所から来たシリア総督のオンネスの目に留まり、彼と結婚する。二人は首都ニヌス(ニネヴェ)で暮らし、ヒュアパテス(Hyapates)とヒュダスペス(Hydaspes)の二児が生まれた。オンネスはセミラミスの美貌と才能の虜となり、彼女の助言の通りに行動したので物事が全て上手くいった。",
      "その頃、アッシリアの伝説的な王ニヌスは彼の名を冠した都市を作り終えたので、バクトリア国(現イラン北東部などを含む地域の古名)に再び侵攻した。バクトリアの首都のバクトラの包囲が長引くと、オンネスは妻が恋しくなり彼女を陣営に呼び寄せた。彼女は後々のことを考えて男女の判別が出来ないような形状で、熱を遮り肌の色を隠せるような服を作り、旅に出発した。この時考案した服は利便性に優れていたため、後のメディア王国やペルシア人の間でよく使用された。セミラミスがバクトリアに到着し包囲陣を眺めると、平地や簡単に攻められる拠点に攻撃が集中し、一方で高所にある堅固な砦には誰も攻撃していないのが見て取れた。そこで岩場を登ることに慣れた兵士を連れて渓谷を通り抜け、砦の一部を奪うと平地にいるアッシリア軍に合図を送った。すると守備兵たちは高所を抑えられた恐怖から砦から逃げ去っていった。彼女の活躍に驚いた王は名誉ある贈り物をした。その後、彼女の美しさに魅了された王は、オンネスに自分の娘ソサネス(Sosanê)を妻に与えるので、代わりにセミラミスを渡すように要求した。ニヌス王から同意せねば目玉を抉ると脅されたオンネスは、その恐怖と妻との愛で板挟みになり、狂気に陥って首を吊って自害してしまった。ニヌス王はバクトリアでの戦後処理を終えると、セミラミスとの間に息子のニニュアス(Ninyas)を得た後に死去し、セミラミスを女王として残した。彼女は王を宮殿の敷地内に葬り、そこに高さ9スタディオン(1.6km)、広さ10スタディオン(1.8km)の墳丘を築いた。",
    ] },
  { "title" = "その他の古代の記述", "paragraphs" = [
      "バビロンを支配した女性はセミラミスとニトクリスの二人がおり、前者は後者より5世代前にあたる。セミラミスは平野全体に浸水する川に対して堤防を築きあげた、といった記述が残る。また、バビロンには彼女の名を冠した門が存在したが、ダレイオス1世がバビロンの反乱を鎮圧した際にその他の門もろとも取り壊された。",
      "紀元前2053年（ローマ建国紀元前1300年）バクトリアの街を攻撃中に矢が元でニヌス王が死ぬと、彼の妻であったセミラミスが後を継ぎ、退位するまで息子と共に40年の間、人々の血を使って残酷に国を支配した。彼女は女性という枠組みに囚われず、夫から継承した戦士でエチオピアと戦争して領土に加えた。また、インドと戦争をもたらしたが、それは彼女以外ではアレキサンダー大王でさえもなし得なかった。その頃は、現在よりも残酷で、平和に暮らす人々を殺すことを求め、戦禍が身近にあった。彼女の激しい色欲と残虐さにより、絶え間ない淫靡と殺人が続き、ついに息子との間の近親相姦が周囲に露見した。そこで彼女は、誰もが親と子の間であっても自由に結婚できるように法令を出した。",
      "シリアには「神聖な都市(ヒエラポリス)」（マンビジ）と呼ばれる都市があり、ルキアノスはその寺院や風習について現地の司祭達から聞き知ったことを書き残している。それよると、その地の寺院の創設者は諸説あるがセミラミスとする場合、それは彼女の母親デルケトーに捧げられた建物だという。また、フェニキアにおけるデルケトーは太股から下が魚だが、ヒエラポリスの肖像画では普通の女性として描かれていた。現地ではデルケトーが半分魚であり、セミラミスも下半身が鳩の形態をしていることから、魚と鳩は神聖な生き物として崇められ食用にされないという。寺院の中のゼウスとヘラ像の間には詳細不明な像があり、ある人は金の鳩を戴冠しているためセミラミスの像だと主張している。また、寺院にはギリシャの様々な像が立ち並ぶ中で、左側に右手で寺院を指しているセミラミスの像がある。これには由来があり「あるとき女王がシリア人に自身を神と崇め、ヘラであろうと例外なく信仰してはならない法令を出した。しかし、病気と不幸によって改心して自身を単なる死人と宣言し、女神への信仰に立ち戻るよう人民に命じた。」といった経緯からそうした姿勢をしているのだという。",
    ] },
  { "title" = "アルメニアの伝承", "paragraphs" = [
      "黒魔術に長けたアッシリアの女王セミラミスは、アルメニアの美麗王アラに惚れこみ、求婚するが拒否され、アララト地方に侵略して戦争をけしかけた。しかし戦いでアラは戦死し、悲しみに暮れた彼女は王の遺体にまじないを掛け、復活するよう神に祈りを捧げた。後にアルメニアの民衆がセミラミスの暴虐に反旗を翻そうとすると、彼女はアラが神の力によって蘇り、セミラミスの一愛人となったという嘘を触れ回ったという。",
    ] },
  { "title" = "セミラミスを題材とした作品", "paragraphs" = [
      "1648年に発表されたオペラ『インドのセミラーミデ』を皮切りに、1910年までに65以上のオペラが作られている。中でも著名なものがジョアキーノ・ロッシーニ作曲の『セミラーミデ』（1823年初演）である。",
      "バビロニアの女王セミラーミデはかつてアッスールと共謀して夫である前王ニーノを毒殺し、15 年経ったいま新たな王を指名する時を迎えていた。若い武将アルサーチェをひそかに愛する女王は、人々の前で彼を「王にして自分の夫となるべき者」と指名する。アッスールはアルサーチェへの復讐を企てるが、アルサーチェは自分がセミラーミデと前王ニーノの息子ニーニャであると祭祀長オローエに教えられる。やがてセミラーミデもその事実を知って絶望し、自分を殺して父の仇を討つようアルサーチェに求める。アルサーチェは母と和解してアッスールへの復讐に赴くが、暗い地下墓所で彼の剣に倒れたのはセミラーミデだった。アッスールは逮捕され、母を手にかけたアルサーチェは自分の運命を呪うが、すべては神意の成就とする民衆から新たな王に迎えられる。(『ロッシーニ協会演奏会 歌劇《セミラーミデ》抜粋』から引用)",
      "邦題『風雲のバビロン』1954年にイタリアで公開された。原題『Semiramis Esclave et Reine』。英語題名「Queen of Babylon」。セミラミス役はロンダ・フレミング。",
    ] },
]

[articles.vi]
text = "Semiramis (; tiếng Syriac: ܫܲܡܝܼܪܵܡ Šammīrām, tiếng Hy Lạp: Σεμίραμις Semiramis, tiếng Armenia: Շամիրամ Šamiram) là một nữ vương huyền thoại của Assyria. Bà là người Lydia-Babylon, vợ của Onnes và Ninus."
title = "Semiramis"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Semiramis"
intro = [
  "Semiramis (; tiếng Syriac: ܫܲܡܝܼܪܵܡ Šammīrām, tiếng Hy Lạp: Σεμίραμις Semiramis, tiếng Armenia: Շամիրամ Šamiram) là một nữ vương huyền thoại của Assyria. Bà là người Lydia-Babylon, vợ của Onnes và Ninus. Các truyền thuyết được kể lại bởi Diodorus Siculus, lấy nguồn từ các tác phẩm của Ctesias của Cnidus, nói về bà và mối quan hệ với Onnes và Vua Ninus, một vị vua trong truyền thuyết của Assyria, không được ghi lại trong Danh sách vua Assyria. Người Assyria bản địa ở Iraq, đông bắc Syria, đông nam Thổ Nhĩ Kỳ và tây bắc Iran vẫn sử dụng Semiramis (cũng như Shamiram) để đặt tên cho trẻ em nữ.",
  "Nhân vật Shammuramat thực tế trong lịch sử (dạng gốc tiếng Akkad và Aramaic) là người vợ người Assyria của Shamshi-Adad V (trị vì 824 TCN - 811 TCN), vua của Assyria và là người trị vì Đế chế Tân Assyria. Sau khi chồng qua đời, bà trở thành nhiếp chính trong năm năm cho đến khi con trai bà Adad-nirari III đến tuổi trưởng thành. Bà nắm quyền vào thời điểm bất ổn về chính trị, điều này có thể giải thích tại sao người Assyria có thể chấp nhận sự cai trị của một người phụ nữ (điều thông thường không thể xảy ra). Người ta đã suy đoán rằng bà đã trị vì rất thành công, được người Assyria tôn sùng, và những thành tựu triều đại của bà đạt được (bao gồm ổn định và củng cố đế chế sau một cuộc nội chiến tàn phá) đã được truyền tụng qua các thế hệ cho đến khi bà được nâng lên thành một nhân vật thần thoại.",
  "Tên tuổi của Semiramis được gắn cho nhiều công trình khác nhau ở Tây Á và Tiểu Á, nguồn gốc đã bị lãng quên hoặc không rõ. Nhiều địa điểm khác nhau ở Assyria và khắp Mesopotamia nói chung, Media, Ba Tư, Levant, Tiểu Á, Ả Rập, và Kavkaz mang tên Semiramis, với một vài sai khác, thậm chí cả ở thời Trung cổ. Một tên cũ của thành phố Van của người Armenia là Shamiramagerd (trong tiếng Armenia có nghĩa là được tạo bởi Semiramis). Gần như mọi công trình lớn hay tác phẩm nghệ thuật cổ đại ở lưu vực sông Euphrates hoặc ở Iran đều được gắn với tên tuổi Semiramis, thậm chí cả Bản khắc Behistun của Darius, hoặc Vườn treo Babylon. Herodotus cho rằng bà là người cho xây dựng hệ thống đê điều định hướng dòng chảy sông Euphrates và tên bà được đặt cho một trong cánh cổng của Babylon.",
]
sections = [
  { "title" = "Nhân vật lịch sử", "paragraphs" = [
      "Trong khi Semiramis trong truyền thuyết trị vì vương quốc Ba Tư huyền thoại trong sử sách Hy Lạp và Armenia, thì nữ vương Assyrian Shammuramat (Semiramis), vợ của Shamshi-Adad V (không phải Ninus hư cấu như trong truyền thuyết), chắc chắn có tồn tại. Sau cái chết của chồng, bà trở thành nhiếp chính từ 811- 806 TCN cho con trai mình, Adad-nirari III. Do đó trong một thời gian ngắn, Shammuramat nắm quyền cai trị Đế quốc Tân Assyrian rộng lớn (911-605 TCN), trải dài từ dãy Kavkaz ở phía bắc cho tới Bán đảo Ả Rập ở phía nam, và từ Tây Iran ở phía đông cho tới Đảo Síp ở phía tây.",
      "Bà nắm quyền vào thời điểm bất ổn về chính trị, điều này có thể giải thích tại sao người Assyria có thể chấp nhận sự cai trị của một người phụ nữ (điều thông thường không thể xảy ra). Người ta đã suy đoán rằng bà đã trị vì rất thành công, được người Assyria tôn sùng, và những thành tựu triều đại của bà đạt được (bao gồm ổn định và củng cố đế chế sau một cuộc nội chiến tàn phá) đã được truyền tụng qua các thế hệ cho đến khi bà được nâng lên thành một nhân vật thần thoại. Tại thành phố Ashur, bà cho xây một obelisk (bút tháp), ghi lại rằng: Bia của Sammuramat, nữ vương của Shamshi-Adad, Vua của vũ trụ, Vua của Assyria, Mẹ của Adad Nirari, Vua của vũ trụ, Vua của Assyria, Con dâu của Shalmaneser, Vua của Bốn Miền Thế giới. Georges Roux suy đoán rằng các huyền thoại Hy Lạp và Ấn-Iran (Ba Tư và Media) sau này dựng lên các huyền thoại xoay quanh Semiramis lấy cảm hứng từ các chiến dịch quân sự thành công mà bà tiến hành chống lại các dân tộc này, và tính mới lạ về việc một người phụ nữ cai trị một đế chế rộng lớn như vậy.",
    ] },
  { "title" = "Truyền thuyết theo kể lại của Diodorus Siculus", "paragraphs" = [
      "Theo Diodorus, Semiramis có nguồn gốc quý tộc, là con gái của nữ thần cá Derketo của Ascalon ở Assyria và một người phàm. Sau khi sinh con, Derketo bỏ rơi đứa trẻ và nhảy xuống sông. Đứa trẻ được chim bồ câu cho ăn, cho đến khi được người chăn cừu Simmas tìm thấy. Semiramis kết hôn với Onnes hoặc Menones, một trong những vị tướng của Vua Ninus. Lời khuyên của bà đã giúp ông giành được những thắng lợi to lớn, và tại cuộc bao vây Bactra, bà đã đích thân chỉ huy một đạo quân đi chiếm một yếu điểm phòng ngự, khiến thành phố phải đầu hàng. Ninus ấn tượng đến nỗi rơi vào lưới tình với bà ngay tức khắc, và ép Onnes phải đưa bà cho ông ta làm vợ, đầu tiên là đổi bằng con gái của ông Sonanê và sau đó đe dọa sẽ móc mắt Onnes ra. Onnes, vừa sợ nhà vua lại vừa yêu vợ say đắm, trở nên điên loạn và treo cổ tự tử. Ninus sau đó cưới bà làm vợ.",
      "Semiramis và Ninus có một con trai tên Ninyas. Sau khi vua Ninus chinh phục châu Á, bao gồm cả Bactrians, ông đã bị thương nặng bởi một mũi tên. Semiramis sau đó giả trang thành con trai của mình và khiến quân đội của người chồng quá cố làm theo chỉ dẫn của bà vì họ nghĩ rằng những mệnh lệnh này đến từ vị vua mới. Sau cái chết của Ninus, bà trị vì như nữ vương cầm quyền trong suốt 42 năm, chinh phục phần lớn châu Á. Semiramis đã khôi phục Babylon cổ đại và phòng thủ bằng một bức tường gạch cao bao quanh thành phố hoàn toàn. Bà cũng xây dựng một số cung điện ở Ba Tư, bao gồm Ecbatana. Diodorus cũng gắn tên bà cho bia Behistun, hiện đã được biết là thực hiện dưới thời Darius I của Ba Tư (trị vì 522-486 TCN). Bà không chỉ cai trị châu Á một cách hiệu quả mà còn sáp nhập Libya và Aethiopia vào đế chế. Sau đó, bà gây chiến với vua Stabrobates (Sthabarpati) của Ấn Độ, cho làm một đội quân voi giả bằng cách khoác da trâu tối màu lên những con lạc đà để đánh lừa quân Ấn Độ. Kế hoạch này ban đầu thành công, nhưng sau đó bà bị thương trong cuộc phản công và quân đội của bà bị tiêu diệt phần lớn, bị buộc phải tái chiếm Indus và rút lui về phía tây.",
    ] },
  { "title" = "Trong truyền thuyết cổ đại", "paragraphs" = [
      "Những truyền thuyết liên quan đến Semiramis đã được ghi chép bởi các tác giả bao gồm Plutarch, Eusebius, Polyaenus và Justinus. Bà được gắn với hình ảnh nữ thần Ishtar và Astarte từ trước cả thời Diodorus. Bà cũng được liên kết với biểu tượng cá và chim bồ câu, như được thể hiện tại Hierapolis Bambyce (Mabbog), ngôi đền lớn theo một truyền thuyết được cho là thành lập bởi Semiramis, nơi có một bức tượng của bà với chim bồ câu vàng trên đầu.",
      "Tên tuổi của Semiramis được gắn cho nhiều công trình khác nhau ở Tây Á và Tiểu Á, nguồn gốc đã bị lãng quên hoặc không rõ. Nhiều địa điểm khác nhau ở Assyria và khắp Mesopotamia nói chung, Media, Ba Tư, Levant, Tiểu Á, Ả Rập, và Kavkaz mang tên Semiramis, với một vài sai khác, thậm chí cả ở thời Trung cổ. Bà được ghi nhận là người sáng lập thành phố Van để làm nơi cư trú mùa hè, và thành phố cũng có thể được gọi là Shamiramagerd (trong tiếng Armenia có nghĩa là được tạo ra bởi Semiramis). Strabo tin rằng bà đã xây dựng các công trình kiến trúc \"trên khắp toàn bộ lục địa\". Gần như mọi công trình lớn hay tác phẩm nghệ thuật cổ đại ở lưu vực sông Euphrates hoặc ở Iran đều được gắn với tên tuổi Semiramis, thậm chí cả Bản khắc Behistun của Darius, hoặc Vườn treo Babylon. Herodotus cho rằng bà là người cho xây dựng hệ thống đê điều định hướng dòng chảy sông Euphrates và tên bà được đặt cho một trong cánh cổng của Babylon.",
      "Nhà sử học La Mã Ammianus Marcellinus tin rằng bà là người đầu tiên thiến một thiến niên nam làm hoạn quan: \"Semiramis, vị nữ vương cổ đại, là người đầu tiên thiến những thiếu niên nam trước khi trưởng thành.\"",
    ] },
  { "title" = "Trong văn hóa sau này", "paragraphs" = [
      "Semiramis thường được nhìn nhận theo hướng tích cực trước khi Kitô giáo lên ngôi, mặc dù cũng tồn tại một số quan điểm tiêu cực. Trong thời Trung cổ, bà bị gắn liền với tính lăng loàn và dâm đãng. Một câu chuyện cho rằng bà có mối quan hệ loạn luân với con trai, bào chữa cho điều đó bằng cách thông qua luật để hợp pháp hóa hôn nhân giữa cha mẹ và con cái, và phát minh ra đai trinh tiết để răn đe bất kỳ đối thủ tình cảm cho đến khi cuối cùng bị giết bởi con mình. Điều này có thể đã được lan truyền vào thế kỷ thứ 5 bởi cuốn Lịch sử phổ thông của Orosius (Bảy cuốn Sách sử Chống Ngoại giáo), được cho là nằm trong một \"cuộc bút chiến chống ngoại giáo\". Trong Hài kịch thần thánh, Dante nhìn thấy Semiramis trong số linh hồn của những kẻ dâm đãng trong Tầng địa ngục thứ hai. Tuy nhiên, bà cũng được ngưỡng mộ vì những thành tựu chiến trận và chính trị, và có ý kiến cho rằng danh tiếng của bà đã phục hồi phần nào vào cuối thời Trung cổ và Phục hưng. Bà được đưa vào Sách về những Thành phố của Phụ nữ của Christine de Pizan (hoàn thành năm 1405), và bắt đầu từ thế kỷ 14, bà thường có tên trong các danh sách nữ của Cửu Vĩ Nhân (Khái niệm thời Trung đại về 9 nhân vật lịch sử, tôn giáo, huyền thoại mang hình tượng Hiệp sĩ lý tưởng).",
      "Semiramis xuất hiện trong nhiều vở kịch và nhạc kịch, chẳng hạn như bi kịch Semiramis của Voltaire, và trong nhiều vở opera riêng biệt với tiêu đề Semiramide bởi Domenico Cimarosa, Marcos Portugal, Josef Mysliveček, và Giacomo Meyerbeer, Pedro Calderón de la Barca và Gioachino Rossini. Arthur Honegger đã soạn nhạc một vở \"kịch câm ballet\" cùng tên của Paul Valéry vào năm 1934, chỉ được phục hồi vào năm 1992 sau nhiều năm bị lãng quên. Trong vở kịch Những chiếc ghế của Eugène Ionesco, nhân vật Bà già được gọi là Semiramis. Bà được Chaucer nhắc đến trong tác phẩm The Craft of Lovers như là \"Nữ vương của Babilon\", cũng như bởi Shakespeare trong Màn 2 Cảnh 1 của Titus Andronicus và Cảnh 2 của Lời giới thiệu trong The Taming of the Shrew. Semiramis thường được dùng như hình ảnh ẩn dụ cho người phụ nữ cai trị và đôi khi phản ánh các tranh chấp chính trị có liên quan đến các nhà lãnh đạo nữ, thường theo hướng bất lợi (ví dụ, để chỉ trích Elizabeth I của Anh). Cũng có khi bà được sử dụng như một ví dụ về một người phụ nữ trị vì có năng lực, như các vị quân chủ quyền lực Margrete I của Đan Mạch và Yekaterina II Đại đế đều được gọi là Semiramis của phương Bắc.",
    ] },
]

[articles.id]
text = "Semiramis (Asyur;ܫܲܡܝܼܪܵܡ Shamiram, ; bahasa Yunani: Σεμίραμις, bahasa Armenia: Շամիրամ Shamiram) merupakan istri legendaris dari Onnes, dan Ninus kemudian, menggantikan yang terakhir ke takhta Asyur. Legenda yang diriwayatkan oleh Diodoros Sikolos, yang menggambar dari karya-karya Ktesias dari Knidos menggambarkannya dan hubungannya dengan Onnes dan Raja Ninus, seorang raja mitos Asyur yang tidak dibuktikan dalam Daftar Raja Asyur yang jauh lebih tua dan lebih komprehensif."
title = "Semiramis"
lang = "id"
url = "https://id.wikipedia.org/wiki/Semiramis"
intro = [
  "Semiramis (Asyur;ܫܲܡܝܼܪܵܡ Shamiram, ; bahasa Yunani: Σεμίραμις, bahasa Armenia: Շամիրամ Shamiram) merupakan istri legendaris dari Onnes, dan Ninus kemudian, menggantikan yang terakhir ke takhta Asyur.",
  "Legenda yang diriwayatkan oleh Diodoros Sikolos, yang menggambar dari karya-karya Ktesias dari Knidos menggambarkannya dan hubungannya dengan Onnes dan Raja Ninus, seorang raja mitos Asyur yang tidak dibuktikan dalam Daftar Raja Asyur yang jauh lebih tua dan lebih komprehensif.",
  "Shammuramat yang sebenarnya dan historis (bentuk nama asli bahasa Akkadia dan bahasa Aram) adalah istri Asyur Shamshi-Adad V (memerintah pada tahun 824 SM–811 SM), raja Asyur dan penguasa Kerajaan Neo-Asyur, dan pemangku takhta selama lima tahun sampai putranya Adad-nirari III cukup usia dan mengambil kendali kekuasaan.",
  "Asyur asli Irak, timur laut Suriah, tenggara Turki, dan barat laut Iran masih menggunakan Semiramis (juga Shamiram) sebagai nama yang diberikan untuk anak-anak perempuan.",
]
sections = [
  { "title" = "Daftar pustaka", "paragraphs" = [
      "Artikel ini menyertakan teks dari suatu terbitan yang sekarang berada pada ranah publik: Chisholm, Hugh, ed. (1911). \"Semīramis\" . Encyclopædia Britannica. Vol. 24 (Edisi 11). Cambridge University Press. hlm. 617.",
      "BERINGER, A. 2016. The Sight of Semiramis: Medieval and Early Modern Narratives of the Babylonian Queen. Tempe: Arizona State University Press.",
    ] },
]

[articles.pt]
text = "Semíramis (em grego: Σεμίραμις; em armênio: Շամիրամ) foi uma lendária rainha da Assíria e fundadora da Babilônia, conhecida de fontes gregas, armênias e judaicas. Lendas que descrevem Semíramis foram registradas por cerca de 80 escritores antigos, incluindo Taciano, Plutarco, Eusébio de Cesareia, Polieno, Valério Máximo, Paulo Orósio e Justino."
title = "Semíramis"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Sem%C3%ADramis"
intro = [
  "Semíramis (em grego: Σεμίραμις; em armênio: Շամիրամ) foi uma lendária rainha da Assíria e fundadora da Babilônia, conhecida de fontes gregas, armênias e judaicas.",
  "Lendas que descrevem Semíramis foram registradas por cerca de 80 escritores antigos, incluindo Taciano, Plutarco, Eusébio de Cesareia, Polieno, Valério Máximo, Paulo Orósio e Justino.",
]
sections = [
  { "title" = "Origem da lenda", "paragraphs" = [
      "Embora as conquistas de Semíramis estejam claramente no campo da historiografia mítica persa, armênia e grega, o nome Semíramis é histórico. A esposa do rei assírio Samsiadade V (r. 824-811 a.C.) se chamava Samuramate, que é traduzido corretamente em grego como Semíramis. Após a morte de seu marido, ela atuou como regente para seu filho menor de idade, Adadenirari III, por três ou talvez cinco anos. Samuramate teria, portanto, estado brevemente no controle do vasto Império Neoassírio (911-605 a.C.), que se estendia das montanhas do Cáucaso no norte até a Península Arábica no sul e do planalto iraniano no leste até Mar Mediterrâneo no oeste. O estudioso alemão Carl Lehmann-Haupt (1861-1938) propôs uma plausível teoria sobre as origens da lenda de Semíramis. Ele acreditava que a história se originou no leste, com os medos, um povo iraniano que guerreavam com os assírios. Sendo que o primeiro contato entre medos e assírios ocorreu na época da rainha Samuramate, os medos acreditavam que ela era a fundadora do Império Assírio. Georges Roux especulou que os posteriores mitos gregos e iranianos em torno de Semíramis derivam de campanhas bem-sucedidas que Samuramate travou contra os povos iranianos e da novidade de uma mulher governando um império como esse.",
      "Na Mesopotâmia persa, a já lendária figura se fundiu com a deusa do amor Istar, o que explica as aventuras eróticas de Semíramis. Além disso, há, é claro, acréscimos reconhecíveis na lendária literatura oriental, como a insaciável ninfomaníaca que mata seus parceiros (reconhecido na Epopeia de Gilgamés). Os medos podem ter passado a lenda aos persas, de onde Ctésias deve ter ouvido.",
      "Os estudiosos e historiadores discutem se Samuramate foi a inspiração para os mitos sobre Semíramis. O debate já se arrasta há algum tempo, mas, ainda assim, parece muito provável que as lendas de Semíramis foram, de fato, inspiradas pelo reinado da rainha Samuramate e tem sua base, se não em seus atos reais, pelo menos na impressão que ela causou nas pessoas de seu tempo.",
    ] },
  { "title" = "Lendas", "paragraphs" = [
      "O primeiro a mencionar Semíramis é o historiador grego Heródoto, que nos conta que ela fortificou as margens do rio Eufrates e também menciona que um portão da cidade na Babilônia foi batizado em sua homenagem. A verdadeira história surge um pouco mais tarde, com o autor grego Ctésias de Cnido. Embora suas obras estejam em grande parte perdidas, sua história da rainha Semíramis é recontada por Diodoro Sículo. De acordo com Diodoro, Semíramis era filha da deusa-peixe Derceto e de um mortal. Derceto a abandonou ao nascer e se afogou. Pombas alimentaram a criança até que Simas, o pastor real, a encontrou. Semíramis casou-se com Ones ou Menones, um dos generais do rei Nino. Seu conselho o levou a grandes sucessos, e no cerco de Bactro, ela liderou pessoalmente um grupo de soldados para tomar um ponto-chave na defesa, levando à rendição da cidade. Nino ficou tão impressionado que se apaixonou por ela e tentou obrigar Ones a dá-la como esposa, primeiro oferecendo sua própria filha Sonane em troca e eventualmente ameaçando arrancar seus olhos como punição. Ones, por medo do rei e por paixão condenada por sua esposa, \"caiu em uma espécie de frenesi e loucura\" e se enforcou. Nino então se casou com ela.",
      "Semíramis e Nino tiveram um filho chamado Ninias. Depois que o rei Nino conquistou a Ásia, incluindo os bactrianos, ele foi mortalmente ferido por uma flecha. Semíramis então se disfarçou de seu filho e enganou o exército de seu falecido marido para seguir suas instruções porque pensaram que vinham de seu novo governante. Após a morte de Nino, ela reinou como rainha reinante por 42 anos, conquistando grande parte da Ásia. Semíramis restaurou a antiga Babilônia e protegeu-a com um muro alto de tijolos que cercava completamente a cidade. Ela também construiu vários palácios na Pérsia, incluindo Ecbátana na Média, onde teve um amante após o outro e matou todos eles. Ela não apenas governou a Ásia com eficácia, mas também subjugou o Egito e invadiu a Índia. Ela então foi à guerra com o rei índio Estabrobates (Satiavrata) fazendo com que seus artesãos construíssem um exército de falsos elefantes colocando peles manipuladas de búfalos de pele escura sobre seus camelos para enganar os índios e fazê-los pensar que adquirira elefantes de verdade. Esta manobra teve sucesso inicialmente, mas então ela foi ferida no contra-ataque e seu exército foi aniquilado, forçando os remanescentes a cruzarem o Indo e recuarem para o oeste. Quando esta campanha terminou em fracasso, ela abdicou, após o que foi misteriosamente colocada entre os deuses. A mulher que de fato teria sido a fundadora do Império Assírio passou a ser venerada sob a forma de um pombo.",
      "Entre várias lendas, a armênia, que pode ser encontrada nos livros de Moisés de Corene, retrata Semíramis negativamente. Uma das lendas mais populares da tradição armênia envolve Semíramis e um rei armênio, Ara, o Belo. De acordo com a lenda, Semíramis se apaixonou pelo belo rei armênio Ara e pediu-lhe em casamento. Quando ele recusou, em sua paixão ela reuniu os exércitos da Assíria e marchou contra a Armênia. Durante a batalha, Semíramis foi vitoriosa, mas Ara foi morto apesar de suas ordens para capturá-lo vivo. Para evitar a guerra contínua com os armênios, Semíramis, considerada uma feiticeira, pegou seu corpo e orou aos deuses para ressuscitar Ara dos mortos. Quando os armênios avançaram para vingar seu rei, ela disfarçou um de seus amantes como Ara e espalhou o boato de que os deuses haviam trazido Ara de volta à vida, convencendo os armênios a não continuarem a guerra. Em uma tradição persistente, as orações de Semíramis são bem-sucedidas e Ara retorna à vida. Durante o século 19, também foi relatado que uma vila chamada Lezk, perto de Vã, tradicionalmente afirmava que era o local da ressurreição de Ara.",
    ] },
  { "title" = "Na posterioridade", "paragraphs" = [
      "Semíramis era geralmente vista de forma positiva antes da ascensão do Cristianismo, embora retratos negativos existissem. Durante a Idade Média, ela foi associada à promiscuidade e à luxúria. Uma história afirmava que ela tinha um relacionamento incestuoso com seu filho, justificando-o com a aprovação de uma lei para legitimar o casamento entre pais e filhos e inventando o cinto de castidade para dissuadir qualquer rival romântico antes que ele a matasse. Isso foi provavelmente popularizado no século V pela História Universal de Paulo Orósio (Sete Livros de História Contra os Pagãos), que foi descrito como uma \"polêmica anti-pagã\". Na Divina Comédia, Dante vê Semíramis entre as almas dos luxuriosos no Segundo Círculo do Inferno. Ela aparece no triunfo do amor de Francisco Petrarca, canto III, versículo 76. Ela é uma das três mulheres (as outras duas sendo Biblis e Esmirna) exemplificando o \"amor maligno\". Ela é lembrada em De mulieribus claris, uma coleção de biografias de mulheres históricas e mitológicas do autor florentino Giovanni Boccaccio, composta no século XIII. No entanto, ela também era admirada por suas realizações marciais e políticas, e foi sugerido que sua reputação se recuperou parcialmente no final da Idade Média e Renascimento. Ela foi incluída em O Livro da Cidade de Senhoras, de Christine Pizan, e a partir do século XIV ela foi comumente encontrada em listas femininas de Nove da Fama.",
      "Semíramis aparece em muitas peças e óperas, como a tragédia Semiramis, de Voltaire, e em várias óperas separadas com o título Semiramide de Domenico Cimarosa, Marcos Portugal, Josef Mysliveček e Giacomo Meyerbeer, Calderón de la Barca e Gioachino Rossini. Arthur Honegger compôs música para o homônimo 'balé-pantomima' de Paul Valéry em 1934, que só foi revivido em 1992 após muitos anos de abandono. Na peça Les Chaises, de Eugène Ionesco, a velha é referida como Semíramis. Ela foi mencionada por Chaucer em sua compilação The Craft of Lovers, como \"Queene of Babilon,\" bem como por Shakespeare no Ato 2, Cena 1 de Tito Andrônico e Cena 2 da Introdução em The Taming of the Shrew. O retrato de Semíramis foi usado como uma metáfora para o governo feminino e às vezes refletia disputas políticas em relação às governantes mulheres, tanto como uma comparação desfavorável (por exemplo, contra Isabel I de Inglaterra) e como um exemplo de uma governante mulher que governava bem. Poderosas monarcas como Margarida I da Dinamarca e Catarina II da Rússia receberam a designação de Semíramis do Norte.",
      "No século XX, ela também apareceu em vários filmes peplums, incluindo o filme La cortigiana di Babilonia, de 1954, no qual ela foi interpretada por Rhonda Fleming, e o filme Io, Semiramide, de 1963, no qual ela foi interpretada por Yvonne Furneaux. No romance de John Myers Myers, Silverlock, Semíramis aparece como uma rainha luxuriosa e comandante, que interrompe sua procissão para tentar seduzir um jovem.",
    ] },
  { "title" = "Na cultura", "paragraphs" = [
      "Entre 1303 e 1321: Dante Alighieri evoca-o na primeira parte da Divina Comédia, intitulada Inferno.",
      "1405: Christine de Pizan toma Semíramis como a primeira pedra de sua \"Cidade de Senhoras\", e como um primeiro exemplo de uma série de alegorias da Santa Mãe e a Virgem.",
      "1729: Pietro Metastasio por seu Semiramide. Drama musicado pela primeira vez com música de Leonardo Vinci.",
    ] },
