[articles.en]
text = "Anacaona was a Taíno cacica, zemi interpreter, composer, and poet born in Yaguana, Jaragua, Hispaniola. After the death of her brother Bohechío in 1500, she became the ruler of Jaragua."
title = "Anacaona"
lang = "en"
url = "https://en.wikipedia.org/wiki/Anacaona"
intro = [
  "Anacaona (c. 1474 – c. 1504) was a Taíno cacica, zemi interpreter, composer, and poet born in Yaguana, Jaragua, Hispaniola (present-day Léogâne, Haiti). After the death of her brother Bohechío in 1500, she became the ruler of Jaragua. In the centuries since her death, she has been re-imagined and memorialized in various forms of poetry, music, and literature from Haiti, the Dominican Republic and the wider Caribbean.",
  "Prior to becoming cacica, Anacaona was married to a Caonabo, a cacique from the Lucayos (now The Bahamas) who conquered the cacicazgo of Maguana in 1470. However, she spent most of her time in Jaragua with Bohechío. With Christopher Columbus's arrival in Hispaniola in 1492, the Spanish began enslaving Taínos, resulting in conflict. Caonabo, who fought against the Spanish, was ultimately captured and banished in 1496. After Christopher left, his brother Bartholomew took over the administration of Hispaniola in 1496. Anacaona played a prominent role during Bartholomew's visits to Jaragua, welcoming him, helping to facilitate tribute payments to him, and offering him valuable gifts, potentially suggesting her administrative authority and status as a steward of luxury goods.",
  "As cacica, Anacaona initially maintained a policy of cooperation with the Spanish, who continued to mistreat and enslave the Taíno. This led to frequent rebellions, with many enslaved Taíno fleeing to find sanctuary in Jaragua. In 1497, Spanish rebels led by Francisco Roldán also sought refuge in Jaragua among the Taíno. In 1502, Nicolás de Ovando arrived in Hispaniola after being appointed governor, and, after subduing the cacicazgo of Higüey, traveled to Jaragua in 1503. Anacaona welcomed him, gathering the local Taíno to honor him. However, after the Spanish massacre of between 40 and 80 caciques, for which various reasons have been proposed, she was captured and transported to Santo Domingo (present-day Dominican Republic) and executed by the Spanish.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Anacaona was born c. 1474 in Yaguana, Jaragua (present-day Léogâne, Haiti). Her name was derived from the Taíno words ana, meaning flower, and caona, meaning \"gold\". She was the sister of Bohechío, cacique of Jaragua. Anacaona had a reputation as a beautiful, cultured, and kind woman. She was trained in zemi interpretation, for which she was highly respected, and was an acclaimed composer and poet. Her compositions were commonly performed at areítos. None of her writings survive.",
      "Both the Greater Antilles and the Lesser Antilles were historically sites of considerable cultural diversity, but a common distinction is often made between the Taíno people of the Greater Antilles and the Kalinago of the Lesser Antilles. Several Kalinago groups launched military incursions into Hispaniola during the late 15th century, and in 1470, Caonabo, a cacique from the Lucayos (now The Bahamas), conquered the cacicazgo of Maguana, which bordered Jaragua. In response to these Kalinago incursions, many Taíno caciques began pursuing political alliances with each other, and as of 1475, Bohechío was consolidating his own rule in territories to the west of Jaragua. As a result, he arranged a political marriage between Anacaona and Caonabo. The exact nature of their relationship is unknown. Caonabo had many wives, and it is possible that Anacaona was among the highest-ranked of them. It is known that the couple had one daughter: Higuenamota. Anacaona only stayed with Caonabo for short intervals, spending most of her time in Jaragua with Bohechío.",
    ] },
  { "title" = "Arrival of the Spanish", "paragraphs" = [
      "An expedition led by explorer Christopher Columbus first arrived in Hispaniola on 24 December 1492, when his flagship, the Santa María, crashed on the north coast of the island. Guacanagaríx, cacique of Marién, welcomed him and provided the members of the expedition with shelter. Columbus left behind 38 of his men in Marién at a fort called La Navidad. By the time Columbus returned to Hispaniola in 1493, La Navidad had been destroyed. Guacanagaríx gave various accounts of La Navidad's destruction, ultimately claiming that Caonabo had destroyed the fort, possibly as a result of abuses perpetrated against Taíno women and possibly because he resented Guacanagaríx's perceived alliance with the Spanish. Columbus ordered the construction of the town of La Isabela in 1494 and traveled south after hearing rumors that there were gold and settlements there. Conflict arose between the Spanish and the Taíno when the Spanish began enslaving Taínos for forced construction labor. Caonabo fought back against the Spanish, and in 1496, conquistador Alonso de Ojeda was dispatched to capture him. At the Battle of Vega Real, he succeeded, and Caonabo was banished from Hispaniola, dying soon after.",
      "Christopher left the administration of the colony to his brother Bartholomew in 1496. Bartholomew entered Jaragua, where he was welcomed by Anacaona and Bohechío. Historian Maria Isabel Cabrera Bosch speculates that Anacaona held considerable authority over the cacicazgo's administration. Bartholomew demanded tribute, which Bohechío agreed to pay in cassava bread and cotton. In 1497, Bartholomew returned to Jaraugua, where he was again received by Anacona and Bohechío, to collect this tribute. A lavish feast was thrown for him, and the tribute was presented. The Spanish then transported the tribute up the coast, accompanied by Anacaona and Bohechío. At some point along the way, Anacaona stopped at a \"little hamlet\" that belonged to her. According to historian Bartolomé de las Casas, the hamlet was \"full of a thousand things made of cotton, and seats and many vessels and things of service in the house, made of wood, marvelously worked\". She gifted many of these items to Bartholomew. Anthropologist Samuel M. Wilson speculates that this may be indicative of women's role as producers and stewards of luxury goods in Taíno society. Las Casas also claims that when the party reached Port-au-Prince Bay, Anacaona, who possessed a large, well-decorated canoe, chose instead to ride in Bartholomew's boat to meet the Spanish ships. Meanwhile, historian Peter Martyr d'Anghiera indicates she had a separate canoe for herself and her followers.",
    ] },
  { "title" = "Reign", "paragraphs" = [
      "After Bohechío died in 1500 without issue, Anacaona succeeded him as cacica of Jaragua. Martyr claims that after Bohechío's death, Anacona had her brother's \"most beautiful\" wife buried alive alongside him and was reportedly prevented from burying others in the same manner by a Franciscan friar. This was allegedly a common practice among Taíno at the time. By that point, the territory of Jaragua extended eastward to the Neyba and Ozama Rivers in the modern-day Dominican Republic. While the Spanish continued to mistreat the Taíno, enslaving them to work in Spanish mines, Anacona initially continued Bohechío's policy of cooperating with them. Though, as rebellions against the Spanish grew more frequent, many enslaved Taínos fled to Jaragua seeking safety.",
      "Refugees from a 1497 rebellion initiated by Spaniard Francisco Roldán against members of the Columbus family also fled to Jaragua, where they settled amongst the Taíno. According to historian Diomedes Núñez Polanco, Anacaona married Roldán, and Higuenamota, her daughter, entered into a romantic relationship with Spaniard Hernando de Guevara, who later led an uprising against Roldán. Academic Cecile Accilien claims that the Spanish disapproved of the relationship between Higuenamota and de Guevara, ultimately resulting in de Guevara's death.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "In 1501, Nicolás de Ovando was appointed governor of Hispaniola, arriving on the island in 1502. Ovando reorganized Hispaniola, setting aside large tracts of land in Higüey, Vega Real, and Jaragua for food production. After subduing the people of Higüey, he traveled to Jaragua in 1503 with a contingent of 300 men. Anacaona received him. According to Las Casas, she \"ordered all of the senores of that kingdom and all the people of their towns to come to her city of Xaragua to receive, celebrate, and give their reverence to the Guamiquina [great lord] of the Christians\".",
      "After this, Ovando lured between 40 and 80 caciques into a hut and burned them alive. Anacona was then taken to Santo Domingo, where she was imprisoned and tortured for three months. She was then hanged, according to Las Casas, to \"show her honor\". Various reasons have been proposed for this. Amongst early historians, Las Casas claims that the Spanish regularly committed such massacres to \"instill and engender fear\". Gonzalo Fernández de Oviedo y Valdés claims that Ovando went to Jaragua to quash a secret rebellion planned by the caciques. Meanwhile, Antonio de Herrera y Tordesillas suggests Ovando realized he was about to be attacked as Anacaona's guest and acted in self-defense. Some modern historians, such as Juan Pérez de Tudela, Ursula Lamb, and Troy S. Floyd, claim that Ovando massacred the caciques because they had been avoiding demands for food and mine laborers. Historian Nathalie Frederic Pierre claims that the massacre stemmed from the preponderance of refugees living in the mountains of Jaragua, a region Ovando viewed as an escape route for enslaved workers.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "In the years since Anacaona's death, writers and artists have since used her memory to advance various positions. Alfred, Lord Tennyson wrote the poem \"Anacona\" while attending Trinity College, Cambridge, first reciting it in 1830, though it was not formally published until 1897, two years after his death. Independent scholar Marion Sherwood describes \"Anacaona\" as an \"escapist fantasy\" that portrays Anacaona as an \"Other\" living in an Edenic, natural paradise. According to Sherwood, Tennyson's \"Anacaona\" reflects Tennyson's ambivalence or hostility towards the Spanish Empire while romanticizing Anacaona as a \"noble savage\".",
      "Between 1879 and 1882, Manuel de Jesús Galván published Enriquillo, which features Anacaona as a character. In the novel, Higuenamota marries Hernando de Guevara and takes the name Doña Ana. She is the grandmother of the novel's protagonist, Enriquillo. In 1880, Dominican writer Salomé Ureña wrote the poem \"Anacaona\", which featured Anacaona as the protagonist. Literary scholar Maria Cristina Fumagalli argues that this poem subtly promotes Hispanic identity over a broader pan-Hispaniolan or multi-ethnic perspective, projecting modern national borders onto a historical landscape.",
      "In the late 20th century, Anacaona became a popular figure in Caribbean music. The Salsa song \"Anacaona\", originally performed by Tite Curet Alonso and popularized in the United States by Cheo Feliciano in 1971, was among the earliest examples of this trend. The song tells the story of Anacaona using lyrical fragments interspersed with a montuno based on the \"Areíto de Anacaona\", an areito that was allegedly played by warriors to pay her homage. Writer Olivia Tracy argues that this song helped to foster an embrace of Indigenous identity within the Chicano Movement. Other tributes to Anacaona in song include \"Anakaona\" by Ansy and Yole Dérose, released in 1983; and \"Anacaona\" by Irka Mateo, released in 2009.",
    ] },
]

[articles.es]
text = "Anacaona (del idioma iñeri: Anakaona ‘incesable valor’‘Ana, siempre o sin cesar; ka(k)ona, de valor’)​ fue una cacique taína de Quisqueya.​ Gobernó el Cacicazgo de Jaragua tras la muerte de su hermano Bohechío y estaba casada con el cacique Caonabo, quien gobernaba el Cacicazgo de Maguana.​ En 1503, Nicolás de Ovando, gobernador de la isla, visitó Jaragua. Sospechaba que se estaba gestando una insurrección entre los jefes taínos, incluido Anacaona, actualmente en el reino."
title = "Anacaona"
lang = "es"
url = "https://es.wikipedia.org/wiki/Anacaona"
intro = [
  "Anacaona (del idioma iñeri: Anakaona ‘incesable valor’‘Ana, siempre o sin cesar; ka(k)ona, de valor’)​ fue una cacique taína de Quisqueya.​ Gobernó el Cacicazgo de Jaragua tras la muerte de su hermano Bohechío y estaba casada con el cacique Caonabo, quien gobernaba el Cacicazgo de Maguana.​",
  "En 1503, Nicolás de Ovando, gobernador de la isla, visitó Jaragua. Sospechaba que se estaba gestando una insurrección entre los jefes taínos, incluido Anacaona, actualmente en el reino. Ovando dio la orden de que los caciques fueran capturados y quemados. La cacica Anacaona, gobernante Taína, fue ahorcada por orden del español Nicolás de Ovando.​",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "Nació en Yaguana, Jaragua.​ Se dice que en el idioma taíno su nombre significaba Flor de Oro.​ Era hermana del cacique Bohechío y fue la esposa del cacique Caonabo, con quien tuvo a Higüemota. Cuando su hermano murió, Anacaona gobernó el Cacicazgo de Jaragua en su lugar.",
      "Se distinguió por su belleza, inteligencia y talento para las poesías, memorizándolas para recitarlas en los areítos ante los otros nativos.​",
      "A la llegada a la isla de la expedición de Cristóbal Colón, en diciembre de 1492, Anacaona tuvo curiosidad por aquellos hombres diferentes a los de su comunidad. Pero los abusos que cometieron gran parte de los españoles en el Fuerte Navidad contra las mujeres hicieron que dejara de admirarles y los viera como una amenaza a combatir. Planeó junto a Caonabo un ataque al fuerte. A su regreso, el 28 de noviembre de 1493, Colón encontró el fuerte destruido y sus 43 moradores asesinados.",
    ] },
  { "title" = "Vínculos familiares", "paragraphs" = [
      "Anacaona se situaba entre las figuras más importantes de la sociedad taína: su hermano era el cacique de Jaragua Bohechío, a quien sucedió tras su muerte, y su esposo fue el cacique de Maguana Caonabo, con quien tuvo a Higüemota.​",
    ] },
  { "title" = "Encuentro con los españoles", "paragraphs" = [
      "Desde el primer momento su relación con los españoles fue hostil, ya que estos habían desembarcado en tierras del cacique Guacanagarix, el cual trabó amistad y pactó con ellos. Su esposo Caonabo era enemigo de este cacique. Al poco, Colón partió de nuevo a España dejando en la isla un destacamento. Fue entonces cuando convenció a su esposo Caonabo para exterminar a los hombres dejados por Colón, quien a su vuelta encontró los cadáveres apilados y sin ojos.",
      "Cuando los españoles averiguaron la autoría de la masacre, les tendieron una emboscada, encabezada por el gobernador Nicolás de Ovando, quien anunció una visita pacífica a la mandataria taína. Los españoles aprovecharon la ocasión para prenderle fuego a toda la aldea. Muy pocos aborígenes lograron sobrevivir la mencionada tragedia.",
      "Tras la muerte de su esposo, Anacaona se halló acogida en el cacicato de su hermano Bohechío, a donde se retiró ya que pensaba consolidar el poder, pues muchísimos taínos empezaron a morir víctimas del trabajo esclavo de largas jornadas o de hambre y desnutrición. Cuando en 1496, Bartolomé Colón, hermano de Cristóbal, penetró en los estados de Jaragua, salió al encuentro de los españoles la célebre cacica Anacaona, en una litera que llevaban seis indios. No cubría su desnudez más que un delantal de algodón de varios colores, que bajaba hasta la mitad del muslo. tenía sus sienes una guirnalda de flores encarnadas blancas, muy olorosas y lucía brazaletes y collar de las mismas flores naturales.",
    ] },
  { "title" = "Reinado", "paragraphs" = [
      "Hacia 1503, Anacaona gobernaba ya el cacicazgo de Jaragua tras el fallecimiento de su hermano Bohechío. Para entonces, su relación con los españoles había cambiado respecto a los primeros años de contacto, al constatar los efectos de la colonización en la región y los abusos atribuidos a algunos de los seguidores de Roldán. Los conflictos relacionados con su hija Higüemota y Hernando de Guevara, así como la administración de Bobadilla y Ovando, influyeron en el deterioro de las relaciones entre los líderes taínos y las autoridades coloniales.​",
      "Por otra parte, varios europeos establecidos en la región, entre ellos antiguos partidarios de Roldán que habían recibido tierras en esa zona de la isla, mantuvieron prácticas que generaron tensiones con las autoridades indígenas locales. Los caciques subordinados denunciaron abusos y exigencias que consideraban injustas. En este contexto, las disputas entre taínos y colonos eran frecuentemente interpretadas por las autoridades españolas como actos de insubordinación o amenaza al orden establecido, lo que contribuyó al deterioro de las relaciones entre ambas partes.​",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "Nicolás de Ovando, quien no contento con la aniquilación, se percató que faltaba Anacaona por ser asesinada y sometiéndosele a un proceso, en el que no hubo más pruebas que las declaraciones prestadas en el tormento por sus súbditos, ni otros testigos más que los españoles la condenaron a muerte y fue ahorcada en 1504, a la vista de todo el pueblo a quien tanto había amado y protegido.​​",
      "Así pagaron los españoles la deuda de gratitud que tenían con una princesa de la que solo habían recibido favores, y que les había perdonado la muerte de su esposo que, pudiendo, no quiso tomar venganza durante muchos años contra los numerosos europeos que vivían tranquilos en su Estado. Los españoles continuaron la devastación, con el pretexto de erradicar la tuberculosis, por espacio de seis meses. Al cacique Guaora, sobrino de Anacaona, le cazaron en las montañas donde buscó refugio, se le llevó a la horca. Parecía que la matanza de los habitantes no iba a acabar nunca.",
      "Buscaban a estos en los lugares más ocultos y retirados, en oscuras grutas o en lo más erizado de las montañas, y allí iban los españoles a buscarlos y los degollaban, diciendo que se habían reunido y armado para provocar la rebelión. Los que sobrevivieron quedaron en la mayor miseria. La sumisión se convirtió en esclavitud, se declaró restablecido al orden español. Nicolás de Ovando levantó, para inmortalizar su figura, una ciudad cerca del lago, a la que llamó Santa María de la Verdadera Paz.",
    ] },
]

[articles.fr]
text = "Anacaona, née en 1474 et morte en 1504, est une cacique taïno du caciquat du Xaragua sur l'île d'Ayiti, devenu par la suite l'île Hispaniola, laquelle portait le nom d'Haïti ou Bohio en langue taïno. Elle succède à son frère Bohechio."
title = "Anacaona"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Anacaona"
intro = [
  "Anacaona, née en 1474 et morte en 1504, est une cacique taïno du caciquat du Xaragua sur l'île d'Ayiti, devenu par la suite l'île Hispaniola, laquelle portait le nom d'Haïti ou Bohio en langue taïno.",
  "Elle succède à son frère Bohechio. Elle est pendue sur ordre du gouverneur espagnol Nicolás de Ovando.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Son nom est dérivé des mots taïno « ana », qui signifie « fleur », et « caona », qui signifie « or, doré ».",
      "Son frère, Bohechío, est un chef local et a consolidé le pouvoir sur tous les territoires à l'ouest de Xaragua en 1475.",
      "En 1492, Christophe Colomb arrive dans le royaume de Marien, à la recherche d'une route directe vers les Indes. À son arrivée, il est accueilli par des Taïnos, qui sont beaucoup plus petits que les Espagnols. Il est accueilli avec de l'or, du maïs et d'autres ressources naturelles. En 1493, la couronne espagnole établit des colonies pour extraire ces minéraux. Les Tainos sont kidnappés, assassinés, violés et réduits en esclavage pour satisfaire les besoins de la couronne espagnole.",
    ] },
  { "title" = "Arrestation et mort", "paragraphs" = [
      "À l'automne 1503, le gouverneur colonial Nicolás de Ovando et son groupe de 300 personnes se rendent à pied à Xaragua. Ils sont reçus lors d'une cérémonie par Anacaona, ses nobles, et plusieurs chefs taïnos.",
      "Alors que les Taïnos présentent la réception comme un geste de bienvenue, les Espagnols présents l'interprètent comme une diversion visant à les piéger. La troupe d'Ovando pense qu'Anacoana et les chefs préparent une révolte. Ovando fait organiser une sorte de joute appelée jeu de cannes (es) pour attirer la curiosité des caciques, et profite de ce qu'ils s'y rassemblent pour donner le signal aux Espagnols de les saisir et de les ligoter. Les caciques sont brûlés dans une hutte, tandis que d'autres Taïnos sont abattus à l'extérieur. Anacaona est arrêtée, transférée à Saint Domingue et pendue trois mois plus tard.",
      "Selon l'historien Troy Floyd, les récits de ces événements restent incertains pour de nombreuses raisons. Même si les récits séparés donnent l'impression qu'il s'agit d'une lutte parfaitement séparée entre les Taïnos et les Espagnols, les deux groupes ont coexisté et se sont liés par des mariages mixtes pendant les six années précédentes.",
    ] },
  { "title" = "Influence", "paragraphs" = [
      "Anacaona est également poètesse et compositrice, et est par conséquent commémorée dans l'art et la littérature contemporains à travers les Caraïbes. Une statue la commémorant se trouve à Léogane, à Haïti.",
      "Le récit de sa vie est d'abord repris sous la forme d'une pièce de théâtre par l'écrivain haïtien Jean Metellus, en 1986. Puis sous forme romancée par l'écrivaine Paula Anacaona, dans l'ouvrage intitulé 1492, Anacaona l'insurgée des Caraïbes, publié en 2019, aux Éditions Anacaona.",
      "Elle apparaît également comme personnage dans le livre uchronique de Laurent Binet, Civilisations, publié en 2019 ; et dans le roman Solitude la flamboyante, de Paula Anacaona, publié en 2020.",
    ] },
  { "title" = "Voir aussi", "paragraphs" = [
      "(en) Edwidge Danticat, Anacaona : Golden Flower, Haiti, The Royal Diaries series, 1490.",
      "(en + fr) Maryse Noël Roumain, Anacaona, Ayiti's Taino Queen/Anacaona, La Reine Taino D'Ayiti, Trafford Publishing, 2012 (ISBN 978-1-4669-5199-0, lire en ligne).",
      "(es) Pedro L Vergés Vidal, Anacaona (1474-1503), Editora Montalvo, 1er janvier 1947 (lire en ligne).",
    ] },
]

[articles.de]
text = "Anacaona (* 1464 in Yaguana, heute ein Stadtteil von Leogane, Haiti; † 1504 auf Hispaniola), auch „Goldene Blume“ genannt, war eine Königin des Volkes der Taíno. Sie war die Schwester von Behechio und Ehefrau von Caonabo, Häuptling des nahegelegenen Territoriums, die zwei der höchsten fünf Kaziken (Häuptlinge) waren, die die Insel Hispaniola regierten, als die Spanier sich ab 1492 hier ansiedelten."
title = "Anacaona"
lang = "de"
url = "https://de.wikipedia.org/wiki/Anacaona"
intro = [
  "Anacaona (* 1464 in Yaguana, heute ein Stadtteil von Leogane, Haiti; † 1504 auf Hispaniola), auch „Goldene Blume“ genannt, war eine Königin des Volkes der Taíno. Sie war die Schwester von Behechio und Ehefrau von Caonabo, Häuptling des nahegelegenen Territoriums, die zwei der höchsten fünf Kaziken (Häuptlinge) waren, die die Insel Hispaniola regierten, als die Spanier sich ab 1492 hier ansiedelten. Sie war gefeiert als eine Komponistin von Balladen und Gedichten, die man areytos nannte.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Während des Besuchs von Bartolomeo Kolumbus im Königreich Jaragua im Südwesten von Hispaniola spät im Jahr 1496 erwiesen sich Anacaona und ihr Bruder Behechio als gleichberechtigte Herrscher. Bei dieser Gelegenheit, die Bartolomé de las Casas in seiner Kurzen Geschichte der Zerstörung der indischen Inseln beschreibt, verlangte Kolumbus erfolgreich Tribut, der in Nahrungsmitteln und Baumwolle für die spanischen Siedler unter seinem Kommando bestehen sollte. Der Besuch soll in friedlicher Atmosphäre stattgefunden haben. Einige Monate später kam Kolumbus mit einer Karavelle zurück, um einen Teil des Tributs mitzunehmen. Anacaona und Behechio segelten nahe bei der Karavelle, nahe dem heutigen Hafen von Port-au-Prince im Golf von Gonave.",
      "Anacaonas hoher Rang war wahrscheinlich abgeleitet von Elementen matrilinearer Abkunft in der Gesellschaft der Taíno, wie sie Peter Martyr d’Anghiera beschreibt. Taíno-Kaziken vermachten ihr Vermögen üblicherweise den ältesten Kindern ihrer Schwestern. Falls es keine Kinder von Schwestern gab, wählten sie unter den Kindern ihrer Brüder. Erst wenn auch diese nicht existierten, ging das Vermögen an ihre eigenen Kinder.",
    ] },
  { "title" = "Arrest", "paragraphs" = [
      "Anacaona wurde nach dem Tod ihres Bruders Königin von Xaragua. Ihr Ehemann Caonabo, der verdächtigt war, den Angriff auf Kolumbus’ erste Siedlung La Navidad im Norden Haitis geführt zu haben, wurde von Alonso de Ojeda gefangen genommen und nach Spanien verschleppt, kam aber bei einem Schiffbruch während der Reise ums Leben. Die Taínos, die von den Kolonialisten schlecht behandelt wurden, revoltierten und führten einen langen Krieg gegen sie. Während eines Festes, das acht lokale Häuptlinge zu Ehren Anacaonas organisierten, die zu den Spaniern freundlich war, befahl der spanische Gouverneur Nicolás de Ovando, das Festhaus anzuzünden. Er nahm Anacaona und ihre Taíno-Adligen fest und ließ sie alle wegen Konspiration exekutieren. Während die anderen erschossen wurden, wurde Anacaona durch Hängen getötet. Sie wurde 39 Jahre alt.",
    ] },
  { "title" = "Vermächtnis", "paragraphs" = [
      "Anacaona wird in Haiti sehr verehrt, und viele halten sie für eine Ikone und wichtige Person in der Geschichte Haitis, in diesem Sinne für eine Gründerin der Nation. Ihr Name wurde unsterblich aufgrund der Geschichte der beiden Nationen Haiti und Santo Domingo; verschiedene Orte tragen ihren Namen. Die bekannte haitianisch-amerikanische Autorin Edwidge Danticat schrieb eine preisgekrönte Novelle zum Andenken an die ermordete Taino-Königin. Diese spielt auch in dem historischen Roman Enriquillo, leyenda histórica dominicana (1879/1882) von Manuel de Jesús Galván (1834–1910), der als Begründer des Indigenismo in Santo Domingo gilt, eine Rolle.",
    ] },
  { "title" = "Trivia", "paragraphs" = [
      "In Havanna auf Kuba gab es eine musikalische Familie Castro, deren elf Schwestern in den frühen 1930er Jahren eine auf den jungen Musikstil Son spezialisierte Band mit dem Namen Anacaona gründeten, in Erinnerung an die Taino-Königin. Sieben der Musikerinnen waren als Band Anacaona jahrzehntelang erfolgreich und kamen auf ihren Tourneen ab 1937 auch nach Europa. Teils werden sie in Anlehnung an den bekannten Film Buena Vista Sisters genannt.",
      "An der dominikanisch-haitianischen Grenze gibt es einen kleinen Ort mit dem Namen Villa Anacaona, auf dem Teil, der über haitianisches Staatsgebiet führt, zwischen den Orten Restauración und Pedro Santana.",
      "Judy Chicago ehrte die Königin in ihrer Installation The Dinner Party mit einer der Kacheln des Heritage Floor.",
    ] },
]

[articles.it]
text = "Anacaona (Yaguana, 1474 circa – Haiti, 1503 circa) è stata una regina, compositrice e poetessa appartenente a una tribù della popolazione dei Taino. Nacque e comandò con l'appellativo di cacicco nel regno (cacicazgo) di Jaragua o Xaragua."
title = "Anacaona"
lang = "it"
url = "https://it.wikipedia.org/wiki/Anacaona"
intro = [
  "Anacaona (Yaguana, 1474 circa – Haiti, 1503 circa) è stata una regina, compositrice e poetessa appartenente a una tribù della popolazione dei Taino.",
  "Nacque e comandò con l'appellativo di cacicco nel regno (cacicazgo) di Jaragua o Xaragua.",
  "Si tratta di uno dei cinque regni dell'isola di Hispaniola, scoperta il 5 dicembre 1492 da Cristoforo Colombo durante il suo primo viaggio.",
  "La mancanza di una scrittura, intesa nel senso moderno del termine, ha fatto sì che non rimanga traccia delle sue composizioni, e ha creato di lei una figura leggendaria tuttora viva presso la popolazione locale. Le uniche fonti storiche rimangono i racconti dei conquistatori spagnoli al seguito di Cristoforo Colombo, non sempre imparziali ed esatti.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Il significato del nome, Anacaona, è “Fiore d’oro”, dal taino ‘’ana’’, fiore, e ‘’caona’’, oro.",
      "Ebbe come fratello il cacicco Behechio. Egli regnò prima di lei nel regno di Jaragua fino alla morte avvenuta nel 1496, durante la prigionia sotto gli Spagnoli, quando affogò nel naufragio della nave che avrebbe dovuto trasferirlo nelle prigioni spagnole.",
      "Fu una delle mogli di un altro cacicco, Caonabo, il cui nome contiene ancora la parola taini ‘’caona’’ e significa “Colui che è come l’oro” oppure “Re della Casa d’Oro”.",
    ] },
  { "title" = "Influenze ed eredità culturali", "paragraphs" = [
      "Una statua commemorativa è stata eretta a Léogâne (Haiti), l’antica Yaguana dove nacque Anacaona.",
      "Il più alto grattacielo della Repubblica Dominicana (171 metri, 41 piani) è stato completato nel 2017 a Santo Domingo ed è stato denominato Anacaona 27.",
      "(EN) Edvige Danticat, 'Anacaona: Golden Flower, Haiti, 1490, New York, Scholastic, 2005.facente parte della serie “The Royal Diaries”",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "Giovanni Felice Astolfi, Della Officina Istorica, vol. III, Venezia, Sessa, 1605, pp. 227-228.",
      "(FR) P. Pierre François Xavier de Charlevoix, Histoire de l’Isle Espagnole ou de S. Domingue, Tome Premier, Paris, François Didot, 1730.",
      "Lopez de Gomara, La Historia Generale delle Indie Occidentali, con tutti li discoprimenti…, traduzione di Augustino de Cravaliz, Roma, Valerio & Luigi Dorici, 1556.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "La triste storia di Anacaona \"Fiore d'oro\", amica di Colombo, su ruggeromarino-cristoforocolombo.com.",
      "(EN) Haity History 101, su kreyolicious.com (archiviato dall'url originale il 28 giugno 2019).",
    ] },
]

[articles.ja]
text = "アナカオナ（スペイン語: Anacaona、1474年? - 1503年）は、ハラグア（イスパニョーラ島南西部）出身のタイノ族の女首長（カシカ）、宗教的指導者。1492年にクリストファー・コロンブス率いるヨーロッパ人が到来する前、アイティもしくはキスケヤと呼ばれていたイスパニョーラ島（スペイン語名。現在のハイチおよびドミニカ共和国）のタイノ族は、ハラグア、マグアナ、イグェイ、マグア、マリエンという5つの王国に分かれていた。アナカオナは、ハラグアの首長ボエチオの姉妹だった。 ボエチオの死後、アナカオナは首長の地位を継承した。彼女の時代、イスパニョーラ島に到来したスペイン人入植者はハラグアのタイノ族と共存し、婚姻関係を結ぶ者もいた。 1503年、スペインのイスパニョーラ総督ニコラス・デ・オバンドがハラグアを訪れた。彼はアナカオナらタイノ族の首長たちが反スペイン暴動を企てているのではないかという疑念を抱いていた。オバンドの命により、首長たちは捕らえられて焼き殺され、アナカオナも首吊りにより殺害された。"
title = "アナカオナ"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%A2%E3%83%8A%E3%82%AB%E3%82%AA%E3%83%8A"
intro = [
  "アナカオナ（スペイン語: Anacaona、1474年? - 1503年）は、ハラグア（イスパニョーラ島南西部）出身のタイノ族の女首長（カシカ）、宗教的指導者。1492年にクリストファー・コロンブス率いるヨーロッパ人が到来する前、アイティもしくはキスケヤと呼ばれていたイスパニョーラ島（スペイン語名。現在のハイチおよびドミニカ共和国）のタイノ族は、ハラグア、マグアナ、イグェイ、マグア、マリエンという5つの王国に分かれていた。アナカオナは、ハラグアの首長ボエチオの姉妹だった。",
  "1503年、スペインのイスパニョーラ総督ニコラス・デ・オバンドがハラグアを訪れた。彼はアナカオナらタイノ族の首長たちが反スペイン暴動を企てているのではないかという疑念を抱いていた。オバンドの命により、首長たちは捕らえられて焼き殺され、アナカオナも首吊りにより殺害された。",
]
sections = [
  { "title" = "前半生と家族", "paragraphs" = [
      "アナカオナはヤグアナ、現在のハイチのレオガンで生まれた。この付近は、後にイスパニョーラの首都となる。生年は1474年であるという説がある。「アナ」はタイノ語で「花」、「カオナ」は「黄金、黄金の」を意味するので、アナカオナという名は「黄金の花」という意味である。アナカオナの兄弟ボエチオは現地の首長で、勢力を拡大し1475年にはハラグア西部を支配するようになった。ボエチオは自身の権勢を確かなものとするため、アナカオナをマグアナの首長カオナボに嫁がせた。アナカオナとカオナボの間には、ヒグエモタという娘一人が生まれた。",
      "1492年12月4日、クリストファー・コロンブスがスペイン艦隊を率いてマリエンの、現在のハイチのモール＝サン＝ニコラにあたる地に上陸した。彼はインディアス（インド）に直行できる航路を求めて探検していた。タイノ族は、自分たちより大きな体格をしたコロンブスら来訪者を歓迎し、金やトウモロコシなどを贈ってもてなした。しかし1493年、スペインはこの地に金など貴金属の収奪のみを目当てとしてサントドミンゴ植民地を建設した。タイノ族はスペイン人たちによって拉致され、奴隷にされた。多くのタイノ族女性が強姦され、抵抗した者は殺害された。",
      "1493年、アナカオナの夫カオナボが、島の北西部のスペイン植民地ラ・ナビダッドの破壊を命じたという咎で捕縛された。彼はスペイン本国へ送られ、その途上で船が難破し命を落とした。カオナボが捕らえられたとき、アナカオナはハラグアに帰り、以降ボエチオを補佐するようになった。",
    ] },
  { "title" = "死", "paragraphs" = [
      "1503年秋、イスパニョーラ総督ニコラス・デ・オバンドが300人の歩兵を率いてハラグアにやってきた。彼らはアナカオナや彼女に従う貴顕たち、その他のタイノ族の首長たちから盛大に出迎えもてなした。",
      "タイノ族はスペイン人を歓迎したつもりだったが、当のスペイン人たちはこれを手の込んだ偽装作戦だと疑った。すなわち、アナカオナらタイノ族の首長たちが、歓迎の裏で反逆を企てていると考えていたのである。オバンドは首長たちをカネイ（タイノ族の大きな小屋）におびき寄せてから、スペイン兵に合図を送って一網打尽にした。首長たちはカネイごと焼き殺され、位の低いタイノ族は外で虐殺された。アナカオナも吊るし首にされ、殺された。",
      "歴史家のトロイ・S・フロイドは、この事件を伝える史料の正確性は様々な点から疑わしいとしている。まず、複数の文献が、あたかも二つの人種が完全に隔離され争ったかのような構図で叙述しているものの、実際には破局を迎える6年前から両者は共存し婚姻関係も結ばれていたという点が挙げられる。スペイン人とタイノ族の間には、平和的な共存関係が築かれていた時期が存在した。しかしそれゆえに、スペイン人がなぜタイノ族を裏切り罠にはめたのかは不明なままである。またスペイン人側にも50人の戦死者が出ており、これはヨーロッパ人が高い軍事技術を有していたことを考えるとかなりの犠牲者を出していることになる。そして、ハラグアの首長たちは島でも最高の賢人として尊敬を集めており、もし彼らが本当に陰謀を企んでいたなら、不用意に小屋へ誘導されたとは考えにくいとフロイドは指摘している。",
    ] },
  { "title" = "後世への影響", "paragraphs" = [
      "カリブ地域の現代美術・文学界では、アナカオナは詩人で作曲家でもあったとみなされている。レオガンには、彼女を記念して建てられた像がある。ドミニカ共和国にある、カリブ地域で最も高い建物であるトーレ・アナカオナ27は、彼女の名を冠している。アナカオナの生涯は、プエルトリコの歌手チェオ・フェリシアーノがリードボーカルを務めた歌『アナカオナ』で一般にも広く知られるようになった。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "Samuel M. Wilson: Hispaniola - Caribbean Chiefdoms in the Age of Columbus. The University of Alabama Press, 1990. ISBN 0-8173-0462-2.",
      "この記事にはパブリックドメインである次の文書本文が含まれている: Wilson, J. G.; Fiske, J., eds. (1891). “Anacaona”. Appletons' Cyclopædia of American Biography (英語). New York: D. Appleton.",
    ] },
  { "title" = "外部リンク", "paragraphs" = [
      "Songs (salsa) about Anacaona (Cheo Feliciano and the Fania All Stars): Anacaona Archived 2014-02-28 at the Wayback Machine.",
    ] },
]

[articles.ru]
text = "Анакаона (исп. Anacaona — таино «Золотой цветок»; 1464—1503) — жена касика Каонабо, правительница области Харагуа, одна из лидеров сопротивления индейских племён таино испанским конкистадорам на острове Эспаньола (Гаити)."
title = "Анакаона"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D0%B0%D0%BA%D0%B0%D0%BE%D0%BD%D0%B0"
intro = [
  "Анакаона (исп. Anacaona — таино «Золотой цветок»; 1464—1503) — жена касика Каонабо, правительница области Харагуа, одна из лидеров сопротивления индейских племён таино испанским конкистадорам на острове Эспаньола (Гаити). По сведениям испанских хронистов, среди местных жителей также пользовалась известностью как поэтесса и создательница танцев-арейто.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "После пленения спутниками Христофора Колумба и смерти касика Каонабо его жена Анакаона бежала из Магуаны в родную область Харагуа, где правил её брат Бехечио, один из пяти верховных касиков на острове. Бехечио разделил власть со своей сестрой. После смерти своего брата Анакаона стала единовластной правительницей в Харагуа.",
      "Анакаона была «женщина очень храбрая, большой души и ума». Анакаоне подчинялись свыше трёхсот родовых старейшин — касиков. Умная и волевая женщина пользовалась авторитетом, любовью и славилась красотой среди своих подданных. Её имя на языке индейцев таино означало «золотой цветок».",
      "В 1503 году новый испанский губернатор Эспаньолы Николас де Овандо с большим военным отрядом (70 кавалеристов и 300 пехотинцев) прибыл с визитом в область Харагуа. Правительница Анакаона приготовила испанцам пышную встречу и устроила «арейто», в котором участвовало «более трёхсот девушек, её служанок, ибо не захотела, чтобы в этих танцах, или арейто, принимали участие мужчины и замужние либо познавшие мужчин женщины».",
    ] },
  { "title" = "Память", "paragraphs" = [
      "Анакаона является сегодня национальной героиней Доминиканской Республики. На площади перед Кафедральным собором Санто-Доминго находится бронзовый монумент, изображающий красавицу-индианку в полный рост. В её часть названо и расположенное в городе высочайшее здание Карибов — Torre Anacaona 27. Её образ популярен и в Гаити, где её упоминают в череде деятелей освободительных движений до Гаитянской революции.",
      "Анакаоне свои произведения посвящают многие авторы с Карибских островов, и не только оттуда — известен стих Альфреда Теннисона Anacaona. Американская писательница гаитянского происхождения Эдвидж Дантика написала о ней детскую книгу. Анакаона — главная героиня ряда одноимённых песен, например исполнителя сальсы Чео Фелисьяно.",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Хосефина Олива де Коль. Сопротивление индейцев испанским конкистадорам. — М.: Изд-во «Прогресс», 1988. — Ст. 45—47. — ISBN 5-01-001087-9.",
      "Бартоломе де Лас Касас. История Индий. — СПб.: Наука, 2007. — С. 66-71. — ISBN 978-5-02-026522-6.",
    ] },
]

