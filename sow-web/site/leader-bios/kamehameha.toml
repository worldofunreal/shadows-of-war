[articles.en]
text = "Kamehameha I, also known as Kamehameha the Great, was the conqueror and first ruler of the Kingdom of Hawaii. The state of Hawaii gave a statue of him to the National Statuary Hall Collection in Washington, D.C., as one of two statues it is entitled to install there."
title = "Kamehameha I"
lang = "en"
url = "https://en.wikipedia.org/wiki/Kamehameha_I"
intro = [
  "Kamehameha I (Hawaiian pronunciation: [kəmehəˈmɛhə]; Kalani Paiʻea Wohi o Kaleikini Kealiʻikui Kamehameha o ʻIolani i Kaiwikapu kauʻi Ka Liholiho Kūnuiākea; c. 1736 – c. 1761 to May 8 or 14, 1819), also known as Kamehameha the Great, was the conqueror and first ruler of the Kingdom of Hawaii. The state of Hawaii gave a statue of him to the National Statuary Hall Collection in Washington, D.C., as one of two statues it is entitled to install there.",
]
sections = [
  { "title" = "Birth and childhood", "paragraphs" = [
      "Kamehameha (known as Paiʻea at birth), was born to Kekuʻiapoiwa II, the niece of Alapainui, the usurping ruler of Hawaii Island who had killed the two legitimate heirs of Keaweʻīkekahialiʻiokamoku during civil war. By most accounts, he was born in Ainakea, Kohala, Hawaii. His father was Keōua Kalanikupuapa'ikalaninui; however, Native Hawaiian historian Samuel Kamakau says that Maui monarch Kahekili II had hānai adopted (traditional, informal adoption) Kamehameha at birth, as was the custom of the time. Kamakau believes this is why Kahekili II is often referred to as Kamehameha's father. The author also says that Kameʻeiamoku told Kamehameha I that he was the son of Kahekili II, saying, \"I have something to tell you: Ka-hekili was your father, you were not Keoua's son. Here are the tokens that you are the son of Ka-hekili.\"",
      "King Kalākaua wrote that these rumors were scandals and should be dismissed as the offspring of hatred and jealousies of later years. Regardless of the rumors, Kamehameha was a descendant of Keawe through his mother Kekuʻiapoiwa II; Keōua acknowledged him as his son and he is recognized as such by all the sovereigns and most genealogists.",
      "Accounts of Kamehameha I's birth vary, but sources place his birth between 1736 and 1761, with historian Ralph Simpson Kuykendall believing it to be between 1748 and 1761. An early source is thought to imply a 1758 dating because that date matched a visit from Halley's Comet, and would make him close to the age that Francisco de Paula Marín estimated he was. This dating, however, does not accord with the details of many well-known accounts of his life, such as his fighting as a warrior with his uncle, Kalaniʻōpuʻu, or his being of age to father his first children by that time. The 1758 dating also places his birth after the death of his father.",
    ] },
  { "title" = "Conquest of the islands", "paragraphs" = [
      "Kamehameha was raised in the royal court of his uncle Kalaniʻōpuʻu. He achieved prominence in 1782, upon Kalaniʻōpuʻu's death. While the kingship was inherited by Kīwalaʻō, Kalaniʻōpuʻu's son, Kamehameha was given a prominent religious position as guardian of the Hawaiian god of war, Kūkaʻilimoku. He was also given control of the district of Waipiʻo Valley. The two cousins' relationship was strained after Kamehameha made a dedication to the gods instead of allowing Kīwalaʻō to do that. Kamehameha accepted the allegiance of a group of chiefs from the Kona district.",
      "The other story took place after the prophecy was passed along by the high priests and high chiefs. When Kamehameha was able to lift the Naha Stone, he was considered the fulfiller of the prophecy. Other ruling chiefs, Keawe Mauhili, the Mahoe (twins) Keoua, and other chiefs rejected the prophecy of Ka Poukahi. The high chiefs of Kauai supported Kiwalaʻo even after learning about the prophecy.",
      "The five Kona chiefs supporting Kamehameha were Keʻeaumoku Pāpaʻiahiahi (Kamehameha's father-in-law/grand uncle), Keaweaheulu Kaluaʻāpana (Kamehameha's uncle), Kekūhaupiʻo (Kamehameha's warrior teacher), and Kameʻeiamoku and Kamanawa (twin uncles of Kamehameha). They defended Kamehameha as the unifier Ka Naʻi aupuni. High Chiefs Keawe Mauhili and Keeaumoku were by genealogy the next in line for aliʻi nui. Both chose the younger nephews Kīwalaʻō and Kamehameha over themselves. Kīwalaʻō was soon defeated in the first key conflict, the Battle of Mokuʻōhai. Kamehameha and his chiefs took over Konohiki responsibilities and sacred obligations of the districts of Kohala, Kona, and Hāmākua on Hawaiʻi.",
    ] },
  { "title" = "Aliʻi Moʻi of the Hawaiian Islands", "paragraphs" = [
      "As ruler, Kamehameha took steps to ensure the islands remained a united realm after his death. He unified the legal system. He used the products collected in taxes to promote trade with Europe and the United States.",
      "The origins of the Law of the Splintered Paddle are derived from before the unification of the Island of Hawaiʻi. In 1782 during a raid, Kamehameha caught his foot in a rock. Two local fishermen, fearful of the great warrior, hit Kamehameha hard on the head with a large paddle, which broke the paddle. Kamehameha was stunned and left for dead, allowing the fisherman and his companion to escape. Twelve years later, the same fishermen were brought before Kamehameha for punishment. The king instead blamed himself for attacking innocent people, gave the fishermen gifts of land and set them free. He declared the new law, \"Let every elderly person, woman, and child lie by the roadside in safety\".",
      "Young and Davis became advisors to Kamehameha and provided him with advanced weapons that helped in combat. Kamehameha was also a religious king and the holder of the war god Kūkāʻilimoku. The explorer George Vancouver noted that Kamehameha worshiped his gods and wooden images in a heiau, but originally wanted to bring England's religion, Christianity, to Hawaiʻi. Missionaries were not sent from Great Britain because Kamehameha told Vancouver that the gods he worshiped were his gods with mana, and that through these gods, Kamehameha had become supreme ruler over all of the islands. Witnessing Kamehameha's devotion, Vancouver decided against sending missionaries from England. Kamehameha I believed that Christianity may bring mana or heavenly power to revitalise the Hawaiian community. The first American Board of Commissioners for Foreign Missions company arrived in Hawaii on March 30, 1820, on the Thaddeus from Boston.",
    ] },
  { "title" = "Later life", "paragraphs" = [
      "After about 1812, Kamehameha returned from Oahu and spent the last years of his life at Kamakahonu, a compound he built in Kailua-Kona. As was the custom of the time, he had several wives and many children, though he outlived many of them.",
      "When Kamehameha died on May 8 or 14, 1819, his body was hidden by his trusted friends, Hoapili and Hoʻolulu, in the ancient custom called hūnākele (literally, \"to hide in secret\"). The mana, or power of a person, was considered to be sacred. As per the ancient custom, his body was buried in a hidden location because of his mana. His final resting place remains unknown. At one point in his reign, Kamehameha III asked that Hoapili show him where his father's bones were buried, but on the way there Hoapili knew that they were being followed, so he turned around.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The Hawaiian public holiday King Kamehameha I Day is named after and honors King Kamehameha I. It was first proclaimed in 1871 by his grandson, King Kamehameha V.",
      "The USS Kamehameha, a Benjamin Franklin-class ballistic missile submarine was named after him.",
      "Kamehameha I appears on quarters issued in 2008 commemorating Hawaiʻi as part of the 50 State quarters program of the U.S. Mint.",
    ] },
]

[articles.fr]
text = "Kamehameha Ier (en prononciation hawaïenne : /kəmehəˈmɛhə/), en hawaïen : Kalani Paiʻea Wohi o Kaleikini Kealiʻikui Kamehameha o ʻIolani i Kaiwikapu kauʻi Ka Liholiho Kūnuiākea, connu aussi sous le nom de Kamehameha le Grand, né vers 1736 à Kohala (Hawaï) et mort le 8 ou le 14 mai 1819 à Kailua-Kona, est le fondateur de la monarchie hawaïenne et premier roi d'Hawaï. Artisan de l'unité des îles, il participe à la fondation du royaume d'Hawaï en 1810."
title = "Kamehameha Ier"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Kamehameha_Ier"
intro = [
  "Kamehameha Ier (en prononciation hawaïenne : /kəmehəˈmɛhə/), en hawaïen : Kalani Paiʻea Wohi o Kaleikini Kealiʻikui Kamehameha o ʻIolani i Kaiwikapu kauʻi Ka Liholiho Kūnuiākea, connu aussi sous le nom de Kamehameha le Grand, né vers 1736 à Kohala (Hawaï) et mort le 8 ou le 14 mai 1819 à Kailua-Kona, est le fondateur de la monarchie hawaïenne et premier roi d'Hawaï. Artisan de l'unité des îles, il participe à la fondation du royaume d'Hawaï en 1810. Par le développement d'alliances avec les principales puissances coloniales du Pacifique de l'époque (France, Russie et Royaume-Uni), il a su préserver l'indépendance d'Hawaï et se faire reconnaître par d'autres nations.",
  "Dans les années 1790, après plusieurs années de conflit, Kamehameha fonde un royaume unifié avec l'aide et les conseils de plusieurs Occidentaux tels que John Young ou encore Isaac Davis. Néanmoins, il faudra attendre 1810 pour que l'unification complète de l'archipel soit accomplie avec la conquête des îles d'Oahu, de Maui, de Molokai et de Lanai. L'unification accomplie, la société hawaïenne se réforme pour devenir une monarchie constitutionnelle pensée selon les codes des puissances traditionnelles européennes et peut ainsi ouvrir ses portes aux marchands étrangers et se tourner vers le progrès apporté par les navires occidentaux. Après la mort de Kamehameha Ier, ses descendants directs prirent le pouvoir, chacun sous le nom de leur prestigieux ancêtre, jusqu'en 1873 date à laquelle Lunalilo, membre de la dynastie par sa mère, accéda au trône.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Un chant traditionnel concernant Ke-Aka, l'épouse d'un roi de l'île d'Hawaï indique que Kamehameha Ier est né en ikuwā, soit en hiver ou autour du mois de novembre. Un autre chant place cette naissance en Makaliʻi. Les historiens d'Hawaï considèrent le plus généralement 1758 comme son année de naissance la plus probable. Les récits de sa naissance varient cependant, mais les sources placent sa naissance à partir de 1736. Cette supposition est étayée par la légende de l'apparition d'une étoile brillante l'année de sa naissance. Cette étoile brillante correspondrait à la comète de Haley, qui était visible cette année-là. L'historien Samuel Kamakau a publié un compte rendu dans le Ka Nupepa Kuokoa en 1867 plaçant la date de naissance de Kamehameha en 1736.",
      "Kamehameha est le fils du chef Keōua (en) et, par lui, le neveu du roi hawaïen de Owyhee, Kalaniʻōpuʻu, qui avait reçu James Cook lors de l'incident qui a coûté la vie à ce dernier. Toutefois, Keōua peut ne pas avoir été le père biologique de Kamehameha, n'ayant fait que l'adopter et le reconnaître. Selon cette hypothèse, Kahekili II (en), roi hawaïen de Maui, serait le père biologique le plus probable de Kamehameha.",
      "Élevé à la cour de son oncle Kalaniʻōpuʻu, Kamehameha accède en 1782 au trône de Owyhee à la mort de ce dernier. Alors que son cousin, Kīwalaʻō, hérite du trône de Maui, Kamehameha est élevé à une position religieuse de premier plan. Il devient le gardien du dieu hawaïen de la guerre, Kuka'ilimoku. Il reçoit également le district de la vallée de Waipiʻo.",
    ] },
  { "title" = "Descendance", "paragraphs" = [
      "Kamehameha avait plusieurs épouses. Le nombre exact est débattu car les documents qui enregistraient les noms de ses épouses ont été détruits. Certains en énumèrent 21 mais des recherches montrent qu'il aurait pu avoir 26 épouses. Kaʻahumanu (1768-1832), fut la principale épouse de Kamehameha avec laquelle il n'a pas de descendance.",
      "À la tête d'une nombreuse descendance, plusieurs de ses enfants accédèrent au trône. Il aurait eu au total environ 35 enfants dont seulement la moitié furent reconnus officiellement.",
      "Kamehameha II (1797-1824), fils de Kamehameha et de son épouse Keōpūolani, successeur de son père et roi d'Hawaï entre 1810 et 1824.",
    ] },
  { "title" = "Hommage et inspirations", "paragraphs" = [
      "Le 11 juin célèbre la naissance de ce roi, dont la date exacte est cependant inconnue. Ce jour donne lieu à une cérémonie de dépose de colliers de fleurs (leis) sur la statue de Kamehameha à Honolulu et Kapaau (en). Cette date fut instaurée par proclamation royale par Kamehameha V, petit-fils de Kamehameha Ier, en 1871 pour célébrer la vie et les accomplissements du plus grand roi, chef d'état et guerrier d'Hawaï.",
      "L'hymne national hawaïen, Hawai`i Pono`i, rend hommage à Kamehameha Ier. Le refrain en est :",
      "L'un des deux seuls sous-marins de l'US Navy à avoir le nom d'un monarque fut l'USS Kamehameha (SSBN/SSN-642) en service de 1966 à 2002.",
    ] },
  { "title" = "Dans la fiction", "paragraphs" = [
      "Il est interprété par Kaina Makua dans la série télévisée américaine Chief of War (2025).",
    ] },
]

[articles.de]
text = "Kamehameha I., der Große (* 1758 (?); † 1819) war der erste König von Hawaiʻi (1795–1819). Das genaue Geburtsjahr ist unbekannt, Schätzungen zufolge liegt es zwischen 1736 und 1761."
title = "Kamehameha I."
lang = "de"
url = "https://de.wikipedia.org/wiki/Kamehameha_I."
intro = [
  "Kamehameha I., der Große (* 1758 (?); † 1819) war der erste König von Hawaiʻi (1795–1819).",
  "Das genaue Geburtsjahr ist unbekannt, Schätzungen zufolge liegt es zwischen 1736 und 1761. Als eine der frühesten Quellen gilt Francisco de Paula Marín, der 1819 beim Tod Kamehamehas anwesend war und dessen Alter mit 60½ Jahren angab. Legenden behaupteten außerdem, dass ein großer König eines Tages die hawaiischen Inseln vereinigen werde. Das Zeichen seiner Geburt werde ein Komet sein. Da der Halleysche Komet 1758 von Hawaiʻi aus zu sehen war, wird angenommen, dass dies das Geburtsjahr Kamehamehas I. war.",
  "Kamehameha I. war der Neffe von Kalaniʻōpuʻu, jenes Häuptlings der Insel Hawaiʻi, bei dessen versuchter Festnahme James Cook getötet wurde. Nach dem Tod von Kalaniʻōpuʻu im Jahre 1782 wurde dessen Sohn Kiwalao Häuptling von Big Island. Kamehameha hatte eine hohe religiöse Stellung und wurde Wächter des Kriegsgottes Kūkāʻilimoku.",
  "In den Jahren nach dem Tod Kalaniʻōpuʻus kam es mehrfach zu Auseinandersetzungen zwischen den Vettern, ohne dass es einem von beiden gelang, die Oberhand zu gewinnen. 1786 war Kahekili, der König von Maui, auf dem Gipfelpunkt seiner Macht. Er beherrschte außer Maui nicht nur Oʻahu, Molokaʻi und Lānaʻi, sondern auch Kauaʻi und Niʻihau durch eine Übereinkunft mit seinem Halbbruder Kaʻeokulani. 1790 gelang Kamehameha zwar ein Sieg über Kahekili, doch konnte er seine Macht noch nicht dauerhaft festigen. In weiteren Feldzügen, die bald auch Oʻahu einbezogen, sicherte sich Kamehameha geschickt die Unterstützung von Ausländern wie Isaac Davis, John Young und George Vancouver. Auf diese Weise gelangte er in den Besitz von Feuerwaffen, die ihm mehr und mehr die Überlegenheit verschafften.",
]
sections = [
  { "title" = "Sonstiges", "paragraphs" = [
      "Mehrere Statuen von Kamehameha I. befinden sich an verschiedenen Orten Hawaiis. Sie sind nicht nur Symbole Hawaiis, sondern werden von vielen Hawaiiern als Objekte spiritueller Verehrung angesehen. Ein Abguss befindet sich in der Sammlung der National Statuary Hall Collection des Kapitols in Washington, D.C.",
      "In der Fernsehserie Magnum ist ein Club nach ihm benannt, der King Kamehameha Club. Dieser fiktive Club wiederum ist Namenspate für den King Kamehameha Club in Frankfurt am Main.",
      "Im Manga und Anime Dragon Ball heißt eine Attacke in Form einer Energiewelle Kamehameha. Dragon-Ball-Schöpfer Akira Toriyama fragte seine Frau Nachi Mikami nach einem Namen für eine Kame-Attacke (japanisch für Schildkröte) und sie kam auf den hawaiischen Königsnamen.",
    ] },
  { "title" = "Weblinks", "paragraphs" = [
      "Der Staatsmantel des Königs der Sandwichs-Inseln. In: Die Gartenlaube, Heft 43, 1854, S. 520; Kamehameha I. starb allerdings 1819",
    ] },
]

[articles.it]
text = "Kamehameha I, nato come Kalani Paiʻea Wohi o Kaleikini Kealiʻikui Kamehameha o ʻIolani i Kaiwikapu kaui Ka Liholiho Kūnuiākea e conosciuto anche come Kamehameha il Grande (Kohala, 1758 – Kailua, 8 maggio 1819), è stato il primo re delle Hawaii dal 1795 al 1819. In patria è ricordato per essere stato il sovrano che ha unificato la maggior parte delle isole dell'arcipelago dando vita a uno stato unitario chiamato Regno delle Hawaii."
title = "Kamehameha I delle Hawaii"
lang = "it"
url = "https://it.wikipedia.org/wiki/Kamehameha_I_delle_Hawaii"
intro = [
  "Kamehameha I, nato come Kalani Paiʻea Wohi o Kaleikini Kealiʻikui Kamehameha o ʻIolani i Kaiwikapu kaui Ka Liholiho Kūnuiākea e conosciuto anche come Kamehameha il Grande (Kohala, 1758 – Kailua, 8 maggio 1819), è stato il primo re delle Hawaii dal 1795 al 1819.",
  "In patria è ricordato per essere stato il sovrano che ha unificato la maggior parte delle isole dell'arcipelago dando vita a uno stato unitario chiamato Regno delle Hawaii. Alla sua morte gli successe il primogenito Kamehameha II.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Vi sono differenti versioni sulla nascita di Kamehameha I. Lo storico hawaiano Samuel Kamakau pubblicò un resoconto di tale nascita nella sua opera Ka Nupepa Kuokoa del 1867, che era generalmente accettata sino al 1911. La versione scritta da Kamakau e tradotta in inglese da Fornander venne infatti formalmente cambiata dopo alcune revisioni storiche e ripubblicata da Kamaka Stillman che rigettò gli articoli precedentemente usciti sull'argomento.",
      "Kamehameha è considerato figlio di Keōua, fondatore della dinastia di Keoua, e di Kekuʻiʻapoiwa II. Keōua e Kekuʻiʻapoiwa erano entrambi nipoti di Keaweʻīkekahialiʻiokamoku, Aliʻi nui delle Hawaii, proveniente dal distretto di Kohala. La genealogia hawaiana denota come Keōua potrebbe non essere stato il padre biologico di Kamehameha, suggerendo al suo posto Kahekili II di Maui. Ad ogni modo, quel che è certo è che Kamehameha era discendente di Keawe per via di sua madre.",
      "Il tradizionale canto di Keaka, moglie di Alapainui, indica che Kamehameha nacque nel mese di ikuwā traducibile genericamente col termine inverno o più precisamente forse a novembre. Alapai aveva dato il figlio, Kamehameha, a sua moglie, Keaka, e sua sorella, Hākau, perché se ne prendesse cura. Samuel Kamakau, nei suoi articoli apparsi circa la nascita del sovrano scrisse anni dopo «Fu al tempo delle guerre tra i capi delle Hawaii che seguirono alla morte di Keawe, capo dell'intera isola (Ke-awe-i-kekahi-aliʻi-o-ka-moku) che Kamehameha I nacque.» Anche sull'anno della sua nascita vi sono state diverse variazioni storiografiche.",
    ] },
  { "title" = "Matrimonio e figli", "paragraphs" = [
      "Come era usanza dell'epoca, Kamehameha I ebbe diverse mogli e molti figli anche se solo la metà di questi gli sopravvissero.",
      "L'esatto numero è tutt'oggi molto dibattuto dal momento che i documenti che ricordano i nomi delle mogli del sovrano sono andati oggi in gran parte distrutti. Bingham ne ha elencate in totale 21, ma precedenti ricerche condotte da Mary Kawena Pukui ne avevano contate 26. Nel libro Kamehameha's Children Today, gli autori Charles Ahlo e Jerry Walker ne elencano 30; 18 diedero figli a Kamehameha, 12 no. Essi inoltre propongono che il sovrano ebbe in tutto 35 figli, 17 maschi e 18 femmine. Pur avendo avuto comunque molte mogli e molti figli, fu il figlio primogenito maschio avuto dalla moglie di rango più alto, Keōpūolani, che ascese al trono dopo la sua morte. Nel suo libro Ho`omana: Understanding the Sacred and Spiritual, Malcolm Naea Chun è dell'opinione che Keōpūolani personalmente supportò Kaʻahumanu nel porre fine al sistema Kapu (una poligamia tradizionale) così da assicurare che i figli ed i nipoti di Kamehameha avrebbero potuto governare il regno senza contese di successione.",
    ] },
  { "title" = "Nella cultura di massa", "paragraphs" = [
      "Il nome del sovrano ha dato ispirazione alla Kamehameha di Dragon Ball, unito al fatto che il suono della parola ha un significato in giapponese.",
      "A Kamehameha è stata dedicata una scultura in ottone, collocata nel 1883 nei pressi del luogo dove nacque. Un'altra versione si trova davanti all'Aliʻiōlani Hale, la sede della Corte suprema dello stato avaiano, mentre una copia in bronzo si trova nel Centro visitatori del Campidoglio di Washington e fa parte della Collezione nazionale della Sala delle statue.",
    ] },
]

[articles.ja]
text = "カメハメハ1世（ハワイ語: Kamehameha I、1758年 - 1819年、生年は諸説あり）は、ハワイ諸島を初めて統一して1810年にハワイ王国を建国し、初代国王となった人物である。カメハメハ大王の名でも親しまれる。「カ・メハメハ」はハワイ語で「孤独な人」、「静かな人」の意。なお、ハワイ語は文字を持たない言語であった関係で、古い文献などではハメハメハ (Hamehameha) と表記される例も見られる。"
title = "カメハメハ1世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%AB%E3%83%A1%E3%83%8F%E3%83%A1%E3%83%8F1%E4%B8%96"
intro = [
  "カメハメハ1世（ハワイ語: Kamehameha I、1758年 - 1819年、生年は諸説あり）は、ハワイ諸島を初めて統一して1810年にハワイ王国を建国し、初代国王となった人物である。カメハメハ大王の名でも親しまれる。「カ・メハメハ」はハワイ語で「孤独な人」、「静かな人」の意。なお、ハワイ語は文字を持たない言語であった関係で、古い文献などではハメハメハ (Hamehameha) と表記される例も見られる。",
]
sections = [
  { "title" = "プロフィール", "paragraphs" = [
      "ハワイ島のカパアウで生まれたなど諸説があり、生まれ年もはっきりしないが、いずれにしろ北西部で幼児期を過ごしていて、カパアウの町中に彼の像が建てられ、隣町のハヴィ郊外のモオキニ・ヘイアウに彼の誕生地が祭られている。ハワイ島の首長であったカラニオプウの甥にあたるといわれる。",
      "政敵が火山の噴火や外敵などにより壊滅状態になったことも統一に幸いした。18世紀末までにはカウアイ島、ニイハウ島を除く全地域を支配下におさめ、1810年にこの2島もカメハメハに服属して国家統一を成し遂げた。",
      "カメハメハは優れた外交手腕でイギリスやアメリカ合衆国などの西洋諸国との友好関係を維持してハワイの独立を守り、伝統的なその文化の保護と繁栄に貢献した。また、カメハメハ1世が作った「ママラホエ」と呼ばれる法律は、戦時における非戦闘員の人権を保護するものであり、今日では世界中で受け入れられている先駆的なものであった。副王としてカメハメハ2世、および3世を補佐して旧習撤廃に努めたカアフマヌがいる。",
    ] },
  { "title" = "カメハメハ軍の装備", "paragraphs" = [
      "1789年冬、アメリカ人メットカーフ親子が率いるエレアノラ号とフェアー・アメリカン号がハワイ島を訪問した際、トラブルにより100人余りの島民の命を奪う事件が起こった。これに恨みを持った首長カメイアイモクは、フェアー・アメリカン号を1790年3月3日に襲撃し、乗組員のアイザック・デービスを除く全員を殺害した。これを受けてエレアノラ号は乗組員ジョン・ヤングを調査に派遣したが、ヤングは捕縛されたため、やむをえずエレアノラ号はヤングを残して出航した。こうして、ハワイにデービスとヤングの二人が残された。カメイアイモクの振る舞いに激怒したカメハメハ1世は、すぐデービスとヤングを保護し、自分の軍事顧問として遇した。",
      "それ以来カメハメハ1世は火器と火薬の調達にいそしみ、火器の使用法や管理法に習熟した白人の顧問を迎え入れた。1804年には、600挺のマスケット銃、14門の大砲、40門の旋回砲、6門の小型臼砲を保有するに至った。",
    ] },
  { "title" = "大王像", "paragraphs" = [
      "カメハメハ1世の像は、現在ハワイ州内の3か所にある。最も有名なのは、ホノルルのダウンタウン、アリイオラニ・ハレ（ハワイ州最高裁判所）にある像である。この像は1878年に、「キャプテン・クックによるハワイ発見100周年」を記念してイタリアで造られたが、輸送の途中海に没したため、再度造られた。左手の槍は平和を象徴し、掲げた右手はハワイの繁栄を表している。像のモデルとなったのはカメハメハ1世本人ではなく、建立当時の王であるカラカウアが宮廷の中から選んだ、特に見た目が美しい男性である。",
      "他の二体は生誕地であるハワイ島北部のカパアウと東部のヒロにあり、いずれも大王と深く関係した土地である。カパアウの像は上で海中へ没したのを引き揚げたもので、ヒロの像は別に最近1960年代に作られたものである。カメハメハ大王像は、そのミニチュアがハワイの土産物になり多くの土産物屋で売られているなど、日本でもよく知られた存在である。",
    ] },
  { "title" = "日本における知名度", "paragraphs" = [
      "1976年にNHK『みんなのうた』に採用された童謡「南の島のハメハメハ大王」（旧題：「ハメハメハ大王」、作詞：伊藤アキラ、作曲：森田公一）に登場するハメハメハ大王は、（作詞者の伊藤によると）カメハメハ大王の“友達”という設定になっている。",
      "元プロレスラーのキング・イヤウケアはカメハメハ王朝の末裔であり、インディアンの首長の末裔（とされていた）ブル・ラモスとのタッグチームは王族同士のコンビとして「ザ・タイクーンズ」と命名され、1970年代に全日本プロレスで活躍した。",
      "鳥山明の『ドラゴンボール』で主人公たちが使用する「かめはめ波」はこの王の名前から取られている。鳥山が技の名前を考えていたとき、鳥山の妻である、みかみなちが提案したものを、「ばかばかしくて亀仙人らしい」と採用した。",
    ] },
]

[articles.vi]
text = "Kamehameha I hay Kamehameha Đại đế, tên trong ngôn ngữ gốc là: Kalani Pai'ea Wohi o Kaleikini Keali'ikui Kamehameha o 'Iolani Kaiwikapu kau'i Ka Liholiho Kūnuiakea. (1758 – 8 tháng 3 năm 1819) là tù trưởng của Đảo Hawaii từ năm 1782, và là quốc vương cai trị toàn xứ Hawaii từ năm 1810 đến khi qua đời."
title = "Kamehameha I"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Kamehameha_I"
intro = [
  "Kamehameha I hay Kamehameha Đại đế, tên trong ngôn ngữ gốc là: Kalani Pai'ea Wohi o Kaleikini Keali'ikui Kamehameha o 'Iolani Kaiwikapu kau'i Ka Liholiho Kūnuiakea. (1758 – 8 tháng 3 năm 1819) là tù trưởng của Đảo Hawaii từ năm 1782, và là quốc vương cai trị toàn xứ Hawaii từ năm 1810 đến khi qua đời. Ông là người sáng lập ra Vương quốc Hawaii và cũng là vị vua Hawaii cận đại đầu tiên cai trị toàn cõi xứ Hawaii thống nhất.",
  "Ông là một chiến binh, một nhà ngoại giao và là một vị lãnh tụ vĩ đại của Vương quốc Hawaii. Ông được nhớ đến nhiều nhất vì đã thống nhất được xứ Hawaii sau hơn trăm năm chia cắt.",
]
sections = [
  { "title" = "Ban đầu", "paragraphs" = [
      "Kamehameha có tên khai sinh là Pai'ea. Năm sinh của ông vẫn là một bí ẩn, có thể là năm 1753, năm 1761 hoặc năm 1758, tuy vậy có thể ông được sinh ra vào khoảng tháng 11 năm 1758 ở bắc Kohala trong một gia đình quyền quý trên Đảo Hawaii. Cha ông là Keoua, thủ lĩnh xứ Kohala, còn mẹ ông là bà Keku'iapoiwa, ông ngoại ông là thủ lĩnh ở Kona.",
      "Tương truyền, ngay lúc khoảnh khắc mà ông chào đời thì ngay trên bầu trời xuất hiện một tia sáng kì lạ có hình dạng như chiếc lông chim, theo người dân Hawaii thì đó chính là dấu hiệu báo đến việc đứa bé chào đời sẽ là một nhà cai trị vĩ đại trong tương lai, người sẽ thống nhất và mang lại hòa bình cho quần đảo. Sự tương truyền này được coi là đúng vì vào năm 1758, Sao chổi Sao chổi Halley đã bay qua Đảo Hawaii.",
      "Vì khi mới sinh, sức khỏe của ông rất yếu cộng với những mối đe dọa từ các gia tộc khác, Pai'ea (Kamehameha) đã bị ông ngoại mình ra lệnh bỏ mặc cho đến chết. May thay, Pai'ea đã được mẹ mình giấu đi ngay khi mới sinh và phải sống những năm đầu tiên ẩn dật ở Waipio. Sau đó, ông trở về Kailua khi 5 tuổi và sống cùng ba mẹ của mình. Sau khi ba ông: Keoua qua đời, ông được chú mình là Kalani'opu'u, nhận nuôi. Chú ông sau đó đã dạy cho ông kỹ chiến đấu, các kiến thức lịch sử, điều hướng, nghi lễ tôn giáo cần thiết khác để trở thành một ali'i-'ai-moku (một thủ lĩnh tương lai).",
    ] },
  { "title" = "Sự nghiệp cai trị", "paragraphs" = [
      "Sau khi Kalani'opu'u qua đời vào năm 1782, vị tù trưởng đã chia đôi vùng đất đảo Hawai'i, trao nó cho con trai ông là: Kiwala'o các quận Ka'u, Puna và Hilo. Kamehameha cũng được trao quyền cai trị các quận Kona, Kohala và Hamakua. Kamehameha và các thủ lĩnh khác đã tập trung tại Honaunau để chờ phân phối lại đất đai. Khi Kamehameha và các đồng minh không nhận được những gì họ cho là xứng đáng, cuộc chiến giành quyền lực và tài sản bắt đầu.",
      "Trong bốn năm tiếp theo, nhiều trận chiến đã diễn ra trên khắp hòn đảo. Các lực lượng vượt trội của Kamehameha nhiều lần giành chiến thắng trước các chiến binh khác. Anh ta bắt con gái của Kiwala'o là Keopuolani làm vợ mình; ông cũng lấy đứa trẻ Ka'ahumanu (từng được nhắc đến làm vợ cho Kiwala'o) và \"hứa hôn với chính mình\". Do đó, ông khẳng định mình là một ứng cử viên sáng giá cho việc cai trị Hawaii. Cuối cùng, Kiwala'o đã bị giết trong một trận chiến, nhưng Đảo Hawaii chưa thể được thống nhất mà vẫn bị chia rẽ.",
      "Tại lãnh địa của Kamehameha là Vịnh Kealakekua, nơi có nhiều tàu buôn nước ngoài dừng chân ở đây, vì thế Kamehameha có thể dễ dàng tiếp cận với họ và đã tích lũy được một lượng lớn súng để sử dụng trong các trận chiến chống lại các thủ lĩnh địa phương. Tuy vậy, các vũ khí mới rất đắt tiền và góp phần làm tăng kinh phí cho chiến tranh.",
    ] },
]

