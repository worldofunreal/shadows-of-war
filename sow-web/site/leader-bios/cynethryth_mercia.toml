[articles.pt-BR]
text = "Cynethryth foi rainha da Mércia no fim do século VIII e depois abadessa de Cookham. Seu nome aparece como testemunha em cartas do reinado de Offa, e ela foi mãe de Ecgfrith, sucessor do rei. Moedas de prata trazem seu nome e título de rainha, uma distinção excepcional na Inglaterra anglo-saxônica. Algumas peças preservadas trazem a marca de Eoba, um moedeiro associado a Canterbury. As moedas documentam a circulação pública do título, embora as circunstâncias da encomenda permaneçam incertas."
title = "Cynethryth"
lang = "pt-BR"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth foi rainha da Mércia no fim do século VIII e depois abadessa de Cookham. Seu nome aparece como testemunha em cartas do reinado de Offa, e ela foi mãe de Ecgfrith, sucessor do rei. Moedas de prata trazem seu nome e título de rainha, uma distinção excepcional na Inglaterra anglo-saxônica. Algumas peças preservadas trazem a marca de Eoba, um moedeiro associado a Canterbury. As moedas documentam a circulação pública do título, embora as circunstâncias da encomenda permaneçam incertas."]
sections = [{ title = "O acordo de Clofesho", paragraphs = ["Após a morte de Offa em 796, Cynethryth aparece nos registros como abadessa. Uma carta de 798 documenta a negociação que ela concluiu com Æthelheard, arcebispo de Canterbury, em Clofesho. Ela assegurou Cookham e o mosteiro de Pectanege em troca de propriedades no condado de Kent, em Fleet, Teynham e na nascente do rio Cray. A carta avalia as três propriedades em sessenta, trinta e vinte hides, respectivamente. Preservado em cópias posteriores, o texto em latim registra uma decisão concreta de Cynethryth sobre a posse de terras e instituições religiosas depois dos reinados do marido e do filho."] }]
