[articles.de]
text = "Cynethryth war im späten achten Jahrhundert Königin von Mercia und später Äbtissin von Cookham. In Urkunden aus Offas Regierungszeit erscheint sie als Zeugin, und sie war die Mutter seines Nachfolgers Ecgfrith. Silberpfennige tragen ihren Namen mit dem Königinnentitel, eine außergewöhnliche Auszeichnung im angelsächsischen England. Mehrere erhaltene Münzen nennen Eoba, einen mit Canterbury verbundenen Münzmeister. Die Stücke bezeugen ihren öffentlich geführten Titel. Wer die Prägung in Auftrag gab und wie sie organisiert war, bleibt offen."
title = "Cynethryth"
lang = "de"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth war im späten achten Jahrhundert Königin von Mercia und später Äbtissin von Cookham. In Urkunden aus Offas Regierungszeit erscheint sie als Zeugin, und sie war die Mutter seines Nachfolgers Ecgfrith. Silberpfennige tragen ihren Namen mit dem Königinnentitel, eine außergewöhnliche Auszeichnung im angelsächsischen England. Mehrere erhaltene Münzen nennen Eoba, einen mit Canterbury verbundenen Münzmeister. Die Stücke bezeugen ihren öffentlich geführten Titel. Wer die Prägung in Auftrag gab und wie sie organisiert war, bleibt offen."]
sections = [{ title = "Die Einigung von Clofesho", paragraphs = ["Nach Offas Tod im Jahr 796 wird Cynethryth in den Quellen als Äbtissin bezeichnet. Eine Urkunde von 798 dokumentiert die Einigung, die sie in Clofesho mit Æthelheard, dem Erzbischof von Canterbury, erzielte. Sie sicherte sich Cookham und das Kloster Pectanege im Tausch gegen Besitzungen in Kent bei Fleet, Teynham und der Quelle des Cray. Die Besitzungen wurden auf sechzig, dreißig und zwanzig Hufen veranschlagt. Der lateinische Text ist in späteren Abschriften überliefert und belegt eine Entscheidung Cynethryths über Land und religiöse Einrichtungen nach der Herrschaft ihres Mannes und ihres Sohnes."] }]
