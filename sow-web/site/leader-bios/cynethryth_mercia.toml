[articles.tr]
text = "Cynethryth sekizinci yüzyılın sonlarında Mercia kraliçesi, daha sonra Cookham başrahibesiydi. Offa döneminin kraliyet belgelerinde tanık olarak yer alır ve onun halefi Ecgfrith’in annesidir. Adını ve kraliçe unvanını taşıyan gümüş paralar, Anglosakson İngiltere’sinde sıra dışı bir konuma işaret eder. Günümüze ulaşan bazı örneklerde Canterbury ile ilişkilendirilen sikke ustası Eoba’nın adı yer alır. Paralar unvanın dolaşımda olduğunu gösterir, ancak basım emrini kimin verdiği kesin olarak bilinmez."
title = "Cynethryth"
lang = "tr"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth sekizinci yüzyılın sonlarında Mercia kraliçesi, daha sonra Cookham başrahibesiydi. Offa döneminin kraliyet belgelerinde tanık olarak yer alır ve onun halefi Ecgfrith’in annesidir. Adını ve kraliçe unvanını taşıyan gümüş paralar, Anglosakson İngiltere’sinde sıra dışı bir konuma işaret eder. Günümüze ulaşan bazı örneklerde Canterbury ile ilişkilendirilen sikke ustası Eoba’nın adı yer alır. Paralar unvanın dolaşımda olduğunu gösterir, ancak basım emrini kimin verdiği kesin olarak bilinmez."]
sections = [{ title = "Clofesho’daki anlaşma", paragraphs = ["Offa 796’da öldükten sonra Cynethryth kayıtlarda başrahibe olarak görünür. 798 tarihli bir belge, Canterbury başpiskoposu Æthelheard ile Clofesho’da yaptığı anlaşmayı kaydeder. Kent’te Fleet, Teynham ve Cray Nehri’nin kaynağındaki topraklar karşılığında Cookham’ı ve Pectanege manastırını elde etti. Belge üç mülkün değerini sırasıyla altmış, otuz ve yirmi hide olarak verir. Sonraki kopyalarda korunan Latince metin, kocası ve oğlunun hükümdarlıklarından sonra Cynethryth’in topraklar ve dini kurumlar üzerinde aldığı somut bir kararı belgeler."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.zh-CN]
text = "西内斯里丝生活在八世纪后期，曾任麦西亚王后，后来出任库克姆修道院院长。奥法在位时，她的名字出现在多份王室文书的见证人名单里。她是王位继承人埃格弗里斯的母亲。她的名字和王后称号还出现在银币上，这在盎格鲁-撒克逊英格兰极为罕见。剑桥菲茨威廉博物馆的记录中就有一枚这样的银便士，上面没有人像，铸币人署名为埃奥巴。这名铸币人的作品与肯特地区关系密切，馆方将该币归于坎特伯雷铸造，但币面并未写出铸造地点。另有一些印着王后名字的银币带有人像。现存实物表明她的王后身份曾经由货币在公众中传播，至于谁下令铸造以及她本人如何参与，留存的证据还不足以确定。研究者也根据后来发现的两枚钱币提出，除了埃奥巴，还可能有另一位铸币人为她铸造过钱币。"
title = "西内斯里丝"
lang = "zh-CN"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["西内斯里丝生活在八世纪后期，曾任麦西亚王后，后来出任库克姆修道院院长。奥法在位时，她的名字出现在多份王室文书的见证人名单里。她是王位继承人埃格弗里斯的母亲。她的名字和王后称号还出现在银币上，这在盎格鲁-撒克逊英格兰极为罕见。剑桥菲茨威廉博物馆的记录中就有一枚这样的银便士，上面没有人像，铸币人署名为埃奥巴。这名铸币人的作品与肯特地区关系密切，馆方将该币归于坎特伯雷铸造，但币面并未写出铸造地点。另有一些印着王后名字的银币带有人像。现存实物表明她的王后身份曾经由货币在公众中传播，至于谁下令铸造以及她本人如何参与，留存的证据还不足以确定。研究者也根据后来发现的两枚钱币提出，除了埃奥巴，还可能有另一位铸币人为她铸造过钱币。"]
sections = [{ title = "克洛弗肖的协议", paragraphs = ["奥法在七九六年去世后，西内斯里丝以修道院院长的身份出现在记录里。七九八年，她与坎特伯雷大主教埃塞尔赫德在克洛弗肖达成协议。她以肯特的三处地产作为交换，确定了自己对库克姆和佩克塔内盖修道院的权利。交换涉及弗利特、泰纳姆以及克雷河源头的土地，三处地产在文书中分别记为六十、三十和二十海德。海德是当时用来估量地产的一种单位。文书以拉丁文写成，现存文本经由后来抄本流传，坎特伯雷基督教会的档案保留了这份协议。文书中的地名、地产规模和签约者让人得以追踪这次交换，也让西内斯里丝在丈夫和儿子执政之后的活动比她早年的经历更容易确认。关于她的出身和婚期，现有证据仍很有限。钱币和王室文书显示她以王后身份公开出现，修道院协议则留下她以院长身份处理地产与教会机构归属的具体记录。她晚年的谈判还说明，在王室政治以外，修道院也是她行使权力的场所。现代研究通常把这份协议放在麦西亚与西撒克逊王国争夺泰晤士河流域影响力的背景下考察。"] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.ja]
text = "キュネスリスは八世紀末のマーシアの王妃で、後にクッカムの修道院長となった。オッファ治世の王室文書に立会人として名があり、オッファを継いだエグフリスの母でもある。彼女の名と王妃の称号が刻まれた銀貨が残る。王妃の名を持つこのような貨幣は、アングロサクソン期のイングランドでは例外的な存在だった。ケンブリッジのフィッツウィリアム博物館が記録する銀貨の一枚は、肖像がない型で、貨幣職人エオバの名が読める。目録は鋳造地をカンタベリーとしているが、貨幣に鋳造地名は刻まれていない。別の型には肖像がある。エオバはケントの王たちの貨幣も作った。後に見つかった別の二枚から、彼とは異なる職人もキュネスリスの貨幣を作った可能性が指摘されている。銀貨は彼女の称号が広く目に触れたことを示すが、誰が発行を命じたかは確定していない。"
title = "キュネスリス"
lang = "ja"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["キュネスリスは八世紀末のマーシアの王妃で、後にクッカムの修道院長となった。オッファ治世の王室文書に立会人として名があり、オッファを継いだエグフリスの母でもある。彼女の名と王妃の称号が刻まれた銀貨が残る。王妃の名を持つこのような貨幣は、アングロサクソン期のイングランドでは例外的な存在だった。ケンブリッジのフィッツウィリアム博物館が記録する銀貨の一枚は、肖像がない型で、貨幣職人エオバの名が読める。目録は鋳造地をカンタベリーとしているが、貨幣に鋳造地名は刻まれていない。別の型には肖像がある。エオバはケントの王たちの貨幣も作った。後に見つかった別の二枚から、彼とは異なる職人もキュネスリスの貨幣を作った可能性が指摘されている。銀貨は彼女の称号が広く目に触れたことを示すが、誰が発行を命じたかは確定していない。"]
sections = [{ title = "クロフェショでの合意", paragraphs = ["オッファが七九六年に死去した後、キュネスリスは修道院長として記録に現れる。七九八年の文書は、カンタベリー大司教エゼルヘアドとクロフェショで成立した合意を伝える。彼女はケントにあるフリート、テイナム、クレイ川の水源の三か所の所領と引き換えに、クッカムとペクタネゲの修道院を確保した。文書では土地の規模を当時の評価単位で数え、それぞれ六十、三十、二十ハイドとしている。合意の本文はラテン語で書かれ、後の時代に作られた写本で伝わった。カンタベリーのクライスト・チャーチの文書群に属する記録である。地名と土地の評価が残っているため、何を手放し、どの施設を手元に置いたかが分かる。生まれや結婚の時期については資料が乏しい一方、王妃だった時期には証人名簿と銀貨があり、夫と息子の治世が終わった後にはこの取り決めが残る。クッカムの記録は、修道院長として土地と宗教施設の帰属を交渉した具体的な一例である。"] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.ko]
text = "키네스리스는 8세기 말 머시아의 왕비였고 나중에 쿠컴 수도원의 원장이 되었다. 오파의 재위기에 작성된 왕실 문서에서 증인으로 이름을 올렸으며, 그의 뒤를 이은 에그프리스의 어머니였다. 이름과 왕비 칭호가 새겨진 은화도 남아 있다. 왕비의 이름이 화폐에 등장하는 것은 앵글로색슨 시대 잉글랜드에서 매우 드문 일이었다. 케임브리지 피츠윌리엄 박물관이 기록한 주화 한 점에는 초상이 없고, 주화 제작자 에오바의 이름이 새겨져 있다. 목록에서는 이 주화를 캔터베리에서 제작한 것으로 분류하지만 주화에 제작지 이름이 적혀 있지는 않다. 다른 유형에는 초상이 새겨졌다. 에오바가 아닌 제작자의 이름이 들어간 것으로 보이는 주화도 뒤에 발견되었다. 이런 유물은 왕비의 이름이 공개적으로 유통됐음을 보여 주지만, 주화를 누가 주문했는지는 확실하지 않다."
title = "키네스리스"
lang = "ko"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["키네스리스는 8세기 말 머시아의 왕비였고 나중에 쿠컴 수도원의 원장이 되었다. 오파의 재위기에 작성된 왕실 문서에서 증인으로 이름을 올렸으며, 그의 뒤를 이은 에그프리스의 어머니였다. 이름과 왕비 칭호가 새겨진 은화도 남아 있다. 왕비의 이름이 화폐에 등장하는 것은 앵글로색슨 시대 잉글랜드에서 매우 드문 일이었다. 케임브리지 피츠윌리엄 박물관이 기록한 주화 한 점에는 초상이 없고, 주화 제작자 에오바의 이름이 새겨져 있다. 목록에서는 이 주화를 캔터베리에서 제작한 것으로 분류하지만 주화에 제작지 이름이 적혀 있지는 않다. 다른 유형에는 초상이 새겨졌다. 에오바가 아닌 제작자의 이름이 들어간 것으로 보이는 주화도 뒤에 발견되었다. 이런 유물은 왕비의 이름이 공개적으로 유통됐음을 보여 주지만, 주화를 누가 주문했는지는 확실하지 않다."]
sections = [{ title = "클로페쇼의 합의", paragraphs = ["796년 오파가 사망한 뒤 키네스리스는 수도원장으로 기록에 등장한다. 798년 문서에는 캔터베리 대주교 애설헤어드와 클로페쇼에서 맺은 합의가 남아 있다. 키네스리스는 켄트의 플리트와 테이넘, 크레이강 발원지에 있는 토지를 내주는 대가로 쿠컴과 펙타네게의 수도원을 확보했다. 문서는 세 토지의 규모를 당시 토지 평가 단위로 각각 육십, 삼십, 이십 하이드라고 적었다. 라틴어로 된 본문은 이후에 만들어진 필사본으로 전해지며 캔터베리 크라이스트처치의 문서군에 속한다. 지명과 토지 규모가 구체적으로 기록되어 있어 교환의 내용을 확인할 수 있다. 출신과 혼인 시기에는 알려진 바가 적지만, 왕비였던 시기에는 증인 명단과 주화가, 남편과 아들의 통치가 끝난 뒤에는 수도원장으로서 합의한 이 문서가 남아 있다. 쿠컴 협정은 키네스리스가 토지와 종교 기관의 관할권을 직접 다룬 사례다."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.ar]
text = "كانت سينثريث ملكة مرسيا في أواخر القرن الثامن، ثم أصبحت رئيسة دير كوكهام. ورد اسمها بين شهود مواثيق عهد أوفا، وكانت أم ابنه وخليفته إكغفريث. حملت نقود فضية اسمها ولقب الملكة، وهو امتياز نادر في إنجلترا الأنجلوسكسونية. تحمل بعض القطع الباقية اسم إيوبا، وهو ضارب نقود ارتبط عمله بكانتربري. وتشهد هذه القطع على تداول لقبها علنا، بينما تظل هوية من أمر بسكها غير مؤكدة."
title = "سينثريث"
lang = "ar"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["كانت سينثريث ملكة مرسيا في أواخر القرن الثامن، ثم أصبحت رئيسة دير كوكهام. ورد اسمها بين شهود مواثيق عهد أوفا، وكانت أم ابنه وخليفته إكغفريث. حملت نقود فضية اسمها ولقب الملكة، وهو امتياز نادر في إنجلترا الأنجلوسكسونية. تحمل بعض القطع الباقية اسم إيوبا، وهو ضارب نقود ارتبط عمله بكانتربري. وتشهد هذه القطع على تداول لقبها علنا، بينما تظل هوية من أمر بسكها غير مؤكدة."]
sections = [{ title = "التسوية في كلوفيشو", paragraphs = ["بعد وفاة أوفا سنة 796 تظهر سينثريث في السجلات بصفتها رئيسة دير. وتوثق وثيقة مؤرخة بسنة 798 تسوية عقدتها في كلوفيشو مع إيثلهيرد، رئيس أساقفة كانتربري. حصلت على كوكهام ودير بيكتانيغه مقابل أملاك في كِنت، في فليت وتينهام وعند منبع نهر كراي. ويقدر النص الأملاك الثلاثة بستين وثلاثين وعشرين وحدة أرضية على التوالي. وحفظت نسخ متأخرة نص الاتفاق اللاتيني، الذي يبين قرارا محددا اتخذته سينثريث بشأن ملكية الأراضي والمؤسسات الدينية بعد عهدي زوجها وابنها. وبقيت الوثيقة ضمن مجموعة سجلات كنيسة المسيح في كانتربري."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.ru]
text = "Кинетрит была королевой Мерсии в конце VIII века, а позднее стала настоятельницей Кукема. Она засвидетельствовала ряд грамот времён Оффы и была матерью его преемника Экгфрита. На серебряных пенни её имя сопровождает титул королевы, что исключительно для англосаксонской Англии. На части сохранившихся монет стоит имя Эобы, мастера, которого связывают с Кентербери. Эти монеты подтверждают публичное употребление её титула, хотя обстоятельства выпуска остаются неясными."
title = "Кинетрит"
lang = "ru"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Кинетрит была королевой Мерсии в конце VIII века, а позднее стала настоятельницей Кукема. Она засвидетельствовала ряд грамот времён Оффы и была матерью его преемника Экгфрита. На серебряных пенни её имя сопровождает титул королевы, что исключительно для англосаксонской Англии. На части сохранившихся монет стоит имя Эобы, мастера, которого связывают с Кентербери. Эти монеты подтверждают публичное употребление её титула, хотя обстоятельства выпуска остаются неясными."]
sections = [{ title = "Соглашение в Клофешо", paragraphs = ["После смерти Оффы в 796 году Кинетрит фигурирует в документах как настоятельница. Грамота 798 года фиксирует соглашение, которое она заключила в Клофешо с архиепископом Кентерберийским Этельхердом. Она получила Кукем и монастырь Пектанеге в обмен на земли в Кенте, во Флите, Тейнеме и у истока реки Крей. Эти владения оценены соответственно в шестьдесят, тридцать и двадцать гайд. Латинский текст дошёл в более поздних списках и свидетельствует о решении Кинетрит относительно земель и церковных учреждений, принятом после правления её мужа и сына."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.vi]
text = "Cynethryth là vương hậu Mercia vào cuối thế kỷ VIII và sau đó là viện trưởng tu viện Cookham. Tên bà xuất hiện với tư cách người làm chứng trong các văn thư thời vua Offa. Bà cũng là mẹ của Ecgfrith, người kế vị ông. Những đồng bạc mang tên và tước hiệu vương hậu của bà là trường hợp hiếm trong lịch sử nước Anh thời Anglo-Saxon. Một số đồng còn mang tên Eoba, người đúc tiền có liên hệ với Canterbury. Các hiện vật cho biết tước hiệu của bà đã được lưu hành công khai, dù chưa rõ ai đặt làm những đồng tiền đó."
title = "Cynethryth"
lang = "vi"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth là vương hậu Mercia vào cuối thế kỷ VIII và sau đó là viện trưởng tu viện Cookham. Tên bà xuất hiện với tư cách người làm chứng trong các văn thư thời vua Offa. Bà cũng là mẹ của Ecgfrith, người kế vị ông. Những đồng bạc mang tên và tước hiệu vương hậu của bà là trường hợp hiếm trong lịch sử nước Anh thời Anglo-Saxon. Một số đồng còn mang tên Eoba, người đúc tiền có liên hệ với Canterbury. Các hiện vật cho biết tước hiệu của bà đã được lưu hành công khai, dù chưa rõ ai đặt làm những đồng tiền đó."]
sections = [{ title = "Dàn xếp tại Clofesho", paragraphs = ["Sau khi Offa qua đời năm 796, Cynethryth xuất hiện trong các văn bản với tư cách viện trưởng. Một văn thư năm 798 ghi lại việc bà thỏa thuận với Æthelheard, tổng giám mục Canterbury, tại Clofesho. Bà giữ được Cookham và nhận cơ sở tu viện tại Pectanege, đổi lấy các điền sản ở Kent tại Fleet, Teynham và đầu nguồn sông Cray. Ba điền sản được tính lần lượt là sáu mươi, ba mươi và hai mươi hide, đơn vị định giá đất thời trung đại. Văn bản tiếng Latinh còn lại qua các bản sao muộn hơn, ghi nhận quyết định cụ thể của Cynethryth về điền sản và cơ sở tôn giáo sau thời trị vì của chồng và con trai."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.id]
text = "Cynethryth adalah ratu Mercia pada akhir abad kedelapan dan kemudian menjadi abdis Cookham. Namanya tercatat sebagai saksi dalam piagam dari masa pemerintahan Offa. Ia juga ibu Ecgfrith, penerus Offa. Keping perak yang membawa nama dan gelarnya sebagai ratu merupakan peninggalan yang istimewa dari Inggris Anglo-Saxon. Sebagian keping yang masih ada mencantumkan nama Eoba, pembuat uang yang dikaitkan dengan Canterbury. Keping-keping itu membuktikan bahwa gelar Cynethryth beredar di muka umum, meskipun siapa yang memesan pembuatannya masih belum pasti."
title = "Cynethryth"
lang = "id"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth adalah ratu Mercia pada akhir abad kedelapan dan kemudian menjadi abdis Cookham. Namanya tercatat sebagai saksi dalam piagam dari masa pemerintahan Offa. Ia juga ibu Ecgfrith, penerus Offa. Keping perak yang membawa nama dan gelarnya sebagai ratu merupakan peninggalan yang istimewa dari Inggris Anglo-Saxon. Sebagian keping yang masih ada mencantumkan nama Eoba, pembuat uang yang dikaitkan dengan Canterbury. Keping-keping itu membuktikan bahwa gelar Cynethryth beredar di muka umum, meskipun siapa yang memesan pembuatannya masih belum pasti."]
sections = [{ title = "Penyelesaian di Clofesho", paragraphs = ["Setelah Offa meninggal pada 796, Cynethryth tercatat sebagai abdis. Piagam bertarikh 798 mencatat kesepakatannya dengan Æthelheard, uskup agung Canterbury, di Clofesho. Ia memperoleh Cookham dan biara Pectanege dengan menyerahkan tanah di Kent, yaitu di Fleet, Teynham, dan hulu sungai Cray. Piagam itu menilai ketiga kepemilikan tersebut masing-masing sebesar enam puluh, tiga puluh, dan dua puluh hide. Naskah Latin bertahan melalui salinan dari masa yang lebih kemudian. Isinya menunjukkan keputusan konkret Cynethryth mengenai penguasaan tanah dan lembaga keagamaan setelah masa pemerintahan suami dan putranya."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.fil]
text = "Si Cynethryth ay reyna ng Mercia sa huling bahagi ng ikawalong siglo at naging abadesa ng Cookham. Lumilitaw ang pangalan niya bilang saksi sa mga kasulatan noong panahon ni Offa. Siya ang ina ni Ecgfrith, na humalili kay Offa. May mga baryang pilak na may pangalan at titulo niya bilang reyna, isang pambihirang karangalan sa Inglatera noong panahon ng mga Anglo-Saxon. Nasa ilan sa mga baryang ito ang pangalan ni Eoba, isang tagagawa ng baryang iniuugnay sa Canterbury. Patunay ang mga ito na nakilala sa publiko ang titulo niya, bagaman hindi tiyak kung sino ang nagpagawa ng mga barya."
title = "Cynethryth"
lang = "fil"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Si Cynethryth ay reyna ng Mercia sa huling bahagi ng ikawalong siglo at naging abadesa ng Cookham. Lumilitaw ang pangalan niya bilang saksi sa mga kasulatan noong panahon ni Offa. Siya ang ina ni Ecgfrith, na humalili kay Offa. May mga baryang pilak na may pangalan at titulo niya bilang reyna, isang pambihirang karangalan sa Inglatera noong panahon ng mga Anglo-Saxon. Nasa ilan sa mga baryang ito ang pangalan ni Eoba, isang tagagawa ng baryang iniuugnay sa Canterbury. Patunay ang mga ito na nakilala sa publiko ang titulo niya, bagaman hindi tiyak kung sino ang nagpagawa ng mga barya."]
sections = [{ title = "Ang kasunduan sa Clofesho", paragraphs = ["Pagkamatay ni Offa noong 796, lumilitaw sa mga tala si Cynethryth bilang abadesa. Nakatala sa kasulatan ng 798 ang kasunduan niya kay Æthelheard, arsobispo ng Canterbury, sa Clofesho. Nakuha niya ang Cookham at ang monasteryo sa Pectanege kapalit ng mga lupain sa Kent, sa Fleet, Teynham at bukal ng ilog Cray. Tinaya ang tatlong lupain sa animnapu, tatlumpu at dalawampung hide, ayon sa pagkakasunod. Nabasa ang tekstong Latin sa mga kopyang ginawa sa kalaunan. Itinatala nito ang isang pasya ni Cynethryth tungkol sa pangangasiwa ng mga lupain at monasteryo matapos ang mga paghahari ng asawa at anak niya."] }]
