[articles.it]
text = "Cynethryth fu regina di Mercia alla fine dell’VIII secolo e in seguito badessa di Cookham. Compare tra i testimoni degli atti del regno di Offa e fu madre del suo successore, Ecgfrith. Alcuni denari d’argento recano il suo nome e il titolo di regina, una distinzione eccezionale nell’Inghilterra anglosassone. Tra gli esemplari conservati ve ne sono alcuni firmati da Eoba, monetiere legato a Canterbury. Le monete attestano la diffusione pubblica del titolo, mentre resta incerto chi commissionò la coniazione."
title = "Cynethryth"
lang = "it"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth fu regina di Mercia alla fine dell’VIII secolo e in seguito badessa di Cookham. Compare tra i testimoni degli atti del regno di Offa e fu madre del suo successore, Ecgfrith. Alcuni denari d’argento recano il suo nome e il titolo di regina, una distinzione eccezionale nell’Inghilterra anglosassone. Tra gli esemplari conservati ve ne sono alcuni firmati da Eoba, monetiere legato a Canterbury. Le monete attestano la diffusione pubblica del titolo, mentre resta incerto chi commissionò la coniazione."]
sections = [{ title = "L’accordo di Clofesho", paragraphs = ["Dopo la morte di Offa nel 796, Cynethryth compare nei documenti come badessa. Un atto del 798 registra l’accordo concluso a Clofesho con Æthelheard, arcivescovo di Canterbury. Ottenne Cookham e il monastero di Pectanege cedendo possedimenti del Kent a Fleet, a Teynham e alla sorgente del Cray. L’atto valuta le tre proprietà rispettivamente a sessanta, trenta e venti hide, un’unità medievale di valutazione fondiaria. Il testo latino sopravvive in copie posteriori e documenta una decisione di Cynethryth su terre e istituzioni religiose dopo i regni del marito e del figlio."] }]
