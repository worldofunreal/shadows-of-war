[articles.en]
text = "Cynethryth was queen of Mercia in the late eighth century and later abbess of Cookham. Her name appears as a witness in royal charters from the reign of Offa, and she was the mother of his successor Ecgfrith. Silver pennies give her the title of queen, an exceptional distinction in Anglo-Saxon England. Surviving examples include coins signed by Eoba, a moneyer whose work is associated with Canterbury. The pieces establish that her title circulated publicly, although the surviving evidence leaves open who commissioned the issue and how it was organized."
title = "Cynethryth"
lang = "en"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth was queen of Mercia in the late eighth century and later abbess of Cookham. Her name appears as a witness in royal charters from the reign of Offa, and she was the mother of his successor Ecgfrith. Silver pennies give her the title of queen, an exceptional distinction in Anglo-Saxon England. Surviving examples include coins signed by Eoba, a moneyer whose work is associated with Canterbury. The pieces establish that her title circulated publicly, although the surviving evidence leaves open who commissioned the issue and how it was organized."]
sections = [{ title = "The settlement at Clofesho", paragraphs = ["After Offa died in 796, Cynethryth appears in the records as an abbess. A settlement dated 798 records her agreement with Æthelheard, archbishop of Canterbury, at Clofesho. She secured Cookham and the minster at Pectanege in exchange for holdings in Kent at Fleet, Teynham and the source of the Cray. The charter measures those holdings as sixty, thirty and twenty hides respectively. The surviving Latin text was preserved in later copies. It records a specific decision about the control of estates and religious houses made by Cynethryth after the reigns of her husband and son."] }]
sources = [{ title = "Electronic Sawyer, charter S 1258 (798)", url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html" }, { title = "Fitzwilliam Museum, Cynethryth penny EMC 1002.0329", url = "https://emc.fitzmuseum.cam.ac.uk/full-record/10020329" }, { title = "Rory Naismith, A New Moneyer for Cynethryth, Queen of the Mercians", url = "https://www.britnumsoc.org/images/Annual_BNJ/2021v91/CYNETHRYTH.pdf" }, { title = "Kinship and Power: Cynethryth and Æthelswith, Queens of Mercia", url = "https://www.cambridge.org/core/journals/early-medieval-england-and-its-n/article/kinship-and-power-cynethryth-and-aethelswith-queens-of-mercia/E54FB15D2D8ABE61A09A75C691B3D647" }, { title = "S. E. Kelly, Cynethryth, Oxford Dictionary of National Biography", url = "https://doi.org/10.1093/ref:odnb/54442" }]

[articles.es]
text = "Cynethryth fue reina de Mercia a finales del siglo VIII y más tarde abadesa de Cookham. Figura como testigo en cartas regias del reinado de Offa y fue madre de su sucesor, Ecgfrith. Las monedas de plata que llevan su nombre y el título de reina le dan un lugar excepcional en la Inglaterra anglosajona. Algunas llevan la firma de Eoba, un acuñador vinculado a Canterbury. Su circulación demuestra la presencia pública de la reina, aunque las piezas conservadas dejan abierta la cuestión de quién encargó la emisión."
title = "Cynethryth"
lang = "es"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth fue reina de Mercia a finales del siglo VIII y más tarde abadesa de Cookham. Figura como testigo en cartas regias del reinado de Offa y fue madre de su sucesor, Ecgfrith. Las monedas de plata que llevan su nombre y el título de reina le dan un lugar excepcional en la Inglaterra anglosajona. Algunas llevan la firma de Eoba, un acuñador vinculado a Canterbury. Su circulación demuestra la presencia pública de la reina, aunque las piezas conservadas dejan abierta la cuestión de quién encargó la emisión."]
sections = [{ title = "El acuerdo de Clofesho", paragraphs = ["Tras la muerte de Offa en 796, Cynethryth aparece en los documentos como abadesa. Un acuerdo fechado en 798 recoge el trato que cerró con Æthelheard, arzobispo de Canterbury, en Clofesho. Aseguró el control de Cookham y del monasterio de Pectanege a cambio de propiedades en Kent, en Fleet, Teynham y el nacimiento del río Cray. La carta mide las tres posesiones en sesenta, treinta y veinte hides respectivamente, una unidad medieval de valoración de tierras. El texto latino se conserva en copias posteriores y documenta una decisión concreta sobre tierras e instituciones religiosas que Cynethryth tomó después de los reinados de su esposo y su hijo."] }]
