[articles.fr]
text = "Cynethryth fut reine de Mercie à la fin du VIIIe siècle, puis abbesse de Cookham. Elle figure comme témoin dans des chartes du règne d’Offa et fut la mère de son successeur Ecgfrith. Des deniers d’argent portent son nom et son titre de reine, distinction exceptionnelle dans l’Angleterre anglo-saxonne. Plusieurs exemplaires sont signés par le monnayeur Eoba, dont l’activité est associée à Canterbury. Ces pièces attestent la diffusion de son titre, même si les conditions précises de l’émission demeurent incertaines."
title = "Cynethryth"
lang = "fr"
url = "https://esawyer.robinson.cam.ac.uk/charter/1258.html"
shortArticle = true
intro = ["Cynethryth fut reine de Mercie à la fin du VIIIe siècle, puis abbesse de Cookham. Elle figure comme témoin dans des chartes du règne d’Offa et fut la mère de son successeur Ecgfrith. Des deniers d’argent portent son nom et son titre de reine, distinction exceptionnelle dans l’Angleterre anglo-saxonne. Plusieurs exemplaires sont signés par le monnayeur Eoba, dont l’activité est associée à Canterbury. Ces pièces attestent la diffusion de son titre, même si les conditions précises de l’émission demeurent incertaines."]
sections = [{ title = "Le règlement de Clofesho", paragraphs = ["Après la mort d’Offa en 796, Cynethryth apparaît dans les documents en qualité d’abbesse. Un accord daté de 798 rapporte le règlement conclu à Clofesho avec Æthelheard, archevêque de Canterbury. Elle obtint Cookham et le monastère de Pectanege en échange de domaines dans le Kent, à Fleet, à Teynham et à la source de la Cray. La charte évalue les trois domaines à soixante, trente et vingt hides respectivement. Conservé dans des copies plus tardives, le texte latin atteste une décision de Cynethryth sur la maîtrise de terres et d’établissements religieux après les règnes de son mari et de son fils."] }]
