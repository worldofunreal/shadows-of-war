[articles.en]
text = "Jalal al-Din Mangburni succeeded his father Muhammad II as the Mongols were breaking apart the Khwarazmian Empire. He gathered troops at Ghazni and defeated a Mongol army at Parwan in 1221. Chinggis Khan then pursued him to the Indus, where Jalal al-Din lost the battle but escaped across the river on horseback. Part of his force also reached the far bank."
title = "Jalal al-Din Mangburni"
lang = "en"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni succeeded his father Muhammad II as the Mongols were breaking apart the Khwarazmian Empire. He gathered troops at Ghazni and defeated a Mongol army at Parwan in 1221. Chinggis Khan then pursued him to the Indus, where Jalal al-Din lost the battle but escaped across the river on horseback. Part of his force also reached the far bank."]
sections = [{ title = "Surviving the Mongol invasion", paragraphs = ["He spent the next few years fighting and negotiating with rulers in the region, then returned west and reestablished his authority in parts of Iran and Azerbaijan. His later campaigns included the capture of Tbilisi and the siege of Ahlat. Rivals in Anatolia and northern Mesopotamia defeated him at Yassıçemen in 1230. A fresh Mongol offensive drove him west again, and he was killed in 1231. The exact date of the battle on the Indus and the circumstances of his death remain uncertain. Al-Nasawi, who served as his secretary, wrote a major account of his life. Later Persian manuscripts made the river crossing a recurring scene, illustrating how the episode was remembered as well as how it was recorded."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.es]
text = "Jalal al-Din Mangburni sucedió a su padre, Muhammad II, cuando la invasión mongola desmembraba el Imperio jorezmita. Reunió tropas en Gazni y derrotó a un ejército mongol en Parwan en 1221. Gengis Kan lo persiguió hasta el Indo. Jalal al-Din perdió allí la batalla, pero cruzó el río a caballo y parte de su ejército también alcanzó la otra orilla."
title = "Jalal al-Din Mangburni"
lang = "es"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni sucedió a su padre, Muhammad II, cuando la invasión mongola desmembraba el Imperio jorezmita. Reunió tropas en Gazni y derrotó a un ejército mongol en Parwan en 1221. Gengis Kan lo persiguió hasta el Indo. Jalal al-Din perdió allí la batalla, pero cruzó el río a caballo y parte de su ejército también alcanzó la otra orilla."]
sections = [{ title = "Sobrevivir a la invasión mongola", paragraphs = ["Durante los años siguientes combatió y negoció con gobernantes de la región. Después regresó al oeste y restableció su autoridad en partes de Irán y Azerbaiyán. Sus campañas posteriores incluyeron la toma de Tiflis y el asedio de Ahlat. Sus rivales de Anatolia y el norte de Mesopotamia lo derrotaron en Yassıçemen en 1230. Otra ofensiva mongola lo empujó de nuevo hacia el oeste y en 1231 fue asesinado. La fecha exacta de la batalla del Indo y las circunstancias de su muerte siguen siendo inciertas. Al-Nasawi, que fue su secretario, escribió una de las principales biografías del sultán. Más tarde, los manuscritos persas ilustrados volvieron al cruce del río y dejaron constancia de cómo se recordaba el episodio."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.fr]
text = "Jalal al-Din Mangburni succéda à son père Muhammad II alors que l’invasion mongole disloquait l’Empire khwarezmien. Il rassembla ses troupes à Ghazni et vainquit une armée mongole à Parwan en 1221. Gengis Khan le poursuivit jusqu’à l’Indus. Jalal al-Din y perdit la bataille, mais traversa le fleuve à cheval et une partie de ses forces gagna aussi l’autre rive."
title = "Jalal al-Din Mangburni"
lang = "fr"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni succéda à son père Muhammad II alors que l’invasion mongole disloquait l’Empire khwarezmien. Il rassembla ses troupes à Ghazni et vainquit une armée mongole à Parwan en 1221. Gengis Khan le poursuivit jusqu’à l’Indus. Jalal al-Din y perdit la bataille, mais traversa le fleuve à cheval et une partie de ses forces gagna aussi l’autre rive."]
sections = [{ title = "Survivre à l’invasion mongole", paragraphs = ["Au cours des années suivantes, il combattit et négocia avec les souverains de la région. Il regagna ensuite l’ouest et rétablit son autorité sur des parties de l’Iran et de l’Azerbaïdjan. Ses campagnes ultérieures comprirent la prise de Tbilissi et le siège d’Ahlat. Ses adversaires d’Anatolie et du nord de la Mésopotamie le vainquirent à Yassıçemen en 1230. Une nouvelle offensive mongole le repoussa vers l’ouest et il fut tué en 1231. La date précise de la bataille de l’Indus et les circonstances de sa mort demeurent incertaines. Al-Nasawi, son secrétaire, écrivit une des principales biographies du sultan. Plus tard, les manuscrits persans illustrés reprirent la traversée du fleuve et témoignèrent de la mémoire de cet épisode."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.de]
text = "Dschalal ad-Din Mangburni folgte seinem Vater Muhammad II. nach, als die Mongolen das Choresmische Reich zerschlugen. Er sammelte in Ghazni Truppen und besiegte 1221 bei Parwan ein mongolisches Heer. Dschingis Khan verfolgte ihn bis zum Indus. Dschalal ad-Din verlor dort die Schlacht, entkam jedoch zu Pferd über den Fluss. Auch ein Teil seiner Truppen erreichte das andere Ufer."
title = "Dschalal ad-Din Mangburni"
lang = "de"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Dschalal ad-Din Mangburni folgte seinem Vater Muhammad II. nach, als die Mongolen das Choresmische Reich zerschlugen. Er sammelte in Ghazni Truppen und besiegte 1221 bei Parwan ein mongolisches Heer. Dschingis Khan verfolgte ihn bis zum Indus. Dschalal ad-Din verlor dort die Schlacht, entkam jedoch zu Pferd über den Fluss. Auch ein Teil seiner Truppen erreichte das andere Ufer."]
sections = [{ title = "Die mongolische Invasion überleben", paragraphs = ["In den nächsten Jahren kämpfte und verhandelte er mit Herrschern in der Region. Danach kehrte er nach Westen zurück und errichtete seine Herrschaft in Teilen Irans und Aserbaidschans erneut. Zu seinen späteren Feldzügen gehörten die Einnahme von Tiflis und die Belagerung von Ahlat. Seine Gegner aus Anatolien und Nordmesopotamien schlugen ihn 1230 bei Yassıçemen. Ein neuer mongolischer Vorstoß trieb ihn wieder nach Westen, und 1231 wurde er getötet. Das genaue Datum der Schlacht am Indus und die Umstände seines Todes sind ungewiss. Al-Nasawi, sein Sekretär, schrieb eine der wichtigsten Darstellungen seines Lebens. Spätere persische Handschriften griffen die Flussüberquerung in Bildern auf und zeigen, wie man sich an diese Episode erinnerte."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.it]
text = "Jalal al-Din Mangburni succedette al padre Muhammad II mentre l’invasione mongola smembrava l’Impero corasmio. Radunò truppe a Ghazni e nel 1221 sconfisse un esercito mongolo a Parwan. Gengis Khan lo inseguì fino all’Indo. Jalal al-Din perse la battaglia, ma attraversò il fiume a cavallo e anche parte delle sue forze raggiunse l’altra riva."
title = "Jalal al-Din Mangburni"
lang = "it"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni succedette al padre Muhammad II mentre l’invasione mongola smembrava l’Impero corasmio. Radunò truppe a Ghazni e nel 1221 sconfisse un esercito mongolo a Parwan. Gengis Khan lo inseguì fino all’Indo. Jalal al-Din perse la battaglia, ma attraversò il fiume a cavallo e anche parte delle sue forze raggiunse l’altra riva."]
sections = [{ title = "Sopravvivere all’invasione mongola", paragraphs = ["Negli anni seguenti combatté e negoziò con i sovrani della regione. Tornò poi verso ovest e ristabilì la propria autorità in alcune zone dell’Iran e dell’Azerbaigian. Le sue campagne successive compresero la presa di Tbilisi e l’assedio di Ahlat. I suoi rivali dell’Anatolia e della Mesopotamia settentrionale lo sconfissero a Yassıçemen nel 1230. Una nuova offensiva mongola lo respinse verso ovest e nel 1231 fu ucciso. La data esatta della battaglia sull’Indo e le circostanze della morte rimangono incerte. Il suo segretario al-Nasawi scrisse una delle biografie principali del sultano. L’attraversamento del fiume ricorre nei manoscritti persiani illustrati posteriori, che mostrano come fu ricordato l’episodio."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.tr]
text = "Celâleddin Mengüberdi, Moğollar Harezmşahlar Devleti’ni parçalarken babası II. Muhammed’in yerine geçti. Gazne’de asker topladı ve 1221’de Pervan’da bir Moğol ordusunu yendi. Cengiz Han onu İndus’a kadar takip etti. Celâleddin savaşı kaybetti, ancak nehri atıyla geçti ve kuvvetlerinin bir bölümü de karşı kıyıya ulaşabildi."
title = "Celâleddin Harezmşah"
lang = "tr"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Celâleddin Mengüberdi, Moğollar Harezmşahlar Devleti’ni parçalarken babası II. Muhammed’in yerine geçti. Gazne’de asker topladı ve 1221’de Pervan’da bir Moğol ordusunu yendi. Cengiz Han onu İndus’a kadar takip etti. Celâleddin savaşı kaybetti, ancak nehri atıyla geçti ve kuvvetlerinin bir bölümü de karşı kıyıya ulaşabildi."]
sections = [{ title = "Moğol istilasından sağ çıkmak", paragraphs = ["Sonraki birkaç yıl bölgede başka hükümdarlarla savaştı ve görüşmeler yaptı. Ardından batıya dönüp İran ve Azerbaycan’ın bazı kesimlerinde yeniden hâkimiyet kurdu. Sonraki seferlerinde Tiflis’i ele geçirdi ve Ahlat’ı kuşattı. Anadolu ve Kuzey Mezopotamya’daki rakipleri 1230’da Yassıçemen’de onu yendi. Yeni bir Moğol saldırısı onu yeniden batıya sürdü ve 1231’de öldürüldü. İndus savaşının kesin tarihi ve ölümünün ayrıntıları belirsizdir. Kâtipliğini yapan Nesavî, sultanın hayatına ilişkin başlıca kaynaklardan birini yazdı. Daha sonraki resimli Farsça yazmalarda İndus geçişi yeniden betimlendi. Bu tasvirler olayın sonraki yüzyıllarda nasıl hatırlandığını gösterir."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.zh-CN]
text = "蒙古军瓦解花剌子模帝国之际，札兰丁继承父亲摩诃末二世的地位。他在加兹尼重新集结军队，于1221年在帕尔万击败一支蒙古军。成吉思汗随后追至印度河。札兰丁虽然战败，却骑马渡河脱身，部分部队也抵达了对岸。他仍以花剌子模沙的身份行动，但军队和权力中心已经离开原来的都城。"
title = "札兰丁·明布尔努"
lang = "zh-CN"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["蒙古军瓦解花剌子模帝国之际，札兰丁继承父亲摩诃末二世的地位。他在加兹尼重新集结军队，于1221年在帕尔万击败一支蒙古军。成吉思汗随后追至印度河。札兰丁虽然战败，却骑马渡河脱身，部分部队也抵达了对岸。他仍以花剌子模沙的身份行动，但军队和权力中心已经离开原来的都城。"]
sections = [{ title = "蒙古入侵下的求生之路", paragraphs = ["帕尔万的胜利发生在花剌子模政权已经遭受重创的时期。札兰丁在加兹尼召集的力量来自不同群体，能够在一场会战中挫败追兵，却无力消除蒙古军持续施加的压力。印度河一役结束后，他在河的另一边重新组织部众，与当地统治者交涉，也为争夺立足之地而交战。关于他在这段时期的行动，纳萨维和志费尼等作者留下的叙述各有侧重，印度河之战的确切日期也存在分歧。后来札兰丁返回西方，在伊朗和阿塞拜疆的部分地区重新建立统治。他的活动范围由中亚和阿富汗扩展到高加索与安纳托利亚边境，夺取第比利斯并围攻阿赫拉特。与邻近政权的战争最终使他面对来自安纳托利亚和美索不达米亚北部的联军，1230年在亚瑟切门战败。新一轮蒙古进攻又迫使他向西撤退，翌年他遭杀害，死因及当时的具体情形仍不完全清楚。他的书记官纳萨维为他撰写传记，是了解这位苏丹的重要材料。书中的宫廷经历和随军活动提供了丰富的记述，也反映作者与统治者的关系。更晚的波斯文编年史和插图手稿反复呈现印度河边的逃生，各个抄本所绘人物与河岸的布局并不相同。有的图像将重点放在骑马入水的苏丹，有的则描写他已经登岸后与追兵隔河相望。这些后来的图像可以用来研究波斯史书怎样表现同一事件，也让人看到叙事和绘画如何将渡河保留为札兰丁一生中最常被提起的场景之一。读者可将宫廷书记官留下的文字与后代画师选取的场面分别考察，从中辨明当时经历与后世纪念所处的不同年代。"] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.ja]
text = "ジャラールッディーンはモンゴル軍がホラズム・シャー朝を切り崩すなかで、父ムハンマド2世の後を継いだ。ガズニに兵を集め、1221年にパルワーンでモンゴル軍の一隊を破った。チンギス・ハンにインダス川まで追われて戦いに敗れたが、馬で川を渡って逃れ、配下の一部も対岸にたどり着いた。"
title = "ジャラールッディーン・マンカブティー"
lang = "ja"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["ジャラールッディーンはモンゴル軍がホラズム・シャー朝を切り崩すなかで、父ムハンマド2世の後を継いだ。ガズニに兵を集め、1221年にパルワーンでモンゴル軍の一隊を破った。チンギス・ハンにインダス川まで追われて戦いに敗れたが、馬で川を渡って逃れ、配下の一部も対岸にたどり着いた。"]
sections = [{ title = "モンゴルの侵攻を生き延びる", paragraphs = ["パルワーンの勝利は、ホラズムの各地がすでにモンゴルの侵攻で大きな打撃を受けた時期のことだった。ガズニに集まった軍にはさまざまな出身の兵が加わっていた。会戦では敵を破ったものの、モンゴル軍による追撃は続いた。インダス川の対岸へ逃れたジャラールッディーンは、その後数年にわたり地域の支配者たちと交渉し、軍事行動も行った。川辺での戦闘が1221年のいつだったかについては、資料の読み方によって異なる見解がある。彼はやがて西へ戻り、イランとアゼルバイジャンの一部で支配を再建した。後の遠征ではトビリシを占領し、アフラートを包囲した。1230年、アナトリアと北メソポタミアの勢力が連合し、ヤッスチメンの戦いでジャラールッディーンを破った。その後再び進出したモンゴル軍に追われて西へ向かい、1231年に殺害された。最期の詳しい状況には不明な点が残る。彼に仕えた書記ナサウィーの伝記は、その生涯をたどるための主要な史料である。宮廷の内側から書かれた伝記に加え、後の時代に編まれたペルシア語の年代記やその挿絵にも渡河の場面が繰り返し現れる。水に飛び込む騎馬のスルタンを描く写本がある一方で、すでに対岸に立つ姿を中心に据えるものもある。同じ場面でチンギス・ハンとその軍をどこに配置するかも写本ごとに異なる。絵画が制作された時代と戦いが起きた時代を区別して読むと、一つの出来事が文献に記録され、後世にどのような形で記憶されたかを追うことができる。"] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.ko]
text = "잘랄 앗딘 망부르니는 몽골의 침공으로 호라즘 제국이 무너지는 가운데 아버지 무함마드 2세의 뒤를 이었다. 가즈니에서 군대를 모아 1221년 파르완에서 몽골군을 물리쳤다. 칭기즈 칸은 그를 인더스강까지 추격했다. 잘랄 앗딘은 강가의 전투에서 패했지만 말을 타고 강을 건넜고 휘하 병력 일부도 맞은편 기슭에 도달했다."
title = "잘랄 앗딘 망부르니"
lang = "ko"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["잘랄 앗딘 망부르니는 몽골의 침공으로 호라즘 제국이 무너지는 가운데 아버지 무함마드 2세의 뒤를 이었다. 가즈니에서 군대를 모아 1221년 파르완에서 몽골군을 물리쳤다. 칭기즈 칸은 그를 인더스강까지 추격했다. 잘랄 앗딘은 강가의 전투에서 패했지만 말을 타고 강을 건넜고 휘하 병력 일부도 맞은편 기슭에 도달했다."]
sections = [{ title = "몽골 침공에서 살아남다", paragraphs = ["파르완의 승리는 제국의 여러 지역이 이미 몽골군의 공격으로 큰 피해를 입은 뒤에 이루어졌다. 가즈니에 모인 군대에는 서로 다른 출신의 병력이 합류했다. 이 군대는 파르완에서 적을 격파했지만 몽골군의 추격은 계속되었다. 잘랄 앗딘은 인더스강을 건넌 뒤 몇 해 동안 주변 통치자들과 교섭하며 싸웠다. 강가 전투가 1221년의 정확히 어느 때에 일어났는지는 기록을 해석하는 방식에 따라 견해가 나뉜다. 그는 이후 서쪽으로 돌아가 이란과 아제르바이잔 일부에 지배권을 다시 세웠다. 이후의 원정에서 트빌리시를 점령하고 아흘라트를 포위했다. 아나톨리아와 북부 메소포타미아의 경쟁 세력은 연합하여 1230년 야스츠체멘에서 그의 군대를 무찔렀다. 새로 진격한 몽골군이 그를 다시 서쪽으로 몰아냈고, 그는 1231년에 살해되었다. 최후의 구체적인 경위는 확실하지 않다. 그의 서기관이었던 알나사위는 술탄의 삶을 전하는 주요 전기를 남겼다. 이 전기는 그와 가까운 곳에서 일한 사람이 남긴 기록이라는 점에서 중요하다. 후대의 페르시아어 연대기와 삽화 필사본에서도 인더스강 도하 장면은 되풀이된다. 어떤 그림은 말을 타고 물로 들어가는 모습을 강조하고, 다른 그림은 건너편에 도착한 술탄과 그를 지켜보는 칭기즈 칸을 서로 다른 쪽에 배치한다. 전투가 일어난 시기와 그림이 제작된 시기를 구분하면, 같은 사건이 글로 기록되고 훗날 어떤 장면으로 기억되었는지를 함께 살펴볼 수 있다."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.ar]
text = "خلف جلال الدين منكبرتي أباه محمدًا الثاني بينما كان الغزو المغولي يمزق الدولة الخوارزمية. جمع قواته في غزنة وهزم جيشًا مغوليًا في بروان سنة 1221. طارده جنكيز خان حتى نهر السند. خسر جلال الدين المعركة لكنه عبر النهر على صهوة جواده، ووصل قسم من جيشه إلى الضفة الأخرى أيضًا."
title = "جلال الدين منكبرتي"
lang = "ar"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["خلف جلال الدين منكبرتي أباه محمدًا الثاني بينما كان الغزو المغولي يمزق الدولة الخوارزمية. جمع قواته في غزنة وهزم جيشًا مغوليًا في بروان سنة 1221. طارده جنكيز خان حتى نهر السند. خسر جلال الدين المعركة لكنه عبر النهر على صهوة جواده، ووصل قسم من جيشه إلى الضفة الأخرى أيضًا."]
sections = [{ title = "النجاة من الغزو المغولي", paragraphs = ["حارب حكام المنطقة وفاوضهم خلال السنوات التالية. ثم عاد إلى الغرب وأعاد بسط سلطته في أجزاء من إيران وأذربيجان. وشملت حملاته اللاحقة الاستيلاء على تفليس وحصار أخلاط. هزمه خصومه من الأناضول وشمال بلاد الرافدين في ياسي تشمن سنة 1230. ودفعه هجوم مغولي جديد غربًا من جديد، فقُتل سنة 1231. ولا يزال التاريخ الدقيق لمعركة السند وظروف مقتله غير مؤكدة. وضع النسوي، الذي خدم كاتبًا له، إحدى أهم السير عن حياة السلطان. وعادت المخطوطات الفارسية المصورة اللاحقة إلى مشهد عبور النهر، فتقدم صورها شاهدًا على الكيفية التي حفظت بها الأجيال التالية ذكرى الواقعة."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.ru]
text = "Джалал ад-Дин Мангуберди сменил своего отца Мухаммеда II, когда монголы разрушали государство Хорезмшахов. Он собрал войска в Газни и в 1221 году разбил монгольскую армию при Парване. Чингисхан преследовал его до Инда. Джалал ад-Дин проиграл битву, но переправился через реку верхом. Часть его войска также достигла другого берега."
title = "Джалал ад-Дин Мангуберди"
lang = "ru"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Джалал ад-Дин Мангуберди сменил своего отца Мухаммеда II, когда монголы разрушали государство Хорезмшахов. Он собрал войска в Газни и в 1221 году разбил монгольскую армию при Парване. Чингисхан преследовал его до Инда. Джалал ад-Дин проиграл битву, но переправился через реку верхом. Часть его войска также достигла другого берега."]
sections = [{ title = "Уцелеть при монгольском вторжении", paragraphs = ["В следующие годы он воевал и вёл переговоры с местными правителями. Затем он вернулся на запад и восстановил власть в некоторых частях Ирана и Азербайджана. Среди его поздних походов были взятие Тбилиси и осада Ахлата. В 1230 году противники из Анатолии и Северной Месопотамии разбили его при Яссычемене. Новое наступление монголов вынудило его снова отойти на запад, и в 1231 году он был убит. Точная дата битвы на Инде и обстоятельства гибели султана остаются спорными. Его секретарь ан-Насави написал одно из основных жизнеописаний правителя. В поздних персидских рукописях переправа стала сюжетом миниатюр, показывающих, как этот эпизод запомнился следующим поколениям."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.vi]
text = "Jalal al-Din Mangburni kế vị cha mình là Muhammad II khi quân Mông Cổ đang đánh tan Đế quốc Khwarezm. Ông tập hợp binh lính ở Ghazni và đánh bại một đạo quân Mông Cổ tại Parwan năm 1221. Thành Cát Tư Hãn truy đuổi ông tới sông Ấn. Jalal al-Din thua trận, nhưng cưỡi ngựa qua sông và một phần binh lực của ông cũng tới được bờ bên kia."
title = "Jalal al-Din Mangburni"
lang = "vi"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni kế vị cha mình là Muhammad II khi quân Mông Cổ đang đánh tan Đế quốc Khwarezm. Ông tập hợp binh lính ở Ghazni và đánh bại một đạo quân Mông Cổ tại Parwan năm 1221. Thành Cát Tư Hãn truy đuổi ông tới sông Ấn. Jalal al-Din thua trận, nhưng cưỡi ngựa qua sông và một phần binh lực của ông cũng tới được bờ bên kia."]
sections = [{ title = "Sống sót qua cuộc xâm lược Mông Cổ", paragraphs = ["Trong vài năm tiếp theo, ông giao chiến và thương lượng với các nhà cai trị trong vùng. Sau đó ông trở về phía tây và tái lập quyền lực tại một số vùng của Iran và Azerbaijan. Những chiến dịch sau này gồm việc chiếm Tbilisi và vây Ahlat. Các đối thủ ở Anatolia và bắc Lưỡng Hà đánh bại ông tại Yassıçemen năm 1230. Một cuộc tấn công mới của quân Mông Cổ buộc ông lại lùi về phía tây, và ông bị giết năm 1231. Ngày chính xác của trận sông Ấn và hoàn cảnh cái chết của ông vẫn chưa rõ. Al-Nasawi, thư ký của ông, viết một trong những tác phẩm chính về cuộc đời vị sultan. Những bản thảo Ba Tư minh họa về sau thường vẽ cảnh vượt sông, cho thấy các thế hệ sau ghi nhớ sự kiện ấy ra sao."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.id]
text = "Jalal al-Din Mangburni menggantikan ayahnya, Muhammad II, ketika serbuan Mongol memecah Kekaisaran Khwarazm. Ia menghimpun pasukan di Ghazni dan mengalahkan tentara Mongol di Parwan pada 1221. Jenghis Khan mengejarnya hingga Sungai Indus. Jalal al-Din kalah dalam pertempuran itu, tetapi lolos dengan menyeberangi sungai dengan kuda. Sebagian pasukannya juga mencapai seberang."
title = "Jalal al-Din Mangburni"
lang = "id"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni menggantikan ayahnya, Muhammad II, ketika serbuan Mongol memecah Kekaisaran Khwarazm. Ia menghimpun pasukan di Ghazni dan mengalahkan tentara Mongol di Parwan pada 1221. Jenghis Khan mengejarnya hingga Sungai Indus. Jalal al-Din kalah dalam pertempuran itu, tetapi lolos dengan menyeberangi sungai dengan kuda. Sebagian pasukannya juga mencapai seberang."]
sections = [{ title = "Bertahan dari invasi Mongol", paragraphs = ["Selama beberapa tahun berikutnya ia bertempur dan berunding dengan penguasa setempat. Setelah itu ia kembali ke barat dan menegakkan kembali kekuasaannya di sejumlah wilayah Iran dan Azerbaijan. Kampanyenya kemudian mencakup perebutan Tbilisi dan pengepungan Ahlat. Para pesaing dari Anatolia dan Mesopotamia utara mengalahkannya di Yassıçemen pada 1230. Serbuan baru Mongol memaksanya mundur lagi ke barat dan ia terbunuh pada 1231. Tanggal persis pertempuran di Indus dan keadaan yang melingkupi kematiannya masih belum pasti. Al-Nasawi, sekretarisnya, menulis salah satu biografi utama sang sultan. Naskah bergambar Persia dari masa berikutnya mengangkat kembali adegan penyeberangan sungai dan memperlihatkan cara peristiwa itu dikenang."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.fil]
text = "Hinalinhan ni Jalal al-Din Mangburni ang ama niyang si Muhammad II habang winawasak ng mga Mongol ang Imperyong Khwarazmian. Nagtipon siya ng hukbo sa Ghazni at tinalo ang isang hukbong Mongol sa Parwan noong 1221. Hinabol siya ni Genghis Khan hanggang sa Ilog Indus. Natalo si Jalal al-Din ngunit nakatawid sa ilog sakay ng kabayo. Nakarating din sa kabilang pampang ang ilang tauhan niya."
title = "Jalal al-Din Mangburni"
lang = "fil"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Hinalinhan ni Jalal al-Din Mangburni ang ama niyang si Muhammad II habang winawasak ng mga Mongol ang Imperyong Khwarazmian. Nagtipon siya ng hukbo sa Ghazni at tinalo ang isang hukbong Mongol sa Parwan noong 1221. Hinabol siya ni Genghis Khan hanggang sa Ilog Indus. Natalo si Jalal al-Din ngunit nakatawid sa ilog sakay ng kabayo. Nakarating din sa kabilang pampang ang ilang tauhan niya."]
sections = [{ title = "Pagligtas mula sa pananalakay ng mga Mongol", paragraphs = ["Sa mga sumunod na taon, nakipagdigma at nakipagkasundo siya sa mga pinuno sa rehiyon. Nagbalik siya sa kanluran at muling nagtatag ng pamumuno sa ilang bahagi ng Iran at Azerbaijan. Kabilang sa mga sumunod niyang kampanya ang pagsakop sa Tbilisi at pagkubkob sa Ahlat. Tinalo siya ng mga karibal mula sa Anatolia at hilagang Mesopotamia sa Yassıçemen noong 1230. Itinulak siya muli sa kanluran ng panibagong pagsalakay ng mga Mongol at napatay siya noong 1231. Tinataya lamang ang eksaktong petsa ng labanan sa Indus at malabo ang mga pangyayari sa pagkamatay niya. Sumulat ang kalihim niyang si al-Nasawi ng isa sa mga pangunahing salaysay ng buhay ng sultan. Ang mga larawang ginawa sa mga manuskritong Persyano kalaunan ay nagpapakita kung paano naalala ang pagtawid."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]

[articles.pt-BR]
text = "Jalal al-Din Mangburni sucedeu seu pai, Muhammad II, quando a invasão mongol desmembrava o Império Corásmio. Reuniu tropas em Ghazni e derrotou um exército mongol em Parwan em 1221. Gêngis Khan o perseguiu até o rio Indo. Jalal al-Din perdeu a batalha, mas atravessou o rio a cavalo e parte de seu exército também chegou à outra margem."
title = "Jalal al-Din Mangburni"
lang = "pt-BR"
url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/"
shortArticle = true
intro = ["Jalal al-Din Mangburni sucedeu seu pai, Muhammad II, quando a invasão mongol desmembrava o Império Corásmio. Reuniu tropas em Ghazni e derrotou um exército mongol em Parwan em 1221. Gêngis Khan o perseguiu até o rio Indo. Jalal al-Din perdeu a batalha, mas atravessou o rio a cavalo e parte de seu exército também chegou à outra margem."]
sections = [{ title = "Sobreviver à invasão mongol", paragraphs = ["Nos anos seguintes, combateu e negociou com governantes da região. Depois voltou ao oeste e restabeleceu sua autoridade em partes do Irã e do Azerbaijão. Suas campanhas posteriores incluíram a tomada de Tbilisi e o cerco a Ahlat. Rivais da Anatólia e do norte da Mesopotâmia o derrotaram em Yassıçemen em 1230. Uma nova ofensiva mongol o empurrou outra vez para o oeste e ele foi morto em 1231. A data exata da batalha do Indo e as circunstâncias de sua morte são incertas. Al-Nasawi, que foi seu secretário, escreveu uma das principais biografias do sultão. Manuscritos persas ilustrados posteriores retomaram a travessia do rio e mostram como o episódio foi lembrado."] }]
sources = [{ title = "C. E. Bosworth, Jalal-al-Din Khwarazmshah Mengübirni, Encyclopaedia Iranica", url = "https://www.iranicaonline.org/articles/jalal-al-din-kvarazmsahi-mengbirni/" }, { title = "Shihab al-Din al-Nasawi, Sirat al-Sultan Jalal al-Din Mankubirti, Arabic Collections Online", url = "https://sites.dlib.nyu.edu/viewer/books/aub_aco003144/display?lang=en" }, { title = "Charles Melville, The Illustration of History in Persian Manuscripts, Iran Namag", url = "https://www.irannamag.com/wp-content/uploads/2023/01/9e-6.3-4IranNamag-Melville.pdf" }]
