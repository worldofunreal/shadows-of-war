[articles.en]
text = "Naram Sin, a grandson of Sargon, ruled the Akkadian Empire in the third millennium BCE. His victory stele commemorates a campaign against the Lullubi in the Zagros Mountains. The relief shows the king and his soldiers climbing the slope. Naram Sin towers over the other figures and wears a horned helmet associated with divinity."
title = "Naram Sin"
lang = "en"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram Sin, a grandson of Sargon, ruled the Akkadian Empire in the third millennium BCE. His victory stele commemorates a campaign against the Lullubi in the Zagros Mountains. The relief shows the king and his soldiers climbing the slope. Naram Sin towers over the other figures and wears a horned helmet associated with divinity."]
sections = [{ title = "The king on the mountain", paragraphs = ["The royal inscription from Bassetki says that Naram Sin won nine battles in a single year during a widespread revolt. It also says the people of Akkad petitioned for him to become the god of their city and built him a temple. The stele and the inscription present the court’s account of his victories and authority, so their claims need to be read in that setting. An Elamite inscription added to the stele many centuries later records its removal from Sippar to Susa as spoils by Shutruk-Nahhunte. The monument was found at Susa in 1898. The exact site of Akkad remains uncertain, and the absolute dates assigned to Naram Sin’s reign vary with the chronology used."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.es]
text = "Naram Sin, nieto de Sargón, gobernó el Imperio acadio en el tercer milenio a. C. Su estela de victoria conmemora una campaña contra los lullubi en los montes Zagros. En el relieve, el rey y sus soldados ascienden por la ladera. Naram Sin aparece más grande que las demás figuras y lleva un casco con cuernos asociado con la divinidad."
title = "Naram Sin"
lang = "es"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram Sin, nieto de Sargón, gobernó el Imperio acadio en el tercer milenio a. C. Su estela de victoria conmemora una campaña contra los lullubi en los montes Zagros. En el relieve, el rey y sus soldados ascienden por la ladera. Naram Sin aparece más grande que las demás figuras y lleva un casco con cuernos asociado con la divinidad."]
sections = [{ title = "El rey en la montaña", paragraphs = ["La inscripción real de Bassetki atribuye a Naram Sin nueve victorias en un solo año durante una rebelión generalizada. También cuenta que los habitantes de Acad pidieron que se lo reconociera como dios de su ciudad y le construyeron un templo. La estela y la inscripción presentan la versión de la corte sobre las victorias y la autoridad del rey. Muchos siglos después, el gobernante elamita Shutruk-Nahhunte se llevó la estela de Sippar a Susa como botín y dejó constancia de ello en una inscripción añadida. El monumento fue hallado en Susa en 1898. La ubicación exacta de Acad sigue siendo incierta y las fechas absolutas del reinado varían según la cronología empleada."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.fr]
text = "Naram-Sin, petit-fils de Sargon, régna sur l’empire d’Akkad au troisième millénaire av. J.-C. Sa stèle de victoire commémore une campagne contre les Lullubi dans les monts Zagros. Le relief montre le roi et ses soldats gravissant la pente. Naram-Sin domine les autres personnages par sa taille et porte un casque à cornes associé à la divinité."
title = "Naram-Sin"
lang = "fr"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram-Sin, petit-fils de Sargon, régna sur l’empire d’Akkad au troisième millénaire av. J.-C. Sa stèle de victoire commémore une campagne contre les Lullubi dans les monts Zagros. Le relief montre le roi et ses soldats gravissant la pente. Naram-Sin domine les autres personnages par sa taille et porte un casque à cornes associé à la divinité."]
sections = [{ title = "Le roi sur la montagne", paragraphs = ["L’inscription royale de Bassetki attribue à Naram-Sin neuf victoires en une seule année, lors d’une vaste révolte. Elle rapporte aussi que les habitants d’Akkad demandèrent qu’il devienne le dieu de leur ville et lui construisirent un temple. Les deux monuments présentent le point de vue de la cour sur ses victoires et son autorité. Bien des siècles plus tard, une inscription élamite ajoutée à la stèle consigna son transfert de Sippar à Suse comme butin par Shutruk-Nahhunte. Le monument fut retrouvé à Suse en 1898. L’emplacement exact d’Akkad reste incertain et les dates absolues du règne varient selon la chronologie retenue."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.de]
text = "Naram-Sin war ein Enkel Sargons und herrschte im dritten Jahrtausend v. Chr. über das Akkadische Reich. Seine Siegesstele erinnert an einen Feldzug gegen die Lullubi im Zagrosgebirge. Das Relief zeigt den König und seine Soldaten beim Aufstieg. Naram-Sin überragt die anderen Figuren und trägt einen gehörnten Helm als Zeichen göttlicher Würde."
title = "Naram-Sin"
lang = "de"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram-Sin war ein Enkel Sargons und herrschte im dritten Jahrtausend v. Chr. über das Akkadische Reich. Seine Siegesstele erinnert an einen Feldzug gegen die Lullubi im Zagrosgebirge. Das Relief zeigt den König und seine Soldaten beim Aufstieg. Naram-Sin überragt die anderen Figuren und trägt einen gehörnten Helm als Zeichen göttlicher Würde."]
sections = [{ title = "Der König auf dem Berg", paragraphs = ["Die Königsinschrift von Bassetki schreibt Naram-Sin während eines weitreichenden Aufstands neun Siege in einem einzigen Jahr zu. Sie berichtet außerdem, dass die Einwohner Akkads ihn zum Gott ihrer Stadt machen lassen wollten und ihm einen Tempel bauten. Beide Denkmäler vermitteln die Sicht des Hofes auf die Siege und den Rang des Königs. Viele Jahrhunderte später vermerkte eine elamische Inschrift auf der Stele, dass Shutruk-Nahhunte sie als Beute von Sippar nach Susa gebracht hatte. Dort fand man das Denkmal 1898. Die genaue Lage Akkads ist weiterhin ungeklärt, und die absoluten Regierungsdaten hängen von der verwendeten Chronologie ab."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.it]
text = "Naram-Sin, nipote di Sargon, governò l’Impero accadico nel terzo millennio a.C. La sua stele della vittoria ricorda una campagna contro i Lullubi sui monti Zagros. Nel rilievo il re e i suoi soldati risalgono il pendio. Naram-Sin sovrasta le altre figure e indossa un elmo con corna, associato alla divinità."
title = "Naram-Sin"
lang = "it"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram-Sin, nipote di Sargon, governò l’Impero accadico nel terzo millennio a.C. La sua stele della vittoria ricorda una campagna contro i Lullubi sui monti Zagros. Nel rilievo il re e i suoi soldati risalgono il pendio. Naram-Sin sovrasta le altre figure e indossa un elmo con corna, associato alla divinità."]
sections = [{ title = "Il re sulla montagna", paragraphs = ["L’iscrizione reale di Bassetki gli attribuisce nove vittorie in un solo anno durante una vasta rivolta. Racconta anche che gli abitanti di Akkad chiesero di farne il dio della loro città e gli costruirono un tempio. Entrambi i monumenti trasmettono la prospettiva della corte sulle vittorie e sull’autorità del sovrano. Molti secoli dopo, un’iscrizione elamita aggiunta alla stele documentò il suo trasferimento da Sippar a Susa come bottino per opera di Shutruk-Nahhunte. Il monumento fu ritrovato a Susa nel 1898. La posizione esatta di Akkad resta incerta e le date assolute del regno cambiano secondo la cronologia adottata."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.tr]
text = "Sargon’un torunu Naram-Sin, MÖ üçüncü binyılda Akad İmparatorluğu’nu yönetti. Zafer steli, Zagros Dağları’nda Lullubilere karşı düzenlenen bir seferi anımsatır. Kabartmada kral ve askerleri yamacı tırmanır. Naram-Sin diğer figürlerden daha büyük gösterilir ve tanrısallıkla ilişkilendirilen boynuzlu bir miğfer takar."
title = "Naram-Sin"
lang = "tr"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Sargon’un torunu Naram-Sin, MÖ üçüncü binyılda Akad İmparatorluğu’nu yönetti. Zafer steli, Zagros Dağları’nda Lullubilere karşı düzenlenen bir seferi anımsatır. Kabartmada kral ve askerleri yamacı tırmanır. Naram-Sin diğer figürlerden daha büyük gösterilir ve tanrısallıkla ilişkilendirilen boynuzlu bir miğfer takar."]
sections = [{ title = "Dağdaki kral", paragraphs = ["Bassetki’de bulunan kraliyet yazıtı, büyük bir isyan sırasında Naram-Sin’in tek bir yılda dokuz savaş kazandığını söyler. Akad halkının onu kentlerinin tanrısı yapmak için başvurduğunu ve onun adına bir tapınak yaptırdığını da anlatır. Her iki anıt da kralın zaferlerini ve otoritesini sarayın bakış açısından aktarır. Yüzyıllar sonra eklenen Elamca yazıt, Shutruk-Nahhunte’nin steli ganimet olarak Sippar’dan Susa’ya götürdüğünü kayda geçirir. Anıt 1898’de Susa’da bulundu. Akad kentinin tam konumu belirsizdir ve Naram-Sin’in saltanatına verilen tarihler kullanılan kronolojiye göre değişir."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.zh-CN]
text = "纳拉姆辛是萨尔贡的孙子，在公元前第三千纪统治阿卡德帝国。他的胜利石碑纪念了在扎格罗斯山脉对卢卢比人的征战。浮雕上的国王和士兵沿着山坡向上行进。国王的身形远大于其他人物，头戴带角的头盔，显示了与神性相关的身份。"
title = "纳拉姆辛"
lang = "zh-CN"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["纳拉姆辛是萨尔贡的孙子，在公元前第三千纪统治阿卡德帝国。他的胜利石碑纪念了在扎格罗斯山脉对卢卢比人的征战。浮雕上的国王和士兵沿着山坡向上行进。国王的身形远大于其他人物，头戴带角的头盔，显示了与神性相关的身份。"]
sections = [{ title = "山上的国王", paragraphs = ["石碑把山地本身纳入了胜利场面。阿卡德军队向上行进，敌人或倒地，或举手面对逼近的国王。大小和位置的安排让观看者首先注意到统帅。上方的星形符号与带角的头盔共同构成了关于王权的图像表达。石刻上的阿卡德语文字已经残缺，仍可辨识出与卢卢比人有关的内容。巴塞特基出土的一件铜像残件保存着另一份王室铭文。铭文称，大范围的叛乱爆发后，纳拉姆辛在一年之内赢得九场战斗。它还称，阿卡德的居民向诸神请求让国王成为城里的神，并为他建造神庙。这两件文物分别以图像和文字强调统治者的胜利与地位。铭文中九场战斗的数字及居民请愿的经过，是阿卡德宫廷为当时的权力关系留下的说法。后世书写纳拉姆辛时又形成了自己的叙事，研究者需要区分这些不同时期的材料。胜利石碑原在西帕尔。许多世纪以后，埃兰统治者舒特鲁克纳洪特把它作为战利品带到苏萨，并在石碑的山峰旁刻下自己的铭文。新刻的文字与更早的浮雕并存，使石碑同时留下两段历史。一段是阿卡德国王对山地征战的纪念，另一段是埃兰统治者对取得这件古物的记录。1898年，考古人员在苏萨发现石碑。今天保存于卢浮宫的原件仍能看到阿卡德和埃兰两层文字，其中较晚的题记为追查石碑的流转提供了直接线索。纳拉姆辛的在位年代会随采用的美索不达米亚年表而变化，阿卡德城的准确位置也没有定论。石碑的出土地可以确定，而它原先所处的城市与后来的收藏地点则要通过铭文来辨别。把巴塞特基铭文与胜利石碑并读，可以看到阿卡德国王如何用不同材质的纪念物向不同地点的观众展示权威。"] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ja]
text = "サルゴンの孫ナラム・シンは、紀元前第三千年紀にアッカド帝国を治めた。ザグロス山地のルルビに対する遠征を記念した勝利の石碑が残る。浮彫には、兵士たちとともに斜面を登る王が描かれている。王はほかの人物よりも大きく、神性を表す角の付いた兜を着けている。"
title = "ナラム・シン"
lang = "ja"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["サルゴンの孫ナラム・シンは、紀元前第三千年紀にアッカド帝国を治めた。ザグロス山地のルルビに対する遠征を記念した勝利の石碑が残る。浮彫には、兵士たちとともに斜面を登る王が描かれている。王はほかの人物よりも大きく、神性を表す角の付いた兜を着けている。"]
sections = [{ title = "山の上の王", paragraphs = ["石碑の浮彫では、山道が画面の構成に組み込まれている。アッカドの軍勢が斜面を登り、敵がその前で倒れたり手を上げたりする。兵士たちよりも大きな王を見上げる構図が、遠征を率いた人物を際立たせている。もとのアッカド語の銘文は一部しか残っていないが、ルルビに対する勝利を記念したことが読み取れる。バセトキで見つかった像の台座にもナラム・シンの銘文がある。各地で反乱が起きた際、王は一年に九つの戦いで勝利したと記されている。さらに、アッカドの住民が王を都市の神にするよう神々に願い、王のために神殿を建てたと伝える。これらは王の勝利や地位を顕彰するために作られた記録であり、宮廷がどのような統治者の姿を伝えようとしたかを示す。戦いの数や市民の請願の経緯を読む際にも、その作成目的は重要である。後代の文学にもナラム・シンは登場するが、同時代の碑文と時を隔てて書かれた物語では成立の背景が違う。勝利の石碑はもとはシッパルにあった。何世紀も後、エラムの王シュトルク・ナフンテが戦利品としてスサへ運び、そこにエラム語の銘文を加えた。先の王の遠征と後の王による持ち去りが一つの石に刻まれたことになる。石碑は1898年にスサで発見され、現在ルーヴル美術館に収蔵されている。出土地から遠く離れたシッパルにあったことを知る手がかりは、この後から加えられた文字にある。アッカドの都市の正確な位置は依然として確定しておらず、ナラム・シンの在位の絶対年代は採用する年代表によって異なる。"] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ko]
text = "사르곤의 손자 나람신은 기원전 제3천년기에 아카드 제국을 다스렸다. 그의 승전비는 자그로스 산맥에서 룰루비를 상대로 벌인 원정을 기념한다. 부조에는 왕과 병사들이 비탈을 오르는 모습이 새겨져 있다. 왕은 다른 인물보다 크게 표현되며 신성을 나타내는 뿔 달린 투구를 썼다."
title = "나람신"
lang = "ko"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["사르곤의 손자 나람신은 기원전 제3천년기에 아카드 제국을 다스렸다. 그의 승전비는 자그로스 산맥에서 룰루비를 상대로 벌인 원정을 기념한다. 부조에는 왕과 병사들이 비탈을 오르는 모습이 새겨져 있다. 왕은 다른 인물보다 크게 표현되며 신성을 나타내는 뿔 달린 투구를 썼다."]
sections = [{ title = "산 위의 왕", paragraphs = ["승전비는 산을 전투가 벌어진 장소이자 인물들의 위치를 정하는 요소로 사용한다. 아카드군이 비탈을 올라가고 그 앞에는 쓰러지거나 손을 든 상대 병사들이 보인다. 위쪽을 향하는 행렬에서 가장 큰 인물인 왕이 눈에 띈다. 아카드어 명문은 일부만 남아 있지만 룰루비와 관련된 승리를 기린 것임을 알려 준다. 바세트키에서 나온 조각상 받침의 명문은 또 다른 왕실 기록이다. 명문은 여러 곳에서 반란이 일어났을 때 나람신이 한 해에 아홉 차례 싸워 이겼다고 전한다. 또한 아카드 주민들이 왕을 도시의 신으로 삼도록 신들에게 청하고 그를 위해 신전을 지었다고 적는다. 두 기념물은 왕실이 승리와 왕의 권위를 어떻게 나타냈는지 보여 준다. 전투 횟수와 주민들의 청원은 그 목적을 지닌 명문의 서술로 읽어야 한다. 후대의 문학에 등장하는 나람신 이야기 역시 그것이 쓰인 시대의 배경과 함께 살펴볼 수 있다. 승전비는 원래 시파르에 있었으나 여러 세기가 지난 뒤 엘람 왕 슈트루크나훈테가 전리품으로 수사에 가져갔다. 그는 그 사실을 기록하는 엘람어 명문을 비석에 더했다. 그 결과 같은 돌에 아카드 왕의 원정과 후대 엘람 왕의 전리품 획득이 함께 남았다. 1898년 수사에서 발굴된 비석은 현재 루브르 박물관에 있다. 수사에서 발견된 이 물건이 그보다 앞서 시파르에 있었다는 사실을 알려 주는 것은 뒤에 새겨진 글이다. 아카드 도시의 정확한 위치는 아직 확정되지 않았고, 나람신의 재위 연대도 어떤 메소포타미아 연대기를 적용하느냐에 따라 달라진다."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ar]
text = "حكم نارام سين، حفيد سرجون، الإمبراطورية الأكدية في الألف الثالث قبل الميلاد. وتخلّد مسلة نصره حملة ضد اللولوبيين في جبال زاغروس. يصوّر النقش البارز الملك وجنوده وهم يصعدون المنحدر، ويظهر نارام سين أكبر من بقية الأشخاص مرتديًا خوذة ذات قرون ترتبط بالألوهية."
title = "نارام سين"
lang = "ar"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["حكم نارام سين، حفيد سرجون، الإمبراطورية الأكدية في الألف الثالث قبل الميلاد. وتخلّد مسلة نصره حملة ضد اللولوبيين في جبال زاغروس. يصوّر النقش البارز الملك وجنوده وهم يصعدون المنحدر، ويظهر نارام سين أكبر من بقية الأشخاص مرتديًا خوذة ذات قرون ترتبط بالألوهية."]
sections = [{ title = "الملك على الجبل", paragraphs = ["ينسب النقش الملكي من باسيتكي إلى نارام سين الانتصار في تسع معارك خلال سنة واحدة إبان تمرد واسع. ويروي أيضًا أن أهل أكد طلبوا أن يصبح إله مدينتهم وبنوا له معبدًا. يعرض الأثران رواية البلاط عن انتصارات الملك وسلطته. وبعد قرون كثيرة أضيف إلى المسلة نقش عيلامي يسجل أن شوتروك ناهونته نقلها من سيبار إلى سوسة غنيمة حرب. وعُثر على المسلة في سوسة سنة 1898. ولا يزال موضع مدينة أكد بالضبط غير مؤكد، كما تختلف التواريخ المطلقة المنسوبة إلى عهد نارام سين باختلاف التسلسل الزمني المعتمد. وتكشف الإضافة العيلامية كيف اكتسب الأثر معنى جديدًا بعد انتقاله من المدينة التي كان قائمًا فيها."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.ru]
text = "Нарам-Суэн, внук Саргона, правил Аккадской державой в третьем тысячелетии до н. э. Его победная стела посвящена походу против луллубеев в горах Загроса. На рельефе царь и его воины поднимаются по склону. Нарам-Суэн выше остальных фигур и носит рогатый шлем, связанный с божественным статусом."
title = "Нарам-Суэн"
lang = "ru"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Нарам-Суэн, внук Саргона, правил Аккадской державой в третьем тысячелетии до н. э. Его победная стела посвящена походу против луллубеев в горах Загроса. На рельефе царь и его воины поднимаются по склону. Нарам-Суэн выше остальных фигур и носит рогатый шлем, связанный с божественным статусом."]
sections = [{ title = "Царь на горе", paragraphs = ["Царская надпись из Бассетки приписывает Нарам-Суэну девять побед за один год во время большого восстания. В ней также говорится, что жители Аккада просили сделать его богом своего города и построили ему храм. Оба памятника представляют придворный взгляд на победы и власть правителя. Эламская надпись, добавленная много столетий спустя, сообщает, что Шутрук-Наххунте увёз стелу из Сиппара в Сузы как трофей. В 1898 году памятник нашли в Сузах. Точное местоположение Аккада остаётся неизвестным, а даты правления меняются в зависимости от принятой хронологии."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.vi]
text = "Naram Sin, cháu nội của Sargon, cai trị Đế quốc Akkad trong thiên niên kỷ thứ ba TCN. Bia chiến thắng của ông kỷ niệm một chiến dịch chống người Lullubi ở dãy Zagros. Phù điêu khắc cảnh nhà vua và binh lính tiến lên sườn núi. Naram Sin cao lớn hơn các nhân vật khác và đội mũ có sừng, biểu tượng gắn với thần linh."
title = "Naram Sin"
lang = "vi"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram Sin, cháu nội của Sargon, cai trị Đế quốc Akkad trong thiên niên kỷ thứ ba TCN. Bia chiến thắng của ông kỷ niệm một chiến dịch chống người Lullubi ở dãy Zagros. Phù điêu khắc cảnh nhà vua và binh lính tiến lên sườn núi. Naram Sin cao lớn hơn các nhân vật khác và đội mũ có sừng, biểu tượng gắn với thần linh."]
sections = [{ title = "Nhà vua trên núi", paragraphs = ["Văn khắc hoàng gia tìm thấy tại Bassetki kể rằng Naram Sin thắng chín trận chỉ trong một năm khi đối mặt với cuộc nổi dậy rộng lớn. Văn khắc cũng nói người dân Akkad xin tôn ông làm vị thần của thành phố rồi xây đền thờ ông. Hai hiện vật cho thấy cách triều đình trình bày những chiến thắng và quyền lực của nhà vua. Nhiều thế kỷ sau, văn khắc Elam được bổ sung ghi rằng Shutruk-Nahhunte mang bia từ Sippar về Susa làm chiến lợi phẩm. Bia được tìm thấy tại Susa vào năm 1898. Vị trí chính xác của thành Akkad còn chưa rõ và niên đại trị vì tuyệt đối thay đổi theo hệ thống niên đại được sử dụng."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.id]
text = "Naram Sin, cucu Sargon, memerintah Kekaisaran Akkadia pada milenium ketiga SM. Prasasti kemenangannya mengenang kampanye melawan bangsa Lullubi di Pegunungan Zagros. Reliefnya menggambarkan raja dan para prajurit mendaki lereng. Naram Sin digambarkan lebih besar daripada tokoh lain dan memakai helm bertanduk yang dikaitkan dengan keilahian."
title = "Naram Sin"
lang = "id"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram Sin, cucu Sargon, memerintah Kekaisaran Akkadia pada milenium ketiga SM. Prasasti kemenangannya mengenang kampanye melawan bangsa Lullubi di Pegunungan Zagros. Reliefnya menggambarkan raja dan para prajurit mendaki lereng. Naram Sin digambarkan lebih besar daripada tokoh lain dan memakai helm bertanduk yang dikaitkan dengan keilahian."]
sections = [{ title = "Raja di atas gunung", paragraphs = ["Prasasti kerajaan dari Bassetki menyebut bahwa Naram Sin memenangkan sembilan pertempuran dalam satu tahun ketika menghadapi pemberontakan luas. Prasasti itu juga mengatakan bahwa penduduk Akkad memohon agar ia dijadikan dewa kota mereka dan mendirikan kuil untuknya. Kedua monumen menyampaikan pandangan istana tentang kemenangan dan kewenangan sang raja. Berabad-abad kemudian sebuah tulisan Elam ditambahkan pada prasasti kemenangan. Tulisan itu mencatat bahwa Shutruk-Nahhunte membawanya dari Sippar ke Susa sebagai rampasan. Monumen itu ditemukan di Susa pada 1898. Lokasi persis kota Akkad masih belum pasti dan tanggal pemerintahannya berbeda menurut kronologi yang digunakan."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.fil]
text = "Si Naram Sin, apo ni Sargon, ang namuno sa Imperyong Akkadian noong ikatlong milenyo BK. Ginugunita ng kanyang bantayog ng tagumpay ang kampanya laban sa mga Lullubi sa kabundukan ng Zagros. Makikita sa inukit na bato ang hari at mga kawal na umaakyat sa dalisdis. Mas malaki ang hari kaysa sa ibang tauhan at may suot siyang helmet na may mga sungay, isang sagisag na iniuugnay sa mga diyos."
title = "Naram Sin"
lang = "fil"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Si Naram Sin, apo ni Sargon, ang namuno sa Imperyong Akkadian noong ikatlong milenyo BK. Ginugunita ng kanyang bantayog ng tagumpay ang kampanya laban sa mga Lullubi sa kabundukan ng Zagros. Makikita sa inukit na bato ang hari at mga kawal na umaakyat sa dalisdis. Mas malaki ang hari kaysa sa ibang tauhan at may suot siyang helmet na may mga sungay, isang sagisag na iniuugnay sa mga diyos."]
sections = [{ title = "Ang hari sa bundok", paragraphs = ["Ayon sa inskripsiyon ng hari mula sa Bassetki, nanalo siya sa siyam na labanan sa loob ng isang taon habang lumalaganap ang isang pag-aalsa. Isinasalaysay din nito na hiniling ng mga taga-Akkad na gawin siyang diyos ng kanilang lungsod at ipinagtayo siya ng templo. Parehong ipinakikita ng mga bantayog ang pananaw ng korte sa mga tagumpay at kapangyarihan ng hari. Maraming siglo ang lumipas bago idinagdag ang inskripsiyong Elamita na nagsasabing kinuha ni Shutruk-Nahhunte ang bantayog mula sa Sippar at dinala ito sa Susa bilang samsam. Natagpuan ito sa Susa noong 1898. Malabo pa ang eksaktong kinaroroonan ng lungsod ng Akkad at nagkakaiba ang petsa ng paghahari ayon sa kronolohiyang ginagamit."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]

[articles.pt-BR]
text = "Naram-Sin, neto de Sargão, governou o Império Acádio no terceiro milênio a.C. Sua estela da vitória comemora uma campanha contra os lulubis nos montes Zagros. O relevo mostra o rei e seus soldados subindo a encosta. Naram-Sin aparece maior que as outras figuras e usa um elmo com chifres, associado à divindade."
title = "Naram-Sin"
lang = "pt-BR"
url = "https://collections.louvre.fr/ark:/53355/cl010123450"
shortArticle = true
intro = ["Naram-Sin, neto de Sargão, governou o Império Acádio no terceiro milênio a.C. Sua estela da vitória comemora uma campanha contra os lulubis nos montes Zagros. O relevo mostra o rei e seus soldados subindo a encosta. Naram-Sin aparece maior que as outras figuras e usa um elmo com chifres, associado à divindade."]
sections = [{ title = "O rei na montanha", paragraphs = ["A inscrição real de Bassetki atribui a Naram-Sin nove vitórias em um só ano durante uma grande revolta. Também relata que os habitantes de Acádia pediram que ele se tornasse o deus da cidade e construíram um templo para ele. Os dois monumentos apresentam a perspectiva da corte sobre as vitórias e a autoridade do rei. Muitos séculos depois, uma inscrição elamita acrescentada à estela registrou que Shutruk-Nahhunte a levou de Sipar a Susa como espólio. O monumento foi encontrado em Susa em 1898. O local exato da cidade de Acádia permanece incerto e as datas do reinado variam de acordo com a cronologia adotada."] }]
sources = [{ title = "Musée du Louvre, Stèle de Naram-Sin, SB 4", url = "https://collections.louvre.fr/ark:/53355/cl010123450" }, { title = "Cuneiform Digital Library Initiative, Bassetki statue inscription, RIME 2.01.04.10", url = "https://cdli.earth/inscriptions/2194716" }, { title = "Sallaberger and Schrakamp, Philological Data for a Historical Chronology of Mesopotamia", url = "https://www.assyriologie.uni-muenchen.de/personen/professoren/sallaberger/publ_sallaberger/wasa_schrakamp_2015_arcane1.pdf" }]
