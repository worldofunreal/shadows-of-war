[articles.en]
text = "Ragnar Lodbrok or Ragnar Lothbrok, according to legends, was a Viking hero and a Swedish and Danish king."
title = "Ragnar Lodbrok"
lang = "en"
url = "https://en.wikipedia.org/wiki/Ragnar_Lodbrok"
intro = [
  "Ragnar Lodbrok or Ragnar Lothbrok (Old Norse: Ragnar loðbrók, lit. 'Ragnar hairy-breeches'), according to legends, was a Viking hero and a Swedish and Danish king.",
  "He is known from Old Norse poetry of the Viking Age, Icelandic sagas, and near-contemporary chronicles. According to traditional literature, Ragnar distinguished himself by conducting many raids against the British Isles and the Carolingian Empire during the 9th century. He also appears in Norse legends, and according to the legendary sagas Tale of Ragnar's Sons and a Saga about Certain Ancient Kings, Ragnar Lodbrok's father has been given as the legendary king of the Swedes, Sigurd Ring.",
]
sections = [
  { "title" = "Accounts", "paragraphs" = [
      "According to the Tale of Ragnar Lodbrok, Tale of Ragnar's Sons, Heimskringla, Hervarar saga ok Heiðreks, Sögubrot af nokkrum fornkonungum, and many other Icelandic sources, Ragnar was the son of the king of Sweden Sigurd Ring. When Sigurd Ring's parentage is given in a saga, his father is identified as Randver, who in Hervarar saga is called a king of Denmark whose wife was Åsa, the daughter of King Harald of the Red Moustache from Norway. According to Sögubrot and the Lay of Hyndla, Randver was the son of Ráðbarðr the king of Garðaríki. The accounts further tell that Randver was a grandson of the legendary Scandinavian king Ivar Vidfamne by his daughter Aud (whom the Hervarar saga calls Alfhild). After the death of King Ivar Vidfamne, Aud's eldest son by the Danish king Hrœrekr Ringslinger, Harald, conquered all of his grandfather's territory and became known as Harald Wartooth. Harald's nephew Sigurd Ring became the chief king of Sweden after Randver's death (Denmark according to the Hervarar saga), presumably as the subking of Harald. Sigurd and Harald fought the Battle of the Brávellir (Bråvalla) on the plains of Östergötland, where Harald and many of his men died. Sigurd then ruled Sweden and Denmark (being sometimes identified with a Danish king Sigfred who ruled from about 770 until his death prior to 804). He sired a son with the princess Alfhild of the petty kingdom of Álfheimr, Ragnar Lodbrok, who succeeded him. Eysteinn Beli, who according to the Hervarar Saga was Harald Wartooth's son, ruled Sweden sometime after Sigurd until he was slain by the sons of Ragnar and Aslaug.",
      "In their accounts of his reign, the fornaldarsǫgur (Legendary sagas, or sagas of Scandinavian prehistory), tell more about Ragnar's marriages than about feats of warfare. In the Saga of Ragnar Lothbrok, Ragnar is introduced by introducing his alleged father Sigurd Ring who, according to the Saga, ruled over Denmark. In the Saga, Ragnar is Introduced as a big man, handsome and well-provided with wisdom. He was good to his men and cruel to his enemies. Ragnar's first account in the saga was to assemble an army, a fleet of ships, becoming a great warrior and slaying a dragon in the Norse lands of Götaland.",
      "According to the Sögubrot, \"he was the biggest and fairest of men that human eyes have seen, and he was like his mother in appearance and took after her kin\". He first killed a giant snake that guarded the abode of the Geatish jarl Herrauð's daughter Thora Borgarhjort, thereby winning her as his wife. The unusual protective clothes that Ragnar wore when attacking the serpent earned him the nickname Lodbrok. His sons with Thora were Erik and Agnar. After Thora died, he discovered Kráka, a woman of outstanding beauty and wisdom living with a poor peasant couple in Norway, and married her. This marriage resulted in the sons Ivar the Boneless, Björn Ironside, Hvitserk, Ragnvald, and Sigurd Snake-in-the-Eye. Kráka was later revealed to actually be Aslaug, a secret daughter of the renowned hero Sigurd Fafnesbane. As the sons grew up to become renowned warriors, Ragnar, not wishing to be outdone, resolved to conquer England with merely two ships. He was, however, defeated by superior Northumbrian forces and was thrown into a snake pit to die. The Saga of Ragnar Lodbrok, Tale of Ragnar's Sons, and Heimskringla all tell of the Great Heathen Army that invaded England at around 866, led by the sons of Ragnar Lodbrok to wreak revenge against King Ælla of Northumbria who is told to have captured and executed Ragnar.",
    ] },
  { "title" = "Mythical accounts of Ragnar", "paragraphs" = [
      "The 13th century Icelandic saga Saga of Ragnar Lothbrok (Old Norse: Ragnars saga loðbrókar) is one of the most detailed sources about Ragnar's life and exploits. It describes Ragnar's rise to fame, his marriages (including to the shieldmaiden Lagertha and the noblewoman Thora Borgarhjort), and his legendary deeds.",
      "The saga highlights Ragnar's divine connections, particularly his descent from Odin, framing him as a semi-mythical hero blessed with the qualities associated with the Allfather, such as wisdom, courage, and poetic speech. The first account of Ragnar in the saga is the tale of Ragnar killing a dragon, showing the close relation between Ragnar and legendary/magical deeds.",
      "When the Saga accounts Ragnar's death the story also tells \"So Ragnar was let down into a serpent-pit, and he sat there a long time while none of the snakes would bite him. And some people said, 'This is a great man; no weapons would bite him today, and now the serpents will not bite him.'\"",
    ] },
  { "title" = "Ragnar's sons", "paragraphs" = [
      "The Great Heathen Army is said to have been led by the sons of Ragnar Lodbrok, to wreak revenge against King Ælla of Northumbria who had previously executed Ragnar by casting him into a pit full of venomous snakes. Among the organizers were at least some of the brothers: Ivar the Boneless, Ubba, Halfdan, Björn Ironside, Hvitserk, and Sigurd Snake-in-the-Eye, all of whom are known as historical figures, save the slightly more dubious Hvitserk. Ivar the Boneless was the leader of the Great Heathen Army from 865 to 870, but he disappears from English historical accounts after 870. The Anglo-Saxon chronicler Æthelweard records Ivar's death as 870. Halfdan Ragnarsson became the leader of the Great Heathen Army in about 870 and he led it in an invasion of Wessex. A great number of Viking warriors arrived from Scandinavia, as part of the Great Summer Army, led by King Bagsecg of Denmark, bolstering the ranks of Halfdan's army.",
      "According to the Anglo-Saxon Chronicle, the Danes battled the West Saxons nine times, including the Battle of Ashdown on 8 January 871, where Bagsecg was killed. Halfdan accepted a truce from the future Alfred the Great, newly crowned king of Wessex. After Bagsecg's death, Halfdan was the only remaining king of the invading host. He may also have been a King of part of Denmark (Jutland?), since a co-ruler Halfdan is mentioned in Frankish sources in 873. According to late sagas Björn Ironside became King of Sweden and Uppsala, although this presents chronological inconsistencies. Björn had two sons, Erik and Refil Björnsson. His son Erik became the next king of Sweden, and was succeeded in turn by Erik Refilsson, the son of Refil. Sigurd Snake-in-the-Eye is perhaps the same person as Sigfred, brother of Halfdan, who was king in Denmark together with Halfdan in 873. According to the sagas Sigurd became King of Zealand, Skåne and the lesser Danish Isles. Sigfred-Sigurd possibly succeeded his brother Halfdan as King of entire Denmark in about 877, and may be the Viking king Sigfred who was killed in West Francia in 887.",
    ] },
]

[articles.ko]
text = "라그나르 로드브로크(고대 노르드어: Ragnarr Loðbrók→털반바지 라그나르)는 고대 노르드어 시가와 숱한 사가에 등장하는 바이킹 시대 전설적인 노르드인 지배자이자 영웅이다. 전설에 따르면, 라그나르는 덴마크와 스웨덴을 모두 자신의 영지로 삼았고, 프랑스와 잉글랜드를 공포에 떨게 한 재앙이었으며, 이바르 힌 베인라우시, 뵤른 야른시다, 할프단 라그나르손, 시구르드 오름이아우가, 우바 라그나르손의 아버지였다."
title = "라그나르 로드브로크"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EB%9D%BC%EA%B7%B8%EB%82%98%EB%A5%B4_%EB%A1%9C%EB%93%9C%EB%B8%8C%EB%A1%9C%ED%81%AC"
intro = [
  "라그나르 로드브로크(고대 노르드어: Ragnarr Loðbrók→털반바지 라그나르)는 고대 노르드어 시가와 숱한 사가에 등장하는 바이킹 시대 전설적인 노르드인 지배자이자 영웅이다. 전설에 따르면, 라그나르는 덴마크와 스웨덴을 모두 자신의 영지로 삼았고, 프랑스와 잉글랜드를 공포에 떨게 한 재앙이었으며, 이바르 힌 베인라우시, 뵤른 야른시다, 할프단 라그나르손, 시구르드 오름이아우가, 우바 라그나르손의 아버지였다. 이 라그나르의 아들들은 역사상 인물이지만, 라그나르 본인은 실존 인물이었는지 불확실하다.",
  "전설에 따르면, 라그나르는 세 번 결혼했다. 스캴드메르 라드게르타가 첫 번째, 귀족 여자 토라 보르가르효르트가 두 번째, 용살자 시구르드와 발키리 브륀힐드의 딸인 아슬라우그가 세 번째이다. 시구르드 흐링그의 아들이라고 한다. 라그나르는 왕이 되고서 수많은 정복과 약탈로 명성을 떨쳤는데 결국 숙적인 노섬브리아의 왕 엘라에게 잡혀 뱀굴에서 죽었다. 라그나르 아들들이 영국으로 쳐들어가 피튀기는 복수를 벌였는데, 그래서 일어난 게 바이킹의 이교도 대군세 원정이라고 한다.",
]
sections = [
  { "title" = "바이킹 사가", "paragraphs" = [
      "헤르보르와 헤이드레크의 사가에서는, 발다르가 죽었을 때 그 아들 란드베르가 스비아인의 왕이 되고, 하랄드 블라톤이 데인인의 왕이 되었다고 한다. 하랄드는 할아버지 이바르 인 비드파드미의 영토를 정복했다. 란드베르가 죽자 란드베르의 아들 시구르드 흐링그가 스비아인의 왕이 되었고, 아마 하랄드에게 복속된 속국왕이 된 것 같다. 시구르드 흐링그는 하랄드 블라톤과 동고틀란드의 브라벨리르 벌판에서 맞붙어 싸웠고, 이 싸움에서 하랄드가 죽고 데인인 군세가 궤멸되었다. 시구르드는 770년경에서 804년경 죽을 때까지 스비아인의 왕과 데인인의 왕을 겸했다. 그리고 시구르드의 아들 라그나르 로드브로크가 두 왕위를 모두 물려받았다. 하랄드 블라톤의 아들 에위스테인 벨리가 라그나르의 속국왕으로서 스웨덴을 다스리다가 나중에 라그나르의 아들들에게 죽임을 당했다.",
      "라그나르의 아들들의 사트르는 865년 이교도 대군세가 잉글랜드를 침공한 이야기를 다루고 있다. 이 군대를 이끈 것이 라그나르의 아들들이며, 침공 목적은 노섬브리아 왕 엘라가 라그나르를 붙잡아 죽인 것을 복수하기 위해서라고 한다.",
    ] },
  { "title" = "프랑크인 측 기록", "paragraphs" = [
      "845년 바이킹들이 센강을 거슬러 올라와 파리를 약탈한 파리 포위전은 바이킹의 서프랑크 왕국 침공 사건이었다. 이때 바이킹측 지휘관을 맡은 노르드인 족장은 라틴어 이름이 \"레긴헤루스(라틴어: Reginherus)\", 즉 라그나르라고 기록되어 있다. 대개 이 라그나르를 노르드 사가 속의 인물 라그나르 로드브로크와 에멜무지로 동일시하곤 하는데, 그런 동일시가 얼마나 정확한 것인지는 역사가들 사이에 논쟁의 대상이다.",
      "841년경 라그나르는 서프랑크인의 왕 카롤루스 2세 칼부스에게 프리지아 토르후트 땅을 봉읍으로 받았으나, 이후 왕의 총애를 잃으면서 땅도 잃었다. 그러자 라그나르의 바이킹들은 845년 센강을 거슬러 올라가며 루앙을 노략질했다. 파리 근교의 생드니 수도원까지 파괴되게 둘 수는 없다고 판단한 카롤루스 2세는 군세를 두 개로 나누어 각각 센 강의 양안에 배치했다. 라그나르는 2개의 프랑크인 군세 중 작은 쪽을 먼저 공격해 깨뜨리고, 포로로 잡은 프랑크인 111명을 센 강의 하중도에서 모조리 목을 매달았다. 이 집단 교수형은 노르드인의 신 오딘에게 제물을 바치는 것임과 동시에, 남은 프랑크인 병력에게 충격과 공포를 유발해 사기를 떨어뜨리기 위한 목적이기도 했다.",
      "9세기에 대규모 바이킹 함대가 단순 노략질이 브리튼섬으로 쳐들어온 것을 이교도 대군세라고 하는데, 이 군세를 이끈 것이 라그나르의 아들들이며 라그나르가 노섬브리아 왕 엘라에게 살해(865년경)당한 것을 복수하기 위해 쳐들어갔다고 한다. 이교도 대군세의 지휘관은 이바르 힌 베이늘라우시, 우바, 뵤른 야른시다, 흐비트세르크, 시구르드 오름 이 아우가 형제들이라고 하는데, 이 형제들은 아버지라고 지목되는 라그나르와 달리 역사적 실존인물임이 확실하다.",
    ] },
  { "title" = "역사성", "paragraphs" = [
      "이바르 힌 베이늘라우시나 할프단 라그나르손 같은 아들들은 실존인물이 확실한 것으로 여겨지지만, 그들의 아버지인 라그나르의 실존성에 관한 의견은 찬반이 양분되어 있다. 힐다 엘리스 데이비드슨은 1979년에 “최근 몇몇 학자들은 라그나르의 이야기가 적어도 부분적으로는 역사적 사실에 기반하고 있다고 인정하고 있다”고 썼다. 반면 캐서린 홀먼(Katherine Holman)은 2003년에 “비록 그 아들들은 실존인물이지만, 라그나르 본인은 그런 사람이 살았다는 증거조차 찾을 수 없으며, 여러 역사적 인물들과 문학적 창작이 뒤섞여 만들어진 아말감적 인물일 것”이라고 했다.",
      "이바르 힌 베이늘라우시, 뵤른 야른시다, 할프단 라그나르손, 흐비트세르크 라그나르손, 시구르드 오름 이 아우가, 우바 라그나르손 등 바이킹 군벌의 아버지이다. 이 아들들은 일단 실존인물임이 확실하다.",
      "데이비드슨은 삭소의 《데인인의 사적》 해제에서, 삭소가 《사적》 제9권에서 라그나르의 전설을 다룬 것은 라그나르라는 한 왕의 치세에 일어났다는 여러 혼란스럽고 상호모순되는 사건들에 관한 정보를 어떻게 하나로 정리해 보려고 시도했기 때문이라고 논한다. 그렇기 때문에 《사적》에서 라그나르가 행했다고 전해지는 많은 행위들이 다른 문헌들을 통해 역사성이 보다 확실한 다양한 인물들에게서 비롯된 것으로 지목해 볼 수 있다. 이런 \"역사적 라그나르\"들의 사례는 다음과 같다.",
    ] },
  { "title" = "대중 문화", "paragraphs" = [
      "2002년에 발매한 《미디블: 토탈워》의 확장팩 《바이킹 인베이젼》에서 8세기 후반과 9세기 초 사이를 군림하는 바이킹들의 첫 번째 왕에 라그나르가 포함되어있다.",
    ] },
]

[articles.ar]
text = "راغنار لوثبروك (باللغة النوردية القديمة: Ragnarr Loðbrók)، كان أحد أبطال الفايكنج وملكًا سويديًا ودنماركيًا. عرف واشتهر من خلال الشعر الإسكندنافي القديم ‏ لعصر الفايكنج والملاحم الأيسلندية والسجلات التاريخية القريبة."
title = "راغنار لوثبروك"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%B1%D8%A7%D8%BA%D9%86%D8%A7%D8%B1_%D9%84%D9%88%D8%AB%D8%A8%D8%B1%D9%88%D9%83"
intro = [
  "راغنار لوثبروك (باللغة النوردية القديمة: Ragnarr Loðbrók)، كان أحد أبطال الفايكنج وملكًا سويديًا ودنماركيًا. عرف واشتهر من خلال الشعر الإسكندنافي القديم ‏ لعصر الفايكنج والملاحم الأيسلندية والسجلات التاريخية القريبة. وفقًا للأدب التقليدي تميز راغنار بشن العديد من الغارات على الجزر البريطانية والإمبراطورية الكارولنجية خلال القرن التاسع.",
  "ذُكر راغنار في الأساطير الإسكندنافية، ووفقًا لملحمتي حكاية أبناء راغنار وملحمة عن بعض الملوك القدامى الأسطوريتين، مُنح والده لقب الملك الأسطوري للسويديين، سيغورد رينغ.",
  "بحسب الأدب النوردي القديم، فقد تزوج راغنار من الملكة الأسطورية آسلوغ، وكان لديه 6 أبناء هم: بيورن وسيغارد عين الأفعى وإيفار الكسيح وأوبا وفيسترك وهالفدان. وعلى الرغم من كون أبناء راغنر شخصيات تاريخية حقيقية، إلا أنه لا يوجد دليل على أن راغنر نفسه كان كذلك، ويبدو أنه شخصية خيالية جاءت من الأدب ونسب إليها العديد من الأحداث التاريخية.",
]
sections = [
  { "title" = "التقارير", "paragraphs" = [
      "وفقًا لحكاية راغنار لودبروك ‏ وحكاية أبناء راغنار وهيمسكرينغلا وملحمة هيرفار أوك هييركس ‏ وسوغوبروت والعديد من المصادر الأيسلندية الأخرى، كان راغنار نجل الملك الإسكندنافي سيغورد رينغ. تتفق جميع الملاحم تقريبًا على أن راندفر كان والد سيغورد، حيث تستشهد ملحمة هيرفار بزوجته آسا، ابنة الملك هارالد ذو الشارب الأحمر من النرويج. تخبر الروايات أيضًا أن راندفر كان حفيدًا للملك الإسكندنافي الأسطوري إيفار فيدفامن ‏ من ابنته أود .",
      "بعد وفاة الملك إيفار فيدفامن، غزا هارالد، الابن الأكبر لأود من الملك الدنماركي هريركر رينغسلينغر ‏، جميع أراضي جده وأصبح يُعرف باسم هارالد وارتوث ‏. أصبح سيغورد رينغ، ابن أخ هارالد، الملك الرئيس للسويد بعد وفاة راندفر، على الأرجح بسبب غرق هارالد. خاض سيغورد وهارالد معركة برافيلير ‏ في سهول أوسترغوتلاند، حيث مات هارالد والعديد من رجاله. ثم حكم سيغورد السويد والدنمارك . أنجب ولداً من الأميرة ألفهيلد من مملكة ألفهايمر الصغيرة، راغنار لودبروك، الذي خلفه. آيستين بيلي ‏، الذي وفقًا لـملحمة هيرفارار هو ابن هارالد وارتوث، حكم السويد في وقت ما بعد سيغورد حتى قُتل على يد أبناء راغنار و آسلوغ.",
      "تحكي ملاحم عصور ما قبل التاريخ الإسكندنافية المعروفة باسم فورنالدارسوغور في رواياتها عن فترة حكمه، عن زيجات راغنار أكثر من مآثر الحرب. بحسب السوغوبروت ، «كان أكبر وأجمل الرجال الذين رأتهم عيون الإنسان، وكان مثل والدته في المظهر ويتبع أقاربها». لقد قتل أولاً ثعبانًا عملاقًا كان يحرس منزل ثورا بورغارجورت ‏ ابنة جيتس يارل هيراو، وبالتالي كسبها زوجةً. أكسبت الملابس الواقية غير العادية التي كان يرتديها راغنار عند مهاجمة الثعبان لقب لودبروك. أبناؤه من ثورا هم إريك وأغنار. بعد وفاة ثورا، اكتشف كراكا، وهي امرأة ذات جمال وحكمة استثنائيين تعيش مع زوجين من الفلاحين الفقراء في النرويج، وتزوجها. نتج عن هذا الزواج الأبناء إيفار الكسيح، وبيورن الحديدي ، وهفيتسرك، هالفدان، وسيغارد عين الأفعى. كُشف لاحقًا عن أن كراكا هي آسلوغ، وهي ابنة سرية للبطل الشهير سيغورد. عندما كبر الأبناء ليصبحوا محاربين مشهورين، قرر راغنار، الذي لا يرغب في أن يتفوق عليه أحد، أن يغزو إنجلترا بسفينتين فقط. ومع ذلك، فقد هزِمته القوات الإنجليزية المتفوقة وأُلقي به في حفرة الثعبان ليموت من الألم. تحكي ملحمة راغنار لودبروك، وحكاية أبناء راغنار، وهيمسكرينجلا، عن الجيش الوثني العظيم الذي غزا إنجلترا حوالي عام 866، بقيادة أبناء راغنار لودبروك للانتقام من الملك إيلا ملك نورثمبريا الذي قيل إنه أسر وأعدم راغنار.",
    ] },
  { "title" = "أبناء راغنار", "paragraphs" = [
      "يقال إن الجيش الوثني العظيم كان بقيادة أبناء راغنار لودبروك، للانتقام من الملك إيلا ملك نورثمبريا الذي سبق أن أعدم راغنار بإلقائه في حفرة مليئة بالثعابين السامة. كان من بين المنظمين على الأقل بعض الإخوة: إيفار الكسيح، أوبا، هالفدان، بيورن أيرونسايد، هفيتسرك، وسيغورد عين الأفعى، وجميعهم معروفون كشخصيات تاريخية، باستثناء هفيتسيرك الأكثر إثارة للريبة. كان إيفار الكسيح قائدًا للجيش الوثني العظيم من عام 865 إلى عام 870، لكنه اختفى من السجلات التاريخية الإنجليزية بعد عام 870. يسجل المؤرخ الأنجلوسكسوني أثيلويرد وفاة إيفار عام 870 أصبح هالفدان راغنارسون قائدًا للجيش الوثني العظيم في حوالي عام 870 وقاده في غزو ويسيكس. وصل عدد كبير من محاربي الفايكنج من الدول الاسكندنافية، جزءً من جيش الصيف العظيم، بقيادة الملك باغسيك من الدنمارك، لتعزيز صفوف جيش هالفدان.",
      "وفقًا للوقائع الأنجلوسكسونية، اشتبك الدنماركيون مع الساكسونيين الغربيين تسع مرات، بما في ذلك معركة أشداون ‏ في 8 يناير 871، حيث قُتل باجسيك. قبل هالفدان هدنة من المستقبل ألفريد العظيم، ملك ويسيكس المتوج حديثًا. بعد وفاة باغسيك، كان هالفدان هو الملك الوحيد المتبقي من الجيش الغازي. ربما كان أيضًا ملكًا لجزء من الدنمارك ( يوتلاند ؟)، حيث ذُكر الحاكم المشارك هالفدان في المصادر الفرنجية عام 873. وفقًا للملاحم المتأخرة، أصبح بيورن أيرونسايد ملكًا للسويد وأوبسالا، على الرغم من أن هذا يمثل تناقضات زمنية. كان لبيورن ولدان، إريك وريفيل بيورنسون ‏. أصبح ابنه إريك هو الملك التالي للسويد، وخلفه بدوره إريك ريفيلسون ‏، ابن ريفيل. ربما سيغورد عين الأفعى هو نفس الشخص مثل سيجفريد، شقيق هالفدان، الذي كان ملك الدنمارك مع هالفدان عام 873. وفقًا للملاحم، أصبح سيغورد ملكًا لزيلاند وسكونا والجزر الدنماركية الأصغر. من المحتمل أن يكون سيغفريد سيغورد قد خلف شقيقه هالفدان ملكًا على الدنمارك بأكملها في حوالي عام 877، وربما يكون ملك الفايكنج سيغفريد الذي قُتل في غرب فرنسا عام 887",
    ] },
  { "title" = "المصادر والدقة التاريخية", "paragraphs" = [
      "بينما يُعدّ أبناء راغنار، مثل إيفار الكسيح، هالفدان راغنارسون، بيورن أيرونسايد، أوبا وسيغورد عين الأفعى، شخصيات تاريخية موثقة، تظلّ هوية والدهم راغنار لودبروك موضع نقاش وجدل. تُشير الأبحاث الأكاديمية المعاصرة إلى أنّ معظم القصص المتعلقة براغنار لودبروك خيالية، وذلك وفقا لهيلدا إليس ديفيدسون ‏، التي كتبت في عام 1979:لقد توصل بعض العلماء في السنوات الأخيرة إلى قبول جزء على الأقل من قصة راغنار على أنها مبنية على حقائق تاريخية.",
      "الكتاب التاسع من غستا دانوروم، وهو عمل من القرن الثاني عشر للمؤرخ الدنماركي المسيحي ساكسو غراماتيكوس.",
      "مقتل راغنار ‏، وهي قصيدة سكالدية ‏ لم يتبق منها سوى أجزاء، منسوبة إلى شاعر القرن التاسع براغي بوداسون ‏",
    ] },
  { "title" = "في الأدب والإعلام", "paragraphs" = [
      "رواية إدوين أثرستون ‏ عام 1830 : «ملوك البحر في إنجلترا» (الإنجليزية: Sea-Kings in England).",
      "«راغنار لو فايكنغ»، فيلم فكاهي من عام 1955 كتبه جان أوليفييه مع فن إدواردو تيكسيرا كويلهو ‏، والذي عُرض في مجلة فايلان الفرنسية حتى عام 1969",
      "تستكشف رواية ريتشارد باركر التاريخية «سيف غانيلون» عام 1957 شخصية راغنار وأبنائه وثقافة الإغارة على الفايكنج.",
    ] },
]

