intro = ["Lakshmibai, rani de Jhansi, se opôs à anexação de seu estado pela Companhia das Índias Orientais após a morte de Gangadhar Rao. A Companhia se recusou a reconhecer o filho adotivo do casal como sucessor. Durante a rebelião indiana de 1857–1858, Lakshmibai liderou a defesa de Jhansi contra as forças de Hugh Rose. Quando os britânicos tomaram Jhansi em 1858, ela escapou e se juntou a outras forças rebeldes em Kalpi, entre elas as ligadas a Tatya Tope. Continuou a lutar após a queda de Kalpi e morreu perto de Gwalior em junho de 1858."]
sections = [{ title = "De Jhansi a Kalpi", paragraphs = ["Os relatos da fuga e da morte diferem nos detalhes. A literatura posterior ajudou a formar a imagem da rainha guerreira. A passagem por Jhansi, Kalpi e Gwalior mostra que a perda de uma fortaleza não encerrou sua campanha. Reduto de Kalpi adapta esse reagrupamento. Quando um rival toma sua última cidade ativa, uma cidade de nível 1 pronta e gratuita surge no terreno válido mais próximo no próprio território, a até 24 casas. O terreno da nova cidade pisca e o efeito ocorre uma vez por partida."] }]
