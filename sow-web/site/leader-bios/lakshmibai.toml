[articles.en]
text = "Lakshmibai, the rani of Jhansi, opposed the East India Company's annexation of her state after the death of Gangadhar Rao. The Company declined to recognize their adopted son as the successor. During the Indian Rebellion of 1857–58, Lakshmibai directed the defense of Jhansi against Hugh Rose's forces. When the British took Jhansi in 1858, she escaped and joined other rebel forces at Kalpi, including those associated with Tatya Tope. She continued fighting after Kalpi fell and died near Gwalior in June 1858."
title = "Lakshmibai"
lang = "en"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, the rani of Jhansi, opposed the East India Company's annexation of her state after the death of Gangadhar Rao. The Company declined to recognize their adopted son as the successor. During the Indian Rebellion of 1857–58, Lakshmibai directed the defense of Jhansi against Hugh Rose's forces. When the British took Jhansi in 1858, she escaped and joined other rebel forces at Kalpi, including those associated with Tatya Tope. She continued fighting after Kalpi fell and died near Gwalior in June 1858."]
sections = [{ title = "From Jhansi to Kalpi", paragraphs = ["Accounts of the escape and of her death differ in detail, and later literature helped shape the image of the warrior queen. The movement from Jhansi to Kalpi and on to Gwalior nevertheless shows that the loss of a fortress did not end her campaign. Kalpi Redoubt adapts that regrouping to the game. When a rival takes her last active city, a free completed level 1 city appears on the nearest valid site in her remaining territory within 24 tiles. The new site flashes, and the effect can occur once per match. Founding a city stands in for establishing another military base."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.es]
text = "Lakshmibai, rani de Jhansi, se opuso a la anexión de su estado por la Compañía de las Indias Orientales tras la muerte de Gangadhar Rao. La Compañía se negó a reconocer a su hijo adoptivo como sucesor. Durante la rebelión india de 1857–1858, Lakshmibai dirigió la defensa de Jhansi contra las fuerzas de Hugh Rose. Cuando los británicos tomaron Jhansi en 1858, escapó y se reunió con otras fuerzas rebeldes en Kalpi, entre ellas las vinculadas a Tatya Tope. Siguió combatiendo tras la caída de Kalpi y murió cerca de Gwalior en junio de 1858."
title = "Lakshmibai"
lang = "es"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, rani de Jhansi, se opuso a la anexión de su estado por la Compañía de las Indias Orientales tras la muerte de Gangadhar Rao. La Compañía se negó a reconocer a su hijo adoptivo como sucesor. Durante la rebelión india de 1857–1858, Lakshmibai dirigió la defensa de Jhansi contra las fuerzas de Hugh Rose. Cuando los británicos tomaron Jhansi en 1858, escapó y se reunió con otras fuerzas rebeldes en Kalpi, entre ellas las vinculadas a Tatya Tope. Siguió combatiendo tras la caída de Kalpi y murió cerca de Gwalior en junio de 1858."]
sections = [{ title = "De Jhansi a Kalpi", paragraphs = ["Los relatos de la huida y de su muerte difieren en los detalles. La literatura posterior también dio forma a la imagen de la reina guerrera. El paso de Jhansi a Kalpi y luego a Gwalior muestra que perder una fortaleza no puso fin a su campaña. Reducto de Kalpi adapta ese reagrupamiento. Si un rival toma su última ciudad operativa, aparece una ciudad terminada de nivel 1 gratis en la casilla válida más cercana de su territorio, a 24 casillas o menos. La nueva casilla destella y el efecto ocurre una vez por partida."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.fr]
text = "Lakshmibai, rani de Jhansi, s’opposa à l’annexion de son État par la Compagnie des Indes orientales après la mort de Gangadhar Rao. La Compagnie refusa de reconnaître leur fils adoptif comme successeur. Pendant la révolte indienne de 1857–1858, elle dirigea la défense de Jhansi contre les forces de Hugh Rose. Lorsque les Britanniques prirent Jhansi en 1858, elle s’échappa et rejoignit à Kalpi d’autres forces insurgées, dont celles liées à Tatya Tope. Elle poursuivit le combat après la chute de Kalpi et mourut près de Gwalior en juin 1858."
title = "Lakshmibai"
lang = "fr"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, rani de Jhansi, s’opposa à l’annexion de son État par la Compagnie des Indes orientales après la mort de Gangadhar Rao. La Compagnie refusa de reconnaître leur fils adoptif comme successeur. Pendant la révolte indienne de 1857–1858, elle dirigea la défense de Jhansi contre les forces de Hugh Rose. Lorsque les Britanniques prirent Jhansi en 1858, elle s’échappa et rejoignit à Kalpi d’autres forces insurgées, dont celles liées à Tatya Tope. Elle poursuivit le combat après la chute de Kalpi et mourut près de Gwalior en juin 1858."]
sections = [{ title = "De Jhansi à Kalpi", paragraphs = ["Les récits de la fuite et de sa mort diffèrent dans le détail. La littérature ultérieure a contribué à façonner l’image de la reine guerrière. Le passage de Jhansi à Kalpi, puis à Gwalior, montre que la perte d’une forteresse ne mit pas fin à sa campagne. Redoute de Kalpi transpose ce regroupement. Lorsqu’un rival prend sa dernière ville active, une ville achevée de niveau 1 apparaît gratuitement sur le site valide le plus proche dans son territoire, à 24 cases ou moins. La parcelle s’illumine et l’effet se produit une fois par partie."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.de]
text = "Lakshmibai, die Rani von Jhansi, widersetzte sich nach dem Tod Gangadhar Raos der Annexion ihres Staates durch die Ostindien-Kompanie. Die Kompanie erkannte ihren Adoptivsohn nicht als Nachfolger an. Im indischen Aufstand von 1857–1858 leitete Lakshmibai die Verteidigung Jhansis gegen die Truppen von Hugh Rose. Als die Briten 1858 Jhansi einnahmen, entkam sie und schloss sich in Kalpi weiteren Aufständischen an, darunter Truppen um Tatya Tope. Sie kämpfte nach dem Fall Kalpis weiter und starb im Juni 1858 bei Gwalior."
title = "Lakshmibai"
lang = "de"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, die Rani von Jhansi, widersetzte sich nach dem Tod Gangadhar Raos der Annexion ihres Staates durch die Ostindien-Kompanie. Die Kompanie erkannte ihren Adoptivsohn nicht als Nachfolger an. Im indischen Aufstand von 1857–1858 leitete Lakshmibai die Verteidigung Jhansis gegen die Truppen von Hugh Rose. Als die Briten 1858 Jhansi einnahmen, entkam sie und schloss sich in Kalpi weiteren Aufständischen an, darunter Truppen um Tatya Tope. Sie kämpfte nach dem Fall Kalpis weiter und starb im Juni 1858 bei Gwalior."]
sections = [{ title = "Von Jhansi nach Kalpi", paragraphs = ["Die Berichte über die Flucht und ihren Tod unterscheiden sich in Einzelheiten. Spätere Literatur prägte das Bild der kämpfenden Königin. Der Weg von Jhansi über Kalpi nach Gwalior zeigt, dass der Verlust einer Festung ihren Feldzug nicht beendete. Schanze von Kalpi greift diese Neuaufstellung auf. Nimmt ein Rivale ihre letzte aktive Stadt ein, entsteht kostenlos eine fertige Stadt der Stufe 1 am nächsten gültigen Bauplatz im eigenen Gebiet, höchstens 24 Felder entfernt. Der Bauplatz leuchtet auf. Das geschieht einmal pro Partie."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.it]
text = "Lakshmibai, rani di Jhansi, si oppose all’annessione del suo Stato da parte della Compagnia delle Indie orientali dopo la morte di Gangadhar Rao. La Compagnia rifiutò di riconoscere il figlio adottivo come successore. Durante la rivolta indiana del 1857–1858, Lakshmibai guidò la difesa di Jhansi contro le forze di Hugh Rose. Quando i britannici presero Jhansi nel 1858, fuggì e si unì ad altre forze ribelli a Kalpi, tra cui quelle legate a Tatya Tope. Continuò a combattere dopo la caduta di Kalpi e morì nei pressi di Gwalior nel giugno 1858."
title = "Lakshmibai"
lang = "it"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, rani di Jhansi, si oppose all’annessione del suo Stato da parte della Compagnia delle Indie orientali dopo la morte di Gangadhar Rao. La Compagnia rifiutò di riconoscere il figlio adottivo come successore. Durante la rivolta indiana del 1857–1858, Lakshmibai guidò la difesa di Jhansi contro le forze di Hugh Rose. Quando i britannici presero Jhansi nel 1858, fuggì e si unì ad altre forze ribelli a Kalpi, tra cui quelle legate a Tatya Tope. Continuò a combattere dopo la caduta di Kalpi e morì nei pressi di Gwalior nel giugno 1858."]
sections = [{ title = "Da Jhansi a Kalpi", paragraphs = ["I racconti della fuga e della morte divergono nei dettagli. La letteratura successiva contribuì a delineare l’immagine della regina guerriera. Il passaggio da Jhansi a Kalpi e poi a Gwalior mostra che la perdita di una fortezza non pose fine alla campagna. Ridotta di Kalpi riprende quel raggruppamento. Se un rivale prende la sua ultima città attiva, una città completa di livello 1 appare gratis sul sito valido più vicino nel suo territorio, entro 24 caselle. Il sito si illumina e l’effetto si verifica una volta per partita."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.tr]
text = "Jhansi’nin ranisi Lakshmibai, Gangadhar Rao’nun ölümünden sonra Doğu Hindistan Şirketi’nin devletini ilhak etmesine karşı çıktı. Şirket evlat edindikleri oğullarını tahtın varisi olarak tanımadı. Lakshmibai, 1857–1858 Hint Ayaklanması sırasında Hugh Rose’un kuvvetlerine karşı Jhansi’nin savunmasını yönetti. İngilizler 1858’de Jhansi’yi alınca kaçtı ve Tatya Tope’yle bağlantılı birlikler de dahil olmak üzere Kalpi’deki diğer isyancılara katıldı. Kalpi düştükten sonra savaşa devam etti ve Haziran 1858’de Gwalior yakınlarında öldü."
title = "Lakshmibai"
lang = "tr"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Jhansi’nin ranisi Lakshmibai, Gangadhar Rao’nun ölümünden sonra Doğu Hindistan Şirketi’nin devletini ilhak etmesine karşı çıktı. Şirket evlat edindikleri oğullarını tahtın varisi olarak tanımadı. Lakshmibai, 1857–1858 Hint Ayaklanması sırasında Hugh Rose’un kuvvetlerine karşı Jhansi’nin savunmasını yönetti. İngilizler 1858’de Jhansi’yi alınca kaçtı ve Tatya Tope’yle bağlantılı birlikler de dahil olmak üzere Kalpi’deki diğer isyancılara katıldı. Kalpi düştükten sonra savaşa devam etti ve Haziran 1858’de Gwalior yakınlarında öldü."]
sections = [{ title = "Jhansi’den Kalpi’ye", paragraphs = ["Kaçışı ve ölümü hakkındaki anlatılar ayrıntılarda farklılaşır. Daha sonraki edebiyat savaşçı kraliçe imgesinin oluşmasında da rol oynadı. Jhansi’den Kalpi’ye ve oradan Gwalior’a geçişi, bir kalenin kaybının seferi sona erdirmediğini gösterir. Kalpi Tabyesi bu toparlanmayı oyuna taşır. Bir rakip son etkin şehrini aldığında, 24 kare içindeki en yakın geçerli kendi toprağında ücretsiz ve hazır bir 1. seviye şehir kurulur. Alan parlar ve etki maç başına bir kez işler."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.zh-CN]
text = "拉克希米芭伊是占西的拉妮。丈夫甘加达尔·拉奥去世后，东印度公司拒绝承认两人的养子有继承权，并试图吞并占西。拉克希米芭伊反对这一决定。继承争议不仅关系到王室成员，也决定公司是否接管当地政府。她坚持养子的继承权，后来又亲自参与抵抗公司的军事行动。1857至1858年的印度起义中，她指挥占西的防守，抵抗休·罗斯率领的军队。战事使她同时面对如何保住政权和如何维持守军的问题。1858年，英国军队夺取占西，她从当地脱身，前往卡尔皮与其他起义军会合，其中包括与坦蒂亚·托佩有关的部队。此后卡尔皮也失守，起义军转向瓜廖尔。英国国家陆军博物馆记载，1858年6月1日，支持英国的辛迪亚统治者的一部分军队在莫拉尔转向起义军。她在瓜廖尔附近继续战斗，并于1858年6月在那里去世。占西、卡尔皮和瓜廖尔是这段战事的三个地点，能够用来理解她在失去一个据点后怎样继续参加作战。"
title = "拉克希米芭伊"
lang = "zh-CN"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["拉克希米芭伊是占西的拉妮。丈夫甘加达尔·拉奥去世后，东印度公司拒绝承认两人的养子有继承权，并试图吞并占西。拉克希米芭伊反对这一决定。继承争议不仅关系到王室成员，也决定公司是否接管当地政府。她坚持养子的继承权，后来又亲自参与抵抗公司的军事行动。1857至1858年的印度起义中，她指挥占西的防守，抵抗休·罗斯率领的军队。战事使她同时面对如何保住政权和如何维持守军的问题。1858年，英国军队夺取占西，她从当地脱身，前往卡尔皮与其他起义军会合，其中包括与坦蒂亚·托佩有关的部队。此后卡尔皮也失守，起义军转向瓜廖尔。英国国家陆军博物馆记载，1858年6月1日，支持英国的辛迪亚统治者的一部分军队在莫拉尔转向起义军。她在瓜廖尔附近继续战斗，并于1858年6月在那里去世。占西、卡尔皮和瓜廖尔是这段战事的三个地点，能够用来理解她在失去一个据点后怎样继续参加作战。"]
sections = [{ title = "从占西到卡尔皮", paragraphs = ["关于她如何离开占西以及如何在瓜廖尔附近战死，各种记载的细节并不完全一致。哈琳·辛格研究了文学和后来的讲述如何塑造战士女王的形象。战事的叙述与围绕她产生的传说有不同的依据。后来的小说和电影也曾重新讲述她的故事。游戏中的「卡尔皮据点」取材于她离开占西后与其他起义军会合的经历。对手夺取拉克希米芭伊最后一座运作中的城市时，只要她还保有领土，系统就会从失守城市附近寻找另一个合法的建城地点。搜索范围为二十四格，并选择她领土上最近的合格地块。找到地点后，免费建立一座已经完工的一级城市。没有合格地点时不会建立城市。每局最多成功触发一次。新城所在的位置会在地图上闪光，界面也会提示能力已经发动。原来的城市仍由攻占它的一方控制。游戏用新城表现重新获得作战据点的能力，而具体距离、建造费用和等级属于游戏规则。"] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.ja]
text = "ジャーンシーのラーニーであるラクシュミー・バーイーは、ガンガーダル・ラーオの死後、東インド会社による国の併合に反対した。会社は二人の養子を後継者として認めなかった。この争いは、誰が家を継ぐかとともに、誰がジャーンシーを統治するかをめぐるものだった。1857年から1858年にかけてのインドの反乱では、ヒュー・ローズの軍に対するジャーンシーの防衛を指揮した。1858年にイギリス軍がジャーンシーを占領すると、彼女は脱出し、カルピーでターンティヤー・トーペーに連なる部隊など、ほかの反乱軍と合流した。カルピーが陥落したあと、反乱軍はグワーリヤルへ向かった。英国国立陸軍博物館によれば、六月一日にモーラールで現地の君主に仕える部隊が反乱側に加わった。彼女は戦いを続け、1858年六月にグワーリヤル付近で亡くなった。ジャーンシー、カルピー、グワーリヤルという場所をたどると、拠点を失ったあとの戦いが見えてくる。"
title = "ラクシュミー・バーイー"
lang = "ja"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["ジャーンシーのラーニーであるラクシュミー・バーイーは、ガンガーダル・ラーオの死後、東インド会社による国の併合に反対した。会社は二人の養子を後継者として認めなかった。この争いは、誰が家を継ぐかとともに、誰がジャーンシーを統治するかをめぐるものだった。1857年から1858年にかけてのインドの反乱では、ヒュー・ローズの軍に対するジャーンシーの防衛を指揮した。1858年にイギリス軍がジャーンシーを占領すると、彼女は脱出し、カルピーでターンティヤー・トーペーに連なる部隊など、ほかの反乱軍と合流した。カルピーが陥落したあと、反乱軍はグワーリヤルへ向かった。英国国立陸軍博物館によれば、六月一日にモーラールで現地の君主に仕える部隊が反乱側に加わった。彼女は戦いを続け、1858年六月にグワーリヤル付近で亡くなった。ジャーンシー、カルピー、グワーリヤルという場所をたどると、拠点を失ったあとの戦いが見えてくる。"]
sections = [{ title = "ジャーンシーからカルピーへ", paragraphs = ["脱出と最期については、記録によって細部が異なる。ハーリーン・シンは、文学や後世の語りが戦う女王の像を形づくった過程を研究している。ゲームの「カルピーの砦」は、ジャーンシーを離れたあとに別の場所で反乱軍と合流したことに着想を得ている。敵がラクシュミー・バーイーの最後の稼働都市を占領すると、失った都市から二十四マス以内の自領を調べ、建設条件を満たす最も近い場所に完成済みのレベル1の都市を無料で建てる。適した場所がなければ都市は現れない。発動は一試合につき一回で、新しい都市の場所がマップ上で光り、通知が表示される。奪われた都市は相手の支配下に残る。ゲームでは別の作戦拠点を得たことを都市の建設として扱い、距離と建設条件を定めている。"] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.ko]
text = "잔시의 라니 락슈미바이는 강가다르 라오가 죽은 뒤 동인도 회사가 자신의 나라를 병합하려 하자 반대했다. 회사는 두 사람의 양자를 후계자로 인정하지 않았다. 1857~1858년 인도 봉기에서 락슈미바이는 휴 로즈의 군대에 맞서 잔시의 방어를 이끌었다. 1858년 영국군이 잔시를 점령하자 그녀는 탈출했고, 칼피에서 타티아 토페와 관련된 부대를 비롯한 다른 반군과 합류했다. 칼피가 함락된 뒤 반군은 괄리오르로 향했다. 영국 국립 육군 박물관의 기록에 따르면 6월 1일 모라르에서 현지 군주의 병력 일부가 반군 편으로 돌아섰다. 락슈미바이는 전투를 이어 갔고, 1858년 6월 괄리오르 근처에서 사망했다."
title = "락슈미바이"
lang = "ko"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["잔시의 라니 락슈미바이는 강가다르 라오가 죽은 뒤 동인도 회사가 자신의 나라를 병합하려 하자 반대했다. 회사는 두 사람의 양자를 후계자로 인정하지 않았다. 1857~1858년 인도 봉기에서 락슈미바이는 휴 로즈의 군대에 맞서 잔시의 방어를 이끌었다. 1858년 영국군이 잔시를 점령하자 그녀는 탈출했고, 칼피에서 타티아 토페와 관련된 부대를 비롯한 다른 반군과 합류했다. 칼피가 함락된 뒤 반군은 괄리오르로 향했다. 영국 국립 육군 박물관의 기록에 따르면 6월 1일 모라르에서 현지 군주의 병력 일부가 반군 편으로 돌아섰다. 락슈미바이는 전투를 이어 갔고, 1858년 6월 괄리오르 근처에서 사망했다."]
sections = [{ title = "잔시에서 칼피로", paragraphs = ["탈출과 죽음의 세부 내용은 기록마다 차이가 난다. 할린 싱은 후대의 문학과 이야기가 전사 여왕의 이미지를 형성한 과정을 연구했다. 잔시에서 칼피를 거쳐 괄리오르로 간 일은 요새를 잃은 뒤에도 그녀가 전투를 계속했음을 보여 준다. 게임의 ‘칼피 보루’는 새 거점에서 병력을 다시 모은 일에서 착안했다. 적이 락슈미바이의 마지막 가동 도시를 점령하면, 잃은 도시에서 24칸 이내의 자기 영토에 있는 가장 가까운 적합한 부지에 완공된 레벨 1 도시가 무료로 생긴다. 건설 조건에 맞는 땅이 없으면 도시는 생기지 않는다. 빼앗긴 도시는 점령한 쪽의 손에 남는다. 효과는 경기마다 한 번 발동하며 새 도시가 지도에서 빛나고 알림이 표시된다. 게임에서 도시를 세우는 일은 다른 군사 거점을 얻는 상황을 표현한다."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.ar]
text = "عارضت لاكشميباي، حاكمة جانسي، ضم دولتها إلى ممتلكات شركة الهند الشرقية بعد وفاة غانغادهار راو. ورفضت الشركة الاعتراف بابنهما بالتبني وريثاً. وخلال الثورة الهندية في 1857 و1858 قادت الدفاع عن جانسي ضد قوات هيو روز. وعندما استولى البريطانيون على جانسي عام 1858، تمكنت من الفرار والانضمام إلى قوات متمردة أخرى في كالبي، منها قوات مرتبطة بتاتيا توبي. واصلت القتال بعد سقوط كالبي وماتت قرب غواليور في يونيو 1858."
title = "لاكشميباي"
lang = "ar"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["عارضت لاكشميباي، حاكمة جانسي، ضم دولتها إلى ممتلكات شركة الهند الشرقية بعد وفاة غانغادهار راو. ورفضت الشركة الاعتراف بابنهما بالتبني وريثاً. وخلال الثورة الهندية في 1857 و1858 قادت الدفاع عن جانسي ضد قوات هيو روز. وعندما استولى البريطانيون على جانسي عام 1858، تمكنت من الفرار والانضمام إلى قوات متمردة أخرى في كالبي، منها قوات مرتبطة بتاتيا توبي. واصلت القتال بعد سقوط كالبي وماتت قرب غواليور في يونيو 1858."]
sections = [{ title = "من جانسي إلى كالبي", paragraphs = ["تختلف الروايات في تفاصيل فرارها ومقتلها، وأسهم الأدب اللاحق في رسم صورتها بوصفها ملكة محاربة. ويبين انتقالها من جانسي إلى كالبي ثم غواليور استمرار حملتها بعد خسارة معقل. وتستلهم قدرة «حصن كالبي» إعادة التجمع هذه. عندما يحتل خصم آخر مدينة عاملة لها، تظهر مدينة مكتملة مجانية من المستوى 1 في أقرب موقع صالح داخل أرضها ضمن 24 خانة. يضيء موقع المدينة الجديدة ويحدث الأثر مرة في المباراة."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.ru]
text = "Лакшмибаи, рани Джанси, выступила против присоединения её княжества Ост-Индской компанией после смерти Гангадхара Рао. Компания отказалась признать их приёмного сына наследником. Во время Индийского восстания 1857–1858 годов Лакшмибаи руководила обороной Джанси от войск Хью Роуза. Когда британцы взяли Джанси в 1858 году, она вырвалась и в Калпи присоединилась к другим повстанческим силам, в том числе к отрядам, связанным с Татьей Топе. Она продолжила борьбу после падения Калпи и погибла близ Гвалиора в июне 1858 года."
title = "Лакшмибаи"
lang = "ru"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Лакшмибаи, рани Джанси, выступила против присоединения её княжества Ост-Индской компанией после смерти Гангадхара Рао. Компания отказалась признать их приёмного сына наследником. Во время Индийского восстания 1857–1858 годов Лакшмибаи руководила обороной Джанси от войск Хью Роуза. Когда британцы взяли Джанси в 1858 году, она вырвалась и в Калпи присоединилась к другим повстанческим силам, в том числе к отрядам, связанным с Татьей Топе. Она продолжила борьбу после падения Калпи и погибла близ Гвалиора в июне 1858 года."]
sections = [{ title = "Из Джанси в Калпи", paragraphs = ["Рассказы о её побеге и гибели расходятся в деталях. Поздняя литература повлияла на образ воинственной рани. Путь от Джанси через Калпи к Гвалиору показывает, что потеря крепости не остановила её кампанию. «Редут Калпи» переносит перегруппировку в игру. Если соперник берёт её последний действующий город, в пределах 24 клеток на ближайшем пригодном участке её земли бесплатно появляется готовый город уровня 1. Участок вспыхивает. Эффект срабатывает один раз за матч."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.vi]
text = "Lakshmibai, rani của Jhansi, phản đối Công ty Đông Ấn sáp nhập xứ sở của bà sau khi Gangadhar Rao qua đời. Công ty từ chối công nhận con nuôi của họ là người kế vị. Trong cuộc nổi dậy Ấn Độ năm 1857–1858, bà lãnh đạo việc phòng thủ Jhansi trước quân của Hugh Rose. Khi quân Anh chiếm Jhansi năm 1858, bà thoát ra và gặp các lực lượng nổi dậy khác ở Kalpi, trong đó có các đội quân liên quan đến Tatya Tope. Bà tiếp tục chiến đấu sau khi Kalpi thất thủ và qua đời gần Gwalior tháng 6 năm 1858."
title = "Lakshmibai"
lang = "vi"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, rani của Jhansi, phản đối Công ty Đông Ấn sáp nhập xứ sở của bà sau khi Gangadhar Rao qua đời. Công ty từ chối công nhận con nuôi của họ là người kế vị. Trong cuộc nổi dậy Ấn Độ năm 1857–1858, bà lãnh đạo việc phòng thủ Jhansi trước quân của Hugh Rose. Khi quân Anh chiếm Jhansi năm 1858, bà thoát ra và gặp các lực lượng nổi dậy khác ở Kalpi, trong đó có các đội quân liên quan đến Tatya Tope. Bà tiếp tục chiến đấu sau khi Kalpi thất thủ và qua đời gần Gwalior tháng 6 năm 1858."]
sections = [{ title = "Từ Jhansi đến Kalpi", paragraphs = ["Những lời kể về cuộc thoát vây và cái chết của bà khác nhau ở chi tiết. Văn học về sau cũng định hình hình ảnh nữ vương chiến binh. Hành trình qua Jhansi, Kalpi và Gwalior cho thấy bà tiếp tục chiến đấu sau khi mất cứ điểm. Cứ điểm Kalpi đưa việc tập hợp lại vào trận đấu. Khi đối thủ chiếm thành phố đang hoạt động cuối cùng, một thành phố cấp 1 đã hoàn tất xuất hiện miễn phí trên ô hợp lệ gần nhất thuộc lãnh thổ của bà trong phạm vi 24 ô. Ô mới lóe sáng và hiệu ứng xảy ra một lần mỗi trận."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.id]
text = "Lakshmibai, rani Jhansi, menentang pencaplokan negerinya oleh Perusahaan Hindia Timur setelah Gangadhar Rao wafat. Perusahaan menolak mengakui putra angkat mereka sebagai penerus. Pada Pemberontakan India 1857–1858, Lakshmibai memimpin pertahanan Jhansi melawan pasukan Hugh Rose. Ketika Inggris merebut Jhansi pada 1858, ia lolos dan bergabung dengan pasukan pemberontak lain di Kalpi, termasuk pasukan yang berhubungan dengan Tatya Tope. Ia terus bertempur setelah Kalpi jatuh dan meninggal dekat Gwalior pada Juni 1858."
title = "Lakshmibai"
lang = "id"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Lakshmibai, rani Jhansi, menentang pencaplokan negerinya oleh Perusahaan Hindia Timur setelah Gangadhar Rao wafat. Perusahaan menolak mengakui putra angkat mereka sebagai penerus. Pada Pemberontakan India 1857–1858, Lakshmibai memimpin pertahanan Jhansi melawan pasukan Hugh Rose. Ketika Inggris merebut Jhansi pada 1858, ia lolos dan bergabung dengan pasukan pemberontak lain di Kalpi, termasuk pasukan yang berhubungan dengan Tatya Tope. Ia terus bertempur setelah Kalpi jatuh dan meninggal dekat Gwalior pada Juni 1858."]
sections = [{ title = "Dari Jhansi ke Kalpi", paragraphs = ["Kisah tentang pelarian dan kematiannya berbeda dalam rincian. Sastra kemudian turut membentuk citranya sebagai ratu pejuang. Perjalanannya dari Jhansi melalui Kalpi ke Gwalior menunjukkan bahwa jatuhnya satu benteng tidak menghentikan perjuangannya. Benteng Kalpi mengadaptasi pengelompokan kembali itu. Saat lawan merebut kota aktif terakhir, kota tingkat 1 yang sudah rampung muncul gratis di lokasi sah terdekat dalam wilayahnya, maksimal 24 petak. Lokasi kota baru berkilat dan efek terjadi sekali per pertandingan."] }]
sources = [{ title = "National Army Museum, Decisive events of the Indian Rebellion", url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny" }, { title = "Ministry of Culture, India, Dictionary of Martyrs, volume 2 part 2", url = "https://www.culture.gov.in/files/inline-documents/Martyrs_Vol_2_Part_II_06_03_2019_4.pdf" }, { title = "Harleen Singh, The Rani of Jhansi: Gender, History, and Fable in India, Cambridge University Press", url = "https://www.cambridge.org/core/books/the-rani-of-jhansi/112CE983EC612883CF937463E2660018" }]

[articles.fil]
text = "Tinutulan ni Lakshmibai, rani ng Jhansi, ang pagsakop ng East India Company sa kaniyang estado pagkamatay ni Gangadhar Rao. Tumanggi ang kompanya na kilalanin ang anak nilang inampon bilang tagapagmana. Sa pag-aalsa sa India noong 1857–1858, pinamunuan ni Lakshmibai ang pagtatanggol sa Jhansi laban sa hukbo ni Hugh Rose. Nang sakupin ng mga Briton ang Jhansi noong 1858, nakatakas siya at nakipag-isa sa ibang rebelde sa Kalpi, kabilang ang mga puwersang kaugnay ni Tatya Tope. Nagpatuloy siyang lumaban matapos bumagsak ang Kalpi at namatay malapit sa Gwalior noong Hunyo 1858."
title = "Lakshmibai"
lang = "fil"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
shortArticle = true
intro = ["Tinutulan ni Lakshmibai, rani ng Jhansi, ang pagsakop ng East India Company sa kaniyang estado pagkamatay ni Gangadhar Rao. Tumanggi ang kompanya na kilalanin ang anak nilang inampon bilang tagapagmana. Sa pag-aalsa sa India noong 1857–1858, pinamunuan ni Lakshmibai ang pagtatanggol sa Jhansi laban sa hukbo ni Hugh Rose. Nang sakupin ng mga Briton ang Jhansi noong 1858, nakatakas siya at nakipag-isa sa ibang rebelde sa Kalpi, kabilang ang mga puwersang kaugnay ni Tatya Tope. Nagpatuloy siyang lumaban matapos bumagsak ang Kalpi at namatay malapit sa Gwalior noong Hunyo 1858."]
sections = [{ title = "Mula Jhansi hanggang Kalpi", paragraphs = ["Magkakaiba ang detalye ng mga salaysay tungkol sa pagtakas at pagkamatay niya. Hinubog din ng panitikan ang larawan ng reynang mandirigma. Ipinapakita ng paglipat niya mula Jhansi sa Kalpi at Gwalior na nagpatuloy ang kaniyang kampanya matapos mawalan ng tanggulan. Hango rito ang Tangulan ng Kalpi. Kapag sinakop ng kalaban ang huli niyang aktibong lungsod, lilitaw ang libreng tapos na lungsod na antas 1 sa pinakamalapit na angkop na lugar sa sariling lupain sa loob ng 24 tile. Kikinang ang lugar at mangyayari ito isang beses bawat laban."] }]
