[articles.pt-BR]
text = "Lakshmibai, rani de Jhansi, se opôs à anexação de seu estado pela Companhia das Índias Orientais após a morte de Gangadhar Rao. A Companhia se recusou a reconhecer o filho adotivo do casal como sucessor. Durante a rebelião indiana de 1857–1858, Lakshmibai liderou a defesa de Jhansi contra as forças de Hugh Rose. Quando os britânicos tomaram Jhansi em 1858, ela escapou e se juntou a outras forças rebeldes em Kalpi, entre elas as ligadas a Tatya Tope. Continuou a lutar após a queda de Kalpi e morreu perto de Gwalior em junho de 1858."
title = "Lakshmibai"
lang = "pt-BR"
url = "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"
