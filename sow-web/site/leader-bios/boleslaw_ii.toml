[articles.en]
text = "Bolesław II the Bold, also known as the Generous, was Duke of Poland from 1058 to 1076 and King of Poland from 1076 to 1079. He was the eldest son of Duke Casimir I the Restorer and Maria Dobroniega of Kiev."
title = "Bolesław II the Bold"
lang = "en"
url = "https://en.wikipedia.org/wiki/Boles%C5%82aw_II_the_Bold"
intro = [
  "Bolesław II the Bold (Polish: Bolesław II Śmiały; c. 1042 – 2 or 3 April 1081 or 1082), also known as the Generous (Szczodry ), was Duke of Poland from 1058 to 1076 and King of Poland from 1076 to 1079. He was the eldest son of Duke Casimir I the Restorer and Maria Dobroniega of Kiev.",
  "Bolesław II is considered to have been one of the most capable of the Piast rulers. In 1075, he re-established the Archdiocese of Gniezno (consecrated in 1064) and founded the Diocese of Płock. He established Benedictine monasteries in Mogilno, Lubin and Wrocław. Bolesław II was also the first Polish monarch to produce his own coinage in quantity great enough to replace the foreign coins prevalent in the country during the reigns of the first Piast kings. He established royal mints in Kraków and Wrocław and reformed the coinage, which brought considerable revenue into the royal coffers. All these efforts had an enormous influence on the economic and cultural development of the country.",
  "According to the chronicler Gallus Anonymus, during his reign, he was called largus (\"the Generous\" in English, Szczodry in Polish) as he founded many churches and monasteries throughout Poland. The nickname \"the Bold\" (Śmiały) was only given to Bolesław II for the first time in the later Chronicle of the Polish kings, although it was considered by historiography of the 19th and 20th centuries as a contemporary nickname.",
]
sections = [
  { "title" = "Youth", "paragraphs" = [
      "Bolesław was born circa 1042 as the eldest son of Polish Duke Casimir I the Restorer and Maria Dobroniega of Kiev, daughter of Vladimir the Great and a member of the Rurikid dynasty. His birth occurred during a period of political reconstruction in Poland following a decade of internal disorder and external incursions by the Bohemians under Bretislav I. Casimir had recently returned from exile in 1039 and restored the authority of the Piast dynasty after a prolonged interregnum and civil unrest with aid from the Holy Roman Empire and the Kievan Rus'. Thus, Bolesław's upbringing was shaped by the challenges of reestablishing a unified and centralised Polish state.",
      "From an early age, Bolesław was exposed to the workings of both domestic governance and foreign diplomacy. His schooling conceivably included instruction in statecraft, military leadership, and the ecclesiastical structures that were integral to medieval rulership, though there is no surviving record of his education. Moreover, the influence of his mother's Rus' heritage broadened his diplomatic outlook, fostering early connections with the East. His father’s efforts to reinstate authority, promote church reform, and maintain a balance between the nobility and monarchy deeply informed Bolesław's political formation whilst contributing to his assertive and forceful personality.",
    ] },
  { "title" = "Duke of Poland", "paragraphs" = [
      "Following the death of his father Casimir in 1058, Bolesław II, as the eldest son, inherited Greater and Lesser Poland as well as the Mazovian, Pomerelian, and Silesian lands. His younger brothers Władysław I Herman and Mieszko became Governors of the remaining provinces. However, Mieszko died relatively early, in 1065, at which point his lands came under the authority of Bolesław II.",
      "His father had left him a stabilised country; Bolesław II continued his foreign policy on surrounding his realm with allied kingdoms in order to prevail against the extensive Holy Roman Empire in the west; he aimed to have Poland eventually bordering only allied countries. This is said to be the main reason behind his numerous foreign interventions: in 1060–1063 he intervened in Hungary to aid his uncle King Béla I in the inheritance conflict with his nephew Solomon, who was backed by his brother-in-law King Henry IV of Germany. As a result, Béla, in 1061, with the support of Polish troops, gained power.",
      "In Hungary, Bolesław II pursued the policy of cooperation with the anti-Imperial faction, which allowed him to gain political independence from the Empire but put him in conflict with the Duchy of Bohemia, an Imperial ally. Moreover, he escalated the conflict with the Přemyslid duke Vratislaus II by refusing to pay the annual homage for Silesia and spurring the Bohemian nobility to revolt. In 1063, Bolesław II unsuccessfully besieged the then-Moravian town of Hradec nad Moravicí and was forced to retreat. In the end, relations with Vratislaus II were settled to a certain extent when the latter married Princess Świętosława, Bolesław II's sister.",
    ] },
  { "title" = "King of Poland", "paragraphs" = [
      "When Hildebrand of Sovana, an enemy of the German king, became Pope Gregory VII in 1073, Bolesław II saw in him a natural ally; he started to apply the Pope's reforms in the Archbishopric of Gniezno and commenced negotiations to obtain the royal crown. He spurred the ongoing revolt in Saxony, which had forced Henry IV to retreat from that region (he crushed the revolt at the Battle of Langensalza soon thereafter); the Polish king seized the occasion to launch an invasion against Henry IV's vassal, Vratislaus II of Bohemia, alongside an ally from Grand Prince Vladimir II Monomakh of Kiev.",
      "Thanks to his support of the papal cause during the investiture controversy in the Holy Roman Empire, Bolesław II gained the royal crown of Poland: on Christmas Day of 1076, Archbishop Bogumił crowned him in the Gniezno Cathedral in the presence of a papal legate. King Henry IV's act of contrition at the Walk to Canossa in 1077 also included the imperial recognition of Bolesław II's royal title. Bolesław's new authority, along with his pride, however, caused the Polish magnates to rebel, as they feared the monarchy had started to grow too powerful.",
    ] },
  { "title" = "Deposition and death", "paragraphs" = [
      "In 1077, Bolesław II's troops helped two pretenders to assume the throne: Ladislaus I of Hungary, another son of Béla I, and again Iziaslav in Kiev. In 1078, while returning from the latter campaign, the Polish troops conquered Red Ruthenia. In 1079, however, the conflict with the Polish nobles culminated into open revolt and Bolesław was deposed and banished from the country. The circumstances that led to the King's banishment hinge on the person of Bishop Stanislaus of Kraków, who had excommunicated the king for his infidelity.",
      "From historical records it appears that Bishop Stanislaus was involved with the barons' opposition movement, plotting to remove the King and to place his brother Władysław Herman on the throne. Bolesław II unilaterally declared Stanislaus guilty of treason – Gallus Anonymus uses the word \"traditor\" meaning traitor. On 11 April 1079, Bolesław either ordered the death and dismemberment of the bishop or, according to Master Wincenty Kadłubek, carried out the deed himself. Kadłubek wrote his account nearly 100 years after Gallus Anonymus and a century and a half after the actual affair. His account, as well as artistic tradition, holds that this took place during the celebration of Mass. Though the bishop had privately and then publicly warned the king to repent of adultery and other vices, Bolesław chose a course of action more characteristic of his nickname, \"the Bold\". Kadłubek categorically condemns the murder of Stanislaus as savage and unjust; meanwhile, Gallus Anonymus passes a negative judgement on both the bishop, on account of his treason, and on Bolesław, for his shameful conduct in administering the punishment.",
      "Bolesław found refuge at the court of King Ladislaus, who also owed his crown to the deposed king. However, according to Gallus Anonymus, Bolesław II's atrocious conduct towards his Hungarian hosts caused his premature death in 1081 or 1082 at the hands of an assassin, probably by poisoning. He was about 40 years old.",
    ] },
]

[articles.es]
text = "Boleslao II el Temerario (en polaco: Bolesław II Śmiały), el Generoso (Szczodry ) o el Cruel (Okrutny) (¿?, 1042-1081)​ de la dinastía Piast, Duque de Polonia (1058 a 1076) y luego de autoproclamarse rey de Polonia (1076 y 1079)."
title = "Boleslao II el Temerario"
lang = "es"
url = "https://es.wikipedia.org/wiki/Boleslao_II_el_Temerario"
intro = [
  "Boleslao II el Temerario (en polaco: Bolesław II Śmiały), el Generoso (Szczodry ) o el Cruel (Okrutny) (¿?, 1042-1081)​ de la dinastía Piast, Duque de Polonia (1058 a 1076) y luego de autoproclamarse rey de Polonia (1076 y 1079).",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "Boleslao II nació como hijo del duque polaco Casimiro I el Restaurador y de la princesa rusa María Dobroniega de Kiev. Luego de la muerte de su padre ascendió al trono en 1058, teniendo prioridad frente a su hermano menor Vladislao.",
      "En 1060 su primera empresa armada como duque polaco consistió en asistir a su tío Bela I de Hungría. Bela había tomado como esposa a la princesa Riquilda de Polonia, la cual era hermana del duque polaco Casimiro I el Restaurador, el padre de Boleslao II. De esta forma los lazos familiares entre Bela y Boleslao II significaron una fuerte y poderosa alianza entre los dos monarcas. Por otra parte, los conflictos entre el rey Andrés I de Hungría y su hermano Bela cada vez eran más serios. El rey, sin herederos, había nombrado su sucesor a su hermano Bela, pero ante repentino nacimiento de su hijo Salomón de Hungría cambió la situación. Andrés I coronó a su hijo para asegurar su sucesión y la enemistad con su hermano Bela se agravó nuevamente. Boleslao II y Bela arribaron al reino húngaro y durante una confusa serie de sucesos militares que desencadenaron en la Batalla junto al río Tisza, de la cual apenas consiguió escapar el rey húngaro, quien murió durante su huida. Bela fue coronado como rey húngaro gracias a la asistencia de Boleslao II, generándose a partir de este momento relaciones estables entre los dos estados medievales.",
      "Posteriormente, durante la Querella de las Investiduras, puesto que las casas reales de Polonia y Hungría tenían lazos familiares y deseaban ambos estados medievales mantener su independencia frente al Sacro Imperio Romano Germánico, Boleslao II apoyó al papa Gregorio VII contra el emperador.",
    ] },
  { "title" = "Bibliografía", "paragraphs" = [
      "Norbert Delestowicz, Bolesław II Szczodry. Tragiczne losy wielkiego wojownika, 1040/1042 - 2/3 IV 1081 albo 1082, Kraków 2016, ISBN 978-83-7730-172-2.",
      "Karácsonyi, J. (2006). Szent László Király Élete. Gödöllõ, Hungría: Editorial Attraktor.",
    ] },
]

[articles.fr]
text = "Boleslas II le Généreux (Bolesław II Szczodry audio), également surnommé le Téméraire (Śmiały) ou le Cruel (Okrutny), de la dynastie des Piasts, est né vers 1042 et décédé vers 1081. Duc, puis roi de Pologne, il est le fils aîné de Casimir Ier le Restaurateur et de Maria Dobroniega de Kiev."
title = "Boleslas II le Généreux"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Boleslas_II_le_G%C3%A9n%C3%A9reux"
intro = [
  "Boleslas II le Généreux (Bolesław II Szczodry audio), également surnommé le Téméraire (Śmiały) ou le Cruel (Okrutny), de la dynastie des Piasts, est né vers 1042 et décédé vers 1081. Duc, puis roi de Pologne, il est le fils aîné de Casimir Ier le Restaurateur et de Maria Dobroniega de Kiev.",
]
sections = [
  { "title" = "Règne", "paragraphs" = [
      "En 1058, à la mort de son père, il lui succède sur le trône polonais, ses frères devenant des gouverneurs de province avec une très large autonomie. Il perd la Poméranie qui reprend son indépendance. Le début de son règne coïncide aussi avec l’apparition des premières pièces de monnaie polonaises.",
      "De 1060 à 1063, Boleslas II intervient en Hongrie pour soutenir Béla Ier et son fils, représentants d’une lignée s’opposant au Saint-Empire. En 1061, Béla, aidé par des troupes polonaises, prend le pouvoir en Hongrie, ses rivaux se réfugient dans le Saint-Empire.",
      "En février 1061, le duc Vratislav II monte sur le trône de Bohême. Vratislav II étant un ennemi de Béla, Boleslas encourage les prétendants à la couronne tchèque et arrête de payer le tribut annuel aux Tchèques. En été 1061, il assiège la ville de Hradec (en Moravie) mais il est vaincu et doit battre en retraite.",
    ] },
  { "title" = "Légende", "paragraphs" = [
      "Une fable populaire, existante depuis le Moyen Âge tardif, veut que Boleslas passa le reste de sa vie comme pénitent silencieux dans l'abbaye bénédictine d'Ossiach en Carinthie. Là on trouve une ancienne pierre tombale avec l'écriteau apposé ultérieurement en latin : Rex Boleslaus Polonie occisor sancti Stanislai Epi Cracoviensis (« Boleslas, roi de Pologne, meurtrier de saint Stanislas, évêque de Cracovie »). Des fouilles, effectuées dans les années 1950, ont livré en fait une tombe du XIe siècle. Selon d'autres sources, le roi est enterré à l'abbaye de Tyniec.",
    ] },
  { "title" = "Mariage et descendance", "paragraphs" = [
      "Avant 1069, Boleslas épouse Wyszesława (morte après 1089), fille de Sviatoslav II, grand-prince de Kiev. Ils ont un fils:",
    ] },
]

[articles.de]
text = "Bolesław II., genannt „der Großzügige“, auch „der Kühne“ (polnisch Bolesław II. Szczodry oder Śmiały, lateinisch Boleslaus; * 1042; † 22."
title = "Bolesław II. (Polen)"
lang = "de"
url = "https://de.wikipedia.org/wiki/Boles%C5%82aw_II._%28Polen%29"
intro = [
  "Bolesław II., genannt „der Großzügige“, auch „der Kühne“ (polnisch Bolesław II. Szczodry oder Śmiały, lateinisch Boleslaus; * 1042; † 22. März 1081 in Ungarn), war der Sohn des polnischen Herzogs Kasimir I. Karl und der ruthenischen Prinzessin Maria Dobroniega. Er entstammte der Dynastie der Piasten und war ab 1058 Herzog von Polen und von 1076 bis 1079 König von Polen.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Die Politik des Vaters weiterführend, konzentrierte sich Bolesław auf die Aufgaben des inneren Aufbaus des Staates, insbesondere im wirtschaftlichen und kirchlichen Bereich: vor allem hat Bolesław ein Netz von Märkten angelegt, die Münzprägung gefördert, die Benediktinerabteien Tyniec bei Krakau und Mogilno in Kujawien entweder gegründet bzw. großzügig ausgestattet.",
      "Bolesław musste aber vom Beginn seiner Regierung an auf die politischen Schwierigkeiten seiner Verwandten Rücksicht nehmen: 1060 intervenierte er in Ungarn zugunsten seines Onkels Béla I., 1063 kam er seinem Vetter Géza I. zu Hilfe, 1077 trat er für seinen Vetter Ladislaus I. ein und mehrmals (1069, 1077) verhalf er seinem Vetter und Onkel, dem Großfürsten Izjaslaw von Kiew zur Rückgewinnung seines Throns. Die guten Beziehungen Bolesławs zu Herzog Vratislav von Böhmen, der seit 1063 mit Bolesławs Schwester, Świętosława von Polen, vermählt war, verschlechterten sich aus unbekannten Gründen um 1070. Der deutsche König, Heinrich IV., forderte eine Beendigung der gegenseitigen Raubzüge. Als Bolesław 1072 gegen diese königliche Weisung verstieß, wurde ein großer Feldzug gegen Polen vorbereitet, was von der sächsischen Opposition als ein Täuschungsmanöver verstanden wurde und zum Sachsenaufstand von 1073 beitrug. Bolesław nutzte die neue Situation: Er verweigerte den Tribut sowohl dem deutschen König als auch dem böhmischen Herzog für den Besitz Schlesiens.",
      "Spätestens nach der römischen Fastensynode vom Februar 1075 wandte sich Bolesław an Papst Gregor VII., der im April des Jahres seine Legaten nach Polen schickte, um die kirchlichen Verhältnisse zu ordnen und insbesondere um die Gnesener Metropolitanrechte wiederherzustellen. Die politischen Fragen wurden im päpstlichen Schreiben nicht berücksichtigt; sie gehörten offensichtlich zu den mündlichen Aufträgen, die der Papst den Legaten mitgegeben hatte. Unbekannt sind die Bedingungen, unter welchen die Krönung Bolesławs zum König von Polen 1076 vollzogen wurde. Sollte Gregor VII. in Einklang mit den Grundsätzen seiner Lehnspolitik die Absicht gehabt haben, Polen in ein Lehnsverhältnis zum Heiligen Stuhl zu bringen, so ist er über bloße Ansprüche nicht hinausgekommen. Man kann dagegen vermuten, dass sich Bolesław bereit erklärte, den Peterspfennig einzuführen und dass eben er ihn auch tatsächlich eingeführt hat. Da es sich aber bei dem Peterspfennig um eine Herdsteuer handelte, die von der Bevölkerung bezahlt wurde, konnte seine Erhebung nicht zu einer engeren Bindung des polnischen Königtums an das Papsttum führen.",
    ] },
  { "title" = "Der stumme Büßer zu Ossiach", "paragraphs" = [
      "Die Sage, die auch in Polen verbreitet ist und vielfach sogar geglaubt wird, erzählt, dass an einem Sommerabend des Jahres 1082 ein müder Wanderer im Pilgergewand an die Pforte des Klosters Ossiach in Kärnten klopfte und durch Gesten zu verstehen gab, dass er stumm sei und als dienender Bruder dem Kloster dienen möchte. Acht Jahre verbrachte der Unbekannte stumm im Kloster und verrichtete demütig und geduldig die niedrigsten Dienste, ehe ihn, der im besten Alter stand, eine schwere Krankheit aufs Lager warf. Als er seine letzte Stunde herannahen fühlte, löste sich seine Zunge, und er bat, die Beichte ablegen zu dürfen. Dem verwunderten Beichtvater bekannte er, wer er gewesen sei, warum er nach Ossiach gekommen sei und welches Verbrechen er büßen wollte.",
      "Boleslaus sei sein Name, und König von Polen sei er gewesen, ein glänzender Sieger über seine Feinde. Hochmütig sei er durch seine Erfolge geworden, unbeherrscht und gewalttätig sei er gewesen, grausam zu seinen Truppen, hart gegen sein Volk, dem er unerschwingliche Steuern auferlegt habe, und also schnell verhasst bei den Untertanen. Als Stanislaus, der Bischof von Krakau, ihm seine Untaten vorhielt und ihn sogar mit dem Bann belegte, habe er ihn in rasendem Zorn während der Messe im Dom erschlagen.",
      "Vor dem erbitterten Volk, das sich gegen seinen Herrscher empörte, sei er nach Ungarn geflüchtet, dann heimlich zum Papst um Vergebung gepilgert, der ihm als Buße auferlegt habe, so lange zu wandern, bis er an einen Ort komme, wo das Wasser aufwärts fließe. Ruhelos also, so meinte er, müsse er bis an sein Lebensende rastlos umherstreifen, doch als er zum Ossiacher See kam, vernahm er von den Anwohnern, dass der größte Zufluss, die Tiebel, „hinauf“ fließe, da Kärnten von Nordosten nach Südwesten abschüssig ist und daher auch alle Flüsse mehr oder weniger in südwestliche Richtung fließen. Die Tiebel fließt jedoch zwischen Feldkirchen und dem Ossiacher See in östliche Richtung und somit nach dem Verständnis der Anwohner „aufwärts“, obwohl der Ossiacher See tatsächlich ca. 50 m tiefer liegt als Feldkirchen. Am See fand der Wanderer dann das Kloster, einen stillen Ort, wo er fern der Welt seine Sünden büßen und in Ruhe dem Herrn bis zu seinem Tode dienen konnte.",
    ] },
  { "title" = "Ehe und Familie", "paragraphs" = [
      "Bolesław heiratete um 1069 eine namentlich nicht bekannte Prinzessin, möglicherweise deutscher, böhmischer oder ruthenischer Herkunft. Mit ihr hatte er den Sohn Mieszko.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Eduard Mühle: Die Piasten. Polen im Mittelalter. (= C.H. Beck Wissen. 2709). Verlag C.H. Beck, München 2011, ISBN 978-3-406-61137-7.",
    ] },
]

[articles.ru]
text = "Болеслав II Смелый (Болеслав II Щедрый; пол. Bolesław II Śmiały; около 1042 — 2 апреля 1081) — польский князь (1058—1076 годы) и король Польши (1076—1079 годы), представитель династии Пястов."
title = "Болеслав II Смелый"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%91%D0%BE%D0%BB%D0%B5%D1%81%D0%BB%D0%B0%D0%B2_II_%D0%A1%D0%BC%D0%B5%D0%BB%D1%8B%D0%B9"
intro = [
  "2 апреля 1081) — польский князь (1058—1076 годы) и король Польши (1076—1079 годы), представитель династии Пястов.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "Болеслав II был сыном князя Польши Казимира I Восстановителя и Добронеги (Марии), предположительно дочери Владимира Святославича, великого князя Киевского. Был женат на дочери Святослава Черниговского Вышеславе (1065 год).",
      "Болеслав II возобновил завоевательную политику в духе своего прадеда, Болеслава I Храброго. Князь неоднократно вмешивался во внутренние дела соседних государств: так, в Венгрии он оказывал военную помощь герцогу Беле против короля Эндре I в 1057 году, а позднее, в 1074 году помог Гезе I свергнуть с престола короля Шоломона. Опираясь на союз с Венгрией и Киевской Русью, Болеслав II в 1061 году вмешался в междоусобные войны в Чехии, но потерпел неудачу. В 1068 году «за некие обещания», по словам В. Н. Татищева, оказал помощь Изяславу в восстановлении великого княжения в Киеве. По некоторым данным обещания эти были подкреплены тайным договором с папой римским Григорием VII. Поляки не входили в Киев. Расправился с «обидчиками» Изяслава его сын Мстислав. Когда Изяслав восстановил своё княжение 2 мая 1069 года, он послал поляков по селам для прокормления. Польские войска стали грабить и прибегать к насилию, что вызвало ожесточённое сопротивление и многочисленные жалобы князю. Вскоре Болеславу пришлось увести войско.",
      "Укреплению международного престижа польского государства способствовало также удачное вмешательство Болеслава II в борьбу за инвеституру между правителем Священной Римской империи Генрихом IV и папой Григорием VII. Болеслав II выступил на стороне последнего: в 1072 году он отказался выплачивать дань императору и объявил о независимости Польши, а в 1074 году признал польское государство леном папского престола. Это принесло свои плоды: в 1075 году в Польшу прибыл папский посланник, чтобы окончательно закрепить права Гнезненского архиепископства, а 25 декабря 1076 года Болеслав II был коронован королём Польши.",
    ] },
  { "title" = "В искусстве", "paragraphs" = [
      "Ян Матейко в 1877 году создал картину «Святой Станислав обличает Болеслава Смелого», оригинал которой был впоследствии утрачен. В 1892 году художник работал над картиной «Убийство святого Станислава». Полотно осталось незаконченным, но сохранился эскиз. Этот же художник включил изображение Болеслава II в свой цикл «Портреты королей и князей Польши».",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Болеслав, герцоги и короли польские // Энциклопедический словарь Брокгауза и Ефрона : в 86 т. (82 т. и 4 доп.). — СПб., 1890—1907.",
      "Norbert Delestowicz. Bolesław II Szczodry. Tragiczne losy wielkiego wojownika, 1040/1042 — 2/3 IV 1081 albo 1082, Kraków 2016, ISBN 978-83-7730-172-2.",
    ] },
]

[articles.id]
text = "Bolesław II yang Dermawan, aka yang Berani dan yang Kejam (bahasa Polandia: [Bolesław II Szczodry atau Śmiały atau Okrutny] Galat: {{Lang}}: text has italic markup (bantuan); tahun 1041 atau 1042 – 2 atau 3 April 1081 atau 1082), merupakan adipati Polandia (1058–76) dan Raja Polandia ketiga (1076–79). Ia merupakan putra sulung Kazimierz I Odnowiciel dan Maria Dobroniega, putri Adipati Agung Vladimir I."
title = "Bolesław II"
lang = "id"
url = "https://id.wikipedia.org/wiki/Boles%C5%82aw_II"
intro = [
  "Bolesław II yang Dermawan, aka yang Berani dan yang Kejam (bahasa Polandia: [Bolesław II Szczodry atau Śmiały atau Okrutny] Galat: {{Lang}}: text has italic markup (bantuan); tahun 1041 atau 1042 – 2 atau 3 April 1081 atau 1082), merupakan adipati Polandia (1058–76) dan Raja Polandia ketiga (1076–79).",
  "Ia merupakan putra sulung Kazimierz I Odnowiciel dan Maria Dobroniega, putri Adipati Agung Vladimir I.",
  "Bolesław II dianggap sebagai salah seorang pemimpin Wangsa Piast yang tercakap. Menurut Gall Anonim selama pemerintahannya ia dipanggil largus (\"yang Dermawan\" di dalam bahasa Indonesia, \"Szczodry\" di dalam bahasa Polandia) karena ia mendirikan banyak gereja dan biara di seluruh Polandia. Ia membangun kembali Keuskupan Gniezno pada tahun 1075 (konsekrasi pada tahun 1064) dan mendirikan sebuah keuskupan di Płock (1075). Ia mendirikan biara-biara Benediktin di Mogilno, Lubin dan Wrocław yang memiliki pengaruh yang sangat besar terhadap perkembangan ekonomi dan budaya negara.",
  "Nama panggilan \"yang Gagah\" (Śmiały) hanya diberikan kepada Bolesław II untuk pertama kalinya di dalam Tharikh raja-raja Polandia kemudian, meskipun hal tersebut dianggap oleh penulis sejarah abad ke-19 dan 20 sebagai sebuah nama panggilan modern. Peneliti modern menyatakan bahwa julukan ini diberikan kepadanya beberapa abad setelah kematiannya tidak jelas.",
]
sections = [
  { "title" = "Kehidupan", "paragraphs" = [
      "Setelah kematian ayahandanya pada tahun 1058, Bolesław II, sebagai putra sulung, menjadi ahli waris Wielkopolska, Małopolska juga Masovia, Pommern, dan Silesia. Adik-adiknya Władysław I Herman dan Mieszko menjadi Gubernur dari sisa-sisa provinsi. Namun Mieszko mati muda dan pada tahun 1065 wilayah-wilayahnya jatuh ke tangan Bolesław II.",
      "Pada tahun 1063 Raja Béla I dari Hungaria meninggal. Bolesław II tidak dapat membela putranya Géza melawan pasukan Jerman Heinrich IV, Kaisar Romawi Suci, yang menempatkan saudara iparnya Salamon di atas takhta Hungaria.",
      "Pada tahun 1069 Iziaslav I dan istrinya Gertruda Mieszkówna dipecat. Kampanye militer Bolesław II membangun kekuasaan mereka kembali di Kiev. Pada tahun 1071 Bolesław II menyerang Bohemia kembali. Karena Polandia menolak upaya arbitrasi Kaisar Heinrich IV, pertanyaan tersebut diselesaikan oleh gencatan senjata di kedua belah pihak; tetapi Bolesław II mengabaikan perjanjian tersebut dan menyerang kembali pada tahun 1072 serta menolak membayar upeti dari Silesia ke Kaisar Romawi Suci.",
    ] },
  { "title" = "Pernikahan dan keturunan", "paragraphs" = [
      "Sebelum tahun 1069 Bolesław II menikahi Wyszesława (meninggal setelah tahun 1089), yang menurut Riwayat Jan Długosz (dan didukung oleh beberapa sumber), merupakan putri Sviatoslav II, Pangeran Agung Kiev, dengan istri pertamanya Kilikia, diduga dari anggota Wangsa Dithmarschen. Mereka memiliki seorang putra:",
      "Para sejarawan modern yang dipimpin oleh Oswald Balzer (pada tahun 1895), membantah asal Kiev dan nama istri Bolesław II dan membongkar teori bahwa istrinya adalah Ratu Agnes (Agnes Regina) yang daftar kematiannya dicatat di dalam Zwiefalten; ia diduga berasal dari Wangsa Přemyslid.",
    ] },
]

