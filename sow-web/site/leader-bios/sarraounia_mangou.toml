[articles.tr]
text = "Sarraounia Mangou, bugünkü Nijer’deki Lougou’nun Azna topluluğunun hükümdarlarından biriydi. Sarraounia unvanı, Arewa bölgesinde ruhani yetkileri olan bir makamı ifade eder. Yerel sözlü gelenek, Mangou’nun 1899’da Voulet ve Chanoine’in Fransız seferine direnişini yaşatır. Abdoulaye Mamani’nin 1980’de yayımlanan romanı hikâyeyi daha geniş bir kitleye ulaştırdı. Tarihçi Elara Bertho, Lougou’nun hafızasının, edebiyatın ve sonraki anlatıların Mangou imgesini nasıl şekillendirdiğini inceler. Nijer’in UNESCO’ya sunduğu dosya, Mangou’yu Lougou’nun hükümdarları arasında sayar ve bölgedeki bir savaş alanını Fransız birliğine karşı direnişle ilişkilendirir. Dosya ayrıca sarraouniaların mezarlarını ve makama bağlı ibadet yerlerini anlatır. Dönemin belgelerinde hayatı ve çatışmanın ayrıntıları aynı ölçüde kayıtlı değildir. Lougou Direniyor, bir şehir kaybedildikten sonra da mücadele edebilme fikrini oyuna taşır. Toprağın olduğu sürece şehir başına bir kez olmak üzere, şehir kaybı asker sınırına kadar en fazla 1.500 yedek askeri seferber eder."
title = "Sarraounia Mangou"
lang = "tr"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
