[articles.ru]
text = "Мангу была правительницей общины азна в Лугу, на территории нынешнего Нигера. Саррауния — титул, связанный также с духовной властью в области Арева. В местной устной традиции сохранилась память о сопротивлении Мангу французской экспедиции Вуле и Шануана в 1899 году. Роман Абдулая Мамани, вышедший в 1980 году, познакомил с этой историей более широкую публику. Историк Элара Берто исследует, как память Лугу, литература и позднейшие пересказы сформировали образ Мангу. В материалах, которые Нигер представил ЮНЕСКО, Мангу названа среди правительниц Лугу. Авторы связывают местное поле боя с её сопротивлением французской колонне, а также описывают гробницы саррауний и культовые места. Современные событиям документы неодинаково подробно освещают её жизнь и ход сражения. «Лугу держится» переносит в игру продолжение сопротивления после утраты города. Потеря города мобилизует до 1 500 резервистов в пределах лимита войск. Это происходит один раз для каждого города, пока у игрока остаётся территория."
title = "Саррауния Мангу"
lang = "ru"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
shortArticle = true
intro = ["Мангу была правительницей общины азна в Лугу, на территории нынешнего Нигера. Саррауния — титул, связанный также с духовной властью в области Арева. В местной устной традиции сохранилась память о сопротивлении Мангу французской экспедиции Вуле и Шануана в 1899 году. Роман Абдулая Мамани, вышедший в 1980 году, познакомил с этой историей более широкую публику. Историк Элара Берто исследует, как память Лугу, литература и позднейшие пересказы сформировали образ Мангу."]
sections = [{ title = "Лугу и экспедиция Вуле — Шануана", paragraphs = ["В материалах, которые Нигер представил ЮНЕСКО, Мангу названа среди правительниц Лугу. Авторы связывают местное поле боя с её сопротивлением французской колонне, а также описывают гробницы саррауний и культовые места. Современные событиям документы неодинаково подробно освещают её жизнь и ход сражения. «Лугу держится» переносит в игру продолжение сопротивления после утраты города. Потеря города мобилизует до 1 500 резервистов в пределах лимита войск. Это происходит один раз для каждого города, пока у игрока остаётся территория."] }]
sources = [{ title = "Elara Bertho, “Sarraounia, une reine africaine entre histoire et mythe littéraire,” THALIM/CNRS", url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/" }, { title = "Le site de Lougou, UNESCO Tentative Lists", url = "https://whc.unesco.org/en/tentativelists/5046/" }]

[articles.vi]
text = "Mangou là một người cai trị cộng đồng Azna ở Lougou, thuộc Niger ngày nay. Sarraounia là danh hiệu của một chức vị có vai trò tinh thần tại vùng Arewa. Truyền khẩu địa phương lưu giữ ký ức về cuộc kháng cự của bà trước đoàn viễn chinh Pháp của Voulet và Chanoine năm 1899. Tiểu thuyết của Abdoulaye Mamani xuất bản năm 1980 đưa câu chuyện đến đông đảo độc giả. Nhà sử học Elara Bertho nghiên cứu cách ký ức ở Lougou, văn chương và các cách kể về sau định hình hình ảnh Mangou. Hồ sơ Lougou do Niger trình UNESCO ghi tên Mangou trong số những người cai trị và liên hệ một chiến địa với cuộc kháng cự chống đoàn quân Pháp. Hồ sơ cũng mô tả mộ của các sarraounia và những nơi thờ tự gắn với chức vị này. Tư liệu đương thời ghi lại cuộc đời bà và diễn biến trận đánh với mức độ chi tiết khác nhau. Lougou kiên cường đưa việc tiếp tục chiến đấu sau khi mất thành phố vào trận đấu. Khi mất thành phố, người chơi huy động tối đa 1.500 quân dự bị trong giới hạn quân số, một lần mỗi thành phố khi vẫn còn lãnh thổ."
title = "Sarraounia Mangou"
lang = "vi"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
