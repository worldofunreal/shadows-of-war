[articles.id]
text = "Mangou adalah penguasa komunitas Azna di Lougou, di wilayah yang kini menjadi bagian dari Niger. Sarraounia merupakan gelar bagi pemegang jabatan yang juga memiliki wewenang keagamaan di kawasan Arewa. Tradisi lisan setempat mengingat perlawanannya terhadap ekspedisi Prancis pimpinan Voulet dan Chanoine pada 1899. Novel Abdoulaye Mamani yang terbit pada 1980 memperkenalkan kisah itu kepada khalayak yang lebih luas. Sejarawan Elara Bertho mengkaji bagaimana ingatan di Lougou, sastra, dan penceritaan ulang membentuk citra Mangou. Dokumen Lougou yang diajukan Niger kepada UNESCO menyebut Mangou sebagai salah satu penguasanya dan mengaitkan lokasi pertempuran dengan perlawanannya terhadap pasukan Prancis. Dokumen itu juga mencatat makam para sarraounia dan tempat ibadah yang terkait dengan jabatan tersebut. Catatan sezaman memberikan keterangan yang tidak merata tentang hidupnya dan jalannya pertempuran. Lougou Bertahan menggambarkan perlawanan yang berlanjut setelah kehilangan kota. Kehilangan kota mengerahkan hingga 1.500 pasukan cadangan sesuai batas pasukan, sekali per kota selama pemain masih memiliki wilayah."
title = "Sarraounia Mangou"
lang = "id"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
