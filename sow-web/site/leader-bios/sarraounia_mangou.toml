[articles.fr]
text = "Sarraounia Mangou fut une souveraine de la communauté azna de Lougou, dans l’actuel Niger. Le titre de sarraounia désigne une autorité qui exerce un rôle spirituel dans l’Arewa. La mémoire orale locale a transmis le souvenir de sa résistance à la colonne française de Voulet et Chanoine en 1899. Le roman d’Abdoulaye Mamani, paru en 1980, a élargi le public de cette histoire. L’historienne Elara Bertho étudie la manière dont la mémoire de Lougou, la littérature et les réécritures ultérieures ont façonné l’image de Mangou. Le dossier patrimonial présenté par le Niger à l’UNESCO cite Mangou parmi les souveraines de Lougou et associe un champ de bataille à sa résistance à la colonne française. Il décrit aussi les tombes des sarraounias et les lieux de culte liés à leur fonction. Les sources contemporaines renseignent de façon inégale sa vie et le déroulement de l’affrontement. Lougou résiste transpose dans la partie la poursuite du combat après la perte d’une ville. La perte mobilise jusqu’à 1 500 soldats de réserve dans la limite de vos troupes, une fois par ville tant que vous possédez encore du territoire."
title = "Sarraounia Mangou"
lang = "fr"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
