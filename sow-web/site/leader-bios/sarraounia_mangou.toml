[articles.zh-CN]
text = "曼古是今尼日尔境内卢古的阿兹纳社群领袖。「萨拉乌妮娅」是当地统治者的称号，这一职位在阿雷瓦地区也有宗教职责。地方口述传统记得她曾在1899年抵抗武莱和沙努瓦纳率领的法国远征队。阿卜杜拉耶·马马尼在1980年发表小说，将这段流传于卢古的故事带给更多读者。后来又出现了不同的讲述和改编。历史学者埃拉拉·贝尔托研究这段历史怎样在地方记忆、文学作品和后来的传播中形成今天为人所知的形象。她所讨论的材料有不同的来历。口述叙事保留了社群怎样记得自己的领袖，小说则把这些记忆带入了新的创作。两类材料都有助于了解曼古故事的流传过程，能够用来重建战事的细节则取决于同一时期留下的其他证据。 尼日尔向联合国教科文组织提交的卢古遗址预备名录资料，把曼古列在曾经治理卢古的萨拉乌妮娅之中，并把当地的一处战场与抵抗法国远征队联系起来。这份资料由尼日尔文化部门于2006年提交，说明当地希望保护哪些遗址，也记录了提交者如何理解这些遗址的历史意义。该文件因而同时是一份保护提案和一份地方历史说明。资料还记载了历任领袖的墓地、祭祀地点，以及传统中用于裁决纠纷的神圣石头。这些地点说明，萨拉乌妮娅的职责既涉及社群的事务，也与当地的宗教传统有关。曼古的生平和战斗的具体过程在同时代的记录中留下的线索不均衡。口述、遗址和文学作品讲述同一人物时，各自保存了不同层面的信息。游戏中的「卢古坚守」取材于社群在失去据点之后仍能继续抵抗的设定。失去一座城市时，如果玩家还有领土，就会动员最多一千五百名预备兵，实际增加人数受兵力上限约束。每座城市只触发一次。部队数量和触发规则是游戏的设定，以失去据点后的增援来表现坚持作战的主题。玩家可以根据自己的兵力和剩余领土判断这次损失能否带来增援。"
title = "萨拉乌妮娅·曼古"
lang = "zh-CN"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
shortArticle = true
intro = ["曼古是今尼日尔境内卢古的阿兹纳社群领袖。「萨拉乌妮娅」是当地统治者的称号，这一职位在阿雷瓦地区也有宗教职责。地方口述传统记得她曾在1899年抵抗武莱和沙努瓦纳率领的法国远征队。阿卜杜拉耶·马马尼在1980年发表小说，将这段流传于卢古的故事带给更多读者。后来又出现了不同的讲述和改编。历史学者埃拉拉·贝尔托研究这段历史怎样在地方记忆、文学作品和后来的传播中形成今天为人所知的形象。她所讨论的材料有不同的来历。口述叙事保留了社群怎样记得自己的领袖，小说则把这些记忆带入了新的创作。两类材料都有助于了解曼古故事的流传过程，能够用来重建战事的细节则取决于同一时期留下的其他证据。"]
sections = [{ title = "卢古与武莱—沙努瓦纳远征队", paragraphs = ["尼日尔向联合国教科文组织提交的卢古遗址预备名录资料，把曼古列在曾经治理卢古的萨拉乌妮娅之中，并把当地的一处战场与抵抗法国远征队联系起来。这份资料由尼日尔文化部门于2006年提交，说明当地希望保护哪些遗址，也记录了提交者如何理解这些遗址的历史意义。该文件因而同时是一份保护提案和一份地方历史说明。资料还记载了历任领袖的墓地、祭祀地点，以及传统中用于裁决纠纷的神圣石头。这些地点说明，萨拉乌妮娅的职责既涉及社群的事务，也与当地的宗教传统有关。曼古的生平和战斗的具体过程在同时代的记录中留下的线索不均衡。口述、遗址和文学作品讲述同一人物时，各自保存了不同层面的信息。游戏中的「卢古坚守」取材于社群在失去据点之后仍能继续抵抗的设定。失去一座城市时，如果玩家还有领土，就会动员最多一千五百名预备兵，实际增加人数受兵力上限约束。每座城市只触发一次。部队数量和触发规则是游戏的设定，以失去据点后的增援来表现坚持作战的主题。玩家可以根据自己的兵力和剩余领土判断这次损失能否带来增援。"] }]
sources = [{ title = "Elara Bertho, “Sarraounia, une reine africaine entre histoire et mythe littéraire,” THALIM/CNRS", url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/" }, { title = "Le site de Lougou, UNESCO Tentative Lists", url = "https://whc.unesco.org/en/tentativelists/5046/" }]

[articles.ja]
text = "マングは現在のニジェールにあるルグのアズナ共同体を治めた人物である。サラウニアは称号であり、アレワ地方で宗教的な権威も担う地位を指す。1899年、ヴーレとシャノワーヌが率いたフランスの遠征隊に抵抗したという記憶が、地域の口承に残っている。アブドゥライ・ママニの小説が1980年に刊行され、この物語はルグの外にも広く知られるようになった。歴史家エララ・ベルトは、口承の記憶や小説、その後の再話によって、マングの姿がどのように形づくられたかを調べている。伝承には共同体が指導者をどのように記憶してきたかが表れ、小説はその記憶を別の読者に伝えた。戦いの経過や生涯を細かくたどる場合には、成立の時期や目的が異なる資料を区別して読む必要がある。 ニジェールがユネスコに提出した暫定一覧表の資料は、マングを歴代のサラウニアの一人に数え、フランスの部隊に抵抗した戦いとルグの戦場跡を結び付けている。資料には歴代のサラウニアの墓、祭祀の場、裁きを行う際に用いられると伝えられる聖なる石も登場する。これらの場所から、称号が戦いの記憶だけでなく、共同体の宗教や裁きの伝統にも関わっていることが分かる。同時代の資料で確かめられる範囲は、マングの生涯や戦闘の各場面によって異なる。ゲームの「ルグの抵抗」は、拠点を失ったあとも戦いを続けるという着想を用いている。領土が残っているときに都市を失うと、兵数上限まで最大1,500の予備兵を動員する。発動は各都市につき一回である。人数と条件はゲームのために定められ、拠点を失った直後の援軍として抵抗を表現する。プレイヤーは領土と兵数を見れば、都市を失ったときに増援を受けられるか判断できる。"
title = "サラウニア・マング"
lang = "ja"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
