[articles.it]
text = "Sarraounia Mangou fu una sovrana della comunità azna di Lougou, nell’attuale Niger. Il titolo di sarraounia indica una carica che esercita un’autorità spirituale nella regione dell’Arewa. La tradizione orale ricorda la sua resistenza alla spedizione francese di Voulet e Chanoine nel 1899. Il romanzo di Abdoulaye Mamani del 1980 portò la vicenda a un pubblico più ampio. La storica Elara Bertho studia il modo in cui la memoria di Lougou, la letteratura e le rielaborazioni successive hanno plasmato l’immagine di Mangou. Il dossier presentato dal Niger all’UNESCO elenca Mangou tra le sovrane di Lougou e collega un campo di battaglia alla sua resistenza alla colonna francese. Descrive anche le tombe delle sarraounia e i luoghi di culto associati alla carica. I documenti contemporanei offrono informazioni diseguali sulla sua vita e sullo svolgimento dello scontro. Lougou resiste porta nel gioco la possibilità di continuare a combattere dopo la perdita di una città. La perdita mobilita fino a 1.500 truppe di riserva entro il limite di truppe, una volta per città finché si possiede territorio."
title = "Sarraounia Mangou"
lang = "it"
