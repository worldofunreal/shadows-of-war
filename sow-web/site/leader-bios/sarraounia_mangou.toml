[articles.pt-BR]
text = "Mangou governou a comunidade azna de Lougou, no atual Níger. Sarraounia é o título de uma autoridade com função espiritual na região de Arewa. A tradição oral local preserva a memória de sua resistência à expedição francesa de Voulet e Chanoine em 1899. O romance de Abdoulaye Mamani, publicado em 1980, levou a história a um público mais amplo. A historiadora Elara Bertho examina como a memória de Lougou, a literatura e versões posteriores moldaram a imagem de Mangou. O dossiê de Lougou apresentado pelo Níger à UNESCO cita Mangou entre as governantes e associa um campo de batalha local à resistência à coluna francesa. O documento também descreve os túmulos das sarraounias e os lugares de culto ligados ao cargo. Os registros da época documentam de modo desigual a vida de Mangou e os detalhes do confronto. Lougou resiste leva ao jogo a possibilidade de continuar lutando após a perda de uma cidade. A perda mobiliza até 1.500 tropas de reserva dentro do limite de tropas, uma vez por cidade enquanto o jogador ainda tiver território."
title = "Sarraounia Mangou"
lang = "pt-BR"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
