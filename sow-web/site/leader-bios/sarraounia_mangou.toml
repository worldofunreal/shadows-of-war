[articles.ar]
text = "كانت مانغو حاكمة لجماعة أزنا في لوغو، في النيجر الحالية. وساراونيا لقب لمنصب يؤدي دوراً روحياً في منطقة أريوا. وتحتفظ الذاكرة الشفوية المحلية بقصة مقاومتها الحملة الفرنسية بقيادة فولي وشانوان عام 1899. وعرفت القصة جمهوراً أوسع بعد نشر رواية عبد الله ماماني عام 1980. وتدرس المؤرخة إيلارا بيرتو كيف ساهمت ذاكرة لوغو والأدب والروايات اللاحقة في تشكيل صورة مانغو. يذكر ملف لوغو الذي قدمته النيجر إلى اليونسكو مانغو بين حاكمات البلدة، ويربط موقع معركة بمقاومتها الحملة الفرنسية. كما يصف مقابر حاملات اللقب وأماكن العبادة المرتبطة به. وتختلف وفرة الشواهد المعاصرة من جانب إلى آخر من حياتها ومن تفاصيل المواجهة. وتجسد قدرة «صمود لوغو» استمرار القتال بعد خسارة مدينة. تؤدي الخسارة إلى حشد ما يصل إلى 1500 جندي احتياط ضمن سقف القوات، مرة واحدة لكل مدينة، ما دام اللاعب يحتفظ بأرض."
title = "ساراونيا مانغو"
lang = "ar"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
