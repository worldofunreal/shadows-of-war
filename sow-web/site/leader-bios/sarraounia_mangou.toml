[articles.en]
text = "Sarraounia Mangou was the title-bearing ruler associated with the Azna community of Lougou in present-day Niger. Her resistance to the French Voulet–Chanoine mission in 1899 is preserved in local oral accounts and became nationally known through Abdoulaye Mamani’s 1980 novel. Historian Elara Bertho traces how oral memory, literature, and later retellings shaped the account; details of Sarraounia’s life and the battle are not equally well documented in contemporary records. Niger’s UNESCO tentative-list description identifies Mangou among Lougou’s ruling Sarraounia and associates her with opposition to the French column. The site preserves the community’s own account of its rulers and the battle landscape. The record should be read with care: Bertho notes that the modern image of the warrior queen was strongly shaped by oral tradition and literature, rather than a large surviving archive. Lougou Holds On represents the community continuing to resist after the loss of its settlement. Losing a city mobilizes 1,500 reserve troops once for that city, within the troop cap and only while the player retains territory. Neither that number nor a particular evacuation tactic is claimed as an established historical fact."
title = "Sarraounia Mangou"
lang = "en"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
