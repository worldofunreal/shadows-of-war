[articles.es]
text = "Sarraounia Mangou fue una gobernante de la comunidad azna de Lougou, en el actual Níger. Sarraounia es el título de una autoridad que desempeña un papel espiritual en la región de Arewa. La memoria oral local conserva su resistencia a la expedición francesa de Voulet y Chanoine en 1899. La novela de Abdoulaye Mamani, publicada en 1980, dio a conocer la historia a un público más amplio. La historiadora Elara Bertho estudia cómo esa imagen de Mangou tomó forma en la memoria de Lougou, en la literatura y en sus recreaciones posteriores. El expediente patrimonial presentado por Níger a la UNESCO incluye a Mangou entre las gobernantes de Lougou y asocia un campo de batalla local con su resistencia a la columna francesa. También recoge las tumbas de las sarraounia y los lugares de culto vinculados al cargo. La documentación contemporánea ofrece información desigual sobre su vida y sobre los detalles del enfrentamiento. Lougou resiste lleva a la partida la posibilidad de seguir luchando después de perder una ciudad. La pérdida moviliza hasta 1.500 tropas de reserva sin superar el límite de tropas, una vez por ciudad y mientras la jugadora conserve territorio."
title = "Sarraounia Mangou"
lang = "es"
