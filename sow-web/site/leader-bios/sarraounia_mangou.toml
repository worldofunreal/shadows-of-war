[articles.de]
text = "Sarraounia Mangou war eine Herrscherin der Azna-Gemeinschaft von Lougou im heutigen Niger. Der Titel Sarraounia bezeichnet ein Amt mit religiöser Autorität in der Region Arewa. Die örtliche mündliche Überlieferung erinnert an ihren Widerstand gegen die französische Expedition von Voulet und Chanoine im Jahr 1899. Abdoulaye Mamanis Roman von 1980 machte die Geschichte einem breiteren Publikum bekannt. Die Historikerin Elara Bertho untersucht, wie das Gedächtnis von Lougou, Literatur und spätere Bearbeitungen das Bild von Mangou prägten. In den Unterlagen, die Niger bei der UNESCO einreichte, erscheint Mangou unter den Herrscherinnen von Lougou. Ein örtliches Schlachtfeld wird mit ihrem Widerstand verbunden. Das Dossier nennt auch die Gräber der Sarraounias und die Kultstätten des Amtes. Zeitgenössische Zeugnisse geben nur ungleichmäßig Auskunft über ihr Leben und den Ablauf des Kampfes. Lougou hält stand überträgt den fortgesetzten Widerstand nach einem Stadtverlust ins Spiel. Der Verlust mobilisiert bis zu 1.500 Reservetruppen, höchstens bis zum Truppenlimit. Das geschieht einmal je Stadt, solange man noch Gebiet besitzt."
title = "Sarraounia Mangou"
lang = "de"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
