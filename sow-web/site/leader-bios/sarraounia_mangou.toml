[articles.fil]
text = "Si Mangou ay pinuno ng pamayanang Azna sa Lougou, sa Niger ngayon. Ang sarraounia ay titulo ng isang pinunong may tungkuling espirituwal sa rehiyon ng Arewa. Nasa lokal na tradisyong pasalita ang paglaban niya sa ekspedisyong Pranses nina Voulet at Chanoine noong 1899. Lumawak ang pagkakakilala sa kuwento nang ilathala ang nobela ni Abdoulaye Mamani noong 1980. Sinusuri ng historyador na si Elara Bertho kung paano nahubog ang larawan ni Mangou sa alaala ng Lougou, sa panitikan, at sa mga sumunod na pagsasalaysay. Binabanggit sa dokumentong inihain ng Niger sa UNESCO si Mangou bilang isa sa mga pinuno ng Lougou. Iniuugnay nito ang isang lugar ng labanan sa paglaban niya sa hukbong Pranses at inilalarawan din ang mga libingan at sambahan na kaugnay ng tungkulin. Magkakaiba ang saklaw ng mga tala noong panahong iyon tungkol sa kaniyang buhay at sa labanan. Isinasadula ng Paglaban ng Lougou ang pagpapatuloy ng laban matapos mawalan ng lungsod. Magpapakilos ang pagkawala ng hanggang 1,500 reserbang kawal ayon sa limitasyon ng hukbo, isang beses bawat lungsod habang may lupain pa ang manlalaro."
title = "Sarraounia Mangou"
lang = "fil"
url = "https://thalim.cnrs.fr/publications-et-productions/articles/sarraounia-une-reine-africaine-entre-histoire-et-mythe-litteraire-niger-1899-2010/"
