[articles.de]
text = "Veleda war eine Seherin der Brukterer, die östlich des Niederrheins lebten. Tacitus, die wichtigste erhaltene Quelle, berichtet, ihre Verbündeten hätten ihr die Vorhersage der Siege über römische Legionen im Bataveraufstand von 69 bis 70 n. Chr. zugeschrieben. Er beschreibt auch ihre politische Autorität. Als Köln und die Tenkterer eine Einigung aushandelten, wählten sie Civilis und Veleda als Schiedsrichter. Dem Bericht zufolge blieb Veleda in einem Turm, während ein Verwandter Fragen und Antworten übermittelte. Die römische Sicht des Tacitus begrenzt, was über Veledas religiöse Praxis und ihre Entscheidungen bekannt ist. Tacitus berichtet, der gefangene römische Befehlshaber Munius Lupercus sei zu Veleda geschickt worden und auf dem Weg getötet worden. In einer anderen Episode erbeuteten die Aufständischen ein römisches Kommandoschiff und schleppten es über die Lippe als Geschenk zu ihr. Der Archäologe Andres Siegfried Dobat untersucht die rituelle und öffentliche Bedeutung der Beute. Prise vom Rhein greift diese Episode auf. Ein von deinen Schiffsgeschossen besiegtes feindliches Kriegsschiff wechselt mit 25 Prozent Gesundheit und ohne Veteranenrang auf deine Seite."
title = "Veleda"
lang = "de"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
shortArticle = true
