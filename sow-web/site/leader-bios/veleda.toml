[articles.vi]
text = "Veleda là nữ tiên tri của người Bructeri sống phía đông hạ lưu sông Rhine. Tacitus, nguồn chính còn lưu lại về bà, kể rằng các đồng minh tin bà đã báo trước chiến thắng trước quân đoàn La Mã trong cuộc nổi dậy Batavia năm 69–70 CN. Ông cũng ghi nhận uy quyền chính trị của bà. Khi Cologne và người Tencteri thương lượng, hai bên chọn Civilis và Veleda làm trọng tài. Theo lời kể, bà ở trong tháp và một người thân chuyển câu hỏi cùng lời đáp. Góc nhìn La Mã của Tacitus giới hạn những gì có thể biết về tín ngưỡng và các quyết định của bà. Tacitus kể rằng chỉ huy La Mã Munius Lupercus bị bắt, được gửi đến Veleda và bị giết trước khi đến nơi. Trong một sự kiện khác, quân nổi dậy bắt được tàu chỉ huy La Mã và kéo nó ngược dòng Lippe để tặng bà. Nhà khảo cổ Andres Siegfried Dobat nghiên cứu ý nghĩa nghi lễ và công khai của chiến lợi phẩm. Chiến hạm sông Rhine đưa câu chuyện đó vào trận đấu. Đạn hải quân đánh bại chiến hạm địch sẽ bắt giữ nó, và tàu đổi phe với 25% máu và không có kinh nghiệm."
title = "Veleda"
lang = "vi"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
shortArticle = true
intro = ["Veleda là nữ tiên tri của người Bructeri sống phía đông hạ lưu sông Rhine. Tacitus, nguồn chính còn lưu lại về bà, kể rằng các đồng minh tin bà đã báo trước chiến thắng trước quân đoàn La Mã trong cuộc nổi dậy Batavia năm 69–70 CN. Ông cũng ghi nhận uy quyền chính trị của bà. Khi Cologne và người Tencteri thương lượng, hai bên chọn Civilis và Veleda làm trọng tài. Theo lời kể, bà ở trong tháp và một người thân chuyển câu hỏi cùng lời đáp. Góc nhìn La Mã của Tacitus giới hạn những gì có thể biết về tín ngưỡng và các quyết định của bà."]
sections = [{ title = "Uy quyền của Veleda trong cuộc nổi dậy Batavia", paragraphs = ["Tacitus kể rằng chỉ huy La Mã Munius Lupercus bị bắt, được gửi đến Veleda và bị giết trước khi đến nơi. Trong một sự kiện khác, quân nổi dậy bắt được tàu chỉ huy La Mã và kéo nó ngược dòng Lippe để tặng bà. Nhà khảo cổ Andres Siegfried Dobat nghiên cứu ý nghĩa nghi lễ và công khai của chiến lợi phẩm. Chiến hạm sông Rhine đưa câu chuyện đó vào trận đấu. Đạn hải quân đánh bại chiến hạm địch sẽ bắt giữ nó, và tàu đổi phe với 25% máu và không có kinh nghiệm."] }]
sources = [{ title = "Tacitus, Histories 4.61 and 4.65, MIT Internet Classics Archive", url = "https://classics.mit.edu/Tacitus/histories.4.iv.html" }, { title = "Tacitus, Histories 5.22, MIT Internet Classics Archive", url = "https://classics.mit.edu/Tacitus/histories.5.v.html" }, { title = "Andres Siegfried Dobat, “A Gift to Veleda,” Kuml, Aarhus University", url = "https://doi.org/10.7146/kuml.v58i58.26392" }]

[articles.id]
text = "Veleda adalah peramal perempuan dari suku Brukteri yang tinggal di timur hilir Rhein. Tacitus, sumber utama tentang dirinya yang masih bertahan, mencatat bahwa para sekutunya percaya ia meramalkan kemenangan atas legiun Romawi dalam pemberontakan Batavia pada 69–70 M. Tacitus juga mencatat wewenangnya dalam perundingan. Ketika Köln dan Tencteri merundingkan kesepakatan, mereka memilih Civilis dan Veleda sebagai penengah. Menurut kisah itu, Veleda tinggal di menara, sementara seorang kerabat menyampaikan pertanyaan dan jawabannya. Sudut pandang Romawi Tacitus membatasi apa yang dapat diketahui tentang kepercayaan dan keputusan Veleda. Tacitus menuturkan bahwa komandan Romawi yang ditawan, Munius Lupercus, dikirim kepada Veleda dan terbunuh sebelum tiba. Dalam kejadian lain, pemberontak merebut kapal komando Romawi dan menariknya ke hulu Sungai Lippe sebagai hadiah untuk Veleda. Arkeolog Andres Siegfried Dobat mengkaji makna ritual dan publik rampasan perang itu. Rampasan Rhein mengadaptasi kisah tersebut. Kapal perang musuh yang dikalahkan oleh peluru kapalmu beralih ke pihakmu dengan 25% kesehatan dan tanpa pengalaman."
