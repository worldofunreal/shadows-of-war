[articles.fr]
text = "Veleda était une prophétesse des Bructères, établis à l’est du Rhin inférieur. Tacite, la principale source conservée, rapporte que ses alliés lui attribuaient la prédiction de leurs victoires sur les légions romaines pendant la révolte batave de 69–70 apr. J.-C. Il lui reconnaît aussi une autorité politique. Lorsque Cologne et les Tenctères négocièrent un accord, ils choisirent Civilis et Veleda comme arbitres. Selon le récit, elle resta dans une tour tandis qu’un parent transmettait les questions et les réponses. Le regard romain de Tacite limite ce que l’on sait de ses pratiques religieuses et de ses décisions. Tacite relate que le commandant romain captif Munius Lupercus fut envoyé à Veleda et fut tué avant d’arriver. Lors d’un autre épisode, les rebelles s’emparèrent d’un navire de commandement romain et le remorquèrent sur la Lippe pour le lui offrir. L’archéologue Andres Siegfried Dobat étudie la portée rituelle et publique du butin. Prise du Rhin adapte cet épisode dans le jeu. Si vos obus navals battent un navire de guerre ennemi, il passe dans votre camp avec 25% de santé et sans expérience."
title = "Veleda"
lang = "fr"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
shortArticle = true
intro = ["Veleda était une prophétesse des Bructères, établis à l’est du Rhin inférieur. Tacite, la principale source conservée, rapporte que ses alliés lui attribuaient la prédiction de leurs victoires sur les légions romaines pendant la révolte batave de 69–70 apr. J.-C. Il lui reconnaît aussi une autorité politique. Lorsque Cologne et les Tenctères négocièrent un accord, ils choisirent Civilis et Veleda comme arbitres. Selon le récit, elle resta dans une tour tandis qu’un parent transmettait les questions et les réponses. Le regard romain de Tacite limite ce que l’on sait de ses pratiques religieuses et de ses décisions."]
