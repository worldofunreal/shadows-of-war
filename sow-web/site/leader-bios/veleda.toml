[articles.es]
text = "Veleda fue una profetisa de los brúcteros, un pueblo situado al este del bajo Rin. Tácito, la principal fuente conservada sobre ella, dice que sus aliados le atribuían haber previsto sus victorias sobre las legiones romanas en la revuelta bátava de 69–70 d. C. También la presenta como autoridad política. Cuando Colonia y los téncteros negociaron un acuerdo, eligieron a Civilis y Veleda como árbitros. Según el relato, Veleda permaneció en una torre y un pariente llevó las preguntas y las respuestas. Tácito escribió desde una perspectiva romana, lo que limita cuánto sabemos de la práctica religiosa y de las decisiones de Veleda. Tácito relata que enviaron a Veleda al comandante romano capturado Munio Luperco, que fue asesinado antes de llegar. En otro episodio, los rebeldes se apoderaron de una nave de mando romana y la remolcaron por el río Lippe como regalo para ella. El arqueólogo Andres Siegfried Dobat estudia el valor ritual y público que podía tener el botín. Presa del Rin adapta ese episodio a la partida. Si tus proyectiles navales derrotan un barco de guerra enemigo, lo capturan con el 25% de su vida y sin veteranía."
title = "Veleda"
lang = "es"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
shortArticle = true
intro = ["Veleda fue una profetisa de los brúcteros, un pueblo situado al este del bajo Rin. Tácito, la principal fuente conservada sobre ella, dice que sus aliados le atribuían haber previsto sus victorias sobre las legiones romanas en la revuelta bátava de 69–70 d. C. También la presenta como autoridad política. Cuando Colonia y los téncteros negociaron un acuerdo, eligieron a Civilis y Veleda como árbitros. Según el relato, Veleda permaneció en una torre y un pariente llevó las preguntas y las respuestas. Tácito escribió desde una perspectiva romana, lo que limita cuánto sabemos de la práctica religiosa y de las decisiones de Veleda."]
sections = [{ title = "La autoridad de Veleda durante la revuelta bátava", paragraphs = ["Tácito relata que enviaron a Veleda al comandante romano capturado Munio Luperco, que fue asesinado antes de llegar. En otro episodio, los rebeldes se apoderaron de una nave de mando romana y la remolcaron por el río Lippe como regalo para ella. El arqueólogo Andres Siegfried Dobat estudia el valor ritual y público que podía tener el botín. Presa del Rin adapta ese episodio a la partida. Si tus proyectiles navales derrotan un barco de guerra enemigo, lo capturan con el 25% de su vida y sin veteranía."] }]
