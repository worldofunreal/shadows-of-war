[articles.pt-BR]
text = "Veleda era uma profetisa dos brúcteros, povo que vivia a leste do baixo Reno. Tácito, a principal fonte preservada sobre ela, relata que seus aliados acreditavam que Veleda havia previsto as vitórias sobre as legiões romanas durante a revolta batava de 69–70 d.C. Ele também descreve sua autoridade política. Quando Colônia e os téncteros negociaram um acordo, escolheram Civilis e Veleda como árbitros. Segundo o relato, ela ficou numa torre enquanto um parente levava perguntas e respostas. A perspectiva romana de Tácito limita o que se pode saber sobre as crenças e decisões de Veleda. Tácito relata que o comandante romano capturado Múnio Luperco foi enviado a Veleda e morto antes de chegar. Em outro episódio, os rebeldes tomaram um navio de comando romano e o rebocaram pelo rio Lippe como presente para ela. O arqueólogo Andres Siegfried Dobat estuda o significado ritual e público dos espólios. Presa do Reno adapta esse episódio ao jogo. Se seus projéteis navais derrotarem um navio de guerra inimigo, ele muda de lado com 25% de vida e sem veterania."
