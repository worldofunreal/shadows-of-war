[articles.en]
text = "Veleda was a prophetess of the Bructeri, a people living east of the lower Rhine. Tacitus, the principal surviving source for her, says she had exceptional authority and that German allies credited her with predicting their victories over Roman legions during the Batavian revolt of 69–70 CE. After rebel successes, a captured Roman commander and the flagship of the Rhine fleet were reportedly sent to her. Tacitus wrote from a Roman perspective, so his account does not provide a transparent record of Bructeri beliefs or Veleda’s personal role in military planning. Tacitus also describes Veleda as a political authority: when Cologne and the Tencteri negotiated a compact, they chose Civilis and Veleda as arbiters. She did not meet the envoys directly; a relative carried questions and answers from her tower. Archaeologist Andres Siegfried Dobat examines these reports as evidence of the ritual and public meaning attached to war booty. Prize of the Rhine draws on the reported presentation of a captured Roman flagship to Veleda. A warship defeated by her side’s naval gunfire is taken as a damaged prize rather than sunk. This is a representation of naval booty associated with her authority; it does not claim that she personally commanded a fleet or that the ancient vessel used modern naval shells."
title = "Veleda"
lang = "en"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
shortArticle = true
