[articles.ar]
text = "كانت فيلدا عرّافة من البروكتيريين الذين عاشوا شرقي نهر الراين الأدنى. ويقول تاسيتوس، وهو أهم مصدر باقٍ عنها، إن حلفاءها نسبوا إليها توقع انتصاراتهم على الفيالق الرومانية خلال الثورة الباتافية في عامي 69 و70 للميلاد. ويذكر لها أيضاً دوراً سياسياً. فعندما تفاوضت كولونيا وشعب التنكتيري على اتفاق، اختار الطرفان سيفيليس وفيلدا للتحكيم. وبحسب الرواية، بقيت فيلدا في برج وكان أحد أقاربها ينقل الأسئلة والأجوبة. وتحد نظرة تاسيتوس الرومانية مما يمكن معرفته عن معتقدات شعبها وعن قراراتها. يذكر تاسيتوس أن القائد الروماني الأسير مونيوس لوبيركوس أُرسل إلى فيلدا وقُتل قبل أن يصل. وفي حادثة أخرى استولى المتمردون على سفينة قيادة رومانية وجروها في نهر ليبه لتقديمها هدية لها. ويدرس عالم الآثار أندريس زيغفريد دوبات المعنى الطقسي والعلني للغنائم. وتستلهم قدرة «غنيمة الراين» تلك الحادثة. إذا هزمت قذائفك البحرية سفينة حربية معادية، تنضم إلى جانبك بصحة 25% ودون خبرة قتالية."
title = "فيلدا"
lang = "ar"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
