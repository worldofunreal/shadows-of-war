[articles.ko]
text = "벨레다는 라인강 하류 동쪽에 살던 브룩테리족의 예언자였다. 그녀에 관해 남아 있는 주요 기록은 로마 역사학자 타키투스가 썼다. 그는 69~70년 바타비아 반란에서 동맹 세력이 로마 군단을 이겼을 때, 사람들이 벨레다가 승리를 예언했다고 믿었다고 기록했다. 정치적 교섭에서의 역할도 전한다. 쾰른과 텡크테리족이 협정을 논의할 때 양측은 키빌리스와 벨레다를 중재자로 골랐다. 벨레다가 탑에 머무르는 동안 친족이 사절의 질문과 그녀의 답을 전했다고 한다. 이 이야기는 벨레다의 권위가 종교적 역할과 함께 협정에도 영향을 미쳤음을 보여 준다. 타키투스는 로마의 관점에서 글을 썼기 때문에 브룩테리족의 종교 관행이나 벨레다가 작전에 관여한 범위는 남은 기록만으로 알기 어렵다. 타키투스는 포로가 된 로마 군단장 무니우스 루페르쿠스가 벨레다에게 보내졌으나 도착하기 전에 살해됐다고 썼다. 다른 대목에서 반란군은 로마 지휘관의 배를 빼앗아 선물로 주기 위해 리페강 상류로 끌고 갔다. 고고학자 안드레스 지크프리트 도바트는 이런 사례에서 전리품이 의례와 공개 행사에서 지녔을 의미를 살폈다. 게임의 ‘라인강의 포획선’은 빼앗은 배를 벨레다에게 보냈다는 이야기를 바탕으로 한다. 아군 함포가 적 군함을 격파하면 군함은 가라앉는 대신 포획된다. 체력은 25%가 되고 숙련도는 초기화된 채 아군으로 바뀐다. 체력과 숙련도는 소유자가 바뀐 직후의 배를 표현하는 게임 규칙이다. 기록에서 선물로 보내졌던 배를 게임에서는 새로운 아군 함선으로 사용한다."
title = "벨레다"
lang = "ko"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
