[articles.ja]
text = "ウェレダは、ライン川下流の東に住んだブルクテリ人の予言者だった。彼女についての主な記録を残したのはローマの歴史家タキトゥスである。69年から70年にかけてのバタウィ人の反乱で、同盟した人々はローマ軍団への勝利をウェレダが予言したと考えたという。タキトゥスは政治交渉での役割も記している。ケルンとテンクテリ人が協定を結ぶ際、双方はキウィリスとウェレダを仲裁役に選んだ。ウェレダは塔にとどまり、使者の質問と彼女の返答を親族が運んだとされる。使者が直接会わずに交渉したという記述からも、彼女が特別な地位にあったことがうかがえる。タキトゥスはローマ側の著述家であり、ブルクテリ人の信仰やウェレダが作戦にどこまで関わったかには、資料から判断しにくい部分がある。 タキトゥスは、捕虜となったローマの軍団長ムニウス・ルペルクスがウェレダのもとへ送られ、到着前に殺されたと記す。別の場面では、反乱側がローマ軍の指揮官の船を奪い、贈り物としてリッペ川を上流に曳いた。襲撃は夜に起き、指揮官ケリアリスはその晩は船にいなかった。二つの記事は同じ人物のもとに捕虜と船を送ろうとした経緯を伝えている。考古学者アンドレス・ジークフリート・ドバットは、こうした記述から戦利品が儀礼や公の場で持った意味を検討している。ゲームの「ライン川の鹵獲船」は、奪った船がウェレダに贈られたという話に着想を得た。艦砲で敵軍艦を撃破すると、船は沈没の代わりに鹵獲され、耐久力が四分の一で熟練度のない状態で味方になる。船の損傷と熟練度は、艦が持ち主を変えた直後の状態を示すゲームの取り決めである。文献では船が贈り物として扱われ、ゲームではその戦利品を自軍の艦として使う。"
title = "ウェレダ"
lang = "ja"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
