[articles.ru]
text = "Веледа была пророчицей бруктеров, народа к востоку от нижнего Рейна. Тацит, главный сохранившийся источник о ней, сообщает, что союзники приписывали ей предсказание побед над римскими легионами в восстании батавов в 69–70 годах н. э. Он описывает и её политический авторитет. Когда Кёльн и тенктеры договаривались об условиях соглашения, посредниками выбрали Цивилиса и Веледу. По его рассказу, Веледа оставалась в башне, а родственник передавал вопросы и ответы. Римская точка зрения Тацита ограничивает наши сведения о её верованиях и решениях. Тацит рассказывает, что пленённого римского командира Муния Луперка отправили к Веледе и убили по дороге. В другом эпизоде восставшие захватили римский командный корабль и повели его вверх по Липпе в дар Веледе. Археолог Андрес Зигфрид Добат рассматривает обрядовое и публичное значение военной добычи. «Рейнский трофей» переносит этот эпизод в игру. Вражеский боевой корабль, побеждённый вашими корабельными снарядами, переходит на вашу сторону с 25% здоровья и без ветеранского опыта."
title = "Веледа"
lang = "ru"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
