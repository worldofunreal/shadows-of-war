[articles.tr]
text = "Veleda, Aşağı Ren’in doğusunda yaşayan Brukterlerin kâhiniydi. Başlıca kaynak olan Tacitus, müttefiklerinin MS 69–70 Batav isyanında Roma lejyonlarına karşı kazanılan zaferleri Veleda’nın önceden bildirdiğine inandığını yazar. Onu siyasi bir otorite olarak da anlatır. Köln ve Tenkterler bir anlaşma görüşürken Civilis ile Veleda’yı hakem seçti. Tacitus’a göre Veleda bir kulede kaldı ve bir akrabası sorularla yanıtları taşıdı. Tacitus’un Roma’dan bakışı, Veleda’nın dinî uygulamaları ve kendi kararları hakkında öğrenebildiklerimizi sınırlar. Tacitus, esir alınan Romalı komutan Munius Lupercus’un Veleda’ya gönderildiğini ve ulaşamadan öldürüldüğünü aktarır. Başka bir olayda isyancılar bir Roma komuta gemisini ele geçirip Veleda’ya armağan olarak Lippe Nehri’nden yukarı çektiler. Arkeolog Andres Siegfried Dobat, ganimetin törensel ve kamusal anlamını inceler. Ren Ganimeti bu olayı oyuna uyarlar. Gemi mermilerinle yendiğin bir düşman savaş gemisi yüzde 25 canla ve kıdemsiz olarak tarafına geçer."
title = "Veleda"
lang = "tr"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
shortArticle = true
intro = ["Veleda, Aşağı Ren’in doğusunda yaşayan Brukterlerin kâhiniydi. Başlıca kaynak olan Tacitus, müttefiklerinin MS 69–70 Batav isyanında Roma lejyonlarına karşı kazanılan zaferleri Veleda’nın önceden bildirdiğine inandığını yazar. Onu siyasi bir otorite olarak da anlatır. Köln ve Tenkterler bir anlaşma görüşürken Civilis ile Veleda’yı hakem seçti. Tacitus’a göre Veleda bir kulede kaldı ve bir akrabası sorularla yanıtları taşıdı. Tacitus’un Roma’dan bakışı, Veleda’nın dinî uygulamaları ve kendi kararları hakkında öğrenebildiklerimizi sınırlar."]
