[articles.it]
text = "Veleda era una profetessa dei Bructeri, un popolo stanziato a est del basso Reno. Tacito, la principale fonte conservata, racconta che gli alleati le attribuivano la previsione delle vittorie sulle legioni romane durante la rivolta batava del 69–70 d.C. La descrive anche come autorità politica. Quando Colonia e i Tencteri negoziarono un accordo, scelsero Civilis e Veleda come arbitri. Secondo il racconto, Veleda rimase in una torre mentre un parente portava domande e risposte. La prospettiva romana di Tacito limita ciò che sappiamo delle sue pratiche religiose e delle sue decisioni. Tacito racconta che il comandante romano prigioniero Munio Luperco fu inviato a Veleda e fu ucciso prima di arrivare. In un altro episodio, i ribelli catturarono una nave di comando romana e la trainarono lungo la Lippe per donargliela. L’archeologo Andres Siegfried Dobat esamina il significato rituale e pubblico del bottino. Preda del Reno adatta l’episodio al gioco. Una nave da guerra nemica sconfitta dai tuoi proiettili navali cambia schieramento con il 25% di salute e senza esperienza."
title = "Veleda"
lang = "it"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
