[articles.fil]
text = "Si Veleda ay isang babaeng propeta ng mga Bructeri na nanirahan sa silangan ng ibabang Rhine. Ayon kay Tacitus, ang pangunahing natitirang sanggunian tungkol sa kaniya, naniwala ang kaniyang mga kakampi na nahulaan niya ang kanilang mga tagumpay laban sa mga lehiyong Romano sa pag-aalsa ng mga Batavi noong 69–70 CE. Isinalaysay rin ni Tacitus ang papel niya sa politika. Nang mag-usap ang Cologne at mga Tencteri para sa isang kasunduan, pinili nila sina Civilis at Veleda bilang mga tagapamagitan. Nasa tore raw si Veleda at isang kamag-anak ang naghatid ng mga tanong at sagot. Mula sa pananaw Romano ang salaysay ni Tacitus, kaya limitado ang nalalaman tungkol sa mga paniniwala at pasiya ni Veleda. Isinalaysay ni Tacitus na ipinadala kay Veleda ang nabihag na kumander na si Munius Lupercus at pinatay siya bago makarating. Sa ibang pangyayari, nasamsam ng mga rebelde ang isang barkong pangkomando ng Roma at hinila ito paakyat sa Ilog Lippe bilang regalo kay Veleda. Sinuri ng arkeologong si Andres Siegfried Dobat ang papel ng nasamsam sa ritwal at sa harap ng publiko. Hango rito ang Bihag ng Rhine. Kapag natalo ng iyong kanyon ang barkong pandigma ng kaaway, lilipat ito sa iyong panig na may 25% kalusugan at walang karanasan."
