[articles.zh-CN]
text = "维莱达是布鲁克特里人的女预言者。这个群体生活在莱茵河下游以东。关于她的主要传世文字来自罗马史家塔西佗。公元69至70年的巴塔维起义中，参与反抗的群体击败了罗马军团。塔西佗说，维莱达的盟友认为她预见了这些胜利。他也记录了她在政治交涉中发挥的作用。当科隆与滕克特里人商议协定时，双方选定西维利斯与维莱达作为仲裁者。塔西佗笔下的维莱达住在一座塔中，由亲属转达使者提出的问题和她的答复。使者通过中间人同她交涉，说明她的权威也体现在协定如何达成。塔西佗从罗马的立场记述这场起义。他的作品保存了许多关于交涉和作战的线索，但布鲁克特里人自身的宗教实践以及维莱达参与军事决策的程度仍难以确定。 塔西佗记述了两件送给维莱达的战利品。被俘的罗马军团指挥官穆尼乌斯·卢佩尔库斯被送往她那里，但途中遇害。另一次，反抗者夺得罗马指挥官的船，把它沿利珀河拖往上游，作为礼物送给维莱达。夺船发生在一次夜间袭击中。船上的罗马指挥官凯里亚利斯当晚在别处，因而没有随船被俘。按照这段叙事，起义者在白天带着缴获的船只返回。塔西佗在不同段落记载了俘虏、礼物和协定，这些记载可以一起用来考察她在起义中的地位。考古学家安德烈斯·齐格弗里德·多巴特从这些事件出发，研究战利品在礼仪和公开展示中可能具有的意义。游戏中的「莱茵河的战利舰」取材于缴获船只之后把它交给维莱达的故事。你的舰炮击败敌方战舰时，该舰会被俘获并加入己方。它保留四分之一的生命值，老兵经验清零。受损的战舰可以被留在己方舰队中，捕获过程以游戏的舰炮交战来表现。史书把战利品交到维莱达名下，游戏则将这一联系直接变成她麾下舰队的能力。战舰的耐久和经验是游戏里的规则，用于表示易手后的状态。"
title = "维莱达"
lang = "zh-CN"
url = "https://classics.mit.edu/Tacitus/histories.4.iv.html"
