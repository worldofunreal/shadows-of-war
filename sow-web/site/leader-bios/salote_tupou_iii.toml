[articles.en]
text = "Sālote Tupou III was Queen of Tonga from 1918 to her death in 1965. She reigned for nearly 48 years, the longest of any Tongan monarch."
title = "Sālote Tupou III"
lang = "en"
url = "https://en.wikipedia.org/wiki/S%C4%81lote_Tupou_III"
intro = [
  "Sālote Tupou III (born Sālote Mafileʻo Pilolevu; 13 March 1900 – 16 December 1965) was Queen of Tonga from 1918 to her death in 1965. She reigned for nearly 48 years, the longest of any Tongan monarch. Her rule of Tonga has been characterized as a golden age for Tonga. She was well known for her height, being 6 ft 3 in (191 cm) tall in her prime.",
]
sections = [
  { "title" = "Early life and education", "paragraphs" = [
      "Sālote (Charlotte) was born on 13 March 1900 in Tonga as the eldest daughter and heir of King George Tupou II of Tonga and his first wife Queen Lavinia Veiongo. She was baptized and named after her great-grandmother Sālote Mafileʻo Pilolevu (daughter of George Tupou I). The young princess was the source of some hostility due to the nature of her parents' marriage.",
      "Her mother, Queen Lavinia, died from tuberculosis on 24 April 1902. After her death, the Chiefs in Tonga urged King George Tupou II for many years to remarry to produce a male heir. On 11 November 1909, when the King finally married the 16-year-old ʻAnaseini Takipō (half-sister of the rejected candidate ʻOfakivavaʻu from the first search of a wife for the King), the chiefs were jubilant. Queen Anaseni gave birth twice, both girls: Princess ʻOnelua (born 20 March 1911; died of convulsions aged six months, on 19 August 1911) and Princess ʻElisiva Fusipala Taukiʻonetuku (born 26 July 1912; died from tubercular peritonitis on 21 April 1933 aged 20).",
      "Tongan tradition allowed offspring from previous marriages to be killed. In order to protect her, the King sent Sālote away to Auckland in December 1909. She stayed with a family called Kronfeld and would maintain this connection throughout her life. She was educated for five years in New Zealand.",
    ] },
  { "title" = "Marriage", "paragraphs" = [
      "In 1917, Sālote married Viliami Tungī Mailefihi, an adult noble then 30 years old, 13 years her senior. Her marriage had been a political masterstroke by her father, as Tungī was a direct descendant of the Tuʻi Haʻatakalaua. Their children, therefore, would combine the blood of the three grand royal dynasties in Tonga. At the age of 18, she became a mother for the first time. Her children were:",
      "King Tāufaʻāhau Tupou IV, born Crown Prince Siaosi Tāufaʻāhau Tupoulahi (4 July 1918 – 10 September 2006);",
      "Prince Sione Ngū Manumataongo, later the 5th Tuʻipelehake (Fatafehi) (7 January 1922 – 10 April 1999).",
    ] },
  { "title" = "Reign", "paragraphs" = [
      "Sālote was proclaimed Queen on 6 April 1918, following her father's death from tuberculosis the previous day.",
      "In 1920–1921, she assisted the Bernice P. Bishop Museum's Bayard Dominick Expedition with their mapping of Tongan archaeological sites by providing access to localities and information. The expedition's reports on the Tongan past—including a large volume of material which still remains unpublished even today—were primarily compiled by Edward Winslow Gifford and provided the groundwork for comprehensive studies of the pre-contact history of the Tongans (Burley 1998). She was also a keen writer and author of dance songs and love poems, published in 2004, edited by her biographer, Elizabeth Wood-Ellem.",
      "Sālote led Tonga through World War II, with the islands declaring war on Nazi Germany in 1940 and on the Empire of Japan in 1941 following its attack on Pearl Harbor. She put Tonga's resources at the disposal of Britain and supported the Allied cause throughout the war. Tongan troops saw battle against the Japanese in the Solomon Islands campaign, including on Guadalcanal.",
    ] },
  { "title" = "Illness and death", "paragraphs" = [
      "Sālote had a somewhat troubled medical history. She suffered from diabetes, requiring frequent visits to Auckland for treatment. An operation had to be conducted in 1935 to treat her cancer. During tests in Auckland in 1965 a second bout of cancer was found. Despite this, the Queen returned to Tonga in May and even participated in a festival in July 1965 celebrating her record reign. Ten thousand children were allowed to enter the palace grounds and wave at the Queen as she sat on the verandah. This would be the last time the Tongan people saw their Queen.",
      "Queen Sālote died in hospital in Auckland on 16 December 1965 at 12:15 am. Her body was flown back to Tonga by the Royal New Zealand Air Force. The funeral service took place on 23 December with fifty thousand people in attendance. Her body was placed next to her husband and her tomb was guarded for several nights, as per tradition.",
    ] },
]

[articles.es]
text = "Carlota Tupou III​(Sālote Mafile‘o Pilolevu; Nukualofa, 13 de marzo de 1900 - Auckland, 16 de diciembre de 1965) fue reina de Tonga desde el 5 de abril de 1918 hasta su fallecimiento en 1965.​"
title = "Carlota Tupou III de Tonga"
lang = "es"
url = "https://es.wikipedia.org/wiki/Carlota_Tupou_III_de_Tonga"
intro = [
  "Carlota Tupou III​(Sālote Mafile‘o Pilolevu; Nukualofa, 13 de marzo de 1900 - Auckland, 16 de diciembre de 1965) fue reina de Tonga desde el 5 de abril de 1918 hasta su fallecimiento en 1965.​",
]
sections = [
  { "title" = "Primeros años y educación", "paragraphs" = [
      "Salote (castellanizado como Carlota) nació como primogénita del rey Jorge Tupou II y de su primera esposa, la reina Lavinia Veiongo Fotu, el 13 de marzo de 1900. Fue bautizada y nombrada en honor a su bisabuela Carlota Mafile‘o Pilolevu (hija de Jorge Tupou I). No era popular, ya que se la consideraba nacida de la \"madre equivocada\" debido al rango inferior de su madre y le disgustaba tanto que no era seguro para ella salir del palacio.",
      "En diciembre de 1909, Carlota fue enviada a Auckland para comenzar cinco años de educación en Dicesan High School for Girls.​ Después de diciembre de 1914, su padre le ordenó que se quedara en Tonga, ya que la probabilidad de que la reina Anaseni diera a luz a un heredero varón era baja. Más tarde comenzó un curso de instrucción en Historia y Costumbres de Tonga. Su madre, la reina Lavinia, murió de tuberculosis el 25 de abril de 1902. Después de su muerte, los jefes de Tonga instaron al rey Jorge Tupou II durante muchos años a volver a casarse para producir un heredero varón. El 11 de noviembre de 1909, su padre contrajo matrimonio con 'Anaseini Takipō, de 16 años. La reina Anaseni dio a luz dos veces, ambas niñas: la princesa ʻOnelua (nacida el 20 de marzo de 1911; murió de convulsiones a los seis meses, el 19 de agosto de 1911) y la princesa ʻElisiva Fusipala Taukiʻonetuku.",
    ] },
  { "title" = "Matrimonio y descendencia", "paragraphs" = [
      "Se casó con el noble Viliami Tungī Mailefihi, el 19 de septiembre de 1917, ella solo tenía 17 años, mientras que él 28.​ Tungī era hijo del Honorable Siaosi Tuku'aho (Lord Tungi de Tatakamotonga) quien se había desempeñado como primer ministro de Tonga entre 1890 y 1893, y de Lady Mele Siu'ilikutapu, que era la nieta de Tu'i Vava'u. Tuvieron 3 hijosː",
      "Príncipe Siaosi Tāufʻāhau Tupoulahi (1918-2006), que la sucedió como el rey Taufa'ahau Tupou IV.",
      "Príncipe Sione Ngū Manumataongo (1922-1999), que sería nombrado Fatafehi Tu’i Pelehake, e investido como el 5.° Tu'ipelehake.",
    ] },
  { "title" = "Reinado", "paragraphs" = [
      "Carlota asendio al trono de tonga cuando contaba con 18 años y 23 días, por lo que se evitó una regencia, aunque como tal, las regencias no existen en tonga, puesto que por ley el soberano reina el pueblo y las leyes independiente sobre la edad que tenga, aun así, es de aceptación general de los 18 años cumplidos se considera como la mayoría de edad legal.",
      "Su coronación se llevó a cabo el 11 de octubre de 1918 en la Capilla Real; dos días antes había sido investida como la 21.° Tuʻi Kanokupolu, el título tradicional de Tongatapu, proveniente del linaje de los primeros gobernantes de Tonga.​",
      "Tonga se vio afectada por la pandemia de gripe de 1918, con 1800 habitantes de Tonga muertos, alrededor del ocho por ciento de los residentes.​",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "A principios de noviembre de 1965, la reina Carlota fue trasladada en un avión de la RAF a Auckland para recibir tratamiento hospitalario. Un mes después, su estado se agravó y falleció el 16 de diciembre, en el hospital de Aotea. El funeral tuvo lugar el 23 de diciembre en Nukualofa. Más de 200 hombres llevaron el féretro desde el palacio real hasta las tumbas reales de Mala'ekula. La reina Isabel II estuvo representada en la ceremonia por el gobernador general de Nueva Zelanda y las banderas en Londres ondearon a media asta ese día.​",
    ] },
]

[articles.ja]
text = "サローテ（サーロテ）・マフィレオ・ピロレヴ・トゥポウ3世（英: Sālote Mafile‘o Pilolevu Tupou III、1900年3月13日 - 1965年12月16日）は、トンガ女王（在位：1918年 - 1965年）。"
title = "サローテ・トゥポウ3世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%B5%E3%83%AD%E3%83%BC%E3%83%86%E3%83%BB%E3%83%88%E3%82%A5%E3%83%9D%E3%82%A63%E4%B8%96"
intro = [
  "サローテ（サーロテ）・マフィレオ・ピロレヴ・トゥポウ3世（英: Sālote Mafile‘o Pilolevu Tupou III、1900年3月13日 - 1965年12月16日）は、トンガ女王（在位：1918年 - 1965年）。",
]
sections = [
  { "title" = "人物", "paragraphs" = [
      "ジョージ・トゥポウ2世（George Tupou II）と第一夫人ラヴィニア・ヴェイオンゴ・フォトゥ（Lavinia Veiongo Fotu）の子。ファーストネームのサーロテは、シャーロット（Charlotte）のトンガ語における転訛である。ヴィリアミ・トゥンギ・マイレフィヒ（Viliami Tungī Mailefihi）と成婚し、シアオシ・タウファアハウ・トゥポウラヒ（後の国王タウファアハウ・トゥポウ4世）、ウイリアミ・トゥクアホ（Uiliami Tuku‘aho 1919年11月5日 - 1936年4月28日）、シオネ・ング・マヌマタオンゴ（後の首相ファタフェヒ・トゥイペレハケ Fatafehi Tu'i Pelehake、1922年1月7日– 1999年4月10日）の3子をもうけた（ほかに流産が3度）。長い闘病生活の末、1965年にオークランドのアオテア病院にて崩御。長身で知られ、『タイム』誌によると6フィート3インチ (191cm) あった。",
    ] },
  { "title" = "治世", "paragraphs" = [
      "トゥイ・カノクポル Tu'i Kanokupolu朝の第21代当主サローテは、旧都ムア Mu'aのトゥイ・トンガ Tuʻi Tonga朝の末裔らからは不承不承ながら女王に認められた。そのため、治世の初期は自身に対する不信の払拭に腐心した。トゥイ・ハアタカラウア Tuʻi Haʻatakalaua朝の直系の子孫ヴィリアミ・トゥンギ・マイレフィヒとの婚約は、父の卓越した手腕によるものである。夫妻の子女にはトンガの3大王家の血が混淆している。",
      "1920年から翌年には、トンガの史跡マッピングを目的としたバーニス・P・ビショップ博物館のベイヤード・ドミニック探検隊 Bayard Dominick Expeditionにアクセス手段や情報を提供して支援。エドワード・ウィンスロー・ギフォード Edward Winslow Gifford を中心に編纂されたその報告書は、有史以前のトンガに関する広範な研究の基礎となった。また文筆活動や舞踊音楽の作詞にも熱心で、ヒバ・カカラ hiva kakalaと呼ばれる詩や荘重なラカラカ （lakalaka トンガの伝統的舞踊）を愛した。",
      "1953年のエリザベス2世の戴冠式では土砂降りの雨の中を無蓋馬車で、しかも手を振りながら笑顔で闊歩し、観衆から敬慕の情を集めた。1954年から崩御まで、トンガ赤十字協会の後援するトンガ伝統委員会委員長を務めた。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "Bain, Kenneth Ross., (1967), The Friendly Islanders: a story of Queen Salote and her people, London; Hodder & Stoughton.",
      "Burley, David V. (1998): Tongan Archaeology and the Tongan Past, 2850-150 B.P. Journal of World Prehistory 12(3): 337–392. doi:10.1023/A:1022322303769 (HTML abstract)",
      "Kaeppler, A.L.; Taumoefolau, M.; Tuku‘aho, N, & Wood-Ellem, E. (2004): Songs and poems of Queen Salote. ISBN 978-982-213-008-9",
    ] },
]

