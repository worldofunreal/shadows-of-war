[articles.en]
text = "Artemisia I of Caria was a queen of the ancient Greek city-state of Halicarnassus, which is now in Bodrum, Turkey. She was also queen of the nearby islands of Kos, Nisyros and Kalymnos, within the Achaemenid satrapy of Caria, in about 480 BC."
title = "Artemisia I of Caria"
lang = "en"
url = "https://en.wikipedia.org/wiki/Artemisia_I_of_Caria"
intro = [
  "Artemisia I of Caria (Ancient Greek: Ἀρτεμισία, transl. Ártemisía; fl. 480 BC) was a queen of the ancient Greek city-state of Halicarnassus, which is now in Bodrum, Turkey. She was also queen of the nearby islands of Kos, Nisyros and Kalymnos, within the Achaemenid satrapy of Caria, in about 480 BC. She was of Carian-Greek ethnicity by her father Lygdamis I, and Greek Cretan by her mother. She fought as an ally of Xerxes I, King of Persia against the independent Greek city states during the second Persian invasion of Greece. She personally commanded ships at the naval battle of Artemisium and at the naval Battle of Salamis in 480 BC. She is mostly known through the writings of Herodotus, himself a native of Halicarnassus, who praises her courage and relates the respect in which she was held by Xerxes.",
]
sections = [
  { "title" = "Family", "paragraphs" = [
      "Artemisia's father was the satrap of Halicarnassus, Lygdamis I (Λύγδαμις Α') and her mother was from the island of Crete. She took the throne after the death of her husband, as she had a son, named Pisindelis (Πισίνδηλις), who was still a youth. Artemisia's grandson, Lygdamis II (Λύγδαμις Β'), was the satrap of Halicarnassus when Herodotus was exiled from there and the poet Panyasis (Πανύασις) was sentenced to death, after the unsuccessful uprising against him.",
    ] },
  { "title" = "Second Persian invasion of Greece", "paragraphs" = [
      "According to Thessalus, the King of Persia demanded earth and water from the Coans in 493 BC but they refused, and so he gave the island to Artemisia to be wasted. Artemisia led a fleet of ships to Cos to slaughter the Coans, but Thessalus claimed that Zeus intervened and Artemisia's ships were destroyed by lightning, and she was forced to retreat. However, she later returned and conquered them.",
      "Xerxes was induced by the message of Themistocles to attack the Greek fleet under unfavourable conditions, rather than sending a part of his ships to the Peloponnese and awaiting the dissolution of the Greek armies. Artemisia was the only one of Xerxes' naval commanders to advise against the action, then went on to earn her king's praise for her leadership in action during his fleet's defeat by the Greeks at the Battle of Salamis (September, 480 BC).",
      "Before the battle of Salamis, Xerxes gathered all his naval commanders and sent Mardonios to ask whether or not he should fight a naval battle.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "A legend, quoted by Photius, some 13 centuries later, claims that Artemisia fell in love with a man from Abydos (Ancient Greek: Ἄβῡδος), named Dardanus (Greek: Δάρδανος), and when he ignored her, she blinded him while he was sleeping, but her love for him increased. An oracle told her to jump from the top of the rock of Leucas, as those who leapt from this rock were said to be cured from the passion of love. However, she was killed after she jumped from the rock and buried near the spot. According to a legend, Sappho killed herself jumping from these cliffs too, because she was in love with Phaon.",
      "Artemisia was succeeded by her son Pisindelis, who became the new tyrant of Caria. He would himself later be succeeded by his son Lygdamis.",
    ] },
  { "title" = "Reception in the Greco-Roman world", "paragraphs" = [
      "Herodotus admired Artemisia, despite her support of Persia. He praised her decisiveness and intelligence, and emphasised her strategies under Xerxes' as his Grand Admiral.",
      "Polyaenus says that Xerxes spoke highly of her gallantry. In the eighth book of his work Stratagems, he also mentions that when Artemisia (he may have referred to Artemisia I, but most probably he referred to Artemisia II) wanted to conquer Latmus, she placed soldiers in ambush near the city and she, with women, eunuchs and musicians, celebrated a sacrifice at the grove of the Mother of the Gods, which was about seven stades distant from the city. When the inhabitants of Latmus came out to see the magnificent procession, the soldiers entered the city and took possession of it.",
      "In his History of the World, Justin writes that she \"was fighting with the greatest gallantry among the foremost leaders; so that you might have seen womanish fear in a man, and manly boldness in a woman.\"",
    ] },
]

[articles.es]
text = "Artemisia I de Caria (en griego antiguo: Ἀρτεμῑσίᾱ) (en persa: آناهیتا‎, fl. 480 a."
title = "Artemisia I de Caria"
lang = "es"
url = "https://es.wikipedia.org/wiki/Artemisia_I_de_Caria"
intro = [
  "Artemisia I de Caria (en griego antiguo: Ἀρτεμῑσίᾱ) (en persa: آناهیتا‎, fl. 480 a. C.) fue reina de Halicarnaso,​ ciudad de griegos dorios situada en Caria, entonces una satrapía del imperio Aqueménida.​ Luchó a favor de la causa de su señor Jerjes I, rey de Persia, contra las polis griegas en la segunda guerra médica.​ Artemisia dirigió en persona a sus cinco barcos en las batallas navales de Artemisio​ y Salamina, libradas en el año 480 a. C., Se conoce su existencia por los escritos del historiador griego Heródoto, que afirma que ella era la única líder militar del bando persa y elogia su iniciativa y valentía, así como el respeto que Jerjes le tenía.​",
]
sections = [
  { "title" = "Familia y nombre", "paragraphs" = [
      "Fue hija de Lígdamis I, tirano de Halicarnaso. De acuerdo con Heródoto (Historias, libros 7 y 8), Artemisia fue halicarnasia por parte de su padre, Lígdamis I, y cretense por parte de su madre.​ Huérfana y viuda, gobernó Caria durante la minoría de edad de su hijo Pisindelis, quien fue tirano de Caria, sucedido por su hijo Lígdamis II.",
      "El nombre Artemisia (Anāhitā) deriva de Artemisa (n, f.; equivalente romano: Diana). De acuerdo a Jablonski, el nombre es también frigio y puede ser \"comparado con el título real Artemas de Jenofonte\". Aun así, según Charles Anthon,​ la raíz primitiva del nombre es probablemente de origen persa, de arta*, art*, arte*, todos significando grande, excelente o sagrado, y por lo tanto, Artemisa (p.e. Diana) «se identifica con la gran madre de la Naturaleza, aunque fuera adorada en Éfeso».​",
    ] },
  { "title" = "La batalla de Salamina", "paragraphs" = [
      "Siendo la única mujer entre sus comandantes, Artemisia aconsejó al rey persa Jerjes I que coordinara una ofensiva conjunta terrestre y marítima. Quiso que el ejército persa marchara hacia el istmo de Corinto y que atacara a la coalición griega que estaba fortificada allí, mientras la flota se posicionara para atacar a los trirremes griegos. De esta manera, Artemisia esperaba que los barcos griegos se separaran de sus ciudades estado, dejándolos vulnerables ante una flota persa intacta. Jerjes desechó ese plan, realizando un ataque a la flota conjunta griega en Salamina. Artemisia participó en la batalla de Salamina en septiembre de 480 a. C. como aliada persa, comandando cinco naves.",
      "Su nave fue acosada por un trirreme ateniense y no tenía posibilidad de escapar porque varias naves persas erróneamente le cerraban el paso. Embistió un navío de la flota de Jerjes y lo hundió, de modo que la embarcación griega creyese que era aliada, y dejase de perseguirla.",
      "Escapó hacia las líneas persas, donde, según Heródoto, Jerjes dijo: «¡Mis hombres (los persas) se han convertido en mujeres y mis mujeres (Artemisia) en hombres!». Heródoto tenía una buena opinión de ella, a pesar de su apoyo a Persia en la contienda, posiblemente porque ambos eran naturales de Halicarnaso.",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "Una leyenda, contada por Focio,​ cuenta que Artemisia se enamoró de un hombre llamado Dárdano y que, cuando él la ignoró, un oráculo le dijo que saltara a su muerte en el mar Jónico desde la roca de Léucade.",
    ] },
  { "title" = "En las artes y la cultura popular", "paragraphs" = [
      "Es personaje de la novela de Gore Vidal Creación, en la que se tratan las guerras griegas.",
      "Es personaje de la novela de Javier Negrete Salamina (2008), en la que se trata la batalla de Maratón (490 a. C.) y la batalla de Salamina (480 a. C.).",
      "Es personaje de la novela de Javier Negrete El espartano (2017), en la que se trata la batalla de Platea (479 a. C.).",
    ] },
]

[articles.fr]
text = "Artémise Ire (grec ancien : Ἀρτεμισία) est une des reines de l'ancienne cité grecque d'Halicarnasse en Carie (l'actuelle ville de Bodrum en Turquie) au Ve siècle av. J.-C."
title = "Artémise Ire"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Art%C3%A9mise_Ire"
intro = [
  "Artémise Ire (grec ancien : Ἀρτεμισία) est une des reines de l'ancienne cité grecque d'Halicarnasse en Carie (l'actuelle ville de Bodrum en Turquie) au Ve siècle av. J.-C.",
  "Elle gouverne sous la suzeraineté de l'Empire des Achéménides et participa à plusieurs batailles navales dont celles de l'Artémision, de l'Eubée et de Salamine.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Artémise est aujourd'hui principalement connue au travers des écrits d'Hérodote, et plus particulièrement dans les livres VII (Polymnia) et VIII (Urania) de ses Histoires. Son père était Lygdamis Ier d'Halicarnasse (en), satrape d'Halicarnasse et sa mère, dont on ne connait pas l'identité, était originaire de Crète. Artémise s'empara du trône et de la fonction de tyran à la mort de son mari car son fils, Pisindelis, était alors encore un « jeune homme d’une vingtaine d’années » selon certains ou « en bas âge » selon d'autres. Reine d'Halicarnasse, elle régna également sur les îles de Cos, de Nisyros et de Calymnos. Considérée « tout à la fois [comme] une merveille, une curiosité, voire une bizarrerie ou un monstre », Artémise Ire est devenue célèbre pour sa participation à la campagne de Xerxès Ier, roi de Perse, lors de la seconde guerre médique contre les Grecs, guerre durant laquelle elle se distingua à la bataille de Salamine en -480 où elle commanda cinq navires qualifiés comme, « après ceux des Sidoniens, les plus réputés » par Hérodote.",
      "Avant la bataille de Salamine, elle préconisa au Grand Roi d'éviter le combat (« ménage tes vaisseaux, ne livre pas de combat naval ; car ces hommes sont sur mer autant supérieurs aux tiens que les hommes le sont aux femmes », « Si, au contraire, tu te presses de livrer combat sur le champ, je crains qu’une défaite de l’armée navale n’ait pour l’armée de terre de fâcheuses conséquences. ») puis, ses conseils ayant été écartés, elle participa à la bataille et se démarqua par sa bravoure et sa pugnacité. Les Grecs auraient d'ailleurs pensé de cette reine qu'elle « était une sorte d’Amazone de la mer ».",
      "C'est un événement en particulier, relaté seulement par Hérodote, qui a construit l'image d'Artémise en tant que stratège et guerrière accomplie. En effet, lors de cette bataille, alors qu'elle était poursuivie par un navire athénien mené par Ameinias de Pallène (en), elle fit le choix d'une entreprise risquée tout en faisant « preuve de mètis » afin de sauver son navire et son équipage. Cette décision consistait à s'attaquer au vaisseau du roi de Calynda (en), Damasithymos, pourtant lui aussi allié des Perses, trahissant ainsi ses propres alliées.",
    ] },
  { "title" = "Artémise et les Athéniens", "paragraphs" = [
      "À une époque où les femmes étaient majoritairement cantonnées à leur rôle d’épouse et de mère et n’étaient donc pas associées à la guerre et au gouvernement, la situation d’Artémise détonne. Sa présence lors de la bataille de Salamine, ainsi que ses exploits, se sont avérés être un problème « tant les Athéniens étaient indignés qu’une femme vînt faire la guerre à Athènes. ». C’est d’ailleurs pourquoi ils mirent à prix, à hauteur de 10 000 drachmes, la tête d’Artémise, ne pouvant « tolérer qu’une épouse, certes veuve, et une mère combatte contre eux ». Cette prime mentionnée par Hérodote souligne qu’au regard des Athéniens « une femme ne peut être à la guerre que promesse de butin, prix de la victoire, destinée généralement à servir le vainqueur comme esclave. ». Dans cette bataille, en tant que femme, Artémise n’était pas considérée comme « une égale ».",
      "Puisque Artémise faisait la guerre, elle a été assimilée aux Amazones et cette perception par les Athéniens et les Grecs en général s’explique, en partie, en raison des descriptions que l’on a d’elle : elle aurait porté « le costume typique des hommes perses, ressemblant aux vêtements des Amazones sur les vases peints grecs – une tunique à longues manches avec des motifs et un pantalon – et qu’elle était armée d’une dague et d’une épée. ».",
    ] },
  { "title" = "Opinions de contemporains", "paragraphs" = [
      "Hérodote semble avoir dans ses textes une opinion favorable d’Artémise (qui était d'« une génération son ainée ») malgré son rôle et son soutien à la Perse lors de la Seconde Guerre médique. Tout comme Polyen, il vante sa combativité et son intelligence, mettant aussi l'accent sur son influence auprès de Xerxès. Toutefois, certains auteurs reprochent à Hérodote un manque de discernement car lui-même était originaire d'Halicarnasse. De plus, bien qu'il raconte cet épisode avec force détails, il est important de souligner qu'il n'a pas pu y assister, puisqu'il naquit durant l'année où cette bataille a eu lieu.",
      "En plus de l'opinion des auteurs, nous pouvons grâce à eux nous faire une idée de celle de Xerxès. Ainsi Hérodote et Polyen rapportent l'admiration du roi quant aux avis d'Artémise (« quand on eut rapporté à Xerxès les opinions exprimées, il goûta fort celle d’Artémise ; et lui, qui la considérait déjà auparavant comme une femme de mérite, conçut alors pour elle bien plus d’estime. ») et son comportement à Salamine.",
      "Polyen revient également sur sa ruse, rapportant la prise de la ville de Latmos. Elle plaça des soldats en embuscade près de la cité puis, accompagnée de femmes, d'eunuques et de musiciens, célébra un sacrifice sur l'autel de la Mère des Dieux, se trouvant à sept stades de la ville. Lorsque les habitants de Latmos vinrent admirer la magnifique procession, les soldats entrèrent dans la ville et en prirent possession.",
    ] },
  { "title" = "Dans la culture populaire", "paragraphs" = [
      "En 1962, le rôle d'Artémise est interprété par Anne Wakefield dans le film La Bataille des Thermopyles.",
      "En 2014, le rôle d'Artémise est interprété par Eva Green dans le film 300 : La Naissance d'un Empire, adaptation du roman de Frank Miller, Xerxes, et qui fait suite au film 300, centré sur la bataille des Thermopyles.",
      "Dans ce dernier, Eva Green y incarne une « reine impitoyable et sexy », « d’une persuasion envoûtante et maléfique ». Interviewée à ce sujet par la revue Entertainment Weekly, l’actrice indique voir dans ce rôle une sorte de mixte entre « Lady McBeth et Cléopâtre », dont l’attraction pour son ennemi, Thémistocle, viendra se mêler au conflit. « Dans d’autres circonstances, ça aurait pu donner lieu à une histoire d’amour » analyse-t-elle.",
    ] },
]

[articles.de]
text = "Artemisia (altgriechisch Ἀρτεμισία Artemisía) war Dynastin von Halikarnassos im 5. Jahrhundert v."
title = "Artemisia I."
lang = "de"
url = "https://de.wikipedia.org/wiki/Artemisia_I."
intro = [
  "Artemisia (altgriechisch Ἀρτεμισία Artemisía) war Dynastin von Halikarnassos im 5. Jahrhundert v. Chr. Sie nahm als Anführerin eines Flottenkontingents auf der Seite des persischen Königs Xerxes I. 480 v. Chr. an dessen Einfall in Griechenland teil.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Artemisia war eine Tochter des Lygdamis von Halikarnassos, der wahrscheinlich ebenfalls Dynast war. Mütterlicherseits war sie kretischer Abkunft. Sie übernahm nach dem Tod ihres Gatten, dessen Name unbekannt ist, vor 480 v. Chr. – als Vormund ihres kleinen Sohnes Pisindelis – die Regierung über Halikarnassos, Kos, Nisyros und Kalynda. Dabei unterstand sie der Oberherrschaft des persischen Königs.",
      "Ohne äußeren Zwang beteiligte sich die äußerst wagemutige Artemisia 480 v. Chr. am Feldzug Xerxes’ I. gegen Griechenland und hatte während der Expedition die Führung über die fünf von ihr beigesteuerten Schiffe inne, die nach dem Geschichtsschreiber Herodot (7,99) „die vorzüglichsten nach Sidon in der ganzen Flotte waren“. Herodot rühmt wohl zu Recht ihre Entschlossenheit und Klugheit sowie ihren Einfluss beim Großkönig, doch sind manche Einzelzüge ihrer Taten anekdotenhaft ausgeschmückt oder sogar erfunden.",
      "Zunächst kämpfte Artemisia in der Seeschlacht beim Kap Artemision der griechischen Insel Euböa mit. Laut der Darstellung von Herodot soll sie dann als Einzige Xerxes davon abgeraten haben, die Griechen in der Meerenge zwischen Attika und Salamis anzugreifen, wohin sich die griechische Flotte zurückgezogen hatte. Alle übrigen Kriegsräte und Bundesgenossen des Xerxes seien dagegen für die Durchführung der Seeschlacht von Salamis eingetreten. Zur Begründung ihrer Haltung gab Artemisia an, dass die griechische Flotte der persischen überlegen sei; überdies werde auch das ganze persische Landheer leiden, wenn die Flotte von den Feinden vernichtet würde. Stattdessen solle Xerxes rasch mit seiner Landarmee nach dem Peloponnes ziehen; die Griechen, denen es auf Salamis ohnehin an Proviant mangele, würden sich dann zerstreuen, Athen im Stich lassen und in ihre Heimatstädte zurückkehren. Offenbar gibt Herodot hier nicht eine authentische Rede Artemisias, sondern seine eigene Beurteilung der militärischen Lage wieder. Xerxes sei laut Herodot von Artemisias Rede beeindruckt gewesen, habe sich aber dennoch entschlossen, entgegen ihrem Rat die Seeschlacht zu wagen.",
    ] },
  { "title" = "Trivia", "paragraphs" = [
      "Im Spielfilm Der Löwe von Sparta wird die eine Liebesbeziehung mit Xerxes führende Artemesia von Anne Wakefield verkörpert. In 300: Rise of an Empire, dem Sequel der Comicverfilmung 300, wird Artemisia von Eva Green dargestellt. Die Filmfigur ist allerdings nur eine freie Interpretation der historischen Person und gerät an mehreren Stellen des Films mit ihr in Konflikt. Artemisia wurde beispielsweise nicht – wie im Film inszeniert – während der Schlacht von Salamis getötet.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Walther Judeich: Artemisia 2. In: Paulys Realencyclopädie der classischen Altertumswissenschaft (RE). Band II,2, Stuttgart 1896, Sp. 1441.",
      "Helmut Gams: Artemisia 1. In: Der Kleine Pauly (KlP). Band 1, Stuttgart 1964, Sp. 625.",
      "Artemisia. In: Joyce Salisbury (Hrsg.): Encyclopedia of Women in the Ancient World. 2001, ISBN 978-1-57607-092-5, S. 20 f.",
    ] },
]

[articles.it]
text = "Artemisia I di Caria (in greco antico Aρτεμισία?, Artemisía; Alicarnasso, fine VI secolo a.C. – Leucade, V secolo a.C.) dopo la morte del marito, di cui è ignoto il nome, divenne sovrana delle città di Alicarnasso, in Asia minore, e dei territori annessi di Coo, Nisiro e Calinda."
title = "Artemisia I"
lang = "it"
url = "https://it.wikipedia.org/wiki/Artemisia_I"
intro = [
  "Artemisia I di Caria (in greco antico Aρτεμισία?, Artemisía; Alicarnasso, fine VI secolo a.C. – Leucade, V secolo a.C.) dopo la morte del marito, di cui è ignoto il nome, divenne sovrana delle città di Alicarnasso, in Asia minore, e dei territori annessi di Coo, Nisiro e Calinda.",
  "È ricordata soprattutto per la sua partecipazione alle battaglie di Capo Artemisio e di Salamina (480 a.C.) come alleata dell'Impero achemenide contro la coalizione greca, nel corso della seconda guerra persiana. Artemisia, unica donna col grado di comandante nella flotta di Serse, era alla guida di cinque triremi, che avevano un'ottima reputazione fra tutte le navi del Re dei re, seconda solo a quella delle navi di Sidone.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Artemisia, il cui nome deriva dalla dea della caccia Artemide, nacque ad Alicarnasso (l'odierna Bodrum, in Turchia), un'antica colonia greca della Caria (una regione costiera dell'Anatolia sud-occidentale), al secolo una provincia autonoma dell'Impero achemenide, figlia di Ligdami I (in greco antico Λύγδαμις?, Lygdamis), il satrapo achemenide di Alicarnasso, di origine per metà caria e per metà greca, e della sua consorte, il cui nome non ci è pervenuto, una donna greca originaria dell'isola di Creta.",
      "Dopo la morte improvvisa del marito (il cui nome ci è ignoto), Artemisia salì al trono come reggente del figlio Pisindeli (in greco antico Πισίνδηλις?, Pisìndelis), a causa della sua minore età. Il suo regno, parte dell'Impero Achemenide, si estendeva per l'intera regione della Caria e le isole vicine di Coo e di Nisiro.",
      "Da regina, Artemisia preferiva la navigazione e la guerra alla vita di corte. Polieno riporta infatti che la regina era solita cambiare repentinamente le insegne e i colori della sua trireme, fingendosi una nave greca o persiana a seconda delle imbarcazioni incrociate quando navigava in acque internazionali, per ingannare così gli equipaggi delle altre navi ed allontanarsi indisturbata o attaccare di sorpresa a seconda delle circostanze.",
    ] },
  { "title" = "Nella cultura di massa", "paragraphs" = [
      "Artemisia I di Caria è interpretata dall'attrice di Guernsey Anne Wakefield nel film L'eroe di Sparta (The 300 Spartans) del 1962 e dall'attrice francese Eva Green nel film 300 - L'alba di un impero del 2014.",
      "Artemisia appare nel videogioco Shin Megami Tensei: Persona 3 come evoluzione della Persona di Mitsuru Kirijo, una dei coprotagonisti.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(EN) Karl Otfried Müller, The History and Antiquities of the Doric Race, vol. 2, 1839.",
      "(EN) Nancy Demand, A History of Ancient Greece, Boston, McGraw-Hill, 1996, ISBN 0-07-016207-7.",
      "(EN) Joyce Salisbury, Encyclopedia of Women in the Ancient World, ABC-CLIO, 2001, pp. 20-21, ISBN 978-1-57607-092-5.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "Artemìsia, su Treccani.it – Enciclopedie on line, Istituto dell'Enciclopedia Italiana.",
      "Livius.org: Artemisia di Alicarnasso su livius.org, su livius.org. URL consultato il 17 novembre 2013 (archiviato dall'url originale il 18 maggio 2013).",
    ] },
]

[articles.pt]
text = "Artemísia I (em Grego, Αρτεμισία) (c.480 a.C.), sátrapa da Cária, lutou em Salamina ao lado dos persas, como Almirante de toda a sua frota."
title = "Artemísia I de Cária"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Artem%C3%ADsia_I_de_C%C3%A1ria"
intro = [
  "Artemísia I (em Grego, Αρτεμισία) (c.480 a.C.), sátrapa da Cária, lutou em Salamina ao lado dos persas, como Almirante de toda a sua frota.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Segundo Pausânias, Artemísia, filha de Ligdamis, rainha de Halicarnasso, juntou-se à expedição de Xerxes contra a Grécia, e distinguiu-se na Batalha de Salamina.",
      "Segundo Heródoto, Artemísia era Halicarnassense por parte de pai, e cretense por parte de mãe. Ela passou a governar a Cária após a morte de seu esposo, que era cliente dos persas. Apesar de suas origens gregas, participou da segunda invasão persa liderada por Xerxes I, inclusive oferecendo bons conselhos ao rei. Lutou com destaque na Batalha de Salamina, onde comandou cinco navios de seu reino. Heródoto a descreveu favoravelmente e ressaltou os elogios à sua bravura durante a batalha feitos pelo rei persa.",
      "Segundo Plutarco, foi ela quem reconheceu o corpo de Ariâmenes, irmão de Xerxes e almirante da frota persa, que morreu após seu barco ter sido abalroado pelo barco de Amínias, o Deceliano e Sócles, o Peaniano; Ariâmenes tentou abordar a trirreme grega, mas foi morto pelas lanças",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "As colunas de mármore do mercado de Esparta, no século II a.C., eram ilustradas com figuras dos persas, inclusive Artemísia e Mardônio, filho de Góbrias.",
    ] },
  { "title" = "Referências", "paragraphs" = [
