[articles.en]
text = "Qin Shi Huang, born Ying Zheng, became the first emperor of Qin after his kingdom defeated its last rivals in 221 BCE. His government extended Qin standards for weights and measures across the conquered territories. Inscriptions on surviving weights and measuring vessels record the reform."
title = "Qin Shi Huang"
lang = "en"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang, born Ying Zheng, became the first emperor of Qin after his kingdom defeated its last rivals in 221 BCE. His government extended Qin standards for weights and measures across the conquered territories. Inscriptions on surviving weights and measuring vessels record the reform."]
sections = [{ title = "Weights and measures of the Qin empire", paragraphs = ["A bronze plaque in the National Museum of China carries the First Emperor’s decree of 221 BCE and an addition issued by the Second Emperor in 209 BCE. Some plaques were attached to weights or measures, while some vessels carried inscriptions directly. A bronze grain measure in the Shaanxi History Museum was already in use before unification and later received the imperial certification. Objects like this show how older equipment could be incorporated into the new system. The reform made existing Qin units common across the empire, while other policies standardized coinage and writing."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.es]
text = "Qin Shi Huang, nacido Ying Zheng, se proclamó primer emperador de Qin después de que su reino venciera a sus últimos rivales en 221 a. C. Su gobierno extendió los patrones de pesos y medidas de Qin a los territorios conquistados. Las inscripciones conservadas en pesas y recipientes dan testimonio de esa reforma."
title = "Qin Shi Huang"
lang = "es"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang, nacido Ying Zheng, se proclamó primer emperador de Qin después de que su reino venciera a sus últimos rivales en 221 a. C. Su gobierno extendió los patrones de pesos y medidas de Qin a los territorios conquistados. Las inscripciones conservadas en pesas y recipientes dan testimonio de esa reforma."]
sections = [{ title = "Pesos y medidas del imperio Qin", paragraphs = ["Una placa de bronce del Museo Nacional de China conserva el edicto del primer emperador de 221 a. C. y un añadido del segundo emperador de 209 a. C. Algunas placas se fijaban a pesas o instrumentos de medición, mientras que otros recipientes llevaban la inscripción grabada directamente. Una medida de bronce para grano conservada en el Museo de Historia de Shaanxi ya se usaba antes de la unificación y recibió después la certificación imperial. Estas piezas muestran cómo se incorporaron instrumentos anteriores al nuevo sistema. El gobierno también normalizó la moneda y la escritura."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.fr]
text = "Qin Shi Huang, né Ying Zheng, devint le premier empereur des Qin après la victoire de son royaume sur ses derniers rivaux en 221 av. J.-C. Son gouvernement étendit les normes de poids et de mesure de Qin aux territoires conquis. Des inscriptions conservées sur des poids et des récipients attestent cette réforme."
title = "Qin Shi Huang"
lang = "fr"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang, né Ying Zheng, devint le premier empereur des Qin après la victoire de son royaume sur ses derniers rivaux en 221 av. J.-C. Son gouvernement étendit les normes de poids et de mesure de Qin aux territoires conquis. Des inscriptions conservées sur des poids et des récipients attestent cette réforme."]
sections = [{ title = "Les poids et mesures de l’empire Qin", paragraphs = ["Une plaque de bronze du Musée national de Chine porte le décret du premier empereur daté de 221 av. J.-C. et un ajout du second empereur de 209 av. J.-C. Certaines plaques étaient fixées sur des poids ou des instruments de mesure. D’autres récipients portaient le texte gravé directement. Une mesure à grain en bronze, conservée au musée d’histoire du Shaanxi, servait déjà avant l’unification et reçut ensuite la certification impériale. Ces objets montrent comment des instruments plus anciens furent intégrés au système. D’autres mesures harmonisèrent la monnaie et l’écriture."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.de]
text = "Qin Shi Huang wurde als Ying Zheng geboren und nahm 221 v. Chr. den Titel des Ersten Kaisers an, nachdem sein Königreich die letzten Rivalen besiegt hatte. Seine Regierung dehnte die Maße und Gewichte von Qin auf die eroberten Gebiete aus. Inschriften auf erhaltenen Gewichten und Messgefäßen belegen diese Reform."
title = "Qin Shi Huang"
lang = "de"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang wurde als Ying Zheng geboren und nahm 221 v. Chr. den Titel des Ersten Kaisers an, nachdem sein Königreich die letzten Rivalen besiegt hatte. Seine Regierung dehnte die Maße und Gewichte von Qin auf die eroberten Gebiete aus. Inschriften auf erhaltenen Gewichten und Messgefäßen belegen diese Reform."]
sections = [{ title = "Maße und Gewichte im Qin-Reich", paragraphs = ["Eine Bronzetafel im Chinesischen Nationalmuseum trägt den Erlass des Ersten Kaisers von 221 v. Chr. und einen Zusatz des Zweiten Kaisers von 209 v. Chr. Einige Tafeln wurden an Gewichten oder Messgeräten befestigt. Auf anderen Gefäßen wurde der Text direkt eingraviert. Ein bronzenes Getreidemaß im Geschichtsmuseum von Shaanxi war schon vor der Reichseinigung in Gebrauch und erhielt später die kaiserliche Bestätigung. Solche Stücke zeigen, wie vorhandene Geräte in das neue System aufgenommen wurden. Die Regierung vereinheitlichte auch die Münzen und die Schrift."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.it]
text = "Qin Shi Huang, nato Ying Zheng, assunse il titolo di Primo Imperatore dopo che il suo regno sconfisse gli ultimi rivali nel 221 a.C. Il governo estese gli standard di peso e misura di Qin ai territori conquistati. Le iscrizioni su pesi e recipienti di misurazione conservati documentano la riforma."
title = "Qin Shi Huang"
lang = "it"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang, nato Ying Zheng, assunse il titolo di Primo Imperatore dopo che il suo regno sconfisse gli ultimi rivali nel 221 a.C. Il governo estese gli standard di peso e misura di Qin ai territori conquistati. Le iscrizioni su pesi e recipienti di misurazione conservati documentano la riforma."]
sections = [{ title = "Pesi e misure nell’impero Qin", paragraphs = ["Una targa di bronzo del Museo nazionale della Cina conserva il decreto del Primo Imperatore del 221 a.C. e un’aggiunta del Secondo Imperatore del 209 a.C. Alcune targhe erano fissate a pesi o strumenti di misura. Altri recipienti portavano il testo inciso direttamente. Una misura per cereali in bronzo al Museo di storia dello Shaanxi era in uso prima dell’unificazione e ricevette poi la certificazione imperiale. Questi oggetti mostrano come gli strumenti già in circolazione potessero entrare nel sistema. Il governo uniformò anche la moneta e la scrittura."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.tr]
text = "Ying Zheng adıyla doğan Qin Shi Huang, devleti MÖ 221’de son rakiplerini yendikten sonra İlk İmparator unvanını aldı. Yönetimi, Qin’in ağırlık ve ölçü standartlarını fethedilen topraklara yaydı. Günümüze ulaşan ağırlıklar ve ölçü kapları üzerindeki yazıtlar bu düzenlemeyi belgeler."
title = "Qin Shi Huang"
lang = "tr"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Ying Zheng adıyla doğan Qin Shi Huang, devleti MÖ 221’de son rakiplerini yendikten sonra İlk İmparator unvanını aldı. Yönetimi, Qin’in ağırlık ve ölçü standartlarını fethedilen topraklara yaydı. Günümüze ulaşan ağırlıklar ve ölçü kapları üzerindeki yazıtlar bu düzenlemeyi belgeler."]
sections = [{ title = "Qin İmparatorluğu’nda ağırlık ve ölçüler", paragraphs = ["Çin Ulusal Müzesi’ndeki bir tunç levhada İlk İmparator’un MÖ 221 tarihli buyruğu ve İkinci İmparator’un MÖ 209 tarihli eki bulunur. Bazı levhalar ağırlıklara veya ölçüm araçlarına takılırken bazı kapların üzerine yazı doğrudan kazındı. Şensi Tarih Müzesi’nde bulunan tunç tahıl ölçeği birleşmeden önce de kullanılmış ve sonradan imparatorluk onayıyla işaretlenmiştir. Bu nesneler, daha eski araçların yeni sisteme nasıl alındığını gösterir. Qin yönetimi ayrıca parayı ve yazıyı standartlaştırdı."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.zh-CN]
text = "秦王嬴政在公元前221年完成对六国的征服，采用皇帝称号。秦政权随后把秦国的度量衡标准推行到新近占领的地区。传世和出土的器物留有相关命令的铭文。度量衡涉及称重、计量容量和长度，因此标准能否落到实际使用的器物上，与政令本身同样重要。秦朝也推行货币和文字等方面的统一措施。不同改革各有材料可以核查，度量衡的铭刻尤其能显示政令怎样进入日常计量。"
title = "秦始皇"
lang = "zh-CN"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["秦王嬴政在公元前221年完成对六国的征服，采用皇帝称号。秦政权随后把秦国的度量衡标准推行到新近占领的地区。传世和出土的器物留有相关命令的铭文。度量衡涉及称重、计量容量和长度，因此标准能否落到实际使用的器物上，与政令本身同样重要。秦朝也推行货币和文字等方面的统一措施。不同改革各有材料可以核查，度量衡的铭刻尤其能显示政令怎样进入日常计量。"]
sections = [{ title = "秦帝国的度量衡", paragraphs = ["中国国家博物馆收藏的青铜双诏版，一面器物上保存了两个时期的文字。其中有始皇二十六年颁布的命令，也有秦二世元年补刻的文字，分别对应公元前221年和前209年。铭文使用小篆。国家博物馆的资料指出，有些诏版嵌在铜权或铁权上，有些则有可以固定到木质量器上的孔。馆藏的一件马蹄形铁秤锤侧面就装有始皇的诏版，说明铁制称重工具也能以这种办法标明所遵行的标准。铭刻的位置和固定方法因器物材质与用途而不同。陕西历史博物馆收藏的北私府铜量提供了另一例。研究人员从器身、柄部和底部的文字辨认出不同阶段的使用记录。它在帝国成立以前已经使用，当时的简短铭记标出管理机构、容量或编号。公元前221年的认证文字后来刻在器壁上。到了秦二世时，工匠要加刻新的诏文，原来器壁上剩余的位置不足，因而在另一侧重刻前一份认证，再把补充文字刻到器底。这件旧量器能够重新刻铭继续使用，说明统一并非简单地把旧器一律替换，而可以检验并认证符合规范的器物。汉堡大学的研究还把二世补刻的文字与新皇帝如何表明继承关系联系起来。这一解释把器物的计量用途与铭文的政治含义分别考察。两份诏文都有具体年代，也能在同一件器物上看到先后的处理过程。馆藏记录和铭文研究可以互相参照。游戏用城市、工厂和农场的有效等级总量达成一致来表现统一标准带来的生产协同。"] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.ja]
text = "秦の王であった嬴政は、紀元前221年に最後の敵国を滅ぼし、最初の皇帝となった。その政権は秦で用いていた重さや容量などの基準を征服した地域にも広げた。今に残る分銅や升の銘文には、この改革に関わる命令が刻まれている。秦では貨幣や文字についても共通の規格が広められた。"
title = "始皇帝"
lang = "ja"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["秦の王であった嬴政は、紀元前221年に最後の敵国を滅ぼし、最初の皇帝となった。その政権は秦で用いていた重さや容量などの基準を征服した地域にも広げた。今に残る分銅や升の銘文には、この改革に関わる命令が刻まれている。秦では貨幣や文字についても共通の規格が広められた。"]
sections = [{ title = "秦帝国の度量衡", paragraphs = ["中国国家博物館にある青銅の銘板には、紀元前221年に始皇帝が出した命令と、紀元前209年に二世皇帝が加えた命令が残る。いずれも器具の規格を伝える資料だが、二つの命令は異なる時期に出された。小篆で刻んだ板を青銅や鉄の分銅にはめ込む例もあれば、穴を開けた銘板を木製の計量器に固定する例もあった。実際に用いる器具の材質や形に合わせて命令の伝え方が工夫された。陝西歴史博物館が所蔵する北私府の青銅製の穀物用升には、帝国成立前の使用を示す短い銘が残る。そこには器具の容量や使用機関、番号などが記された。統一後にはその升にも帝国の認証が刻まれた。二世皇帝の命令を追刻する際は、先の文章のそばに十分な余白がなかったため、工匠が反対側に元の銘文を刻み直し、器の底に追記を続けたと考えられる。この升には、新しい基準に適合した既存の器具を認めて使い続けた過程が残っている。鉄製の分銅に銅の銘板をはめ込んだ例と比較すると、共通の命令が複数の方法で伝えられたことが分かる。また、ハンブルク大学の研究では、二世皇帝による追加の文言に、先帝の事績を明記して自らの継承を正当化する意図も読み取っている。器具は計量に使われる一方、誰が基準を定めたかを示す役割も果たした。ゲームでは都市、工場、農場の稼働レベルの合計をそろえることで、この規格化を経済のルールに置き換えている。"] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.ko]
text = "영정으로 태어난 진시황은 기원전 221년 진나라가 마지막 경쟁국을 정복한 뒤 첫 황제의 칭호를 썼다. 그의 정부는 기존 진나라의 도량형 기준을 정복한 지역에도 적용했다. 현재 남은 저울추와 곡식을 재는 그릇의 명문은 이 개혁이 구체적으로 어떤 물건에 기록됐는지 보여 준다. 진은 화폐와 문자도 통일하는 정책을 시행했다."
title = "진시황"
lang = "ko"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["영정으로 태어난 진시황은 기원전 221년 진나라가 마지막 경쟁국을 정복한 뒤 첫 황제의 칭호를 썼다. 그의 정부는 기존 진나라의 도량형 기준을 정복한 지역에도 적용했다. 현재 남은 저울추와 곡식을 재는 그릇의 명문은 이 개혁이 구체적으로 어떤 물건에 기록됐는지 보여 준다. 진은 화폐와 문자도 통일하는 정책을 시행했다."]
sections = [{ title = "진 제국의 도량형", paragraphs = ["중국국가박물관의 청동판에는 기원전 221년 첫 황제의 명령과 기원전 209년에 이세황제가 더한 글이 남아 있다. 작은 전서체 글자를 새긴 판 가운데에는 청동이나 철로 만든 저울추에 끼운 것과 나무 계량기에 고정하도록 구멍을 뚫은 것이 있었다. 같은 명령이 쓰임새와 재질이 서로 다른 도구에 실렸다. 산시역사박물관에 있는 북사부의 청동 곡물 계량기는 제국이 성립하기 전부터 쓰였다. 그릇에 남은 짧은 글씨는 이전의 사용 기관과 용량, 기물 번호를 알려 준다. 통일이 이뤄진 뒤에는 도량형을 승인하는 첫 황제의 문구가 옆면에 새겨졌다. 이세황제의 추가 문구를 새겨야 할 때에는 기존 글의 끝에 자리가 모자랐다. 함부르크대학교의 연구에 따르면 장인들은 반대쪽에 첫 명문을 다시 새긴 뒤 그릇 바닥에 추가 문구를 이어 썼다. 한 그릇에 새겨진 서로 다른 기록을 통해 옛 계량 도구를 새 체계에 편입한 과정을 볼 수 있다. 이세황제의 글은 개혁이 선대의 업적이라는 점도 밝힌다. 연구자는 이 점을 후계자가 자신의 통치가 정당하다는 인상을 주기 위해 사용한 수단으로 해석한다. 따라서 도구는 물건을 재는 데 쓰이면서 어떤 권위가 기준을 정했는지를 알리는 역할도 했다. 게임에서는 도시, 공장, 농장의 가동 레벨 합계를 맞추면 생산이 늘어나는 규칙으로 이 표준화를 표현한다."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.ar]
text = "وُلد تشين شي هوانغ باسم يينغ تشنغ. واتخذ لقب الإمبراطور الأول بعدما هزمت مملكته آخر خصومها سنة 221 قبل الميلاد. وعمّمت حكومته معايير تشين للأوزان والمقاييس في الأراضي التي أخضعتها. وتشهد على هذا الإصلاح نقوش على أثقال وأوعية قياس باقية."
title = "تشين شي هوانغ"
lang = "ar"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["وُلد تشين شي هوانغ باسم يينغ تشنغ. واتخذ لقب الإمبراطور الأول بعدما هزمت مملكته آخر خصومها سنة 221 قبل الميلاد. وعمّمت حكومته معايير تشين للأوزان والمقاييس في الأراضي التي أخضعتها. وتشهد على هذا الإصلاح نقوش على أثقال وأوعية قياس باقية."]
sections = [{ title = "الأوزان والمقاييس في إمبراطورية تشين", paragraphs = ["يحمل لوح برونزي في المتحف الوطني للصين مرسوم الإمبراطور الأول الصادر سنة 221 قبل الميلاد وإضافة أصدرها الإمبراطور الثاني سنة 209 قبل الميلاد. وثُبتت بعض الألواح على الأثقال أو أدوات القياس، بينما نُقشت النصوص مباشرة على أوعية أخرى. وكان مكيال للحبوب من البرونز محفوظ في متحف تاريخ شنشي قيد الاستعمال قبل توحيد البلاد، ثم أضيف إليه نقش الاعتماد الإمبراطوري. توضح هذه الآثار كيف أُدمجت الأدوات الأقدم في النظام الجديد. وشملت سياسات الحكومة أيضًا توحيد العملة والكتابة."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.ru]
text = "Цинь Шихуан родился под именем Ин Чжэн. Он принял титул Первого императора после того, как его царство одолело последних соперников в 221 году до н. э. Его правительство распространило циньские меры и веса на завоёванные земли. Реформа засвидетельствована надписями на гирях и мерных сосудах."
title = "Цинь Шихуан"
lang = "ru"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Цинь Шихуан родился под именем Ин Чжэн. Он принял титул Первого императора после того, как его царство одолело последних соперников в 221 году до н. э. Его правительство распространило циньские меры и веса на завоёванные земли. Реформа засвидетельствована надписями на гирях и мерных сосудах."]
sections = [{ title = "Меры и веса империи Цинь", paragraphs = ["На бронзовой табличке из Национального музея Китая сохранились указ Первого императора 221 года до н. э. и дополнение Второго императора 209 года до н. э. Одни таблички крепили к гирям или мерным приборам, а на других сосудах текст вырезали непосредственно на поверхности. Бронзовой мерой для зерна из Исторического музея Шэньси пользовались ещё до объединения. Позднее на неё нанесли императорскую отметку. Такие предметы показывают, как прежние инструменты включались в новую систему. Власти также унифицировали монеты и письменность."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.vi]
text = "Tần Thủy Hoàng tên là Doanh Chính. Ông xưng là hoàng đế đầu tiên sau khi nước Tần đánh bại các đối thủ cuối cùng vào năm 221 TCN. Chính quyền của ông áp dụng các chuẩn cân đong và đo lường của nước Tần trên những vùng mới chinh phục. Văn khắc còn lại trên quả cân và đồ đong ghi nhận cuộc cải cách."
title = "Tần Thủy Hoàng"
lang = "vi"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Tần Thủy Hoàng tên là Doanh Chính. Ông xưng là hoàng đế đầu tiên sau khi nước Tần đánh bại các đối thủ cuối cùng vào năm 221 TCN. Chính quyền của ông áp dụng các chuẩn cân đong và đo lường của nước Tần trên những vùng mới chinh phục. Văn khắc còn lại trên quả cân và đồ đong ghi nhận cuộc cải cách."]
sections = [{ title = "Cân đong và đo lường thời Tần", paragraphs = ["Một tấm đồng ở Bảo tàng Quốc gia Trung Quốc mang chiếu năm 221 TCN của hoàng đế đầu tiên và phần bổ sung năm 209 TCN của hoàng đế thứ hai. Một số tấm được gắn vào quả cân hoặc dụng cụ đo, còn một số đồ đong được khắc trực tiếp. Chiếc đồ đong ngũ cốc bằng đồng ở Bảo tàng Lịch sử Thiểm Tây đã được dùng từ trước khi thống nhất và về sau mới được khắc dấu công nhận của triều đình. Các hiện vật cho thấy dụng cụ cũ có thể được đưa vào hệ thống mới. Chính quyền Tần cũng thống nhất tiền tệ và chữ viết."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.id]
text = "Qin Shi Huang, yang lahir dengan nama Ying Zheng, menjadi kaisar pertama setelah kerajaan Qin mengalahkan lawan-lawannya yang terakhir pada 221 SM. Pemerintahnya menerapkan standar berat dan ukuran Qin di wilayah yang ditaklukkan. Prasasti pada anak timbangan dan wadah takar yang masih ada mendokumentasikan perubahan itu."
title = "Qin Shi Huang"
lang = "id"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang, yang lahir dengan nama Ying Zheng, menjadi kaisar pertama setelah kerajaan Qin mengalahkan lawan-lawannya yang terakhir pada 221 SM. Pemerintahnya menerapkan standar berat dan ukuran Qin di wilayah yang ditaklukkan. Prasasti pada anak timbangan dan wadah takar yang masih ada mendokumentasikan perubahan itu."]
sections = [{ title = "Timbangan dan takaran Kekaisaran Qin", paragraphs = ["Pelat perunggu di Museum Nasional Tiongkok memuat titah kaisar pertama dari 221 SM dan tambahan dari kaisar kedua dari 209 SM. Beberapa pelat dipasang pada anak timbangan atau alat ukur. Wadah lain langsung diberi ukiran. Sebuah takaran perunggu untuk biji-bijian di Museum Sejarah Shaanxi telah digunakan sebelum penyatuan dan kemudian memperoleh tanda pengesahan kekaisaran. Benda seperti itu memperlihatkan bagaimana alat lama dimasukkan ke dalam sistem baru. Pemerintah Qin juga menyeragamkan mata uang dan tulisan."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.fil]
text = "Si Qin Shi Huang, na ipinanganak na Ying Zheng, ang naging unang emperador matapos talunin ng kaharian ng Qin ang mga huling karibal nito noong 221 BK. Pinalawak ng pamahalaan niya ang mga pamantayan ng Qin sa timbang at sukat sa mga nasakop na lupain. Nakatala ang reporma sa mga inskripsiyon sa mga natitirang pabigat at panukat."
title = "Qin Shi Huang"
lang = "fil"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Si Qin Shi Huang, na ipinanganak na Ying Zheng, ang naging unang emperador matapos talunin ng kaharian ng Qin ang mga huling karibal nito noong 221 BK. Pinalawak ng pamahalaan niya ang mga pamantayan ng Qin sa timbang at sukat sa mga nasakop na lupain. Nakatala ang reporma sa mga inskripsiyon sa mga natitirang pabigat at panukat."]
sections = [{ title = "Timbang at sukat sa imperyong Qin", paragraphs = ["Nasa isang plakang tanso sa Pambansang Museo ng Tsina ang kautusan ng unang emperador noong 221 BK at ang idinagdag ng ikalawang emperador noong 209 BK. May mga plakang ikinabit sa pabigat o panukat, at may mga sisidlang direktang inukitan. Ang tansong panukat ng butil sa Museo ng Kasaysayan ng Shaanxi ay ginagamit na bago ang pag-iisa at kalaunan ay nilagyan ng marka ng pagkilala ng imperyo. Makikita sa mga bagay na ito kung paano isinama ang mas lumang mga kagamitan sa bagong sistema. Pinagpare-pareho rin ng pamahalaang Qin ang salapi at pagsulat."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]

[articles.pt-BR]
text = "Qin Shi Huang, nascido Ying Zheng, assumiu o título de Primeiro Imperador depois que seu reino venceu os últimos rivais em 221 a.C. Seu governo estendeu os padrões de pesos e medidas de Qin aos territórios conquistados. Inscrições preservadas em pesos e recipientes de medição documentam a reforma."
title = "Qin Shi Huang"
lang = "pt-BR"
url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml"
shortArticle = true
intro = ["Qin Shi Huang, nascido Ying Zheng, assumiu o título de Primeiro Imperador depois que seu reino venceu os últimos rivais em 221 a.C. Seu governo estendeu os padrões de pesos e medidas de Qin aos territórios conquistados. Inscrições preservadas em pesos e recipientes de medição documentam a reforma."]
sections = [{ title = "Pesos e medidas do império Qin", paragraphs = ["Uma placa de bronze do Museu Nacional da China traz o decreto do Primeiro Imperador de 221 a.C. e um acréscimo do Segundo Imperador de 209 a.C. Algumas placas eram fixadas a pesos ou instrumentos de medição, e outros recipientes recebiam a inscrição diretamente. Uma medida de bronze para grãos no Museu de História de Shaanxi já estava em uso antes da unificação e depois recebeu a certificação imperial. Essas peças mostram como instrumentos anteriores foram incorporados ao novo sistema. O governo também padronizou a moeda e a escrita."] }]
sources = [{ title = "National Museum of China, Qin Bronze Plaque with Two Edicts", url = "https://www.chnmuseum.cn/zp/zpml/csp/202008/t20200826_247416.shtml" }, { title = "University of Hamburg, Qin Bronze Measure with Two Certification Inscriptions", url = "https://www.csmc.uni-hamburg.de/publications/aom/007-en.html" }, { title = "The Metropolitan Museum of Art, Qin Dynasty", url = "https://www.metmuseum.org/essays/qin-dynasty-221-206-b-c" }, { title = "National Museum of China, Qin Iron Weight", url = "https://www.chnmuseum.cn/zp/zpml/kgfjp/202110/t20211027_251881.shtml" }]
