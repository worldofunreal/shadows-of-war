[articles.en]
text = "Leonidas I was Greek king of the Ancient Greek city-state of Sparta. He was the son of king Anaxandridas II and the 17th king of the Agiad dynasty, a Spartan royal house which claimed descent from Heracles."
title = "Leonidas I"
lang = "en"
url = "https://en.wikipedia.org/wiki/Leonidas_I"
intro = [
  "Leonidas I (; Ancient Greek: Λεωνίδας, Leōnídas; born c. 540 BC; died 11 August 480 BC) was Greek king of the Ancient Greek city-state of Sparta. He was the son of king Anaxandridas II and the 17th king of the Agiad dynasty, a Spartan royal house which claimed descent from Heracles. Leonidas I ascended to the throne in c. 489 BC, succeeding his half-brother king Cleomenes I. He ruled jointly along with king Leotychidas II until his death in 480 BC, when he was succeeded by his son, Pleistarchus.",
  "At the Second Greco-Persian War, Leonidas led the allied Greek forces in a last stand at the Battle of Thermopylae (480 BC), attempting to defend the pass from the invading Persian army, and was killed early during the third and last day of the battle. Leonidas entered myth as a hero and the leader of the 300 Spartans who died in battle at Thermopylae. Although the Greeks lost this battle, they were able to expel the Persian invaders the following year (479 BC), in the Battle of Plataea.",
]
sections = [
  { "title" = "Life", "paragraphs" = [
      "According to Herodotus, Leonidas's mother was not only his father's wife, but also his father's niece and had been barren for so long that the ephors, the five annually elected administrators of the Spartan constitution, tried to prevail upon King Anaxandridas II to set her aside and take another wife. Anaxandridas refused, claiming his wife was blameless, whereupon the ephors agreed to allow him to take a second wife without setting aside his first. This second wife, a descendant of Chilon of Sparta (one of the Seven Sages of Greece), promptly bore a son, Cleomenes. However, one year after Cleomenes's birth, Anaxandridas's first wife also gave birth to a son, Dorieus. Leonidas was the second son of Anaxandridas's first wife, and either the elder brother or twin of Cleombrotus. Leonidas's name means \"descendant of Leon\", and he was named after his grandfather Leon of Sparta. The Doric Greek suffix -ίδας, with corresponding Attic form -ίδης, mainly means \"descendant of\". But literally his name can also mean \"son of a lion\", as the name Leon means \"lion\" in Greek.",
      "King Anaxandridas II died in c. 524 BC, and Cleomenes succeeded to the throne in sometime between then and 516 BC. Dorieus was so outraged that the Spartans had preferred his half-brother over himself that he found it impossible to remain in Sparta. He made one unsuccessful attempt to set up a colony in Africa and, when this failed, sought his fortune in Sicily, where after initial successes he was killed. Leonidas's relationship with his bitterly antagonistic elder brothers is unknown, but he married Cleomenes's daughter, Gorgo, sometime before coming to the throne in 490 BC.",
      "Leonidas was heir to the Agiad throne (successor of Cleomenes I) and a full citizen (homoios) at the time of the Battle of Sepeia against Argos (c. 494 BC). Likewise, he was a full citizen when the Persians sought submission from Sparta and met with vehement rejection in 492/491 BC. His elder half-brother, King Cleomenes, had already been deposed on grounds of purported insanity, and had fled into exile when Athens sought assistance against the First Persian invasion of Greece, that ended at Marathon (490 BC).",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "A hero cult of Leonidas survived in Sparta until the Antonine era (2nd century AD). Leonideia (λεωνιδεῖα) were solemnities celebrated every year in Sparta in honour of Leonidas and only Spartans were allowed to take part. The contest was held opposite the theatre at Sparta where there were the two sepulchral monuments of Pausanias and Leonidas.",
      "A bronze statue of Leonidas was erected at Thermopylae in 1955. A sign under the statue reads simply: \"ΜΟΛΩΝ ΛΑΒΕ\" (\"Come and take them\"), which was Leonidas's laconic reply when Xerxes offered to spare the lives of the Spartans if they gave up their arms. Another statue, also with the inscription ΜΟΛΩΝ ΛΑΒΕ, was erected in Sparta in 1969.",
      "Another monument to Leonidas was erected in Brunswick, a suburb of Melbourne, Australia, in November 2009. Brunswick is known as \"the suburb of the Spartans\" due to an influx of migrants from the Laconian region of Greece during the 1950s and 1960s.",
    ] },
]

[articles.tr]
text = "I. Leonidas (Grekçe: Λεωνίδας, romanize: Leōnídas, Yunanca telaffuz: /liəˈnaɪdəs, -dæs/; y."
title = "I. Leonidas"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/I._Leonidas"
intro = [
  "I. Leonidas (Grekçe: Λεωνίδας, romanize: Leōnídas, Yunanca telaffuz: /liəˈnaɪdəs, -dæs/; y. MÖ 540 - MÖ 480), Antik Yunan şehir devleti Sparta'nın kralıdır. Kral II. Anaksandridas'ın oğlu olan Leonidas, soyunu Herakles'e dayandıran Agiad Hanedanı'nın 17. hükümdarıdır. Yaklaşık MÖ 489'da üvey kardeşi I. Kleomenes'in yerine tahta geçti ve ölümüne kadar II. Leotykhidas ile birlikte hüküm sürdü. MÖ 480'deki ölümünün ardından yerine oğlu Pleistarhos geçti.",
  "I. Leonidas, İkinci Pers-Yunan Savaşı sırasında müttefik Yunan kuvvetlerine komuta etti ve MÖ 480'deki Thermopylae Muharebesi'nde, istilacı Pers ordusuna karşı geçidi savunmak amacıyla son bir direniş gerçekleştirdi. Savaşın üçüncü ve son gününde hayatını kaybeden Leonidas, Thermopylae'de ölen 300 Spartalı'nın lideri olarak efsaneleşti ve kahramanlık simgesi hâline geldi. Her ne kadar Yunanlar bu muharebeyi kaybetmiş olsa da, sonraki yıl Pers kuvvetlerini Yunanistan'dan çıkarmayı başardılar.",
]
sections = [
  { "title" = "Hayatı", "paragraphs" = [
      "MÖ 480 yılında, efor (tanrıların rahipleri) Leonidas'la birlikte 300 kraliyet korumasını ve askerini Thermopylae Geçidi'ne, geçidi Serhas komutanlığındaki Pers ordusuna karşı korumak için göndermişlerdir. Günümüzdeki bir hikâyeye göre, Leonidas çok az bir gücü yanında götürmüştür. Çünkü bile bile ölüme gittiğini düşünüyordu (bir kahin Sparta'nın kurtuluşunun sadece krallardan birinin ölümüyle gerçekleşeceğini söylemiştir). Aksine, görünüşe göre ephorlar bu plana Carneia festivali ve Yunan güçlerini Korint girişinde yoğunlaştırma politikaları nedenlerinden ötürü isteksiz bir şekilde destek çıkmışlardır.",
      "Birkaç anekdot, Leonidas ve Spartalılar'ın eski çağlarda bile cesaretleriyle ünlü olduklarını gösterir. Savaşın ilk gününde, Serhas Yunanlara silahlarını bırakmalarını söylediğinde, Leonidas şöyle cevap vermişti: Molōn labe (\"Gel de al\"). Üçüncü gün ise, Leonidas adamlarına güzel bir kahvaltı etmelerini, çünkü akşam yemeğini Hades'te yiyeceklerini söyledi.",
      "İlk iki gün boyunca Leonidas'ın adamları Perslerin önden gelen saldırılarını durdurdular, fakat Malisli Ephialtes Pers generali Hydasnes'i dağ patikası üzerinden Yunanların arkasına çıkartınca, Leonidas ordusunu ikiye böldü. Kendisi 300 Spartalı, 700 Thespiaeli ve 400 Thebesli asker ile geçitte kalmaya devam etti. (Bu olayda Perslere karşı son direnişte Spartalılar kırmızı pelerinlerini Thespialıların siyah pelerinleriyle değişmiş ve bu ikisi arasında büyük bir dostluk başlamıştır. Ancak ilerdeki dönemlerde Thebes ve Sparta arasında büyük bir savaş çıkacak ve Thebes kazanacaktır.)",
    ] },
]

[articles.id]
text = "Leonidas (pengucapan bahasa Inggris: [liːˈɒnidəs], Yunani: Λεωνίδας; \"anak Lion\") adalah raja Sparta ke-17 dari dinasti Agiad, salah seorang anak dari Raja Anaxandridas II dari sparta, yang dipercayai sebagai keturunan dari Heracles karena kekuatan dan keberaniannya. Dia seorang yg memiliki karakter begitu kuat, Berkharisma, dan Jiwa kepemimpinan yang tinggi."
title = "Leonidas I"
lang = "id"
url = "https://id.wikipedia.org/wiki/Leonidas_I"
intro = [
  "Leonidas (pengucapan bahasa Inggris: [liːˈɒnidəs], Yunani: Λεωνίδας; \"anak Lion\") adalah raja Sparta ke-17 dari dinasti Agiad, salah seorang anak dari Raja Anaxandridas II dari sparta, yang dipercayai sebagai keturunan dari Heracles karena kekuatan dan keberaniannya. Dia seorang yg memiliki karakter begitu kuat, Berkharisma, dan Jiwa kepemimpinan yang tinggi. Lahir pada tanggal 16 Agustus tahun 540-an SM, diperkirakan meninggal di Pertempuran Thermopylae pada bulan Agustus, 480 SM.",
  "Leonidas merupakan anak kedua dari tiga bersaudara. Kakaknya bernama Dorieus dan adiknya bernama Cleombrotus, yang sempat memimpin kekuasaan selama beberapa saat setelah kematian Leonidas, sebelum akhirnya digantikan oleh Paunsanias, anak Cleombrotus.",
]
sections = [
  { "title" = "Kehidupan", "paragraphs" = [
      "Menurut Herodotus, ibu Leonidas bukan hanya istri ayahnya tapi juga keponakannya dan sudah mandul begitu lama sehingga para ephors, lima hakim pemerintahan konstitusi Spartan yang terpilih setiap lima tahun, mencoba menang atas Raja Anaxandridas II untuk menyingkirkannya dan ambil istri yang lain Anaxandridas menolak, dengan mengklaim bahwa istrinya tidak bersalah, kemudian para eponim setuju untuk mengizinkannya mengambil istri kedua tanpa menyisihkan yang pertama. Istri kedua ini, keturunan Kheilon dari Sparta (salah satu dari Tujuh Orang bijak Yunani), segera melahirkan seorang anak laki-laki, Kleomenes. Namun, satu tahun setelah kelahiran Kleomenes, istri pertama Anaxandridas juga melahirkan seorang anak laki-laki, Dorieus. Leonidas adalah putra kedua istri pertama Anaxandridas, dan kakak laki-laki atau kembar Cleombrotus. Karena Leonidas bukan pewaris takhta, dia tidak bebas menghadiri agoge, pendidikan sekolah umum yang harus diselesaikan semua putra Spartan agar memenuhi syarat untuk mendapatkan kewarganegaraan. Leonidas dengan demikian merupakan salah satu dari sedikit raja Spartan yang pernah menjalani pelatihan pemuda Spartan yang sangat kasar.",
      "Raja Anaxandridas II meninggal pada tahun 520 SM, dan Kleomenes berhasil naik tahta sekitar tahun 516 SM. Dorieus sangat marah sehingga orang-orang Spartan lebih menyukai saudara tirinya atas dirinya sendiri sehingga dia merasa tidak mungkin tinggal di Sparta. Dia membuat satu usaha yang gagal untuk mendirikan sebuah koloni di Afrika dan, ketika ini gagal, mencari kekayaannya di Sisilia, di mana setelah kesuksesan awal dia terbunuh. Hubungan Leonidas dengan saudara laki-laki tertua yang tidak bereputasi sengit tidak diketahui, tetapi dia menikahi anak perempuan Kleomenes, Gorgo, suatu saat sebelum sampai di takhta pada 490 SM. Leonidas adalah pewaris tahta Agiad dan seorang warga penuh (homoios) pada saat Pertempuran Sepeia melawan Argos (c. 494 SM). Demikian juga, dia adalah warga negara penuh ketika orang Persia meminta pengunduran diri dari Sparta dan mendapat penolakan keras di atau sekitar tahun 492/491 SM. Kakak laki-lakinya, raja, telah dipecat karena dasar kegilaan yang konon, dan telah melarikan diri ke pengasingan saat Athena mencari bantuan untuk melawan invasi Persia Pertama ke Yunani, yang berakhir di Marathon (490 SM).",
      "Plutarch telah mencatat hal berikut: \"Ketika seseorang berkata kepadanya: 'Kecuali untuk menjadi raja, Anda sama sekali tidak superior dari kita,' Leonidas anak Anaxandridas dan saudara laki-laki Kleomenes menjawab: 'Tapi apakah saya tidak lebih baik dari Anda, saya seharusnya tidak menjadi raja. \"Sebagai produk agoge, Leonidas tidak mungkin mengacu pada darah bangsawannya sendiri tapi lebih menyarankan bahwa dia, seperti saudaranya Dorieus, terbukti memiliki kemampuan superior dalam lingkungan persaingan Spartan yang kompetitif dan masyarakat, dan bahwa dia yakin ini membuatnya memenuhi syarat untuk memerintah. Leonidas dipilih untuk memimpin pasukan gabungan Yunani yang bertekad untuk melawan invasi Persia Kedua ke Yunani pada 481 SM. Ini bukan sekadar penghargaan terhadap kecakapan militer Sparta: Kemungkinan bahwa koalisi menginginkan Leonidas secara pribadi atas kemampuannya sebagai pemimpin militer digarisbawahi oleh fakta bahwa hanya dua tahun setelah kematiannya, koalisi lebih memilih kepemimpinan Athena terhadap kepemimpinan Leotychidas. atau penerus Leonidas (sebagai bupati untuk anaknya yang masih di bawah umur) Pausanias. Penolakan Leotychidas dan Pausanias bukanlah cerminan senjata Spartan. Reputasi militer Sparta tidak pernah berdiri dalam hal yang lebih tinggi, juga bukan Sparta yang kurang berkuasa pada tahun 478 SM daripada pada tahun 481 SM. Pemilihan Leonidas untuk memimpin pertahanan Yunani melawan invasi Xerxes menyebabkan kematian Leonidas dalam Pertempuran Thermopylae pada tahun 480 SM.",
    ] },
  { "title" = "Pertempuran Thermopylae", "paragraphs" = [
      "Pada bulan Agustus 480 SM, Leonidas keluar dari Sparta untuk bertemu tentara Xerxes di Thermopylae dengan kekuatan kecil 1.200 orang (900 helots dan 300 Spartan hoplites), di mana dia bergabung dengan pasukan dari negara-negara kota Yunani lainnya, yang menempatkan diri mereka di bawah perintahnya untuk membentuk pasukan berkekuatan 7.000 orang. Ada berbagai teori mengapa Leonidas didampingi oleh kekuatan kecil hoplites. Menurut Herodotus, \"orang-orang Sparta mengirim orang-orang itu ke Leonidas di depan sehingga sekutu lainnya akan melihat mereka dan berbaris tanpa rasa takut akan kekalahan, alih-alih memuji seperti yang lain jika mereka mengetahui bahwa orang-orang Spartan telah menunda. festival Carneia, mereka meninggalkan garnisun mereka di Sparta dan bergerak dengan kekuatan penuh menuju Thermopylae. Sisa dari sekutu-sekutunya berencana untuk melakukan hal yang sama, karena Olimpiade bertepatan dengan kejadian ini, karena mereka mengirim penjaga terlebih dahulu, tidak mengharapkan perang di Thermopylae menjadi memutuskan begitu cepat. \"Banyak komentator modern tidak puas dengan penjelasan ini dan menunjukkan fakta bahwa Olimpiade sedang berlangsung atau menyiratkan perbedaan pendapat dan intrik internal. Apapun alasan kontribusi Sparta sendiri hanya 300 Spartiates (didampingi oleh petugas mereka dan mungkin perioikoi), total kekuatan yang dikumpulkan untuk pertahanan lulus Thermopylae menghasilkan sesuatu antara empat dan tujuh ribu orang Yunani. Mereka menghadapi tentara Persia yang telah menyerang dari utara Yunani di bawah Xerxes I. Herodotus menyatakan bahwa tentara ini terdiri dari lebih dari dua juta orang; ilmuwan modern menganggap ini sebagai pembesar-pembesar dan memberikan perkiraan mulai dari 70.000 sampai 300.000. Xerxes menunggu empat hari untuk…",
    ] },
]

[articles.ko]
text = "레오니다스 1세(그리스어: Λεωνίδας Α')는 고대 그리스 도시국가인 스파르타의 국왕이다. 아기스 왕조 출신의 제17대 스파르타 국왕이자 헤라클레스의 후예로 추앙받던 아낙산드리다스 2세의 아들 가운데 한 사람이다."
title = "레오니다스 1세"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EB%A0%88%EC%98%A4%EB%8B%88%EB%8B%A4%EC%8A%A4_1%EC%84%B8"
intro = [
  "레오니다스 1세(그리스어: Λεωνίδας Α')는 고대 그리스 도시국가인 스파르타의 국왕이다. 아기스 왕조 출신의 제17대 스파르타 국왕이자 헤라클레스의 후예로 추앙받던 아낙산드리다스 2세의 아들 가운데 한 사람이다. 레오니다스 1세는 배다른 형제인 클레오메네스 1세 국왕의 뒤를 이어, 기원전 489년경 왕위에 올랐다. 그는 기원전 40년 사망할 때까지 레오티키다스 2세와 공동으로 통치하였고, 그의 아들 플레이스타르코스가 그의 뒤를 이었다.",
  "제2차 그리스-페르시아 전쟁 당시, 레오니다스는 페르시아 침략군의 진격을 막기 위해 테르모필레 전투에서 그리스 연합군을 이끌고 최후의 항전을 펼쳤으며, 전투의 3일째이자 마지막 날에 전사하였다. 레오니다스는 전쟁 영웅이자 테르모필레 전투에서 사망한 300명의 스파르타인들의 지도자로서 신화의 반열에 올랐다. 그리스군은 이 전투에서 패했으나, 다음 해에 페르시아 침략군을 몰아낼 수 있었다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "헤로도토스에 따르면, 레오니다스의 어머니는 아버지의 유일한 배우자가 아닐 뿐더러 아버지의 조카였고, 너무 오랫동안 아이를 낳지 못하고 있었기 때문에, 스파르타의 헌정 체제에서 매년 선출되는 다섯 명의 행정관인 에포로스는 아낙산드리다스 2세 국왕에게 그녀를 버리고 다른 아내를 맞으라고 설득하려 했다고 한다. 아낙산드리다스는 그녀가 이에 대한 책임이 없다라고 하며, 설득을 거부했고, 이에 에포로스는 첫 번째 부인을 그대로 둔 체 두 번째 부인을 가질 수 있도록 합의하였다. 스파르타의 킬론(그리스 7현인 중 하나)의 후손인 이 둘째 부인은 지체 없이 클레오메네스 1세라는 아들을 낳았다. 그런데 클레오메네스가 태어난 지 1년 만에, 아낙산드리다스의 첫째 부인이 도리에오스라는 아들을 낳았다. 레오니다스는 아낙산드리다스의 첫째 부인의 둘째 아들이며, 쌍둥이 형제 클레옴브로토스의 형이었다. '레오니다스'라는 이름은 '사자의 후예'라는 의미로, 조부인 스파르타의 레온의 이름을 따다 붙여졌다. 아티카 그리스어의 접미사 -ίδης에 해당하는 도리스 그리스어의 접미사 -ίδας는 주로 '~의 후예/후손'을 뜻한다. 하지만 그의 이름은 또한 \"사자의 아들'이라는 의미도 있으며, 레온이라는 이름은 그리스어로 사자를 뜻한다.",
      "아낙산드리다스 2세 왕이 기원전 524년경에 사망하였고, 클레오메네스가 그때부터 기원전 516년 사이에 왕위에 올랐다. 도리에오스는 스파르타인들이 자신보다 배다른 형제를 택한 것에 몹시 분노하였고, 동시에 스파르타에 남아 있는 것이 불가능하다는 것을 깨달았다. 그는 아프리카에 식민 도시를 세우려는 시도를 했다가 실패했고, 이후 시칠리아에서 재기를 하려다가, 초기 성공을 거두고 나서 살해당하고 만다. 레오니다스와 그와 극도로 적대적인 형제 간의 사이는 알려져 있지 않으며, 레오니다스는 기원전 490년에 왕위에 오르기 전 클레오메네스의 딸인 고르고와 혼인하였다.",
      "레오니다스는 아르고스와 맞서 싸운 세페이아 전투 당시(기원전 494년경) 아기아다이 왕위 계승자(클레오메네스 1세의 후임)이자 완전한 시민권자 (오모이오이)이었다. 이처럼, 그는 페르시아인들이 스파르타의 복속 요구와 격렬한 거부 의사를 맞이한 기원전 492/491년 당시 완전한 시민권자이었다. 그의 배다른 형 클레오메네스 국왕은 추정 상 정신이상을 이유로 이미 폐위되어, 망명을 떠났었는데, 이때는 아테네가 마라톤 전투(기원전 490년)로 종전된 제1차 그리스-페르시아 전쟁의 도움을 구하던 때이었다.",
    ] },
  { "title" = "유산", "paragraphs" = [
      "레오니다스에 대한 영웅 숭배는 로마 시대인 안토니누스 왕조(서기 2세기) 때까지 이어졌다. 스파르타에서는 매년 레오니다스를 기리는 '레오니데이아(λεωνιδεῖα)라고 하는 축제가 열렸으며 스파르타인들만이 참여할 수 있었다. 이 행사는 스파르타의 극장 맞은편에서 열렸는데, 그곳에는 파우사니아스와 레오니다스의 두 무덤 기념물이 있었다.",
      "레오니다스 청동상이 1955년 테르모필레에 세워졌다. 이 청동상 아래에는 ΜΟΛΩΝ ΛΑΒΕ(\"와서 가져가라\")라는 한 문구가 기재되어 있다. ΜΟΛΩΝ ΛΑΒΕ는 크세르케스가 스파르타인들에게 무기를 반납하면 목숨을 보전해주겠다고 제안했을 때 레오니다스의 라코닉 답변이었다. ΜΟΛΩΝ ΛΑΒΕ라고 하는 문구가 기재된 또 다른 조각상이 1969년 스파르타에도 만들어졌다.",
      "레오니다스에 대한 그 외 기념물이 2009년 11월 오스트레일리아 멜버른 외곽 브런스윅에 세워졌다. 브런스윅은 1950년대와 60년대 그리스 라코니아 지방 출신 이민자들로 인해 '스파르타의 외곽'으로 알려져 있다.",
    ] },
  { "title" = "참고 문헌", "paragraphs" = [
      "Herodotus, Herodotus, with an English translation by A. D. Godley. Cambridge: Harvard University Press. 1920.",
      "Morris, Ian Macgregor, Leonidas: Hero of Thermopylae, New York, The Rosen Publishing Group, 2004.",
    ] },
]

[articles.ru]
text = "Леони́д I (др.-греч. Λεωνίδας) — царь Спарты из рода Агиадов, правивший в 491—480 годах до н."
title = "Леонид I"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9B%D0%B5%D0%BE%D0%BD%D0%B8%D0%B4_I"
intro = [
  "Леони́д I (др.-греч. Λεωνίδας) — царь Спарты из рода Агиадов, правивший в 491—480 годах до н. э. Участник Греко-персидских войн, погибший в Фермопильском сражении.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "Леонид был третьим из четырёх сыновей, но после смерти Клеомена I и Дориея принял царскую власть: «Леонид был младшим братом Клеомена I и вступил на престол после того, как Клеомен умер, не оставив мужского потомства».",
      "За десять лет своего царствования Леонид I не сделал ничего знаменательного, но обессмертил своё имя сражением при Фермопилах (Тёплые ворота). Он защищал с 6 тысячами воинов (в том числе и личной гвардией из 300 спартанцев) Фермопильский проход при наступлении персидских войск и погиб в бою.",
      "Правитель Ахеменидской Персии Ксеркс I напал на Грецию летом 480 года до н. э. Навстречу ему выступил Леонид I с отрядом из 300 спартанцев и 5620 воинов из других городов. Греки закрепились в ущелье Фермопилы с намерением защищать этот узкий проход как можно дольше.",
    ] },
  { "title" = "Леонид I в искусстве", "paragraphs" = [
      "Царь Леонид является персонажем романа Валерио Манфреди «Спартанец» (оригинальное название — «Щит Талоса», итал. «Lo scudo di Talos»).",
      "Леонид — главный персонаж двух фильмов о Фермопильском сражении и предшествующих ему событиях: «300 спартанцев» 1962 года, где его роль исполняет Ричард Эган, и «300 спартанцев» 2006 года, где его сыграл Джерард Батлер.",
      "Леонид I появляется в роли игрового персонажа в прологе игры Assasin's Creed: Odyssey.",
