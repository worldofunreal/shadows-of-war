[articles.en]
text = "Tlacaelel I was the principal architect of the Aztec Triple Alliance and hence the Mexica (Aztec) empire. He was the son of Emperor Huitzilihuitl and Queen Cacamacihuatl, nephew of Emperor Itzcoatl, father of poet Macuilxochitzin, and brother of Emperors Chimalpopoca and Moctezuma I."
title = "Tlacaelel"
lang = "en"
url = "https://en.wikipedia.org/wiki/Tlacaelel"
intro = [
  "Tlacaelel I (1397 – 1487) (Classical Nahuatl: Tlācaēllel Nahuatl pronunciation: [t͡ɬaːkaˈeːlːel], \"Man of Strong Emotions,\" from \"tlācatl,\" person and \"ēllelli,\" strong emotion) was the principal architect of the Aztec Triple Alliance and hence the Mexica (Aztec) empire. He was the son of Emperor Huitzilihuitl and Queen Cacamacihuatl, nephew of Emperor Itzcoatl, father of poet Macuilxochitzin, and brother of Emperors Chimalpopoca and Moctezuma I.",
  "During the reign of his uncle Itzcoatl, Tlacaelel was given the office of Tlacochcalcatl, but during the war against the Tepanecs in the late 1420s, he was promoted to first adviser to the ruler, a position called Cihuacoatl in Nahuatl, an office that Tlacaelel held during the reigns of four consecutive Tlatoque, until his death in 1487.",
  "Tlacaelel recast or strengthened the concept of the Aztecs as a chosen people, elevated the tribal god/hero Huitzilopochtli to top of the pantheon of gods, and increased militarism. In tandem with this, Tlacaelel is said to have increased the level and prevalence of human sacrifice, particularly during a period of natural disasters that started in 1446 (according to Diego Durán). Durán also states that it was during the reign of Moctezuma I, as an invention of Tlacaelel that the flower wars, in which the Aztecs fought Tlaxcala and other Nahuan city-states, were instigated.",
  "To strengthen the Aztec nobility, he helped create and enforce sumptuary laws, prohibiting commoners from wearing certain adornments such as lip plugs, gold armbands, and cotton cloaks. He also instigated a policy of burning the books of conquered peoples with the aim of erasing all memories of a pre-Aztec past.",
]
sections = [
  { "title" = "In popular culture", "paragraphs" = [
      "He was the inspiration for the main character in the novel, \"Tlacaelel, El Azteca entre los Aztecas,\" (1979) by Mexican author Antonio Velasco Piña.",
      "Amado Zumaya plays Tlacaelel in the 1990 film Return to Aztlán written and directed by Juan Mora Catlett.",
    ] },
]

[articles.ja]
text = "トラカエレル（Tlacaelel、? - 1487年没）は、テノチティトランの初代シワコアトル（宰相）。アステカ三国同盟（アステカ帝国）の創立以来、トラトアニ（アステカの皇帝）と並ぶ2人の君主としてテノチティトランを治めた。"
title = "トラカエレル"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%83%88%E3%83%A9%E3%82%AB%E3%82%A8%E3%83%AC%E3%83%AB"
intro = [
  "トラカエレル（Tlacaelel、? - 1487年没）は、テノチティトランの初代シワコアトル（宰相）。アステカ三国同盟（アステカ帝国）の創立以来、トラトアニ（アステカの皇帝）と並ぶ2人の君主としてテノチティトランを治めた。",
]
sections = [
  { "title" = "生涯", "paragraphs" = [
      "トラカエレルはテノチティトランの第2代トラトアニであるウィツィリウィトルの子であり、第3代のチマルポポカや第5代のモクテスマ1世とは異母兄弟にあたる。伝説によると、トラカエレルはモクテスマ1世と同じ日に生まれたとされる。",
      "当時のテノチティトランはテパネカの中心都市アスカポツァルコに従属していたが、テソソモクなきあと新たにアスカポツァルコのトラトアニに即位したマシュトラとテノチティトランは対立関係にあった。イツコアトル、トラカエレル、および後にトラトアニになるモクテスマ1世の3人は協力し、アスカポツァルコからの独立を企てた。イツコアトルは同様にアステポツァルコと対立していたテスココのネサワルコヨトルと同盟を結び、アスカポツァルコと戦ってこれを滅ぼした。",
      "トラカエレルは長命であり、続くモクテスマ1世、アシャヤカトル、ティソクの時代にもシワコアトルであり続けた。兄のモクテスマ1世がトラトアニであった時代にはとりわけトラカエレルの権力が強かった。トラカエレルは内政のみならず、軍事参謀としても働き、アシャヤカトルやティソクが若いころは助言を行った。トラトアニとシワコアトルはともに君主であったが、外交に関する王であるトラトアニが町から離れることが多いのに対し、内政に関する王であるシワコアトルが町から離れることはめったになかった。特にトラトアニが不在のときはシワコアトルが町を統治し、賓客との応接、祭祀、裁判などを行った。",
    ] },
  { "title" = "子孫", "paragraphs" = [
      "長男のカカマはトラコチカルカトル（将軍）だった。カカマには12人の子があったが、一番上の子供は女性で、テスココのトラトアニであるネサワルピリと結婚し、やはりカカマという名の子を生んだ。カカマは父をついでテスココのトラトアニに即位した。次の子は祖父と同じトラカエレルという名前で、トリルポトンキをついで第3代シワコアトルになった（在位1503-1520）。3番目の子はチクェイ・アショチツィンといって優れた戦士だった。",
      "次男のトリルポトンキは父を継承して第2代シワコアトルの職につき、17年にわたってその位にあったが、1503年に死んだ。彼の娘はモクテスマ2世の妻になって2人の娘を生んだ。",
      "トラカエレルの孫のトラコツィンは最後のシワコアトルであり、アステカ最後の皇帝であるクアウテモクとともに1521年にシワコアトルに選ばれた。トラコツィンはクアウテモクとともにエルナン・コルテスのホンジュラス遠征に同行させられた。クアウテモクが反乱の疑いによって処刑された後、コルテスはトラコツィンをトラトアニに選んだ。トラコツィンはキリスト教に改宗してフアン・ベラスケスの名を得た。しかし、遠征から帰国する前、1526年に病死した。",
    ] },
  { "title" = "参考文献", "paragraphs" = [
      "Codex Chimalpahin. 1. edited and translated by Arthur J. O. Anderson and Susan Schreder. University of Oklahoma Press. (1997). ISBN 0806129212",
      "Read, Key Almere; González, Jason J. (2000). Handbook of Mesoamerican Mythology. ABC-CLIO, Inc. ISBN 0874369983",
      "Townsend, Richard F. (2000) . The Aztecs (Revised ed.). Thames & Hudson. ISBN 0500281327",
    ] },
]

