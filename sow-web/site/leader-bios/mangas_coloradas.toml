[articles.en]
text = "Mangas Coloradas or Mangus-Colorado, or Dasoda-hae was an Apache tribal chief and a member of the Mimbreño (Tchihende) division of the Central Apaches, whose homeland stretched west from the Rio Grande to include most of what is present-day southwestern New Mexico. He was the father-in-law of Chiricahua (Tsokanende) chief Cochise, Mimbreño chief Victorio, and Mescalero (Sehende) chief Kutu-hala or Kutbhalla."
title = "Mangas Coloradas"
lang = "en"
url = "https://en.wikipedia.org/wiki/Mangas_Coloradas"
intro = [
  "Mangas Coloradas or Mangus-Colorado (La-choy Ko-kun-noste, alias \"Red Sleeves\"), or Dasoda-hae (c. 1793 – January 18, 1863) was an Apache tribal chief and a member of the Mimbreño (Tchihende) division of the Central Apaches, whose homeland stretched west from the Rio Grande to include most of what is present-day southwestern New Mexico. He was the father-in-law of Chiricahua (Tsokanende) chief Cochise, Mimbreño chief Victorio, and Mescalero (Sehende) chief Kutu-hala or Kutbhalla (probably to be identified with Caballero). He is regarded as one of the most important Native American leaders of the 19th century because of his fighting achievements against the Mexicans and Americans.",
  "The name Mangas Coloradas (red sleeves) was given to him by Mexicans. Named A Bedonkohe (Bi-dan-ku – 'In Front of the End People', Bi-da-a-naka-enda – 'Standing in front of the enemy') at birth, he married into the Copper Mines local group of the Tchihende and became the principal chief of the whole Tchihende Apache division. His influence also included the neighboring Mimbreño local group of the Warm Springs Tchihende, directly led by chief Cuchillo Negro (in Apache language, Baishan), second chief of the Tchihende Apache division and his long-time companion.",
]
sections = [
  { "title" = "Apache war chief", "paragraphs" = [
      "During the 1820s and 1830s, the Apaches' main enemy were the Mexicans, who had won their independence from Spain in 1821. By 1835, Mexico had placed a bounty on Apache scalps. After Juan José Compa, the leader of the Coppermine Mimbreño Apaches, was killed for bounty money in 1837 in the massacre at Santa Rita del Cobre, Mangas became a war leader and a chief, joining forces with his friend and long-time companion (and possibly brother-in-law) Cuchillo Negro (Spanish: Black Knife). They began a series of retaliatory raids against the Mexicans, around the mining town and besieged Santa Rita, attacking the column of fleeing Mexicans and slaughtering a large number. Mangas Coloradas became the principal leader of the Coppermine Mimbreños and led them for about 25 years while Cuchillo Negro led the Warm Springs Mimbreños.",
      "In 1846, when the United States went to war with Mexico, the Apache Nation promised U.S. soldiers safe passage through Apache lands. Once the U.S. occupied New Mexico in 1846, Mangas Coloradas signed a peace treaty, respecting them as conquerors of the hated Mexican enemy. An uneasy peace between the Apache and the United States lasted until an influx of gold miners into New Mexico's Pinos Altos Mountains led to open conflict.",
      "In 1851 the settlement at Santa Rita del Cobre of the U.S. delegation (with John Russell Bartlett) in the Mexican-American Border Commission and the reopening of the Santa Rita del Cobre copper mines increased tensions as well. Mangas Coloradas, like Cuchillo Negro, Delgadito, Ponce, Coleto Amarillo, and the most important Tchihende and Ndendahe chiefs, had to face new problems. In June 1851 Mangas Coloradas, Delgadito, Ponce, and Coleto Amarillo met Bartlett in Santa Rita del Cobre; the discussions continued until the Apaches no longer felt disappointed and betrayed by the newcomers.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "In the summer of 1862, after recovering from a bullet wound in the chest, Mangas Coloradas met with an intermediary to call for peace. In January 1863, he decided to meet with U.S. military leaders at Fort McLane (Apache Tejo) in southwestern New Mexico. He was promised provisions in return for peace, but the American government did not want to have peace with them. Mangas arrived under a flag of truce to meet with Brigadier General Joseph R. West, an officer of the California militia and a future Reconstruction senator from Louisiana. Armed soldiers took Mangas into custody. West gave an execution order to the sentries.",
      "Men, that old murderer has got away from every soldier command and has left a trail of blood for 500 miles on the old stage line. I want him dead tomorrow morning. Do you understand? I want him dead.",
      "That night, Mangas was tortured, shot, and killed under the pretext of a supposed escape attempt. While tied on the ground, Mangas was provoked with red hot bayonets until he moved to simulate his attempt to \"escape.\" The following day, some soldiers who were fascinated by the size of the Apache (Mangas was 6 feet, 6 inches tall), cut off his head, boiled it, and sent the skull to Orson Squire Fowler, a phrenologist in New York City. Analysis of the skull and two sketches of it appear in Fowler's book.",
    ] },
]

[articles.es]
text = "Mangas Coloradas (c. 1790 Santa Lucía Nuevo México,Virreinato de la Nueva España- 18 de enero de 1863), Red Sleeves (en inglés) y Dashoda-hae (el nombre original) fue un jefe apache de la banda de los chihenne o mimbreño (en español: los que se pintan de rojo) Buscó siempre una confederación entre los distintos pueblos apaches, llegando a alianzas con otras tribus. Casó a sus hijas con otros líderes tribales para consolidar relaciones de amistad por lo emparentó con Cochise, jefe de los chiricacuas chokonen de esta manera, y su alianza fue la más duradera.​"
title = "Mangas Coloradas"
lang = "es"
url = "https://es.wikipedia.org/wiki/Mangas_Coloradas"
intro = [
  "Mangas Coloradas (c. 1790 Santa Lucía Nuevo México,Virreinato de la Nueva España- 18 de enero de 1863), Red Sleeves (en inglés) y Dashoda-hae (el nombre original) fue un jefe apache de la banda de los chihenne o mimbreño (en español: los que se pintan de rojo)",
  "Buscó siempre una confederación entre los distintos pueblos apaches, llegando a alianzas con otras tribus. Casó a sus hijas con otros líderes tribales para consolidar relaciones de amistad por lo emparentó con Cochise, jefe de los chiricacuas chokonen de esta manera, y su alianza fue la más duradera.​",
]
sections = [
  { "title" = "Historia", "paragraphs" = [
      "Mangas Coloradas se cree que era hijo de padre apache y madre hispana. Sus hermanos fueron Chaha, José Mangas, Pitfhan y Phalios (Félix) Palacio.​ Su pueblo habitaba en la zona de las montañas Mimbres y a lo largo del río Mimbres, en un territorio que entonces formaba parte de Nueva España y, a partir de 1821, de México. Llegó a ser un hombre alto y corpulento y su apodo podría provenir por haber vestido una llamativa camisa de franela roja. John Carey Cremony, miembro de la Comisión Fronteriza designada para trazar la línea divisoria entre los Estados Unidos y México, lo conoció en Santa Rita del Cobre en 1851 y lo describe en su obra Life Among the Apaches:",
      "Documentos históricos que citan a Mangas Coloradas son de 1842. Se cree que esto podría ser porque antes fuera conocido con otro sobrenombre. Entre 1815 y 1830, los textos hablan de un líder chihenne llamado Fuerte, y a partir de 1840 ya no es citado más, por lo que este y Mangas bien pudieran ser la misma persona.​",
      "Cuando el gobierno mexicano dejó de proveer alimentos a los indios autóctonos de la zona, estos comenzaron a cometer asaltos y robos en pueblos y ranchos. Las relaciones entre mexicanos y apaches se tensaron, y el estado de Chihuahua declaró la guerra a los apaches el 16 de octubre de 1831.",
    ] },
  { "title" = "Muerte", "paragraphs" = [
      "El 14 de julio de 1862, Mangas Coloradas participó en la primera auténtica batalla entre apaches y militares estadounidenses: la batalla de Apache Pass. En el marco de la guerra de Secesión, el ejército de la Unión había enviado desde Tucson una expedición de avituallamiento hacia Nuevo México para abastecer a las tropas que allí luchaban. El convoy fue interceptado por un grupo de apaches liderados por Cochise y Mangas Coloradas, todos armados con rifles. El tiroteo fue intenso y los militares estadounidenses tuvieron que montar los cañones que transportaban para repeler el ataque.​En un incidente tras la batalla, Mangas Coloradas resultó herido gravemente y sus hombres lo llevaron hasta la población mexicana de Janos, distante unos doscientos kilómetros, donde lo asistió un médico en quien los apaches confiaban.​",
      "A principios de enero de 1863, el coronel y ascendido a general de brigada, instala su cuartel en Fort McLane (Grant County, Nuevo México) Joseph Rodman West, y ordena al capitán del 1° de caballería de los voluntarios de California, Edmond Shirland la captura de Mangas Coloradas, ya cerca de 70 años de edad. Shirland contrató y envió el 16 de enero de 1863 al explorador Jack Swilling con el fin de engañar a Mangas Coloradas y convencerle de que los blancos deseaban firmar la paz. A pesar de que su amigo Victorio y otros de ellos se oponían, el jefe apache, acudió al encuentro de Shirland, quien lo acusó de asesino y tramposo, y tras breve discurso en inglés, del cual Mangas Colordas no entiende nada, lo capturó y llevó al campamento del general West, desde donde lo llevaron a Fort MacLean tras rechazar a la escolta de Mangas Coloradas. Esa misma noche, West dispuso su encarcelamiento y sugirió a los centinelas que prefería no verlo vivo al día siguiente. A la 1 a. m. del 19 de enero, el sargento Henry C. Foljaine y los soldados James Colyer y John V. Meal torturaron a Mangas Coloradas con sus bayonetas calentadas al fuego, lo apedrearon y le dispararon matándolo. En el informe de los hechos redactado por West se notificó que los centinelas le habían disparado mientras el prisionero intentaba huir.​",
      "A la mañana siguiente el soldado John T. Wright con un cuchillo de cocina, arrancó la cabellera y con posterioridad, el cadáver de Mangas Coloradas fue decapitado, su cuerpo enterrado y su cabeza, tras ser hervida, fue enviada a Orson Squire Fowler, un prestigioso frenólogo de Nueva York, quien incluyó sus impresiones sobre el estudio del cráneo del apache y un par de ilustraciones en su obra Human Science or Phrenology (1873), ​entre las que determinó que la cabeza era más grande que la de Daniel Webster considerado gran pensador y literato del siglo XIX. (Según el razonamiento de la época, el tamaño de la cabeza tenía que ver con la inteligencia del individuo).",
    ] },
  { "title" = "Esposas e hijos", "paragraphs" = [
      "Mangas Coloradas tuvo 15 hijos con 4 esposas, tres de ellas apaches dos de ellas fallecidas en la masacre del 22 de abril de 1837 por James Johnson. Luego raptó a una doncella mexicana llamada Carmelita para desposarla y nombrar como Tu-es-seh, prevaleciendo sobre las mujeres apaches, ocasionando problemas y los ofendidos lo desafiaron siendo muertos en duelo.",
      "Con Carmelita tuvo tres hijas las cuales la primera, Dos-teh-seh la casó con Cochise, la segunda con apaches mezcaleros (Kutu-hla) y la tercera con uno de los apaches de White Mountain, (quizás Cosito o Esh-kel-dah-silah.) Otra de sus hijas, Nah-ke-de-sah se casó con Gonah-hleenah, un guerrero bedonkohe. La hija más joven de Mangas Coloradas era Ilth-to-da, nacida alrededor de 1855, quien en la década de 1880 se casó con un chokonen llamado Astoyeh.",
      "John R. Bartlett, un funcionario civil estadounidense, Mangas Coloradas tenía nueve hijos cuando se reunió con él en 1851, por lo cual relató: “Tenía una gran familia de brillantes e inteligentes hijos, chicos y chicas, con quienes era muy cariñoso, y con quienes estaba muy unido. Por ellos y por el bienestar de su tribu no dudo que él estaría dispuesto a hacer cualquier sacrificio”.El hijo mayor Cascos se casó con una mujer bedonkohe, quien luego asumió el liderazgo de su banda en 1850. Había nacido en 1820 y murió en Sonora en 1858. Otro hijo llamado Sethmooda, tuvo dos esposas, y una de ellas fue la hija del jefe chihenne Loco, Bey-it-tsum. Fue asesinado inmediatamente después de su padre Mangas Coloradas en 1863. Luis fue otro de sus hijos líder de una banda bedonkohe a principios de 1860, siendo muerto por soldados voluntarios de California el 24 de febrero de 1864. Salvador nacido en 1830 fue líder de una pequeña banda chihenne, y atacó a Pinos Altos con 125 apaches. En 1868, fue con Loco a entablar negociaciones de paz, y los dotaron de una reserva para ellos en Cañada Alamosa. En noviembre de 1870 se fue con su cuñado Cochise, muriendo a finales de febrero de 1871 en manos de soldados estadounidenses en las Montañas Mogollón. Otros dos hijos de Mangas Coloradas fueron Cassori y Chastine o Thastine, de quienes se sabe poco. El más joven y más conocido de sus hijos fue Mangas, quien nació en 1846 o 1855, quien se casó con una hija de Victorio, Dilth-cleyhen. Huyó con Gerónimo y Naiche en 1885, falleciendo el 23 de abril de 1901 en Fort Sill Oklahoma.",
    ] },
  { "title" = "Bibliografía", "paragraphs" = [
      "Cremony, John C. (1868). Life Among the Apaches (en inglés). San Francisco: A. Roman & Company.",
      "Roberts, David (2005) [​1993​]. Las guerras apaches. (Once They Moved Like The Wind). Barcelona: Edhasa. p. 514. ISBN 84-350-2677-9.",
      "Sweeney, Edwin R. (1998). Mangas Coloradas: Chief of the Chiricahua Apaches (en inglés). Norman, University of Oklahoma Press. p. xxiii+578. ISBN 0-8061-3063-6.",
    ] },
]

[articles.fr]
text = "Mangas Coloradas (« manches rouges ») ou Mangus Colorado ou Dasoda hae (né entre 1790 et 1797 et mort le 18 janvier 1863) est un chef amérindien de la tribu Mimbreño des toutes premières années des guerres apaches. Certains historiens le considèrent comme le plus important chef de guerre du XIXe siècle, en particulier par le fait qu’il fut celui qui unifia les Apaches contre les colons."
title = "Mangas Coloradas"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Mangas_Coloradas"
intro = [
  "Mangas Coloradas (« manches rouges ») ou Mangus Colorado ou Dasoda hae (né entre 1790 et 1797 et mort le 18 janvier 1863) est un chef amérindien de la tribu Mimbreño des toutes premières années des guerres apaches.",
  "Certains historiens le considèrent comme le plus important chef de guerre du XIXe siècle, en particulier par le fait qu’il fut celui qui unifia les Apaches contre les colons. Les textes de l’époque le présentent comme un chef d’État influent, un diplomate, un sage, autant qu’un guerrier féroce, intransigeant et brutal. Mangas laissait toujours le chapeau sur la tête de ses victimes, même lorsqu’elles avaient été scalpées[réf. nécessaire].",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Mangas Coloradas est né dans les années 1790 dans la région appelée aujourd’hui Nouveau-Mexique. Son groupe habitait dans les montagnes Mimbres et le long de la rivière du même nom. Mangas est décrit comme un homme de grande taille, très musclé, avec une large tête, imperturbable quelles que soient les circonstances.",
      "L’hostilité entre les mexicains et les Apaches commença à grandir en 1831 et c’est alors que Mangas se distingua comme un des leaders de la lutte contre eux, et plus tard, les Américains.",
      "En 1837, quand Juan José Compa, le chef des Apaches Mimbreño fut assassiné, Mangas devint le leader de la révolte et mena de nombreux raids de représailles contre les Mexicains. Quand les États-Unis s’emparèrent de territoires mexicains en 1846, Mangas signa un traité de paix déclarant qu’il respectait les Américains comme des conquérants, principalement parce qu’il haïssait lui-même les Mexicains.",
    ] },
  { "title" = "Annexes", "paragraphs" = [
      "(en) Eve Ball, Nora Henn et Lynda Sanchez, Indeh : an Apache odyssey, Norman, University of Oklahoma Press, 1988, 334 p. (ISBN 978-0-8061-2165-9, OCLC 44964109, lire en ligne).",
      "(en) Jason Betzinez et Wilbur Sturtevant Nye, I Fought with Geronimo, Harrisburg, Stackpole, 1959, 214 p. (OCLC 35908794).",
      "(en) Dee Brown, Bury My Heart at Wounded Knee : an Indian history of the American West, New York, Sterling Innovation, 2009 (1re éd. 1970), 544 p. (ISBN 978-1-4027-6066-2, OCLC 310398428, lire en ligne).",
    ] },
]

[articles.de]
text = "Mangas Coloradas (* 1797; † 18. Januar 1863), (span.-mexikanisch: ‘(blut)rot gefärbte Ärmel’) oder Red Sleeves (engl.: ‘Rote Ärmel’), auch Dasoda-hae (‘He Just Sits There’), war ein Häuptling der Chihenne-Chiricahua-Apachen."
title = "Mangas Coloradas"
lang = "de"
url = "https://de.wikipedia.org/wiki/Mangas_Coloradas"
intro = [
  "Mangas Coloradas (* 1797; † 18. Januar 1863), (span.-mexikanisch: ‘(blut)rot gefärbte Ärmel’) oder Red Sleeves (engl.: ‘Rote Ärmel’), auch Dasoda-hae (‘He Just Sits There’), war ein Häuptling der Chihenne-Chiricahua-Apachen. Der Name Mangas Coloradas ist die Aufnahme seines Apache-Spitznamens Kan-da-zis Tlishishen (Red Shirt oder Pink Shirt) durch Mexikaner und Spanier. Er war ein gebürtiger Bedonkohe, hatte jedoch in die Copper Mines-Lokalgruppe der Chihenne (‘Red Painted People’ - ‘Rot-bemaltes Volk’), die östliche Gruppe (engl. band) der Chiricahua, eingeheiratet, deren Führung er, damals noch als Fuerte bekannt, gegen 1814 übernahm. Als der wahrscheinlich bedeutendste Führer der Bedonkohe (Bi-dan-ku - ‘In Front of the End People’, Bi-da-a-naka-enda - ‘Standing in front of the enemy’), Mahko, starb, waren die Bedonkohe führerlos und fanden in dem gebürtigen Bedonkohe den geeigneten Anführer. Somit wurde in den 1820er Jahren Mangas Coloradas zudem Häuptling der Bedonkohe. Zudem war er der Schwiegervater von Cochise, dem Häuptling der Chihuicahui-Lokalgruppe der Chokonen (‘Ridge of the Mountainside People’), der zentralen Gruppe der Chiricahua (daher auch wirkliche oder Zentrale Chiricahua), und wird von vielen Historikern als einer der wichtigsten indianischen Führer des 19. Jahrhunderts betrachtet, aufgrund seiner Erfolge im Kampf gegen Mexikaner und Amerikaner. Es gibt keine bekannten Fotografien von Mangas Coloradas; einer seiner Söhne, Mangus, wurde fotografiert und wird fälschlicherweise manchmal als Mangas Coloradas identifiziert.",
]
sections = [
  { "title" = "Territorium der Chihenne und Bedonkohe", "paragraphs" = [
      "Die Copper Mines waren höchstwahrscheinlich eine Chihenne-Lokalgruppe, bestehend aus Chihenne und Bedonkohe, die südwestlich des Gila River lebten, besonders bei den Santa Lucia Springs in den Burro Mountains, nordwestlich des heutigen Silver City, und die Pinos Altos Mountains, Pyramid Mountains und die Umgebung von Santa Rita del Cobre entlang des Mimbres River im Osten beherrschten. Früher oft, zusammen mit anderen Chiricahua-Lokalgruppen, die entlang des Gila River lebten, als Gileños oder Gila Apaches bezeichnet, wurden sie, nachdem rund um Santa Rita del Cobre ertragreiche Kupferlagerstätten entdeckt wurden, in der Folge meist als Copper Mine Apaches (Kupferbergbau-Apachen) bezeichnet.",
      "Die Bedonkohe lebten nördlich und westlich der Chihenne in den Mogollon Mountains und Tularosa Mountains zwischen dem San Francisco River im Westen und dem Gila River im Südosten im Westen New Mexicos. Da ihr bevorzugtes Rückzugsgebiet oft die Mogollon Mountains waren, wurden sie auch Mogollon Apaches genannt. Genau wie die südlich lebenden Chihenne wurden sie, zusammen mit allen entlang des Gila River lebenden Chiricahua-Lokalgruppen, als Gileños oder Gila Apaches bezeichnet.",
      "Zudem hatte er erheblichen Einfluss auf die Anführer der östlich benachbarten Mimbres/Mimbreño-Lokalgruppe der Chihenne, die im südöstlichen West-New Mexico, zwischen dem Mimbres River und dem Rio Grande in den Mimbres Mountains und der Cook’s Range lebten.",
    ] },
  { "title" = "Leben", "paragraphs" = [
      "Mangas Coloradas überlebte 1835 ein Massaker der Mexikaner an den Bedonkohe. In den folgenden Jahren führte er seine Krieger unzählige Male in den Kampf gegen die Mexikaner. Während des Mexikanisch-Amerikanischen Krieges verbündete er sich mit dem US-General Philip Kearny gegen die Mexikaner. Es gelang den Bedonkohe, die Mexikaner zu vertreiben, die im Bedonkohe-Gebiet Kupfer abbauten. Wenig später entdeckten Amerikaner bei ihnen Gold und Silber. 1850 besetzte die US-Armee ihr Land am Gila River. In der Folge strömten Hunderte von Goldsuchern herbei; es entstand die Goldgräberstadt Pinos Altos im US-Bundesstaat New Mexico. Bei einem Besuch im Jahre 1861 in Pinos Altos wurde Mangas Coloradas gefangen genommen, ausgepeitscht und davongejagt.",
      "Ein Jahr später wurde Mangas Coloradas zusammen mit rund 700 Kriegern der Bedonkohe sowie der Chokonen-Apachen unter seinem Schwiegersohn Cochise am Apache-Pass von 126 US-Soldaten geschlagen. Der 65-jährige Mangas Coloradas wurde durch eine Kugel in die Brust verletzt.",
      "Anfang 1863 besuchte ein Mexikaner unter der weißen Flagge die Mimbreno, um mit ihnen im Namen der US-Armee Friedensverhandlungen aufzunehmen. Mangas Coloradas erklärte sich bereit, ihn alleine in das alte Fort McLane zu begleiten. Kaum war er mit dem Mexikaner alleine, stürzten jedoch Soldaten von General Joseph R. West aus dem Gebüsch und nahmen ihn gefangen. Im Fort angekommen gab West den Befehl, Mangas Coloradas in der kommenden Nacht zu töten. Die Soldaten versengten ihm zuerst mit erhitzten Bajonetten die Füße und Beine. Als Mangas Coloradas protestierte, erschossen sie ihn. Anschließend skalpierten und enthaupteten sie ihn. Der Rumpf wurde in einem Graben verscharrt. In offiziellen Militärberichten hieß es, Mangas Coloradas sei bei einem Fluchtversuch getötet worden.",
    ] },
  { "title" = "Bedeutung", "paragraphs" = [
      "Mangas Coloradas war aufgrund seiner Körpergröße von 2,05 Metern eine imposante Erscheinung. Obwohl von den Weißen immer wieder verraten und betrogen, versuchte er mehrfach, mit ihnen Frieden zu schließen. Er hasste die Weißen nicht, worauf auch seine Heirat mit einer Mexikanerin hindeutet. Trotzdem errang er als Kriegshäuptling Bedeutung. Zusammen mit Cochise, Geronimo, Victorio und anderen gehörte er zu den bekanntesten Apachen-Kriegern, die gegen die Unterwerfung durch die Weißen kämpften.",
    ] },
  { "title" = "Filme", "paragraphs" = [
      "War Drums (1957); deutscher Titel: Rebell der roten Berge, 1963 mit neuem Titel: Der Häuptling der Apachen; Drehbuch: Gerald Drayson Adams; Regie: Reginald de Borg; Hauptrolle: Lex Barker",
    ] },
]

[articles.it]
text = "Mangas Coloradas, spesso pronunciato dagli anglo-americani Mangus Colorado (vero nome Lachoy-kokunnoste, in italiano Maniche Colorate, in inglese Red Sleeve, o Dasoda-hae, ovvero Colui che siede lì, in inglese: He Just Sitting There) (1793 circa – Hurley, 18 gennaio 1863), è stato un condottiero nativo americano, importante capo Tchihende (Mimbreño) Apache della sottodivisione Copper Mines dal decennio 1830 fino ai primi anni del decennio 1860. Il territorio Mimbreño, situato tra il territorio Mescalero a est e il territorio Chiricahua a ovest, comprendeva il Nuovo Messico sud-occidentale a ovest del Rio Grande."
title = "Mangas Coloradas"
lang = "it"
url = "https://it.wikipedia.org/wiki/Mangas_Coloradas"
intro = [
  "Mangas Coloradas, spesso pronunciato dagli anglo-americani Mangus Colorado (vero nome Lachoy-kokunnoste, in italiano Maniche Colorate, in inglese Red Sleeve, o Dasoda-hae, ovvero Colui che siede lì, in inglese: He Just Sitting There) (1793 circa – Hurley, 18 gennaio 1863), è stato un condottiero nativo americano, importante capo Tchihende (Mimbreño) Apache della sottodivisione Copper Mines dal decennio 1830 fino ai primi anni del decennio 1860.",
  "Il territorio Mimbreño, situato tra il territorio Mescalero a est e il territorio Chiricahua a ovest, comprendeva il Nuovo Messico sud-occidentale a ovest del Rio Grande.",
]
sections = [
  { "title" = "Guerriero e capo Apache: il tempo dei Nakaiye", "paragraphs" = [
      "Nei decenni 1820’ – 1830’, dopo l’indipendenza conseguita nel 1821, i Messicani (Nakaiye) divennero il principale nemico degli Apache e anche Mangas Coloradas, come Cuchillo Negro, Barranquito, Gomez e gli altri capi di guerra Apache, conseguì la sua fama principalmente combattendo i Navaho e, soprattutto, i Messicani. Secondo alcuni studi di ascendenza Bedonkohe e non illustre, sarebbe diventato, nel decennio 1830, il principale capo della divisione Tchihende Apache, prima come capo dei Copper Mines Tchihende e poi, affermandosi in termini generali come capo principale dei Mimbreño inclusi gli Warm Springs Tchihende, direttamente sottoposti al famoso e temuto Cuchillo Negro (in lingua Apache Baishan), a propria volta secondo capo dell’intera divisione Tchihende Apache e suo compagno di gioventù, nonché, probabilmente, cognato.",
      "Mangas Coloradas praticò un’abile politica di alleanze familiari, divenendo suocero del capo Chiricahua (Tsokanende) Cochise, del Mimbreño (sottodivisione Warm Springs) Victorio, poi successore di Cuchillo Negro, e del Mescalero (Sehende, probabilmente sottodivisione Sacramento) Kutu-hala o Kutbhalla (probabilmente da identificarsi con Caballero), ed è considerato una personalità di primo piano nel suo tempo. Nel 1835, il Messico (e in particolare gli Stati di Chihuahua e Sonora) iniziò a pagare una taglia per gli scalpi Apache, provocando il proliferare di vere e proprie bande di cacciatori di scalpi.",
      "Nel 1837 Juan José Compa, capo (col fratello Juan Diego Compa) dei Coppermine Mimbreño Apaches, fu ucciso dai cacciatori di scalpi di James Johnson nel corso di un massacro a tradimento a Santa Rita del Cobre; Mangas Coloradas, il principale luogotenente di Juan José e Juan Diego, divenne capo dei guerrieri e dei Coppermine Apache, e, unite le forze con quelle del sodale di gioventù e di diverse imprese Cuchillo Negro (Black Knife) - figlio di Fuerte (conosciuto anche come Soldado Fiero), ucciso dai soldati messicani nel 1835 o nello stesso 1837 nella stessa zona, e capo degli Warmspring Mimbreño Apache -, supposto essere suo cognato, intraprese una serie di spedizioni per vendicarsi dei Messicani, facendo terra bruciata nell’intera regione circostante la cittadina mineraria di Santa Rita del Cobre, assediandola e tagliandola fuori dal mondo, per completare l’opera assalendo la colonna dei Messicani in fuga e massacrandone la maggior parte. Mangas Coloradas divenne il capo supremo dei Coppermine Mimbreños, guidandoli per circa 25 anni, mentre Cuchillo Negro fu, nello stesso periodo fu il capo supremo degli Warm Springs Mimbreños.",
    ] },
  { "title" = "Guerriero e capo Apache: l'arrivo dei Pindah-likoyee", "paragraphs" = [
      "Nel 1846, scoppiata la Guerra tra gli U.S.A. e il Messico, gli Apache accordarono alle truppe statunitensi dirette in Messico libero passaggio attraverso il proprio territorio, e, quando, nello stesso 1846, truppe statunitensi si insediarono nel Nuovo Messico, Mangas Coloradas stipulò coi nuovi venuti (Pindah-likoyee), vittoriosi sugli odiati Messicani, un trattato di pace, mantenendo uno stato di pace, seppur precaria, con loro fino all’intrusione nel territorio Apache, nella zona delle Pinos Altos Mountains, da parte dei cercatori d’oro e d’argento.",
      "Nel 1851 si insediò a Santa Rita del Cobre la delegazione statunitense (guidata dal generale J.R. Bartlett) nella Commissione per la definizione del confine USA-Messico, pretendendo di trattare con gli Apache anche la riapertura delle miniere di rame di Santa Rita del Cobre e ottenendo l’adesione dei capi a un incontro coi neoarrivati Anglo-Americani. Per Mangas Coloradas, come per Cuchillo Negro, Delgadito, Ponce, Coletto Amarillo e tutti più importanti capi Tchihende e Ndendahe, si preannunciavano nuovi problemi. Nel giugno 1851 Mangas Coloradas, con Delgadito, Ponce e Coletto Amarillo, si presentò a Santa Rita del Cobre per incontrare Bartlett, e le discussioni si protrassero finché gli Apache si resero conto che la loro fiducia sarebbe stata tradita dai nuovi “padroni”.",
      "Come testimoniato da John C. Cremony (Life Among the Apaches), nel 1861, presso l’accampamento minerario di Pinos Altos, Mangas Coloradas fu assalito da un gruppo di minatori bianchi, legato a un albero e ferocemente frustato, sebbene l’episodio venga ignorato da Edwin R. Sweeney nella biografia da lui scritta (forse in quanto non ricordato da Geronimo, che trascorse molto tempo con i Mimbreños dell’anziano capo, ma le cui memorie risultano in più casi imprecise). Nel frattempo, l’uccisione di Cuchillo Negro da parte dei militari statunitensi del col. William W. Loring al Canyon de los Muertos Carneros (25 maggio 1857), nell’ambito della spedizione condotta dal col. Benjamin L.E. Bonneville contro i Coyoteros, aveva avvelenato i rapporti tra i Mimbreños e i bianchi.",
    ] },
  { "title" = "Morte", "paragraphs" = [
      "Guarito dalla ferita, nell’estate 1862 Mangas Coloradas accettò di incontrare un emissario statunitense e, nel gennaio 1863, si recò a Fort McLane (Apache Tejo), nel Nuovo Messico sudoccidentale, sotto la bandiera di tregua, per incontrare il brig. gen. Joseph Rodman West, della milizia californiana (futuro Senatore per la Louisiana nel famigerato periodo della “Ricostruzione” post-bellica); gli erano stati promessi rifornimenti e provviste per gli Apache in cambio della pace, ma gli Unionisti avevano altri progetti, non diversi da quelli dei Confederati del col. Baylor. Il capo Apache fu affidato a guardie armate alle quali West impartì ordini inequivocabili di ucciderlo prima del mattino successivo; torturato con baionette arroventate mentre era a terra legato, non appena riuscì ad alzarsi fu ucciso col pretesto di un “tentativo di fuga” il 18 gennaio 1863.",
      "Staccata la testa dal corpo del colossale capo Apache (che superava abbondantemente il metro e ottantacinque con un fisico robusto e perfettamente proporzionato), i militari spedirono il cranio al frenologo Orson Squire Fowler, a New York City, che lo espose nel proprio studio e pubblicò in un libro la relazione e due schizzi del cranio stesso; secondo Daklugie, figlio di Juh, il cranio sarebbe stato conservato nella Smithsonian Institution, che peraltro ne smentì il possesso. L’assassinio di Mangas Coloradas, e lo sfregio arrecato al suo cadavere, dopo l’uccisione di Cuchillo Negro, indussero Cochise, Victorio, Nana, Juh e Geronimo a intraprendere una guerra che gli Apache avrebbero condotto per i successivi 25 anni.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(EN) Edwin R. Sweeney Mangas Coloradas, Chief of the Chiricahua Apaches, University of Oklahoma Press, Norman, 1998. ISBN 0-8061-4239-1",
      "(EN) Edwin R. Sweeney Cochise, Chief of the Chiricahua Apaches, University of Oklahoma Press, Norman, 1991. ISBN 9780806123370",
      "(EN) Dan L. Thrapp The Conquest of Apacheria, University of Oklahoma Press, Norman, 1967. ISBN 0-8061-1286-7",
    ] },
]

[articles.ru]
text = "Ма́нгас Колора́дас (исп. Mangas Coloradas, ок.1791 — 18 января 1863) — вождь чихенне, одной из групп чирикауа-апачей."
title = "Мангас Колорадас"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D0%BD%D0%B3%D0%B0%D1%81_%D0%9A%D0%BE%D0%BB%D0%BE%D1%80%D0%B0%D0%B4%D0%B0%D1%81"
intro = [
  "Ма́нгас Колора́дас (исп. Mangas Coloradas, ок.1791 — 18 января 1863) — вождь чихенне, одной из групп чирикауа-апачей. Он более 50 лет возглавлял своих людей в борьбе против мексиканцев и американцев.",
]
sections = [
  { "title" = "Ранние годы", "paragraphs" = [
      "Мангас Колорадас родился приблизительно в 1791 году в одной из общин чихенне. К 1814 году он становится одним из лидеров восточных чирикауа, а в 1820 году вождём. После того, как его дочь вышла замуж за Кочиса, возросло его влияние среди чоконенов, центральных чирикауа.",
      "Его имя на языке чирикауа означает Красные Рукава, испанцы преобразовали его в Мангас Колорадас, имя, под которым он и стал известен в истории. Большую часть своей молодости Мангас Колорадас прожил на исторической территории чихенне, вблизи современного американского города Силвер-Сити. Он рос в мирный период чирикауа. Его семейство состояло из деда по материнской линии, родителей, братьев и сестёр, большинство их имён сегодня неизвестно.",
    ] },
  { "title" = "Военный лидер", "paragraphs" = [
      "После того, как в 1837 году в результате вероломного нападения торговцев погиб Хуан Хосе Компас, военный вождь мимбреньо, одной из общин чихенне, Мангас Колорадас становится лидером всех восточных чирикауа и совершает несколько рейдов на поселения мексиканцев в Соноре.",
      "Когда американские военные прибыли на Юго-Запад осенью 1846 года, отношения между чирикауа и Мексикой были враждебными. Причиной их появления там являлась начавшаяся 24 апреля 1846 года американо-мексиканская война. После того как чирикауа узнали, что солдаты США начали войну с Мексикой, то они пообещали американским военным безопасное передвижение по своим землям. Вожди индейцев, включая Мангаса Колорадаса, посчитали вновь прибывших союзниками и выразили желание предоставить им по возможности любую помощь. В том же году лидер чихенне подписал первый договор с американскими властями.",
      "В 1851 году районе Пинос-Альтос группа шахтёров, работавших там, напала на чирикауа. Мангас Колорадас был схвачен. Его привязали к дереву и жестоко избили. Переселенцы продолжали нарушать условия договора между правительством США и чирикауа. В ответ индейцы стали нападать на белых людей. В 1860 году на землях чирикауа было обнаружено золото. Сотни старателей устремились на территорию апачей. Конфликт разгорелся с новой силой. После начала Гражданской войны Мангас Колорадас и Кочис, лидер чоконенов, заключили союз с целью изгнать американцев со своих земель. Под их руководством находилось около 250 воинов. Они сражались как против северян, так и против конфедератов. В 1862 году войска Союза столкнулись с Мангасом Колорадасом, Кочисом и их воинами. В произошедшей битве при Апаче-Пасс Мангас Колорадас был тяжело ранен в грудь, но сумел выжить. Чирикауа отправили его в Мексику, где он поправился.",
    ] },
  { "title" = "Смерть", "paragraphs" = [
      "Летом 1862 года Мангас Колорадас после встречи с посредниками решает отправиться на переговоры с американцами. В январе 1863 года он прибывает к форту Маклейн, который располагался на юго-западе Нью-Мексико.",
      "Мангас Колорадас прибыл в форт под белым флагом. Джозеф Родман Уэст, бригадный генерал армии США и Калифорнийских добровольцев, обманул вождя чихенне и не стал вести с ним переговоры. Его солдаты схватили Мангаса Колорадаса и пытали всю ночь — кололи его штыками, предварительно нагрев их на костре, после чего убили лидера апачей. На следующий день американские военные отрубили голову вождя, а изуродованные останки оставили в покинутом лагере.",
      "Бесславное убийство Мангаса Колорадаса лишь усилило вражду между чирикауа-апачами и США.",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Sweeney, Edwin R. Mangas Coloradas: Chief of the Chiricahua Apaches. — University of Oklahoma Press, 1998. — ISBN 0-8061-3063-6.",
      "Etulain, Richard W. New Mexican Lives: A Biographical History. — University of New Mexico Press, 2002. — ISBN 0-8263-2433-9.",
      "Haley, James L. Apaches: A History and Culture Portrait. — University of Oklahoma Press, 1997. — ISBN 0-8061-2978-6.",
    ] },
]

[articles.pt]
text = "Mangas Coloradas (em português, Mangas Vermelhas) ou Dasoda-hae (1793-1863) foi um famoso chefe Apache, membro da tribo dos Chiricahuas do Leste, cujo território se estendia até o Oeste a partir do Rio Grande, incluindo o que hoje é o sudoeste do Novo México. Considerado um dos mais importantes líderes Apaches do século XIX, Mangas Coloradas uniu a nação Apache contra o domínio dos Estados Unidos e foi um dos líderes combatentes das chamadas Guerras Apache."
title = "Mangas Coloradas"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Mangas_Coloradas"
intro = [
  "Mangas Coloradas (em português, Mangas Vermelhas) ou Dasoda-hae (1793-1863) foi um famoso chefe Apache, membro da tribo dos Chiricahuas do Leste, cujo território se estendia até o Oeste a partir do Rio Grande, incluindo o que hoje é o sudoeste do Novo México. Considerado um dos mais importantes líderes Apaches do século XIX, Mangas Coloradas uniu a nação Apache contra o domínio dos Estados Unidos e foi um dos líderes combatentes das chamadas Guerras Apache.",
  "Nas décadas de 1820 e 1830 os inimigos dos apaches eram os mexicanos, que haviam conquistado sua independência da Espanha em 1821. Em 1835 o México ofereceu uma recompensa por escalpos Apaches. Quando Juan Jose Compas, líder dos Apaches Mimbrenos, foi assassinado por caçadores de recompensa em 1837, Mangas se tornou o principal chefe e comandante Apache. Sem demora iniciou uma série de retaliações contra os mexicanos.",
  "Quando os Estados Unidos declararam guerra ao México, a nação Apache prometeu aos soldados americanos passagem segura por seu território. Em 1846, quando os E.U.A. reclamaram territórios mexicanos, os índios Apaches assinaram um tratado de paz, respeitando-os como conquistadores do povo inimigo mexicano. Uma complicada relação de paz entre os Apaches e os Estados Unidos se manteve até a década de 1850, quando a chegada de mineradores de ouro às montanhas Santa Rita deu início a um conflito. Em 1851, próximo ao campo Pinos Altos, Mangas Coloradas foi atacado por um grupo de mineradores que o amarraram à uma árvore e o espancaram. Outros acidentes semelhantes aconteceram, violando o tratado e provocando represálias por parte dos Apaches. Em dezembro de 1860, trinta mineradores organizaram um ataque surpresa ao acampamento dos Bedonhokes, a oeste do Rio Mimbres. De acordo com o historiados Edwin R. Sweeney, os mineradores \"... mataram quatro índios, feriram outros, e capturaram treze mulheres e crianças.\" Pouco depois, Mangas iniciou ataques contra propriedades e cidadãos americanos.",
  "A filha de Mangas Coloradas, Dos-Teh-Seh, casou-se com Cochise, principal chefe dos Apaches Chokonen. Em fevereiro de 1861, o tenente George N. Bascom e suas tropas enganaram Cochise e usaram-no, bem como à sua família e vários guerreiros, numa armadilha na Passagem Apache, no sudeste do Arizona. Com um filho morto e ferido, Cochise conseguiu escapar mas outros filhos e família foram mantidos sob custódia. As negociações foram infrutíferas e os reféns de parte a parte foram mortos (inclusive os demais filhos de Cochise). Este episódio, conhecido como o \"caso Bascom\", ainda teve a retaliação contra o irmão de Cochise e cinco outros guerreiros, enforcados em árvores. Mais tarde, naquele mesmo ano, Mangas e Cochise forjaram uma aliança, com o objetivo de expulsar todos os anglo-americanos do território Apache. Juntaram-se a eles o chefe Juh e o famoso guerreiro Geronimo. Embora sua meta jamais tenha sido alcançada, a população anglo-americana no território Apache foi enormemente reduzida por alguns anos, durante a Guerra Civil Americana.",
]
sections = [
  { "title" = "Referências", "paragraphs" = [
      "Etulain, Richard W. New Mexican Lives: A Biographical History. University of New Mexico Center for the American West, University of New Mexico Press, 2002. ISBN 0-8263-2433-9",
      "Haley, James L. Apaches: A History and Culture Portrait. University of Oklahoma Press, 1997. ISBN 0-8061-2978-6.",
      "Sweeney, Edwin R. Mangas Coloradas: Chief of the Chiricahua Apaches. University of Oklahoma Press, 1998. ISBN 0-8061-3063-6",
    ] },
]

