[articles.en]
text = "Modu, also called Maodun, took the title of chanyu around 209 BCE and turned the Xiongnu into a major power on the eastern steppe. The Chinese historian Sima Qian tells how the neighboring Donghu tested him with successive demands. Modu yielded twice, then refused to hand over the uninhabited strip between their frontier posts and rode against the Donghu."
title = "Modu Chanyu"
lang = "en"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, also called Maodun, took the title of chanyu around 209 BCE and turned the Xiongnu into a major power on the eastern steppe. The Chinese historian Sima Qian tells how the neighboring Donghu tested him with successive demands. Modu yielded twice, then refused to hand over the uninhabited strip between their frontier posts and rode against the Donghu."]
sections = [{ title = "The land between the outposts", paragraphs = ["The campaign helped extend Xiongnu control over neighboring peoples. The confederation drew much of its strength from mounted forces and herding communities, but its economy also included farming. In 200 BCE, early in the Han dynasty, Modu’s forces surrounded Emperor Gaozu at Baideng. An agreement with the Han followed within a few years. Much of the written evidence comes from Chinese authors who described their rivals from the Han side. The precise speeches and motives in the Donghu episode are therefore best understood as part of Sima Qian’s account. Archaeology gives a separate view of the steppe empire, while its relationship to the much later Huns of Europe remains disputed."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.es]
text = "Modu, también llamado Maodun, asumió el título de chanyu hacia 209 a. C. y convirtió a los xiongnu en una potencia de la estepa oriental. El historiador chino Sima Qian cuenta que los donghu, sus vecinos, pusieron a prueba al nuevo gobernante con sucesivas exigencias. Modu cedió dos veces, pero se negó a entregar la franja deshabitada entre los puestos fronterizos y lanzó una ofensiva."
title = "Modu Chanyu"
lang = "es"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, también llamado Maodun, asumió el título de chanyu hacia 209 a. C. y convirtió a los xiongnu en una potencia de la estepa oriental. El historiador chino Sima Qian cuenta que los donghu, sus vecinos, pusieron a prueba al nuevo gobernante con sucesivas exigencias. Modu cedió dos veces, pero se negó a entregar la franja deshabitada entre los puestos fronterizos y lanzó una ofensiva."]
sections = [{ title = "La tierra entre los puestos fronterizos", paragraphs = ["La victoria contribuyó a extender el dominio xiongnu sobre otros pueblos. La confederación se apoyaba en sus fuerzas montadas y en comunidades pastoriles, aunque también practicaba la agricultura. En 200 a. C., sus tropas cercaron al emperador Gaozu de la recién fundada dinastía Han en Baideng. Pocos años después se alcanzó un acuerdo con los Han. Gran parte de lo escrito sobre los xiongnu procede de sus rivales chinos. Las palabras y las intenciones atribuidas a Modu en el episodio donghu forman parte del relato de Sima Qian. La arqueología ofrece una perspectiva distinta sobre la confederación y el posible parentesco con los hunos de Europa, que aparecieron siglos después, sigue siendo objeto de debate."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.fr]
text = "Modu, aussi appelé Maodun, prit le titre de chanyu vers 209 av. J.-C. et fit des Xiongnu une puissance de la steppe orientale. L’historien chinois Sima Qian raconte que leurs voisins Donghu éprouvèrent le nouveau chef par des demandes successives. Modu céda deux fois, puis refusa de livrer la bande inhabitée entre les avant-postes et lança une offensive."
title = "Modu Chanyu"
lang = "fr"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, aussi appelé Maodun, prit le titre de chanyu vers 209 av. J.-C. et fit des Xiongnu une puissance de la steppe orientale. L’historien chinois Sima Qian raconte que leurs voisins Donghu éprouvèrent le nouveau chef par des demandes successives. Modu céda deux fois, puis refusa de livrer la bande inhabitée entre les avant-postes et lança une offensive."]
sections = [{ title = "La terre entre les avant-postes", paragraphs = ["Cette victoire contribua à étendre l’autorité des Xiongnu sur les peuples voisins. La confédération s’appuyait sur ses forces montées et sur l’élevage, mais l’agriculture y avait aussi sa place. En 200 av. J.-C., à Baideng, les hommes de Modu encerclèrent Gaozu, le fondateur de la dynastie Han. Un accord avec les Han suivit quelques années plus tard. La plupart des témoignages écrits viennent d’auteurs chinois qui décrivaient leurs rivaux du point de vue des Han. Les paroles et les motifs prêtés à Modu lors de l’affaire des Donghu appartiennent au récit de Sima Qian. L’archéologie offre un autre regard sur cet empire et le lien avec les Huns d’Europe, apparus bien plus tard, demeure débattu."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.de]
text = "Modu, auch Maodun genannt, nahm um 209 v. Chr. den Titel Chanyu an und machte die Xiongnu zu einer Großmacht der östlichen Steppe. Der chinesische Historiker Sima Qian berichtet, die benachbarten Donghu hätten den neuen Herrscher mit immer weiteren Forderungen geprüft. Zweimal gab Modu nach. Als es um den unbewohnten Streifen zwischen ihren Grenzposten ging, verweigerte er die Abtretung und griff an."
title = "Modu Chanyu"
lang = "de"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, auch Maodun genannt, nahm um 209 v. Chr. den Titel Chanyu an und machte die Xiongnu zu einer Großmacht der östlichen Steppe. Der chinesische Historiker Sima Qian berichtet, die benachbarten Donghu hätten den neuen Herrscher mit immer weiteren Forderungen geprüft. Zweimal gab Modu nach. Als es um den unbewohnten Streifen zwischen ihren Grenzposten ging, verweigerte er die Abtretung und griff an."]
sections = [{ title = "Das Land zwischen den Grenzposten", paragraphs = ["Der Sieg trug dazu bei, die Herrschaft der Xiongnu auf benachbarte Völker auszudehnen. Der Verband stützte sich auf berittene Streitkräfte und Viehzucht, betrieb aber auch Ackerbau. Im Jahr 200 v. Chr. schlossen Modus Truppen den Han-Kaiser Gaozu bei Baideng ein. Wenige Jahre später folgte eine Vereinbarung mit den Han. Die meisten schriftlichen Nachrichten stammen von chinesischen Autoren, die ihre Rivalen aus der Sicht der Han beschrieben. Modus genaue Worte und Beweggründe in der Geschichte um die Donghu sind Teil von Sima Qians Darstellung. Die Archäologie eröffnet einen weiteren Zugang zum Steppenreich. Wie die Xiongnu mit den viel späteren Hunnen Europas zusammenhingen, bleibt umstritten."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.it]
text = "Modu, chiamato anche Maodun, assunse il titolo di chanyu intorno al 209 a.C. e fece degli Xiongnu una potenza della steppa orientale. Lo storico cinese Sima Qian racconta che i vicini Donghu misero alla prova il nuovo sovrano con richieste successive. Modu cedette due volte, poi rifiutò di consegnare la fascia disabitata tra gli avamposti e passò all’offensiva."
title = "Modu Chanyu"
lang = "it"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, chiamato anche Maodun, assunse il titolo di chanyu intorno al 209 a.C. e fece degli Xiongnu una potenza della steppa orientale. Lo storico cinese Sima Qian racconta che i vicini Donghu misero alla prova il nuovo sovrano con richieste successive. Modu cedette due volte, poi rifiutò di consegnare la fascia disabitata tra gli avamposti e passò all’offensiva."]
sections = [{ title = "La terra tra gli avamposti", paragraphs = ["La vittoria contribuì a estendere il dominio degli Xiongnu sui popoli vicini. La confederazione traeva forza dalla cavalleria e dalle comunità dedite alla pastorizia, ma praticava anche l’agricoltura. Nel 200 a.C. le forze di Modu circondarono a Baideng l’imperatore Gaozu, fondatore della dinastia Han. Un accordo con gli Han seguì pochi anni dopo. Gran parte delle testimonianze scritte proviene da autori cinesi che vedevano gli Xiongnu dalla parte dei loro rivali. Le parole e le intenzioni attribuite a Modu nell’episodio dei Donghu fanno parte del racconto di Sima Qian. L’archeologia offre una prospettiva distinta e il rapporto con gli unni d’Europa, comparsi molti secoli dopo, è ancora discusso."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.tr]
text = "Çin kaynaklarında Maodun adıyla anılan Mete, MÖ 209 dolaylarında şanyu unvanını aldı ve Hiung-nu topluluğunu doğu bozkırının büyük güçlerinden biri hâline getirdi. Çinli tarihçi Sima Qian’a göre komşu Donghular, yeni hükümdarı art arda taleplerle sınadı. Mete iki kez taviz verdi, ancak sınır karakolları arasındaki ıssız toprağı vermeyi reddetti ve saldırıya geçti."
title = "Mete Han"
lang = "tr"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Çin kaynaklarında Maodun adıyla anılan Mete, MÖ 209 dolaylarında şanyu unvanını aldı ve Hiung-nu topluluğunu doğu bozkırının büyük güçlerinden biri hâline getirdi. Çinli tarihçi Sima Qian’a göre komşu Donghular, yeni hükümdarı art arda taleplerle sınadı. Mete iki kez taviz verdi, ancak sınır karakolları arasındaki ıssız toprağı vermeyi reddetti ve saldırıya geçti."]
sections = [{ title = "Sınır karakolları arasındaki toprak", paragraphs = ["Zafer, Hiung-nu hâkimiyetinin çevredeki halklara yayılmasına yardım etti. Konfederasyonun gücü atlı birliklere ve hayvancılıkla geçinen topluluklara dayanıyordu. Tarım da ekonominin bir parçasıydı. MÖ 200’de Mete’nin kuvvetleri, Han Hanedanı’nın kurucusu İmparator Gaozu’yu Baideng’de kuşattı. Birkaç yıl içinde Hanlarla anlaşma yapıldı. Yazılı tanıklıkların çoğu, bozkırdaki rakiplerini Han bakış açısından anlatan Çinli yazarlara aittir. Donghularla ilgili anlatıda Mete’ye atfedilen sözler ve niyetler Sima Qian’ın aktarımıyla bilinir. Arkeoloji bozkır imparatorluğunu ayrı bir açıdan aydınlatır. Hiung-nuların yüzyıllar sonra Avrupa’da görülen Hunlarla ilişkisi ise tartışmalıdır."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.zh-CN]
text = "冒顿约在公元前209年成为单于，带领匈奴崛起为东部草原的强大势力。司马迁在《史记·匈奴列传》中记载，邻近的东胡先索取名马，后索取单于的阏氏，冒顿都作了让步。等到东胡提出占有双方边塞之间无人居住的地带，冒顿拒绝交出土地，率军突然出击。这个故事把一次边境争端写成了匈奴扩张的转折。"
title = "冒顿单于"
lang = "zh-CN"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["冒顿约在公元前209年成为单于，带领匈奴崛起为东部草原的强大势力。司马迁在《史记·匈奴列传》中记载，邻近的东胡先索取名马，后索取单于的阏氏，冒顿都作了让步。等到东胡提出占有双方边塞之间无人居住的地带，冒顿拒绝交出土地，率军突然出击。这个故事把一次边境争端写成了匈奴扩张的转折。"]
sections = [{ title = "边塞之间的土地", paragraphs = ["《史记》把东胡的要求逐步推向争夺土地。按照书中的说法，双方在各自一侧设有边塞，中间的地带既无居民，也没有纳入日常管辖。东胡认为对方不会为这样的地方开战，冒顿的决定却恰好相反。书中还记载了他登位前与父亲头曼的冲突，以及他如何用鸣镝训练骑兵服从号令。这些细节使他的形象格外鲜明，也提醒读者注意古代史家组织故事的方式。东胡失利后，匈奴将影响力扩展到更多邻近部族，逐渐形成一个能够集中军事力量的草原联盟。骑兵有利于长距离调动，牧业则支撑许多地方社群，部分地区也从事农业。新兴的汉朝很快面对这一局势。公元前200年，汉高祖刘邦在白登被冒顿的军队包围，双方在几年内建立了和亲关系，北部边界仍然是此后两国交往中的重要问题。关于冒顿的成文记载主要来自中原一方，与匈奴同时代的自述极少留存。尤其是边境争议中的对话与人物动机，应当作为司马迁所传述的内容阅读。考古学提供了另一条途径，从居址、墓葬和随葬器物观察当时草原上不同人群的生活和往来。单靠这些遗存很难把某件器物直接联系到书中的人物或战役，出土材料与传世文献各有能够回答的问题。冒顿取得的军事优势在其继承者手中一度延续，匈奴势力覆盖了今蒙古高原和周围大片地区。至于在许多世纪之后出现在欧洲的匈人，与匈奴有怎样的关系，学界仍在比较史料、语言和考古证据，尚无定论。在这些讨论中，相似的名称只能作为追查线索，不能单独证明两个政权之间存在延续关系。"] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.ja]
text = "冒頓は紀元前209年ごろ単于となり、匈奴を東部草原の強国に育てた。司馬遷の『史記』によれば、隣国の東胡は新しい君主に次々と要求を突きつけた。冒頓は二度譲歩したが、国境の砦の間にある無人地帯を求められると、これを拒んで東胡を攻めた。"
title = "冒頓単于"
lang = "ja"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["冒頓は紀元前209年ごろ単于となり、匈奴を東部草原の強国に育てた。司馬遷の『史記』によれば、隣国の東胡は新しい君主に次々と要求を突きつけた。冒頓は二度譲歩したが、国境の砦の間にある無人地帯を求められると、これを拒んで東胡を攻めた。"]
sections = [{ title = "国境の砦の間にある土地", paragraphs = ["『史記』の匈奴列伝では、東胡はまず名馬を、次いで単于の后を求めたとされる。いずれの要求にも応じた冒頓は、境界にある土地を渡すよう求められた段階で態度を変えた。東胡の側では、その土地に人が住んでいないため、抵抗を受けずに手に入ると見込んでいたという。司馬遷はこの挿話を冒頓の即位に続けて置き、周辺諸族に対する勢力の拡大へと話を進めている。同じ章には、父の頭曼との対立や、音の鳴る矢によって配下の騎兵を訓練したという話も載る。こうした具体的な描写は印象的だが、出来事から時を経て漢の側でまとめられた叙述として読む必要がある。東胡に対する勝利を経て、匈奴は隣接する諸集団を取り込み、広大な地域で軍を動かせる連合体へ成長した。騎馬戦力を支えたのは家畜を飼う社会であり、地域によっては農耕も営まれていた。紀元前200年、冒頓の軍は白登で漢の創始者である高祖を包囲した。その数年後には漢との取り決めが成立し、北方の境界と交易は両者にとって長く重要な問題となった。匈奴の歴史について現存する記録の多くは中国側の著作に由来する。東胡の挿話にある発言や当事者の考えは、司馬遷が伝えたものとして扱われている。一方、集落跡や墳墓、そこから出土した品々は、草原に暮らした人々の生活や遠隔地との往来を調べる手がかりとなる。考古資料を特定の戦いや人物に結びつけられる例は限られ、文献と考古学からわかることにはそれぞれ違いがある。冒頓の後継者も広い領域を維持したが、何世紀も後に欧州に現れたフンとの関係については、名称や遺物の比較を重ねてもなお議論が続いている。"] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.ko]
text = "묵특은 기원전 209년 무렵 선우가 되어 흉노를 동부 초원의 강국으로 키웠다. 사마천의 《사기》에 따르면 이웃 동호는 새 군주에게 잇따라 요구를 내밀었다. 묵특은 두 차례 양보했지만, 변경 초소 사이의 주민 없는 땅을 내놓으라는 요구는 거절하고 동호를 공격했다."
title = "묵특선우"
lang = "ko"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["묵특은 기원전 209년 무렵 선우가 되어 흉노를 동부 초원의 강국으로 키웠다. 사마천의 《사기》에 따르면 이웃 동호는 새 군주에게 잇따라 요구를 내밀었다. 묵특은 두 차례 양보했지만, 변경 초소 사이의 주민 없는 땅을 내놓으라는 요구는 거절하고 동호를 공격했다."]
sections = [{ title = "변경 초소 사이의 땅", paragraphs = ["《사기》의 흉노열전에서 동호는 처음에 명마를 달라고 했고 다음에는 선우의 아내를 요구했다. 묵특은 이 두 요구를 받아들였으나 땅에 관한 요구가 들어오자 태도를 바꾸었다. 양쪽의 초소 사이에는 사람이 살지 않는 지대가 있었고, 사마천의 기록 속에서 동호는 묵특이 그곳을 지키려고 나서리라고 예상하지 못했다. 같은 열전은 묵특이 아버지 두만과 대립한 일과 소리가 나는 화살로 기병의 명령 수행을 훈련했다는 이야기도 전한다. 이 장면들은 묵특의 통치가 어떻게 시작되었는지 보여 주는 사마천의 서술에 속한다. 동호를 꺾은 뒤 흉노는 주변 집단을 아우르며 여러 지역에서 기병을 동원할 수 있는 연맹으로 성장했다. 가축을 기르는 공동체가 경제의 큰 부분을 이루었고 일부 지역에서는 농사도 이루어졌다. 기원전 200년에는 묵특의 군대가 백등에서 한 왕조의 창업자 고조를 포위했다. 몇 해 뒤 한과 흉노 사이에 협정이 맺어졌고, 북방의 경계와 교류는 이후에도 양측의 관심사로 남았다. 오늘날 읽을 수 있는 흉노 관련 기록 대부분은 그들과 경쟁했던 중국 측 저자들의 글이다. 따라서 동호와의 갈등에 등장하는 정확한 발언과 의도는 사마천이 전한 이야기로 보는 것이 적절하다. 고고학은 정착지와 무덤, 그곳에서 발견된 물건을 통해 초원 사회의 생활과 교류를 살핀다. 이러한 자료를 글에 나오는 특정 전투나 인물과 연결할 수 있는 경우는 드물다. 묵특의 후계자들도 넓은 영역을 유지했지만, 수백 년 뒤 유럽에 등장한 훈족과 흉노가 어떻게 이어지는지는 여전히 논쟁 중이다."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.ar]
text = "تولى مودو، المعروف أيضًا باسم ماودون، لقب تشانيو نحو سنة 209 قبل الميلاد، وصارت شيونغنو في عهده قوة كبرى في السهوب الشرقية. يروي المؤرخ الصيني سيما تشيان أن جيرانهم الدونغهو اختبروا الحاكم الجديد بسلسلة من المطالب. تنازل مودو مرتين، لكنه رفض تسليم الشريط الخالي من السكان بين المخافر الحدودية وشن هجومًا على الدونغهو."
title = "مودو تشانيو"
lang = "ar"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["تولى مودو، المعروف أيضًا باسم ماودون، لقب تشانيو نحو سنة 209 قبل الميلاد، وصارت شيونغنو في عهده قوة كبرى في السهوب الشرقية. يروي المؤرخ الصيني سيما تشيان أن جيرانهم الدونغهو اختبروا الحاكم الجديد بسلسلة من المطالب. تنازل مودو مرتين، لكنه رفض تسليم الشريط الخالي من السكان بين المخافر الحدودية وشن هجومًا على الدونغهو."]
sections = [{ title = "الأرض بين المخافر", paragraphs = ["ساعد الانتصار على توسيع سلطة شيونغنو على الشعوب المجاورة. اعتمد الاتحاد على قواته الراكبة ومجتمعات الرعي، وكانت الزراعة جزءًا من اقتصاده أيضًا. وفي سنة 200 قبل الميلاد حاصرت قوات مودو الإمبراطور غاوزو، مؤسس سلالة هان، عند بايدنغ. وتلا ذلك اتفاق مع هان بعد بضع سنوات. ترك معظم الشهادات المكتوبة مؤلفون صينيون وصفوا منافسيهم من وجهة نظر هان. ولهذا تُقرأ الأقوال والدوافع المنسوبة إلى مودو في حادثة الدونغهو بوصفها جزءًا من رواية سيما تشيان. وتمنح الآثار نظرة مستقلة إلى إمبراطورية السهوب، فيما تظل علاقتها بالهون الذين ظهروا في أوروبا بعد قرون موضع خلاف."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.ru]
text = "Модэ, известный также как Маодунь, принял титул шаньюя около 209 года до н. э. При нём хунну стали крупной силой в восточной степи. Китайский историк Сыма Цянь рассказывает, что соседи дунху предъявляли новому правителю одно требование за другим. Модэ уступил дважды, но отказался отдавать незаселённую полосу между пограничными постами и перешёл в наступление."
title = "Модэ-шаньюй"
lang = "ru"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Модэ, известный также как Маодунь, принял титул шаньюя около 209 года до н. э. При нём хунну стали крупной силой в восточной степи. Китайский историк Сыма Цянь рассказывает, что соседи дунху предъявляли новому правителю одно требование за другим. Модэ уступил дважды, но отказался отдавать незаселённую полосу между пограничными постами и перешёл в наступление."]
sections = [{ title = "Земля между пограничными постами", paragraphs = ["Победа помогла хунну распространить власть на соседние народы. Союз опирался на конные войска и скотоводство, хотя земледелие тоже играло роль. В 200 году до н. э. войска Модэ окружили при Байдэне императора Гао-цзу, основателя династии Хань. Через несколько лет последовало соглашение с Хань. Большую часть письменных свидетельств оставили китайские авторы, смотревшие на степь со стороны противников хунну. Слова и намерения Модэ в истории о дунху переданы в изложении Сыма Цяня. Археология даёт самостоятельное представление о степной державе, а её связь с гуннами, появившимися в Европе намного позже, остаётся предметом споров."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.vi]
text = "Mặc Đốn lên ngôi thiền vu vào khoảng năm 209 TCN và đưa Hung Nô trở thành một thế lực lớn trên thảo nguyên phía đông. Sử gia Trung Hoa Tư Mã Thiên kể rằng người Đông Hồ láng giềng liên tiếp đưa ra yêu sách để thử vị thủ lĩnh mới. Mặc Đốn hai lần nhượng bộ, nhưng khi họ đòi dải đất không người ở giữa các đồn biên giới, ông từ chối và đem quân tấn công."
title = "Mặc Đốn Thiền Vu"
lang = "vi"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Mặc Đốn lên ngôi thiền vu vào khoảng năm 209 TCN và đưa Hung Nô trở thành một thế lực lớn trên thảo nguyên phía đông. Sử gia Trung Hoa Tư Mã Thiên kể rằng người Đông Hồ láng giềng liên tiếp đưa ra yêu sách để thử vị thủ lĩnh mới. Mặc Đốn hai lần nhượng bộ, nhưng khi họ đòi dải đất không người ở giữa các đồn biên giới, ông từ chối và đem quân tấn công."]
sections = [{ title = "Vùng đất giữa các đồn biên giới", paragraphs = ["Chiến thắng góp phần mở rộng quyền lực của Hung Nô đối với các dân tộc lân cận. Liên minh dựa vào kỵ binh và các cộng đồng chăn nuôi, đồng thời cũng có hoạt động trồng trọt. Năm 200 TCN, quân Mặc Đốn vây Hán Cao Tổ tại Bạch Đăng. Một thỏa thuận với nhà Hán được thiết lập vài năm sau. Phần lớn ghi chép còn lại do các tác giả Trung Hoa viết về đối thủ của nhà Hán. Những lời nói và động cơ gán cho Mặc Đốn trong chuyện Đông Hồ thuộc về lời kể của Tư Mã Thiên. Khảo cổ học cung cấp một góc nhìn độc lập về đế chế thảo nguyên, còn mối liên hệ với người Hun xuất hiện tại châu Âu nhiều thế kỷ sau vẫn được tranh luận."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.id]
text = "Modu, yang juga disebut Maodun, menyandang gelar chanyu sekitar 209 SM dan menjadikan Xiongnu kekuatan besar di stepa timur. Sejarawan Tiongkok Sima Qian menuturkan bahwa tetangga mereka, Donghu, menguji penguasa baru itu dengan tuntutan berturut-turut. Modu dua kali mengalah, lalu menolak menyerahkan jalur tak berpenghuni di antara pos-pos perbatasan dan menyerang Donghu."
title = "Modu Chanyu"
lang = "id"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, yang juga disebut Maodun, menyandang gelar chanyu sekitar 209 SM dan menjadikan Xiongnu kekuatan besar di stepa timur. Sejarawan Tiongkok Sima Qian menuturkan bahwa tetangga mereka, Donghu, menguji penguasa baru itu dengan tuntutan berturut-turut. Modu dua kali mengalah, lalu menolak menyerahkan jalur tak berpenghuni di antara pos-pos perbatasan dan menyerang Donghu."]
sections = [{ title = "Tanah di antara pos perbatasan", paragraphs = ["Kemenangan itu membantu memperluas kekuasaan Xiongnu atas masyarakat sekitar. Konfederasi tersebut mengandalkan pasukan berkuda dan masyarakat penggembala, tetapi pertanian juga berperan dalam perekonomiannya. Pada 200 SM pasukan Modu mengepung Kaisar Gaozu, pendiri dinasti Han, di Baideng. Kesepakatan dengan Han menyusul beberapa tahun kemudian. Sebagian besar kesaksian tertulis berasal dari penulis Tiongkok yang memandang Xiongnu sebagai lawan Han. Ucapan dan niat Modu dalam kisah Donghu disampaikan melalui catatan Sima Qian. Arkeologi memberi sudut pandang tersendiri tentang kekaisaran stepa, sementara kaitannya dengan bangsa Hun yang muncul jauh kemudian di Eropa masih diperdebatkan."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.fil]
text = "Si Modu, na kilala rin bilang Maodun, ay naging chanyu noong bandang 209 BK. Sa pamumuno niya, naging pangunahing kapangyarihan ang Xiongnu sa silangang steppe. Ayon sa Tsinong historyador na si Sima Qian, sinubok ng karatig na Donghu ang bagong pinuno sa sunod-sunod na kahilingan. Dalawang beses pumayag si Modu, ngunit tumanggi siyang ibigay ang bahaging walang naninirahan sa pagitan ng mga himpilan at sinalakay niya ang Donghu."
title = "Modu Chanyu"
lang = "fil"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Si Modu, na kilala rin bilang Maodun, ay naging chanyu noong bandang 209 BK. Sa pamumuno niya, naging pangunahing kapangyarihan ang Xiongnu sa silangang steppe. Ayon sa Tsinong historyador na si Sima Qian, sinubok ng karatig na Donghu ang bagong pinuno sa sunod-sunod na kahilingan. Dalawang beses pumayag si Modu, ngunit tumanggi siyang ibigay ang bahaging walang naninirahan sa pagitan ng mga himpilan at sinalakay niya ang Donghu."]
sections = [{ title = "Ang lupain sa pagitan ng mga himpilan", paragraphs = ["Nakatulong ang tagumpay na palawakin ang kapangyarihan ng Xiongnu sa mga karatig na bayan. Umasa ang kompederasyon sa hukbong nakasakay sa kabayo at sa mga pamayanang nag-aalaga ng hayop. Bahagi rin ng ekonomiya nito ang pagsasaka. Noong 200 BK, pinalibutan ng mga kawal ni Modu sa Baideng si Gaozu, ang nagtatag ng dinastiyang Han. Nagkaroon ng kasunduan sa Han makalipas ang ilang taon. Karamihan sa mga nakasulat na salaysay ay mula sa mga Tsinong tumingin sa Xiongnu bilang mga karibal ng Han. Ang mga salita at hangaring iniuugnay kay Modu sa kuwento ng Donghu ay bahagi ng salaysay ni Sima Qian. Nagbibigay ng hiwalay na pananaw ang arkeolohiya, habang pinagtatalunan pa rin ang ugnayan sa mga Hun na lumitaw sa Europa makalipas ang maraming siglo."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]

[articles.pt-BR]
text = "Modu, também chamado Maodun, assumiu o título de chanyu por volta de 209 a.C. e tornou os xiongnu uma potência na estepe oriental. O historiador chinês Sima Qian conta que os vizinhos donghu puseram o novo governante à prova com exigências sucessivas. Modu cedeu duas vezes, mas se recusou a entregar a faixa desabitada entre os postos fronteiriços e partiu para o ataque."
title = "Modu Chanyu"
lang = "pt-BR"
url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf"
shortArticle = true
intro = ["Modu, também chamado Maodun, assumiu o título de chanyu por volta de 209 a.C. e tornou os xiongnu uma potência na estepe oriental. O historiador chinês Sima Qian conta que os vizinhos donghu puseram o novo governante à prova com exigências sucessivas. Modu cedeu duas vezes, mas se recusou a entregar a faixa desabitada entre os postos fronteiriços e partiu para o ataque."]
sections = [{ title = "A terra entre os postos fronteiriços", paragraphs = ["A vitória ajudou a ampliar o domínio xiongnu sobre os povos vizinhos. A confederação se apoiava em forças montadas e comunidades pastoris, mas também praticava a agricultura. Em 200 a.C., as tropas de Modu cercaram em Baideng o imperador Gaozu, fundador da dinastia Han. Um acordo com os Han veio poucos anos depois. A maior parte dos testemunhos escritos vem de autores chineses que viam os xiongnu da perspectiva de seus rivais. As palavras e intenções de Modu no episódio dos donghu fazem parte do relato de Sima Qian. A arqueologia oferece uma perspectiva independente sobre o império da estepe. A relação com os hunos que apareceram na Europa séculos mais tarde continua em debate."] }]
sources = [{ title = "Sima Qian, Shiji 110, Account of the Xiongnu (Warwick University)", url = "https://warwick.ac.uk/fac/arts/classics/intranets/students/modules/ancientglobalhistory/seminars/shiji_-account_of_the_xiongnu.pdf" }, { title = "Encyclopaedia Iranica, Xiongnu", url = "https://www.iranicaonline.org/articles/xiongnu/" }, { title = "Savelyev and Jeong, Early nomads of the Eastern Steppe and their tentative connections in the West", url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7612788/" }]
