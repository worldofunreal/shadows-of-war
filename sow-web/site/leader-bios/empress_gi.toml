[articles.en]
text = "Empress Gi or Empress Ki, also known as Empress Qi or Öljei Khutuk, was a Goryeo-born empress consort of the Yuan dynasty. She was one of the primary empresses of Toghon Temür, and the mother of Biligtü Khan, who would become an emperor of the Northern Yuan dynasty."
title = "Empress Gi"
lang = "en"
url = "https://en.wikipedia.org/wiki/Empress_Gi"
intro = [
  "Empress Gi or Empress Ki (Korean: 기황후; Hanja: 奇皇后; 1315–1369), also known as Empress Qi (Chinese: 奇皇后) or Öljei Khutuk (Mongolian: Өлзийхутаг; Chinese: 完者忽都), was a Goryeo-born empress consort of the Yuan dynasty. She was one of the primary empresses of Toghon Temür (Emperor Huizong), and the mother of Biligtü Khan (Emperor Zhaozong), who would become an emperor of the Northern Yuan dynasty. Gi was originally from an aristocratic family of the Goryeo dynasty, and first served as a concubine of Toghon Temür. During the last years of the Yuan dynasty, she became one of its most powerful women and political figures, controlling the country economically and politically, and ruling with de facto imperial powers.",
]
sections = [
  { "title" = "Biography", "paragraphs" = [
      "Empress Gi was born in Haengju (행주, 幸州; modern Goyang), Goryeo to a lower-ranked aristocratic family of bureaucrats. Her father was Ki Cha-o. Lady Gi's maternal great-grandmother was Princess Consort Im of the Jangheung Im clan, one of the prominent clans in Goryeo Kingdom. In 1333, the teenaged Lady Gi was among the concubines sent to Yuan by the Goryeo king, who had to provide a certain number of beautiful teenage girls to serve as concubines of the Yuan emperor every three years. It was considered prestigious to marry Goryeo women. Extremely beautiful and skilled at dancing, conversation, singing, poetry, and calligraphy, Lady Gi quickly became the favorite concubine of Toghon Temür. He fell in love with her, and it was soon noted that he was spending far more time in her company than he was with the first empress Danashiri.",
      "The primary empress Danashiri was executed on 22 July 1335 in a purge because of the rebellion of her brother Tangqishi. When Toghon Temür tried to promote Lady Gi to secondary wife, which was contrary to the standard practice of only taking secondary wives from the Mongol clans, it created such opposition at court to this unheard of promotion for a Goryeo woman that he was forced to back down. Bayan, who held the real power in Yuan, opposed the promotion of Lady Gi as did the Empress Dowager, who considered Lady Gi to be cunning. In 1339, when Lady Gi gave birth to a son, Ayushiridara, whom Toghon Temür decided would be his successor, he was finally able to have Lady Gi named as his secondary wife (in 1340). As the favorite wife of the emperor, Lady Gi was a very powerful woman in Yuan. When Bayan was purged, Lady Gi became the secondary empress in 1340 (the primary empress was Bayan Khutugh of the Khongirad).",
      "Toghon Temür increasingly lost interest in governing as his reign continued. During this time power was increasingly exercised by a politically and economically talented Lady Gi. Lady Gi's older brother Ki Ch'ŏl was appointed the commander of the Mongol Eastern Field Headquarters—making him in effect the real ruler of Goryeo—owing to her influence, and she closely monitored Goryeo affairs. Her son was designated Crown Prince in 1353. Using her eunuch Park Bul-hwa (박불화; 朴不花) as her agent, she began a campaign to force the emperor to pass the imperial throne to her son. However, her intentions became known to the emperor and he grew apart from her.",
    ] },
  { "title" = "Family", "paragraphs" = [
      "Daughter-in-law - Empress Gwon of the Andong Gwon clan (권황후; 權皇后; ? – 1378/22 May 1410); daughter of Gwon Gyeom (권겸; 權謙; ? – 1356)",
    ] },
]

[articles.es]
text = "La Emperatriz Qi (o Ki; Hangul: 기황후; 1315–1369/70) fue una de las emperatrices consortes de Toghon Temür de la Dinastía Yuan y madre de Biligtü Khan Ayushiridara. Pertenecía a una familia aristocrática de Goryeo."
title = "Emperatriz Qi"
lang = "es"
url = "https://es.wikipedia.org/wiki/Emperatriz_Qi"
intro = [
  "La Emperatriz Qi (o Ki; Hangul: 기황후; 1315–1369/70) fue una de las emperatrices consortes de Toghon Temür de la Dinastía Yuan y madre de Biligtü Khan Ayushiridara. Pertenecía a una familia aristocrática de Goryeo.",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "La emperatriz Ki nació en la actual Goyang, en Goryeo. Tenía un hermano mayor, llamado Gi Cheol (en mongol: Bayn Bukha). Ella devino la concubina de Toghon Temür y fue la madre de Biligtü Khan Ayushiridara. Después de que la primera emperatriz, Danashri, fuera ejecutada el 22 de julio de 1335 en una purga llevada a cabo como consecuencia de la rebelión de su hermano Tangqishi,​ poco después, Toghon Temür trató de nombrarla emperatriz. No obstante, Bayan de los Merkid, quien realmente ostentaba el poder, se opuso. Cuando Bayan fue ejecutado, Qi fue nombrada Segunda Emperatriz en el año 1340 (la Primera Emperatriz era Bayn Khutuk de Khongirad). Su hijo, Ayushiridara, fue nombrado príncipe imperial en el año 1353. Usando a su eunuco, Bak Bulhwa, como su agente, ella comenzó una campaña para forzar al emperador a abdicar en favor de su hijo, Ayurshiridara. No obstante, sus intenciones fueron descubiertas por el emperador y ella fue apartada de su hijo.",
      "Dependiendo de la posición de Qi en la capital imperial, su hermano mayor Gi Cheol llegó a amenazar la posición del Rey de Goryeo, cuyo reino era un estado cliente de los mongoles y en el año 1356, tras sufrir un intento de golpe de Estado, el rey Gongmin de Goryeo exterminó a la familia Qi. Como represalia, Qi respondió seleccionando a Tash Temür como nuevo rey de Goryeo y lo envió hacia allí con las tropas mongoles. Pero las tropas fueron derrotadas por el ejército de Goryeo, cuando intentaban cruzar el río Yalu.",
      "Dentro de la capital mongola, se libró una lucha interna entre los partidarios y los opositores de Ayurshiridara. En el año 1364, en un golpe de Estado, Bolud Temür, el líder de la oposición, ocupó la capital. Ayurshiridara consiguió huir y pedir ayuda a Köke Temür quien lo apoyó, pero Qi fue hecha prisionera y encarcelada por Bolud Temür. Un año más tarde, Bolud Temür fue derrotado por Köke Temür. Una vez más, ella trató de instalar a su hijo como Emperador con el apoyo de Köke Temür, pero fue en vano. Después del fallecimiento de Bayan Khutuk, Qi fue ascendida al rango de Primera Emperatriz.",
    ] },
  { "title" = "Referencias", "paragraphs" = [
      "Чулууны Далай; Нямбуугийн Ишжамц; Найдангийн Дангаасүрэн (1992). Чулууны Далай; Нямбуугийн Ишжамц; Найдангийн Дангаасүрэн (1992). Монголын түүх. Улаанбаатар: Эрдэм. Улаанбаатар: Эрдэм.",
    ] },
]

[articles.vi]
text = "Hoàn Giả Hốt Đô (chữ Hán: 完者忽都; tiếng Mông Cổ: ᠥᠯᠵᠡᠶᠢᠬᠤᠲᠤᠭ, chuyển tự Latinh: Ölǰei Khutugh, chữ Kirin: Өлзийхутаг; ? – 1369), còn biết đến với tên gọi Hoàn Giả Đô (完者都) hoặc Kỳ hoàng hậu (奇皇后; 기황후; Empress Gi), là một trong những Hoàng hậu của Nguyên Huệ Tông - vị hoàng đế thứ 11 và là cuối cùng của nhà Nguyên trong lịch sử Trung Quốc."
title = "Kỳ Hoàng hậu"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/K%E1%BB%B3_Ho%C3%A0ng_h%E1%BA%ADu"
intro = [
  "Hoàn Giả Hốt Đô (chữ Hán: 完者忽都; tiếng Mông Cổ: ᠥᠯᠵᠡᠶᠢᠬᠤᠲᠤᠭ, chuyển tự Latinh: Ölǰei Khutugh, chữ Kirin: Өлзийхутаг; ? – 1369), còn biết đến với tên gọi Hoàn Giả Đô (完者都) hoặc Kỳ hoàng hậu (奇皇后; 기황후; Empress Gi), là một trong những Hoàng hậu của Nguyên Huệ Tông - vị hoàng đế thứ 11 và là cuối cùng của nhà Nguyên trong lịch sử Trung Quốc.",
  "Theo sử sách, Kỳ hoàng hậu nổi tiếng là thê tử được Huệ Tông sủng ái. Cuộc đời bà trải qua nhiều thăng trầm, bị cống nạp sang nước Nguyên, về sau sinh hạ Hoàng trưởng tử Ái Du Thức Lý Đạt Lạp, cuối cùng trở thành \"Đệ nhị Hoàng hậu\" rồi \"Chính cung Hoàng hậu\" của Nguyên Huệ Tông. Thông qua địa vị Hoàng hậu và khả năng hậu cung can chính đặc thù của triều Nguyên, Kỳ hoàng hậu có ảnh hưởng lớn đối với tình hình chính trị giai đoạn Vãn kỳ của triều đại này.",
  "Theo ghi chép từ chính sử, sự ảnh hưởng của bà đều có tích cực lẫn tiêu cực, điểm tiêu cực lớn nhất chính là âm mưu khiến Huệ Tông thiện nhượng cho con trai bà và cuộc chiến đại bại với Cao Ly chỉ vì mối thù gia tộc cá nhân của bà.",
]
sections = [
  { "title" = "Tiểu sử", "paragraphs" = [
      "Kỳ thị nguyên là người Cao Ly, xuất thân ở Hạnh Châu (幸州; 행주), nay thuộc khu vực của thành phố Goyang, tỉnh Gyeonggi. Tuy Nguyên sử không ghi lại, nhưng nghiên cứu lịch sử Hàn Quốc dựa vào Cao Ly sử thì chỉ ra cha bà có tên là Kỳ Tử Ngao (奇子敖), xuất thân từ gia tộc Hạnh Châu Kỳ thị (幸州奇氏; 행주기씨), tức \"Nhà họ Kỳ ở Hạnh Châu\", một gia đình tiểu quý tộc khá hưng thịnh.",
      "Ban đầu, Kỳ thị cùng nhiều cô gái khác bị Cao Ly Trung Huệ Vương lên danh sách cống cho nhà Nguyên theo chính sách \"Cống nạp con người\", vì sau chiến tranh Mông Cổ - Cao Ly, các vị quân chủ của Cao Ly được yêu cầu gửi một số lượng nhất định các cô gái trẻ tuổi xinh đẹp đến Đại Nguyên để hầu hạ như vợ lẽ. Theo sắp xếp, Kỳ thị là cung nữ phụ trách dâng trà, sau được Huệ Tông chú ý mà liền trở thành phi tần. Chế độ hậu phi nhà Nguyên đơn giản, dưới Hoàng hậu chỉ có Phi và Tần, Kỳ thị trong thời gian này không rõ được chia vào như thế nào. Từ khi thụ sủng, Kỳ thị ngày càng được lòng Huệ Tông, ân sủng của bà còn vượt hơn cả Hoàng hậu lúc đó của Huệ Tông là Đáp Nạp Thất Lý, vốn là con gái của quyền thần Yên Thiếp Mộc Nhi. Điều này khiến Hoàng hậu ghen ghét Kỳ thị, thường xuyên ra lệnh đánh đập, ngược đãi. Theo ghi chép thì Huệ Tông không có thái độ gì với Hoàng hậu về việc này.",
      "Chính trị của triều đình nhà Nguyên lúc đó được dẫn đầu bởi thừa tướng là Hữu thừa tướng Bá Nhan và Thái sư Yên Thiếp Mộc Nhi. Năm Chí Thuận thứ 4 (1333), khi Huệ Tông vừa lên ngôi thì Yên Thiếp Mộc Nhi mất, em trai là Tát Đôn lên thay chức \"Trung thư tả thừa tướng\" (中書左丞相), anh cả của Đáp Nạp Thất Lý là Thái Bình vương Đường Kỳ Thế (kế tước từ cha) làm \"Ngự sử đại phu\" (御史大夫). Sau đó Tát Đôn mất, Đường Kỳ Thế thay chú nắm chức vụ Tả thừa tướng, tiếp tục là đối trọng với Hữu thừa tướng Bá Nhan bên cánh hữu, nhưng Bá Nhan có lợi thế vì sự ủng hộ của Huệ Tông nên nắm trọn triều chính, khiến Đường Kỳ Thế bất mãn. Năm Nguyên Thống thứ 3 (1335), Đường Kỳ Thế nổi loạn mưu giết Bá Nhan nhưng thất bại và bị giết chết. Đáp Nạp Thất Lý vì cứu em trai Tháp Lạp Hải (người cũng tham gia cuộc binh biến) mà bị Huệ Tông phế truất ngôi Hoàng hậu, sai đem giam cầm ở Khai Bình, cuối cùng bị Bá Nhan hạ độc chết.",
    ] },
  { "title" = "Hoàng hậu loạn quốc", "paragraphs" = [
      "Tuy không thể để Kỳ thị làm Chính hậu, Huệ Tông vẫn sủng ái Kỳ thị và ít để tâm đến Bá Nhan Hốt Đô Hoàng hậu, tuy nhiên Bá Nhan Hốt Đô là một Hoàng hậu biết phép tắc, cũng không vì thế mà oán trách. Năm Chí Nguyên thứ 5 (1339), Kỳ thị sinh Hoàng trưởng tử, đặt tên là Ái Du Thức Lý Đạt Lạp, nhân đó Sa Lạp Ban (沙剌班) tấu thỉnh Huệ Tông sách phong Kỳ thị làm Đệ nhị Hoàng hậu. Thế rồi sang năm thứ 6 (1340), tháng 4 (ÂL), Kỳ thị được lập làm Đệ nhị Hoàng hậu, cư ngụ tại Hưng Thánh cung (興聖宮).",
      "Theo lệ triều Nguyên, Hoàng đế được lập một lúc nhiều Hoàng hậu, nhưng chỉ có Trung cung là nhận Sách bảo, Kỳ thị là Hoàng hậu nhưng ở dưới Bá Nhan Hốt Đô đang là Trung cung Hoàng hậu, cho nên Kỳ thị trong giai đoạn này được biết đến với danh phận \"Đệ nhị Hoàng hậu\" (第二皇后) hoặc \"Thứ Hoàng hậu\" (次皇后). Giám sát Ngự sử tên Lý Tiết (李泌) bất bình chuyện Kỳ thị thân chỉ là một nữ nô lệ Cao Ly mà có thể trở thành Hoàng hậu, bèn can gián bằng lời truyền của Nguyên Thế Tổ Hốt Tất Liệt rằng:「\"Thế Tổ có lời răn: Con cháu không được cùng nữ tử Cao Ly phụng sự Tông miếu. Nay bệ hạ tiếp ngôi Thế Tổ, cớ gì quên lời dạy của Thế Tổ, lấy đám đàn bà Cao Ly sung hậu đình, còn để lên ngôi Hậu. Đến nay tai dị xảy ra khắp nơi, động đất chấn kinh, âm thịnh mà dương suy, nào không phải vì cớ ấy? Nay thỉnh hàng Thị ấy làm Phi, Thứ sử Tam thần định vị, thiên tai có thể khỏi\"」, nhưng Nguyên Huệ Tông đều không nghe.",
      "Năm Chí Chính thứ 13 (1353), Hoàng trưởng tử Ái Du Thức Lý Đạt Lạp được sách lập làm Hoàng thái tử, địa vị Kỳ hậu cũng có chuyển biến.",
    ] },
  { "title" = "Kết cục", "paragraphs" = [
      "Vào những năm cuối đời Chí Chính, triều đình nhà Nguyên đại loạn, khởi nghĩa nông dân khắp nơi. Năm Chí Chính thứ 28 (1368), thủ lĩnh khởi nghĩa Khăn Đỏ tên là Chu Nguyên Chương nổi dậy đánh đuổi được quân Nguyên khỏi Trung Quốc, dành quyền tự chủ cho người Hán, thiết lập nhà Minh trong lịch sử Trung Quốc rồi sai Từ Đạt kéo 25 vạn quân Bắc tiến tấn công vào kinh đô nhà Nguyên. Nguyên Huệ Tông sai Khoách Khuếch Thiếp Mộc Nhi điều động binh lực nghênh chiến nhưng thất bại. Cùng đường, Huệ Tông mang quần thần và gia quyến chạy khỏi Đại Đô đến Thượng Đô, Mông Cổ. Tại đây, ông lập ra nhà Bắc Nguyên và xưng Khả hãn.",
      "Năm sau (1369), Kỳ hoàng hậu qua đời, không rõ bao nhiêu tuổi. Cũng trong năm đó quân Minh đánh đến Thượng Đô, Huệ Tông phải chạy lên Ứng Xương. Sau đó, Huệ Tông vì kiết lỵ mà qua đời, Thái tử Ái Du Thức Lý Đạt Lạp kế vị, tức Nguyên Chiêu Tông, truy thuỵ hiệu cho bà là Phổ Hiển Thục Thánh Hoàng hậu (普顯淑聖皇后).",
    ] },
  { "title" = "Tham khảo", "paragraphs" = [
      "Kha Thiệu Vân (2017). Trương Kinh Hoa; Hoàng Thự Huy (biên tập). Tân Nguyên Sử. Nhà xuất bản Cổ tịch Thượng Hải. ISBN 9787532583805.",
      "Hội đồng biên soạn nhà Minh (1976). Tống Liêm; Triệu Huân; Vương Y (biên tập). Nguyên sử (bằng tiếng Trung). Trung Hoa thư cục. ISBN 9787101003260.",
      "Kyung Moon Hwang (2010). A History of Korea (PDF) (bằng tiếng Anh). Springer. ISBN 9780230205468.",
    ] },
]

[articles.it]
text = "Gi (기황후?, 奇皇后?, Gi hwanghuLR, Ki hwanghuMR; 1315 – 1370), anche nota con il nome mongolo Öljei Khutuk (Өлзийхутаг, 完者忽都), è stata un'imperatrice consorte di Toghon Temür."
title = "Imperatrice Gi"
lang = "it"
url = "https://it.wikipedia.org/wiki/Imperatrice_Gi"
intro = [
  "Gi (기황후?, 奇皇后?, Gi hwanghuLR, Ki hwanghuMR; 1315 – 1370), anche nota con il nome mongolo Öljei Khutuk (Өлзийхутаг, 完者忽都), è stata un'imperatrice consorte di Toghon Temür.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "L'imperatrice Gi nacque nel 1315 da Gi Ja-oh, un nobiluomo e generale del Goryeo appartenente al bon-gwan Gi di Haengju che aveva fatto fortuna sotto il governo militare dei Choe; sua madre era invece figlia del militare Yi Haeng-geom. Gi era la minore di tre sorelle e cinque fratelli (Gi Shik, Gi Cheol, Gi Won, Gi Ju e Gi Ryun) ed è ricordata per essere un'abile cantante e ballerina, versata nell'arte della poesia, della calligrafia e della conversazione, oltre che una donna bella e beneducata.",
      "Nel 1333 fu inserita nel corteo di giovani che il Goryeo presentava a Yuan come tributo. Come cameriera de tè inizio a servire al palazzo dell'imperatore mongolo Toghon Temür, che conquistò grazie alla bellezza e all'intelligenza, diventandone una concubina. Si attirò, però, il disprezzo della corte, che la temeva e la biasimava per l'ambizione e la nazionalità, e fu apertamente e ripetutamente maltrattata e frustata dalla prima imperatrice Danashri.",
      "Nel 1335 Danashri fu giustiziata dopo un tentato colpo di stato di suo fratello Tangqishi. Toghon Temür propose di nominare Gi imperatrice, ma incontrò l'opposizione del generale Bayan, e la posizione di prima imperatrice andò a Bayan Khutugh. Gi divenne seconda imperatrice nel 1340, un anno dopo aver partorito l'erede al trono, Ayushiridara: si dedicò con impegno all'istruzione del figlio per prepararlo a governare, insistendo affinché gli fossero impartite lezioni non solo di buddhismo, ma anche di confucianesimo, e lei stessa lesse il Classico della pietà filiale e i racconti sulla condotta benevola delle imperatrici del passato, usandoli per impostare la gestione della corte interna. Radunò poi attorno a sé importanti funzionari mongoli e del Goryeo, formando una propria forza politica, grazie alla quale riuscì a far nominare Ayushiridara principe ereditario nel 1353, contemporaneamente al crescente disinteresse di Toghon Temür per la politica. Intanto, fu un'importante benefattrice religiosa: fece ingenti donazioni tra il 1343 e il 1345 per la ristrutturazione del tempio Jangansa sul monte Kumgang nel Goryeo, e promosse i rituali buddhisti e diverse misure di aiuto sociale nella capitale mongola di Khanbaliq. Quando, nel 1358, carestia e malattie colpirono la popolazione, si adoperò per curare i malati e comprò della terra per seppellire i morti.",
    ] },
  { "title" = "Bibliografia", "paragraphs" = [
      "(EN) David M. Robinson, Empire's Twilight: Northeast Asia Under the Mongols, Harvard University Press, 2009, ISBN 978-0-674-03608-6. URL consultato il 22 marzo 2023.",
    ] },
]

[articles.ko]
text = "기황후(奇皇后, 1315년 ~ 1369년)는 원나라 토곤 테무르 카안의 세 번째 제1카툰이다. 몽골식 이름은 울제이 쿠툭(몽골어: ᠥᠯᠵᠡᠶᠢ ᠬᠤᠲᠤᠭ Ölǰei Qutuq), 시호는 보현숙성황후(普顯淑聖皇后)이다."
title = "기황후"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EA%B8%B0%ED%99%A9%ED%9B%84"
intro = [
  "기황후(奇皇后, 1315년 ~ 1369년)는 원나라 토곤 테무르 카안의 세 번째 제1카툰이다. 몽골식 이름은 울제이 쿠툭(몽골어: ᠥᠯᠵᠡᠶᠢ ᠬᠤᠲᠤᠭ Ölǰei Qutuq), 시호는 보현숙성황후(普顯淑聖皇后)이다. 대원에 바쳐지는 고려의 공녀 중 한명으로 본관은 행주이다.",
  "고려 출신 환관 고용보(高龍普)의 주선으로 황궁의 궁녀가 되었다가 원 혜종의 총애를 얻어 귀비로 책봉되고, 훗날 혜종의 뒤를 이어 황제로 등극하는 아들 아유르시리다르를 낳았다. 정적 관계였던 제1황후인 다나슈리가 역모죄로 사사되자 외국인은 정궁으로 삼을 수 없다는 재상 바얀의 반대를 견뎌내고 제2황후가 되었고, 1365년에 제1황후인 콩기라트 출신의 바얀 쿠툭가 사망하자 정궁황후로 등극하였다. 이후 아들 아유르시리다르를 황태자로 옹립하였고, 휘정원을 자정원(資政院)으로 개편해 심복인 고용보를 초대 자정원사(資政院使)에 임명한 뒤 고려인 출신 환관과 고려인 출신 관리 및 일부 몽골 관료들을 포진시켜 자신의 측근으로 삼았다.",
  "친정인 기씨 일족을 통해 고려 왕실에 영향력을 행사하였으나 얼마 못 가 사라졌다. 공민왕에 의해 친오빠 기철 등이 살해되자 원 혜종을 사주하여 충선왕의 서자 덕흥군을 왕으로 앉히고 고려를 침공하였으나 실패하였다. 태자인 아유르시리다르의 비(妃) 역시 고려 여인으로 정하여 권씨(權氏)를 태자비로 삼았다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "본관은 행주이다. 아버지는 사후 영안왕과 경왕에 추증된 고려 문신 기자오(奇子敖)이고, 어머니는 익산이씨로 전서 이행검의 딸 이씨이다. 증조모 장흥임씨가 고려 인종의 왕비 공예왕후의 친정 조카 임경순의 딸이었다. 오빠로는 기식(奇軾), 기철(奇轍), 기원(奇轅), 기주(奇輈), 기륜(奇輪) 등이 있었다. 진천군지명지(진천문화원 외, 1997년)의 이월면 노원리 옥녀봉 설명에 의하면 이름은 옥녀다.",
      "목은 이색은 \"공녀로 선발되면 우물에 빠져 죽는 사람도 있고, 목을 매어 죽는 사람도 있다\"고 말할 정도로 비참한 상황이었다. 그러나 그녀는 침착했고 오히려 걱정하는 자신의 친정 부모를 위로하였다.",
      "자원한 공녀길은 아니지만 이왕 뽑힌 이상, 이를 새로운 인생의 계기로 삼겠다고 결심했다. 세계를 지배하는 원나라이니 만큼 더 많은 기회가 있으리라고 판단한 것이다. 공녀로 원나라에 가게 되어 대도의 황궁에 도착하였다. 독실한 불교신자였던 그는 원나라생활 중 부처에게 기도하였다. 이때 고려인 출신 내시 고용보(高龍普)를 만나게 된다.",
    ] },
  { "title" = "기타", "paragraphs" = [
      "그녀가 고려 출신 첫 후비(后妃)나 황후는 아니었다. 고려 출신의 여성이 원나라의 궁녀가 되어 후비에 이른 이로는 세조(世祖) 쿠빌라이(忽必烈)의 총애를 받은 이씨(李氏)가 있었고 인종(仁宗)때에 다마시리 카톤(答里麻失里 哈屯, 충숙공 김심의 딸), 바얀 쿠투(伯顔忽篤, 충선왕의 의붓딸), 그리고 후궁인 영비(英妃) 다마 후투그(達麻忽都)가 있었다.",
      "코케 테무르의 막객(幕客)으로 공민왕 15년(1366년) 고려를 방문했던 곽영석(郭永錫)은 환영 연회에서 \"일찍이 고려의 산수(山水)가 빼어나고 아직도 기자(箕子)의 풍속이 남아있다는 말을 들었는데, 원컨대 지도(地圖) · 예악(禮樂) · 관제(官制)를 보기를 원한다.\"고 말했고, 접객을 맡은 고려의 임박이 \"우리 나라 산수의 기이함을 알고자 하면 바로 상국(上國)의 황후(기황후)와 태자(태자 아유르시리다르)가 계시는데 어찌 산천의 수려한 기운을 타고 나지 않았겠는가?\"라고 대답하자, 곽영석은 무릎을 치며 \"드디어 천하의 부모 마음으로 하여금, 아들 낳는 것을 중히 여기지 않고 딸 낳는 것을 중하게 여기게 하네.\"라고 하니, 주변 사람들이 부끄러워하며 얼굴을 붉혔다고 한다.",
    ] },
  { "title" = "가계", "paragraphs" = [
      "종고조부 기윤위는 고려 희종 때인 1211년 왕준명, 우승경 등이 최충헌을 제거하려 할 때 최충헌을 구출하였으며, 이후 최충헌의 측근으로 활동하였다. 고조부 기윤숙은 상장군과 중서,문하성의 양성의 관직을 지내고 문하시랑 평장사에 이르렀으며, 증조부 기홍영은 좌우위보승낭장을 지내고 사후 은청광록대부 상서좌복야에 추증되었다. 기홍영의 아들이자 할아버지 기관의 형제였던 기온(奇蘊)은 고려 고종의 부마였다.",
    ] },
  { "title" = "외부 링크", "paragraphs" = [
      "[https://web.archive.org/web/20160306015021/https://www.ohmynews.com/NWS_Web/view/at_pg.aspx?CNTN_CD=A0000319518 보관됨 2016-03-06 - 웨이백 머신 \"<신돈>의 기황후 이미지는 왜곡됐다\"] 보관됨 2016-03-06 - 웨이백 머신 오마이뉴스 2006년 3월 27일자",
    ] },
]

[articles.ar]
text = "الإمبراطورة جي (أو الإمبراطورة كي، بالهانغل 기황후 ، بالصينية 奇皇后 ، بالمغولية Өлзий хутуг) كانت إحدى الزوجات الرئيسيات للإمبراطور توغون تيمور من سلالة يوان (التي حكمت منغوليا)، وهي والدة الإمبراطور Biligtü Khan (مؤسس مملكة يوان الشمالية). كانت تنتمي إلى عائلة أرستقراطية من غوريو (كوريا حاليا)."
title = "الإمبراطورة كي"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A7%D9%84%D8%A5%D9%85%D8%A8%D8%B1%D8%A7%D8%B7%D9%88%D8%B1%D8%A9_%D9%83%D9%8A"
intro = [
  "الإمبراطورة جي (أو الإمبراطورة كي، بالهانغل 기황후 ، بالصينية 奇皇后 ، بالمغولية Өлзий хутуг) كانت إحدى الزوجات الرئيسيات للإمبراطور توغون تيمور من سلالة يوان (التي حكمت منغوليا)، وهي والدة الإمبراطور Biligtü Khan (مؤسس مملكة يوان الشمالية). كانت تنتمي إلى عائلة أرستقراطية من غوريو (كوريا حاليا).",
  "الإمبراطورة كي هي ابنة كي جاهو (기자오; 奇子敖) من هينجو (행주، 幸州 ، جويانج حاليا) بغوريو، وأخوها الأكبر هو كي تشول (بالهانغل 기철، بالهانجا 奇轍، بالمغولية Bayn Bukha). في البداية أصبحت محظية للإمبراطور توغون تيمور، ثم والدة ابنه ايوشيريدارا (أو Biligtü Khan). السيدة جي (أو السيدة كي) ولدت في عائلة أرستقراطية بيروقراطية ذات مكانة اجتماعية منخفضة نوعا ما. إلى حدود القرن التاسع عشر، كان المجتمع الكوري ينقسم إلى أربعة عشر طبقة اجتماعية (الطبقة الملكية هي العليا، وطبقة العبيد هي السفلى في قاع الهرم الاجتماعي). كان يتم إرسال أعداد كبيرة من الذكور كعبيد مخصيين، والنساء كمحظيات، إضافة إلى الملابس، الحرير، والذهب... كجزية تدفعها غوريو إلى أسرة يوان المغولية. وقد تكبدت غوريو خسائر كبيرة نتيجة لما قام به الخصي Bak Bulhwa، وألحق دفع هذه الجزية ضررا كبيرا على سلالة/مملكة غوريو. مع ذلك، كان الزواج من نساء كوريات عند المغول يعتبر مما يرفع مقام المرء.",
  "سنة 1333، تم إرسال السيدة كي في سن مراهقتها، إلى يوان بصفتها«جزية بشرية» حيث كان على ملك غوريو مرة كل 3 سنوات توفير عدد من الشابات الجميلات ليقمن بخدمة الإمبراطور المغولي كمحظيات. لم تكن السيدة كي راغبة في ترك أسرتها ولا راغبة في حياة المحظيات، وكان ذهابها إلى يوان أمرا خارجا عن ارادتها. محظيات الإمبراطور كن جزءا من عبيده ويعتبرن جزءا من الحريم الامبراطوري، ولكن السيدة كي عند وصولها إلى يوان، سعت إلى ان تستفيد من وضعها إلى أقصى حد، أي ان تصبح أفضل محظية بالقصر الامبراطوري. بجمالها الفائق وموهبتها في الغناء والشعر والرقص، وفنون المحادثة وعلم الخرائط، استطاعت بسرعة ان تصبح المحظية الأقرب إلى توغون تيمور، حيث وقع في حبها ولاحظ الجميع انه أصبح يقضي بصحبتها وقتا أطول بكثير مما يقضيه مع الامبراطورة داناشيري التي كانت زوجته الأولى والامبراطورة الأولى.",
  "بعد اعدام الامبراطورة داناشيري في ال22 من يوليو 1335 بسبب التمرد الذي قاده شقيقها تانكيشي، أراد الامبراطور توغون تيمور ترقية السيدة كي لتصبح زوجته الثانية، الأمر الذي كان مخالفا للعرف الذي ينص على أن يتخذ الإمبراطور زوجات مغوليات فقط، وتسبب هذا في معارضة شديدة من طرف البلاط الامبراطوري لهذا القرار غير المعهود، فاضطر الإمبراطور للتراجع عن قراره. ثم حاول ترقيتها إلى امبراطورة، لكن الجنرال بيان الذي كان يمسك بيده السلطة وزمام الأمور عارض هذا القرار، وأيضا والدته الامبراطورة الأرملة (بوداشيري) اعترضت على رغبته بجعل السيدة كي امبراطورة حيث كانت تعتبرها امرأة داهية وخطرة وتخشى من امساكها للسلطة، وهي من أقنعت بيان بخطورة تعيينها. سنة 1339، أنجبت السيدة كي ابنا ذكرا، واختاره الإمبراطور ليكون خليفته، وبذلك أصبح قادرا على ترقية السيدة كي وجعلها زوجته الثانية سنة 1340.",
]
sections = [
  { "title" = "في الثقافة والفن", "paragraphs" = [
      "تمت تأدية دور الامبراطورة كي من طرف الممثلة Kim Hye-ri سنة 2005 بمسلسل «شن دون» على قناة ام بي سي كوريا",
      "وأيضا تم تمثيل دور السيدة كي من طرف الممثلة «ها جي وون» و «هيون سونغ من» سنة 2013 في المسلسل التاريخي 'الامبراطورة كي' على قناة ام بي سي كوريا",
    ] },
]

[articles.id]
text = "Permaisuri Gi (atau Ki; Hangul: 기황후; 1315–1369/70), dikenal juga sebagai Permaisuri Qi (atau Ch'i; 奇皇后) dalam Bahasa Tionghoa dan Öljei Khutuk (Өлзий хутуг) dalam Mongolia, adalah salah satu dari permaisuri utama dari Toghon Temür dari Dinasti Yuan dan ibu dari Biligtü Khan Ayushiridara. Ia berasal dari keluarga aristokratik Goryeo."
title = "Gi"
lang = "id"
url = "https://id.wikipedia.org/wiki/Gi"
intro = [
  "Permaisuri Gi (atau Ki; Hangul: 기황후; 1315–1369/70), dikenal juga sebagai Permaisuri Qi (atau Ch'i; 奇皇后) dalam Bahasa Tionghoa dan Öljei Khutuk (Өлзий хутуг) dalam Mongolia, adalah salah satu dari permaisuri utama dari Toghon Temür dari Dinasti Yuan dan ibu dari Biligtü Khan Ayushiridara. Ia berasal dari keluarga aristokratik Goryeo.",
]
sections = [
  { "title" = "Biografi", "paragraphs" = [
      "Öljei Khutuk, adalah nama Mongolia di mana ia kemudian dikenal, dilahirkan sebagai Gi Jao (Hanja:奇子敖) di Haengju (Hanja:幸州, Goyang modern) di Goryeo. Ia memiliki kakak laki-laki yang bernama Gi Cheol (Hanja:奇轍, Mongolia: Bayn Bukha). Ia menjadi selir dari Toghon Temür dan menjadi ibu dari Ayurshiridara. Setelah permaisuri utama Danashri dieksekusi pada tanggal 22 Juli 1335 dalam sebuah pembersihan karena pemberontakan saudara laki-lakinya Tankis (Tangqishi), Toghon Temür mencoba untuk menjadikan Öljei Khutuk sebagai permaisuri. Namun Bayan dari Merkid, yang memegang kekuasaan yang sesungguhnya, menentang hal tersebut. Ketika Bayan disingkirkan, Öljei Khutuk menjadi permaisuri kedua pada tahun 1340 (permaisuri utama adalah Bayn Khutuk dari Khongirad). Anak laki-lakinya Ayurshiridara ditunjuk sebagai Putra Mahkota pada tahun 1353. Menggunakan kasim asal Goryeo, Bak Bulhwa (Hangul: 박불화; Hanja: 朴不花) sebagai agennya, ia memulai kampanye untuk memaksa kaisar untuk menyerahkan takhta kekaisaran untuk anaknya Ayurshiridara. Namun niatnya kemudian diketahui oleh kaisar dan ia tinggal terpisah darinya.",
    ] },
  { "title" = "Referensi", "paragraphs" = [
      "Чулууны Далай; Нямбуугийн Ишжамц; Найдангийн Дангаасүрэн (1992). Монголын түүх. Улаанбаатар: Эрдэм.",
    ] },
]

[articles.pt]
text = "Imperatriz Gi (ou Imperatriz Ki; coreano: 기황후; 1315–1369/70) também conhecida como Imperatriz Qi (ou Ch'i; 奇皇后) em Chinês e Öljei Khutuk (Өлзий хутуг) em Mongol, foi uma das principais Imperatrizes de Toghon Temür da dinastia Yuan e mãe de Biliguetu Cã. Ela era originalmente de uma família aristocrata de Goryeo, atual Coreia, e se mudou para Yuan como uma concubina imperial de Toghon."
title = "Imperatriz Gi"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Imperatriz_Gi"
intro = [
  "Imperatriz Gi (ou Imperatriz Ki; coreano: 기황후; 1315–1369/70) também conhecida como Imperatriz Qi (ou Ch'i; 奇皇后) em Chinês e Öljei Khutuk (Өлзий хутуг) em Mongol, foi uma das principais Imperatrizes de Toghon Temür da dinastia Yuan e mãe de Biliguetu Cã. Ela era originalmente de uma família aristocrata de Goryeo, atual Coreia, e se mudou para Yuan como uma concubina imperial de Toghon.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Imperatriz Gi nasceu em Haengju (행주 幸 州, atual cidade de Goyang), de uma família aristocrata de burocratas de baixa classe social. Seu pai era Gi Ja-oh (Coreano: 기자 오; Hanja: 奇子敖). Em 1333, a adolescente Lady Gi estava entre as concubinas enviadas a Yuan pelo rei de Goryeo, pois os reis tinham de fornecer um certo número de garotas adolescentes bonitas para servir de concubinas aos imperadores mongóis a cada três anos. Era considerado de prestígio casar-se com mulheres de Goryeo. Lady Gi, extremamente bonita e habilidosa em dança, conversação, canto, poesia e caligrafia, rapidamente se tornou a concubina favorita de Toghon Temür. O imperador Toghon Temür se apaixonou por ela e logo percebeu que passava muito mais tempo de sua companhia do que com a primeira Imperatriz Danashiri.",
      "A Imperatriz Danashiri foi executada em 22 de julho de 1335 em um ato de eliminação devido a uma rebelião realizada por seu irmão Tangkishi. Quando Toghon Temür tentou promover Lady Gi à esposa secundária, o que contrariava a prática padrão de apenas tomar esposas secundárias dos clãs mongóis, criou-se tal oposição na corte a essa inédita promoção para uma mulher de Goryeo, que ele foi forçado a desistir. Bayan, que detinha o poder real em Yuan, se opunha à promoção de Lady Gi, assim como a Imperatriz Dowager, que considerava Lady Gi astuta. Em 1339, quando Lady Gi deu à luz a um filho, a quem Toghon Temür decidiu que seria seu sucessor, ele finalmente conseguiu que ela fosse nomeada sua esposa secundária em 1340. Como a esposa favorita do imperador, Lady Gi era muito uma mulher poderosa em Yuan. Quando Bayan foi expurgado, Lady Gi tornou-se a Imperatriz secundária em 1340 (a Imperatriz principal era Bayan Khutugh de Khongirad).",
      "Toghon Temür perdeu cada vez mais interesse em governar enquanto seu reinado prosseguia. Durante este período, o poder foi exercido cada vez mais pelos talentos tanto político quanto econômico de Lady Gi. Isso levou a um dos períodos mais pacíficos e prósperos para o Yuan. Gi Cheol, irmão mais velho de Lady Gi, foi nomeado comandante do Quartel General do Campo Mongol Oriental - tornando-o, de fato, o verdadeiro governante de Goryeo - devido à sua influência e ela monitorou de perto os assuntos de Goryeo. Seu filho Aiuxiridara (Biliguetu Cã) foi designado príncipe herdeiro em 1353. Usando seu eunuco Bak Bulhwa (Coreano: 박불화; Hanja: 朴不花) como seu agente, ela iniciou uma campanha para forçar o Imperador a passar o trono imperial para ele. No entanto, suas intenções tornaram-se conhecidas pelo Imperador e seu filho cresceu distante dela.",
    ] },
  { "title" = "Na cultura popular", "paragraphs" = [
      "Retratada por Ha Ji-won e Hyun Seung-min em 2013–2014, no drama televisivo da MBC Empress Ki.",
