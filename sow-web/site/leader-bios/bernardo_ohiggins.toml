[articles.en]
text = "Bernardo O'Higgins Riquelme was a Chilean military officer, statesman and a major leader of Chile's successful struggle for independence from the Spanish Empire. He was the second Supreme Director of Chile from 1817 to 1823, the first holder of the title to head a fully independent Chilean state, and is considered one of Chile's founding fathers."
title = "Bernardo O'Higgins"
lang = "en"
url = "https://en.wikipedia.org/wiki/Bernardo_O'Higgins"
intro = [
  "Bernardo O'Higgins Riquelme (Spanish pronunciation: [beɾˈnaɾðo oˈ(x)iɣins] ; 20 August 1778 – 24 October 1842) was a Chilean military officer, statesman and a major leader of Chile's successful struggle for independence from the Spanish Empire. He was the second Supreme Director of Chile from 1817 to 1823, the first holder of the title to head a fully independent Chilean state, and is considered one of Chile's founding fathers.",
  "Born in Chillán, O'Higgins was of Irish and Basque-Spanish descent and the illegitimate son of Ambrosio O'Higgins, 1st Marquess of Osorno, who would later become the Governor of Chile and subsequently Viceroy of Peru. While studying in London, he became acquainted with Francisco de Miranda, developed a sense of nationalist pride, and became a member of the revolutionary Lautaro Lodge. Returning to Chile in 1802 following his father's death, he inherited a large estate and settled down as a wealthy landowner.",
  "In 1810, a national junta was established following the deposition of King Ferdinand VII of Spain by Napoleon. O'Higgins was elected to the first National Congress of Chile a year later. He soon became embroiled in a conflict with José Miguel Carrera, who espoused a more specifically Chilean brand of nationalism. Their divide ultimately contributed to O'Higgins' disastrous defeat at Rancagua at the hands of the Royalists, leading to the fall of the Patria Vieja.",
  "Following the reassertion of Spanish rule, O'Higgins went into exile in the newly independent Argentina, where he met General José de San Martín and helped assemble the Army of the Andes. In 1817, San Martín and O'Higgins crossed the Andes into Chile and achieved a decisive victory over the royalists at the Battle of Chacabuco. They then re-entered Santiago, where O'Higgins was proclaimed Supreme Director after San Martín declined the post. A year later, Chile formally proclaimed itself an independent republic, and independence was all but assured with the patriot victory at Maipú.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Bernardo O'Higgins, a member of the O'Higgins family, was born in the Chilean city of Chillán in 1778, the illegitimate son of Ambrosio O'Higgins, 1st Marquis of Osorno, a Spanish officer born in County Sligo, Ireland, who became governor of Chile and later viceroy of Peru. His mother was Isabel Riquelme, a prominent local; the daughter of Don Simón Riquelme y Goycolea, a member of the Chillán Cabildo, or town council.",
      "O'Higgins spent his early years with his mother's family in central-southern Chile and was never acknowledged by his father, and later he lived with the Albano family, who were his father's commercial partners, in Talca. From age 10 to 12, he studied under Franciscan teachers.",
      "At age 15, O'Higgins was sent to Lima by his father. He had a distant relationship with Ambrosio, who supported him financially and was concerned with his education, but the two never met in person. At the time of his son's birth, Ambrosio was only a junior military officer. Two years later, Isabel married Don Félix Rodríguez, a friend of her father. O'Higgins used his mother's surname until the death of his father in 1801.",
    ] },
  { "title" = "Role in Chilean independence movement", "paragraphs" = [
      "On 18 September 1810, O'Higgins joined the revolt against the now French-dominated Spanish government. The criollo leaders in Chile did not support Joseph Bonaparte's rule in Spain, and a limited self-government under the Government Junta of Chile was created, with the aim of restoring the legitimate Spanish throne. This date is now recognized as Chile's Independence Day. O'Higgins was a close friend of Juan Martínez de Rozas, an old friend of his father, and one of the more radical leaders. O'Higgins strongly recommended that a national congress be created, and was elected a deputy to the first National Congress of Chile in 1811 as a representative of the Laja district. Tensions between the royalist and increasingly pro-independence factions, to which O'Higgins remained attached as a junior member, continued to grow.",
      "The anti-Royalist camp in Chile was deeply split along lines of patronage and personality, political beliefs, and geography (between the rival regional groupings of Santiago and Concepción). The Carrera family had already seized power several times in different coups, and supported a specifically Chilean nationalism, as opposed to the broader Latin American focus of the Lautaro Lodge grouping, which included O'Higgins and the Argentine José de San Martín. José Miguel Carrera, the most prominent member of the Carrera family, enjoyed a power base in Santiago; that of de Rozas, and later O'Higgins, lay in Concepción.",
      "As a result, O'Higgins was to find himself increasingly in political and military competition with Carrera—although early on, O'Higgins was nowhere near as prominent as his later rival. De Rozas initially appointed O'Higgins to a minor military position in 1812, possibly because of his illegitimate origins, poor health, or lack of military training. Much of O'Higgins' early military knowledge stemmed from Juan Mackenna, an immigrant of Irish descent and a former client of Ambrosio's, whose advice centred mainly on the use of cavalry. In 1813, when the Spanish government made its first attempt to reconquer Chile—sending an expedition led by Brigadier Antonio Pareja—Carrera, as a former national leader and now Commander in Chief of the Army, was by far the more prominent figure of the two, and a natural choice to lead the military resistance.",
    ] },
  { "title" = "O'Higgins as Supreme Director", "paragraphs" = [
      "While in exile, O'Higgins met the Argentine General José de San Martín, a fellow member of the Lautaro Lodge, and together the men returned to Chile in 1817 to defeat the royalists. Initially, the campaign went well, with the two commanders achieving a victory at the battle of Chacabuco. San Martín sent his troops down the mountain starting at midnight on 11 February to prepare for an attack at dawn. As the attack commenced, his troops were much closer to the Spanish than anticipated, and they fought hard and heroically. Argentine General Miguel Estanislao Soler's troops had to go down a tiny path that proved long and arduous and took longer than expected. General O'Higgins—supposedly seeing his homeland and overcome with passion—defied the plan of attack and charged along with his 1,500 troops. What happened during this theatre of the battle is fiercely debated. O'Higgins claimed that the Spanish stopped their retreat and started advancing towards his troops. He said that, if he were to lead his men back up the narrow path and retreat, they would have been massacred one by one. San Martín saw O'Higgins' early advancement and ordered Soler to charge the Spanish flank, which took the pressure off O'Higgins and allowed his troops to stand their ground.",
      "The ensuing firefight continued into the afternoon, and the tides turned for the Patriots as Soler captured a key Spanish artillery point. At this point, the Spanish set up a defensive square around the Chacabuco Ranch. O'Higgins charged the centre of the Spanish position, and Soler got into place behind the Spanish forces, effectively cutting off any chance of retreat. O'Higgins and his men overwhelmed the Spanish troops, who attempted to retreat, but Soler's men cut off their retreat and pushed towards the ranch. Hand-to-hand combat ensued in and around the ranch, until every Spanish soldier was dead or taken captive. Five hundred Spanish soldiers were killed, and 600 were taken captive. The Patriot forces lost 12 men in the battle, but an additional 120 died of their wounds.",
      "The Second Battle of Cancha Rayada in 1818, however, was a victory for the Royalists, and it was not until the Battle of Maipú that ultimate victory was assured. San Martín was initially offered the position of power in the newly free Chile, but he declined, in order to continue the fight for independence in the rest of South America. O'Higgins accepted the position instead and became the leader of an independent Chile. He was granted dictatorial powers as Supreme Director on 16 February 1817. On 12 February 1818, Chile proclaimed itself an independent republic.",
    ] },
  { "title" = "Peruvian independence and O'Higgins' final years", "paragraphs" = [
      "After being deposed, O'Higgins embarked from the port of Valparaíso in July 1823, in the British corvette Fly, never to see Chile again. Originally destined for Ireland, while he was passing through Peru he was strongly encouraged by Simón Bolívar to join the nationalist effort there. Bolívar's government granted O'Higgins the Hacienda de Cuiva and the Hacienda Montalván in San Vicente de Cañete, near Lima. O'Higgins lived in exile for the rest of his life accompanied by his illegitimate son, Pedro Demetrio O'Higgins (1817–1868), his mother, and his half-sister, Rosa Rodríguez y Riquelme. According to a 2001 documentary, O'Higgins also had a daughter, Petronila (born circa 1809) by Patricia Rodríguez.",
      "O'Higgins travelled to join Bolívar's army in its final liberation of Peru, but upon arrival, he found that Bolívar did not intend to give him a command—instead appointing him a general of Gran Colombia and making him a special court-martial judge for Chilean volunteers. Making his way back to Lima, O'Higgins heard of Sucre's victory at the Battle of Ayacucho. He returned to Bolívar for the victory celebrations but as a civilian. \"Señor\", he toasted, addressing Bolívar, \"America is free. From now on General O'Higgins does not exist; I am only Bernardo O'Higgins, a private citizen. After Ayacucho, my American mission is over.\"",
      "When Andrés de Santa Cruz became head of the Peru-Bolivian Confederation in 1836, O'Higgins endorsed his integrationist policies, and wrote a letter of support to him the following year when the Confederation came under attack from the Chilean forces of Diego Portales—ultimately offering to act as a mediator in the conflict. With the rise of Agustín Gamarra, O'Higgins found himself out of favour in Peru. Meanwhile, the Chilean government had begun to rehabilitate O'Higgins, reappointing him to his old rank of captain-general in the Chilean",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "After his death, his remains were first buried in Peru, before being repatriated to Chile in 1869. O'Higgins had wished to be buried in the city of Concepción, but this was never to be. For a long time, they remained in a marble coffin in the Cementerio General de Santiago, and in 1979 his remains were transferred by Augusto Pinochet to the Altar de la Patria, in front of the Palacio de La Moneda. In 2004, his body was temporarily stored at the Chilean Military School during the building of the Plaza de la Ciudadanía, before being finally laid to rest in the new underground Crypt of the Liberator.",
      "O'Higgins is widely commemorated today, both in Chile and beyond. One of the administrative regions of Chile was named Libertador General Bernardo O'Higgins Region in his honour, as were other placenames such as the village of Villa O'Higgins. The main thoroughfare of the Chilean capital, Santiago, is Avenida Libertador General Bernardo O'Higgins. There is also the Bernardo O'Higgins National Park. In the town of San Vicente de Cañete, situated in the Lima Region of Peru, a park and street are named after him. A statue of O'Higgins is located in a park in Guatemala City, the capital of Guatemala.",
      "There is a bust of O'Higgins in O'Higgins Square by the bridge in Richmond, south-west London. Each year the borough's mayor is joined by members of the Chilean Embassy for a ceremony, and a wreath is placed there. A blue plaque was erected in his honour at Clarence House in Richmond, where he lived while studying in London.",
    ] },
]

[articles.es]
text = "Bernardo O'Higgins Riquelme (San Bartolomé de Chillán y Gamboa, Imperio español, 20 de agosto de 1778-Lima, Perú, 24 de octubre de 1842) fue un militar y político chileno reconocido por ser libertador de Chile, así como por ser uno de los padres de la Patria de Chile, por su participación en el proceso de independencia de Chile del Imperio español, tanto en la respectiva guerra como en el cargo de gobernante como director supremo entre 1817 y 1823, cuando consolidó su inicio como nación.​ Era de ascendencia irlandesa y vasca; fue hijo de Ambrosio O'Higgins, quien antes de morir desempeñaba el cargo de virrey del Perú; y, de Isabel Riquelme, quien acompañó a su hijo durante el proceso de emancipación. Por instrucciones de su padre, estudió inicialmente en Chillán, luego en Lima y después en Londres (Inglaterra), donde fue azuzado por las ideas secesionistas de su profesor de matemáticas, Francisco de Miranda, quien después lo hizo miembro de la Logia de Lautaro."
title = "Bernardo O'Higgins"
lang = "es"
url = "https://es.wikipedia.org/wiki/Bernardo_O%27Higgins"
intro = [
  "Bernardo O'Higgins Riquelme (San Bartolomé de Chillán y Gamboa, Imperio español, 20 de agosto de 1778-Lima, Perú, 24 de octubre de 1842) fue un militar y político chileno reconocido por ser libertador de Chile, así como por ser uno de los padres de la Patria de Chile, por su participación en el proceso de independencia de Chile del Imperio español, tanto en la respectiva guerra como en el cargo de gobernante como director supremo entre 1817 y 1823, cuando consolidó su inicio como nación.​",
  "Era de ascendencia irlandesa y vasca; fue hijo de Ambrosio O'Higgins, quien antes de morir desempeñaba el cargo de virrey del Perú; y, de Isabel Riquelme, quien acompañó a su hijo durante el proceso de emancipación. Por instrucciones de su padre, estudió inicialmente en Chillán, luego en Lima y después en Londres (Inglaterra), donde fue azuzado por las ideas secesionistas de su profesor de matemáticas, Francisco de Miranda, quien después lo hizo miembro de la Logia de Lautaro. En 1801 regresó a Chile y se radicó en su hacienda de San José de Las Canteras, recibida en herencia, y se dedicó a las labores agrícolas.",
  "Políticamente fue alcalde de Chillán en 1806,​ de Los Ángeles en 1810, diputado por la misma zona ante el Primer Congreso Nacional, entre julio y agosto de 1811, e intendente de Concepción en 1814.​ Más tarde se convirtió en militar sin formación.​ Durante el período de la Reconquista, organizó en Mendoza, junto con José de San Martín, el Ejército de los Andes, y dirigió la ofensiva chilena, con lo cual se logró la independencia de Chile en 1818, tras la batalla de Maipú.",
  "Ejerció la jefatura del Estado bajo el título de director supremo en calidad de interino, siendo brigadier. Y en ese mismo cargo asumió la titularidad plena el 24 de marzo de 1818 y reasumió el 1 de abril de ese año. Retomó nuevamente, el 14 de abril del mismo. Reasumió formalmente, siendo capitán general, el 3 de septiembre de 1820 y finalmente el 25 de noviembre de 1822, siendo capitán general.​",
]
sections = [
  { "title" = "Infancia y juventud", "paragraphs" = [
      "O'Higgins nació como Bernardo Higins, según consta en su partida de bautismo, el 20 de agosto de 1778.​ Era hijo natural de Ambrosio O'Higgins, en esa época teniente coronel de Granaderos de 59 años de edad y que luego fue gobernador de Chile (1788-1796) y virrey del Perú (1796-1801), y de la chilena Isabel Riquelme Meza, miembro de una de las familias más antiguas e ilustres de la zona de Chillán.​",
      "El lugar de nacimiento de Bernardo O'Higgins no es preciso. Aunque tradicionalmente se menciona a la casona familiar de los Riquelme, ubicada en lo que actualmente corresponde a Chillán Viejo y donde Bernardo pasó sus primeros años de vida sin padre. Otros afirman que el lugar habría sido en algún otro terreno familiar, ya sea en la casona de las hermanas Olate en la misma ciudad o en la cercana hacienda de El Palpal, en los terrenos de la actual comuna de Pemuco.​ En su partida de bautismo aparece únicamente que nació en los territorios del obispado de Concepción, que abarca las localidades anteriores.",
      "Frente al desconocimiento legal y social de Ambrosio O’Higgins de ejercer su paternidad de su hijo natural (nacido fuera de un matrimonio), Bernardo fue llamado el «guacho Riquelme», aunque, según descripciones de la época, físicamente era muy parecido a su padre. Permaneció en Chillán hasta noviembre de 1782, cuando su padre lo envió a Talca, quedando bajo el cuidado del matrimonio formado por el rico comerciante portugués Juan Albano Pereira Márquez y Bartolina de la Cruz y Bahamonde.​ El 23 de enero de 1783 fue bautizado en la iglesia parroquial de Talca: consta en el acta el reconocimiento de su paternidad por parte de Ambrosio O'Higgins; el nombre de la madre, sin embargo, aparece reservado a petición de ésta.​ Aunque en la partida aparece como «Bernardo Higins», fue conocido hasta la edad de 24 años como «Bernardo Riquelme».",
    ] },
  { "title" = "En su Hacienda San José de Las Canteras de Vallenar", "paragraphs" = [
      "Al llegar a Chile, Bernardo O'higgins se alojó en Santiago en la casa de su primo, el capitán Tomás O'Higgins, quien lo acogió y le informó el contenido exacto del testamento de Ambrosio O'Higgins, consistente en la hacienda Las Canteras con 3000 cabezas de ganado. Como la liquidación de la herencia se efectuaba en Lima, le escribió a los albaceas solicitándoles información y firmando, por primera vez, con gran satisfacción y orgullo como Bernardo O'Higgins y Riquelme. Los albaceas le respondieron que era necesario esperar el término del juicio de residencia que conforme con la ley se le seguía a su padre. Además, le informaban que habían instruido al administrador de la hacienda Las Canteras, Pedro Nolasco del Río, que le hiciera entrega de esta previo otorgamiento de una fianza en espera del término del juicio en Perú. Recibida esta información, se dirigió a Chillán a buscar a su madre y media hermana Rosa para así comenzar a vivir en Los Ángeles, debido a que sus tíos Riquelme ya radicaban en Los Ángeles —después de la muerte de su abuelo Simón Riquelme, en 1801—, luego se entrevistó nuevamente con el administrador de su estancia, don Pedro Nolasco del Río, antiguo amigo y asistente de su padre Ambrosio O'Higgins, quien lo dejó tomar bajo fianza algunas cabezas de ganado de la herencia y con su venta saldar las deudas del viaje.",
      "Invitado por el comandante Del Río, y acompañado de su tío Manuel Riquelme, asistió en marzo de 1803 al parlamento de Negrete, reunión efectuada con el propósito de mantener la armonía con los indígenas.​ Este se efectuó en el mismo lugar en que su padre lo había realizado 10 años antes. Esta reunión le sirvió para ver de cerca y confraternizar con los caciques mapuches y recordar algo de su infancia en el colegio de Naturales de Chillán, en que había convivido una temporada con los hijos de los caciques de la región.",
      "Dos meses después se dirigió a Lima para agilizar los trámites de liquidación de la herencia e iniciar los trámites de legitimación, esta última diligencia a la postre fracasó, pero regresó con las instrucciones de los albaceas para que el administrador de la hacienda le hiciera entrega definitiva de esta. El 19 de febrero de 1804 tomó posesión de las 16 689 cuadras de tierra en que consistía la hacienda, además de 4300 vacunos y 540 caballares contados luego de un rodeo que duró 22 días. Esta diferencia en el ganado con lo que figuraba en el testamento dieron lugar a que posteriormente hubiera una conciliación con su primo Tomás, para repartir entre ambos el ganado excedente.​",
    ] },
  { "title" = "Participación en la Independencia de Chile", "paragraphs" = [
      "Fue inspirado por el mapuche Lautaro, quien también fue educado gracias al gobernador de Chile (Pedro de Valdivia) y lideró a su pueblo contra los españoles, durante la Guerra de Arauco.​",
      "A comienzos de 1810 O'Higgins tuvo noticias que los criollos de Chuquisaca y de Quito habían depuesto a las autoridades españolas y creado Juntas de Gobierno. Luego, desde España, supo de la invasión de Andalucía por los franceses, pero lo que más impactó en Las Canteras fue la noticia de que en Santiago, por orden del Gobernador, habían sido apresados José Antonio de Rojas, Juan Antonio Ovalle y Bernardo de Vera y Pintado, importantes vecinos, que fueron trasladados hasta Valparaíso para ser enviados a Lima. Esta acción creó una violenta reacción en contra de García Carrasco además que coincidió con el derrocamiento, el 25 de mayo, del virrey Cisneros por los patriotas de Buenos Aires, los que habían instalado una Junta de Gobierno.",
      "Los criollos de Santiago, al enterarse de la captura y traslado de Rojas, Ovalle y Vera, se indignaron con el gobernador, ya desprestigiado por un escándalo relacionado con contrabando, por lo que la Real Audiencia finalmente consiguió que, con fecha 16 de julio, García Carrasco renunciara al cargo y le entregara el mando del reino a Mateo de Toro y Zambrano, anciano de 83 años. O'Higgins por su parte estimó que había llegado el momento de la lucha, por lo que decidió prepararse para ella. Se reunió con el comandante de Dragones de la Frontera y le propuso ejecutar su plan de organizar la defensa militar de la región de Concepción formando dos regimientos de caballería y con sus inquilinos de Las Canteras el regimiento N.° 2 de La Laja.",
    ] },
  { "title" = "Durante la Patria Vieja", "paragraphs" = [
      "Cuando O'Higgins supo lo acontecido en Santiago el 18 de septiembre de 1810, hechos que habían significado la instauración de una Junta de Gobierno en la que Juan Martínez de Rozas figuraba como uno de los vocales, partió de inmediato a Concepción a entrevistarse con él, obteniendo por parte de este la seguridad que propondría y lucharía por el establecimiento de la libertad de comercio y el llamado a elegir un Congreso de representantes para involucrar a todo el pueblo en la acción revolucionaria que veía venir. Para lo anterior era necesario preparar el país militarmente para afrontar una guerra contra las fuerzas realistas que seguramente enviaría el virrey del Perú, como lo había hecho con Chuquisaca y Quito, ofreciéndole desde ya las que él había formado en la Isla de La Laja.",
      "Rozas, una vez en Santiago e integrado a la Junta de Gobierno, obtuvo la aprobación de un plan de defensa del reino, plan ideado con la asesoría del coronel de ingenieros Juan Mackenna, también antiguo y estrecho colaborador de Ambrosio O'Higgins. La Junta, con fecha 28 de febrero de 1811, nombró a Bernardo O'Higgins teniente coronel del 2.º Regimiento de Caballería de Milicias Disciplinadas de La Laja, que se denominaría Lanceros de la Frontera. Este nombramiento le causó gran dolor y desilusión pues, como coronel del regimiento, Rozas nombró a su cuñado.",
      "Pasada la desilusión inicial causada por su postergación en el mando del regimiento formado por él, solo pensó en prepararse para poder ejercer adecuadamente su función militar y para ello le pidió apoyo y consejo al coronel Juan Mackenna, militar de reconocido renombre, a quien no conocía personalmente, pero que sabía profesaba sus mismas ideas de libertad y en quién confiaba plenamente. Mackenna, al cabo de dos meses, le envió de respuesta un escrito que semejaba un manual de instrucción militar, escrito y consejos que indudablemente le sirvieron mucho en su desempeño futuro.",
    ] },
  { "title" = "Legado", "paragraphs" = [
      "Considerado como uno de los Padres de la Patria y uno de los Libertadores de América del Sur su legado dura hasta ahora, comienzos del siglo XXI.",
      "El 12 de febrero de 1818 proclamó la Independencia de Chile, ideal que había llevado al país en 1802. Estableció también la ciudadanía chilena.",
      "Organizó el Ejército de Chile y creó la Academia Militar la que posteriormente se transformó en la Escuela Militar Bernardo O'Higgins. Creó la bandera nacional, bandera tricolor de la estrella solitaria.",
    ] },
]

[articles.fr]
text = "Bernardo O'Higgins Riquelme est un général et chef d’État chilien, né à Chillán le 20 août 1778 et mort à Lima le 24 octobre 1842. Il est considéré comme l'un des pères de la patrie chilienne car il fut l'une des figures militaires fondamentales de l'indépendance et le premier chef d'État du Chili indépendant."
title = "Bernardo O'Higgins"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Bernardo_O%27Higgins"
intro = [
  "Bernardo O'Higgins Riquelme est un général et chef d’État chilien, né à Chillán le 20 août 1778 et mort à Lima le 24 octobre 1842. Il est considéré comme l'un des pères de la patrie chilienne car il fut l'une des figures militaires fondamentales de l'indépendance et le premier chef d'État du Chili indépendant. Il dirigea le pays sous le titre de Commandeur Suprême (Director Supremo) entre 1817 et 1823, date à laquelle il se retira volontairement de la présidence afin d'éviter une guerre civile. À la suite de sa démission, il s'exila au Pérou, où il resta jusqu'à sa mort en 1842.",
  "Son nom d'origine, Ó hUiginn en gaélique, fut changé en O'Higgins par les Anglais car ils n'arrivaient pas à le prononcer. C'est avec ce patronyme que le père de Bernardo, Ambrosio O'Higgins, originaire d'Irlande, s'installa et se fit connaître au Chili.",
]
sections = [
  { "title" = "Jeunesse", "paragraphs" = [
      "Bernardo O'Higgins naît à Chillán en 1778. Il est le fils illégitime d'Ambrosio O'Higgins (en) et de doña Isabel Riquelme (en). Son père, d'origine irlandaise, émigré en Espagne, est un militaire au service de la Couronne espagnole, nommé Intendant de Concepción en 1786 puis gouverneur de la capitainerie générale du Chili et plus tard vice-roi du Pérou.",
      "À l'âge de 4 ans, Bernardo quitte la maison maternelle sur décision de son père, et part vivre chez un paysan de Talca, Juan Albano Pereira. Pour son éducation, il est inscrit à Chillán au Colegio de Naturales, un établissement réservé aux enfants illégitimes. Bernardo n'est pas reconnu immédiatement par son père et il garde un certain temps le nom de Bernardo Riquelme. Plus tard, toujours à la demande son père, il est placé sous la tutelle du premier comte de Maulle, puis il suit les cours du Colegio del Príncipe à Lima. Il voyage ensuite en Europe, d'abord à Cadix, puis à Londres où il étudie au collège de Richmond.",
      "En Angleterre il rencontre le Vénézuélien Francisco de Miranda, qui le met sur le chemin de l'émancipation de l'Amérique espagnole. Bernardo O'Higgins est impressionné par la rhétorique de Miranda qui lui conseille de retourner en Amérique. La fréquentation de Miranda lui vaut d'être identifié par des espions comme un ennemi du roi d'Espagne.",
    ] },
  { "title" = "Débuts de la Révolution et de la lutte pour l'indépendance", "paragraphs" = [
      "Il fait des débuts dans la vie publique en 1804, lorsqu'il est nommé maire de Chillán. Deux ans plus tard, il est nommé maître de camp.",
      "Au moment du 18 septembre 1810, il occupe le poste de sous-délégué de l'île de La Laja. Il s'unira au mouvement indépendantiste fin 1810 puis sera élu député du Congrès constituant en 1811.",
      "Après le premier coup d'État de José Miguel Carrera il se forme une nouvelle junte de gouvernement qui désigne O'Higgins comme son porte-parole. Il accepte d'assumer cette fonction, mais ses relations médiocres avec Carrera le poussent à se retirer dans sa propriété de Las Canteras.",
    ] },
  { "title" = "Bernardo O'Higgins Général en chef", "paragraphs" = [
      "La junte de gouvernement se déplaça de Santiago à Talca et nomma O'Higgins Général en chef, destituant par là même Carrera.",
      "O'Higgins hésita pendant 3 mois avant d'accepter la charge, et ce n'est que lorsque Carrera se résigna et se retira à Concepción qu'il prit son mandat, le 28 janvier 1814. Deux jours seulement après l'arrivée d'une nouvelle expédition royaliste, dirigée par Gabino Gaínza et mieux armée que la précédente.",
      "Les Royalistes s'emparèrent de Concepción et de Talca. Une nouvelle campagne commença mais contrairement aux précédentes ce fut un désastre pour l'armée chilienne avec de cuisantes défaites lors des batailles de El Quilo et El Mambrillar. Le chilien, dont la famille était séquestrée par les royalistes, se vit dans l'obligation de signer le Traité de Lircay, reconnaissant la « légitimité de la colonisation ». O'Higgins perdit une grande part de sa popularité avec cette capitulation.",
    ] },
  { "title" = "Le Désastre de Rancagua", "paragraphs" = [
      "Pour affronter les royalistes, O'Higgins décide d'occuper Rancagua, s'opposant à José Miguel Carrera qui trouvait plus avisé d'occuper la Angostura de Paine. Le 25 septembre, O'Higgins fortifie tous les accès à la place de Rancagua.",
      "Le 1er octobre, avec 4 500 royalistes et 18 canons, plus du double de l'équipement adverse, Osorio se présente aux portes de Rancagua. Il n'y avait aucun moyen de communiquer avec les divisions commandées par Carrera et Benavente et O'Higgins dut se réfugier à l'intérieur de la ville. Ils se postèrent le long des quatre rues qui débouchaient sur la place centrale. Après une première tentative ratée pour s'emparer de la place, Osorio décide de bombarder et d'assaillir les tranchées des quatre rues simultanément. Cependant, les patriotes résistèrent jusqu'à la tombée de la nuit et l'obscurité naissante mit fin aux combats. Les patriotes passèrent la nuit en sécurité mais sans eau car les royalistes coupèrent l'arrivée d'eau en ville.",
      "Le 2 octobre, la bataille continue avec férocité, les patriotes ont résisté à six attaques franches depuis le début de l'affrontement mais ils sont quasi-défaits. Dans une ultime tentative pour sauver les survivants, O'Higgins et ses soldats lancent l'assaut, s'ouvrant un passage dans les lignes ennemies, ce qui deviendra le désastre de Rancagua.",
    ] },
]

[articles.it]
text = "Bernardo O'Higgins Riquelme (Chillán, 20 agosto 1778 – Lima, 24 ottobre 1842) è stato un generale e politico cileno di origini irlandesi, insignito del titolo di Padre della patria e primo capo di stato del Cile col titolo di Director Supremo dal 1818 al 1823."
title = "Bernardo O'Higgins"
lang = "it"
url = "https://it.wikipedia.org/wiki/Bernardo_O%27Higgins"
intro = [
  "Bernardo O'Higgins Riquelme (Chillán, 20 agosto 1778 – Lima, 24 ottobre 1842) è stato un generale e politico cileno di origini irlandesi, insignito del titolo di Padre della patria e primo capo di stato del Cile col titolo di Director Supremo dal 1818 al 1823.",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Figlio naturale del viceré spagnolo del Perù, Ambrosio O'Higgins, venne inviato dal padre a studiare in Europa, dove aderì però agli ideali liberali dell'indipendenza americana. Ripudiato dal padre per le sue idee politiche (1800), rientrò a Chillán e collaborò coi capi del movimento rivoluzionario a partire dal cabildo abierto del 18 settembre 1810. Arruolatosi nell'esercito cileno, ne assunse il comando in seguito alle dimissioni del generale José Miguel Carrera (1813), sconfisse gli spagnoli e li costrinse a firmare il patto di Lircay (1814). Rovesciato con la forza da Carrera, O'Higgins dovette mettersi ai suoi ordini, per poi fuggire in Argentina dopo la vittoria spagnola di Rancagua (2 agosto 1814). A Mendoza O'Higgins partecipò all'organizzazione dell'Esercito delle Ande con cui il generale argentino José de San Martín liberò il Cile e il Perù. Dopo la vittoria sugli spagnoli a Chacabuco (12 febbraio 1817), O'Higgins fu proclamato, per rinuncia di San Martín, Director Supremo del Cile e comandante dell'Ejército de Chile.",
      "O'Higgins proclamò solennemente l'indipendenza della Repubblica del Cile il 12 gennaio 1818, e promulgò una costituzione provvisoria, poi rinnovata nel 1822. Istituì un'accademia militare ed una navale, organizzò una flotta e la affidò all'avventuriero britannico Thomas Cochrane, perché proseguisse assieme a San Martín la guerra contro gli spagnoli nel Perù. In politica interna prese una serie di provvedimenti per ridurre il potere dell'oligarchia economica e del clero, istituì l'Instituto e la Biblioteca Nacional, ma non aumentò la libertà di stampa. Ottenne un prestito britannico e aumentò le tasse per pagare le opere pubbliche, la ricostruzione del Paese e la guerra in Perù. Buon amministratore, ma troppo autoritario, si rese impopolare per i suoi metodi (tra l'altro fece fucilare José Miguel Carrera e i suoi fratelli). Le sue proposte per un'ulteriore modifica della costituzione, ritenute dispotiche e dittatoriali, portarono alla ribellione del generale Ramón Freire e alla sollevazione delle province di Concepción e di Coquimbo (1822).",
      "Il 28 gennaio 1823 O'Higgins si dimise ed andò in esilio in Perù, dove partecipò con Simón Bolívar alla battaglia di Ayacucho e visse in una tenuta donatagli dal governo peruviano. Le sue spoglie furono riportate in patria nel 1869. In suo onore, la provincia cilena di Rancagua fu chiamata O'Higgins. Come altri protagonisti delle guerre d'indipendenza ispanoamericane (Benito Juárez, José de San Martín, Francisco de Miranda e Simón Bolívar), O'Higgins fu membro della Massoneria.",
    ] },
  { "title" = "Collegamenti esterni", "paragraphs" = [
      "O'Higgins, Bernardo, su Treccani.it – Enciclopedie on line, Istituto dell'Enciclopedia Italiana.",
      "O'Higgins, Bernardo, in Dizionario di storia, Istituto dell'Enciclopedia Italiana, 2010.",
      "(EN) Jay Kinsbruner, Bernardo O’Higgins, su Enciclopedia Britannica, Encyclopædia Britannica, Inc.",
    ] },
]

[articles.tr]
text = "Bernardo O'Higgins Riquelme (20 Ağustos 1778 Chillán, Şili - 24 Ekim 1842, Lima, Peru), asker ve Şili'nin bağımsızlık savaşçısıdır. 1817-1823 yılları arasında Şili'nin ilk Director Supremo'sudur."
title = "Bernardo O'Higgins"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/Bernardo_O%27Higgins"
intro = [
  "Bernardo O'Higgins Riquelme (20 Ağustos 1778 Chillán, Şili - 24 Ekim 1842, Lima, Peru), asker ve Şili'nin bağımsızlık savaşçısıdır. 1817-1823 yılları arasında Şili'nin ilk Director Supremo'sudur.",
]
sections = [
  { "title" = "Hayatı", "paragraphs" = [
      "Concepción'nun o zamanki belediye başkanı Ambrosio O’Higgins'in evlilik dışı oğlu olarak Chillán'da dünyaya gelir. Daha sonra babası Şili valisi ve Peru valisi olur. Annesi Isabel Riquelme Chillán'da tanınmış bir kişidir.",
      "İlk yıllarında annesinin ailesinin yanında yaşar. Babası, finansal açıdan onu desteklese ve eğitimi ile ilgilense de ilişkisi mesafelidir. O zamanlar İspanyol hükûmet memurlarının yerli kadınlarla evlenmesi yasaktır.",
      "Ambrosio O'Higgins, Peru valisi olduğunda eğitimini tamamlaması Bernardo'yu Londra'ya gönderir. O'Higgins, mesela Venezuelalı Francisco de Miranda gibi Güney Amerika'nın bağımsızlık savaşçılarının çevresine girer. Lautaro mason locasına katılır.",
    ] },
  { "title" = "Bağımsızlık savaşı", "paragraphs" = [
      "1810'da Şili'nin bağımsızlık savaşçılarına katılmıştır. 1813'te hareketin savaş kanadının komutanlığına getirilir. 1814'te Rancagua Muharebesi'nde yenilir ve Arjantin'e kaçmak zorunda kalır. Şili'de Reconquista devrine girilir.",
      "1817 General José de San Martín ile Andlar'dan yürüyüşe geçerek İspanyolları Chacabuco Muharebesi'nde yener. Kaybedilen Cancha Rayada Muharebesi'nde 1818 yılında kolundan yaralanır.",
      "Maipú Muharebesi 5 Nisan 1818 tarihinde Şili bağımsızlık savaşçılarına nihai galibiyeti getirir. Muzaffer José de San Martín millî bir hükûmet kurar. Bununla birlikte Şili devlet başkanlığını Bernardo O'Higgins'in lehine reddeder.",
    ] },
  { "title" = "Director Supremo", "paragraphs" = [
      "O'Higgins, Ülkenin aristokrasisi tarafından bağımsız Şili'nin ilk lideri olarak tanınır ve diktatör yetkileri ile donatılarak Director Supremo unvanı verilir. Makamına 16 Şubat 1817'de çıkar. 12 Şubat 1818'de Şili bağımsız olur.",
      "Hükûmetinin altı yılı içinde askeri akademi kurar ve yeni bir Şili bayrağı yürürlüğe koyar. Dış politikada San Martin'in Peru'da başarısız olan diğer akınlarını destekler. Bu askeri mağlubiyetler ile radikal ve liberal reformları (aristokrasinin kaldırılması, arazi sahipleri ve kilisenin güçlerindeki sınırlamalar) büyük toprak sahiplerini ve muhafazakârları kızdırır. 28 Ocak 1823'te indirilir.",
      "O'Higgins sürgün olarak Peru'ya gider ve 1842'de Lima'da ölür. 1869 bedeni Şili'ye nakledilir. 1979'dan beri mezarı Santiago'da, başkanlık sarayı La Moneda önündeki Altar de la Patria Mozolesi'nde bulunur.",
    ] },
  { "title" = "Türkiye'deki anıtı", "paragraphs" = [
      "Ankara'daki Aşağı Ayrancı semtinde bulunan Şili Meydanı'nda kendisine ait bir anıt bulunmaktadır.",
    ] },
]

[articles.ar]
text = "برناردو أوهيغينز ريكيلمي (الإسبانية: Bernardo O'Higgins Riquelme) (1778 – 1842) هو أحد أهم القادة في النضال التشيلي من أجل الاستقلال ورئيس أول حكومة وطنية دائمة في تشيلي."
title = "برناردو أوهيغينز"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A8%D8%B1%D9%86%D8%A7%D8%B1%D8%AF%D9%88_%D8%A3%D9%88%D9%87%D9%8A%D8%BA%D9%8A%D9%86%D8%B2"
intro = [
  "برناردو أوهيغينز ريكيلمي (الإسبانية: Bernardo O'Higgins Riquelme) (1778 – 1842) هو أحد أهم القادة في النضال التشيلي من أجل الاستقلال ورئيس أول حكومة وطنية دائمة في تشيلي.",
]
sections = [
  { "title" = "بدايات حياته", "paragraphs" = [
      "برناردو هو الابن غير الشرعي لحاكم تشيلي الأيرلندي أمبروزيو أوهيغينز بين عامي 1788 – 96. وولد في تشيلان في 20 أغسطس 1778. تعلم في إنكلترا وأمضى فترة في إسبانيا، ثم عاش في هدوء في بيته في تشيلي حتى اندلعت الثورة.",
    ] },
  { "title" = "الثورة التشيلية", "paragraphs" = [
      "انضم أوهيغينز إلى الحزب الوطني الذي قاده خوان مارتينيز دي روزاس، وأظهر نفسه في بداية الحرب في قتاله ضد القوات الملكية التي أرسلت من البيرو، وتم تعيينه في نوفمبر 1813 ليخلف خوسيه ميغيل كاريرا في قيادته للقوات الوطنية. تلى ذلك التنافس والعداوة بين الاثنين، ورغم أن أوهيغينز قدم عرضا ليحارب تحت إمرة كاريرا، فقد انتهى النزاع بأن أقصي أوهيغينز من جموع القوات التشيلية في معركة رانكاغوا عام 1814. فر أوهيغينز مع أغلب الوطنيين عبر الأنديز إلى ميندوزا، حيث كان الجنرال خوسيه دي سان مارتين يحضر قوة لتحرير تشيلي. انضم سان مارتين لحملة أوهيغينز ضد كاريرا، وسلّم أوهيغينز بتفوق سان مارتين وخبرته، فوافق على القتال تحت إمرته. وساهم إخلاصه وعزمه في تنظيم الجيش الوطني تحت إمرة سان مارتين، وكذلك في نقله عبر الأنديز وهزيمة الملكيين في تشاكابوكو (1817) ومايبو (1818).",
    ] },
  { "title" = "الرئاسة", "paragraphs" = [
      "بعد معركة تشاكابوكو اؤتمن أوهيغينز على إدارة تشيلي، وأدار البلاد بحزم وحافظ على علاقات طيبة مع الأرجنتين، وتعاون بإخلاص مع سان مارتين في تحضيره لغزو البيرو، كما وحاول وسط الأزمات أن يحسن معيشة الشعب. وبعد الإطاحة بالسيطرة الأسبانية على بيرو، ارتاح التشيليون من أي مخاوف بالهجوم عليهم، وبدؤوا يطالبون بإقامة حكومة دستورية. وحاول أوهيغينز في البداية المحافظة على مركزه بدعوته للكونغرس إقامة دستور يمنحه سلطات دكتاتورية. لكن السخط الشعبي ضده تحول إلى نزاع مسلح؛ فقد قامت انتفاضات في كونثبثيون وكوكيمبو، وفي 28 يناير 1823 استقال أوهيغينز من منصبه كحاكم عام دون أن يحاول التمسك به بالقوة. وتقاعد في البيرو حيث منح أملاكا هناك وعاش في هدوء حتى وفاته في 24 أكتوبر 1842 عن 64 عاما.",
    ] },
  { "title" = "مقالات أخرى", "paragraphs" = [
      "ديكتاتورية أوهيغينز La Dictadura de O'Higgins بقلم ميغيل لويس أرموناتيغي (سانتياغو، 1853).",
      "قاموس السير التشيلية 1550 – 1887 Diccionario biogrdfico de Chile بقلم بيدرو بابلو فيغيروا (سانتياغو، 1882).",
      "سير مختصرة للرجال المشهورين في تشيلي Rasgos biogrdficos de hombres notables de Chile بقلم خوسيه برناردو سواريز (فالباريسو، 1886).",
    ] },
  { "title" = "مراجع", "paragraphs" = [
      "تحوي هذه المقالة معلومات مترجمة من الطبعة الحادية عشرة لدائرة المعارف البريطانية لسنة 1911 وهي الآن ضمن الملكية العامة.",
    ] },
]

[articles.vi]
text = "Bernardo O'Higgins Riquelme (tiếng Tây Ban Nha: [berˈnarðo oˈxiɣins] (20 tháng 8 năm 1778 - 24 tháng 10 năm 1842) là một nhà cách mạng Nam Mỹ. Ông cùng với José de San Martín là người chỉ huy lực lượng giải phóng Chile, chấm dứt nền cai trị của Tây Ban Nha trong cuộc Chiến tranh Độc lập Chile."
title = "Bernardo O'Higgins"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Bernardo_O%27Higgins"
intro = [
  "Bernardo O'Higgins Riquelme (tiếng Tây Ban Nha: [berˈnarðo oˈxiɣins] (20 tháng 8 năm 1778 - 24 tháng 10 năm 1842) là một nhà cách mạng Nam Mỹ. Ông cùng với José de San Martín là người chỉ huy lực lượng giải phóng Chile, chấm dứt nền cai trị của Tây Ban Nha trong cuộc Chiến tranh Độc lập Chile. Ông là vị Chỉ huy Tối cao thứ nhì của Chile. Chức này sau nhập vào chức vị của tổng thống Chile.",
]
sections = [
  { "title" = "Tiểu sử", "paragraphs" = [
      "Bernardo O'Higgins thuộc dòng họ O'Higgins và sinh ra ở thành phố Chillan Chile vào năm 1778, con trai ngoài giá thú của Ambrosio O'Higgins, Hầu tước thứ nhất của Osorno, một sĩ quan Tây Ban Nha sinh ra ở hạt Sligo, Ireland, người đã trở thành thống đốc của Chile và phó vương của Peru. Mẹ ông là Isabel Riquelme, một phụ nữ tiếng ở địa phương và con gái của Don Simón Riquelme y Goycolea, một thành viên của Cabildo Chillan, hay hội đồng.",
      "O'Higgins đã trải qua những năm đầu tiên của ông với gia đình của mẹ mình ở nam trung bộ Chile, và sau đó anh sống với gia đình Albano, đối tác thương mại của cha mình, ở Talca. Ở tuổi 15, O'Higgins đã cha mình gửi đến Lima. Ông đã có một mối quan hệ xa với Ambrosio, người ủng hộ ông về tài chính và quan tâm đến việc học của mình, nhưng cả hai chưa bao giờ gặp ở người. Đó là chưa rõ tại sao Ambrosio không kết hôn Isabel. Quan chức cấp cao của chính phủ Tây Ban Nha ở châu Mỹ bị cấm kết hôn với người dân địa phương, nhưng ở thời điểm sinh O'Higgins, Ambrosio O'Higgins chỉ là một quan chức quân sự cấp thấp. Người ta cho rằng gia đình Isabel có lẽ đã không thấy vụ kết hôn này là ưu thế vào thời điểm đó. Hai năm sau, cô kết hôn với Don Félix Rodríguez, một người bạn cũ của cha cô. O'Higgins sử dụng họ của mẹ mình cho đến khi cái cha mình qua đời vào năm 1801.",
      "Ambrosio O'Higgins, cha của Bernardo, tiếp tục được thăng tiến nghề nghiệp và trở thành phó vương của Peru, lúc lên 17 tuổi Bernardo O'Higgins đã được gửi đến London để hoàn tất việc học của mình. Tại đó cậu học lịch sử và nghệ thuật, O'Higgins đã làm quen với các ý tưởng độc lập của Mỹ và phát triển tinh thần tự hào dân tộc, trở nên ngưỡng mộ chủ nghĩa tự do theo mô hình Anh Georgia. Ông cũng đã gặp Francisco de Miranda, một người người lý tưởng và người tin tưởng vào độc lập Venezuela, và tham gia một Masonic Lodge được thành lập bởi Miranda, nhằm đạt được sự độc lập của châu Mỹ La tinh.",
    ] },
  { "title" = "Tham khảo", "paragraphs" = [
      "\"O'Higgins, Bernardo.\" Encyclopædia Britannica. 2008. Encyclopædia Britannica Online. 13 Oct 2008 .",
      "\"Ambrose Bernard O'Higgins\". Catholic Encyclopedia. New York: Robert Appleton Company. 1913.",
      "Aldunate, Miguel Luis Amunátegui, La dictadura de O'Higgins Lưu trữ ngày 21 tháng 5 năm 2006 tại Wayback Machine Santiago: Imprenta, Litografía i Encuadernación Barcelona. 1914.",
    ] },
]

[articles.id]
text = "Bernardo O'Higgins Riquelme (20 Agustus 1778 – 24 Oktober 1842), pemimpin kemerdekaan Amerika Selatan, adalah salah satu panglima – bersama-sama dengan José de San Martín – angkatan bersenjata yang membebaskan Chili dari pemerintahan Spanyol dalam Perang Kemerdekaan Chili. Meskipun ia adalah Pemimpin Tertinggi ke-3 Chili (1817–23), O'Higgins adalah orang pertama yang menjabat gelar ini dan memimpin negara Chili yang merdeka penuh."
title = "Bernardo O'Higgins"
lang = "id"
url = "https://id.wikipedia.org/wiki/Bernardo_O%27Higgins"
intro = [
  "Bernardo O'Higgins Riquelme (20 Agustus 1778 – 24 Oktober 1842), pemimpin kemerdekaan Amerika Selatan, adalah salah satu panglima – bersama-sama dengan José de San Martín – angkatan bersenjata yang membebaskan Chili dari pemerintahan Spanyol dalam Perang Kemerdekaan Chili. Meskipun ia adalah Pemimpin Tertinggi ke-3 Chili",
  "(1817–23), O'Higgins adalah orang pertama yang menjabat gelar ini dan memimpin negara Chili yang merdeka penuh.",
]
sections = [
  { "title" = "Awal kehidupan", "paragraphs" = [
      "O'Higgins dilahirkan di Chillán, Chili. Seperti tertulis dalam surat baptisannya, ia adalah anak tidak sah dari Ambrosio O'Higgins, Marquis dari Osorno, seorang perwira Spanyol dari Kabupaten Sligo di Irlandia, yang menjadi gubernur Chili dan belakangan raja muda Peru. Ibunya adalah Isabel Riquelme, seorang perempuan bangsawan Chillán terkemuka. O'Higgins melewati masa kecilnya bersama keluarga ibunya di Chili tengah-selatan. Hubungannya dengan ayahnya jauh. Ambrosio mendukung pembiayaan hidupnya dan yang prihatin akan pendidikannya, tetapi keduanya tak pernah bertemu muka secara langsung. Para pejabat pemerintah Spanyol di Amerika dilarang menikah dengan orang-orang setempat.",
      "Ketika Ambrosio O'Higgins menjadi Raja Muda Peru, Bernardo yang muda dikirim ke London untuk menyelesaikan pendidikannya. Di sana Bernardo berkenalan dengan gagasan-gagasan kaum pendukung kemerdekaan Amerika. Ia mengenal Francisco de Miranda dari Venezuela dan bergabung dengan Logia Lautaro Masonik.",
    ] },
  { "title" = "Peranan dalam kemerdekaan dan pemerintahan Chili", "paragraphs" = [
      "Pada 1810, ia bergabung dengan para pemberontak nasionalis yang berjuang untuk kemerdekaan dari Spanyol. Pada 1814, para pemberontak Chili-nya dikalahkan oleh tentara Spanyol dan mengundurkan diri ke Pegunungan Andes. Pada 1817, O'Higgins kembali melakukan serangan dengan bantuan Jenderal Argentina José de San Martín. Pada 12 Februari 1817, ia memimpin sebuah serangan kavaleri yang memenangi Pertempuran Chacabuco. Ia menjadi pemimpin Chili merdeka yang pertama, dan diberikan kekuasaan diktatorial sebagai Pemimpin Tertinggi pada 16 Februari 1817. Pada 12 Februari 1818, Chili dinyatakan menjadi republik yang merdeka.",
      "Pada pemerintahannya selama enam tahun didirikanlah Akademi Militer. Selain itu, bendera Chili yang baru (dan berlaku sekarang) disetujui. Namun upaya-upaya pembaruannya yang lebih radikal dan liberal, seperti misalnya pembentukan demokrasi dan penghapusan gelar-gelar kebangsawanan ditentang oleh para pemilik tanah yang luas yang konservatif dan kuat. Pada masa pemerintahannya ia mendirikan kota La Unión dan Vicuña. Dari tempat pengasingannya di kemudian hari di Peru, ia mempromosikan ekspansi Chili ke selatan, termasuk pendirian Punta Arenas pada 1845. Selain itu, pemerintahannya terlibat - kemungkinan karena tekanan dari Loji Lautaro - dalam pembunuhan para pemimpin kemerdekaan lawannya, José Miguel Carrera, saudara-saudaranya Juan José dan Luis di Argentina, dan sahabat Carrera bersaudara dan pemimpin gerilya Manuel Rodríguez. Ia digulingkan oleh sebuah kudeta kelompok konservatif pada 28 Januari 1823.",
      "Selama pemerintahannya, ia juga membantu José de San Martín mengorganisir ekspedisis serta Angkatan Darat dan Angkatan Laut untuk mendukung kemerdekaan Peru. Ia juga mengorganisir Angkatan Darat Chili serta Angkatan Laut Chili pertama, di bawah komando Lord Cochrane dan Manuel Blanco Encalada.",
