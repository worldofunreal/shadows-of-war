[articles.en]
text = "Alexander III of Macedon, most commonly known as Alexander the Great, was king of the ancient Greek kingdom of Macedon from 336 BC until his death. He was the son of Philip II, born to him by his fourth wife, Olympias, and ascended to the throne at the age of 20 after Philip was assassinated."
title = "Alexander the Great"
lang = "en"
url = "https://en.wikipedia.org/wiki/Alexander_the_Great"
intro = [
  "Alexander III of Macedon (Ancient Greek: Ἀλέξανδρος, romanized: Aléxandros; 20/21 July 356 BC – 10/11 June 323 BC), most commonly known as Alexander the Great, was king of the ancient Greek kingdom of Macedon from 336 BC until his death. He was the son of Philip II, born to him by his fourth wife, Olympias, and ascended to the throne at the age of 20 after Philip was assassinated. Alexander spent most of his reign conducting a lengthy military campaign throughout Asia and Egypt, and by the age of 30, he had created one of the largest empires in history, stretching from Greece to northwestern India. He was undefeated in battle and is widely considered to be one of history's greatest and most successful military commanders.",
  "Born in Pella, Macedon, Alexander was tutored by the philosopher and polymath Aristotle until the age of 16. In 335 BC, shortly after assuming the throne of Macedon, he launched a campaign in the Balkans and reasserted control over Thrace and parts of Illyria before marching on the city of Thebes, which was subsequently destroyed. Alexander then assumed leadership of the League of Corinth, created by his father.",
  "With this authority over all Greeks he launched a pan-Hellenic invasion of the Achaemenid Persian Empire in 334 BC, and with it began a series of campaigns which lasted for ten years. Following his conquest of Asia Minor and a series of decisive battles, particularly at Issus and Gaugamela, the power of the Achaemenid Empire was broken. He subsequently overthrew Darius III and conquered the Achaemenid Empire in its entirety. After the fall of Persia, the Macedonian Empire held a vast swath of territory between the Adriatic Sea and the Indus River. Alexander endeavored to reach the \"ends of the world and the Great Outer Sea\" and invaded India in 326 BC, achieving an important victory over Porus, an ancient Indian king of present-day Punjab, at the Battle of the Hydaspes. Facing mutiny from his troops, he was eventually forced to turn back at the Beas River, and later died in 323 BC in Babylon, Mesopotamia, the city which he had planned to make the capital of his empire, while on his return to Greece. Alexander's death put an end to his planned invasion of Arabia.",
  "In the years following his death, a series of civil wars broke out across the Macedonian Empire, eventually leading to its disintegration at the hands of the Diadochi. Alexander's death marks the conventional beginning of the Hellenistic period. Through his conquests, he built a legacy that includes the cultural diffusion and syncretism, which gave rise to Greco-Buddhism and Hellenistic Judaism. He founded more than twenty cities, with the most prominent being the city of Alexandria in Egypt. Alexander's establishment of Greek colonies and the spreading of Greek culture led to Hellenistic civilization becoming a major force in the ancient world, influencing regions as far east as the Indian subcontinent. The Hellenistic period developed through the Roman Empire into modern Western culture; the Greek language became the lingua franca of the region and was the predominant language of the Byzantine Empire until its collapse in 1453 AD.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Alexander III was born in Pella, the capital of the Kingdom of Macedon, on the sixth day of the ancient Greek month of Hekatombaion, which probably corresponds to 20 July 356 BC (although the exact date is uncertain). He was the son of the king of Macedon, Philip II of the Argead dynasty, and his fourth wife, Olympias, daughter of King Neoptolemus I of Epirus. Although Philip had seven or eight wives, Olympias was his principal wife for some time, likely because she gave birth to Alexander.",
      "Several legends surround Alexander's birth and childhood. According to the ancient Greek biographer Plutarch, on the eve of the consummation of her marriage to Philip, Olympias dreamed that her womb was struck by a thunderbolt that caused a flame to spread \"far and wide\" before dying away. Sometime after the wedding, Philip is said to have seen himself, in a dream, securing his wife's womb with a seal engraved with a lion's image. Plutarch offered a variety of interpretations for these dreams: that Olympias was pregnant before her marriage, indicated by the sealing of her womb; or that Alexander's father was Zeus. Ancient commentators were divided about whether the ambitious Olympias promulgated the story of Alexander's divine parentage, variously claiming that she had told Alexander, or that she dismissed the suggestion as impious. Despite this, Alexander could claim, by way of his father Phillip II, descendance from Temenus, a descendant of Heracles (thereby also making him a very distant relation to the hero Perseus), and descendance by way of his mother's family, the Aeacidae, to Neoptolemus, son of the warrior Achilles.",
      "On the day Alexander was born, Philip was preparing a siege on the city of Potidea on the peninsula of Chalcidice. That same day, Philip received news that his general Parmenion had defeated the combined Illyrian and Paeonian armies and that his horses had won at the Olympic Games. It was also said that on this day, the Temple of Artemis in Ephesus, one of the Seven Wonders of the World, burnt down, with Hegesias of Magnesia claiming that it had burnt down because Artemis was away, attending the birth of Alexander. Such legends may have emerged when Alexander was king, and possibly at his instigation, to show that he was superhuman and destined for greatness from conception.",
    ] },
  { "title" = "Heir of Philip II", "paragraphs" = [
      "At the age of 16, Alexander's education under Aristotle ended. Philip II had waged war against the Thracians to the north, which left Alexander in charge as regent and heir apparent. During Philip's absence, the Thracian tribe of Maedi revolted against Macedonia. Alexander responded quickly and drove them from their territory. The territory was colonized, and a city, named Alexandropolis, was founded.",
      "Upon Philip's return, Alexander was dispatched with a small force to subdue the revolts in southern Thrace. Campaigning against the Greek city of Perinthus, Alexander reportedly saved his father's life. Meanwhile, the city of Amphissa began to work lands that were sacred to Apollo near Delphi, a sacrilege that gave Philip the opportunity to further intervene in Greek affairs. While Philip was occupied in Thrace, Alexander was ordered to muster an army for a campaign in southern Greece. Concerned that other Greek states might intervene, Alexander made it look as though he was preparing to attack Illyria instead. During this turmoil, the Illyrians invaded Macedonia, only to be repelled by Alexander.",
      "Philip and his army joined his son in 338 BC, and they marched south through Thermopylae, taking it after stubborn resistance from its Theban garrison. They went on to occupy the city of Elatea, only a few days' march from both Athens and Thebes. The Athenians, led by Demosthenes, voted to seek alliance with Thebes against Macedonia. Both Athens and Philip sent embassies to win Thebes's favour, but Athens won the contest. Philip marched on Amphissa (ostensibly acting on the request of the Amphictyonic League), capturing the mercenaries sent there by Demosthenes and accepting the city's surrender. Philip then returned to Elatea, sending a final offer of peace to Athens and Thebes, who both rejected it.",
    ] },
  { "title" = "King of Macedon", "paragraphs" = [
      "In the 24th day of the Macedonian month Dios, which probably corresponds to 25 October 336 BC, while at Aigai (near modern Vergina) attending the wedding of his daughter Cleopatra to Olympias's brother, Alexander I of Epirus, Philip was assassinated by the captain of his bodyguards, Pausanias, who, according to Diodorus, was also his lover. As Pausanias tried to escape, he tripped over a vine and was killed by his pursuers, including two of Alexander's companions, Perdiccas and Leonnatus. Alexander was proclaimed king on the spot by the nobles and army at the age of 20.",
      "Alexander began his reign by eliminating potential rivals to the throne. He had his cousin, the former Amyntas IV, executed and two Macedonian princes from the region of Lyncestis killed for having been involved in his father's assassination, but spared a third, Alexander Lyncestes. Olympias had Cleopatra Eurydice, and Europa, her daughter by Philip, burned alive, though this infuriated Alexander. Alexander also ordered the murder of Cleopatra's uncle Attalus, who was in command of the advance guard of the army in Asia Minor. Attalus was at that time corresponding with Demosthenes regarding the possibility of defecting to Athens, and had severely insulted Alexander. After his niece's murder, Alexander may have considered him too dangerous to be left alive. Alexander spared Arrhidaeus, who was by all accounts mentally disabled, possibly as a result of poisoning by Olympias.",
      "News of Philip's death roused many states into revolt, including Thebes, Athens, Thessaly, and the Thracian tribes north of Macedon. When news of the revolts reached Alexander, he responded quickly. Though advised to use diplomacy, Alexander mustered 3,000 Macedonian cavalry and rode south towards Thessaly. He found the Thessalian army occupying the pass between Mount Olympus and Mount Ossa, and ordered his men to ride over Mount Ossa. When the Thessalians awoke the next day, they found Alexander in their rear and promptly surrendered, adding their cavalry to Alexander's force. He then continued south towards the Peloponnese.",
    ] },
  { "title" = "Conquest of the Persian Empire", "paragraphs" = [
      "Alexander's invasion of Persia as a whole has been denoted as a supreme example of a \"strategic line\" of conducting war, a line formed by \"the chain of logic that connects operations into a single whole.\" In his book Strategy, Soviet military officer and theorist Alexander Svechin delineates Alexander's strategic steps. After securing his Greek base and the Balkans by subjugating his political opponents, and securing his army's rear through the conquest of all the Afro-Asian coastline, where the Persian fleet was based and from which it was supplied, Alexander moved to confront directly the Persians. He thus resolved the eternal problem of an army conducting operations deep into enemy territory, Svechin states, in an \"exemplary manner.\"",
      "After his victory at the Battle of Chaeronea, Philip II began the work of establishing himself as hēgemṓn (Greek: ἡγεμών) of a league which according to Diodorus was to wage a campaign against the Persians for the sundry grievances Greece suffered in 480 BC and free the Greek cities of the western coast and islands from Achaemenid rule. In 336 he sent Parmenion, Amyntas, Andromenes, Attalus, and an army of 10,000 men into Anatolia to make preparations for an invasion. The Greek cities on the western coast of Anatolia revolted until the news arrived that Philip had been murdered and had been succeeded by his young son Alexander. The Macedonians were demoralized by Philip's death and were subsequently defeated near Magnesia by the Achaemenids under the command of the mercenary Memnon of Rhodes.",
      "Taking over the invasion project of Philip II, Alexander's army crossed the Hellespont in 334 BC with approximately 48,100 soldiers, 6,100 cavalry, and 120 ships with crews numbering 38,000 drawn from Macedon and various Greek city states, mercenaries, and feudally raised soldiers from Thrace, Paionia, and Illyria. He showed his intent to conquer the entirety of the Persian Empire by throwing a spear into Asian soil and saying he accepted Asia as a gift from the gods. This also showed Alexander's eagerness to fight, in contrast to his father's preference for diplomacy.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "Alexander's legacy extended beyond his military conquests, and his reign marked a turning point in European and Asian history. His campaigns greatly increased contacts and trade between East and West, and vast areas to the east were significantly exposed to Greek civilization and influence. Some of the cities he founded became major cultural centers, many surviving into the 21st century. His chroniclers recorded valuable information about the areas through which he marched, while the Greeks themselves got a sense of belonging to a world beyond the Mediterranean.",
      "Alexander's most immediate legacy was the introduction of Macedonian rule to huge new swathes of Asia. At the time of his death, Alexander's empire covered some 5,200,000 km2 (2,000,000 sq mi), and was the largest state of its time. Many of these areas remained in Macedonian hands or under Greek influence for the next 200–300 years. The successor states that emerged were, at least initially, dominant forces, and these 300 years are often referred to as the Hellenistic period.",
      "The eastern borders of Alexander's empire began to collapse even during his lifetime. However, the power vacuum he left in the northwest of the Indian subcontinent directly gave rise to one of the most powerful Indian dynasties in history, the Maurya Empire. Taking advantage of this power vacuum, Chandragupta Maurya (referred to in Greek sources as \"Sandrokottos\"), of relatively humble origin, took control of the Punjab, and with that power base proceeded to conquer the Nanda Empire.",
    ] },
]

[articles.es]
text = "Alejandro III de Macedonia (en griego antiguo: Ἀλέξανδρος, romanizado: Aléxandros; Pela, 20/23 de julio o 6/10 de octubre de 356 a. C.​ - Babilonia, 10/13 de junio de 323 a."
title = "Alejandro Magno"
lang = "es"
url = "https://es.wikipedia.org/wiki/Alejandro_Magno"
intro = [
  "Alejandro III de Macedonia (en griego antiguo: Ἀλέξανδρος, romanizado: Aléxandros; Pela, 20/23 de julio o 6/10 de octubre de 356 a. C.​ - Babilonia, 10/13 de junio de 323 a. C.), conocido como Alejandro el Grande o Alejandro Magno, fue un soberano del antiguo reino griego de Macedonia.",
  "Tras suceder en el trono a su padre, Filipo II, en el año 336 a. C. a la edad de veinte años, consagró la mayor parte de su reinado a una prolongada campaña militar que se extendió por Asia y el antiguo Egipto. Con treinta años de edad había consolidado uno de los imperios más extensos de la Antigüedad, cuyos dominios abarcaban desde el mar Jónico hasta el noroeste de la India. Invicto en el campo de batalla, la historiografía lo considera de forma unánime como uno de los comandantes militares más brillantes y exitosos de todos los tiempos.",
  "Nacido en la ciudad de Pela, Alejandro recibió enseñanzas del filósofo Aristóteles hasta los dieciséis años. En 335 a. C., poco después de heredar la corona macedonia, encabezó una campaña en los Balcanes con el fin de reafirmar su autoridad sobre Tracia y diversas regiones de Iliria, para marchar posteriormente contra la ciudad griega de Tebas, cuya resistencia fue castigada con la destrucción total de la urbe. Alejandro asumió la hegemonía de la Liga de Corinto, la federación de estados griegos instituida originalmente por su padre.",
  "Investido con la autoridad sobre el conjunto de los griegos, emprendió en 334 a. C. una invasión panhelénica del Imperio aqueménida, lo que dio inicio a una serie de campañas que se prolongarían durante una década. Tras la conquista de Asia Menor y la obtención de victorias decisivas —especialmente en Issos y Gaugamela—, el poderío aqueménida quedó fracturado. Posteriormente, Alejandro derrocó a Darío III y completó la sumisión del Imperio persa en su totalidad. Tras esta caída, el Imperio macedonio dominó una vasta extensión territorial comprendida entre el mar Adriático y el río Indo. En su empeño por alcanzar los «confines del mundo y el Gran Mar Exterior», invadió la India en 326 a. C. y obtuvo un triunfo sobre Poros, soberano del actual Punyab, en la batalla del Hidaspes. No obstante, ante el motín de sus tropas, se vio finalmente obligado a desistir de su campaña en la India y a emprender el regreso desde el río Beas. Falleció en 323 a. C. en la ciudad mesopotámica de Babilonia —la cual proyectaba convertir en la capital de su imperio—, mientras se hallaba en su ruta de retorno hacia Grecia. El deceso de Alejandro truncó definitivamente sus planes para la invasión de la península arábiga.",
]
sections = [
  { "title" = "Biografía", "paragraphs" = [
      "Alejandro pertenecía a la dinastía de los Argéadas, el linaje que rigió los destinos de Macedonia desde sus orígenes históricos. Los autores de la Antigüedad vinculaban esta estirpe con los heráclidas; el mito relata que el teménida Carano —hermano menor del rey Fidón de Argos y descendiente de undécima generación de Heracles— o,​ de acuerdo con otras versiones, su sucesor Pérdicas,​ emigró desde el Peloponeso hacia el norte durante el siglo VII a. C. con el fin de fundar su propio reino. Fue Argeo, hijo de Pérdicas, quien otorgó su nombre a la casa real, de la cual Alejandro III sería un descendiente lejano.​",
      "Hasta el siglo IV a. C., Macedonia se configuraba como un reino exiguo y vulnerable, asediado por las persistentes incursiones de tracios e ilirios desde el norte y por la presión expansionista helena desde el sur. Pese a que los macedonios parecen haber empleado un dialecto del griego, los helenos los calificaban de bárbaros.​ Amintas III, abuelo de Alejandro y miembro de una rama colateral de la dinastía que accedió al trono tras el asesinato de su predecesor, preservó su posición únicamente mediante una hábil diplomacia entre los diversos estados de la Hélade. Su hijo, Filipo II, transformó la realidad del reino al incrementar sustancialmente los ingresos del Estado, instituir un ejército formidable y someter a los príncipes de la Alta Macedonia. Tras derrotar a sus vecinos septentrionales, inició la conquista sistemática de las polis griegas. La esposa de Filipo y madre de Alejandro fue la princesa epirota Olimpia, hija del rey Neoptólemo I, perteneciente a la dinastía de los eácidas, quienes trazaban su linaje hasta Aquiles.​​ En consecuencia, Alejandro era tenido, tanto por línea materna como paterna, por descendiente de divinidades y de los más insignes héroes de la Antigüedad, convicción que ejerció una influencia determinante en la forja de su personalidad.​",
      "Filipo II contrajo nupcias en siete ocasiones y convivió con todas sus consortes de manera simultánea.​ La única hermana de vínculo pleno de Alejandro fue Cleopatra; no obstante, el joven contaba con otros hermanos por línea paterna: Arrideo, vástago de Filina de Larisa, así como sus hermanas Tesalónica, hija de Nicesípolis de Feras; Cinane, hija de la princesa iliria Audata; y Europa, hija de Cleopatra. Pese a que Arrideo aventajaba a Alejandro en un año de edad,​ padecía una discapacidad intelectual que posicionaba a Alejandro como el único heredero legítimo para la sucesión de su padre.​",
    ] },
  { "title" = "Tras su muerte", "paragraphs" = [
      "Alejandro falleció sin haber dejado instrucciones sobre su sucesión, aunque la leyenda afirma que antes de expirar entregó su anillo sigilar a Pérdicas, quien debía actuar como regente de la reina Roxana y de su futuro vástago. Un mes después del deceso real, Roxana dio a luz a un varón que fue bautizado como Alejandro IV en honor a su padre, si bien la autoridad suprema del regente no tardó en ser cuestionada por otros comandantes —los diádocos—, quienes ambicionaban gobernar sus propias satrapías de forma independiente. Esta tensión desembocó en el año 321 a. C. en un conflicto abierto donde Pérdicas perdió la vida, lo cual dio inicio a las guerras de los Diádocos. Dichas contiendas se prolongaron de manera casi ininterrumpida hasta el 281 a. C., año en el que fallecieron los últimos generales de Alejandro y tras el cual sus descendientes se establecieron como soberanos en los diversos reinos surgidos de las cenizas de aquel imperio colosal.​",
      "Todos los Argéadas cayeron víctimas de la encarnizada lucha por el poder, empezando por Arrideo, hermano de Alejandro, quien ejerció brevemente como rey títere bajo el nombre de Filipo III hasta que fue ejecutado en 317 a. C. por orden de Olimpia. En aquel mismo episodio pereció su esposa Eurídice, sobrina carnal del propio Arrideo y de Alejandro, mientras que la misma Olimpia murió un año después a manos de Casandro, hijo de Antípatro. Por su parte, Cleopatra, hermana de Alejandro, falleció en 308 a. C. en un suceso del que se responsabilizó al diádoco Antígono. El trágico final de la estirpe se consumó en el año 309 a. C., cuando Casandro ordenó el asesinato de Roxana y de Alejandro IV al mismo tiempo que el diádoco Poliperconte acababa con la vida de Heracles, el hijo que Alejandro había tenido con su concubina Barsine, episodios sangrientos que marcaron el fin definitivo de la dinastía Argéada.​​",
      "El diádoco Ptolomeo se apoderó del cuerpo embalsamado de Alejandro y, en el año 322 a. C., lo trasladó a Menfis, donde la momia probablemente permaneció custodiada en el templo del Serapeum hasta su posterior traslado a Alejandría, posiblemente por iniciativa de Ptolomeo Filadelfo.​ Siglos más tarde, en el año 30 a. C., el primer emperador romano, Octavio, visitó el sepulcro y, al tocar los restos, le rompió accidentalmente la nariz en un movimiento torpe.​ La última mención histórica de la momia de Alejandro data del año 215, vinculada a la visita del emperador Caracalla a Alejandría; este, como muestra de sumo respeto, depositó su túnica y su anillo sobre el sarcófago antes de que el rastro de la tumba se perdiera definitivamente para la historia.​",
    ] },
  { "title" = "Identidad", "paragraphs" = [
      "Las fuentes historiográficas ofrecen con frecuencia relatos divergentes sobre la apariencia de Alejandro, siendo los testimonios más tempranos los más parcos en detalles;​ Arriano, por ejemplo, se limita a describirlo como un hombre de gran apostura.​ Durante su reinado, el monarca supervisó con celo su imagen pública al confiar su representación a los artistas más insignes de la época. Este patrocinio incluyó el encargo de esculturas a Lisipo, pinturas a Apeles y grabados en gemas a Pirgoteles.​ Los autores clásicos consignaron que Alejandro, complacido con los retratos de Lisipo, prohibió a otros escultores modelar su efigie; no obstante, la academia contemporánea acoge esta afirmación con escepticismo.​​ Andrew Stewart subraya que los retratos artísticos —especialmente debido a la naturaleza de su patronazgo— poseen intrínsecamente un carácter partidista. Según este autor, las representaciones del soberano «buscan legitimarlo a él (o, por extensión, a sus sucesores), interpretarlo ante su público, responder a las críticas y persuadir de su grandeza»; por consiguiente, tales obras deben analizarse bajo un prisma de «elogio y censura», de forma análoga a fuentes literarias como la poesía laudatoria.​ Con todo, prevalece la consideración de que la estatuaria de Lisipo, aun dentro de su idealización, constituyó la plasmación plástica más fidedigna del monarca.​",
      "Quinto Curcio Rufo, historiador romano del siglo I d. C. y autor de las Historias de Alejandro Magno, ofrece el siguiente relato sobre el momento en que el monarca se sentó en el trono de Darío III:",
      "Tanto Curcio como Diodoro recogen una anécdota según la cual, cuando Sisigambis, la madre de Darío III, conoció a Alejandro y a Hefestión, supuso que este último era el rey debido a que era el más alto y de presencia física más imponente de los dos.​​",
    ] },
  { "title" = "Legado cultural e intelectual", "paragraphs" = [
      "La figura de Alejandro ocupa un lugar único en la cultura universal, pues, según los investigadores, ningún otro personaje histórico ha sido objeto de una atención tan intensa por parte de las artes y las ciencias, ni protagonista de interpretaciones tan numerosas y diversas. A lo largo de un vasto territorio que abarcaba toda Europa y gran parte de Asia y África, el monarca sirvió como modelo a seguir para multitud de gobernantes y militares, desde sus propios diádocos hasta figuras como Adolf Hitler. Este impacto perdura de tal forma que, incluso en la actualidad, los líderes de muchas tribus afganas trazan su linaje hasta él, mientras que dos estados, Grecia y Macedonia del Norte, mantienen una disputa histórica sobre quién es el verdadero heredero del legado de Alejandro.​",
      "El nombre de Alejandro se convirtió en un instrumento fundamental de propaganda política tras su muerte, utilizado por los diádocos para legitimar su autoridad. Pérdicas, por ejemplo, justificó su regencia basándose en que el rey le había entregado personalmente su anillo sigilar, mientras que Éumenes de Cardia, buscando mantener la unidad del imperio, aseguró que Alejandro se le aparecía en sueños para prometerle su presencia invisible en los consejos de guerra.​ La veneración de su figura también se tradujo en gestos monumentales y religiosos: Peucestas, sátrapa de Persia, dedicó un altar a Alejandro y a Filipo en Persépolis,​ mientras que en Egipto, Ptolomeo instituyó un culto formal en Alejandría para situar su propia autoridad bajo la protección divina del fallecido monarca. Finalmente, su imagen fue empleada como arma arrojadiza en las luchas sucesorias. Al iniciar su guerra en 317 a. C. contra Arrideo y Casandro, Olimpia acusó a este último de haber organizado el envenenamiento de su hijo a través de su hermano Yolas; esta versión fue posteriormente difundida por el diádoco Antígono con claros fines estratégicos para socavar a sus rivales.​",
      "Plutarco refiere que los primeros monarcas helenísticos se esforzaron por demostrar su afinidad con Alejandro a través de las vestiduras de púrpura, el séquito, la inclinación del cuello y el tono arrogante. Sin embargo, solo Pirro, sobrino segundo del soberano macedonio, probó dicha semejanza con las armas en la mano; de él se decía que recordaba a Alejandro tanto por su apariencia física como por la rapidez de sus movimientos, hasta el punto de que, al ver su fuerza e ímpetu en el combate, todos creían hallarse ante la sombra o la viva imagen del conquistador.​ De igual modo, la comparación alcanzó al seléucida Antíoco III, quien obtuvo el sobrenombre de «el Grande» tras emprender una expedición hacia Oriente similar a la de su predecesor. Otros monarcas, como Filipo V y Perseo de Macedonia, o incluso el llamado Pseudo-Alejandro —líder de una sublevación antirromana en 142 a. C.—, justificaron sus pretensiones políticas basándose en un supuesto parentesco con él. Por su parte, el rey del Ponto, Mitrídates VI Eupátor, llevó esta emulación al terreno de la imagen y los objetos personales: mandó acuñar monedas donde su retrato seguía fielmente la iconografía de Alejandro y custodiaba con celo una túnica que había pertenecido al propio conquistador macedonio.​",
    ] },
]

[articles.fr]
text = "Alexandre le Grand (en grec ancien : Ἀλέξανδρος ὁ Μέγας / Aléxandros ho Mégas ou Μέγας Ἀλέξανδρος / Mégas Aléxandros) ou Alexandre III, né le 21 juillet 356 av. J.-C."
title = "Alexandre le Grand"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Alexandre_le_Grand"
intro = [
  "Alexandre le Grand (en grec ancien : Ἀλέξανδρος ὁ Μέγας / Aléxandros ho Mégas ou Μέγας Ἀλέξανδρος / Mégas Aléxandros) ou Alexandre III, né le 21 juillet 356 av. J.-C. à Pella et mort le 11 juin 323 av. J.-C. à Babylone, est un roi de Macédoine et l'un des personnages les plus célèbres de l'Antiquité. Fils de Philippe II, élève d'Aristote et roi de Macédoine à partir de 336, il devient l'un des plus grands conquérants de l'histoire en prenant possession de l'immense Empire perse et en s'avançant jusqu'aux rives de l'Indus.",
  "Après l'assassinat de Philippe, Alexandre hérite d'un royaume puissant et d'une armée expérimentée. Reprenant le projet panhellénique de son père, il réunit la Macédoine et des cités grecques dans une coalition afin d'envahir l'Empire perse. En 334, il débarque en Asie, démarrant une campagne qui dure dix ans. Il remporte une première victoire contre les satrapes perses au Granique qui lui offre l'Anatolie. Puis en 333, il défait le roi Darius III à Issos. Il entreprend la conquête de la Phénicie et marche jusqu'en Égypte, où il est proclamé pharaon. La victoire à Gaugamèles en 331 lui offre la totalité de l'empire perse. Il mène ensuite une campagne contre les généraux perses insoumis et s'avance jusqu'au pays des Scythes. Il dirige enfin une dernière campagne au Pendjab et dans la vallée de l'Indus (Pakistan actuel), durant laquelle il remporte la bataille de l'Hydaspe ; mais en 326 ses soldats refusent d'avancer plus loin. Il meurt en 323 à Babylone, probablement de maladie, à l'âge de 32 ans, avant d'avoir pu mener à bien ses projets de conquête de l'Arabie.",
  "Roi-bâtisseur, Alexandre a fondé une vingtaine de cités, la plus importante et la plus connue étant Alexandrie d'Égypte, et a implanté des colonies jusqu'aux confins de l'Asie, étendant notablement l'influence de l'hellénisme. Il se place dans la continuité des souverains achéménides et cherche à assimiler les élites asiatiques avec pour objectif d'assurer la pérennité de l'empire qu'il a créé, comme en témoigne notamment son mariage avec une princesse bactrienne, Roxane. Son empire est partagé à sa mort entre ses principaux généraux, les Diadoques, qui forment à la fin du IVe siècle av. J.-C. les différents royaumes de l'époque hellénistique.",
  "La postérité d'Alexandre à travers l'histoire, les cultures et les religions s'explique par l'ampleur de ses victoires militaires, par sa volonté de conquête de l'ensemble du monde connu et par sa personnalité empreinte de philosophie mais aussi de démesure. Son épopée suscite dès l'Antiquité de nombreuses publications littéraires. Néanmoins les écrits des historiens contemporains des événements ont tous disparu ; seuls subsistent de nos jours leurs abréviateurs, dont certains sont à l'origine des légendes le concernant. Parmi ses récits légendaires, le Roman d'Alexandre occupe une place à part ; issu des écrits du Pseudo-Callisthène, il mêle l'histoire et le fantastique pour devenir l'un des ouvrages non religieux les plus lus au Moyen Âge, en Occident comme en Orient.",
]
sections = [
  { "title" = "Jeunesse et éducation", "paragraphs" = [
      "Alexandre est né à Pella, la capitale du royaume de Macédoine, le 20 ou le 21 juillet 356 av. J.-C.. Il est le fils aîné du roi de Macédoine Philippe II, de la dynastie des Argéades, et d'Olympias, sa troisième épouse, princesse éacide d’Épire de la tribu des Molosses. Il a pour sœur Cléopâtre née en 355. Par son père, il prétend descendre de Téménos d'Argos, lui-même supposément descendant d'Héraclès, fils de Zeus. Par sa mère, il affirme descendre de Néoptolème, fils d’Achille.",
      "Une légende, connue dès l'Antiquité, dit qu'Olympias n'aurait pas conçu Alexandre avec Philippe, qui a peur d'elle et de son habitude de dormir en compagnie de serpents, mais avec Zeus. Alexandre se sert de ces contes populaires à des fins politiques, faisant parfois référence au dieu plutôt qu'à Philippe quand il évoque son père. Une autre légende datant du IIIe siècle apr. J.-C., d'origine alexandrine et attribuée au Pseudo-Callisthène, veut qu'Alexandre soit le fils du dernier pharaon d’Égypte de la XXXe dynastie, Nectanébo II, chassé du pouvoir par Artaxerxès III et réfugié à la cour de Philippe.",
      "Selon une affirmation rapportée entre autres par Plutarque, Alexandre serait né la nuit même où Érostrate a incendié le temple d'Artémis à Éphèse, l'une des sept merveilles du monde antique. Alexandre utilisera plus tard cette coïncidence pour renforcer son aura politique en proposant de financer la restauration du temple, qui est cependant refusée par les Éphésiens. Plutarque indique également que Philippe et Olympias ont rêvé de la future naissance de leur fils. Après avoir consulté Aristandre de Telmessos, celui-ci détermine qu'Olympias est enceinte et que l’enfant aura le caractère d’un lion.",
    ] },
  { "title" = "Règne", "paragraphs" = [
      "Sous le règne de Philippe II, le royaume de Macédoine a triplé sa surface et étendu son hégémonie sur la Grèce. Après avoir soumis les peuples voisins (Illyriens, Péoniens et Thraces), Philippe défait les Phocidiens en 352 av. J.-C. durant la troisième guerre sacrée puis soumet la Ligue chalcidienne. Surtout, il triomphe d'une coalition réunissant Athènes et Thèbes à la bataille de Chéronée en 338. Alexandre y fait ses preuves en commandant la cavalerie de l'aile gauche et en taillant en pièces le bataillon sacré des Thébains contre lequel il se jette en premier selon une tradition historique. Il est chargé, en compagnie d'Antipater, de ramener à Athènes les cendres des soldats tués à la bataille. Après cette retentissante victoire, Philippe fonde la ligue de Corinthe qui rassemble sous son commandement toutes les cités grecques, à l'exception de Sparte. La ligue a un double objectif : assurer l'hégémonie de la Macédoine en Grèce et porter la guerre contre l'Empire perse.",
      "En 340, Alexandre, âgé de 16 ans et élève d'Aristote, est appelé par Philippe à la cour de Pella afin d'apprendre le fonctionnement de l'État. C'est à cette époque qu'il aurait dompté Bucéphale. Puis, son père étant parti assiéger Périnthe et Byzance, il se voit confier la régence de Macédoine, même s'il est entouré de conseillers expérimentés tel Antipater. En 339, il reçoit son premier commandement militaire lors d'une campagne contre des tribus thraces dans la région du Strymon, avec pour objectif d'assurer le contrôle des frontières de la Macédoine. Cette campagne victorieuse, qui s'apparente davantage à un raid, aboutit à l'installation d'une garnison dans une ville appelée Alexandropolis dans le massif de la Rila, en actuelle Bulgarie. Il profite de cette expédition pour entrer en contact avec une tribu péonienne qui lui fournit des peltastes d'élite, les Agrianes.",
      "En 339, intervient une intrigue concernant Pixodaros, satrape de Carie. Celui-ci tente en effet de marier sa fille à Arrhidée, le deuxième fils de Philippe ; mais son projet est contrecarré par Alexandre et quelques-uns de ses amis proches, Ptolémée, Néarque, Harpale, Laomédon et Érigyios. En représailles, ces derniers sont condamnés à l'exil et n'en reviendront qu'après la mort de Philippe.",
    ] },
  { "title" = "Personnalité et vie privée", "paragraphs" = [
      "Le corps d'Alexandre, magnifié de son vivant par des artistes officiels à la grande réputation, dont le sculpteur Lysippe et le peintre Apelle, est un élément crucial de la propagande royale. Les sources antiques, dont Plutarque, disent qu'Alexandre est de grande taille, qu'il a une peau blanche et une chevelure léonine châtain clair aux reflets cuivrés. D'après la version latine du Roman d'Alexandre, Alexandre aurait eu les yeux vairons (bleu et marron). Mais sa beauté supposée répond à un idéal de l'époque : des monnaies frappées à Rhodes peu avant son règne montrent l'effigie d'Hélios avec des traits caractérisant plus tard le visage d'Alexandre.",
      "Par ailleurs, Alexandre a la tête toujours penchée du côté droit. Plutarque mentionne le phénomène, et plusieurs statues antiques, à la suite de Lysippe, montrent une inclinaison plus ou moins accentuée. Aucune coquetterie, signe d’élégance ou exagération de la part de Lysippe ; la cause en serait une pathologie d'après les médecins modernes qui ont étudié le buste conservé au musée du Louvre ainsi que les statuettes en ivoire retrouvées en 1977 à Vergina. Alexandre a la tête inclinée à droite et le cou en avant, avec un raccourcissement du muscle sterno-cléido-mastoïdien ; qui plus est, son œil droit est plus bas que le gauche. La source du problème pourrait être un torticolis musculaire, provoqué soit par un choc violent, soit par un trouble oculaire (strabisme vertical ou paralysie des muscles oculaires) d’origine héréditaire puisqu’on retrouve semble-t-il cette pathologie sur les statuettes de personnages apparentés à Alexandre.",
      "Les statues se multiplient sous son règne afin de magnifier son pouvoir et sa nature surhumaine. Les œuvres posthumes, datant du temps des Diadoques, comme le sarcophage de Sidon, glorifient le roi divinisé dans l'éclat de sa jeunesse.",
    ] },
  { "title" = "Œuvre d'Alexandre", "paragraphs" = [
      "Alexandre est souvent considéré comme le plus grand génie militaire de l'Antiquité, à la fois stratège hors pair et combattant téméraire. Pour autant, il ne faudrait pas oublier le mérite des soldats, officiers et techniciens qui l'ont accompagné en Asie, ni l'héritage de Philippe II. Ses grandes victoires contre les Perses (Granique, Issos, Gaugamèles) sont fondées sur des concepts stratégiques établis par son père, qui s'inspire lui-même en partie de l'ordre oblique d'Épaminondas, et qu'applique son second, l'expérimenté Parménion. Alexandre met en œuvre la tactique dite du « marteau et de l'enclume » tout en bénéficiant de facteurs favorables et de la faiblesse stratégique des Perses. Son génie militaire réside dans sa capacité à lancer la charge de cavalerie au moment opportun. C'est en Iran, après 330 av. J.-C., qu'Alexandre établit des tactiques novatrices dans sa lutte contre les derniers Perses insoumis et dans les steppes contre les cavaliers scythes. En Inde, il doit prendre en compte un nouvel adversaire, les éléphants de guerre. La bataille de l'Hydaspe se déroule selon une tactique nouvelle, Alexandre n'ayant d'ailleurs probablement pas participé directement aux combats, laissant ses généraux, dont Cratère et Perdiccas, exécuter ses ordres. Finalement, Alexandre n'a livré que quatre grandes batailles rangées, auxquelles on pourrait ajouter la bataille des Portes persiques ainsi que de nombreux sièges, dont ceux de Thèbes, Milet, Halicarnasse, Tyr et Aornos.",
      "Alexandre montre toute son inventivité dans la manœuvre avec des marches rapides, des déplacements en montagne, des campagnes d'hiver, des franchissements de fleuve. Il applique aussi des stratagèmes émis par les stratèges grecs, tels Xénophon et Iphicrate, rompus à l'art de la guerre rusée. Il paraît économe de la vie de ses hommes, préférant la manœuvre rapide au combat frontal. Il est aussi un grand manieur d'hommes. Ses harangues, même si les textes authentiques sont inconnus, sont pleines d'éloquence et de force de conviction. Il n'échoue à convaincre ses troupes qu'en Inde sur les rives de l'Hyphase en 326.",
      "Une analyse de l'œuvre d’Alexandre est complexe à réaliser car celle-ci reste inachevée. Il est d'abord le fondateur d'un empire multiethnique et multiculturel établi sur les bases de l'empire achéménide. Il conserve les cadres administratifs de l'empire perse, dont les satrapies, tout en cherchant à se concilier l'aristocratie perse, comme le montrent la rénovation du tombeau de Cyrus ou les noces de Suse. Chaque peuple conserve ses particularismes culturels ou religieux. Les populations continuent de parler leur langue, dont l'araméen et le babylonien, bien que le grec devienne la langue officielle de l'administration royale, comme elle le sera du temps des monarchies hellénistiques. Il établit par ailleurs, dans le plateau iranien et en Asie centrale, des foyers de peuplement grec, avec l’implantation de vétérans et de colons qui se développent surtout à l'époque séleucide. En principe, Alexandre est parvenu à unifier son empire car tous les territoires conquis dépendent de son autorité, mais derrière cette souveraineté totale se cache une grande diversité de statuts et de situations, comme dans l'administration satrapique ou des cités. C'est la conséquence directe de l’extraordinaire rapidité de la conquête.",
    ] },
  { "title" = "Postérité", "paragraphs" = [
      "Par son père, le roi de Macédoine Philippe II, de la dynastie des Argéades, Alexandre prétend descendre de Téménos d'Argos, supposément descendant d'Héraclès, fils de Zeus. Par sa mère, Olympias, de la dynastie des Éacides, Alexandre affirme descendre de Néoptolème, fils d'Achille. Une légende, connue dès le règne d'Alexandre, dit qu'Olympias ne l'aurait pas conçu avec Philippe mais avec Zeus.",
      "Alexandre est proclamé pharaon d'Égypte à Memphis en 331 av. J.-C. Il se rend ensuite dans l'oasis de Siwa où il rencontre l'oracle de Zeus Ammon qui le confirme comme descendant direct du dieu Amon. La question qui se pose pour les historiens modernes est de savoir si Alexandre a véritablement songé à promouvoir un « culte impérial ». Un examen des sources antiques, que ce soient des sculptures ou des monnaies, montre qu'il entend se faire honorer comme un héros à l'image d'Héraclès. Par ailleurs, après la mort d'Héphaistion survenue en 324, il envoie une ambassade à l'oracle d'Ammon-Zeus afin de savoir s'il doit honorer son favori d'un culte divin. L'oracle lui a répondu qu'il doit l'honorer comme un héros ; c'est ainsi qu'il demande à Cléomène de Naucratis, le gouverneur de l'Égypte, d'élever à Alexandrie des temples en son honneur. Le culte d'Héphaistion s'est rapidement répandu, y compris dans les cités grecques. À partir de 324, selon certains auteurs antiques, Alexandre aurait voulu être honoré en Grèce comme « Dieu Invaincu », conjointement à l'édit sur le retour des bannis dans les cités. Mais cette décision est tirée d'interprétations tardives. Certes, des cités d'Anatolie, tels Eresós à Lesbos, lui ont rendu des honneurs divins ; mais c'est déjà le cas avec Philippe. Arrien évoque des théores (ambassadeurs religieux) envoyés à Babylone auprès d'Alexandre, mais rien ne prouve en l'état actuel qu'Alexandre ait bien voulu instaurer un culte impérial, sachant par ailleurs que l'idée d'un roi-dieu est sacrilège aux yeux des Perses.",
      "Lorsque Ptolémée prend possession de l'Égypte en 323, il incorpore l'héritage héroïque d'Alexandre à sa propre propagande, davantage encore après s'être proclamé roi d'Égypte en 305 dans le but de soutenir les revendications de sa propre dynastie. Dans ce cadre, Alexandre est élevé du statut de dieu protecteur d'Alexandrie à celui de dieu d'État pour les populations grecque et égyptienne du royaume ptolémaïque. Le culte d'Alexandre reste vivace en Égypte jusqu'à la fin de la période ptolémaïque.",
    ] },
]

[articles.de]
text = "Alexander der Große (altgriechisch Ἀλέξανδρος ὁ Μέγας Aléxandros ho Mégas; * 20. Juli 356 v."
title = "Alexander der Große"
lang = "de"
url = "https://de.wikipedia.org/wiki/Alexander_der_Gro%C3%9Fe"
intro = [
  "Alexander der Große (altgriechisch Ἀλέξανδρος ὁ Μέγας Aléxandros ho Mégas; * 20. Juli 356 v. Chr. in Pella; † 10. Juni 323 v. Chr. in Babylon) war von 336 v. Chr. bis zu seinem Tod als Alexander III. König von Makedonien und Hegemon des Korinthischen Bundes.",
  "Alexander dehnte ab 334 v. Chr. die Grenzen des Reiches, das sein Vater Philipp II. aus dem vormals eher unbedeutenden Kleinstaat Makedonien sowie mehreren griechischen Poleis errichtet hatte, durch den sogenannten Alexanderzug und die Eroberung des Achämenidenreichs bis an den indischen Subkontinent aus. Nach seinem Einmarsch in Ägypten wurde er dort als Pharao begrüßt. Auch aufgrund seiner großen militärischen Erfolge wurde das Leben Alexanders ein beliebtes Motiv in Literatur (siehe Alexanderhistoriker) und Kunst, während Alexanders Beurteilung in der modernen Forschung, wie auch schon in der Antike, zwiespältig ausfällt.",
  "Mit seinem Regierungsantritt begann das Zeitalter des Hellenismus, in dem sich die griechische Kultur über weite Teile der damals bekannten Welt ausbreitete. Die kulturellen Prägungen durch die Hellenisierung überstanden den politischen Zusammenbruch des Alexanderreichs und seiner Nachfolgestaaten und wirkten noch jahrhundertelang in Rom und Byzanz fort.",
]
sections = [
  { "title" = "Leben", "paragraphs" = [
      "Alexander wurde im Jahr 356 v. Chr. als Sohn König Philipps II. von Makedonien und der Königin Olympias, einer Tochter des Königs Neoptolemos I. von Epeiros, geboren. Viele Einzelheiten seiner Biografie, vor allem aus der Kindheit, wurden bald legendenhaft ausgeschmückt oder frei erfunden. So berichtet Plutarch gut 400 Jahre später, dass Alexander ohne Zweifel seinen Stammbaum väterlicherseits auf Herakles und Karanos, den ersten König der Makedonen, zurückverfolgen konnte, wodurch Plutarch zugleich die Abstammung Alexanders vom Göttervater Zeus implizit hervorhebt.",
      "Ebenso berichtet er, dass Olympias und Philipp Träume gehabt hätten, die ihnen der Seher Aristander so deutete, dass ihnen die Geburt eines Löwen bevorstehe. Olympias nahm für sich in Anspruch, in direkter Linie von dem griechischen Heros Achilleus und Aiakos, einem weiteren Sohn des Zeus, abzustammen. Gemäß einer (wohl ebenfalls legendären) Erzählung Plutarchs soll Alexander in jungen Jahren sein Pferd Bukephalos, das ihn später bis nach Indien begleitete, gezähmt haben, nachdem es zuvor niemandem gelungen war, es zu bändigen. Alexander erkannte, was den Fehlschlägen der anderen zugrunde lag: Das Pferd schien den eigenen Schatten zu scheuen. Daraufhin habe Philipp zu ihm gesagt:",
      "Geh, mein Sohn, suche dir ein eigenes Königreich, das deiner würdig ist. Makedonien ist nicht groß genug für dich.",
    ] },
  { "title" = "Geschichtlicher Ausblick", "paragraphs" = [
      "Nach Alexanders Tod erwies sich die Loyalität zu seiner Familie, die keinen herrschaftsfähigen Nachfolger stellen konnte, als sehr begrenzt. Zwar wurde zunächst der Erbanspruch seines geistesschwachen Halbbruders und auch der seines postum geborenen Sohnes anerkannt, doch hatte diese Regelung keinen Bestand. Seine Mutter Olympias von Epirus, seine Frau Roxane, sein Sohn Alexander IV., sein illegitimer Sohn Herakles und dessen Mutter Barsine, seine Schwester Kleopatra, seine Halbschwester Kynane, deren Tochter Eurydike und sein Halbbruder Philipp III. Arrhidaios fanden einen gewaltsamen Tod.",
      "Statt der Angehörigen des bisherigen makedonischen Königsgeschlechts übernahmen Alexanders Feldherren als seine Nachfolger (Diadochen) die Macht. Da keiner von ihnen stark genug war, sich als Alleinherrscher durchzusetzen, kam es zu einer langen Reihe von Bürgerkriegen, in denen man in wechselnden Koalitionen um die Macht rang. Im Verlauf der Diadochenkriege wurde das riesige Reich in Diadochenreiche aufgeteilt. Drei dieser Reiche erwiesen sich als dauerhaft: das der Antigoniden in Makedonien (bis 148 v. Chr.), das Seleukidenreich in Vorderasien (bis 64 v. Chr.) und das der Ptolemäer in Ägypten (bis 30 v. Chr.). Alexander hinterließ zahlreiche neu gegründete Städte, von denen viele seinen Namen trugen; die bedeutendste war Alexandreia in Ägypten.",
      "Das kulturelle Vermächtnis Alexanders bestand aus der verstärkten bzw. nun erst einsetzenden Hellenisierung im Alexanderreich bzw. dessen Nachfolgereichen. Der sogenannte Hellenismus prägte die antike Welt vor allem im östlichen Mittelmeerraum und im Vorderen Orient nachhaltig über die nächsten Jahrhunderte.",
    ] },
  { "title" = "Rezeption", "paragraphs" = [
      "Alexander wurde schon zu Lebzeiten eine mythische Gestalt, wozu sein Anspruch auf Gottessohnschaft beitrug. Die zeitgenössischen erzählenden Quellen sind nicht oder nur in Fragmenten erhalten. Dabei handelte es sich, neben den Fragmenten der angeblichen Kanzleidokumente Alexanders (Ephemeriden), größtenteils um Berichte von Teilnehmern des Alexanderzugs. Der Hofhistoriker Kallisthenes begleitete Alexander, um die Taten des Königs aufzuzeichnen und zu verherrlichen. Sein Werk „Die Taten Alexanders“ reichte vielleicht nur bis 331 v. Chr., hatte jedoch einen enormen Einfluss auf die späteren Alexanderhistoriker. Weitere Verfasser von Alexandergeschichten waren König Ptolemaios I. von Ägypten, der als Offizier und Hofbeamter in der Nähe Alexanders gelebt hatte, Aristobulos, der für Alexander Unvorteilhaftes leugnete oder abschwächte, sowie Alexanders Flottenbefehlshaber Nearchos und dessen Steuermann Onesikritos. Die stärkste Nachwirkung unter diesen frühen Alexanderhistorikern erzielte Kleitarchos, der zwar ein Zeitgenosse, aber selbst kein Feldzugsteilnehmer war, sondern in Babylon Informationen von Offizieren und Soldaten Alexanders zusammentrug und zu einer rhetorisch ausgeschmückten Darstellung verband, wobei er auch sagenhafte Elemente einbezog. Zu diesen frühen Legenden gehörte beispielsweise die falsche Behauptung, Alexander und Dareios seien einander wiederholt im Nahkampf begegnet.",
      "Im 2. Jahrhundert n. Chr. schrieb der römische Senator Arrian auf der Grundlage der älteren Quellen, unter denen er Ptolemaios und Aristobulos bevorzugte, seine Anabasis, die verlässlichste antike Alexanderquelle. Wahrscheinlich behandelte auch Strabon in seinen nicht erhaltenen Historika Hypomnemata („Historische Denkwürdigkeiten“) das Leben Alexanders; seine erhaltene Geographie enthält Informationen aus verlorenen Werken der frühen Alexanderhistoriker.",
      "Weitere Nachrichten finden sich im 17. Buch der Universalgeschichte Diodors, der sich auf Kleitarchos stützte. Plutarch verfasste eine Lebensbeschreibung Alexanders, wobei es ihm mehr auf das Verständnis des Charakters unter moralischem Gesichtspunkt als auf den historischen Ablauf ankam. Quintus Curtius Rufus schrieb eine in der Antike wenig beachtete Alexandergeschichte. Justin wählte für seine Darstellung aus seiner (verlorenen) Vorlage, der Universalgeschichte des Pompeius Trogus, vor allem Begebenheiten aus, die geeignet waren, seine Leserschaft zu unterhalten.",
    ] },
  { "title" = "Quellen", "paragraphs" = [
      "Muriel Debié: Alexandre le Grand en syriaque. Maître des lieux, des savoirs et des temps (= Bibliothèque de l’Orient chrétien. Band 7). Les Belles Lettres, Paris 2024, ISBN 978-2-251-45490-0.",
      "Johannes Hahn: Alexander in Indien 327–325 v. Chr. Antike Zeugnisse, eingeleitet, übersetzt und erläutert (= Fremde Kulturen in alten Berichten. Band 8). Thorbecke, Stuttgart 2002, ISBN 3-7995-0607-1.",
      "Waldemar Heckel, John C. Yardley: Alexander the Great. Historical Sources in Translation. Blackwell, Oxford 2004, ISBN 0-631-22821-7(thematisch geordnete Sammlung von Quellenauszügen in englischer Übersetzung mit knappen Kommentaren und weiterführenden Hinweisen; als erster Überblick zu empfehlen)",
    ] },
]

[articles.it]
text = "Alessandro III di Macedonia (in greco antico Ἀλέξανδρος Γ' ὁ Μακεδών?, Aléxandros trítos ho Makedón), universalmente conosciuto come Alessandro Magno (Μέγας Ἀλέξανδρος, Mégas Aléxandros; Pella, 20 o 21 luglio 356 a.C. – Babilonia, 10 o 11 giugno 323 a.C.) è stato un condottiero e sovrano macedone antico, re di Macedonia della dinastia degli Argeadi dal 336 a.C., succedendo al padre Filippo II."
title = "Alessandro Magno"
lang = "it"
url = "https://it.wikipedia.org/wiki/Alessandro_Magno"
intro = [
  "Alessandro III di Macedonia (in greco antico Ἀλέξανδρος Γ' ὁ Μακεδών?, Aléxandros trítos ho Makedón), universalmente conosciuto come Alessandro Magno (Μέγας Ἀλέξανδρος, Mégas Aléxandros; Pella, 20 o 21 luglio 356 a.C. – Babilonia, 10 o 11 giugno 323 a.C.) è stato un condottiero e sovrano macedone antico, re di Macedonia della dinastia degli Argeadi dal 336 a.C., succedendo al padre Filippo II.",
  "È considerato uno dei principali condottieri della storia e uno dei più geniali strateghi e valorosi condottieri, con tattiche tutt'ora studiate e valorizzate in quanto grandi esempi di genio militare.",
  "Durante il suo regno condusse una serie di campagne militari che portarono alla conquista dell'Impero persiano e all'estensione del dominio macedone dalla Grecia all'Asia centrale e all'India nord-occidentale. La sua politica contribuì alla diffusione della cultura greca nei territori conquistati e segnò l'inizio del periodo ellenistico.",
  "Dopo la sua morte il suo impero venne diviso tra i suoi generali, i Diadochi, dando origine ai principali regni ellenistici.",
]
sections = [
  { "title" = "Descrizione fisica", "paragraphs" = [
      "Alessandro non era descritto dalle fonti come dotato di un fisico particolarmente avvenente: secondo alcune testimonianze era di statura relativamente modesta, di corporatura robusta e compatta. Le fonti antiche riferiscono inoltre che fosse mancino e che presentasse eterocromia, cioè occhi di colore diverso (uno chiaro e l'altro scuro, variamente indicato come azzurro, marrone o quasi nero), mentre la sua voce viene descritta come aspra. Portava abitualmente il collo leggermente inclinato verso sinistra, un tratto che ricorre anche nella ritrattistica ufficiale. Alcuni autori antichi menzionano la presenza di possibili malformazioni o disturbi congeniti, la cui reale natura resta tuttavia incerta e che, secondo ipotesi moderne, potrebbero aver influito sul suo stato di salute negli ultimi anni di vita.",
      "Aveva capelli ispidi e rossicci, sebbene – secondo tradizioni riportate da fonti tarde – fosse solito schiarirli o profumarli con preparati a base di zafferano, potassa e fiori, trattandoli poi con essenze come incenso e mirra. Alessandro usava radersi regolarmente il volto anche in età adulta, un'abitudine piuttosto inusuale tra i Greci del suo tempo, probabilmente anche a causa della scarsa crescita della barba; per uniformità e per non distinguersi eccessivamente dai suoi dignitari, avrebbe incoraggiato anche loro ad adottare la stessa consuetudine.",
      "L'immagine di Alessandro fu fissata da numerosi artisti suoi contemporanei, delle cui opere originali non rimangono purtroppo che copie romane e descrizioni letterarie. Il celebre Lisippo fu nominato suo scultore di corte e realizzò numerosi ritratti ufficiali del sovrano, contribuendo a definire l'iconografia canonica di Alessandro. Pirgotele fu invece l'unico incisore autorizzato dallo stesso Alessandro a raffigurarne l'immagine su sigilli e gemme. Sappiamo inoltre che il pittore Apelle lo immortalò in grandi tavole lignee, raffigurandolo sia in scene celebrative sia in episodi di battaglia.",
    ] },
  { "title" = "Personalità", "paragraphs" = [
      "Alcuni dei tratti più evidenti della personalità di Alessandro si formarono sotto la forte influenza dei suoi genitori. Sua madre Olimpiade era una donna di grande determinazione e ambizione e lo incoraggiò fin dall'infanzia a credere di essere destinato a compiere imprese eccezionali, in particolare a sconfiggere l'Impero persiano. Questa influenza contribuì a radicare in Alessandro una profonda convinzione nel proprio destino; Plutarco afferma infatti che la sua ambizione «rese il suo spirito grave e superbo con il passare degli anni». Tuttavia, il modello più immediato e determinante per Alessandro fu il padre Filippo, che egli vide fin da bambino impegnato quasi ogni anno in campagne militari vittoriose, spesso riportando ferite gravi. Il rapporto con Filippo forgiò la componente competitiva del suo carattere: Alessandro sentiva il bisogno di superare il padre, come si evince anche dal suo comportamento spesso audace e spericolato in battaglia. Egli stesso temeva che Filippo potesse non lasciargli «nessuna grande o memorabile impresa da mostrare al mondo», e non di rado tendeva a sminuirne i successi davanti ai suoi coetanei.",
      "Secondo Plutarco, Alessandro mostrava tratti di un temperamento violento e impulsivo, che in alcune occasioni influenzò negativamente le sue decisioni. Pur essendo ostinato e poco incline a sottomettersi passivamente all'autorità paterna, era tuttavia disposto ad accettare argomentazioni razionali e ben motivate. Accanto a questo lato impetuoso, possedeva anche una natura riflessiva, intuitiva e calcolatrice. Aveva un forte desiderio di conoscenza, un profondo interesse per la filosofia ed era un lettore appassionato, inclinazioni dovute almeno in parte all'educazione ricevuta da Aristotele. Alessandro era dotato di notevole intelligenza e apprendeva rapidamente; tali qualità si manifestarono chiaramente nella sua abilità strategica e nel successo come comandante militare. Dimostrava inoltre un notevole autocontrollo nei confronti dei piaceri sessuali, mentre faticava maggiormente a imporsi limiti nel consumo di alcolici.",
      "Alessandro era colto e padroneggiava sia le arti sia le scienze. Mostrava scarso interesse per le competizioni sportive e per i giochi olimpici – a differenza di Filippo – aspirando piuttosto a incarnare gli ideali omerici di onore (τιμή, timḗ) e gloria (κῦδος, kŷdos). Dotato di grande carisma e di una personalità dominante, fu un leader capace di esercitare un forte ascendente sui suoi uomini. L'eccezionalità delle sue capacità emerge anche dal fatto che, dopo la sua morte, nessuno dei suoi generali riuscì a mantenere unita la Macedonia e a preservare l'integrità dell'impero: un risultato che solo Alessandro era stato in grado di ottenere.",
    ] },
  { "title" = "Biografia", "paragraphs" = [
      "Alessandro nacque a Pella, seconda capitale del regno di Macedonia (dopo Aigai, l'odierna Verghina), intorno al 20 o 21 luglio del 356 a.C., anche se alcune fonti antiche collocano la nascita intorno al 6 luglio dello stesso anno. Era figlio del re macedone Filippo II e della principessa epirota Olimpiade. Entrambe le famiglie rivendicavano una discendenza mitica: la dinastia argeade di Filippo si diceva discendente da Eracle, mentre la stirpe di Olimpiade faceva risalire le proprie origini ad Achille. Alessandro mostrò sempre grande interesse per questa genealogia eroica e, nel corso della sua vita, diede più volte prova di identificarsi con tali modelli mitici, in particolare con Achille, che considerava il suo ideale di riferimento.",
      "Secondo una tradizione leggendaria, probabilmente incoraggiata dallo stesso Alessandro e da Olimpiade dopo l'ascesa al trono e riferita da Plutarco, il vero padre di Alessandro sarebbe stato Zeus, il quale avrebbe giaciuto con Olimpiade assumendo le sembianze di un serpente. Questo racconto si inserisce nel più ampio contesto delle narrazioni mitiche volte a legittimare il potere regale attraverso una discendenza divina.",
      "Un'altra tradizione, diffusa in ambienti ellenistici e talvolta attribuita a Tolomeo I, identificava invece il padre biologico di Alessandro con il faraone egiziano Nectanebo II, deposto ed esiliato dai Persiani. Anche questa versione, priva di fondamento storico, rientra nel complesso corpus di leggende sorte attorno alla figura del conquistatore macedone, soprattutto in epoca successiva alla sua morte.",
    ] },
  { "title" = "Successione", "paragraphs" = [
      "Alessandro ebbe due figli: Eracle di Macedonia, nato nel 327 a.C. da Barsine (figlia del satrapo Artabazus di Frigia) e Alessandro IV di Macedonia, nato postumo nel 323 a.C. dalla moglie Rossane (figlia del satrapo Ossiarte di Battriana). Aveva anche numerosi amanti, tra i quali l'amico Efestione e Bagoas. Quando adottò la poligamia, sposò anche la figlia di Dario III, Statira II, e sua cugina Parisatide II. La prima era probabilmente incinta alla morte di Alessandro. Entrambe furono comunque fatte assassinare a Susa da Rossane quando il re morì, poiché intendeva assicurare la successione a suo figlio che doveva nascere.",
      "Al morente Alessandro fu chiesto il nome di colui che aveva scelto come suo successore. Egli diede un'indistinta risposta nella quale qualcuno comprese il nome di Eracle (il figlio avuto da Barsine) e altri «tôi kratistôi» (e cioè al migliore, al più capace).",
      "Subito dopo il suo decesso, ci fu la cosiddetta Spartizione di Babilonia, che vide contrapporsi due linee di successione: il figlio di Alessandro avuto dalla moglie Rossane, Alessandro IV, e il suo fratellastro Filippo III Arrideo. Poiché il primo era ancora in fasce e il secondo era infermo di mente, i generali dell'esercito macedone (Diadochi) elessero un reggente, Perdicca, successivamente accettato in modo formale dall'assemblea dei soldati. Eracle, ritenuto da molti non realmente figlio di Alessandro, fu immediatamente escluso e non prese parte alle rivendicazioni.",
    ] },
]

[articles.zh]
text = "馬其頓的亞歷山大三世（古希臘語：Ἀλέξανδρος Γ' ὁ Μακεδών，其名字亞歷山大意為“人類的（ἀνδρός）守護者（ἀλέξω）”；前356年7月20日或21日—前323年6月10日或11日），世稱亞歷山大大帝（Ἀλέξανδρος ὁ Μέγας 或 Μέγας Ἀλέξανδρος），馬其頓阿吉德王朝國王。亞歷山大在20歲時從他的父王腓力二世手上繼承馬其頓王位，他的統治期間幾乎都在進行大型軍事征服活動。到他30歲時已經建立了古代最大的帝國之一，範圍從希臘、小亞細亞、埃及、波斯、兩河流域、阿富汗到印度西北部。他在戰場上從未被擊敗，且被認為是歷史上最偉大的將軍之一。 在13歲時，他的父親為他找來哲學家亞里斯多德任其導師，在前336年腓力二世被刺殺之後，亞歷山大繼承父親的王位以及一個強大的王國與經驗老道的軍隊。他被科林斯同盟任命為希臘遠征軍司令，並利用此職位進行腓力二世籌備的泛希臘聯軍對波斯的征服計劃。前334年，他向波斯阿契美尼德王朝統治的小亞細亞地區發起進攻，開始長達十年的亞歷山大東征。亞歷山大在一連串的決定性戰役中擊敗波斯，其中著名的戰役有伊蘇斯戰役和高加米拉戰役，并推翻波斯王大流士三世，征服波斯帝國，使得他帝國疆土從亞得里亞海直至印度邊界。 为了尋找并抵達「世界的盡頭和大外海」，亞歷山大大帝在前326年入侵印度，但最終應軍隊要求不得不撤軍。前323年，亞歷山大大帝死在他設想的帝國首都巴比倫，沒能來得及實現他入侵阿拉伯的計劃。在他死後，由於無合適繼承人，他的將領們互相不服且開始爭奪他遺留下的帝國，最終引發繼業者戰爭，亞歷山大帝國也就迅速瓦解。 亞歷山大大帝的遺產包括他擴土導致的文化融合，如希臘式佛教。他建起至少二十座以他的名字命名的城市，最著名的就是埃及的亞歷山卓。亞歷山大在東方安置了許多希臘殖民地，導致希臘文明一直向東擴張，促成希臘化時代的到來，直到中世紀的東羅馬帝國、以及1920年代的小亞細亞中部卡帕多細亞希臘人和東部的本都希臘人仍可以發現希臘化遺留痕跡。他以古希臘神話中的英雄阿基里斯為偶像榜樣，最終自己也成为一個近乎神話的人物。他也以融合希臘文化和非希臘文化而著名。他在軍事上的成就使後世的軍事將領設法與他看齊，且全世界的軍校都曾使用過他的戰術做為教材。他經常被列入世界歷史上最有影響力的人物之一，與他的導師亞里斯多德並列。"
title = "亚历山大大帝"
lang = "zh"
url = "https://zh.wikipedia.org/wiki/%E4%BA%9A%E5%8E%86%E5%B1%B1%E5%A4%A7%E5%A4%A7%E5%B8%9D"
intro = [
  "馬其頓的亞歷山大三世（古希臘語：Ἀλέξανδρος Γ' ὁ Μακεδών，其名字亞歷山大意為“人類的（ἀνδρός）守護者（ἀλέξω）”；前356年7月20日或21日—前323年6月10日或11日），世稱亞歷山大大帝（Ἀλέξανδρος ὁ Μέγας 或 Μέγας Ἀλέξανδρος），馬其頓阿吉德王朝國王。亞歷山大在20歲時從他的父王腓力二世手上繼承馬其頓王位，他的統治期間幾乎都在進行大型軍事征服活動。到他30歲時已經建立了古代最大的帝國之一，範圍從希臘、小亞細亞、埃及、波斯、兩河流域、阿富汗到印度西北部。他在戰場上從未被擊敗，且被認為是歷史上最偉大的將軍之一。",
  "在13歲時，他的父親為他找來哲學家亞里斯多德任其導師，在前336年腓力二世被刺殺之後，亞歷山大繼承父親的王位以及一個強大的王國與經驗老道的軍隊。他被科林斯同盟任命為希臘遠征軍司令，並利用此職位進行腓力二世籌備的泛希臘聯軍對波斯的征服計劃。前334年，他向波斯阿契美尼德王朝統治的小亞細亞地區發起進攻，開始長達十年的亞歷山大東征。亞歷山大在一連串的決定性戰役中擊敗波斯，其中著名的戰役有伊蘇斯戰役和高加米拉戰役，并推翻波斯王大流士三世，征服波斯帝國，使得他帝國疆土從亞得里亞海直至印度邊界。",
  "为了尋找并抵達「世界的盡頭和大外海」，亞歷山大大帝在前326年入侵印度，但最終應軍隊要求不得不撤軍。前323年，亞歷山大大帝死在他設想的帝國首都巴比倫，沒能來得及實現他入侵阿拉伯的計劃。在他死後，由於無合適繼承人，他的將領們互相不服且開始爭奪他遺留下的帝國，最終引發繼業者戰爭，亞歷山大帝國也就迅速瓦解。",
  "亞歷山大大帝的遺產包括他擴土導致的文化融合，如希臘式佛教。他建起至少二十座以他的名字命名的城市，最著名的就是埃及的亞歷山卓。亞歷山大在東方安置了許多希臘殖民地，導致希臘文明一直向東擴張，促成希臘化時代的到來，直到中世紀的東羅馬帝國、以及1920年代的小亞細亞中部卡帕多細亞希臘人和東部的本都希臘人仍可以發現希臘化遺留痕跡。他以古希臘神話中的英雄阿基里斯為偶像榜樣，最終自己也成为一個近乎神話的人物。他也以融合希臘文化和非希臘文化而著名。他在軍事上的成就使後世的軍事將領設法與他看齊，且全世界的軍校都曾使用過他的戰術做為教材。他經常被列入世界歷史上最有影響力的人物之一，與他的導師亞里斯多德並列。",
]
sections = [
  { "title" = "早年", "paragraphs" = [
      "亞歷山大出生於前356年古希臘赫卡托姆拜昂月的第6天，對照今日曆法大概是7月20日，雖然準確日期不是很確定。他誕於馬其頓王國首都佩拉。他的父親是馬其頓國王腓力二世，母親奧林匹亞絲是希臘伊庇魯斯地區摩羅西亞國王涅俄普托勒摩斯一世的女兒，是腓力二世的第4位妻子。儘管腓力有7或8個妻子，但奧林匹亞絲是地位最顯著的一位，可能是因她生下亞歷山大。",
      "關於亞歷山大的誕生和童年圍繞著數個傳說，根據古希臘傳記作家普魯塔克的記載，奧林匹亞絲在與腓力婚禮前夕夢見雷电擊中她的子宮，造成一團火焰並在熄滅之前往各處擴散開來。而腓力在婚禮一段時間之後，在夢中看到自己拿了一個刻著狮子的形像的印封住妻子奧林匹亞絲的子宮。普魯塔克對這些夢提供不同的解釋：奧林匹亞絲在婚前就已懷孕；用印封住子宮表示亞歷山大的父親是宙斯。古代評論家為此爭論，野心勃勃的奧林匹亞絲她是否到處宣揚了亞歷山大神性的誕生故事，其中各種證言說她曾把這個故事告訴亞歷山大，或者奧林匹亞絲並沒有宣揚此事，可能是因為這褻瀆了神明。",
      "亞歷山大誕生的那一天，腓力在率軍圍攻哈爾基季基半島的城市波提狄亞，腓力收到兒子誕生消息的那日，同一日也收到他的將軍帕曼紐擊敗了伊利里亞和培奧尼亞人的聯軍之捷報，以及腓力的賽馬獲得奧林匹克運動會勝利，這三喜臨門的消息讓腓力高興不已。亞歷山大誕生的那天同時也是七大奇觀之一以弗所的阿耳忒彌斯神廟被焚毀的那一日，這巧合讓古希臘馬格尼西亞的赫格西亞斯覺得神廟會慘遭焚毁，是因為女神阿耳忒彌斯離開去探望亞歷山大的誕生。這些傳說故事很可能是亞歷山大當上國王後才產生，可能受到他特意營造，為了塑造他擁有超人般特質以及命中注定是偉人的感覺。",
    ] },
  { "title" = "腓力的王位繼承者", "paragraphs" = [
      "當16歲時亞里斯多德的課程大致結束，此時腓力率軍遠征城邦拜占庭的时候，讓亞歷山大擔任臨時攝政代父统治马其顿，除了讓他累積經驗外也表明他是腓力屬意的繼承者。在腓力二世不在國內期間，色雷斯的部族密底人（Maedi）趁機造反，亞歷山大反應相當迅速，把他們從他們的領地驅除出去並在當地建立殖民城市，引入一些希臘人作為居民，並以自己的名字命名為亞歷山德魯波利斯（Alexandropolis）。",
      "後來腓力回國，派遣亞歷山大率領一支小型軍隊去鎮壓色雷斯南部的叛亂。而後父子倆人參與對付希臘城邦佩林托斯的行動，後來回軍時與色雷斯的特里巴利人作戰，這裡亞歷山大曾救了腓力的性命。隨後這段期間，希臘城邦安菲薩公民耕種了德爾斐的阿波羅聖地，此事引發近鄰同盟向安菲薩開戰，爆發「第四次神聖戰爭」。這件事讓腓力有機會更一步介入希臘城邦之間的事務，預期馬其頓將會參戰，但他自己在色雷斯仍有事情要忙，於是腓力命亞歷山大在馬其頓開始動員軍隊，準備加入希臘的戰爭。亞歷山大為了不引起其他希臘城邦注意到馬其頓已經開始動員，會引發不必要的干涉，恰好先前伊利里亞人曾入侵馬其頓，但那時很快被亞歷山大逐出，這件事就成了亞歷山大動員的藉口。他偽裝這次動員是準備去攻擊伊利里亞人。",
      "腓力二世帶領他的兒子亞歷山大和軍隊於前338年加入戰爭，因為底比斯軍封鎖了溫泉關，於是他們繞道進入希臘中部並進軍到了伊拉提亞（Elatea），這距底比斯和雅典僅幾天路程，這使雅典陷入恐慌之中。在狄摩西尼的倡導下，雅典人立即表決向馬其頓宣戰作為對腓力進軍的反應，同時雅典人積極與底比斯尋求結盟。為了防止底比斯加入雅典陣營，腓力向底比斯派遣使者但沒能阻止底比斯參戰。",
    ] },
  { "title" = "馬其頓國王", "paragraphs" = [
      "前336年夏天，腓力二世在舊都埃格举行女儿克麗奧佩脫拉和伊庇鲁斯的亚历山大一世的婚礼時，被他的近身護衛官保薩尼亞斯刺杀身亡。保薩尼亞斯試圖從現場逃走，但在逃跑中被藤蔓絆倒，隨即被追隨在後的馬其頓軍官所殺，其中追殺的軍官包含佩爾狄卡斯和列昂納托斯。幕後是否有指使者不清楚，對於腓力之死，已與腓力結怨的奧林匹亞絲对此公开表示喜悦，儘管當時的史書說明保薩尼亞斯本就有殺腓力的動機，但後來的古羅馬歷史學家和一些現代學者懷疑奧林匹亞絲可能涉案。亚历山大代表指责此事為波斯国王大流士三世所指使，后来以此為向波斯进攻的理由。亞歷山大當天也出席婚禮現場，在腓力被刺殺後隨即被現場的馬其頓貴族和軍隊擁立為新國王，當時他年僅20歲。",
      "亞歷山大繼位後開始調查腓力刺殺案，並以此為藉口去除威脅他王位的潛在敵人，林塞斯蒂斯地區（Lyncestis）的貴族三兄弟皆被懷疑與保薩尼亞斯合謀，亞歷山大殺了其中兩個，但赦免了林塞斯蒂斯的亞歷山大。亞歷山大還以謀反的名義處死遜位的堂兄阿敏塔斯四世。在亞歷山大登繼位後，亞歷山大的母親奧林匹亞絲也從伊庇魯斯的娘家回到馬其頓，她趁著亞歷山大不在首都時殺了腓力的新妻克麗奧佩脫拉·歐律狄刻和她出世不久的女兒歐羅芭，事後亞歷山大得知後，對母親的作為非常不滿。同時亞歷山大也下令處死先前與他結怨阿塔羅斯。阿塔羅斯這時正與帕曼紐率領遠征先遣軍於小亞細亞作戰，在腓力被刺殺後雅典的狄摩西尼寫信試圖勸誘他謀反，阿塔羅斯接信後立即把此事報告上去來撇清嫌疑，但在克麗奧佩脫拉·歐律狄刻死後亞歷山大認為讓阿塔羅斯活著太危險，加上先前他多次污辱過亞歷山大，以與雅典合謀謀反的名義下令殺了他。另外，亞歷山大並沒有對同父異母的兄弟阿里達烏斯下手，畢竟阿里達烏斯智能不足對亞歷山大威脅較小，而阿里達烏斯的智能不足這件事，可能是奧林匹亞絲在阿里達烏斯幼年時下毒的結果。",
      "當腓力的死訊傳到希臘，許多希臘城邦認為這是脫離馬其頓霸權的好機會，以雅典和底比斯為首的希臘城邦們預謀起義，甚至連色薩利人也欲脫離馬其頓的掌控，更不用說之前被腓力擊敗的蠻族部族了，他們也反抗馬其頓的統治。亞歷山大得知各地準備叛變的消息，他決定首先處理希臘問題，他反應迅速，一邊派遣使者以外交手段解決，一方面親自率領3,000名馬其頓騎兵先頭部隊疾行至色薩利，當他來到色薩利奧薩山和奧林帕斯山之間的邊界地帶，發現當地已被一支色薩利軍隊把守，他立即從奧薩山迂迴過去，當守軍隔日起來發現亞歷山大已經出現在他們背後驚訝不已，他們很快地不得不向亞歷山大投降。亞歷山大隨後馬不停蹄來到南下到色薩利地區，色薩利人在叛變尚未準備好的情況下向亞歷山大輸誠，擁立他為色薩利同盟新的執政官。",
    ] },
  { "title" = "征服波斯帝國", "paragraphs" = [
      "希腊与波斯的敌对始于前6世纪，当时位于小亚细亚的自由希腊城邦沦陷于向西扩张的波斯帝国。在爱奥尼亚叛乱和马拉松战役后。前481年波斯国王薛西斯一世在第二次波希战争时试图占领整個希腊。虽然薛西斯一世被打回，波斯之后也再没有大規模进攻希腊，而薛西斯一世前480年火烧雅典卫城及其他被认为渎神的行为，使得亚历山大當时的希腊政界仍存在着报仇和反攻波斯的声音，这也被腓力二世和亚历山大所利用。並以「向波斯復仇」、「解放小亚细亚希腊城邦」的口号進行號召。",
      "前334年亚历山大率軍從赫勒斯滂出發渡海到亞洲，他的遠征軍由馬其頓部隊、各希臘城邦的部隊、雇傭兵、以及臣服的色雷斯、培奧尼亞、伊利里亞部族部隊所組成。史料上對於亞歷山大全軍的人數有些許差異，古羅馬歷史學家阿里安使用托勒密的回憶錄作為資料來源，說遠征軍共超過30,000名步兵、5,000名騎兵度過海峽。西西里的狄奧多羅斯提供的人數大致相同，說用32,000名步兵、5,100名騎兵，但狄奧多羅斯提到當時已有一支先遣軍在幾年前就已經渡過海峽了。波利艾努斯在他的《戰略》描述，這支先遣軍人數有一萬人。因此，亞歷山大全軍的人數全部總共大約48,100名步兵、6,100名騎兵，算上海軍的話還有160艘戰船及38,000名水手，雖然這支艦隊沒派上甚麼用場。為了籌組這支大軍。亞歷山大幾乎耗盡他的國庫，原本腓力留給他的資金就沒剩多少，使得他只夠維持30天的補給，國庫還欠了1,300塔蘭同。",
      "當亞歷山大所率領軍隊渡過達達尼爾海峽來到亞洲，據說他是第一位登陸的，當時他丟出一支長槍插入亞洲的土地上，意味著亞洲將是神明給他的禮物，也代表這塊領地他要用武力贏來。這也顯示，不像腓力二世喜好用外交手段，而亞歷山大熱衷用武力解決。在小亚细亚亚历山大和小部分軍隊首先访问了特洛伊，他和他童年来的好友赫費斯提翁分别祭拜阿基里斯和阿基里斯的好友帕特羅克洛斯。随后亚历山大与帕曼纽带领的其余部队会合，继续進軍。",
    ] },
]

[articles.ja]
text = "アレクサンドロス3世（ギリシア語: Ἀλέξανδρος Aléxandros、紀元前356年7月20日 - 紀元前323年6月10日）は、古代ギリシアのアルゲアス朝のマケドニア王（在位: 紀元前336年 - 紀元前323年6月10日）。アレクサンドロス大王（ギリシア語: Ἀλέξανδρος ὁ Μέγας Aléxandros ho Mégas） と呼ばれる。アレクサンダー大王、アレキサンダー大王、イスカンダルなどともいう。 東方遠征によりギリシア文化を広め、ペルシア帝国を滅ぼし、ギリシアからインド北西部に至る広大な帝国を築き上げた。死後にその帝国は崩壊したが、その跡地には複数のギリシア人国家が誕生し、ヘレニズム時代の幕開けとなった。"
title = "アレクサンドロス3世"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%89%E3%83%AD%E3%82%B93%E4%B8%96"
intro = [
  "アレクサンドロス3世（ギリシア語: Ἀλέξανδρος Aléxandros、紀元前356年7月20日 - 紀元前323年6月10日）は、古代ギリシアのアルゲアス朝のマケドニア王（在位: 紀元前336年 - 紀元前323年6月10日）。アレクサンドロス大王（ギリシア語: Ἀλέξανδρος ὁ Μέγας Aléxandros ho Mégas） と呼ばれる。アレクサンダー大王、アレキサンダー大王、イスカンダルなどともいう。",
  "東方遠征によりギリシア文化を広め、ペルシア帝国を滅ぼし、ギリシアからインド北西部に至る広大な帝国を築き上げた。死後にその帝国は崩壊したが、その跡地には複数のギリシア人国家が誕生し、ヘレニズム時代の幕開けとなった。",
]
sections = [
  { "title" = "概要", "paragraphs" = [
      "紀元前356年にアルゲアス朝マケドニア王国の都ペラで生まれ、20歳で父ピリッポス2世の王位を継承した。その治世の多くをアジアや北アフリカにおける類を見ない戦役（東方遠征）に費やし、30歳までにギリシアからインド北西部に至る広大な帝国を築き上げた。戦術・戦略の天才であり、少年のごとき純朴な野心を持っていた。戦えば決して負けることがなく、確かな戦略で領域を急速に拡大し、異民族統治においては独創的な方針をとった。彼の業績は征服戦争に成功したことだけにあるのではない。当時のギリシア人が考える東方世界の主要部（ギリシア、メソポタミア、エジプト、ペルシア、インド）のほとんどを1つにつないだ若き『世界征服者』であり、異文化の交流と融合を図る諸政策を実行し、広大な領域にドラクマなどを流通させることで両替の手間を省いて迅速かつ活発な商取引を実現したことにある。アレクサンドロス以後、世界は一変したことから、歴史上において最も成功した軍事指揮官であると広く考えられている。",
      "青年期、アレクサンドロスはプトレマイオスたちを学友として過ごし、16歳までアリストテレスの教えをマケドニア東部のミエザという地で受けた。紀元前336年に父王がアイガイの劇場で暗殺されると、彼は末子ながらその王位を継承するとともに、強大な王国と熟達した軍隊を受け継ぐこととなった。アレクサンドロスはコリントス同盟の盟主・全権将軍としてマケドニア王位に就いたので、この立場を使い父王の意を継いで東方遠征に着手した。紀元前334年、アケメネス朝ペルシア帝国に侵攻し、10年に及ぶ大遠征を開始した。小アジアの征服後、イッソスの戦いやガウガメラの戦いといった決定的な戦いによってダレイオス3世率いる強大なペルシア軍を打ち破り、ペルシア帝国全土を制圧した。その時点でアレクサンドロスの帝国はアドリア海からインダス川にまで及ぶものであった。",
      "紀元前326年、インドに侵攻し、ヒュダスペス河畔の戦いでパウラヴァ族に勝利する。しかし、多くの部下の要求により結局引き返すこととなった。紀元前323年、アラビアへの侵攻を始めとする新たな遠征を果たせないまま、首都にする計画だったバビロンで熱病にかかり32歳で崩御した。アレクサンドロスの死後、その帝国は内戦（ディアドコイ戦争）によって分裂し、古代マケドニア人の後継者（ディアドコイ）によって分割支配されることとなった。",
    ] },
  { "title" = "生涯", "paragraphs" = [
      "紀元前356年7月20日、アレクサンドロスはマケドニア王ピリッポス2世とその妻であるエペイロス王女オリュンピアスの間に生まれた。ピリッポス2世の家系はヘーラクレースを、オリュンピアスの家系はアキッレウスを祖としていたため、アレクサンドロスはギリシア世界で最も栄光に満ちた2人の英雄の子孫とみなされ、その家系の栄誉はギリシアで比類のないものであった。",
      "紀元前342年、父王はアテナイから古代マケドニア人の学者アリストテレスを「家庭教師」として招く。アリストテレスは都ペラから離れた「ミエザの学園」で、紀元前340年までアレクサンドロスとその学友を教えた。アレクサンドロスは「ピリッポス2世から生を受けたが、高貴に生きることはアリストテレスから学んだ」という言葉を残すほどに、アリストテレスを最高の師として尊敬するようになる。また、彼と共にギリシアの基礎的な教養を身につけた「学友」たちは、後にアレクサンドロスを支える将軍となった。",
      "東征中、アレクサンドロスの要請でアリストテレスは『王道論』と『植民論』を書き送ったといわれる。アレクサンドロスも、各国から動物や植物を送り、アリストテレスはそれらを観察し、研究を続けた。アリストテレスとアレクサンドロスの交流はアレクサンドロスの生涯を通して続いた。",
    ] },
  { "title" = "死後", "paragraphs" = [
      "アレクサンドロスの死後、異母兄で精神疾患のあったピリッポス3世と、アレクサンドロスの死後に生まれた息子アレクサンドロス4世が共同統治者となったものの、後継の座を巡って配下の武将らの間でディアドコイ戦争が勃発した。ピリッポス3世は紀元前317年に処刑され、アレクサンドロス4世は紀元前309年に暗殺されたことでアルゲアス朝は断絶し、アレクサンドロスの帝国はディアドコイらにより分割・統治されることとなった（アンティゴノス朝、セレウコス朝、プトレマイオス朝など）。",
    ] },
  { "title" = "人物", "paragraphs" = [
      "アレクサンドロスが大王と呼ばれるようになるのは、軍事指揮官として類を見ない成功を治めたことによる。たとえ数で圧倒的に凌駕されていようとも、1度も戦いにおいて負けることがなかった。これは地形とファランクス、騎兵戦術、大胆な戦略、そして部下の強い忠誠心を使ったことによる。6メートルの長さを持つ槍（サリッサ）で武装するマケドニアのファランクスは、アレクサンドロスの父ピリッポス2世による厳格な養成によって熟練させられ、アレクサンドロスはそのスピードと運動能力を最大限利用した。",
    ] },
  { "title" = "融合政策", "paragraphs" = [
      "アレクサンドロスは征服地にその名に因んでアレクサンドリアと名付けた都市を建設、軍の拠点として現地支配の基礎に置いた。帝国の公用語にギリシア語を採用した。さらにペルシア文化への融合に心を配り、自らダレイオス3世の娘を娶りペルシア人と部下の集団結婚を奨励し（この集団結婚式において古代マケドニア人の女とペルシア人の男が結婚する事例はなかった）、ペルシア風礼式や行政制度を取り入れ代官に現地有力者を任命した。",
    ] },
  { "title" = "ヘレニズム", "paragraphs" = [
      "ギリシア文化とオリエント文化が融合したヘレニズム文化はアレクサンドロスの帝国とその後継王朝へ根付き、ラオコオン、ミロのヴィーナス、サモトラケのニケ、瀕死のガリア人などの彫刻が各地で制作された。エウクレイデス、アポロニオス、アルキメデス、エラトステネス、アリスタルコスらの学者も輩出、その後古代ローマに強い影響を及ぼし、サーサーン朝などにも影響を与えた。",
    ] },
]

[articles.ar]
text = "الإسكندر الثالث المقدوني، المعروف بأسماء عديدة أخرى أبرزها: الإسكندر الأكبر، والإسكندر الكبير، والإسكندر المقدوني، والإسكندر ذو القرنين (باليونانية: Ἀλέξανδρος ὁ Μέγας؛ نقحرة: ألكساندروس أوميگاس)، هو أحد ملوك مقدونيا الإغريق، ومن أشهر القادة العسكريين والفاتحين عبر التاريخ. وُلد الإسكندر في مدينة پيلا قرابة سنة 356 ق.م، وتتلمذ على يد الفيلسوف والعالم الشهير أرسطو حتى بلغ ربيعه السادس عشر."
title = "الإسكندر الأكبر"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A7%D9%84%D8%A5%D8%B3%D9%83%D9%86%D8%AF%D8%B1_%D8%A7%D9%84%D8%A3%D9%83%D8%A8%D8%B1"
intro = [
  "الإسكندر الثالث المقدوني، المعروف بأسماء عديدة أخرى أبرزها: الإسكندر الأكبر، والإسكندر الكبير، والإسكندر المقدوني، والإسكندر ذو القرنين (باليونانية: Ἀλέξανδρος ὁ Μέγας؛ نقحرة: ألكساندروس أوميگاس)، هو أحد ملوك مقدونيا الإغريق، ومن أشهر القادة العسكريين والفاتحين عبر التاريخ. وُلد الإسكندر في مدينة پيلا قرابة سنة 356 ق.م، وتتلمذ على يد الفيلسوف والعالم الشهير أرسطو حتى بلغ ربيعه السادس عشر. وبحلول عامه الثلاثين، كان قد أسس إحدى أكبر وأعظم الإمبراطوريات التي عرفها العالم القديم، والتي امتدت من سواحل البحر الأيوني غربًا وصولاً إلى سلسلة جبال الهيمالايا شرقًا. يُعد أحد أنجح القادة العسكريين في مسيرتهم، إذ لم يحصل أن هُزم في أي معركة خاضها على الإطلاق.",
  "خلف الإسكندر والده، فيليپ الثاني المقدوني «الأعور»، على عرش البلاد سنة 336 ق.م، وبعد أن اغتيل الأخير. ورث الإسكندر عن أبيه مملكة متينة الأساس وجيشًا عرمرمًا قويًا ذا جنود مخضرمة. وقد مُنح حق قيادة جيوش بلاد اليونان كلها، فاستغل ذلك ليُحقق أهداف أبيه التوسعيّة، وانطلق في عام 334 ق.م في حملة على بلاد فارس، فتمكن من دحر الفرس وطردهم خارج آسيا الصغرى، ثم شرع في انتزاع ممتلكاتهم الواحدة تلو الأخرى في سلسلة من الحملات العسكرية التي دامت عشر سنوات. تمكن الإسكندر خلالها من كسر الجيش الفارسي وتحطيم القوة العسكرية للإمبراطورية الفارسية الأخمينية في عدّة وقعات حاسمة، أبرزها معركتيّ إسوس وگوگميلا. وتمكن الإسكندر في نهاية المطاف من الإطاحة بالشاه الفارسي دارا الثالث، وفتح كامل أراضي إمبراطوريته،وعند هذه النقطة، كانت الأراضي الخاضعة له قد امتدت من البحر الأدرياتيكي غربًا إلى نهر السند شرقًا.",
  "كان الإسكندر يسعى للوصول إلى «نهاية العالم والبحر الخارجي الكبير»، فأقدم على غزو الهند سنة 326 ق.م في محاولة لاكتشاف الطريق إلى ذاك البحر، لكنه اضطرّ إلى أن يعود أدراجه بناءً على إلحاح قادة الجند وبسبب تمرّد الجيش. توفي الإسكندر في مدينة بابل سنة 323 ق.م، قبل أن يشرع في مباشرة عدّة حملات عسكرية جديدة خطط لها، وكان أولها فتح شبه الجزيرة العربية. بعد بضعة سنوات من وفاته، نشبت حروب أهلية طاحنة بين أتباعه كان من شأنها أن مزّقت أوصال إمبراطوريته، وولّدت عدّة دول يحكم كل منها «خليفة» وقد عرفت بملوك الطوائف (باليونانية: Διάδοχοι، وباللاتينية: Diadochi)، وكان كل ملك من هؤلاء الملوك مستقل لا يدين بالولاء إلا لنفسه، وكان هؤلاء هم من بقي حيًا من قادة جيش الإسكندر وشاركه حملاته في الماضي.",
  "يشمل إرث الإسكندر التمازج الثقافي الذي خلقته فتوحاته، فقد تمكن من خلط الثقافة الإغريقية الهلينية بالثقافات الشرقية المختلفة للشعوب الخاضعة له، كما أسس أكثر من عشرين مدينة تحمل اسمه في أنحاء مختلفة من إمبراطوريته، أبرزها وأشهرها هي مدينة الإسكندرية في مصر. كما أدّى إنشاء الإسكندر للمستعمرات الإغريقية الكثيرة في طول البلاد وعرضها، إلى خلق حضارة هلينية جديدة استمرت مظاهرها بارزة في تقاليد الإمبراطورية البيزنطية حتى منتصف القرن الخامس عشر. استحال الإسكندر شخصيةً بارزة في الأساطير والقصص والتاريخ اليوناني والعالمي تقريبًا، حتى قام مقام البطل الأسطوري آخيل، وأصبح المقياس الذي يُحدد القادة العسكريون بناءً عليه نجاح أو فشل مسيرتهم، وما زالت المدارس العسكرية حول العالم تُدرّس أساليبه وتكتيكاته الحربيّة حتى الوقت الحالي.",
]
sections = [
  { "title" = "بداية حياته", "paragraphs" = [
      "وُلد الإسكندر في اليوم السادس من شهر «هيكاتومبايون» (باليونانية: Ἑκατομϐαιών) بحسب التقويم الإغريقي القديم، الموافق ليوم 20 يوليو من سنة 356 ق.م على الأرجح،",
      "في مدينة پيلا عاصمة مملكة مقدونيا. والده هو الملك فيليپ الثاني المُلقب بالأعور، ووالدته هي أوليمپياس ابنة نيوبطليموس الأول ملك إقليم إيپيروس، وهي الزوجة الرابعة لفيليپ. وعلى الرغم من أن الأخير كان متزوجًا بسبع أو ثمانية نساء، إلا أن أوليمپياس كانت المفضلة لديه وأقربهنّ إليه لفترة من الزمن على الأقل، ويُرجح أن سبب ذلك هو إنجابها لوريث ذكر له، هو الإسكندر.",
      "تحيط عدّة أساطير بولادة الإسكندر وبنشأته. فوفقًا للكاتب الإغريقي القديم پلوتارخ، رأت أوليمپياس في نومها في ليلة زواجها من فيليپ أن صاعقةً أصابت رحمها، فتولّدت عنها نارًا انتشرت «في كل مكان» قبل أن تنطفئ. وبعد مرور فترة على الزواج، قيل أن فيليپ رأى نفسه في المنام وهو يختم رحم زوجته بخاتم عليه صورة أسد. قدّم پلوتارخ في كتاباته عدّة تفسيرات لتلك المنامات، منها: أن أوليمپياس كانت حاملاً من قبل الزواج، وما يدل على ذلك هو رحمها المختوم؛ أو أن والد الإسكندر الحقيقي هو زيوس كبير آلهة الإغريق. انقسم الإخباريون القدماء حول ما إذا كانت أوليمپياس قد نشرت قصة أصول الإسكندر الإلهية، وأكدتها للإسكندر نفسه، أو أنها رفضت هذا التفسير أساسًا واعتبرته كفرًا.",
    ] },
  { "title" = "وريث فيليپ", "paragraphs" = [
      "أنهى الإسكندر تعليمه في سن السادسة عشرة، وفي ذلك الحين غادر والده فيليپ ليشن حربًا على بيزنطة، فترك شؤون الحكم في بلاده إلى ابنه الشاب، فحكم الإسكندر بالنيابة عن والده بصفته وليًا للعهد. بعد مغادرة فيليپ، ثارت القبائل الميدية التراقية على الحكم المقدوني مستغلة حداثة سن الإسكندر وعدم درايته بالشؤون السياسية والحربية، لكن الأخير فاجأهم، ورد عليهم ردًا قاسيًا، فأجلاهم عن مناطقهم ووطن فيها أغريقًا، وأسس مدينة أسماها «ألكساندروپولس» أي «مدينة الإسكندر».",
      "بعد عودة فيليپ، أُرسل الإسكندر على رأس قوة عسكرية صغيرة إلى جنوب تراقيا لإخضاع الثورات القائمة فيها. بدأت هذه الحملة بالهجوم على مدينة «پيرينثوس»، حيث يُقال أن الإسكندر أنقذ حياة والده عند تعرضه لهجوم، وفي ذلك الحين كانت مدينة أمفيسا قد شرعت بالتوسع في أراض وقف بالقرب من دلفي، تعتبر أراض مقدسة ومكرسة لخدمة الإله أپولو، فاستغل فيليپ هذه القضية للتدخل في الشؤون اليونانية، معتبرًا أنه يُدافع عن الدين ويحمي المقدسات من التدنيس. ولمّا كان فيليپ لا يزال مشغولاً بالصراع في تراقيا، أمر الإسكندر بأن يحشد جيشًا ويتحضر لحملة على اليونان. لجأ الإسكندر إلى الخديعة وتظاهر بأنه يعزم مهاجمة أليريا عوض أمفيسا، خوفًا من أن تثور مدن يونانية أخرى وتهب لمجابهته ومساعدة شقيقتها. وفي خضم هذه الفوضى، هاجم الأليريون مقدونيا فعلاً، فأسرع الإسكندر وردهم على أعقابهم.",
      "انضم فيليپ وجيشه إلى الإسكندر في سنة 338 ق.م، وسارا جنوبًا عبر ممر «البوابات الحارقة»، بعد مقاومة شرسة وعنيدة من الحامية الطيبية المعسكرة في المنطقة، وتابعا طريقهما ليفتحا مدينة إلاتيا، التي تبعد مسافة بضعة أيام فقط عن كل من طيبة وأثينا. صوّت الأثينيون، بزعامة الخطيب ديموستيني، على التحالف مع طيبة لدرء الخطر المقدوني، فأرسلوا سفراء إلى المدينة المذكورة يخبروهم بالمقترح، وكان فيليپ في الوقت نفسه قد أرسل سفراءً بدوره لجذب الطيبيين إلى صفه، لكن أبناء المدينة رفضوا عرض مقدونيا، وفضلوا التحالف مع إخوانهم الأثينيين. سار فيليپ وجنوده حتى وصلوا أمفيسا، واعتقلوا كافة المرتزقة الذين أرسلهم ديموستيني إلى هناك ليناوشوا الجيش المقدوني، وأمام هذا الأمر استسلمت المدينة للمقدونيين، ثم عاد هؤلاء إلى إلاتيا حيث أرسل فيليپ عرض السلام الأخير إلى كل من أثينا وطيبة، لكنهم رفضوه مجددًا.",
    ] },
  { "title" = "ملك مقدونيا", "paragraphs" = [
      "عام 336 ق.م، كان فيليپ قد توجه إلى إيجة لحضور حفل زفاف ابنته كليوپترا على إسكندر الأول ملك إيپروس، أخ زوجته أوليمپياس، فاغتاله قائد حرسه الشخصي، المدعو «پوسانياس الأورستيادي»،ثم جرى ناحية بوابة المدينة محاولاً الفرار، لكنه تعثّر بحبل كرمة، فأمسك به ملاحقوه وقتلوه فورًا، وكان من بينهم اثنان من أصحاب الإسكندر، وهما: پيرديكاس وليونّاتوس. بعد مقتل فيليپ بايع النبلاء الإسكندر ملكًا على عرش مقدونيا وقائدًا عامًا لجيشها، وهو لم يتخط العشرين من عمره.",
      "بدأ الإسكندر عهده بإبادة خصومه الذين يُحتمل أن يبرز منهم شخصًا يُنازعه على عرش المملكة، فأمر بإعدام ابن عمه أمينتاس الرابع، المنافس الأبرز والمدعي بالحق في عرش مقدونيا، وأميرين مقدونيين آخرين من إقليم «لينخستس»، لكنه أعفى عن ثالث هو «إسكندر اللينخستي». كذلك أمرت أوليمپياس بإعدام كليوپترا يوريديس، الزوجة الأخيرة لفيليپ، وابنتها يوروپا، التي أنجبتها منه، فأحرقتا حيتين. ويظهر أن الإسكندر لم يكن موافقًا أو راغبًا بإعدام تلك المرأة وابنتها البريئة، إذ تنص المصادر على أنه استشاط غضبًا لمّا عرف بموتهما. من الأشخاص الآخرين الذين طالهم سيف الإسكندر أيضًا: أتالوس، الذي كان قائدًا لحرس الحدود في الجيش المرابط في آسيا الصغرى، وعمًا لكليوپترا يوريديس، إذ تواصل حينها مع الزعيم الأثيني ديموستيني بخصوص إمكانية انشقاقه عن الجيش المقدوني والتحاقه بجيش أثينا. كما كان الإسكندر ما يزال حاقدًا على أتالوس بعد أن أهانه علنًا في حفل زفاف ابنة أخيه على فيليپ، وبعد وفاة الاثنين وإثبات اتصاله مع الأثينيين، أقدم الإسكندر على إعدامه والتخلص من شروره. عفا الإسكندر عن أخيه غير الشقيق فيليپ آرهيدايوس لإصابته بإعاقة عقلية، ولعلّ ذلك مردّه السم الذي وضعته له أوليمپياس خفيةً.",
      "بعد أن انتشر خبر وفاة فيليپ، ثارت عدّة مدن خاضعة لمقدونيا وانتفضت على حكّامها، وكان من ضمنها: طيبة، وأثينا، وثيساليا، بالإضافة للقبائل التراقية قاطنة الأراضي شمال المملكة. وما أن وصلت أخبار الثورة مسامع الإسكندر حتى قام وجهّز جيشًا قوامه 3,000 فارس، على الرغم من أن مستشاريه نصحوه باعتماد الحلول الدبلوماسية، وسار به جنوبًا ناحية ثيساليا، وما أن وصل المعبر الفاصل بين جبل الأولمپ وجبل أوسا، حتى فوجئ بالثيساليين وقد احتلوه وتمركزت قواتهم فيه، فأمر رجاله بتسلق جبل أوسا والالتفاف حول الثيساليين ومباغتتهم. صُدم الثيساليون حين استفاقوا صباح اليوم التالي ليجدوا المقدونيين قد أصبحوا خلف مؤخرة جيشهم، فاستسلموا على الفور، وانضم فرسانهم طواعيةً إلى جيش الإسكندر، الذي أكمل المسير جنوبًا إلى شبه جزيرة المورة.",
    ] },
  { "title" = "فتح الإمبراطورية الفارسية", "paragraphs" = [
      "عبر الإسكندر مضيق الدردنيل سنة 334 ق.م بجيش قوامه 48,100 جندي من المشاة، و6,100 من الفرسان ، وأسطول سفن مكوّن من 120 سفينة بلغ عدد أفراد طاقمها 38,000 نفر، أحضروا من مقدونيا ومختلف المدن اليونانية. كما ضمّ الجيش عدد من المرتزقة والمحاربين الإقطاعيين من تراقيا، وپايونيا، وأليريا. أظهر الإسكندر نيته في غزو كافة أراضي الإمبراطورية الفارسية عندما غرز رمحًا في البر الآسيوي أوّل ما وطأه قائلاً أنه قبل آسيا هدية لشخصه من الإلهة. أظهرت هذه الحادثة أيضًا أمرًا مهمًا آخر، وهو توق الإسكندر لقتال الفرس ، وميله نحو الحلول العسكرية، على العكس من والده، الذي كان يُفضل الحلول الدبلوماسية على الدوام. اشتبك المقدونيون مع الفرس في أوّل معركة على ضفاف نهر گرانیکوس، المعروف حاليًا باسم «نهر بیگا»، شمال غرب آسيا الصغرى بالقرب من موقع مدينة طروادة، حيث انهزم الفرس وسلّموا مفاتيح مدينة «سارد» عاصمة ذلك الإقليم، إلى الإسكندر، الذي دخلها ظافرًا، واستولى على خزائنها، ثم تابع تقدمه على طول ساحل البحر الأيوني. ضرب الإسكندر الحصار على مدينة هاليكارناسوس الواقعة في إقليم كاريا، لتكون بذلك أوّل مدينة يحاصرها، وقد كان الحصار ناجحًا لدرجة أن قائد المرتزقة في المدينة، المدعو «ممنون الرودسي» وحاكم الإقليم الفارسي «أُراندباد» المقيم بالمدينة، اضطرا إلى الانسحاب منها عن طريق البحر. سلّم الإسكندر حكم كاريا إلى «أدا الكاريّة»، وهي حاكمة سابقة للإقليم، أعلنت ولائها لمقدونيا وتبنّت الإسكندر تبنيًا رسميًا حتى يؤول إليه حكم الإقليم شرعًا بعد وفاتها.",
      "تقدم الإسكندر وجيشه من هاليكارناسوس إلى منطقة ليكيا الجبلية في جنوب الأناضول فسهل پامفيليا، فاتحًا كل المدن الساحلية الواحدة تلو الأخرى حارمًا الفرس من الكثير من الموانئ البحرية الهامّة. سار الإسكندر إلى داخل الأناضول بعد فتح پامفيليا، بما أن باقي الخط الساحلي لم يحو أية موانئ أو قواعد بحرية بارزة، ولمّا وصل مدينة ترمسوس الپيسيديّة، عدل عن اقتحامها بعد أن شبهها بعش عقاب، الطائر المجسد لكبير الآلهة زيوس، حيث خاف أن يؤدي عمله ذلك إلى غضب زيوس عليه وعدم توفيقه في حملته. بعد ترمسوس كانت گورديوم المحطة التالية للإسكندر وجيشه، وفيها قام بحل العقدة الگوردية غير المحلولة قبلاً، التي قيل بأن أحدًا لن يقدر على حلّها سوى ملك آسيا الحق. يفيد المؤرخون بأن الإسكندر قطع العقدة بسيفه قائلاً أنه من غير الضروري معرفة الطريقة الصحيحة لحلها.",
      "بعد أن أمضى الإسكندر وجيشه الشتاء بكامله يغزون ويفتحون المدن والقلاع الحصينة في آسيا الصغرى، تابعوا زحفهم جنوبًا وعبروا بوابات قيليقية سنة 333 ق.م، فالتقوا بالفرس ثانية عند إسوس يقودهم الشاه دارا الثالث بنفسه، فاشتبك الجيشان في معركة حامية الوطيس أسفرت عن تحقيق الإسكندر لنصر حاسم، وانكسار الجيش الفارسي وفرار الشاه ناجيًا بحياته، ووقعت في الأسر زوجته وابنتيه وأمه «سيسيگامبيس»، وغنم المقدونيون كنزًا عظيمًا كان قد حمله معه، وكميات هائلة من المؤن والأسلحة. عرض الشاه إبرام معاهدة سلام مع الإسكندر يحتفظ الأخير بموجبها بما فتحه من الأراضي، وأن يطلق سراح عائلته مقابل 10,000 طالن. ردّ الإسكندر على هذا المقترح بأنه هو وحده من لديه الحق بتقسيم أراضي آسيا، بما أنه استحال سيدها، فلا يحق لدارا أو أي كان أن يحدد له ما يحتفظ به وما يتركه.",
    ] },
  { "title" = "إرث الإسكندر", "paragraphs" = [
      "يمتد إرث الإسكندر ليشمل أمورًا كثيرة غير فتوحاته العسكرية، فقد أدّت حملاته إلى زيادة الاتصال والطرق التجارية بين العالم الغربي والعالم الشرقي، وأدخلت الثقافة والحضارة الإغريقية إلى الكثير من نواحي الحياة الشرقية. استحالت الكثير من المدن التي أسسها الإسكندر مراكز ثقافية كبرى، وما زال بعضها قائمًا حتى الوقت الحالي. قام المؤرخون الإغريق الذين رافقوا الإسكندر في حملاته بتسجيل معلومات قيّمة عن المناطق التي عبروها، وأخذ اليونانيون يشعرون لأول مرّة أنهم يعيشون في عالم أكبر من عالمهم المتوسطي الذي عهدوه.",
      "إن أبرز وأهم إرث تركه الإسكندر هو دون شك مدّ النفوذ المقدوني إلى مساحات شاسعة داخل آسيا. وصلت مساحة إمبراطورية الإسكندر عند وفاته إلى 5.200.000 كم2، لتكون بذلك أكبر دولة شهدها ذلك العصر. استمرت معظم هذه المناطق خاضعة للمقدونيين سواء بشكل مباشر أو غير مباشر، طيلة السنوات المئتين أو الثلاثمائة التالية، وكانت دول خلفاء الإسكندر أو ملوك طوائف الإسكندر أقوى دول العالم، في بداية عهدها على الأقل، لذلك دأب المؤرخون على تسمية العهد الممتد عبر هذه السنوات بالحقبة الهلنستية.",
      "كانت الأقاليم الواقعة على الحدود الشرقية للإمبراطورية المقدونية قد بدأت تستقل الواحدة تلو الأخرى عندما كان الإسكندر لا يزال حيًا. تسبب الفراغ السياسي الذي صنعه الإسكندر في شمال غرب شبه القارة الهندية في ظهور إحدى أعظم السلالات الحاكمة الهندية عبر التاريخ، ألا وهي السلالة الماورية التي أسسها الإمبراطور چاندراگوپتا ماوریا، ذو الأصول المتواضعة، بعد أن سيطر على البنجاب واتخذها قاعدةً لإطلاق الحملات العسكرية لفتح أراضي إمبراطورية الناندا.",
    ] },
]

[articles.ru]
text = "Алекса́ндр Македо́нский (Александр III Великий, др.-греч. Ἀλέξανδρος Γ' ὁ Μέγας; предположительно 20/23 июля или 6/10 октября 356 года до н."
title = "Александр Македонский"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80_%D0%9C%D0%B0%D0%BA%D0%B5%D0%B4%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9"
intro = [
  "Алекса́ндр Македо́нский (Александр III Великий, др.-греч. Ἀλέξανδρος Γ' ὁ Μέγας; предположительно 20/23 июля или 6/10 октября 356 года до н. э., Пелла — 10 или 13 июня 323 года до н. э., Вавилон) — царь Македонии из династии Аргеадов (с 336 года до н. э.), выдающийся полководец, создатель мировой державы, распавшейся после его смерти.",
  "После гибели своего отца Филиппа II Александр в возрасте 20 лет был объявлен царём. Он подавил восстание фракийцев и заново подчинил Грецию, где были разрушены мятежные Фивы. В 334 году до н. э. Александр переправился в Малую Азию, начав таким образом войну с Персидской державой. При Гранике он разгромил сатрапов, а при Иссе (333 год до н. э.) — самого царя Дария III, после чего подчинил Сирию, Иудею и Египет. В 331 году до н. э. при Гавгамелах в Месопотамии Александр одержал решающую победу. Дарий позже был убит; Александр, заняв внутренние районы Персии, принял титул «царь Азии», окружил себя представителями восточной знати и начал думать о завоевании мира. За три года (329—326 годы до н. э.) он завоевал Среднюю Азию, а потом вторгся в Индию, но утомлённое войско отказалось идти дальше. Александр повернул назад и в 324 году до н. э. прибыл в Вавилон, ставший его столицей. В следующем году, во время подготовки к походу в Аравию, Александр умер в возрасте тридцати двух лет.",
  "Созданная в ходе завоеваний держава вскоре распалась, разделённая между полководцами царя — диадохами. Тем не менее благодаря походам Александра началось распространение греческой культуры на Востоке, заложившее основу эллинизма.",
  "Александр ещё в античную эпоху был признан одним из величайших полководцев в истории. Его имя активно использовалось в политической пропаганде. В Средние века одной из самых популярных книг в Европе и ряде регионов Азии и Африки стал «Роман об Александре», наполнивший биографию заглавного героя вымышленными эпизодами; в мусульманской традиции Александра начали отождествлять с Зу-ль-Карнайном. В эпоху барокко македонский царь стал популярным персонажем театра и живописи.",
]
sections = [
  { "title" = "Биография", "paragraphs" = [
      "Александр принадлежал к династии Аргеадов, которая правила Македонией с начала её истории. Античные авторы причисляют эту династию к Гераклидам; согласно легенде, Теменид Каран (младший брат царя Аргоса Фидона и потомок Геракла в одиннадцатом поколении) либо его потомок Пердикка в VII веке до н. э. переселился из Пелопоннеса на север, где основал своё царство. Сын Пердикки Аргей дал своё имя династии. Его отдалённым потомком стал Александр III.",
      "До IV века до н. э. Македония была небольшим и слабым царством, страдавшим от вторжений фракийцев и иллирийцев с севера, от эллинской экспансии с юга. Хотя македоняне говорили, по-видимому, на одном из диалектов греческого языка, греки считали их варварами. Дед Александра Аминта III, принадлежавший к младшей ветви династии и захвативший власть путём убийства предшественника, сохранил своё положение только благодаря лавированию между разными государствами Эллады. Его сын Филипп II смог резко увеличить государственные доходы, создать сильную армию, подчинить князей Верхней Македонии, разбить северных соседей и начать по одному покорять греческие полисы. Женой Филиппа и матерью Александра была эпирская царевна Олимпиада — дочь царя Неоптолема I из династии Пирридов, чьё происхождение возводили к Ахиллу. Таким образом, Александр и по мужской, и по женской линиям считался потомком богов и величайших героев древности. Осознание этого факта существенно повлияло на формирование его личности.",
      "Филипп II был женат в общей сложности семь раз, причём жил со всеми жёнами одновременно. Полнородной сестрой Александра была Клеопатра. Кроме того, у Александра были единокровный брат Арридей (от Филинны из Ларисы) и единокровные сёстры: Фессалоника (от Никесиполиды из Фер), Кинана (от иллирийской княжны Аудаты), Европа (от Клеопатры). Арридей был на год старше брата, но страдал слабоумием, так что Александр считался единственно возможным наследником своего отца.",
    ] },
  { "title" = "Градостроительная политика Александра", "paragraphs" = [
      "За время восточного похода Александр основал целый ряд городов, названных в его честь Александриями. По мнению Ф. Шахермайра, первый из таких городов мог появиться недалеко от Исса в 333 году до н. э.; другие историки, правда, относятся к этому предположению скептически. В 331 году до н. э. недалеко от канопского устья Нила появилась Александрия Египетская, причём царь лично выбрал место, определил, где должны быть построены городские стены, и где должна будет находиться агора. Новый город быстро стал крупнейшим торговым и культурным центром Средиземноморья.",
      "Все остальные Александрии были основаны в глубине бывшей Персидской державы к востоку от Тигра. Плутарх утверждает, что всего царь основал 70 городов, но исследователи в большинстве своём считают это преувеличением: в ряде случаев речь могла идти о создании всего лишь незначительных опорных пунктов или о неосуществлённых планах. Разные учёные пишут о 34, 16 или 13 Александриях. В источниках фигурируют Александрия Кавказская у подножия горы, где, согласно мифам, был распят Прометей (близ Баграма или на месте нынешнего Чарикара); Александрия Танаисская, построенная за 17 дней; Александрия Маргиана в одноимённой сатрапии (в Мервском оазисе); Александрия Оксиана (в районе современного Куляба) и Александрия Эсхата (предположительно на месте Худжанда) в Согдиане; Александрия Бактриана, Александрия Ариана, Александрия Арахосия (на месте Кандагара). В Индии Александр построил города Никея и Букефалы на разных берегах Гидаспа, а Гефестион с Пердиккой — Оробатиду. Четыре Александрии были основаны в бассейне Инда (все они погибли во время завоеваний Чандрагупты), две в Гедросии, одна в Кармании.",
      "Мнения о целях градостроительной политики царя расходятся: это могли быть защита торговых путей, закрепление власти над завоёванными территориями, попытка Александра сделать свою империю более однородной в культурном отношении, создав на Востоке очаги эллинской цивилизации. Как правило, город основывался неподалёку от уже существовавших небольших поселений. Армия возводила стены и шла дальше, а остальными постройками занимались колонисты. О составе изначального поселения этих городов известно очень мало. Точные сведения сохранились только о двух Александриях, в одной из которых царь поселил 7 тысяч ветеранов-македонян, а в другой — какое-то количество греческих наёмников, македонян, считавшихся не годными к военной службе или «мятежными», и «варваров» с окружающих территорий. Предположительно во всех случаях в новом городе селились и греки, и македоняне, и варвары, так что состав населения изначально был крайне пёстрым. Для многих жителей статус колониста был тяжёлым наказанием, так как означал фактическую вечную ссылку; известно о ряде восстаний поселенцев, целью которых было вернуться домой, на Балканы.",
    ] },
  { "title" = "После смерти", "paragraphs" = [
      "Александр скончался, не оставив распоряжений о преемниках. Согласно легенде, перед смертью он передал своё кольцо с печатью Пердикке, который должен был стать регентом при беременной царице Роксане и её будущем сыне. Месяцем позже Роксана действительно родила сына, названного в честь отца Александром. Но верховную власть регента вскоре стали оспаривать другие военачальники (диадохи), стремившиеся самостоятельно править своими сатрапиями. В 321 году до н. э. дело дошло до открытого конфликта, в котором Пердикка погиб. Войны диадохов шли почти непрерывно до 281 года до н. э., когда погибли последние военачальники Александра. Их потомки воцарились в нескольких государствах, образовавшихся на месте некогда огромной державы.",
      "Все Аргеады стали жертвами борьбы за власть. Брат Александра Арридей, на некоторое время ставший царём-марионеткой под именем Филиппа III, был убит в 317 году до н. э. по приказу Олимпиады, как и его жена Эвридика (родная племянница его и Александра); сама Олимпиада годом позже стала жертвой Кассандра, сына Антипатра; сестра Александра Клеопатра погибла в 308 году до н. э., и в её гибели винили диадоха Антигона. Наконец, в 309 году до н. э. Кассандр приказал убить Роксану и Александра IV, и тогда же диадох Полиперхон убил Геракла, сына Александра от наложницы Барсины. Это означало конец династии Аргеадов.",
      "Диадох Птолемей завладел забальзамированным телом Александра и в 322 году до н. э. перевёз его в Мемфис. Там мумия, скорее всего, хранилась в храме Серапейон, а впоследствии (вероятно, по инициативе Птолемея Филадельфа) была перевезена в Александрию. В 30 году до н. э. её коснулся первый римский император Октавиан, неловким движением отломив нос. В последний раз мумия Александра упоминается в связи с посещением Александрии в 215 году императором Каракаллой: последний в знак особого почтения возложил на усыпальницу свои тунику и кольцо.",
    ] },
  { "title" = "Личность", "paragraphs" = [
      "Согласно Плутарху, Александр был очень светлокожим, и местами белизна его кожи переходила в красноту (особенно на лице и на груди). Точнее всего, по словам историка, изображал внешность царя скульптор Лисипп, которому удалось воспроизвести самые характерные особенности — «лёгкий наклон шеи и томность взгляда». П. Фор пишет о «нежном овале вечно безбородого лица», изяществе, вечной озабоченности уходом за своим телом. Богатырским сложением царь не отличался и к атлетическим состязаниям был равнодушен, предпочитая охоту, состязания поэтов и музыкантов.",
      "Клавдий Элиан (ок. 175 — ок. 235 гг.) в своём сочинении «Пёстрые рассказы» (12.14) описывает цвет волос Александра словом ξανθὴν (ксантин), которым греки обозначали светлые волосы, включая коричневые. Иногда утверждается, что Александр имел глаза разного цвета, однако это утверждение опирается на псевдоисторический роман «История Александра Великого». Реконструкция, основанная на сохранившихся следах оригинальной краски на Сидонском саркофаге, показывает, что Александр был изображён на нём с карими глазами и каштановыми волосами.",
      "Черты расчётливого политика сочетались в Александре с бешеным темпераментом (многие исследователи считают, что первое он унаследовал от отца, а второе — от матери). Царь был, как правило, мягок в обращении с окружающими, но при этом испытывал вечную потребность быть любимым и был склонен к резким перепадам настроения. Он стремился во всём быть первым, из-за чего в каждом бою бросался в гущу схватки. Его раны перечисляет Плутарх:",
    ] },
  { "title" = "Память об Александре", "paragraphs" = [
      "Образ Александра занимает уникальное место в мировой культуре: по оценкам исследователей, ни один другой исторический деятель не становился объектом столь пристального внимания со стороны деятелей искусства и науки, героем столь многих и столь разнообразных интерпретаций. На огромной территории, включавшей всю Европу, существенную часть Азии и Африки, для многих правителей и военачальников — от собственных диадохов до Адольфа Гитлера — Александр был примером для подражания. Даже сейчас вожди многих афганских племён возводят к нему свою родословную, а два государства, Греция и Северная Македония, спорят о том, кто из них является истинным наследником Александра.",
      "Имя Александра очень активно использовалось в политической пропаганде в первые годы после смерти царя. Так, Пердикка обосновывал своё право на регентство тем фактом, что именно ему умирающий царь передал свой перстень. Боровшийся за единство империи Эвмен из Кардии, чтобы удержать под контролем армию, объявил подчинённым, что Александр во сне пообещал ему незримо присутствовать на всех заседаниях военного совета. Сатрап Персиды Певкест посвятил Александру и его отцу алтарь в Персеполе, а сатрап Египта Птолемей учредил в Александрии полноценный культ умершего царя, под чью защиту поставил собственную особу. Наконец, Олимпиада, начав в 317 году до н. э. войну против Арридея и поддержавшего его Кассандра, обвинила последнего в том, что он организовал отравление Александра через своего брата Иоллу, и ту же информацию распространял Антигон.",
      "Плутарх сообщает, что все первые эллинистические цари старались доказать своё сходство с Александром — «пурпурными облачениями, свитой, наклоном головы да высокомерным тоном»; с оружием в руках это сходство доказывал только двоюродный племянник македонского царя Пирр. «О нём много говорили и считали, что и внешностью своей, и быстротой движений он напоминает Александра, а видя его силу и натиск в бою, все думали, будто перед ними — тень Александра или его подобие». С македонским царём сравнивали Селевкида Антиоха III, который тоже совершил большой восточный поход и получил за это прозвание Великий. Мнимым родством с Александром обосновывали свои политические претензии цари Македонии Филипп V и Персей, а также Псевдо-Александр, поднявший антиримское восстание в 142 году до н. э. Царь Понта Митридат VI Эвпатор чеканил монеты, на которых его портрет был явно стилизован под изображения Александра, и хранил одеяние македонского царя.",
    ] },
]

[articles.vi]
text = "Alexandros III của Macedonia (tiếng Hy Lạp cổ: Αλέξανδρος Γʹ ὁ Μακεδών, Aléxandros III ho Makedȏn), thường được biết đến rộng rãi với cái tên Alexander Đại đế (tiếng Hy Lạp: Μέγας Αλέξανδρος Megas Alexandros, tiếng Latinh: Alexander Magnus), hay còn được một số tài liệu tiếng Việt gọi bằng tên Hán-Việt A Lịch Sơn đại đế (20/21 tháng 7 năm 356 TCN – 10/11 tháng 6 năm 323 TCN), là basileus (quốc vương) thứ 14 thuộc nhà Argead của Vương quốc Macedonia cổ đại. Trong suốt cuộc đời binh nghiệp của mình, Alexandros đã chinh phạt gần như toàn bộ thế giới mà người châu Âu thời đó biết đến trước khi qua đời và vì thế thường được xem là một trong những vị tướng thành công nhất, cũng như một trong những chiến lược gia quân sự vĩ đại nhất trong lịch sử."
title = "Alexandros Đại đế"
lang = "vi"
url = "https://vi.wikipedia.org/wiki/Alexandros_%C4%90%E1%BA%A1i_%C4%91%E1%BA%BF"
intro = [
  "Alexandros III của Macedonia (tiếng Hy Lạp cổ: Αλέξανδρος Γʹ ὁ Μακεδών, Aléxandros III ho Makedȏn), thường được biết đến rộng rãi với cái tên Alexander Đại đế (tiếng Hy Lạp: Μέγας Αλέξανδρος Megas Alexandros, tiếng Latinh: Alexander Magnus), hay còn được một số tài liệu tiếng Việt gọi bằng tên Hán-Việt A Lịch Sơn đại đế (20/21 tháng 7 năm 356 TCN – 10/11 tháng 6 năm 323 TCN), là basileus (quốc vương) thứ 14 thuộc nhà Argead của Vương quốc Macedonia cổ đại. Trong suốt cuộc đời binh nghiệp của mình, Alexandros đã chinh phạt gần như toàn bộ thế giới mà người châu Âu thời đó biết đến trước khi qua đời và vì thế thường được xem là một trong những vị tướng thành công nhất, cũng như một trong những chiến lược gia quân sự vĩ đại nhất trong lịch sử.",
  "Sau khi các thành bang Hy Lạp cổ đại được thống nhất dưới sự cai trị của vua cha Philipos II, Alexandros chinh phục Đế chế Ba Tư, bao gồm cả Tiểu Á, Syria, Phoenicia, Gaza, Ai Cập, Bactria và Lưỡng Hà và mở rộng biên cương đế chế của ông đến tận Punjab thuộc Ấn Độ ngày nay. Chiến thắng của ông trước quân Ba Tư trong trận Gaugamela – chiến thắng quyết định thứ ba của ông trước vua Ba Tư Darius III – được xem là một trong những chiến công hiển hách nhất trong thời kỳ cổ đại; không những thế ông còn đánh tan tác người Scythia – một dân tộc bách chiến bách thắng thời bấy giờ. Alexandros thực hiện một chính sách hòa hợp: ông đưa cả những người ngoại quốc (không phải người Hy Lạp hay người Macedonia) vào chính quyền và cả quân đội của mình, khuyến khích hôn nhân giữa các tướng sĩ của mình với người nước ngoài và chính ông cũng lấy vợ ngoại quốc. Sau mười hai năm liên tục thân hành cầm quân đánh đâu thắng đó, vua Alexandros Đại Đế qua đời, có lẽ là bởi sốt rét, thương hàn, hay viêm não do virút. Có người cho rằng ông mất do bị đầu độc bởi các quan chức Hy Lạp thời đó.",
  "Di sản của Alexandros bao gồm sự phổ biến văn hóa và sự nguyên hợp hình thành nên từ những tác động do các cuộc chinh phạt của ông đã gây ra, mà điển hình là Phật giáo Hy Lạp. Ông đã cho thành lập khoảng bảy mươi thành phố mang tên mình, nổi bật nhất trong số đó là Alexandria ở Ai Cập. Những thành phố mới được di dân Hy Lạp sinh sống, cùng với sự truyền bá rộng rãi của văn hóa Hy Lạp ở phía đông đã tạo nên một văn minh Hy Lạp mới, mà những khía cạnh vẫn còn thể hiện rõ trong những phong tục tập quán của Đế quốc Đông La Mã còn tồn tại đến gần 2000 năm sau. Bản thân ông cũng sống trong lịch sử và trong các truyền thuyết của các nền văn hóa Hy Lạp và không Hy Lạp. Ngay khi ông còn sống, và đặc biệt sau khi ông qua đời, những cuộc chinh phạt của ông đã là nguồn cảm hứng của một truyền thống văn học mà trong đó ông xuất hiện như là một anh hùng huyền thoại theo truyền thống của Achilles (Asin) năm xưa. Ông bất bại trên chiến trường và trở thành thước đo của các vị chỉ huy quân sự. Cho tới ngày nay, các học viện quân sự trên khắp thế giới vẫn giảng dạy chiến thuật của ông. Alexandros Đại Đế thường được xếp hạng là một trong số những người có ảnh hưởng nhất mọi thời đại.",
]
sections = [
  { "title" = "Thời thơ ấu", "paragraphs" = [
      "Alexandros sinh ra tại Pella, kinh đô của vương quốc Macedonia, vào ngày 20 hoặc 21 tháng 7 năm 356 TCN. Ông là con trai của vua Macedonia Philippos II thuộc vương triều Argos và người vợ thứ tư là Olympias, công chúa xứ Ipiros thuộc vương triều Aiakides. Dù Philippos II có tới tận 7 hoặc 8 bà vợ, nhưng Olympias đã từng có khoảng thời gian làm chính thất, có lẽ là vì bà đã hạ sinh ra Alexandros. Sau khi Alexandros lên một tuổi, mẹ ông cũng đã hạ sinh cho ông một người em gái tên là Cleopatra vào năm 355. Ông là cháu gọi vua Alexandros Molossus của Ipiros bằng cậu. Thông qua cha mình, Alexandros được coi là hậu duệ của Temenos, một người mà bản thân ông được cho là hậu duệ của anh hùng Heracles, con trai thần Zeus. Thông qua mẹ của mình, Alexandros được coi là là hậu duệ của Neoptolemos, con trai Achilles – chiến binh vĩ đại nhất của quân Hy Lạp trong cuộc chiến thành Troia.",
      "Có nhiều truyền thuyết xung quanh sự sinh ra và thời thơ ấu của Alexandros. Sử gia Plutarchus ghi lại rằng, nhiều lần ngủ trên giường với vua, hoàng hậu Olympias thích nằm chung với rắn. Có người cho rằng đây là nguyên nhân lớn nhất khiến cho nhà vua ghẻ lạnh với bà và vì vậy, vua không nằm nhiều với bà. Plutarchus cũng kể đến một câu chuyện khác rằng trong đêm trước khi cặp đôi Olympias – Philippos kết hôn với nhau, Olympias nằm mộng thấy sấm sét đánh vào tử cung của bà, và một ngọn lửa sáng rực tự gieo rắc nó thành nhiều đống lửa khác nhau. Còn vua Philippos II thì chiêm bao thấy mình niêm phong tử cung của Olympias, và con dấu niêm phong của ông có in hình một con mãnh sư. Plutarchus cũng đưa ra nhiều giả thuyết khác nhau về những giấc mơ này: Olympias thực chất đã mang thai trước khi cưới Philippos hoặc thần Zeus mới chính là cha ruột của ông.",
      "Aristandros xứ Telmessus cho rằng Hoàng hậu Olympias đang có thai và thai nhi của bà chứa một hoàng nam có tính khí của loài mãnh sư. Các bình luận gia cổ đại đã không thống nhất về việc một Olympias đầy tham vọng đã truyền bá nguồn gốc thần thánh của Alexandros như thế nào, nhiều ý kiến cho rằng bà đã nói điều này với Alexandros nhưng cũng có ý kiến cho rằng bà đã bác bỏ điều này vì nó chẳng tiết hạnh cho lắm. Tuy nhiên, có nhiều tài liệu đã đề cập đến việc Alexandros sử dụng những truyền thuyết này cho mục đích chính trị và ông từng có lần tự nhận mình là con của thần ngay trước mặt phụ vương khi hai người cãi nhau. Một truyền thuyết khác có niên đại từ thế kỷ thứ 3, xuất phát từ Alexandria và được cho là bởi một người gọi là Callisthenes Giả nói rằng, Alexandros thực ra là con trai của vị pharaon cuối cùng của vương triều thứ 30 của Ai Cập Nectanebo II. Sau khi bị Artaxerxes III của Ba Tư đánh bại, Nectanebo II đã phải sống lưu vong tại triều đình của Philippos II ở Pella.",
    ] },
  { "title" = "Người kế thừa của Philippos II", "paragraphs" = [
      "Vào năm 340, Alexandros lúc này mới 16 tuổi và đã hoàn thành xong quá trình học tập với Aristoteles, đã được vua cha triệu về Pella để hướng dẫn cách thức trị quốc. Và khi Philippos xuất quân tiến đánh Byzantion, Alexandros đã được ông tin tưởng chọn làm nhiếp chính, dù xung quanh ông còn có những vị cố vấn giàu kinh nghiệm như Antipatros. Vào năm 339, trong lúc Philippos đang ở xa, bộ lạc Maedi tộc Thracia nổi dậy làm phản. Alexandros đã phản ứng với sự kiện này một cách nhanh chóng. Chiến dịch đầu tiên do đích thân Alexandros chỉ huy đã thành công mỹ mãn khi ông đuổi được người Maedi ra khỏi quê hương của họ. Ông đã cho thành lập một thành phố trong vùng rừng núi Rila thuộc lãnh thổ Bulgaria ngày nay, đặt tên nó là Alexandropolis là đưa dân Hy Lạp đến sinh sống. Ông cũng nhân cơ hội này tiếp cận với một bộ lạc Agrianes cũng thuộc tộc Thracia và chiêu mộ những binh sĩ ném lao (peltastes) tinh nhuệ từ họ.",
      "Khi Philippos quay trở về, ông đã phái Alexandros dẫn một đội quân nhỏ đến miền nam Thracia để khuất phục các cuộc nổi loạn tại đây. Trong chiến dịch bình định thành Perinthos của Hy Lạp, Alexandros được cho là đã cứu mạng cha mình. Vào thời điểm này, thành phố Amphissa bắt đầu cho dân chúng trồng trọt trên những vùng đất thiêng liêng đối với Apollo ở gần Delphi. Đây là một sự xúc phạm thần thánh mà đã tạo cho Philippos cơ hội can thiệp sâu hơn vào Hy Lạp. Do lúc này vẫn còn phải đóng quân ở Thracia, ông đã hạ lệnh cho Alexandros tập hợp một đội quân để tiến đánh miền nam Hy Lạp. Lo ngại rằng các quốc gia Hy Lạp khác có thể can thiệp vào cuộc chiến này, Alexandros đã giả vờ là đang sửa soạn binh mã tiến đánh Illyria. Trong thời kỳ hỗn loạn này, người Illyria đã tấn công Macedonia nhưng bị Alexandros đẩy lui. Philippos hội quân cùng con trai vào năm 338 TCN và cả hai cha con cùng nhau tiến quân hướng Thermopylae. Dù quân Thebes cố thủ ở đây một cách quyết liệt, họ cũng phải nhận thất bại trước quân đội Macedonia. Sau chiến thắng này, quân Macedonia chiếm luôn thành Etalea, chỉ nằm cách Athens và Thebes một vài ngày đường. Demosthenes lúc này vận động Athens liên kết với Thebes để chống lại Macedonia. Cả Athens lẫn Philippos đều sai sứ giả đến để lôi kéo Thebes về phía mình, nhưng Thebes cuối cùng đã lựa chọn đứng bên Athens. Philippos hành quân đến Amphissa, bắt giữ đội lính đánh thuê được Demonthenes gửi đến đó và chấp nhận lợi đầu hàng của thành phố. Philippos quay về Elatea và gửi thư chiêu hàng lần cuối đến Athens và Thebes nhưng đều bị cả hai từ chối.",
      "Khi quân Philippos tiến về phía nam, quân Athens và Thebes đã chặn đánh ông tại Chaeronea, Boeotia. Trong trận Chaeronea tiếp đó, Philippos đã chỉ huy cánh phải trong khi Alexandros được tháp tùng bởi nhiều viên tướng dày dặn kinh nghiệm của nhà vua đã chỉ huy kỵ binh ở cánh trái. Philip đã cố tình ra lệnh cho quân mình rút lui, nhử cho quân Athens đuổi theo, qua đó làm vỡ đội hình quân địch. Nhận thấy đã phá vỡ được trận thế quân địch, Philippos hạ lệnh cho binh sĩ quay đầu, nhanh chóng đánh bại toàn bộ quân Athens. Với việc quân Athens thất bại, quân Thebes nay bắt buộc phải độc chiến. Bị bao vây tứ phía, quân Thebes thua trận, ngay cả đội thần binh Thebes – một lực lượng tinh nhuệ được xem là bất khả chiến bại vào thời bấy giờ – cũng bị quân Macedonia tiêu diệt. Sau trận đánh, Philipos tổ chức ăn mừng trọng thể, và đáng để ý là Alexandros không tham dự. Alexandros và Antipatros đã đảm nhận trách nhiệm đưa tro cốt của các tử sĩ về Athens. Chiến thắng này đã làm Philipos yêu quý con trai đến mức ông thích nghe các chiến binh gọi Philipos là vị tướng còn Alexandros mới là vị vua của họ.",
    ] },
  { "title" = "Triều đại của Alexandros", "paragraphs" = [
      "Vào mùa hè năm 336 TCN, Philippos II bị ám sát tại lễ cưới của con gái ông là Cleopatra của Macedonia với cậu của cô là Alexandros I của Ipiros, em trai của Olympias. Kẻ ám sát là một nhà quý tộc trẻ bất mãn Pausanias của Orestis, một người tình đồng tính trước đây của nhà vua và đã được chọn vào đội cận vệ (Somatophylakes). Người này trở nên thù oán vua Philippos II vì nhà vua đã bỏ mặc và không trừng phạt Attalos, người đã chuốc rượu làm cho mình say và đã bị người này hãm hiếp. Khi Pausanias cố gắng tẩu thoát, hắn ta vướng phải một cây nho và bị giết bởi những người rượt đuổi theo hắn, bao gồm hai người bằng hữu của Alexandros, Perdiccas và Leonnatus. Nhiều người cho rằng vụ ám sát Philippos đã được tính toán trước với thông tin và sự tham gia của Alexandros hay Olympias nhưng cũng có nhiều người khác ủng hộ lập trường rằng đây là một động cơ cá nhân. Rất ít nhà sử học đương đại cho rằng Alexandros có liên quan đến vụ giết cha mình khi Philippos rõ ràng cho thấy ông có ý định lập Alexandros làm người kế vị. Một kẻ có khả năng là chủ mưu là Darius III - tân Hoàng đế của Đế quốc Ba Tư khi đó. Nhà sử học Arrianos đề cập đến một lá thư giận dữ từ Alexandros gửi Darius sau trận Issus năm 333 TCN, trong đó ông đổ thừa cho Hoàng đế Darius III và quan Tể tướng Bagoas, cho cái chết của vua cha, nói rằng chính Darius là người đã khoác lác với các thành phố Hy Lạp là ông ta đã tổ chức ám sát Philippos như thế nào. Alexandros cũng sẽ hỏi nhà tiên tri ở đền thờ thần Amun ở Siwa rằng liệu ông có trừng phạt tất cả những kẻ đã sát hại cha mình.",
      "Sau cái chết của Philippos, quân đội và các quý tộc Macedonia đã suy tôn Alexandros, lúc này 20 tuổi, như là vua mới của Macedonia. Alexandros sau khi lên ngôi đã ngay lập tức trừ khử các đối thủ tiềm tàng. Để trừ hậu hoạn, ông đã hạ sát anh họ mình là Amyntas IV, người từng làm vua của Macedonia trong khoảng thời gian từ năm 360 đến 359 TCN trước khi bị Philippos phế truất và tiếm đoạt vương vị. Thái hậu Olympias, lợi dụng sự vắng mặt của con trai mình vì đã đi đến biên giới phía bắc, đã giết chết vợ út của Philippos là Cleopatra bằng cách buộc cô phải treo cổ tự sát sau khi phải nhìn thấy con gái mình, Europa, bị cắt đứt cổ. Alexandros đã rất tức giận khi biết được chuyện này. Alexandros buộc phải ra lệnh trừ khử Attalos, người đang chỉ huy binh mã ở Tiểu Á và cũng là chú của Cleopatra. Attalos tại thời điểm đó có trao đổi thư từ với Demosthenes, dẫn đến khả năng ông ta có thể đào thoát tẩu sang Athens. Attalos trước đây cũng đã nhiều lần sỉ nhục Alexandros, và sau khi Cleopatra chết, Alexandros cho rằng ông ta quá nguy hiểm để có thể cho ông ta sống. Theo lời khuyên từ mẹ, Alexandros cũng đã xử tử Caranos, con trai của Philippos và Phila, cũng như hai hoàng tử xứ Lynkestis. Alexandros đã tha chết cho em trai khác mẹ của mình là Arrhidaeus, người được nhiều nguồn cho là một người đần độn, có lẽ là do Olympias đã đầu độc. Và như thế, vị tân vương của Macedonia không còn có một đối thủ nào có thể tranh giành ngai vàng với ông. Chỉ trong vòng vài tuần sau khi vua cha qua đời, tân vương Alexandros đã nắm vững toàn bộ quyền thống trị Chính phủ và Quân đội Macedonia.",
      "Alexandros không chỉ thừa hưởng từ cha mình ngai vị vua của người Macedonia mà còn những chức vị khác như quan chấp chính trọn đời của người Thessalía và Minh chủ (hegemon) của liên minh Hy Lạp. Các thành bang Hy Lạp như Athena và Thebes, bị bắt buộc phải quy phục Philippos, thấy vị tân vương như là một cơ hội để giành lại hoàn toàn quyền độc lập của họ. Các bạn hữu và quân sư của nhà vua khuyên ông không nên lập lại quyền thống trị của xứ Macedonia tại Hy Lạp và các bộ tộc man rợ lân cận, trước khi ông đảm bảo sự ổn định nội bộ đất nước và sự trung thành tuyệt đối của toàn dân Macedonia. Do đó, họ khuyên ông không nên suy nghĩ sâu xa gì về ý định chinh phạt Ba Tư của tiên vương Philippos II trong vòng vài năm tới. Tuy nhiên, nhà vua quyết định không bỏ qua bất kỳ một lãnh thổ nào mà tiên vương khổ công chiếm lấy, hoặc bất kỳ một dự định hay mục tiêu nào của tiên vương. Vì thế mà ngay sau khi lên ngôi, Alexandros đã ngay lập tức tiến hành các sứ mệnh ngoại giao đến Hy Lạp để ngăn chặn liên minh mà Philippos dày công xây dựng tan rã. Thebes, là thành phố chống lại ông tích cực nhất, đã đầu hàng khi ông xuất hiện ở cửa thành. Tại Eo Corinth, Athens và liên minh Hy Lạp, với ngoại lệ Sparta, đã tôn ông lên làm Minh chủ chống lại quân Ba Tư.",
    ] },
  { "title" = "Những năm cuối tại Ba Tư", "paragraphs" = [
      "Phát hiện rằng rất nhiều tổng trấn và thủ lĩnh các đội quân của ông cư xử không đứng đắn khi ông vắng mặt, Alexandros cho hành hình rất nhiều người trong số họ làm gương trên đường đến Susa. Để biểu lộ thiện chí, ông ban thưởng cho binh lính và thông báo rằng ông sẽ gửi những người lính già và tàn tật về Macedonia dưới quyền của Craterus, nhưng quân đội hiểu nhầm ý định của ông và nổi dậy ở thị trấn Opis. Họ từ chối quay về quê và chỉ trích gay gắt việc ông áp dụng phong tục cũng như cách ăn mặc của người Ba Tư, đồng thời bổ nhiệm các sĩ quan và binh lính Ba Tư vào các đơn vị Macedonia.",
      "Sau hơn ba ngày, vì không thể thuyết phục được các tướng sĩ Macedonia, Alexandros đã bổ nhiệm người Ba Tư vào các chức vụ chỉ huy trong quân đội và phong tước hiệu quân sự Macedonia cho các đơn vị Ba Tư. Thấy sự việc tiến triển theo chiều hướng như vậy, những người Macedonia đã nhanh chóng cầu xin Alexandros tha thứ. Ông đồng ý tha lỗi cho họ và tổ chức một bữa tiệc lớn thiết đãi hàng nghìn người. Với dự định thiết lập mối giao hảo lâu dài giữa những người Macedonia và người Ba Tư, ông tổ chức hàng loạt hôn lễ giữa các sĩ quan của ông và người Ba Tư và cả những phụ nữ quý tộc Susa, nhưng rất hiếm cuộc hôn nhân nào kéo dài được hơn 1 năm. Cũng trong thời gian này, Alexandros trên đường quay trở về Ba Tư nhận được tin người bảo vệ lăng mộ của Cyrus Đại đế ở Pasargadae đã xúc phạm vị vua Ba Tư này. Ông đã nhanh chóng ra lệnh hành hình người bảo vệ này. Alexandros vốn dĩ đã ngưỡng mộ Cyrus Đại đế từ bé. Lúc còn nhỏ, ông Cyropaedia của Xenophon, mô tả Cyrus trong vai trò của một vị vua và nhà lập pháp, cũng như sự anh dũng của ông trên chiến trận. Trong chuyến thăm Pasargadae, Alexandros đã ra lệnh cho kiến trúc sư Aristobulus của mình trang trí lại nội thất bên trong lăng mộ của Cyrus. Không có ghi chép chắc chắn về việc Alexandros chấp nhận cách gọi vua của người Ba Tư là Shahenshah (tức \"Hoàng đế vĩ đại\" hay \"Vua của các vị vua\"). Tuy nhiên, hầu hết các sử gia đều tin rằng ông đã chấp nhận việc đó.",
      "Sau khi xong chuyện ở Pasargadae, Alexandros rời đến Ecbatana để thu thập kho báu Ba Tư được cất giữ ở đó. Tại nơi này, người bạn thân nhất và cũng có thể là người tình đồng giới của ông, Hephaestion, đã qua đời vì bệnh tật hoặc trúng độc. Cái chết của Hephaestion là một đả kích rất lớn đối với Alexandros, khiến ông suy sụp trầm trọng. Ông ra lệnh chuẩn bị một giàn hỏa táng đắt tiền ở Babylon, cũng như hạ chiếu tuyên bố để tang lễ công khai. Quay trở về Babylon, Alexandros lên kế hoạch cho một loạt chiến dịch mới, khởi đầu bằng cuộc xâm lược bán đảo Ả Rập. Tuy nhiên, ông sẽ chẳng có cơ hội thực hiện, vì ông đã qua đời ngay sau cái chết của Hephaestion.",
    ] },
  { "title" = "Di sản", "paragraphs" = [
      "Di sản của Alexandros vượt quá phạm vi của những cuộc chinh phạt quân sự. Những chiến dịch của ông đã gia tăng đáng kể sự tiếp xúc và mậu dịch giữa phương Đông và phương Tây, những vùng đất rộng lớn ở phía đông cũng đã tiếp xúc với nền văn minh Hy Lạp và chịu ảnh hưởng từ nó. Một số những thành phố do ông thành lập đã trở thành những trung tâm văn hóa lớn, một vài trong số đó vẫn còn tồn tại cho tới ngày nay. Những nhà chép biên niên của ông đã ghi lại những thông tin quy giá về những vùng đất mà quân đội Macedonia đi qua, đồng thời bản thân người Hy Lạp cũng có cảm giác thuộc về một thế giới không chỉ giới hạn trong khu vực xung quanh Địa Trung Hải.",
      "Di sản trực tiếp của Alexandros chính là việc đưa những vùng đất rộng lớn mới ở châu Á vào vòng kiểm soát của người Macedonia. Vào thời điểm nhà vua băng hà, đế quốc của ông bao trùm một lãnh thổ có diện tích lên tới khoảng 5.200.000 km2 (2.000.000 dặm vuông Anh), và là quốc gia rộng lớn nhất lúc bấy giờ. Nhiều vùng đất do Alexandros chinh phục vẫn nằm trong tay người Macedonia hoặc dưới sự ảnh hưởng của Hy Lạp cho tới tận 200–300 năm tiếp đó. Các quốc gia kế tục xuất hiện và trở thành những thế lực hùng mạnh (ít nhất là vào giai đoạn đầu). Khoảng thời gian 300 năm này thường được gọi là thời kỳ Hy Lạp hóa.",
      "Biên cương phía đông của đế chế Alexandros đã bắt đầu sụp đổ ngay từ khi ông còn sống. Tuy nhiên, khoảng trống quyền lực mà ông để lại ở khu vực tây bắc của tiểu lục địa Ấn Độ đã trực tiếp giúp một trong những triều đại Ấn Độ hùng mạnh nhất trong lịch sử, đế quốc Maurya, trỗi dậy. Lợi dụng khoảng trống quyền lực này Chandragupta Maurya (được đề cập trong các tư liệu tiếng Hy Lạp dưới tên \"Sandrokottos\"), dù có xuất thân tương đối khiêm tốn, đã có thể lên nắm quyền kiểm soát vùng Punjab, và sử dụng nơi đây làm căn cứ quyền lực để tiến hành chinh phục Đế quốc Nanda.",
    ] },
]

[articles.id]
text = "Aleksander III dari Makedonia (bahasa Yunani Kuno: Ἀλέξανδρος Aléxandros; 20/21 Juli 356 SM – 10/11 Juni 323 SM), lebih dikenal sebagai Aleksander Agung, adalah seorang raja dari Kerajaan Yunani kuno dari Makedonia. Pada usia 20 tahun, ia meneruskan takhta ayahnya, Filipus II dari Makedonia yang tewas dibunuh pada pernikahan Kleopatra dari Makedonia pada bulan Oktober 336 SM."
title = "Aleksander Agung"
lang = "id"
url = "https://id.wikipedia.org/wiki/Aleksander_Agung"
intro = [
  "Aleksander III dari Makedonia (bahasa Yunani Kuno: Ἀλέξανδρος Aléxandros; 20/21 Juli 356 SM – 10/11 Juni 323 SM), lebih dikenal sebagai Aleksander Agung, adalah seorang raja dari Kerajaan Yunani kuno dari Makedonia. Pada usia 20 tahun, ia meneruskan takhta ayahnya, Filipus II dari Makedonia yang tewas dibunuh pada pernikahan Kleopatra dari Makedonia pada bulan Oktober 336 SM. Dimulai tidak lama setelah kematian ayahnya, Alexander menghabiskan sebagian besar waktu kekuasaannya untuk melancarkan kampanye-kampanye militer ke Asia Barat dan Mesir, Asia Tengah, dan Asia Selatan. Pada usia 30 tahun, dirinya telah berhasil membentuk salah satu kekaisaran terbesar sepanjang sejarah, wilayahnya terbentang dari Balkan di barat sampai India di timur. Ia tidak pernah terkalahkan dalam pertempuran dan terkenal luas sebagai salah satu komandan militer tersukses dalam sejarah.",
  "Hingga usianya yang ke 16 tahun, Alexander dididik oleh filsuf ternama, Aristoteles. Pada tahun 335 SM, tak lama setelah ia diangkat menjadi raja atas Makedonia, ia melancarkan kampanye militer di Balkan dan menegaskan kembali kendali atas Trakia dan Iliria, sebelum membawa pasukannya menyerbu kota Thebes, yang kemudian hancur dalam pertempuran. Alexander kemudian dianugerahi jabatan jenderal atas seluruh Yunani, dan menggunakan otoritasnya untuk menyukseskan proyek pan-Hellenik yang dirancang oleh ayahnya, mengambil kendali kepemimpinan atas seluruh orang Yunani dalam upaya mereka menaklukkan Persia.",
  "Pada tahun 334 SM, ia menginvasi Kekaisaran Persia Akhemeniyah dan memulai sejumlah kampanye militer yang berlangsung selama 10 tahun. Selepas penaklukannya atas Anatolia, Alexander memperlemah Akhemeniyah dalam serangkaian pertempuran penting, termasuk pertempuran di Issos dan Gaugamela; ia kemudian berhasil menggulingkan Darius II dan menaklukkan Kekaisaran Akhemeniyah secara keseluruhan. Setelah jatuhnya Persia, Kekaisaran Makedonia menguasai petak wilayah yang luas antara Laut Adriatik dan Sungai Indus. Aleksander mempunyai misi ingin mencapai \"ujung-ujung dari dunia dan Laut Luar Besar.\" Ia pun menginvasi India pada tahun 326 SM, dan mengapai kemenangan penting atas Porus, seorang raja India kuno dari daerah yang sekarang dikenal sebagai Punjab, pada pertempuran Hydaspes. Karena permintaan para pasukannya yang rindu akan kampung halaman mereka, ia pun kembali ke Sungai Beas dan kemudian meninggal pada tahun 323 SM di Babilon, sebuah kota di Mesopotamia yang sebelumnya direncanakan oleh Alexander akan menjadi ibu kota dari Kekaisarannya. Kematian Alexander meninggalkan sejumlah rencana militer dan kampanye dagang yang tidak terlaksana, yang bila dirinya masih hidup akan dimulai dengan invasi Yunani atas Arabia. Dalam beberapa tahun setelah kematiannya, sejumlah perang sipil pecah di bebagai daerah di Kekaisaran Makedonia, yang pada akhirnya berujung pada disintegrasi di tangan para Diadokhoi.",
  "Dengan kematiannya yang menandai dimulainya periode Helenistik, warisan Aleksander mencakup pembauran budaya dan sinkretisme yang ditimbulkan oleh penaklukan-penaklukan yang dilakukan olehnya, seperti Buddha-Yunani dan Yudaisme Helenistik, ia mendirikan lebih dari dua puluh kota yang memakai namanya, dengan yang paling menonjol adalah kota Alexandria di Mesir. Penyebaran budaya Yunani yang ditimbulkan dari ekspansi koloni Yunani oleh Aleksander menimbulkan dominasi luar biasa peradaban Helenistik yang pengaruhnya mencapai timur jauh dari Anak Benua India. Periode Helenistik berkembang melalui Kekaisaran Romawi menjadi budaya Barat modern; Bahasa Yunani menjadi lingua franca wilayah tersebut dan merupakan bahasa utama Kekaisaran Bizantium sampai runtuhnya pada pertengahan abad ke-15 Masehi. Komunitas berbahasa Yunani di bagian tengah dan timur jauh Anatolia bertahan hingga genosida terhadap etnis Yunani oleh Turki pada tahun 1910-an dan awal 1920-an serta pertukaran populasi Yunani menjadi populasi Turki pada pertengahan 1920-an. Alexander menjadi legendaris sebagai pahlawan klasik yang dianggap memiliki sejumlah karakteristik yang serupa dengan Akhilles, ia dicatut dalam berbagai tradisi historikal dan mitos dalam budaya Yunani dan non-Yunani. Capaian militernya dan keberhasilannya yang berulang-ulang dalam berbagai pertempuran yang dianggap belum pernah diperoleh orang lain sebelumnya, telah membuat Alexander menjadi tolok ukur perbandingan oleh banyak pemimpin militer, dan taktik-taktik Alexander terus menjadi subjek studi yang signifikan di akademi-akademisi militer di seluruh dunia.",
]
sections = [
  { "title" = "Masa muda", "paragraphs" = [
      "Aleksander dilahirkan pada tanggal 20 (atau 21) Juli 356 SM, di Pella, ibu kota Kerajaan Makedonia di Yunani Kuno. Ia terlahir sebagai putra Raja Makedonia Filipus II. Ibunya adalah istri keempat Filipus, Olimpias, putri Neoptolemos I, Raja Epiros. Meskipun Filipus memiliki tujuh atau delapan istri ketika itu, tetapi Olimpias adalah istrinya yang paling utama, barangkali karena ia yang melahirkan Aleksander.",
      "Sebagai anggota Wangsa Argead, Aleksander mengklaim diri sebagai keturunan Herakles melalui Karanos dari Makedonia. Dari pihak ibunya dan Aiakid, ia mengklaim diri sebagai keturunan Neoptolemos, putra Akhilles. Putra dari sepupu-kedua Aleksander adalah jenderal Pyrrhos dari Epiros, yang oleh Hannibal dianggap sebagai komandan sehebat Aleksander atau kedua terhebat setelah Aleksander.",
      "Menurut biografer Yunani kuno, Plutarkhos, Olimpias pada malam pernikahannya dengan Filipus, bermimpi bahwa rahimnya disambar petir, yang memicu semburan api yang menyebar sampai \"jauh dan luas\" sebelum padam. Beberapa waktu sebelum pernikahan, dikatakan bahwa Filipus bermimpi melihat dirinya menyegel rahim istrinya dengan menggunakan segel berukir singa. Plutarkhos mengajukan sejumlah penafsiran tentang mimpi-mimpi itu: bahwa Olimpias telah hamil sebelum menikah, ditunjukkan dengan penyegelan rahimnya; atau bahwa ayah Aleksander adalah Zeus. Para sejarawan ada yang berpendapat bahwa Olimpias yang ambisius membesar-besarkan cerita mengenai silsilah dewa Aleksander, dan yang lainnya berpendapat Olimpias memberitahu Aleksander.",
    ] },
  { "title" = "Ahli waris Filipus", "paragraphs" = [
      "Ketika Aleksander menginjak usia enam belas tahun, masa belajarnya pada Aristoteles selesai. Raja Filipus berangkat untuk berperang melawan Byzantion, dan Aleksander ditugaskan untuk mengurus kerajaan. Selama Filipus pergi, suku Maedi Thrakia memberontak menentang kekuasaan Makedonia. Aleksander merespon dengan cepat, ia meredam pemberontakan suku Maedi, mengusir mereka dari wilayah mereka, mengisinya dengan orang-orang Yunani, dan mendirikan kota yang ia namai Alexandropolis.",
      "Setelah Filipus kembali dari Byzantion, ia memberi Aleksander sejumlah kecil pasukan dan mengutusnya untuk menghentikan suatu pemberontakan di Thrakia selatan. Dalam kampanye lainnya melawan kota Perinthos di Yunani, Aleksander disebutkan menyelamatkan nyawa ayahnya. Sementara itu, kota Amphissa mulai mengolah tanah yang dikeramatkan untuk Apollo di dekat Delphi, suatu pelanggaran yang memberi kesempatan bagi Filipus untuk ikut campur lebih jauh dalam urusan Yunani. Masih berada di Thrakia, Filipus menyuruh Aleksander untuk mulai menghimpun pasukan untuk kampanye di Yunani. Sadar dengan adanya kemungkinan negara-negara Yunani lainnya untuk ikut campur, Aleksander memperlihatkan seolah-olah ia hendak menyerang Illyria. Dalam kekisruhan ini, Illyria mengambil kesempatan untuk menginvasi Makedonia, tetapi Aleksander berhasil menghalau para penyerang itu.",
      "Pasukan Filipus bergabung dengan Aleksander pada tahun 338 SM, dan mereka bergerak ke selatan menuju Thermopylai, yang mereka lakukan setelah menghadapi perlawanan yang keras kepala dari orang-orang Thiva yang menghuninya. Mereka pergi untuk menduduki kota Elateia, berjarak beberapa hari dari kota Athena dan Thiva. Sementara itu, rakyat Athena, dipimpin oleh Demosthenes, memilih untuk bersekutu dengan Thiva dalam perang melawan Makedonia. Baik Athena dan Filipus kemudian mengirim utusan untuk memperoleh keberpihakan Thiva, dan yang berhasil melakukannya adalah Athena. Filipus bergerak menuju Amphissa (secara teoretis beraksi atas permintaan Liga Amphikyton), menangkap tentara bayaran yang dikirim ke sana oleh Demosthenes, dan menerima penyerahan kota itu. Lalu Filipus kembali ke Elateia dan mengirim penawaran perdamaian untuk yang terakhir kalinya pada Athena dan Thiva, yang berujung pada penolakan kedua kota itu.",
    ] },
  { "title" = "Raja Makedonia", "paragraphs" = [
      "Pada tahun 336 SM, Filipus sedang berada di Aigai, menghadiri pernikahan putrinya, Kleopatra, yang menikah dengan saudara Olimpias, Raja Epiros Aleksander I. Di sana Filipus dibunuh oleh pemimpin pasukan pengawalnya sendiri, Pausanias. Ketika Pausanias mencoba kabur, ia tersandung tanaman anggur sehingga dapat dibunuh oleh para pengejarnya, yang meliputi dua rekan Aleksander, Perdikkas dan Leonnatos. Aleksander dengan demikian diangkat sebagai basileus (raja) oleh pasukan Makedonia dan bangsawan Makedonia. Ia berusia dua puluh tahun ketika menjadi raja.",
      "Aleksander memulai masa pemerintahannya dengan menyingkirkan orang-orang yang menurutnya berpotensi mengancam takhtanya. Ia menghukum mati sepupunya, Amyntas IV, dan juga membunuh dua pangeran Makedonia dari daerah Lynkestis, sedangkan pangeran ketiga, yaitu Aleksander Lynkestes, diampuni. Sementara itu Olimpias, ibu Aleksander, memerintahkan bahwa Kleopatra Euridike dan putrinya, Europa, dibakar hidup-hidup. Ketika Aleksander tahu tentang hal itu, ia marah pada ibunya. Aleksander juga memerintahkan bahwa Attalos harus dibunuh. Attalos sendiri saat itu menjabat sebagai komandan pasukan di Asia Minor. Attalos sempat berkorespondensi dengan Demosthenes, mengenai kemungkinannya untuk kabur ke Athena. Terlepas dari apakah Attalos benar-benar berniat ke Athena atau tidak, ia sudah membuat Aleksander marah. Selain itu, setelah mengetahui bahwa putri dan cucu Attalos mati, Aleksander merasa bahwa Attalos terlalu berbahaya untuk dibiarkan hidup. Aleksander membiarkan Arrhidaios hidup. Arrhidaios disebutkan menderita cacat mental, kemungkinan akibat diracun oleh Olimpias.",
      "Kabar kematian Filipus memicu banyak kota memberontak, termasuk Thiva, Athena, Thessalia, dan suku-suku Thrakia di utara Makedonia. Ketika kabar pemberontakan di Yunani diketahui oleh Aleksander, ia merespon dengan cepat. Meskipun para penasihatnya menyarankannya untuk mempergunakan diplomasi, tetapi Aleksander memutuskan untuk mengumpulkan 3.000 tentara kavaleri dan bergerak menuju Thessalia, daerah tetangga Makedonia di sebelah selatan. Di sana ia mengetahui bahwa pasukan Thessalia telah menempati jalan di antara Gunung Olimpus dan Gunung Ossa. Aleksander lalu menyuruh pasukannya menaiki Gunung Ossa. Ketika pasukan Thessalia terbangun, mereka melihat bahwa pasukan Aleksander telah berada di sisi belakang mereka. Pasukan Thessalia pun menyerah dan pasukan kavaleri Aleksander bertambah dengan masuknya pasukan Thessalia. Aleksander lalu bergerak menuju Peloponnesos.",
    ] },
  { "title" = "Kampanye Balkan", "paragraphs" = [
      "Sebelum menyerang ke Asia, Aleksander ingin mengamankan perbatasan utaranya; dan, pada musim semi tahun 335 SM, ia berhasil menghentikan beberapa pemberontakan. Mulai dari Amphipolis, ia pertama-tama bergerak ke timur ke negara-negara \"Suku-suku Thrakia Merdeka\"; dan di Gunung Haimos, pasukan Makedonia menyerang dan mengalahkan pasukan Thrakia. Pasukan Makedonia bergerak menuju negara Triballi, dan berhasil mengalahkan pasukan Triballi di dekat sungai Lyginos (anak sungai Donau). Aleksander kemudian melaju selama tiga hari ke Donau, menghadapi suku Getai di seberang sungai. Ia mengejutkan pasukan Getai dengan menyeberangi sungai pada malam hari. Ia berhasil memaksa pasukan Getai menyerah setelah meletusnya pertempuran kecil. Pasukan Getai mundur dan meninggalkan kota-kota mereka pada pasukan Makedonia. Kemudian terdengar berita bahwa Kleitos, Raja Illyria, dan Raja Glaukias dari Taulanti secara terbuka memberontak melawan otoritas Makedonia. Bergerak ke barat menuju Illyria, Aleksander mengalahkan semua pemberontak itu dan memaksa Kleitos dan Glaukias untuk melarikan diri bersama pasukan mereka. Dengan demikian, perbatasan utara Aleksander pun aman.",
      "Ketika sedang sukses dalam kampanyenya di utara, ternyata Thiva dan Athena sekali lagi memberontak. Aleksander dengan segera menyelesaikan kampanye di utara dan bergegas ke selatan bersama pasukannya. Kota-kota lainnya ragu-ragu, tetapi Thiva memutuskan untuk memberontak dengan mengerahkan seluruh kekuatannya. Akan tetapi perlawanan itu terbukti tidak efektif. Aleksander sangat marah pada Thiva. Ia membunuhi banyak tentara Thiva, meluluhlantakkan kota itu sampai hancur, menjual penduduknya sebagai budak, dan membagi-bagi wilayah Thiva ke kota-kota Boiotia di sekitarnya. Setelah mendengar berita tentang musnahnya kota Thiva, Athena pun menyerah pada Aleksander. Dengan demikian, seluruh Yunani sudah berada di bawah kekuasaan Aleksander. Setelah Yunani aman, Aleksander pun melaksanakan kampanyenya di Asia. Ia menugaskan Antipatros untuk mengurus Makedonia.",
    ] },
]

[articles.tl]
text = "Si Alejandro III ng Macedon (20/21 Hulyo 356 – 10/11 Hunyo 323 BCE) na kilala bilang Alejandrong Dakila o Dakilang Alejandro (Griyego: Ἀλέξανδρος ὁ Μέγας, Aléxandros ho Mégasiii[›] galing sa Griyegong ἀλέξω alexo \"ipagtanggol, tulungan\" + ἀνήρ aner \"man\") ang hari ng Macedon na isang estado ng hilagaang Sinaunang Gresya. Ipinanganak siya sa Pella noong 356 BCE."
title = "Alejandrong Dakila"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Alejandrong_Dakila"
intro = [
  "Si Alejandro III ng Macedon (20/21 Hulyo 356 – 10/11 Hunyo 323 BCE) na kilala bilang Alejandrong Dakila o Dakilang Alejandro (Griyego: Ἀλέξανδρος ὁ Μέγας, Aléxandros ho Mégasiii[›] galing sa Griyegong ἀλέξω alexo \"ipagtanggol, tulungan\" + ἀνήρ aner \"man\") ang hari ng Macedon na isang estado ng hilagaang Sinaunang Gresya. Ipinanganak siya sa Pella noong 356 BCE. Siya ay inaralan ni Aristoteles hanggang sa edad na 16. Sa edad na 30, nilikha niya ang isa sa pinakamalaking imperyo sa sinaunang daigdig na sumasaklaw mula sa Dagat Ionian hanggang sa mga Himalaya. Hindi siya natalo sa digmaan at itinuturing sa kasaysayan na isa sa mga pinakamatagumpay na mga komander.",
  "Hinalinhan sa trono ni Alejandro ang kanyang amang si Felipe II ng Macedon noong 336 BCE pagkatapos paslangin si Felipe II. Sa kamatayan ni Felipe, namana ni Alejandro ang isang malakas na kaharian at hukbo na bihasa. Ginawaran siya ng pagkaheneral ng Gresya at gumamit sa kapangyarihang ito upang ilusan ang mga planong pagpapalawig na pang-hukbo ng kanyang ama. Noong 334 BCE, sinakop niya ang pinamunuan ng Persia na Asya Menor at nagpasimula ng mga sunod-sunod pakikidigma na tumagal ng 10 taon. Binali ni Alejandro ang kapangyarihan ng Persia sa sunod-sunod na pagwawagi sa pakikipagdigmaan na kabilang sa mga yaon yaong Labanan sa Issus at Labanan sa Gaugamela. Kalaunan ay pinatalsik niya ang haring Persa (Persian) na si Dario III at sinakop ang kabuuan ng Imperyong Akemenida. Sa puntong iyon, ang kanyang imperyo ay sumaklaw mula sa dagat Adriatiko hanggang sa Ilog Indus. Sa paghahangad niyang maabot ang \"mga dulo ng mundo at ang dakilang panlabas na dagat\" ay sinakop niya ang India noong 326 BCE ngunit kalaunan ay napaurong sa paghiling ng kanyang mga hukbo. Namatay si Alejandro sa Babilonya sa edad na 32 noong 323 BCE nang hindi nagsagawa ng sunod-sunod na planadong mga pakikidigma na nagsimula sa kanyang pananakop ng Arabia. Sa mga sumunod na taon pagkatapos ng kamatayan niya'y nabahagi ang kaniyang imperyo dahil sa sunod-sunod na digmaang sibil na nauwi sa ilang mga estadong pinamunuan ng Diadochi na mga natitirang heneral ni Alejandro at mga tagapagmana. Ang kaniyang pamana ay kinabibilangan ang pagkalat ng kultura na dinulot ng kaniyang mga pananakop . Kaniyang itinatag ang mga 20 siyudad na ipinangalan sa kanya na ang pinakakilala ay ang Alehandriya sa Ehipto. Ang pagtira ng ng mga kolonistang Griyego ni Alejandro at ang nagresultang pagkalat ng kulturang Griyego…",
]
sections = [
  { "title" = "Talambuhay", "paragraphs" = [
      "Sa edad na 13, si Alejandro ay tinuruan ng Griyegong pilosopong si Aristoteles.Noong tag-init nang 336 BCE si Felipe II ng Macedonia na ama ni Dakilang Alejandro ay pinatay ng kapitan ng mga bantay na si Pausanias]]. Habang tinangka ni Pausanias na tumakas, siya ay natalisod at pinatay ng mga humahabol kabilang ang mga kasama ni Alejandro na sinai Perdiccas at Leonnatus. Sa sandaling iyon, si Dakilang Alejandro ay prinoklamang hari ng mga maharlika at hukbo sa edad na 20. Sinimulan ni Alejandro ang kanyang paghahari sa pagpatay sa mga potensiyal na katunggali sa trono.Pinapatay niya ang dalawang prinsipeng Mecedonio sa rehiyon ng Lyncestis. Pinapatay rin ni Alejandro si Attalus na namuno sa hukbo sa Asya Menor. Sa panahong iyon, si Attalus ay nakikipagsagutan kay Demosthenes tungkol sa posibilidad ng paglipat sa Atenes. Lubos ring ininsulto ni Attalus si ALejandro. Ang kamatayan ni Felipe II ay nagdulot sa maraming mga estado na maghimagsik kabilang ang Thebes, Gresya, Atenas, at mga tribo sa Thessaly sa hilaga ng Macedon. Tinipon ni Alejandro ang 3,000 kabalyero ng Macedo at tumungo sa Thessaly. Natagpuan niyang ang hukbong Thessaliano ay nasa paso sa pagitan ng Bundok ng Olimpo at Bundo Ossa at inutusan ang kanyang hukbo na tumungo sa Bundok Ossa. Nang magising ang mga Thessaliano nang sumunod na araw, nalaman nilang si Alejandro ay nasa kanilang likuran at agarang sumuko at idinagdag ang kanilang kabalyero sa puwersa ni Alejandro. Nagpatuloy si Alejandro sa Peloponnese at tumigil sa Thermopylae kung saan siya kinilalang pinuno ng Ligang Amphictyonika bago tumungo sa timog ng Corinto. NagdemaLeague before heading south to Corinth. Nagmakaawa ang Ateneas at pinatawad ni Alejandro ang mga rebelde. Sa Corinto, kinuha ni Alejandro ang pamagat na Hegemon(Pinuno) at tulad…",
      "Noong 10 o 11 Hunyo 323 BCE, si Alejandro ay namatay sa palasyo ni Nabucodonosor II sa Babilonya sa edad na 32. May dalawang bersiyon ng kanyang kamatayan. Ayon sa salaysay ni Plutarch, mga 14 araw bago siya mamatay, siya ay nagkaroon ng trangkaso at hindi makapagsalita. Sa salaysay ni Diodorus Siculus, si Alejandro ay nagkaroon ng pananakit pagkatapos uminomng isang alak bilang parangal kay Heracles na sinundan ng 11 araw ng panghihina ngunit hindi nagkaroon ng trangkaso.",
    ] },
  { "title" = "Mga alamat tungkol kay Dakilang Alejandro", "paragraphs" = [
      "Ayon kay Josephus sa Antiquities of the Jews 11:317-345 nang si Alejandro ay tumungo sa Herusalem, ang mga mamamayan na Hudyo ay sumasama sa isang prusisyon upang humarap kay Alejandro. Siya ay pinakitaan ng Aklat ni Daniel kapitulo 8 na nagsasabing wawasakin ng mga Griyego ang mga Persiyano, pinagpalagay niyang siya ang tinutukoy dito. Ito ay isang kuwento na hindi pinaniniwalaan ng mga iskolar dahil ang Aklat ni Daniel ay isinulat pagkatapos mamatay ni Alejandro.",
      "Sa Quran 18:83-101, may tinutukoy na Dhu al-Qarnayn (literal:\"Siya na may dalawang sungay\") ay pinaniniwalaan ng ilang komentador na Muslim na tumutukoy kay Dakilang Alejandro. Ang Dhu al-Qarnayn ay isa na naglalakbay sa silangan at kanluran na maglalagay ng harang sa pagitan ng ilang tao at Gog at Magog.",
      "Ayon kay Cicero, nang ipanganak si Alejandro, ang Templo ni Artemis ay nasusunog. Ang mga mago ay tumangis habang nasususnog ang Templo ni Artemis:\"Ang sumpa ng Asya ay ipinanganak kagabi. Ayon kay Plutarch, nasunog ang Templo ni Artemis dahil ang Diyosang si Artemis ay abala sa pagbibigay silang kay Alejandro.",
    ] },
]

[articles.pt]
text = "Alexandre III da Macedônia (português brasileiro) ou Macedónia (português europeu) (20/21 de julho de 356 a.C. – 10 de junho de 323 a.C.), comumente conhecido como Alexandre, o Grande ou Alexandre Magno (em grego clássico: Ἀλέξανδρος ὁ Μέγας; romaniz.: Aléxandros ho Mégas), foi rei (basileu) do reino grego antigo da Macedônia e um membro da dinastia argéada."
title = "Alexandre, o Grande"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/Alexandre%2C_o_Grande"
intro = [
  "Alexandre III da Macedônia (português brasileiro) ou Macedónia (português europeu) (20/21 de julho de 356 a.C. – 10 de junho de 323 a.C.), comumente conhecido como Alexandre, o Grande ou Alexandre Magno (em grego clássico: Ἀλέξανδρος ὁ Μέγας; romaniz.: Aléxandros ho Mégas), foi rei (basileu) do reino grego antigo da Macedônia e um membro da dinastia argéada. Nascido em Pela em 356 a.C., o jovem príncipe sucedeu a seu pai, o rei Filipe II, no trono com vinte anos de idade. Ele passou a maior parte de seus anos no poder em uma série de campanhas militares sem precedentes através da Ásia e nordeste da África. Até os trinta anos havia criado um dos maiores impérios do mundo antigo, que se estendia da Grécia para o Egito e ao noroeste da Índia. Morreu invicto em batalhas e é considerado um dos comandantes militares mais bem-sucedidos da história.",
  "Durante sua juventude, Alexandre foi orientado pelo filósofo Aristóteles até os 16 anos. Depois que Filipe foi assassinado em 336 a.C., Alexandre sucedeu a seu pai no trono e herdou um reino forte e um exército experiente. Havia sido premiado com o generalato da Grécia e usou essa autoridade para lançar o projeto pan-helênico de seu pai liderando os gregos na conquista da Pérsia. Em 334 a.C., invadiu o Império Aquemênida, governando a Ásia Menor, e começou uma série de campanhas que durou dez anos. Quebrou o poder da Pérsia em uma série de batalhas decisivas, mais notavelmente as batalhas de Isso e Gaugamela. Em seguida, derrubou o rei persa Dario III e conquistou a Pérsia em sua totalidade. Nesse ponto, seu império se estendia do mar Adriático ao rio Indo.",
  "Buscando alcançar os \"confins do mundo e do Grande Mar Exterior\", invadiu a Índia em 326 a.C., mas foi forçado a voltar pela demanda de suas tropas. Alexandre morreu na Babilônia em 323 a.C., a cidade que planejava estabelecer como sua capital, sem executar uma série de campanhas planejadas que teria começado com uma invasão da Arábia. Nos anos seguintes à sua morte, uma série de guerras civis rasgou seu império em pedaços, resultando em vários estados governados pelos diádocos, sobreviventes e herdeiros generais de Alexandre.",
  "Seu legado inclui a difusão cultural que suas conquistas geraram, como o greco-budismo. Fundou cerca de vinte cidades que levavam o seu nome, principalmente Alexandria, no Egito. Seus assentamentos de colonos gregos e a propagação resultante da cultura grega no leste resultou em uma nova civilização helenística, aspectos que ainda eram evidentes nas tradições do Império Bizantino em meados do século XV e a presença de oradores gregos na região central e noroeste da Anatólia até à década de 1920. Alexandre tornou-se lendário como um herói clássico no molde de Aquiles, aparecendo com destaque na história e mito grego e culturas não gregas. Tornou-se a medida contra a qual os líderes militares se compararam, e academias militares em todo o mundo ainda ensinam suas táticas. É muitas vezes classificado entre as pessoas mais influentes do mundo em todos os tempos, junto com seu professor Aristóteles.",
]
sections = [
  { "title" = "Começo da vida", "paragraphs" = [
      "Alexandre nasceu na cidade de Pela, capital do Reino da Macedônia, no sexto dia do mês hecatombeu do antigo calendário grego, o que provavelmente corresponde a 20 de julho de 356 a.C., apesar da data exata ainda não ser sabida com certeza. Era filho do rei Filipe II e de sua quarta esposa, Olímpia, filha do rei Neoptólemo I do Epiro. Apesar de Filipe ter sete ou oito esposas, Olímpia foi sua esposa principal por muito tempo, provavelmente devido ao fato dela ter sido aquela que lhe deu um filho homem.",
      "Muitas lendas envolvem o nascimento e infância de Alexandre. De acordo com o biógrafo grego Plutarco, Olímpia, na noite da consumação do seu casamento com Filipe, sonhou que seu útero fora atingido por um raio. É dito que Filipe, em um sonho um tempo após o casamento, viu-se segurando o útero de sua esposa marcando-o com um selo gravado com uma imagem de leão. Plutarco deu várias interpretações a este sonho: talvez que Olímpia estivesse grávida antes do casamento, indicado pelo selo gravado em seu útero; ou que Alexandre fosse filho do deus Zeus. Analistas antigos dizem que uma ambiciosa Olímpia pode ter propagado a história da origem divina de Alexandre ou talvez ela dispensasse essa sugestão como ímpia.",
      "No dia que Alexandre nasceu, Filipe estava preparando um cerco à cidade de Potideia, na península de Calcídica. No mesmo dia, Filipe recebeu notícias que o seu general Parménio tinha derrotado os exércitos combinados da Ilíria e da Peônia, e também que seu cavalo havia vencido uma competição nos Jogos Olímpicos. Também é dito que, neste dia, o Templo de Ártemis, em Éfeso, uma das sete maravilhas do mundo antigo, havia sido queimado. Isso levou Hegésias de Magnésia a dizer que o incêndio tinha ocorrido porque Ártemis estava longe, testemunhando o nascimento de Alexandre. Tais lendas podem ter surgido após Alexandre ter se tornado rei e possivelmente foram instigadas pelo próprio para mostrar que era um super-humano e destinado à grandeza desde sua concepção.",
    ] },
  { "title" = "Herdeiro do trono", "paragraphs" = [
      "Aos 16 anos de idade a educação de Alexandre sob Aristóteles acabou. Filipe então foi para a guerra contra Bizâncio, deixando Alexandre como regente do seu reino e herdeiro aparente. Na ausência de Filipe, os medos trácios se revoltaram contra a Macedônia. Alexandre respondeu rápido, expulsando-os dos seus territórios. Ele recolonizou a região com gregos e fundou uma cidade chamada Alexandrópolis.",
      "Quando Filipe retornou, enviou Alexandre e uma pequena força de combate para subjugar uma revolta no sul da Trácia. Logo depois, durante uma campanha contra outros gregos na cidade de Perinto (atual Marmara Ereğlisi), Alexandre teria salvado a vida do seu pai. Enquanto isso, a cidade de Anfissa começou a trabalhar em terras que eram consagradas a Apolo, próximo de Delfos, um sacrilégio que deu a Filipe a oportunidade de mais uma vez interferir em assuntos gregos. Ainda ocupado na Trácia, ordenou a Alexandre que reunisse um exército para uma campanha no sul da Grécia. Preocupado que os estados gregos percebessem e interviessem, Alexandre fez parecer que se estava preparando para atacar a Ilíria. Nesse meio tempo, de fato, os ilírios invadiram a Macedônia, mas foram facilmente repelidos por Alexandre.",
      "Filipe e seu exército se reuniram com Alexandre em 338 a.C., e juntos marcharam para Termópilas, onde derrotaram uma pequena mas obstinada resistência de homens de Tebas. Eles depois avançaram e ocuparam Elateia. Alguns dias depois marcharam sobre Atenas e Tebas. Os atenienses, liderados por Demóstenes, decidiram se aliar aos tebanos contra a Macedônia. Embaixadores atenienses e de Filipe tentaram ganhar o favor de Tebas, mas preferiram ficar do lado de Atenas. Filipe marchou então até Anfissa (ostensivamente agindo sobre o pedido do Anfictionia), capturando mercenários enviados por Demóstenes e aceitando a rendição desta cidade. Retornou então para Elateia, enviando uma oferta final de paz para Atenas e Tebas, mas foi rejeitado.",
    ] },
  { "title" = "Rei da Macedônia", "paragraphs" = [
      "No verão de 336 a.C., enquanto estava em Egas num casamento da sua filha Cleópatra com o irmão de Olímpia, Alexandre I de Epiro, Filipe foi morto por Pausânias, o próprio capitão de sua guarda. Enquanto Pausânias tentava fugir, ele tropeçou e foi morto por seus perseguidores, incluindo dois companheiros de Alexandre, Pérdicas e Leonato. Alexandre foi então proclamado rei pelos nobres macedônios e pelo exército. Tinha ele apenas vinte anos de idade.",
      "Agora Alexandre III, o novo rei começou seu governo eliminando potenciais rivais ao trono. Ele mandou executar seu primo, Amintas IV. Também ordenou a morte de dois príncipes macedônios de Lincéstida, mas poupou um terceiro, Alexandre de Lincéstida. Olímpia mandou queimar vivas Cleópatra Eurídice e sua filha com Filipe, a criança Europa. Quando Alexandre descobriu o que sua mãe fez, ficou furioso. Contudo, ele teve que mandar executar Átalo, tio de Eurídice, que comandava a vanguarda do exército na Ásia Menor.",
      "Átalo, naquela altura, estava negociando com Demóstenes sobre a possibilidade de desertar para Atenas. Ele constantemente insultava Alexandre e depois da morte de Cleópatra, Alexandre deve ter considerado-o perigoso demais para viver. O rei poupou Arrideu, que afirmavam ser mentalmente incapaz na época, possivelmente como resultado do envenenamento feito por Olímpia.",
    ] },
