[articles.en]
text = "K’ab’al Xook dedicated Structure 23 in 726 CE at Yaxchilán, a Maya city on the Usumacinta River in present-day Chiapas. A principal wife of the ruler Itzamnaaj B’alam, she is named in the inscriptions and depicted in three stone reliefs set above the building’s doorways."
title = "K’ab’al Xook"
lang = "en"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook dedicated Structure 23 in 726 CE at Yaxchilán, a Maya city on the Usumacinta River in present-day Chiapas. A principal wife of the ruler Itzamnaaj B’alam, she is named in the inscriptions and depicted in three stone reliefs set above the building’s doorways."]
sections = [{ title = "The doorways of Structure 23", paragraphs = ["Lintel 24 portrays K’ab’al Xook drawing a thorned cord through her tongue as Itzamnaaj B’alam lights the rite with a torch. The Mexican National Museum of Anthropology identifies the warrior deity Ajk’ahk’ O’ Chaak appearing through the vision serpent on Lintel 25. On Lintel 26, she presents the ruler with a shield and a headdress in a scene often linked with preparations for war. The reliefs joined ritual, architecture and public representation of the ruling house. They show her participation in court rites and document a building she dedicated. They provide no account of her commanding an army."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.es]
text = "K’ab’al Xook dedicó la Estructura 23 en el año 726 en Yaxchilán, ciudad maya a orillas del Usumacinta en el actual Chiapas. Fue una de las esposas principales del gobernante Itzamnaaj B’alam. Su nombre figura en inscripciones y su imagen aparece en los tres relieves de piedra que coronaban las entradas del edificio."
title = "K’ab’al Xook"
lang = "es"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook dedicó la Estructura 23 en el año 726 en Yaxchilán, ciudad maya a orillas del Usumacinta en el actual Chiapas. Fue una de las esposas principales del gobernante Itzamnaaj B’alam. Su nombre figura en inscripciones y su imagen aparece en los tres relieves de piedra que coronaban las entradas del edificio."]
sections = [{ title = "Los dinteles de la Estructura 23", paragraphs = ["En el dintel 24, K’ab’al Xook pasa una cuerda con espinas por su lengua mientras Itzamnaaj B’alam ilumina el rito con una antorcha. El Museo Nacional de Antropología identifica a la deidad guerrera Ajk’ahk’ O’ Chaak en la serpiente de la visión del dintel 25. En el dintel 26, ella presenta al gobernante un tocado y un escudo en una escena vinculada con los preparativos para la guerra. En conjunto, las piezas documentan su participación en los ritos de la corte y el edificio que dedicó. Su autoridad ceremonial queda plasmada en la piedra. Los relieves no registran que dirigiera un ejército."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.fr]
text = "K’ab’al Xook a consacré la Structure 23 en 726 à Yaxchilán, cité maya sur l’Usumacinta, dans l’actuel Chiapas. Épouse principale du souverain Itzamnaaj B’alam, elle est nommée dans les inscriptions et représentée sur trois reliefs de pierre qui surmontaient les portes de l’édifice."
title = "K’ab’al Xook"
lang = "fr"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook a consacré la Structure 23 en 726 à Yaxchilán, cité maya sur l’Usumacinta, dans l’actuel Chiapas. Épouse principale du souverain Itzamnaaj B’alam, elle est nommée dans les inscriptions et représentée sur trois reliefs de pierre qui surmontaient les portes de l’édifice."]
sections = [{ title = "Les linteaux de la Structure 23", paragraphs = ["Sur le linteau 24, K’ab’al Xook fait passer une corde munie d’épines à travers sa langue, à la lumière de la torche tenue par Itzamnaaj B’alam. Le Musée national d’anthropologie du Mexique identifie la divinité guerrière Ajk’ahk’ O’ Chaak dans la scène du serpent de vision, sur le linteau 25. Sur le linteau 26, elle présente une coiffure et un bouclier au souverain dans une scène associée aux préparatifs guerriers. Les sculptures attestent sa participation aux rites de la cour et le lien du bâtiment avec son nom. Elles ne documentent aucun commandement militaire exercé par K’ab’al Xook."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.de]
text = "K’ab’al Xook weihte im Jahr 726 Bauwerk 23 in Yaxchilán ein, einer Maya-Stadt am Usumacinta im heutigen Chiapas. Sie gehörte zu den Hauptgemahlinnen des Herrschers Itzamnaaj B’alam. Inschriften nennen ihren Namen und drei Steinreliefs über den Eingängen zeigen ihre Gestalt."
title = "K’ab’al Xook"
lang = "de"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook weihte im Jahr 726 Bauwerk 23 in Yaxchilán ein, einer Maya-Stadt am Usumacinta im heutigen Chiapas. Sie gehörte zu den Hauptgemahlinnen des Herrschers Itzamnaaj B’alam. Inschriften nennen ihren Namen und drei Steinreliefs über den Eingängen zeigen ihre Gestalt."]
sections = [{ title = "Die Türstürze von Bauwerk 23", paragraphs = ["Auf Türsturz 24 zieht K’ab’al Xook eine mit Dornen besetzte Schnur durch ihre Zunge. Itzamnaaj B’alam beleuchtet das Ritual mit einer Fackel. Das mexikanische Nationalmuseum für Anthropologie identifiziert Ajk’ahk’ O’ Chaak als die Kriegergottheit, die auf Türsturz 25 durch die Visionsschlange erscheint. Auf Türsturz 26 überreicht sie dem Herrscher einen Kopfschmuck und einen Schild. Diese Szene wird mit Kriegsvorbereitungen in Verbindung gebracht. Die Reliefs belegen ihre Rolle bei den Hofritualen und die Weihung des Gebäudes. Eine militärische Befehlsgewalt lässt sich daraus nicht ableiten."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.it]
text = "K’ab’al Xook dedicò la Struttura 23 nel 726 a Yaxchilán, città maya sulle rive dell’Usumacinta, nell’attuale Chiapas. Era una delle mogli principali del sovrano Itzamnaaj B’alam. Il suo nome compare nelle iscrizioni e la sua figura è scolpita su tre rilievi di pietra posti sopra gli ingressi."
title = "K’ab’al Xook"
lang = "it"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook dedicò la Struttura 23 nel 726 a Yaxchilán, città maya sulle rive dell’Usumacinta, nell’attuale Chiapas. Era una delle mogli principali del sovrano Itzamnaaj B’alam. Il suo nome compare nelle iscrizioni e la sua figura è scolpita su tre rilievi di pietra posti sopra gli ingressi."]
sections = [{ title = "Gli architravi della Struttura 23", paragraphs = ["Sull’architrave 24 K’ab’al Xook si passa una corda spinosa attraverso la lingua mentre il sovrano illumina il rito con una torcia. Il Museo nazionale di antropologia del Messico identifica Ajk’ahk’ O’ Chaak come la divinità guerriera che appare nel serpente della visione sull’architrave 25. Sull’architrave 26 lei porge al sovrano un copricapo e uno scudo, in una scena associata ai preparativi per la guerra. Le immagini documentano la sua partecipazione ai riti di corte e l’edificio che dedicò. Non attestano che abbia comandato un esercito."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.tr]
text = "K’ab’al Xook, günümüzde Chiapas’ta bulunan Usumacinta kıyısındaki Maya kenti Yaxchilán’da 23 numaralı yapıyı 726 yılında adadı. Hükümdar Itzamnaaj B’alam’ın baş eşlerinden biriydi. Yazıtlarda adı geçer ve yapının üç girişinin üzerindeki taş kabartmalarda görülür."
title = "K’ab’al Xook"
lang = "tr"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook, günümüzde Chiapas’ta bulunan Usumacinta kıyısındaki Maya kenti Yaxchilán’da 23 numaralı yapıyı 726 yılında adadı. Hükümdar Itzamnaaj B’alam’ın baş eşlerinden biriydi. Yazıtlarda adı geçer ve yapının üç girişinin üzerindeki taş kabartmalarda görülür."]
sections = [{ title = "23 numaralı yapının kapı lentoları", paragraphs = ["24 numaralı lentoda K’ab’al Xook dikenli bir ipi dilinden geçirirken Itzamnaaj B’alam töreni bir meşaleyle aydınlatır. Meksika Ulusal Antropoloji Müzesi, 25 numaralı lentodaki görü yılanı aracılığıyla beliren savaşçı tanrıyı Ajk’ahk’ O’ Chaak olarak tanımlar. 26 numaralı lentoda K’ab’al Xook hükümdara bir başlık ve kalkan sunar. Bu sahne savaş hazırlıklarıyla ilişkilendirilir. Kabartmalar onun saray törenlerine katıldığını ve adadığı yapıyı belgeler. Bir orduya komuta ettiğini gösteren bir kayıt içermez."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.zh-CN]
text = "卡巴尔·舒克是玛雅城邦亚什奇兰的王室成员，也是统治者伊察姆纳赫·巴拉姆的主要妻子之一。亚什奇兰位于今墨西哥恰帕斯州的乌苏马辛塔河畔，城中的建筑分布在河湾内侧的台地和高处。研究者把她主持的第23号建筑奉献仪式定在公元726年。建筑入口上原有三块雕刻石门楣，今编号为24、25和26。铭文记有她的名字，浮雕也在不同的仪式情境中表现她的形象。建筑的奉献日期与每一幅图像所描绘的事件日期应分别考察。"
title = "卡巴尔·舒克"
lang = "zh-CN"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["卡巴尔·舒克是玛雅城邦亚什奇兰的王室成员，也是统治者伊察姆纳赫·巴拉姆的主要妻子之一。亚什奇兰位于今墨西哥恰帕斯州的乌苏马辛塔河畔，城中的建筑分布在河湾内侧的台地和高处。研究者把她主持的第23号建筑奉献仪式定在公元726年。建筑入口上原有三块雕刻石门楣，今编号为24、25和26。铭文记有她的名字，浮雕也在不同的仪式情境中表现她的形象。建筑的奉献日期与每一幅图像所描绘的事件日期应分别考察。"]
sections = [{ title = "第23号建筑的三块门楣", paragraphs = ["第24号门楣上，卡巴尔·舒克把带刺的绳索从舌头穿过，统治者举着火炬照亮仪式。她是执行仪式的人，雕刻把动作和仪式用具一起呈现在门口。第25号门楣则表现一条在仪式中显现的蛇。墨西哥国立人类学博物馆将从蛇显现的人物识别为战士神阿赫卡赫克·奥·恰克。皮博迪博物馆的铭文档案也列出其他解释，包括把人物联系到统治者或王室女性在仪式中呈现的神性形象。图像与铭文对人物的指向仍有讨论。第26号门楣中，卡巴尔·舒克向身穿棉甲的统治者递出一件战盔和一面盾。器物使这一场景常被解释为备战，但铭文没有明确给出图中行动的日期。档案还区分石刻完成的日期与石刻所描绘的行动。发掘记录把这块门楣定位在建筑西北入口附近，现由墨西哥国立人类学博物馆收藏。这块石灰岩门楣被发现时已经断成两截，上半截还可见蓝色颜料的痕迹。铭文档案保留了早期照片和按实物校订的线图。研究这组门楣也要考虑它们原本安放的位置，进入建筑的人从石刻下方穿过，而现代展陈中的观看角度有所不同。这些证据让研究者把建筑委托和奉献、王室宗教仪式以及战争装备的呈现联系起来，同时把三个图像各自的叙事分开阅读。浮雕记录了卡巴尔·舒克亲自执行的仪式和她与这座建筑的关系；它们并未记录她指挥军队或参加某场战斗。"] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.ja]
text = "カバル・ショークは、現在のメキシコ、チアパス州のウスマシンタ川沿いに栄えたマヤの都市ヤシュチランの王族で、王イツァムナーフ・バラムの主要な妃の一人だった。ヤシュチランは川が大きく曲がる地点にあり、建物は河岸の段丘やその上の高所に築かれた。研究者は、カバル・ショークが建造物23を奉献したのは西暦726年と考えている。建物の三つの入口の上には、現在24、25、26と番号を付けられたまぐさ石が据えられていた。銘文には彼女の名があり、彫刻はそれぞれ異なる儀礼の場面に彼女を描いている。"
title = "カバル・ショーク"
lang = "ja"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["カバル・ショークは、現在のメキシコ、チアパス州のウスマシンタ川沿いに栄えたマヤの都市ヤシュチランの王族で、王イツァムナーフ・バラムの主要な妃の一人だった。ヤシュチランは川が大きく曲がる地点にあり、建物は河岸の段丘やその上の高所に築かれた。研究者は、カバル・ショークが建造物23を奉献したのは西暦726年と考えている。建物の三つの入口の上には、現在24、25、26と番号を付けられたまぐさ石が据えられていた。銘文には彼女の名があり、彫刻はそれぞれ異なる儀礼の場面に彼女を描いている。"]
sections = [{ title = "建造物23の三つのまぐさ石", paragraphs = ["まぐさ石24では、カバル・ショークがとげのあるひもを舌に通し、イツァムナーフ・バラムがたいまつで儀礼を照らす。まぐさ石25では、儀礼に伴う幻視の蛇が彫られている。メキシコ国立人類学博物館は、蛇を通して現れる人物を戦士の神アフカフク・オ・チャークとみなしている。ピーボディ博物館の銘文資料は、王自身や王族女性が神の姿をとったという読み方も紹介しており、人物の同定には議論が残る。まぐさ石26では、綿の鎧を着た王にカバル・ショークが兜と盾を差し出す。この装備から出陣に向けた準備の場面と解釈されてきたが、銘文からは描かれた出来事の日付を確定できない。石に刻まれた制作の日付と、描かれた出来事の日付とは区別される。発掘記録によれば、26は建造物23の北西側の入口前で見つかり、現在はメキシコ国立人類学博物館に収蔵されている。石灰岩のまぐさ石は発見時すでに二つに割れており、保存状態が良かった上半分には青い顔料の跡が残っていた。これらの彫刻は、もともと人が通る入口の上に配置されていた。建物の構成と合わせて読むことで、銘文が伝える奉献と石に刻まれた個々の儀礼を区別しながら、彼女がどのように記念されたかを考えることができる。彼女自身が宮廷儀礼を行ったことや建物との関わりは資料から確認できるが、軍勢の指揮を執ったとは記されていない。"] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.ko]
text = "카발 쇼크는 오늘날 멕시코 치아파스주 우수마신타강 기슭의 마야 도시 야슈칠란 왕실 인물이었다. 통치자 이참나흐 발람의 주요 배우자 중 한 명이었던 그는 서기 726년에 23호 건물을 봉헌했다. 도시는 강이 크게 굽는 곳에 자리하고 있으며 건물들은 강가의 단구와 그보다 높은 곳에 놓여 있다. 23호 건물의 세 출입구 위에는 오늘날 24번, 25번, 26번으로 부르는 돌 인방이 있었다. 비문에는 그의 이름이 나오며, 부조들은 서로 다른 의례 장면에 그의 모습을 새겼다."
title = "카발 쇼크"
lang = "ko"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["카발 쇼크는 오늘날 멕시코 치아파스주 우수마신타강 기슭의 마야 도시 야슈칠란 왕실 인물이었다. 통치자 이참나흐 발람의 주요 배우자 중 한 명이었던 그는 서기 726년에 23호 건물을 봉헌했다. 도시는 강이 크게 굽는 곳에 자리하고 있으며 건물들은 강가의 단구와 그보다 높은 곳에 놓여 있다. 23호 건물의 세 출입구 위에는 오늘날 24번, 25번, 26번으로 부르는 돌 인방이 있었다. 비문에는 그의 이름이 나오며, 부조들은 서로 다른 의례 장면에 그의 모습을 새겼다."]
sections = [{ title = "23호 건물의 세 인방석", paragraphs = ["24번에서 카발 쇼크는 가시가 달린 줄을 혀에 통과시키고, 이참나흐 발람은 횃불을 들어 의례를 비춘다. 25번에는 환영 속의 뱀이 나타난다. 멕시코 국립인류학박물관은 뱀을 통해 나타나는 인물을 전사 신 아흐카흐크 오 차크로 본다. 피바디박물관의 비문 자료에는 이 인물이 통치자 자신이거나 왕실 여성이 신의 모습으로 나타났을 수 있다는 해석도 소개된다. 26번에서 카발 쇼크는 솜옷 갑옷을 입은 통치자에게 투구와 방패를 내민다. 이런 장비 때문에 전쟁 준비 장면으로 해석되지만, 비문은 그림에 담긴 사건의 날짜를 명확하게 밝히지 않는다. 인방석을 새긴 날짜와 묘사된 사건의 날짜는 구분된다. 발굴 기록에 따르면 26번은 북서쪽 출입구 앞에서 발견되었고 현재 멕시코 국립인류학박물관에 있다. 석회암으로 만든 이 돌은 발견 당시 두 조각으로 갈라져 있었으며, 보존 상태가 더 좋았던 위쪽 조각에는 푸른 안료의 흔적이 남아 있었다. 이 조각들은 본래 출입하는 사람이 그 아래를 지나도록 건축물에 놓였다. 따라서 인방석의 위치와 비문을 함께 살피면 건물의 봉헌과 각 부조가 묘사하는 의례를 구분할 수 있다. 세 작품은 카발 쇼크가 궁정 의례에 직접 참여했고 그가 봉헌한 건물에 이름이 남았다는 증거다. 군대를 지휘하거나 특정 전투에 참여했다는 기록은 이 조각에 없다."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.ar]
text = "كرّست كابال شوك المبنى رقم 23 سنة 726 ميلادية في ياش تشيلان، وهي مدينة من حضارة المايا على نهر أوسوماسينتا في ولاية تشياباس الحالية. كانت من زوجات الحاكم إتزامناج بالام الرئيسيات. ورد اسمها في النقوش ونُحتت صورتها على ثلاث عتبات حجرية كانت تعلو أبواب المبنى."
title = "كابال شوك"
lang = "ar"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["كرّست كابال شوك المبنى رقم 23 سنة 726 ميلادية في ياش تشيلان، وهي مدينة من حضارة المايا على نهر أوسوماسينتا في ولاية تشياباس الحالية. كانت من زوجات الحاكم إتزامناج بالام الرئيسيات. ورد اسمها في النقوش ونُحتت صورتها على ثلاث عتبات حجرية كانت تعلو أبواب المبنى."]
sections = [{ title = "عتبات المبنى رقم 23", paragraphs = ["على العتبة 24 تمرر كابال شوك حبلاً ذا أشواك عبر لسانها في طقس يضيئه الحاكم بشعلة. ويعرّف المتحف الوطني للأنثروبولوجيا في المكسيك الشخصية التي تظهر عبر أفعى الرؤيا على العتبة 25 بأنها الإله المحارب أجكاك أو تشاك. وعلى العتبة 26 تقدم كابال شوك للحاكم غطاء رأس ودرعًا في مشهد ارتبط بتأويلات عن الاستعداد للحرب. تُقرأ هذه المشاهد مع النقوش وموضعها فوق المداخل. وهي توثق مشاركة كابال شوك في طقوس البلاط والمبنى الذي كرّسته وتبين كيف خُلّد حضورها في المدينة. ولا تسجل العتبات أنها تولت قيادة جيش أو شاركت في معركة بعينها."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.ru]
text = "Кабаль Шоок освятила сооружение 23 в 726 году в Яшчилане, городе майя на реке Усумасинте в нынешнем штате Чьяпас. Она была одной из главных супруг правителя Ицамнаах-Балама. Надписи называют её имя, а над входами в здание размещались три каменных рельефа с её изображением."
title = "Кабаль Шоок"
lang = "ru"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["Кабаль Шоок освятила сооружение 23 в 726 году в Яшчилане, городе майя на реке Усумасинте в нынешнем штате Чьяпас. Она была одной из главных супруг правителя Ицамнаах-Балама. Надписи называют её имя, а над входами в здание размещались три каменных рельефа с её изображением."]
sections = [{ title = "Перемычки сооружения 23", paragraphs = ["На перемычке 24 Кабаль Шоок протягивает через язык шнур с шипами, пока Ицамнаах-Балам освещает обряд факелом. Национальный музей антропологии Мексики отождествляет божество, появляющееся через змея видений на перемычке 25, с воинственным Ахк’ахк’ О’ Чааком. На перемычке 26 Кабаль Шоок подаёт правителю головной убор и щит. Эту сцену связывают с подготовкой к войне. Рельефы документируют участие Кабаль Шоок в придворных обрядах и посвящение здания. Командование войском в них не засвидетельствовано."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.vi]
text = "K’ab’al Xook làm lễ cung hiến Công trình 23 vào năm 726 tại Yaxchilán, một thành phố Maya bên sông Usumacinta thuộc bang Chiapas ngày nay. Bà là một trong những người vợ chính của vua Itzamnaaj B’alam. Tên bà xuất hiện trong văn khắc, còn hình ảnh của bà được chạm trên ba phiến đá đặt phía trên các cửa ra vào."
title = "K’ab’al Xook"
lang = "vi"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook làm lễ cung hiến Công trình 23 vào năm 726 tại Yaxchilán, một thành phố Maya bên sông Usumacinta thuộc bang Chiapas ngày nay. Bà là một trong những người vợ chính của vua Itzamnaaj B’alam. Tên bà xuất hiện trong văn khắc, còn hình ảnh của bà được chạm trên ba phiến đá đặt phía trên các cửa ra vào."]
sections = [{ title = "Các phiến đá trên cửa Công trình 23", paragraphs = ["Trên phiến đá số 24, K’ab’al Xook kéo một sợi dây có gai qua lưỡi trong nghi lễ do Itzamnaaj B’alam cầm đuốc soi sáng. Bảo tàng Nhân học Quốc gia Mexico xác định nhân vật xuất hiện qua rắn thị kiến trên phiến số 25 là vị thần chiến binh Ajk’ahk’ O’ Chaak. Trên phiến số 26, bà dâng cho nhà vua một tấm khiên và một chiếc mũ đội đầu trong cảnh được liên hệ với việc chuẩn bị chiến tranh. Các phù điêu ghi lại vai trò của bà trong nghi lễ cung đình và công trình do bà cung hiến. Chúng không ghi nhận bà từng chỉ huy quân đội."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.id]
text = "K’ab’al Xook mendedikasikan Bangunan 23 pada tahun 726 di Yaxchilán, kota Maya di tepi Sungai Usumacinta, di wilayah Chiapas sekarang. Ia adalah salah satu istri utama penguasa Itzamnaaj B’alam. Namanya tercatat pada prasasti, sedangkan sosoknya tampak pada tiga relief batu yang ditempatkan di atas pintu bangunan."
title = "K’ab’al Xook"
lang = "id"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook mendedikasikan Bangunan 23 pada tahun 726 di Yaxchilán, kota Maya di tepi Sungai Usumacinta, di wilayah Chiapas sekarang. Ia adalah salah satu istri utama penguasa Itzamnaaj B’alam. Namanya tercatat pada prasasti, sedangkan sosoknya tampak pada tiga relief batu yang ditempatkan di atas pintu bangunan."]
sections = [{ title = "Ambang pintu Bangunan 23", paragraphs = ["Relief ambang 24 memperlihatkan K’ab’al Xook menarik tali berduri melalui lidahnya dalam upacara yang diterangi obor sang penguasa. Museum Antropologi Nasional Meksiko mengenali tokoh yang muncul melalui ular penglihatan pada ambang 25 sebagai dewa pejuang Ajk’ahk’ O’ Chaak. Pada ambang 26, K’ab’al Xook menyerahkan perisai dan hiasan kepala kepada penguasa dalam adegan yang dikaitkan dengan persiapan perang. Relief-relief itu mendokumentasikan perannya dalam ritual istana dan bangunan yang ia dedikasikan. Tidak ada keterangan bahwa ia memimpin pasukan."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.fil]
text = "Inialay ni K’ab’al Xook ang Istruktura 23 noong 726 sa Yaxchilán, isang lungsod ng mga Maya sa tabi ng Ilog Usumacinta sa kasalukuyang Chiapas. Isa siya sa mga pangunahing asawa ng pinunong si Itzamnaaj B’alam. Nakatala ang pangalan niya sa mga inskripsiyon at makikita ang kanyang anyo sa tatlong batong nakaukit sa ibabaw ng mga pintuan."
title = "K’ab’al Xook"
lang = "fil"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["Inialay ni K’ab’al Xook ang Istruktura 23 noong 726 sa Yaxchilán, isang lungsod ng mga Maya sa tabi ng Ilog Usumacinta sa kasalukuyang Chiapas. Isa siya sa mga pangunahing asawa ng pinunong si Itzamnaaj B’alam. Nakatala ang pangalan niya sa mga inskripsiyon at makikita ang kanyang anyo sa tatlong batong nakaukit sa ibabaw ng mga pintuan."]
sections = [{ title = "Mga inukit na bato sa Istruktura 23", paragraphs = ["Sa batong bilang 24, ipinapadaan ni K’ab’al Xook ang isang tinikang pisi sa kanyang dila habang tinatanglawan ni Itzamnaaj B’alam ng sulo ang ritwal. Ayon sa Pambansang Museo ng Antropolohiya ng Mexico, ang lumilitaw sa pamamagitan ng ahas sa pangitain sa batong bilang 25 ay ang diyos na mandirigmang si Ajk’ahk’ O’ Chaak. Sa bilang 26 ay iniaabot niya sa pinuno ang isang palamuti sa ulo at isang kalasag, sa tagpong iniuugnay sa paghahanda sa digmaan. Naitala ng mga ukit ang papel niya sa mga ritwal ng korte at ang gusaling inialay niya. Walang tala rito ng pamumuno niya sa hukbo."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]

[articles.pt-BR]
text = "K’ab’al Xook dedicou a Estrutura 23 em 726 em Yaxchilán, cidade maia às margens do Usumacinta, no atual estado de Chiapas. Foi uma das esposas principais do governante Itzamnaaj B’alam. Seu nome aparece nas inscrições e sua imagem está gravada em três relevos de pedra que ficavam acima das entradas da construção."
title = "K’ab’al Xook"
lang = "pt-BR"
url = "https://peabody.harvard.edu/yaxchilan"
shortArticle = true
intro = ["K’ab’al Xook dedicou a Estrutura 23 em 726 em Yaxchilán, cidade maia às margens do Usumacinta, no atual estado de Chiapas. Foi uma das esposas principais do governante Itzamnaaj B’alam. Seu nome aparece nas inscrições e sua imagem está gravada em três relevos de pedra que ficavam acima das entradas da construção."]
sections = [{ title = "Os lintéis da Estrutura 23", paragraphs = ["No lintel 24, K’ab’al Xook passa uma corda com espinhos pela língua enquanto Itzamnaaj B’alam ilumina o rito com uma tocha. O Museu Nacional de Antropologia do México identifica a divindade guerreira Ajk’ahk’ O’ Chaak na cena da serpente da visão do lintel 25. No lintel 26, ela apresenta ao governante um adorno para a cabeça e um escudo numa cena associada aos preparativos para a guerra. As esculturas documentam sua atuação nos rituais da corte e a construção que dedicou. Elas não registram que tenha comandado um exército."] }]
sources = [{ title = "Peabody Museum, Corpus of Maya Hieroglyphic Inscriptions, Yaxchilan", url = "https://peabody.harvard.edu/yaxchilan" }, { title = "Claudia Brittenham, Architecture, Vision, and Ritual", url = "https://www.tandfonline.com/doi/abs/10.1080/00043079.2019.1564175" }, { title = "Museo Nacional de Antropología, Dintel 25 de Yaxchilán", url = "https://mna.inah.gob.mx/detalle_pieza_mes.php?id=235" }]
