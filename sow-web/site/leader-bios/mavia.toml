[articles.en]
text = "Mavia, also known as Mawiyya, led Arab communities on Rome’s eastern frontier and concluded a peace with the empire in the late fourth century."
title = "Mavia"
lang = "en"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, also known as Mawiyya, led Arab communities on Rome’s eastern frontier and concluded a peace with the empire in the late fourth century."]
sections = [{ title = "Negotiating with Rome", paragraphs = ["Christian historians writing in Greek and Latin describe Mavia taking leadership after her husband died. Her forces raided Roman lands in the east, where the imperial authorities eventually sought a settlement. According to Sozomen and Socrates Scholasticus, she made peace conditional on the appointment of Moses, a monk who lived in the desert, as bishop for her people. These writers emphasize religious disputes, and their accounts give no exact borders or reliable count of her forces. Sozomen later credits men sent by Mavia with helping defend Constantinople. Her game ability represents the shift from war to cooperation by preserving surviving troops on both sides when a new alliance ends a land attack."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.es]
text = "Mavia, también llamada Mawiyya, dirigió comunidades árabes de la frontera oriental romana y concluyó un acuerdo de paz con el imperio a finales del siglo IV."
title = "Mavia"
lang = "es"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, también llamada Mawiyya, dirigió comunidades árabes de la frontera oriental romana y concluyó un acuerdo de paz con el imperio a finales del siglo IV."]
sections = [{ title = "Negociar con Roma", paragraphs = ["Historiadores cristianos que escribieron en griego y latín describen cómo Mavia asumió el mando al morir su esposo. Sus fuerzas atacaron tierras romanas en Oriente y las autoridades imperiales acabaron buscando un acuerdo. Según Sozomeno y Sócrates Escolástico, ella puso una condición a la paz: que Moisés, un monje que vivía en el desierto, fuera nombrado obispo de su pueblo. Los autores se interesan sobre todo por las disputas religiosas y no dan fronteras exactas ni cifras fiables de sus fuerzas. Sozomeno atribuye después a hombres enviados por Mavia una participación en la defensa de Constantinopla. En el juego, el paso de la guerra a la cooperación se refleja al recuperar las tropas supervivientes de ambos bandos cuando una nueva alianza pone fin a un ataque terrestre."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.fr]
text = "Mavia, aussi appelée Mawiyya, dirigea des communautés arabes de la frontière orientale romaine et conclut la paix avec l’Empire à la fin du IVe siècle."
title = "Mavia"
lang = "fr"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, aussi appelée Mawiyya, dirigea des communautés arabes de la frontière orientale romaine et conclut la paix avec l’Empire à la fin du IVe siècle."]
sections = [{ title = "Négocier avec Rome", paragraphs = ["Des historiens chrétiens écrivant en grec et en latin racontent que Mavia prit le commandement à la mort de son époux. Ses forces attaquèrent des territoires romains d’Orient et les autorités impériales cherchèrent un accord. Selon Sozomène et Socrate le Scolastique, elle subordonna la paix à la nomination de Moïse, un moine du désert, comme évêque de son peuple. Ces auteurs s’intéressent surtout aux conflits religieux et ne donnent ni frontières précises ni effectifs fiables. Sozomène attribue ensuite à des hommes envoyés par Mavia un rôle dans la défense de Constantinople. Dans le jeu, une nouvelle alliance qui met fin à une attaque terrestre préserve les soldats survivants des deux camps, ce qui traduit le passage de la guerre à la coopération."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.de]
text = "Mavia, auch Mawiyya genannt, führte arabische Gemeinschaften an Roms Ostgrenze und schloss im späten vierten Jahrhundert Frieden mit dem Reich."
title = "Mavia"
lang = "de"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, auch Mawiyya genannt, führte arabische Gemeinschaften an Roms Ostgrenze und schloss im späten vierten Jahrhundert Frieden mit dem Reich."]
sections = [{ title = "Verhandlungen mit Rom", paragraphs = ["Christliche Geschichtsschreiber, die auf Griechisch und Latein schrieben, berichten, Mavia habe nach dem Tod ihres Mannes die Führung übernommen. Ihre Truppen griffen römische Gebiete im Osten an. Die kaiserlichen Behörden suchten schließlich eine Einigung. Laut Sozomenos und Sokrates Scholastikos verlangte Mavia für den Frieden die Ernennung des Wüstenmönchs Moses zum Bischof ihres Volkes. Die Autoren konzentrieren sich auf kirchliche Konflikte und nennen weder genaue Grenzen noch verlässliche Truppenstärken. Sozomenos berichtet später von Männern, die Mavia zur Verteidigung Konstantinopels entsandt hatte. Im Spiel erhalten beide Seiten ihre überlebenden Soldaten zurück, wenn ein neues Bündnis einen Landangriff beendet. So wird der Übergang vom Krieg zur Zusammenarbeit dargestellt."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.it]
text = "Mavia, chiamata anche Mawiyya, guidò comunità arabe della frontiera orientale romana e concluse la pace con l’impero alla fine del IV secolo."
title = "Mavia"
lang = "it"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, chiamata anche Mawiyya, guidò comunità arabe della frontiera orientale romana e concluse la pace con l’impero alla fine del IV secolo."]
sections = [{ title = "Negoziare con Roma", paragraphs = ["Storici cristiani di lingua greca e latina raccontano che Mavia prese il comando dopo la morte del marito. Le sue forze attaccarono territori romani in Oriente e le autorità imperiali cercarono un accordo. Secondo Sozomeno e Socrate Scolastico, Mavia pose come condizione della pace la nomina a vescovo del suo popolo di Mosè, un monaco del deserto. Questi autori si concentrano sulle controversie religiose e non forniscono confini precisi o numeri attendibili per le sue truppe. In seguito Sozomeno attribuisce agli uomini inviati da Mavia un ruolo nella difesa di Costantinopoli. Nel gioco una nuova alleanza che pone fine a un attacco terrestre consente ai superstiti di entrambe le parti di rientrare, esprimendo il passaggio dalla guerra alla cooperazione."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.tr]
text = "Mawiyya olarak da bilinen Mavia, Roma’nın doğu sınırındaki Arap topluluklarına önderlik etti ve dördüncü yüzyılın sonlarında imparatorlukla barış yaptı."
title = "Mavia"
lang = "tr"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mawiyya olarak da bilinen Mavia, Roma’nın doğu sınırındaki Arap topluluklarına önderlik etti ve dördüncü yüzyılın sonlarında imparatorlukla barış yaptı."]
sections = [{ title = "Roma ile müzakere", paragraphs = ["Yunanca ve Latince yazan Hristiyan tarihçiler, Mavia’nın eşinin ölümünden sonra yönetimi üstlendiğini aktarır. Kuvvetleri doğudaki Roma topraklarına saldırdı ve imparatorluk yetkilileri sonunda uzlaşma aradı. Sozomenos ve Sokrates Skolastikos’a göre Mavia, çölde yaşayan keşiş Musa’nın halkına piskopos olarak atanmasını barışın şartı yaptı. Yazarların ilgisi öncelikle dinî anlaşmazlıklardır. Mavia’nın yönettiği bölgenin sınırlarını veya askerlerinin sayısını güvenilir biçimde vermezler. Sozomenos daha sonra Mavia’nın gönderdiği adamların Konstantinopolis’in savunmasına katıldığını anlatır. Oyun, bir kara saldırısını bitiren yeni ittifakta iki tarafın hayatta kalan askerlerini koruyarak savaştan iş birliğine geçişi temsil eder."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.zh-CN]
text = "玛维娅也被称为马维娅。她曾领导罗马东部边境的阿拉伯社群，并于公元四世纪后期与罗马帝国议和。"
title = "玛维娅"
lang = "zh-CN"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["玛维娅也被称为马维娅。她曾领导罗马东部边境的阿拉伯社群，并于公元四世纪后期与罗马帝国议和。"]
sections = [{ title = "与罗马议和", paragraphs = ["关于这位统治者的主要叙述出自用希腊文或拉丁文写作的基督教史家。按这些叙述，丈夫去世后，玛维娅接过领导权，先前与罗马维持的协议也告失效。她的军队随后进攻东部边境地区，帝国方面开始寻求停战。索佐门和教会史家苏格拉底都记载了玛维娅提出的和谈条件：让隐居沙漠的修士摩西担任她的人民的主教。在这一叙事中，罗马方面需要停止军事冲突，玛维娅则借谈判决定她愿意接受的安排。作者对摩西由谁祝圣、与当时不同教派的关系等问题着墨较多。这些篇章给出了一条可以辨识的战争和议和线索，却没有留下可据以重建玛维娅统治疆界的行政档案，也没有提供可信的兵员总数。现代叙述多把这场战争放在瓦伦斯统治末期，与罗马在其他边境承受的军事压力一并考察。索佐门又记载，后来君士坦丁堡受到威胁时，玛维娅派去的人参与了城市防御。这条后续记录让人看到，交战双方可以在达成协议之后重新合作。对于该读到怎样的个人传记，史料仍有不少空白：没有充分材料确定她的一生经历，也不宜把宗教史家的道德评价视为对战场的中立观察。在游戏里，技能名来自议和中提到的修士。它将谈判终结冲突的结果转化为一条可操作的规则：如果玛维娅和一名对手之间仍有陆上进攻，双方结盟时，仍在战场上的士兵可以撤回各自的军队而免除通常的撤退损失。已损失的士兵不会重新出现，兵力上限依然适用。玩家在仍有部队投入战斗时便能决定是否提出结盟，因此这一技能为正在交战的双方创造了谈判的理由。该规则也区分了陆上进攻与海上交战，两者在游戏中的处理不同。它表达的是从敌对到合作的转变，而不是说古代和约记载了精确的撤退人数或一项适用于所有战役的固定规则。"] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.ja]
text = "マウィヤはローマ東方国境のアラブ諸集団を率い、四世紀後半に帝国と和平を結んだ。ギリシア語の史料ではマウィアとも表記される。"
title = "マウィヤ"
lang = "ja"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["マウィヤはローマ東方国境のアラブ諸集団を率い、四世紀後半に帝国と和平を結んだ。ギリシア語の史料ではマウィアとも表記される。"]
sections = [{ title = "ローマとの交渉", paragraphs = ["彼女についての主な記述は、ギリシア語やラテン語で書かれたキリスト教の教会史に残っている。これらの記述によれば、夫が死去した後にマウィヤが指導権を引き継ぎ、ローマとの従来の取り決めは失効した。彼女の部隊が東方のローマ領を攻撃すると、帝国側は交渉によって戦いを終わらせようとした。ソゾメノスとソクラテス・スコラスティコスは、砂漠に暮らす修道士モーセを自らの民の司教にすることを、マウィヤが和平の条件にしたと記す。誰がモーセを叙階するかという教会内の対立は、これらの著者が多くの紙幅を割いた論点である。記事は交渉の経緯を伝えているが、女王の領域を地図に描けるほど正確な境界や、確かな兵力の数は伝えていない。現代の研究では、この事件を皇帝ウァレンスの晩年、ローマが別の国境でも軍事的な圧力を受けていた時期に置いて考える。ソゾメノスの後の巻には、コンスタンティノープルが脅かされた際にマウィヤが派遣した人々がその防衛を助けたという記述がある。これは、かつての交戦相手と和平後に協力する余地があったことを示す一例である。宗教史家がそれぞれの論争に関心を持っていたことを踏まえると、評価の言葉と、女王が条件を提示して合意を結んだという叙述は分けて読む必要がある。ゲームの能力は、この交渉が敵対関係を協力に切り替えたことに由来する。陸上の攻撃が続いている相手と同盟を結ぶと、両陣営の生き残った攻撃部隊が通常の撤退損失を受けずに帰還できる。すでに失われた兵力が戻るわけではなく、各陣営の保有上限は引き続き適用される。部隊が戦場にいるうちに停戦を選ぶ理由を両者に与えるためのルールであり、古代の条約から具体的な兵員の数字を読み取ったものではない。"] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.ko]
text = "마비아 또는 마위야는 로마 동부 국경의 아랍 공동체를 이끌었으며 4세기 후반에 제국과 평화 협정을 맺었다."
title = "마비아"
lang = "ko"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["마비아 또는 마위야는 로마 동부 국경의 아랍 공동체를 이끌었으며 4세기 후반에 제국과 평화 협정을 맺었다."]
sections = [{ title = "로마와의 협상", paragraphs = ["그에 관한 주요 이야기는 그리스어와 라틴어로 쓰인 기독교 교회사에 남아 있다. 그 기록들은 남편이 사망한 뒤 마비아가 지도권을 넘겨받았다고 전한다. 기존의 로마와의 협정이 효력을 잃고 그의 부대가 동부 로마 영토를 공격하자 제국 당국은 전쟁을 끝낼 조건을 찾았다. 소조메노스와 소크라테스 스콜라스티코스에 따르면 마비아는 사막에 살던 수도사 모세를 자기 백성의 주교로 임명할 것을 평화의 조건으로 삼았다. 저자들이 관심을 둔 주제에는 모세를 누가 서임하는가와 당시 교회 내부의 종교 갈등도 포함된다. 이 기록들을 통해 교전과 협상의 큰 흐름은 알 수 있지만 마비아가 다스린 지역의 정확한 경계나 군대의 규모는 확정하기 어렵다. 현대의 역사 서술은 대체로 이 일을 로마가 여러 국경에서 동시에 군사적 압박을 받던 발렌스 황제 말기에 놓는다. 소조메노스는 뒤이어 콘스탄티노폴리스가 위협받을 때 마비아가 보낸 사람들이 그 도시의 방어를 도왔다고 전한다. 이전에 싸웠던 집단이 협정 이후에 협력할 수 있었던 사례다. 이 자료들을 읽을 때에는 종교 역사가의 평가와 마비아가 협정의 조건을 제시하고 합의에 이르렀다는 기록을 구분할 필요가 있다. 게임에서는 이러한 적대 관계에서 협력으로의 전환을 모세의 평화라는 능력으로 표현한다. 두 세력 사이의 육상 공격이 진행되는 동안 동맹을 맺으면 남아 있는 공격 부대가 통상적인 철수 손실을 입지 않고 돌아간다. 이미 잃은 병력은 복구되지 않으며 양측의 보유 한도도 그대로 적용된다. 전장에 아직 병력이 남아 있을 때 양쪽 모두 협정을 선택할 이유를 마련하는 규칙으로, 고대의 기록이 정확한 철수 병력 수를 알려 준다는 뜻은 아니다."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.ar]
text = "قادت ماوية، المعروفة أيضاً باسم مافيا، جماعات عربية على الحدود الشرقية لروما وعقدت صلحاً مع الإمبراطورية في أواخر القرن الرابع."
title = "ماوية"
lang = "ar"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["قادت ماوية، المعروفة أيضاً باسم مافيا، جماعات عربية على الحدود الشرقية لروما وعقدت صلحاً مع الإمبراطورية في أواخر القرن الرابع."]
sections = [{ title = "التفاوض مع روما", paragraphs = ["يذكر مؤرخون مسيحيون كتبوا باليونانية واللاتينية أنها تولت القيادة بعد وفاة زوجها. هاجمت قواتها أراضي رومانية في الشرق، فسعت السلطات الإمبراطورية في نهاية المطاف إلى تسوية. وبحسب سوزومين وسقراط المؤرخ، اشترطت ماوية للصلح تعيين موسى، وهو راهب أقام في الصحراء، أسقفاً على قومها. يهتم هؤلاء المؤلفون بالخلافات الدينية ولا يحددون حدود نفوذها بدقة أو يقدمون أعداداً موثوقة لقواتها. ويذكر سوزومين في روايته اللاحقة أن رجالاً أرسلتهم ساعدوا في الدفاع عن القسطنطينية. تجسد القدرة في اللعبة الانتقال من الحرب إلى التعاون. عندما ينهي تحالف جديد هجوماً برياً، يمكن للمقاتلين الناجين من الطرفين الرجوع إلى قواتهما في حدود السعة المتاحة. ولا تتضمن الروايات القديمة أرقاماً يمكن تحويلها إلى قاعدة محددة لخسائر الانسحاب."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.ru]
text = "Мавия, также известная как Мавийя, возглавляла арабские общины на восточной границе Рима и заключила мир с империей в конце IV века."
title = "Мавия"
lang = "ru"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Мавия, также известная как Мавийя, возглавляла арабские общины на восточной границе Рима и заключила мир с империей в конце IV века."]
sections = [{ title = "Переговоры с Римом", paragraphs = ["Христианские историки, писавшие по-гречески и по-латыни, рассказывают, что Мавия приняла власть после смерти мужа. Её войска напали на римские владения на востоке, и имперские власти стали искать соглашения. По словам Созомена и Сократа Схоластика, условием мира она сделала назначение пустынного монаха Моисея епископом своего народа. Авторы уделяют особое внимание церковным спорам и не дают точных границ владений или достоверной численности армии. Позднее Созомен сообщает, что люди, присланные Мавией, помогли в обороне Константинополя. Игровая способность отражает переход от войны к сотрудничеству: когда новый союз прекращает сухопутную атаку, выжившие войска обеих сторон возвращаются в пределах их лимитов."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.vi]
text = "Mavia, còn gọi là Mawiyya, lãnh đạo các cộng đồng Ả Rập ở biên giới phía đông La Mã và ký hòa ước với đế quốc vào cuối thế kỷ thứ tư."
title = "Mavia"
lang = "vi"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, còn gọi là Mawiyya, lãnh đạo các cộng đồng Ả Rập ở biên giới phía đông La Mã và ký hòa ước với đế quốc vào cuối thế kỷ thứ tư."]
sections = [{ title = "Đàm phán với La Mã", paragraphs = ["Các sử gia Kitô giáo viết bằng tiếng Hy Lạp và Latinh kể rằng Mavia nắm quyền lãnh đạo sau khi chồng qua đời. Quân của bà tiến công các vùng đất La Mã ở phía đông và nhà chức trách đế quốc cuối cùng tìm cách thương lượng. Theo Sozomen và Socrates Scholasticus, bà đặt điều kiện hòa bình là bổ nhiệm Moses, một tu sĩ sống trong sa mạc, làm giám mục cho dân mình. Các tác giả chú trọng những tranh chấp tôn giáo, không cung cấp ranh giới chính xác hoặc số quân đáng tin cậy. Sozomen sau đó kể rằng những người được bà cử đi đã góp phần bảo vệ Constantinople. Kỹ năng trong trò chơi thể hiện sự chuyển đổi từ chiến tranh sang hợp tác: khi một liên minh mới chấm dứt cuộc tấn công trên bộ, binh sĩ còn sống của cả hai bên được trở về trong giới hạn quân số."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.id]
text = "Mavia, juga dikenal sebagai Mawiyya, memimpin komunitas Arab di perbatasan timur Romawi dan berdamai dengan kekaisaran pada akhir abad keempat."
title = "Mavia"
lang = "id"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mavia, juga dikenal sebagai Mawiyya, memimpin komunitas Arab di perbatasan timur Romawi dan berdamai dengan kekaisaran pada akhir abad keempat."]
sections = [{ title = "Berunding dengan Roma", paragraphs = ["Sejarawan Kristen yang menulis dalam bahasa Yunani dan Latin mengisahkan bahwa Mavia mengambil alih kepemimpinan setelah suaminya meninggal. Pasukannya menyerang wilayah Romawi di timur hingga pejabat kekaisaran mencari penyelesaian. Menurut Sozomen dan Sokrates Skolastikos, Mavia menetapkan pengangkatan Musa, seorang rahib yang tinggal di gurun, sebagai uskup bagi kaumnya sebagai syarat perdamaian. Para penulis menaruh perhatian pada perselisihan keagamaan dan tidak memberikan batas wilayah yang pasti atau jumlah pasukan yang dapat diandalkan. Sozomen kemudian menulis bahwa orang-orang yang dikirim Mavia membantu membela Konstantinopel. Kemampuan dalam gim menggambarkan peralihan dari perang ke kerja sama dengan mengembalikan pasukan yang selamat saat persekutuan baru mengakhiri serangan darat."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.fil]
text = "Pinamunuan ni Mavia, na kilala rin bilang Mawiyya, ang mga pamayanang Arabo sa silangang hangganan ng Roma. Nakipagkasundo siya sa imperyo sa huling bahagi ng ikaapat na siglo."
title = "Mavia"
lang = "fil"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Pinamunuan ni Mavia, na kilala rin bilang Mawiyya, ang mga pamayanang Arabo sa silangang hangganan ng Roma. Nakipagkasundo siya sa imperyo sa huling bahagi ng ikaapat na siglo."]
sections = [{ title = "Pakikipagkasundo sa Roma", paragraphs = ["Ayon sa mga Kristiyanong mananalaysay na sumulat sa Griyego at Latin, kinuha ni Mavia ang pamumuno pagkamatay ng asawa niya. Sinalakay ng kaniyang hukbo ang mga lupain ng Roma sa silangan at naghanap ng kasunduan ang mga opisyal ng imperyo. Isinalaysay nina Sozomen at Socrates Scholasticus na hiniling niyang italagang obispo ng kaniyang mga tao si Moises, isang mongheng naninirahan sa disyerto. Nakatuon ang mga manunulat sa mga tunggaliang panrelihiyon kaya hindi tiyak mula sa kanilang mga ulat ang mga hangganan ng lupain o ang dami ng kawal ni Mavia. Kalaunan, sinabi ni Sozomen na tumulong sa pagtatanggol sa Constantinople ang mga tauhang ipinadala niya. Sa laro, inilalarawan ang paglipat mula digmaan patungong pagtutulungan sa pagbabalik ng mga nakaligtas na kawal kapag tinatapos ng bagong alyansa ang isang pag-atake sa lupa."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]

[articles.pt-BR]
text = "Mávia, também chamada Mawiyya, liderou comunidades árabes da fronteira oriental romana e fez as pazes com o império no fim do século IV."
title = "Mávia"
lang = "pt-BR"
url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html"
shortArticle = true
intro = ["Mávia, também chamada Mawiyya, liderou comunidades árabes da fronteira oriental romana e fez as pazes com o império no fim do século IV."]
sections = [{ title = "Negociar com Roma", paragraphs = ["Historiadores cristãos que escreveram em grego e latim contam que Mávia assumiu a liderança após a morte do marido. Suas forças atacaram terras romanas no Oriente e as autoridades imperiais acabaram buscando um acordo. Segundo Sozômeno e Sócrates Escolástico, Mávia condicionou a paz à nomeação de Moisés, um monge do deserto, como bispo de seu povo. Os autores se concentram em disputas religiosas e não fornecem fronteiras exatas ou números confiáveis para suas forças. Mais tarde, Sozômeno atribui aos homens enviados por Mávia uma participação na defesa de Constantinopla. A habilidade representa a passagem da guerra à cooperação: quando uma nova aliança encerra um ataque terrestre, as tropas sobreviventes dos dois lados retornam até seus limites."] }]
sources = [{ title = "Sozomen, Ecclesiastical History VI.38", url = "https://catholiclibrary.org/library/view?chunk.id=00000293&docId=%2FFathers-Synchronized-EN%2FHermias_Sozomenos__Historia_ecclesiastica.en.html" }, { title = "Socrates Scholasticus, Church History IV.36", url = "https://www.newadvent.org/fathers/26014.htm" }, { title = "Sozomen, Ecclesiastical History VII.1", url = "https://www.newadvent.org/fathers/26027.htm" }, { title = "Archaeology, Mavia of Arabia", url = "https://archive.archaeology.org/online/features/iron_ladies/mavia.html" }]
