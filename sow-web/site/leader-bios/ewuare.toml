[articles.ko]
text = "에우아레 1세는 15세기 중반 오늘날 나이지리아에 있던 베닌 왕국을 다스렸다. 왕조 전승은 정치와 군사 개혁, 수도 안쪽의 해자 공사를 그에게 돌린다. 해자와 흙으로 쌓은 둑은 도시를 지키고, 출입하는 사람들이 경비병이 있는 문을 지나도록 했다. 고고학 연구는 넓은 지역의 토공 시설이 오랜 기간에 걸쳐 건설되고 개조되었음을 보여 준다. 안쪽 해자를 에우아레의 사업으로 보는 설명은 전승과 역사 연구에 근거한다. 각 구간의 건설 시기와 공사를 맡긴 사람은 유적별로 따로 살펴야 한다. 수도의 안쪽 해자와 더 넓게 뻗은 토공 시설을 구분하면 왕도의 방어와 후대까지 이어진 공사를 함께 이해할 수 있다. 로드아일랜드 디자인 스쿨 미술관은 에우아레를 장인 길드의 재편과 왕실 제단에 놓을 기념 두상의 제작 의뢰에 연결한다. 금속을 주조하는 장인과 조각가는 이전부터 궁정을 위해 일했다. 새 왕이 선왕을 기리는 두상을 주문하는 관습에서 장인의 기술은 왕위 계승의 의례를 뒷받침했다. 게임의 ‘길드 구역’은 도시와 공방의 관계에서 착안했다. 가동 중인 자기 도시에서 20칸 이내의 자기 공장은 가동 레벨마다 게임 시간 1초당 금 1을 추가로 생산한다. 같은 공장 주변에 조건을 충족하는 도시가 여러 곳 있더라도 보너스는 한 번만 계산한다. 가령 2레벨 공장은 주변 도시 수와 관계없이 조건이 충족되면 초당 금 2를 더 생산한다. 공장과 금은 게임에서 생산을 표현하는 방식이며, 베닌의 궁정 공방에서는 전문 기술을 지닌 장인들이 의례에 쓰이는 물건을 만들었다."
title = "대왕 에우아레"
lang = "ko"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
