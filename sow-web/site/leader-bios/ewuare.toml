[articles.zh-CN]
text = "埃乌阿雷一世在十五世纪中叶统治贝宁王国，其王都位于今尼日利亚境内。贝宁王室传统把多项政治与军事改革归于他，也把王都内侧壕沟的开挖与他的统治联系起来。壕沟与旁边的土垒共同保护城区，来往的人通过受守卫控制的城门进出。考古研究所记录的是一个规模很大、历经多个时期建设与改造的土方体系。王朝传承和后来的历史研究为理解内壕提供了线索，考古遗迹则能帮助研究者辨认防御工程的位置和结构。各段遗迹可能形成于不同时间，具体年代和建造者需要分别判断。考古报告也记录了王宫建筑的不同阶段。讨论埃乌阿雷的工程时，王都内侧的壕沟与范围更广的土方设施应分开考察。这样既能理解传统所记的王都建设，也能看到后来的城市防御如何逐步改变。 罗德岛设计学院博物馆的研究还把埃乌阿雷的统治与工匠行会的重组联系起来。金属铸造师和雕刻师原先就为宫廷工作，工匠为王室祭坛制作的纪念头像也成为宫廷礼仪的一部分。纪念头像用于纪念先王，新君通过委托制作这样的作品，把手艺人的工作与王位传承联系在一起。这些工匠团体的生产服务于具体的仪式和宫廷需求。馆方还指出，重组后的行会以家族为单位，宫廷按照技艺和贡献授予头衔。贝宁工匠在埃乌阿雷以前已掌握黄铜和青铜加工，因此相关传统强调的是组织和赞助的变化。游戏中的「行会街区」取材于城市、手工业与王室资助的关系，用邻近城市的工厂来表现这种联系。己方工厂在己方运作中的城市二十格以内时，每个有效等级每游戏秒额外产生一金币。一级工厂产生一份收益，二级工厂产生两份。判定以工厂是否靠近至少一座符合条件的城市为准，即使附近有多座城市，同一工厂的收益也只计算一次。工厂与金币是游戏中的表现方式，历史上的宫廷作坊则依靠有专门技艺的工匠生产礼仪用品。"
title = "大埃乌阿雷"
lang = "zh-CN"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
