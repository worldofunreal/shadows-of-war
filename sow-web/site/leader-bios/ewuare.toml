[articles.it]
text = "Ewuare I governò il regno del Benin, nell’odierna Nigeria, a metà del XV secolo. La tradizione dinastica gli attribuisce riforme politiche e militari e lo scavo di un fossato interno nella capitale. Il fossato e il terrapieno difendevano la città e indirizzavano gli ingressi verso porte sorvegliate. L’archeologia documenta un sistema di opere in terra costruito e modificato nel corso di un lungo periodo. L’attribuzione del fossato interno si basa sulla tradizione e sugli studi storici. La data e il committente di ogni tratto restano in parte incerti. Il Museo RISD collega Ewuare alla riorganizzazione delle corporazioni artigiane e alla commissione di teste commemorative per gli altari reali. Fonditori e intagliatori lavoravano già per la corte e conservarono un ruolo nella vita cerimoniale. Quartieri delle corporazioni adatta il rapporto tra la città e le botteghe. Ogni livello attivo di una tua fabbrica entro 20 caselle da una tua città attiva genera 1 oro extra per secondo di gioco. Più città vicine non sommano il bonus della stessa fabbrica."
title = "Ewuare il Grande"
lang = "it"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
