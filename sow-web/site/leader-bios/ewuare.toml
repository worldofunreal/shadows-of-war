[articles.ar]
text = "حكم إيواري الأول مملكة بنين، في نيجيريا الحالية، في منتصف القرن الخامس عشر. وتنسب إليه تقاليد السلالة إصلاحات سياسية وعسكرية وحفر خندق داخلي في العاصمة. ساعد الخندق وساتره الترابي على حماية المدينة وتوجيه الداخلين عبر أبواب محروسة. وتوثق الآثار منظومة تحصينات ترابية أُنشئت وعدّلت على مدى طويل. ويستند ربط الخندق الداخلي بإيواري إلى التقاليد والدراسات التاريخية، فيما يظل تحديد تاريخ كل جزء ومن أمر ببنائه مسألة مفتوحة. يربط متحف مدرسة رود آيلاند للتصميم إيواري بإعادة تنظيم نقابات الحرفيين وبطلب صنع رؤوس تذكارية للمذابح الملكية. وكان صبّابو المعادن والنحاتون يعملون للبلاط من قبل، وظلت أعمالهم جزءاً من المراسم. وتمثل قدرة «أحياء النقابات» الصلة بين المدينة وورشها. يولد كل مستوى فعّال في مصنع تملكه على بعد 20 خانة أو أقل من مدينة فعالة لك قطعة ذهب إضافية كل ثانية لعب. وتعدد المدن القريبة لا يضاعف عائد المصنع نفسه."
title = "إيواري العظيم"
lang = "ar"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
