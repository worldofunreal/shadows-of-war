[articles.tr]
text = "I. Ewuare, on beşinci yüzyılın ortalarında bugünkü Nijerya’da bulunan Benin Krallığı’nı yönetti. Hanedan geleneği siyasi ve askerî reformları ve başkentteki iç hendeğin kazılmasını ona bağlar. Hendek ve toprak set şehri korur, girişleri muhafızların denetlediği kapılara yönlendirirdi. Arkeoloji, uzun bir dönem boyunca yapılıp değiştirilen bir toprak tahkimat sistemini belgeliyor. İç hendeğin Ewuare’ye atfedilmesi gelenek ve tarih araştırmalarına dayanır. Her bölümün tarihi ve kimin yaptırdığı kesin değildir. RISD Müzesi, Ewuare’yi zanaatkâr loncalarının yeniden düzenlenmesi ve kraliyet sunakları için anma başlarının sipariş edilmesiyle ilişkilendirir. Dökümcüler ve oymacılar zaten saray için çalışıyordu ve tören yaşamında önemlerini korudular. Lonca Mahalleleri, şehir ve atölyeler arasındaki bağı oyuna taşır. Kendi etkin şehrinin 20 kare yakınındaki kendi fabrikalarının her etkin seviyesi, oyun saniyesi başına 1 ek altın üretir. Birden fazla yakın şehir aynı fabrikanın bonusunu artırmaz."
title = "Büyük Ewuare"
lang = "tr"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
