[articles.de]
text = "Ewuare I. regierte Mitte des 15. Jahrhunderts das Königreich Benin im heutigen Nigeria. Die dynastische Überlieferung schreibt ihm politische und militärische Reformen sowie die Anlage eines inneren Grabens in der Hauptstadt zu. Graben und Erdwall schützten die Stadt und leiteten den Zugang durch bewachte Tore. Archäologische Untersuchungen dokumentieren ein System von Erdbefestigungen, das über lange Zeit angelegt und verändert wurde. Die Zuschreibung des inneren Grabens stützt sich auf Traditionen und historische Studien. Die Datierung und der Auftraggeber einzelner Abschnitte sind teils offen. Das RISD Museum bringt Ewuare mit der Neuordnung der Handwerkerzünfte und dem Auftrag für Gedenkköpfe auf königlichen Altären in Verbindung. Gießer und Schnitzer arbeiteten bereits für den Hof und behielten ihre Rolle im zeremoniellen Leben. Zunftviertel greift die Verbindung von Stadt und Werkstätten auf. Jede aktive Stufe einer eigenen Fabrik im Umkreis von 20 Feldern einer eigenen aktiven Stadt erzeugt pro Spielsekunde 1 zusätzliches Gold. Mehrere nahe Städte erhöhen den Bonus für dieselbe Fabrik nicht."
title = "Ewuare der Große"
lang = "de"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
