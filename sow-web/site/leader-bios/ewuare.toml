[articles.pt-BR]
text = "Ewuare I governou o Reino do Benim, na atual Nigéria, em meados do século XV. A tradição dinástica lhe atribui reformas políticas e militares e a abertura de um fosso interno na capital. O fosso e o talude ajudavam a defender a cidade e direcionavam a entrada por portões vigiados. A arqueologia documenta um sistema de fortificações de terra construído e modificado por um longo período. A atribuição do fosso interno a Ewuare vem de tradições e estudos históricos. A data e o responsável por cada trecho ainda precisam ser determinados separadamente. O Museu RISD associa Ewuare à reorganização das guildas de artesãos e à encomenda de cabeças comemorativas para altares reais. Fundidores e entalhadores já trabalhavam para a corte e preservaram um papel nas cerimônias. Bairros das guildas adapta o vínculo entre a cidade e suas oficinas. Cada nível ativo de uma fábrica própria a até 20 casas de uma cidade própria ativa gera 1 de ouro extra por segundo de jogo. A presença de várias cidades próximas não acumula o bônus de uma mesma fábrica."
title = "Ewuare, o Grande"
lang = "pt-BR"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
