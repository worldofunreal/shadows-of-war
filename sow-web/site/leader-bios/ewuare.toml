[articles.ja]
text = "エウアレ一世は十五世紀半ば、現在のナイジェリアにあったベニン王国を治めた。王朝の伝承では、政治と軍事の改革を進め、王都の内側の堀を掘らせたとされる。堀と土塁は都市の守りを固め、人の出入りを見張りのいる門へ導いた。考古学の調査では、広い範囲にわたる土の構造物が、長い期間をかけて築かれ、改変されたことが示されている。内堀をエウアレの事業とする説明は、ベニンの伝承とそれを扱う歴史研究に基づく。遺構から工事の位置や構造を調べられる一方で、すべての区間の建設年代や発注者が確定しているわけではない。王都の内堀と、より広い地域に伸びる土の構造物を区別すると、王都の防備と長期にわたる整備を分けて考えることができる。 ロードアイランド・スクール・オブ・デザイン美術館は、エウアレを職人組合の再編と、王家の祭壇に置く記念像の発注に結び付けている。鋳造職人や彫刻職人はそれ以前から宮廷のために働いていた。先代の王をしのぶ頭像を新たな王が作らせる慣習では、職人の技術が王位継承の儀礼を支えた。同館は、組合を家系ごとに編成し、技術や新しい工夫に応じて称号を与えたとも説明している。ベニンの金属職人は、それ以前から真鍮や青銅を扱っていた。ゲームの「職人組合の街区」は、都市と工房の関係に着想を得ている。稼働中の自軍都市から二十マス以内にある自軍工場は、稼働レベルごとにゲーム内一秒あたり金一を追加で生産する。一つの工場について条件を満たす都市が複数あっても、増える金は工場のレベルだけで決まる。工房の仕事を表すため、ゲームでは施設の配置と生産を結び付けている。史料に登場する工房では、鋳造や彫刻に熟練した職人が、宮廷の儀礼で使う品を作っていた。"
title = "エウアレ大王"
lang = "ja"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
