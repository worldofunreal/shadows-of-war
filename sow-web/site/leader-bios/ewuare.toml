[articles.es]
text = "Ewuare I gobernó el reino de Benín, en la actual Nigeria, a mediados del siglo XV. La tradición dinástica le atribuye reformas políticas y militares y la excavación de un foso interior en la capital. El foso y su terraplén contribuían a defender la ciudad y encauzaban la entrada por puertas vigiladas. La arqueología documenta un sistema de defensas de tierra que se construyó y modificó durante un periodo largo. La atribución del foso interior a Ewuare procede de tradiciones y estudios históricos, y quedan por establecer el autor y la fecha de cada tramo. El Museo RISD vincula a Ewuare con la reorganización de los gremios artesanos y con el encargo de cabezas conmemorativas para los altares de los reyes. Los fundidores y tallistas ya trabajaban para la corte, y sus oficios conservaron un papel en la vida ceremonial. Barrios de gremios adapta el vínculo entre la ciudad y esos talleres. Cada nivel activo de fábrica propia a 20 casillas o menos de una ciudad propia activa produce 1 de oro extra por segundo de juego. Una fábrica recibe el mismo beneficio aunque esté cerca de varias ciudades."
title = "Ewuare el Grande"
lang = "es"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
intro = ["Ewuare I gobernó el reino de Benín, en la actual Nigeria, a mediados del siglo XV. La tradición dinástica le atribuye reformas políticas y militares y la excavación de un foso interior en la capital. El foso y su terraplén contribuían a defender la ciudad y encauzaban la entrada por puertas vigiladas. La arqueología documenta un sistema de defensas de tierra que se construyó y modificó durante un periodo largo. La atribución del foso interior a Ewuare procede de tradiciones y estudios históricos, y quedan por establecer el autor y la fecha de cada tramo."]
