intro = ["I. Ewuare, on beşinci yüzyılın ortalarında bugünkü Nijerya’da bulunan Benin Krallığı’nı yönetti. Hanedan geleneği siyasi ve askerî reformları ve başkentteki iç hendeğin kazılmasını ona bağlar. Hendek ve toprak set şehri korur, girişleri muhafızların denetlediği kapılara yönlendirirdi. Arkeoloji, uzun bir dönem boyunca yapılıp değiştirilen bir toprak tahkimat sistemini belgeliyor. İç hendeğin Ewuare’ye atfedilmesi gelenek ve tarih araştırmalarına dayanır. Her bölümün tarihi ve kimin yaptırdığı kesin değildir."]
