[articles.ru]
text = "Эвуаре I правил Бенинским царством на территории современной Нигерии в середине XV века. Династическая традиция приписывает ему политические и военные реформы, а также устройство внутреннего рва столицы. Ров и земляной вал защищали город и направляли входящих к охраняемым воротам. Археологические исследования показывают, что обширную систему земляных сооружений строили и меняли долгое время. Связь внутреннего рва с Эвуаре опирается на традицию и исторические исследования. Даты и заказчики отдельных участков остаются предметом изучения. Музей RISD связывает Эвуаре с переустройством ремесленных гильдий и заказами памятных голов для царских алтарей. Литейщики и резчики работали на двор и раньше, и их ремёсла сохраняли значение для церемоний. «Кварталы гильдий» передают связь города с мастерскими. Каждый активный уровень своей фабрики в радиусе 20 клеток от своего действующего города приносит 1 дополнительное золото за игровую секунду. Несколько городов поблизости не увеличивают доход той же фабрики."
title = "Эвуаре Великий"
lang = "ru"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
