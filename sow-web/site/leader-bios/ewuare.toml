[articles.fr]
text = "Ewuare Ier régna sur le royaume du Bénin, dans l’actuel Nigeria, au milieu du XVe siècle. La tradition dynastique lui attribue des réformes politiques et militaires ainsi que le creusement d’un fossé intérieur dans la capitale. Le fossé et son talus défendaient la ville et canalisaient l’entrée vers des portes gardées. L’archéologie documente un ensemble de fortifications de terre construit et remanié sur une longue période. L’attribution du fossé intérieur à Ewuare vient de traditions et de travaux historiques. La date et le commanditaire de chaque section restent à préciser. Le musée de la RISD associe Ewuare à la réorganisation des guildes d’artisans et à la commande de têtes commémoratives pour les autels royaux. Les fondeurs et sculpteurs travaillaient déjà pour la cour et leurs métiers gardèrent un rôle dans la vie cérémonielle. Quartiers des guildes adapte le lien entre la ville et ses ateliers. Chaque niveau actif d’une usine vous appartenant à 20 cases ou moins d’une de vos villes actives produit 1 pièce d’or supplémentaire par seconde de jeu. La proximité de plusieurs villes ne multiplie pas le bonus de la même usine."
title = "Ewuare le Grand"
lang = "fr"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
intro = ["Ewuare Ier régna sur le royaume du Bénin, dans l’actuel Nigeria, au milieu du XVe siècle. La tradition dynastique lui attribue des réformes politiques et militaires ainsi que le creusement d’un fossé intérieur dans la capitale. Le fossé et son talus défendaient la ville et canalisaient l’entrée vers des portes gardées. L’archéologie documente un ensemble de fortifications de terre construit et remanié sur une longue période. L’attribution du fossé intérieur à Ewuare vient de traditions et de travaux historiques. La date et le commanditaire de chaque section restent à préciser."]
