[articles.vi]
text = "Ewuare I trị vì Vương quốc Benin ở vùng đất nay thuộc Nigeria vào giữa thế kỷ XV. Truyền thống vương triều gắn ông với các cải cách chính trị và quân sự cũng như việc đào hào trong của kinh đô. Hào và lũy đất bảo vệ đô thành và hướng người ra vào qua các cổng có lính canh. Khảo cổ học ghi nhận một hệ thống công trình đất được xây dựng và chỉnh sửa qua nhiều thời kỳ. Việc quy công trình hào trong cho Ewuare dựa vào truyền thống và nghiên cứu lịch sử, còn niên đại và người cho xây từng đoạn vẫn cần được xác định riêng. Bảo tàng RISD gắn Ewuare với việc tổ chức lại các phường thợ và đặt làm tượng đầu tưởng niệm cho bàn thờ hoàng gia. Thợ đúc và thợ chạm đã làm việc cho cung đình từ trước và tiếp tục phục vụ nghi lễ. Phường hội thợ đưa mối liên hệ giữa đô thị và xưởng thợ vào trận đấu. Mỗi cấp đang hoạt động của nhà máy thuộc bạn trong phạm vi 20 ô của một thành phố đang hoạt động của bạn tạo thêm 1 vàng mỗi giây trong game. Nhiều thành phố ở gần cũng chỉ cho nhà máy đó một lần hưởng hiệu ứng."
title = "Ewuare Đại đế"
lang = "vi"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
intro = ["Ewuare I trị vì Vương quốc Benin ở vùng đất nay thuộc Nigeria vào giữa thế kỷ XV. Truyền thống vương triều gắn ông với các cải cách chính trị và quân sự cũng như việc đào hào trong của kinh đô. Hào và lũy đất bảo vệ đô thành và hướng người ra vào qua các cổng có lính canh. Khảo cổ học ghi nhận một hệ thống công trình đất được xây dựng và chỉnh sửa qua nhiều thời kỳ. Việc quy công trình hào trong cho Ewuare dựa vào truyền thống và nghiên cứu lịch sử, còn niên đại và người cho xây từng đoạn vẫn cần được xác định riêng."]
sections = [{ title = "Phường hội và kinh đô", paragraphs = ["Bảo tàng RISD gắn Ewuare với việc tổ chức lại các phường thợ và đặt làm tượng đầu tưởng niệm cho bàn thờ hoàng gia. Thợ đúc và thợ chạm đã làm việc cho cung đình từ trước và tiếp tục phục vụ nghi lễ. Phường hội thợ đưa mối liên hệ giữa đô thị và xưởng thợ vào trận đấu. Mỗi cấp đang hoạt động của nhà máy thuộc bạn trong phạm vi 20 ô của một thành phố đang hoạt động của bạn tạo thêm 1 vàng mỗi giây trong game. Nhiều thành phố ở gần cũng chỉ cho nhà máy đó một lần hưởng hiệu ứng."] }]
sources = [{ title = "G. S. A. O. O. Egharevba, The Military System of Benin Kingdom, University of Hamburg", url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf" }, { title = "MOWAA Archaeology Project, Antiquity/Cambridge University Press", url = "https://doi.org/10.15184/aqy.2025.10189" }, { title = "The Head in Focus, RISD Museum", url = "https://risdmuseum.org/art-design/projects-publications/articles/head-focus" }]

[articles.id]
text = "Ewuare I memerintah Kerajaan Benin di wilayah Nigeria sekarang pada pertengahan abad kelima belas. Tradisi dinasti mengaitkannya dengan reformasi politik dan militer serta penggalian parit dalam ibu kota. Parit dan tanggul melindungi kota dan mengarahkan orang ke gerbang yang dijaga. Arkeologi mendokumentasikan jaringan benteng tanah yang dibangun dan diubah dalam jangka panjang. Hubungan parit dalam dengan Ewuare bersumber dari tradisi dan penelitian sejarah. Waktu dan pembangun setiap bagiannya masih perlu dikaji tersendiri. Museum RISD mengaitkan Ewuare dengan penataan ulang gilda perajin dan pemesanan patung kepala peringatan untuk altar kerajaan. Pengecor logam dan pemahat telah bekerja untuk istana sebelumnya dan tetap berperan dalam upacara. Kawasan Gilda mengadaptasi hubungan kota dengan tempat kerja para perajin. Setiap tingkat aktif pabrik milikmu dalam jarak 20 petak dari kota aktif milikmu menghasilkan 1 emas tambahan per detik permainan. Beberapa kota yang berdekatan tidak menambah bonus untuk pabrik yang sama."
title = "Ewuare Agung"
