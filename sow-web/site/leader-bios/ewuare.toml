[articles.en]
text = "Ewuare I, remembered as Ewuare the Great, ruled the Kingdom of Benin in the mid-fifteenth century. Historical accounts credit him with major political and military reforms and with directing the digging of an inner moat at the capital. The attribution comes through Benin dynastic tradition and later histories; archaeology confirms a vast, layered system of earthworks but does not make every section’s builder or date certain. The inner ditch and its earthen bank helped defend the capital, regulate entry through guarded gates and control access to roads. A University of Hamburg study describes the central moat as part of Ewuare’s military building programme, while recent archaeological work by the Museum of West African Art and partners examines the earthworks as a system built and altered over long periods. Museum scholarship also credits Ewuare with reorganizing royal craft guilds. Guild Wards represents that urban organization through factories supported by nearby cities: each active factory level within twenty tiles of an active city produces additional gold. Multiple cities cannot multiply the same factory’s benefit. Factories, gold rates and tile distances are game abstractions of craft production and royal patronage."
title = "Ewuare the Great"
lang = "en"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
shortArticle = true
intro = ["Ewuare I, remembered as Ewuare the Great, ruled the Kingdom of Benin in the mid-fifteenth century. Historical accounts credit him with major political and military reforms and with directing the digging of an inner moat at the capital. The attribution comes through Benin dynastic tradition and later histories; archaeology confirms a vast, layered system of earthworks but does not make every section’s builder or date certain."]
