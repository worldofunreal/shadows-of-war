[articles.fil]
text = "Pinamunuan ni Ewuare I ang Kaharian ng Benin sa Nigeria ngayon noong kalagitnaan ng ika-15 siglo. Iniuugnay ng tradisyon ng dinastiya sa kaniya ang mga repormang pampamahalaan at panghukbo at ang pagpapahukay ng panloob na kanal ng kabisera. Nakatulong ang kanal at pilapil sa pagtatanggol sa lungsod at pagdaloy ng mga tao sa binabantayang tarangkahan. Ipinakikita ng arkeolohiya na matagal na itinayo at binago ang mga tanggulang lupa. Nasa tradisyon at pag-aaral ng kasaysayan ang pag-uugnay ng kanal kay Ewuare. Sinusuri pa ang petsa at nagpatayo ng bawat bahagi. Iniuugnay ng Museo ng RISD kay Ewuare ang muling pagsasaayos ng mga samahan ng manggagawa at pagpapagawa ng mga ulong panalaala para sa mga altar ng hari. Nagsilbi na sa korte ang mga tagapaghulma ng metal at mga mang-uukit at nagpatuloy ang papel nila sa mga seremonya. Isinasalin ng Mga Distrito ng Samahan sa laro ang ugnayan ng lungsod at pagawaan. Bawat aktibong antas ng sarili mong pabrika sa loob ng 20 tile ng sarili mong aktibong lungsod ay nagbibigay ng 1 dagdag na ginto kada segundo ng laro. Hindi tumataas ang bonus ng isang pabrika dahil sa maraming kalapit na lungsod."
title = "Ewuare the Great"
lang = "fil"
url = "https://ediss.sub.uni-hamburg.de/bitstream/ediss/3156/2/Disse.pdf"
