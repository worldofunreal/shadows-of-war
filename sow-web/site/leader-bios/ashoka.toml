[articles.en]
text = "Ashoka, also known as Asoka or Aśoka, most commonly known as Ashoka the Great, was Emperor of Magadha from c. 268 BCE until his death, and the third ruler of the Maurya Empire."
title = "Ashoka"
lang = "en"
url = "https://en.wikipedia.org/wiki/Ashoka"
intro = [
  "Ashoka, also known as Asoka or Aśoka ( ə-SHOH-kə; Sanskrit: [ɐˈɕoːkɐ], IAST: Aśoka; c. 304 – 232 BCE), most commonly known as Ashoka the Great, was Emperor of Magadha from c. 268 BCE until his death, and the third ruler of the Maurya Empire. His empire covered a large part of the Indian subcontinent, stretching from present-day Afghanistan in the west to present-day Bangladesh in the east, with its capital at Pataliputra. A patron of Buddhism, he is credited with an important role in the spread of Buddhism across ancient Asia.",
  "The Edicts of Ashoka state that during his eighth regnal year (c. 260 BCE), he conquered Kalinga after a brutal war. Ashoka subsequently devoted himself to the propagation of \"dhamma\" or righteous conduct, the major theme of the edicts. Ashoka's edicts suggest that a few years after the Kalinga War, he was gradually drawn towards Buddhism. The Buddhist legends credit Ashoka with establishing a large number of stupas, patronising the Third Buddhist council, supporting Buddhist missionaries, and making generous donations to the sangha.",
  "Ashoka's existence as a historical emperor had almost been forgotten, but since the decipherment in the 19th century of sources written in the Brahmi script, Ashoka holds a reputation as one of the greatest Indian emperors. The State Emblem of the modern Republic of India is an adaptation of the Lion Capital of Ashoka. Ashoka's wheel, the Ashoka Chakra, is adopted at the centre of the National Flag of India.",
]
sections = [
  { "title" = "Names and titles", "paragraphs" = [
      "The name \"A-shoka\" literally means \"without sorrow\". According to an Ashokavadana legend, his mother gave him this name because his birth removed her sorrows.",
      "The name Priyadasi is associated with Ashoka in the 3rd–4th century CE Dipavamsa. The term literally means \"he who regards amiably\", or \"of gracious mien\" (Sanskrit: Priya-darshi). It may have been a regnal name adopted by Ashoka. A version of this name is used for Ashoka in Greek-language inscriptions: βασιλεὺς Πιοδάσσης (\"basileùs Piodássēs\").",
      "Ashoka's inscriptions mention his title Devanampiya (Sanskrit: Devanampriya, \"Beloved of the Gods\"). The identification of Devanampiya and Ashoka as the same person is established by the Maski and Gujarra inscriptions, which use both these terms for the king. The title was adopted by other kings, including the contemporary king Devanampiya Tissa of Anuradhapura and Ashoka's descendant Dasharatha Maurya.",
    ] },
  { "title" = "Date", "paragraphs" = [
      "The exact date of Ashoka's birth is not certain, as the extant contemporary Indian texts did not record such details. It is known that he lived in the 3rd century BCE, as his inscriptions mention several contemporary rulers whose dates are known with more certainty, such as Antiochus II Theos, Ptolemy II Philadelphus, Antigonus II Gonatas, Magas of Cyrene, and Alexander (of Epirus or Corinth). Thus, Ashoka must have been born sometime in the late 4th century BCE or early 3rd century BCE (c. 304 BCE), and ascended the throne around 269-268 BCE.",
    ] },
  { "title" = "Ancestry", "paragraphs" = [
      "Ashoka's own inscriptions are fairly detailed but make no mention of his ancestors. Other sources, such as the Puranas and the Mahavamsa state that his father was the Mauryan emperor Bindusara, and his grandfather was Chandragupta – the founder of the Empire. The Ashokavadana also names his father as Bindusara, but traces his ancestry to Buddha's contemporary king Bimbisara, through Ajatashatru, Udayin, Munda, Kakavarnin, Sahalin, Tulakuchi, Mahamandala, Prasenajit, and Nanda. The 16th-century Tibetan monk Taranatha, whose account is a distorted version of the earlier traditions, describes Ashoka as son of king Nemita of Champarana from the daughter of a merchant.",
      "Ashokavadana states that Ashoka's mother was the daughter of a Brahmin from Champa, and was prophesied to marry a king. Accordingly, her father took her to Pataliputra, where she became Bindusara's chief empress. The Ashokavadana does not mention her by name, although other legends provide different names for her. For example, the Asokavadanamala calls her Subhadrangi. The Vamsatthapakasini or Mahavamsa-tika, a commentary on Mahavamsa, calls her \"Dharma\" (\"Dhamma\" in Pali), and states that she belonged to the Moriya Kshatriya clan. A Divyavadana legend calls her Janapada-kalyani; according to scholar Ananda W. P. Guruge, this is not a name, but an epithet.",
      "According to the 2nd-century historian Appian, Chandragupta entered into a marital alliance with the Greek ruler Seleucus I Nicator, which has led to speculation that either Chandragupta or his son Bindusara married a Greek princess. However, there is no evidence that Ashoka's mother or grandmother was Greek, and most historians have dismissed the idea.",
    ] },
  { "title" = "As a prince", "paragraphs" = [
      "Ashoka's own inscriptions do not describe his early life, and much of the information on this topic comes from apocryphal legends written hundreds of years after him. While these legends include obviously fictitious details such as narratives of Ashoka's past lives, they have some plausible historical information about Ashoka's period.",
      "According to the Ashokavadana, when Ashoka was young, his father hated him for his rough and unappealing skin. One day, Bindusara, his father, asked the ascetic Pingala-vatsajiva to determine which of his sons was worthy of being his successor. He asked all the princes to assemble at the Garden of the Golden Pavilion on the ascetic's advice. Ashoka was reluctant to go because his father disliked him, but his mother convinced him to do so. When minister Radhagupta saw Ashoka leaving the capital for the Garden, he offered to provide the prince with an imperial elephant for the travel. At the Garden, Pingala-vatsajiva examined the princes and realised that Ashoka would be the next emperor. To avoid annoying Bindusara, the ascetic refused to name the successor. Instead, he said that one who had the best mount, seat, drink, vessel and food would be the next king; each time, Ashoka declared that he met the criterion. Later, the ascetic told Ashoka's mother that her son would be the next emperor, and on her advice, left the empire to avoid Bindusara's wrath.",
      "While legends suggest that Bindusara disliked Ashoka's ugly appearance, they also state that Bindusara gave him important responsibilities, such as suppressing a revolt in Takshashila (according to north Indian tradition) and governing Ujjain (according to Sri Lankan tradition). This suggests that Bindusara was impressed by the other qualities of the prince. Another possibility is that he sent Ashoka to distant regions to keep him away from the imperial capital.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "According to the Sri Lankan tradition, Ashoka died during his 37th regnal year, which suggests that he died around 232 BCE.",
      "According to the Ashokavadana, the emperor fell severely ill during his last days. He started using state funds to make donations to the Buddhist sangha, prompting his ministers to deny him access to the state treasury. Ashoka then started donating his personal possessions, but was similarly restricted from doing so. On his deathbed, his only possession was the half of a myrobalan fruit, which he offered to the sangha as his final donation. Such legends encourage generous donations to the sangha and highlight the role of the emperorship in supporting the Buddhist faith.",
    ] },
]

[articles.fr]
text = "Ashoka ou Aśoka (en l'absence de signes diacritiques /ś/, on écrit aussi Asoka ou Açoka ; sanskrit en écriture devanagari : अशोकः ; IAST : Aśoka ; prâkrit en écriture brahmique : 𑀅𑀲𑁄𑀓), né vers 304 av. J.-C."
title = "Ashoka"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Ashoka"
intro = [
  "Ashoka ou Aśoka (en l'absence de signes diacritiques /ś/, on écrit aussi Asoka ou Açoka ; sanskrit en écriture devanagari : अशोकः ; IAST : Aśoka ; prâkrit en écriture brahmique : 𑀅𑀲𑁄𑀓), né vers 304 av. J.-C. et mort en 232 av. J.-C., est le troisième empereur de la dynastie indienne des Maurya.",
  "Il accède au pouvoir vers 270 av. J.-C. et s'efforce tout d'abord de consolider et d'agrandir l'empire hérité de son père Bindusâra. À la suite de la conquête meurtrière du Kalinga, il adopte les principes non-violents (ahimsa) du bouddhisme. Dès lors l'empire n'est plus troublé par la guerre et, en souverain pacifique, Ashoka s'emploie à l'organiser au moyen d'un corps important de fonctionnaires et d'une police efficace, ainsi qu'à travers la promulgation d'édits gravés sur des rochers ou des colonnes dispersés dans tout le pays. Il interdit les sacrifices, promeut le végétarisme et encourage la diffusion du bouddhisme en Inde et dans toute l'Asie.",
  "L'empire d'Ashoka s'étendait de l'actuel Afghanistan jusqu'au Bengale, et aussi loin vers le sud que le plateau de Mysore, mais il ne lui survécut guère, s'effondrant en une cinquantaine d'années. Cependant, Ashoka est le premier souverain à réaliser l'unité de l'Inde sur un aussi vaste territoire et la République indienne, consciente de son apport à l'histoire nationale, a pris pour emblème du pays le « chapiteau aux lions » qui couronne le pilier d'Ashoka de Sarnath, ainsi que la roue du Dharma (Dharmachakra).",
]
sections = [
  { "title" = "Histoire de l'Empire", "paragraphs" = [
      "Chandragupta (« Protégé par la Lune ») fonde l'empire Maurya en s'emparant tout d'abord du Pendjab récemment conquis par Alexandre le Grand puis, il se tourne vers l'est et s'approprie le royaume des Nanda vers 313 av. J.-C., s'installant dans la capitale Pataliputra (actuelle Patna au Bihar). En 305 av. J.-C., il affronte et défait Séleucos Ier Nikator, le satrape macédonien de Babylone qui le menace au nord-ouest. Les deux souverains concluent un accord aux termes duquel Chandragupta obtient la région à l'est des montagnes d'Afghanistan contre des éléphants et une alliance matrimoniale. Après avoir étendu son empire vers le sud, Chandragupta se serait retiré dans un monastère jain, abdiquant en faveur de son fils Bindusâra.",
      "Ce dernier nomme vice-roi d'Ujjain l'un de ses fils, Devanampiya Piyadassi (« Le roi ami des dieux au regard bienveillant »), plus connu sous le nom d'Ashoka (« Le sans douleur ») donné par les bouddhistes. Il l'envoie ensuite mater une révolte à Taxila dont il devient également vice-roi, s'initiant ainsi au gouvernement. À la mort de son père en 273 av. J.-C., Ashoka fait éliminer tous ses frères et sœurs, s'empare du pouvoir et se fait couronner quatre ans plus tard.",
      "Comme ses prédécesseurs, Ashoka dispose d'une armée considérable, professionnelle, prête en permanence et qu'il finance lui-même. C'est avec elle, au cours de la treizième année de son règne (261 av. J.-C.), qu'il se lance à la conquête du Kalinga, région située sur la côte est et correspondant à l'actuel Orissa. L'empereur remporte la victoire après une guerre terriblement meurtrière qui aurait fait selon ses dires 150 000 prisonniers, 100 000 tués et autant de morts de famine et de maladie, chiffres probablement symboliques qui traduisent l'ampleur des massacres perpétrés.",
    ] },
  { "title" = "Organisation de l'Empire", "paragraphs" = [
      "Débarrassé du souci de la guerre, Ashoka se consacre à l'organisation de l'Empire sur lequel il exerce un pouvoir absolu au moyen d'une administration décentralisée, soutenue par les nombreux édits gravés dans la pierre et dispersés sur tout le territoire.",
      "Les ordres de l'empereur s'appliquent uniformément à tout le territoire, ils émanent de sa volonté et de son autorité personnelle comme en témoigne une de ses inscriptions :",
      "« À tout moment, soit que je mange, (que je me trouve) dans l'appartement des femmes, dans ma chambre à coucher, soit que (je sois) en déplacement, aussi bien en (litière ?) que dans mes jardins, partout des informateurs présents doivent m'informer des affaires publiques : et partout je m'occupe des affaires publiques. Et quelque ordre que je donne verbalement, relatif à une donation ou à une proclamation, et d'autre part toute affaire urgente qui est confiée aux surintendants, s'il y a à leur sujet contestation ou délibération au conseil, on doit m'en informer immédiatement, partout, à tout moment : tel est mon ordre. »",
    ] },
  { "title" = "Religion et culture", "paragraphs" = [
      "L'empereur Ashoka acquiert le titre d'« ami des dieux » (Devanampiya) qui est une appellation qu'il a adoptée, et non un titre qui lui aurait été donné par les dieux eux-mêmes. Il est couramment utilisé dans ses édits pour se référer à lui-même, soulignant son rôle de dirigeant bienveillant et son engagement envers les valeurs bouddhistes.",
      "Ashoka traite égalitairement toutes les religions, faisant et recommandant de faire des dons aux moines bouddhistes, jaïns aussi bien qu'aux brahmanes. Cette attitude impressionne durablement les souverains indiens qui pendant longtemps font des dons aux différentes religions présentes dans le pays. Il promeut la non-violence (ahimsa) dans ses édits et dans sa façon de vivre, incitant au végétarisme, interdisant les sacrifices et la torture. Il limite l'abattage des animaux à la cour et remplace la chasse par des pèlerinages. Il encourage la diffusion du bouddhisme pour lequel il convoque un concile dans la capitale et aurait fait édifier 84 000 stupas dont ceux de Sarnath et Sanchi largement remaniés au cours des siècles suivants.",
      "La prospérité économique, les échanges et la paix favorisent l'essor culturel. Le règne d'Ashoka voit l'apparition de l'épigraphie et d'une sculpture sur pierre de grande qualité influencée par l'art grec et perse. Elle se caractérise par sa sobriété, des motifs animaliers et des chapiteaux en corolle de lotus renversée comme en témoignent les colonnes aux chapiteaux aux lions retrouvées à Sarnath et Vaishali.",
    ] },
  { "title" = "Dislocation de l'Empire", "paragraphs" = [
      "À la mort d'Ashoka en 232 av. J.-C., ses fils se disputent l'Empire ; aucun d'entre eux n'a l'envergure de leurs ancêtres et progressivement, les gouverneurs s'émancipent de l'autorité centrale. L'armée, immense mais inactive depuis des décennies, ne réussit pas à éviter la conquête du Punjab par les Gréco-Bactriens en 185 av. J.-C.. Quelques années plus tard, le dernier empereur maurya, Brihadratha, est assassiné par un de ses généraux, Pushyamitra, qui fonde la dynastie Shunga et rétablit l'hindouisme avec vigueur. L'Inde se retrouve de nouveau morcelée, les différents royaumes luttent les uns contre les autres pour une domination régionale, situation qui perdure jusqu'à l'avènement des Gupta au milieu du IVe siècle.",
      "L’effondrement de l'empire maurya a des origines multiples : incapacité et rivalité des successeurs d'Ashoka, désir des brahmanes de retrouver leur prééminence, poids financier d'une armée inutile. Mais la cause principale est sa taille même qui ne lui permet pas d'être suffisamment centralisé. Les libertés prises par les administrations régionales, le maintien des royaumes préexistants et les difficultés de communication expliquent que l'Empire se soit disloqué en à peine cinquante ans.",
    ] },
  { "title" = "Héritage", "paragraphs" = [
      "Ashoka disparaît de la mémoire indienne au Moyen Âge et n'est redécouvert qu'au XIXe siècle par les historiens britanniques grâce à ses inscriptions. Les fondateurs de l'Inde moderne reconnaissent l'importance de ce premier unificateur du sous-continent et, désireux de promouvoir son idéal de tolérance, adoptent le chapiteau aux lions de la colonne de Sarnath comme emblème national et insèrent le Dharmachakra, la roue de la Loi, symbole du Dharma en tant que doctrine bouddhiste et enseignements de Shakyamuni, dans le drapeau tricolore.",
      "Après le troisième concile bouddhiste qu'il organise à Pataliputra, Ashoka dépêche des missionnaires dans tout le pays. Cependant, même si le bouddhisme conserve pendant quelque temps une certaine vitalité au Bengale et dans le Deccan et s'il donne lieu à des centres culturels et artistiques importants à Sarnath, Nâlandâ et Ajantâ, il reste toujours minoritaire en Inde puis disparaît presque totalement.",
      "Ashoka envoie aussi des missions au-delà des frontières : son fils (ou son frère), Mahendra, convertit le roi de Ceylan et le bouddhisme se répand progressivement en Asie centrale, en Chine et surtout en Asie du Sud-Est où il est toujours présent. Les édits, en particulier l'Édit n° 13 d'Ashoka, attestent également de missions de prosélytisme auprès d'Antigone II Gonatas, roi de Macédoine, d'Antiochos II, roi de Syrie et de Ptolémée II, roi d'Égypte. Ce dernier aurait par ailleurs envoyé des ambassadeurs auprès d'Ashoka comme l'atteste Pline l'Ancien.",
    ] },
]

[articles.de]
text = "Aśoka (gesprochen „Aschoka“) oder (im englischen Sprachraum) Ashoka (Sanskrit: अशोक, Aśoka; eigentlich Aśokavardhana, Sanskrit अशोकवर्धनाः aśokavardhanāḥ; auch: Aśoka Adiraja „Erster König Aśoka“; * 304 v. Chr."
title = "Ashoka"
lang = "de"
url = "https://de.wikipedia.org/wiki/Ashoka"
intro = [
  "Aśoka (gesprochen „Aschoka“) oder (im englischen Sprachraum) Ashoka (Sanskrit: अशोक, Aśoka; eigentlich Aśokavardhana, Sanskrit अशोकवर्धनाः aśokavardhanāḥ; auch: Aśoka Adiraja „Erster König Aśoka“; * 304 v. Chr. in Nord-Indien; † 232 v. Chr.) war ein Herrscher der indischen Dynastie der Maurya. Er regierte in den Jahren 268–232 v. Chr.; er war der Sohn von Bindusara (regierte ca. 298–272 v. Chr.) und Enkel des Dynastiegründers Chandragupta Maurya (regierte ca. 317–297 v. Chr.), der im nordostindischen Reich Magadha (Gebiet des heutigen Bihar) – dem Kernland des frühen Buddhismus – die Grundlagen für das größte Reich der indischen Antike gelegt hatte.",
]
sections = [
  { "title" = "Leben und Werk", "paragraphs" = [
      "Chandragupta herrschte von ca. 317 bis ca. 297 v. Chr. Sein Nachfolger war sein Sohn Bindusara. Ihm folgte wiederum, nach heutigem Forschungsstand im Jahr 268 v. Chr., dessen Sohn Ashoka als dritter Herrscher der Maurya-Dynastie. Bevor Ashoka die Herrschaft antrat, war er Statthalter seines Vaters in der Stadt Taxila im Nordwesten des Reiches.",
      "Zunächst war Ashoka damit befasst, das wachsende Großreich durch neue Eroberungen zu erweitern, wobei er teilweise mit äußerster Härte vorging. Die letzte Etappe auf diesem Weg bildete die Einnahme von Kalinga mit der Hauptstadt Toshali im Osten Indiens (Gebiet des heutigen Orissa) im Jahr 261 v. Chr. Nach der blutigen und verlustreichen Unterwerfung Kalingas wurde Ashoka angesichts des Leids und Elends, die seine Eroberungszüge mit sich brachten, von einer psychischen Krise erfasst. Quelle dafür ist ein Selbstzeugnis – eine Felsinschrift, die vier Jahre später angefertigt wurde; demnach sei ein militärischer Sieg sinnlos, bedeutend sei nur der Sieg des Dharma.",
      "Ashoka scheint kurz darauf – auf dem Höhepunkt seiner Macht um 258 v. Chr. – zum Buddhismus konvertiert zu sein und beschloss, auf weitere Eroberungen zu verzichten und das Reich zu konsolidieren. Möglicherweise sah er, dass die Eroberung der großen „weißen Flächen“ Zentral- und Südindiens die Ressourcen des Reichs überstrapazieren und es in weitere Kriege wie den um Kalinga stürzen würde. Fortan widmete sich Kaiser Ashoka als buddhistischer Laienanhänger gezielt der Friedensförderung und der sozialen Wohlfahrt. Er verbot die Kriegsführung und ermahnte seine Untertanen, auf Gewaltanwendung zu verzichten (unter anderem durch Verbot der blutigen Tieropfer und Propagierung des Vegetariertums). Jede Aggression ablehnend, strebte er fortan nach freundschaftlichen Beziehungen mit seinen Nachbarn wie den Seleukiden und den Griechen in Baktrien. Allerdings scheint Ashoka keine grundlegende Reform der indischen Gesellschaft, verbunden mit einer klaren Zielvorstellung, betrieben zu haben; vielmehr ging es wohl um die Formulierung bzw. Festlegung eines Standards von sozialem Verhalten.",
    ] },
  { "title" = "Missionen in den westlichen Kulturraum", "paragraphs" = [
      "Im 13. Felsenedikt wurden die Könige und damit Gebiete benannt, zu denen Ashoka seine Missionare entsandte:",
      "Alikasumdara – entweder Alexander II. von Epirus (272–255 v. Chr.) oder Alexander von Korinth (252–244 v. Chr.)",
      "Im 2. Felsenedikt wurde nur Antiochos II. erwähnt und die anderen Regenten als seine Samantas (Nachbarkönige) bezeichnet.",
    ] },
  { "title" = "Film", "paragraphs" = [
      "Der Bollywoodfilm Asoka – Der Weg des Kriegers von 2001 nimmt Anleihen beim Leben des altindischen Herrschers.",
      "Die ZDF-Dokumentation der Reihe Terra X Ashoka – Der indische Krieger Buddhas stellt die Lebensgeschichte Ashokas nach.",
    ] },
  { "title" = "Literatur", "paragraphs" = [
      "Ludwig Alsdorf: Aśokas Separatedikte von Dhauli und Jaugaḍa (= Abhandlungen der geistes- und sozialwissenschaftlichen Klasse der Akademie der Wissenschaften und der Literatur in Mainz. Jahrgang 1962, Nr. 1).",
      "Devadatta R. Bhandarkar: Aśoka (= The Carmichael lectures. 1923). 4. Auflage. Calcutta University Press, Calcutta 1969.",
      "Harry Falk: Asokan Sites and Artefacts. A Source-book with Bibliography (= Monographien zur indischen Archäologie, Kunst und Philologie. 18). Philipp von Zabern, Mainz 2006, ISBN 3-8053-3712-4.",
    ] },
]

[articles.it]
text = "Aśoka Maurya il Grande (dal sanscrito \"senza sofferenza\", devanagari अशोक), con caratteri latini Ashoka (Pataliputra, 304 a.C. – Pataliputra, 232 a.C.) fu sovrano dell'impero Maurya."
title = "Aśoka"
lang = "it"
url = "https://it.wikipedia.org/wiki/A%C5%9Boka"
intro = [
  "Aśoka Maurya il Grande (dal sanscrito \"senza sofferenza\", devanagari अशोक), con caratteri latini Ashoka (Pataliputra, 304 a.C. – Pataliputra, 232 a.C.) fu sovrano dell'impero Maurya.",
  "Dopo diverse conquiste militari regnò su un territorio comprendente gran parte del subcontinente indiano, l'odierno Afghanistan, parte della Persia (odierno Iran), Bengala (oggi diviso tra India e Bangladesh) e Assam. Nelle iscrizioni pervenuteci si riferisce generalmente a sé stesso con il suo titolo imperiale in pracrito Devanampiya Piyadassi (देवानांप्रिय प्रियदर्शी, in sanscrito Devānāmpriya Priyadarśi), cioè \"amato dagli dei\" e \"dallo sguardo gentile\". Da Piyadassi deriva \"Piodasse\" (in greco antico Πιοδάσσης?, Piodássēs), nome con cui era noto nelle iscrizioni in greco antico.",
  "Noto per essersi convertito al Buddismo e averne sostenuto l'adozione e la diffusione, la sua storia ci è pervenuta attraverso le cronache del II secolo Aśokavadana (\"storie di Aśoka\") e Divyavadana (\"gesta divine\"), oltre a due cronache pāli dello Sri Lanka, Dipavamsa e Mahavamsa; tutte le fonti sono però di estrazione buddista, e quindi accolte con sospetto da alcuni storiografi. Qualcuno ha infatti proposto la tesi che la conversione di Aśoka non si fosse in realtà mai verificata, e che avesse appoggiato il Buddismo per la sua capacità di amalgamare le profonde differenze religiose che laceravano il suo impero. Tesi che però, secondo alcuni, si scontra con il carattere profondamente pio di tutti i famosi editti di Aśoka, i documenti epigrafici cui il sovrano affidò la sua missione sia legislatrice che moralizzatrice dei popoli a lui sottomessi.",
  "Sono famosi inoltre i suoi pilastri, colonne in pietra alte tra i 12 e i 15 metri, con o senza iscrizioni e decorazioni: ne fece erigere in tutta l'India.",
]
sections = [
  { "title" = "Storia e leggenda", "paragraphs" = [
      "Secondo una tradizione buddista descritta nell'Aśokavadana, la nascita di Aśoka sarebbe stata predetta da Gautama Buddha, nella storia nota come \"il dono di polvere\". Secondo questa profezia, nella sua precedente vita Aśoka si chiamava Jaya, e da bambino, mentre giocava nel fango, vide passare il Buddha; colto dal desiderio di offrirgli del cibo, gettò nella sua ciotola la polvere con cui stava giocando. Comprendendo l'animo puro che aveva motivato il gesto, il Buddha predisse il suo destino:",
      "Aśoka si reincarnò quindi come figlio di Dharma, una delle spose dell'imperatore Maurya Bindusāra; Dharma non era di sangue reale, ma era stata ugualmente accettata nell'harem perché suo padre, un povero brahmino, aveva predetto che suo figlio sarebbe diventato un grande re. Oltre ad essere figlio della sposa di rango più basso, Aśoka era anche il più giovane dei principi, se si esclude l'altro figlio di Dharma, Vitthaśoka; ciò nonostante, il giovane principe guadagnò il rispetto dei fratellastri per le sue doti nelle discipline militari e accademiche, anche se Susima, il principe ereditario, non si dimostrava da meno né come guerriero né come amministratore.",
      "Quando raggiunse la maggiore età, Aśoka fu messo a capo di diversi reggimenti dell'esercito Maurya e i fratellastri cominciarono a temere la sua sempre maggiore popolarità; su loro consiglio Bindusāra lo inviò nella città di Takṣaśilā, di popolazione greco-battriana e già insorta precedentemente in un paio di occasioni. Grazie alla sua popolarità, Aśoka fu in grado di entrare in città senza scontri e quando una rivolta si presentò non esitò a sopprimerla con l'esercito. Approfittando della sua lontananza, però, i fratellastri convinsero Bindusāra che il giovane principe complottasse contro di lui, e Aśoka fu esiliato.",
    ] },
  { "title" = "Politica", "paragraphs" = [
      "Aśoka divenne un fervente sostenitore del Buddismo, ma il suo esplicito sostegno alla fede non si tradusse mai in una politica discriminatoria nei confronti delle altre religioni; secondo alcuni storici moderni la scelta di abbracciare la fede buddista fu motivata dalla capacità di questa di convivere e anzi fare proprie le caratteristiche delle altre tradizioni religiose diffuse nel subcontinente, costituendo un amalgama che poteva risolvere le tensioni già forti in un impero così esteso. Le leggi che Aśoka introdusse rappresentavano una vera rivoluzione culturale; fu proibita la caccia e anche il ferimento di animali, si favorì il vegetarismo, si ridusse la gravità delle pene (soprattutto corporee), concesse almeno 25 volte l'amnistia (25 anni sui primi 26 dall'incoronazione) a prigionieri e condannati a morte, furono costruiti ospedali per uomini e animali, ostelli gratuiti per i pellegrini, sistemi di irrigazione e traffico fluviale, e nuove strade. Le leggi non discriminavano i cittadini per casta, fede o schieramento politico; i principi morali del Dharma che queste cercavano di attuare erano non-violenza, tolleranza di tutte le opinioni, obbedienza ai genitori e rispetto per tutti i maestri religiosi, generosità verso gli amici, trattamento umano dei servitori e così via. In generale, le leggi introducevano nuove restrizioni, ma non rinnegavano alcuno dei principi morali preesistenti delle varie religioni che componevano l'impero.",
      "In politica estera, dopo la prima fase imperialista, cercò di sostituire l'aggressione militare con gli accordi politici, creando Stati satelliti e riducendo la necessità di sorvegliare le frontiere.",
      "L'editto forse più avanzato, inerente alla tolleranza religiosa, è il dodicesimo, che recita:",
    ] },
  { "title" = "Sostegno del Buddismo", "paragraphs" = [
      "Aśoka diede il suo sostegno formale al Buddismo, e cercò di concretizzarlo organizzando l'invio di missionari nei paesi confinanti, soprattutto in quelli di cultura ellenistica. Prima di far questo, però, sentì la necessità di fare ordine tra le scuole di pensiero buddiste, assicurandosi così che i missionari predicassero il vero Dharma; a questo scopo convocò nella capitale Pataliputra il terzo Concilio buddista. Il Concilio cercò di formalizzare il corpus delle scritture buddiste, giungendo ad una formulazione probabilmente simile al Canone pāli dell'attuale scuola Theravāda, escludendo da questo le tesi, considerate se non eretiche quantomeno estranee all'insegnamento originale del Gautama, delle scuole Sarvāstivāda e Dharmaguptaka; i missionari furono incaricati di predicare quanto deciso dal Concilio, e vennero inviati negli amichevoli regni ellenistici. Le cronache relative a questi missionari sono state tramandate dagli editti di Aśoka:",
      "Da notare che i nomi dei sovrani implicano che i missionari si siano spinti fino in Egitto e in Grecia; ancora nel II secolo lo scrittore cristiano Clemente Alessandrino accenna alla presenza di una comunità buddista ad Alessandria d'Egitto. Inoltre, secondo le cronache pāli, alcuni degli emissari di Aśoka erano monaci buddisti greci, evidenziando l'esistenza di intensi rapporti tra le due culture:",
      "Il motivo di tanta affinità con i regni ellenistici può essere forse ritrovata in una possibile origine parzialmente greca di Aśoka stesso: nel 303 a.C. infatti Seleuco I aveva condotto una alleanza matrimoniale con Chandragupta Maurya, suo nonno.",
    ] },
  { "title" = "Presenza nella cultura di massa", "paragraphs" = [
      "Lo Stato indiano adotta la Dharmachakra (ruota del Dharma), simbolo di Aśoka, al centro della propria bandiera nazionale, e l'emblema dell'India rappresenta il capitello di leoni della colonna che Aśoka pose a Sarnath, luogo della prima predicazione del Buddha.",
      "Un personaggio di razza togruta appartenente all'universo di Guerre stellari si chiama Ahsoka Tano.",
      "Nel videogioco per PC Civilization 4 Aśoka è un personaggio giocabile, capo come il Mahatma Gandhi della civiltà indiana. Riapparirà anche in Civilization VII, come uno dei leader giocabili, anche se non strettamente collegato a nessuna civiltà.",
    ] },
]

[articles.tr]
text = "Asoka (Devanāgarī: अशोकः, IAST: [aɕoːkə(hə)], Prakrit dilindeki imparatorluk adıyla Devanampriya Priyadarsi (Devanāgarī: देवानांप्रिय प्रियदर्शी, \"O, Tanrıların sevgili oğludur ve her insana içtenlikle saygı duyar.\") veya MÖ 304 ile MÖ 232 arasındaki adıyla Dhamma (Devanāgarī: धम्मः), \"Adil, Dindar, Erdemli\" olarak tanınan, MÖ 273 ile MÖ 232 arasında egemen olan Maurya Hanedanlığı'nın Hint imparatorudur. Asoka, bir dizi askerî fetih gerçekleştirdikten sonra günümüz Hindistan'ının bulunduğu alana hükmetmiştir."
title = "Büyük Asoka"
lang = "tr"
url = "https://tr.wikipedia.org/wiki/B%C3%BCy%C3%BCk_Asoka"
intro = [
  "Asoka (Devanāgarī: अशोकः, IAST: [aɕoːkə(hə)], Prakrit dilindeki imparatorluk adıyla Devanampriya Priyadarsi (Devanāgarī: देवानांप्रिय प्रियदर्शी, \"O, Tanrıların sevgili oğludur ve her insana içtenlikle saygı duyar.\") veya MÖ 304 ile MÖ 232 arasındaki adıyla Dhamma (Devanāgarī: धम्मः), \"Adil, Dindar, Erdemli\" olarak tanınan, MÖ 273 ile MÖ 232 arasında egemen olan Maurya Hanedanlığı'nın Hint imparatorudur. Asoka, bir dizi askerî fetih gerçekleştirdikten sonra günümüz Hindistan'ının bulunduğu alana hükmetmiştir. İmparatorluğu; günümüzdeki Pakistan, Afganistan ve İran'ın batısındaki topraklardan, Hindistan'ın doğusunda yer alan Bengal ve Assam eyaletlerine ve güneyde Karnataka eyalet sınırları içinde kalan Mysore'a kadar uzanan bir alana yayılmıştır.",
  "Tahta çıktığında büyükbabasının izinden giderek askerî harekâtlarla topraklarını genişletmeye çalışmıştır. Hükümranlığının sekizinci yılında, Hindistan'ın doğu kıyılarında (günümüzde Orissa eyaletinin bulunduğu bölge) yer alan Kaliga devletine karşı gerçekleştirilen bir savaştan zaferle ayrılmıştır. Ancak zafere rağmen, savaş bittiğinde ordusunda yüz bin kayıp ve yüz binden fazla sayıda yaralı vardır. Bundan etkilenen Asoka, Hindistan'ın kontrol edilmesi için giriştiği harekâtı bitirmeye karar vermiş ve tüm savaşlardan vazgeçmiştir. Budizm'i dinî felsefesi olarak belirlemiş ve Dharma erdemlerinin gerektirdiği şekilde yaşamaya çalışmıştır.",
  "Kişisel hayatında Asoka, avcılıktan vazgeçmiş ve vejetaryen olmuştur. Devlet adamı olarak ise hastaneler ve hayvan barınakları açmış; birçok katı kanunu yürürlükten kaldırmış, yollar yapmış ve sulamayı geliştirtirmiştir. İnsanlara inancı öğretmek için \"Dharma Görevlileri\" olarak adlandırılan devlet görevlileri atamıştır. Krallığı zamanında tüm dinlere yer vardır; ancak özellikle Budizm teşvik edilmiştir. Bununla beraber, birçok yabancı ülkeye Budist misyonerler gönderilmiştir. Özellikle Seylan'da (Sri Lanka) başarılı olmuşlardır.",
  "Asoka, benimsediği bu politikayı anlatan satırların, krallığındaki tüm kayalara ve sütunlara yazılmasını istemiştir. Bu yazıtların birçoğu günümüze kadar ulaşmıştır. Asoka tahta çıktığı zaman Budizm, sadece Hindistan'ın kuzeybatısında bulunan yerel bir dindir; öldüğünde ise tüm Hindistan'a yayılmıştır ve komşu ülkelerde de hızla yayılmaya devam etmektedir. Bu nedenle Asoka'nın, Budizmin yaygınlaşmasında önemli rolü olduğu söylenmektedir.",
]
sections = [
  { "title" = "Tarihlendirme", "paragraphs" = [
      "Asoka'nın doğum tarihi tam olarak bilinmemektedir; çünkü günümüze ulaşan çağdaş Hint metinleri bu tür ayrıntıları kaydetmemiştir. Ancak, Asoka'nın milattan önce 3. yüzyılda yaşadığı bilinmektedir; zira yazıtlarında tarihlendirmesi daha kesin biçimde bilinen bazı çağdaş hükümdarlardan söz edilmektedir: Bunlar arasında II. Antiokhos Theos, II. Ptolemaios Philadelphos, II. Antigonos Gonatas, Kyrane'li Magas ve Aleksandros (Epir ya da Korinthoslu) yer almaktadır. Bu nedenle Asoka'nın, büyük olasılıkla MÖ 4. yüzyılın sonlarında veya 3. yüzyılın başlarında (y. MÖ 304) doğduğu ve yaklaşık olarak M.Ö. 269–268 yıllarında tahta çıktığı kabul edilmektedir.",
    ] },
]

[articles.ja]
text = "アショーカ（梵: अशोकः, IAST: Aśokaḥ サンスクリット語発音: [ɐˈɕoːkɐ]; パーリ語: 𑀅𑀲𑁄𑀓, ラテン文字転写: Asoka; 訳：無憂〈むう〉、在位：紀元前268年頃 - 紀元前232年頃）は、マウリヤ朝の第3代のラージャである。 漢訳音写では阿育王あるいは阿輸迦王と書かれる。インド亜大陸をほぼ統一した。 釈尊滅後およそ100年（または200年）に現れたという伝説もあるアショーカは、古代インドにあって仏教を守護したことで知られる。アショカとも表記される。アショーカの名前は花のアソッカ（無憂樹）を由来とする。"
title = "アショーカ"
lang = "ja"
url = "https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%B7%E3%83%A7%E3%83%BC%E3%82%AB"
intro = [
  "アショーカ（梵: अशोकः, IAST: Aśokaḥ サンスクリット語発音: [ɐˈɕoːkɐ]; パーリ語: 𑀅𑀲𑁄𑀓, ラテン文字転写: Asoka; 訳：無憂〈むう〉、在位：紀元前268年頃 - 紀元前232年頃）は、マウリヤ朝の第3代のラージャである。",
  "釈尊滅後およそ100年（または200年）に現れたという伝説もあるアショーカは、古代インドにあって仏教を守護したことで知られる。アショカとも表記される。アショーカの名前は花のアソッカ（無憂樹）を由来とする。",
]
sections = [
  { "title" = "生涯", "paragraphs" = [
      "先代のビンドゥサーラ（漢訳音写：頻頭沙羅）の息子であったと伝えられる。ある伝説ではビンドゥサーラの剃毛師（ナーピニー Napini）をしていたダンマーという女がチャンパ王国のバラモンの娘であったことが発覚したため正妃とされ、ビンドゥサーラとその女の間にアショーカとヴィータショーカという息子が生まれた。",
      "同じく伝説の域を出ない話であるが、アショーカは父ビンドゥサーラと不和であり、タクシラで反乱が発生した際ビンドゥサーラは軍も武器も与えずに反乱鎮圧に向かうようアショーカに命じた。この状況を心配した家臣の1人が「王子よ、軍も武器もなしに我々は何を用いて誰と戦うのでありましょうか？」と問うとアショーカは「もしも私が王者に相応しいほどの善根を持つならば軍と武器が現れるであろう」と答えた。すると神々は大地を割ってその裂け目から軍と武器を出し、アショーカに与えた。これを聞いたタクシラの住民達は道を清めてアショーカを大歓迎し「我々はビンドゥサーラ陛下にもアショーカ王子にも叛いているのではありません。ただ悪しき大臣が我々に害を与えたためにこれを討ったのみです。」と言いアショーカは同地の人々の尊敬を得て支配権を得た。",
      "一方スリランカの伝説ではアショーカはインド南西部のウッジャインの反乱鎮圧を命ぜられ、鎮圧には成功したものの負傷してしまった。そしてこの時彼を看護した商人の娘デヴィと結婚した。",
    ] },
  { "title" = "アショーカの王妃・親族・家臣", "paragraphs" = [
      "アショーカが兄弟のほとんどを殺したという仏典の説話が事実ではないことは、彼の残した碑文に兄弟が各地に総督として送られたことを示すものがあることから知られる。記録が全てを網羅していないために個々の力関係や完全な系譜は復元できないものの、何人かの人物とアショーカとの関係が読み取れる。アショーカには多くの王妃や王子がおり、彼らの名前が伝説に残されているが、考古学的に名の知られる者は少ない。王妃については伝説的な人物が多い。",
      "アショーカの息子。非常に有力かつ有能な王子であり、「地上を覆った蛮族（ギリシア人のことか）」を撃退し、ガンジス上流域の支配にあたった。カシミール地方で独立したという説もある。",
      "アショーカの娘。マヒンダの姉妹。伝説によればアヌラーダプラを統治していたティッサ王の要請によって数名の比丘尼と共にスリランカに派遣され、王の妃や後宮の女性たちを出家させ、比丘尼サンガを伝えたとされる。",
    ] },
  { "title" = "アショーカの仏塔", "paragraphs" = [
      "アショーカの仏塔、アショーカ・ピラー、阿育王塔はアショーカが建立したとされる塔又は柱。表面に東部プラークリットで碑文が刻まれており、仏教の歴史の解明にかかせない貴重な資料である。塔のほかに岩に刻まれた碑文もあり、こちらは東部プラークリットのほかに西部プラークリット、ガンダーラ語、およびギリシア語とアラム語の二言語で記されたものがある。",
      "釈迦の生誕の地（ルンビニ）は、石柱が発掘された事で特定された。石柱には、ここがブッダの誕生された地であることと、租税を免除することが書かれていた。これによって、釈迦が伝説上の存在ではなく、歴史上実在したことが認められた。また石柱にはさまざまな文章が書かれているが、現存する仏典と一致しないものも多く、仏教思想の変遷の跡が認められる。",
      "アショーカの時代は仏教の歴史でいう「根本分裂」の時代に相当し、石柱にも分裂を諌めるアショーカの文章が掲載されている。内容からみてアショーカは上座部を支持していたようである。",
    ] },
]

[articles.ar]
text = "الإمبراطور أشوكا أو أسوكا (Ashoka, Asoka). ولد عام 304 قبل الميلاد وتوفي عام 232 قبل الميلاد، كان أهم حكام الإمبراطورية الماورية بالهند وهو من قام ببناء أعمدة أشوكا التي نقش عليها أوامر الإمبراطورية الماورية باللغة البرهمية."
title = "أشوكا"
lang = "ar"
url = "https://ar.wikipedia.org/wiki/%D8%A3%D8%B4%D9%88%D9%83%D8%A7"
intro = [
  "الإمبراطور أشوكا أو أسوكا (Ashoka, Asoka). ولد عام 304 قبل الميلاد وتوفي عام 232 قبل الميلاد، كان أهم حكام الإمبراطورية الماورية بالهند وهو من قام ببناء أعمدة أشوكا التي نقش عليها أوامر الإمبراطورية الماورية باللغة البرهمية.",
  "أشوكا من أعظم ملوك الهند في التاريخ، حكم بين 273-232ق.م، ينتمي إلى أسرة موريا التي حكمت البلاد بين 321 و185ق.م. وكان له دور كبير في ترسيخ وحدة بلاد شبه قارة الهند، وفي نشر تعاليم البوذية في الهند وخارجها. وويقال احب فتاة قبل زوجتة",
]
sections = [
  { "title" = "عصر أشوكا وأسرة موريا", "paragraphs" = [
      "عقب حملة الاسكندر المقدوني على بلاد الشرق، التي اجتاح بها الامبراطورية الفارسية الأخمينية وبلاد الهند ظهرت على المسرح الهندي شخصية مهمة كان لها تأثير خطير في تاريخ الهند القديم: شاندرا غوبتا (ساندرا كوتوس عند المؤلفين الإغريق الكلاسيكيين). ولا يعرف أصل هذا الرجل على وجه الدقة، لكنه استطاع أن يؤسس نحو عام 321 ق.م أسرة حاكمة في الهند هي أسرة موريا، التي كان أشوكا أشهر ملوكها.",
      "امتدت مملكة شاندرا غوبتا، التي كان ظهورها رداً على الغزو المقدوني ـ الهلّيني، من وادي السند (الهندوس) إلى بلاد البنغال، ومن جبال هيمالايا شمالاً إلى جبال بانديا، وأقيمت أسس الدولة على هدي التعاليم البراهمانية الهندوسية، وبمساعدة واحد من أعظم حكماء الهند هو الوزير كوتيليا، صاحب أقدم رسالة في السياسة (أرتاشاسترا)، تحدث فيها عن مستلزمات نظام الدولة، وعن الاقتصاد والضرائب وأصول الحكم.",
      "ونمت إبان حكم هذه الأسرة العلاقات التجارية والحضارية والثقافية مع دول المشرق التي كانت تحكمها أسرات حاكمة هلينية في سورية ومصر، في حين نهض الإيرانيون في وجه النفوذ الهليني بتأسيس المملكة الفرثية في أواسط القرن الثالث ق.م.",
    ] },
  { "title" = "حُكم أشوكا", "paragraphs" = [
      "ولد أشوكا في بيتاليبوترا. وتلقى تعليماً ممتازاً مدة عشر سنوات قبل أن يعهد إليه والده في مهمات للمشاركة في حمل أعباء المُلك معه، واكتسب خبرة في إدارة المملكة إذ كان نائباً للملك في عدد من المقاطعات. وعند موت أبيه لم يكن أحقَّ أخوته بالوراثة ولكنه كان أفضلهم بما كسبه من خبرة إدارية ومن تأييد الوزير القوي رادغوبتا. فعمل جاهداً على المحافظة على وحدة المملكة وسعى إلى توسيع حدودها، وإلى إقامة علاقات طيبة بين الحاكم والرعية.",
      "ولكن احتلال أشوكا منطقة كالينغا (أوريسا اليوم) في بلاد البنغال عام 261 ق.م لبسط سيطرة أسرة موريا عليها، كان منعطفاً تاريخياً في حياته، فقد حوّل الحدث العاهل المحارب الفاتح إلى رسول للتسامح والأخوّة الإنسانية، بعد أن فُجع بوقائع الحروب وآلامها وآثارها المأسوية على الناس. وهكذا تعزَّز لديه الإيمان بالتعاليم الدينية الهندية التي تدعو إلى احترام الحياة بكل صورها، فاعتنق التعاليم البوذية بلا تعصب من دون أن يتخلى عن كل شيء في الديانة البرهمية ومن دون أن ينكر معتقدات الآخرين. وعمل أشوكا في سياسته الحازمة على تطوير توجهات البوذية، ومهّد لجعلها ديانة عالمية بإرسال الدعاة إلى أنحاء البلاد: إلى كشمير وسري لانكة وشرقي الهند.",
      "وتدل الوثائق الهلنستية على أن البوذية كانت معروفة في أنطاكية وفي الإسكندرية منذ ذلك العصر.",
    ] },
  { "title" = "مآثر أشوكا وتعاليمه", "paragraphs" = [
      "اهتم أشوكا بتنظيم الإدارة، وعمل على تبادل المسؤوليات دورياً بين كبار المسؤولين بصورة يتمكنون بها من التمرس بمسؤوليات الإدارة واكتساب خبرة واسعة وعلى أفضل وجه. وعيّن موظفين، ذارما ماهاماترا (أنصار الحق)، أوكلت إليهم مسؤولية نُصرة الحق (ذارما) على القوة (داندا)، كالمراقبين الذين كان لهم نفوذ واسع في الإمبراطورية الرومانية، والمحتسب في الدولة العربية الإسلامية.",
      "وعلى عهد هذا العاهل الهندي بُذل جهد كبير لحماية طرق المواصلات ولرعاية المسافرين بغرس الأشجار على امتداد طرق القوافل، وببناء الاستراحات والمحطات وبتهيئة الملاجئ والمآوي. وأمر بنقش تعاليمه على مسلاّت حجرية نشرت في مناطق عدة، أو على جرف الصخور للتبشير بتعاليم الهند وبفكر عاهلها الكبير الذي وصف في الوثائق القديمة بالمحبوب والتقيّ والناسك والعادل.",
      "وتدل هذه الألقاب على ما حظي به اسمه من مرتبة عظيمة بين ملوك الهند القديمة تفرد أشوكا في تاريخ الهند بالجمع بين السلطات الزمنية والسلطات الروحية. وكان شديد الاقتناع بقيمه الأخلاقية ويعدّ نفسه حاملاً لرسالة الدعوة إليها ويأتي في مقدمتها نبذ العنف، والعدل بين الناس.",
    ] },
]

[articles.ru]
text = "Ашо́ка (санскр. अशोक, IAST: Aśoka, «[рождённый] без боли»; хинди अशोक Ashok) — император Империи Маурьев, правивший с 273 года до н."
title = "Ашока"
lang = "ru"
url = "https://ru.wikipedia.org/wiki/%D0%90%D1%88%D0%BE%D0%BA%D0%B0"
intro = [
  "Ашо́ка (санскр. अशोक, IAST: Aśoka, «[рождённый] без боли»; хинди अशोक Ashok) — император Империи Маурьев, правивший с 273 года до н. э. вплоть до своей смерти в 232 году до н. э.",
  "После ряда военных успехов Ашока подчинил себе значительную часть Южной Азии от современного Афганистана до Бенгалии и далее на юг до Майсура.",
  "Ашока известен главным образом как великий покровитель буддизма. По мнению современных исследователей, для превращения буддизма в мировую религию этот правитель сделал больше, чем кто бы то ни было.",
]
sections = [
  { "title" = "Исторические источники", "paragraphs" = [
      "Биографические сведения об Ашоке происходят из буддистской литературы, составленной примерно через триста лет после смерти Ашоки. Их достоверность ничем не подтверждается. Буддистские авторы стремились подчеркнуть кровожадность Ашоки до принятия им «истинной веры». В этой агиографической традиции жизненный путь Ашоки воспроизводит путь Будды — от невежества к просветлению.",
      "Гораздо более достоверные исторические сведения об Ашоке дают 33 надписи, сделанные по его приказу в разных уголках его державы (т. н. «эдикты Ашоки»). Однако имя Ашоки в них не упоминается. В XIX веке учёные установили, что издатель эдиктов и великий царь Ашока, известный по сочинениям буддистов, есть одно и то же лицо. Кроме буддизма Ашока покровительствовал и другим религиям Индостана (джайнизм и т. д.)",
    ] },
  { "title" = "Биография", "paragraphs" = [
      "Ашока был внуком царя Чандрагупты и сыном Биндусары. Матерью Ашоки была Субхадранги — дочь бедного брахмана по имени Чампаканагар. По легенде, отец отдал её в гарем, потому что получил предсказание, что сын его дочери станет великим правителем. Статус Ашоки в гареме был весьма низкий: у него было много братьев от более знатных жён царя, и ещё старший брат от той же матери.",
      "В детстве Ашока был очень живым и резвым ребёнком, и сладить с ним было очень трудно. Единственное, к чему у него лежало сердце, — это охота, вскоре он стал искусным охотником.",
      "Согласно агиографическим сведениям Ашока не был красив. Но ни один принц не превосходил его в доблести, храбрости, достоинстве, любви к приключениям и искусности в управлении. Поэтому Ашоку любили и уважали все чиновники и простой люд. Биндусара заметил его способности к управлению, и, хоть Ашока был молод, назначил его наместником Аванти.",
    ] },
  { "title" = "Наследие", "paragraphs" = [
      "После смерти Ашоки империя Мауриев постепенно пришла в упадок и пала в 180 году до н. э. вследствие заговора. Всего за несколько столетий браминам удалось стереть память о первом объединителе Индии, собравшем под своим скипетром больше индийских земель, чем кто-либо до начала колонизации полуострова англичанами. В какой-то степени его постигла судьба Эхнатона. Враждебность браминов имеет объяснение: в своих эдиктах Ашока игнорировал кастовую систему и запрещал традиционные для индуизма жертвоприношения; вся его идеология была направлена на подрыв позиций брахманизма. Вновь вписал эту фигуру в историю англичанин Джеймс Принсеп, расшифровавший в 1837 году эдикты на колоннах и установивший авторство Ашоки.",
      "В современных индийских учебниках великий правитель упоминается лишь мимоходом, хотя Джавахарлал Неру настоял на том, чтобы на гербе Индии было изображено навершие колонны Ашоки в Сарнатхе. Лучше сохранили память о нём буддистские страны. Монархи Китая, Цейлона и Камбоджи, исповедовавшие буддизм, считали Ашоку своим образцом. В буддистской традиции он рассматривается как идеал благочестивого монарха, построивший первые ступы и учредивший паломничества к святыням Будды.",
    ] },
  { "title" = "Литература", "paragraphs" = [
      "Ашока // Новый энциклопедический словарь: В 48 томах (вышло 29 томов). — СПб., Петроград, 1911—1916.",
      "Маурийская империя при Ашоке — История Индии (Антонова К. А., Бонгард-Левин Г. М., Котовский Г. Г.)",
      "Асока, Пийадаси // Большая советская энциклопедия : в 66 т. (65 т. и 1 доп.) / гл. ред. О. Ю. Шмидт. — М. : Советская энциклопедия, 1926—1947.",
    ] },
]

[articles.id]
text = "Asoka yang Agung (juga Ashoka, Aśoka, dilafazkan sebagai Asyoka) adalah penguasa Kekaisaran Maurya Gupta dari 269 SM sampai akhir hayatnya pada 232 SM. Seorang penganut agama Buddha, Asoka menguasai sebagian besar anak benua India, dari apa yang sekarang disebut Afganistan sampai Bangladesh dan di selatan sampai sejauh Mysore."
title = "Asoka"
lang = "id"
url = "https://id.wikipedia.org/wiki/Asoka"
intro = [
  "Asoka yang Agung (juga Ashoka, Aśoka, dilafazkan sebagai Asyoka) adalah penguasa Kekaisaran Maurya Gupta dari 269 SM sampai akhir hayatnya pada 232 SM. Seorang penganut agama Buddha, Asoka menguasai sebagian besar anak benua India, dari apa yang sekarang disebut Afganistan sampai Bangladesh dan di selatan sampai sejauh Mysore.",
  "Nama \"Asoka\" berarti 'tanpa duka' dalam bahasa Sanskerta (a – tanpa, soka – duka). Asoka adalah pemimpin pertama Bharata (India) Kuno, setelah para pemimpin Mahabharata yang termasyhur, yang menyatukan wilayah yang sangat luas ini di bawah kekaisarannya, yang bahkan melampaui batas-batas wilayah kedaulatan negara India dewasa ini.",
  "Sang penulis Britania H. G. Wells menulis tentang Asoka: \"Dalam sejarah dunia, ada ribuan raja dan kaisar yang menyebut diri mereka sendiri ‘Yang Agung’, ‘Yang Mulia’ dan ‘Yang Sangat Mulia’ dan sebagainya. Mereka bersinar selama suatu waktu singkat, dan kemudian cepat menghilang. Namun, Asoka tetap bersinar dan bersinar cemerlang seperti sebuah bintang cemerlang bahkan sampai hari ini\" (Aslinya dalam bahasa Inggris: \"In the history of the world there have been thousands of kings and emperors who called themselves 'Their Highnesses', 'Their Majesties' and 'Their Exalted Majesties' and so on. They shone for a brief moment, and as quickly disappeared. But Ashoka shines and shines brightly like a bright star, even unto this day\").",
]
sections = [
  { "title" = "Kehidupan awal", "paragraphs" = [
      "Asoka adalah putra maharaja Maurya, maharaja Bindusara dari seorang selir yang pangkatnya agak rendah dan bernama subhadrangi yang akhir nya disebut Dharma karena ia mengikuti jalan kebenaran. Asoka memiliki beberapa kakak dan hanya satu adik, Vitashoka. Karena kepandaian yang meneladani dan kemampuannya berperang, ia dikatakan merupakan cucu kesayangan kakeknya, maharaja Candragupta Maurya. Maka seperti diceritakan dalam bentuk legenda, ketika Candragupta Maurya meninggalkan kerajaannya untuk hidup sebagai seorang Jain, ia membuang pedangnya. Asoka menemukan pedangnya dan menyimpannya.",
    ] },
  { "title" = "Jalan menuju kekuasaan", "paragraphs" = [
      "Maka sementara ia berkembang menjadi seorang prajurit ulung yang sempurna dan seorang negarawan lihai, Asoka memimpin beberapa regimen tentara Maurya. Popularitasnya yang naik di seluruh wilayah kekaisaran membuat kakak-kakaknya menjadi cemburu karena mereka cemas ia bisa dipilih Bindusara menjadi maharaja selanjutnya. Kakaknya yang tertua, pangeran Susima, putra mahkota pertama, membujuk Bindusara untuk mengirim Asoka mengatasi sebuah pemberontakan di kota Taxila, di provinsi barat laut Sindhu, di mana pangeran Susima adalah gubernurnya. Taxila adalah sebuah daerah yang bergejolak karena penduduknya adalah sukubangsa Yunani-India yang suka berperang dan juga karena pemerintahan kakaknya, pangeran Susima kacau. Oleh karena itu dalam daerah ini banyak terbentuk milisi-milisi yang mengacau keamanan. Asoka setuju dan bertolak ke daerah yang sedang dilanda huru-hara. Maka ketika berita bahwa Asoka akan datang menjenguk mereka dengan pasukannya, ia disambut dengan hormat oleh para milisi yang memberontak dan pemberontakan bisa diakhiri tanpa pertumpahan darah. (Provinsi ini di kemudian hari memberontak lagi ketika Asoka memerintah, tetapi kemudian ditumpas dengan tangan besi).",
      "Keberhasilan Asoka membuat kakak-kakaknya semakin cemas akan maksudnya menjadi maharaja penerus, maka hasutan-hasutan Susima kepada Bindusara membuatnya membuang Asoka. Asoka kemudian pergi ke Kalinga dan menyembunyikan jatidirinya. Di sana ia bertemu dengan seorang nelayan wanita bernama Kaurwaki, dan ia jatuh cinta. Prasasti-prasasti yang baru ditemukan menunjukkan bahwa ia kelak menjadi permaisuri selirnya yang kedua atau ketiga.",
      "Sementara itu, ada sebuah pemberontakan lagi, kali ini di Ujjayani (Ujjain). Maharaja Bindusara mengundang Asoka kembali setelah dibuang selama dua tahun. Asoka pergi ke Ujjayani dan pada pertempuran di sana terluka, tetapi para hulubalangnya berhasil menumpas pemberontakan. Asoka kemudian diobati secara diam-diam sehingga para pengikut setia pangeran Susima tidak bisa melukainya. Ia diurusi oleh para biksu dan biksuni beragama Buddha. Di sinilah ia pertama kalinya berkenalan dengan ajaran Buddha, dan di sini pula ia berjumpa dengan Dewi, yang merupakan perawat pribadinya dan putri seorang saudagar bernama Widisha. Maka setelah pulih, ia menikahinya. Hal ini tidak bisa diterima oleh Bindusara bahwa salah seorang putranya menikah dengan seorang penganut Buddha, maka dia tidak memperbolehkannya tinggal di Pataliputra, tetapi mengirimnya kembali ke Ujjayani dan membuat menjadi seorang gubernur.",
    ] },
  { "title" = "Penaklukkan Kalingga", "paragraphs" = [
      "Sementara tahap-tahap awal kepemimpinan Asoka terbukti cukup haus darah, ia kemudian menjadi pengikut ajaran Buddha setelah menaklukkan Kalingga, daerah yang sekarang adalah negeri bagian India Orissa. Kalingga adalah sebuah negeri yang bangga akan kemerdekaan dan demokrasinya; dengan demokrasi monarki dan parlementernya, negeri ini bisa dikatakan sebuah pengecualian di Bharata Kuno, karena di sana ada konsep Rajadharma, yang berarti kewajiban para pemimpin, yang secara dasar bersatu-padu dengan konsep keberanian dan Ksatriyadharma.",
      "Asal mula Perang Kalingga (265 SM atau 263 SM tidak jelas. Salah satu saudara Susima kemungkinan melarikan diri ke Kalingga dan mendapat suaka secara resmi di sana. Hal ini sangat membuat murka Asoka. Ia diberi saran oleh para menterinya menyerang Kalingga untuk tindakan pengkhianatan ini. Asoka kemudian meminta Kalingga untuk tunduk kepada kekuasaannya. Ketika mereka menolak diktatnya, Asoka mengirimkan salah seorang panglima perangnya supaya mereka tunduk.",
      "Sang panglima perang dan pasukannya kalah dan melarikan diri berkat kepandaian panglima perang Kalingga. Asoka yang tercengang akan kekalahan ini, menyerang dengan sebuah pasukan terbesar yang belum pernah ada dalam sejarah India sampai saat itu. Kalingga melawan dengan sengit tetapi mereka bukan padanan pasukan perang Asoka yang sangat kuat. Seluruh wilayah Kalingga dijarah dan dihancurkan: piagam-piagam Asoka di kemudian hari menyebutkan bahwa di sisi Kalingga kurang lebih 100.000 jiwa tewas sedangkan jumlah prajurit Asoka yang tewas kurang lebih 10.000. Ribuan pria dan wanita dibuang pula.",
    ] },
  { "title" = "Asoka masuk Buddha", "paragraphs" = [
      "Menurut cerita legenda, satu hari setelah peperangan usai, Asoka menjelajah kota dan yang bisa dilihat hanyalah rumah-rumah yang terbakar dan mayat-mayat yang bergelimpangan di mana-mana. Hal ini membuatnya muak dan ia berteriak dengan kata-kata yang menjadi termasyhur: \"Apakah yang telah kuperbuat?\" Kekejian penaklukan ini akhirnya membuatnya memeluk agama Buddha dan ia memakai jabatannya untuk mempromosikan falsafah yang masih relatif baru ini sampai dikenal di mana-mana, sejauh Roma dan Mesir. Sejak saat itu Asoka, yang sebelumnya dikenal sebagai “Asoka yang kejam” (Canda Asoka) mulai dikenal sebagai sang “Asoka yang Saleh” (Dharmâsoka).",
      "Ia lalu mempromosikan aliran Buddha Wibhajyawada dan menyebarkannnya di dalam wilayahnya dan di seluruh dunia yang dikenal mulai dari 250 SM. Maharaja Asoka bisa dikatakan adalah yang pertama dengan serius mengusahakan pembentukan satuan politik Buddha.",
      "Dalam usahanya ini, ia dibantu oleh putranya Mahinda yang mulia dan putrinya Sanghamitta (yang berarti “mitra Sangha”) dan yang membawa agama Buddha ke Sri Lanka. Asoka membangun ribuan stupa dan vihara bagi penganut Buddha. Stupa-stupa di Sanchi sangat termasyhur dan stupa bernama Sanchi Stupa I didirikan oleh Maharaja Asoka. Selama sisa masa pemerintahannya, ia menganut kebijakan resmi anti-kekerasan ahingsa. Bahkan penyembelihan dan penyiksaan sia-sia terhadap hewan pun dilarang. Margasatwa dilindungi dengan undang-undang sang maharaja yang melarang pemburuan untuk olahraga dan pengisian waktu luang. Pemburuan secara terbatas diperbolehkan untuk maksud konsumsi tetapi Asoka juga mempromosikan konsep vegetarianisme. Asoka juga menaruh belas kasihan kepada para narapidana di penjara. Mereka diperbolehkan mengambil cuti, sehari dalam waktu setahun. Ia berusaja meningkatkan ambisi profesional rakyat jelata dengan membangun pusat-pusat studi yang mungkin bisa disebut universitas. Ia juga mengupayakan system irigasi bagi pertanian. Rakyatnya diperlakukan secara sama, apapun derajat, agama, haluan politik, ras, sukubangsa dan kasta mereka. Kerajaan-kerajaan di sekeliling wilayahnya yang sebenarnya mudah ditaklukkan ia buat sebagai sekutu yang terhormat.",
    ] },
  { "title" = "Kematian dan warisannya", "paragraphs" = [
      "Maharaja Asoka memerintah selama 41 tahun, dan setelah mangkatnya, dinasti Maurya masih bertahan selama lebih dari 50 tahun. Asoka memiliki banyak selir dan anak, tetapi nama-nama mereka tidaklah diketahui. Mahinda dan Sanghamitta adalah anak kembar yang dilahirkan istri pertamanya, Dewi di kota Ujjayini. Ia memercayai mereka untuk menyebarkan agama Buddha di dunia yang dikenal dan tak dikenal. Mahinda dan Sanghamitta pergi ke Sri Lanka dan memasukkan Raja, Ratu dan rakyatnya agama Buddha. Mereka lalu berkeliling dunia sampai ke Mesir dunia Helenistik (Yunani). Sehingga mereka tidak bisa melaksanakan kewajiban pemerintahan. Beberapa arsip langka membicarakan penerus Asoka bernama Kunal, yang merupakan putra Asoka dari istri terakhirnya.",
      "Masa kepemimpinan maharaja Asoka bisa saja mudah menghilang dalam sejarah, dengan berselangnya abad, jika ia tidak meninggalkan arsip sejarah apa-apa. Kesaksian maharaja ini ditemukan dalam bentuk pilar-pilar dan batu-batu karang besar yang dipahati secara megah menjadi prasasti. Isinya adalah ajaran-ajaran dan tindakan-tindakan yang ingin ia sebar luaskan. Selain itu Asoka juga mewariskan kita bahasa tertulis pertama di India setelah kota kuno Harappa. Namun berbeda dengan di Harrapa, teks-teks Asoka bisa kita pahami. Bahasa yang dipakai Asoka dalam menuliskan teks-teks prasastinya adalah sebuah bentuk bahasa rakyat atau bahasa Prakerta/Prakrit dan bukan bahasa Sanskerta.",
      "Pada tahun 185 SM, kurang lebih 50 tahun setelah mangkatnya Asoka, penguasa Maurya terakhir, Brihadratha, dibunuh secara keji oleh panglima perang Maurya, Pusyamitra Sunga, saat ia sedang menginspeksi pasukannya. Pusyamitra Sunga lalu mendirikan dinasti Sunga (185 SM-78 SM) dan hanya memerintah sebagian wilayah Kekaisaran Maurya yang telah runtuh.",
    ] },
]

[articles.tl]
text = "Si Ashoka Maurya (304 BCE –232 BCE) na karaniwang kilala bilang Ashoka at Ashoka ang Dakila ay isang emperador na Indiano ng Dinastiyang Maurya na namuno ng halos sa lahat ng subkontinenteng Indiano mula ca. 269 BCE hanggang 232 BCE."
title = "Ashoka"
lang = "tl"
url = "https://tl.wikipedia.org/wiki/Ashoka"
intro = [
  "Si Ashoka Maurya (304 BCE –232 BCE) na karaniwang kilala bilang Ashoka at Ashoka ang Dakila ay isang emperador na Indiano ng Dinastiyang Maurya na namuno ng halos sa lahat ng subkontinenteng Indiano mula ca. 269 BCE hanggang 232 BCE. Siya ay kilala rin bilang \"Dakilang tagapaglagganap ng Budismo\". Siya ang isa sa pinakadakilang mga emperador ng India sa karamihan ng ngayong India pagkatapos ng isang bilang ng mga pananakop na militar. Ang kanyang imperyo ay sumaklaw mula sa Hindu Kush sa Afghanistan hanggang sa kasalukuyang Bangladesh at sa estadong Indian ng Assam sa silangan at hanggang sa kasing layo sa timog sa hilagaang Kerala at Andhra Pradesh. Ang ang kabisera ng Imperyong Maurya ang Taxila, Ujjain at pataliputra. Noong mga 260 BCE, si Ashoka ay nakidigma ng isang mapait na nakakawasak ng digmaan laban sa mga estado ng Kalinga (modernong Odisha). Kanyang sinakop ang Kalinga na wala sa kanyang mga ninuno mula kay Chandragupta Maurya ang nakasakop. Siya ay yumakap sa relihiyong Budismo pagkatapos masaksihan ang mga kamatayan ng tao na iniulat na higit sa 100,000 tao sa Digmaang Kalinga na kanyang isinagawa dahil sa isang pagnanais ng pananakop. Ito ay humantong rin sa pagpapatapon ng mga 150,000 tao. Unti-unting naakay si Ashoka sa Budismo sa simula ng mga 263 BCE sa pinakahuli. Kalaunan ay itinuon ang kanyang sarili sa pagpapalaganap ng Budismo sa buong kilalang mundo sa panahong ito. Itinuring ni Ashoka ang Budismo bilang isang doktrina na makapagsisilbi bilang isang pundasyong kultural para sa pagkakaisang pampolitika. Si Ashoka ay kadalasang naalala sa kasaysayan bilang isang pilantropikong tagapamahala. Sa kanyang mga kautusan sa Kalinga, kanyang tinawag ang kanyang mga nasasakupan bilang kanyang \"mga anak\" at binabanggit na bilang isang ama, kanyang ninais…",
  "Isinulat ni H.G. Wells sa kanyang A Short History of the World (H. G. Wells):Sa kasaysayan ng mundo, may mga libo libong hari at emperador na tumawag sa kanilang mga sariling, \"Ang kanilang mga Kamahalan\", at iba pa. Sila ay nagningning sa isang maikling sandali at kasing bilis na naglaho. Ngunit si Ashoka ay nagniningning at nagniningning ng maliwanag tulad ng isang maliwanag na bituin kahit sa panahong ito.",
  "Si Ashoka ay gumampan ng isang mahalagang papel sa pagtulong na gumawa sa Budismo na isang pandaigdigang relihiyon. Ang emblem ng modernong Republika ng India ay isang paghalaw ng Leon na Kapital ni Ashoka.",
]
sections = [
  { "title" = "Talambuhay", "paragraphs" = [
      "Ayon sa mga alamat, si Ashoka ay ng isang masamang kalikasan at magagagalitin. Kanyang isinailalim ang kanyang mga ministero sa isang pagsubok ng katapatan at pinapatay ang 500 sa kanila. Siya ay nagpanatili rin ng isang harem ng mga 500 babae. Nang ang ilan sa mga babaeng ito ay uminsulto sa kanya dahil sa kanyang \"magaspang na balat\" pagkatapos niyang magiliw na ihambing ang kanyang sarili sa kagandang ng punong Asoka(na ayon sa Ashokavadana, ay nilapastangan ng mga babae sa pamamagitan ng pagbunot ng lahat ng mga bulaklak), kanyang ipinasunog ang karamihan sa kanila hanggang sa kamatayan. Siya ay nagtayo rin ng isang masalimuot na kahon ng pagpapahirap na itinuring na isang \"Impiyernong Pang-Paraiso\" dahil sa magandang labas nito na sinalungat ng mga aktong isinasagawa sa loob ng kanyang hinirang na berdugong si Girikaa, na nagbigay sa kanya ng pangalang \"çanḍa Ashoka\" o \"Chandaashoka,\" na nangangahulugang \"Ashoka ang Mabagsik\" sa Sanskrit.",
      "Sa pag-akyat sa trono, kanyang pinalawak ang kanyang imperyo sa loob ng sumunod na walong taon mula sa kasalukyang mga hangganan at rehiyon ng Burma-Bangladesh at estado ng Assam sa India sa silangan hanggang sa teritoryo ng kasalukuyang Iran/Persia at Afghanistan sa kanluran; mula sa Pamir Knots sa hilaga hanggang halos sa peninsular na katimugang India (iyong Tamil Nadu/Andhra Pradesh).",
      "Bagaman ang maagang bahagi ng kanyang paghahari ay uhaw sa dugo, siya ay naging alagad ng mga katuruan ni Gautama Buddha pagkatapos ng kanyang pananakop ng Kalinga, India. Ang Digmaang Kalinga ay nangyari pagkatapos ng 8 taon ng kanyang koronasyon. Ayon sa kanyang ika-13 inskripsiyon, ang labanan ay malawak at nagsanhi ng mga kamatayan ng higit sa 100,000 sundalo at mga sibilyan na nagtanggol. Ang higit sa 150,000 ay ipinatapon.",
    ] },
]

[articles.pt]
text = "Açoca, Asoca ou Axoca (em brami: 𑀅𑀲𑁄𑀓; Asoka; em devanágari: अशोक, IAST: Aśoka), também conhecido como Açocavardana (Açokavardhana; 304 – 232 a.C.) ou Açoca, o Grande foi o imperador do Império Máuria que reinou entre 273 e 232 a.C. Frequentemente citado como um dos maiores imperadores da Índia, Açoca reinou sobre a maior parte do território correspondente à Índia atual depois de várias conquistas militares."
title = "Açoca"
lang = "pt"
url = "https://pt.wikipedia.org/wiki/A%C3%A7oca"
intro = [
  "Açoca, Asoca ou Axoca (em brami: 𑀅𑀲𑁄𑀓; Asoka; em devanágari: अशोक, IAST: Aśoka), também conhecido como Açocavardana (Açokavardhana; 304 – 232 a.C.) ou Açoca, o Grande foi o imperador do Império Máuria que reinou entre 273 e 232 a.C. Frequentemente citado como um dos maiores imperadores da Índia, Açoca reinou sobre a maior parte do território correspondente à Índia atual depois de várias conquistas militares. Seu império estendia-se do atual Paquistão, Afeganistão e partes do Irã, a oeste, até Bengala e os atuais estados indianos de Assão, a leste, e de Maiçor, ao sul. Sua capital era em Mágada (atualmente no estado indiano de Biar). Ele converteu-se ao budismo, abandonando a tradição védica predominante, depois de testemunhar os massacres da guerra de Calinga, que ele mesmo havia iniciado devido a seu desejo de conquista. Dedicou-se posteriormente à propagação do budismo na Ásia e estabeleceu monumentos marcando diversos lugares significativos na vida de Gautama Buda.",
  "Seu título imperial em prácrito advém do devanágari Devanampriya Priyadarsi (देवानांप्रिय प्रियदर्शी ; \"aquele que é amado pelos deuses e que é amável para com todos\") e Damma (धम्म; \"que segue a lei, religioso, justo\").",
]
sections = [
  { "title" = "Biografia", "paragraphs" = [
      "Açoca era filho do imperador máuria Bindusara e de sua rainha Dharma (embora ela fosse uma brâmane ou shubhadrangi, era subestimada porque não tinha sangue real). Açoca teve vários irmãos mais velhos (todos meio-irmãos, filhos de outras esposas de Bindusara). Ele tinha apenas um irmão mais novo, Vitthashoka (um irmão muito amado da mesma mãe). Devido à sua grande inteligência e habilidades de guerreiro, dizia-se ter sido o favorito de seu avô Chandragupta Máuria. Como diz a lenda, quando Chandragupta Máuria deixou seu império por uma vida jainista, ele jogou fora sua espada. Açoca encontrou a espada e a guardou, apesar da advertência de seu avô.",
      "Açoca, em sua adolescência, era rude e impertinente. Era um caçador temível. Foi um xátria e recebeu todos os treinamentos militares reais e outros conhecimentos védicos. De acordo com uma lenda, ele matou um leão com apenas uma haste de madeira. Era muito conhecido por sua luta de espadas. Ele era muito aventureiro e isso fez, dele, um lutador espetacular. Era um guerreiro assustador e um general impiedoso. Devido a esta qualidade, ele foi enviado para destruir o motim de Avanti.",
      "Revelando-se um general guerreiro impecável e um político astuto, Açoca passou a comandar vários regimentos do exército máuria. Sua crescente popularidade em todo o império fez seus irmãos mais velhos desconfiarem de suas chances de serem preferidos por Bindusara para se tornarem o próximo imperador. O mais velho deles, Susima, o tradicional herdeiro ao trono, convenceu Bindusara a enviar Açoca para reprimir uma revolta em Taxila, uma cidade no distrito noroeste da região paquistanesa de Punjab, onde o príncipe Susima era o governador. Taxila era um lugar muito inconstante por causa do estado de guerra entre a população indo-grega e da má gestão do próprio Susima. Isto levou à formação de diferentes milícias, causando tumultos. Açoca consentiu e partiu para a área problemática. Quando as notícias da visita de Açoca com seu exército começaram a aparecer, ele foi saudado pelas milícias revoltantes e a rebelião terminou sem um conflito (a província revoltou-se mais uma vez durante o reinado de Açoca, mas desta vez a revolta foi esmagada com punho de ferro).",
    ] },
]

