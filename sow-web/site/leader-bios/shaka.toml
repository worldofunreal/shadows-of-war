[articles.en]
text = "Shaka kaSenzangakhona, also known as Shaka Zulu, Shaka the Zulu, and Sigidi kaSenzangakhona, was the king of the Zulu Kingdom from 1816 to 1828. One of the most influential monarchs of the Zulu, he ordered wide-reaching reforms that reorganized the military into a formidable force."
title = "Shaka"
lang = "en"
url = "https://en.wikipedia.org/wiki/Shaka"
intro = [
  "Shaka kaSenzangakhona (c. 1787 – 24 September 1828), also known as Shaka Zulu (Zulu pronunciation: [ˈʃaːɠa]), Shaka the Zulu, and Sigidi kaSenzangakhona, was the king of the Zulu Kingdom from 1816 to 1828. One of the most influential monarchs of the Zulu, he ordered wide-reaching reforms that reorganized the military into a formidable force.",
  "King Shaka was born in the lunar month of uNtulikazi (July) in 1787, in Mthonjaneni, KwaZulu-Natal Province, South Africa. The son of the Zulu King Senzangakhona kaJama, he was spurned as an illegitimate son. Shaka spent part of his childhood in his mother's settlements, where he was initiated into an ibutho lempi (fighting unit/regiment), serving as a warrior under Inkosi Dingiswayo.",
  "King Shaka refined the ibutho military system with the Mthethwa Paramountcy's support over the next several years. He forged alliances with his smaller neighbours to counter Ndwandwe raids from the north. The initial Zulu maneuvers were primarily defensive, as King Shaka preferred to apply pressure diplomatically, with an occasional strategic assassination. His reforms of local society built on existing structures. Although he preferred social and propagandistic political methods, he also engaged in several battles.",
  "King Shaka's reign coincided with the start of the Mfecane/Difaqane (\"upheaval\" or \"crushing\"), a period of devastating warfare and chaos in southern Africa between 1815 and 1840 that depopulated the region. His role in the Mfecane/Difaqane is controversial. In 1828, he was assassinated by his half-brothers, King Dingane and Prince Mhlangana and Mbopha kaSithayi.",
]
sections = [
  { "title" = "Early life", "paragraphs" = [
      "Shaka (roughly translated as \"intestinal beetle\") was born to the reigning Zulu king. He was the eldest of many sons, but was considered to be a bastard child and was sent away to live with his mother's tribe, known as the Elangeni, leaving his half-brother to rule the Zulu Kingdom. At the time, the Zulu were a regional tribe relying on pastoral livestock, sorghum, and milk. When Shaka reached a suitable age, he and his mother were sent to the Mthethwa clan, the most powerful regional tribe. There, he matured, and served as a warrior under Jobe, and then for Dingiswayo, a respected warrior and chief of the clan. When Inkosi Dingiswayo discovered Shaka was royalty, he put him in charge of a regiment, helping to develop Shaka's military tactics and strategy.",
      "After Inkosi Zwide, the king of the Ndwandwe (Nxumalo) nation, murdered Dingiswayo, Shaka sought to avenge his death. During that encounter, Zwide's mother, Ntombazi, a sangoma, was killed by Shaka. Shaka chose a particularly gruesome revenge on her by locking her in a house with jackals or hyenas inside. They devoured her, and in the morning, Shaka burned the house to the ground. Shaka continued his pursuit of Zwide. It was not until around 1825 that the two military leaders met in the vicinity of Pongola, near the present-day border of Mpumalanga, a province of South Africa. Shaka was victorious in battle, although his forces sustained heavy casualties, including his military commander, Mgobhozi Ovela Entabeni.",
      "Already at this time, Shaka had grown famous for his use of the short stabbing spear. This spear was referred to as the \"iklwa,\" see: assegai. It was deadly and easy to thrust, whereas before, tribesmen barely tried to customize or improve their weapons. Shaka's innovative tactics, among them the \"bull horn\", devastated Zwide's forces at the battle of Gqokli Hill.",
    ] },
  { "title" = "Expansion of power and conflict with Zwide", "paragraphs" = [
      "As Shaka became more respected by his people, he was able to spread his ideas with greater ease. Using his background as a soldier, Shaka taught the Zulus that the most effective way of gaining power quickly was by conquering and controlling other tribes. His teachings greatly influenced the social outlook of the Zulus. The Zulu tribe soon developed a warrior outlook, which Shaka used to his advantage.",
      "Shaka's hegemony was primarily based on military might, smashing rivals and incorporating scattered remnants into his own army. He supplemented this with a mixture of diplomacy and patronage, incorporating friendly chieftains, including Zihlandlo of the Mkhize, Jobe of the Sithole, and Mathubane of the Thuli. These people were never defeated in battle by the Zulus; they did not have to be. Shaka won them over with subtler tactics, such as patronage and reward. As for the ruling of Qwabe, they began re-inventing their genealogies to give the impression that Qwabe and Zulu were closely related (i.e. as Nguni) in the past. In this way, a greater sense of cohesion was created, though it never became complete, as subsequent civil wars attest.",
      "Shaka still recognised Dingiswayo and his larger Mthethwa clan, as overlord after he returned to the Zulu land but, some years later, Dingiswayo was ambushed by Zwide's Ndwandwe and killed. There is no evidence to suggest that Shaka betrayed Dingiswayo. The Zulu people had to retreat before several Ndwandwe incursions; the Ndwandwe was clearly the most aggressive grouping in the sub-region.",
    ] },
  { "title" = "Death", "paragraphs" = [
      "Dingane and Mhlangana, Shaka's half-brothers, appeared to have made at least two attempts to assassinate Shaka before they succeeded, with support from the Mpondo elements and some disaffected iziYendane people. Shaka had made enough enemies among his own people to hasten his demise. It came relatively quickly after the death of his mother, Nandi, in October 1827 and the devastation caused by Shaka's subsequent erratic behavior. According to Donald Morris, Shaka ordered that no crops should be planted during the following year of mourning, no milk (the basis of the Zulu diet at the time) was to be used, and any woman who became pregnant was to be killed along with her husband. At least 7,000 people who were deemed to be insufficiently grief-stricken were executed, although the killing was not restricted to humans; cows were slaughtered so that their calves would know what losing a mother felt like.",
      "Shaka was killed by three assassins sometime in 1828; September is the most frequently cited date, when almost all available Zulu manpower had been sent on yet another mass sweep to the north. This left the royal kraal critically lacking in protection. It was all the conspirators needed. An iNduna named Mbopa created a diversion, and Dingane and Mhlangana struck the fatal blows. Shaka's corpse was dumped by his assassins in an empty grain pit, which was then filled with stones and mud. The exact location is unknown. A monument was built at one alleged site. Historian Donald Morris holds that the true site is somewhere on Couper Street in the village of KwaDukuza, in KwaZulu-Natal, South Africa.",
      "Dingane assumed power and embarked on an extensive purge of pro-Shaka elements and chieftains, over the course of several years, in order to secure his position. The initial problem Dingane faced was maintaining the loyalty of the Zulu fighting regiments. He set up his main residence at Mgungundlovu and established his authority over the Zulu kingdom. Dingane ruled for some twelve years, during which time he fought, disastrously, against the Voortrekkers, and against another half-brother, Mpande, who, with Boer and British support, took over the Zulu leadership in 1840, ruling for some 30 years.",
    ] },
  { "title" = "Social and military revolution", "paragraphs" = [
      "Some older histories have doubted the military and social innovations customarily attributed to Shaka, denying them outright, or attributing them variously to European influences. More modern researchers argue that such explanations fall short, and that the general Zulu culture, which included other tribes and clans, contained a number of practices that Shaka could have drawn on to fulfill his objectives, whether in raiding, conquest or hegemony. Some of these practices are shown below.",
      "Shaka is often said to have been dissatisfied with the long throwing assegai, and is credited with having introduced a new variant of the weapon: the iklwa, a short stabbing spear with a long, broad, sword-like spearhead.",
      "Although he is credited with introducing the iklwa to his people, Shaka likely did not invent it himself. He most likely outsourced it from Nzama, who later had a feud with him because he did not want to pay for the spears. Deneys Reitz also reports an account that Shaka's use of the iklwa was inspired by a British explorer, a Dr. Cowan, who told him that British troops owed their military success to the bayonet.",
    ] },
  { "title" = "Legacy", "paragraphs" = [
      "The King Shaka International Airport at La Mercy, 35 km (22 mi) north of the Durban city centre was opened on 1 May 2010 in preparation for the 2010 FIFA World Cup after a protracted debate over the naming of the airport.",
    ] },
]

[articles.fr]
text = "Chaka kaSenzangakhona, aussi appelé Chaka Zoulou ou Shaka Zulu (également orthographié \"Shaka\" ou \"Tshaka\"), né en 1787 et mort en 1828, est un roi zoulou. Il est le fondateur du royaume zoulou."
title = "Chaka (roi zoulou)"
lang = "fr"
url = "https://fr.wikipedia.org/wiki/Chaka_%28roi_zoulou%29"
intro = [
  "Chaka kaSenzangakhona, aussi appelé Chaka Zoulou ou Shaka Zulu (également orthographié \"Shaka\" ou \"Tshaka\"), né en 1787 et mort en 1828, est un roi zoulou. Il est le fondateur du royaume zoulou.",
]
sections = [
  { "title" = "Biographie", "paragraphs" = [
      "Chaka serait issu d'une union illégitime entre Nandi, princesse Langeni, et Senza Ngakona, chef du clan des Zoulous (une fraction du peuple Nguni qui peupla l'Afrique du Sud du XIIIe au XVIIIe siècle). D'après la légende, il aurait été considéré comme un bâtard, rejeté et humilié par son père, régulièrement maltraité par ses camarades. Nandi et Chaka aurait trouvé refuge chez un autre chef du nom de Methethwas, qui deviendra le clan de Dingiswayo, un chef important pour l’ascension de Chaka. Ces expériences l'endurciront et marqueront sa personnalité d'une soif de vengeance.",
      "Mazisi Kunene, qui, lui, s'est inspiré des traditions zouloues, explique que la mère de Chaka, Nandi, était une princesse autoritaire. Elle s'est fâchée avec son mari et avec ses coépouses, ce pourquoi elle a été répudiée. Cause de guerre entre les Abasema Langeni, son peuple, et la tribu zouloue, elle a dû fuir chez les Qwabe, dont elle aurait épousé l'un des princes. Ainsi, Mazisi Kunene ne réfute pas la difficile enfance de Chaka, mais la nuance.",
      "Chaka ne s'entend pas avec les membres de la famille royale qwabe (contre lesquels il devra guerroyer plus tard). Il part chez les Bathwetwa et devient membre de l'armée de Dingiswayo, le souverain des Bathwetwa. En effet, il est incorporé au sortir de l’adolescence dans le régiment Bathwetwa des izi-Chwe et il devient rapidement le guerrier le plus remarquable de l'armée de Dingiswayo. Doué d'une force physique et d'une endurance prodigieuses, il excelle au combat. Il est charismatique et se révèle être un fin stratège. Sa réputation s'étend. Il devient bientôt le porte-parole et le bras droit de Dingiswayo.",
    ] },
  { "title" = "Hommages et références", "paragraphs" = [
      "Chaka a fait l'objet d'un grand nombre de récits (poèmes, épopées, pièces de théâtre). Hormis les journaux de Bryant, Fynn et Isaacs, l'un des premiers à avoir écrit sur lui, façonnant en partie le mythe, est Thomas Mofolo en 1925.",
      "Auparavant, Chaka apparaît dans la littérature victorienne du roman d'aventures, sous les traits d'un horrible tyran sanguinaire, comme dans le roman de Henry Rider Haggard, Nada the Lily (en) (1892), parlant du fils fictif de Chaka, Umslopogaas.",
      "Dans les années 1960-1970, Chaka devient un personnage important de la revendication africaine. De nombreux écrivains s'emparent du personnage.",
    ] },
  { "title" = "Voir aussi", "paragraphs" = [
      "Henry Francis Fynn : explorateur anglais ayant rencontré Chaka en personne, aventure relatée dans son livre : Chaka, roi des Zoulous ;",
      "Mfecane, la vague chaotique d'émigration de clans à la suite de l'unification du royaume zoulou ;",
      "Chaka : spectacle du conteur français Marc Buléon, racontant l'épopée tragique et sanglante de ce roi.",
    ] },
]

[articles.ko]
text = "샤카 카센잔가코나(Shaka kaSenzangakhona, 1787년경 ~ 1828년 9월 24일)는 샤카 줄루 또는 시기디 카센잔가코나로도 알려져 있으며, 1816년부터 1828년까지 줄루 왕국의 국왕이었다. 줄루족의 가장 영향력 있는 군주 중 한 명이었던 그는 대규모 군사 개혁을 단행했다."
title = "샤카 카센잔가코나"
lang = "ko"
url = "https://ko.wikipedia.org/wiki/%EC%83%A4%EC%B9%B4_%EC%B9%B4%EC%84%BC%EC%9E%94%EA%B0%80%EC%BD%94%EB%82%98"
intro = [
  "샤카 카센잔가코나(Shaka kaSenzangakhona, 1787년경 ~ 1828년 9월 24일)는 샤카 줄루 또는 시기디 카센잔가코나로도 알려져 있으며, 1816년부터 1828년까지 줄루 왕국의 국왕이었다. 줄루족의 가장 영향력 있는 군주 중 한 명이었던 그는 대규모 군사 개혁을 단행했다.",
  "샤카 카센잔가코나는 1787년 7월경 오늘날 남아프리카 공화국 콰줄루나탈주에 존속했던 음테트와 왕국에서 태어났다. 줄루인의 왕인 센잔가코나 카자마의 아들이었으나, 서자로 취급받아 배척당했다. 샤카는 어린 시절의 일부를 어머니의 정착지에서 보냈으며, 그곳에서 임피(ibutho lempi)에 입대하여 딩기스와요 휘하의 전사로 복무했다.",
  "샤카는 이후 몇 년 동안 음테트와 왕국의 지원을 받아 이부토(ibutho)라고 불리는 군사 체제를 개선했다. 그는 북쪽의 은드완드웨의 습격에 대응하기 위해 소규모 이웃 부족들과 동맹을 맺었다. 초기 그가 이끄는 줄루족 부대의 전략은 주로 방어적이었으며, 샤카는 가끔 전략적 암살을 포함한 외교적 압박을 선호했다. 그의 지역 사회 개혁은 기존의 사회 구조를 바탕으로 이루어졌다. 그는 사회적 정복을 선호했음에도 불구하고 여러 차례의 전투에 참여했다.",
  "샤카의 통치 기간은 1815년에서 1840년 사이 남아프리카 지역을 황폐화하고 인구를 감소시켰던 혼란과 전쟁의 시기인 음페카네(Mfecane, 줄루어로 격변)의 기간과 일치한다. 음페카네에서의 그의 역할에 대해서는 논란이 있다. 그는 이복형제인 딩가네 카센잔가코나와 음흘랑가나, 그리고 음보파 카시타이에게 암살당했다.",
]
sections = [
  { "title" = "생애", "paragraphs" = [
      "샤카는 당시 재위 중이던 줄루족의 왕의 아들로 태어났다. 그는 많은 아들 중 장남이었으나 서자로 여겨졌고, 이복형제가 줄루 왕국을 다스리는 동안 어머니의 부족인 엘랑게니족과 살기 위해 쫓겨났다. 당시 줄루족은 목축, 수수, 젖에 의존하는 지역 부족에 불과했다. 샤카가 성인이 되었을 때, 그와 그의 어머니는 지역에서 가장 강력한 부족이었던 므테트와 씨족으로 보내졌다. 그곳에서 그는 조베 휘하에서, 그리고 이후 씨족의 존경받는 추장이자 전사인 딩기스와요 휘하에서 전사로 복무하며 성장했다. 잉코시 딩기스와요는 샤카가 왕족임을 알게 되자 그를 연대 책임자로 임명하여 샤카가 군사 전술과 전략을 개발하는 것을 도왔다.",
      "은드완드웨 (능쿠말로) 국가의 왕인 잉코시 즈위데 카랑가가 딩기스와요를 살해하자, 샤카는 그의 복수를 꾀했다. 그 과정에서 즈위데의 어머니이자 상고마였던 은톰바지가 샤카에게 죽임을 당했다. 샤카는 그녀를 자칼이나 하이에나가 들어있는 집에 가두는 잔인한 방식으로 복수했다. 짐승들이 그녀를 잡아먹었고, 아침에 샤카는 그 집을 불태워 버렸다. 샤카는 계속해서 즈위데를 추격했다. 1825년경이 되어서야 두 군사 지도자는 오늘날 남아프리카 공화국의 주 중 하나인 음푸말랑가주 접경지 인근의 퐁골라 근처에서 만났다. 샤카는 이 전투에서 승리했으나, 그의 사령관 음고보지 오벨라 엔타베니를 포함해 큰 인명 피해를 입었다.",
      "이전 부족들이 무기를 개선하려 하지 않았던 것과 달리, 이 창은 치명적이고 찌르기 쉬웠다. 샤카의 혁신적인 전술 중 하나인 \"황소 뿔\" 전술은 고클리 언덕 전투에서 즈위데의 군대를 궤멸시켰다.",
    ] },
  { "title" = "사회 및 군사 혁명", "paragraphs" = [
      "일부 과거의 역사서들은 샤카에게 관습적으로 부여된 군사적, 사회적 혁신에 의문을 제기하며 이를 완전히 부정하거나 유럽의 영향으로 돌리기도 했다. 현대의 연구자들은 그러한 설명이 부족하며, 다른 부족과 씨족을 포함했던 일반적인 줄루 문화가 습격, 정복 또는 패권을 달성하기 위해 샤카가 활용할 수 있었던 여러 관습을 이미 포함하고 있었다고 주장한다. 이러한 관습 중 일부는 아래와 같다.",
      "샤카는 종종 긴 투창용 아세가이에 불만을 품고, 이 무기의 새로운 변형인 '이클와'(iklwa)를 도입한 공로를 인정받는다. 이클와는 길고 넓은 검 같은 창날을 가진 짧은 찌르기용 창이다.",
      "비록 그가 백성들에게 이클와를 도입한 공로를 인정받지만, 샤카가 직접 발명한 것은 아닐 가능성이 높다. 그는 아마도 은자마에게 제작을 맡겼을 것이며, 나중에 창 값을 지불하려 하지 않아 그와 불화를 겪기도 했다. 데니스 라이츠는 또한 샤카가 이클와를 사용하게 된 영감이 영국군이 총검 덕분에 군사적 성공을 거두었다고 말해준 영국의 탐험가 코완 박사로부터 왔다는 기록을 전한다.",
    ] },
  { "title" = "연구", "paragraphs" = [
