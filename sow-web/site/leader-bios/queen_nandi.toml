[articles.en]
text = "Nandi kaBhebhe (c. 1764–1827) came from the eLangeni community and became queen mother after her son Shaka rose to power among the Zulu."
title = "Queen Nandi"
lang = "en"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (c. 1764–1827) came from the eLangeni community and became queen mother after her son Shaka rose to power among the Zulu."]
sections = [{ title = "A royal household", paragraphs = ["Written accounts of Nandi are limited, and much of her life is known through oral histories recorded after her death. The sources differ on the details of her ancestry and early movements. They describe a period in which she raised Shaka away from his father's household and found shelter among the Mthethwa. After his accession, Shaka established a royal residence for Nandi at Emkhindini. The traditions about her household remember gifts of cattle, a source of food and wealth and a means of supporting dependants. The farm bonus represents the resources a household could mobilize. The surviving accounts give no troop totals for Nandi or evidence that she commanded an army of her own."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.es]
text = "Nandi kaBhebhe (c. 1764–1827) procedía de la comunidad eLangeni y se convirtió en reina madre tras el ascenso de su hijo Shaka entre los zulúes."
title = "Reina Nandi"
lang = "es"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (c. 1764–1827) procedía de la comunidad eLangeni y se convirtió en reina madre tras el ascenso de su hijo Shaka entre los zulúes."]
sections = [{ title = "Una casa real", paragraphs = ["Los testimonios escritos sobre Nandi son escasos. Gran parte de su vida se conoce por tradiciones orales recogidas después de su muerte, que difieren sobre su ascendencia y sus primeros desplazamientos. Relatan que crio a Shaka fuera de la casa paterna y encontró refugio entre los mthethwa. Tras acceder al poder, Shaka estableció para ella una residencia real en Emkhindini. Los relatos de aquella casa recuerdan entregas de ganado, fuente de alimento y riqueza que permitía mantener a las personas bajo su protección. La habilidad traslada al juego esa capacidad de sustento. Las fuentes conservadas no le atribuyen un ejército propio ni ofrecen cifras de tropas movilizadas por ella."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.fr]
text = "Nandi kaBhebhe (vers 1764–1827), originaire de la communauté eLangeni, devint reine mère après l’ascension de son fils Shaka chez les Zoulous."
title = "Reine Nandi"
lang = "fr"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (vers 1764–1827), originaire de la communauté eLangeni, devint reine mère après l’ascension de son fils Shaka chez les Zoulous."]
sections = [{ title = "Une maison royale", paragraphs = ["Les témoignages écrits sur Nandi sont rares. Sa vie est surtout connue par des traditions orales recueillies après sa mort, qui divergent sur son ascendance et ses premiers déplacements. Elles racontent qu’elle éleva Shaka loin de la maison paternelle et trouva refuge chez les Mthethwa. Une fois au pouvoir, Shaka lui établit une résidence royale à Emkhindini. Les récits de cette maison évoquent des dons de bétail, source de nourriture et de richesse qui permettait de faire vivre les personnes à sa charge. Le jeu transpose ces moyens de subsistance dans la production des fermes. Les sources ne décrivent ni armée personnelle de Nandi ni effectifs levés par elle."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.de]
text = "Nandi kaBhebhe (um 1764–1827) stammte aus der Gemeinschaft der eLangeni und wurde nach dem Aufstieg ihres Sohnes Shaka zur Königinmutter der Zulu."
title = "Königin Nandi"
lang = "de"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (um 1764–1827) stammte aus der Gemeinschaft der eLangeni und wurde nach dem Aufstieg ihres Sohnes Shaka zur Königinmutter der Zulu."]
sections = [{ title = "Ein königlicher Haushalt", paragraphs = ["Über Nandi gibt es nur wenige schriftliche Zeugnisse. Vieles ist aus mündlichen Überlieferungen bekannt, die erst nach ihrem Tod aufgezeichnet wurden. Sie unterscheiden sich in Einzelheiten ihrer Abstammung und ihrer frühen Lebensstationen. Den Berichten zufolge zog sie Shaka außerhalb des väterlichen Haushalts auf und fand bei den Mthethwa Zuflucht. Nach seiner Machtübernahme richtete Shaka für sie einen königlichen Wohnsitz in Emkhindini ein. Die Überlieferungen über diesen Haushalt erinnern an Rindergeschenke. Vieh lieferte Nahrung, stellte Vermögen dar und half, die zum Haushalt gehörenden Menschen zu versorgen. Der Farmbonus überträgt diese Versorgung auf das Spiel. Die Quellen belegen weder ein eigenes Heer Nandis noch von ihr aufgebotene Truppenzahlen."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.it]
text = "Nandi kaBhebhe (ca. 1764–1827) proveniva dalla comunità eLangeni e divenne regina madre dopo l’ascesa di suo figlio Shaka tra gli zulu."
title = "Regina Nandi"
lang = "it"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (ca. 1764–1827) proveniva dalla comunità eLangeni e divenne regina madre dopo l’ascesa di suo figlio Shaka tra gli zulu."]
sections = [{ title = "Una casa reale", paragraphs = ["Le testimonianze scritte su Nandi sono scarse. La sua vita è nota soprattutto attraverso tradizioni orali raccolte dopo la sua morte, che divergono sulla genealogia e sui primi spostamenti. Raccontano che allevò Shaka lontano dalla casa paterna e trovò rifugio presso i Mthethwa. Dopo essere salito al potere, Shaka le istituì una residenza reale a Emkhindini. I racconti relativi a quella casa ricordano doni di bestiame, fonte di cibo e ricchezza che permetteva di mantenere le persone affidate alla famiglia. Il bonus delle fattorie traduce nel gioco tale capacità di sostentamento. Le fonti non le attribuiscono il comando di un esercito proprio e non forniscono cifre di reclutamento."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.tr]
text = "ELangeni topluluğundan gelen Nandi kaBhebhe (yaklaşık 1764–1827), oğlu Shaka Zulular arasında iktidara yükselince kraliçe anne oldu."
title = "Kraliçe Nandi"
lang = "tr"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["ELangeni topluluğundan gelen Nandi kaBhebhe (yaklaşık 1764–1827), oğlu Shaka Zulular arasında iktidara yükselince kraliçe anne oldu."]
sections = [{ title = "Kraliyet hanesi", paragraphs = ["Nandi hakkında yazılı tanıklık azdır. Hayatının büyük bölümü ölümünden sonra kayda geçirilen sözlü anlatılardan bilinir. Bu anlatılar soyu ve gençliğinde yaşadığı yerler konusunda farklı ayrıntılar verir. Shaka’yı babasının hanesi dışında büyüttüğünü ve Mthethwa halkı arasında sığınak bulduğunu anlatırlar. Shaka yönetimi ele aldıktan sonra annesi için Emkhindini’de bir kraliyet konutu kurdu. Bu haneyle ilgili anlatılar sığır armağanlarını hatırlar. Sığırlar besin ve servet kaynağıydı, ayrıca haneye bağlı kişilerin geçimini sağlıyordu. Çiftlik bonusu bu geçim kaynaklarının oyundaki karşılığıdır. Eldeki kaynaklar Nandi’nin bağımsız bir ordu komuta ettiğini ya da belirli sayıda asker topladığını göstermez."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.zh-CN]
text = "南迪·卡贝贝约生于1764年，卒于1827年。她来自埃兰盖尼社群，在儿子恰卡取得祖鲁人的领导权后成为王太后。"
title = "南迪王太后"
lang = "zh-CN"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["南迪·卡贝贝约生于1764年，卒于1827年。她来自埃兰盖尼社群，在儿子恰卡取得祖鲁人的领导权后成为王太后。"]
sections = [{ title = "王太后的家户", paragraphs = ["关于南迪本人的同时代文字记录很少。今天流传的生平主要依据后来收集的口述历史，研究者也通过与恰卡有关的记载了解她在祖鲁王室中的位置。不同讲述对她的父系亲属、少年时期及迁居先后的细节并不完全一致，因此较为精确的年表需要谨慎看待。口述传统把南迪描写为承担养育责任、设法为子女争取安全的人。她曾在恰卡父亲的家户之外抚养他，之后在姆特特瓦人的社会中找到庇护。这里的庇护涉及亲属关系和主人接纳客人的责任，也关系到一个家庭能否继续安稳生活。恰卡后来成为祖鲁统治者，南迪随之获得了王太后的地位。相传恰卡在埃姆金迪尼为她安排了独立的王室住所，关于这一住所的故事还提到送给她的大群牛。研究南迪的学者强调，了解这段经历不能只把她视作著名统治者的亲属。家户的资源、扶养义务和保护关系也能解释她在王室中的作用。牛群在当时兼有生计和财富的意义。牲畜可提供食物，也能用来维持附属于家户的人口和履行社会义务。围绕王太后家户保存下来的记忆说明，亲属照顾、庇护和物资来源都与权力如何维持有关。游戏中的技能采用埃姆金迪尼的名字，以农场额外产出兵力来表现一个富有资源的家户可以支撑更多人口。这个设计取材于有关家户及牛群的历史传统，将物资和人力之间的关系转化为便于观察的规则。建成的农场提供持续收益，兵力达到上限时则需等到有空间才会收到新兵。在阅读人物史料时，住所与牲畜的叙事宜与后来关于战争和王权的叙事分开理解。史料没有记录由南迪亲自指挥的一支独立军队，也无法把口述传统中的财富换算为军队人数。她的生年与部分亲属关系仍有争议，而王太后身份、养育经历和围绕她家户的历史记忆构成了这项设计的依据。"] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.ja]
text = "ナンディ・カベベ（1764年頃–1827年）はエランゲニの出身で、息子シャカがズールーの支配者となった後に王母となった。"
title = "ナンディ王母"
lang = "ja"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["ナンディ・カベベ（1764年頃–1827年）はエランゲニの出身で、息子シャカがズールーの支配者となった後に王母となった。"]
sections = [{ title = "王母の家政", paragraphs = ["ナンディ自身について同時代の文書から知ることのできる事柄は少ない。彼女の生涯を伝える主な手掛かりは、後世に採録された口承と、シャカの出自や王位継承を扱う記述である。生年は推定であり、父方の系譜や若い頃の移住の順序には異なる語りが残る。そのため、細部を一つの確定した年表にまとめるには慎重さが必要である。口承によれば、彼女はシャカを父親の家の外で育てた時期があり、やがてムテトワの人々のもとで庇護を得た。親族や受け入れ先とのつながりは、子を守り家族が暮らしを立てるうえで重要だった。後にシャカがズールーの指導者となると、ナンディは王母の地位に就いた。エムキンディニには彼女のための王室の居所が設けられたと伝わる。その家政をめぐる伝承には、シャカから牛の群れを贈られたという話も含まれる。家畜は食料をもたらすだけでなく、富を蓄え、人々を扶養し、社会的な義務を果たすための資源でもあった。王母の居所と家畜の記憶は、戦争や王位継承を中心にした歴史の中では見えにくい、家を運営し人々を支える仕事に目を向けさせる。ナンディを取り上げた研究も、彼女の経験をシャカの経歴の付記だけで済ませず、子を保護し生活の基盤を確保した過程をたどっている。ゲームではエムキンディニを能力名に採り入れ、家の資源でより多くの人を支えられるという発想を農場の兵力産出に置き換えた。農場を完成させると継続的に効果が働き、兵力が上限に達していれば空きができてから新たな兵力を受け取る。これは暮らしを支える資源を分かりやすく表現するためのゲーム上の約束である。現存する史料から、ナンディが独立した軍を率いたことや、家畜の数を兵士の数に換算できることは確認できない。人物像を読むうえでは、家族の保護と王母の家政について伝わる話を、後世に語られた軍事的な逸話と区別して扱うことが大切である。"] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.ko]
text = "난디 카베베(1764년경–1827년)는 엘랑게니 공동체 출신으로, 아들 샤카가 줄루의 통치자가 된 뒤 왕태후가 되었다."
title = "난디 왕태후"
lang = "ko"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["난디 카베베(1764년경–1827년)는 엘랑게니 공동체 출신으로, 아들 샤카가 줄루의 통치자가 된 뒤 왕태후가 되었다."]
sections = [{ title = "왕태후의 가문", paragraphs = ["난디 자신의 삶을 전하는 동시대 문서는 드물다. 오늘날 알려진 내용의 상당 부분은 그가 세상을 떠난 뒤 채록된 구술 전승과 샤카에 관한 기록에서 나온다. 출생 연도는 추정치이며 부계 혈통과 젊은 시절에 옮겨 다닌 곳의 순서는 전승마다 조금씩 다르다. 따라서 여러 기록을 하나의 확정된 연표로 읽기는 어렵다. 전해지는 이야기에서 난디는 샤카를 아버지의 집 밖에서 기른 시기를 겪었고, 음테트와 사람들 사이에서 피난처를 찾았다. 친족과 그들을 받아들인 사람들의 관계는 아이를 지키고 가족이 생계를 이어 가는 데 중요했다. 샤카가 줄루의 권력을 잡은 뒤 난디는 왕태후가 되었다. 전승에 따르면 샤카는 어머니를 위해 엠킨디니에 왕실 거처를 마련했다. 이 집에 대한 기억에는 샤카가 난디에게 소 떼를 주었다는 이야기도 남아 있다. 가축은 식량을 공급하고 재산을 축적하는 수단이었다. 그 집에 속한 이들을 먹여 살리고 관계에서 생기는 의무를 이행하는 데도 쓰였다. 왕태후의 집과 가축에 관한 이야기는 전투나 왕위 계승만 살펴볼 때 놓치기 쉬운 가문의 운영을 보여 준다. 난디를 다룬 연구는 샤카의 업적에 딸린 인물로만 설명하지 않고, 자녀를 보호하고 거처와 생계를 마련한 그의 경험에 주목한다. 게임은 엠킨디니라는 이름을 사용하며, 집의 자원이 사람들을 부양할 수 있다는 점을 농장의 병력 생산으로 표현한다. 완공된 농장에서 혜택이 계속 적용되며, 병력 상한에 도달한 경우에는 자리가 생겨야 새 병력을 받을 수 있다. 병력이 늘어나는 수치는 플레이어가 확인할 수 있도록 정한 게임 규칙이다. 남아 있는 자료는 난디가 독립된 군대를 지휘했다는 사실이나 그가 동원한 병력의 규모를 알려 주지 않는다. 가축의 수를 병사의 수로 바꿔 읽을 수도 없다. 출생과 친족에 관한 세부 사항에는 불확실성이 있지만, 양육과 피난의 경험, 왕태후의 지위, 왕실 가문에 대한 기억은 서로 다른 기록을 비교하며 살필 수 있다."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.ar]
text = "تنتمي ناندي كابهيبي (نحو 1764–1827) إلى جماعة إيلانغيني، وأصبحت الملكة الأم بعدما تولى ابنها شاكا قيادة الزولو."
title = "الملكة ناندي"
lang = "ar"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["تنتمي ناندي كابهيبي (نحو 1764–1827) إلى جماعة إيلانغيني، وأصبحت الملكة الأم بعدما تولى ابنها شاكا قيادة الزولو."]
sections = [{ title = "بيت الملكة الأم", paragraphs = ["الشهادات المكتوبة عن حياة ناندي قليلة. تأتي معظم التفاصيل من روايات شفهية جُمعت بعد وفاتها ومن مصادر تناولت نشأة شاكا. وتختلف الروايات في تحديد نسبها وتسلسل تنقلاتها الأولى. تصف تلك الروايات مرحلة ربّت فيها شاكا خارج بيت والده، ثم وجدت ملجأ لدى جماعة المثيثوا. وبعد وصول شاكا إلى الحكم خصص لها مقراً ملكياً في إمخينديني. وتذكر التقاليد المتعلقة ببيتها أنه أهداها قطعاناً من الأبقار. كانت الماشية مصدراً للغذاء والثروة وأداة لإعالة من يعتمدون على البيت والوفاء بالالتزامات الاجتماعية. ويساعد النظر إلى موارد ذلك البيت على فهم مكانة ناندي في الأسرة الحاكمة ودورها في توفير الأمان والمعيشة. تحوّل اللعبة هذه القدرة على الإعالة إلى زيادة في إنتاج المزارع. ولا تقدم المصادر المتبقية دليلاً على أنها قادت جيشاً مستقلاً أو أرقاماً لقوات حشدتها بنفسها."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.ru]
text = "Нанди каБхебхе (около 1764–1827) происходила из общины элангени и стала королевой-матерью после прихода её сына Шаки к власти у зулусов."
title = "Королева Нанди"
lang = "ru"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Нанди каБхебхе (около 1764–1827) происходила из общины элангени и стала королевой-матерью после прихода её сына Шаки к власти у зулусов."]
sections = [{ title = "Дом королевы-матери", paragraphs = ["Письменных свидетельств о Нанди сохранилось мало. Её жизнь известна главным образом по устным преданиям, записанным после её смерти. Они расходятся в деталях её происхождения и ранних переселений. Согласно этим рассказам, Нанди растила Шаку вне дома его отца и нашла убежище у мтетва. Придя к власти, Шака устроил для матери резиденцию в Эмхиндини. Предания об этом доме вспоминают подаренные ей стада крупного рогатого скота. Скот был источником пищи и богатства, а также позволял содержать людей, зависевших от хозяйства. Бонус ферм переносит эту способность обеспечивать людей в игру. Источники не свидетельствуют о личной армии Нанди и не называют численности войск, которые она могла бы собрать."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.vi]
text = "Nandi kaBhebhe (khoảng 1764–1827) xuất thân từ cộng đồng eLangeni và trở thành thái hậu sau khi con trai Shaka lên nắm quyền trong cộng đồng Zulu."
title = "Nữ hoàng Nandi"
lang = "vi"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (khoảng 1764–1827) xuất thân từ cộng đồng eLangeni và trở thành thái hậu sau khi con trai Shaka lên nắm quyền trong cộng đồng Zulu."]
sections = [{ title = "Gia thất hoàng gia", paragraphs = ["Tư liệu thành văn về riêng Nandi khá ít. Cuộc đời bà chủ yếu được biết qua các truyền thống truyền miệng ghi lại sau khi bà mất. Các nguồn không thống nhất về gia phả và thứ tự những lần bà chuyển chỗ ở lúc còn trẻ. Họ kể rằng bà từng nuôi Shaka bên ngoài gia đình của cha cậu và tìm được nơi nương náu trong cộng đồng Mthethwa. Sau khi nắm quyền, Shaka lập một nơi ở hoàng gia cho mẹ tại Emkhindini. Những câu chuyện về gia thất ấy nhắc đến các đàn bò được ban tặng. Gia súc đem lại thức ăn, của cải và phương tiện nuôi những người sống dựa vào gia thất. Trò chơi chuyển khả năng cung ứng đó thành mức tăng sản lượng của nông trại. Tư liệu còn lại không ghi bà chỉ huy một đạo quân riêng hay nêu số lính bà huy động."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.id]
text = "Nandi kaBhebhe (sekitar 1764–1827) berasal dari komunitas eLangeni dan menjadi ibu suri setelah putranya Shaka berkuasa di kalangan Zulu."
title = "Ratu Nandi"
lang = "id"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (sekitar 1764–1827) berasal dari komunitas eLangeni dan menjadi ibu suri setelah putranya Shaka berkuasa di kalangan Zulu."]
sections = [{ title = "Rumah tangga kerajaan", paragraphs = ["Catatan tertulis tentang Nandi sendiri sedikit. Riwayat hidupnya banyak bersumber dari tradisi lisan yang dihimpun setelah ia meninggal. Sumber-sumber itu berbeda tentang silsilah dan urutan perpindahannya pada masa muda. Menurut cerita tersebut, ia pernah membesarkan Shaka di luar rumah ayahnya dan mendapat perlindungan di antara orang Mthethwa. Setelah berkuasa, Shaka mendirikan kediaman kerajaan untuk ibunya di Emkhindini. Tradisi tentang rumah tangga ini menyebut hadiah kawanan sapi. Ternak menyediakan pangan dan kekayaan serta membantu menopang orang yang bergantung pada rumah tangga itu. Bonus ladang menerjemahkan daya dukung tersebut ke dalam permainan. Sumber yang tersisa tidak mencatat pasukan pribadi Nandi atau jumlah prajurit yang dihimpunnya."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.fil]
text = "Si Nandi kaBhebhe (mga 1764–1827) ay nagmula sa pamayanang eLangeni. Naging inang reyna siya nang mamuno ang anak niyang si Shaka sa mga Zulu."
title = "Reyna Nandi"
lang = "fil"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Si Nandi kaBhebhe (mga 1764–1827) ay nagmula sa pamayanang eLangeni. Naging inang reyna siya nang mamuno ang anak niyang si Shaka sa mga Zulu."]
sections = [{ title = "Isang sambahayang maharlika", paragraphs = ["Kakaunti ang nakasulat na tala tungkol kay Nandi mismo. Karamihan sa nalalaman tungkol sa kaniyang buhay ay mula sa mga salaysay na pasalitang itinala pagkamatay niya. Nagkakaiba ang mga ito sa detalye ng kaniyang angkan at sa pagkakasunod-sunod ng mga una niyang paglipat. Isinasalaysay na pinalaki niya si Shaka sa labas ng sambahayan ng ama nito at nakahanap ng kanlungan sa mga Mthethwa. Nang mamuno si Shaka, nagtayo siya ng maharlikang tirahan para sa ina sa Emkhindini. Naaalala sa mga kuwento tungkol sa tahanang iyon ang mga kaloob na baka. Ang mga hayop ay pinagmumulan ng pagkain at kayamanan at nakatutulong sa pagtustos sa mga taong umaasa sa sambahayan. Isinasalin sa laro ang kakayahang iyon sa pagdaragdag ng produksiyon sa bukid. Walang nakaligtas na tala ng sariling hukbo ni Nandi o ng bilang ng mga kawal na kaniyang tinipon."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]

[articles.pt-BR]
text = "Nandi kaBhebhe (c. 1764–1827) veio da comunidade eLangeni e se tornou rainha mãe após a ascensão de seu filho Shaka entre os zulus."
title = "Rainha Nandi"
lang = "pt-BR"
url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6"
shortArticle = true
intro = ["Nandi kaBhebhe (c. 1764–1827) veio da comunidade eLangeni e se tornou rainha mãe após a ascensão de seu filho Shaka entre os zulus."]
sections = [{ title = "Uma casa real", paragraphs = ["Há poucos testemunhos escritos sobre a vida de Nandi. Muito do que se sabe vem de tradições orais recolhidas após sua morte, que divergem sobre sua ascendência e a sequência de seus primeiros deslocamentos. Segundo esses relatos, ela criou Shaka fora da casa paterna e encontrou abrigo entre os mthethwa. Depois de assumir o poder, Shaka estabeleceu uma residência real para a mãe em Emkhindini. As histórias sobre essa casa lembram presentes de gado, fonte de alimento e riqueza que ajudava a sustentar as pessoas ligadas à família. O bônus das fazendas representa no jogo essa capacidade de sustento. As fontes preservadas não atribuem a Nandi um exército independente nem registram números de tropas mobilizadas por ela."] }]
sources = [{ title = "Maxwell Z. Shamase, The royal women of the Zulu monarchy through the keyhole of oral history", url = "https://uzspace.unizulu.ac.za/items/07b4f6b1-cf90-4114-8747-b6eb141715f6" }, { title = "Queen Nandi ka Bhebhe: the forgotten mother of the Zulu nation", url = "https://www.tandfonline.com/doi/full/10.1080/14725843.2024.2442632" }, { title = "Oxford Dictionary of National Biography, Shaka", url = "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/582570474" }]
