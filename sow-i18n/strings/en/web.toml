privacy_title = "Privacy Policy — Shadows of War"
privacy_description = "Read the player-facing privacy policy for Shadows of War: controller, data collected, sharing, 90-day retention, your rights, and deletion."
privacy_eyebrow = "Legal & Telemetry"
privacy_heading = "Privacy"
privacy_heading_em = "policy."
privacy_updated = "Last updated: September 2026 · Controller: World of Unreal · Contact: hello@shadowsofwar.io"
privacy_updated_v2 = "Last updated: November 13, 2026 · Controller: World of Unreal · Contact: hello@shadowsofwar.io"
privacy_overview_title = "Overview & controller"
privacy_overview_body = "Shadows of War is operated by World of Unreal. This policy covers shadowsofwar.io, partner platforms, and native clients. Privacy contact:"
privacy_overview_after = "We have no EU/UK establishment — send all requests, including GDPR requests, directly there."
privacy_overview_payments = "Partner-platform SDKs may collect data under their own policies. Card data is processed directly by the store you pay through (Google Play, Apple); we never see card numbers."
privacy_eligibility_title = "Eligibility & children"
privacy_eligibility_body = "13+. Players 13–17 need a parent or guardian's permission. The game is not directed to children under 13; under-13 accounts are suspended and erased. Parents: write to"
privacy_eligibility_after = "and we delete promptly."
privacy_data_title = "Data we collect"
privacy_gameplay_label = "Gameplay:"
privacy_gameplay_body = "display name, clan tag, leader/civilization choices, match inputs, history, ranks, owned items."
privacy_account_label = "Account:"
privacy_account_body = "game account ID, linked sign-in providers and their identifiers, verified email when supplied, and server-side hashes of ownership and session credentials."
privacy_technical_label = "Technical:"
privacy_technical_body = "build version, platform/locale, connection metadata, relay tickets, server logs for security and anti-abuse."
privacy_analytics_label = "Product analytics (first-party only):"
privacy_analytics_body_v3 = "Optional first-party analytics on our website and browser game runs only after you allow it. It records a closed set of visit, loading, menu, tutorial, lobby and match events, plus build, language, broad viewport class and an optional short source tag from ?ref=. After consent, a random browser ID is stored in local storage for up to 90 days to measure D1/D3/D7 returns. We send it separately from events and derive a server-side pseudonym; it is not included in event records. Clearing storage or using another browser/device starts a separate count. Events contain no account/player or match/lobby IDs. Request IPs may appear in separate technical security logs. No names, messages, passwords, ad IDs, map clicks or full device fingerprint."
privacy_purchases_label = "Purchases:"
privacy_purchases_body = "product ID, transaction reference, entitlement status via RevenueCat/the store. Full payment details stay with the store."
privacy_public_label = "Public by design:"
privacy_public_body = "names, handles, rankings, and match records are visible to other players."
privacy_use_title = "Use & legal bases"
privacy_use_body = "We process data needed to run the game, protect players and systems, provide support, and meet legal duties. For EU/UK users, our bases include the contract for the game, legitimate interests for security and anti-cheat, legal obligations where required, and your consent for optional first-party product analytics. Analytics stays off until you allow it; you can change your choice in Settings. We do not sell personal data or use behavioral advertising."
privacy_sharing_title = "Sharing"
privacy_hosting_label = "Hosting under our instructions:"
privacy_hosting_body = "IONOS, Microsoft Azure, Cloudflare."
privacy_payments_label = "Payments:"
privacy_payments_body = "Google Play / Apple via RevenueCat, under their policies."
privacy_sdk_label = "Partner SDKs:"
privacy_sdk_body = "under their own policy when you play through them."
privacy_players_label = "Players & public:"
privacy_players_body = "names, handles, ranks, match records."
privacy_authorities_label = "Authorities & transfers:"
privacy_authorities_body = "where required by law, or to a lawful successor with notice."
privacy_cookies_title = "Cookies & local storage"
privacy_cookies_body = "Strictly necessary storage only: session IDs. First-party product events go to our own endpoint. No advertising, social, or cross-site cookies. Fonts are self-hosted — zero cross-origin requests. Details and controls in our"
privacy_cookies_body_v2 = "We store your analytics choice in local storage. Only after acceptance, a random browser ID remains in local storage for up to 90 days to measure return visits, while a temporary session ID and small retry queue use session storage. Rejecting analytics does not affect the game. Game settings, account continuity and cached assets use separate storage needed for those features. Details and controls in our"
privacy_retention_title = "Retention"
privacy_retention_body = "Event files, analytics counters and memberships expire within 90 days. Verified account deletion removes linked event rows and account memberships; non-identifying daily totals remain only until their 90-day expiry. Accounts and match history persist until you request deletion or termination under the Terms."
privacy_retention_body_v2 = "Event files, analytics counters and memberships expire within 90 days. Verified account deletion removes linked event rows and account memberships; non-identifying daily totals remain only until their 90-day expiry. Accounts and match history persist until you request deletion or termination under the Terms."
privacy_rights_title = "Your rights & deletion"
privacy_rights_body = "Access, correct, delete, port, object, restrict. Email"
privacy_rights_after = "with your in-game account ID (or name + approximate creation date). Verified deletions erase the account, identity mappings, metadata mirror, and analytics memberships — confirmed back to you. GPC is honored as a sale/sharing opt-out (we don't sell or share, so nothing toggles). Appeals by reply; response within 45 days at most."
privacy_security_title = "Security, transfers, changes"
privacy_security_body = "TLS in transit, loopback-only internals, bearer-gated operator endpoints, hashed ownership secrets; no absolute guarantee. Infrastructure runs in the US and EU with data minimization and no ad-tech transfers. We will prominently announce material changes to this Privacy Notice before they take effect; where required, we will ask for consent separately. Continued use alone does not grant consent."
privacy_contact_title = "Contact"
privacy_contact_before = "Privacy:"
privacy_help = "Help:"
support_center = "support center"
privacy_security_contact = "Security flaws: privately to hello@, never in public — acknowledged within 48 hours."
privacy_source_before = "The full source code for each game version is licensed under AGPL-3.0-only, with OpenFront's additional terms. Its version-specific source link is in the game menu."
cookies_title = "Cookie Notice — Shadows of War"
analytics_title = "Optional analytics"
analytics_body = "Optional analytics stays off unless you allow it. If you do, a random ID is stored in this browser for up to 90 days to measure return visits; it is not an account ID. Rejecting does not affect the game."
cookies_analytics_events = "Events count visits, loading, menu and tutorial progress, matchmaking, and match starts, results and explicit exits. Match details use fixed categories and a broad viewport class. Event records do not include names, account/player IDs, IP fields, match/lobby IDs, chat, passwords, purchase details, raw failure text, map clicks or a full user-agent."
cookies_analytics_server = "After consent, events go only to our first-party /api/event endpoint, not the game relay. Each event has a temporary random session ID limited to this browser session. A separate random browser ID stays in local storage for up to 90 days and is sent only to measure returns; the server derives a pseudonym from it, and it is not included in event records. Event records contain no account/player or match/lobby IDs or IP addresses; request IPs may appear in separate technical security logs."
analytics_policy = "Cookie details"
analytics_accept = "Allow"
analytics_reject = "Reject"
analytics_manage = "Cookie settings"
cookies_description_v2 = "Optional product analytics stays off until you accept. See what Shadows of War stores and how to change your choice."
cookies_og_description_v2 = "Optional analytics is off until you accept. Change your choice at any time."
cookies_updated_v2 = "Last updated: November 13, 2026 · World of Unreal"
cookies_analytics_title = "Optional analytics on our website and browser game"
cookies_storage_title = "Browser storage and retention"
cookies_storage_body = "We remember your accept/reject choice locally. Only after acceptance, a random browser ID stays in local storage for up to 90 days; a temporary session ID and small retry queue use session storage. Analytics also includes the build, language and a broad screen class, not a full user-agent string. Event files, memberships and browser return cohorts expire within 90 days. Verified account deletion removes older linked event rows and account memberships; browser cohorts are not linked to accounts. Game settings, account continuity, crash recovery and cached assets use separate storage needed for those features."
cookies_platforms_title = "Other game platforms"
cookies_platforms_body = "Poki, CrazyGames and Jest may measure use through their own SDKs under their platform terms. We do not copy those player-level events to our server. Android first-party analytics is disabled until its store disclosure is updated."
cookies_controls_v2 = "You can allow or reject optional analytics with equal ease. Starting the game does not count as allowing it. Change your choice in the game’s Settings or here; rejecting does not affect gameplay. Clearing site data also removes the choice, and analytics stays off until you explicitly allow it again. We do not sell or share analytics for advertising."
cookies_description = "How Shadows of War uses necessary storage: session IDs and first-party product events. No advertising cookies."
cookies_og_description = "Strictly-necessary storage only. No advertising, social, or cross-site-tracking cookies."
cookies_eyebrow = "Legal & Storage"
cookies_heading = "Cookie"
cookies_heading_em = "notice."
cookies_updated = "Last updated: September 2026 · World of Unreal"
cookies_use_title = "What we use"
cookies_use_body = "Shadows of War uses strictly-necessary client storage only — the kind that needs no consent banner because the site and game cannot function without it:"
cookies_session_label = "Analytics session identifiers"
cookies_session_body = "random IDs that group first-party product events within one visit. They vanish when the tab closes."
cookies_events_label = "First-party product events:"
cookies_events_body = "anonymous funnel events sent to our own servers"
cookies_events_after = "Not a cookie, not shared with any vendor."
cookies_game_label = "Game settings & cached map assets"
cookies_game_body = "client preferences and downloaded game data."
cookies_third_party_title = "Third parties"
cookies_third_party_body = "Fonts are self-hosted on our own domain. No third-party code runs storage or tracking on our pages: no advertising networks, no social widgets, no session-replay scripts, no cross-site identifiers. Our pages make zero cross-origin requests."
cookies_dont_title = "What we don't do"
cookies_dont_ads = "No advertising cookies and no interest-based advertising."
cookies_dont_sell = "No sale or sharing of personal data for advertising."
cookies_dont_tracking = "No cross-site or cross-app tracking."
cookies_dont_body = "Because there is no behavioral tracking, Global Privacy Control and Do Not Track signals have nothing to switch off — and we honor GPC as a sale/sharing opt-out regardless."
cookies_controls_title = "Your controls"
cookies_controls_clear = "Clear site data in your browser settings to remove session IDs and cached assets. The game keeps working and starts a fresh session."
cookies_controls_block = "Blocking all storage may force re-downloads of game assets and reset preferences each visit."
cookies_controls_rights = "For personal-data rights (access, deletion, portability), see the Privacy Policy — email"
cookies_changes_title = "Changes"
cookies_changes_body = "If we ever add non-essential storage (analytics vendors, embeds, advertising), this notice will list each item with its purpose and controls before it ships — and the Privacy Policy will be updated alongside. Last updated: September 2026."
