campaign_tactics_03_intro_military_camp_title = "Camp vs. City"
campaign_tactics_03_intro_military_camp_body = "A Military Camp focuses on troop production and faster land conquest. A City gives you much more room to hold troops and sets the starting tier of new buildings. Each line has a different role—choose what your next move needs."
