campaign_tactics_03_intro_city_title = "Hit the Population Ceiling?"
campaign_tactics_03_intro_city_body = "A Military Camp grows your army faster; a City raises the troop capacity that lets you keep a larger reserve. Use both to turn production into a force you can hold and deploy."
