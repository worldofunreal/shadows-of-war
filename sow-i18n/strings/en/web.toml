campaign_boudica_attack_roman_outpost_body = "A Roman outpost bars the road into our lands. Its garrison watches every Iceni banner.\n\nSend our warriors until its banner falls."
campaign_boudica_camulodunum_body = "Camulodunum has a temple to the emperor they made a god. Our people paid for every stone.\n\nStorm the walls and defeat Camulodunum."
campaign_boudica_first_contact_body = "Stonea’s warriors have heard the rising. Their chief watches from the hill.\n\nReach Stonea and hear the clan’s answer."
campaign_boudica_first_victory_body = "The first Roman banner has fallen, and the Iceni rise with it.\n\nSend our warriors until its banner falls."
campaign_boudica_londinium_body = "Londinium paid Rome for protection, and Suetonius left its people to face us.\n\nDefeat Londinium and break Rome’s promise."
campaign_boudica_ninth_legion_body = "Cerialis sends the Ninth against us. Rome’s finest legion stands at the gates of Camulodunum.\n\nDefeat Legio IX Hispana."
campaign_boudica_outpost_colonia_veterans_body = "The veterans of Colonia hold their walls with old oaths and older grudges.\n\nDefeat the Colonia Veterans."
campaign_boudica_outpost_roman_supply_depot_body = "The depot keeps Rome’s legions fed. Its grain must burn.\n\nDestroy the Roman Supply Depot."
campaign_boudica_outpost_tax_collectors_body = "The tax collectors guard the chest Rome filled with Iceni gold.\n\nDefeat the Tax Collectors."
campaign_boudica_second_contact_body = "The elders of Snettisham await our envoy across the marsh.\n\nReach Snettisham and hear its terms."
campaign_boudica_third_contact_body = "Thetford’s chief will judge the Iceni by how they arrive.\n\nReach Thetford and hear the clan’s terms."
campaign_boudica_trinovantes_assault_body = "The Trinovantes stand beside us at last. Camulodunum’s walls are their next target.\n\nLead the Iceni and Trinovantes against Camulodunum."
campaign_boudica_trinovantes_contact_body = "The Trinovantes have sent word that an envoy waits at their border.\n\nReach Trinovantes territory to hear their envoy."
campaign_boudica_verulamium_body = "Verulamium has fallen silent behind its gates. Its garrison waits, and the clans watch us.\n\nDefeat Verulamium and break its gates."
