cookies_controls_clear = "Clear site data anytime in your browser settings — this removes the theme preference, session IDs, and cached assets. The game keeps working; it forgets your theme and starts a fresh session."
cookies_controls_block = "Blocking all storage may force re-downloads of game assets and reset preferences each visit."
