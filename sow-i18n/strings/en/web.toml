campaign_boudica_boudica_city_intro_title = "Build Shelter for the Weeping"
campaign_boudica_boudica_city_intro_body = "Their carts carry all they have left.\nLet the oak shelter them again.\n\nChoose City, then raise it on Iceni land."
campaign_boudica_boudica_camera_hover_desktop_hint = "Hold your pointer over Suetonius until his name appears."
campaign_boudica_boudica_camera_hover_mobile_hint = "Hold one finger over Suetonius until his name appears."
campaign_boudica_boudica_camera_hover_title = "Read the Roman Commander"
campaign_boudica_boudica_camera_intro_body = "Suetonius waits beyond our sight.\nFind the wolf before he finds our hearth.\n\nZoom out, then follow the map guides."
campaign_boudica_boudica_camera_intro_title = "Find Rome’s Governor"
campaign_boudica_boudica_camulodunum_body = "Camulodunum has a temple to the emperor they made a god. Our people paid for every stone. If he means to keep it, he can come down and defend it.\n\nDefeat Camulodunum."
campaign_boudica_boudica_camulodunum_hint = "Storm the walls and defeat Camulodunum."
campaign_boudica_boudica_camulodunum_title = "What Rome Was Owed"
campaign_boudica_boudica_choose_city_hint = "Choose City from the building bar."
campaign_boudica_boudica_choose_city_title = "Choose City"
campaign_boudica_boudica_city_ready_body = "The city gives our people room to raise warriors. Now meet Stonea; no rising survives by strength alone."
campaign_boudica_boudica_city_ready_title = "A City for the Iceni"
campaign_boudica_boudica_city_upgrade_ready_body = "Our city can now sustain a larger host. Cerialis is marching to relieve Camulodunum; meet the Ninth at full strength."
campaign_boudica_boudica_city_upgrade_ready_title = "Ready for the Ninth"
campaign_boudica_boudica_contact_hint = "Reach Stonea and hear the clan’s answer."
campaign_boudica_boudica_contact_title = "The Iceni Stand Together"
campaign_boudica_boudica_council_body = "Rome stole our land and shamed our blood.\nOnce more unto the breach, Iceni! The raven remembers every wrong.\n\nSelect the Roman Outpost and send your first attack."
campaign_boudica_boudica_council_speaker = "Iceni Counselor"
campaign_boudica_boudica_council_strike = "Iceni, rise as one!"
campaign_boudica_boudica_council_title = "The Debt of Justice"
campaign_boudica_boudica_victory_celebrate = "Our banner flies again."
campaign_boudica_boudica_home_rebuilt_emote = "Hearth lit, home unbroken."
campaign_boudica_stonea_stand_with_you_emote = "Our spears answer yours."
campaign_boudica_boudica_stonea_reply_emote = "One blood, one oath."
campaign_boudica_snettisham_refuse_emote = "We will not kneel."
campaign_boudica_boudica_refuse_reply_emote = "Then stand we firm."
campaign_boudica_snettisham_accept_emote = "Gold rebuilds our hall."
campaign_boudica_boudica_accept_reply_emote = "Fate binds us, rise!"
campaign_boudica_colonia_veterans_provoke_emote = "Rome’s eagle guards it."
campaign_boudica_boudica_colonia_veterans_reply_emote = "Thy claim is hollow."
campaign_boudica_colonia_veterans_last_words_emote = "We kept our oath."
campaign_boudica_tax_collectors_provoke_emote = "Rome claims its due."
campaign_boudica_boudica_tax_collectors_reply_emote = "Nemesis reckons Rome’s debt."
campaign_boudica_tax_collectors_last_words_emote = "Fate closes the ledger."
campaign_boudica_roman_supply_depot_provoke_emote = "This grain is Rome’s."
campaign_boudica_boudica_roman_supply_depot_reply_emote = "Our children must eat."
campaign_boudica_roman_supply_depot_last_words_emote = "Take the ash, Caesar."
campaign_boudica_boudica_victory_council_body = "The outpost is ours; one banner lies in the mud.\nJustice needs roots, as the oak needs earth. Give our people room.\n\nClaim 250 neutral tiles for our people."
campaign_boudica_boudica_victory_council_title = "A Banner Falls"
campaign_boudica_boudica_decision_attack = "Strike now"
campaign_boudica_boudica_decision_body = "The garrison grows, and time is a blade. Do we strike now, or let Rome choose the hour?"
campaign_boudica_boudica_decision_title = "The Queen’s Command"
campaign_boudica_boudica_decision_wait = "Wait"
campaign_boudica_boudica_end_body = "The last Iceni banner has fallen, as all proud things must.\nRome keeps the land; history keeps the queen’s name.\n\nContinue to close the tale."
campaign_boudica_boudica_end_title = "A Name That Endures"
campaign_boudica_boudica_final_body = "Rome gathers like a storm. Our families wait behind us.\nHold while one Iceni standard still flies, and let the sky fall.\n\nDefend Iceni land against the Roman advance."
campaign_boudica_boudica_final_title = "The Last Standard"
campaign_boudica_boudica_postumus_notice_body = "Poenius Postumus, camp prefect of Legio II Augusta, refused Suetonius’ order to march. Word now reaches us that he has taken his own life. His legion abandons its silence and joins Rome against us."
campaign_boudica_boudica_postumus_notice_title = "Legio II Turns Against Us"
campaign_boudica_boudica_final_choice_title = "Where I Shall Stand"
campaign_boudica_boudica_final_choice_body = "Rome closes in; our families wait behind us.\nFate has written our last act, and I will read it aloud.\n\nChoose poison to end the tale, or keep defending."
campaign_boudica_boudica_final_choice_poison = "They will never take me alive."
campaign_boudica_boudica_final_choice_fight = "My place is with them."
campaign_boudica_boudica_poison_end_title = "Beyond Rome’s Reach"
campaign_boudica_boudica_poison_end_body = "Thus ends the queen. Her name outlives the legions.\nWhat Rome took, the bards shall sing again.\n\nContinue to close the tale."
campaign_boudica_boudica_last_stand_intro_title = "No Surrender"
campaign_boudica_boudica_last_stand_intro_body = "Rome’s legions tread our sacred soil. Hold fast, my kin; when we hold 5,000 tiles or fewer, I will choose how this tale ends."
campaign_boudica_boudica_last_stand_title = "Hold the Iceni Lands"
campaign_boudica_boudica_last_stand_body = "Defend Iceni territory against the Roman advance."
