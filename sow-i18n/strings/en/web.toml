terms_updated = "Last updated: September 2026 · World of Unreal"
terms_acceptance_title = "Acceptance and eligibility"
terms_acceptance_body = "These Terms are a binding agreement between you and World of Unreal governing your use of Shadows of War on shadowsofwar.io, partner platforms, and native clients. By playing, installing, or accessing the Service you agree to these Terms. If you do not agree, do not use the Service."
terms_acceptance_age = "You must be at least 13 years old. Players aged 13 to 17 may play only with a parent or guardian's permission and supervision. The Service is not directed to children under 13."
terms_changes_title = "The game & service changes"
terms_changes_body = "Multiplayer requires network access to our servers. We may modify, suspend, or discontinue any part of the Service — modes, maps, seasons, leaderboards, events — at any time, with or without notice, without liability to you."
terms_accounts_title = "Accounts"
terms_accounts_body = "Anonymous play creates a canonical account ID stored on your device with a display name. Clearing site storage creates a new account; renames never change the account ID. Your account ID is a progress lookup key, not a password — keep your device secure."
terms_accounts_contact = "You are responsible for all activity under your account. Report suspected unauthorized access to"
terms_license_title = "License & restrictions"
terms_license_body = "These Terms govern access to the official hosted Service, accounts, virtual items, and server data. The full game source is separately licensed under AGPL-3.0-only, including OpenFront's additional terms. These Terms do not limit rights granted by that code license or separate map licenses."
terms_maps_before = "OpenFront-derived map sources and generated map files are licensed under"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "The map notice records their attribution, source, and changes:"
terms_maps_notice = "map notice"
terms_license_no_sell = "Do not sell, rent, sublicense, or commercially exploit the official hosted Service, accounts, or virtual items."
terms_license_no_reverse = "Do not reverse-engineer, scrape, bulk-extract, or train models on the official hosted Service. These restrictions do not reduce rights granted by the code or map licenses."
terms_license_feedback = "Feedback you share may be used freely, without compensation or attribution."
terms_virtual_title = "Virtual items & no refunds"
terms_virtual_body = "Gems, leader unlocks, and skins are licensed virtual items only: no cash value, non-transferable, revocable. Leader unlocks change gameplay — they have distinct perks and are not purely cosmetic."
terms_sales_final = "ALL SALES ARE FINAL."
terms_virtual_refunds = "Virtual items are non-refundable and non-replaceable to the fullest extent permitted by law — including for used or unwanted items, Service changes, or account action taken for Terms violations. If a platform reverses a purchase, we may remove the corresponding items and take account measures."
terms_conduct_title = "Player conduct"
terms_conduct_cheating = "No cheating, bots, macros, automation, bug exploits, or intentional desyncs."
terms_conduct_harassment = "No harassment, threats, hate-bait, or doxxing. Names, tags, and chat must follow the law."
terms_conduct_servers = "No disrupting servers, probing infrastructure, or touching other players' accounts, credentials, or tickets."
terms_conduct_after = "Violations may lead to content removal, match forfeiture, or suspension or termination."
terms_third_party_title = "Third-party services & other players"
terms_third_party_body = "Partner platforms and their SDKs, payment providers, Discord, and Telegram are third parties we do not control; their own terms apply and you use them at your own risk. Interactions with other players are solely between you and them. To the fullest extent permitted by law you release World of Unreal from claims arising from third parties or other players."
terms_termination_title = "Termination"
terms_termination_body = "We may suspend or terminate your access — accounts, items, leaderboard entries — at any time for any reason, including suspected Terms violations, without liability. On termination your license ends and virtual items are forfeited without refund."
terms_disclaimer_title = "Disclaimers"
terms_disclaimer_body = "THE SERVICE IS PROVIDED “AS IS” AND “AS AVAILABLE.” TO THE FULLEST EXTENT PERMITTED BY LAW WE DISCLAIM ALL WARRANTIES, INCLUDING MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, TITLE, AND NON-INFRINGEMENT. We do not warrant uninterrupted, error-free, or secure operation, or preservation of progress, ranks, or items."
terms_liability_title = "Limitation of liability"
terms_liability_body = "TO THE MAXIMUM EXTENT PERMITTED BY LAW WE ARE NOT LIABLE FOR LOST PROFITS, LOST DATA, LOST ITEMS OR PROGRESS, OR ANY INDIRECT OR CONSEQUENTIAL DAMAGES. OUR TOTAL LIABILITY IS CAPPED AT THE GREATER OF $50 USD AND WHAT YOU PAID US FOR VIRTUAL ITEMS IN THE SIX MONTHS BEFORE THE INCIDENT."
terms_indemnification_title = "Indemnification"
terms_indemnification_body = "You agree to defend and indemnify World of Unreal against claims and reasonable costs arising from your use of the Service, your violation of these Terms, or your violation of law."
terms_arbitration_title = "Disputes & arbitration"
terms_arbitration_before = "Disputes go through binding individual arbitration (JAMS, Delaware) after a 45-day informal-resolution attempt — not court. You waive jury-trial and class-action rights. Small-claims and IP injunctions are excepted. You may opt out of arbitration within 30 days of first accepting these Terms by emailing"
terms_arbitration_after = "with your account ID and a clear opt-out statement."
terms_general_title = "General"
terms_general_before = "Delaware law governs these Terms; non-arbitrated claims go exclusively to Delaware courts. We will announce material changes prominently before they take effect. If applicable law requires renewed agreement, we will ask for it separately. Contact: World of Unreal —"
terms_privacy_title = "Privacy"
terms_privacy_before = "Data handling, your rights, and deletion are described in our"
