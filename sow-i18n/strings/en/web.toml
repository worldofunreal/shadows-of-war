cookies_third_party_body = "Fonts are self-hosted on our own domain. No third-party code runs storage or tracking on our pages: no advertising networks, no social widgets, no session-replay scripts, no cross-site identifiers. Our pages make zero cross-origin requests."
cookies_dont_title = "What we don't do"
cookies_dont_ads = "No advertising cookies and no interest-based advertising."
cookies_dont_sell = "No sale or sharing of personal data for advertising."
cookies_dont_tracking = "No cross-site or cross-app tracking."
cookies_dont_body = "Because there is no behavioral tracking, Global Privacy Control and Do Not Track signals have nothing to switch off — and we honor GPC as a sale/sharing opt-out regardless."
