campaign_boudica_boudica_camulodunum_reply_emote = "Your gods will not save you."
campaign_boudica_boudica_legio_ix_reply_emote = "Then I will break the Ninth."
campaign_boudica_boudica_londinium_reply_emote = "Then why are you alone?"
campaign_boudica_boudica_roman_outpost_reply_emote = "Get out of my way."
campaign_boudica_thetford_respect_emote = "We stand beside you."
campaign_boudica_boudica_trinovantes_march_reply_emote = "Then we end it together."
campaign_boudica_boudica_verulamium_reply_emote = "Then I will tear these walls down."
campaign_boudica_camulodunum_warning_emote = "You will not take our home."
campaign_boudica_legio_ix_taunt_emote = "The Ninth does not retreat."
campaign_boudica_londinium_taunt_emote = "Rome promised us protection."
campaign_boudica_roman_outpost_provoke_emote = "You won't get past us."
campaign_boudica_colonia_veterans_tease_1 = "Come on. I’m not getting younger."
campaign_boudica_colonia_veterans_tease_2 = "Is this the Iceni charge?"
campaign_boudica_colonia_veterans_tease_3 = "Your fathers lost to Rome. Keep the family record."
campaign_boudica_tax_collectors_tease_1 = "Your taxes are late."
campaign_boudica_tax_collectors_tease_2 = "No coin? We accept surrender."
campaign_boudica_tax_collectors_tease_3 = "Your fathers lost to Rome. Call it interest."
campaign_boudica_roman_supply_depot_tease_1 = "Come on. We brought extra."
campaign_boudica_roman_supply_depot_tease_2 = "Even the carts are bored."
campaign_boudica_roman_supply_depot_tease_3 = "Your ancestors lost. We packed for the rematch."
campaign_boudica_camulodunum_tease_1 = "The gates are shut. Come knock."
campaign_boudica_camulodunum_tease_2 = "Still outside? Rome’s getting impatient."
campaign_boudica_camulodunum_tease_3 = "Your people rose before. Rome kept the city."
campaign_boudica_legio_ix_hispana_tease_1 = "The Ninth stands ready. You?"
campaign_boudica_legio_ix_hispana_tease_2 = "One legion. Still too much?"
campaign_boudica_legio_ix_hispana_tease_3 = "Your ancestors met Rome. Ask how that went."
campaign_boudica_londinium_tease_1 = "We’re open. Try the front gate."
campaign_boudica_londinium_tease_2 = "Come on. The shops close at dusk."
campaign_boudica_londinium_tease_3 = "Rome rebuilt after your last revolt. Want an encore?"
campaign_boudica_verulamium_tease_1 = "These walls are ready. Are you?"
campaign_boudica_verulamium_tease_2 = "Staring won’t break stone."
campaign_boudica_verulamium_tease_3 = "You lost to Rome before. We kept notes."
campaign_boudica_dobunni_alliance_hint_emote = "Hey, over here. Rome’s our enemy too."
campaign_boudica_corieltauvi_alliance_hint_emote = "You want Rome gone? So do we."
campaign_boudica_catuvellauni_alliance_hint_emote = "Send the offer. We’ll fight Rome with you."
campaign_boudica_roman_outpost_tease_1 = "Come on. Attack me!"
campaign_boudica_roman_outpost_tease_2 = "Come get a piece of me!"
campaign_boudica_roman_outpost_tease_3 = "Kill me already. I want to go home."
campaign_boudica_thetford_demand_emote = "We do not kneel."
campaign_boudica_trinovantes_march_emote = "This fight is ours too."
campaign_boudica_verulamium_taunt_emote = "We will die before we yield."
campaign_boudica_attack_roman_outpost_body = "A Roman outpost bars the road into our lands. Its garrison watches every Iceni banner.\nSend our warriors until its banner falls."
campaign_boudica_camulodunum_body = "Camulodunum has a temple to the emperor they made a god. Our people paid for every stone.\nStorm the walls and defeat Camulodunum."
campaign_boudica_first_contact_body = "Stonea’s warriors have heard the rising. Their chief watches from the hill.\nReach Stonea and hear the clan’s answer."
campaign_boudica_first_victory_body = "The first Roman banner has fallen, and the Iceni rise with it.\nSend our warriors until its banner falls."
campaign_boudica_londinium_body = "Londinium paid Rome for protection, and Suetonius left its people to face us.\nDefeat Londinium and break Rome’s promise."
campaign_boudica_ninth_legion_body = "Cerialis sends the Ninth against us. Rome’s finest legion stands at the gates of Camulodunum.\nDefeat Legio IX Hispana."
campaign_boudica_outpost_colonia_veterans_body = "The veterans of Colonia hold their walls with old oaths and older grudges.\nDefeat the Colonia Veterans."
campaign_boudica_outpost_roman_supply_depot_body = "The depot keeps Rome’s legions fed. Its grain must burn.\nDestroy the Roman Supply Depot."
campaign_boudica_outpost_tax_collectors_body = "The tax collectors guard the chest Rome filled with Iceni gold.\nDefeat the Tax Collectors."
campaign_boudica_second_contact_body = "The elders of Snettisham await our envoy across the marsh.\nReach Snettisham and hear its terms."
campaign_boudica_third_contact_body = "Thetford’s chief will judge the Iceni by how they arrive.\nReach Thetford and hear the clan’s terms."
campaign_boudica_trinovantes_assault_body = "The Trinovantes stand beside us at last. Camulodunum’s walls are their next target.\nLead the Iceni and Trinovantes against Camulodunum."
campaign_boudica_trinovantes_contact_body = "The Trinovantes have sent word that an envoy waits at their border.\nReach Trinovantes territory to hear their envoy."
campaign_boudica_verulamium_body = "Verulamium has fallen silent behind its gates. Its garrison waits, and the clans watch us.\nDefeat Verulamium and break its gates."
campaign_boudica_suetonius_final_emote = "I will break you, Boudica."
campaign_boudica_suetonius_sighted_emote = "I will crush those rebels."
campaign_boudica_suetonius_drag_emote = "You cannot outrun me."
campaign_boudica_suetonius_hover_emote = "Look at me, Boudica."
campaign_boudica_trinovantes_supplies_wait_emote = "Hold on. We are coming."
campaign_boudica_trinovantes_wait_emote = "We want to believe you."
campaign_boudica_legio_ix_intro_emote = "We do not fear the Iceni."
campaign_boudica_legio_ix_strike_emote = "You are not an army."
campaign_boudica_londinium_intro_emote = "Rome will come for us."
campaign_boudica_verulamium_intro_emote = "We are not afraid of you."

