campaign_boudica_boudica_aid_choice_share = "We won’t leave them waiting."
campaign_boudica_boudica_aid_choice_title = "The Measure of a Gift"
campaign_boudica_boudica_aid_kept_body = "We keep our reserves within our walls. The Trinovantes stand aside, and their warriors return to their homes. Our strength will be ready for the trial to come."
