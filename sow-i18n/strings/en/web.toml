cookies_title = "Cookie Notice — Shadows of War"
analytics_title = "Optional analytics"
analytics_body = "We use site and game activity to improve Shadows of War. It stays off unless you allow it."
analytics_policy = "Cookie details"
analytics_accept = "Allow"
analytics_reject = "Reject"
analytics_manage = "Cookie settings"
cookies_description_v2 = "Optional product analytics stays off until you accept. See what Shadows of War stores and how to change your choice."
cookies_og_description_v2 = "Optional analytics is off until you accept. Change your choice at any time."
cookies_updated_v2 = "Last updated: October 6, 2026 · World of Unreal"
cookies_analytics_title = "Optional analytics on our website and browser game"
cookies_analytics_events = "It counts visits, loading stages, menu actions, tutorial step progress, lobby joins, match starts and explicit exits, plus a broad screen class (mobile, tablet or desktop). It does not record names, chat, passwords, lobby IDs, purchases, map clicks or the full user-agent string."
cookies_analytics_server = "Accepted events go directly to our first-party endpoint at /api/event. They do not pass through the game relay. Account IDs, when present, are changed on our server to a keyed, website-only pseudonym before storage."
cookies_storage_title = "Browser storage and retention"
cookies_storage_body = "We remember your accept/reject choice in local storage. Only after acceptance, a temporary session ID and a small retry queue use session storage. Analytics also includes the build, language and a broad screen class (mobile, tablet or desktop), not a full user-agent string. Event files and memberships expire within 90 days. Verified account deletion removes linked event rows and account memberships; non-identifying daily totals expire within the same 90 days. Game settings, account continuity, crash recovery and cached assets use separate storage needed for those features."
cookies_platforms_title = "Other game platforms"
cookies_platforms_body = "Poki, CrazyGames and Jest may measure use through their own SDKs under their platform terms. We do not copy those player-level events to our server. Android first-party analytics is disabled until its store disclosure is updated."
cookies_controls_v2 = "You can allow or reject optional analytics with equal ease. Starting the game does not count as allowing it. Change your choice in the game’s Settings or here; rejecting does not affect gameplay. Clearing site data also removes the choice, and analytics stays off until you explicitly allow it again. We do not sell or share analytics for advertising."
cookies_description = "How Shadows of War uses necessary storage: session IDs and first-party product events. No advertising cookies."
cookies_og_description = "Strictly-necessary storage only. No advertising, social, or cross-site-tracking cookies."
cookies_eyebrow = "Legal & Storage"
cookies_heading = "Cookie"
cookies_heading_em = "notice."
cookies_updated = "Last updated: September 2026 · World of Unreal"
cookies_use_title = "What we use"
cookies_use_body = "Shadows of War uses strictly-necessary client storage only — the kind that needs no consent banner because the site and game cannot function without it:"
cookies_session_label = "Analytics session identifiers"
cookies_session_body = "random IDs that group first-party product events within one visit. They vanish when the tab closes."
cookies_events_label = "First-party product events:"
cookies_events_body = "anonymous funnel events sent to our own servers"
cookies_events_after = "Not a cookie, not shared with any vendor."
cookies_game_label = "Game settings & cached map assets"
cookies_game_body = "client preferences and downloaded game data."
cookies_third_party_title = "Third parties"
cookies_third_party_body = "Fonts are self-hosted on our own domain. No third-party code runs storage or tracking on our pages: no advertising networks, no social widgets, no session-replay scripts, no cross-site identifiers. Our pages make zero cross-origin requests."
cookies_dont_title = "What we don't do"
cookies_dont_ads = "No advertising cookies and no interest-based advertising."
cookies_dont_sell = "No sale or sharing of personal data for advertising."
cookies_dont_tracking = "No cross-site or cross-app tracking."
cookies_dont_body = "Because there is no behavioral tracking, Global Privacy Control and Do Not Track signals have nothing to switch off — and we honor GPC as a sale/sharing opt-out regardless."
cookies_controls_title = "Your controls"
cookies_controls_clear = "Clear site data in your browser settings to remove session IDs and cached assets. The game keeps working and starts a fresh session."
cookies_controls_block = "Blocking all storage may force re-downloads of game assets and reset preferences each visit."
cookies_controls_rights = "For personal-data rights (access, deletion, portability), see the Privacy Policy — email"
cookies_changes_title = "Changes"
cookies_changes_body = "If we ever add non-essential storage (analytics vendors, embeds, advertising), this notice will list each item with its purpose and controls before it ships — and the Privacy Policy will be updated alongside. Last updated: September 2026."
terms_title = "Terms of Service — Shadows of War"
