privacy_description = "Read the player-facing privacy policy for Shadows of War: controller, data collected, sharing, 90-day retention, your rights, and deletion."
privacy_eyebrow = "Legal & Telemetry"
privacy_heading = "Privacy"
privacy_heading_em = "policy."
privacy_updated = "Last updated: September 2026 · Controller: World of Unreal · Contact: hello@shadowsofwar.io"
privacy_updated_v2 = "Last updated: October 6, 2026 · Controller: World of Unreal · Contact: hello@shadowsofwar.io"
privacy_overview_title = "Overview & controller"
privacy_overview_body = "Shadows of War is operated by World of Unreal. This policy covers shadowsofwar.io, partner platforms, and native clients. Privacy contact:"
privacy_overview_after = "We have no EU/UK establishment — send all requests, including GDPR requests, directly there."
privacy_overview_payments = "Partner-platform SDKs may collect data under their own policies. Card data is processed directly by the store you pay through (Google Play, Apple, Stripe); we never see card numbers."
privacy_eligibility_title = "Eligibility & children"
privacy_eligibility_body = "13+. Players 13–17 need a parent or guardian's permission. The game is not directed to children under 13; under-13 accounts are suspended and erased. Parents: write to"
privacy_eligibility_after = "and we delete promptly."
privacy_data_title = "Data we collect"
privacy_gameplay_label = "Gameplay:"
privacy_gameplay_body = "display name, clan tag, leader/civilization choices, match inputs, history, ranks, owned items."
privacy_account_label = "Account:"
privacy_account_body = "random account ID, linked platform identities, one-way hash of your ownership secret (never the plaintext)."
privacy_technical_label = "Technical:"
privacy_technical_body = "build version, platform/locale, connection metadata, relay tickets, server logs for security and anti-abuse."
privacy_analytics_label = "Product analytics (first-party only):"
privacy_analytics_body_v2 = "Optional first-party analytics on our website and browser game runs only after you allow it. Starting the game alone does not enable it. It records a closed set of visit, loading, menu, tutorial, lobby, match-start and match-exit events with build, language and a broad viewport class (mobile, tablet or desktop), not a full device fingerprint. If an account ID is present, our server replaces it with a channel-specific keyed pseudonym before storage. No names, messages, passwords, ad IDs or map clicks."
privacy_purchases_label = "Purchases:"
privacy_purchases_body = "product ID, transaction reference, entitlement status via RevenueCat/the store. Full payment details stay with the store."
privacy_public_label = "Public by design:"
privacy_public_body = "names, handles, rankings, and match records are visible to other players."
privacy_use_title = "Use & legal bases"
privacy_use_body = "We process data needed to run the game, protect players and systems, provide support, and meet legal duties. For EU/UK users, our bases include the contract for the game, legitimate interests for security and anti-cheat, legal obligations where required, and your consent for optional first-party product analytics. Analytics stays off until you allow it; you can change your choice in Settings. We do not sell personal data or use behavioral advertising."
privacy_sharing_title = "Sharing"
privacy_hosting_label = "Hosting under our instructions:"
privacy_hosting_body = "IONOS, Microsoft Azure, Cloudflare."
privacy_payments_label = "Payments:"
privacy_payments_body = "Google Play / Apple / Stripe via RevenueCat, under their policies."
privacy_sdk_label = "Partner SDKs:"
privacy_sdk_body = "under their own policy when you play through them."
privacy_players_label = "Players & public:"
privacy_players_body = "names, handles, ranks, match records."
privacy_authorities_label = "Authorities & transfers:"
privacy_authorities_body = "where required by law, or to a lawful successor with notice."
privacy_cookies_title = "Cookies & local storage"
privacy_cookies_body = "Strictly necessary storage only: session IDs. First-party product events go to our own endpoint. No advertising, social, or cross-site cookies. Fonts are self-hosted — zero cross-origin requests. Details and controls in our"
privacy_cookies_body_v2 = "We store your analytics choice in local storage. Only after acceptance do we create a temporary analytics session ID and retry queue in session storage. Rejecting analytics does not affect the game. Game settings, account continuity and cached assets use separate storage needed for those features. Details and controls in our"
privacy_retention_title = "Retention"
privacy_retention_body = "Event files, analytics counters and memberships expire within 90 days. Verified account deletion removes linked event rows and account memberships; non-identifying daily totals remain only until their 90-day expiry. Accounts and match history persist until you request deletion or termination under the Terms."
privacy_retention_body_v2 = "Event files, analytics counters and memberships expire within 90 days. Verified account deletion removes linked event rows and account memberships; non-identifying daily totals remain only until their 90-day expiry. Accounts and match history persist until you request deletion or termination under the Terms."
privacy_rights_title = "Your rights & deletion"
privacy_rights_body = "Access, correct, delete, port, object, restrict. Email"
privacy_rights_after = "with your in-game account ID (or name + approximate creation date). Verified deletions erase the account, identity mappings, metadata mirror, and analytics memberships — confirmed back to you. GPC is honored as a sale/sharing opt-out (we don't sell or share, so nothing toggles). Appeals by reply; response within 45 days at most."
privacy_security_title = "Security, transfers, changes"
privacy_security_body = "TLS in transit, loopback-only internals, bearer-gated operator endpoints, hashed ownership secrets; no absolute guarantee. Infrastructure runs in the US and EU with data minimization and no ad-tech transfers. We will prominently announce material changes to this Privacy Notice before they take effect; where required, we will ask for consent separately. Continued use alone does not grant consent."
