boudica_thetford_demand = "Utosang sumuko"
boudica_thetford_demand_detail = "Maghihimagsik ang Thetford at magiging agresibong kaaway."
boudica_unite_title = "Pagkaisahin ang Silangan"
boudica_unite_body = "Gawing neutral ang nakapalibot na mga himpilan sa rehiyon upang makuha ang silangang harapan sa ilalim ng iyong watawat."
boudica_unite_hint = "Pagtalo sa 4 na himpilang panrehiyon"
boudica_camulodunum_title = "Sigaw ng Camulodunum"
boudica_camulodunum_body = "Biglang Pagdami Camulodunum at pinutol ang mga pampatibay - loob upang sakupin ang pamayanan."
boudica_camulodunum_hint = "Pagkabihag Camulodunum sa timog"
boudica_londinium_title = "Sumulong Londinium"
