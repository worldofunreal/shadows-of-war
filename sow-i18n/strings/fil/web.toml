six_sky_ep3_hill_title = "Ang Burol"
six_sky_ep3_hill_body = "Xunantunich Sa kaniyang burol ay yumukod ka na walang bantay; at gawin mong busog ang burol."
six_sky_ep3_hill_hint = "Pagkatalo Xunantunich Mga Rebelyon"
six_sky_ep3_moon_title = "Diyosa ng Buwan"
