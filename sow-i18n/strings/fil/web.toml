how_step_2_title = "Piliin ang lider at bonus"
how_step_2_body = "Pumili ng 1 sa 12. Isang bonus bawat isa: 10% atake ni Cesar, +50% ginto sa pabrika ni Cleopatra, +20% bilis ng tropa ni Sun Tzu, o +50% ginto sa daungan ni Ragnar."
