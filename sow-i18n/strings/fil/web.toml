privacy_updated = "Huling artikulo: Setyembre 2026 · Controller: World of Unreal · Pakikipag - ugnayan: hello@shadowsofwar.io"
privacy_overview_title = "Buod at controller"
privacy_overview_body = "Shadows of War ay pinapatakbo ng World of Unreal. Ang patakarang ito ay sumasaklaw sa mga anino ng digmaan.io, partner platform, at mga katutubong kliyente. pribadong pakikipag-ugnayan:"
privacy_overview_after = "Wala tayong estasyong EU/UK – magpadala ng lahat ng mga kahilingan, kabilang ang mga kahilingan ng GDPR, direktang doon."
privacy_overview_payments = "Ang Partner-platform SDKs ay maaaring magtipon ng mga datos sa ilalim ng kanilang sariling mga patakaran. Ang mga datos ng Card ay direktang pinoproseso ng tindahan na binabayaran mo sa pamamagitan ng (Google Play, Apple, Stripe); hindi namin kailanman nakita ang mga numero ng kard."
privacy_eligibility_title = "Pagiging Eligbilidad at mga anak"
privacy_eligibility_body = "13+. Ang mga manlalaro 13–17 ay nangangailangan ng pahintulot ng isang magulang o tagapag-alaga. Ang laro ay hindi nakatuon sa mga batang wala pang 13; under-13 account ay nakasuspinde at nabura. Mga magulang: isulat hanggang sa mabura."
privacy_eligibility_after = "at agad kaming umalis."
privacy_data_title = "Mga Data na ating tinitipon"
privacy_gameplay_label = "Laro:"
privacy_gameplay_body = "ang pangalan, clan tag, leader/cracialization pagpipilian, tugmang input, kasaysayan, ranggo, mga bagay na pag-aari."
privacy_account_label = "Ulat:"
privacy_account_body = "Pasumala account ID, link platform features, one-way hash ng iyong pagmamay-ari lihim (hindi kailanman ang simpletext)."
privacy_technical_label = "Teknikal:"
privacy_technical_body = "magtayo ng bersyon, plataporma/locale, connection metadata, tiket sa relay, trosong server para sa seguridad at anti-abuse."
privacy_analytics_label = "Product analytics (unang-bahagi lamang):"
privacy_analytics_body = "Sarado-taxonomy mga pangyayari (vists, boot stages, tutorial, matching, core start/end) na nakatali sa isang pasumala na sesyon ID at account ID. No ad identifiers, walang ikatlong-partido na tindero."
privacy_purchases_label = "Mga Purchase:"
privacy_purchases_body = "Ang produktong ID, reference sa transaksiyon, status ng produksyon sa pamamagitan ng RevenueCat/ang tindahan. Buong mga detalye ng pagbabayad ay nananatili sa tindahan."
privacy_public_label = "Pampubliko sa pamamagitan ng disenyo:"
privacy_public_body = "Ang mga pangalan, hawakan, mga ranggo, at mga rekord ng posporo ay nakikita ng ibang manlalaro."
privacy_use_title = "Gumamit ng & legal base"
privacy_use_body = "Pagtakbo sa laro, seguridad at anti-cheat, imbudo at pagkamaaasahan, suporta, pagsunod. EU/UK base: kontrata, lehitimong interes (hindi kailanman pag-aanunsiyo), pagsang-ayon kung saan hinihiling, legal na obligasyon. hindi tayo nagbebenta ng personal na datos at hindi nagpapatakbo ng mga ad trackers."
privacy_sharing_title = "Pagbabahagi"
privacy_hosting_label = "Pag - iingat sa ilalim ng ating mga tagubilin:"
privacy_hosting_body = "IONOS, Microsoft Azure, Cloudflare."
privacy_payments_label = "Mga Gantimpala:"
privacy_payments_body = "Google Play / Apple / Stripe via RevenueCat, sa ilalim ng kanilang mga patakaran."
privacy_sdk_label = "Magkapareha SDK:"
privacy_sdk_body = "sa ilalim ng kanilang sariling patakaran kapag ikaw ay naglalaro sa pamamagitan nila."
privacy_players_label = "Mga Manlalaro & publiko:"
privacy_players_body = "Mga pangalan, hawakan, ranggo, mga plaka ng posporo."
privacy_authorities_label = "Mga awtoridad at mga Paglilipat:"
privacy_authorities_body = "kung saan hinihiling ng batas, o sa isang matuwid na kahalili na may notisya."
privacy_cookies_title = "Lutuin at lokal na imbakan"
privacy_cookies_body = "Mahigpit na-kinakailangan na storage lamang: ispecial offedities, sesyon IDs, ang ating first-party eventpoint. Walang advertising, social, o cross-site cookies. Fonts ay self-hosted — zero cross-origin requests. Details and controls sa ating mga reques."
privacy_retention_title = "Pagtutuon ng Pansin"
privacy_retention_body = "Event files auto-prune nakaraang 90 araw; ang analytics kontras at mga miyembro ay nawawala sa pamamagitan ng key TTL sa loob ng 90 araw. ang mga Deploys ay hindi kailanman nagbura ng live na estado. Ang mga account at kasaysayan ay nananatili hanggang sa ikaw ay humiling ng deleksiyon o pagtatapos sa ilalim ng Termino."
privacy_rights_title = "Ang Iyong mga Karapatan at Pag - aalis ng halaga"
privacy_rights_body = "Access, tama, delete, port, bagay, ligal. Email"
privacy_rights_after = "kasama ang inyong in-game account na ID (o pangalan + tinatayang petsa ng paglikha). Verified delections nabura ang account, identity sopains, metadata mirror, at analytics entreviations — nakumpirma pabalik sa iyo. Ang GPC ay pinararangalan bilang isang benta/sharing opt-out (hindi tayo nagbebenta o nakikibahagi, kaya't walang togggles)."
privacy_security_title = "Seguridad, paglipat, pagbabago"
privacy_security_body = "Ang TLS sa transit, loopback-lamang panloob, bearer-gated operator endpoints, hashed pagmamay-ari lihim; walang absolute garantiya. Ang infra ay tumatakbo sa US at EU na may data-minimization at walang ad-tech na paglipat. Ang mga pagbabago sa patakarang materyal ay nagkakaroon ng epekto pagkatapos ng prominenteng pagpansin; ang patuloy na paggamit ay nangangahulugan ng pagtanggap."
privacy_contact_title = "Makipag - ugnayan"
privacy_contact_before = "Pribadong Buhay:"
privacy_help = "Tulong:"
support_center = "sentro ng suporta"
privacy_security_contact = "Mga kapintasan sa seguridad: pribado sa hello@, hindi kailanman sa publiko — kinikilala sa loob ng 48 oras."
privacy_source_before = "Mga bahaging server-side ay AGPL-3.0-or-late; source on"
cookies_title = "Cookie Note — Shadows of War"
cookies_description = "Paano Shadows of War ay gumagamit ng mahigpit-kinakailangang imbakan lamang: pagpili ng tema, sesyong mgaidentifiers, at mga kaganapang pang-party product. Walang mga anime sa pag-aanunsiyo."
cookies_og_description = "Mahigpit na-kinakailangan na imbakan lamang. Walang advertising, social, o cross-site-tracking cookies."
cookies_eyebrow = "Ligal at Imbakan"
cookies_heading = "Lutuin"
cookies_heading_em = "Pansinin."
cookies_updated = "Huling inapdeyt: Setyembre 2026 · World of Unreal"
cookies_use_title = "Kung ano ang ginagamit natin"
cookies_use_body = "Shadows of War ay gumagamit ng mahigpit-kinakailangang imbakan ng kliyente lamang — ang uri na hindi nangangailangan ng band ng pahintulot dahil ang site at laro ay hindi maaaring gumana kung wala ito:"
cookies_theme_label = "Ang kagustuhan"
cookies_theme_body = "Tandaan ang iyong magaan/madilim na pagpili. Unang-bahagi, mahigpit na kinakailangan."
cookies_session_label = "Ang sesyon ng analytics na mga tagatukoy"
cookies_session_body = "Ang mga random na ID na grupo ng mga unang-bahaging produkto ay mga pangyayari sa loob ng isang pagbisita.Ang mga ito ay naglalaho kapag ang tab ay nagsara."
cookies_events_label = "Unang-bahaging mga pangyayari sa produkto:"
cookies_events_body = "Ang di - kilalang mga pangyayaring imbudo na ipinadala sa aming sariling mga server"
cookies_events_after = "Walang cookie, hindi kasama ang sinumang nagtitinda."
cookies_game_label = "Mga setting ng laro at naka-cache na asset ng mapa"
cookies_game_body = "Ang kliyente ay pumipili at nag-download ng data ng laro."
cookies_third_party_title = "Ikatlong partido"
cookies_third_party_body = "Ang mga Font ay sariling-hosted sa ating sariling domain. Walang ikatlong-partikulo code ang tumatakbo ng imbakan o pagsubaybay sa ating mga pahina: walang mga network ng pag-aanunsiyo, walang mga social widget, walang sesyon-replay scripts, walang cross-site identifiers. Ang ating mga pahina ay gumagawa ng sero cross-origin requests."
cookies_dont_title = "Kung ano ang hindi namin ginagawa"
cookies_dont_ads = "Walang mga anime sa pag-aanunsiyo at walang interes-based na pag-aanunsiyo."
cookies_dont_sell = "Walang benta o pagbabahagi ng personal na impormasyon para sa pag - aanunsiyo."
cookies_dont_tracking = "Walang cross-site o cross-app tracking."
cookies_dont_body = "Dahil walang pag-uugaling pagsubaybay, ang Global Privacy Control at Do Not tracking signals ay walang anumang mapuputol – at pinararangalan natin ang GPC bilang isang binebenta/sharing opt-out anuman."
cookies_controls_title = "Ang iyong mga kontrol"
cookies_controls_clear = "Malinaw na site data sa inyong browser settings — inaalis nito ang tema, sesyon IDs, at mga ari - ariang may laman, patuloy na gumagana ang laro; basta nalilimutan nito ang inyong tema at sinisimulan ang isang bagong sesyon."
cookies_controls_block = "Ang pagharang sa lahat ng mga pag-iimbak ay maaaring magtulak sa muling-download ng mga asset ng laro at muling pagsasaayos ng mga kagustuhan sa bawat pagbisita."
cookies_controls_rights = "Para sa mga karapatang personal-data (access, deletion, portable), tingnan ang Pribadong Patakaran — email"
cookies_changes_title = "Mga pagbabago"
cookies_changes_body = "Kung madadagdagan pa natin ang hindi-essential na pag-iimbak (analytics na mga tindero, embeds, advertising), ang notisyang ito ay magtatala ng bawat bagay na may layunin at kontrol bago nito ang mga barko — at ang Pribadong Patakaran ay babaguhin sa tabi. Huling pag-apruba: Setyembre 2026."
terms_title = "Mga Termino ng Paglilingkod — Shadows of War"
terms_description = "Basahin ang mga termino ng paglilingkod para sa Shadows of War: mga salaysay, mga bagay na birtuwal at no-refund na patakaran, pag-aasal, pananagutan, at resolusyon ng pagtatalo."
terms_eyebrow = "Termino at Kalagayan"
terms_heading = "Mga Termino ng"
terms_heading_em = "paglilingkod."
terms_updated = "Huling inapdeyt: Setyembre 2026 · World of Unreal"
terms_acceptance_title = "Pagtanggap at Pagiging Kaakit - akit"
terms_acceptance_body = "Ang mga Termong ito ay isang kasunduang may bisa sa pagitan mo at ng World of Unreal Mamamahala sa paggamit mo ng Shadows of War sa mga nowsofwar.io, partner platforms, at mga katutubong kliyente. sa pamamagitan ng paglalaro, pag-install, o pag-access sa Service na sinasang-ayunan mo sa mga Terminong ito. kung hindi ka sang-ayon, huwag mong gamitin ang Serbisyo."
terms_acceptance_age = "Ang mga manlalarong edad 13 hanggang 17 ay maaaring maglaro lamang sa pahintulot at pangangasiwa ng magulang o ng tagapag - alaga."
terms_changes_title = "Nagbabago ang laro & serbisyo"
terms_changes_body = "Multiplayer ay nangangailangan ng network access sa ating mga servers — sa anumang bahagi ng Serbisyo — mga mode, mapa, season, leaderboard, pangyayari — sa anumang oras, mayroon man o hindi, nang walang bayad sa iyo."
terms_accounts_title = "Mga Ulat"
terms_accounts_body = "Ang pag - aalis ng maling pangalan sa mga site ay lumilikha ng bagong account; hindi kailanman binabago ng mga maling pangalan ang account na ID. Ang account na ID mo ay isang progressive tiyup key, hindi isang password — panatilihing ligtas ang iyong gadyet."
terms_accounts_contact = "Mag - ulat ng mga bagay na sa palagay mo'y hindi puwedeng gawin."
terms_license_title = "Lisensiya & mga restriksiyon"
terms_license_body = "Nagbibigay tayo ng limitado at maaaring baguhing lisensiya para sa personal, non-commercial play. Lahat ng IP sa Serbisyo ay nauukol sa personal, non-commercial play. World of Unreal o ang mga lisensiya nito. Game source code ay hiwalay na makukuha sa ilalim ng AGPL-3.0-or-late; account, virtual items, at server data ay pinamamahalaan ng mga Terminong ito."
terms_license_no_sell = "Walang pagbebenta, pag - upa, pagpapautang, o pagsasamantala sa komersiyo."
terms_license_no_reverse = "Walang baligtad-engineering, scraping, maramihang pagkuha, o modelong pagsasanay sa Serbisyo."
terms_license_feedback = "Maaaring malayang gamitin ang iyong bahagi sa pagpapakain, nang walang kabayaran o bayad - pinsala."
terms_virtual_title = "Halos lahat ng bagay at walang refunds"
terms_virtual_body = "Ang mga Gem, leader openings, at mga balat ay lisensiyadong mga virtual na bagay lamang: walang halaga ng pera, non-transferable, revocable. Leader opens championing gameplay – ang mga ito ay may kakaibang perks at hindi purong kosmetiko."
terms_sales_final = "LAHAT NG SILE AY MAY KASALAMAN."
terms_virtual_refunds = "Ang mga bagay na pang-administratibo ay mga hindi-refundable at di-nababago sa ganap na pinapayagan ng batas – kabilang na ang para sa mga ginagamit o hindi kailangang mga bagay, mga pagbabago sa serbisyo, o account aksyon na ginawa para sa mga paglabag ng Termes. kung ang isang plataporma ay magreresulta sa isang pagbili, maaari nating alisin ang mga kaukulang bagay at kumuha ng mga hakbang ng account."
terms_conduct_title = "Pag - uugali ng Manlalaro"
terms_conduct_cheating = "Walang pandaraya, bits, macros, automasyon, mga tagumpay sa insekto, o sinadyang mga desync."
terms_conduct_harassment = "Walang panliligalig, pagbabanta, poot-bait, o doxxing.Ang mga pangalan, tag, at chat ay dapat sumunod sa batas."
terms_conduct_servers = "Walang sumisira sa mga server, nagsusuri sa imprastraktura, o humihipo sa kuwenta, kredensiyal, o tiket ng ibang manlalaro."
terms_conduct_after = "Ang mga paglabag ay maaaring humantong sa pag - aalis ng nilalaman, pagkawala ng posporo, o pagsuspinde o pagwawakas."
terms_third_party_title = "Ikatlong-bahaging mga serbisyo & iba pang mga manlalaro"
terms_third_party_body = "Mga platapormang pangkapareha at ang kanilang mga SDK, mga tagapaglaan ng kabayaran, Discord, at Telegram ang ikatlong parti na hindi namin kontrolado; ang kanilang sariling termino ay kumakapit at ginagamit mo ito sa iyong sariling panganib. World of Unreal mula sa mga pag - aangkin mula sa ikatlong parti o iba pang manlalaro."
terms_termination_title = "Terminasyon"
terms_termination_body = "Maaaring ihinto o ihinto namin ang iyong pag - uusap — mga kuwenta, mga bagay, mga entry ng leaderboard — sa anumang panahon sa anumang kadahilanan, pati na ang pinaghihinalaang mga paglabag sa Termes, nang walang bayad."
terms_disclaimer_title = "Mga Walang - Pag - aangkin"
terms_disclaimer_body = "ANG SERVICE AY ISANG ISENTE AT EXAS AVAILE.UTO SA PINAKAMAHAL NA LAMANG NA HAHALAGA SA ISANG PROBLEKLAM NA ISRALE, SANERNEKLAPENTO, SARILENO PARA SA ISANG PROICULURTO, TITLE, AT NON-INFRINGEMENT. Hindi tayo humihingi ng di - sinasadyang pagkakamali, o matatag na operasyon, o pagpapatakbo ng mga bagay, o pag - iingat."
terms_liability_title = "Hangganan ng Pananagutan"
terms_liability_body = "PARA SA MGA MAXIMUKIT NA MAHAL NA PUMUHAY NA HINDI HALAGA SA MGA PROMPIT, NAILILILIPIT NA MGA LUGO O PROGES, O HINDI NA MAHIRAP O NATATANGGUGO SA AMINNG MGA PENTIKTA SA KALUWAL NA LIBILYA."
terms_indemnification_title = "Pag - aalinlangan"
terms_indemnification_body = "Sang - ayon kang ipagtanggol at hindi bigyang - dangal ang iyong sarili World of Unreal laban sa mga pag - aangkin at makatuwirang mga gastos na bunga ng paggamit mo ng Serbisyo, ng iyong paglabag sa mga Terminong ito, o ng iyong paglabag sa batas."
terms_arbitration_title = "Mga Pagkakasalungatan at Pakikipag - alitan"
terms_arbitration_before = "Ang mga pagtatalo ay dumadaan sa gampanin na pang-iisahan (JAMS, Delaware) pagkatapos ng 45-araw na impormal na-resolusyon na pagtatangka — hindi hukuman. Ikaw na nag-diverse jury-trial at class-action na karapatan. Ang mga Small-claim at IP ay inililiban. Maaaring piliin mo ang hindi pagpapasya sa loob ng 30 araw ng unang pagtanggap sa mga Terminong ito sa pamamagitan ng email."
terms_arbitration_after = "sa pamamagitan ng inyong account na ID at isang malinaw na opt-out na pahayag."
terms_general_title = "Heneral"
terms_general_before = "Ang batas delaware ay namamahala sa mga Terminong ito; ang mga hindi-arbitrated na mga pag-aangkin ay eksklusibong napupunta sa mga korte ng Delaware. ang mga materyal na updates ay nag-aalsa pagkatapos ng prominenteng notisya; ang patuloy na paggamit ay nangangahulugan ng pagtanggap. World of Unreal —"
terms_privacy_title = "Pribadong Buhay"
terms_privacy_before = "Ang paghawak ng impormasyon, ang iyong mga karapatan, at deleksiyon ay inilalarawan sa ating mga karapatan"
terms_privacy_and = "at"
terms_privacy_after = "Ilakip dito sa pamamagitan ng reperensiya."
