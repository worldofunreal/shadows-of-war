privacy_security_contact = "Mga kapintasan sa seguridad: pribado sa hello@, hindi kailanman sa publiko — kinikilala sa loob ng 48 oras."
privacy_source_before = "Ang buong source code ng bawat bersyon ng laro ay lisensyado sa ilalim ng AGPL-3.0-only kasama ang mga karagdagang tuntunin ng OpenFront. Nasa menu ng laro ang link sa source code ng katugmang bersyon."
cookies_title = "Cookie Note — Shadows of War"
cookies_description = "Paano gumagamit ang Shadows of War ng kinakailangang storage: mga session ID at sariling product event. Walang advertising cookies."
cookies_og_description = "Mahigpit na-kinakailangan na imbakan lamang. Walang advertising, social, o cross-site-tracking cookies."
