six_sky_ep1_queen_title = "Reyna ng Naranjo"
six_sky_ep1_queen_body = "Tikal Hatiin mo ang mga kampo sa malapit, at ang linya mo ay tiwasay."
six_sky_ep1_queen_hint = "Pagkatalo Tikal"
six_sky_ep2_regent_title = "Rehente"
six_sky_ep2_regent_body = "693 CE. Ang iyong limang-year-old na anak na lalaki ay hari ng Naranjo, at ikaw ay namamahala sa kanyang pangalan. palawakin at ipakita ang lakas."
six_sky_ep2_regent_hint = "Mag - alaga ng lupa na hindi pa naaangkin para lumawak"
six_sky_ep2_provinces_title = "Napukaw ang mga Lalawigan"
six_sky_ep2_provinces_body = "Ang paghihimagsik ay nagpapaalsa sa mga nayon, una muna'y sa pamamagitan ng Strike — kumuha ng dalawang karibal bago sila magkaisa."
six_sky_ep2_provinces_hint = "Pagtalo sa 2 kaaway"
six_sky_ep2_uaxactun_title = "Unang Apoy: Uaxactun"
six_sky_ep2_uaxactun_body = "Uaxactun Mga rebelde, sunugin ang pagsuway nito."
