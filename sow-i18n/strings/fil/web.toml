six_sky_ep1_landfall_title = "Pagbagsak"
six_sky_ep1_landfall_body = "682 CE. Wak Chanil Ajaw, anak na babae ng Dos Pilas, mamahala Naranjo. Mag-angkin ng lupa sa kabila ng inyong hangganan."
