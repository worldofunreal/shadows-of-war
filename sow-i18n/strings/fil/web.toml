six_sky_ep1_rival_title = "Ang Dating Dugo"
six_sky_ep1_rival_body = "Nag - aangkin NaranjoHindi mo matanggap ang karapatan mo dahil ang karibal mong tagapagmana ay mawawala na."
six_sky_ep1_rival_hint = "Pagtagumpayan ang Pag - aangkin ng Rival"
six_sky_ep1_caracol_title = "Paghiwalayin ang Tagapaghiwalay"
six_sky_ep1_caracol_body = "Caracol kaliwa Naranjo Walang hari minsan, ang garison nito ay kailangang bumagsak."
six_sky_ep1_caracol_hint = "Pagkatalo Caracol"
six_sky_ep1_vanguard_title = "Tikal' Mga Mata"
six_sky_ep1_vanguard_body = "Tikal Magmasid sa pamamagitan ng kaniyang vanguard."
