boudica_snettisham_tribute_body = "Magbayad ng 200 ginto para sa aming suporta. Kung tatanggi ka, magiging magkaaway tayo, pero hindi kami unang aatake. Maaari pa rin kaming lumawak at maaari mo kaming salakayin anumang oras."
boudica_snettisham_refuse_detail = "Magiging pasibong kaaway ang Snettisham. Maaari itong lumawak pero hindi unang sasalakay; maaari mo itong salakayin anumang oras."
boudica_thetford_respect_title = "Humihingi ng paggalang ang Thetford"
boudica_thetford_respect_body = "Ituring na kapantay ang aming angkan at sasama kami sa iyong layunin. Kung hihilingin mong sumuko kami, maghihimagsik kami laban sa iyo."
boudica_thetford_respect = "Magpakita ng paggalang"
