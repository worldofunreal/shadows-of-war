six_sky_ep2_yaxha_title = "Ikalawang Apoy: Yaxha"
six_sky_ep2_yaxha_body = "Yaxha Pilit na tiyakin ang katapatan nito."
six_sky_ep2_yaxha_hint = "Pagkatalo Yaxha Mga Rebelyon"
six_sky_ep2_tayasal_title = "Ikatlong Apoy: Tayasal"
six_sky_ep2_tayasal_body = "Isang rehente na hindi makapanghawakan Tayasal hindi maaaring hawakan Naranjo."
six_sky_ep2_tayasal_hint = "Pagkatalo Tayasal Mga Rebelyon"
six_sky_ep2_seibal_title = "Ikaapat na Apoy: Seibal"
six_sky_ep2_seibal_body = "SeibalAng mga bangka ay nagdadala ng paghihimagsik sa ilog, Sink ang paglaban nito."
six_sky_ep2_seibal_hint = "Pagkatalo Seibal Mga Rebelyon"
six_sky_ep2_caracol_title = "Bumalik ang Tagapaghiwalay"
six_sky_ep2_caracol_body = "Caracol Pagtibayin mo ang mga rebelde, ang pinakamatandang utang ng iyong paghahari."
