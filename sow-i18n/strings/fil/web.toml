six_sky_ep2_coalition_body = "Tikal tipunin mo ang iyong mga kaaway sa isang koalisyon, hatiin mo ito at walang lunsod na mag - aalinlangan sa muling pagtatayo nito."
six_sky_ep2_coalition_hint = "Pagdaig sa Tikal Pag - asa"
six_sky_ep3_count_title = "Ang Mahabang Bilang"
six_sky_ep3_count_body = "Ang mga taon ay nagpangyari sa iyo na maging alamat at puntiryahin kapuwa."
