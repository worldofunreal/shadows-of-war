six_sky_ep3_offerings_title = "Mga Handog"
six_sky_ep3_offerings_body = "Ang mga Dios at ang mga kawal ay kapuwa humihingi ng buwis; at sila'y nagsisikuha ng dalawang kaagaw upang pakanin ang mga dambana at ang bantay."
six_sky_ep3_offerings_hint = "Pagtalo sa 2 kaaway"
six_sky_ep3_unknown_title = "Ang Di - kilalang Kaaway"
six_sky_ep3_unknown_body = "Ang mga eskriba ay nagtatalo pa rin kung saan K'inichil Kab Mga tuntunin mula sa. Pananagumpayan ito."
six_sky_ep3_unknown_hint = "Pagkatalo K'inichil Kab"
six_sky_ep3_caracol_title = "Punong - puno ng Digmaan"
