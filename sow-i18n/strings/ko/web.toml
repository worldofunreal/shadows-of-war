terms_updated = "최근 업데이트: 9월 2026 · World of Unreal"
terms_acceptance_title = "수용 및 자격"
terms_acceptance_body = "이 약관은 귀하와 의결한 계약입니다. World of Unreal 의 사용 Shadows of War shadowsofwar.io, 파트너 플랫폼 및 네이티브 클라이언트. 재생, 설치, 또는 이러한 약관에 동의하는 서비스에 액세스. 동의하지 않는 경우, 서비스를 사용하지 마십시오."
terms_acceptance_age = "최소 13세 이상이어야 합니다. 13세 ~ 17세 미만의 플레이어는 부모 또는 보호자의 허가 및 감독과 함께 플레이할 수 있습니다. 이 서비스는 13세 미만의 어린이에게 지시하지 않습니다."
terms_changes_title = "게임 및 서비스 변경"
terms_changes_body = "멀티플레이어는 서버에 네트워크 액세스를 요구합니다. 저희는 언제든지 수정, 중단, 중단, 또는 서비스의 일부가 중단될 수 있습니다. — 모드, 맵, 시즌, 리더보드, 이벤트 — 언제든, 통지 없이, 책임을 지지 않습니다."
terms_accounts_title = "계좌정보"
terms_accounts_body = "익명 재생은 디스플레이 이름으로 기기에 저장된 공명 계정 ID를 생성합니다. Clearing 사이트 저장은 새로운 계정을 만듭니다. 계정 ID를 변경하지 않는 이름을 변경하지 마십시오. 계정 ID는 진행중 조회 키이며 비밀번호가 아닙니다. 장치 보안을 유지하십시오."
terms_accounts_contact = "귀하는 귀하의 계정의 모든 활동에 책임이 있습니다. 의심되는 혐의적 접근을 신고하십시오."
terms_license_title = "라이센스 및 제한"
terms_license_body = "우리는 개인, 비 상업적인 놀이를 위한 한정된, revocable 면허를 부여합니다. 서비스에 있는 모든 IP는에 속합니다 World of Unreal 또는 그 라이센서. 게임 소스 코드는 AGPL-3.0-or-later에서 별도로 사용할 수 있습니다. 계정, 가상 항목 및 서버 데이터는 이러한 약관에 의해 지배됩니다."
terms_license_no_sell = "판매, 임대, 보조금, 또는 상업적인 악용 없음."
terms_license_no_reverse = "서비스에서 역설계, 스크랩, 대량 추출 또는 모델 훈련 없음."
terms_license_feedback = "당신이 공유하는 의견은 보상 또는 attribution 없이 자유롭게 사용될지도 모릅니다."
terms_virtual_title = "가상 아이템 & 환불 없음"
terms_virtual_body = "보석, 리더 잠금 해제, 및 스킨은 가상 아이템 만 라이센스됩니다 : 현금 값, 비 이동식, 복제 가능. 리더는 게임 플레이를 잠금 해제 - 그들은 명백한 특전과 순수 화장품이 없습니다."
terms_sales_final = "모든 판매는 FINAL입니다."
terms_virtual_refunds = "가상 아이템은 사용 또는 원치 않는 항목, 서비스 변경, 또는 이용 약관 위반으로 인한 계정 행동을 포함하여 법률에 의해 허용되는 전체 범위에 환불 및 비 대체 할 수 있습니다. 플랫폼이 구매를 반전하면 해당 항목을 제거하고 계정 조치를 취할 수 있습니다."
terms_conduct_title = "플레이어의 행동"
terms_conduct_cheating = "부정 행위 없음, 봇, 매크로, 자동화, 버그 악용, 또는 의도적인 desyncs."
terms_conduct_harassment = "harasssment, 위협, 싫어, 또는 doxxing. 이름, 태그 및 채팅은 법에 따라해야합니다."
terms_conduct_servers = "서버, probing 인프라, 또는 다른 플레이어의 계정, 자격 증명, 또는 티켓을 만질 수 없습니다."
terms_conduct_after = "Violations는 내용 제거, 일치 forfeiture, 또는 중단 또는 종료에 지도할지도 모릅니다."
terms_third_party_title = "제3자 서비스 및 기타 플레이어"
terms_third_party_body = "파트너 플랫폼 및 SDK, 결제 제공업체, Discord, 및 Telegram 우리가 통제하지 않는 제 3자입니다; 그들의 자신의 용어는 적용하고 당신은 당신의 자신의 위험에 그들을 사용합니다. 다른 플레이어와 상호 작용은 당신과 그 사이에 단독으로. 당신이 방출 법에 의해 허용되는 전체 범위에 World of Unreal 제3자 또는 기타 플레이어로부터의 상승을 주장합니다."
terms_termination_title = "- 연혁"
terms_termination_body = "우리는 귀하의 액세스를 중단하거나 종결 할 수 있습니다. - 계정, 항목, 리더 보드 항목 - 책임없이 모든 이유에 대한 모든 시간. 귀하의 라이센스 끝을 종료하고 가상 항목은 환불없이 금지됩니다."
terms_disclaimer_title = "관련 기사"
terms_disclaimer_body = "서비스는 ‘있는 그대로’ 및 ‘제공 가능한 상태로’ 제공됩니다. 법이 허용하는 최대 범위에서 상품성, 특정 목적에의 적합성, 소유권 및 비침해를 포함한 모든 보증을 부인합니다. 서비스의 중단 없는 운영, 무오류 또는 보안을 보장하지 않으며 진행도, 순위 또는 아이템의 보존도 보장하지 않습니다."
terms_liability_title = "책임의 한계"
terms_liability_body = "최대의 비용으로, 우리는 대출에 의해 제한되지 않습니다, 대출 DATA, LOST ITEMS 또는 장점, 또는 어떤 보험 또는 계약. 우리의 탄수화물 책임은 $ 50의 GREATER에 적용되며, 당신은 SIX MONTHS에 VIRTUAL ITEMS에 대해 사과."
terms_indemnification_title = "관련 기사"
terms_indemnification_body = "당신은 방어 및 indemnify에 동의 World of Unreal 서비스 이용, 본 약관 위반, 또는 법 위반으로 인한 청구 및 합리적인 비용으로 인해 발생하는 비용."
terms_arbitration_title = "분쟁 및 중재"
terms_arbitration_before = "분쟁은 45 일 통지 - 법원이 아닌 45 일 통지 - 후 개별 중재 (JAMS, 델라웨어)를 통해 이동. 당신은 배심하고 수업 활동 권리. 소소매 및 IP 침해는 제외됩니다. 당신은 이메일에 의해이 약관을 수락하여 30 일 이내에 중재를 선택 할 수 있습니다"
terms_arbitration_after = "계정 ID와 명확한 선택 아웃 문으로."
terms_general_title = "의 의"
terms_general_before = "Delaware 법은이 약관을 지배합니다. 비 중재 된 주장은 Delaware 법원에 독점적으로 이동합니다. 재료 업데이트는 눈에 띄는 통지 후 효력을 발생합니다. 지속적인 사용은 수용을 의미합니다. 연락처 : World of Unreal —"
terms_privacy_title = "의 의 의"
