boudica_verulamium_title = "팟캐스트 Verulamium"
boudica_verulamium_body = "Verulamium 에 앉다 Watling Street. imperial 공급 선을 삭감하기 위하여 결산을 붙잡으십시오."
boudica_verulamium_hint = "팟캐스트 Verulamium"
boudica_ninth_title = "Ninth의 침략"
