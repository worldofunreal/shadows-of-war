analytics_manage = "쿠키 설정"
privacy_analytics_body_v3 = "웹사이트와 브라우저 게임의 선택적 자사 분석은 허용한 뒤에만 작동합니다. 방문, 로딩, 메뉴, 튜토리얼, 로비, 경기 이벤트의 제한된 집합과 빌드, 언어, 대략적인 화면 크기 범주 및 ?ref=의 선택적 짧은 출처 태그를 기록합니다. 이벤트는 현재 브라우저 세션에만 저장되는 임시 무작위 세션 ID를 사용하며 계정/플레이어 ID나 경기/로비 ID를 포함하지 않습니다. 요청 IP는 별도 기술 보안 로그에 남을 수 있지만 분석 이벤트 기록에는 포함되지 않습니다. 이름, 메시지, 비밀번호, 광고 ID, 지도 클릭 또는 전체 기기 지문은 기록하지 않습니다."
privacy_cookies_body_v2 = "분석 선택은 로컬 저장소에 보관합니다. 허용한 뒤에만 임시 분석 세션 ID와 작은 재전송 대기열을 세션 저장소에 만듭니다. 거부해도 게임 이용에 영향이 없습니다. 게임 설정, 계정 유지, 캐시된 리소스는 각 기능에 필요한 별도 저장소를 사용합니다. 자세한 내용과 설정은"
privacy_retention_body_v2 = "이벤트 파일, 분석 카운터, 연결 기록은 90일 이내에 만료됩니다. 확인된 계정 삭제가 완료되면 관련 이벤트와 계정 연결 기록을 삭제합니다. 개인을 식별하지 않는 일별 합계도 같은 90일이 지나면 삭제됩니다. 계정과 경기 기록은 삭제를 요청하거나 약관에 따라 계정이 종료될 때까지 보관됩니다."
privacy_updated_v2 = "최종 업데이트: 2026년 10월 6일 · 개인정보처리자: World of Unreal · 연락처: hello@shadowsofwar.io"
cookies_analytics_title = "웹사이트와 브라우저 게임의 선택적 분석"
cookies_storage_title = "브라우저 저장소와 보관 기간"
cookies_storage_body = "허용 또는 거부 선택을 로컬에 보관합니다. 허용한 뒤에만 임시 세션 ID와 작은 재전송 대기열을 세션 저장소에 둡니다. 분석에는 빌드, 언어, 대략적인 화면 크기 범주가 포함되며 전체 user-agent는 포함되지 않습니다. 이벤트와 연결 기록은 90일 이내에 만료되며 확인된 계정 삭제 시 관련 기록도 지워집니다. 게임 설정, 계정 유지, 오류 복구, 캐시 리소스에는 기능에 필요한 별도 저장소를 씁니다."
cookies_platforms_title = "다른 게임 플랫폼"
cookies_platforms_body = "Poki, CrazyGames, Jest는 각 플랫폼 약관에 따라 자체 SDK로 이용 상황을 측정할 수 있습니다. 해당 플랫폼의 플레이어 이벤트를 당사 서버로 복사하지 않습니다. Android 자사 분석은 스토어 고지 내용을 업데이트할 때까지 비활성화되어 있습니다."
cookies_controls_v2 = "선택적 분석은 같은 정도로 쉽게 허용하거나 거부할 수 있습니다. 게임을 시작해도 허용한 것으로 보지 않습니다. 게임 설정이나 여기에서 선택을 바꿀 수 있으며, 거부해도 게임 이용에 영향이 없습니다. 사이트 데이터를 지우면 선택도 삭제되고, 다시 허용하기 전까지 분석은 꺼져 있습니다. 광고 목적으로 분석 데이터를 판매하거나 공유하지 않습니다."
