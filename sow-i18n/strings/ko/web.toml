leader_hiawatha_haudenosaunee_ability = "위대한 평화의 법"
leader_hiawatha_haudenosaunee_description = "내 동맹 두 명이 서로 새 동맹을 맺으면, 그 둘과 맺은 내 기간제 동맹이 모두 전체 지속 시간으로 갱신됩니다. 동맹 쌍마다 경기당 한 번 발동합니다."

leader_kaahumanu_hawaii_ability = "함께하는 식탁"
leader_kaahumanu_hawaii_description = "서로 활성 농장이 있을 때 각 동맹에게 처음으로 병력 500명 이상을 보내면, 양쪽 모두 보낸 병력의 25%를 원군으로 받습니다. 각자 최대 500명이며 병력 상한을 넘지 않습니다."

leader_sargon_of_akkad_ability = "아카드 수비대"
leader_sargon_of_akkad_description = "활성 상태인 적 도시를 점령할 때 12칸 이내에 내 탑이 없으면, 그 범위 안에서 가장 가까운 유효한 내 땅에 1레벨 탑을 무료로 세웁니다. 점령한 도시당 한 번 발동합니다."

leader_mithridates_vi_ability = "티그라네스의 원군"
leader_mithridates_vi_description = "활성 도시를 가진 동맹이 있을 때 적을 향한 지상 공격을 시작한 지 3초 이상 지나 후퇴하면, 돌아온 병력만큼 원군을 얻습니다. 최대 1,000명이며 병력 상한까지만 충원됩니다. 경기당 한 번 발동합니다."

leader_gudit_yodit_ability = "악숨에서의 퇴각"
leader_gudit_yodit_description = "활성 상태인 적 도시를 점령하면, 이전 소유자가 플레이어를 공격하는 데 투입한 지상군 중 가장 큰 부대를 후퇴시킵니다. 점령한 도시당 한 번 발동합니다."

leader_khutulun_qaidu_ability = "말 위의 포획"
leader_khutulun_qaidu_description = "이미 나를 육상에서 공격 중인 적에게 지상 공격을 시작하면 첫 충돌에서 쓰러뜨린 적 병력의 20%를 병력 상한까지 예비군에 편입합니다."

leader_sor_juana_ines_de_la_cruz_ability = "부엌의 철학"
leader_sor_juana_ines_de_la_cruz_description = "농장 업그레이드를 완료하면 그 농장에서 12칸 이내에 있는 가장 가까운 내 도시의 진행 중인 업그레이드 남은 시간이 절반으로 줄어듭니다."

leader_sibylla_ability = "두 번째 왕관"
leader_sibylla_description = "활성 도시를 가진 상태에서 새 동맹을 맺으면, 새 동맹에게 활성 도시가 없을 때 그 동맹이 가장 먼저 건설을 시작한 미완성 도시가 즉시 완공됩니다. 경기당 한 번 발동합니다."

leader_cynethryth_mercia_ability = "쿠컴 협정"
leader_cynethryth_mercia_description = "적이 내 활성 농장 하나를 점령하면 12칸 이내에서 건설이 완료된 내 도시 중 레벨이 가장 낮은 도시가 한 레벨 오릅니다. 최대 4레벨이며 농장당 한 번 발동합니다."

leader_suppiluliuma_ability = "미탄니 협약"
leader_suppiluliuma_description = "동맹도 같은 적을 육상에서 공격하고 있을 때, 그 동맹 영토에 인접한 적 타일을 점령하면 아군 지상군의 병력 손실이 25% 감소합니다."

leader_baibars_ability = "크라크의 공병대"
leader_baibars_description = "가동 중인 적 탑을 점령하면, 그 탑에서 12칸 이내에 있는 같은 적의 가동 중인 탑 가운데 가동 레벨이 더 낮고 가장 가까운 탑을 무너뜨립니다. 경기마다 점령한 탑 하나당 한 번 발동합니다."

leader_emperor_qin_shi_huang_ability = "제국의 도량형"
leader_emperor_qin_shi_huang_description = "내 도시, 공장, 농장의 가동 레벨 합계가 각각 같고 0보다 큰 동안 공장의 금 생산량과 농장의 병력 생산량이 각각 25% 늘어납니다."

leader_spartacus_ability = "투리이의 무기고"
leader_spartacus_description = "지상군이 가동 중인 적 공장의 중심 칸을 점령하면 그 부대에 공장의 가동 레벨당 병력 300명이 합류합니다. 경기마다 공장 한 곳당 한 번 발동합니다."

leader_queen_nefertiti_ability = "아마르나의 탈라타트"
leader_queen_nefertiti_description = "도시에서 12칸 이내에 내 가동 중인 공장이 있으면 그 도시를 업그레이드하는 데 필요한 금이 35% 줄어듭니다."

leader_mandukhai_ability = "초원의 재통합"
leader_mandukhai_description = "상대의 남은 영토를 정복해 탈락시키면, 상대에게 남아 있던 예비 병력의 25%를 내 병력 한도까지 편입합니다."

leader_kabal_xook_ability = "야슈칠란의 전쟁 표장"
leader_kabal_xook_description = "가동 중인 도시가 있고 예비 병력이 750명 이상일 때, 동맹이 양측의 적을 상대로 새 지상 공격을 시작하면 예비 병력 750명을 그 공격에 보냅니다. 경기마다 동맹 한 명당 한 번 발동합니다."

leader_lakshmibai_ability = "칼피 보루"
leader_lakshmibai_description = "적이 마지막 가동 도시를 점령하면, 잃은 도시에서 24칸 이내의 자기 영토 중 가장 가까운 적합한 부지에 레벨 1 도시를 무료로 세운다. 경기마다 한 번."

leader_pharaoh_hatshepsut_ability = "푼트의 정원"
leader_pharaoh_hatshepsut_description = "내 상선이 외국 항구로 가는 항로를 완료하면, 출발 항구에서 12칸 이내의 내 완성된 농장 중 가장 낮은 레벨의 농장이 한 단계 오른다. 최대 레벨 4. 출발 항구마다 한 번."

leader_thusnelda_cherusci_ability = "포로가 되어도 굴하지 않다"
leader_thusnelda_cherusci_description = "적이 당신의 가동 레벨 2 이상 도시를 점령하면 완료 레벨이 한 단계 내려가고 진행 중인 업그레이드가 취소된다. 도시마다 한 번."

leader_queen_cartimandua_ability = "카라타쿠스 인도"
leader_queen_cartimandua_description = "적 육군이 당신의 영토에서 철수하면, 그 적을 공격 중인 육군이 가장 크고 예비 병력에 여유가 있는 동맹에게 생존 병력의 25%를 보낸다. 초과 병력은 적에게 돌아간다."

leader_queen_suriyothai_ability = "아유타야 호위대"
leader_queen_suriyothai_description = "적의 육군이 가동 중인 동맹 도시의 중심을 점령하려 할 때 예비군 1,500명을 써서 그 시도를 막고 공격 병력을 최대 1,500명 제거한다. 동맹 도시마다 한 번."

leader_tarabai_ability = "반격의 차우트"
leader_tarabai_description = "당신을 육상에서 공격 중인 적의 완성된 탑을 점령하면 상대가 가진 금의 25%를 최대 250까지 가져온다. 탑마다 한 번."

leader_natavan_ability = "슈샤의 샘"
leader_natavan_description = "자신의 도시가 레벨 2에 도달하면, 해당 도시에서 12칸 이내의 가장 가까운 건설 가능 지점에 레벨 1 농장을 무료로 건설한다."

leader_mavia_ability = "모세의 평화"
leader_mavia_description = "서로 육상 공격을 진행 중인 상대와 동맹을 맺으면 양측의 생존 공격 부대가 철수 손실 없이 각자의 병력 한도까지 복귀합니다."

leader_queen_nandi_ability = "엠킨디니의 소 떼"
leader_queen_nandi_description = "내 농장이 병력을 25% 더 생산합니다."

