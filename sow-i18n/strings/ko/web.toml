privacy_retention_body = "이벤트 파일 90 일 전에 자동 - 실패; 분석 카운터 및 회원은 90 일 이내에 키 TTL에 의해 만료됩니다. 배포는 절대로 라이브 상태를 닦지 않습니다. 계정과 역사는 귀하가 약관에 따라 삭제 또는 종료를 요청할 때까지 지속됩니다."
