leader_erendira_civilization = "푸레페차"
leader_tarenorerer_name = "Tarenorerer"
leader_tarenorerer_historical = "태즈메이니아 북부의 톰메긴네 여성 Tarenorerer는 납치되어 물개 사냥꾼들에게 팔린 뒤 1828년에 고향으로 돌아왔습니다. Australian Dictionary of Biography에 따르면, 그녀는 여러 집단의 남녀를 모아 총기 사용법을 훈련하고 침입해 온 정착민을 상대로 공격을 조직했습니다. 남아 있는 기록의 상당 부분은 특히 조지 오거스터스 로빈슨 같은 식민지 관찰자들이 남겼으므로, 그들의 표현과 그녀의 동기에 관한 주장은 신중하게 읽어야 합니다."
leader_tarenorerer_civilization = "톰메긴네 사람들"


leader_fredegunda_name = "프레데군트"
