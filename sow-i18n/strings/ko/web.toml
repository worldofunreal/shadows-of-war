leader_ivan_the_terrible_name = "이반 4세"
leader_ivan_the_terrible_historical = "이반 4세 바실리예비치(1530–1584)는 1547년 차르로 대관했다. 그의 통치기에 유급 상비군인 스트렐치가 창설되고 카잔과 아스트라한이 정복되었다. 이후 오프리치니나는 잔혹한 탄압을 낳았으며 역사적 평가는 지금도 논쟁적이다."
