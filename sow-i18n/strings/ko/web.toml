boudica_final_title = "마지막 전투"
boudica_final_body = "당신은 확대, 전투, 및 siege를 마스터했습니다. 패배 Suetonius Paulinus, 다음 메뉴로 돌아갑니다."
boudica_final_hint = "Defeat Paulinus, 그 후 메뉴로 돌아가기"
six_sky_ep1_landfall_title = "최근 댓글"
six_sky_ep1_landfall_body = "682 CE입니다. Wak Chanil Ajaw, 딸의 Dos Pilas, 규칙에 온다 Naranjo. 당신의 국경을 넘어 땅."
six_sky_ep1_landfall_hint = "확장하기 위해 땅을 탭"
six_sky_ep1_fire_title = "신성한 불"
six_sky_ep1_fire_body = "당신의 배경을 성장 - 모든 타일은 당신의 군대와 금 피드."
six_sky_ep1_fire_hint = "512 타일에 도달하기 위해 확장"
six_sky_ep1_blood_title = "첫 번째 혈액"
six_sky_ep1_blood_body = "작은 마을은 해안을 잡아. 공격을하고 첫 번째 라이벌을 복용하는 적의 경계로 드래그."
six_sky_ep1_blood_hint = "공격에 드래그 - 패배 1 적"
six_sky_ep1_villages_title = "빌리지 무릎"
six_sky_ep1_villages_body = "호수 마을은 새로운 dynasty's 이름을 배울 수 있어야합니다. 그들 모두를 따르십시오."
six_sky_ep1_villages_hint = "패배 4 마을"
six_sky_ep1_rival_title = "오래된 피"
six_sky_ep1_rival_body = "법적고지 Naranjo's old line denies your right. 라이벌 레이어 종료."
six_sky_ep1_rival_hint = "Rival Claimant의 패배"
six_sky_ep1_caracol_title = "차단기를 깰"
six_sky_ep1_caracol_body = "Caracol 뚱 베어 Naranjo 왕이 한 번 전에. 그것의 거룩한 가을해야합니다."
six_sky_ep1_caracol_hint = "딜레이 Caracol"
six_sky_ep1_vanguard_title = "Tikal아이의 눈"
six_sky_ep1_vanguard_body = "Tikal 그들의 밴 가드를 통해 시계. 앞으로 포스트를 가져 가라."
six_sky_ep1_vanguard_hint = "을 핥는 Tikal 밴 가드"
six_sky_ep1_queen_title = "여왕의 Naranjo"
six_sky_ep1_queen_body = "Tikal 근처에 자체 캠프. 그것을 끊고, 당신의 선은 안전합니다."
six_sky_ep1_queen_hint = "딜레이 Tikal"
six_sky_ep2_regent_title = "계정 관리"
six_sky_ep2_regent_body = "693 CE. 5 세 아들은 왕의 Naranjo, 그리고 당신은 그의 이름에 규칙. 확장 및 쇼 힘."
six_sky_ep2_regent_hint = "확장하기 위해 땅을 탭"
six_sky_ep2_provinces_title = "주 메뉴"
six_sky_ep2_provinces_body = "마을의 반란. 먼저 스트라이크 - 그들 앞에 두 개의 라이벌을 가져 가라."
six_sky_ep2_provinces_hint = "패배 2 적"
six_sky_ep2_uaxactun_title = "첫 번째 화재 : Uaxactun"
six_sky_ep2_uaxactun_body = "Uaxactun rebels. 그것의 defiance를 밖으로 굽기."
six_sky_ep2_uaxactun_hint = "딜레이 Uaxactun Rebels의 장점"
six_sky_ep2_yaxha_title = "두 번째 화재 : Yaxha"
six_sky_ep2_yaxha_body = "Yaxha 다음 상승. 힘 그것은 그것의 allegiance를 reaffirm."
six_sky_ep2_yaxha_hint = "딜레이 Yaxha Rebels의 장점"
six_sky_ep2_tayasal_title = "세 번째 화재 : Tayasal"
six_sky_ep2_tayasal_body = "보유할 수 없는 재원 Tayasal 수 없습니다. Naranjo."
six_sky_ep2_tayasal_hint = "딜레이 Tayasal Rebels의 장점"
six_sky_ep2_seibal_title = "제 4 불: Seibal"
six_sky_ep2_seibal_body = "Seibal's canoes는 반란 다운리버를 수행한다. 그것의 defiance를 침몰한다."
six_sky_ep2_seibal_hint = "딜레이 Seibal Rebels의 장점"
six_sky_ep2_caracol_title = "차단기 반환"
six_sky_ep2_caracol_body = "Caracol rebels를 뒤집습니다. 당신의 통치의 가장 오래된 부채를 해결하십시오."
six_sky_ep2_caracol_hint = "딜레이 Caracol"
six_sky_ep2_total_title = "Reaffirm 또는 굽기"
six_sky_ep2_total_body = "모든 이웃이 regency를 이해 할 때까지 승리를 유지하십시오."
six_sky_ep2_total_hint = "총 8개의 적을 패배"
six_sky_ep2_coalition_title = "연합의 틈"
six_sky_ep2_coalition_body = "Tikal 적에게 한 번의 연합을 모았습니다. 그것을 깨고 도시가 책임감을 의심하지 않습니다."
six_sky_ep2_coalition_hint = "을 핥는 Tikal 회사연혁"
six_sky_ep3_count_title = "긴 조사"
six_sky_ep3_count_body = "수년간 전설과 표적을 모두 만들었습니다. 한 번 더 확장하십시오."
six_sky_ep3_count_hint = "확장하기 위해 땅을 탭"
six_sky_ep3_offerings_title = "제품정보"
six_sky_ep3_offerings_body = "하나님과 군인 모두의 수요가 승리합니다. 사단과 가드를 먹이기 위해 두 개의 라이벌을 가져 가라."
six_sky_ep3_offerings_hint = "패배 2 적"
six_sky_ep3_unknown_title = "알 수없는 Enemy"
six_sky_ep3_unknown_body = "scribes 여전히 argue 에 곳 K'inichil Kab 규칙에서. 그것을 패배."
six_sky_ep3_unknown_hint = "딜레이 K'inichil Kab"
six_sky_ep3_caracol_title = "전쟁 호스트"
six_sky_ep3_caracol_body = "Caracol 전체 전쟁 호스트를 보내, 당신의 선에 대한 마지막 던지기. 그것을 파괴."
six_sky_ep3_caracol_hint = "을 핥는 Caracol 전쟁 호스트"
six_sky_ep3_hill_title = "더 힐"
six_sky_ep3_hill_body = "Xunantunich 언덕의 활에 잔류물이 없습니다. 언덕 활을 만드십시오."
six_sky_ep3_hill_hint = "딜레이 Xunantunich Rebels의 장점"
six_sky_ep3_moon_title = "달 여신"
six_sky_ep3_moon_body = "726 CE. 달 여신의 가치있는 훌륭한 도메인을 보유."
six_sky_ep3_moon_hint = "1,024 타일에 도달하는 확장"
six_sky_ep3_vanguard_title = "Vanguard 에 Dusk"
six_sky_ep3_vanguard_body = "Tikal's vanguard는 dusk에 옵니다. 그(것)들을 보여주세요 Stela 24 여왕."
six_sky_ep3_vanguard_hint = "을 핥는 Tikal 밴 가드"
six_sky_ep3_tribute_title = "트리 부티 드 Denied"
