analytics_title = "선택적 분석"
analytics_body = "Shadows of War 개선을 위해 사이트와 게임 이용 정보를 수집합니다. 허용하기 전까지 분석은 꺼져 있습니다."
cookies_analytics_events = "이벤트는 방문, 로딩, 메뉴, 튜토리얼 진행, 매치메이킹과 경기 시작·결과·명시적 종료를 기록합니다. 경기 세부 정보에는 고정된 범주와 대략적인 화면 크기 범주만 사용합니다. 이벤트 기록에는 이름, 계정/플레이어 ID, IP 필드, 경기/로비 ID, 채팅, 비밀번호, 구매 세부 정보, 원본 오류 문구, 지도 클릭 또는 전체 user-agent가 포함되지 않습니다."
cookies_analytics_server = "동의한 뒤 이벤트는 게임 릴레이를 거치지 않고 자사 /api/event 엔드포인트로만 전송됩니다. 각 이벤트는 현재 브라우저 세션에만 한정되는 임시 무작위 세션 ID를 사용합니다. 이벤트 기록에는 계정/플레이어 ID, 경기/로비 ID 또는 IP 주소가 포함되지 않습니다. 요청 IP는 별도의 기술 보안 로그에 남을 수 있습니다."
