[heroes]
leader_nafanua_name = "Nafanua"
leader_nafanua_historical = "사모아 구전 전승은 Nafanua를 전사이자 평화 시기에도 정치적 결정을 내린 지도자로 기억합니다. 최고 추장 칭호를 모았다는 이야기가 전해지지만, 동시대 기록으로 입증된 전기는 아닙니다."
leader_nafanua_civilization = "사모아"
rarity_common = "일반"
rarity_rare = "희귀"
rarity_epic = "에픽"
rarity_legendary = "전설"
leader_muhumuza_name = "무후무자"
leader_muhumuza_historical = "무후무자는 오늘날 르완다와 우간다 국경 양쪽에 걸친 은도르와와 키게지 고지대에서 저항을 이끌었다. 기록에 따라 무후무사로도 불린다. 그는 냐빙기의 영매로서 지역 공동체에 자리 잡은 신앙을 바탕으로 사람들을 모았다. 그가 조직한 추종자들은 무싱가 왕의 궁정과 유럽의 식민 지배 확대에 맞섰다."
leader_muhumuza_civilization = "냐빙기 운동"

leader_khosrow_i_name = "호스로 1세"
leader_khosrow_i_historical = "아누시르반으로도 알려진 호스로 1세는 531년부터 579년까지 사산 제국을 다스렸다. 그는 군을 네 지역 사령부로 재편했다. 남아 있는 인장은 동쪽과 남쪽, 서쪽과 북쪽을 맡은 장군들의 칭호를 전한다. 그는 아버지 카바드 1세 때 시작된 토지 조사도 계속하여 일정한 토지세를 부과하는 근거로 삼았다."
leader_khosrow_i_civilization = "사산 제국"

leader_naram_sin_name = "나람신"
leader_naram_sin_historical = "사르곤의 손자 나람신은 기원전 제3천년기에 아카드 제국을 다스렸다. 그의 승전비는 자그로스 산맥에서 룰루비를 상대로 벌인 원정을 기념한다. 부조에는 왕과 병사들이 비탈을 오르는 모습이 새겨져 있다. 왕은 다른 인물보다 크게 표현되며 신성을 나타내는 뿔 달린 투구를 썼다."
leader_naram_sin_civilization = "아카드 제국"

leader_jalal_al_din_mangburni_name = "잘랄 망부르니"
leader_jalal_al_din_mangburni_historical = "잘랄 앗딘 망부르니는 몽골의 침공으로 호라즘 제국이 무너지는 가운데 아버지 무함마드 2세의 뒤를 이었다. 가즈니에서 군대를 모아 1221년 파르완에서 몽골군을 물리쳤다. 칭기즈 칸은 그를 인더스강까지 추격했다. 잘랄 앗딘은 강가의 전투에서 패했지만 말을 타고 강을 건넜고 휘하 병력 일부도 맞은편 기슭에 도달했다."
leader_jalal_al_din_mangburni_civilization = "호라즘 제국"

leader_modu_chanyu_name = "묵특선우"
leader_modu_chanyu_historical = "묵특은 기원전 209년 무렵 선우가 되어 흉노를 동부 초원의 강국으로 키웠다. 사마천의 《사기》에 따르면 이웃 동호는 새 군주에게 잇따라 요구를 내밀었다. 묵특은 두 차례 양보했지만, 변경 초소 사이의 주민 없는 땅을 내놓으라는 요구는 거절하고 동호를 공격했다."
leader_modu_chanyu_civilization = "흉노"

leader_hiawatha_haudenosaunee_name = "하이어와사"
leader_hiawatha_haudenosaunee_historical = "하우데노쇼니 구전에서 하이어와사는 아이온와타라고도 불리며, 평화의 사자가 모호크, 오나이다, 오논다가, 카유가, 세네카 다섯 민족을 잇는 일을 도운 사람으로 기억된다. 오논다가의 이야기에서는 하이어와사가 슬픔에 잠겼을 때 평화의 사자가 조개 구슬을 꿴 왐펌을 들고 위로의 말을 건넸다. 이후 하이어와사는 여러 민족에 평화의 메시지를 전하는 데 힘을 보탰다. 다섯 민족이 연맹을 맺은 정확한 해는 알려지지 않았다. 연맹 자체의 설명도 특정 연도를 제시하지 않고 오래 전해 온 구전으로 이 일을 설명한다."
leader_hiawatha_haudenosaunee_civilization = "하우데노쇼니 연맹"

leader_kaahumanu_hawaii_name = "카아후마누"
leader_kaahumanu_hawaii_historical = "1819년 카메하메하 1세가 사망하자 카아후마누는 후계자인 리홀리호, 곧 카메하메하 2세와 통치권을 나누겠다고 선언했다. 그녀는 초대 쿠히나 누이가 되었다. 이 직책은 초기에는 토지 배분, 협정, 재판과 관련된 결정에서 국왕에 견줄 권한을 가졌다. 직책이 성문 헌법에 명시된 것은 그녀가 죽은 뒤인 1840년이었다. 리홀리호가 영국으로 떠난 뒤에도 카아후마누는 정무를 이어갔으며, 카우이케아울리가 카메하메하 3세가 되자 섭정을 맡았다. 1832년 사망할 때까지 통치에 관여했다. 1821년에는 카우아이섬의 통치자 카우무알리이와 결혼해 왕국과 그 섬의 관계에도 관여했다."
leader_kaahumanu_hawaii_civilization = "하와이 왕국"

leader_sargon_of_akkad_name = "사르곤"
leader_sargon_of_akkad_historical = "사르곤은 기원전 3000년대 후반 메소포타미아에 아카드 왕조를 세웠다. 그의 이름으로 새긴 왕실 비문은 우루크의 루갈자게시를 물리치고 우루크와 우르 같은 도시의 성벽을 허물었다고 기록한다. 루갈자게시를 사로잡아 엔릴 신전의 문으로 끌고 갔다는 기록도 있다. 이 글들은 왕의 승리를 기념하려고 만들어졌으며, 일부는 후대의 서기관들이 만든 필사본으로 전해진다. 비문은 아카드 출신 인물들이 정복지에서 통치자의 직책을 맡았다고도 말한다. 지방에 남아 있는 행정 문서와 함께 보면 도시가 왕국에 편입된 뒤에도 기존의 일상 행정이 일부 이어졌음을 알 수 있다."
leader_sargon_of_akkad_civilization = "아카드 제국"

leader_mithridates_vi_name = "미트리다테스 6세"
leader_mithridates_vi_historical = "미트리다테스 6세 에우파토르는 흑해 남쪽 연안의 폰토스를 다스렸다. 왕국의 영향력을 흑해 주변으로 넓혔으며 아나톨리아에서 로마와 맞섰다. 아르메니아 왕 티그라네스 2세는 그의 딸과 결혼했고 두 왕은 동맹을 맺었다. 제3차 미트리다테스 전쟁에서 로마 장군 루쿨루스가 그를 폰토스에서 몰아내자 미트리다테스는 티그라네스에게 몸을 의탁했다. 아피아노스의 기록에 따르면 두 왕은 아르메니아에서 병력을 모았고, 파르티아에도 사절을 보내 지원을 요청했다. 이후 티그라네스는 아르메니아 내륙으로 물러났고 미트리다테스는 자신에게 남아 있던 폰토스 영토로 향했다."
leader_mithridates_vi_civilization = "폰토스 왕국"

leader_gudit_yodit_name = "구디트"
leader_gudit_yodit_historical = "에티오피아 전승에서 구디트는 요디트라고도 불리며 악숨에 맞서 일어난 여왕으로 기억된다. 《알렉산드리아 총대주교사》에는 이름을 밝히지 않은 에티오피아 통치자가 10세기에 누비아의 게오르기오스 왕에게 도움을 요청한 이야기가 있다. 이 기록은 바니 알함위야의 여왕이 사람들을 포로로 잡고 도시를 불태우고 통치자를 여러 곳으로 쫓았다고 전한다. 원래의 편지는 남아 있지 않으며 그 내용은 교회사의 서술을 통해 전해진다. 교회사는 이 위기를 새 관구장 주교의 임명을 요청한 일과 연결한다. 이 일은 필로테오스가 알렉산드리아 총대주교로 있던 시기에 일어났다고 기록돼 있다. 게오르기오스가 요청을 전달하자 총대주교는 다니엘이라는 수도사를 관구장 주교로 보내 주었다고 한다."
leader_gudit_yodit_civilization = "에티오피아고원"

leader_khutulun_qaidu_name = "쿠툴룬"
leader_khutulun_qaidu_historical = "쿠툴룬은 중앙아시아에서 활동한 몽골의 공주이자 군 지휘관이었다. 아버지 카이두는 오고타이 가문의 세력을 이끌었고 쿠빌라이와 그 후계자들의 권위에 맞섰다. 카이두는 차가타이 가문의 군주와 협력했지만 두 가문은 중앙아시아에서 각각 별개의 기반을 가지고 있었다. 마르코 폴로는 쿠툴룬을 아이자루크라고 부르며, 원정 중 말을 달려 적진에 뛰어들어 상대 병사를 사로잡았다고 이야기한다. 구혼자들이 말을 걸고 그녀와 씨름을 했다는 이야기도 전한다. 대결의 결과나 말의 수를 다른 자료로 확인하기는 어렵다. 이러한 일화와 페르시아어 연대기에 실린 기록을 함께 살피면 그녀가 군대와 왕위 계승 문제에 어떻게 관여했는지 더 구체적으로 볼 수 있다."
leader_khutulun_qaidu_civilization = "카이두 울루스"

leader_sor_juana_ines_de_la_cruz_name = "소르 후아나"
leader_sor_juana_ines_de_la_cruz_historical = "소르 후아나 이네스 데 라 크루스는 17세기 누에바에스파냐의 작가이자 성 히에로니무스 수도회의 수녀였다. 출생 연도는 자료에 따라 1648년 또는 1651년으로 기록된다. 멕시코시티의 산헤로니모 수도원에서 생활하며 시와 희곡을 썼다. 종교극 《신성한 나르키소스》가 그중 하나다. 1690년에는 포르투갈 예수회 사제 안토니우 비에이라가 그리스도의 사랑에 대해 한 설교를 비판하는 글을 썼다. 푸에블라 주교 마누엘 페르난데스 데 산타 크루스는 그 글을 《아테나고라스 서한》이라는 제목으로 출판했다. 주교는 소르 필로테아 데 라 크루스라는 수녀 이름을 빌려 후아나에게 편지를 보내고, 공부와 저술의 방향을 바꾸라고 권했다."
leader_sor_juana_ines_de_la_cruz_civilization = "누에바에스파냐"

leader_sibylla_name = "시빌라"
leader_sibylla_historical = "시빌라는 예루살렘 국왕 아모리와 아녜스 드 쿠르트네의 딸이다. 왕위를 얻기 전에는 야파와 아스칼론의 백작령을 다스렸다. 첫 남편 몬페라토의 굴리엘모가 죽은 뒤에도 백작으로서 문서를 발행했다. 1177년 문서에는 아스칼론의 탑과 정원, 수입을 로드리고 백작과 그의 수도회 구성원에게 준 일이 기록되어 있다. 문서는 연간 수입을 네 차례에 나누어 지급하도록 정하고 시빌라의 인장과 증인으로 증여를 확인했다. 굴리엘모와의 사이에서 낳은 아들은 훗날 보두앵 5세가 되었다. 아들이 1186년에 죽자 시빌라는 자신의 상속권을 근거로 예루살렘의 왕위를 요구했다. 이복동생 이사벨도 왕위 계승권이 있어 귀족들의 지지는 갈렸다. 시빌라는 왕관을 쓰고 두 번째 남편 기 드 뤼지냥을 공동 통치자로 삼았다. 지지자들이 앞서 혼인을 끝내라고 요구했는지는 연대기마다 다르게 전한다."
leader_sibylla_civilization = "예루살렘 왕국"

leader_cynethryth_mercia_name = "키네스리스"
leader_cynethryth_mercia_historical = "키네스리스는 8세기 말 머시아의 왕비였고 나중에 쿠컴 수도원의 원장이 되었다. 오파의 재위기에 작성된 왕실 문서에서 증인으로 이름을 올렸으며, 그의 뒤를 이은 에그프리스의 어머니였다. 이름과 왕비 칭호가 새겨진 은화도 남아 있다. 왕비의 이름이 화폐에 등장하는 것은 앵글로색슨 시대 잉글랜드에서 매우 드문 일이었다. 케임브리지 피츠윌리엄 박물관이 기록한 주화 한 점에는 초상이 없고, 주화 제작자 에오바의 이름이 새겨져 있다. 목록에서는 이 주화를 캔터베리에서 제작한 것으로 분류하지만 주화에 제작지 이름이 적혀 있지는 않다. 다른 유형에는 초상이 새겨졌다. 에오바가 아닌 제작자의 이름이 들어간 것으로 보이는 주화도 뒤에 발견되었다. 이런 유물은 왕비의 이름이 공개적으로 유통됐음을 보여 주지만, 주화를 누가 주문했는지는 확실하지 않다."
leader_cynethryth_mercia_civilization = "머시아 왕국"

leader_suppiluliuma_name = "수필룰리우마 1세"
leader_suppiluliuma_historical = "기원전 14세기 수필룰리우마 1세는 아나톨리아의 하투사에서 히타이트를 다스리며 북부 시리아까지 세력을 넓혔다. 그는 알레포와 카르케미시를 두 아들에게 맡겼다. 유프라테스강가에 자리한 카르케미시를 맡은 피야실리는 샤리쿠수흐라는 이름으로도 알려져 있다. 미탄니의 왕위를 둘러싼 다툼이 벌어지자 수필룰리우마는 왕족 샤티와자를 지원했다. 피야실리는 샤티와자와 함께 군대를 이끌고 유프라테스강을 건너 이리테까지 진군했다. 샤티와자가 미탄니 왕이 되는 데에는 히타이트의 군사 지원이 중요한 역할을 했다. 이 지원으로 수필룰리우마는 강 건너 왕위 계승에 관여하고 강을 따라 늘어선 도시의 관할권도 조정할 수 있었다. 카르케미시와 미탄니는 서로 다른 통치자가 다스렸으며, 두 지역의 관계는 전쟁 뒤 맺은 조약에 구체적으로 담겼다."
leader_suppiluliuma_civilization = "히타이트 제국"

leader_baibars_name = "바이바르스"
leader_baibars_historical = "알자히르 바이바르스는 1260년부터 1277년까지 맘루크 술탄국을 통치했다. 루브르박물관에 있는 카이로의 금 디나르에는 그의 이름과 칭호가 새겨져 있다. 그의 원정으로 레반트에서 맘루크의 지배가 확대되었으며 1271년에는 구호기사단의 요새 크라크 데 슈발리에를 공격하는 연합군을 이끌었다. 이 전투는 당시 기록과 현장에 남은 요새를 통해 살펴볼 수 있다."
leader_baibars_civilization = "맘루크 술탄국"

leader_emperor_qin_shi_huang_name = "영정"
leader_emperor_qin_shi_huang_historical = "영정으로 태어난 진시황은 기원전 221년 진나라가 마지막 경쟁국을 정복한 뒤 첫 황제의 칭호를 썼다. 그의 정부는 기존 진나라의 도량형 기준을 정복한 지역에도 적용했다. 현재 남은 저울추와 곡식을 재는 그릇의 명문은 이 개혁이 구체적으로 어떤 물건에 기록됐는지 보여 준다. 진은 화폐와 문자도 통일하는 정책을 시행했다."
leader_emperor_qin_shi_huang_civilization = "진나라"

leader_spartacus_name = "스파르타쿠스"
leader_spartacus_historical = "스파르타쿠스는 트라키아 출신 검투사로, 기원전 73년 카푸아에서 시작된 반란의 지도자 가운데 한 사람이었다. 플루타르코스는 집단 탈출 계획이 드러나자 탈출에 성공한 이들이 부엌 도구를 무기로 삼고 길에서 수레에 실린 무기를 빼앗았다고 전한다. 아피아노스는 일행이 도중에 무기를 얻고 베수비오산으로 피했다고 기록했다. 탈출한 사람의 수와 초기 이동의 세부 사항은 두 기록에서 차이를 보인다."
leader_spartacus_civilization = "스파르타쿠스 반란군"

leader_queen_nefertiti_name = "네페르티티"
leader_queen_nefertiti_historical = "네페르티티는 고대 이집트 제18왕조에서 아케나텐의 대왕비였다. 오늘날 아마르나라 불리는 아케트아텐에서 그는 태양 원반 아텐을 섬기는 의례에 참여했다. 페트리 박물관이 소장한 붉은 규암 조각에는 태양빛 아래에서 액체 제물을 붓는 그의 모습이 새겨져 있다. 다른 석재 조각에는 아케나텐, 네페르티티, 그들의 딸 메리타텐이 제물을 올리는 탁자 앞에 서 있다. 이 자료들에는 왕비가 직접 제물을 바치는 모습과 왕실 가족이 함께 의례에 참여하는 모습이 모두 남아 있다."
leader_queen_nefertiti_civilization = "고대 이집트"

leader_mandukhai_name = "만두하이 하툰"
leader_mandukhai_historical = "만두하이 하툰은 15세기 후반 몽골에서 정치와 군사에 영향력을 행사했다. 만둘 칸이 죽은 뒤 이어진 계승 분쟁은 칭기즈 칸의 혈통이 권위를 회복하는 과정과 맞물렸다. 만두하이는 다얀 칸과 관련된 이 과정에서 중요한 역할을 맡았다. 후대 몽골 연대기는 그가 직접 오이라트 원정을 이끌었다고 전한다. 당시의 중국 기록과 후대의 몽골 기록은 즉위와 군사 행동의 구체적인 순서에 대해 차이를 보인다."
leader_mandukhai_civilization = "북원"

leader_kabal_xook_name = "카발 쇼크"
leader_kabal_xook_historical = "카발 쇼크는 오늘날 멕시코 치아파스주 우수마신타강 기슭의 마야 도시 야슈칠란 왕실 인물이었다. 통치자 이참나흐 발람의 주요 배우자 중 한 명이었던 그는 서기 726년에 23호 건물을 봉헌했다. 도시는 강이 크게 굽는 곳에 자리하고 있으며 건물들은 강가의 단구와 그보다 높은 곳에 놓여 있다. 23호 건물의 세 출입구 위에는 오늘날 24번, 25번, 26번으로 부르는 돌 인방이 있었다. 비문에는 그의 이름이 나오며, 부조들은 서로 다른 의례 장면에 그의 모습을 새겼다."
leader_kabal_xook_civilization = "야슈칠란"

leader_lakshmibai_name = "락슈미바이"
leader_lakshmibai_historical = "잔시의 라니 락슈미바이는 강가다르 라오가 죽은 뒤 동인도 회사가 자신의 나라를 병합하려 하자 반대했다. 회사는 두 사람의 양자를 후계자로 인정하지 않았다. 1857~1858년 인도 봉기에서 락슈미바이는 휴 로즈의 군대에 맞서 잔시의 방어를 이끌었다. 1858년 영국군이 잔시를 점령하자 그녀는 탈출했고, 칼피에서 타티아 토페와 관련된 부대를 비롯한 다른 반군과 합류했다. 칼피가 함락된 뒤 반군은 괄리오르로 향했다. 영국 국립 육군 박물관의 기록에 따르면 6월 1일 모라르에서 현지 군주의 병력 일부가 반군 편으로 돌아섰다. 락슈미바이는 전투를 이어 갔고, 1858년 6월 괄리오르 근처에서 사망했다."
leader_lakshmibai_civilization = "잔시"

leader_pharaoh_hatshepsut_name = "하트셉수트"
leader_pharaoh_hatshepsut_historical = "하트셉수트는 기원전 15세기 이집트 제18왕조를 다스렸다. 처음에는 어린 조카이자 의붓아들인 투트모세 3세를 대신해 섭정했다. 이후 파라오의 칭호와 권한을 얻었고 투트모세 3세는 공동 통치자로 남았다. 그녀가 지시한 건축물 가운데 데이르 엘바흐리의 계단식 장제전이 있다. 가운데 층 남쪽 주랑의 부조에는 그녀가 푼트로 보낸 원정대가 현지 사람들을 만나고 물건을 배에 싣는 모습이 남아 있다. 신전에서 이 원정은 왕권과 종교 의례의 맥락에서 기념되었다. 조사단은 원정과 아문 신의 신탁을 연결하는 비문도 소개한다."
leader_pharaoh_hatshepsut_civilization = "고대 이집트"

leader_thusnelda_cherusci_name = "투스넬다"
leader_thusnelda_cherusci_historical = "투스넬다는 기원후 1세기 초 케루스키족 귀족 여성이었다. 아버지 세게스테스는 로마의 지원을 구했고 남편 아르미니우스는 로마에 맞선 저항을 이끌었다. 로마 역사학자 타키투스에 따르면 15년 아르미니우스의 군대가 세게스테스를 포위하자, 세게스테스는 게르마니쿠스에게 구원을 요청했다. 로마군이 포위를 풀었고, 임신 중이던 투스넬다는 로마 측에 넘겨졌다. 타키투스가 기록한 연설에서 세게스테스는 딸이 자의로 그곳에 머문 것이 아니었다고 말했다. 타키투스는 그녀가 붙잡힌 뒤에도 애원하지 않고 자신의 배를 바라봤다고 그렸다. 이 장면은 로마 저술가의 서술을 통해 전해진다."
leader_thusnelda_cherusci_civilization = "케루스키족"

leader_queen_cartimandua_name = "카르티만두아"
leader_queen_cartimandua_historical = "카르티만두아는 기원후 1세기에 오늘날 잉글랜드 북부에 살던 브리간테스족을 다스렸다. 그녀의 통치를 다룬 주요 기록은 로마 역사학자 타키투스가 남겼다. 51년 로마에 저항하던 지도자 카라타쿠스는 패전 뒤 카르티만두아에게 피신했다. 카르티만두아는 그를 붙잡아 로마 측에 넘겼다. 타키투스는 포로가 로마로 끌려가 클라우디우스 황제 앞에 선 일도 기록했다. 그는 카르티만두아와 베누티우스의 갈등도 전한다. 69년 로마가 내부 혼란을 겪는 동안 베누티우스가 공격했고, 카르티만두아는 로마의 지원을 요청했다. 로마군은 그녀를 구했지만 왕위는 베누티우스에게 돌아갔다."
leader_queen_cartimandua_civilization = "브리간테스족"

leader_queen_suriyothai_name = "수리요타이"
leader_queen_suriyothai_historical = "수리요타이는 마하 차크라팟이 다스리던 아유타야의 왕비였다. 아유타야 주가 사용하는 연대에서 1548년에 일어난 일로 보는 버마 왕 타빈슈웨티의 침공 이야기에서 기억된다. 왕실 연대기의 전승에 따르면 왕비는 코끼리를 타고 군대에 합류했다. 왕이 위험해지자 자신의 코끼리를 왕과 적장 사이로 몰았고, 전투에서 치명상을 입었다. 이 이야기는 왕비가 전장에서 내린 결정이 왕과 군대에 영향을 주었다고 전한다. 전투의 세부 묘사는 후대에 정리된 아유타야 기록을 통해 주로 전해진다."
leader_queen_suriyothai_civilization = "아유타야 왕국"

leader_tarabai_name = "타라바이"
leader_tarabai_historical = "타라바이(1675~1761)는 1700년 라자람이 죽은 뒤 어린 아들 시바지를 대신해 마라타의 섭정이 됐다. 타라바이는 지휘관들을 조율하고 무굴 황제 아우랑제브의 군대에 맞서 요새들을 방어했다. 사타라 지방지는 그녀가 파라슈람 트림바크에게 요새의 감독을 맡겼다고 전한다. 역사학자 리처드 이튼은 마라타의 주요 요새가 포위되는 중에도 타라바이가 북쪽의 무굴 영토로 병력을 보냈다고 설명한다. 방어와 원정을 함께 이어 간 결과 무굴군은 요새에 병력을 쓰면서 다른 지역의 위협에도 대응해야 했다. 1707년 아우랑제브가 죽은 뒤 왕위 주장자 샤후가 돌아오면서 마라타 왕실 내부에서 계승권 분쟁이 시작됐다."
leader_tarabai_civilization = "마라타 제국"

leader_natavan_name = "나타반"
leader_natavan_historical = "후르시드 바누 나타반은 슈샤 출신의 아제르바이잔 시인이자 후원자였다. 1897년에 세상을 떠났으며, 출생 연도는 자료에 따라 1830년과 1832년 등으로 다르게 기록된다. 아버지 메흐디굴루 칸은 카라바흐의 마지막 칸이었다. 나타반은 물려받은 자원을 주민을 위한 사업과 문화 활동에 썼다. 1872년에는 슈샤의 시인들이 모이는 마즐리스이 운스를 이끌었다. 이 모임의 시인들은 다른 지역의 문학 모임과도 교류했다. 나타반은 가잘과 애가를 썼고, 일부 작품은 후대의 시집에 실렸다. 직접 그림을 그린 앨범도 남아 있다."
leader_natavan_civilization = "카라바흐"

leader_mavia_name = "마비아"
leader_mavia_historical = "마비아 또는 마위야는 로마 동부 국경의 아랍 공동체를 이끌었으며 4세기 후반에 제국과 평화 협정을 맺었다."
leader_mavia_civilization = "타누흐 아랍인"

leader_queen_nandi_name = "난디"
leader_queen_nandi_historical = "난디 카베베(1764년경–1827년)는 엘랑게니 공동체 출신으로, 아들 샤카가 줄루의 통치자가 된 뒤 왕태후가 되었다."
leader_queen_nandi_civilization = "줄루 왕국"

