terms_liability_title = "책임의 한계"
terms_liability_body = "최대의 비용으로, 우리는 대출에 의해 제한되지 않습니다, 대출 DATA, LOST ITEMS 또는 장점, 또는 어떤 보험 또는 계약. 우리의 탄수화물 책임은 $ 50의 GREATER에 적용되며, 당신은 SIX MONTHS에 VIRTUAL ITEMS에 대해 사과."
