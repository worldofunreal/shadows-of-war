terms_license_no_sell = "공식 호스팅 서비스, 계정 또는 가상 아이템을 판매, 대여, 재허가하거나 상업적으로 이용하지 마세요."
terms_license_no_reverse = "공식 호스팅 서비스에 대해 역설계, 스크래핑, 대량 추출 또는 모델 학습을 하지 마세요. 이러한 제한은 코드 및 지도 라이선스가 부여하는 권리를 축소하지 않습니다."
terms_license_feedback = "공유하신 피드백은 보상이나 작성자 표시 없이 자유롭게 사용할 수 있습니다."
