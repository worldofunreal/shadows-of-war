privacy_rights_after = "게임 계정 ID (또는 이름 + 대략적인 생성 날짜)로. 검증된 삭제는 계정, ID 매핑, 메타데이터 거울 및 분석 멤버십을 지우기 — 당신에 다시 확인했습니다. GPC는 판매/축구 선택으로 명예를 줬습니다 (우리는 판매하거나 공유하지 않습니다, 그래서 아무것도 toggles). 응답에 의하여 Appeals; 응답에 의하여 45 일 안에 응답."
privacy_security_title = "보안, 전송, 변경"
privacy_security_body = "전송 중 TLS, 로컬에서만 접근하는 내부 구성요소, 보호된 운영 엔드포인트, 해시된 소유권 비밀을 사용하지만 절대적인 보안은 보장할 수 없습니다. 인프라는 데이터 최소화 원칙에 따라 미국과 EU에서 운영되며 광고 기술로 데이터를 이전하지 않습니다. 개인정보 처리방침의 중요한 변경은 시행 전에 눈에 띄게 알리고, 법률상 필요한 경우 별도로 동의를 받습니다. 계속 이용하는 것만으로 동의한 것으로 보지 않습니다."
