terms_arbitration_title = "분쟁 및 중재"
terms_arbitration_before = "분쟁은 45 일 통지 - 법원이 아닌 45 일 통지 - 후 개별 중재 (JAMS, 델라웨어)를 통해 이동. 당신은 배심하고 수업 활동 권리. 소소매 및 IP 침해는 제외됩니다. 당신은 이메일에 의해이 약관을 수락하여 30 일 이내에 중재를 선택 할 수 있습니다"
terms_arbitration_after = "계정 ID와 명확한 선택 아웃 문으로."
terms_general_title = "의 의"
terms_general_before = "본 약관에는 델라웨어주 법률이 적용되며, 중재 대상이 아닌 청구는 델라웨어주 법원에서만 다룹니다. 중요한 변경은 시행 전에 눈에 띄게 알립니다. 적용 법률상 재동의가 필요하면 별도로 요청합니다. 연락처: World of Unreal —"
