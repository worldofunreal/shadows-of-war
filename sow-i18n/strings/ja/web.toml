privacy_analytics_body_v2 = "当サイトとブラウザーゲームの任意の自社分析は、許可した後にのみ動作します。ゲームを始めただけでは有効になりません。訪問、読み込み、メニュー、チュートリアル、ロビー、試合開始・終了の限定されたイベントに加え、ビルド、言語、画面サイズの大まかな区分を記録します。端末の完全なフィンガープリントは作成しません。アカウントIDがある場合、保存前にサーバーでこのチャネル専用の鍵付き仮名に置き換えます。名前、メッセージ、パスワード、広告ID、マップのクリックは記録しません。参照元タグ付きのリンク（例: ?ref=reddit）から訪れた場合、その短いタグも記録されます。"
