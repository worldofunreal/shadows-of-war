[heroes]
leader_muhumuza_name = "ムフムザ"
leader_muhumuza_historical = "ムフムザは、現在のルワンダとウガンダの国境をまたぐンドルワとキゲジの高地で抵抗運動を率いた。記録によってはムフムサとも記される。ニャビンギの霊媒として、地域に根付いていた信仰をもとに支持者を集めた。彼女はムシンガ王の宮廷と、ヨーロッパ諸国による植民地支配の拡大に対抗した。"
leader_muhumuza_civilization = "ニャビンギ運動"

leader_khosrow_i_name = "ホスロー1世"
leader_khosrow_i_historical = "アヌーシールワーンとも呼ばれるホスロー1世は、531年から579年までサーサーン朝を治めた。軍を四つの方面軍に再編し、東、南、西、北をそれぞれ担当する司令官を置いた。現存する印章には各方面を担当した軍人の称号が残る。父カワード1世の時代に始まった土地調査も引き継ぎ、地税を定額で賦課する基礎とした。"
leader_khosrow_i_civilization = "サーサーン朝"

leader_naram_sin_name = "ナラム・シン"
leader_naram_sin_historical = "サルゴンの孫ナラム・シンは、紀元前第三千年紀にアッカド帝国を治めた。ザグロス山地のルルビに対する遠征を記念した勝利の石碑が残る。浮彫には、兵士たちとともに斜面を登る王が描かれている。王はほかの人物よりも大きく、神性を表す角の付いた兜を着けている。"
leader_naram_sin_civilization = "アッカド帝国"

leader_jalal_al_din_mangburni_name = "ジャラールッディーン・マンカブティー"
leader_jalal_al_din_mangburni_historical = "ジャラールッディーンはモンゴル軍がホラズム・シャー朝を切り崩すなかで、父ムハンマド2世の後を継いだ。ガズニに兵を集め、1221年にパルワーンでモンゴル軍の一隊を破った。チンギス・ハンにインダス川まで追われて戦いに敗れたが、馬で川を渡って逃れ、配下の一部も対岸にたどり着いた。"
leader_jalal_al_din_mangburni_civilization = "ホラズム・シャー朝"

leader_modu_chanyu_name = "冒頓単于"
leader_modu_chanyu_historical = "冒頓は紀元前209年ごろ単于となり、匈奴を東部草原の強国に育てた。司馬遷の『史記』によれば、隣国の東胡は新しい君主に次々と要求を突きつけた。冒頓は二度譲歩したが、国境の砦の間にある無人地帯を求められると、これを拒んで東胡を攻めた。"
leader_modu_chanyu_civilization = "匈奴"

leader_hiawatha_haudenosaunee_name = "ハイアワサ"
leader_hiawatha_haudenosaunee_historical = "ハウデノサウニーの口承では、ハイアワサはアイオンワサとも呼ばれ、ピースメーカーがモホーク、オナイダ、オノンダガ、カユーガ、セネカの五つのネーションを結びつけるのを助けた。オノンダガの伝承によると、悲しみに沈んでいたハイアワサに、ピースメーカーは彼の貝の玉を連ねたワンパムを手にして慰めの言葉をかけた。その後、ハイアワサは平和の知らせを各ネーションに伝えるのを助けた。五つのネーションが結びついた正確な年は分かっていない。連邦自身の説明も特定の年を挙げず、出来事を長く伝えられてきた口承として扱っている。"
leader_hiawatha_haudenosaunee_civilization = "ハウデノサウニー連邦"

leader_kaahumanu_hawaii_name = "カアフマヌ"
leader_kaahumanu_hawaii_historical = "一八一九年にカメハメハ一世が死去すると、カアフマヌは後を継ぐリホリホ、すなわちカメハメハ二世と統治を分かち合うと宣言した。彼女はクヒナ・ヌイの初代となった。初期のこの職は、土地の配分や協定、裁判について国王に匹敵する権限を持っていた。職務が成文憲法に定められたのは、彼女の死後の一八四〇年である。クヒナ・ヌイの職は彼女の死後も残り、初期には高い位にあった女性の首長たちが受け継いだ。リホリホが英国へ出発した後もカアフマヌは政務を続け、カウイケアオウリがカメハメハ三世になるとその摂政を務めた。一八三二年に死去するまで統治に携わった。また、カウアイ島の統治者カウムアリイと一八二一年に結婚し、王国と同島の関係にも関わった。"
leader_kaahumanu_hawaii_civilization = "ハワイ王国"

leader_sargon_of_akkad_name = "アッカドのサルゴン"
leader_sargon_of_akkad_historical = "サルゴンは紀元前三千年紀の後半にメソポタミアでアッカド王朝を開いた。彼の名で刻まれた王碑文には、ウルクのルガルザゲシを破り、ウルクやウルなどの都市の城壁を取り壊したと記されている。捕らえたルガルザゲシをエンリルの神殿の門まで連れていったという叙述もあり、勝利が宗教的な権威と結びつけられたことが分かる。これらの文章は王の勝利を記念するためのもので、後世の書記が写した形で伝わるものもある。碑文には、征服地でアッカドの人々が統治を任されたことも記される。地方に残る行政文書を合わせて読むと、都市が王国に組み込まれても従来の実務が一部続いたことが見えてくる。新しい王権が各都市にどのように関与したかは、都市ごとの資料から確かめる必要がある。アダブの文書には、地方の統治者がアッカドへ出向いた記録もある。"
leader_sargon_of_akkad_civilization = "アッカド帝国"

leader_mithridates_vi_name = "ミトリダテス6世"
leader_mithridates_vi_historical = "ミトリダテス六世エウパトルは、黒海南岸のポントスを治めた王である。黒海の周辺に勢力を伸ばし、アナトリアでローマと対立した。アルメニア王ティグラネス二世はミトリダテスの娘をめとり、両者は同盟を結んだ。第三次ミトリダテス戦争でローマの将軍ルクッルスにポントスを追われたミトリダテスは、ティグラネスのもとに身を寄せた。アッピアノスによると、二人の王はアルメニアで兵を集め、パルティアにも援助を求める使節を送った。ローマ側もパルティアへ使節を送り、相手の動きに対抗した。やがてティグラネスはアルメニアの奥地に退き、ミトリダテスはポントスに残った領土へ向かった。"
leader_mithridates_vi_civilization = "ポントス王国"

leader_gudit_yodit_name = "グディト"
leader_gudit_yodit_historical = "エチオピアの伝承では、グディトはヨディトとも呼ばれ、アクスムに反旗を翻した女王として記憶されている。『アレクサンドリア総主教史』には、名の記されていないエチオピアの統治者が、十世紀にヌビア王ゲオルギオスへ助けを求めた話がある。バニー・アルハムウィーヤの女王が住民を捕らえ、町に火を放ち、統治者を各地へ追いやったという。手紙の原本は残っておらず、内容は教会史の叙述を通じて伝わる。この史書は、危機と新しい府主教の任命を求めたことを結びつけている。アレクサンドリアの総主教がフィロテオスだった時期の話として記されている。ゲオルギオスが要請を取り次ぎ、総主教がダニエルという修道士を府主教に任じて派遣したとされる。"
leader_gudit_yodit_civilization = "エチオピア高原"

leader_khutulun_qaidu_name = "クトゥルン"
leader_khutulun_qaidu_historical = "クトゥルンは中央アジアで活動したモンゴルの王女であり、部隊を率いた指揮官でもあった。父のカイドゥはオゴデイ家の勢力を中央アジアで率い、クビライやその後継者の権威に対抗した。カイドゥはチャガタイ家の君主と協力したが、それぞれの家には独自の勢力基盤があった。父と長く協力したドゥアは、のちにオゴデイ家の後継者を決めるうえで大きな力を持った。マルコ・ポーロは彼女をアイジャルクと呼び、遠征の際に馬で敵陣に駆け込み、捕らえた兵を連れ帰ったと伝える。また、求婚者が馬を賭けて彼女と組み打ちをしたという話も書いている。試合の勝敗や馬の数を独立した史料で確認することは難しい。ポーロの物語と、同時代に近いペルシア語の年代記が伝える軍事活動を見比べると、彼女がどのような立場で戦ったかを考える手がかりになる。"
leader_khutulun_qaidu_civilization = "カイドゥのウルス"

leader_sor_juana_ines_de_la_cruz_name = "ソル・フアナ・イネス・デ・ラ・クルス"
leader_sor_juana_ines_de_la_cruz_historical = "ソル・フアナ・イネス・デ・ラ・クルスは十七世紀のヌエバ・エスパーニャで活動した作家であり、聖ヒエロニムス会の修道女であった。生年には一六四八年と一六五一年の二つの説がある。メキシコ市のサン・ヘロニモ修道院に住み、詩や戯曲を書いた。宗教劇『神なるナルキッソス』もその一つである。一六九〇年には、ポルトガルのイエズス会士アントニオ・ヴィエイラがキリストの愛について述べた説教を取り上げ、批評を書いた。プエブラ司教マヌエル・フェルナンデス・デ・サンタ・クルスは、その批評を『アテナゴラス書簡』として刊行した。司教はソル・フィロテア・デ・ラ・クルスという修道女の名を使い、彼女の学問と著述について忠告を送った。"
leader_sor_juana_ines_de_la_cruz_civilization = "ヌエバ・エスパーニャ"

leader_sibylla_name = "エルサレムのシビーユ"
leader_sibylla_historical = "シビーユはエルサレム王アモーリーとアニェス・ド・クルトネーの娘である。即位前にはヤッファとアスカロンの伯領を治めた。最初の夫ギヨーム・ド・モンフェラートの死後、彼女自身が出した一一七七年の文書には、アスカロンの城壁の塔や庭園、収入をロドリゴ伯とその修道会の兄弟たちに授けたことが記されている。この文書は支払いを年に四度に分けることを定め、証人と彼女の印章によって寄進を確認している。ギヨームとの間に生まれた息子は後にボードゥアン五世となった。息子が一一八六年に亡くなると、シビーユは自らの継承権によってエルサレムの王冠を求めた。異母妹イザベルにも継承権があり、王国内で支持が分かれた。シビーユは王位を得て、二番目の夫ギー・ド・リュジニャンを共同統治者に選んだ。彼女の支持者が先に婚姻の解消を求めたかについては、年代記の伝える内容が一致していない。"
leader_sibylla_civilization = "エルサレム王国"

leader_cynethryth_mercia_name = "キュネスリス"
leader_cynethryth_mercia_historical = "キュネスリスは八世紀末のマーシアの王妃で、後にクッカムの修道院長となった。オッファ治世の王室文書に立会人として名があり、オッファを継いだエグフリスの母でもある。彼女の名と王妃の称号が刻まれた銀貨が残る。王妃の名を持つこのような貨幣は、アングロサクソン期のイングランドでは例外的な存在だった。ケンブリッジのフィッツウィリアム博物館が記録する銀貨の一枚は、肖像がない型で、貨幣職人エオバの名が読める。目録は鋳造地をカンタベリーとしているが、貨幣に鋳造地名は刻まれていない。別の型には肖像がある。エオバはケントの王たちの貨幣も作った。後に見つかった別の二枚から、彼とは異なる職人もキュネスリスの貨幣を作った可能性が指摘されている。銀貨は彼女の称号が広く目に触れたことを示すが、誰が発行を命じたかは確定していない。"
leader_cynethryth_mercia_civilization = "マーシア王国"

leader_suppiluliuma_name = "シュッピルリウマ1世"
leader_suppiluliuma_historical = "紀元前十四世紀、シュッピルリウマ一世はアナトリアのハットゥシャからヒッタイトを治め、シリア北部に勢力を伸ばした。アレッポとカルケミシュには自分の息子たちを置いた。ユーフラテス川沿いのカルケミシュを任されたのは、シャッリ・クシュフとも呼ばれるピヤッシリである。ミタンニで王位をめぐる争いが起こると、シュッピルリウマは王族のシャッティワザを支援した。ピヤッシリはシャッティワザと軍を進め、ユーフラテス川を越えてイリテに到達した。この行動は、ヒッタイトが川の向こう側の王位継承にどのように関与したかを示している。シャッティワザはヒッタイトの軍事力を後ろ盾にミタンニ王となり、両者の関係が条約に定められた。"
leader_suppiluliuma_civilization = "ヒッタイト帝国"

leader_baibars_name = "バイバルス"
leader_baibars_historical = "アル＝ザーヒル・バイバルスは1260年から1277年までマムルーク朝を治めた。ルーヴル美術館が所蔵するカイロ由来の金貨には、その名と称号が刻まれている。彼の遠征でマムルーク朝の支配はレヴァントに広がり、1271年には聖ヨハネ騎士団が守るクラック・デ・シュヴァリエに対する連合軍を率いた。城に残る構造物と当時の文献は、この遠征を異なる角度から伝える。"
leader_baibars_civilization = "マムルーク朝"

leader_emperor_qin_shi_huang_name = "始皇帝"
leader_emperor_qin_shi_huang_historical = "秦の王であった嬴政は、紀元前221年に最後の敵国を滅ぼし、最初の皇帝となった。その政権は秦で用いていた重さや容量などの基準を征服した地域にも広げた。今に残る分銅や升の銘文には、この改革に関わる命令が刻まれている。秦では貨幣や文字についても共通の規格が広められた。"
leader_emperor_qin_shi_huang_civilization = "秦"

leader_spartacus_name = "スパルタクス"
leader_spartacus_historical = "スパルタクスはトラキア出身の剣闘士で、紀元前73年にカプアで始まった反乱の指導者の一人だった。プルタルコスによると、集団で脱出する計画が漏れたあと、逃げ出した一部の剣闘士は台所の道具を武器とし、途中で輸送中の武器を奪った。アッピアノスは、逃亡者たちが道中で武器を手に入れ、ウェスウィウス山に身を寄せたと記す。脱出した人数と初期の行動には記録によって違いがある。"
leader_spartacus_civilization = "スパルタクスの反乱軍"

leader_queen_nefertiti_name = "ネフェルティティ"
leader_queen_nefertiti_historical = "ネフェルティティは古代エジプト第十八王朝の王アクエンアテンの大王妃だった。現在アマルナと呼ばれるアケトアテンで、彼女は太陽円盤アテンの祭祀に目立つ役割を果たした。ペトリー博物館が所蔵する赤色珪岩の断片には、彼女が太陽の光の下で神酒を注ぐ姿が刻まれている。別の石の断片には、王と王妃、その娘メリトアテンが供物台の前に立つ場面が残る。王妃が自ら供物を捧げる場面と、家族で祭祀を行う場面がともに伝わっている。"
leader_queen_nefertiti_civilization = "古代エジプト"

leader_mandukhai_name = "マンドフイ・ハトゥン"
leader_mandukhai_historical = "マンドフイ・ハトゥンは、十五世紀後半のモンゴルで政治と軍事の権力を持った。マンドゥール・ハンの死後、ダヤン・ハンと結び付けられる継承争いの中で、チンギス・ハンの一族が権威を回復するのに関わった。後世のモンゴル語の年代記は、彼女がオイラトへの遠征を率いたと伝える。継承と遠征の具体的な順序については、成立時期や言語の異なる史料の間で食い違いがある。"
leader_mandukhai_civilization = "北元"

leader_kabal_xook_name = "カバル・ショーク"
leader_kabal_xook_historical = "カバル・ショークは、現在のメキシコ、チアパス州のウスマシンタ川沿いに栄えたマヤの都市ヤシュチランの王族で、王イツァムナーフ・バラムの主要な妃の一人だった。ヤシュチランは川が大きく曲がる地点にあり、建物は河岸の段丘やその上の高所に築かれた。研究者は、カバル・ショークが建造物23を奉献したのは西暦726年と考えている。建物の三つの入口の上には、現在24、25、26と番号を付けられたまぐさ石が据えられていた。銘文には彼女の名があり、彫刻はそれぞれ異なる儀礼の場面に彼女を描いている。"
leader_kabal_xook_civilization = "ヤシュチラン"

leader_lakshmibai_name = "ラクシュミー・バーイー"
leader_lakshmibai_historical = "ジャーンシーのラーニーであるラクシュミー・バーイーは、ガンガーダル・ラーオの死後、東インド会社による国の併合に反対した。会社は二人の養子を後継者として認めなかった。この争いは、誰が家を継ぐかとともに、誰がジャーンシーを統治するかをめぐるものだった。1857年から1858年にかけてのインドの反乱では、ヒュー・ローズの軍に対するジャーンシーの防衛を指揮した。1858年にイギリス軍がジャーンシーを占領すると、彼女は脱出し、カルピーでターンティヤー・トーペーに連なる部隊など、ほかの反乱軍と合流した。カルピーが陥落したあと、反乱軍はグワーリヤルへ向かった。英国国立陸軍博物館によれば、六月一日にモーラールで現地の君主に仕える部隊が反乱側に加わった。彼女は戦いを続け、1858年六月にグワーリヤル付近で亡くなった。ジャーンシー、カルピー、グワーリヤルという場所をたどると、拠点を失ったあとの戦いが見えてくる。"
leader_lakshmibai_civilization = "ジャーンシー"

leader_pharaoh_hatshepsut_name = "ハトシェプスト"
leader_pharaoh_hatshepsut_historical = "ハトシェプストは紀元前十五世紀、エジプト第十八王朝を治めた。最初は幼いトトメス三世の摂政を務めた。トトメス三世は彼女のおいであり継子でもあった。彼女がファラオの称号と権限を得たあとも、トトメス三世は共同統治者として残った。ハトシェプストが造営を命じた建物には、デイル・エル・バハリの段状の葬祭殿がある。中段南側の柱廊の浮彫には、彼女が派遣したプント遠征が描かれた。そこにはエジプトの使節が現地の人々に会う場面や、物品を船に積む場面がある。遠征は神殿のなかで王権や祭祀と結び付けて記念された。柱廊を調査した研究者は、アメン神の神託と遠征を結び付ける碑文にも注目している。浮彫の絵と碑文の両方から、この航海が神殿でどのように語られたかを知ることができる。"
leader_pharaoh_hatshepsut_civilization = "古代エジプト"

leader_thusnelda_cherusci_name = "トゥスネルダ"
leader_thusnelda_cherusci_historical = "トゥスネルダは紀元一世紀初頭のケルスキ族の貴族女性だった。父のセゲステスはローマの支援を求め、夫のアルミニウスはローマへの抵抗を率いた。ローマの歴史家タキトゥスによれば、15年にアルミニウス側がセゲステスを包囲し、セゲステスはゲルマニクスに救援を求めた。ローマ軍が包囲を解き、身ごもっていたトゥスネルダはローマ側の手に渡った。タキトゥスが伝えるセゲステスの言葉には、彼女が自分の意志でそこにいたのではないという説明がある。タキトゥスは、捕らえられた彼女が言葉で助けを請わず、自らの腹に目を向けたと描く。この場面はローマの著述家による描写で、彼女が置かれた状況と、それに対する姿勢を伝えている。"
leader_thusnelda_cherusci_civilization = "ケルスキ族"

leader_queen_cartimandua_name = "カルティマンドゥア"
leader_queen_cartimandua_historical = "カルティマンドゥアは紀元一世紀、現在のイングランド北部でブリガンテス族を治めた。統治について現存する主な叙述は、ローマの歴史家タキトゥスが残したものである。51年、ローマに抵抗した指導者カラタクスは敗北後、彼女に保護を求めた。カルティマンドゥアは彼を拘束し、ローマ側へ引き渡した。タキトゥスは、捕虜がローマへ連れて行かれ、皇帝クラウディウスの前に出されたことも記している。タキトゥスによれば、皇帝はカラタクスとその家族を赦免した。この出来事はブリタンニアの戦いとローマの宮廷を結び付けた。一方、カルティマンドゥア自身はウェヌティウスと争った。69年、ローマ国内が動揺するなかでウェヌティウスが攻め、カルティマンドゥアはローマに助けを求めた。ローマ軍は彼女を救出したが、王位はウェヌティウスの手に渡った。"
leader_queen_cartimandua_civilization = "ブリガンテス族"

leader_queen_suriyothai_name = "スリヨータイ"
leader_queen_suriyothai_historical = "スリヨータイは、マハー・チャクラパットの治世のアユタヤの王妃だった。ビルマの王タビンシュエーティーの軍が攻め込んだ際の物語に登場する。アユタヤ県が用いる年代では、この侵攻は1548年の出来事である。王朝年代記の伝承によると、王妃は戦象に乗って軍に加わった。王が危険にさらされると、自分の象を王と敵の指揮官の間に進め、戦いのなかで致命傷を負った。伝承で注目されるのは、王妃が戦場で自ら判断して行動したことだ。この一連の細かい動きは、主に後の時代にまとめられたアユタヤ側の記述を通じて伝わっている。"
leader_queen_suriyothai_civilization = "アユタヤ王国"

leader_tarabai_name = "ターラーバーイー"
leader_tarabai_historical = "ターラーバーイー（1675～1761年）は、1700年にラージャーラームが亡くなると、幼い息子シヴァージーの摂政としてマラーターの政権を引き継いだ。指揮官たちをまとめ、ムガル皇帝アウラングゼーブの軍に対して各地の要塞を守った。サーターラーの地方史には、パラシュラーム・トリンバクに要塞の監督を任せたことが記されている。歴史家リチャード・イートンによると、彼女は自軍の主要な砦が包囲されるなかでも、北方のムガル領へ部隊を送った。要塞の防衛と遠征を並行して進め、ムガル側に別の地域でも対応を迫ったのである。1707年にアウラングゼーブが死ぬと、王位を求めるシャーフーが戻り、マラーターの王家では継承をめぐる争いが始まった。地方史では、彼女は1705年にパンハーラーへ移り、ラームチャンドラパントに政務を分担させたとされる。"
leader_tarabai_civilization = "マラーター王国"

leader_natavan_name = "フルシード・バヌ・ナタヴァン"
leader_natavan_historical = "フルシード・バヌ・ナタヴァンはシュシャ出身のアゼルバイジャンの詩人で、文化活動を支援した。1897年に亡くなった。生年は資料によって1830年、1832年など異なる。父のメフディグル・ハンはカラバフ最後のハンで、ナタヴァンは一族から受け継いだ財産を地域の事業や文化活動に用いた。1872年には文学の集まりマジュリス・イ・ウンスを率いるようになった。シュシャの詩人が集い、他の町の詩人の集まりとも交流した。彼女は抒情詩のガザルや哀悼の詩を書いた。のちの詩集に収められた作品があり、自ら絵を描いた画帖も残されている。詩を書くことと、詩人の活動を支えることの両方に携わった人物である。"
leader_natavan_civilization = "カラバフ"

leader_mavia_name = "マウィヤ"
leader_mavia_historical = "マウィヤはローマ東方国境のアラブ諸集団を率い、四世紀後半に帝国と和平を結んだ。ギリシア語の史料ではマウィアとも表記される。"
leader_mavia_civilization = "タヌーフ系アラブ人"

leader_queen_nandi_name = "ナンディ王母"
leader_queen_nandi_historical = "ナンディ・カベベ（1764年頃–1827年）はエランゲニの出身で、息子シャカがズールーの支配者となった後に王母となった。"
leader_queen_nandi_civilization = "ズールー王国"

