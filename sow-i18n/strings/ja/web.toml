leader_hiawatha_haudenosaunee_ability = "大いなる平和の法"
leader_hiawatha_haudenosaunee_description = "味方の2人が互いに新たな同盟を結ぶと、その2人との自分の期限付き同盟は両方とも残り時間が満額に戻る。味方の組み合わせごとに1試合1回。"

leader_kaahumanu_hawaii_ability = "共に囲む食卓"
leader_kaahumanu_hawaii_description = "互いに稼働中の農場がある同盟相手に初めて500以上の兵を送ると、双方が送った兵力の25%に相当する増援を得る。一人あたり最大500で、各自の兵力上限まで。"

leader_sargon_of_akkad_ability = "アッカドの守備隊"
leader_sargon_of_akkad_description = "稼働中の敵都市を占領したとき、12マス以内に自分の塔がなければ、その範囲で最も近い自領の有効地点にレベル1の塔を無料で建てる。占領した都市ごとに1回。"

leader_mithridates_vi_ability = "ティグラネスの援軍"
leader_mithridates_vi_description = "稼働中の都市を持つ同盟相手がいるとき、敵への陸上攻撃を開始して3秒以上経ってから撤退すると、帰還兵と同数の援軍を得る。最大1,000人で兵力上限まで。1試合につき1回。"

leader_gudit_yodit_ability = "アクスムからの退却"
leader_gudit_yodit_description = "敵の稼働中の都市を占領すると、前の所有者がプレイヤーを攻撃中の陸軍のうち、最大の部隊を撤退させる。占領した都市ごとに1回。"

leader_khutulun_qaidu_ability = "騎馬の捕縛"
leader_khutulun_qaidu_description = "すでに自分を陸上から攻撃中の敵に陸上攻撃を仕掛けると、最初の衝突で倒した敵兵の20%を兵力上限まで予備兵に加える。"

leader_sor_juana_ines_de_la_cruz_ability = "台所の哲学"
leader_sor_juana_ines_de_la_cruz_description = "農場のアップグレードが完了すると、12マス以内でその農場に最も近い自分の進行中の都市アップグレードの残り時間が半分になる。"

leader_sibylla_ability = "第二の王冠"
leader_sibylla_description = "自分が稼働中の都市を持つときに新たな同盟を結ぶと、新しい同盟相手に稼働中の都市がない場合、その相手が最初に着工した建設中の都市が即座に完成する。1試合につき1回。"

leader_cynethryth_mercia_ability = "クッカム協定"
leader_cynethryth_mercia_description = "敵が自分の稼働中の農場を占領すると、12マス以内にある自分の完成済み都市のうち最低レベルの都市が1レベル上がる。上限はレベル4で、農場ごとに1回まで。"

leader_suppiluliuma_ability = "ミタンニの盟約"
leader_suppiluliuma_description = "同盟相手も同じ敵を陸上から攻撃している間、その相手の領地に接する敵タイルを占領すると、自軍の陸上部隊の損失が25%減る。"

leader_baibars_ability = "クラックの工兵"
leader_baibars_description = "稼働中の敵の塔を占領すると、その塔から12マス以内で、稼働レベルがより低い同じ敵の稼働中の塔のうち、最も近いものを破壊する。1試合につき占領した塔ごとに1回。"

leader_emperor_qin_shi_huang_ability = "帝国の度量衡"
leader_emperor_qin_shi_huang_description = "自分の都市、工場、農場の稼働レベルの合計がそれぞれ同じで、いずれもゼロより大きい間、工場のゴールド生産と農場の兵士生産がそれぞれ25％増える。"

leader_spartacus_ability = "トゥリイの武器庫"
leader_spartacus_description = "地上部隊が稼働中の敵工場の中心マスを占領すると、その部隊に工場の稼働レベルごとに兵士300人が加わる。1試合につき工場ごとに1回。"

leader_queen_nefertiti_ability = "アマルナのタラタート"
leader_queen_nefertiti_description = "都市から12マス以内に自分の稼働中の工場があると、その都市のアップグレードに必要なゴールドが35％減る。"

leader_mandukhai_ability = "草原の再統一"
leader_mandukhai_description = "敵の残りの領土を征服して脱落させると、その敵の残存予備兵の25％を、自軍の兵力上限まで編入する。"

leader_kabal_xook_ability = "ヤシュチランの戦装束"
leader_kabal_xook_description = "稼働中の都市があり、予備兵が750以上いる場合、味方が双方の敵に対して新たな陸上攻撃を始めると、予備兵750をその攻撃に送る。味方ごとに1試合につき1回。"

leader_lakshmibai_ability = "カルピーの砦"
leader_lakshmibai_description = "敵が自軍の最後の稼働都市を占領すると、失った都市から24マス以内の自領で最も近い建設可能な場所にレベル1の都市を無料で築く。一試合につき一回。"

leader_pharaoh_hatshepsut_ability = "プントの庭園"
leader_pharaoh_hatshepsut_description = "自軍の商船が外国の港への航路を完了すると、出発港から12マス以内にある自軍の完成済み農場のうち最低レベルの一つが一段階上がる。上限はレベル4。出発港ごとに一回。"

leader_thusnelda_cherusci_ability = "囚われても屈せず"
leader_thusnelda_cherusci_description = "敵が自軍の稼働レベル2以上の都市を占領すると、完成レベルが一段階下がり、進行中の増築は中止される。各都市につき一回。"

leader_queen_cartimandua_ability = "カラタクスの引き渡し"
leader_queen_cartimandua_description = "敵の陸軍が自領から撤退すると、撤退の生存兵の25%を、その敵に最大の陸軍を送り、予備兵に空きのある同盟者に渡す。余った兵は敵へ戻る。"

leader_queen_suriyothai_ability = "アユタヤの護衛"
leader_queen_suriyothai_description = "敵の陸軍が稼働中の同盟都市の中心を奪う直前に、予備兵1,500を使ってその試みを阻止し、敵兵を最大1,500減らす。同盟都市ごとに一回。"

leader_tarabai_ability = "反撃のチャウト"
leader_tarabai_description = "自軍を陸上攻撃中の敵から完成済みの塔を奪うと、その敵の金の25%を最大250まで得る。各塔につき一回。"

leader_natavan_ability = "シュシャの泉"
leader_natavan_description = "自軍の都市がレベル2への増築を完了すると、都市から12マス以内の最も近い建設可能な場所に、レベル1の農場を無料で建てる。"

leader_mavia_ability = "モーセの和平"
leader_mavia_description = "陸上で攻撃し合っている相手と同盟を結ぶと、双方の生存部隊が撤退損失なしで帰還する。帰還兵力はそれぞれの上限まで。"

leader_queen_nandi_ability = "エムキンディニの牛群"
leader_queen_nandi_description = "自分の農場が生み出す兵力が25%増える。"

