boudica_rise_title = "Levántate de la Iceni"
boudica_rise_body = "Bienvenidos a la campaña. Comience por tocar tierra no reclamada más allá de su frontera para capturar territorio. Cada baldosa genera tropas y oro."
boudica_rise_hint = "Pulsa tierra no reclamada para expandir territorio"
boudica_warband_title = "Crece la banda de guerra"
boudica_warband_body = "El territorio escala su economía. Continuar ampliando hacia fuera para aumentar la generación de tropas y los ingresos de oro."
boudica_warband_hint = "Ampliar hasta alcanzar 1.024 fichas"
boudica_contact_title = "Primer contacto"
boudica_contact_body = "Los puestos de avanzada enemigos controlan el territorio adyacente. Seleccione sus fuerzas y arrastre hacia las fronteras enemigas para atacar."
boudica_contact_hint = "Arrastre para atacar un puesto de avanzada — derrota 1 enemigo"
boudica_unite_title = "Unidos en el Oriente"
boudica_unite_body = "Neutralizar los puestos regionales circundantes para asegurar el frente oriental bajo su bandera."
boudica_unite_hint = "Derrotar 4 puestos de avanzada regionales"
boudica_camulodunum_title = "Asedio de Camulodunum"
boudica_camulodunum_body = "Rodeando Camulodunum y cortando refuerzos para capturar el asentamiento."
boudica_camulodunum_hint = "Captura Camulodunum al sur"
boudica_londinium_title = "Avance en Londinium"
boudica_londinium_body = "Londinium controla el comercio central. Capturar el asentamiento para asegurar el cruce del río."
boudica_londinium_hint = "Captura Londinium"
boudica_verulamium_title = "Captura Verulamium"
boudica_verulamium_body = "Verulamium se sienta en Watling Street. Capturar el asentamiento para cortar líneas de suministro imperial."
boudica_verulamium_hint = "Captura Verulamium"
boudica_ninth_title = "Ambush el Noveno"
boudica_ninth_body = "Legio IX Hispana está avanzando desde el norte. Interceptar y derrotar a sus fuerzas."
boudica_ninth_hint = "Intercepta a Legio IX Hispana"
boudica_final_title = "La batalla final"
boudica_final_body = "Has dominado la expansión, el combate y el asedio. Derrotar Suetonius Paulinus, luego volver al menú."
boudica_final_hint = "Derrotar Paulinus, luego volver al menú"
six_sky_ep1_landfall_title = "Desembarco"
six_sky_ep1_landfall_body = "682 CE. Usted es Wak Chanil Ajaw, hija de Dos Pilas, venga a gobernar Naranjo. Reclamen tierra más allá de su frontera."
six_sky_ep1_landfall_hint = "Pulsa tierra no reclamada para expandir"
six_sky_ep1_fire_title = "Fuego sagrado"
six_sky_ep1_fire_body = "Crece tu tierra — cada baldosa alimenta tus tropas y oro."
six_sky_ep1_fire_hint = "Ampliar hasta alcanzar 512 baldosas sostenidas"
six_sky_ep1_blood_title = "Primera sangre"
six_sky_ep1_blood_body = "Pequeños pueblos sostienen la orilla. Arrastre en una frontera enemiga para atacar y tomar a su primer rival."
six_sky_ep1_blood_hint = "Arrastre para atacar — derrota 1 enemigo"
six_sky_ep1_villages_title = "Los pueblos se arrodillan"
six_sky_ep1_villages_body = "Los pueblos del lago deben aprender el nombre de la nueva dinastía. Sumételos a todos."
six_sky_ep1_villages_hint = "Derrota 4 aldeas"
six_sky_ep1_rival_title = "La vieja sangre"
six_sky_ep1_rival_body = "Un reclamante de la antigua línea de Naranjo niega su derecho. Termina con el heredero rival."
six_sky_ep1_rival_hint = "Derrotar al reclamante de Rival"
six_sky_ep1_caracol_title = "Rompe el Breaker"
six_sky_ep1_caracol_body = "Caracol dejó Naranjo sin rey una vez antes. Su guarnición debe caer."
six_sky_ep1_caracol_hint = "Derrota a Caracol"
six_sky_ep1_vanguard_title = "Ojos de Tikal"
six_sky_ep1_vanguard_body = "Tikal observa a través de su vanguardia. Tome su puesto de avanzada."
six_sky_ep1_vanguard_hint = "Derrotar el Tikal"
six_sky_ep1_queen_title = "Reina de Naranjo"
six_sky_ep1_queen_body = "Tikal en sí mismo campamentos cerca. Rompelo, y su línea está segura."
six_sky_ep1_queen_hint = "Derrota a Tikal"
six_sky_ep2_regent_title = "Regente"
six_sky_ep2_regent_body = "693 CE. Tu hijo de cinco años es rey de Naranjo, y gobiernas en su nombre. Ampliar y mostrar fuerza."
six_sky_ep2_regent_hint = "Pulsa tierra no reclamada para expandir"
six_sky_ep2_provinces_title = "Las provincias se alzan"
six_sky_ep2_provinces_body = "Fermentos de rebelión en las aldeas. Strike primero - tomar dos rivales antes de unirse."
six_sky_ep2_provinces_hint = "Derrota 2 enemigos"
six_sky_ep2_uaxactun_title = "Primer fuego: Uaxactun"
six_sky_ep2_uaxactun_body = "Uaxactun rebels. Quemar su desafío."
six_sky_ep2_uaxactun_hint = "Defeat Uaxactun Rebeldes"
six_sky_ep2_yaxha_title = "Segundo incendio: Yaxha"
six_sky_ep2_yaxha_body = "Yaxha se levanta después. Le obliga a reafirmar su lealtad."
six_sky_ep2_yaxha_hint = "Defeat Yaxha Rebeldes"
six_sky_ep2_tayasal_title = "Tercer Fuego: Tayasal"
six_sky_ep2_tayasal_body = "Un regente que no puede mantener Tayasal no puede contener Naranjo."
six_sky_ep2_tayasal_hint = "Defeat Tayasal Rebeldes"
six_sky_ep2_seibal_title = "Cuarto Fuego: Seibal"
six_sky_ep2_seibal_body = "Los canoas de Seibal llevan rebeldía hacia abajo. Canta su desafío."
six_sky_ep2_seibal_hint = "Defeat Seibal Rebeldes"
six_sky_ep2_caracol_title = "El Breaker regresa"
six_sky_ep2_caracol_body = "Caracol respalda a los rebeldes. Fija la deuda más antigua de tu reinado."
six_sky_ep2_caracol_hint = "Derrota a Caracol"
six_sky_ep2_total_title = "Reaffirm o Burn"
six_sky_ep2_total_body = "Sigue ganando hasta que cada vecino entienda la regencia."
six_sky_ep2_total_hint = "Derrota 8 enemigos en total"
six_sky_ep2_coalition_title = "La Coalición rompe"
six_sky_ep2_coalition_body = "Tikal reunió a tus enemigos en una coalición. Rompelo y ninguna ciudad dudará de la regencia."
six_sky_ep2_coalition_hint = "Derrotar la Coalición Tikal"
six_sky_ep3_count_title = "El largo conde"
six_sky_ep3_count_body = "Los años te han hecho leyenda y blanco ambos. Ampliar una vez más."
six_sky_ep3_count_hint = "Pulsa tierra no reclamada para expandir"
six_sky_ep3_offerings_title = "Ofertas"
six_sky_ep3_offerings_body = "Los dioses y los soldados exigen homenaje. Tome dos rivales para alimentar a los altares y al guardia."
six_sky_ep3_offerings_hint = "Derrota 2 enemigos"
six_sky_ep3_unknown_title = "El enemigo desconocido"
six_sky_ep3_unknown_body = "Los escribas todavía argumentan sobre dónde reina K'inichil Kab. Derrota."
six_sky_ep3_unknown_hint = "Derrota a K'inichil Kab"
six_sky_ep3_caracol_title = "Hueste de guerra"
six_sky_ep3_caracol_body = "Caracol envía un host de guerra completo, su último lanzamiento contra su línea. Destruyelo."
six_sky_ep3_caracol_hint = "Derrotar el ejército de guerra Caracol"
six_sky_ep3_hill_title = "La colina"
six_sky_ep3_hill_body = "Xunantunich en sus arcos de colina sin regente. Haz que la colina se incline."
six_sky_ep3_hill_hint = "Defeat Xunantunich Rebeldes"
six_sky_ep3_moon_title = "Luna Diosa"
six_sky_ep3_moon_body = "726 CE. Mantenga un gran dominio digno de la diosa de la luna."
six_sky_ep3_moon_hint = "Ampliar hasta alcanzar 1.024 fichas"
six_sky_ep3_vanguard_title = "Vanguardia en Dusk"
six_sky_ep3_vanguard_body = "La vanguardia de Tikal viene al atardecer. Muéstrales la reina Stela 24."
six_sky_ep3_vanguard_hint = "Derrotar el Tikal"
six_sky_ep3_tribute_title = "Tributo rechazado"
six_sky_ep3_tribute_body = "Tikal exige un homenaje de Naranjo una última vez. Responde con la guerra."
six_sky_ep3_tribute_hint = "Derrota 6 enemigos en total"
six_sky_ep3_legacy_title = "Legado en Piedra"
six_sky_ep3_legacy_body = "Defeat Tikal y dejar la línea Naranjo de pie en piedra."
six_sky_ep3_legacy_hint = "Derrota a Tikal"

