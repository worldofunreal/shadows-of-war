leader_caesar_mechanics = "Reduce las pérdidas de tropas al conquistar casillas y luchar en fronteras disputadas. Caesar intercambia unidades con mayor eficiencia contra defensores neutrales y fronteras enemigas."
leader_cleopatra_mechanics = "Acelera la generación de oro de los complejos industriales. El excedente permite colocar ciudades, búnkeres defensivos y mejoras con rapidez."
leader_ragnar_mechanics = "Premia la expansión costera. Colocar puertos junto al agua produce grandes ingresos de oro y permite acceder a casillas acuáticas."
leader_suntzu_mechanics = "Aumenta el ritmo de reclutamiento de tropas en las fábricas. Acelera la recuperación del ejército después de batallas importantes."
leader_alexander_mechanics = "Aumenta la velocidad de conquista por ciclo de simulación. Permite expandirse rápido por territorio neutral y asegurar fronteras tempranas."
leader_genghiskhan_mechanics = "Convierte las victorias de combate en ingresos para el tesoro. Derrotar ejércitos y estructuras desarrolladas devuelve oro a tu economía."
leader_richard_mechanics = "Eleva el límite de tropas por cada distrito urbano colocado. Permite acumular grandes ejércitos antes de lanzar ofensivas fronterizas."
leader_vercingetorix_mechanics = "Aumenta la regeneración base de tropas desde las ciudades. Escala la generación pasiva de efectivos con la urbanización del territorio."
leader_boudica_mechanics = "Aumenta el oro de los distritos urbanos. Permite una economía basada principalmente en centros de población territoriales, no en fábricas."
leader_ladysixsky_mechanics = "Maximiza la eficiencia del oro generado por las fábricas. Produce grandes ingresos para financiar expansión y estructuras defensivas."
leader_leonidas_mechanics = "Amplía la capacidad máxima del ejército mediante módulos de armería instalados en ciudades. Los búnkeres siguen siendo defensivos y no otorgan el bono de Leonidas."
leader_napoleon_mechanics = "El mayor multiplicador de velocidad de expansión del motor. Reclama territorio neutral con rapidez y acelera el avance fronterizo."
