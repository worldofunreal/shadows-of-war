how_step_1_title = "Entra al emparejamiento y elige el modo"
how_step_1_body = "Únete a la sala activa de emparejamiento. La cola alterna entre Todos contra todos (FFA), Batallas por equipos y Humanos contra naciones del mundo en mapas de Europa, Asia, África, East Anglia y las Américas."
how_step_2_title = "Elige tu comandante y su ventaja civilizacional"
how_step_2_body = "Elige uno de doce comandantes históricos. Cada líder aporta un multiplicador mecánico permanente, como la fuerza de combate 1.10x de Julius Caesar, el oro de fábricas +50% de Cleopatra, la producción de tropas +20% de Sun Tzu o el oro de puertos +50% de Ragnar."
compare_leader_traits = "Comparar rasgos de líderes"
how_step_3_title = "Reclama territorio y construye distritos especializados"
how_step_3_body = "Expándete para capturar casillas adyacentes. Cada casilla capturada escala el oro y el ingreso base de tropas. Construye edificios especializados en tu territorio:"
city_label = "Ciudades:"
city_body = "Aumentan la capacidad máxima de tropas y generan ingresos pasivos de tropas y oro."
