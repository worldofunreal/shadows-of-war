port_label = "Puertos:"
port_body = "Se colocan en costas para generar oro, tropas y acceso al agua."
bunker_label = "Búnkeres:"
bunker_body = "Fortifican fronteras defensivas, amplían la cobertura y reducen las pérdidas de tropas recibidas. Los módulos de armería de las ciudades aumentan la capacidad máxima de tropas."
how_step_4_title = "Gestiona economía, terreno e impulso militar"
how_step_4_body = "La conquista consume tropas. Reinvierte el oro de fábricas, ciudades y puertos en nuevas construcciones. Usa los multiplicadores naturales del terreno para anclar fronteras defensivas y dirigir el impulso militar hacia objetivos valiosos."
how_step_5_title = "Diplomacia, traición y victoria por control del mapa"
how_step_5_body_before = "Forma alianzas de no agresión con jugadores vecinos para coordinar frentes. Un jugador gana al alcanzar el"
how_step_5_threshold = "umbral de victoria por control del mapa"
how_step_5_body_after = "(controlar la mayoría necesaria del territorio total) o eliminar a todos los comandantes rivales. La traición rompe una alianza de inmediato y convierte las fronteras compartidas en frentes de combate."
