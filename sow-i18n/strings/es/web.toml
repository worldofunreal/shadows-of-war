privacy_data_title = "Datos que recopilamos"
privacy_gameplay_label = "Partida:"
privacy_gameplay_body = "nombre visible, etiqueta de clan, elecciones de líder y civilización, acciones de partida, historial, rangos y objetos adquiridos."
privacy_account_label = "Cuenta:"
privacy_account_body = "ID de cuenta aleatorio, identidades de plataforma vinculadas y hash unidireccional de tu secreto de propiedad (nunca el texto original)."
privacy_technical_label = "Técnicos:"
privacy_technical_body = "versión de compilación, plataforma/idioma, metadatos de conexión, tickets de relay y registros del servidor para seguridad y prevención de abusos."
privacy_analytics_label = "Analítica del producto (solo propia):"
privacy_analytics_body_v2 = "La analítica propia opcional de nuestro sitio y juego de navegador solo funciona cuando la permites. Entrar al juego no la activa. Registra un conjunto cerrado de visitas, carga, acciones del menú, tutorial, sala, inicio y salida de partidas, junto con la versión, idioma y una categoría amplia de ancho de pantalla (móvil, tableta o escritorio), no una huella completa del dispositivo. Si hay un ID de cuenta, nuestro servidor lo sustituye por un seudónimo generado con una clave secreta y separado para este canal antes de guardarlo. No registra nombres, mensajes, contraseñas, IDs publicitarios ni clics del mapa."
privacy_purchases_label = "Compras:"
privacy_purchases_body = "ID de producto, referencia de transacción y estado del derecho de uso mediante RevenueCat o la tienda. Los datos completos de pago permanecen en la tienda."
privacy_public_label = "Públicos por diseño:"
privacy_public_body = "nombres, identificadores, rankings y registros de partidas visibles para otros jugadores."
privacy_use_title = "Uso y bases legales"
privacy_use_body = "Tratamos los datos necesarios para operar el juego, proteger a los jugadores y los sistemas, ofrecer soporte y cumplir obligaciones legales. Para usuarios de la UE y el Reino Unido, las bases incluyen el contrato para prestar el juego, intereses legítimos en seguridad y prevención de trampas, obligaciones legales cuando correspondan y tu consentimiento para la analítica propia opcional del producto. La analítica permanece apagada hasta que la permites; puedes cambiar tu decisión en Ajustes. No vendemos datos personales ni usamos publicidad basada en comportamiento."
privacy_sharing_title = "Compartición"
privacy_hosting_label = "Alojamiento bajo nuestras instrucciones:"
privacy_hosting_body = "IONOS, Microsoft Azure y Cloudflare."
privacy_payments_label = "Pagos:"
privacy_payments_body = "Google Play o Apple mediante RevenueCat, bajo sus políticas."
privacy_sdk_label = "SDK de plataformas:"
privacy_sdk_body = "bajo su propia política cuando juegas a través de ellas."
privacy_players_label = "Jugadores y público:"
privacy_players_body = "nombres, identificadores, rangos y registros de partidas."
privacy_authorities_label = "Autoridades y transferencias:"
privacy_authorities_body = "cuando la ley lo exija o a un sucesor legal con aviso."
privacy_cookies_title = "Cookies y almacenamiento local"
privacy_cookies_body = "Solo usamos almacenamiento estrictamente necesario: IDs de sesión. Los eventos propios se envían a nuestro endpoint. No usamos cookies publicitarias, sociales ni entre sitios. Las fuentes se alojan localmente, sin solicitudes entre orígenes. Detalles y controles en nuestro"
privacy_cookies_body_v2 = "Guardamos tu decisión sobre analítica en el almacenamiento local. Solo si la aceptas creamos un ID temporal de sesión y una pequeña cola de reintentos en el almacenamiento de sesión. Rechazarla no afecta el juego. Los ajustes, la continuidad de la cuenta y los recursos en caché usan almacenamiento separado necesario para esas funciones. Detalles y controles en nuestro"
privacy_retention_title = "Conservación"
privacy_retention_body = "Los archivos, contadores y registros de analítica caducan en un plazo de 90 días. La eliminación verificada de una cuenta borra sus eventos vinculados y registros por cuenta; los totales diarios no identificables permanecen solo hasta caducar dentro de esos 90 días. Las cuentas y el historial de partidas persisten hasta que solicites su eliminación o termine la cuenta según los Términos."
privacy_retention_body_v2 = "Los archivos, contadores y registros de analítica caducan en un plazo de 90 días. La eliminación verificada de una cuenta borra sus eventos vinculados y registros por cuenta; los totales diarios no identificables permanecen solo hasta caducar dentro de esos 90 días. Las cuentas y el historial de partidas persisten hasta que solicites su eliminación o termine la cuenta según los Términos."
privacy_rights_title = "Tus derechos y eliminación"
privacy_rights_body = "Puedes acceder, corregir, eliminar, portar, oponerte y restringir. Escribe a"
privacy_rights_after = "con tu ID de cuenta del juego (o nombre y fecha aproximada de creación). Las eliminaciones verificadas borran la cuenta, los vínculos de identidad, el espejo de metadatos y las membresías de analítica, y te lo confirmamos. Se respeta GPC como exclusión de venta o compartición (no vendemos ni compartimos, así que nada cambia). Puedes apelar respondiendo; el plazo máximo de respuesta es de 45 días."
privacy_security_title = "Seguridad, transferencias y cambios"
privacy_security_body = "Usamos TLS durante el tránsito, componentes internos solo por loopback, endpoints operativos protegidos y secretos de propiedad con hash; no existe una garantía absoluta. La infraestructura funciona en EE. UU. y la UE con minimización de datos y sin transferencias a tecnología publicitaria. Anunciaremos de forma destacada los cambios materiales a este Aviso de privacidad antes de que entren en vigor; cuando la ley lo exija, pediremos el consentimiento por separado. Seguir usando el servicio no constituye por sí solo consentimiento."
privacy_contact_title = "Contacto"
privacy_contact_before = "Privacidad:"
privacy_help = "Ayuda:"
support_center = "centro de soporte"
privacy_security_contact = "Fallos de seguridad: envíalos de forma privada a hello@, nunca en público; confirmamos su recepción en 48 horas."
privacy_source_before = "El código fuente completo de cada versión del juego se ofrece bajo AGPL-3.0-only, con las condiciones adicionales de OpenFront. El menú del juego enlaza al código de la versión correspondiente."
cookies_title = "Aviso de cookies — Shadows of War"
analytics_title = "Analítica opcional"
analytics_body = "Usamos la actividad del sitio y del juego para mejorar Shadows of War. Solo se activa si la permites."
analytics_policy = "Detalles de cookies"
analytics_accept = "Permitir"
analytics_reject = "Rechazar"
analytics_manage = "Ajustes de cookies"
cookies_description_v2 = "La analítica opcional permanece apagada hasta que la aceptes. Consulta qué guarda Shadows of War y cómo cambiar tu decisión."
cookies_og_description_v2 = "La analítica opcional está apagada hasta que la aceptes. Puedes cambiar tu decisión cuando quieras."
cookies_updated_v2 = "Última actualización: 6 de octubre de 2026 · World of Unreal"
cookies_analytics_title = "Analítica opcional en nuestro sitio y juego de navegador"
cookies_analytics_events = "Cuenta visitas, etapas de carga, acciones del menú, avance del tutorial, entradas a salas, inicios y salidas explícitas de partidas, además de una categoría amplia de pantalla (móvil, tableta o escritorio). No registra nombres, chat, contraseñas, IDs de salas, compras, clics del mapa ni la cadena completa del navegador."
cookies_analytics_server = "Los eventos aceptados van directamente a nuestro servidor en /api/event; no pasan por el relay del juego. Si se incluye un ID de cuenta, nuestro servidor lo cambia por un seudónimo generado con una clave secreta y exclusivo de este canal antes de guardarlo."
cookies_storage_title = "Almacenamiento y conservación"
cookies_storage_body = "Guardamos tu decisión de aceptar o rechazar en el almacenamiento local. Solo al aceptar se crea un ID temporal de sesión y una pequeña cola de reintentos en el almacenamiento de sesión. La analítica incluye la versión, el idioma y una categoría amplia de pantalla (móvil, tableta o escritorio), no la cadena completa del navegador. Los archivos y registros caducan en 90 días. La eliminación verificada de una cuenta borra sus eventos vinculados y registros por cuenta; los totales diarios no identificables caducan dentro de esos mismos 90 días. Los ajustes del juego, la continuidad de cuenta, la recuperación de errores y los recursos en caché usan almacenamiento separado necesario para esas funciones."
cookies_platforms_title = "Otras plataformas de juego"
cookies_platforms_body = "Poki, CrazyGames y Jest pueden medir el uso con sus propios SDK y bajo sus condiciones. No copiamos esos eventos asociados a jugadores a nuestro servidor. La analítica propia de Android está desactivada hasta actualizar la declaración de datos de la tienda."
cookies_controls_v2 = "Puedes permitir o rechazar la analítica opcional con la misma facilidad. Entrar al juego no equivale a permitirla. Cambia tu decisión en Ajustes del juego o aquí; rechazarla no afecta la partida. Si borras los datos del sitio, también se elimina tu decisión y la analítica seguirá apagada hasta que vuelvas a permitirla. No vendemos ni compartimos analítica para publicidad."
cookies_description = "Cómo usa Shadows of War el almacenamiento necesario: IDs de sesión y eventos propios. Sin cookies publicitarias."
cookies_og_description = "Solo almacenamiento estrictamente necesario. Sin cookies publicitarias, sociales ni de seguimiento entre sitios."
cookies_eyebrow = "Legal y almacenamiento"
cookies_heading = "Aviso de"
cookies_heading_em = "cookies."
cookies_updated = "Última actualización: septiembre de 2026 · World of Unreal"
cookies_use_title = "Lo que usamos"
cookies_use_body = "Shadows of War usa únicamente almacenamiento del cliente estrictamente necesario; no requiere un aviso de consentimiento porque el sitio y el juego no pueden funcionar sin él:"
cookies_session_label = "Identificadores de sesión de analítica"
cookies_session_body = "IDs aleatorios que agrupan eventos propios durante una visita. Desaparecen al cerrar la pestaña."
cookies_events_label = "Eventos propios del producto:"
cookies_events_body = "eventos anónimos del embudo enviados a nuestros servidores"
cookies_events_after = "No es una cookie ni se comparte con ningún proveedor."
cookies_game_label = "Configuración del juego y mapas en caché"
cookies_game_body = "preferencias del cliente y datos del juego descargados."
cookies_third_party_title = "Terceros"
cookies_third_party_body = "Las fuentes se alojan en nuestro propio dominio. Ningún código de terceros ejecuta almacenamiento o seguimiento en nuestras páginas: no hay redes publicitarias, widgets sociales, reproducción de sesiones ni identificadores entre sitios. Nuestras páginas no hacen solicitudes entre orígenes."
cookies_dont_title = "Lo que no hacemos"
cookies_dont_ads = "No usamos cookies publicitarias ni publicidad basada en intereses."
cookies_dont_sell = "No vendemos ni compartimos datos personales para publicidad."
cookies_dont_tracking = "No hacemos seguimiento entre sitios ni entre aplicaciones."
cookies_dont_body = "Como no existe seguimiento de comportamiento, Global Privacy Control y Do Not Track no tienen nada que desactivar; aun así respetamos GPC como exclusión de venta o compartición."
cookies_controls_title = "Tus controles"
cookies_controls_clear = "Borra los datos del sitio desde la configuración del navegador para eliminar los IDs de sesión y los recursos en caché. El juego seguirá funcionando y abrirá una sesión nueva."
cookies_controls_block = "Bloquear todo el almacenamiento puede forzar la descarga otra vez de los recursos del juego y restablecer las preferencias en cada visita."
cookies_controls_rights = "Para ejercer derechos sobre tus datos (acceso, eliminación y portabilidad), consulta la Política de privacidad o escribe a"
cookies_changes_title = "Cambios"
cookies_changes_body = "Si alguna vez añadimos almacenamiento no esencial (proveedores de analítica, contenido incrustado o publicidad), este aviso enumerará cada elemento, su propósito y sus controles antes de publicarlo; la Política de privacidad se actualizará al mismo tiempo. Última actualización: septiembre de 2026."
terms_title = "Términos de servicio — Shadows of War"
terms_description = "Lee los términos de servicio de Shadows of War: cuentas, objetos virtuales y política de no reembolso, conducta, responsabilidad y resolución de disputas."
terms_eyebrow = "Términos y condiciones"
terms_heading = "Términos de"
terms_heading_em = "servicio."
terms_updated = "Última actualización: septiembre de 2026 · World of Unreal"
terms_acceptance_title = "Aceptación y elegibilidad"
terms_acceptance_body = "Estos Términos son un acuerdo vinculante entre tú y World of Unreal que rige el uso de Shadows of War en shadowsofwar.io, plataformas asociadas y clientes nativos. Al jugar, instalar o acceder al Servicio aceptas estos Términos. Si no estás de acuerdo, no uses el Servicio."
terms_acceptance_age = "Debes tener al menos 13 años. Los jugadores de 13 a 17 años solo pueden jugar con permiso y supervisión de su padre, madre o tutor. El Servicio no está dirigido a menores de 13 años."
terms_changes_title = "Cambios del juego y del Servicio"
terms_changes_body = "El multijugador requiere acceso de red a nuestros servidores. Podemos modificar, suspender o discontinuar cualquier parte del Servicio —modos, mapas, temporadas, tablas de clasificación y eventos— en cualquier momento, con o sin aviso y sin responsabilidad frente a ti."
terms_accounts_title = "Cuentas"
terms_accounts_body = "El juego anónimo crea un ID de cuenta canónico almacenado en tu dispositivo junto con un nombre visible. Borrar el almacenamiento del sitio crea una cuenta nueva; cambiar el nombre nunca cambia el ID. El ID de cuenta sirve para buscar el progreso, no es una contraseña: protege tu dispositivo."
terms_accounts_contact = "Eres responsable de toda actividad en tu cuenta. Reporta cualquier acceso no autorizado sospechado a"
terms_license_title = "Licencia y restricciones"
terms_license_body = "Estos Términos rigen el acceso al Servicio oficial alojado, las cuentas, los objetos virtuales y los datos del servidor. El código fuente completo del juego se distribuye por separado bajo AGPL-3.0-only, incluidas las condiciones adicionales de OpenFront. Estos Términos no limitan los derechos que conceden esa licencia de código ni las licencias independientes de los mapas."
terms_maps_before = "Las fuentes de mapas derivadas de OpenFront y los archivos de mapas generados se distribuyen bajo"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "El aviso de mapas indica la atribución, procedencia y cambios:"
terms_maps_notice = "aviso de mapas"
terms_license_no_sell = "No vendas, alquiles, sublicencies ni explotes comercialmente el Servicio oficial alojado, las cuentas o los objetos virtuales."
terms_license_no_reverse = "No hagas ingeniería inversa, extracción masiva ni entrenamiento de modelos sobre el Servicio oficial alojado. Estas restricciones no reducen los derechos que conceden las licencias del código y los mapas."
terms_license_feedback = "Podemos usar libremente los comentarios que compartas, sin compensación ni atribución."
terms_virtual_title = "Objetos virtuales y no reembolsos"
terms_virtual_body = "Las gemas, desbloqueos de líderes y skins son únicamente objetos virtuales bajo licencia: no tienen valor monetario, no son transferibles y pueden revocarse. Los desbloqueos de líderes cambian el juego: tienen ventajas propias y no son solo cosméticos."
terms_sales_final = "TODAS LAS VENTAS SON FINALES."
terms_virtual_refunds = "Los objetos virtuales no son reembolsables ni reemplazables en la máxima medida permitida por la ley, incluidos objetos usados o no deseados, cambios del Servicio o acciones contra la cuenta por incumplir los Términos. Si una plataforma revierte una compra, podemos retirar los objetos correspondientes y tomar medidas sobre la cuenta."
terms_conduct_title = "Conducta del jugador"
terms_conduct_cheating = "No hagas trampas ni uses bots, macros, automatización, exploits o desincronizaciones intencionales."
terms_conduct_harassment = "No acoses, amenaces, incites odio ni publiques datos personales. Los nombres, etiquetas y chats deben cumplir la ley."
terms_conduct_servers = "No interrumpas servidores, sondees la infraestructura ni toques las cuentas, credenciales o tickets de otros jugadores."
terms_conduct_after = "Las infracciones pueden causar eliminación de contenido, pérdida de la partida o suspensión o terminación."
terms_third_party_title = "Servicios de terceros y otros jugadores"
terms_third_party_body = "Las plataformas asociadas y sus SDK, proveedores de pago, Discord y Telegram son terceros que no controlamos; se aplican sus propios términos y los usas bajo tu responsabilidad. Las interacciones con otros jugadores son exclusivamente entre ellos y tú. En la máxima medida permitida por la ley, liberas a World of Unreal de reclamaciones derivadas de terceros u otros jugadores."
terms_termination_title = "Terminación"
terms_termination_body = "Podemos suspender o terminar tu acceso —cuenta, objetos o entradas de clasificación— en cualquier momento y por cualquier motivo, incluido un presunto incumplimiento de los Términos, sin responsabilidad. Al terminar, acaba tu licencia y los objetos virtuales se pierden sin reembolso."
terms_disclaimer_title = "Exenciones"
terms_disclaimer_body = "EL SERVICIO SE PROPORCIONA TAL CUAL Y SEGÚN DISPONIBILIDAD. EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY, RECHAZAMOS TODAS LAS GARANTÍAS, INCLUIDAS COMERCIABILIDAD, IDONEIDAD PARA UN FIN PARTICULAR, TÍTULO Y NO INFRACCIÓN. No garantizamos un funcionamiento ininterrumpido, sin errores o seguro, ni la conservación de progreso, rangos u objetos."
terms_liability_title = "Limitación de responsabilidad"
terms_liability_body = "EN LA MÁXIMA MEDIDA PERMITIDA POR LA LEY, NO RESPONDEMOS POR BENEFICIOS, DATOS, OBJETOS O PROGRESO PERDIDOS, NI POR DAÑOS INDIRECTOS O CONSECUENTES. NUESTRA RESPONSABILIDAD TOTAL SE LIMITA AL MAYOR ENTRE 50 USD Y LO QUE HAYAS PAGADO POR OBJETOS VIRTUALES EN LOS SEIS MESES ANTERIORES AL INCIDENTE."
terms_indemnification_title = "Indemnización"
terms_indemnification_body = "Aceptas defender e indemnizar a World of Unreal frente a reclamaciones y costes razonables derivados de tu uso del Servicio, tu incumplimiento de estos Términos o tu incumplimiento de la ley."
terms_arbitration_title = "Disputas y arbitraje"
terms_arbitration_before = "Las disputas pasan por arbitraje individual vinculante (JAMS, Delaware) después de intentar una solución informal durante 45 días; no por tribunales. Renuncias al juicio con jurado y a las acciones colectivas. Se exceptúan los asuntos de menor cuantía y las medidas cautelares de propiedad intelectual. Puedes excluirte del arbitraje dentro de los 30 días posteriores a aceptar por primera vez estos Términos escribiendo a"
terms_arbitration_after = "con tu ID de cuenta y una declaración clara de exclusión."
terms_general_title = "Disposiciones generales"
terms_general_before = "La ley de Delaware rige estos Términos; las reclamaciones no arbitradas corresponden exclusivamente a sus tribunales. Anunciaremos de forma destacada los cambios materiales antes de que entren en vigor. Si la ley aplicable exige renovar la aceptación, la solicitaremos por separado. Contacto: World of Unreal —"
terms_privacy_title = "Privacidad"
terms_privacy_before = "El tratamiento de datos, tus derechos y la eliminación se describen en nuestra"
terms_privacy_and = "y"
terms_privacy_after = "y se incorporan aquí por referencia."
