privacy_overview_title = "Resumen y responsable"
privacy_overview_body = "Shadows of War es operado por World of Unreal. Esta política cubre shadowsofwar.io, plataformas asociadas y clientes nativos. Contacto de privacidad:"
privacy_overview_after = "No tenemos establecimiento en la UE ni el Reino Unido; envía allí directamente todas las solicitudes, incluidas las del RGPD."
