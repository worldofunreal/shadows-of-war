privacy_cookies_title = "التخزين المحلي للكوك"
privacy_cookies_body = "والتخزين اللازم بشدة فقط: الأفضلية المواضيعية، وثائق الاجتماع، نقطة نهاية المناسبة الأولى الخاصة بنا، لا إعلانات، أو بسكويتات اجتماعية، أو متعددة المواقع، فالأصوات مجهزة ذاتيا - صفر من الطلبات المقدمة من عدة أطراف."
privacy_retention_title = "الاستبقاء"
privacy_retention_body = "وتصدر الأحداث ملفات ذاتية خلال 90 يوماً؛ وتنتهي مضاهاة التحليل والعضوية بمفتاح TTL في غضون 90 يوماً، ولا يمسح الدبلوماسيون أبداً دولة حية، ولا تزال الحسابات والتاريخ مستمرة حتى تطلب حذفها أو إنهاؤها بموجب الشروط."
privacy_rights_title = "حقوقك تحذف"
privacy_rights_body = "الوصول، صحيح، حذف، ميناء، جسم، تقييد."
privacy_rights_after = ")ب( بطاقة الهوية الشخصية )أو الاسم + تاريخ الإنشاء التقريبي( - حذفت مصدقة من الحساب، ورسم خرائط الهوية، ومرآة البيانات الوصفية، والعضوية التحليلية - تأكدت من جديد بالنسبة لك، ويشرف GPC على أنه اختيار للبيع/التقاسم )لا نبيع أو نتقاسم، لذلك لا شيء من النظارات(."
privacy_security_title = "الأمن، عمليات النقل، التغييرات"
privacy_security_body = "TLS in transit, ringback-only internals, bearer-gated operator endpoints, hashed ownership secrets; no absolute guarantee, Infra runs in the US and EU with data-minimization and no ad-tech transfers. Material policy changes take effect after prominent notice; continued use means acceptance."
