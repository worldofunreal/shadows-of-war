terms_third_party_title = "الجهات الفاعلة الأخرى في دوائر الأطراف الثالثة"
terms_third_party_body = "منابر الشركاء ومقدمي المدفوعات Discordو Telegram إن الأطراف الثالثة التي لا نتحكم فيها، وتطبق شروطها الخاصة وتستخدمها في خطرك الخاص، والتفاعلات مع الجهات الفاعلة الأخرى بينك وبينها فقط، إلى أقصى حد يسمح به القانون. World of Unreal (ب) المطالبات الناشئة عن أطراف ثالثة أو جهات فاعلة أخرى."
terms_termination_title = "الإنهاء"
terms_termination_body = "ويمكننا أن نعلق أو ننهي دخولكم - الحسابات، البنود، القيود على لوحة القيادة - في أي وقت لأي سبب، بما في ذلك الانتهاكات المشتبه فيها للمصطلحات، بدون مسؤولية، وعند إنهاء رخصتكم، يتم مصادرة الأصناف الافتراضية دون ردها."
terms_disclaimer_title = "إخلاء المسؤولية"
terms_disclaimer_body = "وهذه الخدمة مُنحت &quot; كما هي &quot; و &quot; قابلة للتطبيق &quot; إلى آخر عرض مُسبق من قبل &quot; قانون الأسلحة النووية &quot; ، وهو يُفصل بين جميع المحاربين، بما في ذلك القدرة على التكيف، و &quot; القدرة على الحفظ &quot; ، و &quot; القدرة على الحفظ &quot; ، و &quot; عدم وجود أي خطأ أو عدم وجوده &quot; ."
terms_liability_title = "الحد من المسؤولية"
terms_liability_body = "إلى ماكسيموم السابق الذي ارتكبه القانون الذي نحن غير قادرون على إبطاله، ووفاة البيانات، والبنود المفقودة أو التقدم، أو أي ضرر أو غير مباشر، قبل وقوعه، وقابلية الاختراق الإجمالية، وقيمتها الإجمالية، وقيمتها الحقيقية، وقيمتها الإجمالية 50 دولاراً من دولارات الولايات المتحدة، وما استخدمته في ذلك."
terms_indemnification_title = "التعويض"
terms_indemnification_body = "أنت توافق على الدفاع و التعويض World of Unreal ضد المطالبات والتكاليف المعقولة الناشئة عن استخدامك للدائرة، أو انتهاكك لهذه الشروط، أو انتهاكك للقانون."
terms_arbitration_title = "المنازعات &quot; التحكيم"
terms_arbitration_before = "وتمر المنازعات بالتحكيم الفردي الملزم (JAMS, Delaware) بعد محاولة غير رسمية مدتها 45 يوماً - لا المحاكم، وتتنازل عن حقوق هيئة المحلفين والفصل في الإجراءات، وتستثنى الطلبات الصغيرة والأمر القضائي الصادر عن محكمة العدل الدولية، ويمكن أن تمتنع عن التحكيم في غضون 30 يوماً من قبول هذه المصطلحات بالبريد الإلكتروني."
