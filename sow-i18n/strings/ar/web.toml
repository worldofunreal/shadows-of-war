privacy_purchases_body = "هوية المنتج، وإحالة المعاملات، وحالة الاستحقاق عن طريق شركة الايرادات/المتجر، وتفاصيل الدفع الكامل تبقى مع المتجر."
privacy_public_label = "علنياً بالتصميم:"
