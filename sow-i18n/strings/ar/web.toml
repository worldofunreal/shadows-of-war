privacy_use_title = "استخدام القواعد القانونية"
privacy_use_body = "إدارة اللعبة، والأمن، ومكافحة الخياطة، والفطريات، والموثوقية، والدعم، والامتثال، وقواعد الاتحاد الأوروبي/المملكة المتحدة: العقد، والمصالح المشروعة (الإعلانات السلوكية على الإطلاق)، والموافقة عند الطلب، والالتزام القانوني، ولا نبيع البيانات الشخصية ولا ندير أي متعقب إعلانات."
