terms_acceptance_title = "القبول والأهلية"
terms_acceptance_body = "هذه الشروط هي اتفاق ملزم بينك وبينك World of Unreal حاكمة استخدامك Shadows of War على ظلال الحرب، منابر الشريك، وزبائن السكان الأصليين، بلعبك أو تركيب أو الوصول إلى الخدمة التي توافقين عليها، إذا لم توافقي، لا تستخدمي هذه الخدمة."
terms_acceptance_age = "لا بدّ أنّك في الـ13 من العمر على الأقلّ، اللاعبون الذين تتراوح أعمارهم بين 13 و 17 عاماً قد يلعبون فقط بإذنٍ أو وصيٍّ أو بإشرافٍ، فالخدمة لا تُوجّه للأطفال دون الـ13 عاماً."
terms_changes_title = "اللعبة تغيرت"
terms_changes_body = "إن تعدد المزاولين يتطلب وصول الشبكة إلى خواديمنا، ويمكننا أن نعدل أو نعلق أو نوقف أي جزء من الدائرة - أي وسائط أو خرائط أو مواسم أو لوحات قيادة أو أحداث - في أي وقت، مع إخطار أو بدونه، دون أن تتحمل المسؤولية أمامكم."
terms_accounts_title = "الحسابات"
terms_accounts_body = "مسرحية مجهولة تخلق هوية حسابية مخزنة على جهازك بإسم عرض، مخزن موقع المقاصة يخلق حسابا جديدا، ولا يغير الاسماء أبدا هوية الحساب."
terms_accounts_contact = "أنت مسؤول عن كل النشاط تحت حسابك التقرير يشتبه في وصوله بدون إذن"
terms_license_title = "قيود الترخيص"
terms_license_body = "نحن نمنح رخصة محدودة و قابلة للإلغاء للعزف الشخصي الغير تجاري World of Unreal (ب) رموز مصادر اللعبة متاحة بصورة منفصلة بموجب المادة 3 من القانون النموذجي للتحكيم - 3.0 أو - لاتر؛ وتنظم هذه المصطلحات الحسابات والأصناف الافتراضية وبيانات الخواديم."
terms_license_no_sell = "يُحظر البيع أو التأجير أو الترخيص من الباطن أو الاستغلال التجاري."
terms_license_no_reverse = "لا يوجد هندسة عكسية أو خردة أو استخراج السائب أو تدريب نموذجي على الدائرة"
terms_license_feedback = "العلاوة التي تتقاسمها قد تستخدم بحرية بدون تعويض أو إسناد"
terms_virtual_title = "البنود الافتراضية &quot; عدم استرداد الأموال &quot;"
terms_virtual_body = "فالجيمات، والزعيم يفكك، والجلد مرخَّص له بأصناف افتراضية فقط: لا قيمة نقدية، ولا يمكن تحويلها، ولا يمكن إحياءها، ويفتح الزعيم لعبة التغيير - وله مواهب متميزة وليس متجانساً تماماً."
terms_sales_final = "كلّ المقالات في النهاية."
terms_virtual_refunds = "فالأصناف الافتراضية غير قابلة للاسترداد وغير قابلة للاستبدال إلى أقصى حد يسمح به القانون - بما في ذلك الأصناف المستعملة أو غير المرغوب فيها، أو تغييرات في الخدمات، أو مراعاة الإجراءات المتخذة بشأن انتهاكات الشروط، وإذا عكست منصة الشراء، فيمكن أن نزيل الأصناف المقابلة وأن نأخذ في الحسبان التدابير."
terms_conduct_title = "إدارة اللاعبين"
