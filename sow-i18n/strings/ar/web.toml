terms_virtual_title = "البنود الافتراضية &quot; عدم استرداد الأموال &quot;"
terms_virtual_body = "فالجيمات، والزعيم يفكك، والجلد مرخَّص له بأصناف افتراضية فقط: لا قيمة نقدية، ولا يمكن تحويلها، ولا يمكن إحياءها، ويفتح الزعيم لعبة التغيير - وله مواهب متميزة وليس متجانساً تماماً."
terms_sales_final = "كلّ المقالات في النهاية."
terms_virtual_refunds = "فالأصناف الافتراضية غير قابلة للاسترداد وغير قابلة للاستبدال إلى أقصى حد يسمح به القانون - بما في ذلك الأصناف المستعملة أو غير المرغوب فيها، أو تغييرات في الخدمات، أو مراعاة الإجراءات المتخذة بشأن انتهاكات الشروط، وإذا عكست منصة الشراء، فيمكن أن نزيل الأصناف المقابلة وأن نأخذ في الحسبان التدابير."
terms_conduct_title = "إدارة اللاعبين"
terms_conduct_cheating = "لا غشّ، جوز، عظمة، آليّة، حشرة تستغلّ، أو خزائن متعمدة."
terms_conduct_harassment = "لا مضايقة، تهديدات، كراهية، أو ازدواجية، الأسماء، العلامات، الدردشة يجب أن تتبع القانون."
terms_conduct_servers = "لا خوادم مُعطلة أو بنية تحتية تحتية أو لمس حسابات اللاعبين الآخرين أو أوراق اعتماد أو تذاكر"
