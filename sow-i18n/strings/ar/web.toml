terms_acceptance_title = "القبول والأهلية"
terms_acceptance_body = "هذه الشروط هي اتفاق ملزم بينك وبينك World of Unreal حاكمة استخدامك Shadows of War على ظلال الحرب، منابر الشريك، وزبائن السكان الأصليين، بلعبك أو تركيب أو الوصول إلى الخدمة التي توافقين عليها، إذا لم توافقي، لا تستخدمي هذه الخدمة."
terms_acceptance_age = "لا بدّ أنّك في الـ13 من العمر على الأقلّ، اللاعبون الذين تتراوح أعمارهم بين 13 و 17 عاماً قد يلعبون فقط بإذنٍ أو وصيٍّ أو بإشرافٍ، فالخدمة لا تُوجّه للأطفال دون الـ13 عاماً."
terms_changes_title = "اللعبة تغيرت"
terms_changes_body = "إن تعدد المزاولين يتطلب وصول الشبكة إلى خواديمنا، ويمكننا أن نعدل أو نعلق أو نوقف أي جزء من الدائرة - أي وسائط أو خرائط أو مواسم أو لوحات قيادة أو أحداث - في أي وقت، مع إخطار أو بدونه، دون أن تتحمل المسؤولية أمامكم."
