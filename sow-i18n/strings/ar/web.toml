terms_license_no_sell = "يُحظر بيع الخدمة الرسمية المستضافة أو الحسابات أو العناصر الافتراضية أو تأجيرها أو ترخيصها من الباطن أو استغلالها تجارياً."
terms_license_no_reverse = "يُحظر إجراء الهندسة العكسية أو الكشط أو الاستخراج الجماعي أو تدريب النماذج على الخدمة الرسمية المستضافة. ولا تقلل هذه القيود الحقوق التي تمنحها رخص الشفرة والخرائط."
