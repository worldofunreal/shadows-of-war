terms_accounts_body = "مسرحية مجهولة تخلق هوية حسابية مخزنة على جهازك بإسم عرض، مخزن موقع المقاصة يخلق حسابا جديدا، ولا يغير الاسماء أبدا هوية الحساب."
terms_accounts_contact = "أنت مسؤول عن كل النشاط تحت حسابك التقرير يشتبه في وصوله بدون إذن"
terms_license_title = "قيود الترخيص"
terms_license_body = "تنظم هذه الشروط الوصول إلى الخدمة الرسمية المستضافة والحسابات والعناصر الافتراضية وبيانات الخادم. وتُرخَّص الشفرة المصدرية الكاملة للعبة بشكل مستقل بموجب AGPL-3.0-only، بما في ذلك الشروط الإضافية لـ OpenFront. ولا تحد هذه الشروط من الحقوق التي تمنحها رخصة الشفرة أو رخص الخرائط المنفصلة."
