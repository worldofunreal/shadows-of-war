analytics_title = "التحليلات الاختيارية"
analytics_body = "نستخدم النشاط على الموقع وفي اللعبة لتحسين Shadows of War. تظل التحليلات متوقفة حتى تسمح بها."
analytics_policy = "تفاصيل ملفات الارتباط"
analytics_accept = "السماح"
analytics_reject = "رفض"
analytics_manage = "إعدادات ملفات الارتباط"
privacy_analytics_body_v2 = "لا تعمل تحليلات المنتج الاختيارية التابعة لنا على الموقع ولعبة المتصفح إلا بعد السماح بها. بدء اللعب وحده لا يفعّلها. تسجل مجموعة محدودة من أحداث الزيارة والتحميل والقائمة والبرنامج التعليمي والردهة وبدء المباراة والخروج منها، مع إصدار البناء واللغة وفئة عامة لحجم الشاشة، لا بصمة كاملة للجهاز. إذا توفر معرّف حساب، يستبدله خادمنا بمعرّف مستعار مشفر ومخصص لهذه القناة قبل التخزين. لا نسجل الأسماء أو الرسائل أو كلمات المرور أو معرّفات الإعلانات أو نقرات الخريطة."
privacy_cookies_body_v2 = "نحفظ اختيارك بشأن التحليلات في التخزين المحلي. ولا ننشئ معرّف جلسة تحليلات مؤقتاً أو قائمة إعادة المحاولة في تخزين الجلسة إلا بعد السماح بها. رفض التحليلات لا يؤثر في اللعبة. تستخدم إعدادات اللعبة واستمرارية الحساب والموارد المخزنة مؤقتاً مساحة تخزين منفصلة لازمة لهذه الميزات. التفاصيل وخيارات التحكم في"
privacy_retention_body_v2 = "تنتهي صلاحية ملفات الأحداث وعدادات التحليلات وسجلات العضوية خلال 90 يوماً. ويؤدي حذف الحساب بعد التحقق إلى إزالة الأحداث المرتبطة به وسجلات العضوية؛ ولا تبقى المجاميع اليومية غير القابلة للتعرّف إلا حتى انتهاء مدة الـ90 يوماً. تظل الحسابات وسجل المباريات محفوظين حتى تطلب حذفهما أو إنهاء الحساب بموجب الشروط."
privacy_updated_v2 = "آخر تحديث: 6 أكتوبر 2026 · المسؤول: World of Unreal · التواصل: hello@shadowsofwar.io"
cookies_analytics_title = "تحليلات اختيارية على موقعنا ولعبة المتصفح"
cookies_analytics_events = "تُحصي الزيارات ومراحل التحميل وأفعال القائمة وتقدم البرنامج التعليمي ودخول الردهات وبدء المباريات والخروج منها، إضافة إلى فئة عامة لحجم الشاشة. لا تسجل الأسماء أو الدردشة أو كلمات المرور أو معرّفات الردهات أو المشتريات أو نقرات الخريطة أو سلسلة وكيل المستخدم كاملة."
cookies_analytics_server = "تُرسل الأحداث المسموح بها مباشرة إلى خادمنا عبر /api/event، ولا تمر عبر مرحّل اللعبة. وإذا أُرسل معرّف حساب، يحوله خادمنا إلى معرّف مستعار مشفر ومخصص لهذا الموقع قبل التخزين."
cookies_storage_title = "تخزين المتصفح والاحتفاظ بالبيانات"
cookies_storage_body = "نحفظ خيار السماح أو الرفض في التخزين المحلي. وبعد السماح فقط، يُحفظ معرّف جلسة مؤقت وطابور صغير لإعادة المحاولة في تخزين الجلسة. تشمل التحليلات إصدار البناء واللغة وفئة عامة لحجم الشاشة، لا سلسلة وكيل المستخدم كاملة. تنتهي صلاحية ملفات الأحداث وسجلات العضوية خلال 90 يوماً، ويحذف الحساب بعد التحقق الأحداث المرتبطة به وسجلات العضوية. تستخدم إعدادات اللعبة واستمرارية الحساب والتعافي من الأعطال والموارد المخزنة مؤقتاً مساحة تخزين منفصلة لازمة لهذه الوظائف."
cookies_platforms_title = "منصات اللعب الأخرى"
cookies_platforms_body = "قد تقيس Poki وCrazyGames وJest الاستخدام عبر أدواتها الخاصة وبموجب شروطها. لا ننسخ أحداث اللاعبين من تلك المنصات إلى خادمنا. تحليلاتنا الخاصة معطلة على Android إلى أن يتم تحديث إفصاح المتجر."
cookies_controls_v2 = "يمكنك السماح بالتحليلات الاختيارية أو رفضها بالسهولة نفسها. بدء اللعب لا يُعد سماحاً بها. غيّر اختيارك من إعدادات اللعبة أو هنا؛ والرفض لا يؤثر في اللعب. حذف بيانات الموقع يزيل اختيارك أيضاً، وتظل التحليلات متوقفة حتى تسمح بها مجدداً. لا نبيع التحليلات ولا نشاركها لأغراض إعلانية."
cookies_description_v2 = "تظل تحليلات المنتج الاختيارية متوقفة حتى تسمح بها. بدء اللعب لا يفعّلها. تعرّف على البيانات التي يخزنها Shadows of War وكيفية تغيير اختيارك."
cookies_og_description_v2 = "تظل التحليلات الاختيارية متوقفة حتى تسمح بها، ويمكنك تغيير اختيارك في أي وقت."
