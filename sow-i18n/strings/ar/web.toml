privacy_use_title = "استخدام القواعد القانونية"
privacy_use_body = "نعالج البيانات اللازمة لتشغيل اللعبة وحماية اللاعبين والأنظمة وتقديم الدعم والوفاء بالالتزامات القانونية. وبالنسبة إلى مستخدمي الاتحاد الأوروبي والمملكة المتحدة، تشمل الأسس العقد اللازم لتقديم اللعبة، والمصالح المشروعة للأمن ومكافحة الغش، والالتزامات القانونية عند الاقتضاء، وموافقتك على تحليلات المنتج الاختيارية التابعة لنا. تظل التحليلات متوقفة حتى تسمح بها، ويمكنك تغيير اختيارك من الإعدادات. لا نبيع البيانات الشخصية ولا نستخدم إعلانات سلوكية."
