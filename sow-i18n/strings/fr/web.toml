privacy_account_body = "identifiant du compte de jeu, fournisseurs de connexion liés et leurs identifiants, adresse e-mail vérifiée lorsqu’elle est fournie, et empreintes des justificatifs de propriété et de session sur le serveur."
privacy_technical_label = "Technique :"
privacy_technical_body = "version du build, plateforme/langue, métadonnées de connexion, tickets de relais et journaux serveur pour la sécurité et la lutte contre les abus."
