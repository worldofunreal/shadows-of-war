leader_sargon_of_akkad_description = "Lorsque vous capturez une ville ennemie active sans aucune de vos tours à 12 cases ou moins, construisez gratuitement une tour de niveau 1 sur votre site valide le plus proche dans ce rayon. Une fois par ville capturée."

leader_mithridates_vi_ability = "Secours de Tigrane"
leader_mithridates_vi_description = "Si un allié possède une ville active, se retirer d’une attaque terrestre contre un rival après au moins 3 secondes donne autant de renforts que de troupes revenues, jusqu’à 1 000 et dans la limite de capacité. Une fois par partie."

leader_gudit_yodit_ability = "Fuite d’Aksoum"
leader_gudit_yodit_description = "Lorsque vous capturez une ville ennemie active, la plus grande armée terrestre de son ancien propriétaire qui attaque un joueur est forcée de se retirer. Une fois par ville capturée."

leader_khutulun_qaidu_ability = "Capture à cheval"
leader_khutulun_qaidu_description = "Lorsque vous lancez une attaque terrestre contre un rival qui vous attaque déjà par voie terrestre, recrutez dans vos réserves 20 % des troupes vaincues lors du choc initial, dans la limite de votre capacité."

leader_sor_juana_ines_de_la_cruz_ability = "Philosophie de cuisine"
leader_sor_juana_ines_de_la_cruz_description = "Quand vous terminez l’amélioration d’une ferme, le temps restant de votre amélioration de ville en cours la plus proche dans un rayon de 12 cases est divisé par deux."

leader_sibylla_ability = "La Seconde Couronne"
leader_sibylla_description = "Si vous possédez une ville active en concluant une nouvelle alliance, la plus ancienne ville en construction de votre nouvel allié s’achève aussitôt s’il ne possède aucune ville active. Une fois par partie."

leader_cynethryth_mercia_ability = "Accord de Cookham"
leader_cynethryth_mercia_description = "Lorsqu’un rival s’empare d’une de vos fermes actives, votre ville achevée du plus bas niveau dans un rayon de 12 cases gagne un niveau, jusqu’au niveau 4. Une fois par ferme."

leader_suppiluliuma_ability = "Pacte du Mitanni"
leader_suppiluliuma_description = "Vos armées terrestres perdent 25 % de soldats en moins en prenant des cases ennemies qui bordent le territoire d’un allié attaquant le même adversaire par voie terrestre."

leader_baibars_ability = "Sapeurs du Crac"
leader_baibars_description = "Lorsque vous prenez une tour ennemie active, détruisez la tour active la plus proche du même rival dont le niveau actif est inférieur et qui se trouve à 12 cases ou moins. Une fois par tour prise et par partie."

leader_emperor_qin_shi_huang_ability = "Poids et mesures impériaux"
leader_emperor_qin_shi_huang_description = "Tant que vos villes, vos usines et vos fermes totalisent chacune le même nombre de niveaux actifs, supérieur à zéro, vos usines produisent 25 % d’or en plus et vos fermes 25 % de soldats en plus."

leader_spartacus_ability = "Arsenal de Thurii"
leader_spartacus_description = "Quand votre armée terrestre prend le centre d’une usine ennemie active, elle reçoit 300 soldats par niveau actif de cette usine. Une fois par usine et par partie."

leader_queen_nefertiti_ability = "Talatates d’Amarna"
leader_queen_nefertiti_description = "Améliorer une ville coûte 35 % d’or en moins si vous possédez une usine active à 12 cases ou moins de cette ville."

leader_mandukhai_ability = "Réunification de la steppe"
leader_mandukhai_description = "Lorsque vous éliminez un rival en conquérant le territoire qui lui reste, recrutez 25 % de ses soldats encore en réserve, dans la limite de votre capacité de troupes."

leader_kabal_xook_ability = "Insignes de Yaxchilán"
leader_kabal_xook_description = "Avec une ville active et au moins 750 soldats en réserve, engagez 750 de vos soldats quand un allié lance une nouvelle attaque terrestre contre un rival commun. Une fois par allié et par partie."

leader_lakshmibai_ability = "Redoute de Kalpi"
leader_lakshmibai_description = "Quand un rival prend votre dernière ville active, fondez gratuitement une ville de niveau 1 sur le site valide le plus proche dans votre territoire, à 24 cases ou moins de la ville perdue. Une fois par partie."

leader_pharaoh_hatshepsut_ability = "Jardins de Pount"
leader_pharaoh_hatshepsut_description = "Quand votre navire marchand termine une route vers un port étranger, améliorez d’un niveau votre ferme achevée de plus bas niveau à 12 cases ou moins du port de départ, jusqu’au niveau 4. Une fois par port de départ."

leader_thusnelda_cherusci_ability = "Digne en captivité"
leader_thusnelda_cherusci_description = "Quand un rival capture l’une de vos villes de niveau actif 2 ou plus, elle perd un niveau achevé et toute amélioration en cours est annulée. Une fois par ville."

leader_queen_cartimandua_ability = "Livraison de Caratacos"
leader_queen_cartimandua_description = "Lorsqu’une armée terrestre ennemie se replie de votre territoire, transférez 25% de ses survivants à l’allié qui a la plus grande armée terrestre active contre cet ennemi et de la place en réserve. Le surplus retourne à l’ennemi."

leader_queen_suriyothai_ability = "Escorte d’Ayutthaya"
leader_queen_suriyothai_description = "Lorsqu’une armée terrestre ennemie est sur le point de prendre le centre d’une ville alliée active, dépensez 1 500 soldats de réserve pour arrêter cette tentative et éliminer jusqu’à 1 500 attaquants. Une fois par ville alliée."

leader_tarabai_ability = "Chauth de contre-attaque"
leader_tarabai_description = "Capturez une tour achevée d’un rival qui vous attaque par voie terrestre pour lui prendre 25% de son or, jusqu’à 250. Une fois par tour."

leader_natavan_ability = "Fontaine de Choucha"
leader_natavan_description = "Quand une de vos villes atteint le niveau 2, construisez gratuitement une ferme de niveau 1 sur le terrain valide le plus proche, à 12 cases ou moins de cette ville."

leader_mavia_ability = "Paix de Moïse"
leader_mavia_description = "Si vous concluez une alliance pendant une attaque terrestre entre vous et un rival, les deux camps récupèrent leurs troupes survivantes sans pertes de retraite, dans la limite de leurs effectifs."

leader_queen_nandi_ability = "Troupeaux d’Emkhindini"
leader_queen_nandi_description = "Vos fermes produisent 25 % de troupes en plus."

