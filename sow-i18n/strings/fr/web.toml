privacy_updated = "Dernière mise à jour : septembre 2026 · Responsable : World of Unreal · Contact : hello@shadowsofwar.io"
privacy_overview_title = "Présentation et responsable"
privacy_overview_body = "Shadows of War est exploité par World of Unreal. Cette politique couvre shadowsofwar.io, les plateformes partenaires et les clients natifs. Contact confidentialité :"
privacy_overview_after = "Nous n'avons pas d'établissement dans l'UE ou au Royaume-Uni ; envoyez toutes les demandes, y compris celles liées au RGPD, directement à cette adresse."
privacy_overview_payments = "Les SDK des plateformes partenaires peuvent collecter des données selon leurs propres politiques. Les données de carte sont traitées directement par la boutique utilisée pour payer (Google Play, Apple ou Stripe) ; nous ne voyons jamais les numéros de carte."
privacy_eligibility_title = "Éligibilité et enfants"
privacy_eligibility_body = "13+. Les joueurs de 13 à 17 ans doivent avoir l'autorisation d'un parent ou tuteur. Le jeu ne s'adresse pas aux moins de 13 ans ; les comptes concernés sont suspendus et supprimés. Parents : écrivez à"
privacy_eligibility_after = "et nous supprimerons le compte rapidement."
privacy_data_title = "Données collectées"
privacy_gameplay_label = "Jeu :"
privacy_gameplay_body = "nom d'affichage, tag de clan, choix de dirigeant et de civilisation, actions de partie, historique, classements et objets possédés."
privacy_account_label = "Compte :"
privacy_account_body = "identifiant de compte aléatoire, identités de plateformes liées et hash à sens unique de votre secret de propriété (jamais le texte en clair)."
privacy_technical_label = "Technique :"
privacy_technical_body = "version du build, plateforme/langue, métadonnées de connexion, tickets de relais et journaux serveur pour la sécurité et la lutte contre les abus."
privacy_analytics_label = "Analyse produit (première partie uniquement) :"
privacy_analytics_body = "événements à taxonomie fermée (visites, étapes de démarrage, tutoriel, matchmaking, début/fin de partie) liés à un identifiant de session et de compte aléatoire. Aucun identifiant publicitaire ni fournisseur tiers."
privacy_purchases_label = "Achats :"
privacy_purchases_body = "identifiant produit, référence de transaction et état des droits via RevenueCat ou la boutique. Les données de paiement complètes restent chez la boutique."
privacy_public_label = "Public par conception :"
privacy_public_body = "noms, pseudonymes, classements et historiques de parties visibles par les autres joueurs."
privacy_use_title = "Utilisation et bases légales"
privacy_use_body = "Exploitation du jeu, sécurité et anti-triche, entonnoirs et fiabilité, assistance et conformité. Bases UE/Royaume-Uni : contrat, intérêts légitimes (jamais de publicité comportementale), consentement lorsqu'il est demandé et obligation légale. Nous ne vendons pas de données personnelles et n'utilisons pas de traceurs publicitaires."
privacy_sharing_title = "Partage"
privacy_hosting_label = "Hébergement selon nos instructions :"
privacy_hosting_body = "IONOS, Microsoft Azure et Cloudflare."
privacy_payments_label = "Paiements :"
privacy_payments_body = "Google Play, Apple ou Stripe via RevenueCat, selon leurs politiques."
privacy_sdk_label = "SDK partenaires :"
privacy_sdk_body = "selon leur propre politique lorsque vous jouez par leur intermédiaire."
privacy_players_label = "Joueurs et public :"
privacy_players_body = "noms, pseudonymes, classements et historiques de parties."
privacy_authorities_label = "Autorités et transferts :"
privacy_authorities_body = "lorsque la loi l'exige ou à un successeur légal après notification."
privacy_cookies_title = "Cookies et stockage local"
privacy_cookies_body = "Stockage strictement nécessaire uniquement : préférence de thème, identifiants de session et notre propre endpoint d'événements. Aucun cookie publicitaire, social ou intersite. Les polices sont hébergées localement : aucune requête interorigine. Détails et contrôles dans notre"
privacy_retention_title = "Conservation"
privacy_retention_body = "Les fichiers d'événements sont supprimés après 90 jours ; les compteurs et adhésions analytiques expirent via TTL sous 90 jours. Les déploiements n'effacent jamais l'état actif. Les comptes et l'historique persistent jusqu'à votre demande de suppression ou la fin du compte selon les Conditions."
privacy_rights_title = "Vos droits et suppression"
privacy_rights_body = "Accéder, corriger, supprimer, porter, vous opposer et limiter. Écrivez à"
privacy_rights_after = "avec votre identifiant de compte (ou votre nom et une date de création approximative). Les suppressions vérifiées effacent le compte, les identités liées, le miroir de métadonnées et les adhésions analytiques, puis vous le confirment. Le GPC est respecté comme opposition à la vente ou au partage (nous ne vendons ni ne partageons rien). Réponse aux recours sous 45 jours maximum."
privacy_security_title = "Sécurité, transferts et changements"
privacy_security_body = "TLS en transit, composants internes limités au loopback, endpoints opérateur protégés par bearer et secrets de propriété hachés ; aucune garantie absolue. L'infrastructure fonctionne aux États-Unis et dans l'UE avec minimisation des données et sans transfert vers l'adtech. Les changements importants prennent effet après un avis visible ; la poursuite de l'utilisation vaut acceptation."
