cookies_use_title = "Ce que nous utilisons"
cookies_use_body = "Shadows of War utilise uniquement le stockage client strictement nécessaire ; aucune bannière de consentement n'est nécessaire car le site et le jeu ne peuvent pas fonctionner sans lui :"
