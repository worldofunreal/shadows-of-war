privacy_public_label = "Public par conception :"
privacy_public_body = "noms, pseudonymes, classements et historiques de parties visibles par les autres joueurs."
privacy_use_title = "Utilisation et bases légales"
privacy_use_body = "Nous traitons les données nécessaires au fonctionnement du jeu, à la protection des joueurs et des systèmes, à l'assistance et au respect de nos obligations légales. Pour les personnes dans l'UE et au Royaume-Uni, les bases comprennent le contrat pour fournir le jeu, nos intérêts légitimes en matière de sécurité et d'anti-triche, les obligations légales applicables et votre consentement pour les analyses facultatives de première partie. Elles restent désactivées jusqu'à votre accord, que vous pouvez modifier dans les paramètres. Nous ne vendons pas de données personnelles et n'utilisons pas de publicité comportementale."
privacy_sharing_title = "Partage"
privacy_hosting_label = "Hébergement selon nos instructions :"
privacy_hosting_body = "IONOS, Microsoft Azure et Cloudflare."
privacy_payments_label = "Paiements :"
privacy_payments_body = "Google Play ou Apple via RevenueCat, selon leurs politiques."
privacy_sdk_label = "SDK partenaires :"
privacy_sdk_body = "selon leur propre politique lorsque vous jouez par leur intermédiaire."
privacy_players_label = "Joueurs et public :"
privacy_players_body = "noms, pseudonymes, classements et historiques de parties."
privacy_authorities_label = "Autorités et transferts :"
privacy_authorities_body = "lorsque la loi l'exige ou à un successeur légal après notification."
privacy_cookies_title = "Cookies et stockage local"
privacy_cookies_body = "Stockage strictement nécessaire : identifiants de session. Les événements de première partie sont envoyés à notre propre endpoint. Aucun cookie publicitaire, social ou intersite. Nos polices sont hébergées sur notre domaine, sans requête interorigine. Détails et contrôles dans notre"
privacy_retention_title = "Conservation"
privacy_retention_body = "Les fichiers d'événements sont supprimés après 90 jours ; les compteurs et adhésions analytiques expirent via TTL sous 90 jours. Les déploiements n'effacent jamais l'état actif. Les comptes et l'historique persistent jusqu'à votre demande de suppression ou la fin du compte selon les Conditions."
privacy_rights_title = "Vos droits et suppression"
privacy_rights_body = "Accéder, corriger, supprimer, porter, vous opposer et limiter. Écrivez à"
privacy_rights_after = "avec votre identifiant de compte (ou votre nom et une date de création approximative). Les suppressions vérifiées effacent le compte, les identités liées, le miroir de métadonnées et les adhésions analytiques, puis vous le confirment. Le GPC est respecté comme opposition à la vente ou au partage (nous ne vendons ni ne partageons rien). Réponse aux recours sous 45 jours maximum."
privacy_security_title = "Sécurité, transferts et changements"
privacy_security_body = "Nous utilisons TLS lors des transferts, des composants internes accessibles uniquement en local, des interfaces d'exploitation protégées et des secrets de propriété hachés ; aucune sécurité n'est absolue. L'infrastructure fonctionne aux États-Unis et dans l'UE avec minimisation des données et sans transfert vers les technologies publicitaires. Nous annoncerons clairement les changements importants de cet Avis de confidentialité avant leur entrée en vigueur et demanderons un consentement distinct lorsque la loi l'exige. La poursuite de l'utilisation ne vaut pas consentement à elle seule."
privacy_contact_title = "Nous contacter"
privacy_contact_before = "Confidentialité :"
privacy_help = "Aide :"
support_center = "centre d'assistance"
privacy_security_contact = "Failles de sécurité : envoyez-les en privé à hello@, jamais publiquement ; accusé de réception sous 48 heures."
privacy_source_before = "Le code source complet de chaque version du jeu est sous AGPL-3.0-only, avec les conditions supplémentaires d'OpenFront. Le menu du jeu renvoie au code de la version concernée."
