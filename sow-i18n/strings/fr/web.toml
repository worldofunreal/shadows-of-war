leader_caesar_mechanics = "Réduit les pertes de troupes lors de la conquête de cases et des combats frontaliers. Caesar échange ses unités avec une efficacité supérieure contre les défenseurs neutres et les frontières ennemies."
leader_cleopatra_mechanics = "Accélère la production d'or des complexes industriels. Le surplus permet de placer rapidement villes, bunkers défensifs et améliorations."
leader_ragnar_mechanics = "Récompense l'expansion côtière. Les ports placés près de l'eau génèrent beaucoup d'or et donnent accès aux cases aquatiques."
leader_suntzu_mechanics = "Augmente la cadence de recrutement des usines. Accélère le rétablissement de l'armée après les grandes batailles."
leader_alexander_mechanics = "Augmente la vitesse de conquête à chaque cycle de simulation. Permet de s'étendre rapidement dans les territoires neutres."
leader_genghiskhan_mechanics = "Transforme les victoires en revenus pour le trésor. Vaincre armées et structures développées reverse de l'or dans votre économie."
leader_richard_mechanics = "Augmente le plafond de troupes pour chaque district urbain placé. Permet de réunir de grandes armées avant les offensives."
leader_vercingetorix_mechanics = "Augmente la régénération de base des troupes depuis les villes. La main-d'œuvre passive suit l'urbanisation du territoire."
leader_boudica_mechanics = "Augmente le rendement en or des districts urbains. Permet une économie fondée sur les centres de population plutôt que les usines."
leader_ladysixsky_mechanics = "Maximise le rendement des usines. Génère d'importants revenus pour financer expansion et structures défensives."
leader_leonidas_mechanics = "Augmente la capacité maximale de l'armée grâce aux modules d'armurerie des villes. Les bunkers restent défensifs et n'offrent pas le bonus de Leonidas."
leader_napoleon_mechanics = "Le plus grand multiplicateur de vitesse d'expansion du moteur. Revendique rapidement les régions neutres et accélère la frontière."
