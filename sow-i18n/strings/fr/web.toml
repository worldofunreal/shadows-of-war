terms_general_before = "Le droit du Delaware régit ces Conditions ; les réclamations non arbitrées relèvent exclusivement des tribunaux du Delaware. Les mises à jour importantes prennent effet après un avis visible ; l'utilisation continue vaut acceptation. Contact : World of Unreal —"
