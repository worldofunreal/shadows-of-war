cookies_game_body = "préférences client et données de jeu téléchargées."
cookies_third_party_title = "Tiers"
cookies_third_party_body = "Les polices sont hébergées sur notre propre domaine. Aucun code tiers n'exécute de stockage ou de suivi sur nos pages : pas de réseaux publicitaires, de widgets sociaux, de scripts de rejeu de session ni d'identifiants intersites. Nos pages n'effectuent aucune requête interorigine."
cookies_dont_title = "Ce que nous ne faisons pas"
cookies_dont_ads = "Aucun cookie publicitaire ni publicité ciblée par centres d'intérêt."
cookies_dont_sell = "Aucune vente ni aucun partage de données personnelles à des fins publicitaires."
cookies_dont_tracking = "Aucun suivi intersite ou interapplication."
cookies_dont_body = "Comme il n'y a pas de suivi comportemental, les signaux Global Privacy Control et Do Not Track n'ont rien à désactiver ; nous respectons néanmoins le GPC comme opposition à la vente ou au partage."
cookies_controls_title = "Vos contrôles"
cookies_controls_clear = "Effacez les données du site dans les réglages du navigateur pour supprimer les identifiants de session et les ressources en cache. Le jeu continuera de fonctionner et démarrera une nouvelle session."
cookies_controls_block = "Bloquer tout stockage peut forcer le téléchargement des ressources du jeu et réinitialiser les préférences à chaque visite."
cookies_controls_rights = "Pour vos droits sur les données (accès, suppression, portabilité), consultez la Politique de confidentialité ou écrivez à"
cookies_changes_title = "Changements"
cookies_changes_body = "Si nous ajoutons un jour un stockage non essentiel (fournisseurs analytiques, contenus intégrés ou publicité), cet avis précisera chaque élément, son objectif et ses contrôles avant sa mise en ligne ; la Politique de confidentialité sera mise à jour en même temps. Dernière mise à jour : septembre 2026."
terms_title = "Conditions d'utilisation — Shadows of War"
terms_description = "Lisez les conditions d'utilisation de Shadows of War : comptes, objets virtuels et politique de non-remboursement, conduite, responsabilité et règlement des litiges."
