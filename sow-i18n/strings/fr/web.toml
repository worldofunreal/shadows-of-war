boudica_ninth_title = "Embusquez la neuvième"
boudica_ninth_body = "Legio IX Hispana avance du nord. Intercepter et vaincre ses forces."
boudica_ninth_hint = "Intercepteur Legio IX Hispana"
boudica_final_title = "La bataille finale"
boudica_final_body = "Vous avez maîtrisé l'expansion, le combat et le siège. Vaincre Suetonius Paulinus, puis retourner au menu."
boudica_final_hint = "Défaut Paulinus, puis retour au menu"
six_sky_ep1_landfall_title = "Nombre de débarquements"
six_sky_ep1_landfall_body = "682 CE. Vous êtes Wak Chanil Ajaw, fille de Dos Pilas, venez régner Naranjo. Déclarez des terres au-delà de votre frontière."
six_sky_ep1_landfall_hint = "Tapez sur les terres non réclamées pour les agrandir"
six_sky_ep1_fire_title = "Feu sacré"
six_sky_ep1_fire_body = "Faites pousser votre terre: chaque tuile nourrit vos troupes et votre or."
six_sky_ep1_fire_hint = "Étendre pour atteindre 512 tuiles tenues"
six_sky_ep1_blood_title = "Premier sang"
six_sky_ep1_blood_body = "Les petits villages tiennent le rivage. Faites glisser dans une frontière ennemie pour attaquer et prendre votre premier rival."
six_sky_ep1_blood_hint = "Faites glisser vers l'attaque — défaite 1 ennemi"
six_sky_ep1_villages_title = "Les Villages Kneel"
six_sky_ep1_villages_body = "Les villages lacustres doivent apprendre le nom de la nouvelle dynastie. Soumettez-les tous."
six_sky_ep1_villages_hint = "Défaut de 4 villages"
six_sky_ep1_rival_title = "Le vieux sang"
six_sky_ep1_rival_body = "Un demandeur de l'ancienne ligne de Naranjo refuse votre droit. Mettre fin à l'héritier rival."
six_sky_ep1_rival_hint = "Défaut du requérant Rival"
six_sky_ep1_caracol_title = "Briser le disjoncteur"
six_sky_ep1_caracol_body = "Caracol a quitté Naranjo kingless une fois auparavant. Sa garnison doit tomber."
six_sky_ep1_caracol_hint = "Défaut Caracol"
six_sky_ep1_vanguard_title = "Les yeux de Tikal"
six_sky_ep1_vanguard_body = "Tikal regarde à travers son avant-garde. Prenez son poste avancé."
six_sky_ep1_vanguard_hint = "Vaincre le Vanguard Tikal"
six_sky_ep1_queen_title = "Reine de Naranjo"
six_sky_ep1_queen_body = "Tikal se campe à proximité. Brisez-le, et votre ligne est sécurisée."
six_sky_ep1_queen_hint = "Défaut Tikal"
six_sky_ep2_regent_title = "Régent"
six_sky_ep2_regent_body = "693 CE. Ton fils de cinq ans est roi de Naranjo, et tu règnes en son nom. Élargir et montrer la force."
six_sky_ep2_regent_hint = "Tapez sur les terres non réclamées pour les agrandir"
six_sky_ep2_provinces_title = "Les provinces stir"
six_sky_ep2_provinces_body = "Ferments de rébellion dans les villages. La grève d'abord — prenez deux rivaux avant qu'ils ne s'unissent."
six_sky_ep2_provinces_hint = "Combattre 2 ennemis"
six_sky_ep2_uaxactun_title = "Premier feu: Uaxactun"
six_sky_ep2_uaxactun_body = "Les rebelles Uaxactun. Brûle sa défiance."
six_sky_ep2_uaxactun_hint = "Défaut Uaxactun Rebelles"
six_sky_ep2_yaxha_title = "Deuxième feu: Yaxha"
six_sky_ep2_yaxha_body = "Yaxha se lève ensuite. Forcez-la à réaffirmer son allégeance."
six_sky_ep2_yaxha_hint = "Défaut Yaxha Rebelles"
six_sky_ep2_tayasal_title = "Troisième feu: Tayasal"
six_sky_ep2_tayasal_body = "Un régent qui ne peut pas détenir Tayasal ne peut pas détenir Naranjo."
six_sky_ep2_tayasal_hint = "Défaut Tayasal Rebelles"
six_sky_ep2_seibal_title = "Quatrième feu: Seibal"
six_sky_ep2_seibal_body = "Les canots de Seibal portent la rébellion. Écraser sa défiance."
six_sky_ep2_seibal_hint = "Défaut Seibal Rebelles"
six_sky_ep2_caracol_title = "Le disjoncteur revient"
six_sky_ep2_caracol_body = "Caracol soutient les rebelles. Réglez la dette la plus ancienne de votre règne."
six_sky_ep2_caracol_hint = "Défaut Caracol"
six_sky_ep2_total_title = "Réaffirmer ou brûler"
six_sky_ep2_total_body = "Continuez à gagner jusqu'à ce que chaque voisin comprenne la régence."
six_sky_ep2_total_hint = "Battre 8 ennemis au total"
six_sky_ep2_coalition_title = "La coalition rompt"
six_sky_ep2_coalition_body = "Tikal a rassemblé vos ennemis dans une coalition. Brisez-le et aucune ville ne doutera de la régence."
six_sky_ep2_coalition_hint = "Contrer la coalition Tikal"
six_sky_ep3_count_title = "Le comte long"
six_sky_ep3_count_body = "Les années ont fait de vous des légendes et des cibles. Expandez encore une fois."
six_sky_ep3_count_hint = "Tapez sur les terres non réclamées pour les agrandir"
six_sky_ep3_offerings_title = "Offres"
six_sky_ep3_offerings_body = "Dieux et soldats demandent un tribut. Prenez deux rivaux pour nourrir les autels et les gardes."
six_sky_ep3_offerings_hint = "Combattre 2 ennemis"
six_sky_ep3_unknown_title = "L'ennemi inconnu"
six_sky_ep3_unknown_body = "Les scribes se disputent toujours sur l'origine de K'inichil Kab. Faux."
six_sky_ep3_unknown_hint = "Défaut K'inichil Kab"
six_sky_ep3_caracol_title = "Hôte de guerre"
six_sky_ep3_caracol_body = "Caracol envoie un hôte de guerre complet, son dernier lancer contre votre ligne. Détruisez-le."
six_sky_ep3_caracol_hint = "L'hôte de guerre Caracol"
six_sky_ep3_hill_title = "La colline"
six_sky_ep3_hill_body = "Xunantunich sur sa colline s'incline sans régent. Faites l'inclination de la colline."
six_sky_ep3_hill_hint = "Défaut Xunantunich Rebelles"
six_sky_ep3_moon_title = "Déesse de la lune"
six_sky_ep3_moon_body = "726 CE. Tenez un grand domaine digne de la déesse lune."
six_sky_ep3_moon_hint = "Élargir pour atteindre 1 024 carreaux maintenus"
six_sky_ep3_vanguard_title = "Vanguard à Dusk"
six_sky_ep3_vanguard_body = "L'avant-garde de Tikal vient au crépuscule. Montre-leur la reine Stela 24."
six_sky_ep3_vanguard_hint = "Vaincre le Vanguard Tikal"
six_sky_ep3_tribute_title = "Hommage refusé"
six_sky_ep3_tribute_body = "Tikal demande un dernier hommage à Naranjo. Réponds avec la guerre."
six_sky_ep3_tribute_hint = "Combattre 6 ennemis au total"
six_sky_ep3_legacy_title = "Héritage en pierre"
six_sky_ep3_legacy_body = "Défendre Tikal et laisser la ligne Naranjo debout dans la pierre."
six_sky_ep3_legacy_hint = "Défaut Tikal"

