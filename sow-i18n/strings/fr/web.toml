leader_vlad_iii_description = "Éliminer un joueur rapporte 50 % d'or en plus."
leader_sitting_bull_ability = "Territoire non cédé"
leader_sitting_bull_description = "Les armées des nations ont besoin de 25 % d'efforts supplémentaires pour conquérir votre territoire."
leader_matoaka_ability = "Paix de Matoaka"
leader_matoaka_description = "Les armées étrangères ont besoin de 25 % d’efforts supplémentaires pour conquérir votre territoire."

leader_burebista_ability = "Forteresses des Carpates"
leader_burebista_description = "Les armées ont besoin de 25 % d’effort en plus pour conquérir votre territoire."
