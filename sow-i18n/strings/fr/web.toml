[heroes]
leader_nafanua_name = "Nafanua"
leader_nafanua_historical = "La tradition orale samoane se souvient de Nafanua comme d’une guerrière et d’une dirigeante décisionnaire en temps de paix ; les récits lui attribuent la réunion de grands titres de chefferie, sans constituer une biographie contemporaine attestée."
leader_nafanua_civilization = "Samoa"
rarity_common = "Commun"
rarity_rare = "Rare"
rarity_epic = "Épique"
rarity_legendary = "Légendaire"
leader_muhumuza_name = "Muhumuza"
leader_muhumuza_historical = "Muhumuza, aussi appelée Muhumusa, dirigea la résistance dans les hautes terres du Ndorwa et du Kigezi, de part et d’autre de l’actuelle frontière entre le Rwanda et l’Ouganda. Médium de Nyabingi, elle s’appuya sur une tradition spirituelle déjà implantée dans les communautés locales. Elle rallia des partisans contre la cour du roi Musinga et l’expansion de la domination coloniale européenne."
leader_muhumuza_civilization = "Mouvement Nyabingi"

leader_khosrow_i_name = "Khosro Ier"
leader_khosrow_i_historical = "Khosro Ier, dit Anouchirvan, régna sur l’Empire sassanide de 531 à 579. Il réorganisa l’armée en quatre commandements régionaux. Des sceaux conservés nomment les généraux chargés de l’Est, du Sud, de l’Ouest et du Nord. Il poursuivit aussi l’arpentage lancé sous son père Kavadh Ier pour établir un barème fixe de l’impôt foncier."
leader_khosrow_i_civilization = "Empire sassanide"

leader_naram_sin_name = "Naram-Sin"
leader_naram_sin_historical = "Naram-Sin, petit-fils de Sargon, régna sur l’empire d’Akkad au troisième millénaire av. J.-C. Sa stèle de victoire commémore une campagne contre les Lullubi dans les monts Zagros. Le relief montre le roi et ses soldats gravissant la pente. Naram-Sin domine les autres personnages par sa taille et porte un casque à cornes associé à la divinité."
leader_naram_sin_civilization = "Empire d’Akkad"

leader_jalal_al_din_mangburni_name = "Jalal Mangburni"
leader_jalal_al_din_mangburni_historical = "Jalal al-Din Mangburni succéda à son père Muhammad II alors que l’invasion mongole disloquait l’Empire khwarezmien. Il rassembla ses troupes à Ghazni et vainquit une armée mongole à Parwan en 1221. Gengis Khan le poursuivit jusqu’à l’Indus. Jalal al-Din y perdit la bataille, mais traversa le fleuve à cheval et une partie de ses forces gagna aussi l’autre rive."
leader_jalal_al_din_mangburni_civilization = "Empire khwarezmien"

leader_modu_chanyu_name = "Modu Chanyu"
leader_modu_chanyu_historical = "Modu, aussi appelé Maodun, prit le titre de chanyu vers 209 av. J.-C. et fit des Xiongnu une puissance de la steppe orientale. L’historien chinois Sima Qian raconte que leurs voisins Donghu éprouvèrent le nouveau chef par des demandes successives. Modu céda deux fois, puis refusa de livrer la bande inhabitée entre les avant-postes et lança une offensive."
leader_modu_chanyu_civilization = "Xiongnu"

leader_hiawatha_haudenosaunee_name = "Hiawatha"
leader_hiawatha_haudenosaunee_historical = "La tradition orale haudenosaunee se souvient de Hiawatha, aussi appelé Aionwatha, pour son aide au Pacificateur dans le rapprochement des nations mohawk, oneida, onondaga, cayuga et seneca. Dans le récit onondaga, Hiawatha est en deuil et le Pacificateur lui adresse des paroles de consolation en tenant des rangs de perles de coquillage, le wampum. Hiawatha aide ensuite à porter le message de paix. La date exacte de l’union demeure inconnue."
leader_hiawatha_haudenosaunee_civilization = "Confédération haudenosaunee"

leader_kaahumanu_hawaii_name = "Kaʻahumanu"
leader_kaahumanu_hawaii_historical = "À la mort de Kamehameha Ier en 1819, Kaʻahumanu annonça qu’elle partagerait le pouvoir avec son successeur Liholiho, Kamehameha II. Elle inaugura la charge de kuhina nui. Dans les premières années, cette fonction donnait une autorité comparable à celle du roi sur les terres, les accords et la justice. Kaʻahumanu continua à gouverner en tant que régente de Kauikeaouli, Kamehameha III, jusqu’à sa mort en 1832."
leader_kaahumanu_hawaii_civilization = "Royaume d’Hawaï"

leader_sargon_of_akkad_name = "Sargon"
leader_sargon_of_akkad_historical = "Sargon fonda la dynastie d’Akkad en Mésopotamie vers la fin du troisième millénaire av. J.-C. Ses inscriptions royales célèbrent la défaite de Lugalzagesi d’Uruk et la démolition des remparts de villes comme Uruk et Ur. Certaines ne sont connues que par des copies réalisées longtemps après son règne. Les inscriptions mentionnent aussi des gens d’Akkad nommés à des postes de gouverneur dans les territoires conquis. Les archives administratives permettent de suivre les pratiques locales qui subsistèrent sous le nouveau pouvoir."
leader_sargon_of_akkad_civilization = "Empire d’Akkad"

leader_mithridates_vi_name = "Mithridate VI"
leader_mithridates_vi_historical = "Mithridate VI Eupator régna sur le Pont, sur la rive sud de la mer Noire. Il étendit l’influence de son royaume autour de cette mer et affronta Rome en Anatolie. Durant la troisième guerre contre Rome, le général Lucullus le chassa du Pont. Mithridate se réfugia auprès de Tigrane II d’Arménie, qui avait épousé sa fille. Cette alliance lui permit de se regrouper et d’obtenir des hommes pour son retour."
leader_mithridates_vi_civilization = "Royaume du Pont"

leader_gudit_yodit_name = "Gudit"
leader_gudit_yodit_historical = "La tradition éthiopienne se souvient de Gudit, aussi appelée Yodit, comme d’une reine qui se souleva contre Aksoum. L’Histoire des patriarches d’Alexandrie rapporte un appel adressé au Xe siècle à Georges de Nubie par un souverain éthiopien anonyme. Une reine des Bani al-Hamwiyah aurait fait des prisonniers, incendié des villes et chassé le souverain de lieu en lieu. La lettre originale est perdue. La chronique ecclésiastique en transmet le contenu et rattache la crise à une demande de nomination d’un nouveau métropolite."
leader_gudit_yodit_civilization = "Hauts plateaux éthiopiens"

leader_khutulun_qaidu_name = "Khutulun"
leader_khutulun_qaidu_historical = "Khutulun, aussi appelée Qutulun, fut princesse et commandante mongole en Asie centrale. Son père Qaïdu dirigeait un domaine de la maison d’Ögödei et résistait à l’autorité de Kubilaï et de ses successeurs. Marco Polo l’appelle Aijaruc et raconte qu’elle s’avançait à cheval en campagne pour faire des prisonniers. Il décrit aussi des prétendants qui misaient des chevaux lors de combats de lutte. Les victoires et les nombres avancés dans ce récit restent difficiles à vérifier."
leader_khutulun_qaidu_civilization = "Ulus de Qaïdu"

leader_sor_juana_ines_de_la_cruz_name = "Sor Juana"
leader_sor_juana_ines_de_la_cruz_historical = "Sor Juana Inés de la Cruz fut écrivaine et religieuse hiéronymite dans la Nouvelle-Espagne du XVIIe siècle. Les sources divergent sur son année de naissance, 1648 ou 1651. Au couvent de San Jerónimo, à Mexico, elle écrivit de la poésie et du théâtre, dont El divino Narciso. En 1690 elle rédigea une critique d’un sermon du jésuite portugais António Vieira. Manuel Fernández de Santa Cruz, évêque de Puebla, la publia sous le titre de Carta atenagórica et s’adressa à l’autrice sous le nom de Sor Filotea de la Cruz."
leader_sor_juana_ines_de_la_cruz_civilization = "Nouvelle-Espagne"

leader_sibylla_name = "Sibylle"
leader_sibylla_historical = "Sibylle était la fille d’Amaury de Jérusalem et d’Agnès de Courtenay. Avant de devenir reine, elle détenait le comté de Jaffa et d’Ascalon. Dans une charte de 1177, elle accorda au comte Rodrigue et aux frères de son ordre des tours, un jardin et des revenus à Ascalon. Elle eut du comte Guillaume de Montferrat un fils, le futur Baudouin V. À la mort de ce dernier en 1186, Sibylle revendiqua la couronne de Jérusalem en son nom et fit de son second époux, Guy de Lusignan, un roi à ses côtés."
leader_sibylla_civilization = "Royaume de Jérusalem"

leader_cynethryth_mercia_name = "Cynethryth"
leader_cynethryth_mercia_historical = "Cynethryth fut reine de Mercie à la fin du VIIIe siècle, puis abbesse de Cookham. Elle figure comme témoin dans des chartes du règne d’Offa et fut la mère de son successeur Ecgfrith. Des deniers d’argent portent son nom et son titre de reine, distinction exceptionnelle dans l’Angleterre anglo-saxonne. Plusieurs exemplaires sont signés par le monnayeur Eoba, dont l’activité est associée à Canterbury. Ces pièces attestent la diffusion de son titre, même si les conditions précises de l’émission demeurent incertaines."
leader_cynethryth_mercia_civilization = "Royaume de Mercie"

leader_suppiluliuma_name = "Suppiluliuma Ier"
leader_suppiluliuma_historical = "Suppiluliuma Ier régna sur le Hatti au XIVe siècle av. J.-C. Ses campagnes étendirent le contrôle hittite au nord de la Syrie, où il plaça son fils Piyassili à la tête du royaume de Karkemish. Son accord avec Shattiwaza du Mitanni associait le soutien à un prétendant au trône à un nouvel ordre politique."
leader_suppiluliuma_civilization = "Empire hittite"

leader_baibars_name = "Baybars"
leader_baibars_historical = "Al-Zahir Baybars régna sur le sultanat mamelouk de 1260 à 1277. Un dinar d’or du Caire conservé au Louvre porte son nom et ses titres. Ses campagnes étendirent l’autorité mamelouke au Levant. En 1271, il conduisit une coalition contre la forteresse hospitalière du Crac des Chevaliers."
leader_baibars_civilization = "Sultanat mamelouk"

leader_emperor_qin_shi_huang_name = "Ying Zheng"
leader_emperor_qin_shi_huang_historical = "Qin Shi Huang, né Ying Zheng, devint le premier empereur des Qin après la victoire de son royaume sur ses derniers rivaux en 221 av. J.-C. Son gouvernement étendit les normes de poids et de mesure de Qin aux territoires conquis. Des inscriptions conservées sur des poids et des récipients attestent cette réforme."
leader_emperor_qin_shi_huang_civilization = "Dynastie Qin"

leader_spartacus_name = "Spartacus"
leader_spartacus_historical = "Spartacus était un gladiateur thrace qui dirigea la révolte née à Capoue en 73 av. J.-C. Plutarque raconte que les fugitifs utilisèrent des ustensiles de cuisine pour s’évader et s’emparèrent ensuite d’armes transportées par des chariots. Appien les montre s’armant en chemin et se réfugiant au Vésuve, où leurs rangs grossirent."
leader_spartacus_civilization = "Insurgés de Spartacus"

leader_queen_nefertiti_name = "Néfertiti"
leader_queen_nefertiti_historical = "Néfertiti était la grande épouse royale d’Akhenaton sous la XVIIIe dynastie égyptienne. À Akhetaton, aujourd’hui Amarna, elle occupait une place visible dans le culte d’Aton. Un fragment de quartzite rouge conservé au musée Petrie la montre en train de verser une libation sous les rayons du disque solaire."
leader_queen_nefertiti_civilization = "Égypte antique"

leader_mandukhai_name = "Mandukhai Khatun"
leader_mandukhai_historical = "Mandukhai Khatun exerça une autorité politique et militaire parmi les Mongols à la fin du XVe siècle. Après la mort de Manduul Khan, elle contribua au retour de la lignée de Gengis Khan au pouvoir lors de la succession associée à Dayan Khan. Des chroniques mongoles plus tardives lui attribuent aussi le commandement de campagnes contre les Oïrats."
leader_mandukhai_civilization = "Yuan du Nord"

leader_kabal_xook_name = "K’ab’al Xook"
leader_kabal_xook_historical = "K’ab’al Xook a consacré la Structure 23 en 726 à Yaxchilán, cité maya sur l’Usumacinta, dans l’actuel Chiapas. Épouse principale du souverain Itzamnaaj B’alam, elle est nommée dans les inscriptions et représentée sur trois reliefs de pierre qui surmontaient les portes de l’édifice."
leader_kabal_xook_civilization = "Yaxchilán"

leader_lakshmibai_name = "Lakshmibai"
leader_lakshmibai_historical = "Lakshmibai, rani de Jhansi, s’opposa à l’annexion de son État par la Compagnie des Indes orientales après la mort de Gangadhar Rao. La Compagnie refusa de reconnaître leur fils adoptif comme successeur. Pendant la révolte indienne de 1857–1858, elle dirigea la défense de Jhansi contre les forces de Hugh Rose. Lorsque les Britanniques prirent Jhansi en 1858, elle s’échappa et rejoignit à Kalpi d’autres forces insurgées, dont celles liées à Tatya Tope. Elle poursuivit le combat après la chute de Kalpi et mourut près de Gwalior en juin 1858."
leader_lakshmibai_civilization = "Jhansi"

leader_pharaoh_hatshepsut_name = "Hatchepsout"
leader_pharaoh_hatshepsut_historical = "Hatchepsout gouverna l’Égypte au XVe siècle av. J.-C., sous la XVIIIe dynastie. Elle fut d’abord régente du jeune Thoutmôsis III, son neveu et beau-fils. Elle prit ensuite le titre et les pouvoirs du pharaon tandis qu’il demeura corégent. Elle commanda notamment son temple en terrasses à Deir el-Bahari. Les reliefs du portique médian sud montrent l’expédition qu’elle envoya à Pount, la rencontre de la délégation égyptienne avec ses habitants et le chargement des marchandises. Le temple présente le voyage dans un cadre royal et religieux."
leader_pharaoh_hatshepsut_civilization = "Égypte ancienne"

leader_thusnelda_cherusci_name = "Thusnelda"
leader_thusnelda_cherusci_historical = "Thusnelda était une noble chérusque du début du Ier siècle apr. J.-C. Son père Segestes recherchait l’appui de Rome, tandis que son époux Arminius dirigeait la résistance. Selon Tacite, en 15 les forces d’Arminius assiégèrent Segestes, qui appela Germanicus à l’aide. L’armée romaine leva le siège et prit sous sa garde Thusnelda, alors enceinte. Dans le discours que Tacite prête à Segestes, celui-ci dit qu’elle se trouvait chez lui contre son gré. L’historien romain la montre affrontant sa capture sans supplier."
leader_thusnelda_cherusci_civilization = "Chérusques"

leader_queen_cartimandua_name = "Cartimandua"
leader_queen_cartimandua_historical = "Cartimandua gouverna les Brigantes dans le nord de l’actuelle Angleterre au Ier siècle apr. J.-C. L’historien romain Tacite est la principale source narrative conservée sur son règne. En 51, Caratacos, un chef de la résistance à Rome, chercha refuge auprès d’elle après une défaite. Elle le fit prisonnier et le livra aux Romains. Tacite relate aussi son conflit avec Venutios et l’intervention de troupes romaines qui la secoururent en 69, après quoi Venutios conserva le trône."
leader_queen_cartimandua_civilization = "Brigantes"

leader_queen_suriyothai_name = "Suriyothai"
leader_queen_suriyothai_historical = "Suriyothai était reine d’Ayutthaya sous le règne de Maha Chakkraphat. Les récits de l’invasion par les forces du roi birman Tabinshwehti lui donnent un rôle dans une campagne que la province d’Ayutthaya date de 1548. Dans la tradition des chroniques royales, la reine rejoignit l’armée à dos d’éléphant. Quand le roi se trouva en danger, elle s’interposa entre lui et le commandant ennemi et fut mortellement blessée. Le récit lui attribue une décision prise sur le champ de bataille qui eut des conséquences pour le roi et son armée."
leader_queen_suriyothai_civilization = "Royaume d’Ayutthaya"

leader_tarabai_name = "Tarabai"
leader_tarabai_historical = "Tarabai (1675–1761) prit la tête du gouvernement marathe à la mort de Rajaram en 1700, comme régente de leur jeune fils Shivaji. Elle coordonna les commandants et défendit les places fortes face à l’empereur moghol Aurangzeb. L’historien Richard M. Eaton décrit sa décision d’envoyer des forces au nord en territoire moghol alors que les forts marathes étaient assiégés. Le répertoire historique de Satara rapporte qu’elle confia la surveillance des forts à Parashuram Trimbak. Après la mort d’Aurangzeb en 1707, le retour du prétendant Shahu ouvrit une lutte au sein de la maison marathe."
leader_tarabai_civilization = "Empire marathe"

leader_natavan_name = "Natavan"
leader_natavan_historical = "Khurshid Banu Natavan était une poétesse et mécène azerbaïdjanaise de Choucha, où elle mourut en 1897. Les sources publiées divergent sur son année de naissance et donnent notamment 1830 et 1832. Fille de Mehdiqulu Khan, le dernier khan du Karabagh, elle consacra des ressources de sa famille à des projets civiques et culturels. En 1872, elle prit la direction du Majlis-i Uns, un cercle qui réunissait des poètes à Choucha et échangeait avec d’autres cercles. Elle écrivit des ghazals et des élégies, et un album illustré témoigne également de son travail artistique."
leader_natavan_civilization = "Karabagh"

leader_mavia_name = "Mavia"
leader_mavia_historical = "Mavia, aussi appelée Mawiyya, dirigea des communautés arabes de la frontière orientale romaine et conclut la paix avec l’Empire à la fin du IVe siècle."
leader_mavia_civilization = "Arabes tanoukhides"

leader_queen_nandi_name = "Nandi"
leader_queen_nandi_historical = "Nandi kaBhebhe (vers 1764–1827), originaire de la communauté eLangeni, devint reine mère après l’ascension de son fils Shaka chez les Zoulous."
leader_queen_nandi_civilization = "Royaume zoulou"

