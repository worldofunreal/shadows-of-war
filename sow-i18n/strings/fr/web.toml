cookies_use_body = "Shadows of War utilise uniquement le stockage client strictement nécessaire ; aucune bannière de consentement n'est nécessaire car le site et le jeu ne peuvent pas fonctionner sans lui :"
cookies_session_label = "Identifiants de session analytique"
cookies_session_body = "identifiants aléatoires qui regroupent les événements de première partie pendant une visite. Ils disparaissent à la fermeture de l'onglet."
cookies_events_label = "Événements produit de première partie :"
