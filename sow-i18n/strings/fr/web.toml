leader_erendira_civilization = "Purépecha"
leader_tarenorerer_name = "Tarenorerer"
leader_tarenorerer_historical = "Tarenorerer, une femme tommeginne du nord de la Tasmanie, revint sur ses terres en 1828 après avoir été enlevée et vendue à des chasseurs de phoques. Selon l’Australian Dictionary of Biography, elle rassembla des hommes et des femmes de plusieurs groupes, les forma à l’usage des armes à feu et organisa des attaques contre les colons envahisseurs. Une grande partie des récits écrits conservés vient d’observateurs coloniaux, notamment de George Augustus Robinson ; leurs termes et leurs affirmations sur ses motivations doivent donc être examinés avec prudence."
