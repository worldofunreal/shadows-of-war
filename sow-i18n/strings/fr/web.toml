terms_updated = "Dernière mise à jour : septembre 2026 · World of Unreal"
terms_acceptance_title = "Acceptation et éligibilité"
terms_acceptance_body = "Ces Conditions constituent un accord contraignant entre vous et World of Unreal régissant l'utilisation de Shadows of War sur shadowsofwar.io, les plateformes partenaires et les clients natifs. En jouant, installant ou utilisant le Service, vous acceptez ces Conditions. Si vous n'êtes pas d'accord, n'utilisez pas le Service."
terms_acceptance_age = "Vous devez avoir au moins 13 ans. Les joueurs de 13 à 17 ans ne peuvent jouer qu'avec l'autorisation et la supervision d'un parent ou tuteur. Le Service ne s'adresse pas aux moins de 13 ans."
terms_changes_title = "Évolutions du jeu et du Service"
terms_changes_body = "Le multijoueur nécessite un accès réseau à nos serveurs. Nous pouvons modifier, suspendre ou interrompre toute partie du Service — modes, cartes, saisons, classements et événements — à tout moment, avec ou sans préavis et sans responsabilité envers vous."
terms_accounts_title = "Comptes"
terms_accounts_body = "Le jeu anonyme crée un identifiant de compte canonique stocké sur votre appareil avec un nom d'affichage. Effacer le stockage du site crée un nouveau compte ; les changements de nom ne modifient jamais l'identifiant. L'identifiant sert à retrouver la progression, ce n'est pas un mot de passe : sécurisez votre appareil."
terms_accounts_contact = "Vous êtes responsable de toute activité sur votre compte. Signalez tout accès non autorisé présumé à"
terms_license_title = "Licence et restrictions"
terms_license_body = "Ces Conditions régissent l'accès au Service officiel hébergé, aux comptes, aux objets virtuels et aux données serveur. Le code source complet du jeu est soumis séparément à AGPL-3.0-only, avec les conditions supplémentaires d'OpenFront. Ces Conditions ne limitent pas les droits accordés par cette licence de code ni par les licences distinctes des cartes."
terms_maps_before = "Les sources de cartes dérivées d'OpenFront et les fichiers de cartes générés sont sous licence"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "L'avis sur les cartes indique leur attribution, leur source et les modifications :"
terms_maps_notice = "avis sur les cartes"
terms_license_no_sell = "Ne vendez, ne louez, ne sous-licenciez ni n'exploitez commercialement le Service officiel hébergé, les comptes ou les objets virtuels."
terms_license_no_reverse = "N'effectuez pas de rétro-ingénierie, d'extraction massive ni d'entraînement de modèles sur le Service officiel hébergé. Ces restrictions ne réduisent pas les droits accordés par les licences du code et des cartes."
terms_license_feedback = "Nous pouvons utiliser librement les commentaires partagés, sans rémunération ni attribution."
terms_virtual_title = "Objets virtuels et aucun remboursement"
terms_virtual_body = "Les gemmes, déblocages de dirigeants et skins sont uniquement des objets virtuels sous licence : sans valeur monétaire, non transférables et révocables. Les déblocages de dirigeants modifient le gameplay ; ils ont des avantages propres et ne sont pas purement cosmétiques."
terms_sales_final = "TOUTES LES VENTES SONT DÉFINITIVES."
terms_virtual_refunds = "Les objets virtuels ne sont ni remboursables ni remplaçables dans toute la mesure permise par la loi, notamment pour les objets utilisés ou non désirés, les changements du Service ou les mesures prises pour violation des Conditions. Si une plateforme annule un achat, nous pouvons retirer les objets correspondants et prendre des mesures sur le compte."
terms_conduct_title = "Comportement du joueur"
terms_conduct_cheating = "Pas de triche, bots, macros, automatisation, exploitation de bugs ni désynchronisations volontaires."
terms_conduct_harassment = "Pas de harcèlement, menaces, incitation à la haine ni doxxing. Les noms, tags et chats doivent respecter la loi."
terms_conduct_servers = "Ne perturbez pas les serveurs, ne sondez pas l'infrastructure et ne touchez pas aux comptes, identifiants ou tickets d'autres joueurs."
terms_conduct_after = "Les violations peuvent entraîner la suppression de contenu, la perte de la partie, la suspension ou la résiliation."
terms_third_party_title = "Services tiers et autres joueurs"
terms_third_party_body = "Les plateformes partenaires et leurs SDK, les prestataires de paiement, Discord et Telegram sont des tiers que nous ne contrôlons pas ; leurs propres conditions s'appliquent et vous les utilisez à vos risques. Les interactions avec les autres joueurs ne concernent que vous et eux. Dans toute la mesure permise par la loi, vous libérez World of Unreal des réclamations liées aux tiers ou aux autres joueurs."
terms_termination_title = "Résiliation"
terms_termination_body = "Nous pouvons suspendre ou résilier votre accès — comptes, objets ou classements — à tout moment et pour toute raison, notamment une violation présumée des Conditions, sans responsabilité. À la résiliation, votre licence prend fin et les objets virtuels sont perdus sans remboursement."
terms_disclaimer_title = "Exclusions de garantie"
terms_disclaimer_body = "LE SERVICE EST FOURNI EN L'ÉTAT ET SELON SA DISPONIBILITÉ. DANS TOUTE LA MESURE PERMISE PAR LA LOI, NOUS EXCLUONS TOUTE GARANTIE, Y COMPRIS DE QUALITÉ MARCHANDE, D'ADÉQUATION À UN USAGE PARTICULIER, DE TITRE ET D'ABSENCE DE CONTREFAÇON. Nous ne garantissons pas un fonctionnement ininterrompu, sans erreur ou sécurisé, ni la conservation de la progression, des rangs ou des objets."
terms_liability_title = "Limitation de responsabilité"
terms_liability_body = "DANS TOUTE LA MESURE PERMISE PAR LA LOI, NOUS NE SOMMES PAS RESPONSABLES DES PROFITS, DONNÉES, OBJETS OU PROGRESSIONS PERDUS, NI DES DOMMAGES INDIRECTS OU CONSÉCUTIFS. NOTRE RESPONSABILITÉ TOTALE EST LIMITÉE AU PLUS ÉLEVÉ DE 50 USD OU DE CE QUE VOUS AVEZ PAYÉ POUR DES OBJETS VIRTUELS AU COURS DES SIX MOIS PRÉCÉDANT L'INCIDENT."
terms_indemnification_title = "Indemnisation"
terms_indemnification_body = "Vous acceptez de défendre et d'indemniser World of Unreal contre les réclamations et coûts raisonnables liés à votre utilisation du Service, à la violation de ces Conditions ou de la loi."
terms_arbitration_title = "Litiges et arbitrage"
terms_arbitration_before = "Les litiges sont soumis à un arbitrage individuel contraignant (JAMS, Delaware) après une tentative de résolution informelle de 45 jours, et non aux tribunaux. Vous renoncez au jury et aux actions collectives. Les petites créances et injonctions de propriété intellectuelle sont exceptées. Vous pouvez vous retirer de l'arbitrage dans les 30 jours suivant votre première acceptation de ces Conditions en écrivant à"
terms_arbitration_after = "avec votre identifiant de compte et une déclaration claire de retrait."
terms_general_title = "Dispositions générales"
terms_general_before = "Le droit du Delaware régit ces Conditions ; les réclamations non soumises à l'arbitrage relèvent exclusivement des tribunaux du Delaware. Nous annoncerons clairement les changements importants avant leur entrée en vigueur. Si la loi applicable exige un nouvel accord, nous le demanderons séparément. Contact : World of Unreal —"
terms_privacy_title = "Confidentialité"
terms_privacy_before = "Le traitement des données, vos droits et la suppression sont décrits dans notre"
terms_privacy_and = "et notre"
terms_privacy_after = ", intégrés ici par référence."
analytics_title = "Analyses facultatives"
analytics_body = "Nous utilisons l’activité du site et du jeu pour améliorer Shadows of War. Elle reste désactivée sans votre accord."
analytics_policy = "Détails des cookies"
analytics_accept = "Autoriser"
analytics_reject = "Refuser"
analytics_manage = "Paramètres des cookies"
privacy_analytics_body_v2 = "Les analyses facultatives de première partie sur notre site et notre jeu navigateur ne fonctionnent qu’après votre accord. Le démarrage du jeu ne les active pas. Elles enregistrent un ensemble fermé d’événements de visite, chargement, menu, tutoriel, salon, début et sortie de partie, ainsi que la version, la langue et une catégorie générale de taille d’écran, et non une empreinte complète de l’appareil. Si un identifiant de compte est présent, notre serveur le remplace avant stockage par un pseudonyme chiffré propre à ce canal. Aucun nom, message, mot de passe, identifiant publicitaire ou clic sur la carte n’est enregistré."
privacy_cookies_body_v2 = "Nous enregistrons votre choix concernant les analyses dans le stockage local. Ce n’est qu’après votre accord que nous créons un identifiant temporaire de session d’analyse et une petite file de nouvelles tentatives dans le stockage de session. Refuser les analyses n’affecte pas le jeu. Les paramètres du jeu, la continuité du compte et les ressources en cache utilisent un stockage distinct nécessaire à ces fonctions. Détails et contrôles dans notre"
privacy_retention_body_v2 = "Les fichiers d’événements, compteurs d’analyse et adhésions expirent dans un délai de 90 jours. Après vérification, la suppression d’un compte efface les événements associés et les adhésions ; les totaux quotidiens non identifiants ne subsistent pas au-delà de ces 90 jours. Les comptes et historiques de partie sont conservés jusqu’à votre demande de suppression ou à la résiliation du compte selon les Conditions."
privacy_updated_v2 = "Dernière mise à jour : 6 octobre 2026 · Responsable : World of Unreal · Contact : hello@shadowsofwar.io"
cookies_analytics_title = "Analyses facultatives sur notre site et notre jeu navigateur"
cookies_analytics_events = "Elles comptent les visites, étapes de chargement, actions du menu, progression du tutoriel, entrées dans les salons, débuts et sorties explicites de partie, ainsi qu’une catégorie générale de taille d’écran. Elles ne collectent ni noms, conversations, mots de passe, identifiants de salon, achats, clics sur la carte ni chaîne complète de l’agent utilisateur."
cookies_analytics_server = "Les événements autorisés sont envoyés directement à notre endpoint propriétaire /api/event, sans passer par le relais du jeu. Si un identifiant de compte est transmis, notre serveur le remplace avant stockage par un pseudonyme propre à ce site."
cookies_storage_title = "Stockage du navigateur et conservation"
cookies_storage_body = "Nous mémorisons localement votre choix d’autoriser ou de refuser. Après accord seulement, un identifiant temporaire de session et une petite file de nouvelles tentatives sont enregistrés dans le stockage de session. Les analyses comprennent la version, la langue et une catégorie générale de taille d’écran, pas la chaîne complète de l’agent utilisateur. Fichiers et adhésions expirent sous 90 jours ; une suppression de compte vérifiée efface les événements et adhésions associés. Les paramètres du jeu, la continuité du compte, la récupération après incident et les ressources en cache utilisent un stockage distinct nécessaire à ces fonctions."
cookies_platforms_title = "Autres plateformes de jeu"
cookies_platforms_body = "Poki, CrazyGames et Jest peuvent mesurer l’usage avec leurs propres SDK et selon leurs conditions. Nous ne copions pas ces événements liés aux joueurs sur notre serveur. Les analyses propriétaires Android restent désactivées tant que les informations de la boutique ne sont pas mises à jour."
cookies_controls_v2 = "Vous pouvez autoriser ou refuser les analyses facultatives aussi facilement. Le démarrage du jeu ne vaut pas autorisation. Modifiez votre choix dans les paramètres du jeu ou ici ; le refus n’affecte pas le jeu. Effacer les données du site supprime aussi votre choix et les analyses restent désactivées jusqu’à votre nouvel accord. Nous ne vendons ni ne partageons les analyses à des fins publicitaires."
cookies_description_v2 = "Les analyses facultatives restent désactivées tant que vous ne les autorisez pas. Le démarrage du jeu ne les active pas. Découvrez les données stockées par Shadows of War et comment modifier votre choix."
cookies_og_description_v2 = "Les analyses facultatives restent désactivées tant que vous ne les autorisez pas. Vous pouvez modifier votre choix à tout moment."
cookies_updated_v2 = "Dernière mise à jour : 6 octobre 2026 · World of Unreal"
