leader_ivan_the_terrible_name = "Ivan IV"
leader_ivan_the_terrible_historical = "Ivan IV Vassiliévitch (1530–1584) fut couronné tsar en 1547. Sous son gouvernement furent créés les streltsy, une troupe permanente rémunérée, et Moscou conquit Kazan et Astrakhan. L’opritchnina imposa ensuite une répression brutale, dont l’interprétation historique reste controversée."
