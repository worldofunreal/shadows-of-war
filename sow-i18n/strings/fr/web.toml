how_title = "Comment jouer à Shadows of War — Stratégie multijoueur"
how_description = "Apprenez les premiers mouvements, l'économie, les alliances, la trahison et les règles de contrôle de la carte de Shadows of War."
how_og_description = "Le manuel de terrain pour étendre son territoire, construire, gérer son économie, former des alliances et contrôler la carte."
how_eyebrow = "Comment jouer"
how_heading = "Prenez la"
how_heading_em = "carte."
how_lede = "Shadows of War est un MMORTS en parties. Commencez avec un commandant, transformez le territoire en économie, forgez des alliances temporaires et luttez pour le contrôle de la carte."
getting_started = "Pour commencer"
how_steps_heading_1 = "Cinq actions"
how_steps_heading_2 = "pour comprendre"
how_steps_heading_3 = "la partie."
how_step_1_title = "Rejoindre le matchmaking et choisir le mode"
how_step_1_body = "Rejoignez le lobby de matchmaking actif. La file alterne entre chacun pour soi (FFA), batailles en équipes et humains contre nations du monde sur des cartes d'Europe, d'Asie, d'Afrique, d'East Anglia et des Amériques."
how_step_2_title = "Choisir son commandant et son avantage civilisationnel"
how_step_2_body = "Choisissez l'un des douze commandants historiques. Chaque dirigeant apporte un multiplicateur permanent, comme la force de combat 1,10x de Julius Caesar, l'or d'usine +50 % de Cleopatra, la production de troupes +20 % de Sun Tzu ou l'or portuaire +50 % de Ragnar."
compare_leader_traits = "Comparer les traits"
how_step_3_title = "Revendiquer un territoire et construire des districts spécialisés"
how_step_3_body = "Étendez-vous pour capturer les cases voisines. Chaque case capturée augmente l'or et le revenu de troupes de base. Construisez des bâtiments spécialisés sur votre territoire :"
city_label = "Villes :"
city_body = "Augmentent la capacité maximale de troupes et produisent des revenus passifs d'or et de troupes."
factory_label = "Usines :"
factory_body = "Produisent de l'or et accélèrent le recrutement des troupes."
port_label = "Ports :"
port_body = "Placés sur les côtes, ils produisent or et troupes et donnent accès à l'eau."
bunker_label = "Bunkers :"
bunker_body = "Fortifient les frontières, étendent la couverture défensive et réduisent les pertes subies. Les modules d'armurerie des villes augmentent la capacité maximale."
how_step_4_title = "Gérer économie, terrain et élan militaire"
how_step_4_body = "La conquête consomme des troupes. Réinvestissez l'or des usines, villes et ports dans de nouvelles constructions. Utilisez les multiplicateurs du terrain pour ancrer vos frontières et diriger l'armée vers les objectifs importants."
how_step_5_title = "Diplomatie, trahison et victoire par contrôle de la carte"
how_step_5_body_before = "Formez des pactes de non-agression avec vos voisins pour coordonner les fronts. Un joueur gagne en atteignant le"
how_step_5_threshold = "seuil de victoire de contrôle de la carte"
how_step_5_body_after = "(la majorité requise du territoire total) ou en éliminant tous les commandants rivaux. Une trahison rompt immédiatement l'alliance et transforme les frontières communes en fronts actifs."
match_structure = "Structure de la partie"
