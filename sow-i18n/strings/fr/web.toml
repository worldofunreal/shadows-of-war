privacy_title = "Politique de confidentialité — Shadows of War"
privacy_description = "Lisez la politique de confidentialité de Shadows of War : responsable, données collectées, partage, conservation de 90 jours, droits et suppression."
privacy_eyebrow = "Juridique et télémétrie"
privacy_heading = "Confidentialité"
privacy_heading_em = "politique."
privacy_updated = "Dernière mise à jour : septembre 2026 · Responsable : World of Unreal · Contact : hello@shadowsofwar.io"
privacy_overview_title = "Présentation et responsable"
privacy_overview_body = "Shadows of War est exploité par World of Unreal. Cette politique couvre shadowsofwar.io, les plateformes partenaires et les clients natifs. Contact confidentialité :"
privacy_overview_after = "Nous n'avons pas d'établissement dans l'UE ou au Royaume-Uni ; envoyez toutes les demandes, y compris celles liées au RGPD, directement à cette adresse."
privacy_overview_payments = "Les SDK des plateformes partenaires peuvent collecter des données selon leurs propres politiques. Les données de carte sont traitées directement par la boutique utilisée pour payer (Google Play, Apple ou Stripe) ; nous ne voyons jamais les numéros de carte."
privacy_eligibility_title = "Éligibilité et enfants"
privacy_eligibility_body = "13+. Les joueurs de 13 à 17 ans doivent avoir l'autorisation d'un parent ou tuteur. Le jeu ne s'adresse pas aux moins de 13 ans ; les comptes concernés sont suspendus et supprimés. Parents : écrivez à"
privacy_eligibility_after = "et nous supprimerons le compte rapidement."
privacy_data_title = "Données collectées"
privacy_gameplay_label = "Jeu :"
privacy_gameplay_body = "nom d'affichage, tag de clan, choix de dirigeant et de civilisation, actions de partie, historique, classements et objets possédés."
privacy_account_label = "Compte :"
privacy_account_body = "identifiant de compte aléatoire, identités de plateformes liées et hash à sens unique de votre secret de propriété (jamais le texte en clair)."
privacy_technical_label = "Technique :"
privacy_technical_body = "version du build, plateforme/langue, métadonnées de connexion, tickets de relais et journaux serveur pour la sécurité et la lutte contre les abus."
privacy_analytics_label = "Analyse produit (première partie uniquement) :"
privacy_purchases_label = "Achats :"
privacy_purchases_body = "identifiant produit, référence de transaction et état des droits via RevenueCat ou la boutique. Les données de paiement complètes restent chez la boutique."
privacy_public_label = "Public par conception :"
privacy_public_body = "noms, pseudonymes, classements et historiques de parties visibles par les autres joueurs."
privacy_use_title = "Utilisation et bases légales"
privacy_use_body = "Nous traitons les données nécessaires au fonctionnement du jeu, à la protection des joueurs et des systèmes, à l'assistance et au respect de nos obligations légales. Pour les personnes dans l'UE et au Royaume-Uni, les bases comprennent le contrat pour fournir le jeu, nos intérêts légitimes en matière de sécurité et d'anti-triche, les obligations légales applicables et votre consentement pour les analyses facultatives de première partie. Elles restent désactivées jusqu'à votre accord, que vous pouvez modifier dans les paramètres. Nous ne vendons pas de données personnelles et n'utilisons pas de publicité comportementale."
privacy_sharing_title = "Partage"
privacy_hosting_label = "Hébergement selon nos instructions :"
privacy_hosting_body = "IONOS, Microsoft Azure et Cloudflare."
privacy_payments_label = "Paiements :"
privacy_payments_body = "Google Play, Apple ou Stripe via RevenueCat, selon leurs politiques."
privacy_sdk_label = "SDK partenaires :"
privacy_sdk_body = "selon leur propre politique lorsque vous jouez par leur intermédiaire."
privacy_players_label = "Joueurs et public :"
privacy_players_body = "noms, pseudonymes, classements et historiques de parties."
privacy_authorities_label = "Autorités et transferts :"
privacy_authorities_body = "lorsque la loi l'exige ou à un successeur légal après notification."
privacy_cookies_title = "Cookies et stockage local"
privacy_cookies_body = "Stockage strictement nécessaire : identifiants de session. Les événements de première partie sont envoyés à notre propre endpoint. Aucun cookie publicitaire, social ou intersite. Nos polices sont hébergées sur notre domaine, sans requête interorigine. Détails et contrôles dans notre"
privacy_retention_title = "Conservation"
privacy_retention_body = "Les fichiers d'événements sont supprimés après 90 jours ; les compteurs et adhésions analytiques expirent via TTL sous 90 jours. Les déploiements n'effacent jamais l'état actif. Les comptes et l'historique persistent jusqu'à votre demande de suppression ou la fin du compte selon les Conditions."
privacy_rights_title = "Vos droits et suppression"
privacy_rights_body = "Accéder, corriger, supprimer, porter, vous opposer et limiter. Écrivez à"
privacy_rights_after = "avec votre identifiant de compte (ou votre nom et une date de création approximative). Les suppressions vérifiées effacent le compte, les identités liées, le miroir de métadonnées et les adhésions analytiques, puis vous le confirment. Le GPC est respecté comme opposition à la vente ou au partage (nous ne vendons ni ne partageons rien). Réponse aux recours sous 45 jours maximum."
privacy_security_title = "Sécurité, transferts et changements"
privacy_security_body = "Nous utilisons TLS lors des transferts, des composants internes accessibles uniquement en local, des interfaces d'exploitation protégées et des secrets de propriété hachés ; aucune sécurité n'est absolue. L'infrastructure fonctionne aux États-Unis et dans l'UE avec minimisation des données et sans transfert vers les technologies publicitaires. Nous annoncerons clairement les changements importants de cet Avis de confidentialité avant leur entrée en vigueur et demanderons un consentement distinct lorsque la loi l'exige. La poursuite de l'utilisation ne vaut pas consentement à elle seule."
privacy_contact_title = "Nous contacter"
privacy_contact_before = "Confidentialité :"
privacy_help = "Aide :"
support_center = "centre d'assistance"
privacy_security_contact = "Failles de sécurité : envoyez-les en privé à hello@, jamais publiquement ; accusé de réception sous 48 heures."
privacy_source_before = "Le code source complet de chaque version du jeu est sous AGPL-3.0-only, avec les conditions supplémentaires d'OpenFront. Le menu du jeu renvoie au code de la version concernée."
cookies_title = "Avis sur les cookies — Shadows of War"
cookies_description = "Comment Shadows of War utilise le stockage nécessaire : identifiants de session et événements de première partie. Aucun cookie publicitaire."
cookies_og_description = "Stockage strictement nécessaire uniquement. Aucun cookie publicitaire, social ou de suivi intersite."
cookies_eyebrow = "Juridique et stockage"
cookies_heading = "Avis sur les"
cookies_heading_em = "cookies."
cookies_updated = "Dernière mise à jour : septembre 2026 · World of Unreal"
cookies_use_title = "Ce que nous utilisons"
cookies_use_body = "Shadows of War utilise uniquement le stockage client strictement nécessaire ; aucune bannière de consentement n'est nécessaire car le site et le jeu ne peuvent pas fonctionner sans lui :"
cookies_session_label = "Identifiants de session analytique"
cookies_session_body = "identifiants aléatoires qui regroupent les événements de première partie pendant une visite. Ils disparaissent à la fermeture de l'onglet."
cookies_events_label = "Événements produit de première partie :"
cookies_events_body = "événements anonymes de parcours envoyés à nos serveurs"
cookies_events_after = "Ce n'est pas un cookie et ce n'est partagé avec aucun fournisseur."
cookies_game_label = "Paramètres du jeu et cartes en cache"
cookies_game_body = "préférences client et données de jeu téléchargées."
cookies_third_party_title = "Tiers"
cookies_third_party_body = "Les polices sont hébergées sur notre propre domaine. Aucun code tiers n'exécute de stockage ou de suivi sur nos pages : pas de réseaux publicitaires, de widgets sociaux, de scripts de rejeu de session ni d'identifiants intersites. Nos pages n'effectuent aucune requête interorigine."
cookies_dont_title = "Ce que nous ne faisons pas"
cookies_dont_ads = "Aucun cookie publicitaire ni publicité ciblée par centres d'intérêt."
cookies_dont_sell = "Aucune vente ni aucun partage de données personnelles à des fins publicitaires."
cookies_dont_tracking = "Aucun suivi intersite ou interapplication."
cookies_dont_body = "Comme il n'y a pas de suivi comportemental, les signaux Global Privacy Control et Do Not Track n'ont rien à désactiver ; nous respectons néanmoins le GPC comme opposition à la vente ou au partage."
cookies_controls_title = "Vos contrôles"
cookies_controls_clear = "Effacez les données du site dans les réglages du navigateur pour supprimer les identifiants de session et les ressources en cache. Le jeu continuera de fonctionner et démarrera une nouvelle session."
cookies_controls_block = "Bloquer tout stockage peut forcer le téléchargement des ressources du jeu et réinitialiser les préférences à chaque visite."
cookies_controls_rights = "Pour vos droits sur les données (accès, suppression, portabilité), consultez la Politique de confidentialité ou écrivez à"
cookies_changes_title = "Changements"
cookies_changes_body = "Si nous ajoutons un jour un stockage non essentiel (fournisseurs analytiques, contenus intégrés ou publicité), cet avis précisera chaque élément, son objectif et ses contrôles avant sa mise en ligne ; la Politique de confidentialité sera mise à jour en même temps. Dernière mise à jour : septembre 2026."
terms_title = "Conditions d'utilisation — Shadows of War"
terms_description = "Lisez les conditions d'utilisation de Shadows of War : comptes, objets virtuels et politique de non-remboursement, conduite, responsabilité et règlement des litiges."
