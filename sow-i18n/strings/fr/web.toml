leader_tribe_wiradjuri_ability = "Défense wiradjuri"
leader_tribe_wiradjuri_description = "Les défenseurs gagnent 15 % de force lorsqu’ils sont attaqués par un rival contrôlant plus de territoire."
leader_nation_yagan_ability = "Résistance whadjuk"
leader_nation_yagan_description = "Les attaques contre un peuple ou un royaume différent gagnent 15 % de force."
leader_peter_the_great_ability = "Fenêtre sur la Baltique"
leader_peter_the_great_description = "Après avoir conquis une côte ennemie, fondez gratuitement un port achevé sur un emplacement valide proche. Une fois par partie."
leader_empress_suiko_ability = "Échanges d’Asuka"
leader_empress_suiko_description = "Quand un allié vivant achève une nouvelle ville, vous et son bâtisseur recevez chacun 50 pièces d’or. Une fois par ville ; les améliorations ne comptent pas."
leader_nebuchadnezzar_ii_ability = "Double enceinte de Babylone"
leader_nebuchadnezzar_ii_description = "Achever une amélioration de ville augmente instantanément d’un niveau votre tour achevée de plus bas niveau à 20 cases ou moins, jusqu’au niveau 4."
leader_king_david_ability = "Butin de Tsiklag"
leader_king_david_description = "À la première capture de chaque ville ennemie achevée, 200 pièces d’or sont partagées équitablement entre vous et vos alliés vivants."
leader_sarraounia_mangou_ability = "Lougou résiste"
leader_sarraounia_mangou_description = "Perdre une ville mobilise 1 500 soldats de réserve, dans la limite de vos troupes. Une fois par ville, tant que vous possédez du territoire."
leader_muhammad_of_ghor_ability = "Retour à Tarain"
leader_muhammad_of_ghor_description = "Retirez une attaque contre un rival après au moins 3 secondes : vos attaques contre lui gagnent 35% de force pendant 30 secondes. Les pertes de retraite s’appliquent."
leader_puyi_ability = "Cour dépendante"
leader_puyi_description = "Recevez un supplément égal à 20% du revenu terrestre ordinaire de votre allié vivant le plus riche en revenus possédant plus de terres que vous. Son or n’est pas prélevé."
leader_pertinax_ability = "Trésor d’austérité"
leader_pertinax_description = "Sans attaque terrestre active de votre part contre des joueurs ou de joueurs contre vous, chaque tranche de 1 000 soldats produits au-delà du plafond devient 1 pièce d’or."
leader_ewuare_ability = "Quartiers des guildes"
leader_ewuare_description = "Chaque niveau actif d’usine à 20 cases ou moins d’une ville active vous appartenant produit 1 pièce d’or supplémentaire par seconde de jeu. Plusieurs villes ne cumulent pas l’effet."
leader_veleda_ability = "Prise du Rhin"
leader_veleda_description = "Vos obus navals capturent les navires de guerre ennemis vaincus au lieu de les couler. Ils changent de camp avec 25% de santé et sans expérience."
leader_amir_timur_ability = "Poursuite de la Horde"
leader_amir_timur_description = "Les tribus qui se retirent de votre territoire perdent 35 % de troupes en plus."
leader_ivan_the_terrible_ability = "Levée des streltsy"
leader_ivan_the_terrible_description = "La capture d’une ville ennemie achevée recrute jusqu’à 750 soldats si votre réserve a de la place. Une fois par partie, dans la limite de vos troupes."
leader_erendira_ability = "Le cheval repris"
leader_erendira_description = "Quand une armée ennemie perd des troupes en attaquant votre territoire, recrutez 15 % de ces pertes, dans la limite de vos troupes."
leader_tarenorerer_ability = "Entre les salves"
leader_tarenorerer_description = "Si la réserve de troupes du joueur ciblé dépasse le nombre de soldats de votre armée attaquante, celle-ci perd 25 % de troupes en moins en conquérant son territoire."


