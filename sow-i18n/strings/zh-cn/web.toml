leader_hiawatha_haudenosaunee_ability = "和平大法"
leader_hiawatha_haudenosaunee_description = "当你的两名盟友彼此缔结新同盟时，你与这两名盟友的两项限时同盟均恢复至完整时长。每对盟友每局仅触发一次。"

leader_kaahumanu_hawaii_ability = "共享餐桌"
leader_kaahumanu_hawaii_description = "当你和一名盟友各有一座运作中的农场时，首次向该盟友发送至少500兵力，你们各获得相当于实际发送量25%的援军。每人最多500，且不超过各自的兵力上限。"

leader_sargon_of_akkad_ability = "阿卡德驻军"
leader_sargon_of_akkad_description = "攻占一座运作中的敌方城市时，若12格内没有己方塔楼，就在该范围内最近的己方有效地块免费建造一座1级塔楼。每座被攻占的城市仅触发一次。"

leader_mithridates_vi_ability = "提格兰的援军"
leader_mithridates_vi_description = "若有盟友拥有运作中的城市，对敌方发动陆上攻击至少3秒后撤退，你获得与返回兵力等量的援军，最多1,000人且不超过兵力上限。每局一次。"

leader_gudit_yodit_ability = "阿克苏姆大撤退"
leader_gudit_yodit_description = "攻占一座运作中的敌方城市时，迫使其原主人正在进攻玩家的最大陆军撤退。每座被攻占的城市仅触发一次。"

leader_khutulun_qaidu_ability = "策马俘敌"
leader_khutulun_qaidu_description = "向已经从陆上进攻你的对手发起陆地攻击时，将初次交锋中击败的20%敌军纳入预备兵力，最多补至兵力上限。"

leader_sor_juana_ines_de_la_cruz_ability = "厨房里的哲学"
leader_sor_juana_ines_de_la_cruz_description = "完成农场升级时，你在12格内距离该农场最近且正在进行的城市升级所需剩余时间减半。"

leader_sibylla_ability = "第二顶王冠"
leader_sibylla_description = "你拥有运作中的城市时，若缔结新同盟且新盟友没有运作中的城市，其最早开工的在建城市立即完工。每局一次。"

leader_cynethryth_mercia_ability = "库克姆协定"
leader_cynethryth_mercia_description = "对手攻占你的一座在运作的农场时，你在12格内已完工且等级最低的城市升一级，最高升至4级。每座农场仅触发一次。"

leader_suppiluliuma_ability = "米坦尼之约"
leader_suppiluliuma_description = "攻占与盟友领土接壤的敌方地块时，若该盟友也在从陆上进攻同一敌人，你的陆军损失减少25%。"

leader_baibars_ability = "骑士堡的工兵"
leader_baibars_description = "攻占一座运作中的敌方塔楼时，摧毁距被占塔楼12格以内、有效等级更低且最近的一座同敌方的运作中塔楼。每局每座攻占的塔楼限触发一次。"

leader_emperor_qin_shi_huang_ability = "统一度量衡"
leader_emperor_qin_shi_huang_description = "当你的城市、工厂和农场各自的有效等级总和相同且大于零时，工厂增产25%黄金，农场增产25%兵力。"

leader_spartacus_ability = "图里伊兵工库"
leader_spartacus_description = "你的陆军夺取一座运作中的敌方工厂的中心格时，该部队按工厂的每个有效等级获得300名士兵。每座工厂每局限一次。"

leader_queen_nefertiti_ability = "阿玛尔纳石块"
leader_queen_nefertiti_description = "如果你拥有一座距离城市不超过12格的运作中工厂，升级该城市所需的黄金减少35%。"

leader_mandukhai_ability = "草原再统一"
leader_mandukhai_description = "当你夺取对手剩余的领土并将其淘汰时，招募对手剩余预备兵力的25%，最多补充到你的兵力上限。"

leader_kabal_xook_ability = "亚什奇兰战徽"
leader_kabal_xook_description = "当你拥有一座运作中的城市且预备兵力至少为750时，如果盟友对你们共同的对手发起新的陆地进攻，你会调出750名预备士兵支援这次进攻。每局每位盟友限一次。"

leader_lakshmibai_ability = "卡尔皮据点"
leader_lakshmibai_description = "对手夺取你最后一座运作中的城市时，在失守城市24格内、你领土上最近的合法地块免费建立一座1级城市。每局一次。"

leader_pharaoh_hatshepsut_ability = "蓬特花园"
leader_pharaoh_hatshepsut_description = "己方商船完成通往外国港口的航线时，出发港12格内己方等级最低的已完工农场提升一级，最高4级。每个出发港一次。"

leader_thusnelda_cherusci_ability = "被俘不屈"
leader_thusnelda_cherusci_description = "对手占领你的一座有效等级至少为2的城市时，城市失去一个已完成等级，并取消正在进行的升级。每座城市一次。"

leader_queen_cartimandua_ability = "交出卡拉塔库斯"
leader_queen_cartimandua_description = "敌方陆军从你的领土撤退时，将撤退幸存者的25%交给正在对该敌作战、出兵最多且预备兵有空位的盟友。超出上限的人返回敌方。"

leader_queen_suriyothai_ability = "阿瑜陀耶护卫"
leader_queen_suriyothai_description = "敌方陆军即将占领一座运作中的盟友城市中心时，消耗1,500名预备兵挡下这次进攻，并消灭至多1,500名来敌。每座盟友城市一次。"

leader_tarabai_ability = "反袭征收"
leader_tarabai_description = "夺取正在对你发动陆上攻击的对手的一座已完工防御塔，夺取其25%的金币，最多250。每座塔一次。"

leader_natavan_ability = "舒沙之泉"
