privacy_analytics_body_v3 = "只有在你允许后，我们才会在官网和浏览器游戏中运行可选的第一方分析。分析仅记录限定范围的访问、加载、菜单、教程、大厅和对局事件，以及构建版本、语言、宽泛的屏幕类别和可选的 ?ref= 简短来源标签。事件使用仅在当前浏览器会话中保存的临时随机会话 ID；事件记录不包含账户/玩家 ID 或对局/大厅 ID。请求 IP 可能出现在独立的安全技术日志中，但不会包含在分析事件记录里。不记录姓名、消息、密码、广告 ID、地图点击或完整设备指纹。"
privacy_cookies_body_v2 = "我们会将你的分析选择保存在本地存储中。只有你允许分析后，才会在会话存储中创建临时分析会话 ID 和重试队列。拒绝分析不会影响游戏。游戏设置、账户连续性和缓存资源使用独立且为相关功能所必需的存储。详情及管理方式请参阅我们的"
privacy_retention_body_v2 = "事件文件、分析计数及成员记录会在 90 天内到期。经验证的账户删除会移除关联事件和账户成员记录；无法识别个人的每日汇总数据仅保留至其 90 天期限届满。账户和对局历史会保留至你请求删除或依据服务条款终止账户为止。"
analytics_title = "可选分析"
analytics_body = "我们会根据网站和游戏中的活动数据改进《Shadows of War》。未经你允许，分析功能不会开启。"
cookies_analytics_events = "事件统计访问、加载、菜单、教程进度、匹配，以及对局开始、结果和主动退出。对局详情仅使用固定类别和宽泛的屏幕类别。事件记录不包含姓名、账户/玩家 ID、IP 字段、对局/大厅 ID、聊天、密码、购买详情、原始错误文本、地图点击或完整用户代理。"
cookies_analytics_server = "你同意后，事件只会发送到我们自有的 /api/event 接口，不经过游戏中继服务。每条事件使用仅限当前浏览器会话的临时随机会话 ID。事件记录不包含账户/玩家 ID、对局/大厅 ID 或 IP 地址；请求 IP 可能出现在独立的安全技术日志中。"
