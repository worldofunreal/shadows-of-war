cookies_description_v2 = "可选产品分析在你允许前始终关闭。了解 Shadows of War 会存储哪些数据，以及如何更改选择。"
cookies_og_description_v2 = "可选分析默认关闭。你可以随时更改选择。"
cookies_updated_v2 = "最后更新：2026年10月6日 · World of Unreal"
cookies_analytics_title = "官网和浏览器游戏中的可选分析"
cookies_controls_v2 = "你可以同样方便地允许或拒绝可选分析。进入游戏不代表你允许分析。你可以在游戏设置或此处更改选择；拒绝不会影响游玩。清除网站数据也会删除该选择，之后分析会保持关闭，直到你再次明确允许。我们不会为广告出售或共享分析数据。"
cookies_platforms_title = "其他游戏平台"
cookies_platforms_body = "Poki、CrazyGames 和 Jest 可能会依据各自平台条款，通过自己的 SDK 衡量使用情况。我们不会将这些与玩家相关的事件复制到自己的服务器。Android 第一方分析目前处于关闭状态，待商店数据披露更新后再启用。"
cookies_storage_title = "浏览器存储与保留期限"
cookies_storage_body = "我们会在本地存储中记住你允许或拒绝分析的选择。只有允许后，临时会话 ID 和小型重试队列才会使用会话存储。分析事件还包含构建版本、语言和宽泛的屏幕类别（手机、平板或桌面），不包含完整浏览器标识。事件文件和成员记录会在 90 天内到期。经验证的账户删除会移除关联事件和账户成员记录；无法识别个人的每日汇总数据也会在 90 天内到期。游戏设置、账户连续性、错误恢复和缓存资源使用独立且为相关功能所必需的存储。"
