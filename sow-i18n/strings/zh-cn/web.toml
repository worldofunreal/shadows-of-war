[heroes]
leader_nafanua_name = "Nafanua"
leader_nafanua_historical = "萨摩亚口述传统记得Nafanua是一位战士领袖，也是在和平时期作出政治决策的人物；传说称她汇集了最高级别的酋长头衔，但这并非同时代的书面传记。"
leader_nafanua_civilization = "萨摩亚"
rarity_common = "普通"
rarity_rare = "稀有"
rarity_epic = "史诗"
rarity_legendary = "传说"
leader_muhumuza_name = "穆胡穆扎"
leader_muhumuza_historical = "穆胡穆扎也见于拼作穆胡穆萨的记录。她在恩多尔瓦和基盖齐的高地组织抵抗，活动范围横跨今天的卢旺达与乌干达边境。她担任尼亚宾吉灵媒，借助当地社群早已熟悉的精神传统召集追随者。她所面对的压力来自穆辛加国王的宫廷，也来自不断向边境地区扩张的欧洲殖民权力。"
leader_muhumuza_civilization = "尼亚宾吉运动"

leader_khosrow_i_name = "霍斯劳一世"
leader_khosrow_i_historical = "霍斯劳一世又称安努希尔万，于531年至579年统治萨珊帝国。他把军队的指挥权分配给四个地区的将领。保存下来的印章记录了分别负责东、南、西、北的军职。他也继续推行父亲卡瓦德一世晚年开始的土地测量，并以登记资料为基础制定固定的土地税额。"
leader_khosrow_i_civilization = "萨珊帝国"

leader_naram_sin_name = "纳拉姆辛"
leader_naram_sin_historical = "纳拉姆辛是萨尔贡的孙子，在公元前第三千纪统治阿卡德帝国。他的胜利石碑纪念了在扎格罗斯山脉对卢卢比人的征战。浮雕上的国王和士兵沿着山坡向上行进。国王的身形远大于其他人物，头戴带角的头盔，显示了与神性相关的身份。"
leader_naram_sin_civilization = "阿卡德帝国"

leader_jalal_al_din_mangburni_name = "札兰丁·明布尔努"
leader_jalal_al_din_mangburni_historical = "蒙古军瓦解花剌子模帝国之际，札兰丁继承父亲摩诃末二世的地位。他在加兹尼重新集结军队，于1221年在帕尔万击败一支蒙古军。成吉思汗随后追至印度河。札兰丁虽然战败，却骑马渡河脱身，部分部队也抵达了对岸。他仍以花剌子模沙的身份行动，但军队和权力中心已经离开原来的都城。"
leader_jalal_al_din_mangburni_civilization = "花剌子模帝国"

leader_modu_chanyu_name = "冒顿单于"
leader_modu_chanyu_historical = "冒顿约在公元前209年成为单于，带领匈奴崛起为东部草原的强大势力。司马迁在《史记·匈奴列传》中记载，邻近的东胡先索取名马，后索取单于的阏氏，冒顿都作了让步。等到东胡提出占有双方边塞之间无人居住的地带，冒顿拒绝交出土地，率军突然出击。这个故事把一次边境争端写成了匈奴扩张的转折。"
leader_modu_chanyu_civilization = "匈奴"

leader_hiawatha_haudenosaunee_name = "海华沙"
leader_hiawatha_haudenosaunee_historical = "豪德诺索尼的口述传统记得海华沙，也称艾昂瓦塔，是协助和平缔造者把莫霍克、奥奈达、奥农达加、卡尤加和塞内卡五个民族团结起来的人。按照奥农达加民族讲述的故事，海华沙当时正在哀悼。和平缔造者拿起海华沙串好的贝珠，用安慰的话帮助他走出悲痛。这些贝珠和串饰称为温帕姆。此后，海华沙帮助把和平的信息传给各个民族。五个民族结成联盟的确切年份并不清楚，联盟的自述也没有为这段历史指定一个具体日期。不同于只用文字讲述一场会议，贝珠带把参与的民族和彼此之间的关系织成能够在议事时重温的图案。"
leader_hiawatha_haudenosaunee_civilization = "豪德诺索尼联盟"

leader_kaahumanu_hawaii_name = "卡阿胡马努"
leader_kaahumanu_hawaii_historical = "一八一九年卡美哈梅哈一世去世后，卡阿胡马努宣布与继位的利霍利霍共同治理王国。利霍利霍即卡美哈梅哈二世。卡阿胡马努成为首位库希纳努伊。这个职务在设立之初具有与国王相当的权力，参与分配土地、订立协议和处理司法事务。其职责后来载入一八四〇年宪法，但卡阿胡马努行使这项权力早于成文宪法。利霍利霍前往英国后，她继续掌政。卡乌伊凯奥乌利继位为卡美哈梅哈三世，她又以摄政身份继续治理，直到一八三二年去世。她在卡美哈梅哈一世的宫廷中已经参与政事，继位时宣布共治则使这种影响成为明确的政府职务。她也参与处理王国与考艾岛的关系，并于一八二一年与考艾岛的卡乌穆阿利伊结婚。"
leader_kaahumanu_hawaii_civilization = "夏威夷王国"

leader_sargon_of_akkad_name = "萨尔贡"
leader_sargon_of_akkad_historical = "萨尔贡在公元前三千纪末期的美索不达米亚建立了阿卡德王朝。以他名义留下的王室铭文叙述了击败乌鲁克国王卢加尔扎吉西的经过，还称阿卡德军队拆毁了乌鲁克和乌尔等城的城墙。铭文将俘获卢加尔扎吉西与恩利尔的神庙联系起来，表现王权怎样为胜利赋予宗教意义。这些叙述由王室用来纪念胜利，有些篇章通过比萨尔贡更晚的抄本流传。铭文也提到来自阿卡德的人在征服地区担任治理职务。学者将这些宣示与地方行政记录对照，研究原来的城邦被纳入王国后，地方治理究竟发生了哪些变化。新的官员进入地方行政体系，一些既有制度和日常事务仍然延续。各项变化的程度需要结合不同城市留下的文书判断。例如，阿达卜的档案记有地方官员前往阿卡德的活动，使都城和地方的联系有迹可循。"
leader_sargon_of_akkad_civilization = "阿卡德帝国"

leader_mithridates_vi_name = "米特里达梯六世"
leader_mithridates_vi_historical = "米特里达梯六世是黑海南岸本都王国的君主，尊号欧帕托尔。他把本都的势力扩展到黑海周边，并与罗马共和国争夺在安纳托利亚的影响力。早先，比提尼亚和卡帕多基亚的王位问题曾引起罗马干涉。第一次战争结束时，米特里达梯与苏拉在达尔达诺斯达成和议。罗马将领穆雷纳随后袭击本都，直到苏拉命他停止行动，第二次战争才告结束。此后本都与罗马再度开战。亚美尼亚的提格兰二世迎娶了他的女儿，两位国王建立了联盟。第三次米特里达梯战争中，罗马将领卢库卢斯将他逐出本都，他逃往亚美尼亚，借盟友的支持重新集结军队。古代作者阿庇安记载，两位君主在亚美尼亚境内征募士兵，还曾向帕提亚派遣使者，希望得到支援。罗马方面也派出使者交涉。在罗马军队继续进攻的压力下，两位君主随后分开行动，提格兰退往亚美尼亚内地，米特里达梯则选择率军返回本都。"
leader_mithridates_vi_civilization = "本都王国"

leader_gudit_yodit_name = "古迪特"
leader_gudit_yodit_historical = "在埃塞俄比亚的传统故事中，古迪特又叫约迪特，是一位反抗阿克苏姆的女王。十世纪的一段记载出现在《亚历山大牧首史》中。书中说，一位没有留下名字的埃塞俄比亚统治者写信给努比亚的乔治王，请他帮忙。牧首史称，一位巴尼·哈姆维亚的女王起兵反抗，俘虏居民，焚毁城市，迫使这位统治者辗转逃亡。这封信的原件没有保存下来，后人是从教会史的叙述中读到信的内容。书中把动乱与埃塞俄比亚请求新任都主教联系起来。故事发生在菲洛塞奥斯任亚历山大牧首期间。按这部史书的说法，乔治将请求转达给牧首，牧首随后选派了一名叫但以理的修士担任都主教。这些细节也反映了埃塞俄比亚王廷、努比亚王廷和埃及的教会之间怎样联系。"
leader_gudit_yodit_civilization = "埃塞俄比亚高地"

leader_khutulun_qaidu_name = "忽图伦"
leader_khutulun_qaidu_historical = "忽图伦是活跃在中亚的蒙古公主和军事指挥者。她的名字也常转写为库图伦。她的父亲海都出自窝阔台家族，在中亚统辖自己的领地，曾与忽必烈及其继任者争夺权力。海都一度与察合台系的统治者结盟，两家在中亚各有自己的政治根基。一二七一年，海都以窝阔台系汗的身份重新组织本家领地。之后他支持都哇成为察合台系的汗，两人在海都去世前长期合作。到忽图伦必须为父亲的继承安排表态时，这位旧盟友已经成了左右继承结果的关键人物。马可·波罗的记述把忽图伦称为艾贾鲁克，说她在出征时骑马冲到敌军阵前，擒住对手，再把俘虏带回。这个细节来自旅行记的叙事。书中还写到有人为求婚而与她摔跤，并把马匹作为赌注。故事中她每次都获胜，传下的马匹数量很大，但这些数字和各场比赛的经过难以独立核实。现代研究把这类故事与波斯文史料中记载的军事活动对照起来看。"
leader_khutulun_qaidu_civilization = "海都兀鲁思"

leader_sor_juana_ines_de_la_cruz_name = "胡安娜修女"
leader_sor_juana_ines_de_la_cruz_historical = "胡安娜·伊内斯·德拉克鲁斯修女是十七世纪新西班牙的作家，也是圣哲罗姆修会的修女。关于她的出生年份，文献中有一六四八年和一六五一年两种说法。她在墨西哥城的圣赫罗尼莫修道院生活和写作，留下诗歌和戏剧，其中有宗教剧《神圣的纳西索斯》。一六九〇年，她写了一篇文章，评论葡萄牙耶稣会士安东尼奥·维埃拉关于基督之爱的讲道。普埃布拉主教曼努埃尔·费尔南德斯·德圣克鲁斯让这篇文章以《雅典娜书简》为题印行。主教还以菲洛特娅修女的名字写信给她，劝她调整学习和写作的方向。这两份文件的作者身份和文字内容可以从当时的印本和后来的整理本中追查。"
leader_sor_juana_ines_de_la_cruz_civilization = "新西班牙"

leader_sibylla_name = "西比拉"
leader_sibylla_historical = "西比拉是耶路撒冷国王阿马尔里克与库尔特奈的阿格妮丝的女儿。登基以前，她曾是雅法和阿斯卡隆女伯爵。她的第一任丈夫蒙费拉的威廉去世后，她仍以女伯爵的名义发布文书。她在一一七七年签发的文书将阿斯卡隆的一些城墙塔楼、花园和收入授给罗德里戈伯爵和他的修会成员。文书列出款项在一年中分四次支付的日期，并提到以她的印玺和见证人来确认赠与。她与威廉的儿子后来成为鲍德温五世。儿子在一一八六年去世后，她凭自己的继承权争取耶路撒冷王位，同父异母的妹妹伊莎贝拉也有继承资格。西比拉取得王冠，并选择自己的第二任丈夫吕西尼昂的居伊作为共同统治者。不同的编年史对于支持她的贵族是否先要求她解除与居伊的婚姻，说法并不一致。"
leader_sibylla_civilization = "耶路撒冷王国"

leader_cynethryth_mercia_name = "西内斯里丝"
leader_cynethryth_mercia_historical = "西内斯里丝生活在八世纪后期，曾任麦西亚王后，后来出任库克姆修道院院长。奥法在位时，她的名字出现在多份王室文书的见证人名单里。她是王位继承人埃格弗里斯的母亲。她的名字和王后称号还出现在银币上，这在盎格鲁-撒克逊英格兰极为罕见。剑桥菲茨威廉博物馆的记录中就有一枚这样的银便士，上面没有人像，铸币人署名为埃奥巴。这名铸币人的作品与肯特地区关系密切，馆方将该币归于坎特伯雷铸造，但币面并未写出铸造地点。另有一些印着王后名字的银币带有人像。现存实物表明她的王后身份曾经由货币在公众中传播，至于谁下令铸造以及她本人如何参与，留存的证据还不足以确定。研究者也根据后来发现的两枚钱币提出，除了埃奥巴，还可能有另一位铸币人为她铸造过钱币。"
leader_cynethryth_mercia_civilization = "麦西亚王国"

leader_suppiluliuma_name = "苏庇路里乌玛一世"
leader_suppiluliuma_historical = "公元前十四世纪，苏庇路里乌玛一世从安纳托利亚的哈图沙统治赫梯。他向叙利亚北部扩张，安排自己的儿子治理阿勒颇和卡尔凯美什。与此同时，米坦尼的王位之争给了他干预幼发拉底河另一侧事务的机会。他支持王位争夺者沙提瓦扎，并派出由儿子皮亚西里率领的部队。皮亚西里也叫沙里库舒赫，当时掌管位于幼发拉底河畔的卡尔凯美什。他与沙提瓦扎并肩作战，越过大河，打到了伊里特城。联合作战帮助沙提瓦扎登上王位，也让赫梯国王得以决定双方将如何分配城镇。米坦尼有自己的国王，但沙提瓦扎得到王位所依靠的军力来自赫梯，双方的权力并不对等。"
leader_suppiluliuma_civilization = "赫梯帝国"

leader_baibars_name = "拜巴尔斯"
leader_baibars_historical = "扎希尔·拜巴尔斯在1260年至1277年统治马穆鲁克苏丹国。卢浮宫收藏一枚来自开罗的金币，正面铸有他的名字和头衔，背面则是宗教铭文。这类实物提供了同时代政权使用的称号。他在黎凡特的军事行动扩大了马穆鲁克的势力范围。1271年，他率联军围攻医院骑士团控制的骑士堡。这座堡垒的围攻过程，可以结合文献记述和建筑调查来了解。"
leader_baibars_civilization = "马穆鲁克苏丹国"

leader_emperor_qin_shi_huang_name = "嬴政"
leader_emperor_qin_shi_huang_historical = "秦王嬴政在公元前221年完成对六国的征服，采用皇帝称号。秦政权随后把秦国的度量衡标准推行到新近占领的地区。传世和出土的器物留有相关命令的铭文。度量衡涉及称重、计量容量和长度，因此标准能否落到实际使用的器物上，与政令本身同样重要。秦朝也推行货币和文字等方面的统一措施。不同改革各有材料可以核查，度量衡的铭刻尤其能显示政令怎样进入日常计量。"
leader_emperor_qin_shi_huang_civilization = "秦朝"

leader_spartacus_name = "斯巴达克斯"
leader_spartacus_historical = "斯巴达克斯是色雷斯出身的角斗士，也是公元前73年在卡普阿爆发的起义的首领之一。普鲁塔克记述，角斗士原本计划集体逃跑，消息泄露后，成功逃出的人先用厨房器具武装自己，又在路上夺取车载武器。阿庇安记述他们从路上取得武器，后来在维苏威山避难。两位作者对出逃者的人数和行动细节有不同说法，但都描述了这支队伍从规模很小的逃亡者团体发展为罗马必须认真对付的力量。"
leader_spartacus_civilization = "斯巴达克斯起义军"

leader_queen_nefertiti_name = "娜芙蒂蒂"
leader_queen_nefertiti_historical = "娜芙蒂蒂是古埃及第十八王朝阿肯那顿的大王妻。阿肯那顿把王室中心迁到阿赫塔顿，也就是今天的阿玛尔纳。王后在当地的阿顿崇拜中有清楚可见的仪式角色。皮特里博物馆收藏的一块红色石英岩残片来自阿玛尔纳，其上雕有她的头部和手臂。她正在倾倒祭酒，太阳圆盘的光线末端有手伸向她。另一些浮雕把她与阿肯那顿和女儿梅里塔顿一同刻在供桌旁。两类图像分别保存了她独自祭献和王室成员共同祭献的场面。"
leader_queen_nefertiti_civilization = "古埃及"

leader_mandukhai_name = "满都海哈屯"
leader_mandukhai_historical = "满都海哈屯在十五世纪后期的蒙古政治和军事中掌握权力。满都鲁汗死后，汗位继承与成吉思汗后裔能否恢复权威相连。满都海在后来与达延汗相联系的继承斗争中发挥了重要作用。蒙古文编年史记载她领军征讨瓦剌，并描述她在胜利后处置战败一方的方式。对于汗位继承的具体次序与出征年代，后世史书和同时代留下的材料并不能完全吻合。"
leader_mandukhai_civilization = "北元"

leader_kabal_xook_name = "卡巴尔·舒克"
leader_kabal_xook_historical = "卡巴尔·舒克是玛雅城邦亚什奇兰的王室成员，也是统治者伊察姆纳赫·巴拉姆的主要妻子之一。亚什奇兰位于今墨西哥恰帕斯州的乌苏马辛塔河畔，城中的建筑分布在河湾内侧的台地和高处。研究者把她主持的第23号建筑奉献仪式定在公元726年。建筑入口上原有三块雕刻石门楣，今编号为24、25和26。铭文记有她的名字，浮雕也在不同的仪式情境中表现她的形象。建筑的奉献日期与每一幅图像所描绘的事件日期应分别考察。"
leader_kabal_xook_civilization = "亚什奇兰"

leader_lakshmibai_name = "拉克希米芭伊"
leader_lakshmibai_historical = "拉克希米芭伊是占西的拉妮。丈夫甘加达尔·拉奥去世后，东印度公司拒绝承认两人的养子有继承权，并试图吞并占西。拉克希米芭伊反对这一决定。继承争议不仅关系到王室成员，也决定公司是否接管当地政府。她坚持养子的继承权，后来又亲自参与抵抗公司的军事行动。1857至1858年的印度起义中，她指挥占西的防守，抵抗休·罗斯率领的军队。战事使她同时面对如何保住政权和如何维持守军的问题。1858年，英国军队夺取占西，她从当地脱身，前往卡尔皮与其他起义军会合，其中包括与坦蒂亚·托佩有关的部队。此后卡尔皮也失守，起义军转向瓜廖尔。英国国家陆军博物馆记载，1858年6月1日，支持英国的辛迪亚统治者的一部分军队在莫拉尔转向起义军。她在瓜廖尔附近继续战斗，并于1858年6月在那里去世。占西、卡尔皮和瓜廖尔是这段战事的三个地点，能够用来理解她在失去一个据点后怎样继续参加作战。"
leader_lakshmibai_civilization = "占西"

leader_pharaoh_hatshepsut_name = "哈特谢普苏特"
leader_pharaoh_hatshepsut_historical = "哈特谢普苏特在公元前十五世纪、第十八王朝时期统治埃及。她先为年幼的图特摩斯三世摄政。图特摩斯三世是她的侄子和继子，后来在她采用法老称号并行使王权时继续担任共同统治者。哈特谢普苏特主持了多项建设，其中包括代尔巴哈里的阶梯式纪念神庙。神庙中层南侧柱廊的浮雕记录了她派往蓬特的远征。画面展示埃及代表团与蓬特居民会面、物品被运上船只，以及远征在神庙中的宗教意义。浮雕把一次远行和王权、祭祀联系在一起。考察柱廊的考古团队指出，铭文还把这次远征与阿蒙神的神谕联系起来。图像和文字共同解释了王室为什么要把一场贸易航行刻在祭祀建筑上。考古保护团队记录了柱廊中原有的浮雕、残片和修复情况，开罗的埃及博物馆则保存了部分原件。这些材料提供了研究远征如何被宫廷纪念的依据。"
leader_pharaoh_hatshepsut_civilization = "古埃及"

leader_thusnelda_cherusci_name = "图斯内尔达"
leader_thusnelda_cherusci_historical = "图斯内尔达是公元一世纪早期的切鲁西贵族女子。她的父亲塞格斯特斯寻求罗马支持，丈夫阿尔米尼乌斯则领导抵抗罗马的行动。按照罗马史家塔西佗的叙述，公元15年，阿尔米尼乌斯的军队围困塞格斯特斯，后者向日耳曼尼库斯求助。罗马军队解围，接管了塞格斯特斯的家属和随从，当时身怀有孕的图斯内尔达也在其中。塔西佗写到，塞格斯特斯承认她并非自愿留在他身边。塔西佗笔下的图斯内尔达面对俘获者时没有开口求饶，目光落在自己的腹部。作者用这一举动刻画她在压力下的反应。这个场景所用的词语和对人物性格的判断都出自罗马作者，读者可以借此了解作者如何表现一名被俘的切鲁西女子，同时需要留意记录的立场。"
leader_thusnelda_cherusci_civilization = "切鲁西人"

leader_queen_cartimandua_name = "卡尔蒂曼杜娅"
leader_queen_cartimandua_historical = "卡尔蒂曼杜娅在公元一世纪统治布里甘特人，他们的领地位于今天的英格兰北部。罗马史家塔西佗留下了关于她统治的主要叙事。公元51年，抵抗罗马的领袖卡拉塔库斯战败后到她那里寻求庇护。卡尔蒂曼杜娅将他扣押，随后交给罗马人。塔西佗在《编年史》中记载了卡拉塔库斯被带到罗马的经过。他与家属被公开示众，随后得到皇帝赦免。塔西佗以此描写皇帝如何把敌方首领的落败转化为展示宽赦的机会。这使原本发生在不列颠的争斗进入罗马皇帝克劳狄的政治叙事，也让罗马作者特别重视这次交人。史料还记载卡尔蒂曼杜娅与韦努提乌斯发生争斗。公元69年，韦努提乌斯借罗马国内动荡发动进攻。卡尔蒂曼杜娅请求罗马提供保护，罗马步兵和骑兵救出了她，韦努提乌斯则取得王位。这些事件显示她在如何处理敌手和寻求外援方面作过决定。"
leader_queen_cartimandua_civilization = "布里甘特人"

leader_queen_suriyothai_name = "苏里育泰"
leader_queen_suriyothai_historical = "苏里育泰是阿瑜陀耶国王摩诃查克拉帕特在位时的王后。关于缅甸国王莽瑞体军队进攻阿瑜陀耶的叙事提到了她。阿瑜陀耶府采用的年表把这次进攻放在1548年。省方叙述提到入侵军队经过三塔关，随后向阿瑜陀耶推进。按照阿瑜陀耶王家编年史流传下来的故事，王后乘战象跟随军队出战。国王面临危险时，她催动自己的战象来到国王与敌方指挥官之间，在交锋中受了致命伤。这个故事记住了她在战场上采取行动的决定，也把这次决定和当时在战场上的其他人联系起来。关于作战经过的细节则主要保存在阿瑜陀耶一方较晚的叙事中。编年史能够说明后来的作者怎样记述王后，却很难单凭这些记载还原她参与战斗的每个动作。"
leader_queen_suriyothai_civilization = "阿瑜陀耶王国"

leader_tarabai_name = "塔拉拜"
leader_tarabai_historical = "塔拉拜（1675—1761）在拉贾拉姆于1700年去世后接掌马拉塔政权，以年幼儿子希瓦吉的名义摄政。她协调将领，组织各地防守，抵抗莫卧儿皇帝奥朗则布派来的军队。萨塔拉地方史记载，她把监督堡垒的职责交给帕拉舒拉姆·特里姆巴克。历史学家理查德·伊顿指出，即使马拉塔的主要堡垒遭到围攻，塔拉拜仍然派兵向北深入莫卧儿领地。她同时推进防守与远征，使莫卧儿军队在围攻堡垒时还必须应付其他地区的威胁。1707年奥朗则布去世后，王位竞争者沙胡回到马拉塔，统治家族内部开始争夺权力。地方志记载，塔拉拜于1705年移居潘哈拉，并让拉姆钱德拉潘特分担政务。摄政时期的战事和后来的继承冲突是她政治生涯中的两个阶段。地方史与现代历史研究对这段时期的记述各有侧重，既包括堡垒的指挥安排，也包括远征的范围和向地方征收收入的办法。"
leader_tarabai_civilization = "马拉塔帝国"

leader_natavan_name = "纳塔万"
leader_natavan_historical = "胡尔希德·巴努·纳塔万是来自舒沙的阿塞拜疆诗人和文化赞助人。她于1897年去世。关于她的出生年份，出版资料有不同记载，其中包括1830年和1832年。她的父亲迈赫迪古卢汗是卡拉巴赫最后一位汗。纳塔万继承了家族的资源，并将其中一部分用于公共事业和文化活动。1872年，她主持舒沙的文学团体马吉利斯·温斯。当地诗人在这个团体相聚，也和其他地区的诗人团体交流作品。她创作了抒情诗和挽诗，有一部分作品在她去世后编入诗集。她还绘制图画，留存的插图册为了解她的艺术活动提供了材料。文学聚会与插图册记录了她从事创作的不同方式，也说明她利用自己的财力为本地文化活动提供场所和支持。"
leader_natavan_civilization = "卡拉巴赫"

leader_mavia_name = "玛维娅"
leader_mavia_historical = "玛维娅也被称为马维娅。她曾领导罗马东部边境的阿拉伯社群，并于公元四世纪后期与罗马帝国议和。"
leader_mavia_civilization = "塔努赫阿拉伯人"

