analytics_title = "Analitik opsional"
analytics_body = "Kami menggunakan aktivitas di situs dan game untuk meningkatkan Shadows of War. Analitik hanya aktif jika Anda mengizinkannya."
analytics_policy = "Detail cookie"
analytics_accept = "Izinkan"
analytics_reject = "Tolak"
analytics_manage = "Pengaturan cookie"
privacy_analytics_body_v2 = "Analitik pihak pertama opsional di situs dan game browser kami hanya berjalan setelah Anda mengizinkannya. Memulai game saja tidak mengaktifkannya. Analitik mencatat kumpulan terbatas peristiwa kunjungan, pemuatan, menu, tutorial, lobi, mulai dan keluar pertandingan, serta versi build, bahasa, dan kategori ukuran layar umum, bukan sidik jari perangkat lengkap. Jika ada ID akun, server kami menggantinya sebelum disimpan dengan pseudonim berkunci yang khusus untuk kanal ini. Nama, pesan, kata sandi, ID iklan, dan klik peta tidak dicatat."
privacy_cookies_body_v2 = "Pilihan analitik Anda disimpan secara lokal. ID sesi analitik sementara dan antrean percobaan ulang kecil baru dibuat di penyimpanan sesi setelah Anda mengizinkannya. Menolak analitik tidak memengaruhi game. Pengaturan game, kesinambungan akun, dan aset cache menggunakan penyimpanan terpisah yang diperlukan untuk fitur tersebut. Detail dan kontrol tersedia di"
privacy_retention_body_v2 = "Berkas peristiwa, penghitung analitik, dan catatan keanggotaan kedaluwarsa dalam 90 hari. Penghapusan akun yang telah diverifikasi menghapus peristiwa dan keanggotaan terkait; total harian yang tidak mengidentifikasi hanya disimpan sampai batas 90 hari yang sama. Akun dan riwayat pertandingan disimpan sampai Anda meminta penghapusan atau akun dihentikan berdasarkan Ketentuan."
privacy_updated_v2 = "Terakhir diperbarui: 6 Oktober 2026 · Pengendali: World of Unreal · Kontak: hello@shadowsofwar.io"
cookies_analytics_title = "Analitik opsional di situs dan game browser kami"
cookies_analytics_events = "Kami menghitung kunjungan, tahap pemuatan, tindakan menu, kemajuan tutorial, bergabung ke lobi, mulai dan keluar pertandingan secara eksplisit, serta kategori layar umum. Kami tidak mencatat nama, obrolan, kata sandi, ID lobi, pembelian, klik peta, atau seluruh string user-agent."
cookies_analytics_server = "Peristiwa yang diizinkan dikirim langsung ke endpoint pihak pertama kami di /api/event dan tidak melewati relay game. Jika ID akun dikirim, server menggantinya sebelum disimpan dengan pseudonim berkunci yang hanya digunakan untuk situs ini."
cookies_storage_title = "Penyimpanan browser dan masa retensi"
cookies_storage_body = "Kami menyimpan pilihan izinkan atau tolak Anda secara lokal. ID sesi sementara dan antrean percobaan ulang kecil hanya disimpan setelah Anda mengizinkan analitik. Analitik mencakup versi build, bahasa, dan kategori layar umum, bukan seluruh user-agent. Berkas peristiwa dan catatan keanggotaan kedaluwarsa dalam 90 hari; penghapusan akun terverifikasi menghapus peristiwa dan keanggotaan terkait. Pengaturan game, kesinambungan akun, pemulihan setelah crash, dan aset cache memakai penyimpanan terpisah yang diperlukan."
cookies_platforms_title = "Platform game lainnya"
cookies_platforms_body = "Poki, CrazyGames, dan Jest dapat mengukur penggunaan dengan SDK mereka sendiri berdasarkan ketentuan platform masing-masing. Kami tidak menyalin peristiwa pemain dari platform tersebut ke server kami. Analitik pihak pertama Android dinonaktifkan sampai pengungkapan data di toko diperbarui."
cookies_controls_v2 = "Anda dapat mengizinkan atau menolak analitik opsional dengan kemudahan yang sama. Memulai game bukan berarti mengizinkannya. Ubah pilihan di Pengaturan game atau di sini; penolakan tidak memengaruhi permainan. Menghapus data situs juga menghapus pilihan Anda, dan analitik tetap nonaktif sampai Anda mengizinkannya lagi. Kami tidak menjual atau membagikan analitik untuk iklan."
cookies_description_v2 = "Analitik produk opsional tetap nonaktif sampai Anda mengizinkannya. Memulai game tidak mengaktifkannya. Lihat data yang disimpan Shadows of War dan cara mengubah pilihan Anda."
cookies_og_description_v2 = "Analitik opsional nonaktif sampai Anda mengizinkannya. Anda dapat mengubah pilihan kapan saja."
