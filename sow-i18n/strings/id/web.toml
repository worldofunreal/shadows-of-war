cookies_third_party_title = "Pihak ketiga"
cookies_third_party_body = "Fonta sendiri-diselenggarakan di domain kita. Tidak ada kode ketiga-partai yang menjalankan penyimpanan atau pelacakan di halaman kami: tidak ada jaringan iklan, tidak ada widget sosial, tidak ada skrip sesi-replay, tidak ada identifikasi situs cross-. Halaman kami membuat permintaan titik-titik silang nol."
cookies_dont_title = "Apa yang tidak kita lakukan"
cookies_dont_ads = "Tidak ada kue iklan dan tidak ada kepentingan-berbasis iklan."
cookies_dont_sell = "Tidak ada penjualan atau berbagi data pribadi untuk iklan."
cookies_dont_tracking = "Tak ada lokasi atau pelacaknya."
cookies_dont_body = "Karena tidak ada pelacakan perilaku, Global Privasi Control dan Jangan Track sinyal memiliki apa-apa untuk mematikan - dan kami menghormati GPC sebagai penjualan / berbagi opt-keluar terlepas."
cookies_controls_title = "Kontrol Anda"
