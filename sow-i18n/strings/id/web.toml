terms_license_title = "Lisensi & pembatasan"
terms_license_body = "Kami memberikan lisensi yang terbatas, dibatalkan untuk permainan pribadi, bukan iklan. World of Unreal atau lisensi nya. Kode sumber game tersedia secara terpisah di bawah AGPL-3.0-or-kemudian; akun, item virtual, dan server data diatur oleh Terms ini."
