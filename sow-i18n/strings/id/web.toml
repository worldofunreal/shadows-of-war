cookies_third_party_body = "Fonta sendiri-diselenggarakan di domain kita. Tidak ada kode ketiga-partai yang menjalankan penyimpanan atau pelacakan di halaman kami: tidak ada jaringan iklan, tidak ada widget sosial, tidak ada skrip sesi-replay, tidak ada identifikasi situs cross-. Halaman kami membuat permintaan titik-titik silang nol."
