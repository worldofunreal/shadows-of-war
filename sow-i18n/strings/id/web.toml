terms_acceptance_title = "Penerimaan dan eligibilitas"
terms_acceptance_body = "Hukuman ini adalah perjanjian mengikat antara Anda dan World of Unreal mengatur penggunaan Anda dari Shadows of War Pada shadowsowar.io, platform partner, dan klien asli, dengan bermain, memasang, atau mengakses Layanan yang Anda setujui dengan Terms ini."
terms_acceptance_age = "Pemain berusia 13 sampai 17 tahun hanya bisa bermain dengan orang tua atau wali atau pengawasan."
terms_changes_title = "Perubahan permainan & layanan"
terms_changes_body = "Multiplayer memerlukan akses jaringan ke server kita. Kita mungkin mengubah, menangguhkan, atau menghentikan bagian dari Layanan - mode, peta, musim, leaderboard, peristiwa - kapan saja, dengan atau tanpa pemberitahuan, tanpa kewajiban bagi Anda."
terms_accounts_title = "Akun"
terms_accounts_body = "Permainan anonim membuat ID akun kanonikal disimpan di perangkat Anda dengan nama tampilan. Bersihkan penyimpanan situs membuat akun baru; renames tidak pernah mengubah ID akun. ID Anda adalah sebuah progress lookup kunci, bukan password - menjaga perangkat Anda aman."
terms_accounts_contact = "Anda bertanggung jawab atas semua aktivitas di bawah rekening Anda. Laporan diduga akses tidak sah ke"
terms_license_title = "Lisensi & pembatasan"
terms_license_body = "Ketentuan ini mengatur akses ke Layanan resmi yang dihosting, akun, item virtual, dan data server. Kode sumber lengkap game dilisensikan secara terpisah berdasarkan AGPL-3.0-only, termasuk ketentuan tambahan OpenFront. Ketentuan ini tidak membatasi hak yang diberikan oleh lisensi kode atau lisensi peta tersendiri."
terms_maps_before = "Sumber peta turunan OpenFront dan berkas peta yang dihasilkan dilisensikan berdasarkan"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "Pemberitahuan peta mencatat atribusi, sumber, dan perubahan:"
terms_maps_notice = "pemberitahuan peta"
terms_license_no_sell = "Jangan menjual, menyewakan, mensublisensikan, atau mengeksploitasi secara komersial Layanan resmi yang dihosting, akun, atau item virtual."
terms_license_no_reverse = "Jangan merekayasa balik, melakukan scraping, mengekstrak secara massal, atau melatih model menggunakan Layanan resmi yang dihosting. Batasan ini tidak mengurangi hak yang diberikan oleh lisensi kode dan peta."
terms_license_feedback = "Masukan yang Anda bagikan dapat digunakan secara bebas, tanpa kompensasi atau keharusan mencantumkan nama Anda."
terms_virtual_title = "Item virtual & tidak ada pengembalian uang"
terms_virtual_body = "Gems, pemimpin membuka kunci, dan kulit adalah barang virtual saja: tidak ada nilai uang tunai, tidak dapat dipindahkan, bisa dibatalkan. Pemimpin membuka gameplay - mereka memiliki keistimewaan yang berbeda dan tidak murni kosmetik."
terms_sales_final = "Semua sales sudah siap."
terms_virtual_refunds = "Item virtual tidak dapat dikembalikan dan tidak dapat diganti dengan batas penuh yang diijinkan oleh hukum - termasuk untuk item yang digunakan atau tidak diinginkan, Layanan berubah, atau tindakan akun yang diambil untuk pelanggaran Terms. Jika platform mengubah pembelian, kita dapat menghapus item yang berhubungan dan mengambil langkah perhitungan."
terms_conduct_title = "Kontribusi pemutar"
terms_conduct_cheating = "Tidak ada kecurangan, bot, makro, otomatisasi, bug eksploitasi, atau sengaja desinik."
terms_conduct_harassment = "Tidak ada pelecehan, ancaman, umpan, atau doxing. nama, tag, dan chatting harus mengikuti hukum."
terms_conduct_servers = "Tidak mengganggu server, mencari infrastruktur, atau menyentuh akun pemain lain, kredensial, atau tiket."
terms_conduct_after = "Violasi dapat menyebabkan penghapusan konten, pemalsuan yang cocok, atau suspensi atau penghentian."
terms_third_party_title = "Tiga puluh layanan partai & pemain lain"
terms_third_party_body = "Platform mitra dan SDK mereka, penyedia pembayaran, Discord, dan Telegram adalah pihak ketiga kita tidak mengendalikan, persyaratan mereka sendiri berlaku dan Anda menggunakannya dengan risiko Anda sendiri interaksi dengan pemain lain semata-mata hanya antara Anda dan mereka untuk batas penuh diijinkan oleh hukum Anda melepaskan World of Unreal dari klaim yang muncul dari pihak ketiga atau pemain lainnya."
terms_termination_title = "Penghentian"
terms_termination_body = "Kita dapat menangguhkan atau mengakhiri akses - akun, item, entri leaderboard - setiap saat untuk alasan apapun, termasuk dugaan pelanggaran Terms, tanpa kewajiban. Pada penghentian lisensi Anda berakhir dan item virtual yang hilang tanpa pengembalian uang."
terms_disclaimer_title = "Discoverers"
terms_disclaimer_body = "\"Dan\". untuk yang paling jelas exmitted oleh hukum kita disponsori semua prajurit, termasuk MERCHANTABILITY, KECUALAN UNTUK TUJUAN TERBESAR, TUJUAN, NON- INFRINGEMENT."
terms_liability_title = "Batas kewajiban"
terms_liability_body = "Untuk maxium yang dikeluarkan oleh hukum kita tidak bisa hidup untuk masalah yang hilang, hilang DATA, kehilangan itu atau progress, atau apa pun indirek atau bencana konseksional kita kehidupan kota kita adalah berada di puncak $50 USD dan apa yang kamu bayar untuk sejarah di bulan lalu."
terms_indemnification_title = "Indemosiasi"
terms_indemnification_body = "Anda setuju untuk membela dan menebus dosa World of Unreal terhadap klaim dan biaya yang masuk akal muncul dari penggunaan layanan, pelanggaran Anda Terms ini, atau pelanggaran hukum Anda."
terms_arbitration_title = "Buang & arbitrase"
terms_arbitration_before = "Disputes melalui arbitrase individu yang mengikat (JAMS, Delaware) setelah percobaan resolusi 45- hari - bukan pengadilan. Anda membuka hak-hak pengadilan dan tindakan kelas. Klaim-kecil dan perintah IP tidak berlaku. Anda dapat memilih keluar dari arbitrase dalam waktu 30 hari pertama menerima terms oleh emiper."
terms_arbitration_after = "dengan ID akun Anda dan pernyataan opt- out jelas."
terms_general_title = "Umum"
terms_general_before = "Hukum Delaware mengatur Ketentuan ini; klaim di luar arbitrase hanya dapat diajukan ke pengadilan Delaware. Kami akan mengumumkan perubahan penting secara jelas sebelum berlaku. Jika hukum yang berlaku mewajibkan persetujuan ulang, kami akan memintanya secara terpisah. Kontak: World of Unreal —"
terms_privacy_title = "Privasi"
terms_privacy_before = "Penanganan data, hak-hak Anda, dan penghapusan dijelaskan dalam kami"
