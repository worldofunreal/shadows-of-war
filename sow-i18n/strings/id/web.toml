privacy_eyebrow = "Legal & Telemetri"
privacy_heading = "Privasi"
privacy_heading_em = "kebijakan."
privacy_updated = "Terakhir diperbarui: September 2026: World of Unreal Kontak: hello@shadowsofwar.io"
privacy_overview_title = "Tinjau & Pengontrol"
privacy_overview_body = "Shadows of War dioperasikan oleh World of UnrealKebijakan ini meliputi shadowsofwar.io, platform mitra, dan klien asli. Kontak privasi:"
privacy_overview_after = "Kami tidak memiliki EU / UK establishment - mengirim semua permintaan, termasuk permintaan GDPR, langsung ke sana."
privacy_overview_payments = "Persatuan SDK mungkin mengumpulkan data di bawah kebijakan mereka sendiri. Data kartu diproses langsung oleh toko yang Anda bayar. (Google Play, Apple, Stripe, kita tidak pernah melihat nomor kartu."
privacy_eligibility_title = "Anak-anak & Abligibility"
privacy_eligibility_body = "13 +. Pemain 13.17 membutuhkan izin orang tua atau wali. Permainan tidak diarahkan ke anak-anak dibawah 13; akun di bawah 13 ditangguhkan dan dihapus. Orang tua: tulis ke"
privacy_eligibility_after = "dan kita hapus segera."
privacy_data_title = "Data yang kita kumpulkan"
privacy_gameplay_label = "Permainan:"
privacy_gameplay_body = "nama tampilan, tanda klan, pemimpin / pilihan peradaban, masukan yang cocok, sejarah, pangkat, item milik."
privacy_account_label = "Akun:"
privacy_account_body = "ID akun acak, identitas platform terkait, hash satu arah dari rahasia kepemilikan Anda (tidak pernah teks biasa)."
privacy_technical_label = "Teknis:"
privacy_technical_body = "membuat versi, platform / locale, metadata koneksi, tiket relay, log server untuk keamanan dan anti- penyalahgunaan."
privacy_analytics_label = "Analisis produksi (hanya untuk pesta pertama):"
privacy_purchases_label = "Pembelian:"
privacy_purchases_body = "ID produk, referensi transaksi, status hak melalui RevenueCat / the store. Rincian pembayaran lengkap tetap dengan toko."
privacy_public_label = "Publik dengan desain:"
privacy_public_body = "nama, handle, peringkat, dan catatan pertandingan terlihat kepada pemain lain."
privacy_use_title = "Gunakan basis & legal"
privacy_use_body = "Kami memproses data yang diperlukan untuk menjalankan game, melindungi pemain dan sistem, memberi dukungan, serta memenuhi kewajiban hukum. Untuk pengguna di UE dan Inggris, dasar pemrosesan mencakup kontrak untuk menyediakan game, kepentingan sah dalam keamanan dan pencegahan kecurangan, kewajiban hukum bila berlaku, serta persetujuan Anda untuk analitik produk pihak pertama yang opsional. Analitik tetap nonaktif sampai Anda mengizinkannya; pilihan dapat diubah di Pengaturan. Kami tidak menjual data pribadi atau menggunakan iklan berbasis perilaku."
privacy_sharing_title = "Berbagi"
privacy_hosting_label = "Mengundang di bawah instruksi kami:"
privacy_hosting_body = "IONOS, Microsoft Azure, dan Cloudflare."
privacy_payments_label = "Pembayaran:"
privacy_payments_body = "Google Play / Apple / Stripe via RevenueCat, di bawah kebijakan mereka."
privacy_sdk_label = "SDK Partner:"
privacy_sdk_body = "di bawah kebijakan mereka sendiri ketika Anda bermain melalui mereka."
privacy_players_label = "Pemutar & publik:"
privacy_players_body = "nama, pegangan, jajaran, catatan pertandingan."
privacy_authorities_label = "Otoritas & transfer:"
privacy_authorities_body = "di mana diwajibkan oleh hukum, atau untuk pengganti yang sah dengan pemberitahuan."
privacy_cookies_title = "Kue & penyimpanan lokal"
privacy_cookies_body = "Penyimpanan hanya untuk kebutuhan penting: ID sesi. Peristiwa produk dikirim ke endpoint milik kami. Tidak ada cookie iklan, sosial, atau lintas situs. Font dihosting sendiri tanpa permintaan lintas origin. Detail dan pengaturan ada di"
privacy_retention_title = "Retensi"
privacy_retention_body = "Berkas Kegiatan auto- prune melewati 90 hari; analitik counter dan keanggotaan berakhir oleh kunci TTL dalam waktu 90 hari. Penghapusan tidak pernah menghapus keadaan hidup. Akun dan sejarah bertahan sampai Anda meminta penghapusan atau penghentian di bawah Terminal."
privacy_rights_title = "Hak & penghapusan Anda"
privacy_rights_body = "Akses, benar, hapus, port, objek, batasi. Surel"
privacy_rights_after = "dengan ID akun in-game Anda (atau nama + perkiraan tanggal pembuatan). Diverifikasi penghapusan akun, pemetaan identitas, metadata cermin, dan penyandian analitik - dikonfirmasi kembali kepada Anda. GPC dihormati sebagai penjualan / berbagi-out (kita tidak menjual atau berbagi, sehingga tidak ada toggles dengan jawaban; respon dalam paling lama."
privacy_security_title = "Keamanan, transfer, perubahan"
privacy_security_body = "Kami menggunakan TLS saat data dikirim, komponen internal yang hanya dapat diakses secara lokal, endpoint operasional yang dilindungi, dan rahasia kepemilikan yang di-hash; tidak ada jaminan keamanan mutlak. Infrastruktur berjalan di AS dan UE dengan minimisasi data dan tanpa transfer ke teknologi iklan. Perubahan penting pada Pemberitahuan Privasi akan kami umumkan dengan jelas sebelum berlaku; jika hukum mengharuskannya, kami akan meminta persetujuan secara terpisah. Melanjutkan penggunaan saja bukanlah persetujuan."
privacy_contact_title = "Kontak"
privacy_contact_before = "Privasi:"
privacy_help = "Bantuan:"
