privacy_cookies_body = "Penyimpanan hanya untuk kebutuhan penting: ID sesi. Peristiwa produk dikirim ke endpoint milik kami. Tidak ada cookie iklan, sosial, atau lintas situs. Font dihosting sendiri tanpa permintaan lintas origin. Detail dan pengaturan ada di"
privacy_retention_title = "Retensi"
privacy_retention_body = "Berkas Kegiatan auto- prune melewati 90 hari; analitik counter dan keanggotaan berakhir oleh kunci TTL dalam waktu 90 hari. Penghapusan tidak pernah menghapus keadaan hidup. Akun dan sejarah bertahan sampai Anda meminta penghapusan atau penghentian di bawah Terminal."
privacy_rights_title = "Hak & penghapusan Anda"
privacy_rights_body = "Akses, benar, hapus, port, objek, batasi. Surel"
privacy_rights_after = "dengan ID akun in-game Anda (atau nama + perkiraan tanggal pembuatan). Diverifikasi penghapusan akun, pemetaan identitas, metadata cermin, dan penyandian analitik - dikonfirmasi kembali kepada Anda. GPC dihormati sebagai penjualan / berbagi-out (kita tidak menjual atau berbagi, sehingga tidak ada toggles dengan jawaban; respon dalam paling lama."
privacy_security_title = "Keamanan, transfer, perubahan"
privacy_security_body = "Kami menggunakan TLS saat data dikirim, komponen internal yang hanya dapat diakses secara lokal, endpoint operasional yang dilindungi, dan rahasia kepemilikan yang di-hash; tidak ada jaminan keamanan mutlak. Infrastruktur berjalan di AS dan UE dengan minimisasi data dan tanpa transfer ke teknologi iklan. Perubahan penting pada Pemberitahuan Privasi akan kami umumkan dengan jelas sebelum berlaku; jika hukum mengharuskannya, kami akan meminta persetujuan secara terpisah. Melanjutkan penggunaan saja bukanlah persetujuan."
