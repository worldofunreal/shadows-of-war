privacy_rights_body = "Akses, benar, hapus, port, objek, batasi. Surel"
privacy_rights_after = "dengan ID akun in-game Anda (atau nama + perkiraan tanggal pembuatan). Diverifikasi penghapusan akun, pemetaan identitas, metadata cermin, dan penyandian analitik - dikonfirmasi kembali kepada Anda. GPC dihormati sebagai penjualan / berbagi-out (kita tidak menjual atau berbagi, sehingga tidak ada toggles dengan jawaban; respon dalam paling lama."
privacy_security_title = "Keamanan, transfer, perubahan"
privacy_security_body = "TLS dalam transit, pencarian hanya dalam proses, operator berjenggot titik akhir, memiliki rahasia kepemilikan; tidak ada jaminan absolut. Infra berjalan di AS dan Uni Eropa dengan data-minimisasi dan tidak ada transfer ad- teknologi. Kebijakan hiburan berubah berlaku setelah pemberitahuan penting; terus menggunakan berarti penerimaan."
