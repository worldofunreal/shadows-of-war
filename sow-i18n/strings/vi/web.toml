terms_updated = "Cập nhật lần cuối: 2026 · World of Unreal"
terms_acceptance_title = "Chấp nhận và cao cả"
terms_acceptance_body = "Những điều khoản này là một thỏa thuận ràng buộc giữa anh và World of Unreal Quản lý việc sử dụng Shadows of War trên bóng tối chiến tranh.io, sân ga đối tác và khách hàng bản địa. bằng cách chơi, cài đặt, hoặc truy cập dịch vụ bạn đồng ý với những điều khoản này. nếu bạn không đồng ý, đừng sử dụng dịch vụ."
terms_acceptance_age = "Bạn phải ít nhất 13 tuổi. người chơi 13 đến 17 tuổi chỉ có thể chơi với sự cho phép và giám sát của cha mẹ hoặc người bảo hộ."
terms_changes_title = "Thay đổi trò chơi và dịch vụ"
terms_changes_body = "Nhiều người chơi đòi hỏi máy phục vụ của chúng ta phải truy cập vào máy chủ. Chúng ta có thể sửa đổi, tạm dừng hoặc ngừng lại bất cứ phần nào của dịch vụ — chế độ, bản đồ, mùa, bảng dẫn đầu, các sự kiện — bất cứ lúc nào, dù có hay không có trách nhiệm với bạn."
terms_accounts_title = "Tài khoản"
terms_accounts_body = "Trò chơi vô danh tạo một mã nhận diện tài khoản chính thống được cất giữ trên thiết bị của bạn với tên hiển thị. Việc dọn sạch kho chứa nơi Mạng tạo một tài khoản mới; thay đổi tên không bao giờ thay đổi ID tài khoản. Mã số tài khoản của bạn là khóa tiến trình, không phải mật khẩu — giữ bảo mật thiết bị của bạn."
terms_accounts_contact = "Anh chịu trách nhiệm cho tất cả các hoạt động dưới tài khoản của mình."
terms_license_title = "Giấy phép & hạn chế"
terms_license_body = "Các Điều khoản này quy định quyền truy cập Dịch vụ chính thức được lưu trữ, tài khoản, vật phẩm ảo và dữ liệu máy chủ. Toàn bộ mã nguồn trò chơi được cấp phép riêng theo AGPL-3.0-only, bao gồm các điều khoản bổ sung của OpenFront. Các Điều khoản này không hạn chế quyền theo giấy phép mã nguồn hoặc giấy phép bản đồ riêng."
terms_maps_before = "Nguồn bản đồ phái sinh từ OpenFront và các tệp bản đồ được tạo ra được cấp phép theo"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "Thông báo bản đồ ghi rõ ghi công, nguồn và thay đổi:"
terms_maps_notice = "thông báo bản đồ"
terms_license_no_sell = "Không bán, cho thuê, cấp phép lại hoặc khai thác thương mại Dịch vụ chính thức được lưu trữ, tài khoản hay vật phẩm ảo."
terms_license_no_reverse = "Không đảo ngược kỹ thuật, thu thập dữ liệu, trích xuất hàng loạt hoặc huấn luyện mô hình trên Dịch vụ chính thức được lưu trữ. Các hạn chế này không làm giảm quyền theo giấy phép mã nguồn và bản đồ."
terms_license_feedback = "Phản hồi bạn chia sẻ có thể được sử dụng tự do mà không cần bồi thường hoặc ghi tên bạn."
terms_virtual_title = "Mục ảo và không có trả lại"
terms_virtual_body = "Gems, nhà lãnh đạo mở khóa, và da được cấp phép chỉ: không có giá trị tiền mặt, không thể chuyển đổi, không thể tái tạo. Người lãnh đạo mở khóa trò chơi thay đổi — họ có đặc quyền riêng biệt và không hoàn toàn thẩm mỹ."
terms_sales_final = "Tất cả mọi thứ đều ổn."
terms_virtual_refunds = "Những thứ ảo không được hoàn chỉnh và không thể thay thế đến mức tối đa được cho phép bởi pháp luật — bao gồm những mục đã dùng hoặc không được yêu cầu, thay đổi dịch vụ, hoặc hành động tài khoản đã được thực hiện cho việc vi phạm các giao kèo. Nếu một nền tảng đảo ngược một mua, chúng ta có thể gỡ bỏ các mục tương ứng và đưa ra các biện pháp tài khoản tương ứng."
terms_conduct_title = "Cư xử của người chơi"
terms_conduct_cheating = "Không gian lận, robot, vĩ mô, tự động hóa, khai thác lỗi, hoặc cố ý tước quyền."
terms_conduct_harassment = "Không quấy rối, đe dọa, căm ghét, hay đánh máy, tên, thẻ, và trò chuyện phải tuân theo luật pháp."
terms_conduct_servers = "Không làm gián đoạn máy chủ, thăm dò cơ sở hạ tầng, hoặc chạm vào tài khoản, giấy phép, hoặc vé phạt của người chơi khác."
terms_conduct_after = "Việc vi phạm có thể dẫn đến việc loại bỏ nội dung, phù hợp với việc bị mất, hoặc đình chỉ hoặc chấm dứt."
terms_third_party_title = "Dịch vụ bên thứ ba và các cầu thủ khác"
terms_third_party_body = "Nền tảng cộng sự và SDKs, nhà cung cấp thanh toán, Discord, và Telegram Chúng tôi không kiểm soát các bên thứ ba, các điều khoản của họ áp dụng và bạn sử dụng chúng với rủi ro của riêng bạn. World of Unreal từ những tuyên bố từ bên thứ ba hoặc những cầu thủ khác."
terms_termination_title = "Kết thúc"
terms_termination_body = "Chúng ta có thể tạm dừng hoặc hủy bỏ việc truy cập tài khoản, mục tiêu, mục nhập bảng dẫn đầu — bất cứ lúc nào vì bất cứ lý do nào, kể cả việc vi phạm những điều khoản bị nghi ngờ, không có trách nhiệm."
terms_disclaimer_title = "Không nhận"
terms_disclaimer_body = "Dịch vụ được cung cấp ‘nguyên trạng’ và ‘khi có sẵn’. Trong phạm vi pháp luật cho phép, chúng tôi từ chối mọi bảo đảm, bao gồm khả năng thương mại, sự phù hợp cho mục đích cụ thể, quyền sở hữu và không xâm phạm. Chúng tôi không bảo đảm dịch vụ hoạt động liên tục, không lỗi hoặc an toàn, cũng như không bảo đảm việc giữ nguyên tiến trình, thứ hạng hay vật phẩm."
terms_liability_title = "Giới hạn số nợ"
terms_liability_body = "Chúng tôi không có lý do để thất bại, mất công lý, mất bảo vệ, hoặc bất kỳ nghi ngờ nào."
terms_indemnification_title = "Không xác định"
terms_indemnification_body = "Anh đồng ý bảo vệ và bất đắc dĩ. World of Unreal chống lại các yêu cầu và chi phí hợp lý từ việc sử dụng dịch vụ, vi phạm các điều khoản, hoặc vi phạm pháp luật."
terms_arbitration_title = "& Phân biệt đối tượng"
terms_arbitration_before = "Thông qua các cáo buộc cá nhân (JAMS, Delaware) sau 45 ngày cố gắng giải quyết không chính thức — không phải tòa án. Bạn từ chối quyền bồi thẩm đoàn và hành động. Lệnh thông báo nhỏ và IP có ngoại lệ. Bạn có thể tối ưu trong vòng 30 ngày sau khi chấp nhận những hạn ngạch đầu tiên này bằng email."
terms_arbitration_after = "với chứng minh thư tài khoản và một tuyên bố rõ ràng."
terms_general_title = "Chung"
terms_general_before = "Luật Delaware điều chỉnh các Điều khoản này; các khiếu nại không qua trọng tài chỉ được giải quyết tại tòa án Delaware. Chúng tôi sẽ thông báo nổi bật về thay đổi quan trọng trước khi có hiệu lực. Nếu luật áp dụng yêu cầu chấp thuận lại, chúng tôi sẽ xin riêng. Liên hệ: World of Unreal —"
terms_privacy_title = "Riêng tư"
terms_privacy_before = "Việc xử lý dữ liệu, quyền của bạn, và xóa được mô tả trong chúng tôi"
terms_privacy_and = "và"
terms_privacy_after = "Kết hợp ở đây bằng cách tham khảo."
analytics_title = "Phân tích tùy chọn"
analytics_body = "Chúng tôi dùng hoạt động trên trang web và trong trò chơi để cải thiện Shadows of War. Phân tích chỉ bật khi bạn cho phép."
cookies_analytics_events = "Sự kiện ghi nhận lượt truy cập, tải, menu, tiến độ hướng dẫn, ghép trận, cùng việc bắt đầu, kết quả và chủ động thoát trận. Chi tiết trận chỉ dùng các danh mục cố định và nhóm kích thước màn hình tổng quát. Bản ghi sự kiện không chứa tên, ID tài khoản/người chơi, trường IP, ID trận/phòng, trò chuyện, mật khẩu, chi tiết mua hàng, văn bản lỗi thô, lượt nhấp bản đồ hoặc chuỗi user-agent đầy đủ."
cookies_analytics_server = "Sau khi bạn đồng ý, sự kiện chỉ được gửi đến endpoint của chúng tôi /api/event, không đi qua relay trò chơi. Mỗi sự kiện dùng ID phiên ngẫu nhiên tạm thời, chỉ tồn tại trong phiên trình duyệt hiện tại. Bản ghi sự kiện không chứa ID tài khoản/người chơi, ID trận/phòng hoặc địa chỉ IP; IP của yêu cầu có thể xuất hiện trong nhật ký kỹ thuật bảo mật riêng."
analytics_policy = "Chi tiết cookie"
analytics_accept = "Cho phép"
analytics_reject = "Từ chối"
analytics_manage = "Cài đặt cookie"
privacy_analytics_body_v3 = "Phân tích tùy chọn do chúng tôi thực hiện trên website và trò chơi trình duyệt chỉ chạy sau khi bạn cho phép. Phân tích ghi nhận nhóm sự kiện giới hạn về lượt truy cập, tải, menu, hướng dẫn, phòng và trận đấu, cùng phiên bản, ngôn ngữ, loại kích thước màn hình tổng quát và thẻ nguồn ngắn tùy chọn từ ?ref=. Sự kiện dùng ID phiên ngẫu nhiên tạm thời chỉ được lưu trong phiên trình duyệt hiện tại; không chứa ID tài khoản/người chơi hoặc ID trận/phòng. IP yêu cầu có thể xuất hiện trong nhật ký kỹ thuật bảo mật riêng, không nằm trong bản ghi sự kiện phân tích. Không ghi tên, tin nhắn, mật khẩu, ID quảng cáo, lượt nhấp bản đồ hoặc dấu vân tay thiết bị đầy đủ."
privacy_cookies_body_v2 = "Chúng tôi lưu lựa chọn phân tích của bạn trong bộ nhớ cục bộ. Chỉ sau khi bạn cho phép, ID phiên phân tích tạm thời và hàng đợi thử gửi lại nhỏ mới được tạo trong bộ nhớ phiên. Từ chối không ảnh hưởng trò chơi. Cài đặt trò chơi, tính liên tục của tài khoản và tài nguyên lưu đệm dùng bộ nhớ riêng cần thiết cho các tính năng đó. Chi tiết và cách kiểm soát có trong"
privacy_retention_body_v2 = "Tệp sự kiện, bộ đếm phân tích và bản ghi thành viên sẽ hết hạn trong vòng 90 ngày. Sau khi xác minh, xóa tài khoản sẽ xóa sự kiện và bản ghi thành viên liên quan; tổng số hằng ngày không nhận dạng được chỉ lưu đến hết cùng thời hạn 90 ngày. Tài khoản và lịch sử trận đấu được lưu cho đến khi bạn yêu cầu xóa hoặc tài khoản bị chấm dứt theo Điều khoản."
privacy_updated_v2 = "Cập nhật lần cuối: 6 tháng 10, 2026 · Đơn vị phụ trách: World of Unreal · Liên hệ: hello@shadowsofwar.io"
cookies_analytics_title = "Phân tích tùy chọn trên website và trò chơi trình duyệt"
cookies_storage_title = "Bộ nhớ trình duyệt và thời hạn lưu"
cookies_storage_body = "Chúng tôi lưu cục bộ lựa chọn cho phép hoặc từ chối của bạn. Chỉ sau khi cho phép, ID phiên tạm thời và hàng đợi thử gửi lại nhỏ mới được lưu trong bộ nhớ phiên. Phân tích gồm phiên bản, ngôn ngữ và loại màn hình tổng quát, không gồm toàn bộ user-agent. Tệp sự kiện và bản ghi thành viên hết hạn trong 90 ngày; xóa tài khoản đã xác minh sẽ xóa sự kiện và bản ghi liên quan. Cài đặt trò chơi, duy trì tài khoản, khôi phục sau sự cố và tài nguyên lưu đệm dùng bộ nhớ riêng cần thiết."
cookies_platforms_title = "Nền tảng trò chơi khác"
cookies_platforms_body = "Poki, CrazyGames và Jest có thể đo lường việc sử dụng bằng SDK riêng theo điều khoản của nền tảng. Chúng tôi không sao chép sự kiện gắn với người chơi từ các nền tảng đó về máy chủ. Phân tích first-party trên Android bị tắt cho đến khi nội dung công bố của cửa hàng được cập nhật."
cookies_controls_v2 = "Bạn có thể cho phép hoặc từ chối phân tích tùy chọn dễ dàng như nhau. Bắt đầu chơi không được xem là cho phép. Đổi lựa chọn trong Cài đặt trò chơi hoặc tại đây; từ chối không ảnh hưởng trò chơi. Xóa dữ liệu website cũng xóa lựa chọn, và phân tích sẽ tắt cho đến khi bạn cho phép lại. Chúng tôi không bán hoặc chia sẻ dữ liệu phân tích cho quảng cáo."
cookies_description_v2 = "Phân tích sản phẩm tùy chọn luôn tắt cho đến khi bạn cho phép. Bắt đầu chơi không bật tính năng này. Tìm hiểu dữ liệu Shadows of War lưu và cách đổi lựa chọn."
cookies_og_description_v2 = "Phân tích tùy chọn luôn tắt cho đến khi bạn cho phép. Bạn có thể đổi lựa chọn bất cứ lúc nào."
cookies_updated_v2 = "Cập nhật lần cuối: 6 tháng 10, 2026 · World of Unreal"
step_build = "Xây quận"
step_build_body = "Thành phố, nhà máy, cảng và tháp biến đất đai thành quân và vàng."
