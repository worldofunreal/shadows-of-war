privacy_security_contact = "Những thiếu sót về an ninh: Riêng tư hello@Không bao giờ ở nơi công cộng — được công nhận trong vòng 48 giờ."
privacy_source_before = "Mã nguồn đầy đủ của từng phiên bản trò chơi được cấp phép theo AGPL-3.0-only cùng các điều khoản bổ sung của OpenFront. Menu trò chơi liên kết đến mã nguồn đúng phiên bản."
cookies_title = "Chú ý — Shadows of War"
cookies_description = "Cách Shadows of War sử dụng dữ liệu cần thiết: ID phiên và sự kiện sản phẩm của chúng tôi. Không có cookie quảng cáo."
