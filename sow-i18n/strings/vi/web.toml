leader_qin_liangyu_ability = "Phòng thủ nhà Minh"
leader_qin_liangyu_description = "Quân đội rút khỏi lãnh thổ của bạn mất thêm 50% quân."
leader_ramesses_ii_ability = "Xưởng Pi-Ramesses"
