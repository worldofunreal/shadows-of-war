leader_sayyid_said_description = "Quân tấn công mất ít hơn 50% quân khi chiếm đất ven biển."
leader_semiramis_ability = "Vườn treo"
leader_semiramis_description = "Khu nông trại sản xuất nhiều vàng hơn 25%."
leader_shajar_al_durr_ability = "Chiến tranh Thập tự"
