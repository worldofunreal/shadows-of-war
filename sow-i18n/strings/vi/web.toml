privacy_sdk_label = "Cộng sự SDKs:"
privacy_sdk_body = "theo chính sách của họ khi bạn chơi thông qua họ."
privacy_players_label = "Người chơi & công cộng:"
privacy_players_body = "Tên, tay cầm, hàng ngũ, hồ sơ trùng khớp."
privacy_authorities_label = "Truyền tải nhà cầm quyền:"
privacy_authorities_body = "tức là luật pháp, hoặc một người kế tự hợp pháp, để ý mà tra hỏi."
privacy_cookies_title = "Cookie & kho cục bộ"
privacy_cookies_body = "Chỉ lưu trữ một cách chính xác: ưu tiên chủ đề, ID phiên chạy, điểm kết thúc sự kiện đầu tiên của chúng tôi. Không quảng cáo, xã hội, hay các quy định khác nhau. Phông chữ là tự thực hiện — không yêu cầu chéo cơ sở. Chi tiết và điều khiển trong chúng tôi."
privacy_retention_title = "Nhớ"
privacy_retention_body = "Các tập tin quan trọng trong suốt 90 ngày qua; các phân tích và các thành viên kết thúc bởi khóa TTL trong vòng 90 ngày. Triển khai không bao giờ xóa trạng thái sống. Tài khoản và lịch sử vẫn còn tồn tại cho đến khi bạn yêu cầu xóa hoặc chấm dứt dưới các Điều khoản."
privacy_rights_title = "Quyền & xoá"
privacy_rights_body = "Truy cập, đúng, xoá, cổng, đối tượng, hạn chế."
privacy_rights_after = "@ info/ rich"
privacy_security_title = "Bảo mật, chuyển nhượng, thay đổi"
privacy_security_body = "Thời gian đi lại, vòng lặp chỉ nội bộ, điểm giao dịch được thực hiện, mã hóa bí mật quyền sở hữu, không bảo đảm tuyệt đối. Infra chạy ở Mỹ và EU với dữ liệu ngắn và không chuyển giao công nghệ. Chính sách vật chất có hiệu lực sau khi thông báo nổi bật; tiếp tục sử dụng có nghĩa là chấp nhận."
privacy_contact_title = "Contact & mới"
privacy_contact_before = "Riêng tư:"
privacy_help = "Trợ giúp:"
support_center = "trung tâm hỗ trợ"
privacy_security_contact = "Những thiếu sót về an ninh: Riêng tư hello@Không bao giờ ở nơi công cộng — được công nhận trong vòng 48 giờ."
privacy_source_before = "Thành phần bên máy phục vụ là A phiên bản 3. 0-hoặc sau; nguồn trên"
cookies_title = "Chú ý — Shadows of War"
cookies_description = "Làm thế nào Shadows of War chỉ sử dụng các kho lưu trữ chặt chẽ: ưu tiên chủ đề, nhận diện phiên chạy, và các sự kiện sản phẩm đầu tiên."
cookies_og_description = "Không quảng cáo, xã hội, hay ăn trộm đồ ăn."
cookies_eyebrow = "Lưu trữ & hợp pháp"
cookies_heading = "Thông báo cookie"
cookies_heading_em = "thông báo."
cookies_updated = "Cập nhật lần cuối: 2026 · World of Unreal"
cookies_use_title = "Những gì chúng ta sử dụng"
cookies_use_body = "Shadows of War sử dụng máy chủ thực dụng chỉ lưu trữ — loại mà không cần băng cờ đồng ý vì nơi Mạng và trò chơi không thể hoạt động nếu không có nó:"
cookies_theme_label = "Sắc thái"
cookies_theme_body = "nhớ sự lựa chọn nhẹ nhàng và tối tăm của anh."
cookies_session_label = "Nhận diện phiên chạy phân tích"
cookies_session_body = "ID ngẫu nhiên nhóm các sự kiện sản phẩm đầu tiên trong vòng một lần ghé thăm."
cookies_events_label = "Sự kiện sản phẩm đầu tiên:"
cookies_events_body = "Các sự kiện ống dẫn vô danh được gửi tới máy chủ của chúng tôi"
cookies_events_after = "Không phải là bánh quy, không chia sẻ với bất kỳ nhà cung cấp nào."
cookies_game_label = "Tài sản bản đồ đã lưu tạm thiết lập trò chơi"
cookies_game_body = "dữ liệu trò chơi đã tải xuống của khách hàng."
cookies_third_party_title = "Tiệc thứ ba."
cookies_third_party_body = "Phông chữ được tự cài đặt trong lãnh thổ của chúng ta. Không có mã phần ba chạy lưu trữ hay theo dõi trên trang của chúng ta: không có mạng quảng cáo, không có thiết bị xã hội, không có văn lệnh chơi phiên chạy, không có bộ nhận diện địa điểm chéo. Trang của chúng ta không tạo yêu cầu không có gì chạy chéo."
cookies_dont_title = "Những gì chúng ta không làm"
cookies_dont_ads = "Không có bánh quy quảng cáo và quảng cáo dựa trên lợi ích."
cookies_dont_sell = "Không bán hay chia sẻ dữ liệu cá nhân để quảng cáo."
cookies_dont_tracking = "Không theo dấu chéo hay đánh dấu chéo."
cookies_dont_body = "Bởi vì không có theo dõi hành vi, kiểm soát quyền riêng tư toàn cầu và không theo dõi tín hiệu không có gì để tắt — và chúng tôi tôn trọng GPC như một giảm giá/chia sẻ tối ưu."
cookies_controls_title = "Name"
cookies_controls_clear = "Xoá dữ liệu nơi Mạng bất cứ lúc nào trong thiết lập trình duyệt — gỡ bỏ ưu tiên sắc thái, mã nhận diện phiên chạy và tài sản đã lưu tạm. Trò chơi tiếp tục hoạt động; nó chỉ đơn giản là quên đi chủ đề của bạn và bắt đầu một phiên chạy mới."
cookies_controls_block = "Chặn tất cả các kho lưu trữ lại có thể buộc phải giảm tải xuống hàng loạt tài sản trò chơi và thiết lập lại tùy thích mỗi lần ghé thăm."
cookies_controls_rights = "Để biết quyền cá nhân-dữ liệu (các quyền truy cập, xóa, khả năng chuyển giao), xem chính sách riêng tư — email"
cookies_changes_title = "Thay đổi"
cookies_changes_body = "Nếu chúng ta thêm vào những kho không cần thiết (người phân tích, người phân tích, người phân tích), quảng cáo, thông báo này sẽ liệt kê mỗi món đồ với mục đích và điều khiển trước khi nó được đóng tàu - và chính sách riêng tư sẽ được cập nhật cùng với nhau. cập nhật: ngày 2026."
terms_title = "Những điều kiện để phụng sự — Shadows of War"
terms_description = "Đọc các điều khoản của dịch vụ Shadows of War: tài khoản, mục ảo và chính sách không được thỏa mãn, hành vi, trách nhiệm và độ phân giải tranh chấp."
terms_eyebrow = "Điều kiện & kỳ"
terms_heading = "Các điều khoản"
terms_heading_em = "Phục vụ."
terms_updated = "Cập nhật lần cuối: 2026 · World of Unreal"
terms_acceptance_title = "Chấp nhận và cao cả"
terms_acceptance_body = "Những điều khoản này là một thỏa thuận ràng buộc giữa anh và World of Unreal Quản lý việc sử dụng Shadows of War trên bóng tối chiến tranh.io, sân ga đối tác và khách hàng bản địa. bằng cách chơi, cài đặt, hoặc truy cập dịch vụ bạn đồng ý với những điều khoản này. nếu bạn không đồng ý, đừng sử dụng dịch vụ."
terms_acceptance_age = "Bạn phải ít nhất 13 tuổi. người chơi 13 đến 17 tuổi chỉ có thể chơi với sự cho phép và giám sát của cha mẹ hoặc người bảo hộ."
terms_changes_title = "Name"
terms_changes_body = "Nhiều người chơi đòi hỏi máy phục vụ của chúng ta phải truy cập vào máy chủ. Chúng ta có thể sửa đổi, tạm dừng hoặc ngừng lại bất cứ phần nào của dịch vụ — chế độ, bản đồ, mùa, bảng dẫn đầu, các sự kiện — bất cứ lúc nào, dù có hay không có trách nhiệm với bạn."
terms_accounts_title = "Tài khoản"
terms_accounts_body = "Trò chơi vô danh tạo một mã nhận diện tài khoản chính thống được cất giữ trên thiết bị của bạn với tên hiển thị. Việc dọn sạch kho chứa nơi Mạng tạo một tài khoản mới; thay đổi tên không bao giờ thay đổi ID tài khoản. Mã số tài khoản của bạn là khóa tiến trình, không phải mật khẩu — giữ bảo mật thiết bị của bạn."
terms_accounts_contact = "Anh chịu trách nhiệm cho tất cả các hoạt động dưới tài khoản của mình."
terms_license_title = "Giấy phép & hạn chế"
terms_license_body = "Chúng tôi cấp một giấy phép giới hạn, có thể điều chỉnh lại được cho một trò chơi cá nhân, không phải đối tượng. World of Unreal hoặc các máy sao chép của nó. Mã nguồn trò chơi được chia riêng dưới các kết quả (A vội vã). 0-sau đó; tài khoản, mục ảo, và dữ liệu máy phục vụ được quản lý bởi các điều khoản này."
terms_license_no_sell = "Không bán, thuê nhà, trợ cấp, hoặc bóc lột thương mại."
terms_license_no_reverse = "Không có công nghệ đảo ngược, phế thải, thu nhỏ, hoặc đào tạo mô hình về Dịch vụ."
terms_license_feedback = "Có thể dùng tự do, không cần bồi thường hoặc đòi lại."
terms_virtual_title = "Mục ảo và không có trả lại"
terms_virtual_body = "Gems, nhà lãnh đạo mở khóa, và da được cấp phép chỉ: không có giá trị tiền mặt, không thể chuyển đổi, không thể tái tạo. Người lãnh đạo mở khóa trò chơi thay đổi — họ có đặc quyền riêng biệt và không hoàn toàn thẩm mỹ."
terms_sales_final = "Tất cả mọi thứ đều ổn."
terms_virtual_refunds = "Những thứ ảo không được hoàn chỉnh và không thể thay thế đến mức tối đa được cho phép bởi pháp luật — bao gồm những mục đã dùng hoặc không được yêu cầu, thay đổi dịch vụ, hoặc hành động tài khoản đã được thực hiện cho việc vi phạm các giao kèo. Nếu một nền tảng đảo ngược một mua, chúng ta có thể gỡ bỏ các mục tương ứng và đưa ra các biện pháp tài khoản tương ứng."
terms_conduct_title = "Cư xử của người chơi"
terms_conduct_cheating = "Không gian lận, robot, vĩ mô, tự động hóa, khai thác lỗi, hoặc cố ý tước quyền."
terms_conduct_harassment = "Không quấy rối, đe dọa, căm ghét, hay đánh máy, tên, thẻ, và trò chuyện phải tuân theo luật pháp."
terms_conduct_servers = "Không làm gián đoạn máy chủ, thăm dò cơ sở hạ tầng, hoặc chạm vào tài khoản, giấy phép, hoặc vé phạt của người chơi khác."
terms_conduct_after = "Việc vi phạm có thể dẫn đến việc loại bỏ nội dung, phù hợp với việc bị mất, hoặc đình chỉ hoặc chấm dứt."
terms_third_party_title = "Dịch vụ bên thứ ba và các cầu thủ khác"
terms_third_party_body = "Nền tảng cộng sự và SDKs, nhà cung cấp thanh toán, Discord, và Telegram Chúng tôi không kiểm soát các bên thứ ba, các điều khoản của họ áp dụng và bạn sử dụng chúng với rủi ro của riêng bạn. World of Unreal từ những tuyên bố từ bên thứ ba hoặc những cầu thủ khác."
terms_termination_title = "Kết thúc"
terms_termination_body = "Chúng ta có thể tạm dừng hoặc hủy bỏ việc truy cập tài khoản, mục tiêu, mục nhập bảng dẫn đầu — bất cứ lúc nào vì bất cứ lý do nào, kể cả việc vi phạm những điều khoản bị nghi ngờ, không có trách nhiệm."
terms_disclaimer_title = "Không nhận"
terms_disclaimer_body = "Dịch vụ được cung cấp ‘nguyên trạng’ và ‘khi có sẵn’. Trong phạm vi pháp luật cho phép, chúng tôi từ chối mọi bảo đảm, bao gồm khả năng thương mại, sự phù hợp cho mục đích cụ thể, quyền sở hữu và không xâm phạm. Chúng tôi không bảo đảm dịch vụ hoạt động liên tục, không lỗi hoặc an toàn, cũng như không bảo đảm việc giữ nguyên tiến trình, thứ hạng hay vật phẩm."
terms_liability_title = "Giới hạn số nợ"
terms_liability_body = "Chúng tôi không có lý do để thất bại, mất công lý, mất bảo vệ, hoặc bất kỳ nghi ngờ nào."
terms_indemnification_title = "Không xác định"
terms_indemnification_body = "Anh đồng ý bảo vệ và bất đắc dĩ. World of Unreal chống lại các yêu cầu và chi phí hợp lý từ việc sử dụng dịch vụ, vi phạm các điều khoản, hoặc vi phạm pháp luật."
terms_arbitration_title = "& Phân biệt đối tượng"
terms_arbitration_before = "Thông qua các cáo buộc cá nhân (JAMS, Delaware) sau 45 ngày cố gắng giải quyết không chính thức — không phải tòa án. Bạn từ chối quyền bồi thẩm đoàn và hành động. Lệnh thông báo nhỏ và IP có ngoại lệ. Bạn có thể tối ưu trong vòng 30 ngày sau khi chấp nhận những hạn ngạch đầu tiên này bằng email."
terms_arbitration_after = "với chứng minh thư tài khoản và một tuyên bố rõ ràng."
terms_general_title = "Chung"
terms_general_before = "Dự án Delaware chi phối các điều khoản này; những tuyên bố không được phân loại chỉ dành riêng cho các tòa án Delaware. cập nhật vật chất có hiệu lực sau khi thông báo nổi bật; tiếp tục sử dụng phương tiện chấp nhận. liên lạc: World of Unreal —"
terms_privacy_title = "Riêng tư"
terms_privacy_before = "Việc xử lý dữ liệu, quyền của bạn, và xóa được mô tả trong chúng tôi"
terms_privacy_and = "và"
terms_privacy_after = "Kết hợp ở đây bằng cách tham khảo."
