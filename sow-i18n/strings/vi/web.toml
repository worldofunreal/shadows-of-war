privacy_overview_title = "Xem và điều khiển toàn cảnh"
privacy_overview_body = "Shadows of War được quản lý bởi World of UnrealChính sách này bao gồm bóng của chiến tranh.io, đối tác nền tảng, và khách hàng bản địa. liên lạc quyền riêng tư:"
privacy_overview_after = "Chúng tôi không có cơ sở EU/UK — gửi tất cả các yêu cầu, kể cả yêu cầu GDPR, trực tiếp ở đó."
privacy_overview_payments = "Thông tin thẻ được xử lý trực tiếp bởi cửa hàng bạn trả qua (Google PlayChúng ta không bao giờ thấy số quân bài."
privacy_eligibility_title = "Khả năng quản lý và trẻ em"
privacy_eligibility_body = "13+. Người chơi 13–17 cần sự cho phép của cha mẹ hoặc người bảo hộ. Trò chơi không được chỉ định cho trẻ em dưới 13; dưới 13 tài khoản bị đình chỉ và xoá. Cha mẹ: viết cho con dưới 13 tuổi."
privacy_eligibility_after = "Và chúng ta sẽ xóa nhanh chóng."
privacy_data_title = "Dữ liệu chúng tôi thu thập"
privacy_gameplay_label = "Bộ chơi:"
privacy_gameplay_body = "tên hiển thị, thẻ bộ tộc, nhà lãnh đạo/nhà văn hóa hóa hóa, kết hợp các dữ liệu nhập, lịch sử, hàng ngũ, vật dụng sở hữu."
privacy_account_label = "Tài khoản:"
privacy_account_body = "ID tài khoản trò chơi, nhà cung cấp đăng nhập đã liên kết và mã định danh của họ, email đã xác minh nếu được cung cấp, cùng mã băm thông tin xác thực quyền sở hữu và phiên trên máy chủ."
privacy_technical_label = "Kỹ thuật viên:"
privacy_technical_body = "xây dựng phiên bản, nền/locale, siêu dữ liệu kết nối, vé tiếp theo, bản ghi máy chủ cho bảo mật và chống sử dụng."
privacy_analytics_label = "Phân tích sản phẩm (chỉ bên đầu tiên):"
privacy_purchases_label = "Giao dịch:"
privacy_purchases_body = "ID sản phẩm, tham khảo về giao dịch, quyền lợi xã hội qua cửa hàng RevenueCat/the sute chi tiết thanh toán đầy đủ sẽ ở lại cửa hàng."
privacy_public_label = "Công cộng theo thiết kế:"
privacy_public_body = "Những người chơi khác có thể thấy tên, tay cầm, thứ hạng và hồ sơ trùng khớp."
privacy_use_title = "Dùng cơ sở & pháp lý"
privacy_use_body = "Chúng tôi xử lý dữ liệu cần thiết để vận hành trò chơi, bảo vệ người chơi và hệ thống, hỗ trợ người chơi và thực hiện nghĩa vụ pháp lý. Với người dùng ở EU và Vương quốc Anh, căn cứ xử lý gồm hợp đồng cung cấp trò chơi, lợi ích hợp pháp về an ninh và chống gian lận, nghĩa vụ pháp lý khi cần, và sự đồng ý của bạn đối với phân tích sản phẩm tùy chọn do chúng tôi thực hiện. Phân tích luôn tắt cho đến khi bạn cho phép; bạn có thể đổi lựa chọn trong Cài đặt. Chúng tôi không bán dữ liệu cá nhân hoặc dùng quảng cáo theo hành vi."
privacy_sharing_title = "Chia sẻ"
privacy_hosting_label = "Phục vụ dưới sự chỉ dẫn của chúng tôi:"
