leader_lobengula_ability = "Đồn trú Bulawayo"
leader_lobengula_description = "Thành phố nâng giới hạn quân của bạn thêm 50%."
leader_mangas_coloradas_ability = "Liên minh Apache"
leader_mangas_coloradas_description = "Liên minh chiến dịch với bộ lạc tốn ít vàng hơn 35%."
leader_mary_of_burgundy_ability = "Giàu có Burgundy"
