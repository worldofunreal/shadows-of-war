leader_tarenorerer_name = "Tarenorerer"
leader_tarenorerer_historical = "Tarenorerer, một phụ nữ Tommeginne ở miền bắc Tasmania, trở về quê hương năm 1828 sau khi bị bắt cóc và bán cho những người săn hải cẩu. Theo Australian Dictionary of Biography, bà tập hợp đàn ông và phụ nữ từ nhiều nhóm, huấn luyện họ sử dụng súng và tổ chức các cuộc tấn công chống lại những người định cư xâm lấn. Phần lớn ghi chép còn lại do các quan sát viên thuộc địa viết, đặc biệt là George Augustus Robinson; vì vậy cần thận trọng với cách gọi và những nhận định của họ về động cơ của bà."
leader_tarenorerer_civilization = "Người Tommeginne"


