leader_sargon_of_akkad_description = "Khi chiếm thành phố địch đang hoạt động mà bạn chưa có tháp trong phạm vi 12 ô, dựng miễn phí một tháp cấp 1 trên ô hợp lệ gần nhất của bạn trong phạm vi đó. Một lần cho mỗi thành phố chiếm được."

leader_mithridates_vi_ability = "Viện binh của Tigranes"
leader_mithridates_vi_description = "Nếu một đồng minh có thành phố đang hoạt động, rút khỏi cuộc tấn công trên bộ chống đối thủ sau ít nhất 3 giây sẽ cho số viện binh bằng số quân trở về, tối đa 1.000 và trong giới hạn quân. Một lần mỗi trận."

leader_gudit_yodit_ability = "Cuộc tháo chạy khỏi Aksum"
leader_gudit_yodit_description = "Khi chiếm một thành phố địch đang hoạt động, buộc đội quân trên bộ lớn nhất của chủ cũ đang tấn công một người chơi phải rút lui. Một lần cho mỗi thành phố chiếm được."

leader_khutulun_qaidu_ability = "Bắt địch trên lưng ngựa"
leader_khutulun_qaidu_description = "Khi mở cuộc tấn công trên bộ vào đối thủ đang tấn công bạn trên bộ, tuyển 20% số quân bạn đánh bại trong cuộc đụng độ đầu tiên vào lực lượng dự bị, tối đa bằng giới hạn quân."

leader_sor_juana_ines_de_la_cruz_ability = "Triết lý nhà bếp"
leader_sor_juana_ines_de_la_cruz_description = "Khi hoàn tất nâng cấp một trang trại, thời gian còn lại của lần nâng cấp thành phố đang diễn ra gần nhất của bạn trong phạm vi 12 ô giảm một nửa."

leader_sibylla_ability = "Vương miện thứ hai"
leader_sibylla_description = "Nếu có một thành phố đang hoạt động khi lập liên minh mới, thành phố được khởi công sớm nhất của đồng minh mới sẽ hoàn thành ngay nếu họ chưa có thành phố hoạt động. Một lần mỗi trận."

leader_cynethryth_mercia_ability = "Thỏa thuận Cookham"
leader_cynethryth_mercia_description = "Khi đối thủ chiếm một trang trại đang hoạt động của bạn, thành phố đã xây xong có cấp thấp nhất của bạn trong phạm vi 12 ô tăng một cấp, tối đa cấp 4. Mỗi trang trại chỉ kích hoạt một lần."

leader_suppiluliuma_ability = "Hiệp ước Mitanni"
leader_suppiluliuma_description = "Quân bộ của bạn mất ít hơn 25% binh lính khi chiếm ô địch giáp lãnh thổ của đồng minh đang tấn công cùng đối thủ trên bộ."

leader_baibars_ability = "Công binh thành Krak"
leader_baibars_description = "Khi chiếm một tháp địch đang hoạt động, bạn phá hủy tháp đang hoạt động gần nhất của cùng đối thủ, trong phạm vi 12 ô và có cấp hoạt động thấp hơn. Mỗi tháp chiếm được chỉ kích hoạt một lần mỗi trận."

leader_emperor_qin_shi_huang_ability = "Chuẩn đo lường đế quốc"
leader_emperor_qin_shi_huang_description = "Khi thành phố, nhà máy và nông trại của bạn có tổng cấp đang hoạt động bằng nhau và lớn hơn không, nhà máy sản xuất thêm 25% vàng và nông trại tạo thêm 25% quân."

leader_spartacus_ability = "Kho vũ khí Thurii"
leader_spartacus_description = "Khi đạo quân trên bộ của bạn chiếm trung tâm một nhà máy địch đang hoạt động, đạo quân đó nhận 300 lính cho mỗi cấp đang hoạt động của nhà máy. Mỗi nhà máy chỉ kích hoạt một lần mỗi trận."

leader_queen_nefertiti_ability = "Khối đá Talatat của Amarna"
leader_queen_nefertiti_description = "Nâng cấp thành phố tốn ít hơn 35% vàng nếu bạn có một nhà máy đang hoạt động cách thành phố đó không quá 12 ô."

leader_mandukhai_ability = "Thống nhất thảo nguyên"
leader_mandukhai_description = "Khi loại một đối thủ bằng cách chiếm phần lãnh thổ còn lại của họ, bạn tuyển 25% quân dự bị còn lại của đối thủ, tối đa đến giới hạn quân của mình."

leader_kabal_xook_ability = "Quân hiệu Yaxchilán"
leader_kabal_xook_description = "Khi có một thành phố đang hoạt động và ít nhất 750 quân dự bị, bạn gửi 750 quân dự bị vào đợt tấn công đường bộ mới của đồng minh nhắm vào một đối thủ chung. Mỗi đồng minh một lần trong mỗi trận."

leader_lakshmibai_ability = "Cứ điểm Kalpi"
leader_lakshmibai_description = "Khi đối thủ chiếm thành phố đang hoạt động cuối cùng của bạn, lập miễn phí một thành phố cấp 1 trên ô hợp lệ gần nhất thuộc lãnh thổ của bạn, cách thành phố đã mất tối đa 24 ô. Một lần mỗi trận."

leader_pharaoh_hatshepsut_ability = "Vườn Punt"
leader_pharaoh_hatshepsut_description = "Khi tàu buôn của bạn hoàn thành tuyến tới cảng nước ngoài, tăng một cấp cho trang trại đã hoàn tất có cấp thấp nhất của bạn trong phạm vi 12 ô quanh cảng xuất phát, tối đa cấp 4. Một lần mỗi cảng xuất phát."

leader_thusnelda_cherusci_ability = "Bất khuất trong cảnh giam cầm"
leader_thusnelda_cherusci_description = "Khi đối thủ chiếm một thành phố của bạn có cấp hoạt động từ 2 trở lên, thành phố mất một cấp đã hoàn thành và mọi nâng cấp đang diễn ra bị hủy. Một lần mỗi thành phố."

leader_queen_cartimandua_ability = "Giao nộp Caratacus"
leader_queen_cartimandua_description = "Khi bộ binh địch rút khỏi lãnh thổ của bạn, chuyển 25% quân sống sót cho đồng minh có đạo quân trên bộ lớn nhất đang đánh kẻ địch đó và còn chỗ trong quân dự bị. Phần dư trở về phía địch."

leader_queen_suriyothai_ability = "Hộ vệ Ayutthaya"
leader_queen_suriyothai_description = "Khi bộ binh địch sắp chiếm trung tâm của thành phố đồng minh đang hoạt động, dùng 1.500 quân dự bị để chặn đợt chiếm này và loại tối đa 1.500 quân địch. Một lần mỗi thành phố đồng minh."

leader_tarabai_ability = "Chauth phản kích"
leader_tarabai_description = "Chiếm một tháp đã hoàn tất của đối thủ đang tấn công bạn trên bộ để lấy 25% số vàng của họ, tối đa 250. Một lần mỗi tháp."

leader_natavan_ability = "Đài nước Shusha"
leader_natavan_description = "Khi một thành phố của bạn đạt cấp 2, xây miễn phí một trang trại cấp 1 tại ô hợp lệ gần nhất trong phạm vi 12 ô từ thành phố đó."

leader_mavia_ability = "Hòa ước Moses"
leader_mavia_description = "Khi kết minh với đối thủ trong lúc hai bên có cuộc tấn công trên bộ, quân tấn công sống sót của cả hai bên trở về không chịu tổn thất rút lui, tối đa bằng giới hạn quân số."

leader_queen_nandi_ability = "Đàn gia súc Emkhindini"
leader_queen_nandi_description = "Nông trại của bạn tạo thêm 25% binh lực."

