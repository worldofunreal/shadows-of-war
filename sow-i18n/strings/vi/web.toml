leader_artemisia_i_description = "Khu cảng sản xuất nhiều quân hơn 50%."
leader_artigas_ability = "Đình chiến bị phá vỡ"
leader_artigas_description = "Chinh phục kẻ phản bội nhanh hơn 15%."
leader_bernardo_ohiggins_ability = "Điền trang Lima"
leader_bernardo_ohiggins_description = "Liên minh chiến dịch với người chơi giàu hơn tốn ít vàng hơn 30%."
leader_constantine_ability = "Cầu Milvius"
leader_constantine_description = "Chinh phục người chơi có nhiều quân hơn quân đội của bạn nhanh hơn 50%."
leader_cosijoeza_ability = "Kháng chiến Zapotec"
leader_cosijoeza_description = "Người chơi lớn hơn rút khỏi lãnh thổ của bạn mất thêm 50% quân."
leader_eight_deer_ability = "Bó của Xipe"
leader_eight_deer_description = "Quân đội chiến đấu mạnh hơn 30% khi đánh người chơi là con người."
leader_gajah_mada_ability = "Lời thề Palapa"
leader_gajah_mada_description = "Chinh phục đất vô chủ nhanh hơn 50%."
