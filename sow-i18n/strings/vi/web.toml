privacy_use_title = "Dùng cơ sở & pháp lý"
privacy_use_body = "Chạy trò chơi, bảo vệ và chống-cheat, ống dẫn và đáng tin cậy, hỗ trợ, tuân thủ. cơ sở EU/U/UK: hợp đồng, lợi ích hợp pháp (không bao giờ quảng cáo hành vi), đồng ý nơi được yêu cầu, nghĩa vụ pháp lý. Chúng tôi không bán dữ liệu cá nhân và không chạy quảng cáo quảng cáo quảng cáo quảng cáo quảng cáo."
