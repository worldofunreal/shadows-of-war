leader_tribe_wiradjuri_ability = "Phòng thủ Wiradjuri"
leader_tribe_wiradjuri_description = "Quân phòng thủ mạnh hơn 15% khi bị đối thủ kiểm soát nhiều lãnh thổ hơn tấn công."
leader_nation_yagan_ability = "Kháng chiến Whadjuk"
leader_nation_yagan_description = "Các đòn tấn công nhằm vào một dân tộc hoặc vương quốc khác mạnh hơn 15%."
leader_peter_the_great_ability = "Cửa ngõ Baltic"
leader_peter_the_great_description = "Sau khi chiếm bờ biển địch, lập miễn phí một cảng hoàn tất tại vị trí hợp lệ gần đó. Một lần mỗi trận."
leader_empress_suiko_ability = "Giao lưu Asuka"
leader_empress_suiko_description = "Khi một đồng minh còn sống hoàn thành thành phố mới, bạn và người xây mỗi bên nhận 50 vàng. Một lần mỗi thành phố; nâng cấp không được tính."
leader_nebuchadnezzar_ii_ability = "Tường thành kép Babylon"
leader_nebuchadnezzar_ii_description = "Hoàn tất nâng cấp thành phố lập tức tăng một cấp cho tháp đã hoàn tất có cấp thấp nhất của bạn trong phạm vi 20 ô, tối đa cấp 4."
leader_king_david_ability = "Chiến lợi phẩm Ziklag"
leader_king_david_description = "Lần đầu chiếm mỗi thành phố địch đã hoàn tất, chia đều 200 vàng cho bạn và các đồng minh còn sống."
leader_sarraounia_mangou_ability = "Lougou kiên cường"
leader_sarraounia_mangou_description = "Mất thành phố huy động 1.500 quân dự bị trong giới hạn quân số. Một lần mỗi thành phố khi bạn vẫn còn lãnh thổ."
leader_muhammad_of_ghor_ability = "Trở lại Tarain"
leader_muhammad_of_ghor_description = "Rút một cuộc tấn công đối thủ sau ít nhất 3 giây: các đợt tấn công đối thủ đó mạnh hơn 35% trong 30 giây. Tổn thất rút lui vẫn áp dụng."
leader_puyi_ability = "Triều đình lệ thuộc"
leader_puyi_description = "Nhận thêm vàng bằng 20% thu nhập đất liền thông thường của đồng minh còn sống có thu nhập cao nhất và nhiều lãnh thổ hơn bạn. Vàng của họ không bị trừ."
leader_pertinax_ability = "Ngân khố tiết kiệm"
leader_pertinax_description = "Khi không có tấn công bộ đang diễn ra từ bạn nhằm vào người chơi hoặc từ người chơi nhằm vào bạn, mỗi 1.000 quân sản xuất bị lãng phí vì giới hạn quân số đổi thành 1 vàng."
leader_ewuare_ability = "Phường hội thợ"
leader_ewuare_description = "Mỗi cấp nhà máy đang hoạt động trong phạm vi 20 ô của một thành phố đang hoạt động thuộc bạn tạo thêm 1 vàng mỗi giây trong game. Nhiều thành phố không cộng dồn hiệu ứng."
leader_veleda_ability = "Chiến hạm sông Rhine"
leader_veleda_description = "Đạn hải quân của bạn bắt giữ chiến hạm địch bị đánh bại thay vì đánh chìm. Chiến hạm đổi phe với 25% máu và không có kinh nghiệm."
leader_amir_timur_ability = "Truy kích bộ lạc"
leader_amir_timur_description = "Các bộ lạc rút khỏi lãnh thổ của bạn mất thêm 35% quân."
leader_ivan_the_terrible_ability = "Tuyển mộ Streltsy"
leader_ivan_the_terrible_description = "Khi chiếm một thành phố địch đã hoàn thành, tuyển tối đa 750 quân nếu kho dự bị còn chỗ. Một lần mỗi trận, không vượt giới hạn quân số."
leader_erendira_ability = "Chiến mã đoạt lại"
leader_erendira_description = "Khi quân địch mất quân lúc tấn công lãnh thổ của bạn, tuyển thêm 15% số quân tổn thất đó, không vượt giới hạn quân số."
leader_tarenorerer_ability = "Giữa Hai Loạt Đạn"
leader_tarenorerer_description = "Nếu lực lượng dự bị của người chơi mục tiêu đông hơn đội quân tấn công của bạn, quân của bạn mất ít hơn 25% khi chinh phục lãnh thổ của họ."


