privacy_updated = "Última atualização: Setembro 2026 · Controlador: World of Unreal · Contacto: hello@shadowsofwar.io"
privacy_overview_title = "& Controlador de visão geral"
privacy_overview_body = "Shadows of War é operado por World of Unreal. Esta política abrange sombras de war.io, plataformas parceiras e clientes nativos."
privacy_overview_after = "Não temos nenhum estabelecimento UE/Reino Unido – envie todos os pedidos, incluindo os pedidos do GDPR, diretamente para lá."
privacy_overview_payments = "Os SDKs de plataforma de parceiros podem coletar dados de acordo com suas próprias políticas. Os dados do cartão são processados diretamente pela loja através da qual você paga (Google Play, Apple); nunca vemos números de cartões."
privacy_eligibility_title = "Elegibilidade & crianças"
privacy_eligibility_body = "13+. Os jogadores 13–17 precisam de permissão dos pais ou responsáveis. O jogo não é direcionado para crianças menores de 13 anos; contas menores de 13 anos são suspensas e apagadas."
