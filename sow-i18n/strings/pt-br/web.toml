privacy_title = "Política de privacidade — Shadows of War"
privacy_description = "Leia a política de privacidade voltada para o jogador Shadows of War: controlador, dados coletados, compartilhamento, retenção de 90 dias, seus direitos e exclusão."
privacy_eyebrow = "Legal & Telemetria"
privacy_heading = "Privacidade"
privacy_heading_em = "política."
privacy_updated = "Última atualização: Setembro 2026 · Controlador: World of Unreal · Contacto: hello@shadowsofwar.io"
privacy_overview_title = "& Controlador de visão geral"
privacy_overview_body = "Shadows of War é operado por World of Unreal. Esta política abrange sombras de war.io, plataformas parceiras e clientes nativos."
privacy_overview_after = "Não temos nenhum estabelecimento UE/Reino Unido – envie todos os pedidos, incluindo os pedidos do GDPR, diretamente para lá."
privacy_overview_payments = "Os SDKs de plataforma de parceiros podem coletar dados de acordo com suas próprias políticas. Os dados do cartão são processados diretamente pela loja através da qual você paga (Google Play, Apple, Stripe); nunca vemos números de cartões."
privacy_eligibility_title = "Elegibilidade & crianças"
privacy_eligibility_body = "13+. Os jogadores 13–17 precisam de permissão dos pais ou responsáveis. O jogo não é direcionado para crianças menores de 13 anos; contas menores de 13 anos são suspensas e apagadas."
privacy_eligibility_after = "e apagamos imediatamente."
privacy_data_title = "Dados que recolhemos"
privacy_gameplay_label = "Jogo:"
privacy_gameplay_body = "exibir nome, tag do clã, escolhas líder/civilização, entradas de jogo, histórico, fileiras, itens de propriedade."
privacy_account_label = "Conta:"
privacy_account_body = "identificação aleatória de conta, identidades de plataforma vinculadas, hash único do seu segredo de propriedade (nunca o texto simples)."
privacy_technical_label = "Técnico:"
privacy_technical_body = "construir versão, plataforma/locale, metadados de conexão, tickets de relé, registros de servidor para segurança e anti-abuso."
privacy_analytics_label = "Análise de produtos (apenas para terceiros):"
privacy_analytics_body = "eventos de taxonomia fechada (visitas, etapas de inicialização, tutorial, matchmaking, partida início/fim) vinculados a um ID de sessão aleatória e ID de conta. Sem identificadores de anúncio, sem fornecedor de terceiros."
privacy_purchases_label = "Compras:"
privacy_purchases_body = "ID do produto, referência de transação, status de direito via RevenueCat/the store. Detalhes de pagamento completos ficam com a loja."
privacy_public_label = "Público por desenho ou modelo:"
privacy_public_body = "nomes, manipulações, rankings e registros de correspondência são visíveis para outros jogadores."
privacy_use_title = "Usar bases & legais"
privacy_use_body = "Executando o jogo, segurança e anti-truque, funis e confiabilidade, suporte, conformidade. Bases UE/UK: contrato, interesses legítimos (nunca publicidade comportamental), consentimento onde solicitado, obrigação legal. Nós não vendemos dados pessoais e não executamos nenhum rastreador de anúncios."
privacy_sharing_title = "Partilha"
privacy_hosting_label = "Hospedagem sob nossas instruções:"
privacy_hosting_body = "IONOS, Microsoft Azure, Cloudflare."
privacy_payments_label = "Pagamentos:"
privacy_payments_body = "Google Play / Apple / Stripe via RevenueCat, segundo suas políticas."
privacy_sdk_label = "Parceiro SDKs:"
privacy_sdk_body = "sob a sua própria política quando você joga através deles."
privacy_players_label = "Jogadores & públicos:"
privacy_players_body = "Nomes, pegas, fileiras, registos de correspondência."
privacy_authorities_label = "Autoridades & transferências:"
privacy_authorities_body = "Quando exigido por lei, ou a um sucessor legal com aviso prévio."
privacy_cookies_title = "Cookies e armazenamento local"
privacy_cookies_body = "Apenas armazenamento estritamente necessário: preferência do tema, IDs de sessão, nosso próprio endpoint de eventos de primeira parte. Sem cookies de publicidade, social ou cross-site. As fontes são auto- hospedadas — zero pedidos de origem cruzada."
privacy_retention_title = "Retenção"
privacy_retention_body = "Arquivos de eventos auto-prune passados 90 dias; contadores de análise e subscrições expiram pela chave TTL dentro de 90 dias. Implementações nunca limpam o estado ao vivo. Contas e histórico persistem até que você solicite exclusão ou rescisão sob os Termos."
privacy_rights_title = "Seus direitos e exclusão"
privacy_rights_body = "Acesso, correto, excluir, porta, objeto, restrição. Email"
privacy_rights_after = "com seu ID de conta no jogo (ou nome + data aproximada de criação). Exclusões verificadas apagam a conta, mapeamentos de identidade, metadados mirror e associações analíticas — confirmadas de volta para você. GPC é homenageado como uma venda / compartilhamento opt-out (nós não vendemos ou compartilhamos, então nada alterna). Apelos por resposta; resposta dentro de 45 dias no máximo."
privacy_security_title = "Segurança, transferências, alterações"
privacy_security_body = "TLS em trânsito, loopback-somente internos, endpoints de operador porta-portados, segredos de propriedade hashed; nenhuma garantia absoluta. Infra funciona nos EUA e na UE com a minimização de dados e nenhuma transferência de tecnologia ad. Mudanças de política de materiais têm efeito após aviso proeminente; uso contínuo significa aceitação."
privacy_contact_title = "Contacto"
privacy_contact_before = "Privacidade:"
privacy_help = "Ajuda:"
support_center = "centro de suporte"
privacy_security_contact = "Falhas de segurança: privada para hello@, nunca em público — reconhecido no prazo de 48 horas."
privacy_source_before = "Componentes do lado do servidor são AGPL-3.0-ou-posterior; fonte ligada"
cookies_title = "Aviso sobre os cookies — Shadows of War"
cookies_description = "Como Shadows of War usa apenas armazenamento estritamente necessário: preferência do tema, identificadores de sessão e eventos de produtos de primeira parte. Sem cookies de publicidade."
cookies_og_description = "Apenas armazenamento estritamente necessário. Sem cookies de publicidade, social ou de rastreamento transversal."
cookies_eyebrow = "& Armazenamento Legal"
cookies_heading = "Cookies"
cookies_heading_em = "Atenção."
cookies_updated = "Última atualização: Setembro 2026 · World of Unreal"
cookies_use_title = "O que usamos"
cookies_use_body = "Shadows of War usa somente o armazenamento estritamente necessário do cliente — o tipo que não precisa de banner de consentimento porque o site e o jogo não podem funcionar sem ele:"
cookies_theme_label = "Preferência do tema"
cookies_theme_body = "Lembra-se da sua escolha leve/escuro. Primeira festa, estritamente necessária."
cookies_session_label = "Identificadores de sessão de análise"
cookies_session_body = "IDs aleatórios que agrupam eventos de produtos de primeira parte dentro de uma visita. Eles desaparecem quando a aba fecha."
cookies_events_label = "Eventos de produtos primários:"
cookies_events_body = "eventos de funil anônimos enviados para nossos próprios servidores"
cookies_events_after = "Não é um cookie, não é partilhado com nenhum vendedor."
cookies_game_label = "Configurações do jogo & ativos do mapa em cache"
cookies_game_body = "preferências do cliente e dados do jogo baixados."
cookies_third_party_title = "Terceiros"
cookies_third_party_body = "As fontes são auto- hospedadas em nosso próprio domínio. Nenhum código de terceiros executa o armazenamento ou o rastreamento em nossas páginas: nenhuma rede de publicidade, nenhum widget social, nenhum script de repetição de sessão, nenhum identificador de site. Nossas páginas fazem zero pedidos de origem cruzada."
cookies_dont_title = "O que não fazemos"
cookies_dont_ads = "Sem cookies publicitários e sem publicidade baseada em juros."
cookies_dont_sell = "Não há venda ou partilha de dados pessoais para publicidade."
cookies_dont_tracking = "Não há localização cruzada ou entre aplicações."
cookies_dont_body = "Como não há rastreamento comportamental, o Controle Global de Privacidade e os sinais do Do Not Track não têm nada para desligar — e honramos o GPC como um opt-out de venda/compartilhamento independentemente."
cookies_controls_title = "Os teus controlos"
cookies_controls_clear = "Limpar os dados do site a qualquer momento nas configurações do seu navegador — isto remove a preferência do tema, IDs de sessão e ativos em cache. O jogo continua funcionando; ele simplesmente esquece o seu tema e inicia uma nova sessão."
cookies_controls_block = "Bloquear todo o armazenamento pode forçar re-downloads de ativos do jogo e redefinir preferências cada visita."
cookies_controls_rights = "Para direitos de dados pessoais (acesso, exclusão, portabilidade), consulte a Política de Privacidade — email"
cookies_changes_title = "Alterações"
cookies_changes_body = "Se alguma vez adicionarmos armazenamento não essencial (vendedores analíticos, incorporações, publicidade), este aviso listará cada item com sua finalidade e controles antes de ser enviado — e a Política de Privacidade será atualizada ao lado. Última atualização: setembro de 2026."
terms_title = "Termos de serviço — Shadows of War"
terms_description = "Leia os termos de serviço para Shadows of War: contas, itens virtuais e política sem reembolso, conduta, responsabilidade e resolução de litígios."
terms_eyebrow = "Termos e Condições"
terms_heading = "Termos de"
terms_heading_em = "serviço."
terms_updated = "Última atualização: Setembro 2026 · World of Unreal"
terms_acceptance_title = "Aceitação e elegibilidade"
terms_acceptance_body = "Estes Termos são um acordo vinculativo entre você e World of Unreal que rege o seu uso de Shadows of War em shadowofwar.io, plataformas parceiras e clientes nativos. Ao jogar, instalar ou acessar o Serviço, você concorda com estes Termos. Se você não concordar, não use o Serviço."
terms_acceptance_age = "Você deve ter pelo menos 13 anos. Jogadores de 13 a 17 anos podem brincar apenas com a permissão e supervisão de um pai ou tutor. O Serviço não é direcionado para crianças menores de 13 anos."
terms_changes_title = "O & serviço de jogo muda"
terms_changes_body = "O Multiplayer requer acesso à rede de nossos servidores. Podemos modificar, suspender ou interromper qualquer parte do Serviço — modos, mapas, estações, leaderboards, eventos — a qualquer momento, com ou sem aviso prévio, sem responsabilidade para você."
terms_accounts_title = "Contas"
terms_accounts_body = "O jogo anônimo cria um ID de conta canônica armazenado no seu dispositivo com um nome de exibição. O armazenamento do site de limpeza cria uma nova conta; o renome nunca altera o ID da conta. Seu ID de conta é uma chave de busca de progresso, não uma senha — mantenha seu dispositivo seguro."
terms_accounts_contact = "Você é responsável por todas as atividades sob sua conta."
terms_license_title = "& Restrições de licença"
terms_license_body = "Concedemos uma licença limitada e revogável para um jogo pessoal e não comercial. World of Unreal ou seus licenciantes. Código fonte do jogo está disponível separadamente sob AGPL-3.0-ou-posterior; contas, itens virtuais e dados do servidor são regidos por estes Termos."
terms_license_no_sell = "Sem venda, aluguel, sublicenciamento ou exploração comercial."
terms_license_no_reverse = "Sem engenharia reversa, raspagem, extração a granel ou treinamento de modelo no Serviço."
terms_license_feedback = "O feedback que você compartilha pode ser usado livremente, sem compensação ou atribuição."
terms_virtual_title = "Itens virtuais e sem reembolsos"
terms_virtual_body = "Gems, líderes desbloqueiam e skins são itens virtuais licenciados apenas: sem valor em dinheiro, não transferível, revogável. Líder desbloqueia mudar jogabilidade - eles têm vantagens distintas e não são puramente cosméticos."
terms_sales_final = "Todas as vendas são finais."
terms_virtual_refunds = "Os itens virtuais não são reembolsáveis e não substituíveis na medida máxima permitida pela lei — incluindo para itens usados ou indesejados, alterações de serviços ou medidas de conta tomadas por violações de Termos. Se uma plataforma reverter uma compra, podemos remover os itens correspondentes e tomar medidas de conta."
terms_conduct_title = "Conduta do jogador"
terms_conduct_cheating = "Sem batota, bots, macros, automação, exploração de bugs ou desincronia intencional."
terms_conduct_harassment = "Sem assédio, ameaças, ódio-bait, ou doxxing. Nomes, tags e bate-papo devem seguir a lei."
terms_conduct_servers = "Sem perturbar servidores, sondar infraestrutura ou tocar em contas, credenciais ou tickets de outros jogadores."
terms_conduct_after = "Violações podem levar à remoção de conteúdo, ao cancelamento de correspondência, ou à suspensão ou rescisão."
terms_third_party_title = "Serviços de terceiros e outros jogadores"
terms_third_party_body = "plataformas parceiras e seus SDKs, prestadores de pagamentos, Discord, e Telegram são terceiros que não controlamos; seus próprios termos se aplicam e você os usa por seu próprio risco. Interações com outros jogadores estão somente entre você e eles. World of Unreal de créditos provenientes de terceiros ou de outros intervenientes."
terms_termination_title = "Cessação"
terms_termination_body = "Podemos suspender ou encerrar o seu acesso — contas, itens, entradas na tabela de classificação — a qualquer momento, por qualquer motivo, incluindo violações de Termos suspeitos, sem responsabilidade. Ao terminar sua licença, os itens virtuais são perdidos sem reembolso."
terms_disclaimer_title = "Incumprimento de Estado"
terms_disclaimer_body = "O serviço é fornecido “assim como é” e “como disponível.” Para o mais completo permitido pela lei, divulgámos todas as garantias, incluindo a comercialização, a afinação para um propósito particular, o TÍTULO, e não-infracção. Não justificamos uma operação ininterrupta, livre de erros, ou segura, ou a preservação do progresso, fileiras, ou itens."
terms_liability_title = "Limitação da responsabilidade"
terms_liability_body = "Para a extensão máxima permitida pela lei não somos líbeis para lucros perdidos, dados perdidos, itens perdidos ou progresso, ou quaisquer imagens indiretas ou conseqüentes. Nossa total responsabilidade é coberta com o maior de US $ 50 e o que você pagou para itens virtuais nos seis meses antes do incidente."
terms_indemnification_title = "Indenizações"
terms_indemnification_body = "Você concorda em defender e indemnizar World of Unreal contra reclamações e custos razoáveis decorrentes do seu uso do Serviço, da sua violação destes Termos ou da sua violação da lei."
terms_arbitration_title = "Litígios e arbitragem"
terms_arbitration_before = "As disputas passam por arbitragem individual vinculativa (JAMS, Delaware) após uma tentativa de resolução informal de 45 dias — e não de tribunal. Você renuncia aos direitos de julgamento e ação de classe do júri. Pequenos pedidos e injunções de IP são excetuados. Você pode optar por não arbitragem no prazo de 30 dias após a primeira aceitação destes Termos por e-mail"
terms_arbitration_after = "com o seu ID de conta e uma declaração clara de opt-out."
terms_general_title = "Geral"
terms_general_before = "A lei de Delaware governa estes Termos; reivindicações não arbitradas vão exclusivamente para os tribunais de Delaware. As atualizações materiais entram em vigor após aviso prévio; uso contínuo significa aceitação. Contato: World of Unreal —"
terms_privacy_title = "Privacidade"
terms_privacy_before = "O tratamento de dados, seus direitos e exclusão são descritos em nosso"
terms_privacy_and = "e"
terms_privacy_after = "incorporados aqui por referência."
