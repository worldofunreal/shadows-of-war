privacy_use_title = "Kullanım ve hukuki dayanaklar"
privacy_use_body = "Oyunu işletmek, oyuncuları ve sistemleri korumak, destek sağlamak ve yasal yükümlülükleri yerine getirmek için gereken verileri işleriz. AB ve Birleşik Krallık kullanıcıları için dayanaklarımız oyun hizmetine ilişkin sözleşme, güvenlik ve hileyle mücadeledeki meşru menfaatlerimiz, gerektiğinde yasal yükümlülükler ve isteğe bağlı birinci taraf ürün analitiği için verdiğin onaydır. Analitik sen izin verene kadar kapalıdır; seçimini Ayarlar'dan değiştirebilirsin. Kişisel veri satmıyor ve davranışsal reklam kullanmıyoruz."
