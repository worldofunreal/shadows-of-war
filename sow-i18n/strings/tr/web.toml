privacy_eligibility_body = "13+. 13–17 yaşındaki oyuncuların ebeveyn veya vasi izni gerekir. Oyun 13 yaşından küçük çocuklara yönelik değildir; bu hesaplar askıya alınır ve silinir. Ebeveynler şu adrese yazabilir:"
