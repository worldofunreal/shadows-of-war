privacy_overview_title = "Genel bakış ve veri sorumlusu"
privacy_overview_body = "Shadows of War, World of Unreal tarafından işletilir. Bu politika shadowsofwar.io, ortak platformlar ve yerel istemciler için geçerlidir. Gizlilik iletişimi:"
privacy_overview_after = "AB/İngiltere'de yerleşik değiliz; GDPR talepleri dahil tüm talepleri doğrudan bu adrese gönderin."
