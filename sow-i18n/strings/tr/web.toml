leader_caesar_mechanics = "Kare fetihleri ve tartışmalı sınır savaşlarında birlik kayıplarını azaltır. Caesar, tarafsız savunuculara ve düşman sınırlarına karşı birliklerini daha verimli kullanır."
leader_cleopatra_mechanics = "Endüstriyel kümelerden altın üretimini hızlandırır. Fazla altınla şehir, savunma sığınağı ve yükseltmeler hızla yerleştirilebilir."
leader_ragnar_mechanics = "Kıyı genişlemesini ödüllendirir. Su sınırlarına yerleştirilen limanlar yüksek altın getirir ve su karelerine erişim sağlar."
leader_suntzu_mechanics = "Fabrikalardaki birlik alım temposunu artırır. Büyük savaşlardan sonra ordunun toparlanmasını hızlandırır."
leader_alexander_mechanics = "Simülasyon turu başına fetih hızını artırır. Tarafsız topraklarda hızlı genişlemeyi ve erken sınır güvenliğini sağlar."
leader_genghiskhan_mechanics = "Savaş zaferlerini hazine gelirine dönüştürür. Gelişmiş düşman ordularını ve yapılarını yenmek ekonomine altın kazandırır."
leader_richard_mechanics = "Yerleştirilen her şehir bölgesi başına birlik tavanını yükseltir. Sınır saldırılarından önce büyük ordular biriktirmeyi sağlar."
leader_vercingetorix_mechanics = "Şehirlerden gelen temel birlik yenilenmesini artırır. Pasif insan gücü, bölgenin kentleşmesiyle büyür."
leader_boudica_mechanics = "Şehir bölgelerinin altın getirisini artırır. Ekonomiyi fabrikalar yerine bölgesel nüfus merkezlerine dayandırır."
leader_ladysixsky_mechanics = "Endüstriyel fabrikalardan gelen altın verimliliğini en üst düzeye çıkarır. Genişleme ve savunma yapıları için yüksek gelir üretir."
leader_leonidas_mechanics = "Şehir bölgelerine kurulan cephanelik modülleriyle ordunun azami kapasitesini artırır. Sığınaklar savunma yapısıdır ve Leonidas'ın kapasite bonusunu vermez."
leader_napoleon_mechanics = "Motordaki en yüksek genişleme çarpanıdır. Tarafsız bölgeleri hızla ele geçirir ve sınır ilerlemesini hızlandırır."
