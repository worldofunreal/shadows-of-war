how_step_1_title = "Eşleştirmeye katıl ve maç modunu seç"
how_step_1_body = "Aktif eşleştirme lobisine katıl. Sıra; Herkes herkese karşı (FFA), Takım Savaşları ve İnsanlara karşı Dünya Ulusları modları arasında Avrupa, Asya, Afrika, East Anglia ve Amerika haritalarında döner."
how_step_2_title = "Komutanını ve uygarlık avantajını seç"
how_step_2_body = "On iki tarihi komutandan birini seç. Her lider kalıcı bir mekanik çarpan sağlar: Julius Caesar'ın 1.10x savaş gücü, Cleopatra'nın +%50 fabrika altını, Sun Tzu'nun %20 birlik üretim hızı veya Ragnar'ın +%50 liman altını gibi."
compare_leader_traits = "Lider özelliklerini karşılaştır"
how_step_3_title = "Toprak kazan ve özel bölgeler inşa et"
how_step_3_body = "Komşu kareleri ele geçirmek için genişle. Ele geçirilen her kare temel altın ve birlik gelirini artırır. Bölgene özel yapılar kur:"
city_label = "Şehirler:"
city_body = "Azami birlik kapasitesini artırır, pasif birlik ve altın geliri üretir."
factory_label = "Fabrikalar:"
factory_body = "Altın üretir ve birlik alım hızını artırır."
port_label = "Limanlar:"
port_body = "Kıyılara kurulur; altın, birlik geliri ve su erişimi sağlar."
bunker_label = "Sığınaklar:"
bunker_body = "Savunma sınırlarını güçlendirir, kapsama alanını artırır ve alınan birlik kayıplarını azaltır. Şehir cephanelik modülleri azami birlik kapasitesini artırır."
how_step_4_title = "Ekonomiyi, araziyi ve ordu ivmesini yönet"
how_step_4_body = "Fetih birlik tüketir. Fabrika, şehir ve limanlardan gelen altını yeni yapılara yatır. Sınırlarını sağlamlaştırmak ve orduyu değerli hedeflere yöneltmek için arazi çarpanlarını kullan."
how_step_5_title = "Diplomasi, ihanet ve harita kontrolü zaferi"
how_step_5_body_before = "Cepheleri koordine etmek için komşu oyuncularla saldırmazlık ittifakları kur. Bir oyuncu"
how_step_5_threshold = "harita kontrolü zafer eşiğine"
how_step_5_body_after = "(gerekli toplam toprak çoğunluğuna) ulaşarak veya tüm rakip komutanları yok ederek kazanır. İhanet ittifakı hemen bozar ve ortak sınırları aktif savaş cephelerine dönüştürür."
