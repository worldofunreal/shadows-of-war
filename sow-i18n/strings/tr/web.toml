privacy_authorities_body = "kanunen gerektiğinde veya bildirimde bulunulan yasal halefe."
privacy_cookies_title = "Çerezler ve yerel depolama"
privacy_cookies_body = "Yalnızca gerekli depolama: oturum kimlikleri. Ürün etkinlikleri kendi uç noktamıza gönderilir. Reklam, sosyal medya veya siteler arası çerez kullanmayız. Yazı tipleri kendi sunucumuzda barındırılır ve başka kaynaklara istek gönderilmez. Ayrıntılar ve kontroller"
privacy_retention_title = "Saklama süresi"
privacy_retention_body = "Olay dosyaları 90 günden sonra otomatik temizlenir; analiz sayaçları ve üyelikleri anahtar süresiyle 90 gün içinde sona erer. Dağıtımlar canlı durumu silmez. Hesaplar ve geçmiş, silme talep edene veya Koşullar kapsamında sonlandırılana kadar saklanır."
privacy_rights_title = "Haklarınız ve silme"
privacy_rights_body = "Erişim, düzeltme, silme, taşıma, itiraz ve kısıtlama. E-posta:"
privacy_rights_after = "Oyun içi hesap kimliğinizi (veya adınızı ve yaklaşık oluşturma tarihini) ekleyin. Doğrulanan silmeler hesabı, kimlik eşleşmelerini, meta veri kopyasını ve analiz üyeliklerini siler; size onay gönderilir. GPC, satış/paylaşım tercihi olarak dikkate alınır (satış veya paylaşım yapmadığımız için değiştirilecek bir şey yoktur). İtirazlara yanıt verin; en geç 45 gün içinde cevaplarız."
privacy_security_title = "Güvenlik, aktarımlar ve değişiklikler"
privacy_security_body = "Aktarımda TLS, yalnızca yerel erişimli iç bileşenler, korumalı işletim uç noktaları ve hash'lenmiş sahiplik sırları kullanırız; mutlak güvenlik garantisi yoktur. Altyapı, veri minimizasyonuyla ve reklam teknolojilerine aktarım olmadan ABD ve AB'de çalışır. Bu Gizlilik Bildirimi'ndeki önemli değişiklikleri yürürlüğe girmeden önce belirgin biçimde duyururuz; yasa gerektiriyorsa ayrıca onay isteriz. Hizmeti kullanmaya devam etmek tek başına onay sayılmaz."
privacy_contact_title = "İletişim"
privacy_contact_before = "Gizlilik:"
privacy_help = "Yardım:"
support_center = "destek merkezi"
privacy_security_contact = "Güvenlik açıkları: herkese açık paylaşım yapmadan hello@ adresine özel olarak bildirin — 48 saat içinde kabul edilir."
privacy_source_before = "Her oyun sürümünün eksiksiz kaynak kodu, OpenFront'un ek koşullarıyla birlikte AGPL-3.0-only kapsamında lisanslanır. Oyun menüsünde ilgili sürümün kaynak kodu bağlantısı bulunur."

cookies_title = "Çerez Bildirimi — Shadows of War"
cookies_description = "Shadows of War'ın gerekli depolama kullanımı: oturum kimlikleri ve birinci taraf ürün etkinlikleri. Reklam çerezi yoktur."
cookies_og_description = "Yalnızca zorunlu depolama. Reklam, sosyal medya veya siteler arası izleme çerezi yoktur."
cookies_eyebrow = "Hukuk ve Depolama"
cookies_heading = "Çerez"
cookies_heading_em = "bildirimi."
cookies_updated = "Son güncelleme: Eylül 2026 · World of Unreal"
cookies_use_title = "Kullandıklarımız"
cookies_use_body = "Shadows of War yalnızca zorunlu istemci depolamasını kullanır — site ve oyun onsuz çalışamayacağı için izin banner'ı gerektirmeyen türden:"
cookies_session_label = "Analiz oturumu kimlikleri"
cookies_session_body = "bir ziyaret içindeki birinci taraf ürün olaylarını gruplayan rastgele kimlikler. Sekme kapanınca silinirler."
cookies_events_label = "Birinci taraf ürün olayları:"
cookies_events_body = "kendi sunucularımıza gönderilen anonim akış olayları"
cookies_events_after = "Çerez değildir ve hiçbir sağlayıcıyla paylaşılmaz."
cookies_game_label = "Oyun ayarları ve önbelleğe alınmış harita varlıkları"
cookies_game_body = "istemci tercihleri ve indirilen oyun verileri."
cookies_third_party_title = "Üçüncü taraflar"
cookies_third_party_body = "Yazı tipleri kendi alan adımızda barındırılır. Sayfalarımızda depolama veya izleme yapan üçüncü taraf kodu yoktur: reklam ağı, sosyal widget, oturum kaydı komut dosyası veya siteler arası kimlik yoktur. Sayfalarımız siteler arası istek göndermez."
cookies_dont_title = "Yapmadıklarımız"
cookies_dont_ads = "Reklam çerezi ve ilgiye dayalı reklam yoktur."
cookies_dont_sell = "Kişisel veriler reklam amacıyla satılmaz veya paylaşılmaz."
cookies_dont_tracking = "Siteler veya uygulamalar arası izleme yoktur."
cookies_dont_body = "Davranışsal izleme olmadığı için Global Privacy Control ve Do Not Track sinyallerinin kapatacağı bir şey yoktur — yine de GPC'yi satış/paylaşım itirazı olarak kabul ederiz."
cookies_controls_title = "Kontrolleriniz"
cookies_controls_clear = "Oturum kimliklerini ve önbellekteki kaynakları kaldırmak için tarayıcı ayarlarından site verilerini temizleyin. Oyun çalışmaya devam eder ve yeni bir oturum başlatır."
cookies_controls_block = "Tüm depolamayı engellemek oyun varlıklarının yeniden indirilmesine ve tercihlerin her ziyarette sıfırlanmasına neden olabilir."
cookies_controls_rights = "Kişisel veri hakları (erişim, silme, taşınabilirlik) için Gizlilik Politikası'na bakın — e-posta:"
cookies_changes_title = "Değişiklikler"
cookies_changes_body = "Gerekli olmayan depolama (analiz sağlayıcıları, gömülü içerik veya reklam) eklersek bu bildirim, yayınlanmadan önce her öğeyi amacı ve kontrolleriyle listeler; Gizlilik Politikası da birlikte güncellenir. Son güncelleme: Eylül 2026."

terms_title = "Hizmet Koşulları — Shadows of War"
terms_description = "Shadows of War hizmet koşullarını okuyun: hesaplar, sanal öğeler ve iade yapılmaması politikası, davranış, sorumluluk ve anlaşmazlıkların çözümü."
terms_eyebrow = "Koşullar ve Hükümler"
terms_heading = "Hizmet"
terms_heading_em = "koşulları."
terms_updated = "Son güncelleme: Eylül 2026 · World of Unreal"
terms_acceptance_title = "Kabul ve uygunluk"
terms_acceptance_body = "Bu Koşullar, shadowsofwar.io, ortak platformlar ve yerel istemcilerde Shadows of War kullanımınızı düzenleyen World of Unreal ile aranızdaki bağlayıcı sözleşmedir. Hizmeti oynayarak, kurarak veya kullanarak bu Koşulları kabul edersiniz. Kabul etmiyorsanız Hizmeti kullanmayın."
terms_acceptance_age = "En az 13 yaşında olmalısınız. 13–17 yaşındaki oyuncular yalnızca ebeveyn veya vasi izni ve gözetimiyle oynayabilir. Hizmet 13 yaşından küçük çocuklara yönelik değildir."
terms_changes_title = "Oyun ve Hizmet değişiklikleri"
terms_changes_body = "Çok oyunculu oyun sunucularımıza ağ erişimi gerektirir. Hizmetin herhangi bir bölümünü — modlar, haritalar, sezonlar, liderlik tabloları ve etkinlikler — bildirimde bulunarak veya bulunmadan, sorumluluk üstlenmeden değiştirebilir, askıya alabilir veya sonlandırabiliriz."
terms_accounts_title = "Hesaplar"
terms_accounts_body = "Anonim oyun, görünen adla birlikte cihazınızda saklanan kanonik bir hesap kimliği oluşturur. Site depolamasını temizlemek yeni hesap oluşturur; ad değişiklikleri hesap kimliğini hiçbir zaman değiştirmez. Hesap kimliğiniz parola değil, ilerleme bulma anahtarıdır — cihazınızı koruyun."
terms_accounts_contact = "Hesabınızdaki tüm etkinliklerden sorumlusunuz. Şüpheli yetkisiz erişimi şu adrese bildirin:"
terms_license_title = "Lisans ve kısıtlamalar"
terms_license_body = "Bu Koşullar resmi olarak barındırılan Hizmete, hesaplara, sanal öğelere ve sunucu verilerine erişimi düzenler. Oyunun eksiksiz kaynak kodu, OpenFront'un ek koşulları da dahil olmak üzere ayrıca AGPL-3.0-only kapsamında lisanslanır. Bu Koşullar, kod lisansının veya ayrı harita lisanslarının verdiği hakları sınırlamaz."
terms_maps_before = "OpenFront'tan türetilen harita kaynakları ve üretilen harita dosyaları şu lisansla sunulur:"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "Harita bildirimi kaynak, atıf ve değişiklikleri açıklar:"
terms_maps_notice = "harita bildirimi"
terms_license_no_sell = "Resmi olarak barındırılan Hizmeti, hesapları veya sanal öğeleri satmayın, kiralamayın, alt lisanslamayın ya da ticari amaçla kullanmayın."
terms_license_no_reverse = "Resmi olarak barındırılan Hizmet üzerinde tersine mühendislik, veri kazıma, toplu veri çıkarma veya model eğitimi yapmayın. Bu kısıtlamalar kod ve harita lisanslarının verdiği hakları azaltmaz."
terms_license_feedback = "Paylaştığınız geri bildirim, ödeme veya atıf olmadan serbestçe kullanılabilir."
terms_virtual_title = "Sanal öğeler ve iade yoktur"
terms_virtual_body = "Mücevherler, lider açılımları ve görünümler yalnızca lisanslı sanal öğelerdir: nakit değeri yoktur, devredilemez ve geri alınabilir. Lider açılımları oynanışı değiştirir — farklı avantajlar sunar ve yalnızca kozmetik değildir."
terms_sales_final = "TÜM SATIŞLAR KESİNDİR."
terms_virtual_refunds = "Sanal öğeler, kullanılan veya istenmeyen öğeler, Hizmet değişiklikleri veya Koşul ihlali nedeniyle alınan hesap işlemleri dahil olmak üzere yasaların izin verdiği azami ölçüde iade edilmez veya değiştirilmez. Bir platform satın almayı geri alırsa ilgili öğeleri kaldırabilir ve hesaba işlem uygulayabiliriz."
terms_conduct_title = "Oyuncu davranışı"
terms_conduct_cheating = "Hile, bot, makro, otomasyon, hata istismarı veya kasıtlı senkronizasyon bozma yapılamaz."
terms_conduct_harassment = "Taciz, tehdit, nefret söylemi veya doxxing yapılamaz. Adlar, etiketler ve sohbet yasalara uymalıdır."
terms_conduct_servers = "Sunucuları aksatmayın, altyapıyı yoklamayın ve diğer oyuncuların hesaplarına, kimlik bilgilerine veya biletlerine dokunmayın."
terms_conduct_after = "İhlaller içerik kaldırma, maçın hükmen kaybedilmesi, askıya alma veya sonlandırma ile sonuçlanabilir."
terms_third_party_title = "Üçüncü taraf hizmetleri ve diğer oyuncular"
terms_third_party_body = "Ortak platformlar ve SDK'ları, ödeme sağlayıcıları, Discord ve Telegram kontrolümüz dışındaki üçüncü taraflardır; kendi koşulları geçerlidir ve bunları kendi riskinizle kullanırsınız. Diğer oyuncularla etkileşimler yalnızca sizinle onlar arasındadır. Yasaların izin verdiği azami ölçüde World of Unreal'ı üçüncü taraflardan veya diğer oyunculardan kaynaklanan taleplerden ibra edersiniz."
terms_termination_title = "Sonlandırma"
terms_termination_body = "Koşulların ihlal edildiğinden şüphelenilmesi dahil herhangi bir nedenle erişiminizi — hesapları, öğeleri ve sıralama kayıtlarını — sorumluluk üstlenmeden askıya alabilir veya sonlandırabiliriz. Sonlandırma halinde lisansınız sona erer ve sanal öğeler iade yapılmadan kaybedilir."
terms_disclaimer_title = "Sorumluluk reddi"
terms_disclaimer_body = "HİZMET “OLDUĞU GİBİ” VE “MEVCUT OLDUĞU ŞEKLİYLE” SUNULUR. YASALARIN İZİN VERDİĞİ AZAMİ ÖLÇÜDE TİCARİ ELVERİŞLİLİK, BELİRLİ BİR AMACA UYGUNLUK, MÜLKİYET VE İHLAL ETMEME DAHİL TÜM GARANTİLERİ REDDEDERİZ. Kesintisiz, hatasız veya güvenli çalışmayı ya da ilerlemenin, rütbelerin ve öğelerin korunmasını garanti etmeyiz."
terms_liability_title = "Sorumluluğun sınırlandırılması"
terms_liability_body = "YASALARIN İZİN VERDİĞİ AZAMİ ÖLÇÜDE KAYBEDİLEN KÂRLAR, VERİLER, ÖĞELER VEYA İLERLEME YA DA DOLAYLI VE SONUÇSAL ZARARLARDAN SORUMLU DEĞİLİZ. TOPLAM SORUMLULUĞUMUZ, OLAYDAN ÖNCEKİ ALTI AYDA SANAL ÖĞELER İÇİN ÖDEDİĞİNİZ TUTAR İLE 50 ABD DOLARI ARASINDAKİ BÜYÜK OLANLA SINIRLIDIR."
terms_indemnification_title = "Tazmin"
terms_indemnification_body = "Hizmeti kullanımınızdan, bu Koşulları veya yasaları ihlalinizden doğan taleplere ve makul masraflara karşı World of Unreal'ı savunmayı ve tazmin etmeyi kabul edersiniz."
terms_arbitration_title = "Anlaşmazlıklar ve tahkim"
terms_arbitration_before = "Anlaşmazlıklar, 45 günlük gayriresmî çözüm girişiminden sonra mahkeme yerine bağlayıcı bireysel tahkime (JAMS, Delaware) gider. Jüri yargılaması ve toplu dava haklarından feragat edersiniz. Küçük talepler ve fikrî mülkiyet tedbirleri istisnadır. Bu Koşulları ilk kabulünüzden itibaren 30 gün içinde şu adrese e-posta göndererek tahkimden çıkabilirsiniz:"
terms_arbitration_after = "Hesap kimliğinizi ve açık bir çıkış beyanını ekleyin."
terms_general_title = "Genel hükümler"
terms_general_before = "Bu Koşullar Delaware hukukuna tabidir; tahkim dışındaki talepler yalnızca Delaware mahkemelerinde görülür. Önemli değişiklikleri yürürlüğe girmeden önce belirgin biçimde duyururuz. Uygulanabilir hukuk yeniden kabul gerektiriyorsa bunu ayrıca isteriz. İletişim: World of Unreal —"
terms_privacy_title = "Gizlilik"
terms_privacy_before = "Veri işleme, haklarınız ve silme işlemleri şu belgelerde açıklanır:"
terms_privacy_and = "ve"
terms_privacy_after = "; bunlar atıf yoluyla bu Koşullara dahildir."
analytics_title = "İsteğe bağlı analitik"
analytics_body = "Shadows of War'ı geliştirmek için site ve oyun etkinliklerini kullanıyoruz. İzin verene kadar kapalı kalır."
analytics_policy = "Çerez ayrıntıları"
analytics_accept = "İzin ver"
analytics_reject = "Reddet"
analytics_manage = "Çerez ayarları"
privacy_analytics_body_v2 = "Web sitemizdeki ve tarayıcı oyunundaki isteğe bağlı birinci taraf analitiği yalnızca izin verdiğinde çalışır. Oyuna başlamak tek başına analitiği etkinleştirmez. Ziyaret, yükleme, menü, öğretici, lobi, maç başlangıcı ve maçtan çıkış olaylarından oluşan sınırlı bir kümeyi; sürümü, dili ve genel ekran sınıfını kaydeder, tam cihaz parmak izini kaydetmez. Bir hesap kimliği varsa sunucumuz kaydetmeden önce onu bu kanala özel anahtarlı bir takma kimlikle değiştirir. İsim, mesaj, parola, reklam kimliği veya harita tıklaması kaydedilmez."
privacy_cookies_body_v2 = "Analitik seçimini yerel depolamada saklarız. Geçici analitik oturum kimliği ve küçük yeniden deneme kuyruğu yalnızca izin verdikten sonra oturum depolamasında oluşturulur. Reddetmek oyunu etkilemez. Oyun ayarları, hesap sürekliliği ve önbelleğe alınmış kaynaklar bu özellikler için gerekli ayrı depolamayı kullanır. Ayrıntılar ve kontroller için"
privacy_retention_body_v2 = "Olay dosyaları, analitik sayaçları ve üyelik kayıtları 90 gün içinde silinir. Doğrulanmış hesap silme işlemi bağlantılı olayları ve üyelikleri kaldırır; kimlik içermeyen günlük toplamlar aynı 90 günlük sürenin sonuna kadar tutulur. Hesap ve maç geçmişi, silme talebine veya Koşullara göre hesabın kapatılmasına kadar saklanır."
privacy_updated_v2 = "Son güncelleme: 6 Ekim 2026 · Veri sorumlusu: World of Unreal · İletişim: hello@shadowsofwar.io"
cookies_analytics_title = "Web sitemizde ve tarayıcı oyunumuzda isteğe bağlı analitik"
cookies_analytics_events = "Ziyaretleri, yükleme aşamalarını, menü eylemlerini, öğretici ilerlemesini, lobiye katılmayı, maç başlangıçlarını ve açıkça maçtan çıkmayı, ayrıca genel ekran sınıfını sayar. İsim, sohbet, parola, lobi kimliği, satın alma, harita tıklaması veya tam user-agent kaydedilmez."
cookies_analytics_server = "İzin verilen olaylar doğrudan /api/event adresindeki kendi uç noktamıza gider ve oyun relay'inden geçmez. Hesap kimliği gönderilirse sunucumuz kaydetmeden önce onu yalnızca bu siteye özel bir takma kimlikle değiştirir."
cookies_storage_title = "Tarayıcı depolaması ve saklama süresi"
cookies_storage_body = "İzin veya ret seçimini yerel olarak saklarız. Geçici oturum kimliği ve küçük yeniden deneme kuyruğu yalnızca izin verdikten sonra oturum depolamasına yazılır. Analitik; sürüm, dil ve genel ekran sınıfını içerir, tam user-agent'ı içermez. Olay dosyaları ve üyelik kayıtları 90 gün içinde sona erer; doğrulanmış hesap silme bağlantılı olayları ve üyelikleri kaldırır. Oyun ayarları, hesap sürekliliği, çökme kurtarma ve önbelleğe alınmış kaynaklar gerekli ayrı depolamayı kullanır."
cookies_platforms_title = "Diğer oyun platformları"
cookies_platforms_body = "Poki, CrazyGames ve Jest kullanımı kendi SDK'larıyla ve platform koşulları uyarınca ölçebilir. Bu platformlardaki oyuncu olaylarını sunucumuza kopyalamayız. Android'e ait birinci taraf analitik, mağaza açıklaması güncellenene kadar kapalıdır."
cookies_controls_v2 = "İsteğe bağlı analitiğe izin vermek veya reddetmek aynı derecede kolaydır. Oyuna başlamak izin vermek anlamına gelmez. Seçimini oyun Ayarları'ndan veya buradan değiştir; reddetmek oyunu etkilemez. Site verilerini silmek seçimini de siler ve analitik yeniden izin verene kadar kapalı kalır. Analitiği reklam amacıyla satmaz veya paylaşmayız."
cookies_description_v2 = "İsteğe bağlı ürün analitiği, izin verene kadar kapalıdır. Oyuna başlamak analitiği etkinleştirmez. Shadows of War'ın hangi verileri sakladığını ve seçimini nasıl değiştireceğini öğren."
cookies_og_description_v2 = "İsteğe bağlı analitik, izin verene kadar kapalıdır. Seçimini istediğin zaman değiştirebilirsin."
cookies_updated_v2 = "Son güncelleme: 6 Ekim 2026 · World of Unreal"
