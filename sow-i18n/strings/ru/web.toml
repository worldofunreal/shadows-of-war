[heroes]
leader_muhumuza_name = "Мухумуза"
leader_muhumuza_historical = "Мухумуза, также известная по источникам как Мухумуса, возглавила сопротивление на возвышенностях Ндорвы и Кигези по обе стороны современной границы Руанды и Уганды. Она была медиумом Ньябинги и опиралась на духовную традицию местных общин. Она организовала сторонников против двора короля Мусинги и расширения европейской колониальной власти."
leader_muhumuza_civilization = "Движение Ньябинги"

leader_khosrow_i_name = "Хосров I"
leader_khosrow_i_historical = "Хосров I, известный как Ануширван, правил Сасанидской державой с 531 по 579 год. Он разделил войско на четыре региональных командования. Сохранившиеся печати называют военачальников, отвечавших за восток, юг, запад и север. Хосров также продолжил межевание земель, начатое при его отце Каваде I, и установил на его основе фиксированные ставки земельного налога."
leader_khosrow_i_civilization = "Сасанидская держава"

leader_naram_sin_name = "Нарам-Суэн"
leader_naram_sin_historical = "Нарам-Суэн, внук Саргона, правил Аккадской державой в третьем тысячелетии до н. э. Его победная стела посвящена походу против луллубеев в горах Загроса. На рельефе царь и его воины поднимаются по склону. Нарам-Суэн выше остальных фигур и носит рогатый шлем, связанный с божественным статусом."
leader_naram_sin_civilization = "Аккадская держава"

leader_jalal_al_din_mangburni_name = "Джалал ад-Дин Мангуберди"
leader_jalal_al_din_mangburni_historical = "Джалал ад-Дин Мангуберди сменил своего отца Мухаммеда II, когда монголы разрушали государство Хорезмшахов. Он собрал войска в Газни и в 1221 году разбил монгольскую армию при Парване. Чингисхан преследовал его до Инда. Джалал ад-Дин проиграл битву, но переправился через реку верхом. Часть его войска также достигла другого берега."
leader_jalal_al_din_mangburni_civilization = "Государство Хорезмшахов"

leader_modu_chanyu_name = "Модэ-шаньюй"
leader_modu_chanyu_historical = "Модэ, известный также как Маодунь, принял титул шаньюя около 209 года до н. э. При нём хунну стали крупной силой в восточной степи. Китайский историк Сыма Цянь рассказывает, что соседи дунху предъявляли новому правителю одно требование за другим. Модэ уступил дважды, но отказался отдавать незаселённую полосу между пограничными постами и перешёл в наступление."
leader_modu_chanyu_civilization = "Хунну"

leader_hiawatha_haudenosaunee_name = "Гайавата"
leader_hiawatha_haudenosaunee_historical = "Устное предание хауденосауни помнит Гайавату, также известного как Айонвата, как помощника Миротворца в объединении народов мохок, онайда, онондага, кайюга и сенека. В рассказе онондага Гайавата был в трауре, и Миротворец утешил его, держа нити из бусин-раковин, называемых вампумом. Затем Гайавата помог донести весть о мире до народов. Точная дата объединения неизвестна."
leader_hiawatha_haudenosaunee_civilization = "Конфедерация хауденосауни"

leader_kaahumanu_hawaii_name = "Каахуману"
leader_kaahumanu_hawaii_historical = "После смерти Камеамеа I в 1819 году Каахуману объявила, что разделит власть с его преемником Лихолихо, Камеамеа II. Она первой заняла должность кухина нуи. В первые годы эта должность давала власть, сопоставимую с королевской, в вопросах земли, соглашений и правосудия. Каахуману продолжала править в качестве регента при Кауикеаоули, Камеамеа III, вплоть до своей смерти в 1832 году."
leader_kaahumanu_hawaii_civilization = "Королевство Гавайи"

leader_sargon_of_akkad_name = "Саргон Аккадский"
leader_sargon_of_akkad_historical = "Саргон основал династию Аккада в Месопотамии в конце третьего тысячелетия до н. э. Царские надписи повествуют о поражении Лугальзагеси из Урука и сносе стен таких городов, как Урук и Ур. Эти тексты прославляли победы, и некоторые известны по спискам, сделанным писцами намного позже. Надписи также упоминают выходцев из Аккада, получивших должности наместников в завоёванных землях. Хозяйственные документы показывают, какие местные порядки сохранились при новой власти."
leader_sargon_of_akkad_civilization = "Аккадская держава"

leader_mithridates_vi_name = "Митридат VI"
leader_mithridates_vi_historical = "Митридат VI Евпатор правил Понтом на южном берегу Чёрного моря. Он расширил влияние царства вокруг моря и противостоял Риму в Анатолии. Во время третьей войны с Римом полководец Лукулл вытеснил его из Понта. Митридат укрылся у армянского царя Тиграна II, женатого на его дочери. Союз позволил ему собрать силы и получить войска для возвращения."
leader_mithridates_vi_civilization = "Понтийское царство"

leader_gudit_yodit_name = "Гудит"
leader_gudit_yodit_historical = "Эфиопское предание помнит Гудит, или Йодит, как царицу, восставшую против Аксума. В «Истории александрийских патриархов» пересказывается обращение неназванного эфиопского правителя к Георгию Нубийскому в X веке. Согласно этому сообщению, царица Бану аль-Хамвийя брала пленников, сжигала города и заставляла правителя бежать с места на место. Само письмо утрачено. Его содержание известно из церковной хроники, связывающей бедствие с просьбой назначить нового митрополита."
leader_gudit_yodit_civilization = "Эфиопское нагорье"

leader_khutulun_qaidu_name = "Хутулун"
leader_khutulun_qaidu_historical = "Хутулун, также известная как Кутулун, была монгольской принцессой и военачальницей в Центральной Азии. Её отец Хайду возглавлял владение дома Угэдэя и противостоял власти Хубилая и его преемников. Марко Поло называет её Айджарук и рассказывает, как она выезжала вперёд во время похода, чтобы захватить противника в плен. Он также описывает поединки, на которые женихи выставляли лошадей. Победы и количество лошадей в этом рассказе трудно подтвердить."
leader_khutulun_qaidu_civilization = "Улус Хайду"

leader_sor_juana_ines_de_la_cruz_name = "Сор Хуана Инес де ла Крус"
leader_sor_juana_ines_de_la_cruz_historical = "Сор Хуана Инес де ла Крус была писательницей и монахиней ордена святого Иеронима в Новой Испании XVII века. Источники называют две возможные даты её рождения, 1648 и 1651 годы. В монастыре Сан-Херонимо в Мехико она писала стихи и пьесы, в том числе «Божественного Нарцисса». В 1690 году она написала разбор проповеди португальского иезуита Антониу Виейры. Епископ Пуэблы Мануэль Фернандес де Санта-Крус напечатал текст под названием «Афинагорическое письмо» и обратился к автору под именем сестры Филотеи де ла Крус."
leader_sor_juana_ines_de_la_cruz_civilization = "Новая Испания"

leader_sibylla_name = "Сибилла Иерусалимская"
leader_sibylla_historical = "Сибилла была дочерью Амальрика Иерусалимского и Агнессы де Куртене. До вступления на престол она владела графством Яффы и Аскалона. В грамоте от 1177 года записано, что она пожаловала графу Родриго и братьям его ордена башни, сад и доходы в Аскалоне. От первого мужа, Вильгельма Монферратского, она родила будущего короля Балдуина V. После смерти сына в 1186 году Сибилла предъявила наследственное право на иерусалимскую корону и сделала второго мужа, Ги де Лузиньяна, королём рядом с собой."
leader_sibylla_civilization = "Иерусалимское королевство"

leader_cynethryth_mercia_name = "Кинетрит"
leader_cynethryth_mercia_historical = "Кинетрит была королевой Мерсии в конце VIII века, а позднее стала настоятельницей Кукема. Она засвидетельствовала ряд грамот времён Оффы и была матерью его преемника Экгфрита. На серебряных пенни её имя сопровождает титул королевы, что исключительно для англосаксонской Англии. На части сохранившихся монет стоит имя Эобы, мастера, которого связывают с Кентербери. Эти монеты подтверждают публичное употребление её титула, хотя обстоятельства выпуска остаются неясными."
leader_cynethryth_mercia_civilization = "Королевство Мерсия"

leader_suppiluliuma_name = "Суппилулиума I"
leader_suppiluliuma_historical = "Суппилулиума I правил Хатти в XIV веке до н. э. Его походы распространили хеттскую власть на север Сирии, где он поставил своего сына Пияссили царём Каркемиша. Соглашение с Шаттивазой из Митанни связало поддержку претендента на престол с новым политическим порядком."
leader_suppiluliuma_civilization = "Хеттское царство"

leader_baibars_name = "Бейбарс"
leader_baibars_historical = "Аз-Захир Бейбарс правил Мамлюкским султанатом с 1260 по 1277 год. На золотом динаре из Каира, который хранится в Лувре, указаны его имя и титулы. Его походы расширили власть мамлюков в Леванте. В 1271 году он возглавил коалицию против крепости госпитальеров Крак-де-Шевалье."
leader_baibars_civilization = "Мамлюкский султанат"

leader_emperor_qin_shi_huang_name = "Цинь Шихуан"
leader_emperor_qin_shi_huang_historical = "Цинь Шихуан родился под именем Ин Чжэн. Он принял титул Первого императора после того, как его царство одолело последних соперников в 221 году до н. э. Его правительство распространило циньские меры и веса на завоёванные земли. Реформа засвидетельствована надписями на гирях и мерных сосудах."
leader_emperor_qin_shi_huang_civilization = "Династия Цинь"

leader_spartacus_name = "Спартак"
leader_spartacus_historical = "Спартак был фракийским гладиатором и одним из руководителей восстания, начавшегося в Капуе в 73 году до н. э. Плутарх пишет, что беглецы воспользовались кухонной утварью, а затем захватили оружие, которое везли на повозках. У Аппиана они вооружаются в дороге и укрываются на Везувии, где их отряд растёт."
leader_spartacus_civilization = "Восставшие Спартака"

leader_queen_nefertiti_name = "Нефертити"
leader_queen_nefertiti_historical = "Нефертити была великой царской супругой Эхнатона во времена XVIII династии Египта. В Ахетатоне, нынешней Амарне, она занимала заметное место в культе Атона. Фрагмент красного кварцита из Музея Петри изображает её совершающей возлияние под лучами солнечного диска."
leader_queen_nefertiti_civilization = "Древний Египет"

leader_mandukhai_name = "Мандухай-хатун"
leader_mandukhai_historical = "Мандухай-хатун обладала политической и военной властью среди монголов в конце XV века. После смерти Мандуул-хана она способствовала восстановлению власти рода Чингисхана в ходе событий, связанных с восшествием Даян-хана. Поздние монгольские летописи приписывают ей руководство походами против ойратов."
leader_mandukhai_civilization = "Северная Юань"

leader_kabal_xook_name = "Кабаль Шоок"
leader_kabal_xook_historical = "Кабаль Шоок освятила сооружение 23 в 726 году в Яшчилане, городе майя на реке Усумасинте в нынешнем штате Чьяпас. Она была одной из главных супруг правителя Ицамнаах-Балама. Надписи называют её имя, а над входами в здание размещались три каменных рельефа с её изображением."
leader_kabal_xook_civilization = "Яшчилан"

leader_lakshmibai_name = "Лакшмибаи"
leader_lakshmibai_historical = "Лакшмибаи, рани Джанси, выступила против присоединения её княжества Ост-Индской компанией после смерти Гангадхара Рао. Компания отказалась признать их приёмного сына наследником. Во время Индийского восстания 1857–1858 годов Лакшмибаи руководила обороной Джанси от войск Хью Роуза. Когда британцы взяли Джанси в 1858 году, она вырвалась и в Калпи присоединилась к другим повстанческим силам, в том числе к отрядам, связанным с Татьей Топе. Она продолжила борьбу после падения Калпи и погибла близ Гвалиора в июне 1858 года."
leader_lakshmibai_civilization = "Джанси"

leader_pharaoh_hatshepsut_name = "Хатшепсут"
leader_pharaoh_hatshepsut_historical = "Хатшепсут правила Египтом в XV веке до н. э. во времена XVIII династии. Сначала она была регентом при юном племяннике и пасынке Тутмосе III. Затем она приняла титул и полномочия фараона, а Тутмос остался соправителем. Среди сооружений по её заказу был террасный храм в Дейр-эль-Бахри. Рельефы южного портика средней террасы показывают посланную ею экспедицию в Пунт, встречу египетской делегации с местными жителями и погрузку товаров. Храм представляет поход в царском и религиозном контексте."
leader_pharaoh_hatshepsut_civilization = "Древний Египет"

leader_thusnelda_cherusci_name = "Туснельда"
leader_thusnelda_cherusci_historical = "Туснельда была знатной женщиной из племени херусков в начале I века н. э. Её отец Сегест искал поддержки Рима, а муж Арминий возглавлял сопротивление. По словам Тацита, в 15 году войска Арминия осадили Сегеста, и тот обратился за помощью к Германику. Римское войско сняло осаду и взяло под стражу беременную Туснельду. В речи, которую Тацит приписывает Сегесту, тот признаёт, что она была у него против воли. Римский историк описывает, как она встретила пленение без мольбы."
leader_thusnelda_cherusci_civilization = "Херуски"

leader_queen_cartimandua_name = "Картимандуя"
leader_queen_cartimandua_historical = "Картимандуя правила бригантами на севере современной Англии в I веке н. э. Главный сохранившийся рассказ о её правлении принадлежит римскому историку Тациту. В 51 году Каратак, один из вождей сопротивления Риму, после поражения искал у неё убежища. Картимандуя взяла его в плен и выдала римлянам. Тацит описывает также её борьбу с Венуцием и помощь римских войск, которые спасли её в 69 году, когда престол остался за Венуцием."
leader_queen_cartimandua_civilization = "Бриганты"

leader_queen_suriyothai_name = "Сурийотхай"
leader_queen_suriyothai_historical = "Сурийотхай была королевой Аюттхаи при Маха Чаккрапхате. Её помнят в связи с вторжением войск бирманского короля Табиншвехти, которое в хронологии провинции Аюттхая датировано 1548 годом. Согласно традиции королевских хроник, она присоединилась к войску верхом на слоне. Когда королю угрожала опасность, она встала между ним и вражеским командующим и была смертельно ранена. Предание приписывает ей решение, принятое на поле боя и повлиявшее на короля и его войско."
leader_queen_suriyothai_civilization = "Королевство Аюттхая"

leader_tarabai_name = "Тарабай"
leader_tarabai_historical = "Тарабай (1675–1761) возглавила правительство маратхов после смерти Раджарама в 1700 году и стала регентом при малолетнем сыне Шиваджи. Она координировала военачальников и обороняла крепости от войск могольского императора Аурангзеба. Историк Ричард Итон описывает, как она отправляла силы на север во владения Моголов, пока её собственные крепости были в осаде. Исторический справочник Сатары сообщает, что она поручила надзор за крепостями Парашураму Тримбаку. После смерти Аурангзеба в 1707 году возвращение претендента Шаху вызвало борьбу в правящем доме маратхов."
leader_tarabai_civilization = "Империя маратхов"

leader_natavan_name = "Хуршидбану Натаван"
leader_natavan_historical = "Хуршидбану Натаван была азербайджанской поэтессой и покровительницей искусств из Шуши, где умерла в 1897 году. В опубликованных источниках приводятся разные годы рождения, в том числе 1830 и 1832. Её отец Мехдикули-хан был последним ханом Карабаха. Натаван использовала унаследованные средства для общественных и культурных проектов. В 1872 году она возглавила «Меджлиси-унс», литературный кружок шушинских поэтов, который поддерживал связь с другими кружками. Она писала газели и элегии. Её иллюстрированный альбом сохранил и образцы её художественных работ."
leader_natavan_civilization = "Карабах"

leader_mavia_name = "Мавия"
leader_mavia_historical = "Мавия, также известная как Мавийя, возглавляла арабские общины на восточной границе Рима и заключила мир с империей в конце IV века."
leader_mavia_civilization = "Арабы-танухиды"

leader_queen_nandi_name = "Королева Нанди"
leader_queen_nandi_historical = "Нанди каБхебхе (около 1764–1827) происходила из общины элангени и стала королевой-матерью после прихода её сына Шаки к власти у зулусов."
leader_queen_nandi_civilization = "Зулусское королевство"

