analytics_title = "Необязательная аналитика"
analytics_body = "Необязательная аналитика выключена, пока вы её не разрешите. При согласии случайный ID хранится в этом браузере до 90 дней, чтобы измерять возвраты; это не ID аккаунта. Отказ не влияет на игру."
cookies_analytics_events = "События учитывают посещения, загрузку, меню, прогресс обучения, подбор игроков, а также начало, результат и явный выход из матча. Для сведений о матче используются только фиксированные категории и общий класс размера экрана. В записях событий нет имён, ID аккаунта/игрока, полей IP, ID матча/лобби, чата, паролей, данных о покупках, исходного текста ошибок, кликов по карте или полного user-agent."
cookies_analytics_server = "После согласия события отправляются только на наш собственный endpoint /api/event и не проходят через игровой relay. Для каждого события используется временный случайный ID текущего сеанса браузера. Отдельный случайный ID браузера хранится локально до 90 дней и отправляется только для измерения возвратов; сервер создаёт из него псевдоним, который не входит в записи событий. В записях событий нет ID аккаунта/игрока, матча/лобби или IP-адресов; IP запроса может появиться в отдельных технических журналах безопасности."
analytics_policy = "Подробнее о cookie"
analytics_accept = "Разрешить"
analytics_reject = "Отклонить"
analytics_manage = "Настройки файлов cookie"
privacy_analytics_body_v3 = "Необязательная внутренняя аналитика сайта и браузерной игры работает только с вашего разрешения. Она записывает ограниченный набор событий посещения, загрузки, меню, обучения, лобби и матчей, а также версию сборки, язык, общую категорию размера экрана и необязательную короткую метку источника из ?ref=. После согласия случайный ID браузера хранится в локальном хранилище до 90 дней для измерения возвратов D1/D3/D7. Мы отправляем его отдельно от событий и создаём на сервере псевдоним; в записи событий он не входит. Очистка хранилища или другой браузер/устройство начинают отдельный подсчёт. В событиях нет ID аккаунта/игрока или матча/лобби. IP запроса может попасть в отдельные технические журналы безопасности. Мы не записываем имена, сообщения, пароли, рекламные ID, клики по карте или полный отпечаток устройства."
privacy_cookies_body_v2 = "Мы сохраняем ваш выбор аналитики в локальном хранилище. Только после согласия случайный ID браузера хранится там до 90 дней для измерения возвратов; временный ID сеанса и небольшая очередь повторной отправки используют хранилище сеанса. Отказ не влияет на игру. Настройки игры, данные аккаунта и кэшированные ресурсы используют отдельное хранилище, необходимое для этих функций. Подробности и настройки в"
privacy_retention_body_v2 = "Файлы событий, счётчики аналитики и записи о связях удаляются в течение 90 дней. После подтверждённого удаления аккаунта связанные события и записи удаляются; обезличенные дневные итоги хранятся только до истечения тех же 90 дней. Аккаунты и история матчей сохраняются, пока вы не запросите удаление или пока аккаунт не будет закрыт согласно Условиям."
privacy_updated_v2 = "Последнее обновление: 13 ноября 2026 · Оператор: World of Unreal · Контакт: hello@shadowsofwar.io"
cookies_analytics_title = "Необязательная аналитика на нашем сайте и в браузерной игре"
cookies_storage_title = "Хранилище браузера и срок хранения"
cookies_storage_body = "Мы локально запоминаем ваш выбор: разрешить или запретить. Только после согласия случайный ID браузера хранится в локальном хранилище до 90 дней; временный ID сеанса и небольшая очередь повторной отправки используют хранилище сеанса. Аналитика включает версию сборки, язык и общую категорию экрана, но не полный user-agent. Файлы событий, записи связей и когорты возвратов браузера удаляются в течение 90 дней. Подтверждённое удаление аккаунта удаляет старые связанные события и записи аккаунта; когорты браузера с аккаунтами не связаны. Настройки игры, данные аккаунта, восстановление после сбоев и кэшированные ресурсы используют отдельное необходимое хранилище."
cookies_platforms_title = "Другие игровые платформы"
cookies_platforms_body = "Poki, CrazyGames и Jest могут измерять использование своими SDK и по собственным правилам платформ. Мы не копируем связанные с игроками события с этих платформ на наш сервер. Собственная аналитика Android отключена до обновления сведений в магазине."
cookies_controls_v2 = "Вы можете с одинаковой лёгкостью разрешить или отклонить необязательную аналитику. Запуск игры не означает разрешение. Измените выбор в настройках игры или здесь; отказ не влияет на игру. Удаление данных сайта также удаляет ваш выбор, и аналитика останется выключенной, пока вы снова её не разрешите. Мы не продаём и не передаём аналитику для рекламы."
cookies_description_v2 = "Необязательная аналитика продукта отключена, пока вы её не разрешите. Запуск игры не включает её. Узнайте, какие данные хранит Shadows of War и как изменить выбор."
