[site]
leader_muhumuza_ability = "Сеть Ньябинги"
leader_muhumuza_description = "Ваши клетки возвышенности и клетки возвышенности союзников требуют на 50 % больше усилий для захвата там, где они граничат друг с другом."

leader_khosrow_i_ability = "Региональные командования"
leader_khosrow_i_description = "Когда два или более разных соперника атакуют вас по суше, их армии теряют на 25 % больше воинов за каждую отнятую у вас клетку."

leader_naram_sin_ability = "Восхождение в Загросе"
leader_naram_sin_description = "Ваши армии на 50 % быстрее захватывают горные клетки соперника, которые граничат с подконтрольной вам возвышенностью."

leader_jalal_al_din_mangburni_ability = "Переправа через Инд"
leader_jalal_al_din_mangburni_description = "Когда отступающий войсковой транспорт достигает вашего берега, все оставшиеся на борту воины возвращаются в пределах лимита войск."

leader_modu_chanyu_ability = "Спорная степь"
leader_modu_chanyu_description = "Ваши сухопутные армии теряют на 50 % меньше воинов при захвате нейтральной клетки равнины, граничащей с территорией соперника."

leader_hiawatha_haudenosaunee_ability = "Великий закон мира"
leader_hiawatha_haudenosaunee_description = "Когда два ваших союзника заключают новый союз между собой, оба ваших временных союза с ними продлеваются до полной длительности. Один раз для каждой пары за матч."

leader_kaahumanu_hawaii_ability = "Общий стол"
leader_kaahumanu_hawaii_description = "При первой отправке не менее 500 войск каждому союзнику, если у вас обоих есть действующая ферма, вы оба получаете подкрепление в размере 25% от отправленного, до 500 каждому и в пределах лимитов войск."

leader_sargon_of_akkad_ability = "Гарнизоны Аккада"
leader_sargon_of_akkad_description = "Захватив действующий вражеский город без вашей башни в радиусе 12 клеток, вы бесплатно строите башню 1-го уровня на ближайшем подходящем своём участке в этом радиусе. Один раз для каждого захваченного города."

leader_mithridates_vi_ability = "Помощь Тиграна"
leader_mithridates_vi_description = "Если у союзника есть действующий город, при отступлении из сухопутной атаки на соперника спустя не менее 3 секунд вы получаете подкрепление по числу вернувшихся войск, до 1 000 и в пределах лимита войск. Один раз за матч."

leader_gudit_yodit_ability = "Бегство из Аксума"
leader_gudit_yodit_description = "Когда вы захватываете действующий вражеский город, крупнейшая сухопутная армия его прежнего владельца, которая атакует игрока, вынуждена отступить. Один раз для каждого захваченного города."

leader_khutulun_qaidu_ability = "Захват с коня"
leader_khutulun_qaidu_description = "Когда вы начинаете сухопутную атаку на соперника, который уже атакует вас по суше, 20% войск, побеждённых вами в первом столкновении, пополняют резерв до предела численности."

leader_sor_juana_ines_de_la_cruz_ability = "Кухонная философия"
leader_sor_juana_ines_de_la_cruz_description = "Когда вы завершаете улучшение фермы, оставшееся время ближайшего текущего улучшения вашего города в радиусе 12 клеток сокращается вдвое."

leader_sibylla_ability = "Вторая корона"
leader_sibylla_description = "Если вы заключаете новый союз, имея действующий город, строительство самого старого недостроенного города вашего нового союзника завершается сразу, если у него нет действующего города. Один раз за матч."

leader_cynethryth_mercia_ability = "Кукемское соглашение"
leader_cynethryth_mercia_description = "Когда соперник захватывает одну из ваших действующих ферм, ваш достроенный город самого низкого уровня в радиусе 12 клеток получает один уровень, вплоть до 4-го. Один раз для каждой фермы."

leader_suppiluliuma_ability = "Договор с Митанни"
leader_suppiluliuma_description = "Ваши сухопутные армии теряют на 25% меньше бойцов при захвате вражеских клеток, граничащих с землёй союзника, который тоже атакует того же противника по суше."

leader_baibars_ability = "Сапёры Крака"
leader_baibars_description = "При захвате действующей вражеской башни вы разрушаете ближайшую действующую башню того же противника с более низким действующим уровнем в пределах 12 клеток от захваченной. Один раз за матч для каждой захваченной башни."

leader_emperor_qin_shi_huang_ability = "Императорские меры и веса"
leader_emperor_qin_shi_huang_description = "Пока суммарное число действующих уровней городов, фабрик и ферм одинаково и больше нуля, фабрики дают на 25% больше золота, а фермы — на 25% больше войск."

leader_spartacus_ability = "Арсенал Фурий"
leader_spartacus_description = "Когда ваша сухопутная армия захватывает центр действующей вражеской фабрики, она получает 300 бойцов за каждый действующий уровень этой фабрики. Один раз на фабрику за матч."

leader_queen_nefertiti_ability = "Талататы Амарны"
leader_queen_nefertiti_description = "Улучшение города стоит на 35% меньше золота, если не дальше 12 клеток от него есть ваша действующая фабрика."

leader_mandukhai_ability = "Воссоединение степи"
leader_mandukhai_description = "Когда вы побеждаете соперника, захватив его оставшуюся территорию, вы набираете 25% его оставшихся резервных войск в пределах своего лимита."

leader_kabal_xook_ability = "Воинские регалии Яшчилана"
leader_kabal_xook_description = "Если у вас есть действующий город и не менее 750 бойцов в резерве, вы отправите 750 из них, когда союзник начнёт новую сухопутную атаку на общего соперника. Один раз за матч для каждого союзника."

leader_lakshmibai_ability = "Редут Калпи"
leader_lakshmibai_description = "Когда соперник захватывает ваш последний действующий город, бесплатно основать город уровня 1 на ближайшем пригодном участке вашей земли в радиусе 24 клеток от потерянного города. Один раз за матч."

leader_pharaoh_hatshepsut_ability = "Сады Пунта"
leader_pharaoh_hatshepsut_description = "Когда ваш торговый корабль завершает маршрут в чужой порт, ваша готовая ферма наименьшего уровня в радиусе 12 клеток от порта отправления получает уровень, максимум до 4. Один раз на порт отправления."

leader_thusnelda_cherusci_ability = "Несломленная в плену"
leader_thusnelda_cherusci_description = "Если соперник захватывает ваш город с активным уровнем 2 или выше, город теряет один готовый уровень, а текущее улучшение отменяется. Один раз на город."

leader_queen_cartimandua_ability = "Выдача Каратака"
leader_queen_cartimandua_description = "Когда вражеская сухопутная армия отступает с вашей земли, передайте 25% выживших союзнику с крупнейшей активной сухопутной армией против этого врага и свободным местом в резерве. Излишек возвращается врагу."

leader_queen_suriyothai_ability = "Эскорт Аюттхаи"
leader_queen_suriyothai_description = "Когда вражеская сухопутная армия вот-вот захватит центр действующего союзного города, потратьте 1 500 резервных солдат, чтобы сорвать попытку и уничтожить до 1 500 нападающих. Один раз на союзный город."

leader_tarabai_ability = "Чаут контрудара"
