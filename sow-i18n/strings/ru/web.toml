privacy_analytics_body_v2 = "Необязательная собственная аналитика на нашем сайте и в браузерной игре работает только после вашего разрешения. Сам запуск игры её не включает. Она собирает ограниченный набор событий о посещении, загрузке, меню, обучении, лобби, начале матча и выходе из него, а также версию сборки, язык и общий класс размера экрана, но не полный цифровой отпечаток устройства. Если передан ID аккаунта, сервер заменяет его перед сохранением псевдонимом с ключом, отдельным для этого канала. Мы не записываем имена, сообщения, пароли, рекламные идентификаторы и клики по карте. Если вы пришли по ссылке с меткой источника (например, ?ref=reddit), эта короткая метка тоже записывается."
privacy_cookies_body_v2 = "Ваш выбор об аналитике хранится локально. Временный ID аналитической сессии и небольшая очередь повторной отправки создаются в хранилище сессии только после разрешения. Отказ не влияет на игру. Настройки игры, сохранение аккаунта и кэш ресурсов используют отдельное хранилище, необходимое для этих функций. Подробнее и настройки — в нашем"
privacy_retention_body_v2 = "Файлы событий, счётчики аналитики и записи о связях удаляются в течение 90 дней. После подтверждённого удаления аккаунта связанные события и записи удаляются; обезличенные дневные итоги хранятся только до истечения тех же 90 дней. Аккаунты и история матчей сохраняются, пока вы не запросите удаление или пока аккаунт не будет закрыт согласно Условиям."
privacy_updated_v2 = "Обновлено: 6 октября 2026 · Ответственный: World of Unreal · Контакт: hello@shadowsofwar.io"
cookies_analytics_title = "Необязательная аналитика на нашем сайте и в браузерной игре"
cookies_analytics_events = "Считаются посещения, этапы загрузки, действия в меню, прохождение обучения, входы в лобби, начало матчей и явный выход из них, а также общий класс размера экрана. Имена, чат, пароли, ID лобби, покупки, клики по карте и полная строка браузера не записываются."
cookies_analytics_server = "Разрешённые события отправляются напрямую на наш собственный сервер /api/event, минуя игровой relay. Если передан ID аккаунта, сервер заменяет его до сохранения псевдонимом с ключом, используемым только для этого сайта."
cookies_storage_title = "Хранилище браузера и срок хранения"
cookies_storage_body = "Мы локально сохраняем ваш выбор — разрешить или отклонить аналитику. Временный ID сессии и небольшая очередь повторной отправки помещаются в хранилище сессии только после разрешения. Аналитика включает версию сборки, язык и общий класс размера экрана, но не полную строку браузера. Файлы событий и записи о связях удаляются в течение 90 дней; подтверждённое удаление аккаунта удаляет связанные события и записи. Настройки игры, сохранение аккаунта, восстановление после сбоя и кэш ресурсов используют отдельное необходимое хранилище."
cookies_platforms_title = "Другие игровые платформы"
cookies_platforms_body = "Poki, CrazyGames и Jest могут измерять использование своими SDK и по собственным правилам платформ. Мы не копируем связанные с игроками события с этих платформ на наш сервер. Собственная аналитика Android отключена до обновления сведений в магазине."
cookies_controls_v2 = "Вы можете с одинаковой лёгкостью разрешить или отклонить необязательную аналитику. Запуск игры не означает разрешение. Измените выбор в настройках игры или здесь; отказ не влияет на игру. Удаление данных сайта также удаляет ваш выбор, и аналитика останется выключенной, пока вы снова её не разрешите. Мы не продаём и не передаём аналитику для рекламы."
cookies_description_v2 = "Необязательная аналитика продукта отключена, пока вы её не разрешите. Запуск игры не включает её. Узнайте, какие данные хранит Shadows of War и как изменить выбор."
cookies_og_description_v2 = "Необязательная аналитика выключена, пока вы её не разрешите. Изменить выбор можно в любое время."
