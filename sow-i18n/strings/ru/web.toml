privacy_use_title = "Использование и правовые основы"
privacy_use_body = "Мы обрабатываем данные, необходимые для работы игры, защиты игроков и систем, поддержки и выполнения требований закона. Для пользователей из ЕС и Великобритании основания включают договор на игру, законные интересы в безопасности и борьбе с нечестной игрой, юридические требования, когда они применимы, и ваше согласие на необязательную собственную аналитику продукта. Она отключена, пока вы её не разрешите; изменить выбор можно в настройках. Мы не продаём персональные данные и не используем поведенческую рекламу."
