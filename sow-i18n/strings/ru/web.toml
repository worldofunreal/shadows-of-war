privacy_cookies_title = "Cookies и локальное хранение"
privacy_cookies_body = "Только строго необходимое хранилище: предпочтения темы, идентификаторы сеансов, наша собственная конечная точка событий первой стороны. Никаких рекламных, социальных или кросс-сайтовых файлов cookie. Шрифты размещаются самостоятельно - нулевые запросы перекрестного происхождения. Подробности и элементы управления в наших"
privacy_retention_title = "Сохранение"
privacy_retention_body = "Файлы событий автоматически удаляются в течение 90 дней; счетчики аналитики и членство истекают по ключу TTL в течение 90 дней. Развертывание никогда не уничтожает состояние в реальном времени. Учетные записи и история сохраняются до тех пор, пока вы не запросите удаление или прекращение в соответствии с Условиями."
privacy_rights_title = "Ваши права и удаление"
privacy_rights_body = "Доступ, исправление, удаление, порт, объект, ограничение."
privacy_rights_after = "с идентификатором вашей игровой учетной записи (или именем + приблизительной датой создания). Проверенные удаления удаляют учетную запись, отображение личности, зеркало метаданных и членство в аналитике - подтверждено вам. GPC считается отказом от продажи / совместного использования (мы не продаем или не делимся, поэтому ничего не переключается). Обращения ответом; ответ в течение 45 дней максимум."
privacy_security_title = "Безопасность, трансферы, изменения"
privacy_security_body = "TLS в транзите, внутренние системы только с обратной связью, конечные точки оператора, привязанные к предъявителям, хешированные секреты собственности; нет абсолютной гарантии. Infra работает в США и ЕС с минимизацией данных и без передачи рекламных технологий. Изменения в политике вступают в силу после заметного уведомления; продолжение использования означает принятие."
