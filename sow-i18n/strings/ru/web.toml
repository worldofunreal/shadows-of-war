leader_tarenorerer_name = "Tarenorerer"
leader_tarenorerer_historical = "Тареноререр, женщина из народа томмегинне на севере Тасмании, вернулась на родину в 1828 году после похищения и продажи охотникам на тюленей. По данным Australian Dictionary of Biography, она собрала мужчин и женщин из нескольких общин, обучила их обращению с огнестрельным оружием и организовала нападения на вторгшихся поселенцев. Большая часть сохранившихся письменных свидетельств принадлежит колониальным наблюдателям, прежде всего Джорджу Августу Робинсону; поэтому к их оценкам и утверждениям о её мотивах следует относиться осторожно."
