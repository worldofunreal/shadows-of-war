analytics_manage = "Настройки файлов cookie"
privacy_analytics_body_v2 = "Необязательная собственная аналитика на нашем сайте и в браузерной игре работает только после вашего разрешения. Сам запуск игры её не включает. Она собирает ограниченный набор событий о посещении, загрузке, меню, обучении, лобби, начале матча и выходе из него, а также версию сборки, язык и общий класс размера экрана, но не полный цифровой отпечаток устройства. Если передан ID аккаунта, сервер заменяет его перед сохранением псевдонимом с ключом, отдельным для этого канала. Мы не записываем имена, сообщения, пароли, рекламные идентификаторы и клики по карте."
privacy_cookies_body_v2 = "Ваш выбор об аналитике хранится локально. Временный ID аналитической сессии и небольшая очередь повторной отправки создаются в хранилище сессии только после разрешения. Отказ не влияет на игру. Настройки игры, сохранение аккаунта и кэш ресурсов используют отдельное хранилище, необходимое для этих функций. Подробнее и настройки — в нашем"
privacy_retention_body_v2 = "Файлы событий, счётчики аналитики и записи о связях удаляются в течение 90 дней. После подтверждённого удаления аккаунта связанные события и записи удаляются; обезличенные дневные итоги хранятся только до истечения тех же 90 дней. Аккаунты и история матчей сохраняются, пока вы не запросите удаление или пока аккаунт не будет закрыт согласно Условиям."
privacy_updated_v2 = "Обновлено: 6 октября 2026 · Ответственный: World of Unreal · Контакт: hello@shadowsofwar.io"
cookies_analytics_title = "Необязательная аналитика на нашем сайте и в браузерной игре"
cookies_analytics_events = "Считаются посещения, этапы загрузки, действия в меню, прохождение обучения, входы в лобби, начало матчей и явный выход из них, а также общий класс размера экрана. Имена, чат, пароли, ID лобби, покупки, клики по карте и полная строка браузера не записываются."
