boudica_rise_title = "Ascesa degli Iceni"
boudica_rise_body = "Benvenuto nella campagna. Inizia toccando terra non reclamata oltre il confine per catturare il territorio. Ogni piastrella genera truppe e oro."
boudica_rise_hint = "Toccare terra non reclamata per espandere il territorio"
boudica_warband_title = "Crescere la banda di guerra"
boudica_warband_body = "Territorio scala la vostra economia. Continua a espandersi verso l'esterno per aumentare la generazione di truppe e il reddito d'oro."
boudica_warband_hint = "Espandi per raggiungere 1.0024 piastrelle tenute"
boudica_contact_title = "Primo contatto"
boudica_contact_body = "Gli avamposti nemici controllano il territorio adiacente. Seleziona le tue forze e trascina verso i confini nemici per attaccare."
boudica_contact_hint = "Trascinare per attaccare un avamposto — sconfitta 1 nemico"
boudica_unite_title = "Unire l'Oriente"
boudica_unite_body = "Neutralizzare gli avamposto regionali per proteggere il fronte orientale sotto il tuo banner."
boudica_unite_hint = "Sconfiggi 4 avamposti regionali"
boudica_camulodunum_title = "assedio di Camulodunum"
boudica_camulodunum_body = "Circondare Camulodunum e tagliare i rinforzi per catturare l'insediamento."
boudica_camulodunum_hint = "Cattura Camulodunum a sud"
boudica_londinium_title = "Avanzamento su Londinium"
boudica_londinium_body = "Londinium controlla il commercio centrale. Catturare l'insediamento per garantire la traversata del fiume."
boudica_londinium_hint = "Conquista Londinium"
boudica_verulamium_title = "Conquista Verulamium"
boudica_verulamium_body = "Verulamium si trova su Watling Street. Cattura l'insediamento per tagliare linee di rifornimento imperiali."
boudica_verulamium_hint = "Conquista Verulamium"
boudica_ninth_title = "Imboscare il Nono"
boudica_ninth_body = "Legio IX Hispana sta avanzando da nord. Intercetta e sconfigge le sue forze."
boudica_ninth_hint = "Intercettazione Legio IX Hispana"
boudica_final_title = "La battaglia finale"
boudica_final_body = "Hai imparato l'espansione, il combattimento e l'assedio. Sconfiggere Suetonius Paulinus, quindi tornare al menu."
boudica_final_hint = "Sconfiggere Paulinus, quindi tornare al menu"
six_sky_ep1_landfall_title = "Cascata"
six_sky_ep1_landfall_body = "682 CE. Sei Wak Chanil Ajaw, figlia di Dos Pilas, vieni a governare Naranjo. Pretendiamo terra oltre il confine."
six_sky_ep1_landfall_hint = "Toccare terra non reclamata per espandere"
six_sky_ep1_fire_title = "Sacro Fuoco"
six_sky_ep1_fire_body = "Crescete la vostra terra — ogni piastrella alimenta le vostre truppe e oro."
six_sky_ep1_fire_hint = "Espandi per raggiungere 512 piastrelle tenute"
six_sky_ep1_blood_title = "Primo sangue"
six_sky_ep1_blood_body = "I piccoli villaggi tengono la riva. Trascinare in un confine nemico per attaccare e prendere il tuo primo rivale."
six_sky_ep1_blood_hint = "Trascinare per attaccare — sconfitta 1 nemico"
six_sky_ep1_villages_title = "Il ginocchio dei villaggi"
six_sky_ep1_villages_body = "I villaggi sul lago devono imparare il nome della nuova dinastia. Sottomettili a tutti."
six_sky_ep1_villages_hint = "Sconfiggi 4 villaggi"
six_sky_ep1_rival_title = "Il vecchio sangue"
six_sky_ep1_rival_body = "Un pretendente della vecchia linea di Naranjo nega il vostro diritto. Finisci l'erede rivale."
six_sky_ep1_rival_hint = "Sconfiggi il Rival Claimant"
six_sky_ep1_caracol_title = "Rompere il Breaker"
six_sky_ep1_caracol_body = "Caracol ha lasciato Naranjo senza re. La sua guarnigione deve cadere."
six_sky_ep1_caracol_hint = "Sconfiggi Caracol"
six_sky_ep1_vanguard_title = "Occhi di Tikal"
six_sky_ep1_vanguard_body = "Tikal guarda attraverso la sua avanguardia. Prenda il suo posto in avanti."
six_sky_ep1_vanguard_hint = "Sconfiggere la Vanguard Tikal"
six_sky_ep1_queen_title = "Regina di Naranjo"
six_sky_ep1_queen_body = "Tikal si accampa nelle vicinanze. Smettetela, e la vostra linea e' sicura."
six_sky_ep1_queen_hint = "Sconfiggi Tikal"
six_sky_ep2_regent_title = "Reggente"
six_sky_ep2_regent_body = "693 CE. Il tuo figlio di cinque anni è re di Naranjo, e tu governa nel suo nome. Espandi e mostra forza."
six_sky_ep2_regent_hint = "Toccare terra non reclamata per espandere"
six_sky_ep2_provinces_title = "Le Province Stir"
six_sky_ep2_provinces_body = "La ribellione fermenta nei villaggi. Strike primo — prendere due rivali prima di unirsi."
six_sky_ep2_provinces_hint = "Sconfiggi 2 nemici"
six_sky_ep2_uaxactun_title = "Primo fuoco: Uaxactun"
six_sky_ep2_uaxactun_body = "Uaxactun ribelli. Brucia la sua sfida."
six_sky_ep2_uaxactun_hint = "Defeat Uaxactun Ribelli"
six_sky_ep2_yaxha_title = "Secondo fuoco: Yaxha"
six_sky_ep2_yaxha_body = "Yaxha sorge il prossimo. Lo costringa a riaffermare la sua fedeltà."
six_sky_ep2_yaxha_hint = "Defeat Yaxha Ribelli"
six_sky_ep2_tayasal_title = "Terzo fuoco: Tayasal"
six_sky_ep2_tayasal_body = "Un reggente che non può contenere Tayasal non può contenere Naranjo."
six_sky_ep2_tayasal_hint = "Defeat Tayasal Ribelli"
six_sky_ep2_seibal_title = "Quarto fuoco: Seibal"
six_sky_ep2_seibal_body = "Le canoe di Seibal portano la rivolta verso il basso. Sgombra la sua sfida."
six_sky_ep2_seibal_hint = "Defeat Seibal Ribelli"
six_sky_ep2_caracol_title = "Il Breaker ritorna"
six_sky_ep2_caracol_body = "Caracol appoggia i ribelli. Sistemate il più antico debito del vostro regno."
six_sky_ep2_caracol_hint = "Sconfiggi Caracol"
six_sky_ep2_total_title = "Reaffirm o Burn"
six_sky_ep2_total_body = "Continua a vincere finché ogni vicino non capirà la reggenza."
six_sky_ep2_total_hint = "Sconfiggi 8 nemici in totale"
six_sky_ep2_coalition_title = "La Coalizione"
six_sky_ep2_coalition_body = "Tikal raccolse i vostri nemici in una sola coalizione. Romperla e nessuna città dubiterà della reggenza."
six_sky_ep2_coalition_hint = "Sconfiggi la Coalizione Tikal"
six_sky_ep3_count_title = "Il lungo conte"
six_sky_ep3_count_body = "Gli anni ti hanno reso leggenda e bersaglio. Espandi ancora una volta."
six_sky_ep3_count_hint = "Toccare terra non reclamata per espandere"
six_sky_ep3_offerings_title = "Offerte"
six_sky_ep3_offerings_body = "Dei e soldati chiedono tributo. Prendere due rivali per nutrire gli altari e la guardia."
six_sky_ep3_offerings_hint = "Sconfiggi 2 nemici"
six_sky_ep3_unknown_title = "Il nemico sconosciuto"
six_sky_ep3_unknown_body = "Gli scribi discutono ancora da dove governa K'inichil Kab. Sconfiggilo."
six_sky_ep3_unknown_hint = "Sconfiggi K'inichil Kab"
six_sky_ep3_caracol_title = "Esercito di guerra"
six_sky_ep3_caracol_body = "Caracol invia un ospite di guerra completo, il suo ultimo lancio contro la vostra linea. Distruggilo."
six_sky_ep3_caracol_hint = "Sconfiggi l'ospite di guerra Caracol"
six_sky_ep3_hill_title = "La collina"
six_sky_ep3_hill_body = "Xunantunich sul suo arco collinare a nessun reggente. Fai inchinare la collina."
six_sky_ep3_hill_hint = "Defeat Xunantunich Ribelli"
six_sky_ep3_moon_title = "Dea della luna"
six_sky_ep3_moon_body = "726 CE. Tenere un grande dominio degno della dea della luna."
six_sky_ep3_moon_hint = "Espandi per raggiungere 1.0024 piastrelle tenute"
six_sky_ep3_vanguard_title = "Vanguard a Dusk"
six_sky_ep3_vanguard_body = "L'avanguardia di Tikal è al tramonto. Mostragli la regina Stela 24."
six_sky_ep3_vanguard_hint = "Sconfiggere la Vanguard Tikal"
six_sky_ep3_tribute_title = "Omaggio negato"
six_sky_ep3_tribute_body = "Tikal esige un tributo da Naranjo una volta finale. Rispondi alla guerra."
six_sky_ep3_tribute_hint = "Sconfiggi 6 nemici in totale"
six_sky_ep3_legacy_title = "Eredità nella pietra"
six_sky_ep3_legacy_body = "Sconfiggi Tikal e lascia la linea Naranjo in pietra."
six_sky_ep3_legacy_hint = "Sconfiggi Tikal"

