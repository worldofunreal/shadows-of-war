boudica_rise_title = "Rise of the Iceni"
boudica_rise_body = "Welcome to the campaign. Start by tapping unclaimed land beyond your border to capture territory. Each tile generates troops and gold."
boudica_rise_hint = "Tap unclaimed land to expand territory"
boudica_warband_title = "Grow the Warband"
boudica_warband_body = "Territory scales your economy. Continue expanding outward to increase troop generation and gold income."
boudica_warband_hint = "Expand to reach 1,024 tiles held"
boudica_contact_title = "First Contact"
boudica_contact_body = "Enemy outposts control adjacent territory. Select your forces and drag into enemy borders to attack."
boudica_contact_hint = "Drag to attack an outpost — defeat 1 enemy"
boudica_unite_title = "Unite the East"
boudica_unite_body = "Neutralize surrounding regional outposts to secure the eastern front under your banner."
boudica_unite_hint = "Defeat 4 regional outposts"
boudica_camulodunum_title = "Siege of Camulodunum"
boudica_camulodunum_body = "Surround Camulodunum and cut off reinforcements to capture the settlement."
boudica_camulodunum_hint = "Capture Camulodunum to the south"
boudica_londinium_title = "Advance on Londinium"
boudica_londinium_body = "Londinium controls central trade. Capture the settlement to secure the river crossing."
boudica_londinium_hint = "Capture Londinium"
boudica_verulamium_title = "Capture Verulamium"
boudica_verulamium_body = "Verulamium sits on Watling Street. Capture the settlement to cut imperial supply lines."
boudica_verulamium_hint = "Capture Verulamium"
boudica_ninth_title = "Ambush the Ninth"
boudica_ninth_body = "Legio IX Hispana is advancing from the north. Intercept and defeat its forces."
boudica_ninth_hint = "Intercept Legio IX Hispana"
boudica_final_title = "The Final Battle"
boudica_final_body = "You have mastered expansion, combat, and siege. Defeat Suetonius Paulinus, then return to the menu."
boudica_final_hint = "Defeat Paulinus, then return to menu"
six_sky_ep1_landfall_title = "Landfall"
six_sky_ep1_landfall_body = "682 CE. You are Wak Chanil Ajaw, daughter of Dos Pilas, come to rule Naranjo. Claim land beyond your border."
six_sky_ep1_landfall_hint = "Tap unclaimed land to expand"
six_sky_ep1_fire_title = "Sacred Fire"
six_sky_ep1_fire_body = "Grow your ground — every tile feeds your troops and gold."
six_sky_ep1_fire_hint = "Expand to reach 512 tiles held"
six_sky_ep1_blood_title = "First Blood"
six_sky_ep1_blood_body = "Small villages hold the shore. Drag into an enemy border to attack and take your first rival."
six_sky_ep1_blood_hint = "Drag to attack — defeat 1 enemy"
six_sky_ep1_villages_title = "The Villages Kneel"
six_sky_ep1_villages_body = "The lakeside villages must learn the new dynasty's name. Subdue them all."
six_sky_ep1_villages_hint = "Defeat 4 villages"
six_sky_ep1_rival_title = "The Old Blood"
six_sky_ep1_rival_body = "A claimant of Naranjo's old line denies your right. End the rival heir."
six_sky_ep1_rival_hint = "Defeat the Rival Claimant"
six_sky_ep1_caracol_title = "Break the Breaker"
six_sky_ep1_caracol_body = "Caracol left Naranjo kingless once before. Its garrison must fall."
six_sky_ep1_caracol_hint = "Defeat Caracol"
six_sky_ep1_vanguard_title = "Tikal's Eyes"
six_sky_ep1_vanguard_body = "Tikal watches through its vanguard. Take its forward post."
six_sky_ep1_vanguard_hint = "Defeat the Tikal Vanguard"
six_sky_ep1_queen_title = "Queen of Naranjo"
six_sky_ep1_queen_body = "Tikal itself camps nearby. Break it, and your line is secure."
six_sky_ep1_queen_hint = "Defeat Tikal"
six_sky_ep2_regent_title = "Regent"
six_sky_ep2_regent_body = "693 CE. Your five-year-old son is king of Naranjo, and you rule in his name. Expand and show strength."
six_sky_ep2_regent_hint = "Tap unclaimed land to expand"
six_sky_ep2_provinces_title = "The Provinces Stir"
six_sky_ep2_provinces_body = "Rebellion ferments in the villages. Strike first — take two rivals before they unite."
six_sky_ep2_provinces_hint = "Defeat 2 enemies"
six_sky_ep2_uaxactun_title = "First Fire: Uaxactun"
six_sky_ep2_uaxactun_body = "Uaxactun rebels. Burn its defiance out."
six_sky_ep2_uaxactun_hint = "Defeat Uaxactun Rebels"
six_sky_ep2_yaxha_title = "Second Fire: Yaxha"
six_sky_ep2_yaxha_body = "Yaxha rises next. Force it to reaffirm its allegiance."
six_sky_ep2_yaxha_hint = "Defeat Yaxha Rebels"
six_sky_ep2_tayasal_title = "Third Fire: Tayasal"
six_sky_ep2_tayasal_body = "A regent who cannot hold Tayasal cannot hold Naranjo."
six_sky_ep2_tayasal_hint = "Defeat Tayasal Rebels"
six_sky_ep2_seibal_title = "Fourth Fire: Seibal"
six_sky_ep2_seibal_body = "Seibal's canoes carry rebellion downriver. Sink its defiance."
six_sky_ep2_seibal_hint = "Defeat Seibal Rebels"
six_sky_ep2_caracol_title = "The Breaker Returns"
six_sky_ep2_caracol_body = "Caracol backs the rebels. Settle the oldest debt of your reign."
six_sky_ep2_caracol_hint = "Defeat Caracol"
six_sky_ep2_total_title = "Reaffirm or Burn"
six_sky_ep2_total_body = "Keep winning until every neighbor understands the regency."
six_sky_ep2_total_hint = "Defeat 8 enemies in total"
six_sky_ep2_coalition_title = "The Coalition Breaks"
six_sky_ep2_coalition_body = "Tikal gathered your enemies into one coalition. Break it and no city will doubt the regency."
six_sky_ep2_coalition_hint = "Defeat the Tikal Coalition"
six_sky_ep3_count_title = "The Long Count"
six_sky_ep3_count_body = "The years have made you legend and target both. Expand once more."
six_sky_ep3_count_hint = "Tap unclaimed land to expand"
six_sky_ep3_offerings_title = "Offerings"
six_sky_ep3_offerings_body = "Gods and soldiers both demand tribute. Take two rivals to feed the altars and the guard."
six_sky_ep3_offerings_hint = "Defeat 2 enemies"
six_sky_ep3_unknown_title = "The Unknown Enemy"
six_sky_ep3_unknown_body = "The scribes still argue over where K'inichil Kab rules from. Defeat it."
six_sky_ep3_unknown_hint = "Defeat K'inichil Kab"
six_sky_ep3_caracol_title = "War Host"
six_sky_ep3_caracol_body = "Caracol sends a full war host, its last throw against your line. Destroy it."
six_sky_ep3_caracol_hint = "Defeat the Caracol War Host"
six_sky_ep3_hill_title = "The Hill"
six_sky_ep3_hill_body = "Xunantunich on its hill bows to no regent. Make the hill bow."
six_sky_ep3_hill_hint = "Defeat Xunantunich Rebels"
six_sky_ep3_moon_title = "Moon Goddess"
six_sky_ep3_moon_body = "726 CE. Hold a great domain worthy of the moon goddess."
six_sky_ep3_moon_hint = "Expand to reach 1,024 tiles held"
six_sky_ep3_vanguard_title = "Vanguard at Dusk"
six_sky_ep3_vanguard_body = "Tikal's vanguard comes at dusk. Show them the Stela 24 queen."
six_sky_ep3_vanguard_hint = "Defeat the Tikal Vanguard"
six_sky_ep3_tribute_title = "Tribute Denied"
six_sky_ep3_tribute_body = "Tikal demands tribute from Naranjo one final time. Answer with war."
six_sky_ep3_tribute_hint = "Defeat 6 enemies in total"
six_sky_ep3_legacy_title = "Legacy in Stone"
six_sky_ep3_legacy_body = "Defeat Tikal and leave the Naranjo line standing in stone."
six_sky_ep3_legacy_hint = "Defeat Tikal"

