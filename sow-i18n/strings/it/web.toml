leader_cleopatra_multiplier = "I distretti industriali generano il 50% di oro in più per ciclo."
leader_ragnar_multiplier = "I distretti portuali generano il 50% di oro in più per ciclo."
leader_suntzu_multiplier = "I distretti industriali producono truppe il 20% più velocemente."
leader_alexander_multiplier = "Le truppe che conquistano territori avanzano il 15% più velocemente."
leader_genghiskhan_multiplier = "Ottieni il 10% dell'oro speso dai nemici sconfitti."
leader_richard_multiplier = "I distretti cittadini offrono il 50% in più di capacità massima delle truppe."
leader_vercingetorix_multiplier = "I distretti cittadini generano il 50% in più di entrate per le truppe."
leader_boudica_multiplier = "I distretti cittadini generano il 50% di oro in più."
leader_ladysixsky_multiplier = "I distretti industriali generano il 50% di oro in più."
leader_leonidas_multiplier = "I moduli dell'armeria offrono il 50% in più di capacità massima delle truppe."
