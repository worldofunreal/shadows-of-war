how_title = "Come giocare a Shadows of War — Strategia multigiocatore"
how_description = "Impara le prime mosse, l'economia, le alleanze, il tradimento e le regole di controllo della mappa di Shadows of War."
how_og_description = "Il manuale per espandere il territorio, costruire, gestire l'economia, stringere alleanze e controllare la mappa."
how_eyebrow = "Come si gioca"
how_heading = "Prendi la"
how_heading_em = "mappa."
how_lede = "Shadows of War è un MMORTS a partite. Inizia con un comandante, trasforma il territorio in un'economia, crea alleanze temporanee e combatti per il controllo della mappa."
getting_started = "Per iniziare"
how_steps_heading_1 = "Cinque mosse"
how_steps_heading_2 = "per capire"
how_steps_heading_3 = "la partita."
how_step_1_title = "Entra nel matchmaking e scegli la modalità"
how_step_1_body = "Entra nella lobby di matchmaking attiva. La coda alterna Tutti contro tutti (FFA), battaglie a squadre e Umani contro nazioni del mondo sulle mappe di Europa, Asia, Africa, East Anglia e Americhe."
how_step_2_title = "Scegli il comandante e il vantaggio civilizzazionale"
how_step_2_body = "Scegli uno dei dodici comandanti storici. Ogni leader offre un moltiplicatore permanente, come la forza di combattimento 1,10x di Julius Caesar, l'oro delle fabbriche +50% di Cleopatra, la produzione di truppe +20% di Sun Tzu o l'oro dei porti +50% di Ragnar."
compare_leader_traits = "Confronta i tratti"
how_step_3_title = "Conquista il territorio e costruisci distretti specializzati"
how_step_3_body = "Espanditi per catturare le caselle adiacenti. Ogni casella conquistata aumenta oro e entrate base delle truppe. Costruisci edifici specializzati sul tuo territorio:"
city_label = "Città:"
city_body = "Aumentano la capacità massima delle truppe e generano entrate passive di oro e truppe."
factory_label = "Fabbriche:"
factory_body = "Generano oro e aumentano la velocità di reclutamento."
port_label = "Porti:"
port_body = "Costruiti sulle coste, generano oro e truppe e danno accesso all'acqua."
bunker_label = "Bunker:"
bunker_body = "Fortificano le frontiere, estendono la copertura difensiva e riducono le perdite subite. I moduli d'armeria delle città aumentano la capacità massima."
how_step_4_title = "Gestisci economia, terreno e slancio dell'esercito"
how_step_4_body = "La conquista consuma truppe. Reinvesti l'oro di fabbriche, città e porti in nuove costruzioni. Usa i moltiplicatori del terreno per difendere le frontiere e indirizzare l'esercito verso obiettivi preziosi."
how_step_5_title = "Diplomazia, tradimento e vittoria per controllo della mappa"
how_step_5_body_before = "Forma alleanze di non aggressione con i vicini per coordinare i fronti. Un giocatore vince raggiungendo la"
how_step_5_threshold = "soglia di vittoria per il controllo della mappa"
how_step_5_body_after = "(la maggioranza richiesta del territorio totale) oppure eliminando tutti i comandanti rivali. Il tradimento rompe subito l'alleanza e trasforma i confini condivisi in fronti attivi."
match_structure = "Struttura della partita"
match_structure_body = "Il server mantiene una lobby di matchmaking rotativa e cambia modalità e mappa nel tempo."
