leader_caesar_mechanics = "Riduce le perdite di truppe durante la conquista e le battaglie di frontiera. Caesar impiega le unità con maggiore efficienza contro difensori neutrali e confini nemici."
leader_cleopatra_mechanics = "Accelera la generazione di oro dei distretti industriali. L'oro in eccesso permette di collocare rapidamente città, bunker e potenziamenti."
leader_ragnar_mechanics = "Premia l'espansione costiera. I porti lungo l'acqua generano grandi entrate d'oro e permettono l'accesso alle caselle acquatiche."
leader_suntzu_mechanics = "Aumenta il ritmo di reclutamento delle fabbriche. Accelera il recupero dell'esercito dopo le grandi battaglie."
leader_alexander_mechanics = "Aumenta la velocità di conquista a ogni ciclo di simulazione. Permette una rapida espansione nei territori neutrali."
leader_genghiskhan_mechanics = "Trasforma le vittorie in entrate per il tesoro. Sconfiggere eserciti e strutture sviluppate restituisce oro alla tua economia."
leader_richard_mechanics = "Aumenta il limite delle truppe per ogni distretto cittadino. Permette di radunare grandi eserciti prima delle offensive."
leader_vercingetorix_mechanics = "Aumenta la rigenerazione di base delle truppe dalle città. La forza lavoro passiva cresce con l'urbanizzazione del territorio."
leader_boudica_mechanics = "Aumenta la resa d'oro dei distretti cittadini. Crea un'economia basata sui centri abitati invece che sulle fabbriche."
leader_ladysixsky_mechanics = "Massimizza l'efficienza dell'oro delle fabbriche. Produce grandi entrate per finanziare espansione e difese."
leader_leonidas_mechanics = "Aumenta la capacità massima dell'esercito tramite moduli d'armeria nelle città. I bunker restano difensivi e non danno il bonus di Leonidas."
leader_napoleon_mechanics = "Il più alto moltiplicatore di espansione del motore. Conquista rapidamente le regioni neutrali e accelera l'avanzata."
