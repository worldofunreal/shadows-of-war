privacy_updated = "Ultimo aggiornamento: settembre 2026 · Titolare: World of Unreal · Contatto: hello@shadowsofwar.io"
privacy_overview_title = "Panoramica e titolare"
privacy_overview_body = "Shadows of War è gestito da World of Unreal. Questa informativa copre shadowsofwar.io, le piattaforme partner e i client nativi. Contatto privacy:"
privacy_overview_after = "Non abbiamo una sede nell'UE o nel Regno Unito; invia direttamente lì tutte le richieste, comprese quelle GDPR."
privacy_overview_payments = "Gli SDK delle piattaforme partner possono raccogliere dati secondo le proprie informative. I dati della carta sono elaborati direttamente dallo store usato per il pagamento (Google Play, Apple o Stripe); non vediamo mai i numeri della carta."
privacy_eligibility_title = "Idoneità e minori"
privacy_eligibility_body = "13+. I giocatori dai 13 ai 17 anni devono avere il permesso di un genitore o tutore. Il gioco non è rivolto a minori di 13 anni; gli account sotto i 13 anni vengono sospesi e cancellati. Genitori: scrivete a"
privacy_eligibility_after = "e cancelleremo rapidamente l'account."
privacy_data_title = "Dati raccolti"
privacy_gameplay_label = "Gioco:"
privacy_gameplay_body = "nome visualizzato, tag clan, scelte di leader e civiltà, azioni della partita, cronologia, gradi e oggetti posseduti."
privacy_account_label = "Account:"
privacy_account_body = "ID account casuale, identità di piattaforma collegate e hash unidirezionale del tuo segreto di proprietà (mai il testo in chiaro)."
privacy_technical_label = "Tecnici:"
privacy_technical_body = "versione della build, piattaforma/lingua, metadati di connessione, ticket relay e log del server per sicurezza e contrasto agli abusi."
privacy_analytics_label = "Analisi del prodotto (solo prima parte):"
privacy_analytics_body = "eventi a tassonomia chiusa (visite, fasi di avvio, tutorial, matchmaking, inizio/fine partita) legati a un ID di sessione e account casuale. Nessun identificatore pubblicitario o fornitore esterno."
privacy_purchases_label = "Acquisti:"
privacy_purchases_body = "ID prodotto, riferimento della transazione e stato dei diritti tramite RevenueCat o lo store. I dati completi di pagamento restano nello store."
privacy_public_label = "Pubblici per scelta:"
privacy_public_body = "nomi, handle, classifiche e registri delle partite sono visibili agli altri giocatori."
privacy_use_title = "Uso e basi giuridiche"
privacy_use_body = "Gestione del gioco, sicurezza e anti-cheat, funnel e affidabilità, assistenza e conformità. Basi UE/Regno Unito: contratto, interessi legittimi (mai pubblicità comportamentale), consenso quando richiesto e obbligo legale. Non vendiamo dati personali e non usiamo tracker pubblicitari."
privacy_sharing_title = "Condivisione"
privacy_hosting_label = "Hosting secondo le nostre istruzioni:"
privacy_hosting_body = "IONOS, Microsoft Azure e Cloudflare."
privacy_payments_label = "Pagamenti:"
