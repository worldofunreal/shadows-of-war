privacy_title = "Informativa sulla privacy — Shadows of War"
privacy_description = "Leggi l'informativa sulla privacy per i giocatori di Shadows of War: titolare, dati raccolti, condivisione, conservazione di 90 giorni, diritti ed eliminazione."
privacy_eyebrow = "Aspetti legali e telemetria"
privacy_heading = "Riservatezza"
privacy_heading_em = "informativa."
privacy_updated = "Ultimo aggiornamento: settembre 2026 · Titolare: World of Unreal · Contatto: hello@shadowsofwar.io"
privacy_overview_title = "Panoramica e titolare"
privacy_overview_body = "Shadows of War è gestito da World of Unreal. Questa informativa copre shadowsofwar.io, le piattaforme partner e i client nativi. Contatto privacy:"
privacy_overview_after = "Non abbiamo una sede nell'UE o nel Regno Unito; invia direttamente lì tutte le richieste, comprese quelle GDPR."
privacy_overview_payments = "Gli SDK delle piattaforme partner possono raccogliere dati secondo le proprie informative. I dati della carta sono elaborati direttamente dallo store usato per il pagamento (Google Play, Apple); non vediamo mai i numeri della carta."
privacy_eligibility_title = "Idoneità e minori"
privacy_eligibility_body = "13+. I giocatori dai 13 ai 17 anni devono avere il permesso di un genitore o tutore. Il gioco non è rivolto a minori di 13 anni; gli account sotto i 13 anni vengono sospesi e cancellati. Genitori: scrivete a"
privacy_eligibility_after = "e cancelleremo rapidamente l'account."
privacy_data_title = "Dati raccolti"
privacy_gameplay_label = "Gioco:"
privacy_gameplay_body = "nome visualizzato, tag clan, scelte di leader e civiltà, azioni della partita, cronologia, gradi e oggetti posseduti."
privacy_account_label = "Profilo:"
privacy_account_body = "ID account casuale, identità di piattaforma collegate e hash unidirezionale del tuo segreto di proprietà (mai il testo in chiaro)."
privacy_technical_label = "Tecnici:"
privacy_technical_body = "versione della build, piattaforma/lingua, metadati di connessione, ticket relay e log del server per sicurezza e contrasto agli abusi."
privacy_analytics_label = "Analisi del prodotto (solo prima parte):"
privacy_purchases_label = "Acquisti:"
privacy_purchases_body = "ID prodotto, riferimento della transazione e stato dei diritti tramite RevenueCat o lo store. I dati completi di pagamento restano nello store."
privacy_public_label = "Pubblici per scelta:"
privacy_public_body = "nomi, handle, classifiche e registri delle partite sono visibili agli altri giocatori."
privacy_use_title = "Uso e basi giuridiche"
privacy_use_body = "Trattiamo i dati necessari per gestire il gioco, proteggere giocatori e sistemi, fornire assistenza e adempiere agli obblighi di legge. Per gli utenti nell'UE e nel Regno Unito, le basi includono il contratto per il gioco, i legittimi interessi di sicurezza e contrasto ai trucchi, gli obblighi di legge ove previsti e il tuo consenso per le analisi facoltative proprietarie del prodotto. Restano disattivate finché non le autorizzi; puoi modificare la scelta nelle Impostazioni. Non vendiamo dati personali né usiamo pubblicità comportamentale."
privacy_sharing_title = "Condivisione"
privacy_hosting_label = "Hosting secondo le nostre istruzioni:"
privacy_hosting_body = "IONOS, Microsoft Azure e Cloudflare."
privacy_payments_label = "Pagamenti:"
privacy_payments_body = "Google Play o Apple tramite RevenueCat, secondo le loro informative."
privacy_sdk_label = "SDK partner:"
privacy_sdk_body = "secondo la loro informativa quando giochi tramite loro."
privacy_players_label = "Giocatori e pubblico:"
privacy_players_body = "nomi, handle, gradi e registri delle partite."
privacy_authorities_label = "Autorità e trasferimenti:"
privacy_authorities_body = "quando richiesto dalla legge o a un successore legale con comunicazione."
privacy_cookies_title = "Cookie e archiviazione locale"
privacy_cookies_body = "Solo archiviazione strettamente necessaria: ID di sessione. Gli eventi proprietari vengono inviati al nostro endpoint. Nessun cookie pubblicitario, sociale o tra siti. I caratteri sono ospitati sul nostro dominio, senza richieste cross-origin. Dettagli e controlli nella nostra"
privacy_retention_title = "Conservazione"
privacy_retention_body = "I file degli eventi vengono eliminati automaticamente dopo 90 giorni; contatori e adesioni analitiche scadono tramite TTL entro 90 giorni. I deploy non cancellano mai lo stato attivo. Account e cronologia persistono fino alla richiesta di eliminazione o alla chiusura secondo i Termini."
privacy_rights_title = "I tuoi diritti ed eliminazione"
privacy_rights_body = "Puoi accedere, correggere, eliminare, trasferire, opporti e limitare. Scrivi a"
privacy_rights_after = "con l'ID del tuo account di gioco (o nome e data di creazione approssimativa). Le eliminazioni verificate cancellano account, identità collegate, copia dei metadati e adesioni analitiche, con conferma. Il GPC è rispettato come opposizione a vendita o condivisione (non vendiamo né condividiamo). Ricorsi via risposta; massimo 45 giorni."
privacy_security_title = "Sicurezza, trasferimenti e modifiche"
privacy_security_body = "Usiamo TLS durante il trasferimento, componenti interni accessibili solo localmente, endpoint operativi protetti e segreti di proprietà sottoposti a hash; nessuna sicurezza è assoluta. L'infrastruttura opera negli Stati Uniti e nell'UE con minimizzazione dei dati e senza trasferimenti ad-tech. Annunceremo in modo evidente le modifiche sostanziali all'Informativa sulla privacy prima che entrino in vigore; ove richiesto dalla legge, chiederemo un consenso separato. Il semplice uso continuato non costituisce consenso."
privacy_contact_title = "Contatti"
privacy_contact_before = "Riservatezza:"
privacy_help = "Aiuto:"
support_center = "centro assistenza"
privacy_security_contact = "Problemi di sicurezza: inviali privatamente a hello@, mai pubblicamente; confermeremo entro 48 ore."
privacy_source_before = "Il codice sorgente completo di ogni versione del gioco è distribuito con licenza AGPL-3.0-only e con i termini aggiuntivi di OpenFront. Il menu del gioco collega al codice della versione corrispondente."
cookies_title = "Informativa sui cookie — Shadows of War"
cookies_description = "Come Shadows of War usa l'archiviazione necessaria: ID di sessione ed eventi proprietari. Nessun cookie pubblicitario."
cookies_og_description = "Solo archiviazione strettamente necessaria. Nessun cookie pubblicitario, sociale o di tracciamento tra siti."
cookies_eyebrow = "Aspetti legali e archiviazione"
cookies_heading = "Informativa"
cookies_heading_em = "sui cookie."
cookies_updated = "Ultimo aggiornamento: settembre 2026 · World of Unreal"
cookies_use_title = "Cosa utilizziamo"
cookies_use_body = "Shadows of War usa solo archiviazione client strettamente necessaria; non serve un banner di consenso perché sito e gioco non possono funzionare senza di essa:"
cookies_session_label = "Identificatori di sessione analitica"
cookies_session_body = "ID casuali che raggruppano eventi proprietari durante una visita. Scompaiono alla chiusura della scheda."
cookies_events_label = "Eventi prodotto proprietari:"
cookies_events_body = "eventi anonimi del funnel inviati ai nostri server"
cookies_events_after = "Non è un cookie e non viene condiviso con fornitori."
cookies_game_label = "Impostazioni del gioco e mappe in cache"
cookies_game_body = "preferenze del client e dati di gioco scaricati."
cookies_third_party_title = "Terze parti"
cookies_third_party_body = "I font sono ospitati sul nostro dominio. Nessun codice di terze parti esegue archiviazione o tracciamento sulle nostre pagine: nessuna rete pubblicitaria, widget social, script di session replay o identificatore tra siti. Le nostre pagine non effettuano richieste cross-origin."
cookies_dont_title = "Cosa non facciamo"
cookies_dont_ads = "Nessun cookie pubblicitario e nessuna pubblicità basata sugli interessi."
cookies_dont_sell = "Nessuna vendita o condivisione di dati personali per pubblicità."
cookies_dont_tracking = "Nessun tracciamento tra siti o app."
cookies_dont_body = "Poiché non esiste tracciamento comportamentale, i segnali Global Privacy Control e Do Not Track non hanno nulla da disattivare; rispettiamo comunque il GPC come opposizione a vendita o condivisione."
cookies_controls_title = "I tuoi controlli"
cookies_controls_clear = "Cancella i dati del sito dalle impostazioni del browser per rimuovere gli ID di sessione e le risorse in cache. Il gioco continuerà a funzionare e avvierà una nuova sessione."
cookies_controls_block = "Bloccare tutta l'archiviazione può forzare nuovi download delle risorse del gioco e ripristinare le preferenze a ogni visita."
cookies_controls_rights = "Per i diritti sui dati personali (accesso, eliminazione e portabilità), consulta l'Informativa sulla privacy o scrivi a"
cookies_changes_title = "Modifiche"
cookies_changes_body = "Se aggiungessimo archiviazione non essenziale (fornitori di analisi, embed o pubblicità), questa informativa elencherà ogni elemento, scopo e controllo prima della pubblicazione; l'Informativa sulla privacy sarà aggiornata insieme. Ultimo aggiornamento: settembre 2026."
terms_title = "Termini di servizio — Shadows of War"
terms_description = "Leggi i termini di servizio di Shadows of War: account, oggetti virtuali e politica di mancato rimborso, condotta, responsabilità e risoluzione delle controversie."
terms_eyebrow = "Termini e condizioni"
terms_heading = "Termini di"
terms_heading_em = "servizio."
terms_updated = "Ultimo aggiornamento: settembre 2026 · World of Unreal"
terms_acceptance_title = "Accettazione e idoneità"
terms_acceptance_body = "Questi Termini sono un accordo vincolante tra te e World of Unreal che disciplina l'uso di Shadows of War su shadowsofwar.io, piattaforme partner e client nativi. Giocando, installando o accedendo al Servizio accetti questi Termini. Se non accetti, non usare il Servizio."
terms_acceptance_age = "Devi avere almeno 13 anni. I giocatori dai 13 ai 17 anni possono giocare solo con il permesso e la supervisione di un genitore o tutore. Il Servizio non è rivolto a minori di 13 anni."
terms_changes_title = "Modifiche al gioco e al Servizio"
terms_changes_body = "Il multiplayer richiede accesso alla rete dei nostri server. Possiamo modificare, sospendere o interrompere qualsiasi parte del Servizio —modalità, mappe, stagioni, classifiche ed eventi— in qualsiasi momento, con o senza preavviso e senza responsabilità."
terms_accounts_title = "Account"
terms_accounts_body = "Il gioco anonimo crea un ID account canonico memorizzato sul dispositivo insieme a un nome visualizzato. Cancellare l'archiviazione del sito crea un nuovo account; cambiare nome non modifica mai l'ID. L'ID serve a recuperare i progressi, non è una password: proteggi il dispositivo."
terms_accounts_contact = "Sei responsabile di ogni attività sul tuo account. Segnala gli accessi non autorizzati sospetti a"
terms_license_title = "Licenza e limitazioni"
terms_license_body = "Questi Termini regolano l'accesso al Servizio ufficiale ospitato, agli account, agli oggetti virtuali e ai dati del server. Il codice sorgente completo del gioco è distribuito separatamente con licenza AGPL-3.0-only, inclusi i termini aggiuntivi di OpenFront. Questi Termini non limitano i diritti concessi da tale licenza del codice o dalle licenze separate delle mappe."
terms_maps_before = "Le fonti delle mappe derivate da OpenFront e i file generati delle mappe sono distribuiti con licenza"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "L'avviso sulle mappe indica attribuzione, fonte e modifiche:"
terms_maps_notice = "avviso sulle mappe"
terms_license_no_sell = "Non vendere, affittare, concedere in sublicenza o sfruttare commercialmente il Servizio ufficiale ospitato, gli account o gli oggetti virtuali."
terms_license_no_reverse = "Non eseguire reverse engineering, scraping, estrazione massiva o addestramento di modelli sul Servizio ufficiale ospitato. Queste restrizioni non riducono i diritti concessi dalle licenze del codice o delle mappe."
terms_license_feedback = "Il feedback che condividi può essere usato liberamente, senza compenso o attribuzione."
terms_virtual_title = "Oggetti virtuali e nessun rimborso"
terms_virtual_body = "Gemme, sblocchi dei leader e skin sono solo oggetti virtuali con licenza: senza valore monetario, non trasferibili e revocabili. Gli sblocchi dei leader cambiano il gameplay, offrono vantaggi distinti e non sono solo cosmetici."
terms_sales_final = "TUTTE LE VENDITE SONO DEFINITIVE."
terms_virtual_refunds = "Gli oggetti virtuali non sono rimborsabili né sostituibili nella massima misura consentita dalla legge, anche se usati o indesiderati, in caso di modifiche al Servizio o di provvedimenti sull'account per violazioni. Se una piattaforma annulla un acquisto, possiamo rimuovere gli oggetti corrispondenti e intervenire sull'account."
terms_conduct_title = "Condotta del giocatore"
terms_conduct_cheating = "Niente trucchi, bot, macro, automazione, exploit di bug o desincronizzazioni intenzionali."
terms_conduct_harassment = "Niente molestie, minacce, incitamento all'odio o doxxing. Nomi, tag e chat devono rispettare la legge."
terms_conduct_servers = "Non interrompere i server, sondare l'infrastruttura o toccare account, credenziali o ticket di altri giocatori."
terms_conduct_after = "Le violazioni possono causare rimozione dei contenuti, perdita della partita, sospensione o chiusura."
terms_third_party_title = "Servizi di terze parti e altri giocatori"
terms_third_party_body = "Le piattaforme partner e i loro SDK, i fornitori di pagamento, Discord e Telegram sono terze parti che non controlliamo; valgono i loro termini e li usi a tuo rischio. Le interazioni con altri giocatori riguardano solo te e loro. Nella massima misura consentita dalla legge, liberi World of Unreal da reclami derivanti da terze parti o altri giocatori."
terms_termination_title = "Chiusura"
terms_termination_body = "Possiamo sospendere o chiudere il tuo accesso —account, oggetti e classifiche— in qualsiasi momento e per qualsiasi motivo, incluso un sospetto mancato rispetto dei Termini, senza responsabilità. Alla chiusura la licenza termina e gli oggetti virtuali vengono persi senza rimborso."
terms_disclaimer_title = "Esclusioni di responsabilità"
terms_disclaimer_body = "IL SERVIZIO È FORNITO COSÌ COM'È E SECONDO DISPONIBILITÀ. NELLA MASSIMA MISURA CONSENTITA DALLA LEGGE ESCLUDIAMO OGNI GARANZIA, INCLUSE COMMERCIABILITÀ, IDONEITÀ A UNO SCOPO PARTICOLARE, TITOLARITÀ E NON VIOLAZIONE. Non garantiamo un funzionamento ininterrotto, privo di errori o sicuro, né la conservazione di progressi, gradi o oggetti."
terms_liability_title = "Limitazione di responsabilità"
terms_liability_body = "NELLA MASSIMA MISURA CONSENTITA DALLA LEGGE NON SIAMO RESPONSABILI PER PROFITTI, DATI, OGGETTI O PROGRESSI PERSI, NÉ PER DANNI INDIRETTI O CONSEQUENZIALI. LA NOSTRA RESPONSABILITÀ TOTALE È LIMITATA AL MAGGIORE TRA 50 USD E QUANTO HAI PAGATO PER OGGETTI VIRTUALI NEI SEI MESI PRECEDENTI L'INCIDENTE."
terms_indemnification_title = "Manleva"
terms_indemnification_body = "Accetti di difendere e tenere indenne World of Unreal da reclami e costi ragionevoli derivanti dal tuo uso del Servizio, dalla violazione di questi Termini o della legge."
terms_arbitration_title = "Controversie e arbitrato"
terms_arbitration_before = "Le controversie passano per un arbitrato individuale vincolante (JAMS, Delaware) dopo un tentativo informale di 45 giorni, non per un tribunale. Rinunci al processo con giuria e alle azioni collettive. Sono escluse le controversie di modesta entità e le ingiunzioni sulla proprietà intellettuale. Puoi rinunciare all'arbitrato entro 30 giorni dalla prima accettazione dei Termini scrivendo a"
terms_arbitration_after = "con l'ID account e una dichiarazione chiara di rinuncia."
terms_general_title = "Disposizioni generali"
terms_general_before = "Questi Termini sono regolati dalla legge del Delaware; le controversie non sottoposte ad arbitrato spettano esclusivamente ai tribunali del Delaware. Annunceremo chiaramente le modifiche sostanziali prima che entrino in vigore. Se la legge applicabile richiede una nuova accettazione, la chiederemo separatamente. Contatto: World of Unreal —"
terms_privacy_title = "Riservatezza"
terms_privacy_before = "Il trattamento dei dati, i tuoi diritti e l'eliminazione sono descritti nella nostra"
terms_privacy_and = "e nel nostro"
terms_privacy_after = ", qui incorporati per riferimento."
analytics_title = "Analisi facoltative"
analytics_body = "Usiamo l’attività sul sito e nel gioco per migliorare Shadows of War. L’analisi resta disattivata finché non la autorizzi."
analytics_policy = "Dettagli sui cookie"
analytics_accept = "Consenti"
analytics_reject = "Rifiuta"
analytics_manage = "Impostazioni cookie"
privacy_analytics_body_v2 = "Le analisi facoltative proprietarie sul nostro sito e nel gioco via browser funzionano solo dopo la tua autorizzazione. L'accesso al gioco da solo non le attiva. Registrano un insieme definito di eventi relativi a visite, caricamento, menu, tutorial, lobby, inizio e uscita dalla partita, oltre alla versione, alla lingua e a una categoria generale dello schermo, non un'impronta completa del dispositivo. Se è presente un ID account, prima di salvarlo il server lo sostituisce con uno pseudonimo con chiave dedicato a questo canale. Non registriamo nomi, messaggi, password, ID pubblicitari o clic sulla mappa."
privacy_cookies_body_v2 = "Salviamo localmente la tua scelta sulle analisi. Solo dopo l'autorizzazione creiamo un ID temporaneo di sessione analytics e una piccola coda di ritentativi nella memoria di sessione. Rifiutarle non influisce sul gioco. Impostazioni, continuità dell'account e risorse nella cache usano memoria separata necessaria a tali funzioni. Dettagli e controlli nella nostra"
privacy_retention_body_v2 = "I file degli eventi, i contatori analytics e le associazioni scadono entro 90 giorni. Dopo la verifica, l'eliminazione dell'account rimuove eventi collegati e associazioni; i totali giornalieri non identificativi restano solo fino alla stessa scadenza di 90 giorni. Account e cronologia delle partite restano finché non ne chiedi l'eliminazione o l'account viene chiuso secondo i Termini."
privacy_updated_v2 = "Ultimo aggiornamento: 6 ottobre 2026 · Titolare: World of Unreal · Contatto: hello@shadowsofwar.io"
cookies_analytics_title = "Analisi facoltative sul nostro sito e nel gioco via browser"
cookies_analytics_events = "Contano visite, fasi di caricamento, azioni nei menu, avanzamento del tutorial, ingressi nelle lobby, inizi e uscite esplicite dalle partite, oltre a una categoria generale dello schermo. Non registrano nomi, chat, password, ID lobby, acquisti, clic sulla mappa o l'intera stringa dello user agent."
cookies_analytics_server = "Gli eventi autorizzati vengono inviati direttamente al nostro endpoint proprietario /api/event, senza passare dal relay di gioco. Se viene trasmesso un ID account, il server lo sostituisce prima di salvarlo con uno pseudonimo con chiave valido solo per questo sito."
cookies_storage_title = "Memoria del browser e conservazione"
cookies_storage_body = "Memorizziamo localmente la tua scelta di consentire o rifiutare. Solo dopo il consenso vengono creati un ID temporaneo di sessione e una piccola coda di ritentativi nella memoria di sessione. Le analisi includono versione, lingua e una categoria generale dello schermo, non l'intero user agent. File e associazioni scadono entro 90 giorni; l'eliminazione verificata dell'account rimuove eventi e associazioni collegati. Impostazioni, continuità dell'account, ripristino dopo arresti anomali e risorse nella cache usano memoria separata necessaria a tali funzioni."
cookies_platforms_title = "Altre piattaforme di gioco"
cookies_platforms_body = "Poki, CrazyGames e Jest possono misurare l'uso con i propri SDK e secondo le proprie condizioni. Non copiamo sul nostro server gli eventi dei giocatori provenienti da quelle piattaforme. Le analisi proprietarie su Android restano disattivate finché non aggiorniamo l'informativa dello store."
cookies_controls_v2 = "Puoi consentire o rifiutare le analisi facoltative con la stessa facilità. Iniziare a giocare non equivale ad autorizzarle. Modifica la scelta nelle Impostazioni del gioco o qui; rifiutarle non influisce sulla partita. Cancellare i dati del sito rimuove anche la scelta e le analisi restano disattivate finché non le autorizzi di nuovo. Non vendiamo né condividiamo analisi per pubblicità."
cookies_description_v2 = "Le analisi facoltative del prodotto restano disattivate finché non le autorizzi. Iniziare a giocare non le attiva. Scopri quali dati salva Shadows of War e come modificare la scelta."
cookies_og_description_v2 = "Le analisi facoltative restano disattivate finché non le autorizzi. Puoi modificare la scelta in qualsiasi momento."
cookies_updated_v2 = "Ultimo aggiornamento: 6 ottobre 2026 · World of Unreal"
