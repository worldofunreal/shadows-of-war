privacy_sdk_label = "SDK partner:"
privacy_sdk_body = "secondo la loro informativa quando giochi tramite loro."
privacy_players_label = "Giocatori e pubblico:"
privacy_players_body = "nomi, handle, gradi e registri delle partite."
privacy_authorities_label = "Autorità e trasferimenti:"
privacy_authorities_body = "quando richiesto dalla legge o a un successore legale con comunicazione."
privacy_cookies_title = "Cookie e archiviazione locale"
privacy_cookies_body = "Solo archiviazione strettamente necessaria: preferenza del tema, ID di sessione e nostro endpoint proprietario per gli eventi. Nessun cookie pubblicitario, sociale o tra siti. I font sono ospitati localmente: zero richieste cross-origin. Dettagli e controlli nella nostra"
privacy_retention_title = "Conservazione"
privacy_retention_body = "I file degli eventi vengono eliminati automaticamente dopo 90 giorni; contatori e adesioni analitiche scadono tramite TTL entro 90 giorni. I deploy non cancellano mai lo stato attivo. Account e cronologia persistono fino alla richiesta di eliminazione o alla chiusura secondo i Termini."
privacy_rights_title = "I tuoi diritti ed eliminazione"
privacy_rights_body = "Puoi accedere, correggere, eliminare, trasferire, opporti e limitare. Scrivi a"
privacy_rights_after = "con l'ID del tuo account di gioco (o nome e data di creazione approssimativa). Le eliminazioni verificate cancellano account, identità collegate, copia dei metadati e adesioni analitiche, con conferma. Il GPC è rispettato come opposizione a vendita o condivisione (non vendiamo né condividiamo). Ricorsi via risposta; massimo 45 giorni."
privacy_security_title = "Sicurezza, trasferimenti e modifiche"
privacy_security_body = "TLS in transito, componenti interni solo tramite loopback, endpoint operativi protetti da bearer e segreti di proprietà sottoposti a hash; nessuna garanzia assoluta. L'infrastruttura opera negli Stati Uniti e nell'UE con minimizzazione dei dati e senza trasferimenti ad-tech. Le modifiche sostanziali entrano in vigore dopo un avviso evidente; l'uso continuato vale come accettazione."
privacy_contact_title = "Contatti"
privacy_contact_before = "Privacy:"
privacy_help = "Aiuto:"
support_center = "centro assistenza"
privacy_security_contact = "Problemi di sicurezza: inviali privatamente a hello@, mai pubblicamente; confermeremo entro 48 ore."
privacy_source_before = "I componenti server sono sotto AGPL-3.0-or-later; codice sorgente su"
cookies_title = "Informativa sui cookie — Shadows of War"
cookies_description = "Come Shadows of War usa solo archiviazione strettamente necessaria: preferenza del tema, identificatori di sessione ed eventi proprietari. Nessun cookie pubblicitario."
cookies_og_description = "Solo archiviazione strettamente necessaria. Nessun cookie pubblicitario, sociale o di tracciamento tra siti."
cookies_eyebrow = "Aspetti legali e archiviazione"
cookies_heading = "Informativa"
cookies_heading_em = "sui cookie."
cookies_updated = "Ultimo aggiornamento: settembre 2026 · World of Unreal"
cookies_use_title = "Cosa utilizziamo"
cookies_use_body = "Shadows of War usa solo archiviazione client strettamente necessaria; non serve un banner di consenso perché sito e gioco non possono funzionare senza di essa:"
cookies_theme_label = "Preferenza del tema"
cookies_theme_body = "ricorda la scelta tra tema chiaro e scuro. Prima parte, strettamente necessaria."
cookies_session_label = "Identificatori di sessione analitica"
cookies_session_body = "ID casuali che raggruppano eventi proprietari durante una visita. Scompaiono alla chiusura della scheda."
cookies_events_label = "Eventi prodotto proprietari:"
cookies_events_body = "eventi anonimi del funnel inviati ai nostri server"
cookies_events_after = "Non è un cookie e non viene condiviso con fornitori."
cookies_game_label = "Impostazioni del gioco e mappe in cache"
cookies_game_body = "preferenze del client e dati di gioco scaricati."
cookies_third_party_title = "Terze parti"
cookies_third_party_body = "I font sono ospitati sul nostro dominio. Nessun codice di terze parti esegue archiviazione o tracciamento sulle nostre pagine: nessuna rete pubblicitaria, widget social, script di session replay o identificatore tra siti. Le nostre pagine non effettuano richieste cross-origin."
cookies_dont_title = "Cosa non facciamo"
cookies_dont_ads = "Nessun cookie pubblicitario e nessuna pubblicità basata sugli interessi."
cookies_dont_sell = "Nessuna vendita o condivisione di dati personali per pubblicità."
cookies_dont_tracking = "Nessun tracciamento tra siti o app."
cookies_dont_body = "Poiché non esiste tracciamento comportamentale, i segnali Global Privacy Control e Do Not Track non hanno nulla da disattivare; rispettiamo comunque il GPC come opposizione a vendita o condivisione."
cookies_controls_title = "I tuoi controlli"
cookies_controls_clear = "Cancella i dati del sito in qualsiasi momento dalle impostazioni del browser: rimuoverai preferenza del tema, ID di sessione e risorse in cache. Il gioco continuerà a funzionare; dimenticherà solo il tema e avvierà una nuova sessione."
cookies_controls_block = "Bloccare tutta l'archiviazione può forzare nuovi download delle risorse del gioco e ripristinare le preferenze a ogni visita."
cookies_controls_rights = "Per i diritti sui dati personali (accesso, eliminazione e portabilità), consulta l'Informativa sulla privacy o scrivi a"
cookies_changes_title = "Modifiche"
cookies_changes_body = "Se aggiungessimo archiviazione non essenziale (fornitori di analisi, embed o pubblicità), questa informativa elencherà ogni elemento, scopo e controllo prima della pubblicazione; l'Informativa sulla privacy sarà aggiornata insieme. Ultimo aggiornamento: settembre 2026."
terms_title = "Termini di servizio — Shadows of War"
terms_description = "Leggi i termini di servizio di Shadows of War: account, oggetti virtuali e politica di mancato rimborso, condotta, responsabilità e risoluzione delle controversie."
terms_eyebrow = "Termini e condizioni"
terms_heading = "Termini di"
terms_heading_em = "servizio."
terms_updated = "Ultimo aggiornamento: settembre 2026 · World of Unreal"
terms_acceptance_title = "Accettazione e idoneità"
terms_acceptance_body = "Questi Termini sono un accordo vincolante tra te e World of Unreal che disciplina l'uso di Shadows of War su shadowsofwar.io, piattaforme partner e client nativi. Giocando, installando o accedendo al Servizio accetti questi Termini. Se non accetti, non usare il Servizio."
terms_acceptance_age = "Devi avere almeno 13 anni. I giocatori dai 13 ai 17 anni possono giocare solo con il permesso e la supervisione di un genitore o tutore. Il Servizio non è rivolto a minori di 13 anni."
terms_changes_title = "Modifiche al gioco e al Servizio"
terms_changes_body = "Il multiplayer richiede accesso alla rete dei nostri server. Possiamo modificare, sospendere o interrompere qualsiasi parte del Servizio —modalità, mappe, stagioni, classifiche ed eventi— in qualsiasi momento, con o senza preavviso e senza responsabilità."
terms_accounts_title = "Account"
terms_accounts_body = "Il gioco anonimo crea un ID account canonico memorizzato sul dispositivo insieme a un nome visualizzato. Cancellare l'archiviazione del sito crea un nuovo account; cambiare nome non modifica mai l'ID. L'ID serve a recuperare i progressi, non è una password: proteggi il dispositivo."
terms_accounts_contact = "Sei responsabile di ogni attività sul tuo account. Segnala gli accessi non autorizzati sospetti a"
terms_license_title = "Licenza e limitazioni"
terms_license_body = "Concediamo una licenza limitata e revocabile per uso personale e non commerciale. Tutta la proprietà intellettuale del Servizio appartiene a World of Unreal o ai suoi licenziatari. Il codice sorgente è disponibile separatamente sotto AGPL-3.0-or-later; account, oggetti virtuali e dati del server sono regolati da questi Termini."
terms_license_no_sell = "Non vendere, affittare, concedere sublicenze o sfruttare commercialmente il Servizio."
terms_license_no_reverse = "Non fare reverse engineering, scraping, estrazione massiva o addestramento di modelli sul Servizio."
terms_license_feedback = "Il feedback che condividi può essere usato liberamente, senza compenso o attribuzione."
terms_virtual_title = "Oggetti virtuali e nessun rimborso"
terms_virtual_body = "Gemme, sblocchi dei leader e skin sono solo oggetti virtuali con licenza: senza valore monetario, non trasferibili e revocabili. Gli sblocchi dei leader cambiano il gameplay, offrono vantaggi distinti e non sono solo cosmetici."
terms_sales_final = "TUTTE LE VENDITE SONO DEFINITIVE."
terms_virtual_refunds = "Gli oggetti virtuali non sono rimborsabili né sostituibili nella massima misura consentita dalla legge, anche se usati o indesiderati, in caso di modifiche al Servizio o di provvedimenti sull'account per violazioni. Se una piattaforma annulla un acquisto, possiamo rimuovere gli oggetti corrispondenti e intervenire sull'account."
terms_conduct_title = "Condotta del giocatore"
terms_conduct_cheating = "Niente trucchi, bot, macro, automazione, exploit di bug o desincronizzazioni intenzionali."
terms_conduct_harassment = "Niente molestie, minacce, incitamento all'odio o doxxing. Nomi, tag e chat devono rispettare la legge."
terms_conduct_servers = "Non interrompere i server, sondare l'infrastruttura o toccare account, credenziali o ticket di altri giocatori."
terms_conduct_after = "Le violazioni possono causare rimozione dei contenuti, perdita della partita, sospensione o chiusura."
terms_third_party_title = "Servizi di terze parti e altri giocatori"
terms_third_party_body = "Le piattaforme partner e i loro SDK, i fornitori di pagamento, Discord e Telegram sono terze parti che non controlliamo; valgono i loro termini e li usi a tuo rischio. Le interazioni con altri giocatori riguardano solo te e loro. Nella massima misura consentita dalla legge, liberi World of Unreal da reclami derivanti da terze parti o altri giocatori."
terms_termination_title = "Chiusura"
terms_termination_body = "Possiamo sospendere o chiudere il tuo accesso —account, oggetti e classifiche— in qualsiasi momento e per qualsiasi motivo, incluso un sospetto mancato rispetto dei Termini, senza responsabilità. Alla chiusura la licenza termina e gli oggetti virtuali vengono persi senza rimborso."
terms_disclaimer_title = "Esclusioni di responsabilità"
terms_disclaimer_body = "IL SERVIZIO È FORNITO COSÌ COM'È E SECONDO DISPONIBILITÀ. NELLA MASSIMA MISURA CONSENTITA DALLA LEGGE ESCLUDIAMO OGNI GARANZIA, INCLUSE COMMERCIABILITÀ, IDONEITÀ A UNO SCOPO PARTICOLARE, TITOLARITÀ E NON VIOLAZIONE. Non garantiamo un funzionamento ininterrotto, privo di errori o sicuro, né la conservazione di progressi, gradi o oggetti."
terms_liability_title = "Limitazione di responsabilità"
terms_liability_body = "NELLA MASSIMA MISURA CONSENTITA DALLA LEGGE NON SIAMO RESPONSABILI PER PROFITTI, DATI, OGGETTI O PROGRESSI PERSI, NÉ PER DANNI INDIRETTI O CONSEQUENZIALI. LA NOSTRA RESPONSABILITÀ TOTALE È LIMITATA AL MAGGIORE TRA 50 USD E QUANTO HAI PAGATO PER OGGETTI VIRTUALI NEI SEI MESI PRECEDENTI L'INCIDENTE."
terms_indemnification_title = "Manleva"
terms_indemnification_body = "Accetti di difendere e tenere indenne World of Unreal da reclami e costi ragionevoli derivanti dal tuo uso del Servizio, dalla violazione di questi Termini o della legge."
terms_arbitration_title = "Controversie e arbitrato"
terms_arbitration_before = "Le controversie passano per un arbitrato individuale vincolante (JAMS, Delaware) dopo un tentativo informale di 45 giorni, non per un tribunale. Rinunci al processo con giuria e alle azioni collettive. Sono escluse le controversie di modesta entità e le ingiunzioni sulla proprietà intellettuale. Puoi rinunciare all'arbitrato entro 30 giorni dalla prima accettazione dei Termini scrivendo a"
terms_arbitration_after = "con l'ID account e una dichiarazione chiara di rinuncia."
terms_general_title = "Disposizioni generali"
terms_general_before = "La legge del Delaware disciplina questi Termini; le controversie non arbitrali rientrano esclusivamente nei tribunali del Delaware. Gli aggiornamenti sostanziali entrano in vigore dopo un avviso evidente; l'uso continuato vale come accettazione. Contatto: World of Unreal —"
terms_privacy_title = "Privacy"
terms_privacy_before = "Il trattamento dei dati, i tuoi diritti e l'eliminazione sono descritti nella nostra"
terms_privacy_and = "e nel nostro"
terms_privacy_after = ", qui incorporati per riferimento."
