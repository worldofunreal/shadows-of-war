cookies_updated = "Zuletzt aktualisiert: September 2026 · World of Unreal"
cookies_use_title = "Was wir verwenden"
cookies_use_body = "Shadows of War verwendet ausschließlich unbedingt notwendigen Client-Speicher; dafür ist kein Einwilligungsbanner nötig, weil Website und Spiel sonst nicht funktionieren:"
cookies_session_label = "Analyse-Sitzungskennungen"
cookies_session_body = "zufällige IDs, die First-Party-Ereignisse innerhalb eines Besuchs gruppieren. Sie verschwinden beim Schließen des Tabs."
cookies_events_label = "First-Party-Produktereignisse:"
cookies_events_body = "anonyme Trichterereignisse, die an unsere Server gesendet werden"
cookies_events_after = "Kein Cookie und keine Weitergabe an Anbieter."
cookies_game_label = "Spieleinstellungen und zwischengespeicherte Karten"
cookies_game_body = "Clientpräferenzen und heruntergeladene Spieldaten."
cookies_third_party_title = "Dritte"
cookies_third_party_body = "Schriftarten werden auf unserer eigenen Domain gehostet. Auf unseren Seiten führt kein Drittanbieter-Code Speicherung oder Tracking aus: keine Werbenetzwerke, Social-Widgets, Session-Replay-Skripte oder Cross-Site-IDs. Unsere Seiten senden keine Cross-Origin-Anfragen."
cookies_dont_title = "Was wir nicht tun"
cookies_dont_ads = "Keine Werbe-Cookies und keine interessenbasierte Werbung."
cookies_dont_sell = "Kein Verkauf oder Teilen personenbezogener Daten für Werbung."
cookies_dont_tracking = "Kein Cross-Site- oder Cross-App-Tracking."
cookies_dont_body = "Da kein Verhaltenstracking stattfindet, gibt es für Global Privacy Control und Do Not Track nichts abzuschalten; GPC wird trotzdem als Widerspruch gegen Verkauf/Weitergabe respektiert."
cookies_controls_title = "Deine Einstellungen"
cookies_controls_clear = "Lösche Website-Daten in den Browsereinstellungen, um Sitzungs-IDs und zwischengespeicherte Ressourcen zu entfernen. Das Spiel funktioniert weiter und startet eine neue Sitzung."
cookies_controls_block = "Das Blockieren allen Speichers kann erneute Downloads der Spielressourcen erzwingen und Einstellungen bei jedem Besuch zurücksetzen."
cookies_controls_rights = "Für Datenschutzrechte (Zugriff, Löschung, Übertragbarkeit) lies die Datenschutzerklärung oder schreibe an"
cookies_changes_title = "Änderungen"
cookies_changes_body = "Wenn wir nicht notwendigen Speicher hinzufügen (Analyseanbieter, Einbettungen oder Werbung), listet dieser Hinweis jedes Element, seinen Zweck und seine Einstellungen vor der Veröffentlichung auf; die Datenschutzerklärung wird gleichzeitig aktualisiert. Zuletzt aktualisiert: September 2026."
terms_title = "Nutzungsbedingungen — Shadows of War"
terms_description = "Lies die Nutzungsbedingungen von Shadows of War: Konten, virtuelle Gegenstände und keine Rückerstattungen, Verhalten, Haftung und Streitbeilegung."
terms_eyebrow = "Bedingungen"
terms_heading = "Nutzungs-"
terms_heading_em = "bedingungen."
terms_updated = "Zuletzt aktualisiert: September 2026 · World of Unreal"
terms_acceptance_title = "Annahme und Berechtigung"
terms_acceptance_body = "Diese Bedingungen sind eine verbindliche Vereinbarung zwischen dir und World of Unreal über die Nutzung von Shadows of War auf shadowsofwar.io, Partnerplattformen und nativen Clients. Durch Spielen, Installieren oder Zugreifen auf den Dienst stimmst du zu. Wenn du nicht zustimmst, nutze den Dienst nicht."
terms_acceptance_age = "Du musst mindestens 13 Jahre alt sein. Spieler von 13 bis 17 dürfen nur mit Erlaubnis und Aufsicht eines Elternteils oder Erziehungsberechtigten spielen. Der Dienst richtet sich nicht an Kinder unter 13."
terms_changes_title = "Änderungen am Spiel und Dienst"
terms_changes_body = "Multiplayer benötigt Netzwerkzugang zu unseren Servern. Wir können jeden Teil des Dienstes — Modi, Karten, Saisons, Ranglisten und Events — jederzeit mit oder ohne Hinweis ändern, aussetzen oder einstellen, ohne dir gegenüber zu haften."
terms_accounts_title = "Konten"
terms_accounts_body = "Anonymes Spielen erstellt eine kanonische Konto-ID mit Anzeigenamen, die auf deinem Gerät gespeichert wird. Das Löschen des Website-Speichers erstellt ein neues Konto; Umbenennungen ändern die Konto-ID nie. Die Konto-ID dient der Fortschrittssuche und ist kein Passwort — sichere dein Gerät."
terms_accounts_contact = "Du bist für alle Aktivitäten unter deinem Konto verantwortlich. Melde vermuteten unbefugten Zugriff an"
terms_license_title = "Lizenz und Einschränkungen"
terms_license_body = "Diese Bedingungen regeln den Zugang zum offiziellen gehosteten Dienst, zu Konten, virtuellen Gegenständen und Serverdaten. Der vollständige Spielquellcode steht separat unter AGPL-3.0-only einschließlich OpenFronts zusätzlicher Bedingungen. Diese Bedingungen schränken die Rechte aus dieser Codelizenz oder den gesonderten Kartenlizenzen nicht ein."
terms_maps_before = "OpenFront-abgeleitete Kartenquellen und daraus erzeugte Kartendateien stehen unter"
terms_maps_license = "CC BY-SA 4.0"
terms_maps_after = "Der Kartenhinweis nennt Quellen, Namensnennung und Änderungen:"
terms_maps_notice = "Kartenhinweis"
terms_license_no_sell = "Der offizielle gehostete Dienst, Konten und virtuelle Gegenstände dürfen nicht verkauft, vermietet, unterlizenziert oder kommerziell verwertet werden."
terms_license_no_reverse = "Der offizielle gehostete Dienst darf nicht zurückentwickelt, automatisiert ausgelesen, massenhaft extrahiert oder zum Modelltraining verwendet werden. Diese Beschränkungen schmälern keine Rechte aus den Code- oder Kartenlizenzen."
terms_license_feedback = "Geteiltes Feedback darf frei und ohne Vergütung oder Namensnennung genutzt werden."
terms_virtual_title = "Virtuelle Gegenstände und keine Rückerstattung"
terms_virtual_body = "Gems, Anführer-Freischaltungen und Skins sind ausschließlich lizenzierte virtuelle Gegenstände: ohne Geldwert, nicht übertragbar und widerrufbar. Anführer-Freischaltungen verändern das Spiel, haben eigene Vorteile und sind nicht rein kosmetisch."
terms_sales_final = "ALLE VERKÄUFE SIND ENDGÜLTIG."
terms_virtual_refunds = "Virtuelle Gegenstände sind im gesetzlich größtmöglichen Umfang nicht erstattungs- oder ersetzbar, auch bei benutzten oder unerwünschten Gegenständen, Dienständerungen oder Kontomaßnahmen wegen Verstößen. Wenn eine Plattform einen Kauf rückgängig macht, können wir die entsprechenden Gegenstände entfernen und Kontomaßnahmen ergreifen."
terms_conduct_title = "Spielerverhalten"
terms_conduct_cheating = "Kein Cheaten, keine Bots, Makros, Automatisierung, Bug-Exploits oder absichtlichen Desynchronisierungen."
terms_conduct_harassment = "Keine Belästigung, Drohungen, Hassprovokation oder Veröffentlichung privater Daten. Namen, Tags und Chat müssen dem Gesetz entsprechen."
terms_conduct_servers = "Störe keine Server, sondiere keine Infrastruktur und greife nicht auf Konten, Zugangsdaten oder Tickets anderer Spieler zu."
terms_conduct_after = "Verstöße können zur Entfernung von Inhalten, zum Verlust der Partie oder zur Sperrung bzw. Beendigung führen."
terms_third_party_title = "Drittanbieterdienste und andere Spieler"
terms_third_party_body = "Partnerplattformen und ihre SDKs, Zahlungsanbieter, Discord und Telegram sind Dritte, die wir nicht kontrollieren; ihre eigenen Bedingungen gelten und du nutzt sie auf eigenes Risiko. Interaktionen mit anderen Spielern erfolgen ausschließlich zwischen dir und ihnen. Im gesetzlich größtmöglichen Umfang stellst du World of Unreal von Ansprüchen aus Drittparteien oder anderen Spielern frei."
terms_termination_title = "Beendigung"
terms_termination_body = "Wir können deinen Zugriff — Konten, Gegenstände und Ranglisteneinträge — jederzeit aus beliebigem Grund, einschließlich vermuteter Verstöße, ohne Haftung sperren oder beenden. Mit der Beendigung endet deine Lizenz und virtuelle Gegenstände verfallen ohne Rückerstattung."
terms_disclaimer_title = "Haftungsausschlüsse"
terms_disclaimer_body = "DER DIENST WIRD WIE BESEHEN UND NACH VERFÜGBARKEIT BEREITGESTELLT. IM GESETZLICH GRÖSSTMÖGLICHEN UMFANG SCHLIESSEN WIR ALLE GARANTIEN AUS, EINSCHLIESSLICH MARKTGÄNGIGKEIT, EIGNUNG FÜR EINEN BESTIMMTEN ZWECK, RECHTSTITEL UND NICHTVERLETZUNG. Wir garantieren keinen ununterbrochenen, fehlerfreien oder sicheren Betrieb und keine Erhaltung von Fortschritt, Rängen oder Gegenständen."
terms_liability_title = "Haftungsbeschränkung"
terms_liability_body = "IM GESETZLICH GRÖSSTMÖGLICHEN UMFANG HAFTEN WIR NICHT FÜR ENTGANGENE GEWINNE, VERLORENE DATEN, GEGENSTÄNDE ODER FORTSCHRITT SOWIE INDIREKTE ODER FOLGESCHÄDEN. UNSERE GESAMTHAFTUNG IST AUF DEN HÖHEREN BETRAG AUS 50 USD UND DEINEN ZAHLUNGEN FÜR VIRTUELLE GEGENSTÄNDE IN DEN SECHS MONATEN VOR DEM VORFALL BEGRENZT."
terms_indemnification_title = "Freistellung"
terms_indemnification_body = "Du erklärst dich bereit, World of Unreal gegen Ansprüche und angemessene Kosten zu verteidigen und freizustellen, die aus deiner Nutzung, einem Verstoß gegen diese Bedingungen oder gegen das Gesetz entstehen."
terms_arbitration_title = "Streitigkeiten und Schiedsverfahren"
terms_arbitration_before = "Streitigkeiten werden nach einem 45-tägigen Versuch einer informellen Lösung einem verbindlichen individuellen Schiedsverfahren (JAMS, Delaware) und nicht einem Gericht zugeführt. Du verzichtest auf Geschworenenverfahren und Sammelklagen. Bagatellklagen und IP-Unterlassungen sind ausgenommen. Du kannst innerhalb von 30 Tagen nach der ersten Annahme dieser Bedingungen per E-Mail an"
terms_arbitration_after = "mit Konto-ID und eindeutiger Erklärung widersprechen."
terms_general_title = "Allgemeines"
terms_general_before = "Es gilt das Recht von Delaware; Ansprüche außerhalb eines Schiedsverfahrens werden ausschließlich vor Gerichten in Delaware verhandelt. Wesentliche Änderungen kündigen wir deutlich vor ihrem Inkrafttreten an. Wenn geltendes Recht eine erneute Zustimmung verlangt, bitten wir separat darum. Kontakt: World of Unreal —"
terms_privacy_title = "Datenschutz"
terms_privacy_before = "Datenverarbeitung, Rechte und Löschung werden in unserer"
terms_privacy_and = "und unserer"
terms_privacy_after = "beschrieben und durch Verweis in diese Bedingungen aufgenommen."
analytics_title = "Optionale Analyse"
analytics_body = "Wir nutzen Aktivitäten auf der Website und im Spiel, um Shadows of War zu verbessern. Ohne deine Zustimmung bleibt die Analyse aus."
analytics_policy = "Cookie-Details"
analytics_accept = "Erlauben"
analytics_reject = "Ablehnen"
analytics_manage = "Cookie-Einstellungen"
privacy_analytics_body_v2 = "Optionale eigene Analysen auf unserer Website und im Browserspiel laufen nur, wenn du sie erlaubst. Der Spielstart allein aktiviert sie nicht. Erfasst werden festgelegte Ereignisse zu Besuch, Laden, Menü, Tutorial, Lobby, Spielstart und Spielende sowie Build, Sprache und eine grobe Bildschirmklasse, kein vollständiger Gerätefingerabdruck. Falls eine Konto-ID vorliegt, ersetzt unser Server sie vor der Speicherung durch ein für diesen Kanal verschlüsseltes Pseudonym. Namen, Nachrichten, Passwörter, Werbe-IDs und Kartenklicks werden nicht erfasst."
privacy_cookies_body_v2 = "Deine Wahl zu Analysen speichern wir im lokalen Speicher. Eine vorübergehende Analyse-Sitzungs-ID und eine kleine Warteschlange für erneute Übertragungen werden erst nach deiner Zustimmung im Sitzungsspeicher angelegt. Eine Ablehnung beeinträchtigt das Spiel nicht. Spieleinstellungen, Kontofortbestand und zwischengespeicherte Ressourcen nutzen getrennten Speicher, der für diese Funktionen erforderlich ist. Einzelheiten und Einstellungen findest du in unserem"
privacy_retention_body_v2 = "Ereignisdateien, Analysezähler und Zuordnungen werden innerhalb von 90 Tagen gelöscht. Nach bestätigter Kontolöschung entfernen wir verknüpfte Ereignisse und Konto-Zuordnungen; nicht identifizierbare Tageswerte bleiben höchstens bis zum Ablauf derselben 90 Tage bestehen. Konten und Spielverläufe bleiben erhalten, bis du ihre Löschung beantragst oder das Konto gemäß den Bedingungen beendet wird."
privacy_updated_v2 = "Zuletzt aktualisiert: 6. Oktober 2026 · Verantwortlich: World of Unreal · Kontakt: hello@shadowsofwar.io"
cookies_analytics_title = "Optionale Analysen auf unserer Website und im Browserspiel"
cookies_analytics_events = "Gezählt werden Besuche, Ladephasen, Menüaktionen, Tutorial-Fortschritt, Lobby-Beitritte, Spielstarts und ausdrückliche Spielausstiege sowie eine grobe Bildschirmklasse. Namen, Chat, Passwörter, Lobby-IDs, Käufe, Kartenklicks und der vollständige User-Agent werden nicht erfasst."
cookies_analytics_server = "Erlaubte Ereignisse gehen direkt an unseren eigenen Server unter /api/event und nicht über das Spiel-Relay. Eine übermittelte Konto-ID ersetzt unser Server vor der Speicherung durch ein nur für diese Website verwendetes Pseudonym."
cookies_storage_title = "Browser-Speicher und Aufbewahrung"
cookies_storage_body = "Deine Zustimmung oder Ablehnung speichern wir lokal. Erst nach Zustimmung werden eine vorübergehende Sitzungs-ID und eine kleine Warteschlange für erneute Übertragungen im Sitzungsspeicher abgelegt. Analysen enthalten Build, Sprache und eine grobe Bildschirmklasse, nicht den vollständigen User-Agent. Ereignisdateien und Zuordnungen laufen innerhalb von 90 Tagen ab; nach bestätigter Kontolöschung entfernen wir verknüpfte Ereignisse und Zuordnungen. Spieleinstellungen, Kontofortbestand, Wiederherstellung nach Abstürzen und zwischengespeicherte Ressourcen verwenden getrennten, dafür benötigten Speicher."
cookies_platforms_title = "Andere Spieleplattformen"
cookies_platforms_body = "Poki, CrazyGames und Jest können die Nutzung mit ihren eigenen SDKs und gemäß ihren Plattformbedingungen messen. Wir kopieren diese spielerbezogenen Ereignisse nicht auf unseren Server. Eigene Analysen für Android bleiben deaktiviert, bis die Store-Datenschutzhinweise aktualisiert sind."
cookies_controls_v2 = "Du kannst optionale Analysen gleich einfach erlauben oder ablehnen. Der Spielstart gilt nicht als Zustimmung. Ändere deine Wahl in den Spieleinstellungen oder hier; eine Ablehnung beeinflusst das Spiel nicht. Wenn du Websitedaten löschst, wird auch deine Wahl entfernt und Analysen bleiben aus, bis du sie erneut erlaubst. Wir verkaufen oder teilen Analysedaten nicht zu Werbezwecken."
cookies_description_v2 = "Optionale Produktanalysen bleiben ausgeschaltet, bis du sie erlaubst. Der Spielstart aktiviert sie nicht. Erfahre, welche Daten Shadows of War speichert und wie du deine Wahl ändern kannst."
cookies_og_description_v2 = "Optionale Analysen bleiben ausgeschaltet, bis du sie erlaubst. Du kannst deine Wahl jederzeit ändern."
cookies_updated_v2 = "Zuletzt aktualisiert: 6. Oktober 2026 · World of Unreal"
