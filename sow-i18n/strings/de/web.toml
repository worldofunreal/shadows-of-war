how_eyebrow = "So wird gespielt"
how_heading = "Nimm die"
how_heading_em = "Karte."
how_lede = "Shadows of War ist ein MMORTS in Partien. Beginne mit einem Kommandanten, verwandle Gebiet in eine Wirtschaft, schließe vorübergehende Allianzen und kämpfe um die Kontrolle der Karte."
getting_started = "Erste Schritte"
how_steps_heading_1 = "Fünf Schritte"
how_steps_heading_2 = "zum Verständnis"
how_steps_heading_3 = "der Partie."
how_step_1_title = "Matchmaking beitreten und Modus wählen"
how_step_1_body = "Betritt die aktive Matchmaking-Lobby. Die Warteschlange wechselt zwischen Jeder gegen jeden (FFA), Teamkämpfen und Menschen gegen Weltnationen auf Karten in Europa, Asien, Afrika, East Anglia und den Amerikas."
how_step_2_title = "Kommandanten und zivilisatorischen Vorteil wählen"
how_step_2_body = "Wähle einen von zwölf historischen Kommandanten. Jeder Anführer bietet einen dauerhaften Multiplikator, etwa Julius Caesars 1,10x Kampfstärke, Cleopatras +50 % Fabrikgold, Sun Tzus 20 % schnellere Truppenproduktion oder Ragnars +50 % Hafengold."
compare_leader_traits = "Anführertalente vergleichen"
how_step_3_title = "Gebiet beanspruchen und Spezialdistrikte bauen"
how_step_3_body = "Erweitere dich und erobere angrenzende Felder. Jedes eroberte Feld steigert Gold und Truppeneinkommen. Baue spezialisierte Gebäude in deinem Gebiet:"
city_label = "Städte:"
city_body = "Erhöhen die maximale Truppenkapazität und erzeugen passives Truppen- und Goldeinkommen."
factory_label = "Fabriken:"
factory_body = "Erzeugen Gold und erhöhen die Rekrutierungsgeschwindigkeit."
port_label = "Häfen:"
port_body = "Liegen an Küsten und erzeugen Gold, Truppen und Wasserzugang."
bunker_label = "Bunker:"
bunker_body = "Befestigen Verteidigungsgrenzen, erweitern die Deckung und verringern eingehende Truppenverluste. Stadt-Waffenmodule erhöhen die maximale Kapazität."
how_step_4_title = "Wirtschaft, Gelände und Armeedruck verwalten"
how_step_4_body = "Eroberungen verbrauchen Truppen. Investiere Gold aus Fabriken, Städten und Häfen in weitere Bauten. Nutze Geländemultiplikatoren, um Grenzen zu sichern und den Armeedruck auf wertvolle Ziele zu richten."
how_step_5_title = "Diplomatie, Verrat und Sieg durch Kartenkontrolle"
how_step_5_body_before = "Bilde Nichtangriffspakte mit Nachbarn, um Fronten zu koordinieren. Ein Spieler gewinnt beim Erreichen des"
how_step_5_threshold = "Siegschwellenwerts für Kartenkontrolle"
how_step_5_body_after = "(der erforderlichen Mehrheit der Gesamtfläche) oder wenn alle gegnerischen Kommandanten ausgeschaltet sind. Verrat beendet die Allianz sofort und macht gemeinsame Grenzen zu aktiven Fronten."
