boudica_rise_title = "Aufstieg des Iceni"
boudica_rise_body = "Willkommen zur Kampagne. Beginnen Sie damit, nicht beanspruchtes Land jenseits Ihrer Grenze zu erschließen, um Territorium zu erobern. Jede Kachel erzeugt Truppen und Gold."
boudica_rise_hint = "Nicht beanspruchtes Land anzapfen, um Territorium zu erweitern"
boudica_warband_title = "Wachsen Sie die Warband"
boudica_warband_body = "Territory skaliert Ihre Wirtschaft. Expansion nach außen, um die Truppenerzeugung und die Goldeinnahmen zu erhöhen."
boudica_warband_hint = "Erweitern Sie sich auf 1.024 Kacheln"
boudica_contact_title = "Erster Kontakt"
boudica_contact_body = "Feindliche Außenposten kontrollieren angrenzendes Territorium. Wähle deine Streitkräfte und ziehe dich in feindliche Grenzen, um anzugreifen."
boudica_contact_hint = "Ziehen Sie, um einen Außenposten anzugreifen - besiegen Sie 1 Feind"
boudica_unite_title = "Vereinigen Sie den Osten"
boudica_unite_body = "Neutralisieren Sie die umliegenden regionalen Außenposten, um die Ostfront unter Ihrem Banner zu sichern."
boudica_unite_hint = "Besiege 4 regionale Außenposten"
boudica_camulodunum_title = "Belagerung von Camulodunum"
boudica_camulodunum_body = "Umgeben Sie Camulodunum und schneiden Sie Verstärkungen ab, um die Siedlung zu erobern."
boudica_camulodunum_hint = "Erfassen Camulodunum nach Süden"
boudica_londinium_title = "Vormarsch auf Londinium"
boudica_londinium_body = "Londinium kontrolliert den Zentralhandel. Erobern Sie die Siedlung, um den Flussübergang zu sichern."
boudica_londinium_hint = "Erfassung Londinium"
boudica_verulamium_title = "Erfassung Verulamium"
boudica_verulamium_body = "Verulamium sitzt auf Watling Street. Erobern Sie die Siedlung, um imperiale Versorgungslinien zu schneiden."
boudica_verulamium_hint = "Erfassung Verulamium"
boudica_ninth_title = "Hinterhalt der Neunten"
boudica_ninth_body = "Legio IX Hispana rückt aus dem Norden vor. Abfangen und besiegen seine Kräfte."
boudica_ninth_hint = "Legio IX Hispana abfangen"
boudica_final_title = "Die letzte Schlacht"
boudica_final_body = "Du hast Expansion, Kampf und Belagerung gemeistert. Besiegen Sie Suetonius Paulinus und kehren Sie dann zum Menü zurück."
boudica_final_hint = "Besiegen Sie Paulinus, dann kehren Sie zum Menü zurück"
six_sky_ep1_landfall_title = "Landung"
six_sky_ep1_landfall_body = "682 CE. Sie sind Wak Chanil Ajaw, Tochter von Dos Pilas, kommen, um Naranjo zu regieren. Beanspruchen Sie Land jenseits Ihrer Grenze."
six_sky_ep1_landfall_hint = "Nicht beanspruchtes Land zu erweitern"
six_sky_ep1_fire_title = "Heiliges Feuer"
six_sky_ep1_fire_body = "Wachsen Sie Ihren Boden - jede Fliese füttert Ihre Truppen und Gold."
six_sky_ep1_fire_hint = "Erweitern Sie, um 512 Kacheln zu erreichen"
six_sky_ep1_blood_title = "Erstes Blut"
six_sky_ep1_blood_body = "Kleine Dörfer halten das Ufer. Ziehe dich in eine feindliche Grenze, um anzugreifen und deinen ersten Rivalen zu nehmen."
six_sky_ep1_blood_hint = "Drag to attack – 1 Gegner besiegen"
six_sky_ep1_villages_title = "Die Dörfer knien"
six_sky_ep1_villages_body = "Die Dörfer am See müssen den Namen der neuen Dynastie lernen. Unterwerfen Sie sie alle."
six_sky_ep1_villages_hint = "Besiege 4 Dörfer"
six_sky_ep1_rival_title = "Das alte Blut"
six_sky_ep1_rival_body = "Ein Antragsteller der alten Linie von Naranjo verweigert Ihr Recht. Beende den rivalisierenden Erben."
six_sky_ep1_rival_hint = "Besiege den Rivalen"
six_sky_ep1_caracol_title = "Brechen Sie den Breaker"
six_sky_ep1_caracol_body = "Caracol verließ Naranjo schon einmal königslos. Seine Garnison muss fallen."
six_sky_ep1_caracol_hint = "Niederlage Caracol"
six_sky_ep1_vanguard_title = "Tikal Augen"
six_sky_ep1_vanguard_body = "Tikal wacht durch seine Vorhut. Nimm seinen Vorwärtsposten."
six_sky_ep1_vanguard_hint = "Besiegen Sie den Tikal Vanguard"
six_sky_ep1_queen_title = "Königin von Naranjo"
six_sky_ep1_queen_body = "Tikal selbst Lager in der Nähe. Brechen Sie es, und Ihre Linie ist sicher."
six_sky_ep1_queen_hint = "Niederlage Tikal"
six_sky_ep2_regent_title = "Statthalter"
six_sky_ep2_regent_body = "693 CE. Ihr fünfjähriger Sohn ist König von Naranjo, und Sie regieren in seinem Namen. Erweitere und zeige Stärke."
six_sky_ep2_regent_hint = "Nicht beanspruchtes Land zu erweitern"
six_sky_ep2_provinces_title = "Die Provinzen Stir"
six_sky_ep2_provinces_body = "Rebellion gären in den Dörfern. Schlag zuerst - nimm zwei Rivalen, bevor sie sich vereinen."
six_sky_ep2_provinces_hint = "Besiege 2 Feinde"
six_sky_ep2_uaxactun_title = "Erstes Feuer: Uaxactun"
six_sky_ep2_uaxactun_body = "Uaxactun Rebellen. Verbrennt seinen Trotz aus."
six_sky_ep2_uaxactun_hint = "Niederlage Uaxactun Rebellen"
six_sky_ep2_yaxha_title = "Zweites Feuer: Yaxha"
six_sky_ep2_yaxha_body = "Yaxha steigt als nächstes. Zwinge sie, ihre Treue zu bekräftigen."
six_sky_ep2_yaxha_hint = "Niederlage Yaxha Rebellen"
six_sky_ep2_tayasal_title = "Drittes Feuer: Tayasal"
six_sky_ep2_tayasal_body = "Ein Regent, der Tayasal nicht halten kann, kann Naranjo nicht halten."
six_sky_ep2_tayasal_hint = "Niederlage Tayasal Rebellen"
six_sky_ep2_seibal_title = "Viertes Feuer: Seibal"
six_sky_ep2_seibal_body = "Die Kanus von Seibal tragen Rebellion flussabwärts. Versenken Sie ihren Trotz."
six_sky_ep2_seibal_hint = "Niederlage Seibal Rebellen"
six_sky_ep2_caracol_title = "The Breaker kehrt zurück"
six_sky_ep2_caracol_body = "Caracol unterstützt die Rebellen. Begleiche die älteste Schuld deiner Herrschaft."
six_sky_ep2_caracol_hint = "Niederlage Caracol"
six_sky_ep2_total_title = "Bestätigen oder Brennen"
six_sky_ep2_total_body = "Gewinnen Sie, bis jeder Nachbar die Regentschaft versteht."
six_sky_ep2_total_hint = "Besiege insgesamt 8 Gegner"
six_sky_ep2_coalition_title = "Die Koalition bricht"
six_sky_ep2_coalition_body = "Tikal versammelte Ihre Feinde in einer Koalition. Brechen Sie es, und keine Stadt wird an der Regentschaft zweifeln."
six_sky_ep2_coalition_hint = "Besiegen Sie die Tikal Koalition"
six_sky_ep3_count_title = "Der lange Count"
six_sky_ep3_count_body = "Die Jahre haben Sie Legende und Ziel beide gemacht. Noch einmal expandieren."
six_sky_ep3_count_hint = "Nicht beanspruchtes Land zu erweitern"
six_sky_ep3_offerings_title = "Angebote"
six_sky_ep3_offerings_body = "Götter und Soldaten fordern beide Tribut. Nehmen Sie zwei Rivalen, um die Altäre und die Wache zu füttern."
six_sky_ep3_offerings_hint = "Besiege 2 Feinde"
six_sky_ep3_unknown_title = "Der unbekannte Feind"
six_sky_ep3_unknown_body = "Die Schriftgelehrten streiten sich immer noch darüber, woher K'inichil Kab regiert. Besiege es."
six_sky_ep3_unknown_hint = "Niederlage K'inichil Kab"
six_sky_ep3_caracol_title = "Kriegsheer"
six_sky_ep3_caracol_body = "Caracol schickt einen vollen Kriegswirt, seinen letzten Wurf gegen Ihre Linie. Zerstöre es."
six_sky_ep3_caracol_hint = "Besiegen Sie den Caracol War Host"
six_sky_ep3_hill_title = "Der Hügel"
six_sky_ep3_hill_body = "Xunantunich auf seinem Hügel Bögen zu keinem Regenten. Machen Sie den Hügel Bogen."
six_sky_ep3_hill_hint = "Niederlage Xunantunich Rebellen"
six_sky_ep3_moon_title = "Mondgöttin"
six_sky_ep3_moon_body = "726 CE. Halten Sie eine große Domäne würdig der Mondgöttin."
six_sky_ep3_moon_hint = "Erweitern Sie sich auf 1.024 Kacheln"
six_sky_ep3_vanguard_title = "Vanguard bei Dusk"
six_sky_ep3_vanguard_body = "Tikal Avantgarde kommt in der Dämmerung. Zeigen Sie ihnen die Stela 24 Königin."
six_sky_ep3_vanguard_hint = "Besiegen Sie den Tikal Vanguard"
six_sky_ep3_tribute_title = "Tribut verweigert"
six_sky_ep3_tribute_body = "Tikal fordert ein letztes Mal Tribut von Naranjo. Antworte mit Krieg."
six_sky_ep3_tribute_hint = "Besiege insgesamt 6 Gegner"
six_sky_ep3_legacy_title = "Vermächtnis in Stein"
six_sky_ep3_legacy_body = "Besiegen Sie Tikal und lassen Sie die Linie Naranjo in Stein stehen."
six_sky_ep3_legacy_hint = "Niederlage Tikal"

