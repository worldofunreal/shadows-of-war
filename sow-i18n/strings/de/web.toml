privacy_title = "Datenschutzerklärung — Shadows of War"
privacy_description = "Lies die Datenschutzrichtlinie für Spieler von Shadows of War: Verantwortlicher, erhobene Daten, Weitergabe, 90-Tage-Aufbewahrung, Rechte und Löschung."
