leader_caesar_mechanics = "Verringert Truppenverluste bei Gebietseroberungen und umkämpften Grenzkämpfen. Caesar setzt Einheiten effizienter gegen neutrale Verteidiger und feindliche Grenzen ein."
leader_cleopatra_mechanics = "Beschleunigt die Goldproduktion industrieller Cluster. Überschüssiges Gold ermöglicht das schnelle Platzieren zusätzlicher Städte, Bunker und Verbesserungen."
leader_ragnar_mechanics = "Belohnt Küstenexpansion. Häfen an Wassergrenzen erzeugen hohe Goldgewinne und ermöglichen den Zugang zu Wasserfeldern."
leader_suntzu_mechanics = "Erhöht das Rekrutierungstempo der Fabriken. Beschleunigt die Erholung der Armee nach großen Schlachten."
leader_alexander_mechanics = "Erhöht die Eroberungsrate pro Simulationszyklus. Ermöglicht schnelle Expansion in neutrales Gebiet und frühe Grenzsicherung."
leader_genghiskhan_mechanics = "Macht aus Kampfsiegen Einkommen für die Schatzkammer. Das Besiegen entwickelter Armeen und Strukturen bringt Gold zurück in deine Wirtschaft."
leader_richard_mechanics = "Erhöht das Truppenlimit für jeden platzierten Stadtdistrikt. So kannst du große stehende Armeen vor Grenzoffensiven sammeln."
leader_vercingetorix_mechanics = "Steigert die grundlegende Truppenregeneration aus Städten. Die passive Mannstärke wächst mit der Urbanisierung des Gebiets."
leader_boudica_mechanics = "Erhöht den Goldertrag von Stadtdistrikten. Ermöglicht eine Wirtschaft aus Bevölkerungszentren statt aus eigenen Fabriken."
leader_ladysixsky_mechanics = "Maximiert die Goldeffizienz industrieller Fabriken. Erzeugt hohe Einnahmen für Expansion und Verteidigungsstrukturen."
leader_leonidas_mechanics = "Erhöht die maximale Armeekapazität durch Waffenmodule in Stadtdistrikten. Bunker bleiben Verteidigungsstrukturen und geben Leonidas' Kapazitätsbonus nicht."
leader_napoleon_mechanics = "Der höchste Expansionstempo-Multiplikator im Spiel. Beansprucht neutrales Gebiet schnell und beschleunigt den Grenzvorstoß."
