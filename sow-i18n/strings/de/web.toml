leader_hiawatha_haudenosaunee_description = "Wenn zwei deiner Verbündeten ein neues Bündnis miteinander schließen, werden deine beiden befristeten Bündnisse mit ihnen auf ihre volle Dauer verlängert. Einmal pro Paar und Partie."

leader_kaahumanu_hawaii_ability = "Gemeinsame Tafel"
leader_kaahumanu_hawaii_description = "Wenn du einem Verbündeten erstmals mindestens 500 Truppen sendest und ihr beide einen aktiven Hof habt, erhaltet ihr jeweils 25 % der gesendeten Truppen als Verstärkung, höchstens 500 pro Person und bis zum jeweiligen Truppenlimit."

leader_sargon_of_akkad_ability = "Garnisonen von Akkad"
leader_sargon_of_akkad_description = "Wenn du eine aktive feindliche Stadt eroberst und im Umkreis von 12 Feldern keinen eigenen Turm hast, errichtest du am nächsten gültigen eigenen Standort in diesem Umkreis kostenlos einen Turm der Stufe 1. Einmal pro eroberter Stadt."

leader_mithridates_vi_ability = "Tigranes’ Hilfe"
leader_mithridates_vi_description = "Wenn ein Verbündeter eine aktive Stadt hat und du dich nach mindestens 3 Sekunden aus einem Landangriff gegen einen Rivalen zurückziehst, erhältst du ebenso viele Verstärkungen wie zurückkehrende Truppen, höchstens 1.000 und bis zum Truppenlimit. Einmal pro Partie."

leader_gudit_yodit_ability = "Flucht aus Aksum"
leader_gudit_yodit_description = "Wenn du eine aktive feindliche Stadt eroberst, muss das größte Landheer ihres früheren Besitzers, das gerade einen Spieler angreift, den Rückzug antreten. Einmal pro eroberter Stadt."

leader_khutulun_qaidu_ability = "Gefangennahme im Galopp"
leader_khutulun_qaidu_description = "Wenn du einen Landangriff gegen einen Rivalen startest, der dich bereits zu Land angreift, rekrutierst du 20 % der im ersten Zusammenstoß besiegten Truppen für deine Reserve, bis zu deinem Truppenlimit."

leader_sor_juana_ines_de_la_cruz_ability = "Küchenphilosophie"
leader_sor_juana_ines_de_la_cruz_description = "Wenn du den Ausbau eines Hofes abschließt, halbiert sich die verbleibende Dauer deines nächstgelegenen laufenden Stadtausbaus im Umkreis von 12 Feldern."

leader_sibylla_ability = "Die zweite Krone"
leader_sibylla_description = "Wenn du mit einer aktiven Stadt ein neues Bündnis schließt, wird die älteste im Bau befindliche Stadt deines neuen Verbündeten sofort fertiggestellt, sofern er keine aktive Stadt besitzt. Einmal pro Partie."

leader_cynethryth_mercia_ability = "Abkommen von Cookham"
leader_cynethryth_mercia_description = "Wenn ein Rivale einen deiner aktiven Höfe erobert, steigt deine fertiggestellte Stadt mit der niedrigsten Stufe im Umkreis von 12 Feldern um eine Stufe, höchstens auf Stufe 4. Einmal pro Hof."

leader_suppiluliuma_ability = "Pakt von Mitanni"
leader_suppiluliuma_description = "Deine Landheere verlieren bei der Einnahme feindlicher Felder 25 % weniger Soldaten, wenn die Felder an das Gebiet eines Verbündeten grenzen, der denselben Gegner gerade ebenfalls an Land angreift."

leader_baibars_ability = "Sappeure des Krak"
leader_baibars_description = "Wenn du einen aktiven feindlichen Turm einnimmst, zerstörst du den nächstgelegenen aktiven Turm desselben Gegners innerhalb von 12 Feldern, dessen aktive Stufe niedriger ist. Einmal pro eingenommenem Turm und Partie."

leader_emperor_qin_shi_huang_ability = "Kaiserliche Maße und Gewichte"
leader_emperor_qin_shi_huang_description = "Solange deine Städte, Fabriken und Höfe jeweils gleich viele aktive Stufen haben und diese Summe größer als null ist, erzeugen deine Fabriken 25 % mehr Gold und deine Höfe 25 % mehr Truppen."

leader_spartacus_ability = "Waffenlager von Thurioi"
leader_spartacus_description = "Wenn dein Landheer das Zentrum einer aktiven feindlichen Fabrik einnimmt, erhält es 300 Soldaten pro aktiver Fabrikstufe. Einmal pro Fabrik und Partie."

leader_queen_nefertiti_ability = "Talatat von Amarna"
leader_queen_nefertiti_description = "Stadtaufwertungen kosten 35 % weniger Gold, wenn du höchstens 12 Felder von der Stadt entfernt eine aktive Fabrik besitzt."

leader_mandukhai_ability = "Wiedervereinigung der Steppe"
leader_mandukhai_description = "Wenn du einen Rivalen durch die Eroberung seines verbliebenen Gebiets besiegst, rekrutierst du 25 % seiner verbliebenen Reservetruppen bis zu deinem Truppenlimit."

leader_kabal_xook_ability = "Kriegsinsignien von Yaxchilán"
leader_kabal_xook_description = "Mit einer aktiven Stadt und mindestens 750 Soldaten in Reserve stellst du 750 deiner Soldaten, sobald ein Verbündeter einen neuen Landangriff gegen einen gemeinsamen Rivalen beginnt. Einmal pro Verbündetem und Partie."

leader_lakshmibai_ability = "Schanze von Kalpi"
leader_lakshmibai_description = "Erobert ein Rivale deine letzte aktive Stadt, entsteht kostenlos eine Stadt der Stufe 1 auf dem nächsten gültigen Bauplatz in deinem Gebiet im Umkreis von 24 Feldern um die verlorene Stadt. Einmal pro Partie."

leader_pharaoh_hatshepsut_ability = "Gärten von Punt"
leader_pharaoh_hatshepsut_description = "Erreicht dein Handelsschiff einen fremden Hafen, steigt dein fertiger Bauernhof mit der niedrigsten Stufe im Umkreis von 12 Feldern um den Abfahrtshafen um eine Stufe, höchstens bis Stufe 4. Einmal pro Abfahrtshafen."

leader_thusnelda_cherusci_ability = "Unbeugsam in Gefangenschaft"
leader_thusnelda_cherusci_description = "Erobert ein Rivale eine deiner Städte mit aktiver Stufe 2 oder höher, verliert sie eine fertige Stufe. Ein laufender Ausbau wird abgebrochen. Einmal pro Stadt."

leader_queen_cartimandua_ability = "Auslieferung des Caratacus"
leader_queen_cartimandua_description = "Zieht sich ein feindliches Landheer aus deinem Gebiet zurück, erhält der Verbündete mit dem größten aktiven Landheer gegen diesen Feind und freien Reserveplätzen 25 Prozent der Überlebenden. Der Überschuss kehrt zum Feind zurück."

leader_queen_suriyothai_ability = "Geleit von Ayutthaya"
leader_queen_suriyothai_description = "Will ein feindliches Landheer das Zentrum einer aktiven verbündeten Stadt einnehmen, setze 1.500 Reservetruppen ein, um den Versuch zu stoppen und bis zu 1.500 Angreifer auszuschalten. Einmal pro verbündeter Stadt."

leader_tarabai_ability = "Chauth im Gegenangriff"
leader_tarabai_description = "Erobere den fertigen Turm eines Rivalen, der dich gerade an Land angreift, und nimm ihm 25 Prozent seines Goldes ab, höchstens 250. Einmal pro Turm."

leader_natavan_ability = "Brunnen von Schuscha"
leader_natavan_description = "Wenn eine deiner Städte den Ausbau auf Stufe 2 abschließt, entsteht kostenlos ein Bauernhof der Stufe 1 auf dem nächsten gültigen Bauplatz im Umkreis von 12 Feldern."

leader_mavia_ability = "Frieden des Moses"
leader_mavia_description = "Schließt du während eines Landangriffs zwischen dir und einem Gegner ein Bündnis mit ihm, kehren die Überlebenden beider Seiten ohne Rückzugsverluste bis zum jeweiligen Truppenlimit zurück."

leader_queen_nandi_ability = "Herden von Emkhindini"
leader_queen_nandi_description = "Deine Bauernhöfe erzeugen 25 % mehr Truppen."

