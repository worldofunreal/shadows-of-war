privacy_updated = "Zuletzt aktualisiert: September 2026 · Verantwortlicher: World of Unreal · Kontakt: hello@shadowsofwar.io"
privacy_overview_title = "Überblick und Verantwortlicher"
privacy_overview_body = "Shadows of War wird von World of Unreal betrieben. Diese Richtlinie gilt für shadowsofwar.io, Partnerplattformen und native Clients. Datenschutzkontakt:"
privacy_overview_after = "Wir haben keine Niederlassung in der EU oder im Vereinigten Königreich; sende alle Anfragen, einschließlich DSGVO-Anfragen, direkt dorthin."
privacy_overview_payments = "SDKs von Partnerplattformen können Daten nach ihren eigenen Richtlinien sammeln. Kartendaten werden direkt von dem Store verarbeitet, über den du zahlst (Google Play, Apple oder Stripe); wir sehen keine Kartennummern."
privacy_eligibility_title = "Berechtigung und Kinder"
privacy_eligibility_body = "13+. Spieler von 13 bis 17 Jahren benötigen die Erlaubnis eines Elternteils oder Erziehungsberechtigten. Das Spiel richtet sich nicht an Kinder unter 13; solche Konten werden gesperrt und gelöscht. Eltern: Schreibe an"
privacy_eligibility_after = "und wir löschen das Konto umgehend."
privacy_data_title = "Erhobene Daten"
privacy_gameplay_label = "Spiel:"
privacy_gameplay_body = "Anzeigename, Clan-Tag, Anführer- und Zivilisationsauswahl, Partieaktionen, Verlauf, Ränge und besessene Gegenstände."
privacy_account_label = "Konto:"
privacy_account_body = "zufällige Konto-ID, verknüpfte Plattformidentitäten und ein Einweg-Hash deines Besitzgeheimnisses (niemals der Klartext)."
privacy_technical_label = "Technisch:"
privacy_technical_body = "Build-Version, Plattform/Sprache, Verbindungsmetadaten, Relay-Tickets und Serverprotokolle für Sicherheit und Missbrauchsschutz."
privacy_analytics_label = "Produktanalyse (nur First Party):"
privacy_analytics_body = "Ereignisse aus einer geschlossenen Taxonomie (Besuche, Startphasen, Tutorial, Matchmaking, Partiestart/-ende), verknüpft mit zufälliger Sitzungs- und Konto-ID. Keine Werbe-IDs und kein Drittanbieter."
privacy_purchases_label = "Käufe:"
privacy_purchases_body = "Produkt-ID, Transaktionsreferenz und Berechtigungsstatus über RevenueCat oder den Store. Vollständige Zahlungsdaten bleiben beim Store."
privacy_public_label = "Absichtlich öffentlich:"
privacy_public_body = "Namen, Handles, Ranglisten und Partieverläufe sind für andere Spieler sichtbar."
privacy_use_title = "Nutzung und Rechtsgrundlagen"
privacy_use_body = "Betrieb des Spiels, Sicherheit und Anti-Cheat, Trichter und Zuverlässigkeit, Support und Compliance. EU-/UK-Grundlagen: Vertrag, berechtigte Interessen (niemals verhaltensbasierte Werbung), Einwilligung, wenn gefragt, und gesetzliche Pflicht. Wir verkaufen keine personenbezogenen Daten und verwenden keine Werbe-Tracker."
privacy_sharing_title = "Weitergabe"
privacy_hosting_label = "Hosting nach unseren Anweisungen:"
privacy_hosting_body = "IONOS, Microsoft Azure und Cloudflare."
privacy_payments_label = "Zahlungen:"
privacy_payments_body = "Google Play, Apple oder Stripe über RevenueCat nach deren Richtlinien."
privacy_sdk_label = "Partner-SDKs:"
privacy_sdk_body = "nach deren eigener Richtlinie, wenn du über sie spielst."
privacy_players_label = "Spieler und Öffentlichkeit:"
privacy_players_body = "Namen, Handles, Ränge und Partieverläufe."
privacy_authorities_label = "Behörden und Übertragungen:"
privacy_authorities_body = "wenn gesetzlich vorgeschrieben oder mit Hinweis an einen Rechtsnachfolger."
privacy_cookies_title = "Cookies und lokaler Speicher"
privacy_cookies_body = "Nur unbedingt notwendiger Speicher: Theme-Einstellung, Sitzungs-IDs und unser eigener First-Party-Event-Endpunkt. Keine Werbe-, Social- oder Cross-Site-Cookies. Schriftarten werden selbst gehostet, daher keine Cross-Origin-Anfragen. Details und Einstellungen in unserem"
privacy_retention_title = "Aufbewahrung"
privacy_retention_body = "Ereignisdateien werden nach 90 Tagen automatisch bereinigt; Analysezähler und Mitgliedschaften laufen über einen Schlüssel-TTL innerhalb von 90 Tagen ab. Deployments löschen niemals den Live-Status. Konten und Verlauf bleiben bis zu deiner Löschanfrage oder einer Beendigung nach den Bedingungen bestehen."
privacy_rights_title = "Deine Rechte und Löschung"
privacy_rights_body = "Du kannst zugreifen, korrigieren, löschen, übertragen, widersprechen und einschränken. Schreibe an"
privacy_rights_after = "mit deiner Ingame-Konto-ID (oder Namen und ungefährer Erstellung). Bestätigte Löschungen entfernen Konto, Identitätsverknüpfungen, Metadatenspiegel und Analysezugehörigkeiten; wir bestätigen dies. GPC wird als Widerspruch gegen Verkauf/Weitergabe respektiert (wir verkaufen oder teilen nicht). Einsprüche per Antwort; spätestens innerhalb von 45 Tagen."
privacy_security_title = "Sicherheit, Übertragungen und Änderungen"
privacy_security_body = "TLS bei der Übertragung, interne Komponenten nur über Loopback, Bearer-geschützte Operator-Endpunkte und gehashte Besitzgeheimnisse; keine absolute Garantie. Die Infrastruktur läuft in den USA und der EU mit Datenminimierung und ohne Adtech-Übertragungen. Wesentliche Richtlinienänderungen gelten nach einem deutlichen Hinweis; die weitere Nutzung gilt als Zustimmung."
