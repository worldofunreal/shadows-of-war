<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SOW — Custom Maps</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1114;
        --panel: #111a1d;
        --line: #2d3b3c;
        --text: #e8eeea;
        --muted: #98a7a5;
        --accent: #e9bb64;
        --warn: #ff7770;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.45 var(--sow-ui-font, system-ui),
          Segoe UI,
          Roboto,
          sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px;
      }
      header .sub {
        color: var(--muted);
        margin-bottom: 16px;
      }
      header a {
        color: var(--accent);
        text-decoration: none;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      .map-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .map-row code {
        font-size: 14px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--warn);
        border-radius: 4px;
        background: transparent;
        color: var(--warn);
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .empty,
      .status {
        color: var(--muted);
        margin-top: 12px;
        min-height: 1.5em;
        white-space: pre-wrap;
      }
      .status.error {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Custom Maps on the server</h1>
        <div class="sub">
          <a href="/tools/campaign-editor/">Campaign Studio</a> ·
          <a href="/tools/campaign-editor/map-generator">Map Generator</a> · Maps you uploaded (not the built-in ones)
        </div>
      </header>
      <div id="maps"></div>
      <div id="empty" class="empty" hidden>No custom maps on the server.</div>
      <div id="status" class="status"></div>
    </main>
    <script src="map-manager.ts"></script>
  </body>
</html>
