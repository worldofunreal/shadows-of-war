<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SOW — Entity Atlas</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1114;
        --panel: #111a1d;
        --line: #2d3b3c;
        --text: #e8eeea;
        --muted: #98a7a5;
        --accent: #e9bb64;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        background: #0c1316;
        border: 1px solid #354444;
        border-radius: 4px;
        padding: 7px 9px;
      }
      button {
        cursor: pointer;
        background: linear-gradient(#202d30, #172124);
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #app {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
      }
      #map-panel {
        position: relative;
        min-width: 0;
        background: #101719;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      #toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
        background: #0b1114e8;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      #toolbar button {
        min-width: 36px;
      }
      #toolbar .check {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        white-space: nowrap;
      }
      #toolbar input {
        width: auto;
        margin: 0;
      }
      #map-status {
        position: absolute;
        left: 14px;
        bottom: 12px;
        background: #0b1114df;
        padding: 7px 10px;
        border-radius: 4px;
        color: var(--muted);
        pointer-events: none;
      }
      #side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: linear-gradient(160deg, #172124, #101719 58%, #0d1416);
        border-left: 1px solid #394746;
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--accent);
        text-transform: uppercase;
        margin: 0 0 5px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      .sub,
      .hint {
        color: var(--muted);
        font-size: 11px;
      }
      .tools {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .tools button {
        flex: 1;
      }
      .filters {
        padding: 10px 12px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        border-bottom: 1px solid var(--line);
      }
      #search {
        grid-column: 1/-1;
      }
      .filters select {
        min-width: 0;
      }
      #count {
        padding: 7px 12px;
        color: var(--muted);
        font-size: 11px;
        border-bottom: 1px solid var(--line);
      }
      #list {
        min-height: 90px;
        overflow: auto;
        flex: 1;
        padding: 4px 8px;
      }
      .entity {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #ffffff0b;
        border-radius: 0;
        background: transparent;
        padding: 7px 6px;
      }
      .entity.selected {
        background: #e9bb6417;
      }
      .entity img {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 50%;
        background: #263335;
      }
      .entity .meta {
        margin-left: auto;
        text-align: right;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }
      .entity .meta.warn {
        color: #f1b0b4;
      }
      .empty {
        padding: 12px;
        color: var(--muted);
      }
      #editor {
        max-height: 42%;
        overflow: auto;
        border-top: 1px solid var(--line);
        padding: 10px 14px 14px;
      }
      #editor h2 {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0 0 8px;
        color: #c4cfca;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin: 7px 0 3px;
      }
      input,
      select {
        width: 100%;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      #avatar-preview {
        width: 46px;
        height: 46px;
        object-fit: cover;
        border-radius: 50%;
        background: #263335;
        display: block;
        margin: 6px 0;
      }
      #maps {
        height: 68px;
      }
      #save-status {
        margin-left: auto;
        align-self: center;
        color: var(--muted);
        font-size: 11px;
      }
      @media (max-width: 850px) {
        #app {
          grid-template-columns: minmax(0, 1fr) minmax(290px, 36vw);
        }
      }
      @media (max-width: 650px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(38dvh, 1fr) minmax(0, 1fr);
        }
        #side {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        #editor {
          max-height: 44%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
    <style>
      .territory-color {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .territory-color input {
        width: 46px;
        height: 34px;
        padding: 2px;
      }
      .territory-color button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="map-panel" aria-label="World map">
        <canvas id="map" aria-label="Interactive world map. Select or place an entity."></canvas>
        <div id="toolbar">
          <button id="zoom-in" aria-label="Zoom in">＋</button
          ><button id="zoom-out" aria-label="Zoom out">－</button
          ><button id="fit" aria-label="Fit map">Fit</button
          ><label class="check"><input id="labels" type="checkbox" checked /> labels</label
          ><button id="place" aria-pressed="false">Place selected</button>
        </div>
        <div id="map-status">Loading world map…</div>
      </section>
      <aside id="side">
        <header>
          <h1>Entity Atlas</h1>
          <div class="sub">
            <a href="/tools/campaign-editor/">Campaign Studio</a> ·
            <a id="map-rosters-link" href="/tools/campaign-editor/map-rosters">Map Rosters</a> · Save to
            shared game catalog
          </div>
          <div class="tools">
            <button id="add">Add entity</button><button id="reload">Reload</button
            ><button id="save">Save</button><span id="save-status" role="status">Saved</span>
          </div>
        </header>
        <div class="filters">
          <input id="search" type="search" placeholder="Search name or ID" aria-label="Search entities" />
          <select id="kind-filter" aria-label="Filter by role">
            <option value="">All roles</option>
            <option value="nation">Nations</option>
            <option value="tribe">Tribes</option>
            <option value="campaign">Campaign</option>
          </select>
          <select id="region-filter" aria-label="Filter by region">
            <option value="">All regions</option>
            <option value="unassigned">Unassigned</option>
            <option value="europe">Europe</option>
            <option value="africa">Africa</option>
            <option value="asia">Asia</option>
            <option value="americas">Americas</option>
            <option value="oceania">Oceania</option>
          </select>
          <select id="avatar-filter" aria-label="Filter by avatar">
            <option value="">Any avatar</option>
            <option value="assigned">Avatar assigned</option>
            <option value="missing">No avatar</option>
          </select>
          <select id="location-filter" aria-label="Filter by map location">
            <option value="">All map locations</option>
            <option value="land">On land</option>
            <option value="water">In water</option>
            <option value="outside">Outside map</option>
            <option value="missing">Needs location</option>
          </select>
        </div>
        <div id="count">Loading…</div>
        <div id="list" role="listbox" aria-label="Entities"></div>
        <section id="editor" aria-live="polite">
          <h2>Selected entity</h2>
          <div class="hint">Select an entity, or add one to place it on the map.</div>
        </section>
      </aside>
    </div>
    <script src="map-preview.ts"></script>
    <script src="atlas.ts"></script>
  </body>
</html>
