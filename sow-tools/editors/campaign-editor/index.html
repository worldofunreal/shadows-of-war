<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOW — Campaign Studio</title>
<link rel="stylesheet" href="/fonts/fonts.css" />
<link rel="stylesheet" href="/shell/sow-controls.css" />
<link rel="stylesheet" href="atlas-entity-picker.css" />
<style>
  :root { --bg:#0b1114; --panel:#111a1d; --line:#2d3b3c; --text:#e8eeea; --muted:#98a7a5; --accent:#e9bb64; --accent-dim:#b98a3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.45 var(--sow-ui-font,system-ui),Segoe UI,Roboto,sans-serif; }
  #app { display:flex; height:100%; }
  #stage { flex:1; min-width:0; position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 44%,#243331 0,#131e20 46%,#0b1114 100%); }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; image-rendering:pixelated; }
  #side { width:340px; flex:0 0 340px; background:linear-gradient(160deg,#172124 0,#101719 58%,#0d1416 100%); border-left:1px solid #394746; box-shadow:-16px 0 40px #0007; display:flex; flex-direction:column; z-index:1; }
  header { padding:18px 18px 15px; border-bottom:1px solid var(--line); background:linear-gradient(110deg,#ffffff05,transparent 65%); }
  header h1 { margin:0; color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.17em; }
  header .sub { color:var(--muted); font-size:10px; margin-top:7px; line-height:1.9; }
  .episode-picker { display:inline-flex; align-items:center; gap:6px; margin:0 8px 0 0; }
  .episode-picker select { width:auto; min-width:130px; padding:4px 7px; font-size:10px; }
  .group { padding:15px 18px; border-bottom:1px solid var(--line); }
  #selectedGroup { max-height:min(42dvh,420px); overflow-y:auto; overscroll-behavior:contain; }
  .group h2 { margin:0 0 11px; font-size:9px; text-transform:uppercase; letter-spacing:.16em; color:#c4cfca; }
  label { display:block; font-size:11px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; background:#0c1316; color:var(--text); border:1px solid #354444; border-radius:4px; padding:7px 9px; font:inherit; transition:border-color .15s,box-shadow .15s,background .15s; }
  input:focus,select:focus { outline:none; border-color:var(--accent-dim); box-shadow:0 0 0 2px #e9bb6420; background:#111b1d; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .faction-avatar-picker { display:flex; align-items:center; gap:9px; }
  .faction-avatar-picker img { width:96px; height:96px; flex:0 0 96px; object-fit:cover; border:1px solid #c9ae7180; border-radius:7px; background:#0c1316; box-shadow:0 5px 14px #0006; }
  .faction-avatar-picker select { min-width:0; }
  button { min-height:34px; background:linear-gradient(180deg,#202d30,#172124); color:var(--text); border:1px solid #3a4a49; border-radius:4px; padding:7px 10px; font:inherit; font-size:10px; letter-spacing:.04em; cursor:pointer; transition:transform .14s,border-color .14s,background .14s; }
  button:hover { background:linear-gradient(180deg,#2c3b3d,#1c292b); border-color:#71807a; transform:translateY(-1px); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:linear-gradient(135deg,#f1cc7b,#dca94c); border-color:#f1cc7b; color:#18201e; font-weight:800; text-transform:uppercase; letter-spacing:.11em; }
  button.primary:hover { background:linear-gradient(135deg,#f7d992,#e7b65f); border-color:#f7d992; }
  button.danger { background:#2c1c1d; border-color:#65403c; color:#f1b0a7; }
  .btns { display:flex; gap:7px; flex-wrap:wrap; }
  .btns > button { flex:1; }
  .list { overflow:auto; flex:1; padding:5px 8px 9px; }
  .item { padding:9px 10px; border-bottom:1px solid #ffffff0b; border-inline-start:2px solid transparent; border-radius:2px; cursor:pointer; display:flex; align-items:center; gap:9px; transition:background .14s,border-color .14s; }
  .item:hover { background:#ffffff08; }
  .item.sel { background:linear-gradient(90deg,#e9bb6414,transparent); border-inline-start-color:var(--accent); }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; border:1px solid #ffffff66; box-shadow:0 0 10px currentColor; }
  .item .nm { flex:1; }
  .item .troops { color:var(--muted); font-size:10px; white-space:nowrap; }
  .warn { color:#f1b0b4; }
  #hud { position:absolute; left:16px; bottom:16px; background:#0c1415e8; border:1px solid #52635c; border-inline-start:2px solid var(--accent); border-radius:3px; padding:8px 12px; font-size:10px; letter-spacing:.04em; pointer-events:none; box-shadow:0 8px 26px #0008; }
  #zoomctl { position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; gap:6px; }
  #zoomctl button { width:36px; height:36px; padding:0; font-size:16px; line-height:1; border-radius:3px; border:1px solid #56645d; background:#111b1de8; color:var(--text); cursor:pointer; backdrop-filter:blur(8px); }
  #zoomctl button:hover { background:#24312fe8; border-color:var(--accent-dim); }
  #toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); background:#111b1df2; border:1px solid #647267; border-inline-start:2px solid var(--accent); border-radius:3px; padding:10px 15px; opacity:0; transition:opacity .2s; box-shadow:0 10px 30px #0009; color:var(--text); font-size:11px; }
  .hint { color:var(--muted); font-size:10px; margin-top:7px; line-height:1.5; }
  .swrap { position:relative; }
  @media (max-width:760px) {
    html,body { height:100%; }
    #app { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(220px,43dvh) minmax(0,1fr); height:100dvh; }
    #stage { min-height:220px; }
    #side { width:auto; min-height:0; overflow-y:auto; border-left:0; border-top:1px solid #394746; box-shadow:0 -12px 32px #0007; }
    #selectedGroup { max-height:none; overflow:visible; }
    header { padding:12px 14px 10px; }
    .group { padding:10px 14px; }
    .list { min-height:72px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">load…</div>
    <div id="zoomctl"><button id="zin" title="Zoom in">＋</button><button id="zout" title="Zoom out">－</button><button id="zfit" title="Fit to view">⤢</button></div>
    <div id="toast"></div>
  </div>
  <div id="side">
    <header>
      <h1>Campaign Studio</h1>
      <div class="sub"><label class="episode-picker">Episode <select id="episodeSelect" aria-label="Select campaign episode"></select></label> · <span id="episodeLabel">boudica</span> · place factions · <a id="logicLink" href="logic.html" title="Unsaved map changes are saved before opening Story &amp; logic" style="color:var(--accent);text-decoration:none">Story &amp; logic →</a> · <a href="/tools/campaign-editor/atlas">Entity Atlas →</a> · <a href="/tools/campaign-editor/map-rosters" style="color:var(--accent);text-decoration:none">Map Rosters →</a></div>
    </header>

    <div class="group" id="selectedGroup">
      <h2>Selected</h2>
      <div id="seleditor"><div class="hint">Click a faction on the map or in the list.</div></div>
    </div>

    <div class="group">
      <h2>Map</h2>
      <div class="btns">
        <button id="addBtn">+ Add faction</button>
        <button id="spawnBtn">Set player spawn</button>
      </div>
      <label for="atlasEntityInput">Add an existing entity</label>
      <div class="row"><input id="atlasEntityInput" placeholder="Search Atlas by name or ID" aria-label="Search Atlas entities"><button id="addAtlasEntity" type="button" disabled>Add</button></div>
      <div id="atlasEntityResults" class="atlas-picker__results" role="group" aria-label="Atlas search results"></div>
      <div id="atlasEntityStatus" class="atlas-picker__status" role="status">Type at least 2 characters to search the Atlas.</div>
      <label>Show</label>
      <div class="row">
        <label style="margin:0"><input type="checkbox" id="labelsChk" checked style="width:auto"> labels</label>
        <label style="margin:0"><input type="checkbox" id="ringsChk" checked style="width:auto"> reach rings</label>
      </div>
      <div class="hint"><span style="color:#4b91ff">● Ally</span> · <span style="color:#ff5656">● Enemy</span> · Neutral uses its own color</div>
      <div class="hint" id="waterhint"></div>
    </div>

    <div class="group">
      <h2>Save</h2>
      <div class="btns">
        <button class="primary" id="exportBtn">Save</button>
        <button id="reloadBtn">Reload saved</button>
      </div>
      <div class="hint" id="rosterStatus" role="status">Saved</div>
      <label>Load a different roster</label>
      <input type="file" id="fileIn" accept=".json" />
    </div>

    <div class="list" id="list"></div>
  </div>
</div>

<script src="map-preview.js"></script>
<script src="atlas-entity-picker.js"></script>
<script src="/shell/sow-campaign.js"></script>
<script>
const PLAYER_COLOR = "#f0902a";
const ALLY_COLOR = "#4b91ff", ENEMY_COLOR = "#ff5656";
const FACTION_COLORS = ["#4ca572", "#a88c40", "#8c59a8", "#40999e", "#b87366", "#7380b8"];
const RELATIONS = { neutral:"Neutral", allied:"Ally", enemy:"Enemy" };
function factionColor(f){ return f.relation==="allied" ? ALLY_COLOR : f.relation==="enemy" ? ENEMY_COLOR : (f.color || FACTION_COLORS[0]); }
// Bot IQ tiers grounded in the engine (sow-core player/diplomacy/intent): default 100; AI smarts
// unlock at 100 and 130; bots roll 130–180; lower roster IQ values remain valid.
function iqTier(iq){ return iq>=130 ? "sharp (≥130)" : iq>=100 ? "standard" : "dull"; }
function escapeHtml(value){ return String(value).replace(/[&<>"']/g, character=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[character])); }

const query = new URLSearchParams(location.search);
const episodeId = /^[a-z0-9]+(?:_[a-z0-9]+)*$/.test(query.get("episode") || "") ? query.get("episode") : "boudica";
let MAPW = 896, MAPH = 504;
let terrain = null;            // Uint8Array length MAPW*MAPH, bit7 = land
let roster = { map:"eastanglia", player_spawn:[696,45], player_color:PLAYER_COLOR, factions:[] };
let avatarCatalog = [];
let entityCatalog = null;
let atlasEntityPicker = null;
let rosterEtag = null;
let rosterDirty = false, rosterExternal = false, rosterSaving = false;
const factionRenameOrigins = new WeakMap(), factionRenames = new Map();
let sel = -1;                  // index into factions, or -2 = player spawn
let scale = 1, ox = 0, oy = 0, fitScale = 1, minScale = 0.5, maxScale = 12, viewWidth = 1, viewHeight = 1, dpr = 1; // view: sx = mx*scale+ox
let hovered = -1, panning = false, panStart = null;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
let mapImage = null;           // offscreen ImageData rendered once
document.getElementById("episodeLabel").textContent = episodeId;
document.getElementById("logicLink").href = `logic.html?episode=${encodeURIComponent(episodeId)}`;

function markRosterDirty(){
  rosterDirty = true;
  document.getElementById("rosterStatus").textContent = rosterExternal ? "Changed elsewhere · draft preserved" : "Unsaved changes";
  document.getElementById("rosterStatus").className = "hint warn";
}
document.getElementById("side").addEventListener("input", e => {
  if(e.target.matches("#psx,#psy,#fn,#ftroops,#frelation,#fcanrequest,#fattack,#fx,#fy,#fiq,#fiqn,#fa")) markRosterDirty();
});
document.getElementById("side").addEventListener("change", e => {
  if(e.target.matches("#psx,#psy,#fn,#ftroops,#frelation,#fcanrequest,#fattack,#fx,#fy,#fiq,#fiqn,#fa")) markRosterDirty();
});

function isLand(mx, my) {
  if (!terrain) return null;
  return SOWCampaignMapPreview.isLand(terrain, MAPW, MAPH, mx, my);
}

// ---- shared map view ----
function viewState(){ return {scale, x:ox, y:oy}; }
function applyView(view){ scale=view.scale; ox=view.x; oy=view.y; }
function computeFitView(){ return SOWCampaignMapPreview.fitMapView(MAPW, MAPH, viewWidth, viewHeight); }
function fitView() {
  const view=computeFitView(); if(!view)return;
  fitScale=view.fitScale; minScale=view.minScale; maxScale=Math.max(12, fitScale*10);
  applyView(view); clampView();
}
// Keep the map from drifting fully off-screen (centered when it fits within the view).
function clampView(){
  const w = MAPW*scale, h = MAPH*scale, m = 60;
  ox = (w <= viewWidth)  ? (viewWidth  - w)/2 : Math.min(m, Math.max(viewWidth  - w - m, ox));
  oy = (h <= viewHeight) ? (viewHeight - h)/2 : Math.min(m, Math.max(viewHeight - h - m, oy));
}
// Zoom toward a screen point, keeping the world point under it fixed.
function zoomAt(sx, sy, factor){
  applyView(SOWCampaignMapPreview.zoomMapView(viewState(), [sx,sy], factor, minScale, maxScale));
  clampView(); draw();
}
const m2s = (mx,my) => SOWCampaignMapPreview.mapToScreen([mx,my], viewState());
const s2m = (sx,sy) => SOWCampaignMapPreview.screenToMap([sx,sy], viewState());
function focusFaction(index){
  const faction=roster.factions[index];
  if(!faction||faction.x<0||faction.y<0||faction.x>=MAPW||faction.y>=MAPH)return;
  const offset=SOWCampaignMapPreview.centerMapOffsets({x:faction.x,y:faction.y},scale,viewWidth,viewHeight);
  ox=offset.x;oy=offset.y;clampView();draw();
}

// ---- draw ----
function draw() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,viewWidth,viewHeight);
  if (mapImage) ctx.drawImage(mapImage, ox, oy, MAPW*scale, MAPH*scale);

  const showLabels = document.getElementById("labelsChk").checked;
  const showRings  = document.getElementById("ringsChk").checked;
  const [px,py] = roster.player_spawn;

  // reach rings from player spawn (visualize contact radius)
  if (showRings) {
    const [psx,psy] = m2s(px,py);
    ctx.strokeStyle = "rgba(240,144,42,.35)";
    for (const rr of [20,40,60,80,120]) { ctx.beginPath(); ctx.arc(psx,psy,rr*scale,0,7); ctx.stroke(); }
  }

  // factions
  roster.factions.forEach((f,i) => {
    const [sx,sy] = m2s(f.x,f.y);
    const water = isLand(f.x,f.y) === false;
    const hov = (i===hovered);
    const r = hov ? 7.5 : 6;
    if (hov && i!==sel) { ctx.beginPath(); ctx.arc(sx,sy,r+5,0,7); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(sx,sy,r,0,7);
    ctx.fillStyle = factionColor(f); ctx.fill();
    ctx.lineWidth = (i===sel)?3:1.5;
    ctx.strokeStyle = water ? "#ff4d4d" : (i===sel ? "#fff" : "rgba(0,0,0,.5)");
    ctx.stroke();
    if (water) { ctx.beginPath(); ctx.arc(sx,sy,r+4,0,7); ctx.strokeStyle="#ff4d4d"; ctx.lineWidth=1.5; ctx.stroke(); }
    if (showLabels || hov) {
      SOWCampaignMapPreview.drawMapLabel(ctx, f.name, sx, sy-r-4, hov);
    }
  });

  // player spawn (star-ish)
  const [sx,sy] = m2s(px,py);
  const phov = (hovered===-2);
  if (phov && sel!==-2) { ctx.beginPath(); ctx.arc(sx,sy,13,0,7); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(sx,sy,8,0,7);
  ctx.fillStyle = roster.player_color || PLAYER_COLOR; ctx.fill();
  ctx.lineWidth = (sel===-2)?3:2; ctx.strokeStyle = (sel===-2)?"#fff":"#1a1206"; ctx.stroke();
  ctx.fillStyle="#1a1206"; ctx.font="bold 10px system-ui"; ctx.textAlign="center"; ctx.fillText("★",sx,sy+3.5);
}

// ---- hit testing ----
function pick(sx,sy) {
  // player spawn first if close
  const [psx,psy] = m2s(roster.player_spawn[0],roster.player_spawn[1]);
  if (Math.hypot(sx-psx,sy-psy) <= 10) return -2;
  for (let i=roster.factions.length-1;i>=0;i--){
    const [fx,fy] = m2s(roster.factions[i].x,roster.factions[i].y);
    if (Math.hypot(sx-fx,sy-fy) <= 8) return i;
  }
  return -1;
}

// ---- interaction ----
let dragging = false;
cv.addEventListener("mousedown", e => {
  if (e.button !== 0) return; // left button only; right-click adds a tribe (contextmenu)
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const hit = pick(sx,sy);
  if (hit === -1) { panning = true; panStart = {mx:e.clientX, my:e.clientY, ox, oy}; cv.style.cursor="grabbing"; return; }
  sel = hit; dragging = true; renderSide(); draw();
});
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  if (panning) { applyView(SOWCampaignMapPreview.panMapView({scale, x:panStart.ox, y:panStart.oy}, e.clientX-panStart.mx, e.clientY-panStart.my)); clampView(); draw(); return; }
  const [mx,my] = s2m(sx,sy);
  const cx = Math.round(mx), cy = Math.round(my);
  const land = isLand(cx,cy);
  hud.textContent = `x ${cx}  y ${cy}  ·  ${land===null?"loading map…":land?"land":"WATER"}  ·  ${Math.round(scale/fitScale*100)}%`;
  hud.className = land===false ? "warn" : "";
  if (dragging && sel !== -1) {
    const nx = Math.max(0,Math.min(MAPW-1,cx)), ny = Math.max(0,Math.min(MAPH-1,cy));
    if (sel === -2) roster.player_spawn = [nx,ny];
    else { roster.factions[sel].x = nx; roster.factions[sel].y = ny; }
    markRosterDirty();
    renderSide(); draw();
  } else {
    const h = pick(sx,sy);
    cv.style.cursor = (h !== -1) ? "pointer" : "grab";
    if (h !== hovered) { hovered = h; draw(); }
  }
});
window.addEventListener("mouseup", () => { dragging=false; if (panning){ panning=false; cv.style.cursor="grab"; } });
cv.addEventListener("mouseleave", () => { if (hovered!==-1){ hovered=-1; draw(); } });
// wheel = zoom toward the cursor (the only scroll on the page)
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015));
}, {passive:false});

// ---- side panel ----
function renderSide() {
  const host = document.getElementById("seleditor");
  if (sel === -2) {
    const spawnLand = isLand(...roster.player_spawn);
    host.innerHTML = `<label>Player spawn</label>
      <div class="row"><input id="psx" type="number" min="0" max="${MAPW-1}" value="${roster.player_spawn[0]}"><input id="psy" type="number" min="0" max="${MAPH-1}" value="${roster.player_spawn[1]}"></div>
      <label>Player color</label><input id="playerColor" type="color" value="${escapeHtml(roster.player_color || PLAYER_COLOR)}">
      <div class="hint">${spawnLand===null?"Checking map…":spawnLand?"on land ✓":"⚠ in water"}</div>`;
    document.getElementById("psx").oninput = e => { if(e.target.value==="" || !Number.isFinite(Number(e.target.value))) return; roster.player_spawn[0]=Math.round(Number(e.target.value)); markRosterDirty(); draw(); };
    document.getElementById("psy").oninput = e => { if(e.target.value==="" || !Number.isFinite(Number(e.target.value))) return; roster.player_spawn[1]=Math.round(Number(e.target.value)); markRosterDirty(); draw(); };
    document.getElementById("psx").onchange = e => { roster.player_spawn[0]=SOWCampaignMapPreview.clampTile(e.target.value,MAPW); e.target.value=roster.player_spawn[0]; markRosterDirty(); draw(); };
    document.getElementById("psy").onchange = e => { roster.player_spawn[1]=SOWCampaignMapPreview.clampTile(e.target.value,MAPH); e.target.value=roster.player_spawn[1]; markRosterDirty(); draw(); };
    document.getElementById("playerColor").oninput = e => { roster.player_color=e.target.value; markRosterDirty(); draw(); };
  } else if (sel >= 0) {
    const f = roster.factions[sel];
    const originalName = factionRenameOrigins.get(f) || f.name;
    factionRenameOrigins.set(f, originalName);
    const relationOpts = Object.entries(RELATIONS).map(([value,label])=>`<option value="${value}" ${value===f.relation?"selected":""}>${label}</option>`).join("");
    const teamOpts = [["", "No team"], ...SOWCampaign.TEAMS.map(team=>[team, `${team} team`])].map(([value,label])=>`<option value="${value}" ${value===(f.team||"")?"selected":""}>${label}</option>`).join("");
    const avatarOpts = [{id:"",label:"Generic portrait"},...avatarCatalog.map(id=>({id,label:id.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}))];
    if(f.avatar && !avatarCatalog.includes(f.avatar)) avatarOpts.push({id:f.avatar,label:"Missing asset · "+f.avatar});
    const avatarHtml = avatarOpts.map(a=>`<option value="${escapeHtml(a.id)}" ${a.id===(f.avatar||"")?"selected":""}>${escapeHtml(a.label)}</option>`).join("");
    const iq = f.iq ?? 100;
    const goldLootBonus = f.gold_loot_bonus ?? 0;
    const standardGoldBounty = 500;
    const goldLootOverride = f.gold_loot_override;
    host.innerHTML = `<label>Stable ID</label><input value="${escapeHtml(f.id)}" readonly>
      <label>Name</label><input id="fn" value="${escapeHtml(f.name)}">
      <label>Starting troops</label><input id="ftroops" type="number" min="0" max="1000000" step="1" value="${f.starting_troops}">
      <label>Initial relationship to the player</label><select id="frelation">${relationOpts}</select>
      <label>Fixed combat team</label><select id="fteam">${teamOpts}</select>
      <div class="hint">Factions on the same team won't attack each other. Diplomacy stays separate.</div>
      <label><input id="fassaultforce" type="checkbox" style="width:auto" ${f.assault_force===true?"checked":""}> Eligible for configured campaign assaults</label>
      <label><input id="fcanrequest" type="checkbox" style="width:auto" ${f.can_request_alliance!==false?"checked":""}> Allow AI requests and generic neutral terms</label>
      <label>Autonomous attacks against player</label><select id="fattack"><option value="" ${f.can_attack_player==null?"selected":""}>Follow relationship</option><option value="true" ${f.can_attack_player===true?"selected":""}>Allowed</option><option value="false" ${f.can_attack_player===false?"selected":""}>Passive</option></select>
      <label>Neutral faction color</label><input id="fcolor" type="color" value="${escapeHtml(f.color || FACTION_COLORS[0])}">
      <label>Nameplate and dialogue portrait</label><div class="faction-avatar-picker"><img id="fportrait" width="256" height="256" alt=""><select id="fa">${avatarHtml}</select></div>

    document.getElementById("fx").oninput = e => { if(e.target.value==="" || !Number.isFinite(Number(e.target.value))) return; f.x=Math.round(Number(e.target.value)); markRosterDirty(); updateFactionHint(); renderList(); draw(); };

}

function serialize() {
  validateRoster(roster);
  const out = {
    _comment: roster._comment || `${episodeId} campaign roster — edited via tools/campaign-editor.`,
    map: roster.map || "eastanglia",
    player_spawn: roster.player_spawn.map(n=>Math.round(n)),
    player_color: roster.player_color || PLAYER_COLOR,
    factions: roster.factions.map(f=>({ id:f.id, name:f.name, x:Math.round(f.x), y:Math.round(f.y), starting_troops:Number(f.starting_troops), relation:f.relation, ...(f.team?{team:f.team}:{}), can_request_alliance:f.can_request_alliance!==false, color:f.color, iq:f.iq??100, civ:f.civ, leader:f.leader, ...(f.can_attack_player!=null?{can_attack_player:f.can_attack_player}:{}), ...(f.support_interval_seconds!=null?{support_interval_seconds:Number(f.support_interval_seconds)}:{}), ...(f.gold_loot_bonus!=null?{gold_loot_bonus:Number(f.gold_loot_bonus)}:{}), ...(f.gold_loot_override!=null?{gold_loot_override:Number(f.gold_loot_override)}:{}), ...(f.alliance_group?{alliance_group:f.alliance_group}:{}), ...(f.assault_force?{assault_force:true}:{}), ...(f.avatar?{avatar:f.avatar}:{}) })),
  };
  return JSON.stringify(out, null, 2) + "\n";
}
function clampRosterPositions() {
  let changed = false;
  for (let axis = 0; axis < 2; axis++) {
    const size = axis === 0 ? MAPW : MAPH;
    const value = SOWCampaignMapPreview.clampTile(roster.player_spawn[axis], size);
    if (value !== roster.player_spawn[axis]) { roster.player_spawn[axis] = value; changed = true; }
  }
  roster.factions.forEach(faction => {
    const x = SOWCampaignMapPreview.clampTile(faction.x, MAPW), y = SOWCampaignMapPreview.clampTile(faction.y, MAPH);
    if (x !== faction.x || y !== faction.y) { faction.x = x; faction.y = y; changed = true; }
  });
  return changed;
}
async function saveRoster(){
  if(rosterSaving) return false;
  rosterSaving = true;
  try {
    if (clampRosterPositions()) { markRosterDirty(); renderAll(); }
    const file = `${episodeId}.json`;
    const savedDraft = serialize();
    const renames = Array.from(factionRenames, ([from, to]) => ({ from, to }));
    const body = renames.length ? JSON.stringify({ roster: JSON.parse(savedDraft), faction_renames: renames }) : savedDraft;
    const res = await fetch(`/__save?file=${encodeURIComponent(file)}`, {method:"POST", headers:{"Content-Type":"application/json", "If-Match":rosterEtag||""}, body});
    if(!res.ok){ if(res.status===409){ rosterExternal=true; document.getElementById("rosterStatus").textContent="Changed elsewhere · draft preserved"; } throw new Error(await res.text()); }
    const result = await res.json();
    rosterEtag = res.headers.get("ETag");
    rosterDirty = serialize() !== savedDraft; rosterExternal = false;
    const savedRoster = JSON.parse(savedDraft);
    factionRenames.clear();
    roster.factions.forEach((faction, index) => {
      const savedName = savedRoster.factions[index].name;
      factionRenameOrigins.set(faction, savedName);
      if (faction.name !== savedName) factionRenames.set(savedName, faction.name);
    });
    document.getElementById("rosterStatus").textContent = rosterDirty ? "Newer edits not saved" : "Saved";
    document.getElementById("rosterStatus").className = rosterDirty ? "hint warn" : "hint";
    const adjusted = result.auto_adjusted;
    const changedStory = adjusted && (adjusted.steps_to_scenes || adjusted.reactions_removed || adjusted.speakers_unlinked || adjusted.settings_cleared);
    toast(rosterDirty ? "Saved; newer map edits remain" : changedStory
      ? `Saved; story adjusted (${adjusted.steps_to_scenes} objectives became scenes, ${adjusted.reactions_removed} faction responses removed)`
      : renames.length ? "Saved name and updated campaign references" : `Saved → assets/campaign/${file}`);
    return !rosterDirty;
  } catch(e){ toast("Save failed: "+e.message); }
  finally { rosterSaving = false; }
  return false;
}

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.opacity=1; clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity=0,2200); }

function normalize(j){
  const factionFields = new Set(["id","name","x","y","starting_troops","relation","team","can_request_alliance","can_attack_player","color","iq","civ","leader","avatar","support_interval_seconds","gold_loot_bonus","gold_loot_override","alliance_group","assault_force"]);
  const factions = (j.factions||[]).map((f,index)=>{
    if(!f || Object.keys(f).some(key=>!factionFields.has(key))) throw new Error("unsupported faction field");
    if(typeof f.id!=="string" || typeof f.name!=="string" || !Number.isInteger(f.x) || !Number.isInteger(f.y) || !Number.isInteger(f.starting_troops) || typeof f.civ!=="string" || typeof f.leader!=="string") throw new Error("faction needs stable ID, name, position, troops, civilization and leader");
    if(f.can_request_alliance!=null && typeof f.can_request_alliance!=="boolean") throw new Error("alliance offer setting must be true or false");
    if(f.can_attack_player!=null && typeof f.can_attack_player!=="boolean") throw new Error("attack permission must be true or false");
    if(f.assault_force!=null && typeof f.assault_force!=="boolean") throw new Error("assault force setting must be true or false");
    if(String(f.civ).replace(/[^a-z0-9]/gi,"").toLowerCase()==="romanempire" && f.relation==="neutral") throw new Error("Roman Empire factions cannot be neutral");
    return { id:f.id, name:f.name, x:f.x, y:f.y, starting_troops:f.starting_troops, relation:f.relation, ...(f.team?{team:f.team}:{}), can_request_alliance:f.can_request_alliance!==false, color:f.color||FACTION_COLORS[index%FACTION_COLORS.length], iq:f.iq==null?100:f.iq, civ:f.civ, leader:f.leader,
      ...(f.can_attack_player!=null?{can_attack_player:f.can_attack_player}:{}), ...(f.support_interval_seconds!=null?{support_interval_seconds:Number(f.support_interval_seconds)}:{}), ...(f.gold_loot_bonus!=null?{gold_loot_bonus:Number(f.gold_loot_bonus)}:{}), ...(f.gold_loot_override!=null?{gold_loot_override:Number(f.gold_loot_override)}:{}), ...(f.alliance_group?{alliance_group:f.alliance_group}:{}), ...(f.assault_force===true?{assault_force:true}:{}), ...(f.avatar?{avatar:f.avatar}:{}) };
  });
  const result = { _comment:j._comment, map:j.map||"eastanglia", player_spawn:j.player_spawn||[696,45], player_color:j.player_color||PLAYER_COLOR, factions };
  validateRoster(result);
  return result;
}
function validateRoster(value){
  if(!value || typeof value.map!=="string" || !Array.isArray(value.player_spawn) || value.player_spawn.length!==2 || !value.player_spawn.every(Number.isFinite) || !/^#[0-9a-fA-F]{6}$/.test(value.player_color || PLAYER_COLOR)) throw new Error("invalid roster");
  const names = new Set(), ids = new Set();
  if(!Array.isArray(value.factions)) throw new Error("factions must be a list");
  for(const f of value.factions){
    if(!/^[a-z][a-z0-9_]{0,95}$/.test(f.id) || ids.has(f.id) || !f.name.trim() || names.has(f.name) || !Number.isInteger(f.starting_troops) || f.starting_troops<0 || f.starting_troops>1000000 || !Object.prototype.hasOwnProperty.call(RELATIONS,f.relation) || (f.team!=null && !SOWCampaign.TEAMS.includes(f.team)) || typeof f.can_request_alliance!=="boolean" || (f.can_attack_player!=null && typeof f.can_attack_player!=="boolean") || (f.assault_force!=null && typeof f.assault_force!=="boolean") || !/^#[0-9a-fA-F]{6}$/.test(f.color) || !Number.isInteger(f.x) || !Number.isInteger(f.y) || !f.civ || !f.leader || (f.iq!=null && (!Number.isInteger(f.iq) || f.iq<0 || f.iq>180)) || (f.support_interval_seconds!=null && (!Number.isInteger(f.support_interval_seconds) || f.support_interval_seconds<5 || f.support_interval_seconds>600)) || (f.gold_loot_bonus!=null && (!Number.isInteger(f.gold_loot_bonus) || f.gold_loot_bonus<0 || f.gold_loot_bonus>1000000)) || (f.gold_loot_override!=null && (!Number.isInteger(f.gold_loot_override) || f.gold_loot_override<0 || f.gold_loot_override>1000000)) || (f.alliance_group!=null && !/^[a-z][a-z0-9_]{0,63}$/.test(f.alliance_group)) || (f.avatar && (!/^[a-z][a-z0-9_]*$/.test(f.avatar) || !avatarCatalog.includes(f.avatar)))) throw new Error("invalid faction, duplicate identity/name, or missing portrait asset");
    ids.add(f.id); names.add(f.name);
  }
}

      return;
    }
    const previousMap=roster.map;
    await loadRoster();
    if(previousMap!==roster.map) await loadMap();
    toast("Map updated from disk");
  } catch(_){ /* Keep the current draft if the editor server briefly restarts. */ }
}
document.addEventListener("visibilitychange", watchRosterFile);
window.setInterval(watchRosterFile, 1500);

async function fillEpisodePicker(){
  const select = document.getElementById("episodeSelect");
  try {
    const res = await fetch("/__episodes", {cache:"no-store"});
    if(!res.ok) throw new Error("episode list unavailable");
    const episodes = await res.json();
    if(!Array.isArray(episodes) || !episodes.length || episodes.some(id=>typeof id!=="string" || !/^[a-z][a-z0-9_]{0,63}$/.test(id))) throw new Error("invalid episode list");
    if(!episodes.includes(episodeId)) episodes.unshift(episodeId);
    select.replaceChildren(...episodes.map(id=>{
      const option=document.createElement("option");
      option.value=id;
      option.textContent=id.replace(/_/g," ").replace(/\b\w/g,letter=>letter.toUpperCase());
      return option;
    }));
    select.value=episodeId;
  } catch(e) {
    const option=document.createElement("option"); option.value=episodeId; option.textContent=episodeId;
    select.replaceChildren(option); toast("Campaign list unavailable: "+e.message);
  }
  select.addEventListener("change",()=>{
    if(select.value===episodeId) return;
    if(rosterDirty && !confirm("Discard unsaved map changes and switch episode?")){ select.value=episodeId; return; }
    location.href="index.html?episode="+encodeURIComponent(select.value);
  });
}

(async function(){
  resize();
  await fillEpisodePicker();
  try {
    const response = await fetch("/__avatars", {cache:"no-store"});
    if(!response.ok) throw new Error("avatar list unavailable");
    avatarCatalog = await response.json();
    if(!Array.isArray(avatarCatalog) || avatarCatalog.some(id=>typeof id!=="string" || !/^[a-z][a-z0-9_]*$/.test(id))) throw new Error("invalid avatar list");
  } catch(e) { toast("Portrait list unavailable: "+e.message); }
  await loadRoster();
  try { await loadMap(); } catch(e){ hud.textContent="map load failed: "+e.message; hud.className="warn"; }
  fitView(); draw();
})();
</script>
