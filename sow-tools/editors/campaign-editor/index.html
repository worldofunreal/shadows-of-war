<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOW — Campaign Studio</title>
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  :root { --bg:#0b1114; --panel:#111a1d; --line:#2d3b3c; --text:#e8eeea; --muted:#98a7a5; --accent:#e9bb64; --accent-dim:#b98a3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.45 var(--sow-ui-font,system-ui),Segoe UI,Roboto,sans-serif; }
  #app { display:flex; height:100%; }
  #stage { flex:1; min-width:0; position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 44%,#243331 0,#131e20 46%,#0b1114 100%); }
  canvas { position:absolute; top:0; left:0; image-rendering:pixelated; }
  #side { width:340px; flex:0 0 340px; background:linear-gradient(160deg,#172124 0,#101719 58%,#0d1416 100%); border-left:1px solid #394746; box-shadow:-16px 0 40px #0007; display:flex; flex-direction:column; z-index:1; }
  header { padding:18px 18px 15px; border-bottom:1px solid var(--line); background:linear-gradient(110deg,#ffffff05,transparent 65%); }
  header h1 { margin:0; color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.17em; }
  header .sub { color:var(--muted); font-size:10px; margin-top:7px; line-height:1.9; }
  .episode-picker { display:inline-flex; align-items:center; gap:6px; margin:0 8px 0 0; }
  .episode-picker select { width:auto; min-width:130px; padding:4px 7px; font-size:10px; }
  .group { padding:15px 18px; border-bottom:1px solid var(--line); }
  .group h2 { margin:0 0 11px; font-size:9px; text-transform:uppercase; letter-spacing:.16em; color:#c4cfca; }
  label { display:block; font-size:11px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; background:#0c1316; color:var(--text); border:1px solid #354444; border-radius:4px; padding:7px 9px; font:inherit; transition:border-color .15s,box-shadow .15s,background .15s; }
  input:focus,select:focus { outline:none; border-color:var(--accent-dim); box-shadow:0 0 0 2px #e9bb6420; background:#111b1d; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { min-height:34px; background:linear-gradient(180deg,#202d30,#172124); color:var(--text); border:1px solid #3a4a49; border-radius:4px; padding:7px 10px; font:inherit; font-size:10px; letter-spacing:.04em; cursor:pointer; transition:transform .14s,border-color .14s,background .14s; }
  button:hover { background:linear-gradient(180deg,#2c3b3d,#1c292b); border-color:#71807a; transform:translateY(-1px); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:linear-gradient(135deg,#f1cc7b,#dca94c); border-color:#f1cc7b; color:#18201e; font-weight:800; text-transform:uppercase; letter-spacing:.11em; }
  button.primary:hover { background:linear-gradient(135deg,#f7d992,#e7b65f); border-color:#f7d992; }
  button.danger { background:#2c1c1d; border-color:#65403c; color:#f1b0a7; }
  .btns { display:flex; gap:7px; flex-wrap:wrap; }
  .btns > button { flex:1; }
  .list { overflow:auto; flex:1; padding:5px 8px 9px; scrollbar-color:#465755 transparent; }
  .item { padding:9px 10px; border-bottom:1px solid #ffffff0b; border-inline-start:2px solid transparent; border-radius:2px; cursor:pointer; display:flex; align-items:center; gap:9px; transition:background .14s,border-color .14s; }
  .item:hover { background:#ffffff08; }
  .item.sel { background:linear-gradient(90deg,#e9bb6414,transparent); border-inline-start-color:var(--accent); }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; border:1px solid #ffffff66; box-shadow:0 0 10px currentColor; }
  .item .nm { flex:1; }
  .item .rl { color:var(--muted); font-size:10px; }
  .warn { color:#f1b0b4; }
  #hud { position:absolute; left:16px; bottom:16px; background:#0c1415e8; border:1px solid #52635c; border-inline-start:2px solid var(--accent); border-radius:3px; padding:8px 12px; font-size:10px; letter-spacing:.04em; pointer-events:none; box-shadow:0 8px 26px #0008; }
  #zoomctl { position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; gap:6px; }
  #zoomctl button { width:36px; height:36px; padding:0; font-size:16px; line-height:1; border-radius:3px; border:1px solid #56645d; background:#111b1de8; color:var(--text); cursor:pointer; backdrop-filter:blur(8px); }
  #zoomctl button:hover { background:#24312fe8; border-color:var(--accent-dim); }
  #toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); background:#111b1df2; border:1px solid #647267; border-inline-start:2px solid var(--accent); border-radius:3px; padding:10px 15px; opacity:0; transition:opacity .2s; box-shadow:0 10px 30px #0009; color:var(--text); font-size:11px; }
  .hint { color:var(--muted); font-size:10px; margin-top:7px; line-height:1.5; }
  .swrap { position:relative; }
  @media (max-width:760px) {
    html,body { height:100%; }
    #app { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(220px,43dvh) minmax(0,1fr); height:100dvh; }
    #stage { min-height:220px; }
    #side { width:auto; min-height:0; overflow-y:auto; border-left:0; border-top:1px solid #394746; box-shadow:0 -12px 32px #0007; }
    header { padding:12px 14px 10px; }
    .group { padding:10px 14px; }
    .list { min-height:72px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">load…</div>
    <div id="zoomctl"><button id="zin" title="Zoom in">＋</button><button id="zout" title="Zoom out">－</button><button id="zfit" title="Fit to view">⤢</button></div>
    <div id="toast"></div>
  </div>
  <div id="side">
    <header>
      <h1>Campaign Studio</h1>
      <div class="sub"><label class="episode-picker">Episode <select id="episodeSelect" aria-label="Select campaign episode"></select></label> · <span id="episodeLabel">boudica</span> · place factions · <a id="logicLink" href="logic.html" title="Unsaved map changes are saved before opening Story &amp; logic" style="color:var(--accent);text-decoration:none">Story &amp; logic →</a></div>
    </header>

    <div class="group">
      <h2>Selected</h2>
      <div id="seleditor"><div class="hint">Click a tribe on the map or in the list.</div></div>
    </div>

    <div class="group">
      <h2>Map</h2>
      <div class="btns">
        <button id="addBtn">+ Add tribe</button>
        <button id="spawnBtn">Set player spawn</button>
      </div>
      <label>Show</label>
      <div class="row">
        <label style="margin:0"><input type="checkbox" id="labelsChk" checked style="width:auto"> labels</label>
        <label style="margin:0"><input type="checkbox" id="ringsChk" checked style="width:auto"> reach rings</label>
      </div>
      <div class="hint" id="waterhint"></div>
    </div>

    <div class="group">
      <h2>Export</h2>
      <div class="btns">
        <button class="primary" id="exportBtn">Export</button>
        <button id="reloadBtn">Reload</button>
      </div>
      <div class="hint" id="rosterStatus" role="status">Saved</div>
      <label>Load a different roster</label>
      <input type="file" id="fileIn" accept=".json" />
    </div>

    <div class="list" id="list"></div>
  </div>
</div>

<script src="map-preview.js"></script>
<script>
// ---- role model (mirrors sow-client-world/src/campaign/mod.rs Role) ----
const ROLES = {
  kin:         { color:"#e06b1f", team:"Red",  troops:500,  label:"Kin (ally)" },
  independent: { color:"#9aa0ac", team:"—",    troops:500,  label:"Independent" },
  vassal:      { color:"#3372f2", team:"Blue", troops:1000, label:"Vassal" },
  boss:        { color:"#2f5fe0", team:"Blue", troops:2500, label:"City (boss)" },
  big_boss:    { color:"#1d3fb0", team:"Blue", troops:5000, label:"Rome (big boss)" },
  neutral:     { color:"#4ca572", team:"—",    troops:500,  label:"Neutral" },
};
const PLAYER_COLOR = "#f0902a";
// Bot IQ tiers grounded in the engine (sow-core player/diplomacy/intent): default 100; AI smarts
// unlock at 100 and 130; bots roll 130–180; the lowest value the codebase exercises is 85.
function iqTier(iq){ return iq>=130 ? "sharp (≥130)" : iq>=100 ? "standard" : "dull"; }
function escapeHtml(value){ return String(value).replace(/[&<>"']/g, character=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[character])); }

const query = new URLSearchParams(location.search);
const episodeId = /^[a-z0-9]+(?:_[a-z0-9]+)*$/.test(query.get("episode") || "") ? query.get("episode") : "boudica";
let MAPW = 896, MAPH = 504;
let terrain = null;            // Uint8Array length MAPW*MAPH, bit7 = land
let roster = { map:"eastanglia", player_spawn:[696,45], factions:[] };
let avatarCatalog = [];
let rosterEtag = null;
let rosterDirty = false, rosterExternal = false, rosterSaving = false;
let sel = -1;                  // index into factions, or -2 = player spawn
let scale = 1, ox = 0, oy = 0, minScale = 1, maxScale = 12; // view: sx = mx*scale+ox
let hovered = -1, panning = false, panStart = null;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
let mapImage = null;           // offscreen ImageData rendered once
document.getElementById("episodeLabel").textContent = episodeId;
document.getElementById("logicLink").href = `logic.html?episode=${encodeURIComponent(episodeId)}`;

function markRosterDirty(){
  rosterDirty = true;
  document.getElementById("rosterStatus").textContent = rosterExternal ? "Changed elsewhere · draft preserved" : "Unsaved changes";
  document.getElementById("rosterStatus").className = "hint warn";
}
document.getElementById("side").addEventListener("input", e => {
  if(e.target.matches("#psx,#psy,#fn,#fr,#fx,#fy,#fiq,#fiqn,#fa")) markRosterDirty();
});
document.getElementById("side").addEventListener("change", e => {
  if(e.target.matches("#psx,#psy,#fn,#fr,#fx,#fy,#fiq,#fiqn,#fa")) markRosterDirty();
});

function isLand(mx, my) {
  mx = Math.floor(mx); my = Math.floor(my);
  if (mx < 0 || my < 0 || mx >= MAPW || my >= MAPH || !terrain) return false;
  return (terrain[my*MAPW + mx] & 0x80) !== 0;
}

// ---- parse the SOWM map.bin (LE header + 1 byte/tile) ----
function parseMap(buf) {
  const map = SOWCampaignMapPreview.parse(buf);
  return { w: map.width, h: map.height, terrain: map.terrain };
}

function buildMapImage() {
  mapImage = SOWCampaignMapPreview.terrainCanvas(terrain, MAPW, MAPH);
}

// ---- view fit ----
function computeMinScale(){ return Math.min(cv.width/MAPW, cv.height/MAPH); }
function fitView() { minScale = computeMinScale(); maxScale = Math.max(12, minScale*10); scale = minScale; clampView(); }
// Keep the map from drifting fully off-screen (centered when it fits within the view).
function clampView(){
  const w = MAPW*scale, h = MAPH*scale, m = 60;
  ox = (w <= cv.width)  ? (cv.width  - w)/2 : Math.min(m, Math.max(cv.width  - w - m, ox));
  oy = (h <= cv.height) ? (cv.height - h)/2 : Math.min(m, Math.max(cv.height - h - m, oy));
}
// Zoom toward a screen point, keeping the world point under it fixed.
function zoomAt(sx, sy, factor){
  const [wx,wy] = s2m(sx,sy);
  scale = Math.max(minScale, Math.min(maxScale, scale*factor));
  ox = sx - wx*scale; oy = sy - wy*scale;
  clampView(); draw();
}
const m2s = (mx,my) => [mx*scale+ox, my*scale+oy];
const s2m = (sx,sy) => [(sx-ox)/scale, (sy-oy)/scale];

// ---- draw ----
function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  if (mapImage) ctx.drawImage(mapImage, ox, oy, MAPW*scale, MAPH*scale);

  const showLabels = document.getElementById("labelsChk").checked;
  const showRings  = document.getElementById("ringsChk").checked;
  const [px,py] = roster.player_spawn;

  // reach rings from player spawn (visualize contact radius)
  if (showRings) {
    const [psx,psy] = m2s(px,py);
    ctx.strokeStyle = "rgba(240,144,42,.35)";
    for (const rr of [20,40,60,80,120]) { ctx.beginPath(); ctx.arc(psx,psy,rr*scale,0,7); ctx.stroke(); }
  }

  // factions
  roster.factions.forEach((f,i) => {
    const [sx,sy] = m2s(f.x,f.y);
    const role = ROLES[f.role] || ROLES.neutral;
    const water = !isLand(f.x,f.y);
    const hov = (i===hovered);
    const r = hov ? 7.5 : 6;
    if (hov && i!==sel) { ctx.beginPath(); ctx.arc(sx,sy,r+5,0,7); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(sx,sy,r,0,7);
    ctx.fillStyle = role.color; ctx.fill();
    ctx.lineWidth = (i===sel)?3:1.5;
    ctx.strokeStyle = water ? "#ff4d4d" : (i===sel ? "#fff" : "rgba(0,0,0,.5)");
    ctx.stroke();
    if (water) { ctx.beginPath(); ctx.arc(sx,sy,r+4,0,7); ctx.strokeStyle="#ff4d4d"; ctx.lineWidth=1.5; ctx.stroke(); }
    if (showLabels || hov) {
      ctx.font = (hov?"bold ":"")+"11px system-ui"; ctx.textAlign="center";
      ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillText(f.name, sx+1, sy-r-3);
      ctx.fillStyle="#fff"; ctx.fillText(f.name, sx, sy-r-4);
    }
  });

  // player spawn (star-ish)
  const [sx,sy] = m2s(px,py);
  const phov = (hovered===-2);
  if (phov && sel!==-2) { ctx.beginPath(); ctx.arc(sx,sy,13,0,7); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(sx,sy,8,0,7);
  ctx.fillStyle = PLAYER_COLOR; ctx.fill();
  ctx.lineWidth = (sel===-2)?3:2; ctx.strokeStyle = (sel===-2)?"#fff":"#1a1206"; ctx.stroke();
  ctx.fillStyle="#1a1206"; ctx.font="bold 10px system-ui"; ctx.textAlign="center"; ctx.fillText("★",sx,sy+3.5);
}

// ---- hit testing ----
function pick(sx,sy) {
  // player spawn first if close
  const [psx,psy] = m2s(roster.player_spawn[0],roster.player_spawn[1]);
  if (Math.hypot(sx-psx,sy-psy) <= 10) return -2;
  for (let i=roster.factions.length-1;i>=0;i--){
    const [fx,fy] = m2s(roster.factions[i].x,roster.factions[i].y);
    if (Math.hypot(sx-fx,sy-fy) <= 8) return i;
  }
  return -1;
}

// ---- interaction ----
let dragging = false;
cv.addEventListener("mousedown", e => {
  if (e.button !== 0) return; // left button only; right-click adds a tribe (contextmenu)
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const hit = pick(sx,sy);
  if (hit === -1) { panning = true; panStart = {mx:e.clientX, my:e.clientY, ox, oy}; cv.style.cursor="grabbing"; return; }
  sel = hit; dragging = true; renderSide(); draw();
});
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  if (panning) { ox = panStart.ox + (e.clientX-panStart.mx); oy = panStart.oy + (e.clientY-panStart.my); clampView(); draw(); return; }
  const [mx,my] = s2m(sx,sy);
  const cx = Math.round(mx), cy = Math.round(my);
  hud.textContent = `x ${cx}  y ${cy}  ·  ${isLand(cx,cy)?"land":"WATER"}  ·  ${Math.round(scale/minScale*100)}%`;
  hud.className = isLand(cx,cy) ? "" : "warn";
  if (dragging && sel !== -1) {
    const nx = Math.max(0,Math.min(MAPW-1,cx)), ny = Math.max(0,Math.min(MAPH-1,cy));
    if (sel === -2) roster.player_spawn = [nx,ny];
    else { roster.factions[sel].x = nx; roster.factions[sel].y = ny; }
    markRosterDirty();
    renderSide(); draw();
  } else {
    const h = pick(sx,sy);
    cv.style.cursor = (h !== -1) ? "pointer" : "grab";
    if (h !== hovered) { hovered = h; draw(); }
  }
});
window.addEventListener("mouseup", () => { dragging=false; if (panning){ panning=false; cv.style.cursor="grab"; } });
cv.addEventListener("mouseleave", () => { if (hovered!==-1){ hovered=-1; draw(); } });
// wheel = zoom toward the cursor (the only scroll on the page)
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015));
}, {passive:false});

// ---- side panel ----
function renderSide() {
  const host = document.getElementById("seleditor");
  if (sel === -2) {
    host.innerHTML = `<label>Player spawn</label>
      <div class="row"><input id="psx" type="number" value="${roster.player_spawn[0]}"><input id="psy" type="number" value="${roster.player_spawn[1]}"></div>
      <div class="hint">${isLand(...roster.player_spawn)?"on land ✓":"⚠ in water"}</div>`;
    document.getElementById("psx").oninput = e => { roster.player_spawn[0]=+e.target.value|0; draw(); };
    document.getElementById("psy").oninput = e => { roster.player_spawn[1]=+e.target.value|0; draw(); };
  } else if (sel >= 0) {
    const f = roster.factions[sel];
    const opts = Object.keys(ROLES).map(k=>`<option value="${k}" ${k===f.role?"selected":""}>${ROLES[k].label}</option>`).join("");
    const avatarOpts = [{id:"",label:"Generic portrait"},...avatarCatalog.map(id=>({id,label:id.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}))];
    if(f.avatar && !avatarCatalog.includes(f.avatar)) avatarOpts.push({id:f.avatar,label:"Missing asset · "+f.avatar});
    const avatarHtml = avatarOpts.map(a=>`<option value="${escapeHtml(a.id)}" ${a.id===(f.avatar||"")?"selected":""}>${escapeHtml(a.label)}</option>`).join("");
    const iq = f.iq ?? 100;
    host.innerHTML = `<label>Name</label><input id="fn" value="${escapeHtml(f.name)}">
      <label>Role</label><select id="fr">${opts}</select>
      <label>Nameplate and dialogue portrait</label><select id="fa">${avatarHtml}</select>
      <label>Ally support interval (seconds; blank disables)</label><input id="finterval" type="number" min="5" max="600" value="${f.support_interval_seconds ?? ""}" placeholder="Disabled">
      <label>Alliance group</label><input id="fgroup" value="${escapeHtml(f.alliance_group || "")}" placeholder="e.g. trinovantes">
      <label>Position (x, y)</label><div class="row"><input id="fx" type="number" value="${f.x}"><input id="fy" type="number" value="${f.y}"></div>
      <label>Bot IQ — <span id="iqtier">${iqTier(iq)}</span></label>
      <div class="row"><input id="fiq" type="range" min="85" max="180" step="5" value="${iq}" style="flex:3"><input id="fiqn" type="number" min="85" max="180" value="${iq}" style="flex:1;min-width:56px"></div>
      <div class="hint" id="factionHint"></div>
      <div class="btns" style="margin-top:10px"><button class="danger" id="del">Delete</button></div>`;
    const updateFactionHint = () => {
      const currentRole = ROLES[f.role] || ROLES.neutral;
      const distance = Math.round(Math.hypot(f.x-roster.player_spawn[0], f.y-roster.player_spawn[1]));
      const onLand = isLand(f.x,f.y), hint = document.getElementById("factionHint");
      hint.classList.toggle("warn", !onLand);
      hint.textContent = `team ${currentRole.team} · ${currentRole.troops} troops · r≈${distance} from spawn · ${onLand?"land ✓":"⚠ in water"}`;
    };
    updateFactionHint();
    document.getElementById("fn").oninput = e => { f.name=e.target.value; renderList(); draw(); };
    document.getElementById("fr").onchange = e => { f.role=e.target.value; renderList(); renderSide(); draw(); };
    document.getElementById("fa").onchange = e => { if(e.target.value) f.avatar=e.target.value; else delete f.avatar; markRosterDirty(); };
    document.getElementById("finterval").oninput = e => { if(e.target.value==="") delete f.support_interval_seconds; else f.support_interval_seconds=Number(e.target.value); markRosterDirty(); };
    document.getElementById("fgroup").oninput = e => { if(e.target.value.trim()) f.alliance_group=e.target.value.trim(); else delete f.alliance_group; markRosterDirty(); };
    document.getElementById("fx").oninput = e => { f.x=+e.target.value|0; updateFactionHint(); renderList(); draw(); };
    document.getElementById("fy").oninput = e => { f.y=+e.target.value|0; updateFactionHint(); renderList(); draw(); };
    const setIq = v => { v=Math.max(85,Math.min(180,v|0)); f.iq=v; document.getElementById("fiq").value=v; document.getElementById("fiqn").value=v; document.getElementById("iqtier").textContent=iqTier(v); };
    document.getElementById("fiq").oninput = e => setIq(+e.target.value);
    document.getElementById("fiqn").oninput = e => setIq(+e.target.value);
    document.getElementById("del").onclick = deleteSelected;
  } else {
    host.innerHTML = `<div class="hint">Click a tribe on the map or in the list.</div>`;
  }
}

function renderList() {
  const grouped = {};
  roster.factions.forEach((f,i)=>{ (grouped[f.role]=grouped[f.role]||[]).push(i); });
  let html = "";
  for (const k of Object.keys(ROLES)) {
    const ids = grouped[k]; if (!ids) continue;
    for (const i of ids) {
      const f = roster.factions[i];
      const water = !isLand(f.x,f.y);
      html += `<div class="item ${i===sel?'sel':''}" data-i="${i}">
        <span class="dot" style="background:${ROLES[k].color}"></span>
        <span class="nm">${escapeHtml(f.name)}${water?' <span class="warn">⚠</span>':''}</span>
        <span class="rl">${k}</span></div>`;
    }
  }
  const list = document.getElementById("list");
  const scrollTop = list.scrollTop;
  list.innerHTML = html;
  list.scrollTop = scrollTop;
  list.querySelectorAll(".item").forEach(el => el.onclick = () => { sel=+el.dataset.i; renderSide(); renderList(); draw(); });
  const inWater = roster.factions.filter(f=>!isLand(f.x,f.y)).map(f=>f.name);
  document.getElementById("waterhint").innerHTML = inWater.length
    ? `<span class="warn">⚠ ${inWater.length} in water:</span> ${inWater.map(escapeHtml).join(", ")}` : "All on land ✓";
}

function renderAll() { renderSide(); renderList(); draw(); }

// ---- toolbar ----
function addTribeAt(mx, my) {
  const x = Math.max(0, Math.min(MAPW-1, Math.round(mx)));
  const y = Math.max(0, Math.min(MAPH-1, Math.round(my)));
  roster.factions.push({ name:"NewTribe", x, y, role:"independent", iq:100 });
  markRosterDirty();
  sel = roster.factions.length-1; renderAll();
}
function deleteSelected() {
  if (sel >= 0) { const nm = roster.factions[sel].name; roster.factions.splice(sel,1); markRosterDirty(); sel=-1; renderAll(); toast("Deleted "+nm); }
  else if (sel === -2) { toast("Boudica's spawn can't be deleted — she's the main character"); }
}
// Hotkeys: Del/Suppr removes the selected tribe (not the player spawn); Esc deselects.
// Ignored while typing in a field so text editing still works.
window.addEventListener("keydown", e => {
  const t = document.activeElement;
  if (t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT")) return;
  if (e.key === "Delete" || e.key === "Backspace") { if (sel !== -1) { e.preventDefault(); deleteSelected(); } }
  else if (e.key === "Escape") { sel = -1; renderSide(); draw(); }
});
document.getElementById("addBtn").onclick = () => { const [px,py] = roster.player_spawn; addTribeAt(px+30, py+30); };
// Right-click the map = drop a new tribe right there (same as + Add tribe, placed at the cursor).
cv.addEventListener("contextmenu", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const [mx,my] = s2m(e.clientX-r.left, e.clientY-r.top);
  addTribeAt(mx, my);
  toast("Tribe added — edit name/role on the right");
});
document.getElementById("spawnBtn").onclick = () => { sel=-2; renderSide(); draw(); toast("Drag the ★ to move player spawn"); };
document.getElementById("labelsChk").onchange = draw;
document.getElementById("ringsChk").onchange = draw;

function serialize() {
  validateRoster(roster);
  const out = {
    _comment: roster._comment || `${episodeId} campaign roster — edited via tools/campaign-editor.`,
    map: roster.map || "eastanglia",
    player_spawn: roster.player_spawn.map(n=>Math.round(n)),
    factions: roster.factions.map(f=>({ name:f.name, x:Math.round(f.x), y:Math.round(f.y), role:f.role, iq:f.iq??100, ...(f.support_interval_seconds!=null?{support_interval_seconds:Number(f.support_interval_seconds)}:{}), ...(f.alliance_group?{alliance_group:f.alliance_group}:{}), ...(f.civ?{civ:f.civ}:{}), ...(f.leader?{leader:f.leader}:{}), ...(f.avatar?{avatar:f.avatar}:{}) })),
  };
  return JSON.stringify(out, null, 2) + "\n";
}
async function exportRoster(){
  if(rosterSaving) return false;
  rosterSaving = true;
  try {
    const file = `${episodeId}.json`;
    const savedDraft = serialize();
    const res = await fetch(`/__save?file=${encodeURIComponent(file)}`, {method:"POST", headers:{"Content-Type":"application/json", "If-Match":rosterEtag||""}, body:savedDraft});
    if(!res.ok){ if(res.status===409){ rosterExternal=true; document.getElementById("rosterStatus").textContent="Changed elsewhere · draft preserved"; } throw new Error(await res.text()); }
    rosterEtag = res.headers.get("ETag");
    rosterDirty = serialize() !== savedDraft; rosterExternal = false;
    document.getElementById("rosterStatus").textContent = rosterDirty ? "Newer edits not saved" : "Saved";
    document.getElementById("rosterStatus").className = rosterDirty ? "hint warn" : "hint";
    toast(rosterDirty ? "Saved; newer map edits remain" : `Exported → assets/campaign/${file}`);
    return !rosterDirty;
  } catch(e){ toast("Export failed (run via `sow m`): "+e.message); }
  finally { rosterSaving = false; }
  return false;
}
document.getElementById("exportBtn").onclick = exportRoster;
document.getElementById("logicLink").addEventListener("click", async e => {
  if(!rosterDirty) return;
  e.preventDefault();
  const href = e.currentTarget.href;
  if(await exportRoster() && !rosterDirty) location.href = href;
});
window.addEventListener("beforeunload", e => {
  if(!rosterDirty) return;
  e.preventDefault();
  e.returnValue = "";
});
document.getElementById("reloadBtn").onclick = async () => {
  if(rosterDirty && !confirm("Discard unsaved map changes and reload from disk?")) return;
  const previousMap = roster.map;
  await loadRoster();
  if(previousMap !== roster.map) await loadMap();
};
document.getElementById("fileIn").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const fr = new FileReader(); fr.onload = () => { try { roster = normalize(JSON.parse(fr.result)); rosterExternal=false; markRosterDirty(); sel=-1; renderAll(); toast("Loaded "+file.name); } catch(err){ toast("Bad JSON: "+err.message); } }; fr.readAsText(file);
};

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.opacity=1; clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity=0,2200); }

function normalize(j){
  const result = { _comment:j._comment, map:j.map||"eastanglia", player_spawn:j.player_spawn||[696,45], factions:(j.factions||[]).map(f=>({name:f.name,x:f.x|0,y:f.y|0,role:f.role||"neutral",iq:(f.iq==null?100:f.iq|0),...(f.support_interval_seconds!=null?{support_interval_seconds:Number(f.support_interval_seconds)}:{}),...(f.alliance_group?{alliance_group:f.alliance_group}:{}),...(f.civ?{civ:f.civ}:{}),...(f.leader?{leader:f.leader}:{}),...(f.avatar?{avatar:f.avatar}:{})})) };
  validateRoster(result);
  return result;
}
function validateRoster(value){
  if(!value || typeof value.map!=="string" || !Array.isArray(value.player_spawn) || value.player_spawn.length!==2 || !value.player_spawn.every(Number.isFinite)) throw new Error("invalid roster");
  const names = new Set();
  if(!Array.isArray(value.factions) || !value.factions.length) throw new Error("roster needs factions");
  for(const f of value.factions){
    if(f.support_interval_seconds!=null && f.role!=="kin" && !f.alliance_group) throw new Error("ally support needs a Kin faction or alliance group");
    if(!f.name || names.has(f.name) || !Object.prototype.hasOwnProperty.call(ROLES,f.role) || !Number.isFinite(f.x) || !Number.isFinite(f.y) || (f.support_interval_seconds!=null && (!Number.isInteger(f.support_interval_seconds) || f.support_interval_seconds<5 || f.support_interval_seconds>600)) || (f.alliance_group!=null && !/^[a-z][a-z0-9_]{0,63}$/.test(f.alliance_group)) || (f.avatar && (!/^[a-z][a-z0-9_]*$/.test(f.avatar) || !avatarCatalog.includes(f.avatar)))) throw new Error("invalid faction, duplicate name, or missing portrait asset");
    names.add(f.name);
  }
}

// ---- boot ----
function resize(){ cv.width = cv.parentElement.clientWidth; cv.height = cv.parentElement.clientHeight; minScale = computeMinScale(); maxScale = Math.max(12, minScale*10); scale = Math.max(scale, minScale); clampView(); draw(); }
window.addEventListener("resize", resize);
document.getElementById("zin").onclick  = () => zoomAt(cv.width/2, cv.height/2, 1.3);
document.getElementById("zout").onclick = () => zoomAt(cv.width/2, cv.height/2, 1/1.3);
document.getElementById("zfit").onclick = () => { fitView(); draw(); };

async function loadMap(){
  const mapId = roster.map || "eastanglia";
  const res = await fetch(`/assets/maps/${encodeURIComponent(mapId)}/map.bin`);
  if(!res.ok) throw new Error(mapId+" map "+res.status);
  const buf = await res.arrayBuffer();
  const m = parseMap(buf);
  MAPW = m.w; MAPH = m.h; terrain = m.terrain; buildMapImage();
}
async function loadRoster(){
  try {
    const res = await fetch(`/assets/campaign/${encodeURIComponent(episodeId)}.json`, {cache:"no-store"});
    if(res.ok){ rosterEtag=res.headers.get("ETag"); roster = normalize(await res.json()); rosterDirty=false; rosterExternal=false; document.getElementById("rosterStatus").textContent="Saved"; document.getElementById("rosterStatus").className="hint"; }
  } catch(e){ toast("Roster load failed: "+e.message); }
  sel=-1; renderAll();
}

async function watchRosterFile(){
  if(document.visibilityState!=="visible" || !rosterEtag) return;
  try {
    const res = await fetch(`/assets/campaign/${encodeURIComponent(episodeId)}.json`, {method:"HEAD",cache:"no-store"});
    if(!res.ok || res.headers.get("ETag")===rosterEtag) return;
    if(rosterDirty){
      if(!rosterExternal){ rosterExternal=true; document.getElementById("rosterStatus").textContent="Changed elsewhere · draft preserved"; document.getElementById("rosterStatus").className="hint warn"; toast("Map file changed elsewhere. Your draft is safe; reload to see it."); }
      return;
    }
    const previousMap=roster.map;
    await loadRoster();
    if(previousMap!==roster.map) await loadMap();
    toast("Map updated from disk");
  } catch(_){ /* Keep the current draft if the editor server briefly restarts. */ }
}
document.addEventListener("visibilitychange", watchRosterFile);
window.setInterval(watchRosterFile, 1500);

async function fillEpisodePicker(){
  const select = document.getElementById("episodeSelect");
  try {
    const res = await fetch("/__episodes", {cache:"no-store"});
    if(!res.ok) throw new Error("episode list unavailable");
    const episodes = await res.json();
    if(!Array.isArray(episodes) || !episodes.length || episodes.some(id=>typeof id!=="string" || !/^[a-z][a-z0-9_]{0,63}$/.test(id))) throw new Error("invalid episode list");
    if(!episodes.includes(episodeId)) episodes.unshift(episodeId);
    select.replaceChildren(...episodes.map(id=>{
      const option=document.createElement("option");
      option.value=id;
      option.textContent=id.replace(/_/g," ").replace(/\b\w/g,letter=>letter.toUpperCase());
      return option;
    }));
    select.value=episodeId;
  } catch(e) {
    const option=document.createElement("option"); option.value=episodeId; option.textContent=episodeId;
    select.replaceChildren(option); toast("Campaign list unavailable: "+e.message);
  }
  select.addEventListener("change",()=>{
    if(select.value===episodeId) return;
    if(rosterDirty && !confirm("Discard unsaved map changes and switch episode?")){ select.value=episodeId; return; }
    location.href="index.html?episode="+encodeURIComponent(select.value);
  });
}

(async function(){
  resize();
  await fillEpisodePicker();
  try {
    const response = await fetch("/__avatars", {cache:"no-store"});
    if(!response.ok) throw new Error("avatar list unavailable");
    avatarCatalog = await response.json();
    if(!Array.isArray(avatarCatalog) || avatarCatalog.some(id=>typeof id!=="string" || !/^[a-z][a-z0-9_]*$/.test(id))) throw new Error("invalid avatar list");
  } catch(e) { toast("Portrait list unavailable: "+e.message); }
  await loadRoster();
  try { await loadMap(); } catch(e){ hud.textContent="map load failed: "+e.message; hud.className="warn"; }
  fitView(); draw();
})();
</script>
