# Canonical distribution image recipes. Source files stay under assets/; sow-dist
# writes derivatives to dist/.sow-state and applies the same profiles to packages.
version = 1
webp_method = 4
svgo_version = "4.1.0"
svg_max_bytes = 1048576
svg_recipe_version = 1

[profiles.ability_icon]
format = "webp"
max_width = 256
max_height = 256
quality = 75
alpha = "preserve"
resample = "lanczos"
lossless = false
max_bytes = 65536
recipe_version = 1

