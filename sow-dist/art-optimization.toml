# Canonical distribution image recipes. Source files stay under assets/; sow-dist
# writes derivatives to dist/.sow-state and applies the same profiles to packages.
version = 1
webp_method = 6
webp_alpha_quality = 80
svgo_version = "4.1.0"
svg_max_bytes = 1048576
svg_recipe_version = 1

[profiles.ability_icon]
format = "webp"
max_width = 96
max_height = 96
quality = 62
alpha = "strip"
resample = "mitchell"
lossless = false
max_bytes = 32768
recipe_version = 3

[profiles.avatar_portrait_192]
format = "webp"
max_width = 128
max_height = 128
quality = 62
alpha = "preserve"
resample = "mitchell"
lossless = false
max_bytes = 65536
recipe_version = 2

[profiles.avatar_portrait_256]
format = "webp"
