server {
    listen 80;
    server_name shadowsofwar.io www.shadowsofwar.io ws.shadowsofwar.io 74.208.246.177;

    location = /internal/stats {
        return 404;
    }

    location ^~ /internal/ {
        allow __SOW_RELAY_DB_SOURCE_IP__;
        deny all;
        client_max_body_size 32m;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585;
        include snippets/proxy-headers.conf;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.shadowsofwar.io;

    ssl_certificate     /usr/local/etc/letsencrypt/live/shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/shadowsofwar.io/privkey.pem;
    include snippets/ssl-params.conf;

    return 301 https://shadowsofwar.io$request_uri;
}

# Shell media (?v=content-hash) is immutable forever; anything without a
# version stays short-lived so marketing art refreshes without a purge.
map $arg_v $sow_asset_cache {
    default "public, max-age=31536000, immutable";
    ""      "public, max-age=600";
}

# The pipeline ships .br siblings of the engine and glue. Serve them at the
# SAME url only for clients that accept brotli: 4.1 MB instead of the edge's
# own 4.75 MB, and raw bytes (never empty headers) for everyone else.
map $http_accept_encoding $sow_br_ext {
    default "";
    "~*br"  ".br";
}

map $sow_br_ext $sow_br_encoding {
    default "";
    ".br"   "br";
}

server {
    listen 443 ssl;
    server_name shadowsofwar.io ws.shadowsofwar.io;

    ssl_certificate     /usr/local/etc/letsencrypt/live/shadowsofwar.io/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/shadowsofwar.io/privkey.pem;
    include snippets/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /srv/sow/current/web;
    index index.html;

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/match/ {
        return 404;
    }

    location = /internal/stats {
        return 404;
    }

    # RevenueCat is the only external caller allowed on this exact endpoint;
    # the application validates the Authorization header.
    location = /internal/revenuecat/webhook {
        client_max_body_size 1m;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585;
        include snippets/proxy-headers.conf;
    }

    # External identity verification belongs to sow-server. The database
    # receives only the already-verified identity over its internal route.
    location = /api/profile {
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25566/profile;
        include snippets/proxy-headers.conf;
    }

    location = /api/auth/playgames/exchange {
        client_max_body_size 16k;
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25566/auth/playgames/exchange;
        include snippets/proxy-headers.conf;
    }

    location = /api/auth/playgames/consume {
        client_max_body_size 16k;
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25566/auth/playgames/consume;
        include snippets/proxy-headers.conf;
    }

    location = /api/auth/playgames/poll {
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25566/auth/playgames/poll;
        include snippets/proxy-headers.conf;
    }

    location ^~ /internal/ {
        allow __SOW_RELAY_DB_SOURCE_IP__;
        deny all;
        client_max_body_size 32m;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585;
        include snippets/proxy-headers.conf;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://__SOW_DB_LISTEN_HOST__:25585/;
        include snippets/proxy-headers.conf;
    }

    location /ws/ {
        limit_conn sow_ws_connections 4096;
        limit_req zone=sow_ws_handshakes burst=512 nodelay;
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25564;
        include snippets/proxy-websocket.conf;
    }

    location /maps/ {
        # No add_header here: the backend (25566) already answers /maps/ with
        # Access-Control-Allow-Origin; a second header would duplicate it
        # (`, *`), which browsers reject.
        proxy_pass http://__SOW_SERVER_LISTEN_HOST__:25566/maps/;
        include snippets/proxy-headers.conf;
    }

    # Cross-origin media for portal iframes (CrazyGames): the client fetches
    # these with crossorigin="anonymous", so they must answer with ACAO.
    location ^~ /assets/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control $sow_asset_cache always;
        include snippets/security-headers.conf;
        try_files $uri =404;

        # Campaign cinematic renditions and posters are content-hashed
        # (intro.720p.<sha8>.webm/.mp4/.poster.webp): a new encode always
        # changes the URL, so old copies can live in the browser forever
        # with zero staleness.
        location ~* ^/assets/campaign/.+\.(webm|mp4|poster\.webp)$ {
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include snippets/security-headers.conf;
            try_files $uri =404;
        }
    }

    # Engine and glue: hashed names + content-encoded precompressed bodies.
    location ~ "^/sow_client_[0-9a-f]{10}_bg\.wasm$" {
        types { }
        default_type application/wasm;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Encoding $sow_br_encoding always;
        add_header Vary "Accept-Encoding" always;
        include snippets/security-headers.conf;
        try_files $uri$sow_br_ext $uri =404;
    }

    location ~ "^/sow_client_[0-9a-f]{10}\.js$" {
        types { }
        default_type application/javascript;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Encoding $sow_br_encoding always;
        add_header Vary "Accept-Encoding" always;
        include snippets/security-headers.conf;
        try_files $uri$sow_br_ext $uri =404;
    }

    location ^~ /fonts/ {
        add_header Cache-Control $sow_asset_cache always;
        add_header Access-Control-Allow-Origin *;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Locale catalogs: URL carries ?v=<catalog version>, so a content change
    # is instantly visible and an unchanged deploy costs zero bytes.
    location ^~ /locales/ {
        add_header Cache-Control $sow_asset_cache always;
        add_header Access-Control-Allow-Origin *;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Game shell: everything under /play/ is an SPA served from the webroot.
    location ^~ /play/ {
        # Nested: a ^~ prefix stops the regex phase, so the hashed menu
        # bundle (with its .br sibling) must be handled inside this block.
        location ~ \.js$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Encoding $sow_br_encoding always;
            add_header Vary "Accept-Encoding" always;
            include snippets/security-headers.conf;
            try_files $uri$sow_br_ext $uri =404;
        }
        try_files $uri $uri/ /play/index.html;
    }

    location ~ ^/how-to-play/?$ {
        return 301 https://shadowsofwar.io/;
    }

    # OAuth providers return to this exact URI; serve the single callback page
    # without forcing a trailing-slash redirect.
    location = /auth/callback {
        try_files /auth/callback/index.html =404;
    }

    # Website + static CDN content; no SPA fallback, missing files are 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
