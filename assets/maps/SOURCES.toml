# Published map library served at /maps/; `[recipes.<map>]` is the release allowlist.
# Generated map folders are gitignored except the world seed and the authored Petén campaign maps.
# Map Generator outputs share this folder for local editing and are excluded from
# release packages unless registered here; upload them through Campaign Studio.
# Each folder carries info.toml with its weighted-rotation frequency
# (OpenFront `multiplayer_frequency`; 0 = out of rotation).
# The `[recipes.<map>]` tables below keep provenance and artifact hashes for the
# generated map library even though the binary map folders remain ignored.

# Regional Big recipes use sow-tools import-map-source --size big
# --min-lake-tiles 13 --min-island-pixels 30 --min-island-tiles 9.
# Keep the published display name, spawn ordering and xx flags. Use the pinned
# upstream info.json coordinates, or source_spawns where supplied, then apply
# spawn_source_overrides. Paint source_land_rects on a working copy of the
# pinned image before importing. Rectangles are [x, y, width, height] in source pixels.
# Keep the existing rotation weights and official thumbnail frames.

# This license block applies only to the OpenFront-derived image recipes in
# this file. OSM-generated maps use their own source and license declaration.
[map_license]
name = "CC-BY-SA-4.0"
url = "https://creativecommons.org/licenses/by-sa/4.0/"
license_doc = "assets/maps/NOTICE"
source = "https://github.com/openfrontio/OpenFrontIO/tree/f51f165b947a92cc683ade3a72c3800300e86e61/map-generator/assets"
source_commit = "f51f165b947a92cc683ade3a72c3800300e86e61"
attribution = "OpenFront Inc. and Contributors"
applies_to = "OpenFront-derived recipes and their map.bin, map.bin.br, and thumbnail.webp artifacts"
changes = "Cropped, corrected, classified, downscaled, filtered, packed, and rendered by Shadows of War."

