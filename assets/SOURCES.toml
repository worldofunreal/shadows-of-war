# Asset provenance and ownership for Shadows of War.
#
# Original game, brand, and loader art is edited in assets/art; landing stills,
# captures, and video sources live in assets/site/media. See assets/art/README.md.
# assets/generated is written by sow-tools; sow-dist creates distribution copies.

[avatars]
path = "assets/art/avatars/"
source = "ai_generated"
tool = "Gemini / Meta AI / Midjourney / OpenAI ImageGen (mixed, historical)"
license = "CC-BY-SA-4.0"
license_doc = "docs/legal/LICENSE-ASSETS"
placeholder_source = "Programmatic labeled placeholders created in-repo"
placeholder_license = "AGPL-3.0-or-later"
placeholder_files = ["heroes/sitting_bull.webp", "heroes/matoaka.webp", "tribes/lakota.webp", "heroes/windradyne.webp", "heroes/yagan_noongar.webp", "heroes/peter_the_great.webp", "heroes/empress_suiko.webp", "heroes/nebuchadnezzar_ii.webp", "heroes/king_david.webp", "heroes/sarraounia_mangou.webp", "heroes/muhammad_of_ghor.webp", "heroes/puyi.webp", "heroes/pertinax.webp", "heroes/ewuare.webp", "heroes/veleda.webp"]
notes = "One avatar source per playable hero: heroes/<id>.webp is a 2x2 Happy, Calm, Fear, Angry sheet; Calm also supplies its static portrait. nations/ (nation bots), tribes/ (tribe bots and tutorial tribes), and campaign/ (tutorial figures that are not tribes) keep one portrait each. default.webp is the face of a player without a portrait and of any character whose own portrait is still missing. random.webp at this folder root is original dice-and-map art for the random leader option (AGPL-3.0-or-later). The listed labeled placeholders need owner replacement. Burebista and Bolesław II use provisional sheets cropped from the owner-supplied Downloads art pending final portraits."

[heroes]
path = "assets/art/heroes/"
source = "ai_generated_and_user_supplied"
tool = "Gemini / Meta AI / Midjourney / OpenAI ImageGen (mixed, historical)"
license = "CC-BY-SA-4.0 for AI-generated scenes; project-owner supplied scenes follow owner terms"
license_doc = "docs/legal/LICENSE-ASSETS"
notes = "Optional web menu and loader scenes: <id>_desktop and <id>_mobile are published when present. A missing variant has no image fallback in its consumer. Burebista and Bolesław II ship provisional scenes from the owner-supplied Downloads art pending final scenes. Windradyne, Yagan-Noongar, Peter the Great, and Empress Suiko desktop/mobile scenes are project-owner supplied JPEG source masters."
restored = ["alexander", "caesar", "cleopatra", "genghis_khan", "ragnar", "sun_tzu"]
themed_placeholder = ["boudica", "leonidas", "napoleon", "richard_the_lionheart", "vercingetorix", "lady_six_sky", "sitting_bull", "matoaka"]
placeholder_source = "Programmatic labeled placeholders created in-repo"
placeholder_license = "AGPL-3.0-or-later"
placeholder_files = ["sitting_bull_desktop.webp", "sitting_bull_mobile.webp", "matoaka_desktop.webp", "matoaka_mobile.webp"]

[buildings]
path = "assets/art/buildings/"
source = "original_and_twemoji_placeholder"
license = "farm-1..3: AGPL-3.0-or-later; other slots: CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art"
notes = "<kind>-<level>.png for city, factory, port, tower and farm, levels 1-4. Packed into assets/generated/buildings-atlas.* for the map and the HUD."

[units]
path = "assets/art/units/"
source = "OpenFront and Contributors (ships); Twemoji 14.0.2 (projectile placeholders)"
license = "transport-ship, trade-ship, warship: CC-BY-SA-4.0; atom-bomb, sam-missile: CC-BY-4.0"
files = ["transport-ship.png", "trade-ship.png", "warship.png", "atom-bomb.png", "sam-missile.png"]
license_doc = "docs/legal/LICENSE-ASSETS"
notes = "The three OpenFront boat sprites are packed into assets/generated/units-atlas.webp and tinted by fleet owner at runtime. Projectile art remains provisional Twemoji."

[icons]
path = "assets/art/icons/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"
notes = "All iconography: currency (gold, gem, crown, laurel), troops (HUD, menu nav and map), tutorial hand, surrender, mobile navigation, and nameplate/map badges packed into assets/generated/badges-atlas.* (request/allied/traitor: AGPL-3.0-or-later; rank, you, disconnected, upgrade-sparkle, wilderness, death, radiation, construction, hammer: CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art). Keep ability masters in high resolution at abilities/<hero-id>.webp; sow-dist publishes 256 px WebP derivatives and builds CrazyGames' atlas from optimized output. laurel is a generated placeholder pending final art. Burebista and Bolesław II ability icons are provisional crops pending final icons. Abd al-Rahman al-Ghafiqi's icon is a provisional crop of his own Calm avatar sheet pending final ability art. Windradyne, Yagan-Noongar, Peter the Great, Empress Suiko, Nebuchadnezzar II, King David, Sarraounia Mangou, Muhammad of Ghor, Puyi, Pertinax, Ewuare, and Veleda ability icons are temporary labeled placeholders pending owner art."
placeholder_source = "Programmatic labeled placeholders created in-repo"
placeholder_license = "AGPL-3.0-or-later"
placeholder_files = ["abilities/sitting_bull.webp", "abilities/matoaka.webp", "abilities/windradyne.webp", "abilities/yagan_noongar.webp", "abilities/peter_the_great.webp", "abilities/empress_suiko.webp", "abilities/nebuchadnezzar_ii.webp", "abilities/king_david.webp", "abilities/sarraounia_mangou.webp", "abilities/muhammad_of_ghor.webp", "abilities/puyi.webp", "abilities/pertinax.webp", "abilities/ewuare.webp", "abilities/veleda.webp"]

[store]
path = "assets/art/store/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"
files = ["sow_gems_500.webp", "sow_gems_1200.webp", "sow_gems_2600.webp"]

[brand]
path = "assets/art/brand/"
source = "original"
license = "AGPL-3.0-or-later"
files = ["sow.svg", "tower.svg", "sow-long.svg", "app-icon.png"]
notes = "Replace app-icon.png as the high-resolution master. sow-dist generates the PWA and Android density variants; the old PNG copies in assets/site/icons and Android mipmap folders are retired."

[loader]
path = "assets/art/loader/"
source = "ai_generated_and_placeholder"
license = "Review per original tool terms; placeholder art is AGPL-3.0-or-later"
files = ["sow-splash-desktop.webp", "sow-splash-mobile.webp", "loader_empty.webp", "loader_full.webp"]
notes = "The desktop and mobile splash masters are shared by the landing opening and loader, then optimized once into the web asset tree. The loader bars remain separate UI assets. The WASM client does not fetch or embed these files."

[skins]
path = "assets/art/skins/"
source = "original"
license = "AGPL-3.0-or-later"

[music]
path = "assets/art/music/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"

[fonts]
path = "assets/fonts/"
source = "google_fonts"
license = "SIL Open Font License 1.1"
license_doc = "sow-web/site/fonts/OFL.txt"
files = ["WorkSans-Black.ttf", "WorkSans-Regular.ttf"]
notes = "Sources for the msdf nameplate atlas (assets/generated/msdf-atlas.*)."

[site_fonts]
path = "sow-web/site/fonts/"
source = "google_fonts"
license = "SIL Open Font License 1.1"
license_doc = "sow-web/site/fonts/OFL.txt"
notes = "Web fonts served by the site and shell; the Noto faces are also embedded by the renderer."

[generated]
path = "assets/generated/"
source = "generated"
notes = "Written only by sow-tools: buildings-atlas, badges-atlas and units-atlas (pack-building-atlas, on every ./sow p) and msdf-atlas (generate_font_atlas)."

[site_media]
path = "assets/site/media/"
source = "original_and_ai_generated"
notes = "Independent landing feature/closing scenes, Support-page character art, original gameplay captures and optional hero-loop/gameplay videos, plus store badges. The opening splash masters live in assets/art/loader. Exact landing prompts and references live in assets/site/landing-art.json. sow-dist publishes the registered media; these files are not loaded by the game."

[maps]
path = "assets/maps/"
source = "image_and_osm"
notes = "Single canonical map library for the online service and the WASM world-map embed. OpenFront-derived image recipes and their license are documented in assets/maps/SOURCES.toml; OSM maps retain their own source terms."

[campaign]
path = "assets/campaign/"
source = "original"
notes = "Compile-time campaign data, triggers and cinematic media."
