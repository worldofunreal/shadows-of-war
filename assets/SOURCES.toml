# Asset provenance and ownership for Shadows of War.
#
# assets/art is the only place art is added or replaced (see assets/art/README.md).
# assets/generated is written by sow-tools. sow-dist publishes both under the
# runtime URLs (/assets/shell/..., /assets/gameplay/...); there is no other copy.

[leaders]
path = "assets/art/leaders/"
source = "ai_generated"
tool = "Gemini / Meta AI / Midjourney / OpenAI ImageGen (mixed, historical)"
license = "CC-BY-SA-4.0"
license_doc = "docs/legal/LICENSE-ASSETS"
notes = "One folder per leader or campaign figure: portrait (HUD, nameplates, profile), expressions (playable heroes on the map), scene-desktop and scene-mobile (web menu and loader only). _fallback is the unknown-player portrait. random is original dice-and-map art for the random leader option (AGPL-3.0-or-later)."
restored = ["alexander", "caesar", "cleopatra", "genghis_khan", "ragnar", "sun_tzu"]
themed_placeholder = ["boudica", "leonidas", "napoleon", "richard_the_lionheart", "vercingetorix", "lady_six_sky"]

[buildings]
path = "assets/art/buildings/"
source = "original_and_twemoji_placeholder"
license = "farm-1..3: AGPL-3.0-or-later; other slots: CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art"
notes = "<kind>-<level>.png for city, factory, port, bunker and farm, levels 1-4. Packed into assets/generated/buildings-atlas.* for the map and the HUD."

[units]
path = "assets/art/units/"
source = "twemoji_placeholder"
license = "CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art"
notes = "Ships and missiles moving on the map, packed into assets/generated/units-atlas.webp (embedded in the game)."

[icons]
path = "assets/art/icons/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"
notes = "All iconography: currency (gold, gem, crown, laurel), troops (HUD, menu nav and map), tutorial hand, surrender, mobile navigation, and the nameplate/map badges packed into assets/generated/badges-atlas.* (request/allied/traitor: AGPL-3.0-or-later; rank, you, disconnected, upgrade-sparkle, wilderness, death, radiation, construction, hammer: CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art). laurel is a generated placeholder pending final art."

[store]
path = "assets/art/store/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"
files = ["sow_gems_500.webp", "sow_gems_1200.webp", "sow_gems_2600.webp"]

[brand]
path = "assets/art/brand/"
source = "original"
license = "AGPL-3.0-or-later"
files = ["sow.svg", "tower.svg", "sow-long.svg", "app-icon.png"]

[loader]
path = "assets/art/loader/"
source = "ai_generated_and_placeholder"
license = "Review per original tool terms; placeholder art is AGPL-3.0-or-later"
files = ["sow-splash-desktop.webp", "sow-splash-mobile.webp", "loader_empty.webp", "loader_full.webp"]
notes = "Web shell only. The WASM client does not fetch or embed these files."

[skins]
path = "assets/art/skins/"
source = "original"
license = "AGPL-3.0-or-later"

[music]
path = "assets/art/music/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"

[fonts]
path = "assets/fonts/"
source = "google_fonts"
license = "SIL Open Font License 1.1"
license_doc = "sow-web/site/fonts/OFL.txt"
files = ["WorkSans-Black.ttf", "WorkSans-Regular.ttf"]
notes = "Sources for the msdf nameplate atlas (assets/generated/msdf-atlas.*)."

[site_fonts]
path = "sow-web/site/fonts/"
source = "google_fonts"
license = "SIL Open Font License 1.1"
license_doc = "sow-web/site/fonts/OFL.txt"
notes = "Web fonts served by the site and shell; the Noto faces are also embedded by the renderer."

[generated]
path = "assets/generated/"
source = "generated"
notes = "Written only by sow-tools: buildings-atlas, badges-atlas, units-atlas and bot-portraits (pack-building-atlas, on every ./sow p) and msdf-atlas (generate_font_atlas)."

[site_media]
path = "assets/site/media/"
source = "original_and_ai_generated"
notes = "Marketing website and README media. Not loaded by the game."

[site_icons]
path = "assets/site/icons/"
source = "original"
license = "AGPL-3.0-or-later"
files = ["icon-192.png", "icon-512.png", "icon-512-maskable.png"]

[maps]
path = "assets/maps/"
source = "image_and_osm"
notes = "Single canonical map library for the online service and the WASM world-map embed. OpenFront-derived image recipes and their license are documented in assets/maps/SOURCES.toml; OSM maps retain their own source terms."

[campaign]
path = "assets/campaign/"
source = "original"
notes = "Compile-time campaign data, triggers and cinematic media."
