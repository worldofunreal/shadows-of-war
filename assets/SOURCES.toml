[buildings]
path = "assets/art/buildings/"
source = "original_and_twemoji_placeholder"
license = "farm-1..3: AGPL-3.0-or-later; other slots: CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art"
notes = "<kind>-<level>.webp for city, factory, port, tower and farm, levels 1-4. Lossless source images are packed into assets/generated/buildings-atlas.* for the map and the HUD."

[units]
path = "assets/art/units/"
source = "OpenFront and Contributors (ships); Twemoji 14.0.2 (projectile placeholders)"
license = "transport-ship, trade-ship, warship: CC-BY-SA-4.0; atom-bomb, sam-missile: CC-BY-4.0"
files = ["transport-ship.webp", "trade-ship.webp", "warship.webp", "atom-bomb.webp", "sam-missile.webp"]
license_doc = "docs/legal/LICENSE-ASSETS"
notes = "The three OpenFront boat sprites are packed into assets/generated/units-atlas.webp and tinted by fleet owner at runtime. Projectile art remains provisional Twemoji."

[icons]
path = "assets/art/icons/"
source = "user_supplied"
license = "Project-owner supplied; cleared for distribution"
notes = "All iconography: currency (gold, gem, crown, laurel), troops (HUD, menu nav and map), tutorial hand, surrender, mobile navigation, and nameplate/map badges packed into assets/generated/badges-atlas.* (request/allied/traitor: AGPL-3.0-or-later; rank, you, disconnected, upgrade-sparkle, wilderness, death, radiation, construction, hammer: CC-BY-4.0 Twemoji 14.0.2 placeholders pending final art). Keep ability masters in high resolution at abilities/<hero-id>.webp; sow-dist publishes 256 px WebP derivatives and builds CrazyGames' atlas from optimized output. laurel is a generated placeholder pending final art. Burebista and Bolesław II ability icons are provisional crops pending final icons. Abd al-Rahman al-Ghafiqi's icon is a provisional crop of his own Calm avatar sheet pending final ability art. Windradyne, Yagan-Noongar, Peter the Great, Empress Suiko, Nebuchadnezzar II, King David, Sarraounia Mangou, Muhammad of Ghor, Puyi, Pertinax, Ewuare, Veleda and Amir Timur ability icons are temporary labeled placeholders pending owner art. Amir Timur's icon is the Calm crop of his provisional avatar sheet, and that sheet reuses the existing Timur nation portrait pending final art."
